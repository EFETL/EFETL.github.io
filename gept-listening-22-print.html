<div class="bar">

<script>
/* 圖形素材（第22回 節慶與習俗） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/22/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/22/p3_${n}.jpg?v=r22qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const GIFT=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q1.jpg" alt="question 1 picture">`;
const CAKE=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q2.jpg" alt="question 2 picture">`;
const CHURCH=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q3.jpg" alt="question 3 picture">`;
const DRAGON=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q4.jpg" alt="question 4 picture">`;
const ANGEL=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:GIFT,o:["She is holding a present in red paper with a colorful bow.","She is holding a present in colorful paper with a red bow.","She is opening a present in colorful paper with a red bow."],a:1,sen:"For question one, look at the picture. What is the girl doing?",szh:"第一題，請看圖片。這個女孩在做什麼？",en:"She is holding a present in colorful paper with a red bow.",zh:"女孩笑著捧著一個禮物(present)，包裝紙(paper)是彩色圓點，上面綁著紅色蝴蝶結，正確。顏色說反了，紙是彩色、蝴蝶結是紅色；她只是拿著，還沒有打開。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">GIFT SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Card</td><td style="text-align:right;font-weight:700">$50</td></tr><tr><td style="padding:4px 30px 4px 0">Candle</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Scarf</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Sweater</td><td style="text-align:right;font-weight:700">$250</td></tr></table></div>`,o:["He will have two hundred fifty dollars left.","He will have one hundred dollars left.","He will have three hundred fifty dollars left."],a:1,sen:"For question two, look at the picture. Ben has five hundred dollars. He buys a scarf and a sweater. How much will he have left?",szh:"第二題，請看圖片。班有五百元。他買了一條圍巾和一件毛衣。他還剩多少錢？",en:"He will have one hundred dollars left.",zh:"價目表上圍巾(scarf)150元、毛衣(sweater)250元，一共400元，500減400剩100元。剩三百五十元是只買了圍巾、忘記毛衣；剩兩百五十元是只買了毛衣、忘記圍巾。選 B"},
{n:3,p:0,fig:CHURCH,o:["The woman in front and the old man are both praying.","The woman in front is praying, and the old man is reading a book.","The woman in front is praying, and the old man is standing."],a:0,sen:"For question three, look at the picture. Which is true about the people in the church?",szh:"第三題，請看圖片。關於教堂(church)裡的人，何者正確？",en:"The woman in front and the old man are both praying.",zh:"前排的女士和右邊的老先生都坐著雙手合十、閉眼禱告(pray)，正確。老先生沒有在看書(book)；他是坐在長椅上，不是站著。選 A"},
{n:4,p:0,fig:DRAGON,o:["Some men are riding on a big dragon.","Some kids are holding up a dragon with sticks.","Some men are holding up a dragon with sticks."],a:2,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"Some men are holding up a dragon with sticks.",zh:"幾位穿紅黃色衣服的男士用長棍把龍(dragon)舉起來舞動，正確。舉龍的是大人，小孩(kid)只在旁邊看；他們是用棍子撐著龍，不是騎在龍上。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Holiday Shop</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">80</text><rect x="96" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="95" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="112" width="44" height="38" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="107" font-size="14" font-weight="700" text-anchor="middle">30</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Cards</text><text x="118" y="167" text-anchor="middle">Angels</text><text x="184" y="167" text-anchor="middle">Candles</text></g></svg>`,o:["They sold thirty.","They sold seventy.","They sold one hundred ten."],a:1,sen:"For question five, look at the picture. The shop sold some angels and some candles for the holiday. How many did it sell in all?",szh:"第五題，請看圖片。這家店在假日(holiday)賣了一些天使(angel)擺飾和蠟燭。一共賣了多少？",en:"They sold seventy.",zh:"圖中天使(angel)40個、蠟燭30支，加起來70個。30只有蠟燭；110是把最高的卡片80和蠟燭30加起來，看錯項目了。選 B"},
{n:6,p:1,o:["Congratulations! Let's celebrate tonight.","Maybe you'll pass it next time.","No, I don't like math very much."],a:0,sen:"I passed my math test! I got ninety-five.",szh:"我數學(math)考試及格了！考了九十五分。",en:"Congratulations! Let's celebrate tonight.",zh:"對方說數學(math)考了九十五分，回「恭喜(congratulation)！今晚來慶祝(celebrate)吧」最自然。「也許(maybe)下次會及格」好像對方沒考過，意思相反；「不(no)，我不太喜歡數學」只是重複 math。選 A"},
{n:7,p:1,o:["Yes, I'll go to the festival.","It ends at five o'clock.","Very! We sold everything in two hours."],a:2,sen:"Was the school festival successful?",szh:"學校的園遊會(festival)成功(successful)嗎？",en:"Very! We sold everything in two hours.",zh:"問園遊會(festival)成不成功(successful)，答「非常成功！兩小時就全部賣光」正確。「五點結束(end)」答的是時間；「是的，我會去」時態不對，活動已經辦完了。選 C"},
{n:8,p:1,o:["Since last month, I think.","Her kids just moved to another city.","She's very nice-looking."],a:1,sen:"Why does Mrs. Chen seem so lonely these days?",szh:"陳太太(Mrs.)最近為什麼看起來(seem)那麼寂寞(lonely)？",en:"Her kids just moved to another city.",zh:"問「為什麼」寂寞(lonely)，答「她的孩子(kid)剛(just)搬到別的城市」說出原因，正確。「我想是從上個月開始」答的是時間；「她很好看(nice-looking)」答的是外表。選 B"},
{n:9,p:1,o:["They're sweeter than pears.","I bought them for breakfast.","From a fruit vendor at the night market."],a:2,sen:"Where did you buy these peaches?",szh:"這些桃子(peach)你在哪裡買的？",en:"From a fruit vendor at the night market.",zh:"問在「哪裡」買桃子(peach)，答「夜市的水果攤販(vendor)」正確。「比梨子(pear)甜」答的是味道；「買來當早餐(breakfast)」答的是目的。選 C"},
{n:10,p:1,o:["Maybe it got too dry. Ask someone to water it next time.","Have a nice holiday!","I planted it at the end of May."],a:0,sen:"My plant died while I was away on holiday.",szh:"我去度假(holiday)的時候，我的植物死(die)了。",en:"Maybe it got too dry. Ask someone to water it next time.",zh:"對方說度假(holiday)時植物死(die)了，回「也許(maybe)太乾(dry)了，下次請人幫忙澆水」最自然。「假期愉快」時態不對，假期已經過了；「我五月底(end)種的」把植物說成自己的，人物不對。選 A"},
{n:11,p:1,o:["The pain is just on the left side.","My mom takes it, and she says it's very effective.","I have pain in my back, too."],a:1,sen:"Does this medicine really work for back pain?",szh:"這個藥對背痛(pain)真的有用嗎？",en:"My mom takes it, and she says it's very effective.",zh:"問藥有沒有用，答「我媽在吃，她說很有效(effective)」是間接回答有用。「我背也痛(pain)」只是重複 pain、back；「只(just)痛左(left)邊」是在描述自己的痛，沒回答藥有沒有用。選 B"},
{n:12,p:1,o:["I moved there last month.","It's a nice-looking brick house.","Wait. I'll write it down on paper for you."],a:2,sen:"What's your new address?",szh:"你的新地址(address)是什麼？",en:"Wait. I'll write it down on paper for you.",zh:"問新地址(address)，答「等一下，我寫在紙(paper)上給你」最自然。「我上個月搬去的」答的是時間；「是一棟好看的磚(brick)房子」描述的是房子的樣子，不是地址。選 C"},
{n:13,p:1,o:["I did, last summer.","At the park near my house.","He's my sister's son."],a:0,sen:"Who taught your nephew to skate?",szh:"是誰教你外甥(nephew)溜冰(skate)的？",en:"I did, last summer.",zh:"問「誰」教外甥(nephew)溜冰(skate)，答「是我，去年夏天」正確。「他是我姊姊的兒子」說的是外甥是誰，不是誰教他；「在我家附近的公園」答的是地點。選 A"},
{n:14,p:1,o:["It's a nice-looking coat.","There's a hanger behind the door.","I left mine at home."],a:1,sen:"Where should I put my coat?",szh:"我的外套要放哪裡？",en:"There's a hanger behind the door.",zh:"問外套放「哪裡」，答「門後面有衣架(hanger)」正確。「外套很好看(nice-looking)」只是稱讚；「我把我的留(left)在家了」講的是自己的外套。選 B"},
{n:15,p:1,o:["I went to Taiwan last year.","Sure, the trip was great.","Good luck! I can teach you some easy words."],a:2,sen:"I want to learn Mandarin before my trip to Taiwan.",szh:"我想在去台灣之前學中文(Mandarin)。",en:"Good luck! I can teach you some easy words.",zh:"對方想在旅行前學中文(Mandarin)，回「祝你好運(luck)！我可以教你一些簡單的字」最自然。「我去年去過台灣」只是在講自己；「當然，那趟旅行很棒」時態不對，對方還沒去。選 C"},
{n:16,p:2,o:["A dinner out.","A book.","A classical music CD."],a:0,sen:"W: What should we get Grandpa for his birthday? A book? &nbsp;M: He has too many books. How about a classical music CD? &nbsp;W: He listens to classical music online now. Let's take him out for a nice dinner. &nbsp;M: Good idea. &nbsp;Q: What will they give Grandpa?",szh:"女：爺爺生日(birthday)我們要送什麼？一本書(book)？　男：他書太多了。古典(classical)音樂 CD 怎麼樣？　女：他現在都在網路上(online)聽古典音樂。我們帶他去吃一頓好的晚餐吧。　男：好主意。　問：他們要送爺爺什麼？",en:"A dinner out.",zh:"書(book)太多被男士否定；古典(classical)音樂 CD 因為爺爺都在網路上(online)聽而被女士否定；最後決定帶他去吃晚餐。選 A"},
{n:17,p:2,o:["Give the present back.","Open the present now.","Open the present at home."],a:2,sen:"M: In my country, it's a custom to open gifts right away. &nbsp;W: Here, people usually wait until the guests leave. &nbsp;M: Really? So I shouldn't open your present now? &nbsp;W: Don't worry. You can simply open it at home. &nbsp;Q: What will the man probably do?",szh:"男：在我的國家，習俗(custom)是收到禮物(gift)馬上打開。　女：在這裡，大家通常等客人走了再拆。　男：真的嗎？那我現在不該打開你的禮物(present)囉？　女：別擔心，你只要(simply)回家再打開就好。　問：男士可能會怎麼做？",en:"Open the present at home.",zh:"男士原本的習俗(custom)是馬上拆，但女士說這裡通常等客人走後再拆，建議他回家再打開。現在打開是他自己國家的做法；對話沒有說要把禮物(present)還回去。選 C"},
{n:18,p:2,o:["Getting ready for a party.","Making a paper dragon.","Eating dinner with friends."],a:0,sen:"W: Ben, please hold the chair. I want to hang the paper dragon over the door. &nbsp;M: Sure. It looks great. Is it for the festival? &nbsp;W: Yes. My friends are coming on Saturday, and we will eat dinner together. &nbsp;M: Then let me help. I'll put the plates and cups on the table. &nbsp;W: Thanks. And please put the peaches in a big bowl. &nbsp;Q: What are the speakers doing?",szh:"女：班，請扶著椅子。我想把紙龍(dragon)掛在門上面。　男：好。看起來很棒。是為了慶典(festival)嗎？　女：對。我朋友星期六要來，我們要一起吃晚餐。　男：那我來幫忙。我把盤子和杯子放到桌上。　女：謝謝。還有請把桃子放進大碗裡。　問：說話的人在做什麼？",en:"Getting ready for a party.",zh:"女士要把紙龍(dragon)掛在門上，男士幫忙擺盤子和杯子，朋友星期六要來吃飯，所以兩人是在為聚會做準備。紙龍已經做好了，現在是掛起來，不是在做；一起吃晚餐是星期六才發生的事。選 A"},
{n:19,p:2,o:["One hundred dollars.","One hundred thirty dollars.","One hundred fifty dollars."],a:1,sen:"W: How much are the peaches? &nbsp;M: Forty dollars each, or three for one hundred. &nbsp;W: I'll take three peaches and one pear. &nbsp;M: Pears are thirty dollars each. &nbsp;Q: How much will the woman pay?",szh:"女：桃子(peach)怎麼賣？　男：一顆四十元，或三顆一百元。　女：我要三顆桃子和一顆梨子(pear)。　男：梨子一顆三十元。　問：女士要付多少錢？",en:"One hundred thirty dollars.",zh:"三顆桃子(peach)算一百元，加一顆梨子(pear)三十元，共一百三十元。一百元只算了桃子；一百五十元是把桃子一顆顆用四十元算，沒用到三顆一百的優惠。選 B"},
{n:20,p:2,o:["Every Sunday.","Every night.","Only on holidays."],a:2,sen:"M: Do you still go to church every Sunday? &nbsp;W: I used to. Now I only go on holidays. &nbsp;M: Why is that? &nbsp;W: I work on Sundays now. But I still pray at home every night. &nbsp;Q: How often does the woman go to church now?",szh:"男：你還是每個星期天都上教堂(church)嗎？　女：以前是。現在只有假日(holiday)才去。　男：為什麼？　女：我現在星期天要上班。不過我每天晚上還是在家禱告(pray)。　問：女士現在多久去一次教堂？",en:"Only on holidays.",zh:"每個星期天去教堂(church)是她「以前」的習慣；現在星期天要上班，只有假日(holiday)才去。每天晚上是她在家禱告(pray)的時間，不是去教堂。選 C"},
{n:21,p:2,o:["It is her family's tradition.","Her grandmother tells her to.","She believes it brings a long life."],a:0,sen:"M: Why does your family eat long noodles on birthdays? &nbsp;W: It's my grandmother's belief that they bring a long life. &nbsp;M: Do you believe that, too? &nbsp;W: Not really. But it's our family tradition, so we keep doing it. &nbsp;Q: Why does the woman eat long noodles on her birthday?",szh:"男：你們家為什麼生日(birthday)要吃長麵？　女：那是我奶奶的信念(belief)，她相信長麵會帶來長壽。　男：你也相信嗎？　女：不太相信。但那是我們家的傳統(tradition)，所以我們一直這樣做。　問：女士為什麼生日吃長麵？",en:"It is her family's tradition.",zh:"相信長麵帶來長壽是奶奶的信念(belief)，女士自己說不太相信；她吃是因為那是家族傳統(tradition)。對話沒有說是奶奶要求她吃。選 A"},
{n:22,p:2,o:["Two books.","A pair of skates.","A book about the universe."],a:1,sen:"W: What did you give your nephew for his birthday? &nbsp;M: I wanted to give him a book about the universe, but he already has two. &nbsp;W: So what did you get him? &nbsp;M: Something for his feet. He wants to skate with his friends. &nbsp;Q: What did the man give his nephew?",szh:"女：你送你外甥(nephew)什麼生日(birthday)禮物？　男：我本來想送他一本關於宇宙(universe)的書，但他已經有兩本了。　女：那你買了什麼給他？　男：穿在腳上的東西。他想跟朋友去溜冰(skate)。　問：男士送外甥什麼？",en:"A pair of skates.",zh:"「穿在腳上、用來溜冰(skate)的東西」就是溜冰鞋。宇宙(universe)的書外甥已經有了，所以沒送；兩本書是外甥原本就有的，不是禮物。選 B"},
{n:23,p:2,o:["Mrs. Wang's daughter, the piano teacher.","Mrs. Wang.","Mrs. Wang's daughter, the singer."],a:2,sen:"M: Is Mrs. Wang going to sing at the festival? &nbsp;W: She was, but she has a bad cold. Her daughter will sing for her. &nbsp;M: Her daughter, the piano teacher? &nbsp;W: No, the other one. She's a singer. &nbsp;Q: Who will sing at the festival?",szh:"男：王太太(Mrs.)會在慶典(festival)上唱歌嗎？　女：本來要，但她重感冒，她女兒會代替她唱。　男：她那個當鋼琴老師的女兒？　女：不是，另一個，她是歌手。　問：誰會在慶典上唱歌？",en:"Mrs. Wang's daughter, the singer.",zh:"王太太(Mrs.)感冒不能唱，由女兒代替；男士猜是當鋼琴老師的女兒，女士更正是另一個當歌手的女兒。王太太本人生病了；鋼琴老師是被否定的那個女兒。選 C"},
{n:24,p:2,o:["At a post office.","At a birthday party.","At a card shop."],a:0,sen:"M: Excuse me. I need to send this birthday card to my aunt in Japan. &nbsp;W: OK. Please write her address here. &nbsp;M: Like this? &nbsp;W: Yes. Do you want it to go by air or by sea? &nbsp;M: By air, please. When will it get there? &nbsp;W: In about five days. That will be fifteen dollars. &nbsp;Q: Where are the speakers?",szh:"男：不好意思。我要把這張生日(birthday)卡寄給我在日本的阿姨。　女：好的。請把她的地址(address)寫在這裡。　男：這樣嗎？　女：對。您要寄航空還是海運？　男：麻煩寄航空。多久會到？　女：大約五天。一共十五元。　問：說話者在哪裡？",en:"At a post office.",zh:"男士要寄卡片、寫地址(address)、選航空或海運、付郵資，櫃台人員幫他處理，可知他們在郵局。生日(birthday)卡是要寄給阿姨的，不是在生日派對上；他也不是在買卡片，所以不是卡片店。選 A"},
{n:25,p:2,o:["She had fun, even though they got lost.","She will not go to the mountains again.","She felt foolish and wants to forget it."],a:0,sen:"M: How was your trip to the mountains, Kate? &nbsp;W: We got lost for three hours because I forgot the map. &nbsp;M: Wow. Were you afraid? &nbsp;W: A little. I felt foolish, too. But we followed a river and found the way back before dark. &nbsp;M: So will you go again? &nbsp;W: Of course! What an adventure. I'm already planning the next one. &nbsp;Q: How does the woman feel about the trip?",szh:"男：凱特，你去山上的旅行怎麼樣？　女：我們迷路了三小時，因為我忘了帶地圖。　男：哇。你害怕嗎？　女：有一點。我也覺得自己很傻(foolish)。不過我們沿著一條河，在天黑前找到路回來了。　男：那你還會再去嗎？　女：當然！真是一場冒險(adventure)。我已經在計畫下一次了。　問：女士覺得這趟旅行怎麼樣？",en:"She had fun, even though they got lost.",zh:"她說「真是一場冒險(adventure)」，還已經在計畫下一次，表示雖然迷路，她玩得很開心。她說以後還要再去，所以不是不再去山上；覺得傻(foolish)只是迷路當下的感覺，她並不想忘記這趟旅行。選 A"},
{n:26,p:3,pic:true,o:[BARS("Fruit Sold at the Festival",["Peaches","Pears","Apples"],[50,80,20]),BARS("Fruit Sold at the Festival",["Peaches","Pears","Apples"],[80,20,50]),BARS("Fruit Sold at the Festival",["Peaches","Pears","Apples"],[80,50,20])],a:2,sen:"Mr. Lee is a fruit vendor at our town's Moon Festival market. He sells peaches, pears, and apples. Last year, pears sold the best. But this year, he sold more peaches than pears. Apples were not as popular as pears, just like last year. &nbsp;Q: Which chart shows Mr. Lee's fruit sales this year?",szh:"李先生是我們鎮上中秋節(festival)市集的水果攤販(vendor)，他賣桃子(peach)、梨子(pear)和蘋果。去年梨子賣得最好。但今年他賣出的桃子比梨子多。蘋果跟去年一樣，沒有梨子受歡迎。　問：哪張圖是李先生今年的水果銷售情形？",en:"Peaches most, pears second, apples fewest.",zh:"今年桃子(peach)比梨子(pear)多，蘋果又比梨子少，所以桃子最多、梨子第二、蘋果最少。梨子最高的那張是去年的情形；蘋果第二的那張不符合「蘋果沒有梨子受歡迎」。選 C"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27b'),PH('q27c')],a:2,sen:"Thanksgiving is my friend Amy's favorite holiday. Every year, she invites friends to dinner, and each guest brings something. Last year, I brought flowers, but her house was already full of them. This year, I wanted to bake a pie, but her mom always bakes one. So I bought her a gift in a brown paper box. &nbsp;Q: What did the speaker bring this year?",szh:"感恩節(Thanksgiving)是我朋友 Amy 最喜歡(favorite)的節日(holiday)。她每年都邀請(invite)朋友吃晚餐，每位客人(guest)都會帶點東西。去年我帶了花，但她家已經滿是花了。今年我想烤一個派，但她媽媽每年都會烤。所以我買了一份用咖啡色紙盒裝的禮物(gift)。　問：說話者今年帶了什麼？",en:"A gift.",zh:"帶花是去年的事，而且她家早就滿是花；烤派因為 Amy 的媽媽每年都會烤，所以也沒帶；今年他買了一份裝在咖啡色紙盒裡的禮物(gift)，所以帶的是禮物。 選 C"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28c'),PH('q28b')],a:0,sen:"Our town has a sand festival on the beach every summer. Last year, my brother made a big dragon out of sand. This year, he wanted to make a castle, but the kids next to him were already making one. So he made a whale, and it won second place. &nbsp;Q: What did the brother make this year?",szh:"我們鎮上每年夏天都在海灘上舉辦沙雕節(festival)。去年我哥哥用沙(sand)做了一條大龍(dragon)。今年他想做城堡，但旁邊的小孩(kid)已經在做了。所以他做了一隻鯨魚，還得了第二名。　問：哥哥今年做了什麼？",en:"A whale made of sand.",zh:"沙龍(dragon)是哥哥「去年」做的；城堡是他想做，但旁邊的小孩(kid)已經在做了；今年做的是鯨魚。選 A"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:1,sen:"Every Christmas Eve, my family goes to church to sing. This year, Grandma had a pain in her leg and couldn't walk beyond her garden. Dad said we could eat at a restaurant near her house, but she didn't want to go out. So we sat around the tree in her living room and sang songs together. Grandma said singing is good for the soul. &nbsp;Q: What did the family do on Christmas Eve this year?",szh:"每年平安夜，我們全家都會去教堂(church)唱歌。今年奶奶腳痛(pain)，走不出(beyond)她家的花園。爸爸說可以去她家附近的餐廳吃飯，但她不想出門。所以我們圍坐在她客廳的聖誕樹旁一起唱歌。奶奶說唱歌對心靈(soul)很好。　問：這家人今年平安夜做了什麼？",en:"They sang songs around the tree at Grandma's home.",zh:"去教堂(church)唱歌是「每年」的習慣，今年奶奶腳痛(pain)去不了；去餐廳吃飯是爸爸的提議，奶奶不想出門；最後是在奶奶家客廳的樹旁唱歌。選 B"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30a'),PH('q30c')],a:1,sen:"Every year at the Lantern Festival, our town has a traditional light show. My little nephew wanted a paper lantern in the shape of a dragon, but they were all sold out. Then he wanted a rabbit one, but it was too big for him to carry. In the end, we got him one shaped like a star, because he loves the universe. &nbsp;Q: Which lantern did the nephew get?",szh:"每年元宵節(Lantern Festival)，我們鎮上都有傳統的(traditional)燈會。我的小外甥(nephew)想要一個龍(dragon)形的紙(paper)燈籠，但全都賣完了。後來他想要兔子造型的，但太大他拿不動。最後我們買給他一個星星形狀的，因為他很喜歡宇宙(universe)。　問：外甥拿到哪一個燈籠？",en:"A star-shaped lantern.",zh:"龍(dragon)形燈籠賣完了；兔子燈籠太大他拿不動；最後買的是星星形狀的，因為他喜歡宇宙(universe)。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 22 回　節慶與習俗　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
