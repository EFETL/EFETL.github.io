<script>
/* 圖形素材（第22回 節慶與習俗） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/22/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const GIFT=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q1.jpg" alt="question 1 picture">`;
const CAKE=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q2.jpg" alt="question 2 picture">`;
const CHURCH=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q3.jpg" alt="question 3 picture">`;
const DRAGON=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q4.jpg" alt="question 4 picture">`;
const ANGEL=`<img class="pic-img p0img" src="gept-listening-img/22/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:GIFT,o:["A birthday gift wrapped in bright paper.","A birthday cake with pink candles.","A birthday card with a flower."],a:0,sen:"For question one, look at the picture. What did she receive?",szh:"第一題，請看圖片。她收到了什麼？",en:"A birthday gift wrapped in bright paper.",zh:"她收到一份用亮紙(paper)包好的生日(birthday)禮物(gift)，選 A。蛋糕和卡片也是生日常見的東西，但不是圖中收到的。"},
{n:2,p:0,fig:CAKE,o:["They celebrate a wedding in a garden.","They celebrate a festival, an old holiday tradition.","They celebrate a school sports day."],a:1,sen:"For question two, look at the picture. What are they celebrating?",szh:"第二題，請看圖片。他們在慶祝什麼？",en:"They celebrate a festival, an old holiday tradition.",zh:"他們在慶祝(celebrate)節日(festival)，是古老的假日(holiday)傳統(tradition)，選 B。婚禮和運動會都不是圖中的活動。"},
{n:3,p:0,fig:CHURCH,o:["At a temple, with their families.","In a library, with their families.","At a church, with their families."],a:2,sen:"For question three, look at the picture. Where do people pray?",szh:"第三題，請看圖片。人們在哪裡禱告？",en:"At a church, with their families.",zh:"人們在(at)教堂(church)禱告(pray)，選 C。寺廟也可以禱告，但圖中是教堂；圖書館不是禱告的地方。"},
{n:4,p:0,fig:DRAGON,o:["A big dragon dance in the street.","A big fireworks show in the street.","A big magic show in the street."],a:0,sen:"For question four, look at the picture. What is at the festival?",szh:"第四題，請看圖片。節慶上有什麼？",en:"A big dragon dance in the street.",zh:"節慶上有舞龍(dragon)表演，選 A。煙火秀和魔術秀也是節慶活動，但圖中是舞龍。"},
{n:5,p:0,fig:ANGEL,o:["An angel, part of an old belief.","A snowman, part of an old belief.","A dragon, part of an old belief."],a:0,sen:"For question five, look at the picture. What is part of the old belief?",szh:"第五題，請看圖片。什麼是古老信仰的一部分？",en:"An angel, part of an old belief.",zh:"天使(angel)是古老信仰(belief)的一部分，選 A。龍(dragon)雖然也和傳統有關，但圖中是天使。"},

{n:6,p:1,o:["It starts at seven o'clock.","It was very successful. Thank you!","It was two days long."],a:1,sen:"How did the school festival turn out?",szh:"學校的節慶活動辦得如何？",en:"It was very successful. Thank you!",zh:"問學校節慶辦得如何，答『非常成功(successful)，謝謝』，選 B。七點開始是回答 When，兩天長是回答 How long。"},
{n:7,p:1,o:["Because math class starts soon.","Maybe he is lonely. He's new.","He sits next to the window."],a:1,sen:"Why does the new boy sit alone?",szh:"新來的男孩為什麼一個人坐？",en:"Maybe he is lonely. He's new.",zh:"問新男孩為何獨坐，答『也許(maybe)他很孤單(lonely)，因為他是新來的』，選 B。數學(math)課和靠窗座位都不是原因。"},
{n:8,p:1,o:["The sale was in the big mall.","Yes, the shoes were very cheap.","No, it ended at the store, not online."],a:2,sen:"Did the sale finish on the internet?",szh:"這次特賣是在網路上結束的嗎？",en:"No, it ended at the store, not online.",zh:"問特賣是否在網路上結束，答『不，是在店裡結束(end)，不是線上(online)』，選 C。在大賣場和鞋很便宜都沒回答問題。"},
{n:9,p:1,o:["It's a flower from my aunt.","It costs about two hundred dollars.","Don't let it dry out; it'll die."],a:2,sen:"How do I keep this flower alive?",szh:"我要怎麼讓這朵花活著？",en:"Don't let it dry out; it'll die.",zh:"問怎麼讓花活著，答『別讓它變乾(dry)，不然會死(die)』，選 C。花是阿姨送的、價格都沒回答怎麼養。"},
{n:10,p:1,o:["We started it last month.","It seems beyond us, but let's try.","It's the room on the left."],a:1,sen:"Can we really finish this huge project?",szh:"我們真的能完成這麼大的專案嗎？",en:"It seems beyond us, but let's try.",zh:"問能否完成大專案，答『看似(seem)超出(beyond)我們的能力，但試試看』，選 B。上個月開始、左邊的房間都沒回答。"},
{n:11,p:1,o:["Yes, it's very effective for pain.","I got it at the drugstore.","It was just fifty dollars."],a:0,sen:"Will this stop my headache?",szh:"這能止住我的頭痛嗎？",en:"Yes, it's very effective for pain.",zh:"問能否止頭痛，答『是的，對疼痛(pain)很有效(effective)』，選 A。在藥局買的、只要五十元(just)都沒回答能不能止痛。"},
{n:12,p:1,o:["It opens at nine tomorrow.","Look for the vendor selling pears.","I sell peaches and cakes."],a:1,sen:"How can I find your festival stall?",szh:"我要怎麼找到你的節慶攤位？",en:"Look for the vendor selling pears.",zh:"問怎麼找到攤位，答『找賣梨(pear)的攤販(vendor)』，選 B。九點開門是時間；我賣桃子(peach)和蛋糕沒說明怎麼找。"},
{n:13,p:1,o:["I bought it in Japan.","No, I simply like this toy.","My nephew wants a new one."],a:1,sen:"Is it foolish to keep this old toy?",szh:"留著這個舊玩具很傻嗎？",en:"No, I simply like this toy.",zh:"問留舊玩具是否傻(foolish)，答『不，我單純(simply)喜歡這個玩具』，選 B。在日本買的、姪子(nephew)想要新的都沒回答。"},
{n:14,p:1,o:["It's a plastic one with a hook.","About ten minutes ago, I think.","I left it by the brick wall."],a:2,sen:"Where did you leave the coat hanger?",szh:"你把衣架留在哪了？",en:"I left it by the brick wall.",zh:"問衣架(hanger)放哪，答『我留(left)在磚(brick)牆旁』，選 C。塑膠的、十分鐘前分別回答長相和時間。"},
{n:15,p:1,o:["Yes, many people speak Mandarin.","Yes, we have turkey on Thanksgiving.","The skate park is near here."],a:1,sen:"Do people do special things on holidays here?",szh:"這裡的人在節日會做特別的事嗎？",en:"Yes, we have turkey on Thanksgiving.",zh:"問這裡的人節日是否做特別的事，答『有，感恩節(Thanksgiving)吃火雞』，選 B。說國語(Mandarin)、溜冰場(skate)都沒回答節日習俗。"},

{n:16,p:2,o:["Her birthday.","Her graduation.","A new year."],a:0,sen:"W: Why is your family so happy today? &nbsp;M: My little sister is eight years old now, and we have a big cake. &nbsp;W: Please give her my congratulations. &nbsp;Q: What is the family celebrating?",szh:"女：你家今天怎麼這麼開心？　男：我妹妹現在八歲了，我們有一個大蛋糕。　女：請替我向她道賀(congratulations)。　問：這家人在慶祝什麼？",en:"Her birthday.",zh:"妹妹八歲、有大蛋糕，所以是慶祝(celebrate)生日(birthday)，選 A。畢業典禮沒有線索。"},
{n:17,p:2,o:["To a church.","To a school.","To a market."],a:0,sen:"M: Where does your family go every Sunday? &nbsp;W: To the church, where we pray together. &nbsp;M: A nice custom. &nbsp;Q: Where does the family go?",szh:"男：你家每個星期天去哪？　女：去教堂(church)，一起禱告(pray)。　男：好習俗。　問：這家人去哪？",en:"To a church.",zh:"他們每個星期天去教堂(church)一起禱告(pray)，選 A。學校和市場都沒提到。"},
{n:18,p:2,o:["The Lantern Festival.","The Moon Festival.","The Dragon Boat Festival."],a:2,sen:"W: Is there a holiday next month? &nbsp;M: Yes. People race in long boats and eat rice dumplings. &nbsp;W: Sounds like fun. &nbsp;Q: Which festival is the man talking about?",szh:"女：下個月有假日嗎？　男：有。人們會在長長的船上比賽，還會吃粽子。　女：聽起來很好玩。　問：男士在說哪個節日(festival)？",en:"The Dragon Boat Festival.",zh:"在長長的船上比賽、吃粽子，這是端午節(Dragon Boat Festival)，選 C。元宵節和中秋節的活動不同。"},
{n:19,p:2,o:["Give him a present.","Bake him a cake.","Sing him a song."],a:0,sen:"M: Today is Mr. Lin's birthday. &nbsp;W: I know. Our class bought a scarf and wrapped it in red paper. &nbsp;M: He will love it. &nbsp;Q: What will the class do for Mr. Lin?",szh:"男：今天是林老師的生日(birthday)。　女：我知道。我們班買了一條圍巾，用紅紙(paper)包起來。　男：他一定會喜歡。　問：全班要為林老師做什麼？",en:"Give him a present.",zh:"全班買了圍巾並用紅紙(paper)包好，要在生日(birthday)送給林老師，所以是送他禮物(present)，選 A。蛋糕和唱歌沒被提到。"},
{n:20,p:2,o:["In spring.","In summer.","In autumn."],a:2,sen:"W: When do Americans give thanks for the harvest? &nbsp;M: In autumn, on Thanksgiving Day. &nbsp;W: A warm holiday. &nbsp;Q: When is Thanksgiving?",szh:"女：美國人什麼時候感謝豐收？　男：在秋天，感恩節(Thanksgiving)。　女：溫馨的節日。　問：感恩節在何時？",en:"In autumn.",zh:"感恩節(Thanksgiving)在秋天，選 C。春天和夏天不對。"},
{n:21,p:2,o:["It's a family tradition.","It's cheap and easy.","It's a school rule."],a:0,sen:"M: Why does your family light lanterns each year? &nbsp;W: My grandmother did it, and her mother did it too. &nbsp;M: That is a long story. &nbsp;Q: Why do they light lanterns?",szh:"男：你家為什麼每年都點燈籠？　女：我奶奶這樣做，她的媽媽也這樣做。　男：這故事真長。　問：他們為什麼點燈籠？",en:"It's a family tradition.",zh:"奶奶和她的媽媽都這樣做，代代相傳，是家族傳統(tradition)，選 A。便宜容易和學校規定都沒線索。"},
{n:22,p:2,o:["A book about classical music.","A book about cooking.","A book about soccer."],a:0,sen:"W: Did you get a present from your grandfather for the holiday? &nbsp;M: Yes, a book about Mozart and Bach. He loves their music. &nbsp;W: He has good taste. &nbsp;Q: What did grandfather give him?",szh:"女：爺爺過節(holiday)有送你禮物(present)嗎？　男：有，一本關於莫札特和巴哈的書(book)。他很愛他們的音樂。　女：他品味真好。　問：爺爺送了他什麼？",en:"A book about classical music.",zh:"書是關於莫札特和巴哈的音樂，是古典(classical)音樂書(book)，選 A。烹飪和足球沒被提到。"},
{n:23,p:2,o:["Her little brother.","Her nephew.","Her classmate."],a:1,sen:"M: Who is that boy running around at the party? &nbsp;W: He is my brother's son. He is only six. &nbsp;M: He is full of energy! &nbsp;Q: Who is the boy to the woman?",szh:"男：派對上跑來跑去的那個男孩是誰？　女：他是我哥哥的兒子，才六歲。　男：他精力真充沛！　問：那個男孩是女士的什麼人？",en:"Her nephew.",zh:"男孩是她哥哥的兒子，也就是姪子(nephew)，選 B。小弟弟聽起來像但不對。"},
{n:24,p:2,o:["A red apple and a banana.","Some grapes and an orange.","A peach and a pear."],a:2,sen:"W: What fruit do we offer at the festival table? &nbsp;M: A sweet peach and a juicy pear, for good luck. &nbsp;W: Traditional choice. &nbsp;Q: What fruit do they offer?",szh:"女：節慶供桌上我們擺什麼水果？　男：一顆甜桃(peach)和一顆多汁的梨(pear)，求好運。　女：傳統的選擇。　問：他們供上什麼水果？",en:"A peach and a pear.",zh:"他們在節慶供桌上擺桃(peach)和梨(pear)，是傳統(traditional)的選擇，選 C。蘋果香蕉和葡萄橘子都沒提到。"},
{n:25,p:2,o:["A bird.","An angel.","A star."],a:1,sen:"M: That is a nice-looking tree. What is on top? &nbsp;W: A little doll with white wings and a gold ring over its head. &nbsp;M: How pretty. &nbsp;Q: What is on top of the tree?",szh:"男：那是一棵好看(nice-looking)的樹。頂上是什麼？　女：一個有白色翅膀、頭上有金環的小人偶。　男：真漂亮。　問：樹頂上是什麼？",en:"An angel.",zh:"白色翅膀和頭上的金環是天使(angel)的樣子，選 B。鳥有翅膀、星星會發亮，但沒有金環。"},

{n:26,p:3,pic:true,o:[BARS("Festivals",["NewYr","MidAut","Dragon"],[50,80,20]),BARS("Festivals",["NewYr","MidAut","Dragon"],[20,50,80]),BARS("Festivals",["NewYr","MidAut","Dragon"],[80,50,20])],a:2,sen:"Our class voted for our favorite festival. The New Year got the most votes, because of the gifts and the big holiday. The Mid-Autumn Festival was in the middle, and the Dragon Boat Festival got the fewest. So the New Year bar should be the tallest. &nbsp;Q: Which chart shows the favorite festivals?",szh:"我們班票選最愛的節日(festival)。新年最多票，因為有禮物(gift)和長假(holiday)；中秋中等；端午最少。所以新年長條最高。　問：哪張圖顯示最愛的節日？",en:"New Year most, Dragon least.",zh:"新年最多票、端午(Dragon Boat)最少，符合『新年長條最高』的圖，選 C。中秋排中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Gifts Given",["Kids","Teens","Adults"],[80,55,30]),BARS("Gifts Given",["Kids","Teens","Adults"],[30,55,80]),BARS("Gifts Given",["Kids","Teens","Adults"],[55,80,30])],a:0,sen:"On this birthday, we counted the gifts each group gave. The kids gave the most presents, made of simple paper. The teens gave a middle amount, and the adults gave the fewest, but the most expensive. So the number of gifts went down from kids to adults. &nbsp;Q: Which chart shows the gifts given?",szh:"這次生日(birthday)，我們統計每組送的禮物(gift)。小孩(kid)送最多，用簡單的紙(paper)做的；青少年中等；大人最少但最貴。所以禮物數量從小孩到大人遞減。　問：哪張圖顯示送的禮物？",en:"Kids most, adults fewest.",zh:"小孩(kid)送最多禮物(gift)、大人最少，符合『小孩最高、大人最低』的圖，選 A。青少年排中間。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:2,sen:"On the morning of the festival, our family was too busy decorating to cook. I even wrote our address on a big sign for the guests. There was no time to boil noodles or steam rice before they arrived. So we simply had bread for breakfast, and saved our energy to celebrate the whole day. &nbsp;Q: What did the family eat for breakfast?",szh:"節慶(festival)早上，我們家忙著布置沒空煮飯。我甚至為客人在大看板上寫了我們的地址(address)。客人來前沒時間煮麵或蒸飯。所以我們早餐(breakfast)簡單吃麵包(bread)，省下力氣慶祝(celebrate)一整天。　問：這家人早餐吃什麼？",en:"Bread for breakfast.",zh:"這家人早餐吃麵包(bread)，選 C。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:2,sen:"For grandmother's birthday, the whole family gathered to celebrate. She said such a special day deserved more than plain bread or dry rice. Following an old tradition, she cooked long noodles, a symbol of long life, and we all wished her good luck. A good meal is good for the soul, she said. &nbsp;Q: What did grandmother cook for her birthday?",szh:"為了奶奶的生日(birthday)，全家聚在一起慶祝(celebrate)。她說這麼特別的日子值得比普通麵包或白飯更好的。依照老傳統(tradition)，她煮了長長的麵(noodles)，象徵長壽，我們都祝她好運(luck)。她說，好好吃一頓飯對心靈(soul)也有好處。　問：奶奶生日煮了什麼？",en:"Long noodles.",zh:"奶奶煮了長壽麵(noodles)，選 C。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('beach'),IMG('park')],a:1,sen:"During the long holiday, our family wanted to celebrate together outdoors. My father liked the mountain and my nephew liked the park. But we chose the beach, because we could build castles in the sand, fly kites, and enjoy the festival mood by the sea. At night, under so many stars, it felt like the whole universe was ours. What an adventure! &nbsp;Q: Where did the family celebrate the holiday?",szh:"長假(holiday)期間，我們家想在戶外一起慶祝(celebrate)。爸爸喜歡山，姪子(nephew)喜歡公園，但我們選了海邊(beach)，因為可以在沙(sand)上堆城堡、放風箏，在海邊享受節慶氣氛。晚上在滿天星星下，感覺整個宇宙(universe)都是我們的。真是一場冒險(adventure)！　問：一家人在哪裡過節？",en:"The beach.",zh:"一家人在海邊(beach)過節，選 B。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 22 回　節慶與習俗　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}

(function(){

     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));

  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');

  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};

  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});

    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};

  document.getElementById('penBtn').onclick=open;

  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;

  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
