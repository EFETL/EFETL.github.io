<script>
/* 圖形素材（第12回 學校生活） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/12/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/12/p3_${n}.jpg?v=r12hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const SCHOOL=`<img class="pic-img p0img" src="gept-listening-img/12/p0_q1.jpg" alt="question 1 picture">`;
const GRADCAP=`<img class="pic-img p0img" src="gept-listening-img/12/p0_q2.jpg" alt="question 2 picture">`;
const WORKBOOK=`<img class="pic-img p0img" src="gept-listening-img/12/p0_q3.jpg" alt="question 3 picture">`;
const CD=`<img class="pic-img p0img" src="gept-listening-img/12/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:SCHOOL,o:["They are walking toward the school building.","They are sitting on the campus grass with their bags.","They are walking away from the school building."],a:0,sen:"For question one, look at the picture. What are the three students doing?",szh:"第一題，請看圖片。這三位學生在做什麼？",en:"They are walking toward the school building.",zh:"圖中三位學生(student)背著書包、背對我們，沿著小路走向學校(school)大樓，所以「朝大樓走去」正確。「離開大樓」方向相反；「坐在校園(campus)草地上」動作不對，他們是在走路。選 A"},
{n:2,p:0,fig:GRADCAP,o:["She is smiling and putting a red bow on her cap.","She is smiling and holding a white paper with a red bow.","She is holding a red cap and a white paper."],a:1,sen:"For question two, look at the picture. What is the woman doing?",szh:"第二題，請看圖片。這位女士在做什麼？",en:"She is smiling and holding a white paper with a red bow.",zh:"她面帶微笑(smile)，雙手拿著綁紅色蝴蝶結的白色紙卷，正確。她沒有在把蝴蝶結綁到帽子(cap)上，動作不對；她的帽子是黑色、戴在頭上，不是拿著紅帽子。選 B"},
{n:3,p:0,fig:WORKBOOK,o:["There are two pencils on an open workbook.","There is a pencil next to a closed workbook.","There is a pencil on an open workbook."],a:2,sen:"For question three, look at the picture. What is on the wooden desk?",szh:"第三題，請看圖片。木頭(wooden)書桌上有什麼？",en:"There is a pencil on an open workbook.",zh:"木桌上有一本攤開的作業本(workbook)，上面放著一支鉛筆，正確。圖中只有一支鉛筆，不是兩支；作業本是打開的，鉛筆放在本子上面，不是在闔起來的本子旁邊。選 C"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/12/p0_q4.jpg" alt="question 4 picture">`,o:["It's nine o'clock, and nobody is in the classroom.","It's nine o'clock, and the students are taking an exam.","It's three o'clock, and nobody is in the classroom."],a:0,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"It's nine o'clock, and nobody is in the classroom.",zh:"時鐘短針指 9、長針指 12，是九點(o'clock)；後面教室桌上放著考卷，但一個學生都沒有，正確。說學生正在考試(exam)不對，教室是空的；說三點是把時針方向聽錯看錯。選 A"},
{n:5,p:0,fig:CD,o:["She is holding up a CD in front of the class.","She is giving a CD to a student.","She is holding up a map in front of the class."],a:0,sen:"For question five, look at the picture. What is the teacher doing?",szh:"第五題，請看圖片。老師在做什麼？",en:"She is holding up a CD in front of the class.",zh:"老師(teacher)在全班面前舉起一張光碟(CD)，正確。她沒有把光碟交給學生，光碟還在她手上；地圖是掛在後面牆上，不是她拿著。選 A"},
{n:6,p:1,o:["Because the garage door was open.","Sure, you can sit anywhere you like.","Did you look in your bag?"],a:2,sen:"I can't find the classroom key anywhere.",szh:"我到處都找不到教室鑰匙。",en:"Did you look in your bag?",zh:"對方說到處(anywhere)都找不到鑰匙(key)，自然的回應是幫忙想「你找過書包了嗎？」。「你可以隨便坐」只是重複 anywhere；用「因為車庫(garage)門開著」來回應，前面沒人問原因。選 C"},
{n:7,p:1,o:["Not until the end of the semester.","In the teacher's office, I think.","I handed mine in to Mr. Lin."],a:0,sen:"When do we have to hand in the science project?",szh:"我們什麼時候要交自然專題？",en:"Not until the end of the semester.",zh:"問「什麼時候」交專題(project)，答「要到學期(semester)末才要交」才是時間。「在老師辦公室」答的是地點；「我已經交給林老師(Mr.)了」說的是自己做了什麼，沒回答什麼時候。選 A"},
{n:8,p:1,o:["Which grade are you in now?","Good for you! All that hard study helped.","I'll take the math exam next week."],a:1,sen:"I got a much better grade on the math exam this time.",szh:"這次數學考試我的成績好很多。",en:"Good for you! All that hard study helped.",zh:"對方說考試(exam)成績(grade)進步了，回「太好了！你那麼用功讀書(study)有幫助」最自然。「你現在幾年級」把 grade 當成年級，是同字陷阱；「我下週要考數學」只是重複 math exam，沒有回應對方。選 B"},
{n:9,p:1,o:["Yes, it's a very big university.","At the end of last summer.","It has the best education courses."],a:2,sen:"What was your reason for choosing this university?",szh:"你選這所大學的理由是什麼？",en:"It has the best education courses.",zh:"問選大學(university)的理由(reason)，答「它的教育(education)課程(course)最好」就是理由。「是的，它很大」用 Yes 回答 wh- 問句；「去年夏天結束時」答的是時間。選 C"},
{n:10,p:1,o:["Yes, the lemon tree is in our garden.","Sure, I made it for you.","I'm fine, thanks. I just had a glass of water."],a:2,sen:"Would you like some lemon tea?",szh:"你要來點檸檬茶嗎？",en:"I'm fine, thanks. I just had a glass of water.",zh:"對方請你喝檸檬(lemon)茶，「不用了，謝謝，我剛喝了一杯水」是委婉拒絕，最自然。「當然，我幫你做的」好像自己才是請客的人，人物顛倒；「檸檬樹在花園裡」只是重複 lemon。選 C"},
{n:11,p:1,o:["No, he isn't watching cartoons now.","He should go outside for some fresh air.","Yes, it starts at seven o'clock."],a:1,sen:"My little brother watches cartoons all day long.",szh:"我弟弟整天都在看卡通。",en:"He should go outside for some fresh air.",zh:"對方抱怨弟弟整天看卡通(cartoon)，建議「他應該出去呼吸新鮮空氣(air)」最合理。用 No 說他現在沒在看，與對方的話不相干；「它七點開始」的 it 沒有指涉對象。選 B"},
{n:12,p:1,o:["He's our new history professor.","I'll suggest it to him tomorrow.","A report on dolphins in Taiwan."],a:2,sen:"What did the professor suggest for our final project?",szh:"教授建議我們的期末專題做什麼？",en:"A report on dolphins in Taiwan.",zh:"問教授(professor)建議(suggest)做什麼專題，答「做一份台灣海豚(dolphin)的報告」直接給出內容。「他是新的歷史教授」答的是他是誰；「我明天會建議他」時態和人物都不對，問的是教授已經建議了什麼。選 C"},
{n:13,p:1,o:["It was a struggle at first, but I'm OK now.","My college is in Tainan.","It starts next September."],a:0,sen:"How was your first semester at college?",szh:"你在大學的第一個學期過得怎麼樣？",en:"It was a struggle at first, but I'm OK now.",zh:"問大學(college)第一學期(semester)過得如何，答「一開始很辛苦(struggle)，現在還好」是在描述經驗。「明年九月才開始」時態不對，問的是已經過完的學期；「我的大學在台南」答的是地點。選 A"},
{n:14,p:1,o:["Then let's walk. School is only ten minutes away.","Yes, the bus came on time.","Take bus number thirteen."],a:0,sen:"The school bus is late again.",szh:"校車又遲到了。",en:"Then let's walk. School is only ten minutes away.",zh:"對方說校車又遲到，回「那我們走路吧，學校(school)只要十分鐘」最自然。「是的，公車準時」先同意又說準時，前後矛盾；「搭十三(thirteen)號公車」只是重複 bus，像在回答怎麼去。選 A"},
{n:15,p:1,o:["They'll be here before ten o'clock.","To the classroom on the third floor.","Someone from the school office."],a:2,sen:"Who will deliver the new CDs to our classroom?",szh:"誰會把新的光碟送到我們教室？",en:"Someone from the school office.",zh:"問「誰」會送(deliver)光碟(CD)來，答「學校辦公室的人」才是人物。「十點以前會到」答的是時間；「送到三樓的教室」答的是地點。選 C"},
{n:16,p:2,o:["At three o'clock.","Before the art class.","At two o'clock."],a:0,sen:"W: Our English lesson starts at two o'clock today, right? &nbsp;M: Not today. Ms. Chen moved it to after the art class. &nbsp;W: And art ends at three? &nbsp;M: Yes. Don't be late this time. &nbsp;Q: When does the English lesson start today?",szh:"女：我們今天的英文課(lesson)兩點(o'clock)開始，對吧？　男：今天不是。陳老師把它改到美術課之後了。　女：美術課三點結束？　男：對。這次別遲到了。　問：今天英文課幾點開始？",en:"At three o'clock.",zh:"英文課(lesson)原本兩點，但改到美術課之後，美術課三點結束，所以英文課三點開始。兩點是原本的時間，已經改了；英文課是在美術課之後，不是之前。選 A"},
{n:17,p:2,o:["She got every question right.","She did very well on the exam.","She has to take the exam again."],a:1,sen:"M: How did you do on the science exam? &nbsp;W: Ninety-eight. I only got one question wrong. &nbsp;M: Wow! You really learned a lot this semester. &nbsp;Q: What do we know about the woman?",szh:"男：你自然考試(exam)考得怎樣？　女：九十八分，只錯一題。　男：哇！你這學期(semester)真的學(learn)到很多。　問：關於女士我們知道什麼？",en:"She did very well on the exam.",zh:"考九十八分、只錯一題，換句話說就是「考得很好」。她錯了一題，所以不是全部答對；考這麼高分也不需要重考。選 B"},
{n:18,p:2,o:["At City University.","At the man's school.","At Green College."],a:2,sen:"W: Your father teaches at City University, right? &nbsp;M: He did. But he moved to Green College last year. &nbsp;W: Does he still teach education? &nbsp;M: Yes, the same courses. &nbsp;Q: Where does the man's father work now?",szh:"女：你爸爸在城市大學(University)教書，對吧？　男：以前是。但他去年轉到綠園學院(College)了。　女：他還教教育(education)嗎？　男：對，一樣的課程(course)。　問：男士的爸爸現在在哪裡工作？",en:"At Green College.",zh:"男士更正：爸爸以前在城市大學(university)，去年轉到綠園學院(college)，所以現在在綠園學院。城市大學是以前的工作地點；對話沒有說他在男士的學校教書。選 C"},
{n:19,p:2,o:["For her birthday.","For Teacher's Day.","Because she was sick last month."],a:1,sen:"W: Let's buy Mrs. Lee some flowers for her birthday. &nbsp;M: Her birthday was last month. &nbsp;W: Oh, right. But Teacher's Day is this Friday. &nbsp;M: Good. Let's give them to her then. &nbsp;Q: Why will they give Mrs. Lee flowers?",szh:"女：我們買花送李老師(Mrs.)當生日禮物吧。　男：她的生日上個月就過了。　女：喔，對。不過這週五是教師節(Teacher's Day)。　男：好，那就那天送給她。　問：他們為什麼要送李老師花？",en:"For Teacher's Day.",zh:"女士原本想慶祝生日，但男士說生日已經過了，女士改說週五是教師節(Teacher's Day)，男士同意那天送。生日是被否定的理由；對話沒提到老師生病，上個月指的是生日。選 B"},
{n:20,p:2,o:["The prince's servant.","The prince.","Nothing. He is not in the play."],a:0,sen:"W: Are you the prince in the school play? &nbsp;M: I wanted to be, but Tom got the part. &nbsp;W: So who are you? &nbsp;M: The prince's servant. I'm in all the action scenes, but I don't get a kiss. &nbsp;Q: What part does the man play?",szh:"女：你在學校(school)話劇裡演王子嗎？　男：我想演，但角色給 Tom 了。　女：那你演誰？　男：王子的僕人(servant)。所有動作(action)戲我都有，但沒有親吻(kiss)戲。　問：男士演什麼角色？",en:"The prince's servant.",zh:"男士想演王子，但王子由 Tom 演，他演的是王子的僕人(servant)。王子是 Tom 的角色；他說自己在所有動作(action)戲裡都有出場，所以不是什麼都沒演(nothing)。選 A"},
{n:21,p:2,o:["An orange.","A lemon.","A potato."],a:1,sen:"M: What did you do in nature class today? &nbsp;W: We lit a small lamp with a lemon. &nbsp;M: A lemon? Not a potato? &nbsp;W: Ms. Wu wanted a potato, but nobody brought one. &nbsp;Q: What did the class use to light the lamp?",szh:"男：你們今天自然(nature)課做了什麼？　女：我們用一顆檸檬(lemon)點亮一盞小燈。　男：檸檬？不是馬鈴薯？　女：吳老師本來要用馬鈴薯，但沒人帶。　問：全班用什麼點亮小燈？",en:"A lemon.",zh:"女士說用檸檬(lemon)點亮小燈。老師原本想用馬鈴薯，但沒人帶來，所以沒用到；柳橙在對話中沒有出現。選 B"},
{n:22,p:2,o:["Give the talk.","Write the report.","Finish the pictures."],a:1,sen:"W: We have to hand in our science project tomorrow, but Tom is sick. &nbsp;M: Let's give him some support. I can finish the pictures. &nbsp;W: Then, to make it equal, I'll write the report. &nbsp;M: Good. Tom can give the talk when he's better. &nbsp;Q: What will the woman do?",szh:"女：我們明天要交自然專題(project)，可是 Tom 生病了。　男：我們來支援(support)他吧。我可以把圖畫完。　女：那為了分工平均(equal)，報告我來寫。　男：好。Tom 好了以後再上台報告。　問：女士會做什麼？",en:"Write the report.",zh:"要分清楚誰做什麼：男士畫圖，女士寫報告，Tom 之後上台講。畫圖是男士的工作；上台講是 Tom 的工作。選 B"},
{n:23,p:2,o:["Seventeen.","Thirty.","Thirteen."],a:0,sen:"M: Our school has over a thousand students. How many are in the English speech test? &nbsp;W: Thirty signed up. &nbsp;M: That's a lot! &nbsp;W: But thirteen of them have a bad cold and can't go. &nbsp;Q: How many students will go to the speech test?",szh:"男：我們學校有一千(thousand)多名學生(student)。有多少人參加英文演講測驗？　女：三十人報名。　男：好多！　女：但其中十三(thirteen)人重感冒不能去。　問：有多少學生會去參加演講測驗？",en:"Seventeen.",zh:"三十人報名，減去十三(thirteen)個重感冒不能去的，剩十七人。三十是報名人數；十三是不能去的人數，和 thirty 發音也很像。選 A"},
{n:24,p:2,o:["Ask him to draw the roads.","Find a current map in the library.","Use the old map for the project."],a:1,sen:"W: Can I use this old map for my project? &nbsp;M: It's from twenty years ago. Many roads are different now. &nbsp;W: Hmm. So what should I do? &nbsp;M: Try the library. They have new ones. &nbsp;Q: What does the man suggest?",szh:"女：我的專題(project)可以用這張舊地圖嗎？　男：那是二十年前的，現在很多路都不一樣了。　女：嗯，那我該怎麼辦？　男：去圖書館找找，那裡有新的。　問：男士建議(suggest)什麼？",en:"Find a current map in the library.",zh:"男士說舊地圖太舊、路都變了，要她去圖書館找新的，也就是「找一張最新的(current)地圖」。用舊地圖正是男士不贊成的；他沒有說要自己幫她畫路。選 B"},
{n:25,p:2,o:["At nine o'clock.","At five o'clock.","Right after supper."],a:1,sen:"W: Is the school library open after supper? &nbsp;M: I guess so. It closes at nine on weekdays. &nbsp;W: But today is Saturday. &nbsp;M: Oh, then it closes at five. &nbsp;Q: When does the library close today?",szh:"女：學校(school)圖書館晚餐(supper)後有開嗎？　男：我猜(guess)有，平日九點關。　女：可是今天是星期六。　男：喔，那就五點(o'clock)關。　問：圖書館今天幾點關？",en:"At five o'clock.",zh:"九點是平日的關門時間，今天是星期六，所以五點就關。九點不是今天的時間；晚餐後是女士原本想去的時間，那時圖書館已經關了。選 B"},
{n:26,p:3,pic:true,o:[BARS("Club Members",["Drama","Science","Cooking"],[80,20,50]),BARS("Club Members",["Drama","Science","Cooking"],[50,80,20]),BARS("Club Members",["Drama","Science","Cooking"],[50,20,80])],a:2,sen:"Our school has three after-school clubs: drama, science, and cooking. Last semester, drama was the most popular club. This semester, however, more students joined the cooking club than the drama club. The science club has the fewest members, but its aim is to grow next year. &nbsp;Q: Which chart shows the club members this semester?",szh:"我們學校(school)有三個課後社團：戲劇、自然科學、烹飪。上學期(semester)戲劇社最受歡迎。不過(however)這學期參加烹飪社的學生(student)比戲劇社多。自然科學社人最少，但它的目標(aim)是明年成長。　問：哪張圖是這學期的社員人數？",en:"Cooking most, drama second, science fewest.",zh:"這學期烹飪社人比戲劇社多，自然科學社最少，所以烹飪最高、戲劇第二、科學最低。戲劇最高的那張是上學期(semester)的情形；科學最高的那張與「科學社最少」相反。選 C"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27b'),PH('q27a')],a:0,sen:"Teacher's Day is next Friday, and our class wants to thank Ms. Lin. At first, we planned to buy her flowers. But she once told us that flowers die too fast. Then some students suggested a small plant, but nobody could take care of it during the holiday. In the end, we made a big card, and every student drew a heart or a star on it. &nbsp;Q: What will the class give Ms. Lin?",szh:"下週五是教師節(Teacher's Day)，我們班想感謝林老師。一開始我們打算買花給她，但她曾說花謝得太快。後來有些學生(student)建議(suggest)送小盆栽，但放假期間沒人能照顧。最後我們做了一張大卡片，每位學生都在上面畫了一顆愛心或星星。　問：全班要送林老師什麼？",en:"A big card.",zh:"先想送花，因為老師說花謝得太快而放棄；再想送盆栽，因為假期沒人照顧也放棄；最後做了一張大卡片。花和盆栽都是被否定的計畫。選 A"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28c'),PH('q28b')],a:2,sen:"Amy is on the school track team. Last season, she ran short races on the track. This season, her coach suggested the long jump, because Amy has strong legs. Amy wanted to try swimming, too, but the school pool is closed this year. Her target is to jump five meters by summer. &nbsp;Q: What is Amy doing this season?",szh:"Amy 是學校(school)田徑(track)隊的一員。上一季(season)她在跑道上跑短跑。這一季教練建議(suggest)她練跳遠，因為她腿很有力。Amy 也想試試游泳，但學校游泳池今年關閉。她的目標(target)是夏天前跳到五公尺。　問：Amy 這一季在練什麼？",en:"The long jump.",zh:"跑短跑是上一季(season)的事；這一季教練建議改練跳遠，她的目標(target)也是跳五公尺。游泳是她想試但泳池關閉，沒辦法練。選 C"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29c'),PH('q29a')],a:2,sen:"For our art project, each student made a cover for the class workbook. I wanted to draw a big whale, but my teacher said it was too big for the page. So I drew a slender dolphin. My friend Ben drew a dolphin, too, but his has two little fish next to it. Mine has nothing else, just the blue sea. &nbsp;Q: Which cover did the speaker draw?",szh:"美術專題(project)要每位學生(student)替班上的作業本(workbook)畫封面(cover)。我想畫一隻大鯨魚，但老師(teacher)說太大放不進頁面，所以我畫了一隻苗條(slender)的海豚(dolphin)。我的朋友 Ben 也畫海豚，但他的旁邊有兩條小魚。我的除了藍色大海，什麼都沒有(nothing)。　問：說話者畫的是哪個封面？",en:"A slender dolphin alone in the blue sea.",zh:"說話者放棄鯨魚，改畫一隻海豚(dolphin)，而且旁邊什麼都沒有(nothing)，只有藍色的海。鯨魚是他原本想畫但被老師否定的；旁邊有兩條小魚的海豚是朋友 Ben 的封面。選 C"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:1,sen:"My university is on a hill, and the road up has many sharp curves. So I never ride my bicycle there. My dad usually drives me in the morning. This week, however, his car is at the garage because something is wrong with it. So I take the school bus with the other students. &nbsp;Q: How does the speaker get to the university this week?",szh:"我的大學(university)在山丘上，上山的路有很多急轉彎(curve)，所以我從不騎腳踏車去。爸爸通常早上開車載我。不過(however)這週他的車有問題送進修車廠(garage)了，所以我和其他學生(student)一起搭校車。　問：說話者這週怎麼去大學？",en:"By school bus.",zh:"騎腳踏車是說話者「從不」做的事；爸爸開車是「平常」的方式，但這週車子在修車廠(garage)；這週是搭校車。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 12 回　學校生活　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
