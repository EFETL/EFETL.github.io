<div class="bar">
 <b>🖨 第 15 回　買賣與商店　聽力測驗　列印版</b>

<div id="root"></div>
<script>
/* 圖形素材（第15回 買賣與商店） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/15/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/15/p3_${n}.jpg?v=r15qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const STORE=`<img class="pic-img p0img" src="gept-listening-img/15/p0_q1.jpg" alt="question 1 picture">`;
const CART=`<img class="pic-img p0img" src="gept-listening-img/15/p0_q2.jpg" alt="question 2 picture">`;
const FACTORY=`<img class="pic-img p0img" src="gept-listening-img/15/p0_q3.jpg" alt="question 3 picture">`;
const ADSIGN=`<img class="pic-img p0img" src="gept-listening-img/15/p0_q4.jpg" alt="question 4 picture">`;
const DEPTSTORE=`<img class="pic-img p0img" src="gept-listening-img/15/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:STORE,o:["She is carrying a green basket and looking at the shelves.","She is taking a bag of food off the shelf.","She is carrying a red basket and looking at the shelves."],a:0,sen:"For question one, look at the picture. What is the woman doing in the supermarket?",szh:"第一題，請看圖片。這位女士在超市裡做什麼？",en:"She is carrying a green basket and looking at the shelves.",zh:"女士在超市(supermarket)走道上，手提一個綠色購物籃，眼睛看著貨架，正確。籃子是綠色的，不是紅色；她另一隻手放在身前，沒有伸手從架上拿東西。選 A"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">PRODUCE</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Grapes</td><td style="text-align:right;font-weight:700">$60</td></tr><tr><td style="padding:4px 30px 4px 0">Corn</td><td style="text-align:right;font-weight:700">$30</td></tr><tr><td style="padding:4px 30px 4px 0">Beans</td><td style="text-align:right;font-weight:700">$40</td></tr><tr><td style="padding:4px 30px 4px 0">Apples</td><td style="text-align:right;font-weight:700">$70</td></tr></table></div>`,o:["He will have forty dollars left.","He will have ten dollars left.","He will have seventy dollars left."],a:1,sen:"For question two, look at the picture. Tom has one hundred dollars to spend on produce at the market. He buys grapes and corn. How much will he have left?",szh:"第二題，請看圖片。Tom 有一百元要在市場(market)買農產品(produce)。他買了葡萄和玉米。他還剩多少錢？",en:"He will have ten dollars left.",zh:"價目表上葡萄 60 元、玉米 30 元，一共 90 元，100 減 90 剩 10 元。剩四十元是只買了葡萄、忘記玉米的算法；剩七十元是只買了玉米、忘記葡萄的算法。選 B"},
{n:3,p:0,fig:FACTORY,o:["Many people are waiting in line in front of a factory.","Many new cars are parked in front of a factory.","Only one car is parked in front of a factory."],a:1,sen:"For question three, look at the picture. What can you see in the picture?",szh:"第三題，請看圖片。你在圖中看到什麼？",en:"Many new cars are parked in front of a factory.",zh:"工廠(factory)前面停了一長排新車，正確。車子很多，不是只有一輛；圖中沒有人在排隊。選 B"},
{n:4,p:0,fig:ADSIGN,o:["Two planes are flying in the blue sky.","A plane is sitting on the ground at an airport.","A plane is flying in the blue sky."],a:2,sen:"For question four, look at the picture. What is in this airline advertisement?",szh:"第四題，請看圖片。這則航空公司(airline)廣告(advertisement)裡有什麼？",en:"A plane is flying in the blue sky.",zh:"看板廣告(advertisement)上是一架飛機飛在藍天白雲間，正確。飛機在天上飛，不是停在機場地面；畫面裡只有一架飛機，不是兩架。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Sales Today</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="70" width="44" height="80" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="65" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="96" y="90" width="44" height="60" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="85" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="110" width="44" height="40" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="105" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="228" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="45" font-size="14" font-weight="700" text-anchor="middle">50</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Milk</text><text x="118" y="167" text-anchor="middle">Bread</text><text x="184" y="167" text-anchor="middle">Eggs</text><text x="250" y="167" text-anchor="middle">Fish</text></g></svg>`,o:["It sold sixty.","It sold seventy.","It sold fifty."],a:0,sen:"For question five, look at the picture. The supermarket sold some milk and some eggs today. How many did it sell in all?",szh:"第五題，請看圖片。超級市場(supermarket)今天賣了一些牛奶和一些蛋。它一共賣了多少？",en:"It sold sixty.",zh:"圖中牛奶 40 份、蛋 20 份，加起來 60 份。七十是牛奶加麵包的總數，看錯了項目；五十是魚的數量，不是牛奶加蛋。選 A"},
{n:6,p:1,o:["Have you seen a doctor yet?","Don't cry. It's only a movie.","It's been open since Monday."],a:0,sen:"My throat has been sore since Monday.",szh:"我的喉嚨從星期一就一直痛。",en:"Have you seen a doctor yet?",zh:"對方說喉嚨(throat)從(since)週一痛到現在，關心地問「看過醫生了嗎？」最自然。「從週一就開著」只是重複 since Monday，在講店家；「別哭(cry)，只是電影」與喉嚨痛無關。選 A"},
{n:7,p:1,o:["It's open until ten tonight.","Go south about seventy meters. It's across from the bank.","I bought a fan there last week."],a:1,sen:"Where is the nearest supermarket?",szh:"最近的超市在哪裡？",en:"Go south about seventy meters. It's across from the bank.",zh:"問「哪裡(where)」，答「往南(south)走大約七十(seventy)公尺(meter)，在銀行對面」才是地點。「開到今晚十點」答的是時間；「我上週在那裡買了電風扇(fan)」說的是自己的經驗，沒有告訴對方在哪裡。選 B"},
{n:8,p:1,o:["Yes, it's a very big hall.","Let's talk outside, then.","OK, I'll turn it up for you."],a:1,sen:"The music in this hall is too loud.",szh:"這個大廳裡的音樂太大聲了。",en:"Let's talk outside, then.",zh:"對方抱怨大廳(hall)音樂太大聲(loud)，建議「那我們到外面講」最自然。「是啊，這大廳很大」只重複 hall，沒回應吵的問題；「好，我幫你調大聲」正好和對方要的相反。選 B"},
{n:9,p:1,o:["I think it's clever. People will remember it.","Our company made it last month.","It was on TV last night."],a:0,sen:"What's your opinion of our new advertisement?",szh:"你對我們的新廣告有什麼看法？",en:"I think it's clever. People will remember it.",zh:"問對新廣告(advertisement)的看法(opinion)，答「我覺得(think)很聰明(clever)，大家會記得它」才是在表達意見。「昨晚在電視上播」答的是時間地點；「我們公司(company)上個月做的」答的是誰做、什麼時候做。選 A"},
{n:10,p:1,o:["They're on the same shelf as the milk.","No, I'm not free this afternoon.","Yes. Take one and try it."],a:2,sen:"Are these cookies free samples?",szh:"這些餅乾是免費試吃品嗎？",en:"Yes. Take one and try it.",zh:"問餅乾是不是免費試吃品(sample)，答「是的，拿一塊試試」最自然。「不，我今天下午沒空」把 free 當成「有空」，是同字陷阱；「它們跟牛奶放在同一(same)層架上」答的是位置，沒回答是否免費。選 C"},
{n:11,p:1,o:["I caught a bad cold last week.","Good! I hope they punish him.","No, he isn't a prisoner anymore."],a:1,sen:"Did you hear? The police caught the supermarket thief.",szh:"你聽說了嗎？警察抓到超市的小偷了。",en:"Good! I hope they punish him.",zh:"對方說警察抓到小偷(thief)，回「太好了！希望他們處罰(punish)他」最自然。「我上週得了重感冒」只是重複 caught（抓到／得到）；「他已經不再(anymore)是囚犯(prisoner)了」和剛被抓到的事實矛盾。選 B"},
{n:12,p:1,o:["Really? I'd like to see it work.","Yes, I'll clean it myself.","I clean my room every Sunday."],a:0,sen:"The new robot at the supermarket cleans the floor by itself.",szh:"超市的新機器人會自己(itself)打掃地板。",en:"Really? I'd like to see it work.",zh:"對方說機器人會自己(itself)掃地，回「真的嗎？我想看看它怎麼做」最自然。「我每週日打掃房間」只重複 clean；「好，我自己來掃」好像對方在叫你掃地，答非所問。選 A"},
{n:13,p:1,o:["On Friday afternoon.","In the basement, next to the drinks.","Mr. Lin. He has a fruit farm."],a:2,sen:"Who will supply the fruit for the company party?",szh:"誰會供應公司派對的水果？",en:"Mr. Lin. He has a fruit farm.",zh:"問「誰」會供應(supply)水果，答「林先生，他有一座果園」才是人物。「星期五下午」答的是時間；「在地下室(basement)飲料旁邊」答的是地點。選 C"},
{n:14,p:1,o:["Then let's try the new market on Park Road.","Me, too. I want to go there again.","It's on the south side of the city."],a:0,sen:"I don't want to shop at that department store anymore. There are always too many people.",szh:"我再也不想去那家百貨公司買東西了，人總是太多。",en:"Then let's try the new market on Park Road.",zh:"對方不想再(anymore)去人多的百貨公司(department store)，建議「那我們去公園路新開的市場(market)看看」最自然。「我也是，我想再去一次」前後矛盾；「它在城市南(south)邊」答的是地點，沒回應對方的抱怨。選 A"},
{n:15,p:1,o:["Mr. Wang revised it last night.","They'll sign it next Monday.","The customer wanted a lower price."],a:2,sen:"Why did the company revise the contract?",szh:"公司為什麼修改合約？",en:"The customer wanted a lower price.",zh:"問公司(company)為什麼修改(revise)合約(contract)，答「客戶(customer)想要更低(low)的價格」才是理由。「下週一會簽」答的是時間；「王先生昨晚改的」答的是誰改、何時改，沒說原因。選 C"},
{n:16,p:2,o:["Visit the factory.","Meet him at ten.","Have lunch."],a:2,sen:"W: The customer from Japan gets here at ten. Let's take him to the factory first. &nbsp;M: His plane is late. He won't be here until eleven-thirty. &nbsp;W: Then let's have lunch with him first and visit the factory after that. &nbsp;M: Good idea. &nbsp;Q: What will they do first with the customer?",szh:"女：日本來的客戶(customer)十點到，我們先帶他去工廠(factory)。　男：他的飛機誤點，十一點半才會到。　女：那我們先跟他吃午餐，之後再去參觀工廠。　男：好主意。　問：他們會先和客戶做什麼？",en:"Have lunch.",zh:"原本計畫十點接客戶去工廠(factory)，但飛機誤點、十一點半才到，於是改成先吃午餐再參觀工廠。參觀工廠被改到午餐之後；十點是原本的時間，客戶那時還沒到。選 C"},
{n:17,p:2,o:["A present for the man's brother.","A new pair of shoes for the man.","Going for a run on Friday."],a:0,sen:"W: Did you see Ben's Shop? It has a great deal on shoes this week. &nbsp;M: I did. But I don't need shoes. My old ones are fine. &nbsp;W: Then why do you want to go there? &nbsp;M: My brother's birthday is on Friday. He likes running. &nbsp;W: So you'll buy him a pair? &nbsp;M: Yes. I'll ask the salesperson about his size. &nbsp;Q: What are the speakers talking about?",szh:"女：你看到 Ben 的店了嗎？這週鞋子有很好的特價(deal)。　男：看到了。但我不需要鞋子，我的舊鞋還很好。　女：那你為什麼想去？　男：我哥哥星期五生日。他喜歡跑步。　女：所以你要買一雙給他？　男：對。我會問店員(salesperson)他的尺寸。　問：說話的人在談什麼？",en:"A present for the man's brother.",zh:"男子說自己不需要鞋，是哥哥星期五生日、喜歡跑步，所以要去特價(deal)的店買鞋給哥哥，也就是在談要送哥哥的禮物。給男子自己的新鞋被他明說不需要；星期五只是哥哥的生日，跑步只是哥哥的興趣，不是他們要做的事。選 A"},
{n:18,p:2,o:["He wants his old job back.","He is sad about the lower pay.","He is glad he left."],a:2,sen:"M: I left that giant company last month. &nbsp;W: Really? Didn't you make good money there? &nbsp;M: I did. But I got home after ten every night. &nbsp;W: And now? &nbsp;M: I have my own small business. I make less, but I cook dinner for my kids now. &nbsp;Q: How does the man feel about leaving the giant company?",szh:"男：我上個月離開了那家大(giant)公司。　女：真的嗎？你在那裡不是賺很多錢嗎？　男：是啊。但我每天晚上十點後才到家。　女：那現在呢？　男：我有自己的小生意(business)。我賺得比較少，但我現在會煮晚餐給孩子吃。　問：男士對離開大公司有什麼感覺？",en:"He is glad he left.",zh:"男子說在大公司賺得多、卻每晚十點後才到家；現在自己做小生意(business)，賺得少，但能煮晚餐給孩子吃，語氣是滿意的，所以他很高興離開。他沒有想回去原本的工作；雖然收入變少，但他用「但是」帶出更重要的好處，並不難過。選 C"},
{n:19,p:2,o:["In the basement.","In a supermarket.","In a department store."],a:2,sen:"W: Excuse me, can anybody help me? I'm looking for a coat for my mom. &nbsp;M: Sure. The coats are on the second floor. &nbsp;W: Thanks. Is there a place to eat here, too? &nbsp;M: Yes. The food hall is in the basement, next to the supermarket. &nbsp;W: Great. I'll get the coat first. Then I'll have lunch. &nbsp;Q: Where are the speakers?",szh:"女：不好意思，有人(anybody)可以幫我嗎？我在找一件給我媽媽的外套。　男：當然。外套在二樓。　女：謝謝。這裡也有吃飯的地方嗎？　男：有。美食街在地下室(basement)，就在超級市場(supermarket)旁邊。　女：太好了。我先買外套，再去吃午餐。　問：說話的人在哪裡？",en:"In a department store.",zh:"店員說外套在二樓、美食街和超級市場(supermarket)在地下室(basement)，可見這是有好幾層樓、賣衣服又有美食街的百貨公司(department store)。地下室和超級市場是女子之後才要去的地方，她現在還不在那裡。選 C"},
{n:20,p:2,o:["In Taiwan and Japan.","In Japan.","In Taiwan."],a:1,sen:"W: My uncle's firm makes fans in Taiwan. &nbsp;M: Do they sell them here, too? &nbsp;W: Not now. All of them go to Japan. Their trade with Japan is very good. &nbsp;M: Will they sell them in Taiwan later? &nbsp;W: Maybe next year. &nbsp;Q: Where does the firm sell its fans now?",szh:"女：我叔叔的公司(firm)在台灣(Taiwan)生產電風扇(fan)。　男：他們也在這裡賣嗎？　女：現在沒有，全部都銷往日本，他們跟日本的貿易(trade)很好。　男：以後會在台灣賣嗎？　女：也許明年吧。　問：這家公司現在把電風扇賣到哪裡？",en:"In Japan.",zh:"電風扇在台灣(Taiwan)製造，但現在全部賣到日本。台灣是生產地，「也許明年」才會在台灣賣，所以「在台灣」和「台灣和日本都賣」都不是現在的情況。選 B"},
{n:21,p:2,o:["He has to play basketball tonight.","He can't walk well.","The sale is over."],a:1,sen:"W: The night market has a big sale tonight. Do you want to come? &nbsp;M: I'd love to, but I hurt my leg playing basketball. I can only walk very slowly. &nbsp;W: Oh, I'm sorry. Then I'll buy something for you. &nbsp;Q: Why won't the man go to the market?",szh:"女：夜市(market)今晚大特價，你要來嗎？　男：我很想去，可是我打籃球傷到腿(leg)，只能走得很慢(slow)。　女：喔，真遺憾。那我幫你買點東西。　問：男士為什麼不去市場？",en:"He can't walk well.",zh:"男士打籃球傷到腿(leg)，只能慢慢(slow)走，換句話說就是「他沒辦法好好走路」。特價是今晚才有，沒有結束；打籃球是他受傷的原因，不是今晚要做的事。選 B"},
{n:22,p:2,o:["At eight-forty.","At eight-thirty.","At nine o'clock."],a:0,sen:"W: It's eight-thirty, and the supermarket closes at nine. We have to rush! &nbsp;M: Don't worry. It's only a ten-minute walk. &nbsp;W: OK, but let's leave right now. &nbsp;Q: If they leave now, what time will they get to the supermarket?",szh:"女：現在八點半，超市(supermarket)九點關門，我們得趕快(rush)！　男：別擔心，走路只要十分鐘。　女：好，但我們現在就出發。　問：如果他們現在出發，幾點會到超市？",en:"At eight-forty.",zh:"現在八點半，走路十分鐘，所以八點四十分到。八點半是現在的時間；九點是超市關門的時間。選 A"},
{n:23,p:2,o:["On Saturday morning.","On Saturday afternoon.","On Sunday."],a:1,sen:"W: Let's go to the flower market on Sunday. &nbsp;M: The weather report says it'll rain all day Sunday. Saturday will be sunny, though. &nbsp;W: Then let's go on Saturday. But not in the morning. I have a piano lesson until twelve. &nbsp;Q: When will they go to the flower market?",szh:"女：我們星期天去花市(market)吧。　男：氣象報告說星期天整天下雨，不過星期六是晴天(sunny)。　女：那就星期六去。但早上不行，我鋼琴課上到十二點。　問：他們什麼時候去花市？",en:"On Saturday afternoon.",zh:"星期天會下雨，所以改星期六；星期六早上女士有鋼琴課到十二點，所以是星期六下午去。星期天是原本的計畫；星期六早上她要上課。選 B"},
{n:24,p:2,o:["The food.","The music.","The drinks."],a:2,sen:"M: Our company and Mr. Lee's firm are having a joint party next Friday. &nbsp;W: Who's bringing what? &nbsp;M: We'll bring the food, and his firm will bring the drinks. &nbsp;W: One more question. Who's doing the music? &nbsp;M: My sister. She plays in a band. &nbsp;Q: What will Mr. Lee's firm bring?",szh:"男：我們公司(company)和李先生的公司(firm)下週五要辦聯合(joint)派對。　女：誰帶什麼？　男：我們帶食物，他的公司帶飲料。　女：再問一個問題(question)，音樂誰負責？　男：我妹妹，她在樂團表演。　問：李先生的公司會帶什麼？",en:"The drinks.",zh:"要分清楚誰負責什麼：男士的公司(company)帶食物，李先生的公司(firm)帶飲料，音樂由男士的妹妹負責。食物是男士公司的工作；音樂是妹妹的工作。選 C"},
{n:25,p:2,o:["He ignored the customer.","He asked the other customers to leave.","He called his manager."],a:2,sen:"M: A customer was very loud in our store today. &nbsp;W: What did you do? &nbsp;M: At first, I tried to ignore him. But he started to cause trouble for other customers, so I called my manager. &nbsp;Q: What did the man finally do?",szh:"男：今天店裡有位顧客(customer)非常大聲(loud)。　女：你怎麼處理？　男：一開始我想不理(ignore)他，但他開始給(cause)其他客人找麻煩，所以我打電話找經理。　問：男士最後做了什麼？",en:"He called his manager.",zh:"男士一開始想不理(ignore)顧客，但對方開始干擾其他客人，他最後找了經理。不理他只是一開始的做法；對話沒說他叫其他客人離開。選 C"},
{n:26,p:3,pic:true,o:[BARS("Weekend Customers",["Friday","Saturday","Sunday"],[40,80,60]),BARS("Weekend Customers",["Friday","Saturday","Sunday"],[60,40,80]),BARS("Weekend Customers",["Friday","Saturday","Sunday"],[80,40,60])],a:1,sen:"Our shop counts its customers every weekend. Saturday is usually our busiest day. But last Saturday was very hot, and the fans in our shopping hall were broken, so fewer people came than on Friday. On Sunday, the fans worked again, and we also had a new advertisement in the paper. That day, we had more customers than on Friday. &nbsp;Q: Which chart shows the customers last weekend?",szh:"我們店每個週末都會統計顧客(customer)人數。星期六通常是最忙的一天。但上星期六非常熱，賣場大廳(hall)的電風扇(fan)又壞了，所以來的人比星期五少。星期天電風扇修好了，我們也在報紙上登了新廣告(advertisement)，那天的顧客比星期五多。　問：哪張圖是上週末的顧客人數？",en:"Sunday most, Friday second, Saturday fewest.",zh:"上週六人比週五少，週日人比週五多，所以週日最多、週五第二、週六最少。週六最高的那張是「平常」的情形，不是上週末；週五最高的那張與「週日比週五多」矛盾。選 B"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"At the supermarket, the manager gave free samples to every customer. Mrs. Chen tried a small piece of cheese first, but she does not eat much cheese. Then she drank some hot soup, but she did not like the taste. Last, she ate a piece of orange, and she liked it so much that she put two bags of oranges into her basket. &nbsp;Q: What did Mrs. Chen taste last?",szh:"在超市(supermarket)裡，經理請每位顧客(customer)免費試吃。陳太太先試了一小塊起司，但她不太吃起司。然後她喝了一點熱湯，但她不喜歡那個味道。最後她吃了一塊橘子，她太喜歡了，還把兩袋橘子放進籃子裡。　問：陳太太最後試吃了什麼？",en:"A piece of orange.",zh:"陳太太先吃起司、再喝熱湯，這兩樣都是前面試的；題目問的是「最後」，她最後吃的是橘子，還買了兩袋，所以答案是橘子。 選 B"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:0,sen:"My aunt has worked in the shoe industry for twenty years. Today, she writes advertisements for a big shoe company. But that was not her first job. When she was young, she made shoes in a factory. After that, she sold shoes to customers in a department store, and she still says that was her best job. &nbsp;Q: What was the aunt's first job?",szh:"我阿姨在製鞋業(industry)工作了二十年。現在她替一家大鞋子公司(company)寫廣告(advertisement)，但那不是她的第一份工作。她年輕時在工廠(factory)做鞋子，之後在百貨公司(department store)賣鞋給顧客(customer)，她到現在還說那是她最好的工作。　問：阿姨的第一份工作是什麼？",en:"She made shoes in a factory.",zh:"要聽清楚順序：年輕時在工廠(factory)做鞋是第一份工作，之後在百貨公司賣鞋，現在寫廣告。寫廣告是現在的工作；賣鞋是她「最喜歡」的工作，不是第一份。選 A"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29a'),PH('q29b')],a:2,sen:"Mr. Chen sells fruit at the market. In winter, people usually buy his strawberries the most. But this year, the cold weather killed many of his strawberries, and wild birds ate the rest. He wanted to sell bananas from the south, but this month they are neither cheap nor fresh. So now he is selling oranges from his own farm. &nbsp;Q: What is Mr. Chen selling at the market now?",szh:"陳先生在市場(market)賣水果。冬天大家通常最常買他的草莓。但今年寒冷的天氣凍死(kill)了很多草莓，剩下的又被野(wild)鳥吃掉。他想賣南部(south)來的香蕉，但這個月香蕉既不便宜也(nor)不新鮮。所以他現在賣自己農場的柳橙。　問：陳先生現在在市場賣什麼？",en:"Oranges.",zh:"草莓被寒流凍死(kill)、又被野(wild)鳥吃光，沒得賣；香蕉他只是想賣，但不便宜也不(nor)新鮮，沒進貨；現在賣的是自家農場的柳橙。選 C"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30b'),PH('q30c')],a:0,sen:"My sister's birthday is next week, and I have a secret gift for her. Last weekend, I bought her a gray sweater. Then I saw a short black coat she would love, but the store didn't have her size. I also thought about a long red coat, but she never wears red. So the sweater is still my gift. &nbsp;Q: What will the speaker give the sister?",szh:"我姊姊下週生日，我替她準備了一份祕密(secret)禮物。上週末我買了一件灰色毛衣給她。後來我看到一件她會很喜歡的黑色短(short)外套，但店裡沒有她的尺寸。我也想過(thought)一件紅色長外套，但她從不穿紅色。所以禮物還是那件毛衣。　問：說話者會送姊姊什麼？",en:"A gray sweater.",zh:"毛衣是上週末就買好的；黑色短(short)外套沒有她的尺寸，買不到；紅色長外套因為她從不穿紅色而放棄，所以禮物還是灰色毛衣。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 15 回　買賣與商店　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
