<title>GEPT 初級 聽力測驗　第25回　看醫生</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#fff5ec,#fff9f4 70%);color:#22303f;line-height:1.6;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#f6d365,#fda085 60%,#ff7a9c);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(253,160,133,.35);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.14);}
  header.top p{margin:0;font-size:.92rem;opacity:.96;}
  .meta{margin-top:14px;font-size:.86rem;background:rgba(255,255,255,.24);
    padding:9px 13px;border-radius:10px;}
  .notice{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;
    padding:11px 15px;margin-bottom:14px;font-size:.86rem;color:#78350f;
    display:flex;align-items:flex-start;gap:9px;line-height:1.55;}
  .notice .ic{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#fff5ec 70%,rgba(255,245,236,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.9rem;
    box-shadow:0 4px 12px rgba(253,160,133,.14);}
  .bar .track{flex:1;height:9px;background:#f1e4dc;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#ffb02e,#ff7a59);transition:width .35s;}
  .bar #count{font-weight:700;color:#e0740a;}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#43cea2,#3ab0d6);}
  .section-desc{font-size:.86rem;color:var(--gray);margin:0 4px 10px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(253,160,133,.09);}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .qhead .num{display:inline-block;color:#fff;background:var(--coral);font-weight:700;
    border-radius:8px;padding:1px 10px;font-size:.92rem;}
  .play{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
    color:#fff;font-weight:800;font-size:.92rem;border-radius:22px;padding:8px 16px;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);box-shadow:0 4px 12px rgba(255,93,143,.3);}
  .play:active{transform:translateY(1px);}
  .play.playing{background:linear-gradient(135deg,#22b573,#1a9e63);}
  .play .wave{font-size:.8rem;opacity:.9;}
  .hintq{font-size:.8rem;color:var(--gray);}
  .fig{text-align:center;margin:4px 0 12px;}
  .fig svg{max-width:100%;height:auto;}
  .pic-img{border-radius:9px;border:1px solid #e6ded7;object-fit:cover;}
  .fig .pic-img{max-width:230px;width:100%;max-height:150px;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:.95rem;background:#fbfdff;}
  .opt:hover{border-color:var(--coral);background:#fff4ee;}
  .opt input{margin-top:3px;accent-color:var(--coral);}
  .opt .lab{font-weight:800;color:var(--coral);min-width:18px;}
  .opt.sel{border-color:var(--coral);background:#ffeee6;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .opt.listen .otext{display:none;}
  .opt.listen.lock .otext{display:inline;}
  .opt.listen .lab{font-size:1.05rem;}
  /* picture options (Part 4) */
  .picopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0;}
  .picopt{border:2px solid var(--line);border-radius:12px;padding:9px 6px;cursor:pointer;
    text-align:center;transition:.15s;background:#fbfdff;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .picopt:hover{border-color:var(--coral);background:#fff4ee;}
  .picopt.sel{border-color:var(--coral);background:#ffeee6;}
  .picopt.correct{border-color:var(--green);background:var(--green-bg);}
  .picopt.wrong{border-color:var(--red);background:var(--red-bg);}
  .picopt .lab{font-weight:800;color:var(--coral);align-self:flex-start;margin-left:4px;}
  .picopt.correct .lab{color:var(--green);}.picopt.wrong .lab{color:var(--red);}
  .picopt img.pic-img{width:100%;height:82px;}
  .picopt svg{width:100%;max-width:132px;height:auto;}
  .picopt svg.chart{max-width:100%;}
  .legend{display:flex;gap:12px;justify-content:center;font-size:.72rem;margin:2px 0 6px;color:#556;flex-wrap:wrap;}
  .legend i{display:inline-block;width:11px;height:11px;border:1px solid #999;margin-right:4px;vertical-align:-1px;}
  table.mini{border-collapse:collapse;font-size:.62rem;margin:0 auto;}
  table.mini th{background:#33414f;color:#fff;padding:2px 4px;}
  table.mini td{border:1px solid #bbb;padding:2px 4px;text-align:center;}
  .board{background:#111;color:#ffd24a;border-radius:5px;padding:5px;font-family:"Courier New",monospace;display:inline-block;}
  .board table{border-collapse:collapse;font-size:.6rem;color:#ffd24a;}
  .board th{color:#7fd7ff;padding:1px 4px;border-bottom:1px solid #444;}
  .board td{padding:1px 4px;text-align:center;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.9rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:.8rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .scriptbox{background:#f4f8ff;border-radius:8px;padding:7px 11px;margin:5px 0;font-size:.88rem;color:#20364d;}
  .exp .scriptbox b{color:var(--blue-dark);}
  .exp .en{color:#1c4f7a;background:#eef7ff;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .exp .zh{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff9f4 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--coral);border:2px solid var(--coral);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#ffb02e,#ff7a59,#ff5d8f);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(255,122,89,.18);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#ff7a59,#ff5d8f);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:.95rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:.95rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:.85rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:.8rem;margin:24px 0;}
.fig .p0img{max-width:440px;max-height:330px;width:100%;height:auto;}
</style>

<script>
/* ====== 圖形素材（第25回 看醫生） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/25/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const DOCTOR=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q1.jpg" alt="question 1 picture">`;
const HOSPITAL=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q2.jpg" alt="question 2 picture">`;
const AMBULANCE=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q3.jpg" alt="question 3 picture">`;
const PILLS=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q4.jpg" alt="question 4 picture">`;
const BANDAGE=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q5.jpg" alt="question 5 picture">`;
/* ====== 大題 ====== */
const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];



/* ====== 題庫（第25回 看醫生） ====== */
const Q=[
{n:1,p:0,fig:DOCTOR,o:["A cook in a white coat.","A doctor in a white coat.","A teacher in a white coat."],a:1,sen:"For question one, look at the picture. Who is this person?",szh:"第一題，請看圖片。這個人是誰？",en:"A doctor in a white coat.",zh:"圖中是穿白袍的醫生(doctor)，選 B。廚師和老師也可能穿白袍，但不是圖中的人。"},
{n:2,p:0,fig:HOSPITAL,o:["To the hospital for treatment.","To the library for books.","To the airport for a trip."],a:0,sen:"For question two, look at the picture. Where do ill people go?",szh:"第二題，請看圖片。生病的人去哪裡？",en:"To the hospital for treatment.",zh:"生病(ill)的人去醫院(hospital)接受治療(treatment)，選 A。圖書館和機場不是看病的地方。"},
{n:3,p:0,fig:AMBULANCE,o:["A fire truck with its lights on.","A police car with its lights on.","An ambulance with its lights flashing."],a:2,sen:"For question three, look at the picture. What is coming fast?",szh:"第三題，請看圖片。什麼快速駛來？",en:"An ambulance with its lights flashing.",zh:"閃著燈快速駛來的是救護車(ambulance)，選 C。消防車和警車也閃燈，但不是圖中的車。"},
{n:4,p:0,fig:PILLS,o:["A glass of cold juice.","Some drugs and a shot.","A plate of fried chicken."],a:1,sen:"For question four, look at the picture. What helps cure the illness?",szh:"第四題，請看圖片。什麼能治好病？",en:"Some drugs and a shot.",zh:"藥(drug)和打針(shot)能治好(cure)病，選 B。果汁和炸雞不能治病。"},
{n:5,p:0,fig:BANDAGE,o:["A white bandage over a wound.","A silver watch on his wrist.","A red bracelet with small beads."],a:0,sen:"For question five, look at the picture. What is on his arm?",szh:"第五題，請看圖片。他手臂上是什麼？",en:"A white bandage over a wound.",zh:"他手臂上有蓋住傷口(wound)的白繃帶，選 A。手錶和手環不是圖中的東西。"},

{n:6,p:1,o:["It's simple. Put it in the sun.","It's a vegetable from my uncle.","Look at the sky. It may rain."],a:0,sen:"How do I grow this vegetable easily?",szh:"這種菜要怎麼輕鬆種？",en:"It's simple. Put it in the sun.",zh:"問怎麼輕鬆種菜，答『很簡單(simple)，把它放(put)在太陽下』，選 A。來自叔叔和看天空(sky)都沒回答怎麼種。"},
{n:7,p:1,o:["On the desk by the window.","Ask that guy by the door.","I think it's hers, not mine."],a:2,sen:"Whose eraser did you find on the desk?",szh:"你在桌上找到的橡皮擦是誰的？",en:"I think it's hers, not mine.",zh:"問橡皮擦(eraser)是誰的，答『我想是她的(hers)，不是我的』，選 C。放在窗邊桌上是地點；問那個人(guy)沒給答案。"},
{n:8,p:1,o:["Yes, although my arm still hurts.","The game starts at three.","I bought a dozen new balls."],a:0,sen:"Can you still play in the game today?",szh:"你今天還能上場比賽嗎？",en:"Yes, although my arm still hurts.",zh:"問今天還能不能比賽，答『能，雖然(although)手臂還在痛(hurt)』，選 A。三點開始和買了一打(dozen)球都沒回答。"},
{n:9,p:1,o:["Every Saturday morning at nine.","About twenty people come each week.","At the park, near the big tree."],a:2,sen:"Where does your outdoor club meet?",szh:"你們的戶外社團在哪裡集合？",en:"At the park, near the big tree.",zh:"問社團(club)在哪裡集合，答『在公園大樹旁』，選 C。每週六早上是時間；每週(each)二十人是人數，都不是地點。"},
{n:10,p:1,o:["Just put a stamp on it.","It weighs about five kilograms.","It's too heavy to lift."],a:0,sen:"How should I send this heavy parcel?",szh:"這件重的包裹我該怎麼寄？",en:"Just put a stamp on it.",zh:"問怎麼寄包裹，答『貼(put)上郵票(stamp)就好』，選 A。重量和太重抬(lift)不動都沒回答怎麼寄。"},
{n:11,p:1,o:["A red star in the center.","A silver symbol of a lion.","A tall branch with five leaves."],a:1,sen:"What is on the old team flag?",szh:"那面舊隊旗上有什麼？",en:"A silver symbol of a lion.",zh:"問旗上有什麼，答『一個銀色(silver)的獅子符號(symbol)』，選 B。紅星和樹枝(branch)是別種圖案，不符合。"},
{n:12,p:1,o:["We'll put the pile in a truck.","The yard is behind the school.","It looks like a monster, doesn't it?"],a:0,sen:"How will you clear all that mess in the garden?",szh:"你要怎麼清理花園那堆亂七八糟的東西？",en:"We'll put the pile in a truck.",zh:"問怎麼清理那堆雜物，答『我們把那堆(pile)東西放上卡車』，選 A。院子(yard)的位置是地點；像怪物(monster)只是感想。"},
{n:13,p:1,o:["At a gym near my office.","I stay at home on weekends.","I eat lettuce at brunch every day."],a:2,sen:"How do you stay so healthy?",szh:"你怎麼保持這麼健康？",en:"I eat lettuce at brunch every day.",zh:"問怎麼保持健康，答『我每天早午餐(brunch)吃生菜(lettuce)』，選 C。健身房在哪、週末待家都不是保持健康的方法。"},
{n:14,p:1,o:["I'll ask the class monitor.","Yes, it's democratic. We all voted.","The rule starts next Monday."],a:1,sen:"Do you think the new class rule is fair?",szh:"你覺得新的班規公平嗎？",en:"Yes, it's democratic. We all voted.",zh:"問班規是否公平，答『是，很民主(democratic)，大家都投票了』，選 B。問班長和下週一開始都沒回答是否公平。"},
{n:15,p:1,o:["She works at a big hospital.","She treats many cancer patients.","She's from Kaohsiung, I think."],a:2,sen:"Where does the famous doctor come from?",szh:"那位有名的醫生來自哪裡？",en:"She's from Kaohsiung, I think.",zh:"問醫生來自哪裡，答『我想她來自高雄(Kaohsiung)』，選 C。在大醫院(hospital)工作和治療(treat)癌症(cancer)病人(patient)都沒回答出身地。"},

{n:16,p:2,o:["A dentist.","A doctor.","A teacher."],a:1,sen:"W: Why were you at the clinic this morning? &nbsp;M: My chest hurt, so a woman in a white coat listened to it and gave me some medicine. &nbsp;W: I hope you feel better. &nbsp;Q: Who did the man see?",szh:"女：你今天早上為什麼去診所？　男：我胸口痛(hurt)，所以一位穿白袍的女士聽了我的胸口，還給了我一些藥。　女：希望你好一點。　問：男士看了誰？",en:"A doctor.",zh:"穿白袍、聽他的胸口並給藥的是醫生(doctor)，選 B。牙醫看牙齒，不會聽胸口。"},
{n:17,p:2,o:["At school.","At the hospital.","At home."],a:1,sen:"W: Where is your grandmother now? &nbsp;M: At the hospital, getting good treatment for her leg. &nbsp;W: I hope she feels better. &nbsp;Q: Where is the grandmother?",szh:"女：你奶奶現在在哪？　男：在醫院(hospital)，為她的腿接受良好的治療(treatment)。　女：希望她好轉。　問：奶奶在哪？",en:"At the hospital.",zh:"奶奶在醫院(hospital)為腿接受治療(treatment)，選 B。學校和家裡都不是。"},
{n:18,p:2,o:["A taxi.","A fire truck.","An ambulance."],a:2,sen:"M: Why was there so much noise on the street? &nbsp;W: A man fell off his bike and could not stand up. A white car with a loud siren came quickly. &nbsp;M: I hope he is okay. &nbsp;Q: What came to help the man?",szh:"男：街上為什麼這麼吵？　女：一個男人從腳踏車摔下來，站(stand)不起來。一輛響著警笛的白色車子很快就來了。　男：希望他沒事。　問：什麼來幫助那個男人？",en:"An ambulance.",zh:"一個人從腳踏車摔下無法站起來，來的是有警笛的白色車，也就是救護車(ambulance)，選 C。計程車和消防車不是運送傷者的白車。"},
{n:19,p:2,o:["A long rest.","A hot bath.","Some new medicine."],a:2,sen:"W: Will my father get well? &nbsp;M: Yes. The doctor says he should take one new pill every day. &nbsp;W: What great news. &nbsp;Q: What will help the father?",szh:"女：我爸爸會好起來嗎？　男：會。醫生說他每天該吃一顆新藥丸。　女：真是好消息。　問：什麼會幫助爸爸？",en:"Some new medicine.",zh:"醫生說他每天吃一顆新藥丸就會好，所以幫助他的是新藥(drug)，選 C。休息和泡澡沒被提到。"},
{n:20,p:2,o:["At the playground.","At the hospital.","At home."],a:0,sen:"M: Where is your little brother playing? &nbsp;W: At the playground with his friends after school. &nbsp;M: Sounds fun. &nbsp;Q: Where is the brother playing?",szh:"男：你弟弟在哪玩？　女：放學後在遊樂場(playground)和朋友玩。　男：聽起來很好玩。　問：弟弟在哪玩？",en:"At the playground.",zh:"弟弟放學後在遊樂場(playground)玩，選 A。醫院和家裡都不是。"},
{n:21,p:2,o:["He is on a trip.","He is sick at home.","He is late today."],a:1,sen:"W: Why is Tom's seat empty today? &nbsp;M: His mother called. He has a high fever and cannot get out of bed. &nbsp;W: Poor boy. &nbsp;Q: Why isn't Tom in school?",szh:"女：湯姆的座位今天為什麼是空的？　男：他媽媽打電話來。他發高(high)燒，下不了床。　女：可憐的孩子。　問：湯姆為什麼沒來學校？",en:"He is sick at home.",zh:"湯姆發高(high)燒、下不了床，所以是生病(sick)在家，選 B。旅行和遲到都和發燒無關。"},
{n:22,p:2,o:["A bandage.","A flu shot.","Some pills."],a:1,sen:"M: How was your visit to the clinic? &nbsp;W: The needle hurt for a second, but the nurse said it will keep me from getting the flu. &nbsp;M: That is good. &nbsp;Q: What did the woman get?",szh:"男：你去診所還好嗎？　女：針頭痛了一下，不過護士說這樣就不會得流感。　男：那很好。　問：女士得到了什麼？",en:"A flu shot.",zh:"針頭痛了一下，護士說可以防止得流感，這是打了流感針(shot)，選 B。繃帶和藥丸都沒提到。"},
{n:23,p:2,o:["Lettuce and a potato.","Only fried meat.","Just rice and candy."],a:0,sen:"W: What healthy food did the doctor suggest? &nbsp;M: Fresh lettuce and a baked potato each day. &nbsp;W: Simple and healthy. &nbsp;Q: What food did the doctor suggest?",szh:"女：醫生建議什麼健康食物？　男：每天新鮮生菜(lettuce)和一顆烤馬鈴薯(potato)。　女：簡單又健康。　問：醫生建議什麼食物？",en:"Lettuce and a potato.",zh:"醫生建議每天吃新鮮生菜(lettuce)和烤馬鈴薯(potato)，選 A。只吃肉或只吃飯都不對。"},
{n:24,p:2,o:["A school teacher.","A businessperson.","A famous doctor."],a:1,sen:"M: Who is giving the health talk today? &nbsp;W: A woman who runs a big company. She wants to adopt a healthy plan for her workers. &nbsp;M: That is useful. &nbsp;Q: Who is giving the talk?",szh:"男：今天誰要做健康講座？　女：一位經營大公司的女士。她想為員工採用(adopt)一個健康計畫。　男：很實用。　問：誰要做這場講座？",en:"A businessperson.",zh:"經營大公司、想為員工採用(adopt)健康計畫的人是商人(businessperson)，選 B。醫生看起來很搭但沒被提到。"},
{n:25,p:2,o:["A bad headache.","A small cough.","A high fever."],a:2,sen:"W: Why did you go to the doctor? &nbsp;M: I was shaking and sweating all night, and my forehead was very hot. &nbsp;W: You should rest now. &nbsp;Q: Why did the man see the doctor?",szh:"女：你為什麼去看醫生？　男：我整晚(night)發抖、流汗，額頭很燙。　女：你現在該休息。　問：男士為什麼去看醫生？",en:"A high fever.",zh:"整晚(night)發抖、流汗、額頭很燙，是發高(high)燒，選 C。頭痛和咳嗽沒有線索。"},

{n:26,p:3,pic:true,o:[BARS("Patients",["Mon","Wed","Fri"],[80,50,20]),BARS("Patients",["Mon","Wed","Fri"],[50,80,20]),BARS("Patients",["Mon","Wed","Fri"],[20,50,80])],a:0,sen:"Our hospital counted the number of patients each day. On Monday the most people came, many with the winter flu, which can affect anyone. On Wednesday the number was in the middle, and by Friday the fewest came for treatment. So the Monday bar should be the tallest. &nbsp;Q: Which chart shows the number of patients?",szh:"我們醫院(hospital)統計每天的病人(patient)數。星期一最多，很多人得冬季流感，這種病會影響(affect)任何人；星期三中等；到星期五最少人來治療(treatment)。所以星期一長條最高。　問：哪張圖顯示病人人數？",en:"Monday most, Friday fewest.",zh:"週一最多、逐日下降，符合『週一最高』的圖，選 A。週三排中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Sick Days",["Jan","Feb","Mar"],[80,55,30]),BARS("Sick Days",["Jan","Feb","Mar"],[30,55,80]),BARS("Sick Days",["Jan","Feb","Mar"],[55,80,30])],a:0,sen:"Our school recorded the sick days of students. In January the most students were ill, because of the cold. In February the number was in the middle, and by March the fewest were sick, as the weather warmed. Luckily, the sick days did not conflict with the exams. So the sick days went down each month. &nbsp;Q: Which chart shows the sick days?",szh:"我們學校記錄學生的病假天數。一月最多人生病(ill)，因為天冷；二月中等；到三月最少人生病(sick)，因為天氣變暖。幸好病假沒和考試衝突(conflict)。所以病假天數逐月下降。　問：哪張圖顯示病假天數？",en:"Jan most, Mar fewest.",zh:"一月最多、逐月下降，符合『一月最高、三月最低』的圖，選 A。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:2,sen:"When my father was sick in the hospital, the food there was very plain. His belt was loose, but he wanted to throw the soft noodles and dry rice on the tray away. So my mother brought him some fresh bread, which he ate happily while he waited for his treatment. He looked forward to going home. &nbsp;Q: What did the mother bring the father?",szh:"我爸爸在醫院(hospital)生病(sick)時，那裡的食物很清淡。他的皮帶(belt)都鬆了，卻想把餐盤上的軟麵和乾飯丟(throw)掉。所以媽媽帶新鮮麵包(bread)給他，他一邊等治療(treatment)一邊開心地吃。他期待(forward)回家。　問：媽媽帶了什麼給爸爸？",en:"Fresh bread.",zh:"媽媽帶了麵包(bread)，選 C。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:2,sen:"After the doctor cured my grandmother, our whole family gathered to celebrate. She was tired of the plain bread and dry rice she ate at the hospital. We let her select the meal, and she said only warm noodles would make her feel human again. So we cooked her a big bowl at home. &nbsp;Q: What did the family cook for grandmother?",szh:"醫生治好(cure)奶奶後，全家聚在一起慶祝。她受夠了在醫院吃的普通麵包和乾飯。我們讓她選(select)餐點，她說只有熱麵才能讓她重新覺得像個人(human)。所以我們在家為她煮了一大碗麵(noodle)。　問：家人為奶奶煮了什麼？",en:"A bowl of noodles.",zh:"家人煮了熱麵(noodle)，選 C。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('beach'),IMG('park')],a:1,sen:"After a long illness, the doctor told my good-looking uncle to rest somewhere calm. His hip still hurt, so he wanted a quiet region. My aunt liked the mountain and my cousin liked the park. But he chose the beach, because the fresh sea air and gentle waves helped his body heal and lifted his mood. &nbsp;Q: Where did the uncle go to rest?",szh:"久病(ill)之後，醫生(doctor)要我那位好看(good-looking)的叔叔去安靜的地方休養。他的臀部(hip)還在痛，所以想去安靜的地區(region)。阿姨喜歡山，表弟喜歡公園，但他選了海邊(beach)，因為新鮮海風和輕柔海浪幫助他的身體康復、振奮心情。　問：叔叔去哪裡休養？",en:"The beach.",zh:"叔叔去海邊(beach)休養，選 B。山、公園為干擾。"}
];

/* ====== 音檔播放（AAC/.m4a，各廠牌手機皆支援）====== */
let curAudio=null, curBtn=null;
function resetPlayBtn(b){ if(!b) return; b.classList.remove('playing'); b.querySelector('.txt').textContent = b.dataset.played?'重播':'播放'; }
function stopAudio(){ if(curAudio) curAudio.pause(); if(curBtn) resetPlayBtn(curBtn); curAudio=null; curBtn=null; }
function playAudio(audio,btn){
  if(curAudio===audio){                       // 同一題：暫停 / 繼續
    if(audio.paused){ audio.play(); btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…'; }
    else { audio.pause(); }
    return;
  }
  if(curAudio){ curAudio.pause(); resetPlayBtn(curBtn); }   // 換題：停掉上一段
  curAudio=audio; curBtn=btn; btn.dataset.played='1';
  btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…';
  audio.play().catch(()=>resetPlayBtn(btn));
}

/* ====== 產生畫面 ====== */
const form=document.getElementById('quiz');
let lastP=-1;
Q.forEach(q=>{
  if(q.p!==lastP){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].t;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].d;
    form.appendChild(st); form.appendChild(sd); lastP=q.p;
  }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const head=document.createElement('div'); head.className='qhead';
  head.innerHTML=`<span class="num">${q.n}</span>
    <button type="button" class="play"><span class="wave">🔊</span><span class="txt">播放</span></button>
    <span class="hintq">聆聽後作答</span>`;
  card.appendChild(head);
  const audio=document.createElement('audio'); audio.preload='none'; audio.src='gept-listening-audio/25/q'+q.n+'.m4a?v=r25p0c-20261003'; card.appendChild(audio);
  const pbtn=head.querySelector('.play');
  pbtn.addEventListener('click',()=>playAudio(audio,pbtn));
  audio.addEventListener('ended',()=>{ if(curBtn===pbtn){ resetPlayBtn(pbtn); curAudio=null; curBtn=null; } });
  audio.addEventListener('pause',()=>{ if(curAudio===audio && curBtn===pbtn && !audio.ended){ pbtn.classList.remove('playing'); pbtn.querySelector('.txt').textContent='繼續'; } });
  if(q.fig){ const f=document.createElement('div'); f.className='fig'; f.innerHTML=q.fig; card.appendChild(f); }
  if(q.pic){
    if(q.legend){ const lg=document.createElement('div'); lg.innerHTML=PIE_LEGEND; card.appendChild(lg.firstChild); }
    const wrap=document.createElement('div'); wrap.className='picopts';
    q.o.forEach((opt,i)=>{
      const cell=document.createElement('label'); cell.className='picopt'; cell.dataset.i=i;
      cell.innerHTML=`<span class="lab">${'ABC'[i]}</span>${opt}<input type="radio" name="q${q.n}" value="${i}" hidden>`;
      cell.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.picopt').forEach(o=>o.classList.remove('sel')); cell.classList.add('sel'); updateProgress(); });
      wrap.appendChild(cell);
    });
    card.appendChild(wrap);
  } else {
    q.o.forEach((opt,i)=>{
      const lab=document.createElement('label'); lab.className=(q.p===0?'opt listen':'opt'); lab.dataset.i=i;
      lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABC'[i]}</span><span class="otext">${opt}</span>`;
      lab.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); lab.classList.add('sel'); updateProgress(); });
      card.appendChild(lab);
    });
  }
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n; card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
const TOT=Q.length;
function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOT}`;
  document.getElementById('fill').style.width=(c/TOT*100)+'%';
  hint.textContent = c===TOT ? '已完成全部 30 題' : (c===0 ? '尚未作答任何題目（仍可送出查看解析）' : `已作答 ${c} 題，未作答 ${TOT-c} 題（仍可送出）`);
}

submitBtn.addEventListener('click',()=>{
  stopAudio();
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick=sel?parseInt(sel.value):null;
    if(pick===null) blank++;
    const card=document.getElementById('q'+q.n);
    const cls=q.pic?'.picopt':'.opt';
    card.querySelectorAll(cls).forEach(o=>{
      o.classList.add('lock');
      const inp=o.querySelector('input'); if(inp) inp.disabled=true;
      const i=parseInt(o.dataset.i);
      if(i===q.a) o.classList.add('correct');
      if(pick!==null && i===pick && pick!==q.a) o.classList.add('wrong');
    });
    const correct=pick===q.a; if(correct) ok++;
    const exp=document.getElementById('exp'+q.n);
    const tag=correct?'答對':(pick===null?'未作答':'答錯');
    exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABC'[q.a]}</span>
      <div class="scriptbox"><b>聽力原文</b>　${q.sen}<br><span style="color:#7a4a12">${q.szh}</span></div>
      <div class="en"><b>EN</b>&nbsp;${q.en}</div><div class="zh"><b>中</b>&nbsp;${q.zh}</div>`;
    exp.classList.add('show');
  });
  document.getElementById('scoreNum').textContent=Math.round(ok/TOT*120);
  document.getElementById('scoreTxt').textContent=`／120 分　${Math.round(ok/TOT*120)>=80?'達參考通過線 ✅':'未達通過線（80）'}（答對 ${ok}／${TOT} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOT-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  try{
    var _m=location.pathname.match(/gept-listening-(\d+)\.html/);
    var _round=_m?parseInt(_m[1]):0;
    var _ans=Q.map(function(q){var s=form.querySelector('input[name="q'+q.n+'"]:checked');var pk=s?parseInt(s.value):null;return {n:q.n,p:q.p,pick:pk,a:q.a,ok:pk===q.a};});
    var _rec={round:_round,date:new Date().toISOString(),score:Math.round(ok/TOT*120),total:TOT,correct:ok,blank:blank,ans:_ans};
    var _K='efetl_listening_results';
    var _all=JSON.parse(localStorage.getItem(_K)||'[]');
    _all.push(_rec);
    localStorage.setItem(_K,JSON.stringify(_all.slice(-800)));
    if(window.EFETL_CLOUD){EFETL_CLOUD.upload(_rec);}
  }catch(_e){}
  const res=document.getElementById('result'); res.classList.add('show');
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  stopAudio(); form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt,.picopt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');const inp=o.querySelector('input');if(inp)inp.disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress(); window.scrollTo({top:0,behavior:'smooth'});
});

updateProgress();
</script>
</body>
</html>
