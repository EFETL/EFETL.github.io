<div class="bar">
 <b>🖨 第 23 回　閱讀寫作與旅行　聽力測驗　列印版</b>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第23回 閱讀寫作與旅行） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/23/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/23/p3_${n}.jpg?v=r23qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const NOVEL=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q1.jpg" alt="question 1 picture">`;
const DICTIONARY=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q2.jpg" alt="question 2 picture">`;
const HOTEL=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q3.jpg" alt="question 3 picture">`;
const TENT=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q4.jpg" alt="question 4 picture">`;
const BOARD=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:NOVEL,o:["She is sitting on the floor and reading a thick book.","She is sitting on a sofa and writing a poem.","She is sitting on a sofa and reading a thick book."],a:2,sen:"For question one, look at the picture. What is the woman doing?",szh:"第一題，請看圖片。這位女士在做什麼？",en:"She is sitting on a sofa and reading a thick book.",zh:"她坐(sit)在灰色沙發上，雙手捧著一本厚厚的書在讀，正確。她坐的是沙發，不是地板；她是在看書，手上沒有筆，不是在寫詩(poem)。選 C"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">HOTEL PRICES</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Room</td><td style="text-align:right;font-weight:700">$600</td></tr><tr><td style="padding:4px 30px 4px 0">Bus tour</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Dinner</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Breakfast</td><td style="text-align:right;font-weight:700">$100</td></tr></table></div>`,o:["He will have four hundred dollars left.","He will have two hundred dollars left.","He will have one hundred dollars left."],a:2,sen:"For question two, look at the picture. Ken has one thousand dollars. He pays for a room and the bus tour. How much will he have left?",szh:"第二題，請看圖片。Ken 有一千元。他付了房間和巴士觀光行程(tour)的錢。他還剩多少錢？",en:"He will have one hundred dollars left.",zh:"價目表上房間600元、巴士觀光行程(tour)300元，一共900元，1000減900剩100元。剩四百元是只付了房間600元的算法；剩兩百元是把房間加晚餐800元當成他付的錢，看錯項目。選 C"},
{n:3,p:0,fig:HOTEL,o:["They are standing at the front desk without any bags.","They are standing at the front desk with their bags.","They are sitting on a sofa with their bags."],a:1,sen:"For question three, look at the picture. What are the two visitors doing?",szh:"第三題，請看圖片。這兩位訪客(visitor)在做什麼？",en:"They are standing at the front desk with their bags.",zh:"一男一女站在旅館櫃台前，身邊有行李箱、肩上有包包，正確。他們有帶行李，不是「沒帶任何包包」；坐在後面沙發上的是別人，這兩位訪客是站著的。選 B"},
{n:4,p:0,fig:TENT,o:["A tent, and a blue box on the table.","A tent, and a blue box under the table.","Two tents, and a blue box on the table."],a:0,sen:"For question four, look at the picture. What can you see at the camp?",szh:"第四題，請看圖片。營地(camp)上可以看到什麼？",en:"A tent, and a blue box on the table.",zh:"營地(camp)上有一頂帳篷，旁邊木桌上放著一個藍色箱子，正確。桌子底下是黑色袋子，藍色箱子在桌上不在桌下；圖中只有一頂帳篷，不是兩頂。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Tour Visitors</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="121" width="44" height="29" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="116" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="96" y="79" width="44" height="71" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="74" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="162" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="45" font-size="14" font-weight="700" text-anchor="middle">70</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Monday</text><text x="118" y="167" text-anchor="middle">Tuesday</text><text x="184" y="167" text-anchor="middle">Thursday</text></g></svg>`,o:["There were fifty more.","There were twenty more.","There were ninety more."],a:1,sen:"For question five, look at the picture. The chart shows the visitors on the bus tour. How many more visitors came on Thursday than on Tuesday?",szh:"第五題，請看圖片。圖表顯示巴士觀光行程(tour)的訪客(visitor)人數。星期四(Thursday)來的訪客比星期二多多少人？",en:"There were twenty more.",zh:"圖中星期四70人、星期二50人，70減50多20人。多五十人是只看了星期二的數字；多九十人是把70和20加在一起，加錯了。選 B"},
{n:6,p:1,o:["Why don't you give him a dictionary?","He spelled every word right.","English is my favorite language."],a:0,sen:"My little brother keeps asking me how to spell English words.",szh:"我弟弟一直問我英文(English)單字(word)怎麼拼(spell)。",en:"Why don't you give him a dictionary?",zh:"這是一句抱怨的陳述，回「你何不給他一本字典(dictionary)？」是在提供辦法，最自然。「英文是我最喜歡的語言(language)」只是重複 English；「他每個字都拼對了」和弟弟一直不會拼的意思矛盾。選 A"},
{n:7,p:1,o:["I'll stay there again next Thursday.","The small one near the beach.","For about a week."],a:1,sen:"Which hotel did you stay at in the Philippines?",szh:"你在菲律賓(Philippines)住哪(which)一家旅館(hotel)？",en:"The small one near the beach.",zh:"問「哪一家」旅館(hotel)，答「海邊附近(near)那家小的」才是在指認旅館。「大約一週」答的是住多久；「下週四(Thursday)還會再去住」時態不對，也沒說是哪一家。選 B"},
{n:8,p:1,o:["It leaves from the hotel at nine.","I took one on my last vacation.","About two hours, with a stop for lunch."],a:2,sen:"How long does the bus tour take?",szh:"巴士觀光行程(tour)要多久？",en:"About two hours, with a stop for lunch.",zh:"問 How long 要多久，答「大約兩小時(hour)，中間停下來吃午餐」才是時間長度。「九點從旅館出發」答的是地點和出發時間；「我上次度假(vacation)搭過一次」說的是自己的經驗，沒回答多久。選 C"},
{n:9,p:1,o:["That's rude. Let's call the front desk.","I had a funny dream last night.","Sure, you can sit next to me."],a:0,sen:"The people in the next room are so loud. I can't sleep.",szh:"隔壁房間的人好吵，我睡不著。",en:"That's rude. Let's call the front desk.",zh:"對方抱怨隔壁太吵睡不著，回「真沒禮貌(rude)，我們打電話給櫃台」是在處理問題，最自然。「我昨晚做了一個好笑(funny)的夢(dream)」只是由 sleep 聯想；「你可以坐(sit)我旁邊」只是重複 next。選 A"},
{n:10,p:1,o:["Yes, I'd like a new pen.","Yes, I wrote it last night.","Sure. Is it the one about the princess?"],a:2,sen:"Would you like to read my new poem?",szh:"你想讀我的新詩(poem)嗎？",en:"Sure. Is it the one about the princess?",zh:"對方邀你讀他寫的詩(poem)，回「好啊，是寫公主(princess)的那首嗎？」最自然。「是的，我昨晚寫的」把作者弄反了，詩是對方寫的；「我想要一支新筆」只是重複 would like 和 new。選 C"},
{n:11,p:1,o:["I have to rest it for two weeks.","Yes, the doctor lives near my home.","I hurt it at the camp last week."],a:0,sen:"What did the doctor say about your leg injury?",szh:"醫生怎麼說你腿傷(injury)的事？",en:"I have to rest it for two weeks.",zh:"問醫生說了什麼，答「我得讓腿休息兩週」就是醫生的指示。「上週在營地(camp)弄傷的」答的是怎麼受傷；用 Yes 回答 What 問句，而且醫生住在附近(near)和問題無關。選 A"},
{n:12,p:1,o:["Yes, my bags are very heavy, too.","The trip was in May.","Maybe you should go on a diet."],a:2,sen:"My weight went up a lot during the trip.",szh:"旅行(trip)期間我的體重(weight)增加了很多。",en:"Maybe you should go on a diet.",zh:"對方說旅行後變胖，建議「也許你該節食(diet)」最自然。「旅行在五月」只是重複 trip，沒有回應；「我的包包也很重」把 weight 誤解成行李的重量。選 C"},
{n:13,p:1,o:["Somebody from the tour group, I think.","In the closet near the door.","It's a warm vest for winter."],a:0,sen:"Who left this vest in the closet?",szh:"誰把這件背心(vest)留在衣櫥(closet)裡？",en:"Somebody from the tour group, I think.",zh:"問 Who 是誰，答「我想是旅行團(tour)裡的某個人(somebody)」才是人物。「這是件冬天穿的保暖背心」答的是東西是什麼；「在門邊的衣櫥裡」答的是地點，而且重複 closet。選 A"},
{n:14,p:1,o:["He takes the bus to school.","Yes, he said sorry and gave it back.","No, it's a very powerful robot."],a:1,sen:"Did Tom admit that he took your robot?",szh:"Tom 承認(admit)他拿了你的機器人(robot)嗎？",en:"Yes, he said sorry and gave it back.",zh:"問 Tom 有沒有承認(admit)，答「有，他道歉了，還把它還回來」最自然。「沒有，它是很強大(powerful)的機器人」No 後面接的內容和承認無關；「他搭公車上學」只是 took/takes 的聲音陷阱。選 B"},
{n:15,p:1,o:["They came from a small village.","At ten, before the tour starts.","On the blank page in this book."],a:2,sen:"Where should visitors write their names?",szh:"訪客(visitor)應該把名字寫在哪裡？",en:"On the blank page in this book.",zh:"問寫名字的地方，答「寫在這本簿子的空白(blank)頁」才是位置。「他們來自一個小村莊(village)」答的是從哪裡來，是 Where 的陷阱；「十點，行程開始前」答的是時間。選 C"},
{n:16,p:2,o:["At a hotel front desk.","On a bus tour.","In a village restaurant."],a:0,sen:"W: Good evening. I'm Ann Lee, and I have a room for three nights. &nbsp;M: Welcome. Please sign here. This is your key. &nbsp;W: Thank you. Is there a bus tour tomorrow? &nbsp;M: Yes, it leaves at nine. If you need anything, just press the bell. &nbsp;W: And where can we eat? &nbsp;M: Breakfast is next door. For dinner, the village has many small restaurants. &nbsp;Q: Where are the speakers?",szh:"女：晚安。我是 Ann Lee，我訂了三晚的房間。　男：歡迎。請在這裡簽名。這是您的鑰匙。　女：謝謝。明天有巴士觀光行程(tour)嗎？　男：有，九點出發。如果需要任何東西，按(press)一下鈴就好。　女：那我們可以去哪裡吃飯？　男：早餐就在隔壁。晚餐的話，村子(village)裡有很多小餐廳。　問：說話的人在哪裡？",en:"At a hotel front desk.",zh:"女子說訂了三晚的房間，男子請她簽名、給她鑰匙、說按(press)鈴有需要的話找他，這些都是旅館(hotel)櫃台的情形。巴士觀光行程(tour)只是她問的明天活動，並不是他們現在人在巴士上；村子(village)裡的小餐廳只是男子推薦晚餐的地方，他們不在餐廳裡。選 A"},
{n:17,p:2,o:["At eight-fifteen.","At nine.","At eight-thirty."],a:0,sen:"M: The bus tour starts at nine at the Park Hotel. &nbsp;W: We have to be there half an hour early. &nbsp;M: And it's a fifteen-minute walk from here. &nbsp;Q: What time should they leave?",szh:"男：巴士觀光行程(tour)九點在公園飯店(Hotel)出發。　女：我們得提早半小時(hour)到。　男：而且從這裡走過去要十五分鐘。　問：他們應該幾點出門？",en:"At eight-fifteen.",zh:"九點出發、要提早半小時(hour)，所以八點半要到飯店；走路還要十五分鐘，因此八點十五分就得出門。八點半是該抵達的時間；九點是行程開始的時間。選 A"},
{n:18,p:2,o:["The room was too small.","The bed was not comfortable.","It was too noisy at night."],a:2,sen:"M: How was the hotel? &nbsp;W: The room was big, and the bed was soft. &nbsp;M: Sounds good. &nbsp;W: But the walls were so thin that I heard everything next door. &nbsp;M: Did you sleep at all? &nbsp;W: A little. Next time, I'll camp by the lake. &nbsp;Q: What does the woman think about the hotel?",szh:"男：旅館(hotel)怎麼樣？　女：房間很大，床也很軟。　男：聽起來不錯。　女：但是牆很薄，我隔壁的聲音全都聽得到。　男：妳有睡著嗎？　女：睡一點點。下次我要去湖邊露營(camp)。　問：女士覺得那家旅館怎麼樣？",en:"It was too noisy at night.",zh:"女子說房間大、床軟，但牆很薄、隔壁的聲音都聽得到，還沒睡好，意思是旅館晚上太吵。房間是「大」的，不是太小；床是軟的，所以不是不舒服。她說下次改去露營(camp)，也是因為這家旅館太吵。選 C"},
{n:19,p:2,o:["Pin the notes on the board.","Fix the board.","Buy some nails."],a:2,sen:"M: The board in the hall is falling down. &nbsp;W: I'll go buy some nails. &nbsp;M: Good. Then I'll fix it, and Amy can pin the notes back on. &nbsp;Q: What will the woman do?",szh:"男：走廊上的佈告欄(board)快掉下來了。　女：我去買些釘子(nail)。　男：好，那我來修(fix)，Amy 可以把公告再釘(pin)回去。　問：女士會做什麼？",en:"Buy some nails.",zh:"要分清楚誰做什麼：女士去買釘子(nail)，男士修(fix)佈告欄，Amy 把公告釘(pin)回去。修佈告欄是男士的工作；釘公告是 Amy 的工作。選 C"},
{n:20,p:2,o:["He speaks good English.","He speaks Chinese well.","He is from England."],a:0,sen:"W: Your new classmate is a foreigner, right? &nbsp;M: Yes, and we've become good friends. People think he's from England because his English is so good. But he's from Germany. &nbsp;W: Can he speak Chinese, too? &nbsp;M: Only a few words, but he's learning fast. &nbsp;Q: Which is true about the new classmate?",szh:"女：你的新同學是外國人(foreigner)，對吧？　男：對，我們已經變成(become)好朋友了。大家以為他是英國人，因為他英文(English)很好，但他其實是德國人。　女：他也會說中文嗎？　男：只會幾個字(word)，不過學得很快。　問：關於新同學，何者(which)正確？",en:"He speaks good English.",zh:"男士說大家誤以為他是英國人，正是因為他英文(English)很好，所以「英文說得好」正確。他其實來自德國，不是英國；中文只會幾個字，不能說中文很好。選 A"},
{n:21,p:2,o:["It's very exciting.","She has finished it.","It's boring."],a:2,sen:"M: How's the novel I gave you? &nbsp;W: Well, I've had it for a month, and I'm still on page ten. &nbsp;M: Is it that bad? &nbsp;W: Let's just say I fall asleep after every page. &nbsp;Q: What does the woman think of the novel?",szh:"男：我送你的那本小說(novel)怎麼樣？　女：嗯，我拿到一個月了，還停在第十頁。　男：有那麼糟嗎？　女：這麼說吧，我每(every)看一頁就睡著。　問：女士覺得這本小說怎麼樣？",en:"It's boring.",zh:"一個月只看到第十頁、每看一頁就睡著，意思是小說(novel)很無聊。她沒有說好看刺激，反而看到睡著；她還停在第十頁，當然還沒看完。選 C"},
{n:22,p:2,o:["Taking a trip to the Philippines.","Writing about a past trip.","Looking for a good hotel."],a:1,sen:"W: Do we have everything for our report on the trip? &nbsp;M: We have the photos. We still need a title. &nbsp;W: How about Five Days in the Philippines? &nbsp;M: I like it. I'll write about the hotel, and you write about the food. &nbsp;W: OK. I'll show you my part on Thursday. &nbsp;Q: What are the speakers doing?",szh:"女：我們的旅行(trip)報告東西都齊了嗎？　男：照片有了，還缺一個標題。　女：叫「菲律賓(Philippines)五日遊」怎麼樣？　男：我喜歡。我寫旅館(hotel)，妳寫食物。　女：好。星期四(Thursday)我把我的部分給你看。　問：說話的人在做什麼？",en:"Writing about a past trip.",zh:"兩人已經有旅行(trip)的照片，正在想報告的標題、分配誰寫旅館(hotel)、誰寫食物，所以是在寫一趟已經去過的旅行。標題裡雖然有菲律賓(Philippines)，但他們不是正要出發；旅館是報告要寫的內容，不是他們要找的地方。選 B"},
{n:23,p:2,o:["Four thousand dollars.","Two thousand dollars.","Six thousand dollars."],a:0,sen:"M: A room here is two thousand dollars a night. &nbsp;W: We're staying for three nights. &nbsp;M: Good news. The third night is free for visitors on the bus tour. &nbsp;W: Great! We're on that tour. &nbsp;Q: How much will they pay for the room?",szh:"男：這裡一間房一晚兩千元。　女：我們要住三晚。　男：好消息，參加巴士觀光行程(tour)的訪客(visitor)第三晚免費。　女：太好了！我們就是那個團的。　問：他們房間要付多少錢？",en:"Four thousand dollars.",zh:"一晚兩千元、住三晚，但他們是觀光團(tour)的訪客(visitor)，第三晚免費，所以只付兩晚，共四千元。兩千元是一晚的價錢；六千元是沒扣掉免費那晚的金額。選 A"},
{n:24,p:2,o:["A ship to take her home.","Her lost brother.","The treasure."],a:1,sen:"W: What's your new novel about? &nbsp;M: A princess who lands on an island after a storm. &nbsp;W: Does she find the treasure there? &nbsp;M: No, but she finds her lost brother, and they survive together. &nbsp;Q: What does the princess find on the island?",szh:"女：你的新小說(novel)在講什麼？　男：一位公主(princess)在暴風雨後登陸(land)一座島。　女：她在那裡找到寶藏(treasure)了嗎？　男：沒有，但她找到失散的弟弟，他們一起活了下來(survive)。　問：公主在島上找到什麼？",en:"Her lost brother.",zh:"女士問有沒有找到寶藏(treasure)，男士說沒有，但找到了失散的弟弟。寶藏是被否定的；對話沒有提到有船載她回家，他們是一起在島上活下來(survive)。選 B"},
{n:25,p:2,o:["Visit a big city.","Go swimming.","Fish every day."],a:1,sen:"M: Where do you want to travel this summer? &nbsp;W: Somewhere peaceful, not a big city. &nbsp;M: How about the village by the sea? We can fish every day. &nbsp;W: I don't really care for fishing. But the water there is so clear and warm. &nbsp;Q: What will the woman probably do in the village?",szh:"男：你今年夏天想去哪裡旅行(travel)？　女：安靜(peaceful)的地方，不要大城市。　男：海邊的那個村莊(village)怎麼樣？我們可以每(every)天釣魚(fish)。　女：我不太喜歡(care for)釣魚，不過那裡的海水又清又溫暖。　問：女士在村莊裡可能會做什麼？",en:"Go swimming.",zh:"女士說不喜歡(care for)釣魚，但稱讚那裡的海水清澈溫暖，表示她會去游泳。每天釣魚是男士想做的事；她一開始就說不要大城市。選 B"},
{n:26,p:3,pic:true,o:[BARS("Favorite Reads",["Novels","Poems","Articles"],[20,40,80]),BARS("Favorite Reads",["Novels","Poems","Articles"],[80,20,40]),BARS("Favorite Reads",["Novels","Poems","Articles"],[80,40,20])],a:2,sen:"We asked one hundred and forty members of our reading club what they like to read most. Many people think young people only read short articles on their phones. But in our club, articles were the least popular. Poems did better than articles, and novels were the clear winner. &nbsp;Q: Which chart shows what the club members like to read?",szh:"我們問了讀書會一百四十位會員最喜歡讀什麼。很多人以為年輕人只在手機上讀短文章(article)。但在我們社團，文章最不(least)受歡迎。詩(poem)比文章好一些，而小說(novel)是明顯的第一名。　問：哪(which)張圖表顯示會員喜歡讀的東西？",en:"Novels most, poems second, articles least.",zh:"小說(novel)第一、詩(poem)比文章好、文章(article)最少，所以是小說最高、詩第二、文章最低的圖。文章最高的那張是「很多人以為」的情形，不是社團的結果；小說最高但文章比詩多的那張，和「詩比文章好」相反。選 C"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"Our travel club asked its members what they did on their summer vacation. Last year, most of us stayed in a hotel. This year, some members went camping near a lake, but it rained almost every day. Most members joined a tour, because the guide planned everything for them. &nbsp;Q: What did most members do this summer?",szh:"我們旅行(travel)社問會員(member)暑假(vacation)做了什麼。去年我們大多住旅館(hotel)。今年有些會員去湖邊露營(camp)，但幾乎每天都下雨。大部分會員參加了旅行團(tour)，因為導遊(guide)把一切都替他們安排好了。　問：今年夏天大部分會員做了什麼？",en:"They joined a tour.",zh:"住旅館(hotel)是去年大多數人的選擇；今年去湖邊露營(camp)的只有一些人，而且幾乎天天下雨；今年大部分會員參加了旅行團(tour)，所以答案是跟著導遊的旅行團。 選 B"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:0,sen:"Last weekend, our class went to a camp in the mountains. We planned to look at the stars at night, but it was too cloudy. So we sat around the fire, and our teacher told us a funny story. Everyone listened and laughed. We went to bed in our tents at ten. &nbsp;Q: What did the class do before they went to bed?",szh:"上週末我們班去山上的營地(camp)。我們本來打算晚上看星星，但雲太多了。所以我們圍坐(sit)在火堆旁，老師說了一個好笑(funny)的故事，大家都邊聽(listen)邊笑。十點我們回帳篷睡覺。　問：全班睡覺前做了什麼？",en:"They sat around the fire and listened to a story.",zh:"看星星是原本的計畫，但雲太多沒看成；在帳篷裡睡覺是十點之後的事；睡前他們圍坐在火堆旁聽老師講故事。選 A"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:1,sen:"I work at a small hotel. Yesterday, a visitor called us from the airport. He said he left his gray vest in the closet of his room. I looked in the closet, but the vest wasn't there. There was only a pair of brown shoes. Later, I found the vest under the bed. He also asked about his dictionary, but it was in his bag. &nbsp;Q: What did the speaker find in the closet?",szh:"我在一家小旅館(hotel)工作。昨天一位訪客(visitor)從機場打電話來，說他把灰色背心(vest)留在房間的衣櫥(closet)裡。我看了衣櫥，背心不在那裡，只有一雙棕色鞋子。後來我在床底下找到背心。他也問到他的字典(dictionary)，不過字典在他自己的包包裡。　問：說話者在衣櫥裡找到什麼？",en:"A pair of brown shoes.",zh:"客人以為背心(vest)在衣櫥(closet)裡，但其實在床底下；字典(dictionary)在客人自己的包包裡；衣櫥裡只有一雙棕色鞋子。選 B"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:1,sen:"My uncle wants to lose some weight. At first, he went on a diet and ate only salad, but he was hungry all the time. His doctor said he needs to move his body more. My uncle nodded, but he hates running. So now he swims every morning. He has become much healthier, and he says it's good for his brain, too. &nbsp;Q: What does the uncle do now to lose weight?",szh:"我叔叔想減輕一些體重(weight)。一開始他節食(diet)、只吃沙拉，但一直很餓。醫生說他需要多活動身體(body)。叔叔點了頭(nod)，但他討厭跑步，所以現在他每(every)天早上游泳。他變得(become)健康多了，還說游泳對頭腦(brain)也好。　問：叔叔現在用什麼方法減重？",en:"He swims every morning.",zh:"只吃沙拉節食(diet)是一開始的方法，但太餓了沒持續；跑步是他討厭的運動；現在他每天早上游泳。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 23 回　閱讀寫作與旅行　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
