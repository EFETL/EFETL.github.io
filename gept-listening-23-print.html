<style>

<script>
/* 圖形素材（第23回 閱讀寫作與旅行） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/23/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const NOVEL=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q1.jpg" alt="question 1 picture">`;
const DICTIONARY=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q2.jpg" alt="question 2 picture">`;
const HOTEL=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q3.jpg" alt="question 3 picture">`;
const TENT=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q4.jpg" alt="question 4 picture">`;
const BOARD=`<img class="pic-img p0img" src="gept-listening-img/23/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:NOVEL,o:["She is reading a thick novel.","She is reading a news article.","She is reading a bus map."],a:0,sen:"For question one, look at the picture. What is she reading?",szh:"第一題，請看圖片。她在讀什麼？",en:"She is reading a thick novel.",zh:"她在讀一本厚厚的小說(novel)，選 A。新聞文章(article)和公車地圖都不是圖中的東西。"},
{n:2,p:0,fig:DICTIONARY,o:["A big calculator on the desk.","A big dictionary on the desk.","A big clock on the desk."],a:1,sen:"For question two, look at the picture. What helps you spell words?",szh:"第二題，請看圖片。什麼幫你拼字？",en:"A big dictionary on the desk.",zh:"字典(dictionary)能幫你拼(spell)字(word)，選 B。計算機和時鐘都不能拼字。"},
{n:3,p:0,fig:HOTEL,o:["At a hotel during their vacation.","In a tent during their vacation.","On a boat during their vacation."],a:0,sen:"For question three, look at the picture. Where do the visitors stay?",szh:"第三題，請看圖片。訪客住在哪裡？",en:"At a hotel during their vacation.",zh:"訪客(visitor)度假(vacation)時住在旅館(hotel)，選 A。帳篷和船不是圖中的住處。"},
{n:4,p:0,fig:TENT,o:["A small boat at the camp.","A small truck at the camp.","A small tent at the camp."],a:2,sen:"For question four, look at the picture. What is at the camp?",szh:"第四題，請看圖片。營地上有什麼？",en:"A small tent at the camp.",zh:"營地(camp)上有一頂小帳篷，選 C。船和卡車不是圖中的東西。"},
{n:5,p:0,fig:BOARD,o:["A board with an article pinned on it.","A board with a map pinned on it.","A board with a photo pinned on it."],a:0,sen:"For question five, look at the picture. What is on the wall?",szh:"第五題，請看圖片。牆上是什麼？",en:"A board with an article pinned on it.",zh:"板子(board)上用圖釘(pin)釘著一篇文章(article)，選 A。地圖和照片是同樣釘在板上的別種東西，但不是圖中的。"},

{n:6,p:1,o:["Yes, I listen to it every hour.","The news is on at six o'clock.","I keep my keys in my bag."],a:0,sen:"Do you keep up with the news?",szh:"你有跟上新聞嗎？",en:"Yes, I listen to it every hour.",zh:"問是否有跟上新聞，答『有，我每(every)小時(hour)聽(listen)』，選 A。新聞六點播出沒回答有沒有在看；keep keys 只是呼應 keep 的字。"},
{n:7,p:1,o:["I met him at the library.","The new class starts Monday.","He's a foreigner, and we'll become friends."],a:2,sen:"Who is the new student beside you?",szh:"你旁邊的新學生是誰？",en:"He's a foreigner, and we'll become friends.",zh:"問新同學是誰，答『他是外國人(foreigner)，我們會成為(become)朋友』，選 C。在圖書館遇到他和新課開始都沒回答他是誰。"},
{n:8,p:1,o:["I play it every Sunday.","A funny robot. Watch it land!","The game costs ten dollars."],a:1,sen:"What is that strange thing in the game?",szh:"遊戲裡那個奇怪的東西是什麼？",en:"A funny robot. Watch it land!",zh:"問遊戲裡奇怪的東西是什麼，答『一個好笑(funny)的機器人(robot)，看它降落(land)』，選 B。玩的頻率和價錢都沒回答是什麼。"},
{n:9,p:1,o:["Our travel tour next Thursday.","I'm looking for my pen.","It starts in about an hour."],a:0,sen:"What are you looking forward to?",szh:"你在期待什麼？",en:"Our travel tour next Thursday.",zh:"問期待什麼，答『下星期四(Thursday)的旅行(travel)團(tour)』，選 A。找筆和一小時後開始都沒回答期待什麼。"},
{n:10,p:1,o:["The shelf is made of wood.","Yes, I'll fix it with a nail.","I put my books on it."],a:1,sen:"Does the broken shelf bother you?",szh:"壞掉的架子讓你困擾嗎？",en:"Yes, I'll fix it with a nail.",zh:"問壞掉的架子是否困擾，答『是，我會用釘子(nail)修好(fix)』，選 B。木頭做的和放書都沒回答。"},
{n:11,p:1,o:["The princess lives in a castle.","Yes, I played the game last night.","Yes, her brain is powerful. She'll survive."],a:2,sen:"Can the clever princess win the hard game?",szh:"聰明的公主能贏得這場難關嗎？",en:"Yes, her brain is powerful. She'll survive.",zh:"問公主能否贏，答『能，她頭腦(brain)很強(powerful)，能存活(survive)』，選 C。住城堡和昨晚玩過都沒回答。"},
{n:12,p:1,o:["At the new sports center.","My weight is sixty kilos.","A good diet and enough sleep."],a:2,sen:"What is the best way to stay healthy?",szh:"保持健康最好的方法是什麼？",en:"A good diet and enough sleep.",zh:"問保持健康的方法，答『均衡的飲食(diet)和足夠睡眠』，選 C。運動中心是地點、體重(weight)是數字，都不是方法。"},
{n:13,p:1,o:["It's on the wall in the clinic.","It shows my weight after the injury.","Press that button to start it."],a:1,sen:"What does this medical chart show?",szh:"這張醫療圖表顯示什麼？",en:"It shows my weight after the injury.",zh:"問圖表顯示什麼，答『顯示我受傷(injury)後的體重(weight)』，選 B。在診所牆上是地點；按(press)按鈕沒回答。"},
{n:14,p:1,o:["He hid it last Thursday.","In the old closet upstairs.","It's full of old pictures."],a:1,sen:"Where did your grandfather hide the old box?",szh:"你爺爺把舊盒子藏在哪？",en:"In the old closet upstairs.",zh:"問爺爺把盒子藏在哪，答『在樓上的舊衣櫥(closet)裡』，選 B。上週四是時間，裝滿舊照片是內容，都不是地點。"},
{n:15,p:1,o:["It's two hours from here.","Some of us live near here.","Yes, somebody from the Philippines."],a:2,sen:"Is anyone here from another country?",szh:"這裡有人來自別的國家嗎？",en:"Yes, somebody from the Philippines.",zh:"問是否有人來自他國，答『有，某人(somebody)來自菲律賓(Philippines)』，選 C。兩小時路程和住在附近都沒回答。"},

{n:16,p:2,o:["A news article.","A school dictionary.","A long novel."],a:2,sen:"W: You sit in that chair for hours every day. What are you reading? &nbsp;M: A long story about a princess who gets lost. I can't stop. &nbsp;W: It must be exciting. &nbsp;Q: What is the man reading?",szh:"女：你每天坐在那張椅子上好幾個小時。你在讀什麼？　男：一個關於公主迷路的長故事。我停不下來。　女：一定很刺激。　問：男士在讀什麼？",en:"A long novel.",zh:"男士每天坐(sit)好幾個小時(hour)讀一個關於迷路公主(princess)的長故事，這是小說(novel)，選 C。新聞文章和字典不會有公主的故事。"},
{n:17,p:2,o:["Use a dictionary.","Guess the word.","Ask a friend."],a:0,sen:"M: How can I spell this hard word? &nbsp;W: Look it up in a dictionary to spell it right. &nbsp;M: Good idea. &nbsp;Q: What does the woman suggest?",szh:"男：這個難字我要怎麼拼？　女：查字典(dictionary)才能拼(spell)對。　男：好主意。　問：女士建議什麼？",en:"Use a dictionary.",zh:"查字典(dictionary)才能拼(spell)對，選 A。猜字和問朋友都不如查字典可靠。"},
{n:18,p:2,o:["At a camp.","At a hotel.","At her uncle's house."],a:1,sen:"W: Where will your family sleep on vacation? &nbsp;M: In a room near the beach, with a front desk downstairs. &nbsp;W: How peaceful! &nbsp;Q: Where will the family stay?",szh:"女：你家度假(vacation)時睡哪裡？　男：在靠海邊的一間房間，樓下有櫃台。　女：真寧靜(peaceful)！　問：這家人會住哪裡？",en:"At a hotel.",zh:"有櫃台、樓下有餐廳的房間是旅館(hotel)，選 B。營地(camp)也在戶外，但沒有櫃台。"},
{n:19,p:2,o:["A trip abroad.","A school test.","A new job."],a:0,sen:"M: What are you planning for this summer? &nbsp;W: I'll need my passport and a big suitcase. I want to see Japan. &nbsp;M: Sounds exciting! &nbsp;Q: What is the woman planning?",szh:"男：你今年夏天打算做什麼？　女：我會需要護照和一個大行李箱。我想去看日本。　男：聽起來很令人期待！　問：女士在計畫什麼？",en:"A trip abroad.",zh:"需要護照和大行李箱、想去日本，就是出國旅行(trip)，選 A。考試和新工作都沒線索。"},
{n:20,p:2,o:["A short poem.","A long story.","A news article."],a:0,sen:"W: What did you write for the school paper? &nbsp;M: Just a few short lines about my mother. They rhyme. &nbsp;W: How sweet. &nbsp;Q: What did the man write?",szh:"女：你為校刊寫了什麼？　男：只是幾行關於我母親的短句。它們有押韻。　女：真貼心。　問：男士寫了什麼？",en:"A short poem.",zh:"幾行押韻的短句寫母親，是詩(poem)，選 A。故事會長得多；新聞文章(article)不會押韻。"},
{n:21,p:2,o:["A local guide.","A visitor from abroad.","A new teacher."],a:1,sen:"M: Who is that woman asking for directions? &nbsp;W: She is from Canada. She is here on vacation, and she can't read our signs. &nbsp;M: Let's help her. &nbsp;Q: Who is the woman?",szh:"男：那位問路的女士是誰？　女：她來自加拿大。她來這裡度假(vacation)，看不懂我們的路標。　男：我們幫她吧。　問：那位女士是誰？",en:"A visitor from abroad.",zh:"她來自加拿大、來度假、看不懂路標，是外國訪客(visitor)，選 B。當地導遊會看得懂標誌。"},
{n:22,p:2,o:["French.","Japanese.","English."],a:2,sen:"W: What language do most visitors use here? &nbsp;M: English, the common world language. &nbsp;W: Useful to learn. &nbsp;Q: What language do most visitors use?",szh:"女：這裡大多數訪客用什麼語言？　男：英語(English)，通用的世界語言(language)。　女：值得學。　問：大多數訪客用什麼語言？",en:"English.",zh:"大多數訪客用英語(English)這個語言(language)，選 C。法語和日語沒被提到。"},
{n:23,p:2,o:["A dancing robot.","A flying fish.","A singing dog."],a:0,sen:"W: Why are you laughing in your sleep? &nbsp;M: I had a funny dream about a dancing robot. &nbsp;W: How silly! &nbsp;Q: What did the man dream about?",szh:"女：你怎麼睡覺還在笑？　男：我做了一個關於跳舞機器人(robot)的好笑夢(dream)。　女：真好笑！　問：男士夢到什麼？",en:"A dancing robot.",zh:"男士夢(dream)到會跳舞的機器人(robot)，選 A。會飛的魚(fish)和唱歌的狗都沒提到。"},
{n:24,p:2,o:["In a big hotel.","In a small village.","In a busy city."],a:1,sen:"M: Where did you stay on your trip? &nbsp;W: In a tiny place with only twenty houses and lots of cows. &nbsp;M: How quiet! &nbsp;Q: Where did the woman stay?",szh:"男：你旅行(trip)時住在哪？　女：住在一個只有二十間房子、有很多牛的小地方。　男：好安靜！　問：女士住在哪？",en:"In a small village.",zh:"只有二十間房子、到處是牛，是小村莊(village)，選 B。大旅館和繁忙城市不會有這種景象。"},
{n:25,p:2,o:["An old map.","A treasure.","A small boat."],a:1,sen:"W: What did the pirates leave on the island? &nbsp;M: A box full of gold and jewels, hidden behind an old board. &nbsp;W: How exciting! &nbsp;Q: What did the pirates leave?",szh:"女：海盜在島上留下了什麼？　男：一個裝滿黃金和珠寶的箱子，藏在一塊舊木板(board)後面。　女：好刺激！　問：海盜留下了什麼？",en:"A treasure.",zh:"海盜留下裝滿黃金和珠寶的箱子，也就是寶藏(treasure)，選 B。舊地圖常和海盜故事連在一起，但這裡沒提到。"},

{n:26,p:3,pic:true,o:[BARS("Books Read",["Novel","Poem","News"],[20,50,80]),BARS("Books Read",["Novel","Poem","News"],[50,80,20]),BARS("Books Read",["Novel","Poem","News"],[80,50,20])],a:2,sen:"Our class counted what students like to read. When we asked which kind they liked best, most students nodded at novels, because of their exciting stories. Poems were in the middle, and short news articles were the least read. So the novel bar should be the tallest. &nbsp;Q: Which chart shows what students read?",szh:"我們班統計學生喜歡讀什麼。問他們最喜歡哪(which)一種時，多數學生對小說(novel)點頭(nod)，因為故事精彩；詩(poem)中等；短新聞文章(article)讀最少(least)。所以小說長條最高。　問：哪張圖顯示學生的閱讀？",en:"Novels most, news least.",zh:"小說(novel)最多、新聞文章最少，符合『小說最高』的圖，選 C。詩排中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Trips Taken",["Spring","Summer","Fall"],[55,80,30]),BARS("Trips Taken",["Spring","Summer","Fall"],[30,55,80]),BARS("Trips Taken",["Spring","Summer","Fall"],[80,55,30])],a:2,sen:"A travel company counted the trips people took. The manager cared about the result, so she drew the numbers on a blank sheet. In spring the most people traveled, because the weather was lovely. In summer the number was in the middle, and in fall the fewest went on a trip. So the trips went down through the seasons. &nbsp;Q: Which chart shows the trips taken?",szh:"一家旅行(travel)公司統計大家的旅行(trip)。經理很在意(care)結果，所以把數字畫在一張空白(blank)紙上。春天最多人出遊，因為天氣好；夏天中等；秋天最少人旅行。所以旅行次數隨季節下降。　問：哪張圖顯示旅行次數？",en:"Spring most, fall fewest.",zh:"春天最多、逐季下降，符合『春天最高、秋天最低』的圖，選 C。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:0,sen:"On our camping trip, we brought a good novel and a dictionary but forgot the pot. There was no way to boil noodles or steam rice by the tent. So we simply ate fresh bread near the fire while we read our books under the stars. It was cold, so we put on vests to keep our bodies warm. &nbsp;Q: What did they eat on the camping trip?",szh:"露營旅行(trip)時，我們帶了一本好小說(novel)和一本字典(dictionary)，卻忘了帶鍋。帳篷旁沒辦法煮麵或蒸飯。所以我們就在火邊(near)吃新鮮麵包(bread)，一邊在星空下讀書(book)。天氣很冷，我們穿上背心(vest)讓身體(body)保暖。　問：他們露營時吃什麼？",en:"Fresh bread.",zh:"他們吃麵包(bread)，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:1,sen:"When we stayed at a small hotel in the village, the owner cooked for every visitor. She said it would be rude to give tired travelers only plain bread or dry rice. So she made a big bowl of hot noodles, and the foreign visitors admitted it was the best meal of their trip. &nbsp;Q: What did the hotel owner cook?",szh:"我們住在村莊(village)一家小旅館(hotel)時，老闆為每位訪客(visitor)做飯。她說只給疲累的旅人普通麵包或白飯是不禮貌(rude)的，於是煮了一大碗熱麵(noodles)，外國訪客都承認(admit)那是旅程(trip)中最棒的一餐。　問：旅館老闆煮了什麼？",en:"A bowl of noodles.",zh:"旅館老闆煮了熱麵(noodles)，選 B。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('park'),IMG('beach')],a:2,sen:"For our vacation, the whole family planned a trip to relax and read. My father liked the mountain and my sister liked the park. But we chose the beach, because we could lie on the sand, read our novels, and travel along the shore all day. &nbsp;Q: Where did the family go for their vacation?",szh:"假期(vacation)時，全家計畫一趟放鬆讀書的旅行(trip)。爸爸喜歡山，姊姊喜歡公園，但我們選了海邊(beach)，因為可以躺在沙上讀小說(novel)、整天沿著海岸旅遊(travel)。　問：一家人假期去哪裡？",en:"The beach.",zh:"一家人假期(vacation)去海邊(beach)，選 C。山、公園為干擾。"}

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 23 回　閱讀寫作與旅行　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
