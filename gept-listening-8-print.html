</head><body>
<div class="bar">
 <b>🖨 第 8 回　電視與通訊　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>
 <button class="t tonly" onclick="show('t')">只印教師卷</button>
 <button class="a tonly" onclick="show('a')">兩份都印</button>
</div>
<div id="root"></div>
<script>
/* 圖形素材（第8回 電視與通訊） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/8/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/8/p3_${n}.jpg?v=r8hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const TV=`<img class="pic-img p0img" src="gept-listening-img/8/p0_q1.jpg" alt="question 1 picture">`;
const PHONE=`<img class="pic-img p0img" src="gept-listening-img/8/p0_q2.jpg" alt="question 2 picture">`;
const ENVELOPE=`<img class="pic-img p0img" src="gept-listening-img/8/p0_q3.jpg" alt="question 3 picture">`;
const NEWSPAPER=`<img class="pic-img p0img" src="gept-listening-img/8/p0_q4.jpg" alt="question 4 picture">`;
const MAGAZINE=`<img class="pic-img p0img" src="gept-listening-img/8/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:TV,o:["Four people are watching a ball game on TV.","Three people are watching the news on TV.","Four people are watching the news on TV."],a:2,sen:"For question one, look at the picture. What is the family doing?",szh:"第一題，請看圖片。這家人在做什麼？",en:"Four people are watching the news on TV.",zh:"男孩、女孩、媽媽和爸爸一共四個人，一起看電視(TV)上的新聞(news)播報，正確。圖中是四個人，不是三個；螢幕上是主播坐在桌前播新聞，不是球賽。選 C"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">TV SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">TV</td><td style="text-align:right;font-weight:700">$500</td></tr><tr><td style="padding:4px 30px 4px 0">Phone</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Cable</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Lamp</td><td style="text-align:right;font-weight:700">$200</td></tr></table></div>`,o:["He will have one hundred dollars left.","He will have two hundred dollars left.","He will have three hundred dollars left."],a:0,sen:"For question two, look at the picture. Ben has seven hundred dollars. He buys a TV and a cable. How much will he have left?",szh:"第二題，請看圖片。班有七百元。他買了一台電視(TV)和一條電視線(cable)。他還剩多少錢？",en:"He will have one hundred dollars left.",zh:"價目表上電視(TV)500元、電視線(cable)100元，一共600元，700減600剩100元。剩兩百元是只買電視、忘了加電視線的算法；剩三百元是把電視看成手機的300元，才會算成700減300再減100。選 A"},
{n:3,p:0,fig:ENVELOPE,o:["She is mailing a package.","She is mailing an envelope.","She is opening an envelope."],a:1,sen:"For question three, look at the picture. What is the woman doing?",szh:"第三題，請看圖片。這位女士在做什麼？",en:"She is mailing an envelope.",zh:"女士正把一個白色信封(envelope)投進藍色郵筒，也就是在寄信(mail)，正確。她是把信封放進去，不是在拆信封；她寄的是薄薄的信封，不是包裹。選 B"},
{n:4,p:0,fig:NEWSPAPER,o:["He is reading a newspaper on the sofa.","He is reading a magazine at a wood table.","He is reading a newspaper at a wood table."],a:2,sen:"For question four, look at the picture. What is the man doing?",szh:"第四題，請看圖片。這位男士在做什麼？",en:"He is reading a newspaper at a wood table.",zh:"男士坐在木頭(wood)桌前，雙手攤開一份報紙(newspaper)在看，正確。他看的是大張的報紙，不是雜誌(magazine)；他是坐在桌子前，不是坐在沙發上。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Phone Calls</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="90" width="44" height="60" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="85" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="96" y="70" width="44" height="80" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="65" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="110" width="44" height="40" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="105" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="228" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="45" font-size="14" font-weight="700" text-anchor="middle">50</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Amy</text><text x="118" y="167" text-anchor="middle">Ben</text><text x="184" y="167" text-anchor="middle">Cindy</text><text x="250" y="167" text-anchor="middle">Dan</text></g></svg>`,o:["They made sixty calls.","They made forty calls.","They made fifty calls."],a:0,sen:"For question five, look at the picture. The chart shows how many phone calls four students made today. How many calls did Ben and Cindy make in all?",szh:"第五題，請看圖片。圖表顯示四位學生今天各打了多少通電話(phone call)。班和辛蒂一共打了多少通？",en:"They made sixty calls.",zh:"圖中班打了40通、辛蒂打了20通，加起來60通。40只是班一個人的通數；50是丹(Dan)的通數，看錯人了。選 A"},
{n:6,p:1,o:["My telephone number is on the card.","Sorry, my phone was in my bag, and I didn't hear it ring.","Yes, I'll call you three times."],a:1,sen:"I called you three times last night.",szh:"我昨晚打了三次電話給你。",en:"Sorry, my phone was in my bag, and I didn't hear it ring.",zh:"對方說昨晚打(call)了三次電話，回「抱歉，手機(phone)在包包裡，我沒聽到它響(ring)」是在解釋為什麼沒接。「我的電話(telephone)號碼在名片上」答非所問；「好，我會打給你三次」時態和人物都不對，是重複 call 和 three times 的陷阱。選 B"},
{n:7,p:1,o:["I'll be back around six.","Just send me an email. I check it every day.","I contacted him by phone yesterday."],a:1,sen:"How can I contact you while you're away?",szh:"你不在的時候我要怎麼聯絡你？",en:"Just send me an email. I check it every day.",zh:"問怎麼聯絡(contact)你，答「寄電子郵件(email)給我就好，我每天都會看」是方法。「我大約(around)六點回來」答的是時間；「我昨天打電話聯絡了他」人物和時態都不對。選 B"},
{n:8,p:1,o:["Maybe a famous singer is there for a show.","Please turn down the TV.","Yes, I work at the bus station."],a:0,sen:"There's a big crowd in front of the TV station.",szh:"電視台前面有一大群人。",en:"Maybe a famous singer is there for a show.",zh:"對方說電視台(TV station)前聚集一大群人(crowd)，猜「也許有知名歌手去那裡上節目」最自然。「是的，我在公車站工作」只是重複 station；「請把電視關小聲」只是重複 TV，與人群無關。選 A"},
{n:9,p:1,o:["I noticed her at the station yesterday.","She's in a different class from me.","Yes, she cut her hair short."],a:2,sen:"Did you notice anything different about Amy today?",szh:"你今天有注意到 Amy 哪裡不一樣嗎？",en:"Yes, she cut her hair short.",zh:"問有沒有注意到(notice) Amy 哪裡不一樣(different)，答「有，她把頭髮剪短了」直接說出改變。「我昨天在車站(station)注意到她」時間不對，也沒說哪裡不同；「她和我不同班」只是重複 different。選 C"},
{n:10,p:1,o:["I'm sorry, I can't see it either.","Then let's turn up the volume.","It's between the sofa and the table."],a:1,sen:"I can't hear the TV at all.",szh:"我完全聽不到電視的聲音。",en:"Then let's turn up the volume.",zh:"對方聽不到電視(TV)，回「那我們把音量(volume)調大」最自然。「抱歉，我也看不到」把「聽」換成「看」，是陷阱；「在沙發和桌子之間(between)」答的是位置，沒人問東西在哪。選 B"},
{n:11,p:1,o:["I believe you can do it.","It's on page eighteen.","Of course not. It's a crazy lie."],a:2,sen:"Do you believe the story in the newspaper about the talking dog?",szh:"你相信報紙上那則會說話的狗的故事嗎？",en:"Of course not. It's a crazy lie.",zh:"問你相不相信(believe)報紙(newspaper)上的故事，答「當然不信，那是瘋狂的(crazy)謊言(lie)」直接回答。「在第十八(eighteen)頁」答的是位置；「我相信你做得到」只是重複 believe，意思完全不同。選 C"},
{n:12,p:1,o:["Nothing. I was too busy with my report.","Yes, I sent it by post.","About an hour after dinner."],a:0,sen:"What did you post on the Internet last night?",szh:"你昨晚在網路上貼了什麼？",en:"Nothing. I was too busy with my report.",zh:"問昨晚在網路上貼(post)了什麼，答「什麼都沒貼，我忙(busy)著寫報告(report)」是間接但合理的回答。「晚餐後大約一小時」答的是時間；「是的，我用郵寄寄出」用 Yes 回答 what 問句，還把 post 當成「郵寄」。選 A"},
{n:13,p:1,o:["It opens at six in the morning.","My house is made of wood.","About ten minutes on foot."],a:2,sen:"How far is the train station from your house?",szh:"火車站離你家多遠？",en:"About ten minutes on foot.",zh:"問車站(station)離你家(house)多遠，答「走路大約十分鐘」用時間說明距離，很自然。「早上六點開門」答的是時間；「我家是木頭(wood)蓋的」只是重複 house。選 C"},
{n:14,p:1,o:["Just a short message from Grandpa.","It came in the mail this morning.","I closed it with some paste."],a:0,sen:"What else is in the envelope?",szh:"信封裡還有什麼別的東西？",en:"Just a short message from Grandpa.",zh:"問信封(envelope)裡還有什麼別的(else)，答「只有爺爺寫的一則短訊息(message)」是內容。「我用漿糊(paste)封起來」答的是怎麼封；「今天早上隨郵件(mail)寄來的」答的是時間。選 A"},
{n:15,p:1,o:["It's at the city hall at ten.","We'll debate after school.","Likely the girls' team. They're very good."],a:2,sen:"Who will win the debate tomorrow, do you think?",szh:"你覺得明天的辯論誰會贏？",en:"Likely the girls' team. They're very good.",zh:"問誰會贏辯論(debate)，答「很可能(likely)是女生隊，她們很強」是人選加理由。「十點在市政廳」答的是時間地點；「我們放學後要辯論」只重複 debate，沒說誰會贏。選 C"},
{n:16,p:2,o:["At eight thirty.","At six thirty.","At seven thirty."],a:1,sen:"W: The news is at seven thirty, right? &nbsp;M: Usually. But tonight there's a baseball game, so the news comes one hour early. &nbsp;W: Then we can't eat dinner first. &nbsp;Q: What time is the news tonight?",szh:"女：新聞(news)是七點半，對吧？　男：平常是。但今晚有棒球賽，所以新聞提早(early)一小時。　女：那我們就不能先吃晚餐了。　問：今晚新聞幾點播？",en:"At six thirty.",zh:"新聞(news)平常七點半，今晚因為棒球賽提早(early)一小時，所以是六點半。七點半是平常的時間；八點半是誤以為延後一小時。選 B"},
{n:17,p:2,o:["Planning to join the school paper.","Finding a camera for a ball game.","Reading a notice about a new class."],a:0,sen:"W: Look at the notice on the board. The school newspaper needs new reporters. &nbsp;M: Really? I like writing stories. &nbsp;W: Me too. They also need someone to take pictures at the ball game. &nbsp;M: I can do that. My uncle gave me his old camera. &nbsp;W: Great! Let's sign up after class. &nbsp;M: OK. I'll bring the camera tomorrow. &nbsp;Q: What are the speakers doing?",szh:"女：看看布告欄上的公告(notice)。校刊(newspaper)需要新記者(reporter)。　男：真的嗎？我喜歡寫故事。　女：我也是。他們還需要有人在球賽拍照。　男：我可以。我叔叔給了我他的舊相機。　女：太好了！我們下課後去報名吧。　男：好。我明天把相機帶來。　問：說話的兩個人在做什麼？",en:"Planning to join the school paper.",zh:"兩人看到公告(notice)說校刊(newspaper)需要記者(reporter)和拍照的人，決定下課後一起報名，所以是在計畫加入校刊。相機是男士已經有的，不是要去找；公告講的是校刊徵人，不是新的課。選 A"},
{n:18,p:2,o:["On a papaya farm.","In his dad's magazine.","In the newspaper."],a:1,sen:"W: Where did you read that story about the papaya farm? &nbsp;M: In the newspaper, I think. &nbsp;W: But we don't get the newspaper anymore. &nbsp;M: Oh, right. Then it was in Dad's magazine. &nbsp;Q: Where did the man read the story?",szh:"女：你在哪裡讀到那篇木瓜(papaya)農場的故事？　男：我想是在報紙(newspaper)上。　女：可是我們已經不訂報紙了。　男：喔，對。那就是在爸爸的雜誌(magazine)上。　問：男士在哪裡讀到這篇故事？",en:"In his dad's magazine.",zh:"男士先說報紙(newspaper)，但女士提醒家裡已經不訂報紙，他改口說是在爸爸的雜誌(magazine)上。報紙是說錯被更正的；木瓜(papaya)農場是故事的內容，不是他讀到故事的地方。選 B"},
{n:19,p:2,o:["At the post office.","In a phone shop.","At the train station."],a:1,sen:"W: Hello. How can I help you? &nbsp;M: I dropped my phone, and now the screen is black. &nbsp;W: Let me take a look. It will take about two hours to fix. &nbsp;M: That's OK. I'll mail this envelope at the post office, then have lunch near the station. &nbsp;W: Fine. We'll send you a message when it's ready. &nbsp;M: Thanks. I'll come back at five. &nbsp;Q: Where are the speakers?",szh:"女：你好，有什麼我可以幫忙的嗎？　男：我的手機(phone)摔到了，現在螢幕是黑的。　女：我看一下。大概要兩個小時才修得好。　男：沒關係。我先去郵局寄這個信封(envelope)，然後在車站(station)附近吃午餐。　女：好。修好了我們會傳訊息(message)給你。　男：謝謝。我五點回來。　問：說話的人在哪裡？",en:"In a phone shop.",zh:"男士的手機(phone)摔壞了，女士看過後說要兩個小時才修得好，還會傳訊息(message)通知他，所以兩人是在手機店。郵局和車站是男士等一下要去的地方，不是現在所在的地方。選 B"},
{n:20,p:2,o:["She writes for a newspaper now.","She is still a TV reporter.","She doesn't like her new job."],a:0,sen:"M: Is your sister still a reporter at the TV station? &nbsp;W: Not anymore. She writes about legal news for a newspaper now. &nbsp;M: So she's a journalist now? &nbsp;W: Yes, and she likes it much better. &nbsp;Q: What is true about the woman's sister?",szh:"男：你姐姐還在電視台(TV station)當記者(reporter)嗎？　女：不是了。她現在替報紙(newspaper)寫法律(legal)新聞。　男：所以她現在是平面記者(journalist)？　女：對，而且她喜歡多了。　問：關於女士的姐姐何者正確？",en:"She writes for a newspaper now.",zh:"姐姐已經不在電視台(TV station)當記者(reporter)，現在替報紙(newspaper)寫法律(legal)新聞。「還是電視記者」是過去的工作；女士說她「喜歡多了」，所以不是不喜歡新工作。選 A"},
{n:21,p:2,o:["In the afternoon.","They won't go at all.","In the morning."],a:2,sen:"W: What's the weather report for tomorrow? &nbsp;M: Windy in the morning, then a light spring rain in the afternoon. &nbsp;W: Then let's go to the park in the morning. &nbsp;M: But it'll be windy. &nbsp;W: That's OK. I'd rather have wind than rain. &nbsp;Q: When will they go to the park?",szh:"女：明天的天氣預報(report)怎麼說？　男：早上風大(windy)，下午會下一場春天(spring)的小(light)雨。　女：那我們早上去公園吧。　男：可是會風很大。　女：沒關係，我寧願吹風也不要淋雨。　問：他們什麼時候去公園？",en:"In the morning.",zh:"下午會下雨，女士寧願早上風大(windy)也不要淋雨，所以早上去公園。下午有雨，正是她要避開的時間；男士只是提醒風大，女士說沒關係，沒有取消。選 C"},
{n:22,p:2,o:["It is the best way to learn about the world.","It takes too much time.","It is better than reading the newspaper."],a:1,sen:"M: I watch the TV news every night. I want to know what's happening around the world. &nbsp;W: Every night? They repeat the same report all day, and most of the stories are sad. &nbsp;M: But I don't want to miss anything. &nbsp;W: The newspaper tells you the main news in ten minutes. Then you can do something fun. &nbsp;Q: What does the woman think about watching the news on TV?",szh:"男：我每天晚上都看電視(TV)新聞(news)。我想知道世界各地發生了什麼事。　女：每天晚上？他們整天重複同一則報導(report)，而且大部分都是悲傷的故事。　男：可是我不想錯過任何事。　女：報紙(newspaper)十分鐘就能告訴你主要的新聞，然後你就可以做點好玩的事。　問：女士覺得看電視新聞怎麼樣？",en:"It takes too much time.",zh:"女士說電視(TV)新聞整天重複同一則報導(report)，報紙(newspaper)十分鐘就看完，還有時間做別的事，意思是看電視新聞太花時間。「了解世界的最好方法」是男士自己的想法；女士覺得報紙比較快，所以不會說電視比報紙好。選 B"},
{n:23,p:2,o:["From a notice on the board.","From a phone message.","From an email."],a:0,sen:"M: How will the teacher tell us about the school trip? &nbsp;W: She'll send a message to everyone's phone. &nbsp;M: But some students don't have phones. &nbsp;W: Right. So she'll paste a notice on the board, too. &nbsp;Q: How will students without phones learn about the trip?",szh:"男：老師會怎麼通知我們校外教學的事？　女：她會傳訊息(message)到每個人的手機(phone)。　男：可是有些學生沒有手機。　女：對，所以她也會在布告欄貼(paste)一張公告(notice)。　問：沒有手機的學生會怎麼得知校外教學的事？",en:"From a notice on the board.",zh:"沒有手機(phone)的學生收不到訊息(message)，所以老師會在布告欄貼(paste)公告(notice)。手機訊息是給有手機的學生；對話沒有提到電子郵件。選 A"},
{n:24,p:2,o:["Newspapers.","The Internet.","TV."],a:0,sen:"W: What's your talk about? &nbsp;M: The advantages of each medium: TV, newspapers, and the Internet. &nbsp;W: Which one do you like best? &nbsp;M: Newspapers. You can read them anytime, even with no power. &nbsp;Q: Which medium does the man like best?",szh:"女：你的演講是關於什麼？　男：每種媒體(medium)的優點(advantage)：電視、報紙和網路。　女：你最喜歡哪一種？　男：報紙(newspaper)。隨時(anytime)都能看，沒電也可以。　問：男士最喜歡哪一種媒體？",en:"Newspapers.",zh:"三種媒體(medium)都是演講的內容，但男士最喜歡的是報紙(newspaper)，因為隨時(anytime)都能看，沒電也行。電視和網路都需要電，正是他說報紙比較好的地方。選 A"},
{n:25,p:2,o:["Forty dollars.","Fifty-eight dollars.","Eighteen dollars."],a:2,sen:"M: How much is it to mail this envelope? &nbsp;W: Eighteen dollars by regular mail, or forty if you want it there tomorrow. &nbsp;M: There's no hurry. &nbsp;W: OK, eighteen, then. &nbsp;Q: How much will the man pay?",szh:"男：寄這個信封(envelope)要多少錢？　女：一般郵件(mail)十八(eighteen)元，如果要明天送到就是四十元。　男：不急。　女：好，那就十八元。　問：男士要付多少錢？",en:"Eighteen dollars.",zh:"男士說不急，所以選一般郵件(mail)，付十八(eighteen)元。四十元是隔天送到的價錢，他不需要；五十八是把兩個價錢加在一起，對話中沒有這個意思。選 C"},
{n:26,p:3,pic:true,o:[BARS("Getting News",["TV","Phone","Paper"],[20,80,50]),BARS("Getting News",["TV","Phone","Paper"],[50,20,80]),BARS("Getting News",["TV","Phone","Paper"],[50,80,20])],a:2,sen:"Our class asked people in our town how they get their news. Ten years ago, most people read the newspaper. Today, more people get the news on their phones than on television. But television is still more popular than the newspaper, which came last this year. &nbsp;Q: Which chart shows how people get their news today?",szh:"我們班調查鎮上的人怎麼得知新聞(news)。十年前，大多數人看報紙(newspaper)。現在，用手機(phone)看新聞的人比看電視(television)的多。但電視還是比報紙受歡迎，報紙今年排最後。　問：哪張圖是現在大家得知新聞的方式？",en:"Phone most, TV second, paper least.",zh:"現在手機(phone)比電視(television)多，電視又比報紙(newspaper)多，所以手機最高、電視第二、報紙最低。報紙最高的那張是十年前的情形；報紙排第二的那張和「報紙排最後」相反。選 C"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27a'),PH('q27b')],a:0,sen:"Grandpa Lee used to read the newspaper every morning. Later, he got a TV with cable and watched the news every evening. But last year, his grandson gave him a phone and showed him how to read news messages on it. Now Grandpa is busy with his phone all day. He reads the news, plays a puzzle game, and even buys soy sauce on it. The TV is hardly on. &nbsp;Q: How does Grandpa Lee get the news now?",szh:"李爺爺以前每天早上看報紙(newspaper)。後來他裝了有線電視(cable)的電視(TV)，每天晚上看新聞(news)。但去年，孫子給了他一支手機(phone)，教他怎麼在上面看新聞訊息(message)。現在爺爺整天忙(busy)著用手機：看新聞、玩益智(puzzle)遊戲，甚至在上面買醬油(soy sauce)。電視很少開。　問：李爺爺現在怎麼得到新聞？",en:"He reads it on his phone.",zh:"爺爺以前看報紙(newspaper)、後來看有線(cable)電視(TV)的新聞，這兩個都是「以前」的方式；去年孫子給他手機(phone)，現在整天忙(busy)著用手機讀新聞訊息(message)，電視很少開，所以現在是用手機。選 A"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28c'),PH('q28b')],a:2,sen:"My little brother wanted to thank Grandma for his birthday gift. She lives eighteen kilometers away, and she doesn't use email. He wanted to send her a message on her phone, but she never reads them. Mom said he could write her a letter, but that takes two days. In the end, he just called her, and she was so happy to hear his voice. &nbsp;Q: How did the brother contact Grandma in the end?",szh:"我弟弟想謝謝奶奶送的生日禮物。她住在十八(eighteen)公里(kilometer)外，而且不用電子郵件(email)。他想傳訊息(message)到她手機，但她從來不看。媽媽說他可以寫信給她，可是要兩天才會到。最後他直接打電話(call)給她，奶奶聽到他的聲音好開心。　問：弟弟最後怎麼聯絡(contact)奶奶？",en:"He called her on the phone.",zh:"電子郵件(email)奶奶不用；手機訊息(message)奶奶不看；寫信要兩天太慢；最後是直接打電話(call)。前面三種都是被否定的方式。選 C"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29a'),PH('q29b')],a:1,sen:"Last month, a journalist went to a small town by a broad river in eastern Taiwan to write a report. He planned to stay in the town's only hotel, but it was full. He thought about sleeping in his car, but the night was too cold. In the end, a kind old couple let him stay in their wood house, and they cooked dinner for him. &nbsp;Q: Where did the journalist stay?",szh:"上個月，一位記者(journalist)到台灣東部(eastern)一條寬闊(broad)河邊的小鎮寫報導(report)。他打算住鎮上唯一的飯店，但客滿了。他想睡在車上，可是晚上太冷。最後一對親切的老夫婦讓他住在他們的木(wood)屋(house)裡，還煮晚餐給他吃。　問：記者住在哪裡？",en:"In an old couple's wood house.",zh:"飯店客滿，沒住成；睡車上因為太冷也放棄；最後住在一對老夫婦的木(wood)屋(house)裡，還和他們一起吃晚餐。選 B"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:1,sen:"Every morning, my father gets the news. For many years, he read the newspaper at breakfast. Last year, it went up by fifty cents, so he stopped buying it. Then he tried the news channel on television, but my little sister always wants cartoons in the morning. Now he reads the news on his phone on the train to work. &nbsp;Q: How does the father get the news now?",szh:"我爸爸每天早上都會看新聞(news)。很多年來，他在早餐時看報紙(newspaper)。去年報紙漲了五十分錢(cent)，他就不買了。後來他試著看電視(television)的新聞頻道(channel)，但我妹妹早上總是要看卡通。現在他在上班的火車上用手機(phone)看新聞。　問：爸爸現在怎麼看新聞？",en:"He reads the news on his phone on the train.",zh:"報紙(newspaper)是他「很多年」的習慣，但漲價後不買了；電視(television)新聞頻道(channel)被妹妹的卡通搶走；「現在」是在火車上用手機(phone)看新聞。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 8 回　電視與通訊　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
