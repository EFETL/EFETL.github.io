    { q:"The teaching _____ at the famous high school quickly attracted more than ten qualified applicants.", zh:"那所知名高中的教職 _____ 很快吸引了十多位合格的申請者。", opts:["career 職業","vacancy 空缺","expectation 期待","inspiration 靈感"], ans:1, an:"【句型結構】主詞（The teaching _____）+ 介系詞片語（at the famous high school）修飾主詞 + 動詞（attracted）+ 受詞（more than ten qualified applicants）。\n\n【關鍵線索】能吸引「十多位合格應徵者」的，是一個職位「空缺」→ vacancy（B）。career（職業生涯）不會吸引 applicants；expectation（期待）、inspiration（靈感）語意不合。", vo:["vacancy (n.) 空缺、空房；vacant (adj.) 空的、空缺的；vacate (v.) 騰空", "【近義詞】opening（職缺）、position（職位）、post（職位）", "【延伸搭配】fill a vacancy（填補空缺）、qualified applicant（合格應徵者）", "applicant (n.) 申請人；apply (v.) 申請；application (n.) 申請書、應用", "career (n.) 職業生涯；a career change（轉職）", "inspiration (n.) 靈感；inspire (v.) 激勵；inspiring (adj.) 鼓舞人心的"], oh:["（職業）N", "（空缺）N", "（期待）N", "（靈感）N"] },
    { q:"The new product designed by young engineers created much more profit than _____ expected.", zh:"這項由年輕工程師設計的新產品創造了比 _____ 預期多得多的利潤。", opts:["initially 最初","genuinely 真誠地","alternatively 替代地","fundamentally 根本地"], ans:0, an:"【句型結構】主詞（The new product）+ 過去分詞片語（designed by young engineers）修飾主詞 + 動詞（created）+ 受詞（much more profit）+ 比較結構（than _____ expected）。\n\n【關鍵線索】than 之後省略了 it was，還原為 than it was initially expected（比最初預期的）。空格需填修飾 expected 的時間副詞，構成「當初預期」與「實際結果」的對比 → initially（A）。genuinely（真誠地）、alternatively（作為替代）、fundamentally（根本上）都無法形成時間點的對比。", vo:["initially (adv.) 最初、起初；initial (adj./n.) 最初的／姓名首字母；initiate (v.) 發起", "【近義詞】originally（原本）、at first（起初）、in the beginning（一開始）", "【延伸搭配】than initially expected（比最初預期的）、initial stage（初期階段）", "profit (n./v.) 利潤／獲利；profitable (adj.) 有利可圖的", "genuinely (adv.) 真誠地；genuine (adj.) 真正的、真誠的", "fundamentally (adv.) 根本上；fundamental (adj.) 根本的；the fundamentals（基本原理）"], oh:["（最初）adv", "（真誠地）adv", "（替代地）adv", "（根本地）adv"] },
    { q:"It has been proven that balanced _____ of fruits and vegetables is a key element of good health.", zh:"已證實均衡的蔬果 _____ 是健康的關鍵要素。", opts:["dimension 尺寸","integration 整合","provision 供應","consumption 消耗"], ans:3, an:"【句型結構】It has been proven that + 名詞子句，It 為虛主詞；子句主詞為 balanced _____ of fruits and vegetables，動詞 is，補語為 a key element of good health。\n\n【關鍵線索】與 fruits and vegetables 搭配、又與 good health 相關 → 指的是「攝取、食用」→ consumption（D）。dimension（尺寸）、integration（整合）語意不合；provision（供應）重點在提供方，而非食用者的攝取量。", vo:["consumption (n.) 攝取、消耗；consume (v.) 食用、消耗；consumer (n.) 消費者", "【近義詞】intake（攝取量）、ingestion（食入）、use（使用量）", "【延伸搭配】food consumption（食物攝取）、energy consumption（能源消耗）、a key element of（…的關鍵要素）", "balanced (adj.) 均衡的；a balanced diet（均衡飲食）", "provision (n.) 供應、條款；provide (v.) 提供；provisions (n.) 糧食", "dimension (n.) 尺寸、面向；dimensional (adj.)；three-dimensional（三維的）"], oh:["（尺寸）N", "（整合）N", "（供應）N", "（攝取／消耗）N"] },
    { q:"As a shy boy who is afraid of public appearances, Timmy _____ the idea of speaking in front of a large audience.", zh:"作為一個害怕公開露面的害羞男孩，Timmy _____ 在大批觀眾前演講的念頭。", opts:["dreads 懼怕","stresses 使緊張","wanders 漫遊","escapes 逃脫"], ans:0, an:"【句型結構】As 引導身分片語（As a shy boy who is afraid of public appearances），其中 who 子句修飾 boy；主句為 Timmy _____ the idea of speaking in front of a large audience。\n\n【關鍵線索】前段 afraid of public appearances（害怕公開露面）是同義線索 → 對上台演說的想法感到「懼怕」→ dreads（A）。stresses（使緊張）用法與語意不符；wanders（漫遊）、escapes（逃脫）都無法接 the idea of 作受詞。", vo:["dread (v./n.) 懼怕／恐懼；dreadful (adj.) 可怕的、糟糕的", "【近義詞】fear（害怕）、be terrified of（極度害怕）、shrink from（畏縮不前）", "【延伸搭配】be afraid of（害怕）、in front of a large audience（在眾多觀眾前）", "audience (n.) 觀眾、聽眾（集合名詞）", "appearance (n.) 露面、外表；appear (v.) 出現、顯得", "wander (v.) 漫遊、閒晃；wonder (v./n.) 想知道／驚奇（勿混淆）"], oh:["（懼怕）V", "（使緊張）V", "（漫遊）V", "（逃脫）V"] },

    { q:"The drunk driver who shouted at passersby and _____ them with glass bottles was quickly arrested by the police.", zh:"那位對路人叫囂並用玻璃瓶 _____ 他們的酒醉駕駛很快被警方逮捕。", opts:["shattered 粉碎","assaulted 攻擊","overturned 推翻","condemned 譴責"], ans:1, an:"【句型結構】主詞（The drunk driver）+ who 引導的關係子句（who shouted at passersby and _____ them with glass bottles）修飾主詞 + 主句動詞（was quickly arrested by the police）。\n\n【關鍵線索】對行人叫囂、還「用玻璃瓶」對他們做某事，隨即被警方逮捕 → 是「攻擊、襲擊」→ assaulted（B）。shattered（粉碎）受詞須為物品；overturned（推翻）、condemned（譴責）都與「用瓶子」的肢體動作不符。", vo:["assault (v./n.) 攻擊、襲擊；assailant (n.) 攻擊者", "【近義詞】attack（攻擊）、strike（打擊）、beat（毆打）", "【延伸搭配】shout at（對…叫囂）、be arrested by the police（被警方逮捕）", "passerby (n.) 路人（複數 passersby）", "shatter (v.) 粉碎、破滅；shattered (adj.) 破碎的、心碎的", "condemn (v.) 譴責、判刑；condemnation (n.) 譴責"], oh:["（粉碎）V", "（攻擊）V", "（推翻）V", "（譴責）V"] },
    { q:"The bus stop was so crowded that I had to _____ my way through the crowd to get on the bus on time.", zh:"公車站人太多，我必須 _____ 穿過人群才能準時上車。", opts:["crash 碰撞","tumble 跌倒","elbow 用手肘推擠","struggle 掙扎"], ans:2, an:"【句型結構】主句（The bus stop was so crowded）+ that 結果子句（I had to _____ my way through the crowd）+ 不定詞表目的（to get on the bus on time）。\n\n【關鍵線索】此處為固定用法「動詞 + one's way through」，表「以某種方式穿越」；在擁擠人群中前進靠的是「用手肘推擠」→ elbow（C）。crash（碰撞）、tumble（跌倒）不能接 one's way；struggle 須改為 struggle through，不接受詞。", vo:["elbow (n./v.) 手肘／用肘推擠；elbow one's way through（用手肘擠過）", "【近義詞】push（推）、shove（猛推）、squeeze（擠）", "【延伸搭配】make one's way through（穿越）、get on the bus（上公車）、on time（準時）", "crowded (adj.) 擁擠的；crowd (n./v.) 人群／聚集", "struggle (v./n.) 掙扎、奮鬥；struggle to V（努力做）；struggle with（與…搏鬥）", "crash (v./n.) 碰撞、墜毀／撞擊；crash into（撞上）"], oh:["（碰撞）V", "（跌倒）V", "（用手肘推擠）V", "（掙扎）V"] },

/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
// 支援 ?y=113 深連結（供 gsat.html 各年份鈕直接指定年份）
let activeYear = (() => {
  const y = new URLSearchParams(location.search).get('y');
  return (y && Object.prototype.hasOwnProperty.call(DATA, y)) ? Number(y) : 107;
})();
let activeMode = 'quiz'; // quiz | flash | list
let qIndex = 0;
let answered = false;
let score = 0;
let totalAnswered = 0;

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
function init() {
  buildYearTabs();
  render();
}

function buildYearTabs() {
  const container = document.getElementById('yearTabs');
  container.innerHTML = '';
  [107,108,109,110,111,112,113,114,115].forEach(yr => {
    const btn = document.createElement('button');
    btn.className = 'year-tab' + (yr === activeYear ? ' active' : '');
    btn.innerHTML = `<span class="dot"></span>${yr}年`;
    btn.onclick = () => { activeYear = yr; qIndex = 0; answered = false; resetScore(); updateYearTabs(); render(); };
    container.appendChild(btn);
  });
}

function updateYearTabs() {
  document.querySelectorAll('.year-tab').forEach((btn, i) => {
    btn.classList.toggle('active', [107,108,109,110,111,112,113,114,115][i] === activeYear);
  });
}

function setMode(mode) {
  activeMode = mode;
  qIndex = 0; answered = false;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+mode).classList.add('active');
  render();
}

function resetScore() { score = 0; totalAnswered = 0; updateScoreDisplay(); }
function updateScoreDisplay() {
  document.getElementById('hdr-score').textContent = `${score}/${totalAnswered}`;
}

/* ═══════════════════════════════════════
   RENDER
═══════════════════════════════════════ */
function render() {
  const main = document.getElementById('mainContent');
  if (activeMode === 'list') { renderList(main); return; }
  if (activeMode === 'flash') { renderFlash(main); return; }
  renderQuiz(main);
}

/* ── Quiz Mode ── */
function renderQuiz(main) {
  const qs = DATA[activeYear];
  if (qIndex >= qs.length) { renderComplete(main); return; }
  const q = qs[qIndex];
  const filled = q.q.replace('_____', '<span class="blank">_____</span>');

  main.innerHTML = `
    <div class="stats-row">
      <div class="stat-chip a"><strong>${qIndex+1}/${qs.length}</strong>題號</div>
      <div class="stat-chip g"><strong>${score}</strong>答對</div>
      <div class="stat-chip r"><strong>${totalAnswered - score}</strong>答錯</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${((qIndex)/qs.length*100).toFixed(1)}%"></div></div>
      <span class="progress-text">${((qIndex)/qs.length*100).toFixed(0)}%</span>
    </div>
    <div class="section-head">📖 ${activeYear}年 第一大題 詞彙題</div>
    <div class="flashcard" id="card">
      <div class="q-label">第 ${qIndex+1} 題 · ${activeYear}年學測</div>
      <div class="q-sentence">${filled}</div>
      <div class="q-zh">${q.zh.replace('_____','<span class="blank">_____</span>')}</div>
      <div class="quiz-opts" id="opts">
        ${q.opts.map((o,i) => `
          <button class="q-opt" id="qopt-${i}" onclick="checkAnswer(${i})">
            <span class="lbl">${['A','B','C','D'][i]}.</span> ${o.split(' ')[0]}
            <span class="zh">${o.split(' ').slice(1).join(' ')}</span>
          </button>`).join('')}
      </div>
      <div class="result-msg" id="result"></div>
      <div class="all-opts-speak" id="allOptsSpeak" style="display:none">
        <div class="aos-title">🔊 點擊單字聆聽發音</div>
        <div class="aos-grid">
          ${q.opts.map((o,i) => {
            const w = o.split(' ')[0];
            const zh = o.split(' ').slice(1).join(' ');
            return `<div class="aos-item ${i===q.ans?'aos-correct':''}" onclick="speak('${w}')">
              <span class="aos-lbl">${['A','B','C','D'][i]}</span>
              <span class="aos-word">${w}</span>
              <span class="aos-zh">${zh}</span>
              <span class="aos-speaker">🔊</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      ${(q.an || q.vo || q.oh) ? `
      <div class="explain" id="explain">
        ${q.an ? `<div class="ex-title">💡 詳解</div>
        <div class="ex-body">${q.an}</div>` : ''}
        ${q.oh && q.oh.some(h => h) ? `<div class="ex-title">🔤 選項辨析</div>
        <ul class="ex-opts">
          ${q.opts.map((o,i) => `<li class="${i===q.ans?'is-ans':''}">
            <span class="eo-lbl">${['A','B','C','D'][i]}</span>
            <span>${o.split(' ')[0]} ${q.oh[i] || ''}${i===q.ans?' ✓':''}</span>
          </li>`).join('')}
        </ul>` : ''}
        ${q.vo && q.vo.length ? `<div class="ex-title">📘 延伸單字（${q.vo.length}）</div>
        <ul class="ex-vocab">${q.vo.map(v => `<li>${v}</li>`).join('')}</ul>` : ''}
      </div>` : ''}
    </div>
    <div class="nav-row">
      <button class="nav-btn nav-prev" onclick="goTo(${qIndex-1})" ${qIndex===0?'disabled style="opacity:.4"':''}>← 上一題</button>
      <button class="nav-btn nav-next" onclick="goTo(${qIndex+1})" id="nextBtn" ${!answered?'disabled style="opacity:.5"':''}>下一題 →</button>
    </div>`;
}

function checkAnswer(chosen) {
  if (answered) return;
  answered = true;
  const q = DATA[activeYear][qIndex];
  const correct = q.ans;
  const btns = document.querySelectorAll('.q-opt');
  btns.forEach((b,i) => {
    b.disabled = true;
    if (i === correct) b.classList.add('correct');
    if (i === chosen && i !== correct) b.classList.add('wrong');
  });
  const result = document.getElementById('result');
  result.classList.add('show');
  totalAnswered++;
  if (chosen === correct) {
    score++;
    result.classList.add('ok');
    result.textContent = `✅ 答對了！正確答案：${['A','B','C','D'][correct]}. ${q.opts[correct]}`;
  } else {
    result.classList.add('fail');
    result.textContent = `❌ 答錯了！正確答案：${['A','B','C','D'][correct]}. ${q.opts[correct]}`;
  }
  // Auto-speak correct answer, then show all-options panel
  speak(q.opts[correct].split(' ')[0]);
  const panel = document.getElementById('allOptsSpeak');
  if (panel) { panel.style.display = 'block'; panel.style.animation = 'fadeIn .3s'; }
  // 作答後展開詳解／選項辨析／延伸單字
  const ex = document.getElementById('explain');
  if (ex) ex.classList.add('show');
  updateScoreDisplay();
  const nextBtn = document.getElementById('nextBtn');
  if (nextBtn) { nextBtn.disabled = false; nextBtn.style.opacity = '1'; }
}

function goTo(idx) {
  const qs = DATA[activeYear];
  if (idx < 0 || idx > qs.length) return;
  qIndex = idx; answered = false;
  render();
}

/* ── Flashcard Mode ── */
function renderFlash(main) {
  const qs = DATA[activeYear];
  if (qIndex >= qs.length) { renderComplete(main); return; }
  const q = qs[qIndex];
  const filled = q.q.replace('_____', '<span class="blank">_____</span>');
  const correctWord = q.opts[q.ans].split(' ')[0];
  const correctZh = q.opts[q.ans].split(' ').slice(1).join(' ');

  main.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${((qIndex)/qs.length*100).toFixed(1)}%"></div></div>
      <span class="progress-text">${qIndex+1}/${qs.length}</span>
    </div>
    <div class="section-head">🃏 ${activeYear}年 單字卡模式</div>
    <div class="flashcard" id="card">
      <div class="q-label">第 ${qIndex+1} 題</div>
      <div class="q-sentence">${filled}</div>
      <div class="q-zh">${q.zh.replace('_____','<span class="blank">_____</span>')}</div>
      <button class="answer-toggle" id="revealBtn" onclick="revealFlash()">👁 查看答案</button>
      <div class="vocab-reveal" id="vocabReveal">
        <div class="vocab-word-row">
          <span class="vocab-word">${correctWord}</span>
          <button class="speak-btn" onclick="speak('${correctWord}')">🔊 發音</button>
        </div>
        <div class="vocab-zh">${correctZh}</div>
        <div><span class="vocab-pos">正確選項</span></div>
        <div class="aos-title" style="margin-top:8px">🔊 點擊任一單字聆聽發音</div>
        <div class="aos-grid">
          ${q.opts.map((o,i) => {
            const w = o.split(' ')[0]; const zh2 = o.split(' ').slice(1).join(' ');
            return `<div class="aos-item ${i===q.ans?'aos-correct':''}" onclick="speak('${w}')">
              <span class="aos-lbl">${['A','B','C','D'][i]}</span>
              <span class="aos-word">${w}</span>
              <span class="aos-zh">${zh2}</span>
              <span class="aos-speaker">🔊</span>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn nav-prev" onclick="goTo(${qIndex-1})" ${qIndex===0?'disabled style="opacity:.4"':''}>← 上一題</button>
      <button class="nav-btn nav-next" onclick="goTo(${qIndex+1})">下一題 →</button>
    </div>`;
}

function revealFlash() {
  const r = document.getElementById('vocabReveal');
  const b = document.getElementById('revealBtn');
  r.classList.toggle('show');
  b.textContent = r.classList.contains('show') ? '🙈 隱藏答案' : '👁 查看答案';
  if (r.classList.contains('show')) {
    const word = DATA[activeYear][qIndex].opts[DATA[activeYear][qIndex].ans].split(' ')[0];
    speak(word);
  }
}

/* ── List Mode ── */
function renderList(main) {
  const qs = DATA[activeYear];
  main.innerHTML = `
    <div class="section-head">📋 ${activeYear}年 全部單字 — 點擊發音</div>
    <div class="wordlist">
      ${qs.map((q,i) => `
        <div class="wl-item">
          <div class="wl-num">${i+1}</div>
          <div class="wl-info" style="width:100%">
            <div class="wl-q" style="font-size:0.75rem;color:var(--text-light);margin-bottom:8px;line-height:1.6">
              ${q.zh.replace('_____','<span style="color:var(--gold);font-weight:700">_____</span>')}
            </div>
            <div class="aos-grid">
              ${q.opts.map((o,j) => {
                const w = o.split(' ')[0];
                const zh = o.split(' ').slice(1).join(' ');
                return `<div class="aos-item ${j===q.ans?'aos-correct':''}" onclick="speak('${w}')">
                  <span class="aos-lbl">${['A','B','C','D'][j]}</span>
                  <span class="aos-word">${w}</span>
                  <span class="aos-zh">${zh}</span>
                  <span class="aos-speaker">🔊</span>
                </div>`;
              }).join('')}
            </div>
          </div>
        </div>`).join('')}
    </div>`;
}

/* ── Complete Screen ── */
function renderComplete(main) {
  const pct = totalAnswered > 0 ? Math.round(score/totalAnswered*100) : 0;
  const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '💪' : '📚';
  main.innerHTML = `
    <div class="complete-screen show">
      <div class="complete-icon">${emoji}</div>
      <div class="complete-title">${activeYear}年完成！</div>
      <div class="complete-score">
        本輪成績：<strong>${score} / ${totalAnswered}</strong><br>
        正確率 <strong style="color:var(--accent)">${pct}%</strong>
      </div>
      <button class="restart-btn" onclick="restartYear()">🔄 重新練習</button>
      <div style="margin-top:16px;font-size:0.8rem;color:var(--text-light)">或選擇上方其他年份繼續挑戰</div>
    </div>`;
}

function restartYear() {
  qIndex = 0; answered = false; resetScore(); render();
}

/* ═══════════════════════════════════════
   SPEECH SYNTHESIS
═══════════════════════════════════════ */
function speak(word) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  u.rate = 0.82;
  u.pitch = 1.15;  // 稍高音調 → 女聲
  u.volume = 1;

  // 優先選女聲：找名字含 female / woman / girl / Samantha / Zira / Karen / Victoria / Moira / Fiona / Tessa 的聲音
  const voices = window.speechSynthesis.getVoices();
  const femaleKeywords = ['samantha','zira','karen','victoria','moira','fiona','tessa','susan','female','woman','girl','google us english'];
  let femaleVoice = null;

  // 第一優先：en-US 女聲
  femaleVoice = voices.find(v =>
    v.lang.startsWith('en') &&
    femaleKeywords.some(k => v.name.toLowerCase().includes(k))
  );

  // 第二優先：任何英文女聲
  if (!femaleVoice) {
    femaleVoice = voices.find(v =>
      v.lang.startsWith('en') &&
      (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('woman'))
    );
  }

  // 第三優先：Google US English（通常為女聲）
  if (!femaleVoice) {
    femaleVoice = voices.find(v => v.name === 'Google US English');
  }

  // 第四優先：任意英文聲音
  if (!femaleVoice) {
    femaleVoice = voices.find(v => v.lang.startsWith('en-US')) ||
                  voices.find(v => v.lang.startsWith('en'));
  }

  if (femaleVoice) u.voice = femaleVoice;
  window.speechSynthesis.speak(u);
}

// 等聲音清單載入後才能選音色（部分瀏覽器需要此事件）
window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

/* ═══════════════════════════════════════
   BOOT
═══════════════════════════════════════ */
init();
</script>
