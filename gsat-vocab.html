<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學測英文單字練習 | 107–115年 全收錄</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Bebas+Neue&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --blue: #1b4f72;
    --accent: #f5a623;
    --gold: #e8c84a;
    --green: #27ae60;
    --red: #e74c3c;
    --white: #f9f6f0;
    --card-bg: #162032;
    --text-light: #c9d6e3;
    --border: #2a4060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', 'Noto Sans TC', sans-serif;
    background: var(--navy);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 20% 80%, rgba(27,79,114,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(245,166,35,0.05) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  /* ── Header ── */
  header {
    position: relative; z-index: 10;
    background: linear-gradient(135deg, #0d1b2a 60%, #132540);
    border-bottom: 3px solid var(--accent);
    padding: 16px 20px 12px;
    display: flex; align-items: center; gap: 14px;
    flex-wrap: wrap;
  }
  .logo-block h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.9rem; letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(245,166,35,0.35);
    line-height: 1;
  }
  .logo-block .sub {
    font-size: 0.68rem; color: var(--text-light);
    letter-spacing: 2.5px; text-transform: uppercase;
    margin-top: 3px;
  }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .score-display {
    background: rgba(245,166,35,0.1);
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 10px; padding: 6px 14px;
    font-size: 0.72rem; color: var(--text-light);
    text-align: center;
  }
  .score-display strong { display: block; font-size: 1.15rem; color: var(--accent); font-weight: 800; }

  /* ── Year Tabs ── */
  .year-tabs {
    position: relative; z-index: 10;
    display: flex;
    background: #090f18;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .year-tabs::-webkit-scrollbar { display: none; }
  .year-tab {
    flex: 1; min-width: 68px;
    padding: 12px 6px;
    text-align: center;
    cursor: pointer;
    font-weight: 700; font-size: 0.8rem;
    letter-spacing: 1.5px;
    color: var(--text-light);
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    background: none; border-top: none; border-left: none; border-right: none;
    white-space: nowrap;
  }
  .year-tab:hover { color: var(--accent); }
  .year-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: rgba(245,166,35,0.06);
  }
  .year-tab .dot {
    width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
    display: inline-block; margin-right: 5px;
    opacity: 0;
  }
  .year-tab.active .dot { opacity: 1; }

  /* ── Mode Bar ── */
  .mode-bar {
    position: relative; z-index: 10;
    display: flex; gap: 8px; padding: 12px 16px;
    background: #0d1520;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .mode-btn {
    padding: 6px 14px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-light);
    border-radius: 30px;
    font-weight: 600; font-size: 0.75rem;
    cursor: pointer; transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .mode-btn:hover { border-color: var(--accent); color: var(--accent); }
  .mode-btn.active { background: var(--accent); border-color: var(--accent); color: var(--navy); }

  /* ── Main ── */
  main {
    position: relative; z-index: 5;
    max-width: 700px; margin: 0 auto;
    padding: 22px 14px 80px;
  }

  /* ── Progress ── */
  .progress-wrap {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 18px;
  }
  .progress-bar {
    flex: 1; height: 5px;
    background: #1a2e47; border-radius: 3px; overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--gold));
    border-radius: 3px; transition: width 0.4s ease;
  }
  .progress-text { font-size: 0.7rem; color: var(--text-light); font-weight: 700; white-space: nowrap; }

  /* ── Flashcard ── */
  .flashcard {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    padding: 28px 24px 24px;
    margin-bottom: 16px;
    animation: cardIn 0.32s cubic-bezier(.22,1,.36,1);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }
  .q-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.8rem; letter-spacing: 3px;
    color: var(--accent); opacity: 0.75; margin-bottom: 8px;
  }
  .q-sentence {
    font-size: 1rem; line-height: 1.8;
    color: var(--white); margin-bottom: 10px;
  }
  .blank { color: var(--gold); font-weight: 800; }
  .q-zh {
    font-size: 0.8rem; color: var(--text-light);
    line-height: 1.7;
    border-left: 3px solid #2a4060;
    padding-left: 10px; margin-bottom: 18px;
  }

  /* ── Vocab reveal (flashcard mode) ── */
  .answer-toggle {
    display: inline-flex; align-items: center; gap: 7px;
    background: none; border: 1.5px solid var(--border);
    color: var(--text-light);
    padding: 7px 14px; border-radius: 8px;
    font-size: 0.76rem; cursor: pointer; transition: all 0.2s;
    font-weight: 600; letter-spacing: 0.5px; margin-bottom: 14px;
  }
  .answer-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .vocab-reveal {
    display: none;
    background: linear-gradient(135deg, #193354, #0f2540);
    border: 1px solid var(--accent);
    border-radius: 12px; padding: 16px 18px;
    margin-bottom: 14px;
  }
  .vocab-reveal.show { display: block; animation: fadeIn 0.25s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .vocab-word-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .vocab-word {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem; letter-spacing: 3px; color: var(--accent);
  }
  .speak-btn {
    background: var(--accent); border: none;
    color: var(--navy); padding: 6px 12px;
    border-radius: 7px; cursor: pointer;
    font-weight: 800; font-size: 0.72rem;
    transition: all 0.18s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .speak-btn:hover { transform: scale(1.07); background: var(--gold); }
  .speak-btn:active { transform: scale(0.96); }
  .vocab-pos {
    display: inline-block;
    background: rgba(245,166,35,0.13); color: var(--accent);
    font-size: 0.65rem; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .vocab-zh { font-size: 1.05rem; font-weight: 700; color: var(--white); margin: 4px 0 8px; }
  /* ── All-options speak panel (quiz + flash + list) ── */
  .all-opts-speak {
    margin-top: 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .aos-title {
    font-size: 0.7rem; color: var(--text-light);
    letter-spacing: 1.5px; text-transform: uppercase;
    margin-bottom: 8px; font-weight: 700;
  }
  .aos-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
  }
  @media(max-width:420px) { .aos-grid { grid-template-columns: 1fr; } }
  .aos-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid var(--border);
    border-radius: 9px; padding: 9px 11px;
    cursor: pointer; transition: all 0.18s;
    user-select: none;
  }
  .aos-item:hover { border-color: var(--accent); background: rgba(245,166,35,0.08); transform: translateY(-1px); }
  .aos-item:active { transform: scale(0.97); }
  .aos-item.aos-correct { border-color: var(--green); background: rgba(39,174,96,0.1); }
  .aos-item.aos-correct:hover { background: rgba(39,174,96,0.18); }
  .aos-lbl {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem; color: var(--accent);
    min-width: 16px;
  }
  .aos-item.aos-correct .aos-lbl { color: var(--green); }
  .aos-word { font-weight: 700; font-size: 0.9rem; color: var(--white); flex: 1; }
  .aos-zh { font-size: 0.68rem; color: var(--text-light); }
  .aos-speaker { font-size: 0.85rem; opacity: 0.6; margin-left: auto; }
  .aos-item:hover .aos-speaker { opacity: 1; }

  /* ── Quiz mode options ── */
  .quiz-opts {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media(max-width:460px) { .quiz-opts { grid-template-columns: 1fr; } }
  .q-opt {
    background: rgba(255,255,255,0.04);
    border: 2px solid var(--border);
    color: var(--white);
    padding: 14px 12px; border-radius: 12px;
    font-size: 0.88rem; font-weight: 600;
    cursor: pointer; transition: all 0.18s;
    text-align: left; border-top: none; border-left: none;
    border: 2px solid var(--border);
  }
  .q-opt:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(245,166,35,0.07);
    transform: translateY(-2px);
  }
  .q-opt .lbl { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; color: var(--accent); margin-right: 5px; }
  .q-opt .zh { display: block; font-size: 0.7rem; color: var(--text-light); margin-top: 2px; }
  .q-opt.correct { border-color: var(--green) !important; background: rgba(39,174,96,0.15) !important; }
  .q-opt.wrong   { border-color: var(--red) !important; background: rgba(231,76,60,0.12) !important; }
  .q-opt:disabled { cursor: default; }

  .result-msg {
    display: none; margin-top: 12px;
    padding: 10px 14px; border-radius: 9px;
    font-weight: 700; font-size: 0.85rem;
  }
  .result-msg.show { display: block; animation: fadeIn 0.2s; }
  .result-msg.ok   { background: rgba(39,174,96,0.12); color: #2ecc71; border: 1px solid #27ae60; }
  .result-msg.fail { background: rgba(231,76,60,0.1);  color: #e74c3c; border: 1px solid #c0392b; }

  /* ── 詳解 / 延伸單字（自舊站 s1-* 合併） ── */
  .explain {
    display: none; margin-top: 14px;
    background: rgba(91,141,238,0.06);
    border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 14px 16px;
    text-align: left;
  }
  .explain.show { display: block; animation: fadeIn 0.25s; }
  .ex-title {
    font-size: 0.82rem; font-weight: 800; color: var(--accent);
    margin: 0 0 7px; letter-spacing: 0.03em;
  }
  .ex-title + .ex-title, .ex-body + .ex-title, .ex-opts + .ex-title, .ex-vocab + .ex-title { margin-top: 15px; }
  .ex-body { font-size: 0.88rem; line-height: 1.75; color: var(--txt); white-space: pre-line; }
  .ex-opts { list-style: none; padding: 0; margin: 0; }
  .ex-opts li {
    font-size: 0.82rem; line-height: 1.6; color: var(--muted);
    padding: 3px 0; display: flex; gap: 7px;
  }
  .ex-opts li.is-ans { color: var(--txt); font-weight: 700; }
  .ex-opts .eo-lbl { color: var(--acc3); font-weight: 800; min-width: 1.2em; }
  .ex-vocab { list-style: none; padding: 0; margin: 0; }
  .ex-vocab li {
    font-size: 0.82rem; line-height: 1.65; color: var(--muted);
    padding: 4px 0 4px 13px; position: relative;
  }
  .ex-vocab li::before {
    content: "▸"; position: absolute; left: 0; color: var(--acc2);
  }
  @media (max-width: 600px) {
    .ex-body { font-size: 0.85rem; }
    .ex-opts li, .ex-vocab li { font-size: 0.8rem; }
  }

  /* ── Wordlist mode ── */
  .wordlist { display: flex; flex-direction: column; gap: 10px; }
  .wl-item {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .wl-item:hover { border-color: var(--accent); }
  .wl-num { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--accent); min-width: 32px; text-align: center; }
  .wl-info { flex: 1; }
  .wl-word { font-size: 1.05rem; font-weight: 700; color: var(--white); display: flex; align-items: center; gap: 8px; }
  .wl-zh { font-size: 0.78rem; color: var(--text-light); margin-top: 2px; }

  /* ── Nav ── */
  .nav-row {
    display: flex; gap: 10px; margin-top: 18px;
  }
  .nav-btn {
    flex: 1; padding: 13px 8px;
    border-radius: 12px; font-weight: 700;
    font-size: 0.85rem; cursor: pointer;
    letter-spacing: 0.5px; transition: all 0.2s;
    border: none;
  }
  .nav-prev { background: #1a2e47; color: var(--text-light); }
  .nav-prev:hover { background: var(--border); color: var(--white); }
  .nav-next { background: linear-gradient(135deg, var(--accent), var(--gold)); color: var(--navy); }
  .nav-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,166,35,0.3); }

  /* ── Complete Screen ── */
  .complete-screen {
    display: none; text-align: center; padding: 50px 20px;
    animation: fadeIn 0.4s;
  }
  .complete-screen.show { display: block; }
  .complete-icon { font-size: 4rem; margin-bottom: 16px; }
  .complete-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem; letter-spacing: 4px; color: var(--accent);
    margin-bottom: 8px;
  }
  .complete-score { font-size: 1.1rem; color: var(--text-light); margin-bottom: 24px; }
  .complete-score strong { color: var(--white); font-size: 1.6rem; }
  .restart-btn {
    background: var(--accent); border: none; color: var(--navy);
    padding: 14px 32px; border-radius: 12px;
    font-weight: 800; font-size: 0.9rem; cursor: pointer;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,166,35,0.35); }

  /* ── Section heading ── */
  .section-head {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem; letter-spacing: 3px; color: var(--accent);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px;
  }
  .section-head::after {
    content: ''; flex: 1;
    height: 1px; background: linear-gradient(90deg, var(--border), transparent);
  }

  /* ── Score chips ── */
  .stats-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-chip {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 12px;
    font-size: 0.72rem; color: var(--text-light);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    min-width: 64px;
  }
  .stat-chip strong { color: var(--white); font-size: 1.05rem; font-weight: 800; }
  .stat-chip.g strong { color: var(--green); }
  .stat-chip.r strong { color: var(--red); }
  .stat-chip.a strong { color: var(--accent); }
</style>
</head>
