<div class="bar">
 <b>🖨 第 18 回　動物　聽力測驗　列印版</b>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第18回 動物） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/18/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/18/p3_${n}.jpg?v=r18hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const LION=`<img class="pic-img p0img" src="gept-listening-img/18/p0_q1.jpg" alt="question 1 picture">`;
const BUTTERFLY=`<img class="pic-img p0img" src="gept-listening-img/18/p0_q2.jpg" alt="question 2 picture">`;
const FROG=`<img class="pic-img p0img" src="gept-listening-img/18/p0_q3.jpg" alt="question 3 picture">`;
const BEAR=`<img class="pic-img p0img" src="gept-listening-img/18/p0_q4.jpg" alt="question 4 picture">`;
const CAT=`<img class="pic-img p0img" src="gept-listening-img/18/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:LION,o:["A lion is standing on a big rock.","Two lions are standing on a big rock.","A lion is lying down on a big rock."],a:0,sen:"For question one, look at the picture. Which is true about the picture?",szh:"第一題，請看圖片。關於這張圖，何者正確？",en:"A lion is standing on a big rock.",zh:"一隻公獅子(lion)四腳站在一塊大石頭上，正確。牠是站著，不是趴著；圖中只有一隻獅子，不是兩隻。選 A"},
{n:2,p:0,fig:BUTTERFLY,o:["Two butterflies are resting on the yellow flower.","A butterfly is on the pink flower, and a bee is on the yellow flower.","A bee is on the pink flower, and a butterfly is on the yellow flower."],a:2,sen:"For question two, look at the picture. What do you see on the flowers?",szh:"第二題，請看圖片。你在花上看到什麼？",en:"A bee is on the pink flower, and a butterfly is on the yellow flower.",zh:"左邊粉紅色的花上停著一隻蜜蜂(bee)，右邊黃色的花上停著一隻蝴蝶(butterfly)，正確。把兩隻昆蟲的位置對調就錯了；黃花上只有一隻蝴蝶，不是兩隻在休息(rest)。選 C"},
{n:3,p:0,fig:FROG,o:["A green frog and a red crab are swimming in the water.","A green frog and a red crab are sitting on the rocks.","A red frog and a green crab are sitting on the rocks."],a:1,sen:"For question three, look at the picture. What is next to the water?",szh:"第三題，請看圖片。水邊有什麼？",en:"A green frog and a red crab are sitting on the rocks.",zh:"水邊的兩塊石頭上，左邊坐著一隻綠色青蛙(frog)，右邊是一隻紅色螃蟹(crab)，正確。牠們在石頭上，不是在水裡游泳；青蛙是綠的、螃蟹是紅的，顏色對調就錯了。選 B"},
{n:4,p:0,fig:BEAR,o:["A bear and a deer are touching noses.","A bear is running after a deer.","A bear and a deer are lying down on the grass."],a:0,sen:"For question four, look at the picture. What are the two animals doing?",szh:"第四題，請看圖片。這兩隻動物在做什麼？",en:"A bear and a deer are touching noses.",zh:"一隻熊(bear)坐在草地上，和一隻鹿(deer)鼻子碰鼻子，正確。熊是坐著，沒有在追鹿；熊坐著、鹿站著，兩隻都沒有躺下。選 A"},
{n:5,p:0,fig:CAT,o:["A cat is sitting between a monkey and a mouse.","A monkey is sitting between a cat and a mouse.","A mouse is sitting between a cat and a monkey."],a:1,sen:"For question five, look at the picture. Which is true about the picture?",szh:"第五題，請看圖片。關於這張圖，何者正確？",en:"A monkey is sitting between a cat and a mouse.",zh:"沙發上從左到右是貓(cat)、小猴子(monkey)、白老鼠(mouse)，所以猴子在貓和老鼠中間，正確。老鼠在最右邊，不在中間；貓在最左邊，也不在中間。選 B"},
{n:6,p:1,o:["Yes, I helped him yesterday.","Certainly. Which part don't you understand?","It's about the insects in our garden."],a:1,sen:"Could you help me with my science report again?",szh:"你可以再幫我看一次自然報告嗎？",en:"Certainly. Which part don't you understand?",zh:"對方請你再(again)幫(help)一次忙，答「當然(certainly)，你哪裡不懂(understand)？」最自然。「我昨天幫了他」人物錯了，也沒回答這次幫不幫；「是關於花園(garden)裡的昆蟲(insect)」好像自己是寫報告的人，答非所問。選 B"},
{n:7,p:1,o:["I'm from downtown Taipei.","Sure, I'll speak to him.","Yes, English and a little Japanese."],a:2,sen:"Can you speak any foreign languages?",szh:"你會說任何外語嗎？",en:"Yes, English and a little Japanese.",zh:"問會不會說(speak)外(foreign)語，答「會，英文和一點日文」最自然。「好，我會跟他說」只是重複 speak；「我來自台北市中心(downtown)」答的是從哪裡來。選 C"},
{n:8,p:1,o:["I like ants more than bees.","Let's get in line for the movie.","Oh, no! Did someone leave food out?"],a:2,sen:"Hey, there's a long line of ants on the kitchen floor.",szh:"嘿，廚房地板上有一長排螞蟻。",en:"Oh, no! Did someone leave food out?",zh:"對方說(hey)廚房有一長排(line)螞蟻(ant)，回「糟了！是不是有人把食物留(leave)在外面？」最自然。「我們去排隊看電影」只是重複 line；「比起蜜蜂我更喜歡螞蟻」沒回應螞蟻跑進廚房的問題。選 C"},
{n:9,p:1,o:["It's sitting on a rock in the garden.","Keep its water clean, for instance.","Yes, I gave the waiter a tip."],a:1,sen:"Do you have any tips for taking care of a pet frog?",szh:"養寵物青蛙你有什麼訣竅嗎？",en:"Keep its water clean, for instance.",zh:"問養青蛙的訣竅(tip)，答「例如(for instance)把牠的水保持乾淨」才是建議。「我給了服務生小費」把 tip 當成「小費」，是同字陷阱；「牠坐在花園的石頭上」答的是牠在哪裡。選 B"},
{n:10,p:1,o:["Good idea. My legs hurt, too.","Just a moment. I'll get him.","The rest of the cake is in the box."],a:0,sen:"I think we should rest here for a moment.",szh:"我想我們應該在這裡休息一下。",en:"Good idea. My legs hurt, too.",zh:"對方提議休息(rest)一下(moment)，回「好主意，我的腿也痛了」最自然。「剩下的蛋糕在盒子裡」把 rest 當成「剩下的」；「等一下，我去叫他」是接電話的用語，只是重複 moment。選 A"},
{n:11,p:1,o:["Koalas sleep most of the day.","The zoo will introduce it to visitors next week.","The zoo is within walking distance."],a:1,sen:"What's the latest news about the baby koala?",szh:"那隻無尾熊寶寶最新的消息是什麼？",en:"The zoo will introduce it to visitors next week.",zh:"問無尾熊(koala)寶寶最新(latest)的消息，答「動物園下週會把牠介紹(introduce)給遊客」才是新消息。「動物園走路就到得了(within)」答的是距離；「無尾熊一天大多在睡覺」是一般常識，不是關於這隻寶寶的新消息。選 B"},
{n:12,p:1,o:["Until next Monday.","We'll see the lions and bears.","Because of the heavy rain."],a:2,sen:"Why was our trip to the zoo delayed?",szh:"我們去動物園的旅行為什麼延期了？",en:"Because of the heavy rain.",zh:"問為什麼延期(delay)，答「因為下大雨」才是原因。「延到下週一」答的是時間；「我們會看到獅子(lion)和熊(bear)」講的是行程內容。選 C"},
{n:13,p:1,o:["It's my brother's. He calls it Snow.","It's afraid of the cat.","It lives in a box in my room."],a:0,sen:"Who's the owner of this little white mouse?",szh:"這隻小白鼠的主人是誰？",en:"It's my brother's. He calls it Snow.",zh:"問小白鼠(mouse)的主人(owner)是誰，答「是我哥哥的，他叫牠小雪」才是人物。「牠住在我房間的盒子裡」答的是地點；「牠怕貓(cat)」答的是特性。選 A"},
{n:14,p:1,o:["Don't worry. A small bean won't hurt him.","Is he growing beans in the garden?","Let's have bean soup for dinner."],a:0,sen:"My little brother swallowed a bean, and now he's crying.",szh:"我弟弟吞了一顆豆子，現在在哭。",en:"Don't worry. A small bean won't hurt him.",zh:"對方說弟弟吞(swallow)了一顆豆子(bean)在哭，安慰「別擔心，一顆小豆子不會傷到他」最自然。「他在花園種豆子嗎？」只重複 bean；「晚餐來喝豆子湯吧」也只是重複 bean，沒有回應弟弟在哭。選 A"},
{n:15,p:1,o:["On the left, near the wheel.","It hurts a lot.","I fell off my bicycle when a cat ran across the road."],a:2,sen:"How did you hurt your wrist?",szh:"你的手腕怎麼受傷的？",en:"I fell off my bicycle when a cat ran across the road.",zh:"問手腕(wrist)「怎麼」受傷，答「一隻貓衝過馬路，我從腳踏車上摔下來」才是經過。「很痛」答的是痛的程度；「左邊，靠近輪子(wheel)」答的是位置。選 C"},
{n:16,p:2,o:["The monkeys.","The bears.","The lions."],a:1,sen:"W: Let's see the lions first. &nbsp;M: The lion section is closed until two. How about the monkeys? &nbsp;W: The monkeys are eating lunch now. Let's see the bears first and the monkeys after that. &nbsp;M: OK. &nbsp;Q: Which animals will they see first?",szh:"女：我們先去看獅子(lion)吧。　男：獅子區(section)兩點前不開放。看猴子(monkey)怎麼樣？　女：猴子現在在吃午餐，我們先看熊(bear)，再看猴子。　男：好。　問：他們會先看哪種動物？",en:"The bears.",zh:"獅子區(section)兩點前關閉，猴子在吃午餐，所以先看熊(bear)，之後才看猴子。獅子是最初的計畫，被否定；猴子排在熊之後。選 B"},
{n:17,p:2,o:["It didn't try to catch the mouse.","It ran after the mouse.","It caught the mouse."],a:0,sen:"M: Did your cat catch the mouse in the kitchen? &nbsp;W: No. It just looked at the mouse for a moment and went back to sleep. &nbsp;M: Such a lazy cat! &nbsp;Q: What do we know about the cat?",szh:"男：你的貓(cat)抓到廚房那隻老鼠(mouse)了嗎？　女：沒有，牠只看了老鼠一下(moment)就回去睡覺了。　男：真是(such)一隻懶貓！　問：關於這隻貓我們知道什麼？",en:"It didn't try to catch the mouse.",zh:"貓只看了老鼠一眼就回去睡，換句話說就是「牠根本沒有試著去抓」。女士說沒抓到，所以不是抓到了；牠沒有追，只是看一眼就睡了。選 A"},
{n:18,p:2,o:["A cat and a dog.","A dog.","A cat."],a:2,sen:"W: Let's get a pet. I'd like a cat. &nbsp;M: I'd like a dog. But you'll be the one who takes care of it. &nbsp;W: That's true. So I decide? &nbsp;M: Yes. I agree with whatever you choose. &nbsp;Q: What pet will they most likely get?",szh:"女：我們養隻寵物吧，我想要貓(cat)。　男：我想要狗。不過照顧牠的人會是你。　女：沒錯，所以由我決定(decide)？　男：對，你選什麼我都同意(agree)。　問：他們最可能養什麼寵物？",en:"A cat.",zh:"男士雖然想要狗，但同意(agree)由要照顧寵物的女士決定(decide)，而女士想要貓，所以最可能養貓。狗是男士的想法，但他讓女士決定；對話沒說兩隻都養。選 C"},
{n:19,p:2,o:["Plant a new tree.","Get a big machine.","Move the small tree."],a:0,sen:"M: Let's move this small tree to the other side of the garden. &nbsp;W: We can't. Its roots go too deep. We'd need a big machine. &nbsp;M: Then let's just plant a new tree over there. &nbsp;Q: What will they do?",szh:"男：我們把這棵小樹移到花園(garden)另一邊吧。　女：沒辦法，它的根(root)長得太深(deep)了，要用大機器才行。　男：那我們就在那邊種一棵新的樹吧。　問：他們會做什麼？",en:"Plant a new tree.",zh:"小樹的根(root)太深(deep)移不動，男士改提議在另一邊種一棵新樹。移樹是被否定的計畫；用大機器只是女士說「要移樹才需要」，他們沒有要去弄機器。選 A"},
{n:20,p:2,o:["Seventeen.","Twelve.","Fifteen."],a:2,sen:"M: How many animals did you see at the pond? &nbsp;W: Twelve frogs and five crabs, I think. &nbsp;M: Wait. Look at this photo. Two of your frogs are really rocks! &nbsp;W: Oh! How silly of me. &nbsp;Q: How many animals did the woman really see?",szh:"男：你在池塘看到幾隻動物(animal)？　女：我想是十二隻青蛙(frog)和五隻螃蟹(crab)。　男：等等，你看這張照片，有兩隻「青蛙」其實是石頭！　女：喔！我真傻(silly)。　問：女士實際上看到幾隻動物？",en:"Fifteen.",zh:"十二隻青蛙加五隻螃蟹是十七，但其中兩隻「青蛙」是石頭，所以實際是十五隻。十七是沒扣掉石頭的數字；十二是她原本以為的青蛙數量。選 C"},
{n:21,p:2,o:["He understands five languages.","He is a genius.","He can copy words."],a:2,sen:"W: Your parrot can say hello in five languages! &nbsp;M: Yes, but he doesn't understand any of them. He just copies the sounds. &nbsp;W: So he's not a genius after all. &nbsp;Q: What do we know about the parrot?",szh:"女：你的鸚鵡會用五種語言說哈囉！　男：對，但牠一種都聽不懂(understand)，只是模仿聲音。　女：所以牠終究不是天才(genius)。　問：關於這隻鸚鵡我們知道什麼？",en:"He can copy words.",zh:"男士說鸚鵡聽不懂(understand)，只是模仿聲音，換句話說就是「牠會模仿說話」。牠說得出五種語言，但不懂意思；女士最後也說牠不是天才(genius)。選 C"},
{n:22,p:2,o:["See the deer.","Stay after five.","See the koalas."],a:0,sen:"M: We have to leave the zoo at five. It's already four-thirty. &nbsp;W: Can we see the koalas before we go? &nbsp;M: The koala house is twenty minutes from here. There's no time. &nbsp;W: OK. Then let's say goodbye to the deer near the gate. &nbsp;Q: What will they do before they leave?",szh:"男：我們五點得離開(leave)動物園，現在已經四點半了。　女：走之前可以去看無尾熊(koala)嗎？　男：無尾熊館離這裡二十分鐘，來不及了。　女：好吧，那我們去跟門口附近的鹿(deer)說再見(goodbye)。　問：他們離開前會做什麼？",en:"See the deer.",zh:"去無尾熊(koala)館來回要四十分鐘，只剩半小時來不及，所以改去看門口的鹿(deer)。看無尾熊是女士想做但被否定的；他們五點就要離開，不會待到五點以後。選 A"},
{n:23,p:2,o:["Small fish.","Tofu.","Nothing."],a:1,sen:"W: What do you feed your turtle? &nbsp;M: Usually small fish. But the market had no fish today. &nbsp;W: So what is he eating? &nbsp;M: Some tofu. Don't worry, he likes it. &nbsp;Q: What is the turtle eating today?",szh:"女：你餵你的烏龜吃什麼？　男：通常是小魚，但今天市場沒有魚。　女：那牠吃什麼？　男：一些豆腐(tofu)，別擔心，牠喜歡。　問：烏龜今天吃什麼？",en:"Tofu.",zh:"小魚是平常吃的，但今天市場沒有魚，所以今天吃豆腐(tofu)。「小魚」是平常的食物；男士說了牠今天有吃東西，所以不是「什麼都沒吃」。選 B"},
{n:24,p:2,o:["They eat bad insects.","They help plants make fruit.","They make plants grow taller."],a:1,sen:"W: Our teacher talked about the importance of bees today. &nbsp;M: Bees? What did she say? &nbsp;W: Without bees, many plants can't make fruit or seeds. &nbsp;Q: Why are bees important?",szh:"女：今天老師講了蜜蜂(bee)的重要性(importance)。　男：蜜蜂？她說了什麼？　女：沒有蜜蜂，很多植物就無法結果實或種子。　問：蜜蜂為什麼重要？",en:"They help plants make fruit.",zh:"女士說沒有蜜蜂(bee)，很多植物就不能結果實，換句話說就是「蜜蜂幫植物結果實」。對話沒提到蜜蜂吃害蟲；老師說的是結果實和種子，不是讓植物長高。選 B"},
{n:25,p:2,o:["Be quiet.","Run along the river.","Call the deer."],a:0,sen:"M: Let's walk along the river and look for deer. &nbsp;W: OK. But we must be silent. Deer run away when they hear people. &nbsp;M: Then no talking and no running. &nbsp;Q: What must they do?",szh:"男：我們沿著(along)河邊走，找找看鹿(deer)吧。　女：好，但我們一定要保持安靜(silent)，鹿聽到人聲就會跑走。　男：那就不說話、不跑步。　問：他們一定要做什麼？",en:"Be quiet.",zh:"女士說一定要保持安靜(silent)，男士也說不說話、不跑步，換句話說就是「保持安靜」。他們是沿著(along)河邊「走」，而且說好不跑步；叫鹿會把鹿嚇跑，正好相反。選 A"},
{n:26,p:3,pic:true,o:[BARS("Zoo Visitors",["Lions","Koalas","Monkeys"],[80,50,20]),BARS("Zoo Visitors",["Lions","Koalas","Monkeys"],[20,80,50]),BARS("Zoo Visitors",["Lions","Koalas","Monkeys"],[50,80,20])],a:1,sen:"Our zoo counts the visitors at three animal houses every month. For years, the lion house was the most popular. But last month, a baby koala was born, and people waited in long lines to see it. Soon the koala house was number one. The monkey house had more visitors than the lion house, too, because the lions slept all day. &nbsp;Q: Which chart shows last month's visitors?",szh:"我們動物園每個月統計三座動物(animal)館的遊客。多年來獅子(lion)館一直最受歡迎。但上個月一隻無尾熊(koala)寶寶出生，大家排長長的隊(line)去看，無尾熊館變成第一名。猴子(monkey)館的遊客也比獅子館多，因為獅子整天都在睡。　問：哪張圖是上個月的遊客人數？",en:"Koalas most, monkeys second, lions fewest.",zh:"無尾熊館第一，猴子館比獅子館多，所以無尾熊最高、猴子第二、獅子最低。獅子最高的那張是「多年來」的情形；獅子第二的那張與「猴子館比獅子館多」矛盾。選 B"},
{n:27,p:3,pic:true,o:[BARS("Class Pet Votes",["Turtle","Rabbit","Mouse"],[50,80,20]),BARS("Class Pet Votes",["Turtle","Rabbit","Mouse"],[80,20,50]),BARS("Class Pet Votes",["Turtle","Rabbit","Mouse"],[80,50,20])],a:2,sen:"Our class voted for a new class pet. At first, the rabbit was far ahead. But our teacher said a rabbit needs too much space, so many students changed their votes to the turtle. Some students wanted a white mouse, but Amy is afraid of mice, so the mouse got fewer votes than the rabbit. In the end, we all agreed on the little turtle. &nbsp;Q: Which chart shows the final votes?",szh:"我們班投票選新的班級寵物。一開始兔子遙遙領先。但老師說兔子需要太多空間，所以很多同學把票改投給烏龜。有些同學想要小白鼠(mouse)，但 Amy 怕老鼠，所以老鼠的票比兔子少。最後大家都同意(agree)選小烏龜。　問：哪張圖是最後的投票結果？",en:"Turtle most, rabbit second, mouse fewest.",zh:"很多人改投烏龜，最後大家同意(agree)選烏龜，所以烏龜最高；老鼠(mouse)比兔子少，所以兔子第二、老鼠最低。兔子最高的那張是「一開始」的情形，不是最後結果；老鼠第二的那張與「老鼠的票比兔子少」矛盾。選 C"},
{n:28,p:3,pic:true,o:[PH('q28c'),PH('q28b'),PH('q28a')],a:1,sen:"My grandfather loves his garden. Last year, he grew tomatoes, but insects ate most of them. This year, he grew green beans, and they are doing very well. He also wanted to grow corn, but it needs a lot of room, and his garden lacks space. &nbsp;Q: What did Grandfather grow this year?",szh:"我爺爺很愛他的花園(garden)。去年他種番茄，但大部分被昆蟲(insect)吃掉了。今年他種了四季豆(bean)，長得很好。他也想種玉米，但玉米需要很大的地方，他的花園缺乏(lack)空間。　問：爺爺今年種了什麼？",en:"Green beans.",zh:"番茄是「去年」種的，被昆蟲(insect)吃掉；玉米是他想種，但花園缺乏(lack)空間沒種成；今年種的是四季豆(bean)。選 B"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29b'),PH('q29c')],a:2,sen:"Yesterday, a monkey got out of the city zoo. People first saw it sitting on a bus downtown. Then it jumped off the bus and ran into a bakery. Later, the zoo workers found it sleeping in a tree in the park, and they took it back home. &nbsp;Q: Where did people first see the monkey?",szh:"昨天一隻猴子(monkey)從市立動物園跑了出來。大家最先看到牠坐在市中心(downtown)的一輛公車上。後來牠跳下公車，跑進一家麵包店。再後來，動物園員工發現牠在公園的樹上睡覺，就帶牠回家了。　問：大家最先在哪裡看到這隻猴子？",en:"On a bus downtown.",zh:"要聽清楚順序：最先(first)在市中心(downtown)的公車上，接著跑進麵包店，最後在公園樹上被找到。麵包店是第二個地點；公園的樹上是最後被找到的地方。選 C"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:0,sen:"Last Saturday, our nature club spent the day at the beach. We hoped to see sea turtles, but they only come out at night. We looked for crabs along the sand, but it was too hot, so they stayed deep in their holes. We did see some white birds, but they flew away when we got close. Still, our teacher was proud of our effort. &nbsp;Q: What animals did the club see?",szh:"上星期六我們自然社在海邊待了一整天。我們希望看到海龜，但牠們只在晚上出來。我們沿著(along)沙灘找螃蟹(crab)，但天氣太熱，牠們都躲在洞的深(deep)處。我們確實看到了一些白色的鳥，但我們一靠近牠們就飛走了。不過老師還是對我們的努力(effort)很驕傲。　問：社團看到了什麼動物？",en:"Some white birds.",zh:"海龜只在晚上出來，白天看不到；螃蟹(crab)太熱躲在洞裡，沒看到；他們「確實看到」的是白色的鳥，只是靠近時飛走了。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 18 回　動物　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
