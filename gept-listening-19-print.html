<script>
/* 圖形素材（第19回 植物與花園） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/19/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/19/p3_${n}.jpg?v=r19hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const PANDA=`<img class="pic-img p0img" src="gept-listening-img/19/p0_q1.jpg" alt="question 1 picture">`;
const TIGER=`<img class="pic-img p0img" src="gept-listening-img/19/p0_q2.jpg" alt="question 2 picture">`;
const RABBIT=`<img class="pic-img p0img" src="gept-listening-img/19/p0_q3.jpg" alt="question 3 picture">`;
const SPIDER=`<img class="pic-img p0img" src="gept-listening-img/19/p0_q4.jpg" alt="question 4 picture">`;
const PLANT=`<img class="pic-img p0img" src="gept-listening-img/19/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:PANDA,o:["It is giving a plant to another panda.","It is sleeping on a rock below some tall plants.","It is eating a plant that it is holding."],a:2,sen:"For question one, look at the picture. What is the panda doing?",szh:"第一題，請看圖片。這隻貓熊在做什麼？",en:"It is eating a plant that it is holding.",zh:"貓熊(panda)用前腳握著一根植物(plant)放進嘴裡吃，正確。牠是坐著在吃東西，不是在石頭上睡覺；圖中只有一隻貓熊，沒有把植物給另一隻。選 C"},
{n:2,p:0,fig:TIGER,o:["It is standing in the tall grass and looking at us.","It is standing in the tall grass, but it has a short tail.","It is lying in the tall grass with its tail below its body."],a:0,sen:"For question two, look at the picture. Which is true about the tiger?",szh:"第二題，請看圖片。關於這隻老虎，何者正確？",en:"It is standing in the tall grass and looking at us.",zh:"老虎(tiger)站在高(tall)草叢裡，回頭看著鏡頭，正確。牠是站著，不是躺著，尾巴也翹在身體後面，不在身體下方(below)；牠的尾巴(tail)很長，不是短尾巴。選 A"},
{n:3,p:0,fig:RABBIT,o:["A white rabbit is sitting next to a tall plant.","A brown rabbit is eating the leaves of a tall plant.","A brown rabbit is sitting next to a tall plant."],a:2,sen:"For question three, look at the picture. What do you see in the garden?",szh:"第三題，請看圖片。你在花園裡看到什麼？",en:"A brown rabbit is sitting next to a tall plant.",zh:"一隻棕色兔子(rabbit)坐在一株高(tall)植物(plant)旁邊，正確。兔子是棕色，不是白色；牠只是坐著，嘴巴沒有在吃葉子。選 C"},
{n:4,p:0,fig:SPIDER,o:["There is one spider on the floor in the corner.","There is one spider near the corner of the ceiling.","There are two spiders near the corner of the ceiling."],a:1,sen:"For question four, look at the picture. What can you see in the picture?",szh:"第四題，請看圖片。你在圖中可以看到什麼？",en:"There is one spider near the corner of the ceiling.",zh:"天花板角落(corner)附近有一張大網，中間只有一隻蜘蛛(spider)，正確。圖中只有一隻，不是兩隻；蜘蛛掛在高處，不是在地板上。選 B"},
{n:5,p:0,fig:PLANT,o:["There is an empty nest above a small plant.","There is a nest in the pot below the tree.","There is a bird sitting in a nest above a small plant."],a:0,sen:"For question five, look at the picture. Which is true about the picture?",szh:"第五題，請看圖片。關於這張圖，何者正確？",en:"There is an empty nest above a small plant.",zh:"樹枝上有一個空的鳥巢(nest)，下方(below)花盆裡長著一株小植物(plant)，正確。巢裡沒有鳥，所以「鳥坐在巢裡」不對；巢在樹枝上，不在花盆裡。選 A"},
{n:6,p:1,o:["No, next month is March.","Yes, it was my first time, too.","Lucky you! Where are you going?"],a:2,sen:"I'm going abroad for the first time next month.",szh:"我下個月要第一次出國。",en:"Lucky you! Where are you going?",zh:"對方說下個月要第一次出國(abroad)，回「真幸運！你要去哪裡？」最自然。「是啊，那也是我第一次」用過去式，時態不對，只是重複 first time；「不，下個月是三月」只是重複 next month，沒回應對方。選 C"},
{n:7,p:1,o:["It's right next to the bank.","Pardon? It's too noisy in here.","I had dinner there two days ago."],a:1,sen:"What's the name of the new restaurant on the corner?",szh:"轉角那家新餐廳叫什麼名字？",en:"Pardon? It's too noisy in here.",zh:"問轉角(corner)新餐廳(restaurant)的名字，三個選項都沒說出店名，但「什麼？這裡太吵了」是沒聽清楚、請對方再說一次(pardon)，是唯一自然的回應。「就在銀行旁邊」答的是地點；「我兩天前(ago)在那裡吃過晚餐」答非所問，也沒說名字。選 B"},
{n:8,p:1,o:["It was about a ghost in an old house.","I took a hot shower and went to bed.","It starts at nine o'clock."],a:1,sen:"What did you do after the ghost movie?",szh:"看完鬼(ghost)片之後你做了什麼？",en:"I took a hot shower and went to bed.",zh:"問看完電影「之後做了什麼」，答「洗了熱水澡(shower)就去睡了」正確。「是關於老房子裡的鬼(ghost)」答的是電影內容；「九點開始」答的是時間，時態也不對。選 B"},
{n:9,p:1,o:["Oh no! Does it still work?","Sure, here's a glass of water.","I'll call you this morning."],a:0,sen:"I dropped my phone into the water this morning.",szh:"我今天早上把手機掉(drop)進水裡了。",en:"Oh no! Does it still work?",zh:"對方說手機掉(drop)進水裡，關心「糟了！還能用嗎？」最自然。「好啊，這裡(here)有一杯水」只是重複 water；「我今天早上會打給你」重複 this morning，而且早上已經過了，手機也壞了。選 A"},
{n:10,p:1,o:["I'll turn the heater off, then.","Someone forgot to shut the window.","Yes, it's colder than last week."],a:1,sen:"Why is it so cold in here?",szh:"這裡(here)為什麼這麼冷？",en:"Someone forgot to shut the window.",zh:"問「為什麼」這麼冷，答「有人忘了關(shut)窗戶」說出原因，正確。用 Yes 回答 why 問句不對；冷的時候說「那我把暖氣(heater)關掉」意思相反。選 B"},
{n:11,p:1,o:["About ninety centimeters.","Its color is yellow and brown.","I planted the seed two months ago."],a:0,sen:"How tall is your flower now?",szh:"你的花現在多高(tall)了？",en:"About ninety centimeters.",zh:"問「多高」，答「大約九十公分(centimeter)」正確。「顏色(color)是黃色和棕色」答的是顏色；「兩個月前(ago)種下種子(seed)」答的是什麼時候種的。選 A"},
{n:12,p:1,o:["About two hundred dollars.","No. He said sorry, so I've decided to forgive him.","Yes, he's still angry with me."],a:1,sen:"Are you still angry that Tom hasn't paid his debt?",szh:"Tom 還沒還他的債(debt)，你還在生氣嗎？",en:"No. He said sorry, so I've decided to forgive him.",zh:"問你還在不在氣 Tom 沒還他的(his)債(debt)，答「不氣了，他道歉了，我決定原諒(forgive)他(him)」正確。「大約兩百元」答的是金額；「是的，他還在生我的氣」把生氣的人弄反了。選 B"},
{n:13,p:1,o:["A paper wolf with a long tail.","I'll draw a tiger next week.","In the art room on the third floor."],a:0,sen:"What did you create in art class today?",szh:"你今天美術課創作(create)了什麼？",en:"A paper wolf with a long tail.",zh:"問創作(create)了「什麼」，答「一隻長尾巴(tail)的紙做的狼(wolf)」正確。「在三樓美術教室」答的是地點；「我下週要畫老虎(tiger)」時態不對，問的是今天已經做了什麼。選 A"},
{n:14,p:1,o:["Wow! Who says birds are dumb?","Yes, I have twenty parrots.","It says twenty dollars here."],a:0,sen:"My parrot can say twenty words now.",szh:"我的鸚鵡(parrot)現在會說二十個字了。",en:"Wow! Who says birds are dumb?",zh:"對方說鸚鵡(parrot)會說二十個字，回「哇！誰說鳥很笨(dumb)？」是在稱讚鳥聰明，最自然。「是的，我有二十隻鸚鵡」只是重複 twenty 和 parrot，答非所問；「這裡寫二十元」重複 twenty、says，與話題無關。選 A"},
{n:15,p:1,o:["He speaks English very well.","He came here two weeks ago.","From England, I think."],a:2,sen:"Where is the new student from?",szh:"新來的學生是哪裡人？",en:"From England, I think.",zh:"問「從哪裡來」，答「我想是英國(England)」正確。「他兩週前(ago)來這裡(here)」答的是時間；「他英文說得很好」English 和 England 發音很像，是陷阱。選 C"},
{n:16,p:2,o:["The pandas.","The tigers.","The zebras."],a:1,sen:"W: Let's go and see the pandas first. &nbsp;M: There's always a long line there. The tigers are closer to the gate. &nbsp;W: OK, the tigers, then the pandas. We can see the zebras after lunch. &nbsp;Q: What will they see first?",szh:"女：我們先去看貓熊(panda)吧。　男：那裡總是大排長龍，老虎(tiger)離門口比較近。　女：好，先看老虎，再看貓熊。斑馬(zebra)午餐後再看。　問：他們會先看什麼？",en:"The tigers.",zh:"女士原本想先看貓熊(panda)，但男士說那裡人多、老虎(tiger)離門口近，女士同意先看老虎。貓熊是第二個；斑馬(zebra)要等午餐後。選 B"},
{n:17,p:2,o:["She saw a whale from the boat.","She swam with a shark.","She was not afraid of the shark."],a:2,sen:"M: How was your boat trip? &nbsp;W: Great! I expected to see a whale, but we only saw a shark. &nbsp;M: A shark! Weren't you afraid? &nbsp;W: Not at all. It was far below the boat. &nbsp;Q: What do we know about the woman?",szh:"男：你的搭船之旅怎麼樣？　女：很棒！我本來期待(expect)看到鯨魚(whale)，結果只看到鯊魚(shark)。　男：鯊魚！你不怕嗎？　女：一點也不怕，牠在船下方(below)很遠的地方。　問：關於女士我們知道什麼？",en:"She was not afraid of the shark.",zh:"男士問她怕不怕，她說「一點也不」，換句話說就是她不怕鯊魚(shark)。她本來期待(expect)看鯨魚(whale)，但沒看到；鯊魚在船下方(below)很遠的地方，她沒有下水跟鯊魚一起游。選 C"},
{n:18,p:2,o:["A rabbit.","A dog.","Some shrimps."],a:2,sen:"W: Your sister wanted a rabbit as a pet, right? &nbsp;M: She did. But Dad said rabbits need too much room. So she got some shrimps. &nbsp;W: Shrimps! How unique! &nbsp;M: And they're easy. Nobody has to walk them. &nbsp;Q: What pet does the man's sister have?",szh:"女：你妹妹想養兔子(rabbit)當寵物(pet)，對吧？　男：她本來想。但爸爸說兔子需要太多空間，所以她養了一些蝦(shrimp)。　女：蝦！真特別(unique)！　男：而且很好養，沒有人(nobody)需要帶牠們去散步。　問：男士的妹妹養什麼寵物？",en:"Some shrimps.",zh:"妹妹本來想養兔子(rabbit)，但爸爸反對，最後養了蝦(shrimp)。兔子是被否定的計畫；「沒人(nobody)需要帶去散步」是在說蝦好養，並不表示養的是狗。選 C"},
{n:19,p:2,o:["Seventy-five dollars.","Fifty dollars.","One hundred dollars."],a:0,sen:"W: How much are these flower seeds? &nbsp;M: Fifty dollars a bag. But if you buy two, the second bag is half price. &nbsp;W: Then I'll take two bags. &nbsp;Q: How much will the woman pay?",szh:"女：這些花的種子(seed)多少錢？　男：一包五十元。但買兩包的話，第二包半價。　女：那我買兩包。　問：女士要付多少錢？",en:"Seventy-five dollars.",zh:"一包五十元，第二包半價是二十五元，兩包共七十五元。五十元只是一包的價錢；一百元是沒算半價的錯誤答案。選 A"},
{n:20,p:2,o:["A rabbit.","A bird.","A rat."],a:1,sen:"W: Something ate our seeds again. That's the third time it has occurred this week. &nbsp;M: Maybe it's a rat. Or a rabbit. &nbsp;W: No. Look over there. It has wings, and it just flew up into that tree. &nbsp;Q: What is eating the seeds?",szh:"女：又有東西把我們的種子(seed)吃掉了，這是這週第三次發生(occur)了。　男：可能是老鼠(rat)，或是兔子(rabbit)。　女：不是。你看那裡，牠有翅膀(wing)，剛剛飛上那棵樹了。　問：是什麼在吃種子？",en:"A bird.",zh:"女士說那隻動物有翅膀(wing)、飛上樹，所以是鳥。老鼠(rat)和兔子(rabbit)都是男士的猜測，被女士否定了。選 B"},
{n:21,p:2,o:["Greet the visitors at the airport.","Book a table at the restaurant.","Show the visitors around the zoo."],a:1,sen:"W: The visitors from Japan arrive tomorrow. I'll greet them at the airport. &nbsp;M: Then I'll book a table at the restaurant. &nbsp;W: Good. And Amy can show them around the zoo on Sunday. &nbsp;Q: What will the man do?",szh:"女：日本的訪客明天到。我去機場接(greet)他們。　男：那我去餐廳(restaurant)訂位。　女：好。Amy 可以星期天帶他們逛動物園(zoo)。　問：男士會做什麼？",en:"Book a table at the restaurant.",zh:"分清楚誰做什麼：女士去機場迎接(greet)，男士去餐廳(restaurant)訂位，Amy 帶客人逛動物園(zoo)。去機場是女士的工作；逛動物園是 Amy 的工作。選 B"},
{n:22,p:2,o:["In the man's garden.","In the man's office.","In a store."],a:2,sen:"M: I'd like a plant for my office. My garden at home is already full. &nbsp;W: How about this one? It only needs water once a week. &nbsp;M: Perfect. Can you put it in a box for me? &nbsp;Q: Where are the speakers?",szh:"男：我想買一盆植物(plant)放辦公室。我家的花園已經滿了。　女：這盆怎麼樣？一週只要澆一次水。　男：太好了。可以幫我裝進盒子嗎？　問：說話者在哪裡？",en:"In a store.",zh:"男士要「買」植物(plant)，女士推薦商品，男士請她裝盒，可知他們在店裡。辦公室是植物要放的地方；家裡的花園是男士說已經滿了的地方，他們都不在那裡。選 C"},
{n:23,p:2,o:["The woman alone.","The man and the woman.","Tom."],a:1,sen:"W: Can you help me carry this heavy pot? &nbsp;M: Sure. But why don't we ask Tom? He's much stronger than me. &nbsp;W: He's at basketball practice. &nbsp;M: OK, then let's carry it together. &nbsp;Q: Who will carry the pot?",szh:"女：你可以幫我搬這個很重的花盆嗎？　男：當然。不過我們何不找 Tom？他比我強壯(strong)多了。　女：他在練籃球。　男：好，那我們一起搬吧。　問：誰會搬花盆？",en:"The man and the woman.",zh:"男士想找比較強壯(strong)的 Tom，但 Tom 去練籃球，所以最後男女兩人一起搬。Tom 不在，搬不了；女士本來就是請人幫忙，不是她一個人搬。選 B"},
{n:24,p:2,o:["She bought it for her grandmother.","It makes her think of her grandmother.","It is a diamond ring."],a:1,sen:"M: Is that a new ring? Is it a diamond? &nbsp;W: No, it's only glass. My grandmother gave it to me. &nbsp;M: Then why do you wear it every day? &nbsp;W: It reminds me of her. &nbsp;Q: Why does the woman like the ring?",szh:"男：那是新戒指嗎？是鑽石(diamond)嗎？　女：不是，只是玻璃。是我奶奶給我的。　男：那你為什麼每天戴？　女：它讓我想起(remind)她。　問：女士為什麼喜歡這枚戒指？",en:"It makes her think of her grandmother.",zh:"「It reminds me of her」換句話說就是「讓她想起奶奶」。女士說那不是鑽石(diamond)，只是玻璃；戒指是奶奶送她的，不是她買給奶奶的。選 B"},
{n:25,p:2,o:["At nine-thirty.","At nine.","At ten."],a:0,sen:"W: Let's meet at the zoo gate at nine on Sunday. &nbsp;M: I always have trouble getting up early on Sundays. Is ten possible? &nbsp;W: The panda show starts at ten. Let's make it nine-thirty. &nbsp;M: Fine. &nbsp;Q: When will they meet?",szh:"女：我們星期天九點在動物園(zoo)門口見吧。　男：我星期天總是很難(trouble)早起。十點可能(possible)嗎？　女：貓熊(panda)表演十點開始。那就九點半吧。　男：好。　問：他們幾點見面？",en:"At nine-thirty.",zh:"女士先說九點，男士想改十點，但貓熊(panda)表演十點就開始，最後折衷九點半。九點是原本的提議；十點是表演開始的時間，太晚了。選 A"},
{n:26,p:3,pic:true,o:[BARS("Seeds That Grew",["Bean","Corn","Tomato"],[80,50,20]),BARS("Seeds That Grew",["Bean","Corn","Tomato"],[50,80,20]),BARS("Seeds That Grew",["Bean","Corn","Tomato"],[80,20,50])],a:2,sen:"In our garden class, we planted one hundred seeds each of beans, corn, and tomatoes. We expected the corn to grow best, because it grows so tall. But in the end, more bean seeds came up than corn seeds. Even the tomato seeds did better than the corn. &nbsp;Q: Which chart shows how many seeds grew?",szh:"花園課上，我們豆子、玉米、番茄的種子(seed)各種了一百顆。我們期待(expect)玉米長得最好，因為它長得那麼高(tall)。但結果發芽的豆子比玉米多，連番茄種子都比玉米好。　問：哪張圖顯示有多少種子長出來？",en:"Corn grew the fewest; beans and tomatoes both did better.",zh:"豆子比玉米多，連番茄也比玉米多，所以玉米長出來的最少，只有玉米最低的那張圖符合。玉米最高的那張是大家原本的期待(expect)；豆子最高、玉米第二的那張漏聽了「連番茄都比玉米好」。選 C"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27a'),PH('q27b')],a:0,sen:"My little brother wanted a pet for his birthday. First he asked for a rabbit, but Mom said our apartment is too small. Then he wanted a parrot, but parrots are too noisy for our neighbors. In the end, Dad got him three small fish in a glass bowl. &nbsp;Q: What pet did the brother get?",szh:"我弟弟生日想要一隻寵物(pet)。他先要兔子(rabbit)，但媽媽說我們公寓太小。後來他想要鸚鵡(parrot)，但鸚鵡對鄰居來說太吵了。最後爸爸買給他(him)三條養在玻璃缸裡的小魚。　問：弟弟得到什麼寵物？",en:"Three small fish in a glass bowl.",zh:"兔子(rabbit)因為公寓太小被否定，鸚鵡(parrot)因為太吵被否定，最後得到的是玻璃缸裡的三條小魚。選 A"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:0,sen:"Last Sunday, our class gathered at the zoo gate at nine. Our teacher wanted to show us the tigers first, but the tiger area was closed that morning. So we started with the zebras. After lunch, we watched the pandas eat, and then we went back to see the tigers. &nbsp;Q: What did the class see first?",szh:"上星期天，我們班九點在動物園(zoo)門口集合(gather)。老師想先帶我們看老虎(tiger)，但老虎區那天早上關閉，所以我們從斑馬(zebra)開始看。午餐後我們看貓熊(panda)吃東西，然後再回去看老虎。　問：全班最先看到什麼？",en:"The zebras.",zh:"老師原本想先看老虎(tiger)，但老虎區早上關閉，所以先看斑馬(zebra)。貓熊(panda)是午餐後才看；老虎是最後才回去看的。選 A"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:2,sen:"Last summer, my uncle took me on a boat trip. We hoped to see a whale, but we didn't see one. Further out at sea, we saw a shark, but it swam away before I could take a picture. The only image I got was of some dolphins jumping next to the boat. &nbsp;Q: Which picture did the speaker take?",szh:"去年夏天，叔叔帶我去搭船出海。我們希望看到鯨魚(whale)，但沒看到。更遠(further)的海上我們看到一條鯊魚(shark)，但我還來不及拍照它就游走了。我唯一拍到的影像(image)是幾隻在船邊跳躍的海豚。　問：說話者拍到哪張照片？",en:"Dolphins jumping next to the boat.",zh:"鯨魚(whale)根本沒看到；鯊魚(shark)看到了但來不及拍；唯一拍到的影像(image)是船邊跳躍的海豚。選 C"},
{n:30,p:3,pic:true,o:[BARS("Zoo Votes",["Panda","Tiger","Zebra"],[30,60,80]),BARS("Zoo Votes",["Panda","Tiger","Zebra"],[80,30,60]),BARS("Zoo Votes",["Panda","Tiger","Zebra"],[60,30,80])],a:2,sen:"Every year, our zoo asks visitors to vote for their favorite animal. People come from every part of the Republic of China to see our pandas here, and last year the pandas won. This year, we expected the same thing. But our new baby zebra was on the news all over the nation, and it got more votes than the pandas. The tigers got fewer votes than the pandas. &nbsp;Q: Which chart shows this year's votes?",szh:"我們的動物園(zoo)每年都請遊客投票選出最喜歡的動物。中華民國(Republic of China)各地的人都會來這裡(here)看我們的貓熊(panda)，去年也是貓熊贏。今年我們期待(expect)一樣的結果。但我們新來的斑馬(zebra)寶寶上了全國(nation)的新聞，得票比貓熊還多。老虎(tiger)的票則比貓熊少。　問：哪張圖是今年的票數？",en:"Zebra most, panda second, tiger fewest.",zh:"今年斑馬(zebra)寶寶比貓熊(panda)多，老虎(tiger)又比貓熊少，所以斑馬最高、貓熊第二、老虎最低。貓熊最高的那張是去年的結果，也是大家原本期待(expect)的情形；斑馬最高但老虎第二的那張，漏聽了「老虎比貓熊少」。選 C"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 19 回　植物與花園　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
