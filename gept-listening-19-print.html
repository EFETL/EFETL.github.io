{n:5,p:0,fig:PLANT,o:["The zebra reminds him of home.","A ghost takes a shower.","A young plant grows from a seed below the old nest."],a:2,

{n:10,p:1,o:["I forgive the debt; let us all gather here as friends.","The shark is below.","The rat drops a seed."],a:0,

{n:14,p:1,o:["The panda is unique.","The plant grows tall.","A zebra; seeing it reminds him of his own long journey."],a:2,

{n:26,p:3,pic:true,o:[BARS("Zoo Animals",["Panda","Tiger","Wolf"],[20,50,80]),BARS("Zoo Animals",["Panda","Tiger","Wolf"],[50,80,20]),BARS("Zoo Animals",["Panda","Tiger","Wolf"],[80,50,20])],a:2,

 szh:"我們班參觀動物園(zoo)，統計大家喜歡的動物。熊貓(panda)最受喜愛，吸引最多人；老虎(tiger)中等；狼(wolf)最少粉絲。所以熊貓長條最高。　問：哪張圖顯示最愛的動物園動物？",

 sen:"After a long morning working in the garden, we were hungry. There was no way to cook noodles or steam rice out among the plants. So my grandmother brought fresh bread from the restaurant on the corner, and we ate it here under the tall trees. &nbsp;Q: What did they eat in the garden?",
 szh:"在花園工作一整個上午後，我們餓了。在植物(plant)間沒辦法煮麵或蒸飯。所以奶奶從轉角(corner)的餐廳(restaurant)帶來新鮮麵包(bread)，我們就在這裡(here)高(tall)樹下吃。　問：他們在花園吃什麼？",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 19 回　植物與花園　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
