<script>
/* 圖形素材（第28回 電影與表演） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/28/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CLAPPER=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q1.jpg" alt="question 1 picture">`;
const STAGE=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q2.jpg" alt="question 2 picture">`;
const RADIO=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q3.jpg" alt="question 3 picture">`;
const THEATER=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q4.jpg" alt="question 4 picture">`;
const STAR=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CLAPPER,o:["A drum used for a school parade.","A clapper used for making a film.","A bell used for ending a class."],a:1,sen:"For question one, look at the picture. What is this used for?",szh:"第一題，請看圖片。這是做什麼用的？",en:"A clapper used for making a film.",zh:"這是電影(film)場記板，拍電影時使用，選 B。鼓和鈴都不是圖中的東西。"},
{n:2,p:0,fig:STAGE,o:["The drama is on a theater stage.","The drama is on the radio.","The drama is in a city park."],a:0,sen:"For question two, look at the picture. Where is the drama shown?",szh:"第二題，請看圖片。戲劇在哪裡演出？",en:"The drama is on a theater stage.",zh:"戲劇(drama)是在劇院(theater)的舞台(stage)上演出，選 A。B 是廣播(radio)，雖然也有戲劇，但圖中是舞台。"},
{n:3,p:0,fig:RADIO,o:["A radio broadcasts music to everyone.","A television broadcasts music to everyone.","A phone plays music to everyone."],a:0,sen:"For question three, look at the picture. What sends the sound?",szh:"第三題，請看圖片。什麼傳送聲音？",en:"A radio broadcasts music to everyone.",zh:"收音機(radio)把音樂廣播(broadcast)給大家，選 A。電視和手機都不是圖中的東西。"},
{n:4,p:0,fig:THEATER,o:["At the airport, taking a picture with fans.","At a school, taking a picture with fans.","At the theater, taking a picture with fans."],a:2,sen:"For question four, look at the picture. Where is the movie star?",szh:"第四題，請看圖片。電影明星在哪裡？",en:"At the theater, taking a picture with fans.",zh:"電影明星(star)在劇院(theater)和粉絲合照(picture)，選 C。機場和學校都不是圖中的地點。"},
{n:5,p:0,fig:STAR,o:["A special golden moon shines in the dark.","A special golden lamp shines in the dark.","A special golden star shines in the dark."],a:2,sen:"For question five, look at the picture. What shines here?",szh:"第五題，請看圖片。這裡閃耀著什麼？",en:"A special golden star shines in the dark.",zh:"一顆特別(special)的金色星星(star)在黑暗(dark)中閃耀，選 C。月亮和燈都不是圖中發光的東西。"},

{n:6,p:1,o:["A big truck near the river.","I walked for about an hour.","Yes, it was a nice walk."],a:0,sen:"What did you see on your walk?",szh:"你散步時看到什麼？",en:"A big truck near the river.",zh:"問散步時看到什麼，答『河(river)邊有一輛大卡車(truck)』，選 A。B 回答走多久，C 用 Yes 回答 What 問句。"},
{n:7,p:1,o:["On the second floor, I think.","Every Sunday morning at nine.","A sharp pencil and a welcome note."],a:2,sen:"What do new club members receive?",szh:"新社員會收到什麼？",en:"A sharp pencil and a welcome note.",zh:"問新社員收到什麼，答『一支削尖的(sharp)鉛筆(pencil)和一張歡迎卡(note)』，選 C。A 回答地點，B 回答時間。"},
{n:8,p:1,o:["Some boys playing a loud drum.","A little bird in the distance.","I heard it, too, last night."],a:1,sen:"What is that gentle sound outside?",szh:"外面那個輕柔的聲音是什麼？",en:"A little bird in the distance.",zh:"問輕柔的聲音是什麼，答『遠處(distance)有隻小(little)鳥(bird)』，選 B。鼓聲是吵鬧的，不是輕柔聲音；C 沒回答是什麼。"},
{n:9,p:1,o:["Click here and use the printer.","The writer lives in a small town.","It was a rare and sad story."],a:0,sen:"How can I get a copy of the story?",szh:"我要怎麼拿到故事的副本？",en:"Click here and use the printer.",zh:"問怎麼拿到副本，答『點這裡，用印表機(printer)印出來』，選 A。B 說作家(writer)住哪，C 評論故事，都沒回答怎麼做。"},
{n:10,p:1,o:["Because it was a warm afternoon.","The goat is eating his mangoes.","He is calling his son home."],a:1,sen:"Why did the farmer shout in the field?",szh:"農夫為什麼在田裡大叫？",en:"The goat is eating his mangoes.",zh:"問農夫為什麼大叫，答『山羊(goat)在吃他的芒果(mango)』，選 B。A 只說天氣暖(warm)，C 說他在叫兒子。"},
{n:11,p:1,o:["Put the lid on the pot.","Eat all you want, no limit.","Lay down; a stomachache needs rest."],a:2,sen:"What should I do about my sick stomach?",szh:"我的胃不舒服該怎麼辦？",en:"Lay down; a stomachache needs rest.",zh:"問胃不舒服該怎麼辦，答『躺(lay)下來，胃痛(stomachache)需要休息』，選 C。A 重複 lid 但離題，B 的建議反而對胃不好。"},
{n:12,p:1,o:["In the middle of the room.","Not till Sunday morning.","Please don't omit that big object."],a:1,sen:"When should we set up the stage?",szh:"我們什麼時候該布置舞台？",en:"Not till Sunday morning.",zh:"問何時布置舞台，答『要到(till)星期日(Sunday)早上才行』，選 B。A 回答地點，C 沒說時間(其中 omit 是省略、object 是物品)。"},
{n:13,p:1,o:["She advised us not to chat.","She is a very famous woman.","Her new film opens tomorrow."],a:0,sen:"What did the director tell the young actors?",szh:"導演對年輕演員說了什麼？",en:"She advised us not to chat.",zh:"問導演說了什麼，答『她建議(advise)我們不要聊天(chat)』，選 A。B 回答她是誰，C 說電影何時上映。"},
{n:14,p:1,o:["Walk slowly to the dark river.","Turn off the lights and hide.","Open a window and shout."],a:1,sen:"What should we do in the scary scene?",szh:"在恐怖的場景我們該做什麼？",en:"Turn off the lights and hide.",zh:"問恐怖場景該做什麼，答『把燈關掉，躲(hide)起來』，選 B。往河邊走(dark river)和大喊都不是躲藏。"},
{n:15,p:1,o:["Yes, I roller blade in the park.","The weekend starts on Friday night.","It was a very fun party."],a:0,sen:"Do you have a fun hobby for the weekend?",szh:"你週末有有趣的嗜好嗎？",en:"Yes, I roller blade in the park.",zh:"問週末有沒有嗜好，答『有，我在公園溜直排輪(roller blade)』，選 A。B 說週末何時開始，C 說一場派對，都不是嗜好。"},

{n:16,p:2,o:["A director.","An actor.","A policeman."],a:1,sen:"W: What does your cousin do? &nbsp;M: He is in a new movie this year. He has a big part. &nbsp;W: Is he the director? &nbsp;M: No. He plays a policeman. &nbsp;Q: What is the cousin's job?",szh:"女：你表哥做什麼工作？　男：他今年在一部新電影(movie)裡演出，角色很重要。　女：他是導演嗎？　男：不是。他演一個警察。　問：表哥的工作是什麼？",en:"An actor.",zh:"他在電影裡演警察，所以工作是演員(actor)，選 B。他演的是警察(policeman)，並不是真的警察；也不是導演(director)。"},
{n:17,p:2,o:["A drama.","A concert.","A football game."],a:0,sen:"M: Do you have plans tonight? &nbsp;W: Yes. My friends and I will sit in the dark and watch actors on a big stage. &nbsp;M: Is it a concert? &nbsp;W: No. They do not sing. They tell a story. &nbsp;Q: What will the woman see?",szh:"男：你今晚有計畫嗎？　女：有。我和朋友要坐在黑暗中看大舞台(stage)上的演員(actors)。　男：是演唱會嗎？　女：不是。他們不唱歌，而是演一個故事。　問：女士要看什麼？",en:"A drama.",zh:"在舞台上由演員演故事、不唱歌，是戲劇(drama)，選 A。男士問演唱會，但女士說不是。"},
{n:18,p:2,o:["On TV.","On a website.","On the radio."],a:2,sen:"W: Where did you hear the news? &nbsp;M: On the radio, during the morning broadcast. &nbsp;W: I see. &nbsp;Q: Where did the man hear the news?",szh:"女：你在哪聽到消息的？　男：在收音機(radio)上，早晨的廣播(broadcast)。　女：了解。　問：男士在哪聽到消息？",en:"On the radio broadcast.",zh:"男士在收音機(radio)的早晨廣播(broadcast)聽到消息，選 C。對話中沒有提到電視或網站。"},
{n:19,p:2,o:["They became quiet.","They sang along.","They left early."],a:0,sen:"W: How was the first minute of the show? &nbsp;M: The lights went down, and everyone stopped talking. &nbsp;W: Did anyone leave? &nbsp;M: No. They all watched the stage. &nbsp;Q: What did the audience do?",szh:"女：表演的第一分鐘怎麼樣？　男：燈暗下來，大家都不說話了。　女：有人離開嗎？　男：沒有。他們都看著舞台。　問：觀眾(audience)做了什麼？",en:"They became quiet.",zh:"燈暗下來大家不說話，表示觀眾(audience)安靜下來，選 A。男士說沒有人離開，所以 C 不對。"},
{n:20,p:2,o:["A short note.","A signed book.","A new pen."],a:0,sen:"M: Did you meet the famous writer? &nbsp;W: Yes! I asked him for a gift. &nbsp;M: What did he give you? &nbsp;W: He wrote a few kind words on a small card for me. &nbsp;Q: What did the woman get?",szh:"男：你見到那位有名的作家(writer)了嗎？　女：見到了！我向他要一份禮物。　男：他給了你什麼？　女：他在一張小卡片上為我寫了幾句親切的話。　問：女士得到什麼？",en:"A short note.",zh:"作家在小卡片上寫了幾句話，是一張短箋(note)，選 A。signed book 很誘人，但對話中沒有書。"},
{n:21,p:2,o:["A local singer.","A movie star.","A famous writer."],a:1,sen:"W: Who is coming to our town? &nbsp;M: A big movie star, to promote her new film. &nbsp;W: How exciting! &nbsp;Q: Who is coming to town?",szh:"女：誰要來我們鎮上？　男：一位大電影(movie)明星(star)，來宣傳她的新片。　女：好興奮！　問：誰要來鎮上？",en:"A big movie star.",zh:"要來鎮上的是大電影(movie)明星(star)，選 B。其他人物對話中都沒提到。"},
{n:22,p:2,o:["Cheap food.","Special seats.","Free service."],a:2,sen:"M: What does the club offer? &nbsp;W: Free service for all its members. &nbsp;M: What a deal. &nbsp;Q: What does the club offer?",szh:"男：這個社團提供什麼？　女：為所有會員(member)提供免費(free)服務(service)。　男：真划算。　問：社團提供什麼？",en:"Free service for members.",zh:"社團為會員(member)提供免費(free)服務(service)，選 C。對話裡沒有提到食物或座位。"},
{n:23,p:2,o:["A car horn.","A big drum.","A loud radio."],a:1,sen:"W: How was the parade? &nbsp;M: Loud! I could not hear my friend. &nbsp;W: Why? &nbsp;M: Someone was hitting a big round thing right next to me. &nbsp;Q: What made the noise?",szh:"女：遊行怎麼樣？　男：好吵！我聽不到朋友說話。　女：為什麼？　男：有人在我旁邊敲一個大圓東西。　問：什麼東西發出噪音(noise)？",en:"A big drum.",zh:"有人敲一個大圓東西，是大鼓(drum)，選 B。car horn 和 radio 也會吵，但不是被敲的。"},
{n:24,p:2,o:["Tea and an orange.","Milk and a banana.","Soda and a mango."],a:2,sen:"M: What would you like to eat? &nbsp;W: Something sweet, a fruit that is yellow and orange. And a cold drink with bubbles. &nbsp;M: Good choice. &nbsp;Q: What does the woman want?",szh:"男：你想吃什麼？　女：甜甜的，黃色和橘色的水果，再來一杯有氣泡的冰飲。　男：好選擇。　問：女士想要什麼？",en:"Soda and a mango.",zh:"黃橘色的甜水果是芒果(mango)，有氣泡的冷飲是汽水(soda)，選 C。orange 和 banana 是從顏色聯想到的，但不是有氣泡的飲料。"},
{n:25,p:2,o:["A picture of the cast.","A ticket for the show.","A book about the stage."],a:0,sen:"W: What did the theater give you as a gift? &nbsp;M: A special picture of the whole cast on stage. &nbsp;W: How lovely. &nbsp;Q: What did the man get?",szh:"女：劇院送你什麼禮物？　男：一張全體演員在舞台上的特別(special)照片(picture)。　女：真好。　問：男士得到什麼？",en:"A special picture of the cast.",zh:"劇院送的是全體演員在舞台上的特別(special)照片(picture)，選 A。票和書對話中都沒提到。"},

{n:26,p:3,pic:true,o:[BARS("Show Type",["Film","Drama","Radio"],[50,80,20]),BARS("Show Type",["Film","Drama","Radio"],[20,50,80]),BARS("Show Type",["Film","Drama","Radio"],[80,50,20])],a:2,sen:"Our class voted for our favorite kind of show. Films got the most votes, because of the big screen and action. Stage drama was in the middle, and radio shows got the fewest votes. So the film bar should be the tallest. &nbsp;Q: Which chart shows the votes?",szh:"我們班票選最愛的表演類型。電影(film)最多票，因為有大螢幕和動作；舞台劇(drama)中等；廣播(radio)節目最少。所以電影長條最高。　問：哪張圖顯示票數？",en:"Films most, radio least.",zh:"電影(film)最多、廣播最少，所以最高的長條是 Film，選 C。"},
{n:27,p:3,pic:true,o:[BARS("Audience",["Fri","Sat","Sun"],[30,55,80]),BARS("Audience",["Fri","Sat","Sun"],[80,55,30]),BARS("Audience",["Fri","Sat","Sun"],[55,80,30])],a:1,sen:"The theater counted its audience over one weekend. On Friday the most people came to the show. On Saturday the number was in the middle, and by Sunday the fewest came, because many were tired. So the audience went down each day. &nbsp;Q: Which chart shows the audience?",szh:"劇院(theater)統計一個週末的觀眾(audience)。星期五最多人來看表演；星期六中等；到星期日(Sunday)最少，因為很多人累了。所以觀眾逐日下降。　問：哪張圖顯示觀眾人數？",en:"Friday most, Sunday fewest.",zh:"星期五最多、逐日下降，符合『Fri 最高、Sun 最低』，選 B。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:2,sen:"During the long film shoot, the busy actors had no time for a real meal. They could not wait for slow noodles or steaming rice between scenes. So the crew brought fresh bread to the stage, and each actor ate a piece quickly before the next act. The bread was enough to fill them up, because acting can burn a lot of energy. &nbsp;Q: What did the actors eat during the shoot?",szh:"漫長的電影(film)拍攝中，忙碌的演員(actor)沒空好好吃飯。場景之間來不及等慢的麵或熱飯。所以工作人員把新鮮麵包帶到舞台(stage)，每位演員在下一幕(act)前快速吃一塊。麵包足以填飽(fill)肚子，因為演戲會消耗(burn)很多體力。　問：演員拍攝時吃什麼？",en:"Fresh bread.",zh:"演員吃的是工作人員帶來的麵包(bread)，選 C。麵和飯他們沒時間等，所以不是答案。"},
{n:29,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:1,

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 28 回　電影與表演　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
