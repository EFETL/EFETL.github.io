<div class="bar">

</div>
<div id="root"></div>
<script>
/* 圖形素材（第28回 電影與表演） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/28/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/28/p3_${n}.jpg?v=r28hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CLAPPER=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q1.jpg" alt="question 1 picture">`;
const STAGE=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q2.jpg" alt="question 2 picture">`;
const RADIO=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q3.jpg" alt="question 3 picture">`;
const THEATER=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q4.jpg" alt="question 4 picture">`;
const STAR=`<img class="pic-img p0img" src="gept-listening-img/28/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CLAPPER,o:["Someone is holding a film clapper in front of an actor.","The actor is holding a film clapper in front of the camera.","The actor is sitting next to the camera."],a:0,sen:"For question one, look at the picture. What is happening in the picture?",szh:"第一題，請看圖片。圖中正在發生什麼事？",en:"Someone is holding a film clapper in front of an actor.",zh:"畫面前方有人拿著拍電影(film)用的場記板，後面站著一位演員(actor)，正確。拿場記板的不是那位演員，他兩手空著站在後面；他是站著，不是坐在攝影機旁邊。選 A"},
{n:2,p:0,fig:STAGE,o:["The man in the dark suit is sitting at the table.","Two actors are sitting on the stage, and one is standing.","Two actors are standing on the stage, and one is sitting."],a:2,sen:"For question two, look at the picture. What can you see on the theater stage?",szh:"第二題，請看圖片。在劇院(theater)舞台上可以看到什麼？",en:"Two actors are standing on the stage, and one is sitting.",zh:"舞台(stage)上穿西裝的男士和穿淺藍洋裝的女士站著，金髮女士坐在沙發前，所以是兩站一坐，正確。說兩坐一站是數量顛倒；穿深色(dark)西裝的男士站在左邊，沒有坐在桌子旁。選 C"},
{n:3,p:0,fig:RADIO,o:["The man is holding a radio, and they are listening to music.","The man is holding a cup, and they are listening to the radio.","The woman is holding a cup, and they are listening to the radio."],a:1,sen:"For question three, look at the picture. What is the family doing?",szh:"第三題，請看圖片。這一家人在做什麼？",en:"The man is holding a cup, and they are listening to the radio.",zh:"一家人看著架子上的舊收音機(radio)在聽，拿著白色杯子的是男士，正確。女士雙手抱著小孩，沒有拿杯子；收音機放在架子上，不是男士拿著。選 B"},
{n:4,p:0,fig:THEATER,o:["A movie star is taking pictures of her fans.","Many fans are taking pictures of a movie star in the afternoon.","Many fans are taking pictures of a movie star at night."],a:2,sen:"For question four, look at the picture. What is happening in the picture?",szh:"第四題，請看圖片。圖中正在發生什麼事？",en:"Many fans are taking pictures of a movie star at night.",zh:"晚上，很多影迷拿手機替走紅毯的電影(movie)明星(star)拍照(picture)，正確。拍照的是影迷，不是明星替影迷拍；天空是暗(dark)的、路燈都亮著，是晚上不是下午。選 C"},
{n:5,p:0,fig:STAR,o:["A bright light is shining in the sky over the dark hills.","A bright star is shining over a river.","A little bird is flying over the dark hills."],a:0,sen:"For question five, look at the picture. What can you see in the picture?",szh:"第五題，請看圖片。圖中可以看到什麼？",en:"A bright light is shining in the sky over the dark hills.",zh:"黑暗(dark)的山丘上方，夜空中有一個很亮的光點，正確。圖中只有山丘和草，沒有河(river)，所以「星星(star)在河上方」不對；天空裡也沒有小(little)鳥(bird)在飛。選 A"},
{n:6,p:1,o:["Not till eight, so we have time for dinner.","At the theater near the river.","I saw it last Sunday."],a:0,sen:"What time does the movie start on Sunday?",szh:"星期日(Sunday)電影幾點開始？",en:"Not till eight, so we have time for dinner.",zh:"問電影(movie)「幾點」開始，答「要到(till)八點才開始，所以我們有時間吃晚餐」是時間。「在河(river)邊的戲院(theater)」答的是地點；「我上星期日看過了」時間不對，也沒回答幾點。選 A"},
{n:7,p:1,o:["Turn left at the second light.","Sorry, I'll close the window.","I heard the news on the radio, too."],a:1,sen:"I can't hear the radio with all that noise outside.",szh:"外面那麼吵，我聽不到收音機。",en:"Sorry, I'll close the window.",zh:"對方說外面噪音(noise)太大聽不到收音機(radio)，回「抱歉，我去關窗」最自然。「我也從收音機聽到新聞」只是重複 radio；「在第二(second)個紅綠燈左轉(turn)」答非所問。選 B"},
{n:8,p:1,o:["I chatted with my club members about it.","It's on every Sunday night.","A young actor nobody knew before."],a:2,sen:"Who is the star of the new drama?",szh:"新連續劇的主角(star)是誰？",en:"A young actor nobody knew before.",zh:"問戲劇(drama)主角「是誰」，答「一個以前沒人認識的年輕演員(actor)」才是人物。「每週日晚上播」答的是時間；「我跟社員(member)聊(chat)過這齣戲」沒有說主角是誰。選 C"},
{n:9,p:1,o:["The writer lives near the theater.","She writes her notes with a sharp pencil.","Click on this, and the printer will do the rest."],a:2,sen:"How can I get a copy of the writer's notes?",szh:"我要怎麼拿到這位作家的筆記副本？",en:"Click on this, and the printer will do the rest.",zh:"問「怎麼」拿到作家(writer)筆記(note)的副本，答「點(click)這個，印表機(printer)就會幫你印」是方法。「她(she)用削尖的(sharp)鉛筆(pencil)寫筆記」說的是怎麼寫，不是怎麼拿到；「作家住在劇院附近」答的是地點。選 C"},
{n:10,p:1,o:["Here, have one more.","Maybe you should lie down for a while.","I bought them at the farm with the goats."],a:1,sen:"I ate too many mangoes, and now I have a stomachache.",szh:"我吃了太多芒果，現在肚子痛。",en:"Maybe you should lie down for a while.",zh:"對方吃太多芒果(mango)肚子痛(stomachache)，建議「也許你該躺一下」最自然。「來，再吃一個」和對方的情況相反；「我在有山羊(goat)的農場買的」說的是芒果從哪來，沒回應肚子痛。選 B"},
{n:11,p:1,o:["You can buy them at the theater.","No, the show isn't over till ten.","Only four per person, I'm afraid."],a:2,sen:"Is there a limit on how many tickets I can buy?",szh:"一個人能買幾張票有限制嗎？",en:"Only four per person, I'm afraid.",zh:"問買票有沒有限制(limit)，答「恐怕每人只能買四張」，間接說明有限制。「可以在劇院買」答的是地點；「不，表演到十點才結束」說的是結束時間，和張數無關。選 C"},
{n:12,p:1,o:["It's a rare film from long ago.","I sat in the second row.","The dark scenes made me afraid."],a:2,sen:"Why did you hide behind your coat during the movie?",szh:"看電影時你為什麼躲在外套後面？",en:"The dark scenes made me afraid.",zh:"問「為什麼」躲(hide)起來，答「那些黑暗(dark)的場景讓我害怕」是原因。「我坐在第二(second)排」答的是位置；「這是很久以前的罕見(rare)電影(film)」只是介紹電影，不能解釋為什麼要躲。選 C"},
{n:13,p:1,o:["Yes, it was very warm yesterday.","It starts after dark, so you'll be fine.","No, the show isn't free."],a:1,sen:"Do I need a hat for the show in the park? I burn easily.",szh:"公園的表演我需要戴帽子嗎？我很容易曬傷。",en:"It starts after dark, so you'll be fine.",zh:"對方怕曬傷(burn)問要不要帽子，答「表演天黑(dark)以後才開始，所以你不會有事」間接表示不需要。「不，表演不是免費(free)的」和帽子無關；「是的，昨天很暖(warm)」說的是昨天的天氣。選 B"},
{n:14,p:1,o:["The show is about a talking bird.","How rude! Did anyone ask them to stop?","Yes, it was a very quiet audience."],a:1,sen:"The people behind me kept talking throughout the whole show.",szh:"我後面的人整場表演從頭到尾(throughout)都在講話。",en:"How rude! Did anyone ask them to stop?",zh:"對方抱怨後面的人整場都在講話，回「好沒禮貌！有人請他們安靜嗎？」最自然。「是的，觀眾(audience)很安靜」和對方說的相反；「這齣戲是關於會說話的鳥(bird)」只是重複 talking。選 B"},
{n:15,p:1,o:["I roller blade by the river with my sister.","The river is not far from here.","Not till next Sunday."],a:0,sen:"What do you usually do on Sundays?",szh:"你星期日(Sunday)通常做什麼？",en:"I roller blade by the river with my sister.",zh:"問星期日通常「做什麼」，答「我跟姊姊在河邊溜直排輪(roller blade)」是活動。「要到下週日才…」答的是時間；「河(river)離這裡不遠」只是重複 river，沒說做什麼。選 A"},
{n:16,p:2,o:["At eight.","Before the news broadcast.","At seven."],a:0,sen:"W: Let's listen to the radio drama at seven. &nbsp;M: It's not at seven tonight. There's a special news broadcast first. &nbsp;W: So when does the drama start? &nbsp;M: An hour later than usual. &nbsp;Q: When does the radio drama start tonight?",szh:"女：我們七點來聽廣播(radio)劇(drama)吧。　男：今晚不是七點，先有一個特別(special)新聞廣播(broadcast)。　女：那廣播劇幾點開始？　男：比平常晚一個小時。　問：今晚廣播劇幾點開始？",en:"At eight.",zh:"廣播劇平常七點，今晚先播特別新聞，晚一小時，所以八點開始。七點是平常的時間；廣播劇是在新聞廣播之後，不是之前。選 A"},
{n:17,p:2,o:["A writer.","An actor in small parts.","A film star."],a:1,sen:"M: Is your brother a writer? &nbsp;W: He wanted to be one, but now he acts in films. &nbsp;M: Really? Is he a star? &nbsp;W: Not yet. He usually plays small parts. &nbsp;Q: What is the woman's brother?",szh:"男：你哥哥是作家(writer)嗎？　女：他本來想當作家，不過現在他在電影(film)裡演戲(act)。　男：真的？他是明星(star)嗎？　女：還不是，他通常演小角色。　問：女士的哥哥是做什麼的？",en:"An actor in small parts.",zh:"哥哥現在在電影裡演戲、通常演小角色，就是「演小角色的演員」。作家是他以前想當的；問他是不是明星，女士說「還不是」。選 B"},
{n:18,p:2,o:["In a theater.","At a phone shop.","On the stage."],a:0,sen:"W: Excuse me, you're in my seat. &nbsp;M: Oh, sorry. Isn't this row six? &nbsp;W: No, it's row seven. And please turn off your phone. The actors are coming out on the stage. &nbsp;Q: Where are the speakers?",szh:"女：不好意思，你坐到我的位子了。　男：喔，抱歉。這不是第六排嗎？　女：不是，這是第七排。還有請把手機關掉(turn off)，演員(actor)要上台(stage)了。　問：說話的兩人在哪裡？",en:"In a theater.",zh:"有座位排號、要關手機、演員要出來到舞台上，可知他們在劇院觀眾席。要上舞台的是演員，不是他們；手機只是被提醒要關，他們不在手機店。選 A"},
{n:19,p:2,o:["On paper from a store.","On paper from the printer.","On the man's phone."],a:2,sen:"M: Can you print the movie tickets for me? &nbsp;W: Sorry, our printer is out of ink. &nbsp;M: Then should we pay for the printing service at the store? &nbsp;W: No need. Just show the tickets on your phone at the door. &nbsp;Q: How will they show their tickets?",szh:"男：你可以幫我印電影(movie)票嗎？　女：抱歉，我們的印表機(printer)沒墨水了。　男：那我們要去店裡付費用列印服務(service)嗎？　女：不用，在門口用你的手機給他們看票就好。　問：他們要怎麼出示票？",en:"On the man's phone.",zh:"印表機(printer)沒墨水，印不出來，女士要男士用手機出示電子票。家裡的印表機印不出來；男士提議去店裡付費列印，女士說不用。選 C"},
{n:20,p:2,o:["Thirty-five dollars.","Thirty dollars.","Forty dollars."],a:0,sen:"W: How much are the tickets for the drama? &nbsp;M: Twenty dollars each, but club members get five dollars off. &nbsp;W: I'm a member, but my brother isn't. &nbsp;Q: How much will the woman pay for two tickets?",szh:"女：這齣戲劇(drama)的票多少錢？　男：一張二十元，但社員(member)可以便宜五元。　女：我是社員，但我弟弟不是。　問：女士買兩張票要付多少錢？",en:"Thirty-five dollars.",zh:"她是社員(member)付十五元，弟弟不是社員付二十元，合計三十五元。三十元是把兩人都算社員價；四十元是兩人都付原價。選 A"},
{n:21,p:2,o:["They all stood in the back.","Half of them left in the rain.","Nobody came."],a:1,sen:"M: Did many people come to the free show in the park? &nbsp;W: Every seat was filled, and some people stood in the back. &nbsp;M: Wow, a big audience! &nbsp;W: But then it started to rain, and half of them went home. &nbsp;Q: What happened to the audience?",szh:"男：公園的免費(free)表演有很多人去嗎？　女：每個位子都坐滿(fill)了，還有人站在後面。　男：哇，觀眾(audience)好多！　女：可是後來下雨，一半的人回家了。　問：觀眾後來怎麼了？",en:"Half of them left in the rain.",zh:"觀眾坐滿還有人站，但下雨後一半的人回家，就是「一半的人在雨中離開」。座位都坐滿，所以不是沒人來；站在後面的只有一些人，不是全部。選 B"},
{n:22,p:2,o:["Play the drum.","Make more noise.","Play the guitar."],a:2,sen:"W: What's that noise next door? &nbsp;M: My neighbor is learning to play the drum. &nbsp;W: Every night? &nbsp;M: Only till nine. After that, he plays the guitar very quietly. &nbsp;Q: What will the neighbor do after nine?",szh:"女：隔壁那是什麼噪音(noise)？　男：我鄰居在學打鼓(drum)。　女：每天晚上嗎？　男：只到(till)九點。九點以後他會很小聲地彈吉他。　問：鄰居九點以後會做什麼？",en:"Play the guitar.",zh:"打鼓只到九點，九點以後改成小聲彈吉他。打鼓是九點以前的事；他是很小聲地彈，不會再製造噪音(noise)。選 C"},
{n:23,p:2,o:["Soda.","Milk.","Mango juice."],a:2,sen:"W: Can you get me a soda from the kitchen? &nbsp;M: There's none left. We only have milk and mango juice. &nbsp;W: Then the juice, please. And put the lid back on the bottle. &nbsp;Q: What will the woman drink?",szh:"女：你可以去廚房幫我拿一瓶汽水(soda)嗎？　男：沒有了，只剩牛奶和芒果(mango)汁。　女：那給我果汁。記得把瓶蓋(lid)蓋回去。　問：女士要喝什麼？",en:"Mango juice.",zh:"汽水(soda)已經沒了，女士改要果汁，也就是芒果汁。汽水是她原本想要但沒有的；牛奶是男士提到的另一種，她沒選。選 C"},
{n:24,p:2,o:["Take out a scene.","Move the story to the river.","Write a longer story."],a:0,sen:"M: My story is too long for the school paper. &nbsp;W: My teacher once advised me to omit the parts that the story doesn't need. &nbsp;M: Good idea. Then the scene at the river can go. &nbsp;Q: What will the man probably do?",szh:"男：我的故事對校刊來說太長了。　女：我老師曾經建議(advise)我把故事不需要的部分省略(omit)。　男：好主意，那河(river)邊那一場就可以拿掉。　問：男士可能會做什麼？",en:"Take out a scene.",zh:"男士說「河邊那一場可以拿掉(can go)」，也就是刪掉一個場景。故事太長，所以不會寫得更長；河邊是要刪掉的場景，不是把故事搬到河邊。選 A"},
{n:25,p:2,o:["A bird.","A kite.","A tree."],a:1,sen:"M: What's that little object in the distance? Is it a bird? &nbsp;W: No, it's not moving. I think it's a kite in a tree. &nbsp;M: You're right. I can see its long tail now. &nbsp;Q: What is the object?",szh:"男：遠處(distance)那個小(little)東西(object)是什麼？是鳥(bird)嗎？　女：不是，它沒在動。我想是卡在樹上的風箏。　男：你說得對，我現在看到它長長的尾巴了。　問：那個東西是什麼？",en:"A kite.",zh:"女士說它不會動，是卡在樹上的風箏，男士也看到風箏的尾巴而同意。鳥是男士一開始的猜測，被否定了；樹是風箏卡住的地方，不是那個東西本身。選 B"},
{n:26,p:3,pic:true,o:[BARS("Movie Night Votes",["Action","Cartoon","Drama"],[50,80,20]),BARS("Movie Night Votes",["Action","Cartoon","Drama"],[80,50,20]),BARS("Movie Night Votes",["Action","Cartoon","Drama"],[20,50,80])],a:0,sen:"Every month, our film club members vote for a movie for movie night. Last month, a drama got the most votes. This month, members wanted something fun, so drama got the fewest. Action movies did well, but cartoons did even better. &nbsp;Q: Which chart shows this month's votes?",szh:"我們電影(film)社的社員(member)每個月投票選電影之夜的電影(movie)。上個月劇情片(drama)得票最多。這個月社員想看輕鬆的，所以劇情片得票最少。動作片表現不錯，但卡通更好。　問：哪張圖是這個月的投票結果？",en:"Cartoons most, action second, drama least.",zh:"這個月劇情片最少；動作片不錯，但卡通更好，所以卡通最高、動作片第二、劇情片最低。劇情片最高的那張是上個月的結果；動作片最高的那張和「卡通更好」相反。選 A"},
{n:27,p:3,pic:true,o:[BARS("Drama Audience",["Friday","Saturday","Sunday"],[50,80,20]),BARS("Drama Audience",["Friday","Saturday","Sunday"],[20,50,80]),BARS("Drama Audience",["Friday","Saturday","Sunday"],[50,20,80])],a:2,sen:"Our little theater showed a new drama three nights last weekend. Saturday night is usually our busiest night. But on Saturday, heavy rain kept many people at home, so the audience on Friday was bigger than on Saturday. On Sunday, the show was free for students, and it had the biggest audience of all. &nbsp;Q: Which chart shows the audience for the drama last weekend?",szh:"我們的小(little)劇場(theater)上週末連續三晚演出一齣新戲(drama)。星期六晚上通常是最忙的一晚。但星期六下大雨，很多人待在家，所以星期五的觀眾(audience)比星期六多。星期日(Sunday)那場學生免費(free)，觀眾是三天中最多的。　問：哪張圖表是上週末這齣戲的觀眾人數？",en:"Sunday most, Friday second, Saturday least.",zh:"星期五比星期六多，星期日(Sunday)學生免費(free)、觀眾(audience)最多，所以是星期日最高、星期五第二、星期六最低的圖。星期六最高的那張是「通常」的情形，但那天下大雨；星期日最高但星期六比星期五多的那張，和「星期五比星期六多」相反。選 C"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:1,sen:"On Sunday, my family planned to see a movie at the theater, but all the tickets were sold out. Dad wanted to watch a film at home, but our TV was broken. Then we found a free movie outside by the river. We lay on a cotton blanket and watched it throughout the warm evening. &nbsp;Q: Where did the family watch the movie?",szh:"星期日(Sunday)我們家打算去電影院(theater)看電影(movie)，但票全賣光了。爸爸想在家看電影(film)，可是我們的電視壞了。後來我們找到河(river)邊有免費(free)的戶外電影。我們躺(lay)在棉(cotton)毯上，在溫暖(warm)的夜晚從頭到尾(throughout)看完了。　問：這一家人在哪裡看電影？",en:"Outside by the river.",zh:"電影院的票賣光了；家裡的電視壞了；最後是在河邊看免費的戶外電影。電影院和客廳電視的照片都是沒有成功的計畫。選 B"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29b'),PH('q29c')],a:0,sen:"My mom works at a radio station. Many people think she talks on the radio, but she doesn't. For many years, she wrote notes for the speakers. Last year, her job changed. Now she chooses all the music for the morning broadcast. &nbsp;Q: What does the speaker's mom do now?",szh:"我媽媽在廣播(radio)電台工作。很多人以為她(she)在廣播裡說話，但她沒有。很多年來，她替主持人寫稿子(note)。去年她(her)的工作換了，現在她負責挑選早上廣播(broadcast)的所有音樂。　問：說話者的媽媽現在做什麼？",en:"She chooses the music for the morning broadcast.",zh:"對著麥克風說話是別人以為的，其實她沒有；寫稿是她以前多年的工作；現在她負責挑音樂。說話和寫稿的照片都不是她現在的工作。選 A"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:1,sen:"My uncle drives a truck for a film company. Last week, he took a special actor to work: a goat! It was the star of a new movie. At first, my uncle wanted it to stand in the back of the truck, but that was not safe. So he put it in a big box, but the goat made too much noise. In the end, it rode in the front seat next to him. &nbsp;Q: How did the goat ride to work?",szh:"我叔叔替一家電影(film)公司開卡車(truck)。上週他載了一位特別(special)的演員(actor)去上班：一隻山羊(goat)！牠是一部新電影(movie)的主角(star)。一開始叔叔想讓牠站在卡車後面，但那樣不安全。所以他把牠放進一個大箱子，可是山羊吵(noise)個不停。最後，牠坐在叔叔旁邊的前座。　問：山羊是怎麼坐車去上班的？",en:"In the front seat next to the uncle.",zh:"站在卡車後面不安全，沒有這樣做；放進大箱子又太吵，也放棄了；最後坐在前座叔叔旁邊。站在車斗和關在箱子裡的照片都是被否定的做法。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 28 回　電影與表演　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
