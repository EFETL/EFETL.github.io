<script>
/* 圖形素材（第2回 時間與日期） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/2/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/2/p3_${n}.jpg?v=r2hard-20261009" alt="picture ${n}">`;
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CAL=`<img class="pic-img p0img" src="gept-listening-img/2/p0_q1.jpg?v=p0fix-20261029" alt="question 1 picture">`;
const BIKESUN=`<img class="pic-img p0img" src="gept-listening-img/2/p0_q3.jpg" alt="question 3 picture">`;
const FIRE=`<img class="pic-img p0img" src="gept-listening-img/2/p0_q4.jpg?v=p0fix-20261010" alt="question 4 picture">`;
const CAKE=`<img class="pic-img p0img" src="gept-listening-img/2/p0_q5.jpg" alt="question 5 picture">`;
const DATE=(mon,day)=>`<svg width="90" height="98" viewBox="0 0 90 100"><rect x="14" y="12" width="62" height="76" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="14" y="12" width="62" height="24" rx="6" fill="#e6007e"/><rect x="14" y="28" width="62" height="8" fill="#e6007e"/><text x="45" y="30" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${mon}</text><text x="45" y="72" text-anchor="middle" font-size="34" font-weight="900" fill="#1a1a1a">${day}</text></svg>`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CAL,o:["She is putting the calendar on the shelf.","She is marking a date on the calendar with a pen.","She is tracing a picture in her notebook."],a:1,sen:"For question one, look at the picture. What is the woman doing?",szh:"第一題，請看圖片。這位女士在做什麼？",en:"She is marking a date on the calendar with a pen.",zh:"女士一手扶著桌上的月曆(calendar)，一手拿筆在某個日期上寫字，正確。筆記本放在桌上沒有打開，她沒有在描(trace)圖；月曆立在桌上，她沒有把它放到書架上。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">GIFT SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Clock</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Calendar</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Notebook</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Pen</td><td style="text-align:right;font-weight:700">$50</td></tr></table></div>`,o:["He will have three hundred dollars left.","He will have one hundred dollars left.","He will have two hundred dollars left."],a:2,sen:"For question two, look at the picture. Ben has six hundred dollars. He buys a clock and a notebook. How much will he have left?",szh:"第二題，請看圖片。班有六百元。他買了一個時鐘和一本筆記本。他還剩多少錢？",en:"He will have two hundred dollars left.",zh:"價目表上時鐘(clock)300元、筆記本100元，一共400元，600減400剩200元。剩三百元是只買了時鐘、忘了筆記本；剩一百元是把筆記本看成日曆(calendar)200元，算成時鐘加日曆。選 C"},
{n:3,p:0,fig:BIKESUN,o:["He is riding his bicycle on the road.","He is walking next to his bicycle.","He is riding his bicycle on the grass."],a:0,sen:"For question three, look at the picture. What is the boy doing?",szh:"第三題，請看圖片。男孩在做什麼？",en:"He is riding his bicycle on the road.",zh:"男孩戴著安全帽，正在柏油路上騎(ride)腳踏車，正確。路兩旁才是草地，他騎在路面上，不是草地上；他坐在車上騎，不是下車走在腳踏車旁邊。選 A"},
{n:4,p:0,fig:FIRE,o:["Five people are having fun at night by the river.","Four people are having fun at night by the river.","Five people are sitting on the ground by the river."],a:0,sen:"For question four, look at the picture. What can you see in the picture?",szh:"第四題，請看圖片。你在圖中看到什麼？",en:"Five people are having fun at night by the river.",zh:"圖中五個人晚上在河邊站著舉杯慶祝，後面夜空有煙火，正確。人數是五個，不是四個；他們都是站著，不是坐在地上。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Party Guests</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="96" y="70" width="44" height="80" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="65" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="90" width="44" height="60" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="85" font-size="14" font-weight="700" text-anchor="middle">30</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Kids</text><text x="118" y="167" text-anchor="middle">Teens</text><text x="184" y="167" text-anchor="middle">Adults</text></g></svg>`,o:["There were eighty more kids.","There were thirty more kids.","There were twenty more kids."],a:2,sen:"For question five, look at the picture. The party had kids and adults. How many more kids than adults came?",szh:"第五題，請看圖片。派對上有小孩和大人。小孩比大人多多少人？",en:"There were twenty more kids.",zh:"圖中小孩50人、大人(adult)30人，50減30，小孩多20人。多八十人是把50和30加起來；多三十人是只看了大人的人數，沒有相減。選 C"},
{n:6,p:1,o:["It was a lovely wedding.","Some time in April, I think.","At a big hotel in this area."],a:1,sen:"When is your sister's wedding?",szh:"你姊姊的婚禮是什麼時候？",en:"Some time in April, I think.",zh:"問婚禮「什麼時候」，答「大概四月(April)吧」才是時間。「在這一區(area)的一家大(big)飯店」答的是地點；「那是一場很美(lovely)的婚禮」時態不對，婚禮還沒舉行。選 B"},
{n:7,p:1,o:["No, I didn't buy a calendar.","Yes, I was born in January.","I know. This year went by so fast."],a:2,sen:"I can't believe it's already December.",szh:"真不敢相信已經十二月了。",en:"I know. This year went by so fast.",zh:"對方感嘆已經十二月(December)了，回「對啊，今年過得好快」最自然。「我是一月(January)出生的」只是換個月份，答非所問；「我沒買月曆(calendar)」跟感嘆時間過得快無關。選 C"},
{n:8,p:1,o:["He taught us about democracy.","He turned eighty last February.","He goes to bed at eight."],a:1,sen:"How old is your grandfather now?",szh:"你爺爺現在幾歲？",en:"He turned eighty last February.",zh:"問年紀，答「他去年二月(February)滿八十歲」，間接說出現在八十歲。「他教我們(us)民主(democracy)」答的是他做過什麼；「他八點睡覺」的 eight 和 eighty 音近，是陷阱。選 B"},
{n:9,p:1,o:["Happy New Year to you, too!","We're going to visit my aunt in Japan.","I had a big dinner on New Year's Eve."],a:1,sen:"Do you have any plans for New Year's Day?",szh:"你元旦有什麼計畫嗎？",en:"We're going to visit my aunt in Japan.",zh:"問元旦(New Year's Day)的計畫，答「我們要去日本(Japan)看阿姨」是未來的安排。「你也新年快樂」是回應祝福，不是回答計畫；「除夕(New Year's Eve)我吃了大餐」是過去的事，不是計畫。選 B"},
{n:10,p:1,o:["Maybe he's bored. Try giving him a toy.","Our dog is three years old.","Yes, I'd like a new pair of slippers."],a:0,sen:"My dog ate my slippers again.",szh:"我的狗又把我的拖鞋咬壞了。",en:"Maybe he's bored. Try giving him a toy.",zh:"對方抱怨狗(dog)又咬壞拖鞋(slipper)，回「也許牠很無聊，試試(try)給牠一個玩具」是在給建議。「好，我想要一雙新拖鞋」好像是別人要送你拖鞋；「我們的狗三歲」只是重複 dog，沒有回應。選 A"},
{n:11,p:1,o:["It's too hot in summer.","Very early, before five.","It starts in June."],a:1,sen:"What time does the sun rise in June?",szh:"六月太陽幾點升起？",en:"Very early, before five.",zh:"問六月(June)太陽幾點升起(rise)，答「很早，五點以前」是時間。「它六月開始」只是重複 June；「夏天太熱了」在講天氣，沒回答幾點。選 B"},
{n:12,p:1,o:["I had to see the dentist.","Because the party starts at seven.","Yes, I came with my sister."],a:0,sen:"Why didn't you come to the party last night?",szh:"你昨晚為什麼沒來派對？",en:"I had to see the dentist.",zh:"問昨晚為什麼沒來，答「我得去看牙醫(dentist)」說出原因。「因為派對七點開始」用現在式，也不是沒來的理由；「有，我和姊姊一起來」與「沒來」矛盾，而且 why 問句不能用 Yes 回答。選 A"},
{n:13,p:1,o:["He's wearing a gray suit.","He'll be here at noon.","That's Mr. Wang, our special guest."],a:2,sen:"Who's the gentleman in the gray suit?",szh:"穿灰色西裝的那位先生是誰？",en:"That's Mr. Wang, our special guest.",zh:"問那位先生(gentleman)是誰，答「那是王先生，我們的特別來賓(guest)」才是身分。「他穿灰色西裝」只是重複題目；「他中午會到」答的是時間，而且他人已經在現場了。選 C"},
{n:14,p:1,o:["It's my personal diary.","I write with blue ink.","Not as often as I did in my childhood."],a:2,sen:"How often do you write in your diary?",szh:"你多久寫一次日記？",en:"Not as often as I did in my childhood.",zh:"問「多久」寫一次日記，答「沒有小時候(childhood)那麼常寫」是在說頻率，雖然間接但最合適。「這是我私人的(personal)日記」答非所問；「我用藍色墨水(ink)寫」答的是用什麼寫。選 C"},
{n:15,p:1,o:["That's natural. Do you go home often?","I'll stay in Japan for ten days.","Yes, Japanese food is really good."],a:0,sen:"I've lived in Japan for ten years, but I still feel homesick sometimes.",szh:"我住在日本十年了，但有時還是會想家。",en:"That's natural. Do you go home often?",zh:"對方說有時會想家(homesick)，回「這很正常，你常回家嗎？」是在關心對方。「對，日本(Japanese)料理很好吃」和想家無關；「我會在日本待十天」把 ten years 換成 ten days，只是重複字。選 A"},
{n:16,p:2,o:["In September.","In November.","In October."],a:1,sen:"W: When is the school trip to the mountains? Is it in October? &nbsp;M: It was, but it rains a lot in October, so they moved it to November. &nbsp;W: Really? I heard September. &nbsp;M: No, September is too hot. &nbsp;Q: When is the school trip now?",szh:"女：去山上的校外教學是什麼時候？在十月(October)嗎？　男：本來是，但十月常下雨，所以改到十一月(November)了。　女：真的？我聽說是九月(September)。　男：不是，九月太熱了。　問：校外教學現在是什麼時候？",en:"In November.",zh:"校外教學原本在十月(October)，因為常下雨改到十一月(November)。十月是原本的時間；九月(September)是女士聽錯的，男士說九月太熱，所以不是。選 B"},
{n:17,p:2,o:["One thousand dollars.","Four thousand dollars.","Two thousand dollars."],a:2,sen:"M: I'm going to Japan for two weeks. I think I need about two thousand dollars a week. &nbsp;W: That's a big amount. Do you really need that much? &nbsp;M: Well, the hotel is already paid. So I'll take only half of the total. &nbsp;Q: How much money will the man take?",szh:"男：我要去日本(Japan)兩週，我想一週大概要兩千元。　女：那是很大(big)的金額(amount)，真的需要那麼多嗎？　男：嗯，飯店已經付了，所以我只帶總數的一半。　問：男士會帶多少錢？",en:"Two thousand dollars.",zh:"兩週、每週兩千元，原本要四千元；飯店已付，只帶一半，所以是兩千元。四千元是原本算的總數；一千元是把「一週兩千」再減半，算錯了。選 C"},
{n:18,p:2,o:["Nine.","Ten.","Six."],a:0,sen:"W: Is that photograph from your childhood? &nbsp;M: Yes. That's me with my older brother. I was six. &nbsp;W: And he was ten? &nbsp;M: No, he's only three years older than me. &nbsp;Q: What was the brother's age in the photograph?",szh:"女：那張照片(photograph)是你小時候(childhood)的嗎？　男：對，那是我和我哥哥，我那時六歲。　女：那他十歲？　男：不是，他只比我大三歲。　問：照片裡的哥哥年紀(age)多大？",en:"Nine.",zh:"男士當時六歲，哥哥大他三歲，所以哥哥九歲。六歲是男士自己的年紀；十歲是女士猜錯、被男士否定的數字。選 A"},
{n:19,p:2,o:["A trip to the river.","A gift for friends.","A stone collection."],a:1,sen:"W: Look at all these stones from the edge of the river! &nbsp;M: Wow. Are you going to collect them? &nbsp;W: No. I'm going to paint a small picture on each one. &nbsp;M: Nice. Who are they for? &nbsp;W: My friends. I'll give one to each friend on Friday. &nbsp;M: Good idea. Can I help you carry them to the car? &nbsp;Q: What are the speakers talking about?",szh:"女：你看河邊(edge)的這些石頭(stone)！　男：哇。你要收集(collect)它們嗎？　女：不是。我要在每一顆上面畫一張小圖。　男：真好。是要給誰的？　女：我的朋友。星期五我會送每個朋友一顆。　男：好主意。我幫你把它們搬到車上好嗎？　問：說話的人在談什麼？",en:"A gift for friends.",zh:"女士要在石頭(stone)上畫畫，星期五送給每個朋友，所以談的是要送朋友的禮物。河邊(edge)只是石頭撿來的地方，沒有人談去河邊玩；男士問她是不是要收集(collect)，她說不是。選 B"},
{n:20,p:2,o:["In a dentist's office.","In a hospital.","On the second floor."],a:1,sen:"W: Excuse me. Is the doctor here? My son has a high fever. &nbsp;M: I'm a male nurse here. The doctor is with another patient. &nbsp;W: Oh. Last month I came here to see the dentist, and it was upstairs. &nbsp;M: Yes, the dentist's office is on the second floor. This is the first floor, where sick people see the doctor. &nbsp;Q: Where are the speakers?",szh:"女：不好意思，醫生在嗎？我兒子發高燒。　男：我是這裡的男(male)護理師(nurse)。醫生正在看另一位病人。　女：喔。上個月我來這裡看牙醫(dentist)，是在樓上。　男：對，牙醫診所在二樓。這裡是一樓，生病的人在這裡看醫生。　問：說話的人在哪裡？",en:"In a hospital.",zh:"有護理師(nurse)和醫生，生病的人在一樓看醫生，牙醫(dentist)診所又在同一棟的二樓，所以他們是在醫院裡。牙醫診所在樓上，不是他們現在的地方；二樓也是牙醫的位置，他們現在在一樓。選 B"},
{n:21,p:2,o:["The end is better than the start.","The start is better than the end.","She stopped reading on the first page."],a:0,sen:"M: I wrote this story all by myself. Can you give me some comments? &nbsp;W: Sure. I read it during my lunch break today. &nbsp;M: Great! Is it good? &nbsp;W: I almost stopped on the first page. Nothing happened. &nbsp;M: Oh. I see. &nbsp;W: But then the ending was a big surprise. I'm glad I kept going. &nbsp;Q: What does the woman think about the story?",szh:"男：這篇故事是我自己(myself)寫的。你可以給我一些意見(comment)嗎？　女：好啊。我今天午休(break)時讀了。　男：太好了！好看嗎？　女：我第一頁差點不讀了，什麼事都沒發生。　男：喔，我懂了。　女：但後來結局讓我大吃一驚。我很高興我繼續讀下去。　問：女士覺得這篇故事怎麼樣？",en:"The end is better than the start.",zh:"她說第一頁很無聊、差點不讀，但結局讓她大吃一驚，很高興繼續讀，所以覺得後面比開頭好。開頭比結局好是說反了；她只是「差點」在第一頁停下來，後來繼續讀完，並沒有真的停止。選 A"},
{n:22,p:2,o:["In November.","In December.","In March."],a:0,sen:"W: My birthday is in July. When is yours? &nbsp;M: Mine is four months later. &nbsp;W: Oh, December, the same as my mom! &nbsp;M: No, count again. &nbsp;Q: When is the man's birthday?",szh:"女：我的生日在七月(July)，你的呢？　男：我的晚四個月。　女：喔，十二月，跟我媽一樣！　男：不對，再算一次。　問：男士的生日在什麼時候？",en:"In November.",zh:"七月(July)往後數四個月是十一月(November)。十二月是女士算錯、被男士否定的；三月(March)是往前數四個月，方向錯了。選 A"},
{n:23,p:2,o:["In September.","In October.","In August."],a:2,sen:"M: Is the music show still on September tenth? &nbsp;W: No. The guest singer is busy in September, so they moved it one month earlier. &nbsp;M: Oh, no. I'll be in Japan for all of August. &nbsp;W: Too bad. Then you'll miss it. &nbsp;Q: When is the music show now?",szh:"男：音樂表演還是九月(September)十號嗎？　女：不是。特別來賓(guest)歌手九月很忙，所以提早一個月。　男：喔，不會吧，我整個八月(August)都在日本(Japan)。　女：真可惜，那你會錯過。　問：音樂表演現在在什麼時候？",en:"In August.",zh:"音樂表演原本在九月(September)，提早一個月就是八月(August)，所以男士人在日本會錯過。九月是原本的日期；十月(October)是往後延一個月，方向錯了。選 C"},
{n:24,p:2,o:["He doesn't like big dinners.","He has a problem at work.","He misses his family."],a:2,sen:"W: You look sad. What's the problem? &nbsp;M: Tomorrow is New Year's Day. My family in Japan always has a big dinner together, but I'm here alone. &nbsp;W: Why don't you come to my home for dinner? &nbsp;Q: How does the man feel?",szh:"女：你看起來很難過，怎麼了(problem)？　男：明天是元旦(New Year's Day)。我在日本(Japan)的家人總是一起吃大(big)餐，但我一個人在這裡。　女：你何不來我家吃晚餐？　問：男士覺得怎麼樣？",en:"He misses his family.",zh:"新年家人在日本團聚吃大餐，他卻一個人在這裡，所以他很想家。problem 只出現在女士的問句，他沒有說工作有問題；他是羨慕家人一起吃大餐，不是不喜歡大餐。選 C"},
{n:25,p:2,o:["To ride her bicycle to work.","To learn Japanese.","To buy a new bicycle."],a:0,sen:"M: Happy New Year! Do you have a plan for this year? &nbsp;W: I wanted to learn Japanese, but I don't have time for classes. &nbsp;M: So what will you do? &nbsp;W: Starting in May, I'll ride my bicycle to work every day. It's good exercise, and it's free. &nbsp;Q: What is the woman's plan for the new year?",szh:"男：新年快樂！你今年有什麼計畫？　女：我本來想學日文(Japanese)，但沒時間上課。　男：那你要做什麼？　女：從五月(May)開始我要每天騎(ride)腳踏車上班，是很好的運動，又不用錢。　問：女士的新年計畫是什麼？",en:"To ride her bicycle to work.",zh:"她原本想學日文(Japanese)，但沒時間所以放棄；新計畫是每天騎(ride)腳踏車上班。學日文是被放棄的想法；她說騎車「不用錢」，沒有說要買新腳踏車。選 A"},
{n:26,p:3,pic:true,o:[BARS("Class Birthdays",["April","July","October"],[20,50,70]),BARS("Class Birthdays",["April","July","October"],[20,70,50]),BARS("Class Birthdays",["April","July","October"],[70,50,20])],a:0,sen:"Our class has a big calendar on the wall with all our birthdays on it. Last year, July had the most birthdays. This year, we have some new students, and now October has more birthdays than July. April still has the fewest. Our teacher asked us to raise our hands when she read our month. &nbsp;Q: Which chart shows the class birthdays this year?",szh:"我們班牆上有一個大(big)月曆(calendar)，上面寫著大家的生日。去年七月(July)生日的人最多。今年來了幾位新同學，現在十月(October)生日的人比七月多。四月(April)還是最少。老師念到我們的月份時，要我們舉手(raise)。　問：哪張圖是今年班上的生日人數？",en:"October most, July second, April fewest.",zh:"今年十月(October)比七月(July)多，四月(April)最少，所以十月最高、七月第二、四月最低。七月最高的那張是「去年」的情形；四月最高的那張和「四月還是最少」相反。選 A"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27b'),PH('q27c')],a:2,sen:"Since her childhood, Mia has watched the colorful lights in the sky by the river every New Year's Eve. This year, her friends asked her to go again, but the river area will be too crowded. Her parents will have a big dinner at home. However, her cousin from Japan wants to camp in the snow. Camping is not part of Mia's daily life, but she loves a warm fire, so she will go with him. &nbsp;Q: Where will Mia spend New Year's Eve this year?",szh:"從小時候(childhood)開始，米雅每年新年前夜(New Year's Eve)都會在河邊看天空中彩色的亮光。今年朋友又邀她去，但河邊的區域(area)會太擁擠。她的父母會在家辦一頓豐盛的晚餐。不過，她來自日本(Japan)的表哥想在雪地露營。露營不是米雅的日常(daily)生活，但她喜歡溫暖的營火，所以她要跟表哥去。　問：米雅今年的新年前夜會在哪裡度過？",en:"She will camp in the snow with her cousin.",zh:"朋友邀她去河邊看煙火，但那裡太擁擠(area)，所以今年不去了；父母在家吃大餐只是父母的安排，她沒說要留下；最後她要跟日本(Japan)來的表哥去雪地露營，坐在營火旁，所以今年的新年前夜(New Year's Eve)在雪地露營。看煙火是她從小的習慣，但今年不去；在家吃飯是父母的計畫，她沒有答應。選 C"},
{n:28,p:3,pic:true,o:[PH('q28c'),PH('q28b'),PH('q28a')],a:1,sen:"My grandfather loves to collect things. When he was young, he collected stones from the beach. Later, he also collected old clocks and fixed them himself. Now he is seventy, and his eyes are not good enough to fix clocks. These days, he goes to the park and takes photographs of birds. Last year, one of his photographs won a prize. &nbsp;Q: What does the grandfather do these days?",szh:"我爺爺喜歡收集(collect)東西。年輕時他收集海邊的石頭(stone)。後來他也(also)收集老時鐘(clock)，還自己修。現在他七十歲了，眼睛不夠好，沒辦法修時鐘。最近他都去公園拍鳥的照片(photograph)，去年他有一張照片還得(win)了獎。　問：爺爺最近在做什麼？",en:"He takes photographs of birds in the park.",zh:"收集石頭(stone)是他年輕時的事；修時鐘(clock)是後來的嗜好，但現在眼睛不好已經做不到；最近他在公園拍鳥的照片(photograph)。選 B"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29c'),PH('q29a')],a:2,sen:"Every New Year's Eve, my family has a big dinner. This year, our guest was Mr. Sato, my dad's old friend from Japan. He is a real gentleman. My little brother was a bit greedy and hoped for a big box of Japanese candy. My mom guessed he would bring a bottle of wine. But Mr. Sato gave each of us a pair of warm slippers. He said it was his pleasure, and we were all in high spirits. &nbsp;Q: What did Mr. Sato give the family?",szh:"每年除夕(New Year's Eve)我家都吃大餐。今年的客人(guest)是佐藤先生，爸爸從日本(Japan)來的老朋友，他是個真正的紳士(gentleman)。我弟弟有點貪心(greedy)，希望拿到一大盒日本(Japanese)糖果；媽媽猜他會帶一瓶酒。但佐藤先生送我們每人一雙保暖的拖鞋(slipper)。他說「這是我的榮幸(pleasure)」，大家都很開心(spirit)。　問：佐藤先生送了這家人什麼？",en:"A pair of warm slippers for each of them.",zh:"糖果是貪心(greedy)的弟弟希望的；酒是媽媽猜的；佐藤先生實際送的是每人一雙拖鞋(slipper)。選 C"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30a'),PH('q30c')],a:1,sen:"I usually play basketball with my friends after school on Thursdays. My piano lesson is on Wednesdays. But this week, my dentist moved my visit from Tuesday to Thursday afternoon. So I have to tell my friends that I can't play with them this Thursday. &nbsp;Q: What will the speaker do on Thursday afternoon this week?",szh:"我通常每週四放學後和朋友打籃球。我的鋼琴課在星期三。但這週牙醫(dentist)把我的看診從星期二改到星期四下午，所以我得跟朋友說這週四不能和他們打球。　問：說話者這週四下午會做什麼？",en:"The speaker will go to the dentist.",zh:"週四打籃球是平常的安排，但這週牙醫(dentist)把看診改到週四下午，所以他要去看牙醫。鋼琴課在星期三，不是星期四。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 2 回　時間與日期　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
