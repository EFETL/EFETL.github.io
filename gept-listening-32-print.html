<div class="bar">

<div id="root"></div>
<script>
/* 圖形素材（第32回 飛機與船） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/32/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/32/p3_${n}.jpg?v=r32hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const AIRPLANE=`<img class="pic-img p0img" src="gept-listening-img/32/p0_q1.jpg" alt="question 1 picture">`;
const SHIP=`<img class="pic-img p0img" src="gept-listening-img/32/p0_q2.jpg" alt="question 2 picture">`;
const AIRPORT=`<img class="pic-img p0img" src="gept-listening-img/32/p0_q3.jpg" alt="question 3 picture">`;
const SAILBOAT=`<img class="pic-img p0img" src="gept-listening-img/32/p0_q4.jpg" alt="question 4 picture">`;
const ROWBOAT=`<img class="pic-img p0img" src="gept-listening-img/32/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:AIRPLANE,o:["An airplane with four engines is flying on a gray, rainy day.","An airplane with two engines is flying in a blue sky.","An airplane with four engines is flying in a blue sky."],a:2,sen:"For question one, look at the picture. What can you see in the sky?",szh:"第一題，請看圖片。你可以在天空中看到什麼？",en:"An airplane with four engines is flying in a blue sky.",zh:"藍天白雲中有一架飛機(airplane)，機翼下共有四具引擎，正確。數一數，引擎是四具不是兩具；天空是藍的、有白雲，不是灰暗的雨天。選 C"},
{n:2,p:0,fig:SHIP,o:["A long ship is sailing across the calm sea.","Many small boats are sailing next to a long ship.","A long ship is sailing across the sea in a big storm."],a:0,sen:"For question two, look at the picture. What is on the sea?",szh:"第二題，請看圖片。海上有什麼？",en:"A long ship is sailing across the calm sea.",zh:"一艘長長的大船(ship)正航行(sail)穿越(across)平靜的海面，正確。圖中只有這一艘船，旁邊沒有小船(boat)；海面很平靜，不是在暴風雨中。選 A"},
{n:3,p:0,fig:AIRPORT,o:["It's flying over a green field far from the airport.","It's at the airport, very close to the ground.","It's flying very high in the sky."],a:1,sen:"For question three, look at the picture. Where is the plane?",szh:"第三題，請看圖片。這架飛機(plane)在哪裡？",en:"It's at the airport, very close to the ground.",zh:"飛機在機場(airport)跑道上，輪子幾乎貼著地面，後面看得到機場大樓和其他飛機，正確。飛機離地面很近，不是飛在很高的天空中；後面就是機場大樓，所以不是在遠離機場的草地上空。選 B"},
{n:4,p:0,fig:SAILBOAT,o:["He is standing up in a small boat with a white sail.","Two men are rowing a small boat with a white sail.","He is rowing a small boat with a white sail."],a:2,sen:"For question four, look at the picture. What is the man doing?",szh:"第四題，請看圖片。這位男士在做什麼？",en:"He is rowing a small boat with a white sail.",zh:"男士坐在掛著白帆(sail)的小船(boat)上，手握木槳在划(row)船，正確。他是坐著，不是站著；船上只有他一個人，不是兩個人。選 C"},
{n:5,p:0,fig:ROWBOAT,o:["A man is rowing a wooden boat under a tree.","A wooden boat is sitting on the water under a tree.","A wooden boat is sitting on the ground under a tree."],a:2,sen:"For question five, look at the picture. Which is true about the picture?",szh:"第五題，請看圖片。關於這張圖，何者正確？",en:"A wooden boat is sitting on the ground under a tree.",zh:"一艘木頭小船(boat)停在大樹(tree)下的岸邊地上，用繩子綁著，正確。船在陸地上，不是在水面上；圖中沒有人，所以沒有人在划(row)船。選 C"},
{n:6,p:1,o:["Later today. I just have to paint it.","On my desk, next to the window.","It's a model of an old sailing ship."],a:0,sen:"When will you finish the model ship?",szh:"你的模型船(ship)什麼時候會完成？",en:"Later today. I just have to paint it.",zh:"問「什麼時候」完成模型船(ship)，答「今天(today)晚一點(later)，只剩上色(paint)」才是時間。「是一艘舊帆船的模型」說的是它是什麼；「在我書桌上、窗戶旁邊」答的是地點。選 A"},
{n:7,p:1,o:["I had chocolate for lunch yesterday.","Don't forget your homework tomorrow.","Do you want half of my salad?"],a:2,sen:"I forgot to bring my lunch today.",szh:"我今天(today)忘了(forget)帶午餐。",en:"Do you want half of my salad?",zh:"對方說忘了(forget)帶午餐，回「要不要分你一半我的沙拉(salad)？」是貼心的回應。「明天(tomorrow)別忘了作業」只是重複 forget，和午餐無關；「我昨天午餐吃巧克力(chocolate)」只是重複 lunch，沒有回應對方的問題。選 C"},
{n:8,p:1,o:["We sail every Sunday morning.","Mr. Wu. He was a ship captain for years.","Yes, he's very helpful."],a:1,sen:"Who is the leader of your sailing team?",szh:"你們帆船(sail)隊的隊長(leader)是誰？",en:"Mr. Wu. He was a ship captain for years.",zh:"問「誰」是隊長(leader)，答「吳先生，他當了很多年的船長(captain)」說出人物。「我們每週日早上去航行」答的是時間；用 Yes 回答 Who 問句不對，而且沒說是誰。選 B"},
{n:9,p:1,o:["My sister is slimmer than me.","Yes, I am. Thank you.","I jog along the river every morning."],a:2,sen:"How do you stay so slim?",szh:"你怎麼保持這麼苗條(slim)的？",en:"I jog along the river every morning.",zh:"問「怎麼」保持苗條(slim)，答「我每天早上沿著河邊慢跑(jog)」是方法。「是的，我是(am)，謝謝」用 Yes 回答 How 問句；「我姊姊比我更瘦」答非所問，問的是你自己的方法。選 C"},
{n:10,p:1,o:["The store is open until seven.","I'll ride my bicycle tomorrow.","That's a crime! Let's call the police."],a:2,sen:"Someone stole my bicycle outside the store.",szh:"有人在店外面(outside)偷了我的腳踏車。",en:"That's a crime! Let's call the police.",zh:"對方說腳踏車在店外(outside)被偷，回「那是犯罪(crime)！我們報警吧」最自然。「我明天會騎腳踏車」只是重複 bicycle；「店開到七(seven)點」只是重複 store，沒有回應被偷的事。選 C"},
{n:11,p:1,o:["It has a function that counts your steps.","It's a standard black watch.","I bought it in Hong Kong."],a:0,sen:"What can this new watch do?",szh:"這支新手錶能做什麼？",en:"It has a function that counts your steps.",zh:"問手錶「能做什麼」，答「它有計算步數的功能(function)」說出用途。「是一支標準(standard)的黑色手錶」說的是外觀；「我在香港(Hong Kong)買的」答的是地點。選 A"},
{n:12,p:1,o:["Don't worry. The people on the plane are very helpful.","Yes, the airport is nearly empty.","I'm flying to Tainan tomorrow."],a:0,sen:"I'm afraid of flying alone.",szh:"我很怕一個人(alone)搭飛機。",en:"Don't worry. The people on the plane are very helpful.",zh:"對方說害怕獨自(alone)搭飛機，回「別擔心，飛機(plane)上的人都很樂於幫忙(helpful)」是安慰，最自然。「我明天要飛台南(Tainan)」說的是自己；「是的，機場(airport)幾乎(nearly)沒人」先說 Yes 又答非所問。選 A"},
{n:13,p:1,o:["I helped him yesterday.","It means a kind of airplane.","Sure. Which word is it?"],a:2,sen:"Can you help me pronounce this word?",szh:"你可以幫我念(pronounce)這個字嗎？",en:"Sure. Which word is it?",zh:"請對方幫忙念(pronounce)一個字，回「好啊，是哪個字？」最自然。「它是一種飛機(airplane)的意思」講的是字義，不是發音，而且還不知道是哪個字；「我昨天幫過他」人物和時態都不對。選 C"},
{n:14,p:1,o:["I saw it hunting for food last night.","Put a trap with some corn by the door.","It ran across the kitchen floor."],a:1,sen:"What's the best way to catch the mouse in our kitchen?",szh:"抓我們廚房那隻老鼠最好的方法是什麼？",en:"Put a trap with some corn by the door.",zh:"問抓老鼠最好的「方法」，答「在門邊放一個裝玉米(corn)的捕鼠器(trap)」是方法。「我昨晚看到牠在找(hunt)食物」和「牠跑過(across)廚房地板」都只是描述老鼠，沒有說怎麼抓。選 B"},
{n:15,p:1,o:["Fantastic! The sea was calm the whole time.","I went with sixteen other people.","We'll leave at seven tomorrow."],a:0,sen:"How was your sailing trip last weekend?",szh:"你上週末的帆船(sail)之旅如何？",en:"Fantastic! The sea was calm the whole time.",zh:"問上週末的帆船之旅「如何」，答「太棒了(fantastic)！海面一直很平靜」是感想。「我們明天七(seven)點出發」時態不對，旅行已經結束；「我跟另外十六(sixteen)個人去」答的是跟誰去。選 A"},
{n:16,p:2,o:["Take out the trash.","Sweep the floor.","Paint the fence."],a:1,sen:"W: Tom, can you sweep the kitchen floor? &nbsp;M: Sure, but first I'll take out the trash. &nbsp;W: Your sister already did that. &nbsp;M: OK. I'll paint the fence after I sweep, then. &nbsp;Q: What will Tom do first?",szh:"女：Tom，你可以掃(sweep)廚房地板嗎？　男：好，不過我先把垃圾拿出去(out)。　女：你姊姊已經拿了。　男：好，那我掃完地再去油漆(paint)圍籬。　問：Tom 會先做什麼？",en:"Sweep the floor.",zh:"倒垃圾姊姊已經做了，Tom 不用做；他說掃完地再漆圍籬，所以先掃(sweep)地。油漆(paint)圍籬是之後才做的事。選 B"},
{n:17,p:2,o:["At three thirty.","At seven.","At four."],a:0,sen:"M: Our flight to Hong Kong leaves at seven. &nbsp;W: We need to be at the airport two hours before that. &nbsp;M: And it takes an hour to get there. &nbsp;W: Let's add thirty more minutes for traffic. &nbsp;Q: What time will they leave home?",szh:"男：我們飛香港(Hong Kong)的班機七(seven)點起飛。　女：我們得在起飛前兩(two)小時到機場(airport)。　男：而且到機場要一小時。　女：再多抓三十分鐘塞車時間吧。　問：他們幾點從家裡出發？",en:"At three thirty.",zh:"七點起飛，提前兩小時到機場是五點，車程一小時是四點，再多抓三十分鐘塞車，所以三點半出發。七點是起飛時間；四點還沒算塞車的時間。選 A"},
{n:18,p:2,o:["He teaches sailors.","He flies planes.","He works on a ship."],a:1,sen:"W: Is your uncle a sailor? &nbsp;M: He was, nearly twenty years ago. &nbsp;W: What does he do now? &nbsp;M: He's the captain of a big aircraft. He flies to Japan every week. &nbsp;Q: What does the man's uncle do now?",szh:"女：你叔叔是水手(sailor)嗎？　男：以前是，差不多(nearly)二十年前。　女：那他現在做什麼？　男：他是大型飛機(aircraft)的機長(captain)，每週飛日本。　問：男士的叔叔現在做什麼？",en:"He flies planes.",zh:"叔叔二十年前是水手(sailor)，現在是飛機(aircraft)的機長(captain)，也就是「開飛機」。在船(ship)上工作是以前的事；對話沒說他教水手。選 B"},
{n:19,p:2,o:["A hamburger and a salad.","A salad and corn soup.","A hamburger and French fries."],a:0,sen:"M: Let's get French fries with our hamburgers. &nbsp;W: I'm trying to eat healthy. I'll have a salad. &nbsp;M: OK. Fries for me and a salad for you. Corn soup, too? &nbsp;W: No, thanks. &nbsp;Q: What will the woman have?",szh:"男：我們的漢堡配薯條(French fries)吧。　女：我想吃健康一點，我要沙拉(salad)。　男：好，薯條給我、沙拉給你。也要玉米(corn)濃湯嗎？　女：不用，謝謝。　問：女士會吃什麼？",en:"A hamburger and a salad.",zh:"兩人都點漢堡，女士把薯條換成沙拉(salad)，玉米(corn)濃湯她說不用，所以是漢堡加沙拉。漢堡加薯條是男士的；沙拉加玉米濃湯，玉米湯她拒絕了。選 A"},
{n:20,p:2,o:["Red.","White.","Purple."],a:2,sen:"M: Our boat is white now. Should we paint it red? &nbsp;W: Your brother's boat is red. Let's try something different. &nbsp;M: How about purple? &nbsp;W: Fantastic. Let's buy the paint today. &nbsp;Q: What color will the boat be?",szh:"男：我們的船(boat)現在是白色的，要漆(paint)成紅色嗎？　女：你哥哥的船是紅色的，我們試點不一樣的。　男：紫色(purple)怎麼樣？　女：太棒了(fantastic)，今天(today)就去買油漆。　問：船會是什麼顏色？",en:"Purple.",zh:"白色是船現在的顏色，要重新漆；紅色被女士否定，因為和哥哥的船一樣；男士提紫色(purple)，女士說太棒了，所以會漆成紫色。選 C"},
{n:21,p:2,o:["He is helpful to everyone.","He is never late.","He leaves work early."],a:0,sen:"W: How was your first discussion with the new team leader? &nbsp;M: Long! He's always late, but he's really helpful. &nbsp;W: Helpful how? &nbsp;M: He stays after work to help anyone with problems. &nbsp;Q: What does the man think of the leader?",szh:"女：你和新隊長(leader)第一次討論(discussion)得怎樣？　男：好久！他總是遲到，但他真的很樂於幫忙(helpful)。　女：怎麼幫？　男：他下班後會留下來幫任何有問題的人。　問：男士覺得隊長怎麼樣？",en:"He is helpful to everyone.",zh:"男士說隊長雖然常遲到，但很樂於幫忙(helpful)，下班後還留下來幫任何人。「從不遲到」和「總是遲到」相反；他下班後還留下來，所以不是早退。選 A"},
{n:22,p:2,o:["The shop is closed today.","The car needs new oil.","The car is a year old."],a:1,sen:"W: My car is making a strange sound. &nbsp;M: When did you last change the oil? &nbsp;W: Nearly a year ago. &nbsp;M: That's it. Old oil has a bad effect on the engine. Take it to the shop today. &nbsp;Q: What does the man think the problem is?",szh:"女：我的車發出奇怪的聲音。　男：你上次換機油(oil)是什麼時候？　女：差不多(nearly)一年前。　男：就是這個。舊機油對引擎有不好的影響(effect)。今天(today)就送去保養廠。　問：男士認為問題出在哪裡？",en:"The car needs new oil.",zh:"機油(oil)一年沒換，男士說舊機油對引擎有壞影響(effect)，所以問題是車子需要換新機油。「一年」是指上次換油的時間，不是車齡；男士叫她今天送去店裡，沒說店休息。選 B"},
{n:23,p:2,o:["Six.","Eight.","Sixteen."],a:0,sen:"M: Wow, how many doughnuts did you buy? &nbsp;W: Sixteen. Eight chocolate and eight sugar. &nbsp;M: Can I have a chocolate one? &nbsp;W: Sure, but I already ate two of them on the way home. &nbsp;Q: How many chocolate doughnuts are left?",szh:"男：哇，你買了幾個甜甜圈(doughnut)？　女：十六(sixteen)個，巧克力(chocolate)和糖霜各八個。　男：我可以吃一個巧克力的嗎？　女：可以，不過回家路上我已經吃掉兩(two)個巧克力的了。　問：還剩幾個巧克力甜甜圈？",en:"Six.",zh:"巧克力(chocolate)的有八個，女士路上吃了兩個，剩六個。十六(sixteen)是全部的數量；八是原本巧克力口味的數量，還沒扣掉吃掉的。選 A"},
{n:24,p:2,o:["On a ship.","On an airplane.","At a bus station."],a:1,sen:"W: Sir, please put your bag under the seat in front of you. &nbsp;M: Sorry to bother you, but how long is the trip to Hong Kong? &nbsp;W: About two hours. The captain says we'll take off in a few minutes. &nbsp;Q: Where are the speakers?",szh:"女：先生，請把您的包包放在前方座位底下。　男：不好意思打擾(bother)一下，到香港(Hong Kong)要多久？　女：大約兩(two)小時。機長(captain)說我們再幾分鐘就要起飛了。　問：說話者在哪裡？",en:"On an airplane.",zh:"把包包放在前方座位底下、機長(captain)說幾分鐘後起飛(take off)，可知在飛機(airplane)上。船也有船長，但船不會「起飛」；公車站沒有機長，也不會起飛。選 B"},
{n:25,p:2,o:["She got help to get across the lake.","She rowed across the lake alone.","She turned back in the middle of the lake."],a:0,sen:"M: Did you row the boat across the lake alone? &nbsp;W: I tried, but my arms hurt in the middle of the lake. &nbsp;M: So you went back? &nbsp;W: No. A sailor in another boat pulled me the rest of the way. &nbsp;Q: What do we know about the woman?",szh:"男：你自己一個人(alone)划(row)船橫越(across)湖嗎？　女：我試了，但划到湖中間手臂就痛了。　男：所以你就回頭了？　女：沒有。另一艘船(boat)上的水手(sailor)把我拖完剩下的路。　問：關於女士我們知道什麼？",en:"She got help to get across the lake.",zh:"女士划到一半手痛，水手(sailor)用另一艘船把她拖過去，所以她是靠別人幫忙才過湖的。她不是獨自(alone)划完全程；她說「沒有」回頭，所以回頭是男士猜錯的。選 A"},
{n:26,p:3,pic:true,o:[BARS("Ship Tickets",["Spring","Summer","Fall"],[20,80,50]),BARS("Ship Tickets",["Spring","Summer","Fall"],[50,20,80]),BARS("Ship Tickets",["Spring","Summer","Fall"],[20,50,80])],a:2,sen:"Our town sells ship tickets to the islands. Summer is usually the busiest time of the year. But this year, a big storm stopped all the ships for two weeks in summer. Because of that, fall sold more tickets than summer. Spring was still the slowest. &nbsp;Q: Which chart shows the ship tickets this year?",szh:"我們鎮上賣去離島的船(ship)票。夏天通常是一年中最忙的時候。但今年一場大暴風雨讓所有船停駛兩(two)週，因此秋天賣的票比夏天多。春天仍是最冷清的。　問：哪張圖是今年的船票數量？",en:"Fall most, summer second, spring fewest.",zh:"今年秋天比夏天多，春天最少，所以秋天最高、夏天第二、春天最低。夏天最高的那張是「通常」的情形，今年因暴風雨不同；春天比夏天多的那張與「春天最冷清」相反。選 C"},
{n:27,p:3,pic:true,o:[BARS("Airport Travelers",["Japan","Korea","Thailand"],[20,80,50]),BARS("Airport Travelers",["Japan","Korea","Thailand"],[50,80,20]),BARS("Airport Travelers",["Japan","Korea","Thailand"],[80,50,20])],a:1,sen:"Our airport counted where its travelers flew last month. Most of the time, more people fly to Japan than anywhere else. But last month, plane tickets to Korea were on sale. Therefore, more people flew to Korea than to Japan. Thailand had fewer travelers than Japan, but it still had twice as many as the month before. &nbsp;Q: Which chart shows where the travelers flew last month?",szh:"我們機場(airport)統計了上個月旅客飛往哪裡。大部分時候飛日本的人最多。但上個月飛韓國的機票(plane ticket)在特價。因此(therefore)飛韓國的人比飛日本的多。泰國的旅客比日本少，但仍然是前一個月的兩倍。　問：哪張圖表顯示上個月旅客飛往哪裡？",en:"Korea most, Japan second, Thailand least.",zh:"上個月韓國機票(plane ticket)特價，因此(therefore)韓國比日本多；泰國比日本少，所以是韓國最高、日本第二、泰國最低的圖。日本最高的那張是「大部分時候」的情形；韓國最高但泰國比日本多的那張，和「泰國比日本少」相反（「兩倍」是和泰國自己前一個月比）。選 B"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:1,sen:"Yesterday, my little brother and I watched the boats by the sea. He wanted some ice cream, but the shop was closed. Mom wanted to buy him some corn, but he said no. So Dad got him a chocolate doughnut. He jumped for joy and licked the chocolate off the top first. &nbsp;Q: What did the little brother eat?",szh:"昨天我和弟弟在海邊看船(boat)。他想吃冰淇淋，但店關了。媽媽想買玉米(corn)給他，但他說不要。所以爸爸買了一個巧克力(chocolate)甜甜圈(doughnut)給他。他開心(joy)得跳起來，先把上面的巧克力舔(lick)掉。　問：弟弟吃了什麼？",en:"A chocolate doughnut.",zh:"冰淇淋因為店關了沒吃到；玉米(corn)是媽媽想買、但弟弟說不要；最後吃的是巧克力甜甜圈(doughnut)，他還先舔(lick)上面的巧克力。選 B"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:2,sen:"Last Sunday was a pleasant day, so my family went to the lake. My dad wanted to sail, but there was no wind at all. My sister wanted to row a boat, but all the boats were already out on the water. So we jogged around the lake and then had a picnic under a tree. &nbsp;Q: What did the family do at the lake?",szh:"上週日天氣宜人(pleasant)，我們家去湖邊。爸爸想駕帆船(sail)，但一點風都沒有。妹妹想划(row)船，但船都已經被租出去(out)了。所以我們繞湖慢跑(jog)，然後在樹(tree)下野餐。　問：這家人在湖邊做了什麼？",en:"They jogged around the lake.",zh:"駕帆船(sail)因為沒有風而沒做；划(row)船因為船都被租走也沒做；最後是繞湖慢跑(jog)。選 C"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30b'),PH('q30c')],a:1,sen:"Before my flight, a woman at the airport checked my bag. I had a loaf of bread, some instant noodles, and a big bottle of water. She said the food was fine, but I wasn't able to take the water on the plane. So I drank some of it and left the rest. &nbsp;Q: Which thing could the speaker NOT take on the plane?",szh:"搭機前，機場(airport)有位女士檢查我的包包。我帶了一條(loaf)麵包、一些泡麵(instant noodles)和一大瓶水。她說食物沒問題，但水不能(able)帶上飛機(plane)。所以我喝了一些，剩下的留下來。　問：說話者哪一樣東西「不能」帶上飛機？",en:"The big bottle of water.",zh:"題目問「不能」帶的：麵包(loaf)和泡麵(instant)都是食物，檢查人員說沒問題；只有一大瓶水不能帶上飛機。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 32 回　飛機與船　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
