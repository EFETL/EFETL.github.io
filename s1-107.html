<html lang="zh-TW">
<head>

  <title>107 學測第一大題練習（第 1–15 題）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      padding: 24px 16px 60px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #b91c1c;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 32px;
    }

    .progress-bar-wrap {
      max-width: 720px;
      margin: 0 auto 8px;
      background: #cbd5e0;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ef4444, #b91c1c);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .progress-text {
      text-align: center;
      font-size: 0.82rem;
      color: #718096;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 720px;
      margin: 0 auto 28px;
      padding: 28px 28px 24px;
      border-left: 5px solid #ef4444;
      transition: border-color 0.3s;
    }

    .card.correct { border-left-color: #22c55e; }
    .card.wrong   { border-left-color: #ef4444; }

    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .q-num {
      background: #ef4444;
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .q-text {
      font-size: 1rem;
      line-height: 1.75;
      color: #2d3748;
    }

    .q-text em {
      font-style: normal;
      color: #718096;
      font-size: 0.9rem;
    }

    .options {
      list-style: none;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      background: #f7fafc;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #2d3748;
      transition: background 0.18s, border-color 0.18s;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #fff1f2;
      border-color: #fca5a5;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.selected-correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
      font-weight: 600;
    }

    .option-btn.selected-wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .option-btn.reveal-correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    .option-tag { font-weight: 700; min-width: 22px; }
    .result-icon { display: inline-block; margin-left: 8px; font-size: 1.1rem; }

    .analysis-box {
      margin-top: 18px;
      background: #fff1f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 16px 18px;
      display: none;
    }

    .analysis-box.visible { display: block; }

    .analysis-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #b91c1c;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .analysis-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #7f1d1d;
    }

    .more-btn {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: #fee2e2;
      color: #b91c1c;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }

    .more-btn:hover { background: #fecaca; }

    .supplement-box {
      margin-top: 12px;
      background: #faf5ff;
      border: 1px solid #ddd6fe;
      border-radius: 10px;
      padding: 16px 18px;
      display: none;
    }

    .supplement-box.visible { display: block; }

    .supplement-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #7c3aed;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .vocab-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .vocab-list li {
      font-size: 0.88rem;
      line-height: 1.7;
      color: #3b2f6e;
      padding-left: 16px;
      position: relative;
    }

    .vocab-list li::before {
      content: "●";
      position: absolute;
      left: 0;
      color: #7c3aed;
      font-size: 0.65rem;
      top: 5px;
    }

    #summary {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      padding: 40px 32px;
    }

    #summary h2 { font-size: 1.6rem; color: #b91c1c; margin-bottom: 12px; }
    #summary .score-big { font-size: 3rem; font-weight: 800; color: #ef4444; margin-bottom: 8px; }
    #summary p { color: #4a5568; font-size: 1rem; margin-bottom: 24px; }

    .reset-btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .reset-btn:hover { opacity: 0.88; }

    @media (max-width: 600px) {
      .card { padding: 20px 16px 18px; }
    }
  </style>

<script>
const questions = [
  {
    id: 1,
    stem: `Mangoes are a _____ fruit here in Taiwan; most of them reach their peak of sweetness in July.`,
    stem_zh: `芒果在台灣是一種_____水果；大多數在七月達到最甜美的時刻。`,
    options: [
      { label: "A", text: "mature", hint: "（成熟的）" },
      { label: "B", text: "usual", hint: "（普通的；慣常的）" },
      { label: "C", text: "seasonal", hint: "（季節性的）✓" },
      { label: "D", text: "particular", hint: "（特別的；特定的）" }
    ],
    answer: "C",
    analysis: `【句型結構】主詞（Mangoes）+ 連綴動詞（are）+ 補語（a _____ fruit）。分號後的子句為補充說明，提及「七月達到最甜美」為關鍵語境線索。\n\n【關鍵線索】reach their peak of sweetness in July（七月達到最甜美）→ 暗示芒果是「季節性」作物，答案為 seasonal（C）。mature（成熟的）不符合搭配，usual（普通的）語意不符。`,
    vocab: [
      "seasonal (adj.) 季節性的；in season 當季的",
      "【近義詞】periodic（週期性的）、cyclical（循環的）",
      "【延伸搭配】seasonal fruit（當季水果）、seasonal worker（季節性工人）、out of season（非當季）"
    ]
  },
  {
    id: 2,
    stem: `Writing term papers and giving oral reports are typical course _____ for college students.`,
    stem_zh: `撰寫學期報告和口醭報告是大學生典型的課程_____。`,
    options: [
      { label: "A", text: "requirements", hint: "（要求；必要條件）✓" },
      { label: "B", text: "techniques", hint: "（技巧；技術）" },
      { label: "C", text: "situations", hint: "（情況；狀況）" },
      { label: "D", text: "principles", hint: "（原則；原理）" }
    ],
    answer: "A",
    analysis: `【句型結構】動名詞片語（Writing... and giving...）作主詞 + 連綴動詞（are）+ $��詞補語（typical course _____）。空格為名詞，受 course 和 typical 修飾。\n\n【關鍵線索】term papers 和 oral reports 是學生「被要求」完成的事項，選 requirements（必要條件/規定，A）。techniques 是技巧，不符語意。`,
    vocab: [
      "requirement (n.) 要求、規定；meet requirements 符合要求",
      "【近義詞】obligation（義務）、prerequisite（先決條件）",
      "【延伸搭配】course requirements（課程要求）、graduation requirements（畢業要求）"
    ]
  },
  {
    id: 3,
    stem: `If we work hard to _____ our dreams when we are young, we will not feel that we missed out on something when we get old.`,
    stem_zh: `如果我們在年輕時努力_____夢想，年老時就不會感到遺憾。`,
    options: [
      { label: "A", text: "distribute", hint: "（分發；分配）" },
      { label: "B", text: "fulfill", hint: "（實現；完成）✓" },
      { label: "C", text: "convince", hint: "（說服；使信服）" },
      { label: "D", text: "monitor", hint: "（監控；監測）" }
    ],
    answer: "B",
    analysis: `【句型結構】If 條件子句（If we work hard to _____ our dreams...）+ 主要子句（we will not feel...）。空格填入不定詞 to 後的動詞原形，受詞為 our dreams。\n\n【關鍵線索】missed out on something（錯過了什麼）暗示對比，努力追求後就不會遺憾，選 fulfill（實現，B）。fulfill one's dreams 是固定搭配。`,
    vocab: [
      "fulfill (v.) 實現、履行；fulfill a dream 實現夢想；fulfill a promise 履行承諾",
      "【近義詞】achieve（達成）、accomplish（完成）、realize（實現）",
      "【延伸搭配】fulfill one's potential（發揮潛力）、self-fulfillment（自我實現）"
    ]
  },
  {
    id: 4,
    stem: `Few people will trust you if you continue making _____ promises and never make efforts to keep them.`,
    stem_zh: `如果你繼續做出_____承諾卻從不努力實現，很少人會信任你。`,
    options: [
      { label: "A", text: "chilly", hint: "（寒冷的；冷淡的）" },
      { label: "B", text: "liberal", hint: "（自由的；慷慨的）" },
      { label: "C", text: "hollow", hint: "（空洞的；虛偽的）✓" },
      { label: "D", text: "definite", hint: "（確定的；明確的）" }
    ],
    answer: "C",
    analysis: `【句型結構】條件子句（if you continue making _____ promises）+ $��要子句（Few people will trust you）。空格為形容詞修飾 promises。\n\n【關鍵線索】never make efforts to keep them（從不努力去實現）→ 表示承諾毫無誠意，選 hollow（空洞的/虛偽的，C）。hollow promises 是固定搭配。`,
    vocab: [
      "hollow (adj.) 空洞的、不真誠的；(n.) 凹洞；hollow out 挖空",
      "【近義詞】empty（空的）、insincere（不真誠的）、meaningless（無意義的）",
      "【延伸搭配】hollow promise（空頭承諾）、hollow victory（慘勝）、feel hollow（感到空虛）"
    ]
  },
  {
    id: 5,
    stem: `Becky _____ her ankle while she was playing tennis last week. Now it still hurts badly.`,
    stem_zh: `貝姬上週打網球時_____了她的腳踝。現在仍然很痛。`,
    options: [
      { label: "A", text: "slipped", hint: "（滑倒；失足）" },
      { label: "B", text: "dumped", hint: "（傾倒；拋棄）" },
      { label: "C", text: "twisted", hint: "（扭傷；扭轉）✓" },
      { label: "D", text: "recovered", hint: "（恢復；康復）" }
    ],
    answer: "C",
    analysis: `【句型結構】主詞（Becky）+ 動詞過去式（填空）+ 受詞（her ankle）。時間副詞子句（while...）指明動作發生的時機。後句 Now it still hurts badly 是結果說明。\n\n【關鍵線索】ankle（腳踝）+ hurts badly（非常痛）→ 選「扭傷」的動詞 twisted（C）。twist one's ankle 是固定搭配。`,
    vocab: [
      "twist (v.) 扭傷、扭轉；twist one's ankle 扭傷腳踝",
      "【近義詞】sprain（扭傷，更正式）、wrench（猛扭）",
      "【延伸搭配】twisted ankle（扭傷的腳踝）、twist and turn（迂迴曲折）"
    ]
  },
  {
    id: 6,
    stem: `Research shows that men and women usually think differently. For example, they have quite different _____ about what marriage means in their life.`,
    stem_zh: `研究顯示男女思考方式通常不同。例如，他們對婚姻在生活中意義的_____截然不同。`,
    options: [
      { label: "A", text: "decisions", hint: "（決定；決策）" },
      { label: "B", text: "beliefs", hint: "（信念；看法）✓" },
      { label: "C", text: "styles", hint: "（風格；方式）" },
      { label: "D", text: "degrees", hint: "（程度；學位）" }
    ],
    answer: "B",
    analysis: `【句型結構】主要子句（they have quite different _____ about what marriage means in their life）。空格為名詞，與介詞 about 搭配，且受 quite different 修飾。\n\n【關鍵線索】about what marriage means（關於婚姻的意義）→ 需要表示「看法/信念」的名詞，選 beliefs（B）。have different beliefs about 是固定搭配。`,
    vocab: [
      "belief (n.) 信念、看法；believe (v.)；in one's belief 依某人看法",
      "【近義詞】opinion（意見）、view（觀點）、perspective（觀點）",
      "【延伸搭配】have a belief in（相信）、religious beliefs（宗教信仰）、common belief（普遍觀念）"
    ]
  },
  {
    id: 7,
    stem: `The new manager is very _____. For instance, the employees are given much shorter deadlines for the same tasks than before.`,
    stem_zh: `新經理非常_____。例如，員工完成相同任務的期限比以前短很多。`,
    options: [
      { label: "A", text: "persuasive", hint: "（有說服力的）" },
      { label: "B", text: "tolerable", hint: "（可忍受的；還算好的）" },
      { label: "C", text: "suspicious", hint: "（可疑的；猜疑的）" },
      { label: "D", text: "demanding", hint: "（要求嚴格的；苛求的）✓" }
    ],
    answer: "D",
    analysis: `【句型結構】主詞（The new manager）+ 連綴動詞（is）+ 補語（very _____）。For instance 引出的例子是判斷空格語意的關鍵。\n\n【關鍵線索】much shorter deadlines for the same tasks（相同任務的期限更短）→ 暗示新經理「要求高/苛求」，選 demanding（D）。`,
    vocab: [
      "demanding (adj.) 要求嚴格的、費心費力的；demand (v./n.)",
      "【近義詞】strict（嚴格的）、exacting（嚴格要求的）、rigorous（嚴謹的）",
      "【延伸搭配】a demanding job（費心的工作）、demanding standards（高要求的標準）"
    ]
  },
  {
    id: 8,
    stem: `While the couple were looking _____ for their missing children, the kids were actually having fun in the woods nearby.`,
    stem_zh: `當這對夫婦_____地尋找失蹤的孩子時，孩子們其實正在附近的樹林裡玩得很開心。`,
    options: [
      { label: "A", text: "anxiously", hint: "（焦慮地；擔心地）"��" },
      { label: "B", text: "precisely", hint: "（精確地；準確地）" },
      { label: "C", text: "evidently", hint: "（明顯地；顯然地）" },
      { label: "D", text: "distinctly", hint: "（清楚地；明顯地）" }
    ],
    answer: "A",
    analysis: `【句型結構】While 引導時間副詞子句（While the couple were looking _____ for their missing children）。空格為修飾 looking 的方式副詞。\n\n【關鍵線索】missing children（失蹤的孩子）→ 父母的心情必然是「焦慮的」，選 anxiously（A）。precisely、evidently、distinctly 語意均不符。`,
    vocab: [
      "anxiously (adv.) 焦慮地；anxious (adj.)；anxiety (n.)",
      "【近義詞】nervously（緊張地）、worriedly（擔憂地）、frantically（瘋狂地）",
      "【延伸搭配】wait anxiously（焦急等待）、anxiously look for（焦急尋找）"
    ]
  },
  {
    id: 9,
    stem: `After delivering a very powerful speech, the award winner was _____ by a group of fans asking for her signature.`,
    stem_zh: `發表了一場非常有力的演講後，得獎者被一群要求她簽名的粉絲_____。`,
    options: [
      { label: "A", text: "deposited", hint: "（存放；沉積）" },
      { label: "B", text: "reserved", hint: "（預訂；保留）" },
      { label: "C", text: "vanished", hint: "（消失；不見）" },
      { label: "D", text: "surrounded", hint: "（包圍；圍繞）✓" }
    ],
    answer: "D",
    analysis: `【句型結構】被動語態（was _____ by a group of fans）。空格填入被動語態的過去分詞，施事者（by a group of fans asking for her signature）提供語境。\n\n【關鍵線索】by a group of fans（被一群粉絲）asking for her signature（要求簽名）→ 粉絲「包圍」了得獎者，選 surrounded（D）。be surrounded by 是固定搭配。`,
    vocab: [
      "surround (v.) 包圍、環繞；surrounded by/with 被...圍繞",
      "【近義詞】encircle（環繞）、enclose（包圍）、besiege（圍攻）",
      "【延伸搭配】surrounded by fans（被粉絲包圍）、surround oneself with（讓自己被...環繞）"
    ]
  },
  {
    id: 10,
    stem: `The interviewees were trying very hard to _____ the interviewers that they were very capable and should be given the job.`,
    stem_zh: `應試者非常努力地試圖_____面試官，讓他們相信自己很有能力且應該得到這份工作。`,
    options: [
      { label: "A", text: "credit", hint: "（歸功於；相信）" },
      { label: "B", text: "impress", hint: "（給...留下深刻印象；使欽佩）✓" },
      { label: "C", text: "relieve", hint: "（減輕；解除）" },
      { label: "D", text: "acquire", hint: "（獲得；習得）" }

let answered = 0;
let score = 0;
const total = questions.length;

function selectAnswer(idx, chosen) {
  const q = questions[idx];
  const card = document.getElementById(`card-${idx}`);
  const btns = card.querySelectorAll('.option-btn');
  const analysisBox = document.getElementById(`analysis-${idx}`);
  const moreBtn = document.getElementById(`more-btn-${idx}`);

  btns.forEach(btn => { btn.disabled = true; });

  const isCorrect = chosen === q.answer;
  if (isCorrect) {
    score++;
    card.classList.add('correct');
  } else {
    card.classList.add('wrong');
  }

  btns.forEach(btn => {
    const label = btn.getAttribute('data-label');
    if (label === chosen) {
      btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
      const icon = btn.querySelector('.result-icon');
      if (icon) icon.textContent = isCorrect ? ' ✓' : ' ✗';
    }
    if (!isCorrect && label === q.answer) {
      btn.classList.add('reveal-correct');
    }
  });

  analysisBox.classList.add('visible');
  if (moreBtn) moreBtn.style.display = 'inline-flex';

  answered++;
  const pct = Math.round((answered / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `已作答 ${answered} / ${total} 題`;

  if (answered === total) {
    setTimeout(showSummary, 600);
  }
}

function toggleSupp(idx) {
  const box = document.getElementById(`supp-${idx}`);
  const btn = document.getElementById(`more-btn-${idx}`);
  const visible = box.classList.toggle('visible');
  btn.textContent = visible ? '▲ 收起補充' : '▼ 查看更多補充';
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${idx}`;

    const analysisLines = q.analysis.split('\n\n').map(s => `<p style="margin-bottom:8px">${s.replace(/\n/g,'<br>')}</p>`).join('');
    const vocabItems = q.vocab.map(v => `<li>${v}</li>`).join('');
    const optionsHTML = q.options.map(opt => `
      <button class="option-btn" data-label="${opt.label}" onclick="selectAnswer(${idx},'${opt.label}')">
        <span class="option-tag">${opt.label}</span>
        <span>${opt.text} <em>${opt.hint}</em></span>
        <span class="result-icon"></span>
      </button>`).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${q.id}</div>
        <div class="q-text">
          ${q.stem}<br>
          <em>${q.stem_zh}</em>
        </div>
      </div>
      <ul class="options">${optionsHTML}</ul>
      <div class="analysis-box" id="analysis-${idx}">
        <div class="analysis-label">📖 解析</div>
        <div class="analysis-text">${analysisLines}</div>
        <button class="more-btn" id="more-btn-${idx}" style="display:none" onclick="toggleSupp(${idx})">▼ 查看更多補充</button>
        <div class="supplement-box" id="supp-${idx}">
          <div class="supplement-label">📚 補充說明</div>
          <ul class="vocab-list">${vocabItems}</ul>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function showSummary() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressBar').parentElement.style.display = 'none';
  document.getElementById('progressText').style.display = 'none';
  const summary = document.getElementById('summary');
  summary.style.display = 'block';
  document.getElementById('scoreDisplay').textContent = `${score} / ${total}`;
  const pct = Math.round((score / total) * 100);
  let msg = '';
  if (pct === 100) msg = '完美！全部答對，實力超強！🏆';
  else if (pct >= 80) msg = '表現優異！再努力一點就完美了！💪';
  else if (pct >= 60) msg = '還不錯！繼續加油，多複習幾次！📖';
  else msg = '別灰心，再練習一次，你一定能進步！🌟';
  document.getElementById('scoreMsg').textContent = msg;
}

function resetQuiz() {
  answered = 0; score = 0;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = `已作答 0 / ${total} 題`;
  document.getElementById('progressBar').parentElement.style.display = '';
  document.getElementById('progressText').style.display = '';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz-container').style.display = '';
  buildQuiz();
}

buildQuiz();
</script>
