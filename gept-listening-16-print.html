<style>

 <b>🖨 第 16 回　朋友與相處　聽力測驗　列印版</b>

<script>
/* 圖形素材（第16回 朋友與相處） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/16/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const HANDSHAKE=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q1.jpg" alt="question 1 picture">`;
const INVITECARD=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q2.jpg" alt="question 2 picture">`;
const PHOTO=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q3.jpg" alt="question 3 picture">`;
const JUICE=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q4.jpg" alt="question 4 picture">`;
const SCARF=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:HANDSHAKE,o:["Two friends hop around on one foot.","Two friends ski down a snowy hill.","Two friends shake hands to show their friendship."],a:2,sen:"For question one, look at the picture. What are the two people doing?",szh:"第一題，請看圖片。兩個人在做什麼？",en:"Two friends shake hands.",zh:"兩位朋友(friend)握手(hand)展現友誼(friendship)，選 C。A 的單腳跳(hop)和 B 的滑雪(ski)都和照片不符。"},
{n:2,p:0,fig:INVITECARD,o:["An invitation card with pink balloons on it.","A photo of the new neighbor's family.","A long ruler for the new neighbor."],a:0,sen:"For question two, look at the picture. What is on the desk?",szh:"第二題，請看圖片。桌上是什麼？",en:"An invitation card with pink balloons on it.",zh:"選 A。桌上的信封裡有一張印著粉紅氣球的邀請卡(invitation card)。照片(photo)和尺(ruler)都看不到。"},
{n:3,p:0,fig:PHOTO,o:["A card from her partner and a fellow classmate.","A piece of cake that her partner made.","A photo of her partner and a fellow classmate."],a:2,sen:"For question three, look at the picture. What is she holding?",szh:"第三題，請看圖片。她拿著什麼？",en:"A photo of her partner and a fellow.",zh:"她拿著夥伴(partner)和同學(fellow)的照片(photo)，選 C。A 的卡片(card)和 B 的蛋糕(piece)都不是她手上的東西。"},
{n:4,p:0,fig:JUICE,o:["Cold milk for a thirsty friend.","Boiled water for a thirsty friend.","Cold juice for a thirsty friend."],a:2,sen:"For question four, look at the picture. What is in the glass?",szh:"第四題，請看圖片。杯子裡是什麼？",en:"Cold juice for a thirsty friend.",zh:"杯子裡是給口渴(thirsty)朋友(friend)的冰果汁(juice)，選 C。牛奶(milk)和煮沸(boil)的水都不對。"},
{n:5,p:0,fig:SCARF,o:["A warm hat that covers her ears.","A warm scarf that hangs down to her waist.","A warm coat with a fur hood."],a:1,sen:"For question five, look at the picture. What is she wearing?",szh:"第五題，請看圖片。她戴著什麼？",en:"A warm scarf that hangs down to her waist.",zh:"選 B。她脖子上圍著一條很長的厚圍巾(scarf),垂到腰部。她沒戴帽子(hat),外套(coat)也沒有毛帽兜(hood)。"},

{n:6,p:1,o:["It will be on Tuesday night.","Yes, I'd love to come, thanks.","We accepted a new student today."],a:1,sen:"Will you accept our party invitation?",szh:"你會接受我們的派對邀請嗎？",en:"Yes, I'd love to come.",zh:"問是否接受(accept)邀請(invitation)，答『好的，我很樂意去』，選 B。A 回答的是時間(Tuesday)，C 只是重複 accept 這個字卻答非所問。"},
{n:7,p:1,o:["I say hi and ask their names.","Since I was in third grade.","I made a friendship bracelet today."],a:0,sen:"How do you make friends with new people?",szh:"你怎麼和新朋友交朋友？",en:"I say hi and ask their names.",zh:"問怎麼交朋友，答『我先打招呼(hi)並問(ask)他們的名字』，選 A。A 回答時間、C 只重複 friend 的相關字(friendship)卻沒回答方法。"},
{n:8,p:1,o:["On Tuesday afternoon, I think.","It depends on what he did.","We should leave before it rains."],a:1,sen:"Should we forgive our friend or not?",szh:"我們該不該原諒朋友？",en:"It depends on what he did.",zh:"問該不該原諒，答『要看他做了什麼(depend)』，選 B。A 回答時間(Tuesday)，C 重複 should 卻答非所問。"},
{n:9,p:1,o:["Take any seat near the window.","At seven, right after dinner.","The host baked a big cake."],a:0,sen:"Where can I sit at the party?",szh:"派對上我可以坐哪？",en:"Take any seat near the window.",zh:"問可以坐哪，答『隨便找個靠窗的座位(seat)』，選 A。A 回答時間，C 講主人(host)烤蛋糕但沒回答問題。"},
{n:10,p:1,o:["Yes, it's just what I need.","It's about thirty centimeters long.","I need a piece of blue paper."],a:0,sen:"Is this long ruler useful for the project?",szh:"這把長尺對專題有用嗎？",en:"Yes, it's just what I need.",zh:"問尺(ruler)有沒有用(useful)，答『有，正是我需要的』，選 A。A 回答長度，C 提到一張(piece)紙但沒回答。"},
{n:11,p:1,o:["Somewhere warm, like Hawaii.","Last year's holiday was too short.","I like to visit my grandparents."],a:2,sen:"How do you like to spend your holidays?",szh:"你喜歡怎麼過假期？",en:"I visit my grandparents.",zh:"問怎麼過假期，答『我喜歡去拜訪(visit)祖父母』，選 C。A 回答地點(somewhere)，C 只談去年的假期卻沒回答。"},
{n:12,p:1,o:["She lives in the house next door.","She's terrific, and a good influence.","My best friend is also my neighbor."],a:1,sen:"What is your best friend like?",szh:"你最好的朋友是什麼樣的人？",en:"She's terrific and a good influence.",zh:"問最好的朋友是怎樣的人，答『她很棒(terrific)，對我有好的影響(influence)』，選 B。A 回答地點，C 談的是鄰居(neighbor)身分而非個性。"},
{n:13,p:1,o:["It's painful. I fell on the ground.","At the doctor's office, I think.","Hand me that blue pencil, please."],a:0,sen:"Why are you holding your hand like that?",szh:"你為什麼那樣扶著手？",en:"It's painful; I fell on the ground.",zh:"問為何扶著手(hand)，答『很痛(painful)，我跌在地上(ground)了』，選 A。A 回答地點，C 重複 hand 卻答非所問。"},
{n:14,p:1,o:["We went there by bus on Sunday.","We fed a goose and rode an ox.","The farm is very quiet at night."],a:1,sen:"What did you do on the farm with your friends?",szh:"你和朋友在農場做了什麼？",en:"We fed a goose and rode an ox.",zh:"問在農場做了什麼，答『我們餵鵝(goose)還騎牛(ox)』，選 B。A 回答交通方式，C 描述農場但沒說做了什麼。"},
{n:15,p:1,o:["He weighs about fifty pounds.","He's a quiet type, but very kind.","I behave better than he does."],a:1,sen:"How does your little cousin behave?",szh:"你的小表弟表現如何？",en:"A quiet type, but very kind.",zh:"問表弟表現(behave)如何，答『他是安靜(quiet)型(type)的，但很親切』，選 B。A 回答重量(pound)，C 只重複 behave 卻答非所問。"},

{n:16,p:2,o:["A big problem.","Ten new friends.","A strong friendship."],a:2,sen:"W: You and Tom have known each other for ten years. &nbsp;M: Yes, and he is always there when I am sad. &nbsp;W: You are lucky. &nbsp;Q: What do the man and Tom have?",szh:"女：你和湯姆認識十年了。　男：對，我難過時他總是在。　女：你真幸運。　問：男士和湯姆之間有什麼？",en:"A strong friendship.",zh:"認識十年、難過時總在身邊，表示有深厚的友誼(friendship)，選 C。B 的 ten 只是沿用對話裡的數字，但對話沒說有十個新朋友。"},
{n:17,p:2,o:["To make a gift for her mom.","To invite friends to her party.","To practice her handwriting."],a:1,sen:"M: Why are you writing so many cards? &nbsp;W: To invite my friends to my birthday party. &nbsp;M: Fun! &nbsp;Q: Why is the woman writing cards?",szh:"男：你為什麼寫這麼多卡片？　女：要邀請(invite)朋友來我的生日派對。　男：好玩！　問：女士為何寫卡片？",en:"To invite friends to her party.",zh:"她寫很多卡片(card)是為了邀請(invite)朋友來生日派對，選 B。A 的禮物(gift)和 C 的練字都沒被提到。"},
{n:18,p:2,o:["A neighbor who visits often.","A stranger from another town.","A teacher from my school."],a:0,sen:"W: Who is that friendly man next door? &nbsp;M: A kind neighbor who often visits us for tea. &nbsp;W: Lucky you. &nbsp;Q: Who is the man next door?",szh:"女：隔壁那位友善的男士是誰？　男：一位常來拜訪(visit)我們喝茶的好鄰居(neighbor)。　女：真幸運。　問：隔壁的男士是誰？",en:"A neighbor who visits often.",zh:"隔壁常來拜訪(visit)的是好鄰居(neighbor)，選 A。B 說陌生人(stranger)，但對話是熟人。"},
{n:19,p:2,o:["They ride small bikes.","They swim in the park.","They roller skate."],a:2,sen:"M: What do you do with your friends on weekends? &nbsp;W: We go to the park and put on special shoes with wheels. &nbsp;M: That sounds fun! &nbsp;Q: What do they do in the park?",szh:"男：你週末和朋友做什麼？　女：我們去公園，穿上有輪子的特別鞋子。　男：聽起來好玩！　問：他們在公園做什麼？",en:"They roller skate.",zh:"穿有輪子的鞋子，就是溜直排輪(roller skate)，選 C。A 的小腳踏車也有輪子，但對話說的是鞋子。"},
{n:20,p:2,o:["A ruler and a notebook.","A photo and a card.","A scarf and a hat."],a:1,sen:"W: What did your friend give you? &nbsp;M: A photo of us and a nice birthday card. &nbsp;W: Sweet gift. &nbsp;Q: What did the friend give?",szh:"女：你朋友送你什麼？　男：一張我們的合照(photo)和一張漂亮的生日卡(card)。　女：貼心的禮物。　問：朋友送了什麼？",en:"A photo and a card.",zh:"朋友送合照(photo)和卡片(card)，選 B。A 的尺(ruler)和 C 的圍巾(scarf)都沒被提到。"},
{n:21,p:2,o:["He needs some fresh air.","The library must be quiet.","He wants to find a seat."],a:1,sen:"M: Let me call Amy now. &nbsp;W: Tom, this is the library. &nbsp;M: Oh, sorry. I will go outside. &nbsp;Q: Why will the man go outside?",szh:"男：我現在打電話給艾咪。　女：湯姆，這裡是圖書館。　男：喔，抱歉，我去外面。　問：男士為什麼要去外面？",en:"The library must be quiet.",zh:"圖書館要保持安靜(quiet)，所以他得到外面講電話，選 B。C 的找位子(seat)對話沒提到。"},
{n:22,p:2,o:["He is sleepy.","He is angry.","He is thirsty."],a:2,sen:"W: What's the matter, Ben? Your face is red. &nbsp;M: I played soccer for two hours, and my mouth is so dry. &nbsp;W: Wait here. I will get some juice. &nbsp;Q: How does Ben feel?",szh:"女：班，怎麼了？你的臉好紅。　男：我踢了兩小時足球，嘴巴好乾。　女：在這等著，我去拿果汁。　問：班覺得怎樣？",en:"He is thirsty.",zh:"嘴巴很乾又要喝果汁，表示口渴(thirsty)，選 C。他臉紅是因為運動，不是生氣(angry)。"},
{n:23,p:2,o:["My cousin from Taipei.","My new neighbor.","My study partner."],a:2,sen:"M: Who is that girl you always sit with? &nbsp;W: My study partner; we talk about everything together. &nbsp;M: Good team. &nbsp;Q: Who is the girl?",szh:"男：那個總和你坐一起的女孩是誰？　女：我的讀書夥伴(partner)，我們無話不談(talk)。　男：好搭檔。　問：那個女孩是誰？",en:"My study partner.",zh:"是一起讀書、無話不談(talk)的夥伴(partner)，選 C。B 的新鄰居(neighbor)沒被提到。"},
{n:24,p:2,o:["Walk away quickly.","Smile and say hello.","Ask where he is from."],a:1,sen:"W: What should I do when a new stranger arrives? &nbsp;M: Smile and say hello to the stranger to be friendly. &nbsp;W: Good idea. &nbsp;Q: What should the woman do?",szh:"女：有新的陌生人來時我該怎麼做？　男：對陌生人(stranger)微笑並說哈囉(hello)，友善一點。　女：好主意。　問：女士該怎麼做？",en:"Smile and say hello.",zh:"對陌生人(stranger)微笑說哈囉(hello)，選 B。C 的問他從哪來對話沒建議。"},
{n:25,p:2,o:["On Tuesday.","On Monday.","On Wednesday."],a:0,sen:"M: When will you meet your old friend? &nbsp;W: Today is Sunday. We will see each other in two days. &nbsp;M: Have fun. &nbsp;Q: When will they meet?",szh:"男：你什麼時候和老朋友見面？　女：今天是星期日。我們兩天後見面(see)。　男：玩得開心。　問：他們何時見面？",en:"On Tuesday.",zh:"今天星期日，兩天後是星期二(Tuesday)，選 A。星期一是一天後、星期三是三天後。"},

{n:26,p:3,pic:true,o:[BARS("Ways to Meet",["School","Club","Online"],[20,50,80]),BARS("Ways to Meet",["School","Club","Online"],[50,80,20]),BARS("Ways to Meet",["School","Club","Online"],[80,50,20])],a:2,sen:"Our class asked how students made their best friends. Almost half made friends at school, sitting side by side every day. Clubs came second, and only a few met their friends online. So the school bar should be the tallest. &nbsp;Q: Which chart shows how they made friends?",szh:"我們班問學生怎麼交到最好的朋友(friend)。將近一半在學校認識，天天並肩而坐；社團第二；只有少數在網路上認識。所以學校長條最高。　問：哪張圖顯示交友方式？",en:"School most, online least.",zh:"學校最多、網路最少，符合『School 最高』，選 C。"},
{n:27,p:3,pic:true,o:[BARS("Party Guests",["Mon","Wed","Fri"],[80,55,30]),BARS("Party Guests",["Mon","Wed","Fri"],[30,55,80]),BARS("Party Guests",["Mon","Wed","Fri"],[55,80,30])],a:0,sen:"I sent invitations for three small parties. I had to consider the date for each one carefully. On Monday the most friends came, because everyone was free. On Wednesday the number was in the middle, and on Friday the fewest came, since many had other plans. So the guests went down each day. &nbsp;Q: Which chart shows the number of guests?",szh:"我為三場小派對發了邀請(invitation)，得仔細考慮(consider)每場的日期(date)。星期一來的朋友最多，因為大家都有空；星期三中等；星期五最少，因為很多人有別的計畫。所以人數逐日下降。　問：哪張圖顯示賓客人數？",en:"Monday most, Friday least.",zh:"週一最多、逐日下降，符合『Mon 最高、Fri 最低』，選 A。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:0,sen:"When my friends visit me after school, we are always hungry but have little time. We have no time to heat food, cook slow noodles, or steam rice before we do homework together. So I usually make some simple bread with jam, and we share it while we talk and laugh. &nbsp;Q: What do the friends eat together?",szh:"放學後朋友(friend)來拜訪(visit)我時，我們總是很餓但時間不多。一起寫功課前沒時間加熱(heat)食物、煮麵或蒸飯。所以我通常做簡單的麵包(bread)配果醬，大家邊聊(talk)邊笑地分享。　問：朋友們一起吃什麼？",en:"Bread with jam.",zh:"朋友一起吃麵包(bread)，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:2,sen:"My grand neighbor, who has a childlike smile, invited all the children for supper to celebrate our friendship. As a kind host, she did not serve plain bread or dry rice. Instead, she cooked a huge pot of warm noodles, and we all sat together, thirsty and happy, sharing juice. &nbsp;Q: What did the neighbor cook for the children?",szh:"我那位盛情(grand)、笑容像孩子般(childlike)的鄰居(neighbor)邀所有孩子來吃晚餐，慶祝我們的友誼(friendship)。身為親切的主人(host)，她沒端普通麵包或白飯，而是煮了一大鍋熱麵(noodles)，我們一起坐著，又渴(thirsty)又開心，分享果汁(juice)。　問：鄰居為孩子煮了什麼？",en:"A pot of warm noodles.",zh:"鄰居煮了熱麵(noodles)，選 C。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('beach'),IMG('park'),IMG('mountain')],a:0,sen:"Our group of friends planned a trip to support the growth of our friendship. One partner liked the mountain, and a fellow liked the park. But we all chose the beach, because we could play, take a group photo, and enjoy the sea together on a warm Tuesday, with the sun shining above. &nbsp;Q: Where did the friends go together?",szh:"我們這群朋友(friend)計畫一趟旅行來促進友誼(friendship)的成長(growth)。一位夥伴(partner)喜歡山，一位同伴(fellow)喜歡公園，但我們都選了海邊(beach)，因為可以一起玩、拍合照(photo)、在陽光照耀(shine)的溫暖星期二(Tuesday)享受大海。　問：朋友們一起去了哪裡？",en:"The beach.",zh:"朋友們去海邊(beach)，選 A。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 16 回　朋友與相處　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
