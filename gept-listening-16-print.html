<div class="bar">
 <b>🖨 第 16 回　朋友與相處　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第16回 朋友與相處） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/16/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/16/p3_${n}.jpg?v=r16std-20261030" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const HANDSHAKE=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q1.jpg" alt="question 1 picture">`;
const INVITECARD=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q2.jpg" alt="question 2 picture">`;
const PHOTO=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q3.jpg" alt="question 3 picture">`;
const JUICE=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q4.jpg" alt="question 4 picture">`;
const SCARF=`<img class="pic-img p0img" src="gept-listening-img/16/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:HANDSHAKE,o:["Two men are waving hello to each other.","Two men are shaking hands and smiling.","Two men are shaking hands, and both of them are wearing glasses."],a:1,sen:"For question one, look at the picture. Which is true about the picture?",szh:"第一題，請看圖片。關於這張圖，何者正確？",en:"Two men are shaking hands and smiling.",zh:"兩位男士面帶微笑在握手(hand)，正確。他們是握手，不是揮手打招呼(hello)；只有右邊穿格子襯衫的男士戴眼鏡，不是兩個人都戴。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">Gift Shop</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Scarf</td><td style="text-align:right;font-weight:700">$250</td></tr><tr><td style="padding:4px 30px 4px 0">Card</td><td style="text-align:right;font-weight:700">$50</td></tr><tr><td style="padding:4px 30px 4px 0">Juice</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Photo</td><td style="text-align:right;font-weight:700">$150</td></tr></table></div>`,o:["She will have three hundred dollars left.","She will have two hundred dollars left.","She will have two hundred fifty dollars left."],a:1,sen:"For question two, look at the picture. Amy has five hundred dollars. She buys a scarf and a card for her friend. How much will she have left?",szh:"第二題，請看圖片。艾咪有五百元。她買了一條圍巾(scarf)和一張卡片(card)送朋友(friend)。她還剩多少錢？",en:"She will have two hundred dollars left.",zh:"價目表上圍巾(scarf)250元、卡片(card)50元，一共300元，500減300剩200元。剩三百元是把花掉的錢當成剩下的錢；剩兩百五十元是只買了圍巾、忘了卡片。選 B"},
{n:3,p:0,fig:PHOTO,o:["She is taking a photo of a boy and a girl.","She is smiling at a photo of a boy and a girl.","She is looking sadly at a photo of a boy and a girl."],a:2,sen:"For question three, look at the picture. What is the girl doing?",szh:"第三題，請看圖片。這個女孩在做什麼？",en:"She is looking sadly at a photo of a boy and a girl.",zh:"女孩手拿一張男生和女生的合照(photo)，表情難過地看著它，正確。照片裡的人在笑，但她自己沒有笑；她是拿著照片在看，不是在拍照。選 C"},
{n:4,p:0,fig:JUICE,o:["He is drinking a glass of juice.","He is reaching for a glass of juice, and the glass is almost empty.","He is reaching for a glass of juice with ice in it."],a:2,sen:"For question four, look at the picture. What is the man doing?",szh:"第四題，請看圖片。這位男士在做什麼？",en:"He is reaching for a glass of juice with ice in it.",zh:"男士伸手要拿一杯加了冰塊的果汁(juice)，正確。他還沒拿到，所以不是在喝；杯子幾乎(almost)是滿的，不是快空了。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Party Cards</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="83" width="44" height="67" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="78" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="96" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="45" font-size="14" font-weight="700" text-anchor="middle">60</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="228" y="117" width="44" height="33" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="112" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Amy</text><text x="118" y="167" text-anchor="middle">Ben</text><text x="184" y="167" text-anchor="middle">Lily</text><text x="250" y="167" text-anchor="middle">Carl</text></g></svg>`,o:["They wrote ninety.","They wrote seventy.","They wrote sixty."],a:0,sen:"For question five, look at the picture. Ben and Lily wrote invitation cards for the party. How many did they write in all?",szh:"第五題，請看圖片。班(Ben)和莉莉(Lily)為派對寫了邀請(invitation)卡。他們一共寫了幾張？",en:"They wrote ninety.",zh:"圖中班寫了60張、莉莉寫了30張，加起來90張。70是把艾咪(40)和莉莉(30)加在一起，看錯了人；60只算了班一個人，忘了加莉莉。選 A"},
{n:6,p:1,o:["I'll invite you to my party, too.","That's OK. Maybe next time.","Great! See you on Tuesday, then."],a:1,sen:"Thanks for the invitation, but I'm busy on Tuesday.",szh:"謝謝你的邀請，但我星期二很忙。",en:"That's OK. Maybe next time.",zh:"對方婉拒邀請(invitation)，說星期二(Tuesday)沒空，回「沒關係，下次吧」最自然。「太好了，那星期二見(see)」好像對方答應了，與原意相反；「我也會邀請(invite)你來我的派對」把邀請人弄反了。選 B"},
{n:7,p:1,o:["We were partners in science class.","Since we were ten years old.","She's a terrific friend."],a:0,sen:"How did you and Amy become friends?",szh:"你和 Amy 是怎麼成為朋友的？",en:"We were partners in science class.",zh:"問「怎麼」成為朋友(friend)，答「我們是自然課的搭檔(partner)」說明了認識的方式。「從十歲開始」答的是時間；「她是很棒(terrific)的朋友」答的是她人怎麼樣。選 A"},
{n:8,p:1,o:["It's my favorite type of music.","Yes, you should. It's almost midnight.","He'll visit us this weekend."],a:1,sen:"Should I ask my neighbor to turn down his music?",szh:"我應該請鄰居把音樂關小聲嗎？",en:"Yes, you should. It's almost midnight.",zh:"問應不應該(should)請(ask)鄰居(neighbor)把音樂關小，答「應該，都快(almost)半夜了」給了建議和理由。「那是我最愛的音樂類型(type)」只是說自己的喜好；「他這週末會來拜訪(visit)」與音樂吵不吵無關。選 B"},
{n:9,p:1,o:["Maybe he just wants people to play with him.","I'll behave better next time.","Yes, our visitors will come on Sunday."],a:0,sen:"My little brother never behaves well when we have visitors.",szh:"我們家有客人時，我弟弟總是不乖。",en:"Maybe he just wants people to play with him.",zh:"對方抱怨弟弟有客人(visitor)時不守規矩(behave)，回「也許他只是想要有人陪他玩」是在幫忙找原因，最自然。「是的，客人星期天會來」只重複 visitor；「我下次會乖一點」人物錯了，不乖的是對方的弟弟。選 A"},
{n:10,p:1,o:["Yes, the seats here are very soft.","No, it's free. Go ahead.","I'll sit somewhere near the window."],a:1,sen:"Excuse me, is anyone sitting here?",szh:"不好意思，這裡有人坐嗎？",en:"No, it's free. Go ahead.",zh:"問這個位子有沒有人坐，答「沒有，空的，請坐」最自然。「是的，這裡的座位(seat)很軟」用 Yes 卻在講座位舒不舒服，答非所問；「我要坐在窗邊某處(somewhere)」講的是自己要坐哪，沒有回答。選 B"},
{n:11,p:1,o:["Yes, the library is very quiet.","It doesn't matter to me.","Nothing. I'm just a little sleepy."],a:2,sen:"What's the matter? You're so quiet today.",szh:"怎麼了？你今天好安靜。",en:"Nothing. I'm just a little sleepy.",zh:"問「怎麼了(matter)，你今天好安靜(quiet)」，答「沒事，只是有點睏」最自然。「對我來說無所謂」只是重複 matter，意思不同；「是啊，圖書館很安靜」只重複 quiet，答非所問。選 C"},
{n:12,p:1,o:["It's a very useful ruler.","Sorry, Ben has it right now. Ask him.","Sure, I'd love to borrow yours."],a:1,sen:"Can I borrow your ruler for a minute?",szh:"我可以借你的尺一下嗎？",en:"Sorry, Ben has it right now. Ask him.",zh:"對方想借尺(ruler)，答「抱歉，Ben 正在用，你去問(ask)他」是委婉說明現在借不到，最自然。「好啊，我很想借你的」把借的人弄反了；「這是一把很有用(useful)的尺」沒回答能不能借。選 B"},
{n:13,p:1,o:["Give me a hand, please.","The ground is wet after the rain.","You should see a doctor."],a:2,sen:"I fell on the ground, and my hand is still painful.",szh:"我跌倒在地上，手還是很痛。",en:"You should see a doctor.",zh:"對方跌倒後手(hand)還很痛(painful)，建議「你應該(should)去看醫生」最自然。「請幫我一下」的 give me a hand 是「幫忙」，只是重複 hand；「下過雨地(ground)很濕」只重複 ground，沒有回應對方的傷。選 C"},
{n:14,p:1,o:["Lisa, a fellow student in my class.","About thirty people, I think.","In the room above the restaurant."],a:0,sen:"Who's hosting tonight's party?",szh:"誰主辦今晚的派對？",en:"Lisa, a fellow student in my class.",zh:"問「誰」主辦(host)派對，答「Lisa，我班上的同學(fellow)」才是人物。「在餐廳樓上(above)的房間」答的是地點；「大概三十個人」答的是人數。選 A"},
{n:15,p:1,o:["Not yet. I'm still considering it.","I skied for two hours yesterday.","Sure, you can come with us."],a:0,sen:"Did you accept Tom's invitation to the ski trip?",szh:"你接受 Tom 滑雪旅行的邀請了嗎？",en:"Not yet. I'm still considering it.",zh:"問有沒有接受(accept)邀請(invitation)，答「還沒，我還在考慮(consider)」最自然。「我昨天滑雪(ski)兩小時」只重複 ski；「當然，你可以跟我們一起去」好像自己是邀請人，人物顛倒。選 A"},
{n:16,p:2,o:["On Wednesday.","On Thursday.","On Tuesday."],a:1,sen:"M: Let's choose a date to visit Grandma. How about Tuesday? &nbsp;W: I have a piano lesson on Tuesday. What about Wednesday? &nbsp;M: Grandma goes to the market every Wednesday. Let's make it Thursday. &nbsp;W: OK, Thursday is fine. &nbsp;Q: When will they visit Grandma?",szh:"男：我們選個日子(date)去看(visit)奶奶吧。星期二(Tuesday)怎麼樣？　女：我星期二有鋼琴課，星期三呢？　男：奶奶每個星期三都去市場，那就星期四吧。　女：好，星期四可以。　問：他們什麼時候去看奶奶？",en:"On Thursday.",zh:"星期二女士有鋼琴課，星期三奶奶要去市場，兩天都不行，最後定在星期四。星期二和星期三都是被否定的日子(date)。選 B"},
{n:17,p:2,o:["She wears it only when it is cold.","She thinks it is too long.","She likes it very much."],a:2,sen:"M: Hi, Jenny! Is that a new scarf? &nbsp;W: Yes, my best friend made it for my birthday. It hangs down to my waist. &nbsp;M: It's really long. Isn't it too hot for a scarf today? &nbsp;W: Not for me. I've worn it every day since Monday. &nbsp;M: Even in this weather? &nbsp;W: Yes. I never want to take it off. &nbsp;Q: How does the woman feel about her scarf?",szh:"男：嗨(hi)，Jenny！那是新圍巾(scarf)嗎？　女：對，我最好的朋友(friend)做來當我的生日禮物。它垂到我的腰(waist)。　男：真的好長。今天穿圍巾不會太熱嗎？　女：我不會。我從星期一起每天都戴。　男：這種天氣也戴？　女：對。我一點都不想拿下來。　問：女士覺得她的圍巾怎麼樣？",en:"She likes it very much.",zh:"女士天氣熱還每天戴，而且一點都不想拿下來，可見她很喜歡這條朋友(friend)送的圍巾。她連大熱天都戴，所以不是只有冷的時候才戴；長度是男士說的，她並沒有抱怨太長。選 C"},
{n:18,p:2,o:["Being nice to someone new.","Fixing a fence between houses.","Selling fruit to a stranger."],a:0,sen:"W: Did you see the new man next door? He's a stranger to everyone here. &nbsp;M: I talked to him over the fence yesterday. He just moved in, and he doesn't know anyone. &nbsp;W: Then let's bring him some fruit and say hello. &nbsp;M: Good idea. Maybe we can invite him for dinner, too. &nbsp;W: Yes. It matters a lot when you are new. &nbsp;Q: What are the speakers talking about?",szh:"女：你有看到隔壁的新男人嗎？這裡的人他都不認識(stranger)。　男：我昨天隔著圍籬跟他說話(talk)。他剛搬來，一個人都不認識。　女：那我們帶些水果給他，跟他打聲招呼(hello)吧。　男：好主意。也許我們也可以邀請(invite)他來吃晚餐。　女：對。人剛到新地方，這很重要(matter)。　問：說話的人在談什麼？",en:"Being nice to someone new.",zh:"兩人在討論要怎麼對剛搬來的鄰居好：帶水果、邀他吃晚餐，所以是在談「對新來的人友善」。圍籬只是男士跟他聊天的地方，沒有人要修；水果是要送的，不是要賣給陌生人(stranger)。選 A"},
{n:19,p:2,o:["She visited a farm.","She went roller skating.","She went to the park."],a:0,sen:"M: What did you and Kate do on Saturday? Did you roller skate in the park? &nbsp;W: We planned to, but the park was closed. So we went to a farm. &nbsp;M: A farm? &nbsp;W: Yes! We fed a goose and even rode on an ox. &nbsp;Q: What did the woman do on Saturday?",szh:"男：你和 Kate 星期六做了什麼？去公園溜直排輪(roller skate)嗎？　女：本來要去，但公園關了，所以我們改去農場。　男：農場？　女：對！我們餵了一隻鵝(goose)，還騎了牛(ox)。　問：女士星期六做了什麼？",en:"She visited a farm.",zh:"原本計畫去公園溜直排輪(roller skate)，但公園關了，改去農場(visit a farm)餵鵝、騎牛。溜直排輪和去公園都是取消的計畫。選 A"},
{n:20,p:2,o:["He hurt his foot.","He likes to play like a child.","He is teaching a dance class."],a:1,sen:"M: Why is your grandfather hopping on one foot? &nbsp;W: He's playing a game with my little sister. &nbsp;M: At his age? &nbsp;W: Yes. He's seventy, but he has a childlike heart. &nbsp;Q: What do we know about the grandfather?",szh:"男：你爺爺為什麼用單腳跳(hop)？　女：他在跟我妹妹玩遊戲。　男：他這個年紀還玩？　女：對啊，他七十歲了，但有一顆孩子般(childlike)的心。　問：關於爺爺我們知道什麼？",en:"He likes to play like a child.",zh:"爺爺單腳跳(hop)是在陪孫女玩遊戲，女士說他有顆孩子般(childlike)的心，也就是「喜歡像小孩一樣玩」。他單腳跳是在玩，不是腳受傷；對話沒提到教跳舞。選 B"},
{n:21,p:2,o:["Some juice.","Some hot tea.","Some watermelon."],a:2,sen:"W: I'm so thirsty. Is there any juice? &nbsp;M: Sorry, we drank it all. I can boil some water for tea. &nbsp;W: Hot tea in this heat? No, thanks. I'll just have a piece of watermelon. &nbsp;Q: What will the woman have?",szh:"女：我好渴(thirsty)。有果汁(juice)嗎？　男：抱歉，喝完了。我可以燒(boil)水泡茶。　女：這麼熱(heat)喝熱茶？不用了，謝謝。我吃一片(piece)西瓜就好。　問：女士會吃喝什麼？",en:"Some watermelon.",zh:"果汁(juice)已經喝完了；男士提議燒(boil)水泡茶，但女士說天氣這麼熱(heat)不要熱茶；最後她選擇吃一片(piece)西瓜。選 C"},
{n:22,p:2,o:["Twenty pounds.","Five pounds.","Fifteen pounds."],a:2,sen:"M: Your puppy is so big now! How heavy is he? &nbsp;W: Twenty pounds. When we got him, he was only five pounds. &nbsp;M: Wow, that's a lot of growth in one year. &nbsp;Q: How much heavier is the puppy now?",szh:"男：你的小狗長好大了！牠多重？　女：二十磅(pound)。我們剛養牠的時候才五磅。　男：哇，一年長(growth)了好多。　問：小狗現在重了多少？",en:"Fifteen pounds.",zh:"現在二十磅(pound)，以前五磅，所以重了十五磅。五磅是剛養時的體重；二十磅是現在的體重，都不是「重了多少」。選 C"},
{n:23,p:2,o:["He learns from his friend.","He wants a new friend.","His teacher talked to him last year."],a:0,sen:"W: Your son is so polite these days. &nbsp;M: Thanks. His new friend Ben is a good influence. Ben always says please and thank you. &nbsp;W: Last year, your son didn't behave very well. &nbsp;M: I know. Now he does everything Ben does. &nbsp;Q: Why is the son more polite now?",szh:"女：你兒子最近好有禮貌。　男：謝謝。他的新朋友 Ben 對他有好的影響(influence)，Ben 總是說請和謝謝。　女：去年你兒子不太守規矩(behave)。　男：我知道。現在 Ben 做什麼，他就跟著做。　問：兒子現在為什麼比較有禮貌？",en:"He learns from his friend.",zh:"爸爸說新朋友 Ben 是好的影響(influence)，兒子什麼都跟著 Ben 做，換句話說就是「向朋友學習」。對話沒提到老師找他談；他已經交到新朋友 Ben 了，不是想要新朋友。選 A"},
{n:24,p:2,o:["At a bakery.","At a birthday party.","At a card shop."],a:2,sen:"W: I need an invitation card for my party. Can I ask for your help? &nbsp;M: Sure. How about this one? It has a cake on it. &nbsp;W: Too childish. I like the one with flowers. &nbsp;M: Good. How many do you need? &nbsp;W: About twelve. I'm hosting the party at my house on Saturday. &nbsp;M: OK. Let me put twelve in a bag for you. &nbsp;Q: Where are the speakers?",szh:"女：我需要派對的邀請(invitation)卡(card)。可以請(ask)你幫忙嗎？　男：當然。這張怎麼樣？上面有蛋糕。　女：太孩子氣了。我喜歡有花的那張。　男：好。你需要幾張？　女：大約十二張。星期六我要在我家主辦(host)派對。　男：好的。我幫你把十二張裝進袋子。　問：說話的人在哪裡？",en:"At a card shop.",zh:"女士要買邀請卡(card)，店員幫她挑、問她要幾張、還幫她裝袋，所以兩人在賣卡片的店裡。卡片上雖然有蛋糕，但這裡不是麵包店；派對是星期六在她家辦，現在還沒開始。選 C"},
{n:25,p:2,o:["Eleven.","Nine.","Twelve."],a:0,sen:"W: How many friends did you invite to your party? &nbsp;M: Twelve. But three of them can't come. &nbsp;W: Too bad. &nbsp;M: It's OK. Two of my friends are bringing their sisters. &nbsp;Q: How many people will come to the party?",szh:"女：你邀請(invite)了幾位朋友(friend)來派對？　男：十二位，但有三位不能來。　女：真可惜。　男：沒關係，有兩位朋友會帶她們的姊妹來。　問：會有多少人來派對？",en:"Eleven.",zh:"邀請十二人，三人不能來剩九人，再加上兩位朋友帶來的姊妹，共十一人。十二是邀請的人數；九是忘了加上帶來的兩個人。選 A"},
{n:26,p:3,pic:true,o:[BARS("Birthday Gifts",["Cards","Snacks","Toys"],[40,70,20]),BARS("Birthday Gifts",["Cards","Snacks","Toys"],[20,40,70]),BARS("Birthday Gifts",["Cards","Snacks","Toys"],[70,40,20])],a:2,sen:"Our class asked, \"What do you usually give a friend for a birthday?\" Last year, most students gave snacks. This year, more students chose cards than snacks, because they said a card shows real friendship. Toys were the least popular gift, but a few more students chose them than last year. &nbsp;Q: Which chart shows this year's answers?",szh:"我們班問大家：「朋友生日你通常送什麼？」去年最多學生送零食。今年選卡片(card)的學生比選零食的多，因為他們說卡片能表現真正的友誼(friendship)。玩具是最不受歡迎的禮物，不過選的人比去年多了一些。　問：哪張圖是今年的答案？",en:"Cards most, snacks second, toys fewest.",zh:"今年卡片比零食多，玩具最少，所以卡片最高、零食第二、玩具最低。零食最高的那張是去年的情形；玩具最高的那張與「玩具最不受歡迎」相反，「比去年多一些」只是陷阱。選 C"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"Ken and I are good friends, and we meet every Saturday. What we do depends on the weather. If the sun shines, we play soccer in the park, but it rained all morning. Then we planned to play video games at my home, but my little sister was sleeping. So Ken invited me to see a movie, and I accepted. &nbsp;Q: What did the two friends do on Saturday?",szh:"肯和我是好朋友(friend)，我們每個星期六都見面。我們做什麼要看(depend)天氣。太陽出來(shine)的話我們就在公園踢足球，但整個早上都在下雨。接著我們打算在我家玩電動，但我的小妹在睡覺。所以肯邀請(invite)我去看(see)電影，我接受(accept)了。　問：這兩個朋友星期六做了什麼？",en:"They saw a movie.",zh:"踢足球因為下雨沒踢成，在家玩電動因為妹妹在睡覺也沒玩，這兩個計畫都取消了；最後肯邀請(invite)他去看電影，他接受(accept)了，所以星期六是去看電影。 選 B"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28c'),PH('q28b')],a:2,sen:"When a new family moved in next door, my family visited them to say hello. We brought a basket of fruit from our garden. My sister wanted to bring a cake, too, but Mom said our new neighbors might not eat sweet food. So my sister made them a big card with flowers on it. &nbsp;Q: What did the family NOT bring to the new neighbors?",szh:"隔壁搬來一家新住戶時，我們全家去拜訪(visit)他們打招呼(hello)。我們帶了一籃自家花園的水果。妹妹也想帶蛋糕，但媽媽說新鄰居(neighbor)可能不吃甜食，所以妹妹給他們做了一張畫著花的大卡片(card)。　問：這家人「沒有」帶什麼給新鄰居？",en:"A cake.",zh:"題目問「沒有」帶的東西。一籃水果有帶；妹妹想帶蛋糕，但被媽媽否決，所以沒帶；妹妹改做了一張大卡片(card)，也有帶。選 C"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29a'),PH('q29b')],a:0,sen:"Today I'm meeting my online friend Lisa for the first time. In the photo she sent me last year, she has short hair and glasses. But she told me her hair is long now. She still wears glasses, and today she'll wear a yellow scarf so I can find her easily. &nbsp;Q: Which one is Lisa today?",szh:"今天我要第一次見到網友 Lisa。在她去年寄給我的照片(photo)裡，她是短髮、戴眼鏡。但她說她現在留長髮了。她還是戴眼鏡，而且今天會圍一條黃色圍巾(scarf)，讓我容易找到她。　問：今天的 Lisa 是哪一位？",en:"A girl with long hair, glasses, and a yellow scarf.",zh:"Lisa 今天是長髮、還戴著眼鏡、圍黃色圍巾(scarf)。短髮戴眼鏡是去年照片(photo)裡的樣子；長髮、黃圍巾但沒戴眼鏡的不對，因為她說自己「還是戴眼鏡」。選 A"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:1,sen:"My friend Leo is great at sports, and he likes to teach me. These days, he is teaching me to roller skate in the park. It's going well, and I only fell on the ground once. Next winter, he wants to teach me to ski. He also asked me to swim in the pool at his family's grand old house, but I'm afraid of water. &nbsp;Q: What is Leo teaching the speaker now?",szh:"我的朋友 Leo 很會運動，也喜歡教我。最近他在公園教我溜直排輪(roller skate)，進展不錯，我只跌倒在地上(ground)一次。明年冬天他想教我滑雪(ski)。他也邀我去他家那棟氣派(grand)老房子的泳池游泳，但我怕水。　問：Leo 現在在教說話者什麼？",en:"To roller skate.",zh:"「最近」在教的是溜直排輪(roller skate)。滑雪(ski)是明年冬天的計畫；游泳是 Leo 邀請過，但說話者怕水沒去。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 16 回　朋友與相處　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
