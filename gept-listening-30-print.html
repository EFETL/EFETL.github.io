<div class="bar">
 <b>🖨 第 30 回　工作與職業　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第30回 工作與職業） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/30/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/30/p3_${n}.jpg?v=r30qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const OFFICE=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q1.jpg" alt="question 1 picture">`;
const DOCUMENT=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q2.jpg" alt="question 2 picture">`;
const DESK=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q3.jpg" alt="question 3 picture">`;
const WORKER=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q4.jpg" alt="question 4 picture">`;
const CHART=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:OFFICE,o:["The man is standing and pointing at the computer, and the woman is sitting.","The woman is standing and pointing at the computer, and the man is sitting.","The man is standing and talking on the phone."],a:0,sen:"For question one, look at the picture. What is happening in the office?",szh:"第一題，請看圖片。辦公室(office)裡正在發生什麼事？",en:"The man is standing and pointing at the computer, and the woman is sitting.",zh:"穿深色西裝的男士站在旁邊、用手指著電腦螢幕，戴眼鏡的女士坐著打字，正確。站著指螢幕的是男士，不是女士，人物顛倒；男士沒有在講電話。選 A"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">OFFICE SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Desk</td><td style="text-align:right;font-weight:700">$600</td></tr><tr><td style="padding:4px 30px 4px 0">Chair</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Lamp</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Folder</td><td style="text-align:right;font-weight:700">$100</td></tr></table></div>`,o:["She will have three hundred dollars left.","She will have two hundred dollars left.","She will have one hundred dollars left."],a:2,sen:"For question two, look at the picture. The clerk has nine hundred dollars. She buys a desk and a lamp for the office. How much will she have left?",szh:"第二題，請看圖片。店員(clerk)有九百元。她為辦公室(office)買了一張書桌和一盞檯燈。她還剩多少錢？",en:"She will have one hundred dollars left.",zh:"價目表上書桌600元、檯燈200元，一共800元，900減800剩100元。剩三百元是只買了書桌、忘了檯燈的算法；剩兩百元是把檯燈的價錢當成剩下的錢。選 C"},
{n:3,p:0,fig:DESK,o:["She is talking on the phone and writing on some papers.","She is talking on the phone and typing at the same time.","She is typing, and the phone is on the desk."],a:1,sen:"For question three, look at the picture. What is the woman doing?",szh:"第三題，請看圖片。這位女士在做什麼？",en:"She is talking on the phone and typing at the same time.",zh:"女士把電話夾在耳邊講話，同時用手在鍵盤上打字，正確。她的手在鍵盤上，不是在紙上寫字；電話在她耳邊，不是放在桌上。選 B"},
{n:4,p:0,fig:WORKER,o:["A worker in a yellow hat is standing with his hands on his hips.","A worker in a yellow hat is climbing the building.","A worker in a white hat is standing with his hands on his hips."],a:0,sen:"For question four, look at the picture. What can you see in the picture?",szh:"第四題，請看圖片。圖中可以看到什麼？",en:"A worker in a yellow hat is standing with his hands on his hips.",zh:"一位戴黃色安全帽的工人(worker)雙手插腰站在工地前，正確。帽子是黃色，不是白色；他站在地上，沒有在爬大樓。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Our Workers</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">60</text><rect x="96" y="117" width="44" height="33" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="112" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="162" y="83" width="44" height="67" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="78" font-size="14" font-weight="700" text-anchor="middle">40</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Sales</text><text x="118" y="167" text-anchor="middle">Office</text><text x="184" y="167" text-anchor="middle">Factory</text></g></svg>`,o:["There are sixty.","There are twenty.","There are forty."],a:0,sen:"For question five, look at the picture. How many workers are in the office and the factory altogether?",szh:"第五題，請看圖片。辦公室(office)和工廠一共有多少員工(worker)？",en:"There are sixty.",zh:"圖中辦公室(office)20人、工廠40人，加起來60人。20人只算了辦公室、40人只算了工廠，都漏掉了另一項。選 A"},
{n:6,p:1,o:["It's on the top floor.","There are twenty chairs in it.","The sales department has it until three."],a:2,sen:"Is anyone using the meeting room this afternoon?",szh:"今天下午有人(anyone)要用會議室嗎？",en:"The sales department has it until three.",zh:"問下午有沒有人用會議(meeting)室，答「業務部(department)用到三點」，間接表示有人用。「在頂(top)樓」答的是位置；「裡面有二十(twenty)張椅子」答的是大小。選 C"},
{n:7,p:1,o:["Give him time. It's only his first week.","Yes, he smiles all the time.","The boss's office is on the top floor."],a:0,sen:"The new boss seldom smiles.",szh:"新老闆很少(seldom)笑。",en:"Give him time. It's only his first week.",zh:"對方說新老闆(boss)很少笑，回「給他一點時間，這才他第一週」最自然。「對，他一直在笑」前面說 Yes 後面卻和對方的話相反；「老闆辦公室(office)在頂樓」只是重複 boss，沒回應。選 A"},
{n:8,p:1,o:["We'll hire someone next month.","Probably the young man who came on Monday.","Yes, I was a clerk, too."],a:1,sen:"Who will you hire for the clerk job?",szh:"店員(clerk)那個職缺你們會僱用(hire)誰？",en:"Probably the young man who came on Monday.",zh:"問會僱用「誰」，答「大概是週一來的那位年輕人」才是人物。「下個月會僱人」答的是時間；用 Yes 回答 who 問句不對，而且說的是自己以前當過店員。選 B"},
{n:9,p:1,o:["I rent a small office.","At eight-thirty, usually.","The MRT is faster than driving, so I take that."],a:2,sen:"How do you get to your office every day?",szh:"你每天怎麼去(get to)辦公室？",en:"The MRT is faster than driving, so I take that.",zh:"問「怎麼」去辦公室，答「捷運(MRT)比開車快，所以我搭捷運」是交通方式。「通常八點半」答的是時間；「我租(rent)了一間小辦公室」只是重複 office。選 C"},
{n:10,p:1,o:["Thanks. The director needs it on Monday.","Sorry, I can't promise anything.","Yes, it's Friday today."],a:0,sen:"I promise I'll finish the document by Friday.",szh:"我保證(promise)星期五前把文件做完。",en:"Thanks. The director needs it on Monday.",zh:"對方保證週五前完成文件(document)，回「謝謝，主任(director)星期一要用」是自然的回應。「抱歉，我不能保證什麼」把保證的人弄反了；「對，今天是星期五」只是重複 Friday。選 A"},
{n:11,p:1,o:["We have about twenty workers.","Only on Fridays. The rest of the week, we come in.","Yes, I own a home near the office."],a:1,sen:"Does your company allow workers to work from home?",szh:"你們公司允許(allow)員工在家工作嗎？",en:"Only on Fridays. The rest of the week, we come in.",zh:"問公司允不允許在家工作，答「只有星期五可以，其他天要進公司」，間接回答「部分允許」。「是的，我在公司附近有(own)一間房子」只是重複 home；「我們大約有二十個員工(worker)」答的是人數。選 B"},
{n:12,p:1,o:["About twenty years ago.","I've always loved helping people.","In the sales department."],a:1,sen:"Why did you choose this career?",szh:"你為什麼選擇這個職業(career)？",en:"I've always loved helping people.",zh:"問「為什麼」選這個職業(career)，答「我一直很喜歡(love)幫助別人」是原因。「大約二十年前」答的是時間；「在業務部(department)」答的是地點。選 B"},
{n:13,p:1,o:["Yes, I have a fork.","I don't eat cabbage.","Sure. Do you want the salt, too?"],a:2,sen:"Could you pass me the pepper?",szh:"可以把胡椒(pepper)遞給我嗎？",en:"Sure. Do you want the salt, too?",zh:"請對方遞胡椒(pepper)，回「當然，鹽也要(too)嗎？」最自然。「我不吃高麗菜(cabbage)」答非所問；「是的，我有(have)叉子(fork)」東西不對。選 C"},
{n:14,p:1,o:["I'm too busy to play.","Wow, he'll have to obey a lot of rules, then.","Yes, he's in the army now."],a:1,sen:"My brother is going to be a soldier next year.",szh:"我哥哥明年要去當兵(soldier)。",en:"Wow, he'll have to obey a lot of rules, then.",zh:"對方說哥哥明年要當兵(soldier)，回「哇，那他得遵守(obey)很多規定了」是接著話題回應。「對，他現在在軍中」和「明年才要去」時間矛盾；「我太(too)忙沒空玩」和對方的話無關。選 B"},
{n:15,p:1,o:["It might be Mr. Lin's. He sits by the window.","It costs twenty dollars.","Turn it toward me, please."],a:0,sen:"Whose electric fan is this?",szh:"這是誰的電(electric)風扇？",en:"It might be Mr. Lin's. He sits by the window.",zh:"問「誰的」電風扇，答「可能(might)是林先生的，他坐在窗邊」才是人物。「它要二十元」答的是價錢；「請把它轉向(toward)我(me)」是請求，沒回答是誰的。選 A"},
{n:16,p:2,o:["Ten thousand.","Twenty thousand.","Twelve thousand."],a:2,sen:"W: How much is the rent for your new apartment? &nbsp;M: Twenty thousand a month. But I share it with another friend. &nbsp;W: So you each pay ten thousand? &nbsp;M: No. My room is bigger, so I pay twelve. &nbsp;Q: How much does the man pay each month?",szh:"女：你新公寓的房租(rent)多少？　男：一個月兩萬(twenty thousand)，不過我和另一個(another)朋友合租。　女：所以你們一人付一萬？　男：不是，我的房間比較大，所以我付一萬二。　問：男士每個月付多少錢？",en:"Twelve thousand.",zh:"房租兩萬，因為男士房間比較大，他付一萬二。一萬是女士以為的平分；兩萬是整間的房租。選 C"},
{n:17,p:2,o:["At one.","At two.","At three."],a:2,sen:"M: Is the meeting with the director still at two? &nbsp;W: The secretary just called. The director's train is late. &nbsp;M: So when will she get here? &nbsp;W: An hour later than planned. We'll start right after she arrives. &nbsp;Q: When will the meeting probably start?",szh:"男：和主任(director)的會議(meeting)還是兩點嗎？　女：祕書(secretary)剛打電話來，主任的火車誤點了。　男：那她什麼時候到(get)？　女：比原本晚一個小時，她一到我們就開始。　問：會議大概幾點開始？",en:"At three.",zh:"原本兩點，主任晚一小時到，她一到就開始，所以大約三點。兩點是原本的時間；一點是把「一小時」往前算，方向錯了。選 C"},
{n:18,p:2,o:["Talking to the boss about money.","Looking for a new worker.","Helping Ben find a job at a bank."],a:1,sen:"W: Our division is so busy, and the boss says we can hire one more person. &nbsp;M: That's true. Three workers left last month. &nbsp;W: Ben sent us his papers. He worked at a bank for two years. &nbsp;M: Amy called this morning, too. She wants the job. &nbsp;W: Let's meet both of them on Monday. &nbsp;M: OK. I'll ask the secretary to make a plan. &nbsp;Q: What are the speakers doing?",szh:"女：我們部門(division)好忙，老闆(boss)說可以再僱用(hire)一個人。　男：沒錯(true)。上個月走了三個人。　女：Ben 寄來了他的資料。他在銀行工作過兩年。　男：Amy 今天早上也打電話來了，她想要這份工作。　女：我們星期一跟他們兩個見面吧。　男：好。我請祕書安排一下。　問：說話的人在做什麼？",en:"Looking for a new worker.",zh:"老闆(boss)答應部門(division)再僱用(hire)一個人，兩人看了 Ben 和 Amy 的資料、約好見面，所以是在找新員工。老闆只是同意名額，兩人沒有在跟老闆談錢；Ben 在銀行工作過是他的經歷，兩人是在考慮僱用他，不是在幫他找銀行的工作。選 B"},
{n:19,p:2,o:["A bank where the woman works.","A farmer who sells flowers.","A change in someone's work."],a:2,sen:"W: My aunt changed careers last year. &nbsp;M: Oh? What did she do before? &nbsp;W: She was a clerk in a bank for ten years. But she always loved flowers. &nbsp;M: So now she wants her own flower shop? &nbsp;W: Yes. She is learning from a farmer first, and she'll open it next spring. &nbsp;M: That's brave. I hope it goes well. &nbsp;Q: What are the speakers talking about?",szh:"女：我阿姨去年換了職業(career)。　男：喔？她以前做什麼？　女：她在銀行當了十年行員(clerk)，但她一直很喜歡花。　男：所以她現在想開自己(own)的花店？　女：對。她先跟一位農夫學習，明年春天就會開店。　男：真勇敢。希望一切順利。　問：說話的人在談什麼？",en:"A change in someone's work.",zh:"女士說阿姨換了職業(career)：從銀行行員(clerk)變成準備開自己(own)的花店，所以兩人談的是某個人工作的改變。銀行是阿姨以前上班的地方，不是女士；農夫只是阿姨要學習的對象，不是談話主題。選 C"},
{n:20,p:2,o:["Take her to the farm.","Give her the honey.","Sell her some honey."],a:1,sen:"W: This honey is so thick and sweet. &nbsp;M: It's from my uncle's farm. &nbsp;W: Can I buy some from him? &nbsp;M: He doesn't sell it. But you can have this bottle. &nbsp;Q: What will the man do?",szh:"女：這蜂蜜(honey)好濃(thick)好甜。　男：是我叔叔農場的。　女：我可以跟他買一些嗎？　男：他不賣，不過這瓶你可以拿去(have)。　問：男士會做什麼？",en:"Give her the honey.",zh:"叔叔不賣蜂蜜，但男士說「這瓶你可以拿去」，就是把蜂蜜送給她。「賣她蜂蜜」被男士否定；對話沒有說要帶她去農場。選 B"},
{n:21,p:2,o:["Mop the floor.","Clean everyone's desk.","Call the cleaner."],a:0,sen:"W: Who will clean the office tonight? &nbsp;M: The cleaner has a terrible cold today. &nbsp;W: Then who? &nbsp;M: Each of us will clean our own desk, and I'll mop the floor. &nbsp;Q: What will the man do for everyone?",szh:"女：今晚誰要打掃辦公室(office)？　男：清潔人員今天重(terrible)感冒。　女：那誰來？　男：每個人整理自己(own)的桌子，我來拖(mop)地。　問：男士要替大家做什麼？",en:"Mop the floor.",zh:"每個人只整理自己的桌子，男士另外負責拖(mop)地。他不是替大家整理所有桌子；清潔人員重感冒(terrible cold)，對話沒有說要打電話給他。選 A"},
{n:22,p:2,o:["She is worried about the fans sold here.","She is happy with the whole year.","She thinks exports went down."],a:1,sen:"M: Did you see the results for this year? &nbsp;W: Yes. We sold fewer electric fans here, but exports went up a lot. &nbsp;M: Fewer fans at home? That sounds bad. &nbsp;W: Not really. Altogether, we sold more than last year. &nbsp;M: So the boss will be happy. &nbsp;W: I think so. Next year we can export even more. &nbsp;Q: How does the woman feel about the results?",szh:"男：你看過今年的結果(result)了嗎？　女：看了。我們在國內賣的電(electric)風扇變少了，但外銷(export)增加很多。　男：國內變少？聽起來不太好。　女：不見得。整體(altogether)比去年賣得多。　男：那老闆(boss)會很高興。　女：我想是的。明年我們可以外銷更多。　問：女士對這些結果有什麼感覺？",en:"She is happy with the whole year.",zh:"男士覺得國內變少不好，但女士說「不見得」，因為整體(altogether)比去年賣得多，還想明年外銷(export)更多，表示她對今年整體結果很滿意。擔心國內賣少的是男士的想法，女士並不擔心；外銷是增加很多，不是減少。選 B"},
{n:23,p:2,o:["The man.","Tom.","Nobody."],a:1,sen:"W: Do you have a marker? I need to draw a chart for the meeting. &nbsp;M: Sorry, I only have a pencil. Ask Tom. He has a whole box of them. &nbsp;W: Great, thanks. &nbsp;Q: Who will probably give the woman a marker?",szh:"女：你有麥克筆(marker)嗎？我要為會議(meeting)畫一張圖表(chart)。　男：抱歉，我只有鉛筆。去問 Tom，他有一整盒。　女：太好了，謝謝。　問：誰大概會給女士麥克筆？",en:"Tom.",zh:"男士只有鉛筆，沒有麥克筆，他叫女士去找有一整盒的 Tom。男士自己沒有；Tom 有一整盒，所以不會沒人給。選 B"},
{n:24,p:2,o:["The woman.","The man.","Ben."],a:2,sen:"W: Can you get the box from the top shelf? &nbsp;M: Sorry, it's too high for someone of my height. &nbsp;W: Then let's wait for Ben. He's much taller than both of us. &nbsp;Q: Who will probably get the box?",szh:"女：你可以拿(get)最上面(top)那層架子的箱子嗎？　男：抱歉，以我的身高(height)來說太(too)高了。　女：那我們等 Ben 吧，他比我們兩個都高很多。　問：誰大概會拿那個箱子？",en:"Ben.",zh:"男士身高不夠拿不到，女士說要等比他們兩個都高的 Ben。男士已經說太高拿不到；女士比 Ben 矮，所以也是要等 Ben。選 C"},
{n:25,p:2,o:["On the beach.","At the fancy restaurant.","At the noodle shop."],a:2,sen:"M: Let's have dinner at that fancy restaurant by the sea. &nbsp;W: It's too expensive. How about the noodle shop next to it? &nbsp;M: OK, but let's sit outside, so we can watch the waves on the beach. &nbsp;Q: Where will they eat?",szh:"男：我們去海邊那家高級(fancy)餐廳吃晚餐吧。　女：太(too)貴了。旁邊的麵店怎麼樣？　男：好，不過我們坐外面，這樣可以看海灘上的浪(wave)。　問：他們會在哪裡吃？",en:"At the noodle shop.",zh:"女士嫌高級餐廳太貴，改提議旁邊的麵店，男士同意，只是要坐在外面看浪。高級餐廳被否定了；看海浪是坐在麵店外面看，不是在海灘上吃。選 C"},
{n:26,p:3,pic:true,o:[BARS("Who Employs Us",["Shops","Offices","Farms"],[80,50,20]),BARS("Who Employs Us",["Shops","Offices","Farms"],[50,80,20]),BARS("Who Employs Us",["Shops","Offices","Farms"],[20,50,80])],a:0,sen:"Our town asked young workers where they work. In a small town like ours, many people thought offices would employ the most. But shops employ even more young people than offices. Farms employ the fewest, and that number goes down every year. &nbsp;Q: Which chart shows where the young workers work?",szh:"我們鎮上問年輕工作者(worker)在哪裡上班。在像我們(ours)這樣的小鎮，很多人以為辦公室(office)僱用(employ)最多人。但商店僱用的年輕人比辦公室還多。農場僱用最少，而且人數每年下降。　問：哪張圖顯示年輕人在哪裡工作？",en:"Shops most, offices second, farms fewest.",zh:"商店比辦公室多，農場最少，所以商店最高、辦公室第二、農場最低。辦公室最高的那張是很多人原本以為的情形；農場最高的那張和「農場最少」相反。選 A"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27a'),PH('q27b')],a:0,sen:"At lunch, I had a conversation with my cousin Ben about his new job. After the company hired him this year, he first worked in the factory for two months. Then he moved to the office, but he didn't like sitting at a desk all day. Now he works in the sales department, and he meets customers every day. &nbsp;Q: Where does Ben work now?",szh:"午餐時，我和表哥 Ben 聊(conversation)他的新工作。今年公司雇用(hire)他之後，他先在工廠做了兩個月。接著他調到辦公室，但他不喜歡整天坐在桌前。現在他在業務部門(sales department)，每天都和客人見面。　問：Ben 現在在哪裡工作？",en:"In the sales department.",zh:"工廠(factory)是他剛被雇用時待的地方；辦公室(office)他做過但不喜歡整天坐著；現在(now)他在業務部門，每天和客人見面，所以是穿西裝和客人握手的那張。 選 A"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:2,sen:"My brother just finished college, and he is ready to start his career. He loves cooking, but restaurant hours are too long for him. His favorite subject was math, so he thought about teaching it. In the end, a bank employed him, and now he helps people with their money all day. &nbsp;Q: What does the brother do now?",szh:"我哥哥剛大學畢業，準備好(ready)開始他的職業(career)生涯。他很喜歡(love)做菜，但餐廳的工作時間對他來說太長了。他最喜歡的科目(subject)是數學，所以他想過去教數學。最後一家銀行僱用(employ)了他，現在他整天幫人處理錢的事。　問：哥哥現在做什麼？",en:"He works at a bank.",zh:"做菜是他喜歡的，但餐廳工時太長；教數學是他想過的；最後是銀行僱用他。在廚房做菜和在教室教書的照片都是沒有成為事實的選擇。選 C"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29a'),PH('q29c')],a:1,sen:"Last Friday, our company took all the workers to the beach. The boss wanted us to play ball on the wide beach, but it was too windy. Some people wanted to swim in the big waves, but the beach didn't allow swimming that day. So we rolled out our blankets and had a long picnic lunch. &nbsp;Q: What did the workers do at the beach?",szh:"上週五公司帶所有員工(worker)去海邊。老闆(boss)想讓大家在寬闊(wide)的沙灘上打球，但風太大了。有些人想在大浪(wave)裡游泳，但那天海灘不允許(allow)游泳。所以我們把毯子(blanket)攤開(roll out)，吃了一頓很長的野餐午餐。　問：員工們在海邊做了什麼？",en:"They had a picnic lunch on blankets.",zh:"打球因為風太大沒打；游泳因為那天不准游也沒游；最後是鋪毯子野餐。打球和游泳的照片都是沒有做成的活動。選 B"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:0,sen:"Our team just moved into a new office building. The boss has the big room with a sofa and a large plant. Next to it is the meeting room, with a long table and twelve chairs. Ours is the small room at the end, with four desks by the window. &nbsp;Q: Which room does the speaker's team work in?",szh:"我們團隊剛搬進新的辦公(office)大樓。老闆(boss)有一間放了沙發和大盆栽的大房間。旁邊是會議(meeting)室，有一張長桌和十二張椅子。我們的(ours)是走廊盡頭的小房間，窗邊有四張桌子。　問：說話者的團隊在哪個房間工作？",en:"The small room with four desks by the window.",zh:"有沙發和大盆栽的是老闆的辦公室；有長桌和十二張椅子的是會議室；說話者團隊的是窗邊有四張桌子的小房間。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 30 回　工作與職業　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
