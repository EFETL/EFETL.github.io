<script>
/* 圖形素材（第30回 工作與職業） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/30/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const OFFICE=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q1.jpg" alt="question 1 picture">`;
const DOCUMENT=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q2.jpg" alt="question 2 picture">`;
const DESK=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q3.jpg" alt="question 3 picture">`;
const WORKER=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q4.jpg" alt="question 4 picture">`;
const CHART=`<img class="pic-img p0img" src="gept-listening-img/30/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:OFFICE,o:["A hospital with a doctor and a nurse.","An office with a boss and a clerk.","A restaurant with a waiter and a cook."],a:1,sen:"For question one, look at the picture. What place is this?",szh:"第一題，請看圖片。這是什麼地方？",en:"An office with a boss and a clerk.",zh:"這是辦公室(office)，有老闆(boss)和職員(clerk)在工作，選 B。醫院和餐廳都不是圖中的地方。"},
{n:2,p:0,fig:DOCUMENT,o:["A document the director will sign.","A newspaper the director will read.","A lunch box the director will open."],a:0,sen:"For question two, look at the picture. What is on the desk?",szh:"第二題，請看圖片。桌上是什麼？",en:"A document the director will sign.",zh:"桌上是主任(director)要簽名的文件(document)，選 A。報紙和便當盒都不是桌上的東西。"},
{n:3,p:0,fig:DESK,o:["A doctor in the sales department.","A driver in the sales department.","A secretary in the sales department."],a:2,sen:"For question three, look at the picture. Who works here?",szh:"第三題，請看圖片。誰在這裡工作？",en:"A secretary in the sales department.",zh:"在業務部門(department)工作的是秘書(secretary)，選 C。醫生和司機都不是圖中的人。"},
{n:4,p:0,fig:WORKER,o:["A worker the company just hired.","A chef the company just hired.","A pilot the company just hired."],a:0,sen:"For question four, look at the picture. Who wears this hat?",szh:"第四題，請看圖片。誰戴這頂帽子？",en:"A worker the company just hired.",zh:"戴帽子的是公司剛雇用(hire)的工人(worker)，選 A。廚師和飛行員戴的是不同的帽子。"},
{n:5,p:0,fig:CHART,o:["A photo shows a happy family.","A map shows the roads in town.","A chart shows the sales result."],a:2,sen:"For question five, look at the picture. What shows the numbers?",szh:"第五題，請看圖片。什麼顯示數字？",en:"A chart shows the sales result.",zh:"圖表(chart)顯示業績結果(result)，選 C。照片和地圖不是用來顯示數字的。"},

{n:6,p:1,o:["The dinner was too salty.","Yes, we're ready. Get a fork.","The menu is on the table."],a:1,sen:"Can we start the fancy dinner?",szh:"我們可以開始這頓豪華晚餐了嗎？",en:"Yes, we're ready. Get a fork.",zh:"問能不能開始用餐，答『可以，我們準備好(ready)了，拿叉子(fork)吧』，選 B。A 評論菜太鹹，C 說菜單在哪，都沒回答。"},
{n:7,p:1,o:["It leads to the top floor.","The door was painted yesterday.","Sure, but watch your height."],a:2,sen:"May I come through this doorway?",szh:"我可以從這個門口過去嗎？",en:"Sure, but watch your height.",zh:"問能不能過去，答『可以，但要注意你的身高(height)』，選 C。A 說這門通往哪，B 說門漆過，都沒回答。"},
{n:8,p:1,o:["No, he loves being a soldier.","He joined the army last spring.","My uncle owns a small shop."],a:0,sen:"Was army life terrible for your uncle?",szh:"軍旅生活對你叔叔來說很糟嗎？",en:"No, he loves being a soldier.",zh:"問軍旅生活是否很糟(terrible)，答『不，他很愛(love)當軍人(soldier)』，選 A。B 說入伍時間，C 說叔叔擁有(own)一家店，都沒回答。"},
{n:9,p:1,o:["Some thick honey from a farm.","We went there by bus.","It was a quiet, sunny weekend."],a:0,sen:"What did you bring back from the countryside?",szh:"你從鄉下帶回什麼？",en:"Some thick honey from a farm.",zh:"問從鄉下帶回什麼，答『一些農場的濃(thick)蜂蜜(honey)』，選 A。B 說交通方式，C 說天氣和週末，都沒說帶回什麼。"},
{n:10,p:1,o:["We'll leave for the park at ten.","Roll up the blanket first.","It's a nice day for a picnic."],a:1,sen:"How should I pack the picnic things?",szh:"野餐的東西我該怎麼收？",en:"Roll up the blanket first.",zh:"問野餐用品怎麼收，答『先把毯子(blanket)捲(roll)起來』，選 B。A 說出發時間，C 說天氣，都沒說怎麼收。"},
{n:11,p:1,o:["Yes, I promise to obey them.","We meet every Friday at four.","I seldom see the club leader."],a:0,sen:"Will you keep to the club's rules?",szh:"你會遵守社團規則嗎？",en:"Yes, I promise to obey them.",zh:"問會不會遵守規則，答『會，我保證(promise)會服從(obey)』，選 A。B 說開會時間，C 說很少(seldom)見到社長，都沒回答。"},
{n:12,p:1,o:["I present at ten tomorrow.","Draw a chart with a marker.","The subject is math, I think."],a:1,sen:"How should I present the numbers?",szh:"這些數字我該怎麼呈現？",en:"Draw a chart with a marker.",zh:"問數字怎麼呈現，答『用白板筆(marker)畫一張圖表(chart)』，選 B。A 說報告時間，C 說科目(subject)，都沒說怎麼呈現。"},
{n:13,p:1,o:["It's an hour from my house.","It makes cars for export.","I mop the floor each morning."],a:2,sen:"What is your daily job at the factory?",szh:"你在工廠每天的工作是什麼？",en:"I mop the floor each morning.",zh:"問工廠的日常工作，答『我每天早上拖(mop)地』，選 C。A 說通勤時間，B 說工廠產品(export 出口)，都沒說自己的工作。"},
{n:14,p:1,o:["He cooked it for twenty people.","A fancy dish; sit toward the window.","The chef is from Italy, I think."],a:1,sen:"What did the chef serve, and where do I sit?",szh:"主廚上了什麼菜，我坐哪？",en:"A fancy dish; sit toward the window.",zh:"問上了什麼菜、坐哪，答『一道精緻(fancy)的菜，往(toward)窗邊坐』，選 B。A 說煮給二十(twenty)人，C 說主廚來自哪裡，都沒回答兩個問題。"},
{n:15,p:1,o:["I take the MRT to work.","It has a nice view of town.","It might be ours; ask me later."],a:2,sen:"Whose new office is on the tenth floor?",szh:"十樓的新辦公室是誰的？",en:"It might be ours; ask me later.",zh:"問辦公室是誰的，答『可能(might)是我們的(ours)，晚點問我(me)』，選 C。A 說搭捷運(MRT)，B 說風景，都沒回答是誰的。"},

{n:16,p:2,o:["To the office.","To the park.","To the beach."],a:0,sen:"W: Where is your father going now? &nbsp;M: To the office, for an important meeting with his boss. &nbsp;W: Busy man. &nbsp;Q: Where is the father going?",szh:"女：你爸爸現在要去哪？　男：去辦公室(office)，和老闆(boss)開重要的會。　女：忙碌的人。　問：爸爸要去哪？",en:"To the office.",zh:"爸爸去辦公室(office)見老闆(boss)，選 A。對話中沒有提到公園或海邊。"},
{n:17,p:2,o:["A teacher.","A driver.","A clerk."],a:2,sen:"M: What does your sister do? &nbsp;W: She is a clerk in the sales department of a big company. &nbsp;M: Good job. &nbsp;Q: What is the sister's job?",szh:"男：你姊姊做什麼？　女：她是大公司業務部門(department)的職員(clerk)。　男：好工作。　問：姊姊的工作是什麼？",en:"A clerk in the sales department.",zh:"姊姊是業務部門(department)的職員(clerk)，選 C。teacher 和 driver 對話中都沒提到。"},
{n:18,p:2,o:["A meeting.","A party.","A class."],a:0,sen:"W: Why is everyone so quiet in the big room? &nbsp;M: The company director is talking to the whole team. &nbsp;W: Is it a party? &nbsp;M: No. They are planning next year's work. &nbsp;Q: What is happening in the big room?",szh:"女：為什麼大房間裡大家都這麼安靜？　男：公司主任(director)正在對整個團隊說話。　女：是派對嗎？　男：不是。他們在規劃明年的工作。　問：大房間裡在做什麼？",en:"A meeting.",zh:"主任對全隊說話、規劃明年的工作，是會議(meeting)，選 A。女士問是不是派對，男士說不是。"},
{n:19,p:2,o:["Taking a break.","Writing a song.","Typing a document."],a:2,sen:"M: Why are you working so late? &nbsp;W: My boss wants a long paper typed before tomorrow. &nbsp;M: Is it a letter? &nbsp;W: No. The secretary must check it first. &nbsp;Q: What is the woman doing?",szh:"男：你為什麼這麼晚還在工作？　女：我老闆要我明天前打好一份很長的文件。　男：是信嗎？　女：不是。秘書(secretary)要先檢查。　問：女士在做什麼？",en:"Typing a document.",zh:"老闆要她打一份長的、要給秘書檢查的紙，是文件(document)，選 C。男士問是不是信，女士說不是。"},
{n:20,p:2,o:["Hire a new worker.","Sell the building.","Close the office."],a:0,sen:"W: Everyone is so busy these days. &nbsp;M: I know. We have too much work for our small team. &nbsp;W: What will the company do next month? &nbsp;M: It will find one more person to join us. &nbsp;Q: What will the company do?",szh:"女：最近大家都好忙。　男：對啊。我們的小團隊工作太多了。　女：公司下個月要做什麼？　男：要再找一個人加入我們。　問：公司要做什麼？",en:"Hire a new worker.",zh:"工作太多、再找一個人加入，就是聘僱(hire)新員工(worker)，選 A。對話裡沒有說要賣掉或關閉辦公室。"},
{n:21,p:2,o:["She is tired of it.","She loves it.","She is bored with it."],a:1,sen:"M: Is your aunt tired of her career? &nbsp;W: Never. She wakes up early and smiles all the way to the hospital. &nbsp;M: She must be happy there. &nbsp;W: Very! She cannot wait to start every day. &nbsp;Q: How does the aunt feel about her work?",szh:"男：你阿姨厭倦她的事業(career)了嗎？　女：從來沒有。她很早起床，一路微笑著去醫院。　男：她在那裡一定很快樂。　女：非常！她每天都等不及要開始。　問：阿姨對工作的感覺如何？",en:"She loves it.",zh:"一路微笑、等不及開始工作，代表她熱愛(love)工作，選 B。男士一開始問她是不是厭倦，但女士說從來沒有。"},
{n:22,p:2,o:["A soldier.","A farmer.","A driver."],a:0,sen:"W: What will your brother do after high school? &nbsp;M: He wants to join the army. &nbsp;W: Is that easy? &nbsp;M: No, but he is strong and brave. &nbsp;Q: What does the brother want to be?",szh:"女：你弟弟高中畢業後要做什麼？　男：他想加入軍隊。　女：那容易嗎？　男：不容易，但他又強壯又勇敢。　問：弟弟想當什麼？",en:"A soldier.",zh:"想加入軍隊的人是軍人(soldier)，選 A。對話裡沒有提到農夫或司機。"},
{n:23,p:2,o:["A map.","A chart.","A menu."],a:1,sen:"M: What did the manager show at the meeting? &nbsp;W: A picture with bars going up and down. &nbsp;M: What did it tell you? &nbsp;W: How much we sold this year. &nbsp;Q: What did the manager show?",szh:"男：經理在會議(meeting)上展示什麼？　女：一張有長條上上下下的圖。　男：它告訴你什麼？　女：我們今年賣了多少。　問：經理展示了什麼？",en:"A chart.",zh:"有長條、顯示今年賣多少的圖是圖表(chart)，選 B。map 和 menu 也是紙上的圖，但不會顯示銷售數字。"},
{n:24,p:2,o:["By car.","By the MRT.","By bike."],a:1,sen:"W: How do you get to work every day? &nbsp;M: By the MRT, straight to the office. &nbsp;W: Quick and easy. &nbsp;Q: How does the man get to work?",szh:"女：你每天怎麼上班？　男：搭捷運(MRT)，直達辦公室(office)。　女：又快又方便。　問：男士怎麼上班？",en:"By the MRT to the office.",zh:"男士搭捷運(MRT)直達辦公室(office)，選 B。他沒有提到開車或騎車。"},
{n:25,p:2,o:["It will employ more workers.","It will move to another town.","It will close for a month."],a:0,sen:"M: What good news does the factory have? &nbsp;W: It will employ more workers this year. &nbsp;M: Great for the town. &nbsp;Q: What is the factory's good news?",szh:"男：工廠有什麼好消息？　女：今年會聘僱(employ)更多工人(worker)。　男：對小鎮很好。　問：工廠的好消息是什麼？",en:"It will employ more workers.",zh:"工廠今年會聘僱(employ)更多工人(worker)，選 A。對話裡沒有說要搬走或關閉。"},

{n:26,p:3,pic:true,o:[BARS("Workers/Dept",["Sales","Tech","Office"],[50,80,20]),BARS("Workers/Dept",["Sales","Tech","Office"],[20,50,80]),BARS("Workers/Dept",["Sales","Tech","Office"],[80,50,20])],a:2,sen:"Our company counted the workers in each department. The sales division has the most workers, because we sell all over the country. Altogether, we have about two hundred workers. The tech team is in the middle, and the office staff is the smallest. So the sales bar should be the tallest. &nbsp;Q: Which chart shows the workers in each department?",szh:"我們公司統計各部門(department)的員工(worker)。業務組(division)最多，因為我們賣到全國；全部(altogether)大約兩百名員工。技術組中等；辦公室(office)行政最少。所以業務長條最高。　問：哪張圖顯示各部門員工？",en:"Sales most, office least.",zh:"業務最多、行政最少，所以最高的長條是 Sales，選 C。"},
{n:27,p:3,pic:true,o:[BARS("Sales Result",["Q1","Q2","Q3"],[55,80,30]),BARS("Sales Result",["Q1","Q2","Q3"],[30,55,80]),BARS("Sales Result",["Q1","Q2","Q3"],[80,55,30])],a:2,sen:"At the meeting, the director showed the sales result over three seasons. In the first season the result was the highest, thanks to a big export order for electric fans. In the second it was in the middle, and by the third the lowest. So the result went down each season. &nbsp;Q: Which chart shows the sales result?",szh:"會議(meeting)上，主任(director)展示三季的業績結果(result)。第一季最高，因為有大筆電風扇(electric)出口(export)訂單；第二季中等；到第三季最低。所以結果逐季下降。　問：哪張圖顯示業績結果？",en:"Q1 highest, Q3 lowest.",zh:"第一季最高、逐季下降，符合『Q1 最高、Q3 最低』，選 C。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('bread'),IMG('rice')],a:1,sen:"During a long meeting at the office, the busy workers had no lunch break. They could not order noodles or wait for rice from a restaurant. So the secretary bought fresh bread for everyone, and they ate it quietly, with no conversation, while the boss kept talking. &nbsp;Q: What did the office workers eat?",szh:"在辦公室(office)漫長的會議(meeting)中，忙碌的員工(worker)沒有午休。他們沒法點麵或等餐廳的飯。所以秘書(secretary)為大家買了新鮮麵包，大家安靜地吃，沒有交談(conversation)，老闆(boss)還在繼續講話。　問：辦公室員工吃什麼？",en:"Fresh bread.",zh:"秘書買了新鮮麵包(bread)給大家吃，選 B。麵和飯因為沒時間等，所以不是答案。"},
{n:29,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:1,sen:"To thank the team after a successful year, the boss held a dinner. He said the hard-working staff deserved more than plain bread or dry rice. So he treated everyone to a big bowl of hot noodles with cabbage and black pepper. Anyone could see his thanks were true, and the whole department cheered for their kind director. &nbsp;Q: What did the boss treat the team to?",szh:"為了感謝團隊成功的一年，老闆(boss)辦了一場晚宴。他說辛勤的員工值得比普通麵包或乾飯更好的。所以他請大家吃一大碗加了高麗菜(cabbage)和黑胡椒(pepper)的熱麵。任何人(anyone)都看得出他的感謝是真心的(true)，整個部門(department)為他們親切的主任(director)歡呼。　問：老闆請團隊吃什麼？",en:"A bowl of noodles.",zh:"老闆請大家吃熱麵(noodle)，選 B。麵包和乾飯是他說「不夠好」的東西。"},
{n:30,p:3,pic:true,o:[IMG('park'),IMG('mountain'),IMG('beach')],a:2,sen:"After finishing a huge project, our office planned a day trip together. The director liked the mountain and the secretary liked the park. But the workers chose the beach, because after weeks of hard work, everyone wanted to relax by the wide, open sea. We rented a van, and the weather allowed us to watch the waves all day. &nbsp;Q: Where did the office go for their trip?",szh:"完成一個大專案後，我們辦公室(office)一起計畫一日遊。主任(director)喜歡山，秘書(secretary)喜歡公園，但員工(worker)選了海邊(beach)，因為辛苦工作幾週後，大家都想在開闊的海邊放鬆。我們租(rent)了一輛小客車，天氣也允許(allow)我們整天看海浪(wave)。　問：辦公室去哪裡旅行？",en:"The beach.",zh:"辦公室的人選擇去海邊(beach)，選 C。主任喜歡山、秘書喜歡公園，但最後去的是海邊。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 30 回　工作與職業　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
