</head><body>
<div class="bar">
 <b>🖨 第 25 回　看醫生　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>
 <button class="t tonly" onclick="show('t')">只印教師卷</button>
 <button class="a tonly" onclick="show('a')">兩份都印</button>
</div>
<div id="root"></div>
<script>
/* 圖形素材（第25回 看醫生） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/25/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/25/p3_${n}.jpg?v=r25hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const DOCTOR=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q1.jpg" alt="question 1 picture">`;
const HOSPITAL=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q2.jpg" alt="question 2 picture">`;
const AMBULANCE=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q3.jpg" alt="question 3 picture">`;
const PILLS=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q4.jpg" alt="question 4 picture">`;
const BANDAGE=`<img class="pic-img p0img" src="gept-listening-img/25/p0_q5.jpg?v=2" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/25/p0_q1.jpg" alt="question 1 picture">`,o:["She is listening to a patient who is lying in bed.","She is listening to a patient who is coughing.","She is giving a shot to a patient who is coughing."],a:1,sen:"For question one, look at the picture. What is the doctor doing?",szh:"第一題，請看圖片。醫生(doctor)在做什麼？",en:"She is listening to a patient who is coughing.",zh:"穿白袍的女醫生(doctor)戴著聽診器，放在病人(patient)胸口聽，病人正握拳摀嘴咳嗽，正確。醫生手上拿的是聽診器，不是在打針(shot)；病人是坐著或站著，不是躺在床上。選 B"},
{n:2,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/25/p0_q2.jpg" alt="question 2 picture">`,o:["A nurse is treating a patient's arm.","A nurse is treating a patient's leg.","A nurse is giving a patient a shot in the arm."],a:0,sen:"For question two, look at the picture. What is happening in the hospital?",szh:"第二題，請看圖片。醫院(hospital)裡發生什麼事？",en:"A nurse is treating a patient's arm.",zh:"穿深藍色制服、戴藍手套的護士正用白色紗布處理(treat)病人(patient)的手臂，正確。她處理的是手臂，病人的腿蓋在被子下；她手上沒有針筒，不是在打針(shot)。選 A"},
{n:3,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/25/p0_q3.jpg" alt="question 3 picture">`,o:["An ambulance is parked in front of a hospital with its lights on.","An ambulance is going away from us with its lights on.","An ambulance is coming toward us with its lights on."],a:2,sen:"For question three, look at the picture. What can you see in the picture?",szh:"第三題，請看圖片。圖中可以看到什麼？",en:"An ambulance is coming toward us with its lights on.",zh:"一輛救護車(ambulance)亮著紅燈，在街上朝我們開過來，正確。我們看到的是車頭，所以不是離我們而去；路面和車子都有速度感，是在行駛，不是停在醫院(hospital)門口。選 C"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/25/p0_q4.jpg" alt="question 4 picture">`,o:["There are some drugs next to the bottle, but no needle for a shot.","There is an empty bottle, and a needle for a shot.","There are some drugs next to the bottle, and a needle for a shot."],a:2,sen:"For question four, look at the picture. What is on the table?",szh:"第四題，請看圖片。桌上有什麼？",en:"There are some drugs next to the bottle, and a needle for a shot.",zh:"桌上有一個裝滿橘色膠囊的藥罐，旁邊散著一些藥(drug)，右邊還有一支打針(shot)用的針筒，正確。藥罐裡裝滿膠囊，不是空的；針筒很明顯就在桌上，不能說沒有。選 C"},
{n:5,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/25/p0_q5.jpg?v=2" alt="question 5 picture">`,o:["A covered wound with no blood at all.","A covered wound with a little red blood.","A silver watch above a covered wound."],a:1,sen:"For question five, look at the picture. What can you see on the man's arm?",szh:"第五題，請看圖片。男子手臂上可以看到什麼？",en:"A covered wound with a little red blood.",zh:"男子手臂上的傷口(wound)用白色紗布包著，中間滲出一小塊紅色血跡，正確。紗布上明明有紅色血跡，不是完全沒有血；手臂上沒有銀色(silver)手錶。選 B"},
{n:6,p:1,o:["I think it's hers. She sits behind you.","It's a big pink eraser.","Yes, I need an eraser, too."],a:0,sen:"Whose eraser is this? It was under my desk.",szh:"這是誰的橡皮擦(eraser)？它在我桌子底下。",en:"I think it's hers. She sits behind you.",zh:"問 Whose 是誰的，答「我想是她的(hers)，她坐你後面」才是說出主人。「一個粉紅色大橡皮擦」答的是它的樣子；用 Yes 回答 Whose 問句不合理，說自己也需要橡皮擦也沒回答。選 A"},
{n:7,p:1,o:["A monster is a very big animal.","The movie starts at night.","Tell him it's not real."],a:2,sen:"My little brother is afraid of the monster in that movie.",szh:"我弟弟很怕那部電影裡的怪物(monster)。",en:"Tell him it's not real.",zh:"對方說弟弟怕電影裡的怪物(monster)，建議「告訴他那不是真的」最自然。「電影晚上(night)開始」只是重複 movie；「怪物是很大的動物」是在解釋字義，沒有回應弟弟害怕這件事。選 C"},
{n:8,p:1,o:["I stayed there for a week.","It's next to the playground.","Not long. If the treatment works, you can go home on Friday."],a:2,sen:"How long do I have to stay in the hospital?",szh:"我得在醫院(hospital)住多久？",en:"Not long. If the treatment works, you can go home on Friday.",zh:"病人問要住院多久，答「不會太久，治療(treatment)有效的話星期五就能回家」是在說時間長短。「在遊樂場(playground)旁邊」答的是地點；「我在那裡住了一週」人物和時態都不對，問的是對方自己要住多久。選 C"},
{n:9,p:1,o:["Not until your knee stops hurting.","The games are every Friday.","You played very well last time."],a:0,sen:"Doctor, when can I play in the team games again?",szh:"醫生(doctor)，我什麼時候可以再參加球隊比賽？",en:"Not until your knee stops hurting.",zh:"問「什麼時候能再比賽」，醫生答「要等到你膝蓋不痛(hurt)才行」是在給條件和時間，最自然。「比賽每週五」說的是比賽時間，不是他何時能上場；「你上次打得很好」沒有回答問題。選 A"},
{n:10,p:1,o:["You might be ill. Let me take your temperature.","Yes, there's nothing in the sky today.","I'll open the window for you."],a:0,sen:"Although it's sunny, I feel cold all over.",szh:"雖然(although)出大太陽，我卻全身發冷。",en:"You might be ill. Let me take your temperature.",zh:"大熱天卻全身發冷，很可能是生病(ill)了，回「你可能病了，我幫你量體溫」最合理。「天空(sky)什麼都沒有」只是由 sunny 聯想；對方已經覺得冷，再開窗只會更冷，不合理。選 A"},
{n:11,p:1,o:["Yes, he looks very nice.","He's the new doctor at our hospital.","He's standing by the door."],a:1,sen:"Who's that good-looking guy by the door?",szh:"門邊那個長得好看(good-looking)的傢伙(guy)是誰？",en:"He's the new doctor at our hospital.",zh:"問 Who 是誰，答「他是我們醫院(hospital)新來的醫生(doctor)」才是身分。「他站(stand)在門邊」只是重複問句裡的位置；用 Yes 回答 Who 問句不合理。選 B"},
{n:12,p:1,o:["He tried to lift a heavy box.","He'll see a doctor tomorrow.","It hurts the most at night."],a:0,sen:"How did your dad hurt his back?",szh:"你爸爸怎麼弄傷(hurt)背的？",en:"He tried to lift a heavy box.",zh:"問 How 怎麼受傷，答「他想抬起(lift)一個很重的箱子」是受傷經過。「晚上(night)最痛」說的是痛的時間；「他明天要看醫生」時態不對，問的是已經發生的事。選 A"},
{n:13,p:1,o:["Put it on the table, please.","There are about a dozen in my top drawer.","Sure, I'll write you a letter."],a:1,sen:"I need a stamp for this letter.",szh:"我這封信需要一張郵票(stamp)。",en:"There are about a dozen in my top drawer.",zh:"對方說需要郵票(stamp)，回「我最上面的抽屜大約有一打(dozen)」是告訴他去哪裡拿，最自然。「好，我寫信給你」只是重複 letter；「請放(put)在桌上」答非所問，對方手上還沒有郵票。選 B"},
{n:14,p:1,o:["She drives there each day.","She's a businessperson.","At the Kaohsiung branch of a big bank."],a:2,sen:"Where does your aunt work?",szh:"你阿姨在哪裡工作？",en:"At the Kaohsiung branch of a big bank.",zh:"問 Where 在哪裡工作，答「在一家大銀行的高雄(Kaohsiung)分行(branch)」才是地點。「她是生意人(businessperson)」答的是職業；「她每天(each)開車去」答的是怎麼去。選 C"},
{n:15,p:1,o:["Yes, I'll give it to him tomorrow.","No, just some drugs to take after meals.","The doctor is very good-looking."],a:1,sen:"Did the doctor give you a shot?",szh:"醫生有幫你打針(shot)嗎？",en:"No, just some drugs to take after meals.",zh:"問醫生有沒有打針(shot)，答「沒有，只給了飯後吃的藥(drug)」最自然。「好，我明天拿給他」人物和時態都不對，好像自己才是給東西的人；「醫生長得很好看」沒有回答問題。選 B"},
{n:16,p:2,o:["At a pet shop.","At an animal hospital.","At a hospital for people."],a:1,sen:"W: Next, please. What's wrong with your dog? &nbsp;M: He's sick. He won't eat, and he sleeps all day. &nbsp;W: Let me see. Hmm, I'll give him a shot first. &nbsp;M: Will it hurt him? &nbsp;Q: Where are the speakers?",szh:"女：下一位。你的狗怎麼了？　男：牠生病(sick)了，不吃東西，整天睡覺。　女：我看看。嗯，我先幫牠打一針(shot)。　男：會讓牠痛(hurt)嗎？　問：說話者在哪裡？",en:"At an animal hospital.",zh:"女士叫下一位、問狗怎麼了、要幫狗打針(shot)，她是獸醫，所以他們在動物醫院(hospital)。看病的是狗，不是人的醫院；寵物店不會幫生病的狗打針。選 B"},
{n:17,p:2,o:["Twelve.","Eight.","Six."],a:2,sen:"M: Mom bought a dozen eggs this morning. &nbsp;W: I used four of them for a cake. &nbsp;M: And I broke two when I dropped the box. &nbsp;Q: How many eggs are left?",szh:"男：媽媽今天早上買了一打(dozen)蛋。　女：我用了四顆做蛋糕。　男：我把盒子掉在地上，又破了兩顆。　問：還剩幾顆蛋？",en:"Six.",zh:"一打(dozen)是十二顆，用掉四顆、打破兩顆，剩六顆。十二是原本買的數量；八是只扣掉做蛋糕的四顆，忘了打破的兩顆。選 C"},
{n:18,p:2,o:["He needs more treatment.","He still has cancer.","He is cured."],a:2,sen:"W: How's your grandfather? &nbsp;M: The doctor said the treatment worked. There's no cancer in his body now. &nbsp;W: That's wonderful news! &nbsp;Q: What do we know about the grandfather?",szh:"女：你爺爺還好嗎？　男：醫生說治療(treatment)有效，現在他體內已經沒有癌症(cancer)了。　女：真是好消息！　問：關於爺爺我們知道什麼？",en:"He is cured.",zh:"治療(treatment)有效、體內沒有癌症(cancer)了，換句話說就是「他被治好(cure)了」。說他還有癌症和男士的話相反；醫生說治療已經成功，沒說還要更多治療。選 C"},
{n:19,p:2,o:["Get Mrs. Lee.","Call an ambulance.","Stay with the man."],a:1,sen:"M: A man fell down in the yard, and he can't stand up! &nbsp;W: I'll call an ambulance. You stay with him. &nbsp;M: OK. Should we get Mrs. Lee? She's a nurse. &nbsp;W: Good idea. Tom can run next door and get her. &nbsp;Q: What will the woman do?",szh:"男：有個男人在院子(yard)裡跌倒，站(stand)不起來！　女：我來叫救護車(ambulance)，你陪著他。　男：好。要不要找李太太(Mrs.)？她是護士。　女：好主意，Tom 可以跑去隔壁找她。　問：女士會做什麼？",en:"Call an ambulance.",zh:"要分清楚誰做什麼：女士叫救護車(ambulance)，男士陪在跌倒的人身邊，Tom 去隔壁找李太太。陪著傷者是男士的工作；找李太太是 Tom 的工作。選 B"},
{n:20,p:2,o:["Take them to the hospital.","Put them in the water.","Throw them in the trash."],a:0,sen:"W: Should I throw these old drugs in the trash? &nbsp;M: No. They can get into the water and affect fish and humans. &nbsp;W: So what should I do with them? &nbsp;M: The hospital takes old drugs. It's on your way to work. &nbsp;Q: What will the woman probably do with the old drugs?",szh:"女：這些過期的藥(drug)可以丟(throw)進垃圾桶嗎？　男：不行，藥會流進水裡，影響(affect)魚和人類(human)。　女：那我該怎麼處理？　男：醫院(hospital)會收舊藥，就在你上班的路上。　問：女士可能會怎麼處理舊藥？",en:"Take them to the hospital.",zh:"男士說醫院(hospital)收舊藥，而且順路，所以女士會把藥拿去醫院。丟進垃圾桶是男士反對的做法；藥流進水裡正是男士擔心的事，不是處理方法。選 A"},
{n:21,p:2,o:["She wants to go to the gym.","She can't walk at all.","She can't go dancing tonight."],a:2,sen:"M: Do you want to go to the dance club tonight? &nbsp;W: I'd love to, but I hurt my hip at the gym. &nbsp;M: Can you walk? &nbsp;W: Slowly. I can't even put on my belt without pain. &nbsp;Q: What does the woman mean?",szh:"男：今晚(night)要不要去跳舞俱樂部(club)？　女：我很想去，可是我在健身房傷(hurt)到臀部(hip)了。　男：你能走路嗎？　女：只能慢慢走，我連繫(put on)皮帶(belt)都會痛。　問：女士的意思是什麼？",en:"She can't go dancing tonight.",zh:"女士說很想去「但是」傷到臀部(hip)，連繫皮帶(belt)都痛，意思是今晚不能去跳舞。她說還能慢慢走，不是完全不能走；健身房是她受傷的地方，不是她想去的地方。選 C"},
{n:22,p:2,o:["A salad and potato soup.","Only potato soup.","French fries and a salad."],a:0,sen:"W: Let's get brunch. You can select anything you like. &nbsp;M: My doctor says I should stop eating fried food. &nbsp;W: So no French fries? How about a lettuce salad? &nbsp;M: Good. And a bowl of potato soup with it. &nbsp;Q: What will the man have for brunch?",szh:"女：我們去吃早午餐(brunch)吧，你想選(select)什麼都可以。　男：醫生(doctor)說我不該再吃炸的東西。　女：那就不要薯條囉？來份生菜(lettuce)沙拉怎麼樣？　男：好，再配一碗馬鈴薯(potato)湯。　問：男士早午餐會吃什麼？",en:"A salad and potato soup.",zh:"男士不能吃炸的，所以不點薯條；他同意生菜(lettuce)沙拉，又加點了一碗馬鈴薯(potato)湯。薯條是被醫生禁止的；只有湯少了他同意的沙拉。選 A"},
{n:23,p:2,o:["At her home on Saturday.","At her home on Sunday.","At the hospital on Saturday."],a:0,sen:"M: Let's visit Grandmother at the hospital on Saturday. &nbsp;W: She's going home on Friday. &nbsp;M: Great! Then let's visit her at home on Sunday. &nbsp;W: Saturday is better. I have a piano lesson on Sunday. &nbsp;M: OK. &nbsp;Q: When and where will they visit Grandmother?",szh:"男：我們星期六去醫院(hospital)看奶奶吧。　女：她星期五就出院回家了。　男：太好了！那我們星期日去家裡看她。　女：星期六比較好，我星期日有鋼琴課。　男：好。　問：他們什麼時候、在哪裡探望奶奶？",en:"At her home on Saturday.",zh:"奶奶星期五出院，所以不會去醫院；時間女士改回星期六，男士同意。去醫院是舊計畫，奶奶已經回家；星期日是男士的提議，被女士改成星期六。選 A"},
{n:24,p:2,o:["Go hiking and see a movie.","Ask the leader to select one.","Let everyone vote."],a:1,sen:"W: Our club has a conflict. Half of us want to go hiking, and half want to see a movie. &nbsp;M: Why not let everyone vote? That's the democratic way. &nbsp;W: We did. It was ten to ten. &nbsp;M: Then ask your club leader to select one. &nbsp;Q: What does the man suggest in the end?",szh:"女：我們社團(club)起了衝突(conflict)，一半想去健行，一半想去看電影。　男：何不讓大家投票？那是民主的(democratic)方式。　女：投過了，十比十。　男：那就請社長選(select)一個。　問：男士最後建議什麼？",en:"Ask the leader to select one.",zh:"男士先建議投票，但女士說已經投過、十比十平手，所以他最後建議請社長選(select)。投票是第一個、已經失敗的辦法；兩個都去不是任何人的建議，大家只能選一個。選 B"},
{n:25,p:2,o:["She wanted to adopt a cat.","Her new cat bit her.","She had a big wound from a fall."],a:1,sen:"M: Why did you go to the hospital yesterday? &nbsp;W: The cat we adopted last week bit my hand. &nbsp;M: Was it bad? &nbsp;W: No. Although it was a small wound, the doctor still gave me a shot. &nbsp;Q: Why did the woman go to the hospital?",szh:"男：你昨天為什麼去醫院(hospital)？　女：我們上週領養(adopt)的貓咬了我的手。　男：嚴重嗎？　女：不嚴重。雖然(although)只是個小傷口(wound)，醫生還是幫我打了一針(shot)。　問：女士為什麼去醫院？",en:"Her new cat bit her.",zh:"她去醫院是因為上週剛領養的貓咬了她。貓上週就已經領養(adopt)了，不是去醫院的原因；她說是小傷口(wound)，而且是被咬，不是跌倒受的大傷。選 B"},
{n:26,p:3,pic:true,o:[BARS("Patient Visits",["Colds","Wounds","Shots"],[80,50,20]),BARS("Patient Visits",["Colds","Wounds","Shots"],[20,50,80]),BARS("Patient Visits",["Colds","Wounds","Shots"],[50,20,80])],a:2,sen:"Our hospital counted why patients came in last month. Most months, colds are the top reason. Last month, however, many people came for flu shots, even more than for colds. Although children play on the big playground next to our hospital every day, we treated only a few wounds. &nbsp;Q: Which chart shows the patient visits last month?",szh:"我們醫院(hospital)統計了上個月病人(patient)來看病的原因。大部分月份感冒是第一名。不過上個月很多人來打流感疫苗(shot)，甚至比感冒還多。雖然(although)每天都有小孩在醫院旁邊的大遊樂場(playground)玩，我們卻只處理(treat)了少數幾個傷口(wound)。　問：哪張圖表是上個月的病人就診情形？",en:"Shots most, colds second, wounds fewest.",zh:"上個月打針(shot)比感冒多，只處理(treat)了少數幾個傷口(wound)，所以打針最高、感冒第二、傷口最低。感冒最高的那張是「大部分月份」的情形；打針最高但傷口比感冒多的那張，和「只處理了少數幾個傷口」相反。選 C"},
{n:27,p:3,pic:true,o:[BARS("Ambulance Calls",["City","Beach","Mountain"],[80,50,20]),BARS("Ambulance Calls",["City","Beach","Mountain"],[50,80,20]),BARS("Ambulance Calls",["City","Beach","Mountain"],[20,80,50])],a:1,sen:"Our hospital counted its ambulance calls from three regions last summer. You might think the city had the most calls, because so many people live there. But the beach region had even more calls than the city, because many people got hurt in the water or got sick in the sun. In the mountain region, the number of calls was not high at all. &nbsp;Q: Which chart shows the ambulance calls last summer?",szh:"我們醫院(hospital)統計了去年夏天三個地區(region)的救護車(ambulance)出勤次數。你可能以為城市最多，因為那裡住了很多人。但海邊地區甚至比城市還多，因為很多人在水裡受傷(hurt)，或在太陽下生病(sick)。山區的出勤次數則一點也不高(high)。　問：哪張圖表是去年夏天的救護車出勤情形？",en:"Beach most, city second, mountain fewest.",zh:"海邊地區(region)比城市還多，山區一點也不高(high)，所以是海邊最高、城市第二、山區最低的圖。城市最高的那張是「你可能以為」的情形；海邊最高但山區比城市多的那張，和「山區一點也不高」相反。選 B"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28a'),PH('q28c')],a:2,sen:"Our hospital is choosing a new symbol for the front of the building. Many people liked a red cross, but lots of other hospitals already use one. A red heart was also popular, but some said it was too simple. In the end, we selected a green tree, because it is a symbol of life. &nbsp;Q: Which symbol did the hospital select?",szh:"我們醫院(hospital)正在為大樓正面選一個新標誌(symbol)。很多人喜歡紅十字，但很多醫院已經在用了。紅色愛心也很受歡迎，但有人說太簡單(simple)。最後我們選了(select)一棵綠色的樹，因為它是生命的象徵。　問：醫院選了哪一個標誌？",en:"A green tree.",zh:"紅十字因為別的醫院都在用而沒選；紅色愛心被嫌太簡單(simple)；最後選(select)的是綠色的樹。選 C"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29c'),PH('q29b')],a:0,sen:"Last Sunday, we visited my grandfather in the hospital. My sister wanted to bring him flowers, but flowers are not allowed in his room. Mom wanted to bring a cake, but he can't eat sweets now. So we brought a pile of his old photos, and he talked about each one for an hour. &nbsp;Q: What did the family bring to the grandfather?",szh:"上週日我們去醫院(hospital)探望爺爺。妹妹想帶花給他，但他的病房不能放花。媽媽想帶蛋糕，但他現在不能吃甜食。所以我們帶了一疊(pile)他的老照片，他每(each)一張都講了好久，講了一個小時。　問：一家人帶了什麼給爺爺？",en:"A pile of old photos.",zh:"花是妹妹想帶的，但病房不能放；蛋糕是媽媽想帶的，但爺爺不能吃甜食；最後帶的是一疊(pile)老照片。選 A"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:0,sen:"My back hurt, so my doctor gave me some simple moves to do at home. First, stand up straight for one minute. Next, reach forward slowly and touch your knees. But do not lift your arms over your head yet. That can hurt your back again. &nbsp;Q: What did the doctor tell the speaker not to do?",szh:"我背痛(hurt)，所以醫生(doctor)給了我幾個在家做的簡單(simple)動作。首先，站(stand)直一分鐘。接著，慢慢往前(forward)伸手摸膝蓋。但是先不要把手臂舉(lift)過頭，那樣可能會再傷到背。　問：醫生叫說話者不要做什麼？",en:"Lift his arms over his head.",zh:"站直和往前(forward)摸膝蓋都是醫生要他做的動作；醫生說「先不要」把手臂舉(lift)過頭。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 25 回　看醫生　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
