<script>
/* 圖形素材（第40回 自然科學小知識） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/40/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const FLASK=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q1.jpg" alt="question 1 picture">`;
const MIRROR=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q2.jpg" alt="question 2 picture">`;
const NOTEBOOK=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q3.jpg" alt="question 3 picture">`;
const SWAN=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q4.jpg" alt="question 4 picture">`;
const ROSE=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:FLASK,o:["A hammer and some nails.","A brush and some paint.","A bottle of chemical liquid."],a:2,sen:"For question one, look at the picture. What does a scientist use?",szh:"第一題，請看圖片。科學家用什麼？",en:"A bottle of chemical liquid.",zh:"科學家(scientist)使用的是一瓶化學(chemical)液體(liquid)，選 C。鐵鎚與畫筆是工匠和畫家的工具。"},
{n:2,p:0,fig:MIRROR,o:["A clock on the wall.","A picture on the wall.","A mirror on the wall."],a:2,sen:"For question two, look at the picture. What shows your face?",szh:"第二題，請看圖片。什麼照出你的臉？",en:"A mirror on the wall.",zh:"能照出你的臉的是鏡子(mirror)，選 C。時鐘與圖畫掛在牆上，但照不出臉。"},
{n:3,p:0,fig:NOTEBOOK,o:["A newspaper from the library.","A notebook for science class.","A calendar for next year."],a:1,sen:"For question three, look at the picture. What do you write in?",szh:"第三題，請看圖片。你在什麼上面寫字？",en:"A notebook for science class.",zh:"拿來寫字的是自然(science)課用的筆記本(notebook)，選 B。報紙不是用來寫字的，日曆也不是圖中的東西。"},
{n:4,p:0,fig:SWAN,o:["A white swan on the stream.","A white duck on the stream.","A white goose on the stream."],a:0,sen:"For question four, look at the picture. What bird is this?",szh:"第四題，請看圖片。這是什麼鳥？",en:"A white swan on the stream.",zh:"溪流(stream)上的是一隻白天鵝(swan)，選 A。鴨子與鵝外形相似，但不是圖中的鳥。"},
{n:5,p:0,fig:ROSE,o:["An orange rose with green leaves.","An orange tulip with green leaves.","An orange lily with green leaves."],a:0,sen:"For question five, look at the picture. What flower is this?",szh:"第五題，請看圖片。這是什麼花？",en:"An orange rose with green leaves.",zh:"圖中是橘色(orange)的玫瑰(rose)，選 A。鬱金香與百合顏色相同，但花不對。"},

{n:6,p:1,o:["In the main hall, last Friday.","She invented a clever robot.","It's a prize of fifty dollars."],a:1,sen:"How did the young scientist win the prize?",szh:"年輕科學家怎麼贏得獎項？",en:"She invented a clever robot.",zh:"問她怎麼得獎，答『她發明(invent)了一個聰明的機器人』，選 B。A 回答時間地點(main)，C 講獎金，都沒回答怎麼得獎。"},
{n:7,p:1,o:["It's stupid to attack anyone.","She sounded very serious today.","The fight lasted only one minute."],a:0,sen:"What did the teacher say about fighting?",szh:"老師對打架說了什麼？",en:"It's stupid to attack anyone.",zh:"問老師對打架說了什麼，答『攻擊(attack)別人很愚蠢(stupid)』，選 A。B 只說她很嚴肅(serious)，C 講打架多久(one)，都沒說老師說什麼。"},
{n:8,p:1,o:["Cut the cheese into thin slices.","Tell me when dinner is ready.","Put the plates here, dear."],a:2,sen:"How should I set the table for dinner?",szh:"晚餐我該怎麼擺盤？",en:"Put the plates here, dear.",zh:"問怎麼擺餐桌，答『親愛的(dear)，盤子放這裡』，選 C。A 切(cut)起司(cheese)是備料，B 要對方告訴(tell)你何時開飯，都不是擺桌方式。"},
{n:9,p:1,o:["It's a party on New Year's eve.","Yes, I'll wear my pajamas there.","I attend a school near here."],a:1,sen:"Will you join the sleepover tonight?",szh:"今晚你會參加睡衣派對嗎？",en:"Yes, I'll wear my pajamas there.",zh:"問今晚會不會參加睡衣派對，答『會，我會穿(wear)睡衣(pajamas)去』，選 B。A 講派對的日子(eve)，C 講上學(attend)，都沒回答是否參加。"},
{n:10,p:1,o:["It works on a simple principle.","It was made in the USA.","It's dangerous without good control."],a:2,sen:"Why must we be careful with the boiler?",szh:"為什麼我們要小心鍋爐？",en:"It's dangerous without good control.",zh:"問為何要小心鍋爐，答『沒有(without)好的控制(control)會很危險』，選 C。A 講原理(principle)，B 講產地(USA)，都沒說明原因。"},
{n:11,p:1,o:["Furniture production is too slow.","It's near the train station.","The workers are very friendly."],a:0,sen:"What problem does the factory have?",szh:"工廠有什麼問題？",en:"Furniture production is too slow.",zh:"問工廠有什麼問題，答『家具(furniture)生產(production)太慢』，選 A。B 講位置，C 講工人，都不是問題。"},
{n:12,p:1,o:["The show lasted two hours.","The magician did a clever trick.","Tickets cost twenty dollars."],a:1,sen:"How did the show amaze the crowd?",szh:"表演怎麼讓觀眾驚奇？",en:"The magician did a clever trick.",zh:"問表演怎麼讓觀眾驚奇，答『魔術師(magician)變了個聰明的戲法(trick)』，選 B。A 講時間長度，C 講票價，都沒回答。"},
{n:13,p:1,o:["Practice is on Friday evening.","He's skinny but very skillful.","Our team plays in the park."],a:1,sen:"What is your new sports coach like?",szh:"你的新運動教練怎麼樣？",en:"He's skinny but very skillful.",zh:"問新教練怎麼樣，答『他很瘦(skinny)，但很熟練(skillful)』，選 B。A 講練習時間，C 講在公園(park)比賽，都沒描述教練。"},
{n:14,p:1,o:["At a senior high school.","We usually study on Sundays.","My uncle lives in the USA."],a:0,sen:"Where do you and your friends study?",szh:"你和朋友在哪讀書？",en:"At a senior high school.",zh:"問在哪裡讀書，答『在一所高中(senior high school)』，選 A。B 回答時間，C 講叔叔住在美國(USA)，都沒回答地點。"},
{n:15,p:1,o:["It opens at eight every day.","The air conditioner is broken.","Please don't smoke in the park."],a:2,sen:"What is the main rule in this public place?",szh:"這個公共場所的主要規則是什麼？",en:"Please don't smoke in the park.",zh:"問這裡的主要規則，答『請不要在公園(park)裡抽菸(smoke)』，選 C。A 講開放時間，B 講冷氣(air conditioner)壞了，都不是規則。"},

{n:16,p:2,o:["He made spelling mistakes.","He ran out of time.","He forgot his pencil."],a:0,sen:"W: How was your English test? &nbsp;M: Not good. I knew the answers, but I often wrote the wrong letters in words. &nbsp;W: Maybe you should read more. &nbsp;Q: What was the man's problem?",szh:"女：你的英文考試考得如何？　男：不太好。我知道答案，但常常把單字的字母寫錯(often)。　女：也許你該多讀書。　問：男士的問題是什麼？",en:"He made spelling mistakes.",zh:"他說知道答案，但常把字母寫錯，這是拼字(spelling)錯誤，選 A。他沒說時間不夠或忘記帶筆。"},
{n:17,p:2,o:["Art and music.","Biology and physics.","History and math."],a:1,sen:"M: Which classes do you have this morning? &nbsp;W: Biology and physics, my favorite science subjects. &nbsp;M: Hard subjects. &nbsp;Q: Which classes does the woman have?",szh:"男：你今早有什麼課？　女：生物(biology)和物理(physics)，我最愛的科學科目。　男：難的科目。　問：女士有什麼課？",en:"Biology and physics.",zh:"是生物(biology)和物理(physics)課，選 B。"},
{n:18,p:2,o:["She is quite young.","She works in a small clinic.","She has a lot of skill."],a:2,sen:"W: My grandfather needs an operation next week, and I'm very worried. &nbsp;M: Don't worry. The doctor has done it hundreds of times, and she never makes mistakes. &nbsp;W: That makes me feel better. &nbsp;Q: What does the man say about the doctor?",szh:"女：我爺爺下週要動手術(operation)，我很擔心。　男：別擔心。那位醫生做過幾百次了，從不出錯。　女：這讓我好過多了。　問：男士怎麼說那位醫生？",en:"She has a lot of skill.",zh:"醫生做過幾百次手術、從不出錯，表示她很有技術(skill)，選 C。對話沒提她年輕或在小診所。"},
{n:19,p:2,o:["The room is too small.","The room is too cold.","The room is too noisy."],a:1,sen:"W: Why are you wearing three jackets inside? &nbsp;M: The heater is broken. It's only ten degrees in here. &nbsp;W: Let's go to my house. &nbsp;Q: What is the problem?",szh:"女：你為什麼在室內穿三件外套？　男：暖氣壞了。這裡只有十度(degree)。　女：我們去我家吧。　問：問題是什麼？",en:"The room is too cold.",zh:"暖氣壞了、只有十度(degree)，所以房間太冷，選 B。對話沒說房間小或吵。"},
{n:20,p:2,o:["She cut it.","She burned it.","She bit it."],a:1,sen:"M: Why is your lip so red and big? &nbsp;W: I was careless. I drank the soup before it cooled down. &nbsp;M: Go to the sink and wash it with cold water. &nbsp;Q: What happened to the woman's lip?",szh:"男：你的嘴唇(lip)為什麼又紅又腫？　女：我太不小心，湯還沒涼就喝了。　男：去水槽(sink)用冷水沖一下。　問：女士的嘴唇怎麼了？",en:"She burned it.",zh:"湯沒涼就喝、要用冷水沖，表示嘴唇燙傷，選 B。她沒說被割到或咬到。"},
{n:21,p:2,o:["He is a singer.","He is a doctor.","He is a magician."],a:2,sen:"W: Look at the stage! The man in the black cape is holding an empty hat. &nbsp;M: Wait, a white bird just appeared from the hat! How did he do that? &nbsp;W: I have no idea. It's amazing! &nbsp;Q: What does the man on the stage do?",szh:"女：看舞台！穿黑斗篷的男人拿著一頂空帽子。　男：等等，一隻白鳥剛從帽子裡出現(appear)了！他怎麼做到的？　女：我不知道。太神奇了！　問：台上的男人做什麼工作？",en:"He is a magician.",zh:"從空帽子變出白鳥，是魔術師(magician)的表演，選 C。歌手與醫生不會這樣做。"},
{n:22,p:2,o:["A white swan on the stream.","A white duck on the stream.","A big fish in the stream."],a:0,sen:"W: What did you see on the water? &nbsp;M: A graceful white swan on the clear stream. &nbsp;W: How peaceful. &nbsp;Q: What did the man see?",szh:"女：水上你看到什麼？　男：清澈溪流(stream)上一隻優雅的白天鵝(swan)。　女：真寧靜。　問：男士看到什麼？",en:"A white swan on the stream.",zh:"看到溪流(stream)上的天鵝(swan)，選 A。鴨子也浮在水上，但對話說的是天鵝。"},
{n:23,p:2,o:["Fifteen.","Twenty.","Thirty-five."],a:2,sen:"W: How many students do you teach? &nbsp;M: Twenty in the morning class, and fifteen in the afternoon class. &nbsp;W: That's a lot of work. &nbsp;Q: How many students does the man teach in total?",szh:"女：你教多少學生？　男：早上班二十人，下午班十五人。　女：工作量很大。　問：男士總共(total)教多少學生？",en:"Thirty-five.",zh:"二十加十五，總共(total)三十五人，選 C。A、B 只是單一班級的人數。"},
{n:24,p:2,o:["To run every morning.","To buy new shoes.","To follow the coach's advice."],a:2,sen:"M: How can I improve my running? &nbsp;W: Just follow the coach's good advice. &nbsp;M: I will. &nbsp;Q: What does the woman suggest?",szh:"男：我要怎麼跑得更好？　女：聽從教練(coach)的好建議(advice)就對了。　男：我會的。　問：女士建議什麼？",en:"Follow the coach's advice.",zh:"聽從教練(coach)的建議(advice)，選 C。晨跑與買新鞋都不是她說的。"},
{n:25,p:2,o:["Turn on the air conditioner.","Go outside for some air.","Drink a glass of cold water."],a:0,sen:"W: It's so hot in this room. Even the water from the sink is warm. &nbsp;M: Don't worry. The remote is on the table. Press the blue button. &nbsp;W: Oh, good idea. &nbsp;Q: What does the man suggest?",szh:"女：這房間好熱。連水槽(sink)的水都是溫的。　男：別擔心。遙控器在桌上。按藍色按鈕。　女：噢，好主意。　問：男士建議什麼？",en:"Turn on the air conditioner.",zh:"用遙控器按鈕降溫，指的是開冷氣(air conditioner)，選 A。到外面或喝冷水他都沒提。"},

{n:26,p:3,pic:true,o:[BARS("Sci Subjects",["Bio","Physics","Chem"],[20,50,80]),BARS("Sci Subjects",["Bio","Physics","Chem"],[80,50,20]),BARS("Sci Subjects",["Bio","Physics","Chem"],[50,80,20])],a:1,sen:"Our class voted for our favorite science subject. Biology got the most votes, because students love animals and plants. Physics was in the middle, and chemistry got the fewest votes. So the biology bar should be the tallest. &nbsp;Q: Which chart shows the votes?",szh:"我們班票選最愛的科學(science)科目。生物(biology)最多票，因為學生愛動植物；物理(physics)中等；化學(chemical)最少票。所以生物長條最高。　問：哪張圖顯示票數？",en:"Biology most, chemistry least.",zh:"生物最多、化學最少，符合『Bio 最高』，選 B。"},
{n:27,p:3,pic:true,o:[BARS("Inventions",["2021","2022","2023"],[55,80,30]),BARS("Inventions",["2021","2022","2023"],[80,55,30]),BARS("Inventions",["2021","2022","2023"],[30,55,80])],a:1,sen:"Our school science club counted its inventions over three years. In 2021 the students made the most inventions, full of new ideas. In 2022 it was in the middle, and by 2023 the fewest, as members got busy. So the inventions went down each year. &nbsp;Q: Which chart shows the inventions?",szh:"我們學校科學(science)社統計三年的發明。2021 年學生發明(invent)最多，點子多；2022 年中等；到 2023 年最少，因為社員變忙。所以發明數逐年下降。　問：哪張圖顯示發明數？",en:"2021 most, 2023 fewest.",zh:"2021 最多、逐年下降，符合『2021 最高、2023 最低』，選 B。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:0,sen:"During the long science fair, the young scientists were too busy to have a real meal. There was no space near the experiments to cook noodles or steam rice. So a teacher brought fresh bread and some cheese, and everyone ate quickly before showing their next project. &nbsp;Q: What did the young scientists eat?",szh:"漫長的科學(science)展中，年輕的科學家(scientist)們忙到沒空好好吃飯。實驗旁沒有空間(space)煮麵或蒸飯。所以老師帶來新鮮麵包(bread)和一些起司(cheese)，大家在展示下一個作品前快速吃。　問：年輕科學家吃什麼？",en:"Fresh bread and cheese.",zh:"他們吃麵包(bread)配起司，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:2,
 sen:"After the senior high school team won the national science contest, everyone celebrated. The tired students were bored of the dry bread and cold rice they ate while studying. So their coach cooked a big bowl of hot noodles, and the whole team ate together with joy. &nbsp;Q: What did the coach cook to celebrate?",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 40 回　自然科學小知識　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
