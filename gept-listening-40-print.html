<script>
/* 圖形素材（第40回 自然科學小知識） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/40/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/40/p3_${n}.jpg?v=r40hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const FLASK=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q1.jpg" alt="question 1 picture">`;
const MIRROR=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q2.jpg" alt="question 2 picture">`;
const NOTEBOOK=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q3.jpg" alt="question 3 picture">`;
const SWAN=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q4.jpg" alt="question 4 picture">`;
const ROSE=`<img class="pic-img p0img" src="gept-listening-img/40/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:FLASK,o:["She is adding a blue liquid to a glass with purple liquid.","She is adding a purple liquid to a glass with blue liquid.","She is adding a purple liquid without any gloves on."],a:1,sen:"For question one, look at the picture. What is the scientist doing?",szh:"第一題，請看圖片。這位科學家在做什麼？",en:"She is adding a purple liquid to a glass with blue liquid.",zh:"科學家(scientist)手上的瓶子裝紫色液體(liquid)，正倒進下面裝著藍色液體的玻璃瓶，正確。顏色說反了：倒出來的是紫色、下面的是藍色；她戴著紫色手套，不是沒(without)戴手套。選 B"},
{n:2,p:0,fig:MIRROR,o:["She is putting something on her lips in front of a round mirror.","She is putting something on her lips in front of a square mirror.","She is brushing her hair in front of a round mirror."],a:0,sen:"For question two, look at the picture. What is the woman doing?",szh:"第二題，請看圖片。這位女士在做什麼？",en:"She is putting something on her lips in front of a round mirror.",zh:"女士對著一面圓形的鏡子(mirror)在嘴唇(lip)上擦東西，正確。鏡子是圓的，不是方的；她手上拿的是擦嘴唇的東西，不是在梳頭髮。選 A"},
{n:3,p:0,fig:NOTEBOOK,o:["A yellow pencil is next to an open notebook.","A yellow pencil is inside a pencil case with flowers on it.","Two pencils are lying on an open notebook."],a:0,sen:"For question three, look at the picture. What is on the desk?",szh:"第三題，請看圖片。桌上有什麼？",en:"A yellow pencil is next to an open notebook.",zh:"桌上有一本攤開的筆記本(notebook)，旁邊放著一支黃色鉛筆，正確。有花朵圖案的筆袋在上方，但鉛筆在筆袋外面，不是在裡面；圖中只有一支鉛筆，而且在本子旁邊，不是兩支放在本子上。選 A"},
{n:4,p:0,fig:SWAN,o:["Two white swans are swimming on a stream.","A white swan is swimming on a stream.","A white swan is standing on the grass next to a stream."],a:1,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"A white swan is swimming on a stream.",zh:"一隻白色天鵝(swan)在樹林間的小溪(stream)上游水，正確。圖中只有一隻天鵝，不是兩隻；牠是在水上游，不是站在岸邊草地上。選 B"},
{n:5,p:0,fig:ROSE,o:["There are water drops on a yellow rose.","There is a bee on an orange rose.","There are water drops on an orange rose."],a:2,sen:"For question five, look at the picture. What can you see in the picture?",szh:"第五題，請看圖片。你在圖中看到什麼？",en:"There are water drops on an orange rose.",zh:"一朵橘色(orange)玫瑰(rose)的花瓣上有很多小水珠，正確。花是橘色，不是黃色；花上只有水珠，沒有蜜蜂。選 C"},
{n:6,p:1,o:["In the main hall, last Friday.","She'll attend the meeting tomorrow.","She invented a machine that saves water."],a:2,sen:"How did Amy win the science prize?",szh:"Amy 是怎麼贏得科學獎的？",en:"She invented a machine that saves water.",zh:"問「怎麼」贏得科學(science)獎，答「她發明(invent)了一台省水的機器」才是方法。「上週五在大(main)禮堂」答的是時間地點；「她明天會參加(attend)會議」時態和內容都不對。選 C"},
{n:7,p:1,o:["Let me see. Is it serious?","Fine. I'll get you another glass.","I'll cut the cheese for you."],a:0,sen:"I cut my finger on a broken glass.",szh:"我被破掉的玻璃杯割傷了手指。",en:"Let me see. Is it serious?",zh:"對方說手指被割(cut)傷，回「我看看，嚴重(serious)嗎？」最自然。「我幫你切起司(cheese)」只是重複 cut；「好(fine)，我再拿一個杯子給你」忽略了對方受傷，以為只是杯子破了。選 A"},
{n:8,p:1,o:["I went there with my dad.","Almost every evening after dinner.","It's a big park with a stream."],a:1,sen:"How often do you go to the park?",szh:"你多常去公園？",en:"Almost every evening after dinner.",zh:"問多常(often)去公園(park)，答「幾乎每天晚餐後」才是頻率。「是一座有小溪(stream)的大公園」描述的是公園；「我和爸爸去的」答的是跟誰去，而且時態不對。選 B"},
{n:9,p:1,o:["Just one, but it's a good one.","Yes, I know the magician's son.","The magician wore a black hat."],a:0,sen:"Do you know any magic tricks?",szh:"你會變什麼魔術嗎？",en:"Just one, but it's a good one.",zh:"問會不會魔術把戲(trick)，答「只會一(one)個，但很厲害」最自然。「魔術師(magician)戴黑帽子」與問題無關；「是的，我認識魔術師的兒子」把 know 的對象換成人，答非所問。選 A"},
{n:10,p:1,o:["The furniture store opens at ten.","Yes, I'm very comfortable, thanks.","Then let's try the brown one over there."],a:2,sen:"This sofa isn't very comfortable.",szh:"這張沙發不太舒服。",en:"Then let's try the brown one over there.",zh:"對方嫌沙發不舒服(comfortable)，提議「那我們試試那邊那張棕色的」最自然。「是的，我很舒服，謝謝」和對方說的相反；「家具(furniture)店十點開」答的是時間，他們已經在店裡試坐了。選 C"},
{n:11,p:1,o:["I'll give him some advice tomorrow.","He's been our coach for two years.","To eat more. He says I'm too skinny."],a:2,sen:"What advice did the coach give you?",szh:"教練給了你什麼建議？",en:"To eat more. He says I'm too skinny.",zh:"問教練(coach)給了什麼建議(advice)，答「多吃一點，他說我太瘦(skinny)了」直接說出內容。「他當我們的教練兩年了」答的是多久；「我明天會給他建議」人物和時態都顛倒了。選 C"},
{n:12,p:1,o:["It was a lot of fun.","We'll have dinner at my grandmother's house.","On December thirty-first."],a:1,sen:"What are you doing on New Year's Eve?",szh:"跨年夜你要做什麼？",en:"We'll have dinner at my grandmother's house.",zh:"問跨年夜(eve)要做「什麼」，答「我們(we)要去奶奶家吃晚餐」才是計畫。「很好玩」是過去式，好像已經過完了；「十二月三十一日」答的是日期，跨年夜本來就是這天。選 B"},
{n:13,p:1,o:["Yes, it's working very well.","I'll call someone to fix it.","It was made in the USA."],a:1,sen:"The air conditioner isn't working again.",szh:"冷氣又壞了。",en:"I'll call someone to fix it.",zh:"對方說冷氣(air conditioner)又壞了，回「我找人來修」最自然。「它是美國(USA)製的」與壞掉無關；「是的，它運作得很好」和對方的話矛盾。選 B"},
{n:14,p:1,o:["Biology. I love learning about animals.","I'm in my second year.","It's a big school near the park."],a:0,sen:"What's your favorite subject at senior high school?",szh:"你在高中最喜歡哪一科？",en:"Biology. I love learning about animals.",zh:"問在高中(senior high school)最喜歡的科目，答「生物(biology)，我喜歡學動物的事」才是科目。「我高二」答的是年級；「那是公園旁的一所大學校」描述的是學校。選 A"},
{n:15,p:1,o:["The room is on the main floor.","Sure, you can smoke outside.","Some chemicals here can catch fire."],a:2,sen:"Why can't people smoke in this room?",szh:"為什麼這個房間不能抽菸？",en:"Some chemicals here can catch fire.",zh:"問「為什麼」不能抽菸(smoke)，答「這裡有些化學物品(chemical)會著火」是理由。「房間在一樓」答的是位置；「當然，你可以去外面抽」像是在回答「可以抽菸嗎」，沒有說原因。選 C"},
{n:16,p:2,o:["None.","Two.","Eighteen."],a:1,sen:"M: How did you do on the spelling test? &nbsp;W: I got eighteen out of twenty. &nbsp;M: Last week you got all twenty, right? &nbsp;W: Yes. This week's words were harder. &nbsp;Q: How many words did the woman spell wrong this time?",szh:"男：你拼字(spelling)考試考得怎樣？　女：二十個對十八個。　男：你上週全對，對吧？　女：對，這週的單字比較難。　問：女士這次拼錯幾個字？",en:"Two.",zh:"二十個字對了十八個，所以錯兩個。十八是答對的數目；「一個都沒錯」是上週全對的情形。選 B"},
{n:17,p:2,o:["Math.","Physics.","Biology."],a:2,sen:"M: Do we have physics this afternoon? &nbsp;W: Not today. Mr. Lin is sick, so Ms. Wu will teach biology at that time. &nbsp;M: And math? &nbsp;W: That's tomorrow, as usual. &nbsp;Q: What class will they have this afternoon?",szh:"男：我們今天下午有物理(physics)課嗎？　女：今天沒有。林老師生病了，所以那堂改由吳老師上生物(biology)。　男：那數學呢？　女：照常是明天。　問：他們今天下午上什麼課？",en:"Biology.",zh:"物理課因為林老師生病取消，那個時段改上生物(biology)。物理是原本的課；數學是明天才有。選 C"},
{n:18,p:2,o:["Twenty-four degrees.","Twenty-eight degrees.","Twenty-six degrees."],a:2,sen:"W: It's twenty-eight degrees in here. Let's turn on the air conditioner. &nbsp;M: OK. I'll set it to twenty-four. &nbsp;W: That's too cold for me. Two degrees higher, please. &nbsp;M: Fine. &nbsp;Q: What will the air conditioner be set to?",szh:"女：這裡二十八度(degree)，我們開冷氣(air conditioner)吧。　男：好，我設定二十四度。　女：那對我來說太冷了，請再高兩度。　男：好(fine)。　問：冷氣會設定在幾度？",en:"Twenty-six degrees.",zh:"男士原本設二十四度，女士要再高兩度，所以是二十六度。二十四度是被嫌太冷的設定；二十八度是現在室內的溫度。選 C"},
{n:19,p:2,o:["On Monday.","On Sunday.","On Friday."],a:1,sen:"M: How's your grandfather? He had an operation, right? &nbsp;W: Yes, last Monday. He was going to come home on Friday. &nbsp;M: Did he? &nbsp;W: No, the doctor wanted him to stay two more days. &nbsp;Q: When did the grandfather come home?",szh:"男：你爺爺還好嗎？他動了手術(operation)，對吧？　女：對，上週一開的。他原本星期五要回家。　男：那他回家了嗎？　女：沒有，醫生要他多住兩天。　問：爺爺什麼時候回家？",en:"On Sunday.",zh:"原本星期五回家，醫生要他多住兩天，所以星期日才回家。星期五是原本的計畫；星期一是動手術(operation)的日子。選 B"},
{n:20,p:2,o:["He put ice on it.","He hit it on the sink.","He washed it with hot water."],a:1,sen:"W: What happened to your lip? It looks red. &nbsp;M: I hit it on the sink when I was washing my face. &nbsp;W: Ouch! You should put some ice on it. &nbsp;M: I already did. &nbsp;Q: How did the man hurt his lip?",szh:"女：你的嘴唇(lip)怎麼了？看起來紅紅的。　男：我洗臉的時候撞到洗手台(sink)。　女：好痛！你應該冰敷一下。　男：我已經冰敷過了。　問：男士怎麼弄傷嘴唇的？",en:"He hit it on the sink.",zh:"男士洗臉時嘴唇撞到洗手台(sink)。冰敷是受傷之後的處理，不是受傷的原因；他是洗臉，沒說用熱水洗嘴唇。選 B"},
{n:21,p:2,o:["A rose.","A rabbit.","A swan."],a:2,sen:"W: Did you see the magician's show last night? &nbsp;M: Yes! He showed us an empty box. Then he closed it, and a white swan appeared from it! &nbsp;W: A swan? Last year it was a rabbit. &nbsp;M: This year, he made a rose appear from his hat, too. &nbsp;Q: What came out of the box this year?",szh:"女：你看了昨晚魔術師(magician)的表演嗎？　男：看了！他給我們看一個空箱子，蓋起來以後，一隻白天鵝(swan)就從裡面出現(appear)了！　女：天鵝？去年是兔子。　男：今年他還從帽子裡變出一朵玫瑰(rose)。　問：今年從箱子裡出來的是什麼？",en:"A swan.",zh:"今年從箱子裡出現(appear)的是白天鵝(swan)。兔子是去年的；玫瑰(rose)是從帽子裡變出來的，不是箱子。選 C"},
{n:22,p:2,o:["Into the study.","Into the living room.","Next to the new sofa."],a:0,sen:"W: Can we put the new sofa in the living room? &nbsp;M: There isn't enough space. The piano takes too much room. &nbsp;W: Then let's move the piano into the study. &nbsp;M: Good idea. Then the sofa can go where the piano was. &nbsp;Q: Where will the piano go?",szh:"女：新沙發可以放客廳嗎？　男：空間(space)不夠，鋼琴佔太多位置了。　女：那我們把鋼琴搬到書房。　男：好主意，這樣沙發就可以放在原本鋼琴的位置。　問：鋼琴會搬到哪裡？",en:"Into the study.",zh:"鋼琴要搬進書房，騰出客廳的空間(space)給沙發。客廳是新沙發要放的地方；沙發是放在鋼琴原本的位置，鋼琴不會在沙發旁邊。選 A"},
{n:23,p:2,o:["Sixteen.","Twelve.","Fifteen."],a:0,sen:"M: How many people will attend the science club party? &nbsp;W: Twelve students and three teachers. &nbsp;M: Is the principal coming, too? &nbsp;W: Yes, she said she'd come. &nbsp;Q: How many people will attend the party in total?",szh:"男：科學(science)社的派對有多少人會參加(attend)？　女：十二個學生和三位老師。　男：校長也會來嗎？　女：會，她說她會來。　問：派對總共(total)有多少人參加？",en:"Sixteen.",zh:"十二個學生加三位老師是十五人，再加上校長，總共(total)十六人。十二只算學生；十五漏了校長。選 A"},
{n:24,p:2,o:["Call Tom now.","Send Tom a message.","Go to Tom's office."],a:1,sen:"W: Dear, did you tell Tom about the party on Saturday? &nbsp;M: Oh no, I forgot. That was stupid of me. &nbsp;W: Then call him now. &nbsp;M: He's at work, and he can't answer the phone there. I'll send him a message. &nbsp;Q: What will the man do?",szh:"女：親愛的(dear)，你告訴(tell) Tom 星期六派對的事了嗎？　男：糟糕，我忘了，我真笨(stupid)。　女：那你現在打給他。　男：他在上班，上班時不能接電話。我傳訊息給他。　問：男士會做什麼？",en:"Send Tom a message.",zh:"女士叫他打電話，但 Tom 上班不能接電話，所以男士改傳訊息。打電話是女士的建議，被男士否定；Tom 在上班，但男士沒有說要去他的辦公室。選 B"},
{n:25,p:2,o:["He ran after it.","He tried to feed it.","He walked too close to its nest."],a:2,sen:"M: A big bird attacked me in the park! &nbsp;W: Really? Did you try to feed it? &nbsp;M: No. I just walked too close to its nest. It had three babies in it. &nbsp;W: Then it was only keeping them safe. &nbsp;Q: Why did the bird attack the man?",szh:"男：公園(park)裡有一隻大鳥攻擊(attack)我！　女：真的？你想餵牠嗎？　男：沒有。我只是走得離牠的鳥巢太近，裡面有三隻小鳥。　女：那牠只是在保護牠們。　問：鳥為什麼攻擊男士？",en:"He walked too close to its nest.",zh:"男士說他只是走得太靠近鳥巢，鳥為了保護小鳥才攻擊(attack)他。餵鳥是女士的猜測，被男士否定；對話沒提到他去追鳥。選 C"},
{n:26,p:3,pic:true,o:[BARS("Fair Projects",["Plants","Robots","Water"],[50,20,80]),BARS("Fair Projects",["Plants","Robots","Water"],[80,20,50]),BARS("Fair Projects",["Plants","Robots","Water"],[50,80,20])],a:0,sen:"At our school science fair, students did projects on three things: plants, robots, and water. Last year, robots were the most popular. This year, more students did plant projects than robot projects. But water projects were the most popular of all, because we often talk about saving water. &nbsp;Q: Which chart shows this year's projects?",szh:"我們學校的科學(science)展，學生的專題有三種：植物、機器人和水。去年機器人最受歡迎。今年做植物專題的學生比機器人多，但最受歡迎的是水的專題，因為我們常常(often)談到省水。　問：哪張圖是今年的專題數量？",en:"Water most, plants second, robots fewest.",zh:"今年植物比機器人多，水又是最多，所以水最高、植物第二、機器人最低。機器人最高的那張是去年的情形；植物最高的那張忽略了「水最受歡迎」。選 A"},
{n:27,p:3,pic:true,o:[BARS("What We Wore",["Pajamas","Sweater","Coat"],[30,80,55]),BARS("What We Wore",["Pajamas","Sweater","Coat"],[80,45,25]),BARS("What We Wore",["Pajamas","Sweater","Coat"],[20,50,80])],a:2,sen:"Last Friday, our science club stayed at school all night to look at the stars. Our teacher thought most of us would wear pajamas, because we were going to sleep at school. But the night was cold, so more students wore sweaters than pajamas. And even more students wore coats than sweaters. &nbsp;Q: Which chart shows what the students wore?",szh:"上週五，我們科學(science)社整晚留在學校看星星。老師以為我們大部分人會穿(wear)睡衣(pajamas)，因為我們要在學校睡覺。但那晚很冷，所以穿毛衣的學生比穿睡衣的多，而穿外套的又比穿毛衣的更多。　問：哪張圖是學生們穿的衣服？",en:"Coat most, sweater second, pajamas fewest.",zh:"穿毛衣的比穿睡衣(pajamas)的多，穿外套的又比毛衣更多，所以外套最高、毛衣第二、睡衣最低。睡衣最高的那張是老師原本的想法；毛衣最高的那張漏聽了「穿外套的比毛衣還多」。選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:1,sen:"At our school robot day, each team had to control a small robot. First, our robot had to pick up a ball, but one of its arms broke. Then we tried to make it carry a cup on its back, but the cup kept falling. In the end, it pushed a box all the way across the room. Our coach said we were very skillful, and the teachers liked our skill, too. &nbsp;Q: What did the team's robot do in the end?",szh:"在學校的機器人日，每一隊都要操控(control)一台小機器人。我們的機器人一開始要撿起一顆球，但它的一隻手臂壞了。後來我們想讓它背一個杯子，但杯子一直掉下來。最後，它把一個箱子一路推過整個房間。教練(coach)說我們很有技巧(skillful)，老師們也很欣賞我們的技術(skill)。　問：這隊的機器人最後做了什麼？",en:"It pushed a box.",zh:"撿球因為手臂壞了沒做成；背杯子因為杯子一直掉也失敗；最後是把箱子推過房間。選 B"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29c'),PH('q29b')],a:0,sen:"My uncle has a furniture factory. Last year, its main production was wooden tables. This year, he invented a sofa that can turn into a bed, and now the factory makes mostly those sofas. He also wanted to make desks, but there isn't enough space in the factory. &nbsp;Q: What does the factory mostly make this year?",szh:"我叔叔有一間家具(furniture)工廠。去年主要(main)的生產(production)是木頭桌子。今年他發明(invent)了一種可以變成床的沙發，現在工廠大多做這種沙發。他也想做書桌，但工廠沒有足夠的空間(space)。　問：工廠今年主要做什麼？",en:"Sofas that can turn into beds.",zh:"木頭桌子是去年的主要(main)產品；書桌是叔叔想做但空間(space)不夠而沒做的；今年主要做他發明(invent)的沙發床。選 A"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:0,sen:"In physics class today, our teacher showed us a simple principle. First, she put an egg into a glass of clear water, and it went down to the bottom. I thought the egg would break, but it didn't. Then she added a lot of salt to the water, and the egg slowly came up to the top. I wrote everything in my notebook. &nbsp;Q: Where was the egg at the end?",szh:"今天物理(physics)課，老師示範了一個簡單的原理(principle)。她先把一顆蛋放進一杯清水裡，蛋沉到杯底。我以為蛋會破，但沒有。接著她在水裡加了很多鹽，蛋就慢慢浮到最上面。我把一切都寫在筆記本(notebook)裡。　問：最後蛋在哪裡？",en:"At the top of the water.",zh:"蛋一開始沉在杯底，加鹽之後才慢慢浮到上面，所以最後在水面。沉在杯底是一開始的樣子；說話者以為蛋會破，但其實沒有破。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 40 回　自然科學小知識　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
