 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};

{n:3,p:0,fig:SHELF,o:["The single mother leads her son far away.","My sister's homework books are on the shelf.","The prince passes by the drugstore."],a:1,

{n:4,p:0,fig:DRUGSTORE,o:["It is a drugstore, where the lady buys protection and medicine.","The hostess serves our relatives at the wedding.","The boy uses glue for his model."],a:0,

{n:5,p:0,fig:HOUSE,o:["The policewoman gives a command to the woman.","The heroine bows to the entire crowd.","The whole family lives in their old home."],a:2,

{n:6,p:1,o:["My uncle will glue the shelf.","He will propose marriage to my sister next month.","The lady coughs quite often."],a:1,

{n:7,p:1,o:["A single lady, but she has many relatives nearby.","The machine can wash and dig.","Our son passes the far bridge."],a:0,

{n:8,p:1,o:["The prince serves the hostess.","He is jealous of the model boy.","At home, my mother and my wife do it while I cook."],a:2,

{n:9,p:1,o:["The niece does her homework.","No, my husband is not home; he went far away.","We compare two old machines."],a:1,

{n:10,p:1,o:["Thirty guests, including my uncle and niece.","The heroine leads the entire army.","The boy uses glue on the model."],a:0,

 en:"Thirty guests, uncle and niece.",zh:"問婚禮(wedding)來幾人，答『三十(thirty)位，包括我叔叔(uncle)和姪女(niece)』，選 A。heroine/lead/entire、boy/glue/model 為干擾。"},
{n:11,p:1,o:["The hostess serves cold tea.","We wash our clothes in the machine.","Yes, ma'am, the women's room is quite far, past the drugstore."],a:2,

 en:"Ma'am, the women's room is past the drugstore.",zh:"問洗手間，答『女士(ma'am)，女廁(women's room)蠻(quite)遠的，過了(pass)藥局(drugstore)』，選 C。hostess/serve、wash/machine 為干擾。"},
{n:12,p:1,o:["My old model needs new glue.","She is a policewoman, and also a super mother.","Our son bows to the prince."],a:1,

 en:"A policewoman and a super mother.",zh:"問太太(wife)的工作，答『她是女警(policewoman)，也是個超級(super)媽媽(mother)』，選 B。old/model/glue、son/bow/prince 為干擾。"},
{n:13,p:1,o:["Nineteen years old, and still in school for homework.","The lady coughs in the women's room.","We serve dinner while they wash."],a:0,

{n:14,p:1,o:["The uncle digs in the far field.","Compare our house with the model home.","Because my sister is jealous of our new niece."],a:2,

 en:"Her sister is jealous of the new niece.",zh:"問女孩為何不開心，答『因為我姊姊(sister)嫉妒(jealous)我們(our)新來的姪女(niece)』，選 C。uncle/dig/far、compare/model 為干擾。"},
{n:15,p:1,o:["The hostess bows to the woman.","I regard my parents as my best example in life.","The husband will marry the heroine."],a:1,

{n:16,p:2,o:["His wife.","His niece.","His mother."],a:0,

 szh:"女：你叔叔(uncle)旁邊那位女士(lady)是誰？　男：那是他太太(wife)，他們去年辦了婚禮(wedding)。　女：真是佳偶。　問：叔叔旁邊的女士是誰？",
 en:"His wife.",zh:"那位女士是叔叔的太太(wife)，選 A。"},
{n:17,p:2,o:["At the drugstore.","In the women's room.","At home doing homework."],a:2,

 szh:"女：你兒子(son)現在在哪？　男：他在家(home)，正忙(quite)著寫作業(homework)。　女：真是好孩子(boy)。　問：兒子在哪裡？",
 en:"At home doing homework.",zh:"兒子在家寫作業(homework)，選 C。"},
{n:18,p:2,o:["Wash the machine.","Serve as the hostess of the party.","Dig in the garden."],a:1,

 en:"Serve as the hostess.",zh:"媽媽當女主人(hostess)招待(serve)客人，選 B。"},
{n:19,p:2,o:["Because she will marry a prince.","Because she is single and free.","Because she leads far too many people."],a:0,

{n:20,p:2,o:["He will bow to the woman.","He is jealous of his cousin.","He needs glue to fix the shelf."],a:2,

 szh:"女：你兒子為什麼去藥局(drugstore)？　男：不是買藥，他需要膠水(glue)修架子(shelf)。　女：了解。　問：兒子為什麼出門？",

{n:21,p:2,o:["A super hero movie.","A review of our family history.","A model of an old house."],a:1,
 sen:"M: What are you reading, Grandma? &nbsp;W: A review of our family history, comparing the old days with now. &nbsp;M: Interesting. &nbsp;Q: What is Grandma reading?",
 szh:"男：奶奶，你在讀什麼？　女：一篇我們(our)家族歷史的回顧(review)，把過去和現在做比較(compare)。　男：真有趣。　問：奶奶在讀什麼？",
 en:"A review of family history.",zh:"奶奶在讀家族史回顧(review)，選 B。compare 比較。"},
{n:22,p:2,o:["Thirty dollars.","Nineteen dollars.","Far too much."],a:0,
 sen:"W: How much did the model cost? &nbsp;M: Thirty dollars, not nineteen as I thought. &nbsp;W: Still cheap. &nbsp;Q: How much did the model cost?",
 szh:"女：那個模型(model)多少錢？　男：三十(thirty)元，不是我以為的十九(nineteen)元。　女：還是很便宜。　問：模型多少錢？",
 en:"Thirty dollars.",zh:"模型(model)要三十(thirty)元，選 A。十九是誤以為(干擾)。"},
{n:23,p:2,o:["She will wash it.","She will marry soon.","She has a bad cough and needs protection."],a:2,
 sen:"M: Why is the woman wearing a mask? &nbsp;W: She has a bad cough, so she wears it for protection. &nbsp;M: Take care. &nbsp;Q: Why does the woman wear a mask?",
 szh:"男：那位女士(woman)為什麼戴口罩？　女：她咳嗽(cough)得厲害，戴著做防護(protection)。　男：保重。　問：女士為何戴口罩？",

 szh:"在我們(our)家，晚餐時間很規律。媽媽(mother)六點開始煮飯，這時(while)爸爸還在上班。他總是七點回到家(home)，然後全家一起吃飯。這是我一天中最愛的時光。　問：爸爸幾點回家？",

{n:27,p:3,pic:true,o:[BARS("Chores/Week",["Mom","Dad","Son"],[80,55,30]),BARS("Chores/Week",["Mom","Dad","Son"],[30,55,80]),BARS("Chores/Week",["Mom","Dad","Son"],[55,80,30])],a:1,

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 5 回　家庭生活　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
