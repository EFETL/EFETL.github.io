<script>
/* 圖形素材（第5回 家庭生活） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/5/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/5/p3_${n}.jpg?v=r5std-20261030" alt="picture ${n}">`;
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const WEDDING=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q1.jpg" alt="question 1 picture">`;
const WASHER=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q2.jpg" alt="question 2 picture">`;
const SHELF=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q3.jpg" alt="question 3 picture">`;
const HOMEWORK=`<svg width="130" height="112" viewBox="0 0 130 112"><rect x="26" y="16" width="70" height="88" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><g stroke="#bbb" stroke-width="1.5"><line x1="34" y1="34" x2="88" y2="34"/><line x1="34" y1="48" x2="88" y2="48"/><line x1="34" y1="62" x2="88" y2="62"/><line x1="34" y1="76" x2="70" y2="76"/></g><line x1="40" y1="16" x2="40" y2="104" stroke="#ff6f91" stroke-width="1.5"/><g transform="rotate(45 96 92)"><rect x="92" y="60" width="9" height="42" fill="#ffb703" stroke="#1a1a1a" stroke-width="1.5"/><path d="M92 102 l4.5 10 l4.5 -10 z" fill="#1a1a1a"/></g></svg>`;
const DRUGSTORE=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q4.jpg?v=p0fix-20261010" alt="question 4 picture">`;
const HOUSE=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:WEDDING,o:["The man and the woman are holding hands, and the guests are dancing.","The man and the woman are holding hands, and the guests are sitting.","The man and the woman are sitting with the guests."],a:1,sen:"For question one, look at the picture. Which is true about the wedding?",szh:"第一題，請看圖片。關於這場婚禮，何者正確？",en:"The man and the woman are holding hands, and the guests are sitting.",zh:"這是一場戶外婚禮(wedding)，新郎和新娘面對面站著牽手，後面的賓客都坐在椅子上觀禮，正確。賓客是坐著的，沒有在跳舞；新郎新娘是站著的，沒有和賓客坐在一起。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">LAUNDRY</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Wash</td><td style="text-align:right;font-weight:700">$20</td></tr><tr><td style="padding:4px 30px 4px 0">Dry</td><td style="text-align:right;font-weight:700">$30</td></tr><tr><td style="padding:4px 30px 4px 0">Fold</td><td style="text-align:right;font-weight:700">$10</td></tr><tr><td style="padding:4px 30px 4px 0">Iron</td><td style="text-align:right;font-weight:700">$40</td></tr></table></div>`,o:["She will have ten dollars left.","She will have forty dollars left.","She will have thirty dollars left."],a:0,sen:"For question two, look at the picture. Mom has sixty dollars. She uses the machine to wash and dry her clothes. How much will she have left?",szh:"第二題，請看圖片。媽媽有六十元。她用洗衣機(machine)洗(wash)並烘乾衣服。她還剩多少錢？",en:"She will have ten dollars left.",zh:"價目表上洗(wash)是20元、烘乾(dry)是30元，合計50元，60減50剩10元。剩四十元是只付了洗衣的錢、忘了烘乾；剩三十元是只付了烘乾的錢、忘了洗。選 A"},
{n:3,p:0,fig:SHELF,o:["A plant and a bottle of glue are on the top shelf.","A plant and a cup of pencils are on the top shelf.","A plant and a cup of pencils are on the bottom shelf."],a:1,sen:"For question three, look at the picture. Which is true about the shelf?",szh:"第三題，請看圖片。關於這個書架，何者正確？",en:"A plant and a cup of pencils are on the top shelf.",zh:"書架(shelf)最上層放著一小盆植物和一筒鉛筆，正確。最下層放的是一排書，不是植物和鉛筆；圖中沒有膠水(glue)，鉛筆筒旁邊是幾本平放的書。選 B"},
{n:4,p:0,fig:DRUGSTORE,o:["The woman in the white coat is buying some medicine.","The woman in green is buying something at a drugstore.","The woman in green is buying something at a bookstore."],a:1,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"The woman in green is buying something at a drugstore.",zh:"穿綠色毛衣的女士(woman)站在櫃台前，把要買的東西放在櫃台上，後面架子上全是藥品，這裡是藥局(drugstore)，正確。穿白袍的是站在櫃台後面的藥師，她在幫客人結帳，不是在買藥；架上都是藥，不是書店。選 B"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Housework</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">60</text><rect x="96" y="83" width="44" height="67" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="78" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="117" width="44" height="33" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="112" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="228" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="95" font-size="14" font-weight="700" text-anchor="middle">30</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Mom</text><text x="118" y="167" text-anchor="middle">Dad</text><text x="184" y="167" text-anchor="middle">Boy</text><text x="250" y="167" text-anchor="middle">Sister</text></g></svg>`,o:["They did thirty things.","They did sixty things.","They did fifty things."],a:2,sen:"For question five, look at the picture. The boy and his sister cleaned the house after dinner. How many things did they do in all?",szh:"第五題，請看圖片。男孩(boy)和他妹妹(sister)在晚餐後打掃家裡。他們一共做了幾件事？",en:"They did fifty things.",zh:"圖中男孩(boy)做了20件、妹妹(sister)做了30件，加起來50件。三十件是只算了妹妹、忘了男孩；六十件是媽媽做的，看錯了人。選 C"},
{n:6,p:1,o:["Dinner is at seven, at our house.","He cooks dinner for us every Friday.","That's super news! I hope she says yes."],a:2,sen:"My brother is going to propose to Amy at dinner tonight.",szh:"我哥哥今晚要在晚餐時向 Amy 求婚(propose)。",en:"That's super news! I hope she says yes.",zh:"對方說哥哥今晚要求婚(propose)，回「真是超棒的(super)消息！希望她答應」最自然。「晚餐七點在我們家」只接住 dinner 這個字，回答的是時間地點；「他每週五煮晚餐給我們吃」也只是重複 dinner，和求婚無關。選 C"},
{n:7,p:1,o:["She's my mother's younger sister.","Yes, and she says marriage isn't for her.","A single room for two nights, please."],a:1,sen:"Is your aunt still single?",szh:"你阿姨還是單身嗎？",en:"Yes, and she says marriage isn't for her.",zh:"問阿姨是否還單身(single)，答「是的，她說婚姻(marriage)不適合她」直接回答。「她是我媽媽(mother)的妹妹(sister)」只說她是誰，沒回答是不是單身；「單人房住兩晚」是把 single 當成「單人」的同字陷阱。選 B"},
{n:8,p:1,o:["We washed the car last Sunday.","In the machine next to the bathroom.","Either my mother or my sister."],a:2,sen:"Who usually does the washing in your family?",szh:"你們家通常是誰洗衣服？",en:"Either my mother or my sister.",zh:"問「誰」負責洗(wash)衣服，答「不是我媽媽(mother)就是我姐姐(either…or)」才是人物。「在浴室旁的洗衣機(machine)裡」答的是地點；「我們上週日洗了車」只是重複 wash，時態和內容都不對。選 C"},
{n:9,p:1,o:["He's my only son.","Then you should take him to see a doctor.","No, I don't have a cough."],a:1,sen:"My son has had a bad cough for a week.",szh:"我兒子嚴重咳嗽一個星期了。",en:"Then you should take him to see a doctor.",zh:"對方說兒子(son)咳嗽(cough)一週了，建議「那你應該帶他去看醫生」最自然。「不，我沒有咳嗽」答成自己，人物不對；「他是我唯一的兒子」重複 son，但兒子是對方的，而且沒有回應咳嗽的事。選 B"},
{n:10,p:1,o:["About thirty, only our relatives and close friends.","My sister and her new husband.","At a hotel near the beach."],a:0,sen:"How many people came to your sister's wedding?",szh:"你姐姐的婚禮來了多少人？",en:"About thirty, only our relatives and close friends.",zh:"問婚禮(wedding)來了「多少人」，答「大約三十(thirty)人，只有親戚(relative)和好朋友」是數量。「我姐姐(sister)和她的新丈夫(husband)」答的是誰；「在海邊的飯店」答的是地點。選 A"},
{n:11,p:1,o:["It's open until nine tonight.","She's in the women's room now.","Yes, ma'am. Just pass the drugstore, and it's on your left."],a:2,sen:"Excuse me, is there a women's room on this floor?",szh:"不好意思，這層樓有女廁嗎？",en:"Yes, ma'am. Just pass the drugstore, and it's on your left.",zh:"問這層樓有沒有女廁(women's room)，答「有的，女士(ma'am)，經過(pass)藥局(drugstore)就在左手邊」最完整。「營業到今晚九點」答的是時間；「她現在在女廁裡」重複 women's room，但問的不是某個人在哪裡。選 C"},
{n:12,p:1,o:["She's a policewoman, so she often works at night.","She does the dishes after dinner.","She's thirty-two years old."],a:0,sen:"What does your wife do for a living?",szh:"你太太是做什麼工作的？",en:"She's a policewoman, so she often works at night.",zh:"問妻子(wife)做什麼工作，答「她是女警(policewoman)，所以常常晚上上班」才是職業。「她晚餐後洗碗」只抓住 do 這個字，說的是家事；「她三十二歲」答的是年紀。選 A"},
{n:13,p:1,o:["She looks just like your mother.","Yes, she's my younger sister.","Maybe your mom has a reason. Why don't you ask her?"],a:2,sen:"I'm so jealous of my sister. Mom always buys her new clothes.",szh:"我好嫉妒我姐姐。媽媽總是買新衣服給她。",en:"Maybe your mom has a reason. Why don't you ask her?",zh:"對方說很嫉妒(jealous)姐姐(sister)，因為媽媽總買新衣服給她，回「也許你媽媽有她的理由，何不問問她？」是安慰加建議。「是的，她是我妹妹」把對方的姐姐說成自己的妹妹，人物不對；「她長得很像你媽媽(mother)」和對方的抱怨無關。選 C"},
{n:14,p:1,o:["She turned nineteen last week.","She looks quite old for her age.","She's in Taichung with her parents."],a:0,sen:"How old is your niece now?",szh:"你姪女現在幾歲？",en:"She turned nineteen last week.",zh:"問姪女(niece)現在幾歲(old)，答「她上週剛滿十九(nineteen)歲」是年紀。「她看起來比實際年紀成熟」只是重複 old，沒說幾歲；「她和爸媽(parent)在台中」答的是地點。選 A"},
{n:15,p:1,o:["My mom. She works hard and never gives up.","At my uncle's house last weekend.","For example, my uncle has two sons."],a:0,sen:"Who do you regard as the best example in your family?",szh:"你認為家裡誰是最好的榜樣？",en:"My mom. She works hard and never gives up.",zh:"問你把(regard)家裡的誰當成最好的榜樣(example)，答「我媽媽，她很努力又從不放棄」是人物加理由。「例如我叔叔(uncle)有兩個兒子(son)」只是重複 example，沒說是誰；「上週末在叔叔家」答的是地點和時間。選 A"},
{n:16,p:2,o:["In the women's room on this floor.","Shopping in the drugstore.","In the women's room next to the drugstore."],a:2,sen:"M: Excuse me. My wife went to the women's room on this floor a while ago, and she isn't back yet. &nbsp;W: Oh, that one is closed today, sir. Ladies have to use the one next to the drugstore. &nbsp;M: Then she must be there. Thanks. &nbsp;Q: Where is the man's wife probably?",szh:"男：不好意思，我太太(wife)一陣子(while)前去了這層樓的女廁(women's room)，還沒回來。　女：喔，先生，那間今天關閉了。女士們(lady)要用藥局(drugstore)旁邊那間。　男：那她一定在那裡。謝謝。　問：男士的太太現在可能在哪裡？",en:"In the women's room next to the drugstore.",zh:"這層樓的女廁(women's room)今天關閉，女士(lady)要改用藥局(drugstore)旁邊那間，所以太太(wife)應該在藥局旁的女廁。這層樓的女廁是關閉的那間；藥局只是用來說明位置，她不是去藥局買東西。選 C"},
{n:17,p:2,o:["Where to have dinner.","Whether their boy is studying.","A new game for their boy."],a:1,sen:"W: Where's our boy? Dinner is ready and getting cold. &nbsp;M: He's upstairs in his room. He said he has a lot of homework to do tonight. &nbsp;W: Homework? I can hear a game, not a pencil. &nbsp;M: He did the same thing last week. Let me go and check. &nbsp;Q: What are the speakers talking about?",szh:"女：我們家男孩(boy)在哪？晚餐好了，都快涼了。　男：他在樓上房間。他說今晚有很多功課(homework)要寫。　女：功課？我聽到的是電玩聲，不是鉛筆聲。　男：他上週也這樣。我去看看。　問：說話的兩個人在談什麼？",en:"Whether their boy is studying.",zh:"兩人在說男孩(boy)到底有沒有在寫功課(homework)：他說功課很多，但媽媽聽到的是電玩聲，所以主題是他有沒有在讀書。晚餐只是叫他下來的原因，沒有討論要去哪裡吃；電玩聲只是證據，沒有人說那是新買的。選 B"},
{n:18,p:2,o:["Sit with the guests.","Serve as the hostess.","Sing for the guests."],a:1,sen:"M: Is your mother going to sing at Amy's wedding? &nbsp;W: No, my aunt is. Mom will be the hostess. &nbsp;M: So she'll stand at the door and say hello to the guests? &nbsp;W: Yes, and make sure everyone has a seat. &nbsp;Q: What will the woman's mother do at the wedding?",szh:"男：你媽媽(mother)會在 Amy 的婚禮(wedding)上唱歌嗎？　女：不，是我阿姨要唱。媽媽要當女主人(hostess)。　男：所以她會站在門口跟客人打招呼？　女：對，還要確保每個人都有位子。　問：女士的媽媽在婚禮上要做什麼？",en:"Serve as the hostess.",zh:"男士以為媽媽(mother)要在婚禮(wedding)唱歌，女士更正唱歌的是阿姨，媽媽要當女主人(hostess)，在門口招呼客人。唱歌是阿姨的事；她要確保每位客人都有座位，不是自己和客人坐在一起。選 B"},
{n:19,p:2,o:["A teacher from a small town.","A model from France.","A teacher from France."],a:0,sen:"W: Did you hear? The prince is getting married next month! &nbsp;M: To that model from France? &nbsp;W: No, they stopped seeing each other last year. He's going to marry a teacher from a small town. &nbsp;Q: Who will the prince marry?",szh:"女：你聽說了嗎？王子(prince)下個月要結婚了！　男：跟那位法國模特兒(model)嗎？　女：不是，他們去年就分手了。他要娶(marry)一位小鎮來的老師。　問：王子要娶誰？",en:"A teacher from a small town.",zh:"男士猜王子(prince)要娶法國模特兒(model)，女士說他們去年就分手了，王子要娶(marry)的是一位小鎮的老師。法國模特兒是被否定的人選；老師是小鎮來的，不是法國來的。選 A"},
{n:20,p:2,o:["To see a doctor about his cough.","To buy cough medicine.","To get something to fix his shelf."],a:2,sen:"W: Why did Tom go to the drugstore? Is his cough worse? &nbsp;M: No, his cough is much better now. &nbsp;W: Then why did he go? &nbsp;M: The shelf in his room broke, and the drugstore sells glue. &nbsp;Q: Why did Tom go to the drugstore?",szh:"女：Tom 為什麼去藥局(drugstore)？他咳嗽(cough)更嚴重了嗎？　男：沒有，他咳嗽好多了。　女：那他為什麼去？　男：他房間的架子(shelf)壞了，藥局有賣膠水(glue)。　問：Tom 為什麼去藥局？",en:"To get something to fix his shelf.",zh:"Tom 的咳嗽(cough)已經好多了，他去藥局(drugstore)是因為架子(shelf)壞了，要買膠水(glue)，換句話說就是「買東西來修架子」。買咳嗽藥和看醫生都跟咳嗽有關，但男士說他咳嗽好多了，不是為了這個。選 C"},
{n:21,p:2,o:["Getting ready for a test.","Taking a test now.","Writing notes about a book."],a:0,sen:"W: Dad, can you help me for ten minutes? &nbsp;M: Is it for your test tomorrow morning? &nbsp;W: Yes. I have some notes about this book. Ask me questions, please. &nbsp;M: OK. Who is the writer of the book? &nbsp;W: I forgot. Let me review that page again. &nbsp;Q: What are the speakers doing?",szh:"女：爸，你可以幫我十分鐘嗎？　男：是為了你明天早上的考試嗎？　女：對。我有一些關於這本書的筆記。請問我問題。　男：好。這本書的作者是誰？　女：我忘了。我再複習(review)那一頁。　問：說話的兩個人在做什麼？",en:"Getting ready for a test.",zh:"女孩請爸爸拿她的筆記問問題，因為明天早上要考試，答不出來就再複習(review)那一頁，所以兩人是在為考試做準備。考試是明天才考，現在沒有在考；筆記是她已經寫好的，兩人沒有在寫筆記。選 A"},
{n:22,p:2,o:["It follows every command.","The man taught it to bow.","It doesn't come when it is called."],a:2,sen:"W: Your dog is so smart! It sat down right away. &nbsp;M: Thanks. My son taught it. It can even bow. &nbsp;W: So it follows every command? &nbsp;M: Almost. It still won't come when we call it. &nbsp;Q: What is true about the dog?",szh:"女：你的狗好聰明！牠馬上就坐下了。　男：謝謝，是我兒子(son)教的。牠甚至會鞠躬(bow)。　女：所以牠每個指令(command)都會聽？　男：差不多，但我們叫牠過來牠還是不來。　問：關於這隻狗何者正確？",en:"It doesn't come when it is called.",zh:"男士說狗幾乎什麼都會，但叫牠過來還是不來，所以「叫牠時牠不會過來」正確。教狗的是男士的兒子(son)，不是男士自己；男士回答「差不多」，表示不是每個指令(command)都聽。選 C"},
{n:23,p:2,o:["Grandma is right to wear it.","Grandma should stay away from the baby.","Grandma worries too much."],a:0,sen:"M: Why is Grandma wearing a mask? Is she sick? &nbsp;W: Not really. She has a small cough, and the baby is staying with us this week. &nbsp;M: She worries too much. It's only a cough. &nbsp;W: I don't think so. A baby needs more protection than we do. &nbsp;Q: What does the woman think about Grandma's mask?",szh:"男：奶奶為什麼戴口罩？她生病了嗎？　女：不算是。她有一點咳嗽(cough)，而且寶寶這週住在我們家。　男：她想太多了。只是咳嗽而已。　女：我不這麼想。寶寶比我們更需要保護(protection)。　問：女士覺得奶奶的口罩怎麼樣？",en:"Grandma is right to wear it.",zh:"男士覺得奶奶想太多，女士回答「我不這麼想」，還說寶寶比大人更需要保護(protection)，表示她認為奶奶戴口罩是對的。「奶奶想太多」是男士的看法；對話裡沒有人說奶奶該離寶寶遠一點。選 A"},
{n:24,p:2,o:["The whole police team.","A policewoman.","The lady doctor."],a:1,sen:"W: Who's the heroine of the movie? The lady doctor? &nbsp;M: No, a policewoman named Kate. She leads the police team. &nbsp;W: But the doctor saves the city in the last scene, right? &nbsp;M: No, the doctor only helps. It's Kate who saves it. &nbsp;Q: Who saves the city in the movie?",szh:"女：這部電影的女主角(heroine)是誰？那位女(lady)醫生嗎？　男：不是，是一位叫 Kate 的女警(policewoman)，她帶領(lead)警察小組。　女：可是最後一幕(scene)是醫生救了城市，對吧？　男：不是，醫生只是幫忙。救了城市的是 Kate。　問：電影中是誰救了城市？",en:"A policewoman.",zh:"女主角(heroine)是女警(policewoman) Kate，男士兩次更正：女醫生只是幫忙，救城市的是 Kate。女(lady)醫生是女士猜錯的；Kate 是帶領(lead)小組的人，但男士明說救城市的是 Kate，不是整個小組。選 B"},
{n:25,p:2,o:["Nineteen.","Twenty-two.","Sixteen."],a:2,sen:"M: Your niece looks quite young. How old is she? &nbsp;W: Nineteen. She's in college now. &nbsp;M: And her brother is older, right? &nbsp;W: No, he's three years younger than her. &nbsp;Q: How old is the niece's brother?",szh:"男：你姪女(niece)看起來相當(quite)年輕。她幾歲(old)？　女：十九(nineteen)歲，現在讀大學。　男：那她弟弟比較大，對吧？　女：不，他比她小三歲。　問：姪女的弟弟幾歲？",en:"Sixteen.",zh:"姪女(niece)十九(nineteen)歲，弟弟比她小三歲，十九減三是十六歲。十九是姪女的年紀；二十二是誤以為弟弟比較大、把三歲加上去。選 C"},
{n:26,p:3,pic:true,o:[BARS("Visits to Grandma",["Uncle","Aunt","Mom"],[40,20,70]),BARS("Visits to Grandma",["Uncle","Aunt","Mom"],[20,40,70]),BARS("Visits to Grandma",["Uncle","Aunt","Mom"],[70,20,40])],a:0,sen:"My grandma lives quite far from the city, so her children take turns visiting her. Last year, my uncle visited her the most. This year, however, he moved to another city for work, so now he visits less often than my mom. My aunt is still the one who visits the least, but she calls Grandma every night. &nbsp;Q: Which chart compares their visits this year?",szh:"我奶奶住得離城市相當(quite)遠(far)，所以她的孩子們輪流去看她。去年我叔叔(uncle)去得最多。不過今年他為了工作搬到另一個城市，所以現在去的次數比我媽媽少。我阿姨仍然是去得最少的，但她每天晚上都打電話給奶奶。　問：哪張圖比較(compare)了今年的探望次數？",en:"Mom most, uncle second, aunt least.",zh:"今年叔叔(uncle)去的次數比媽媽少，阿姨仍然最少，所以媽媽最高、叔叔第二、阿姨最低。叔叔最高的那張是去年的情形；阿姨排第二的那張和「阿姨仍然最少」相反。選 A"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27b'),PH('q27a')],a:1,sen:"At my sister's wedding last Saturday, everyone in our family had a job. My father planned to take pictures, but he left his camera at home. So my uncle took the pictures, and my father served drinks to the guests all night. My mother was the hostess, so she said hello to everyone at the door. &nbsp;Q: What did the speaker's father do at the wedding?",szh:"上週六我姐姐(sister)的婚禮(wedding)上，我們家每個人都有工作。我爸爸本來要拍照，但他把相機忘在家裡，所以由叔叔(uncle)拍照，爸爸整晚為客人送上(serve)飲料。我媽媽(mother)是女主人(hostess)，所以她在門口跟每個人打招呼。　問：說話者的爸爸在婚禮上做了什麼？",en:"He served drinks to the guests.",zh:"爸爸本來要拍照，但相機忘在家，改由叔叔(uncle)拍；爸爸整晚幫客人送(serve)飲料。拍照是原本的計畫，後來換成叔叔做；在門口招呼客人的是當女主人(hostess)的媽媽。選 B"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28c'),PH('q28b')],a:1,sen:"For Mother's Day, my sister and I wanted to buy Mom a new washing machine, because our old one is very loud. But it cost too much. Then we thought about a new shelf for her books, but Dad made one for her last month. In the end, we cooked a big dinner for her, and Mom said it was the best gift ever. &nbsp;Q: What did the speaker and the sister give their mother?",szh:"母親節時，我和姐姐(sister)想買一台新洗衣機(machine)給媽媽，因為我們的舊(old)洗衣機很吵。但是太貴了。後來我們想送她一個放書的新架子(shelf)，可是爸爸上個月已經做了一個給她。最後我們為她煮了一頓豐盛的晚餐，媽媽說那是最棒的禮物。　問：說話者和姐姐送了媽媽什麼？",en:"They cooked a big dinner for her.",zh:"新洗衣機(machine)太貴，放棄；新書架(shelf)爸爸上個月已經做了，也不用買；最後是煮一頓大餐給媽媽。洗衣機和書架都是被否定的想法，要聽到 In the end 之後的內容。選 B"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29c'),PH('q29b')],a:2,sen:"My niece Lily is ten. Her parents both work late, so she comes to our house after school. She used to watch TV first and do her homework at night. But now my mother makes her finish her homework right away. After that, she can play with our dog in the yard until dinner. &nbsp;Q: What does Lily do first after school now?",szh:"我姪女(niece) Lily 十歲。她的父母(parent)都工作到很晚，所以她放學後來我們家。她以前會先看電視，晚上才寫功課(homework)。但現在我媽媽(mother)要她一到就先把功課寫完，之後她才可以在院子裡和我們的狗玩到晚餐。　問：Lily 現在放學後先做什麼？",en:"She does her homework first.",zh:"先看電視是 Lily「以前」的習慣；現在說話者的媽媽(mother)，也就是 Lily 的奶奶，要她一到就先寫功課(homework)；和狗玩是寫完功課「之後」才可以做的事。選 C"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:0,sen:"Last summer our entire family went to the beach. My son wanted to swim, but the water was too cold. My husband wanted to sleep under a big umbrella, but our son pulled him up to play. In the end, the two of them dug a big hole in the sand, while I took pictures of the scene. &nbsp;Q: What did the speaker's husband and son do at the beach?",szh:"去年夏天我們全(entire)家去海邊。我兒子(son)想游泳，但海水太冷。我先生(husband)想在大陽傘下睡覺，但兒子把他拉起來一起玩。最後他們兩個在沙灘上挖(dig)了一個大洞，而(while)我在一旁拍下這一幕(scene)。　問：說話者的先生和兒子在海邊做了什麼？",en:"They dug a big hole in the sand.",zh:"游泳是兒子(son)想做但水太冷沒做成；先生(husband)想在傘下睡覺，卻被兒子拉起來；最後兩人一起在沙灘上挖(dig)大洞。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 5 回　家庭生活　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);

<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
