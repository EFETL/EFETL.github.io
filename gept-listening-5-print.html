<script>
/* 圖形素材（第5回 家庭生活） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/5/${n}.jpg" alt="${n}">`;
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const WEDDING=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q1.jpg" alt="question 1 picture">`;
const WASHER=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q2.jpg" alt="question 2 picture">`;
const SHELF=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q3.jpg" alt="question 3 picture">`;
const HOMEWORK=`<svg width="130" height="112" viewBox="0 0 130 112"><rect x="26" y="16" width="70" height="88" rx="4" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><g stroke="#bbb" stroke-width="1.5"><line x1="34" y1="34" x2="88" y2="34"/><line x1="34" y1="48" x2="88" y2="48"/><line x1="34" y1="62" x2="88" y2="62"/><line x1="34" y1="76" x2="70" y2="76"/></g><line x1="40" y1="16" x2="40" y2="104" stroke="#ff6f91" stroke-width="1.5"/><g transform="rotate(45 96 92)"><rect x="92" y="60" width="9" height="42" fill="#ffb703" stroke="#1a1a1a" stroke-width="1.5"/><path d="M92 102 l4.5 10 l4.5 -10 z" fill="#1a1a1a"/></g></svg>`;
const DRUGSTORE=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q4.jpg" alt="question 4 picture">`;
const HOUSE=`<img class="pic-img p0img" src="gept-listening-img/5/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:WEDDING,o:["At the wedding, the man marries his wife.","At the party, the man dances with his niece.","At the airport, the man waves to his wife."],a:0,sen:"For question one, look at the picture. What does the picture show?",szh:"第一題，請看圖片。這張圖顯示什麼？",en:"A wedding; the man marries his wife.",zh:"婚禮(wedding)上男士娶(marry)他的太太(wife)，選 A。B 是在派對跟姪女(niece)跳舞、C 是在機場揮手，場合都不同。"},
{n:2,p:0,fig:WASHER,o:["It is a machine for washing clothes.","It is a machine for making coffee.","It is a machine for cutting paper."],a:0,sen:"For question two, look at the picture. What is the machine for?",szh:"第二題，請看圖片。這台機器是做什麼用的？",en:"A machine for washing clothes.",zh:"這是洗(wash)衣服用的機器(machine)，選 A。煮咖啡和切紙的機器用途都不同。"},
{n:3,p:0,fig:SHELF,o:["My brother's model cars are on the shelf.","My sister's homework books are on the shelf.","A bottle of glue is on the shelf."],a:1,sen:"For question three, look at the picture. What is on the shelf?",szh:"第三題，請看圖片。架子上有什麼？",en:"Homework books are on the shelf.",zh:"我姊姊(sister)的作業(homework)書放在架子(shelf)上，選 B。A 的模型車(model)和 C 的膠水(glue)都不是圖中架上的東西。"},
{n:4,p:0,fig:DRUGSTORE,o:["It is a bookstore where people buy comic books.","It is a drugstore where people buy medicine.","It is a bakery where people buy bread."],a:1,sen:"For question four, look at the picture. What kind of store is this?",szh:"第四題，請看圖片。這是什麼商店？",en:"A drugstore selling medicine.",zh:"這是藥局(drugstore)，人們在這裡買藥，選 B。書店和麵包店賣的東西都不同。"},
{n:5,p:0,fig:HOUSE,o:["The whole family eats at a new restaurant.","The whole family rides in a small car.","The whole family lives in their old home."],a:2,sen:"For question five, look at the picture. What does the picture show?",szh:"第五題，請看圖片。這張圖顯示什麼？",en:"The family lives in their old home.",zh:"一家人住在他們的老(old)家裡，選 C。在餐廳吃飯或坐車都不是圖中的情景。"},

{n:6,p:1,o:["At seven o'clock, at our house.","He's going to propose to his girlfriend.","He cooks dinner for us on Fridays."],a:1,sen:"Why is your brother so nervous about the dinner?",szh:"你哥哥為什麼對這頓晚餐這麼緊張？",en:"He is going to propose to his girlfriend.",zh:"問哥哥為何緊張，答『他要向女朋友求婚(propose)』，選 B。A 回答時間地點、C 講他煮飯，都不是原因。"},
{n:7,p:1,o:["She's single, not ready for marriage.","At the shopping mall near here.","My aunt lives far from here."],a:0,sen:"Is your aunt married or single?",szh:"你阿姨結婚了還是單身？",en:"She is single and not ready for marriage.",zh:"問阿姨已婚還是單身，答『還是單身(single)，還沒準備好結婚(marriage)』，選 A。B 回答地點、C 說她住得很遠(far)，都沒回答。"},
{n:8,p:1,o:["In the bathroom, I think.","We wash the car every Sunday.","Either my mother or my sister."],a:2,sen:"Who does the washing in your family?",szh:"你家是誰洗衣服？",en:"Either my mother or my sister.",zh:"問誰洗衣服，答『我媽媽或我姊姊其中一個(either)』，選 C。A 回答地點、B 講洗車，都沒回答是誰。"},
{n:9,p:1,o:["No, he's still at the office.","He is thirty-five years old.","Our home is quite small, I think."],a:0,sen:"Is your husband at home now?",szh:"你先生現在在家嗎？",en:"No, he is still at the office.",zh:"問先生(husband)是否在家，答『不，他還在辦公室』，選 A。B 回答年齡、C 講家很小(quite)，都沒回答在不在。"},
{n:10,p:1,o:["At the Grand Hotel in Taipei.","About thirty, including all our relatives.","The wedding cake was delicious."],a:1,sen:"How many people came to the wedding?",szh:"有多少人來參加婚禮？",en:"About thirty, including relatives.",zh:"問婚禮(wedding)來幾人，答『大約三十(thirty)人，包括親戚(relative)』，選 B。A 回答地點、C 評論蛋糕，都沒回答人數。"},
{n:11,p:1,o:["My uncle lives nearby, too.","It's open until nine tonight.","Yes, ma'am. Just pass the drugstore."],a:2,sen:"Excuse me, is the restroom nearby?",szh:"不好意思，洗手間在附近嗎？",en:"Yes, ma'am, it is past the drugstore.",zh:"問洗手間在不在附近，答『是的，女士(ma'am)，經過(pass)藥局(drugstore)就到了』，選 C。A 說叔叔(uncle)住附近、B 說營業時間，都沒回答位置。"},
{n:12,p:1,o:["She is thirty-two years old.","She's a policewoman in Taipei.","I do the dishes after dinner."],a:1,sen:"What does your wife do for a living?",szh:"你太太做什麼工作？",en:"She is a policewoman.",zh:"問太太(wife)的工作，答『她是台北的女警(policewoman)』，選 B。A 回答年齡、C 講洗碗，都不是工作。"},
{n:13,p:1,o:["He's in the third grade now.","He turned nineteen last week.","Our old house is on Pine Road."],a:1,sen:"How old is your elder son now?",szh:"你大兒子現在幾歲？",en:"He turned nineteen last week.",zh:"問兒子(son)幾歲，答『他上週剛滿十九(nineteen)歲』，選 B。A 回答年級、C 講老(old)房子位置，都不是年齡。"},
{n:14,p:1,o:["She's jealous of her sister's gift.","On the second floor, I think.","She looks just like her mother."],a:0,sen:"Why does the little girl look upset?",szh:"小女孩為什麼看起來不高興？",en:"She is jealous of her sister's gift.",zh:"問女孩為何不高興，答『她嫉妒(jealous)姊姊的禮物』，選 A。B 回答地點、C 講長相，都不是原因。"},
{n:15,p:1,o:["At the bus stop near school.","I always look up at the stars.","My parents. They're a great example."],a:2,sen:"Who do you look up to the most?",szh:"你最崇拜誰？",en:"My parents; they are a great example.",zh:"問最崇拜誰，答『我的父母(parent)，他們是很好的榜樣(example)』，選 C。A 回答地點、B 重複 look up 但在講看星星，都沒回答。"},

{n:16,p:2,o:["At the drugstore.","At the bus stop.","In the women's room."],a:2,sen:"M: Excuse me, I am looking for my wife. She went to the women's room a while ago. &nbsp;W: I will go and check for you, sir. &nbsp;Q: Where is the man's wife?",szh:"男：不好意思，我在找我太太。她剛才去了女廁(women's room)。　女：先生，我去幫您看看。　問：男士的太太在哪裡？",en:"She went to the women's room a while ago.",zh:"太太不久前去了女廁(women's room)，選 C。藥局和公車站都沒有提到。"},
{n:17,p:2,o:["At home doing homework.","At the drugstore.","At his uncle's house."],a:0,sen:"W: Where is your son now? &nbsp;M: He is at home, quite busy doing his homework. &nbsp;W: A good boy. &nbsp;Q: Where is the son?",szh:"女：你兒子(son)現在在哪？　男：他在家(home)，正忙(quite)著寫作業(homework)。　女：真是好孩子(boy)。　問：兒子在哪裡？",en:"At home doing homework.",zh:"兒子在家寫作業(homework)，選 A。"},
{n:18,p:2,o:["She serves as the hostess.","She plays music for guests.","She takes pictures of guests."],a:0,sen:"M: What will your mother do at the wedding? &nbsp;W: She will greet each guest at the door and make sure everyone has a seat and a drink. &nbsp;M: That is a big job. &nbsp;Q: What is the mother's job at the wedding?",szh:"男：你媽媽在婚禮上要做什麼？　女：她要在門口迎接每位客人，確認大家都有座位和飲料。　男：那是個大工作。　問：媽媽在婚禮上的工作是什麼？",en:"She welcomes and takes care of guests — she is the hostess.",zh:"她迎接客人、確認大家有座位和飲料，是在當女主人(hostess)招待(serve)客人，選 A。放音樂和拍照都沒提到。"},
{n:19,p:2,o:["Visit a school.","Start a new job.","Marry a local woman."],a:2,sen:"W: Did you see the news? The prince will have his wedding next week! &nbsp;M: Really? Who is the lucky lady? &nbsp;W: A teacher from our town. &nbsp;Q: What will the prince do next week?",szh:"女：你看新聞了嗎？王子下週要舉行婚禮！　男：真的嗎？幸運的小姐是誰？　女：我們鎮上的一位老師。　問：王子下週要做什麼？",en:"He is having his wedding — he will marry a local woman.",zh:"王子下週舉行婚禮，也就是要娶(marry)鎮上的一位女子(woman)，選 C。老師是新娘的職業，王子不是要去學校。"},
{n:20,p:2,o:["To buy some cold medicine.","To meet his teacher after school.","To get glue for the shelf."],a:2,sen:"W: Why did your son go to the drugstore? &nbsp;M: Not for medicine; he needs glue to fix the shelf. &nbsp;W: I see. &nbsp;Q: Why did the son go out?",szh:"女：你兒子為什麼去藥局(drugstore)？　男：不是買藥，他需要膠水(glue)修架子(shelf)。　女：了解。　問：兒子為什麼出門？",en:"He needs glue to fix the shelf.",zh:"兒子要膠水(glue)修架子(shelf)，選 C。他不是去買藥。"},
{n:21,p:2,o:["Review her lessons.","Watch a movie.","Go to bed early."],a:0,sen:"W: I have an English test tomorrow, but I am so tired. &nbsp;M: Look at your notes again before bed. Then you will remember more. &nbsp;W: You are right. &nbsp;Q: What will the woman do tonight?",szh:"女：我明天有英文考試，但我好累。　男：睡前再看一次筆記，你就會記得更多。　女：你說得對。　問：女士今晚會做什麼？",en:"She will look at her notes again — she will review.",zh:"男士建議睡前再看筆記，女士同意，所以她會複習(review)功課，選 A。她要睡前複習，不是早睡(C)。"},
{n:22,p:2,o:["It is very sleepy.","It followed a command.","It saw a cat."],a:1,sen:"W: Why is that dog sitting so still? &nbsp;M: Because its owner just said, 'Sit!' and showed it a treat. &nbsp;W: Wow, how clever! The dog listens so well. &nbsp;Q: Why is the dog sitting still?",szh:"女：那隻狗為什麼坐得那麼不動？　男：因為主人剛說了『坐下！』還給牠看點心。　女：哇，好聰明！牠很聽話。　問：狗為什麼坐著不動？",en:"Its owner said 'Sit!' — it followed a command.",zh:"主人說『坐下』，狗照做，是聽從了命令(command)，選 B。牠不是想睡，也沒看到貓。"},
{n:23,p:2,o:["To look pretty.","To stop the wind.","To give her family protection."],a:2,sen:"W: Why is Mom wearing a mask at home? &nbsp;M: She has a bad cough, and she does not want us to get sick. &nbsp;W: That is kind of her. &nbsp;Q: Why is she wearing a mask?",szh:"女：媽媽為什麼在家戴口罩？　男：她咳嗽(cough)很厲害，不想讓我們生病。　女：她真貼心。　問：她為什麼戴口罩？",en:"She does not want the family to get sick — for their protection.",zh:"她怕傳染給家人，戴口罩是為了保護(protection)家人，選 C。不是為了好看或擋風。"},
{n:24,p:2,o:["The heroine does.","The prince does.","The policewoman does."],a:0,sen:"W: In this movie, who saves the whole city? &nbsp;M: The heroine does; she leads the people bravely. &nbsp;W: What a hero. &nbsp;Q: Who saves the city?",szh:"女：這部電影裡誰拯救了整座城市？　男：女主角(heroine)，她勇敢地帶領(lead)人民。　女：真英雄。　問：誰拯救了城市？",en:"The heroine leads and saves it.",zh:"女主角(heroine)帶領(lead)人民拯救城市，選 A。王子和女警都沒有提到。"},
{n:25,p:2,o:["They dropped something.","They wanted to be polite.","They were very sleepy."],a:1,sen:"M: Why did the children bow to the teacher? &nbsp;W: In some countries, it is a polite way to say hello. &nbsp;M: I see. I like that. &nbsp;Q: Why did the children bow?",szh:"男：孩子們為什麼向老師鞠躬？　女：在某些國家，這是有禮貌的打招呼方式。　男：我懂了，我喜歡這樣。　問：孩子們為什麼鞠躬(bow)？",en:"Bowing is a polite way to say hello.",zh:"鞠躬(bow)是有禮貌的打招呼方式，選 B。他們不是掉東西或想睡。"},

{n:26,p:3,pic:true,o:[CLK(7,30),CLK(7,0),CLK(6,30)],a:1,sen:"In our family, dinner time is very regular. My mother starts cooking at six, while my father is still at work. He always comes home at seven o'clock, and then the whole family eats together. I regard it as the best part of the day. &nbsp;Q: What time does the father come home?",szh:"在我們(our)家，晚餐時間很規律。媽媽(mother)六點開始煮飯，這時(while)爸爸還在上班。他總是七點回到家(home)，然後全家一起吃飯。我把這段時間視為(regard)一天中最棒的時光。　問：爸爸幾點回家？",en:"Father comes home at seven.",zh:"爸爸七點回家，選 B(7:00)。六點半是媽媽開始煮飯(干擾)。"},
{n:27,p:3,pic:true,o:[BARS("Chores/Week",["Mom","Dad","Son"],[55,80,30]),BARS("Chores/Week",["Mom","Dad","Son"],[80,55,30]),BARS("Chores/Week",["Mom","Dad","Son"],[30,55,80])],a:2,sen:"Our family shares the housework, and we made a chart to compare it. My young son does the most chores now, because he wants to help. My father does the middle amount, and my mother, who used to do everything, now does the least. &nbsp;Q: Which chart compares our chores correctly?",szh:"我們(our)家分擔家事，還做了張圖來比較(compare)。我年幼的兒子(son)現在做最多，因為他想幫忙；爸爸中等；以前包辦一切的媽媽(mother)現在做最少。　問：哪張圖正確比較我們的家事？",en:"Son most, mother least.",zh:"兒子最多、媽媽最少，符合『Son 最高、Mom 最低』的圖，選 C。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('bread'),IMG('noodles')],a:1,
 sen:"Every Sunday my grandmother, the hostess of our home, cooks for the entire family. She does not make noodles or rice on that day. Instead, she bakes fresh bread, and its warm smell fills the house while we all wait around the table. &nbsp;Q: What does the grandmother make on Sunday?",
 szh:"每個星期天，身為我們家女主人(hostess)的奶奶會為全(entire)家人做飯。那天她不做麵或飯，而是烤新鮮麵包(bread)，溫暖的香味充滿整個家，我們(while 當…時)全圍在餐桌旁等。　問：奶奶星期天做什麼？",
 en:"Fresh bread.",zh:"奶奶做麵包(bread)，選 B。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[CLK(8,30),CLK(8,15),CLK(9,0)],a:0,
 sen:"On weekdays my niece has a strict routine for her homework. She gets home in the afternoon, plays for a while, and starts her homework at eight thirty in the evening. She always finishes before nine, then goes to bed. &nbsp;Q: What time does the niece start her homework?",
 szh:"平日我姪女(niece)寫作業(homework)有嚴格的作息。她下午到家(in 進到)，先玩一會兒(while)，晚上八點半開始寫作業。她總在九點前寫完，然後上床。　問：姪女幾點開始寫作業？",
 en:"At eight thirty.",zh:"姪女八點半開始寫作業，選 A(8:30)。九點是寫完時間(干擾)。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('park'),IMG('beach')],a:2,sen:"Last summer our entire family took a trip together. My parents wanted to climb the mountain, and my sister wanted the park. But in the end, my father decided to lead us all to the beach, where my son and my niece love to dig in the sand for hours. The beach scene was beautiful. It was a super holiday. &nbsp;Q: Where did the family finally go?",szh:"去年夏天我們(our)全(entire)家一起旅行。父母(parent)想爬山，姊姊(sister)想去公園，但最後爸爸決定帶領(lead)大家去海邊(beach)，我兒子(son)和姪女(niece)最愛在沙灘挖(dig)沙好幾個小時。海邊的景色(scene)很美。真是超讚(super)的假期。　問：這家人最後去了哪裡？",en:"The beach.",zh:"一家人最後去海邊(beach)，選 C。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 5 回　家庭生活　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}

<script>
/* ================= ✏️ 老師手寫 =================

(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}

  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}

  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}

    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}

  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}

    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};

  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}

  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';

  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}

  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));

    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});

  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
