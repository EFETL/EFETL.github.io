<div class="bar">
 <b>🖨 第 20 回　房屋與房間　聽力測驗　列印版</b>

<div id="root"></div>
<script>
/* 圖形素材（第20回 房屋與房間） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/20/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/20/p3_${n}.jpg?v=r20q27ph-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const BUILDING=`<img class="pic-img p0img" src="gept-listening-img/20/p0_q1.jpg" alt="question 1 picture">`;
const DOOR=`<img class="pic-img p0img" src="gept-listening-img/20/p0_q2.jpg" alt="question 2 picture">`;
const WINDOW=`<img class="pic-img p0img" src="gept-listening-img/20/p0_q3.jpg" alt="question 3 picture">`;
const STAIRS=`<img class="pic-img p0img" src="gept-listening-img/20/p0_q4.jpg" alt="question 4 picture">`;
const ROOFHOUSE=`<img class="pic-img p0img" src="gept-listening-img/20/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:BUILDING,o:["There are trees in front of a short building with two floors.","There are trees in front of a tall apartment building.","There are trees on the roof of a tall apartment building."],a:1,sen:"For question one, look at the picture. Which is true about the picture?",szh:"第一題，請看圖片。關於這張圖，何者正確？",en:"There are trees in front of a tall apartment building.",zh:"圖中是一棟很多層樓(floor)的高公寓(apartment)大樓(building)，樹種在大樓前面，正確。樹不在屋頂(roof)上；大樓很高，不是只有兩層樓的矮房子。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">HOME STORE</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Door</td><td style="text-align:right;font-weight:700">$500</td></tr><tr><td style="padding:4px 30px 4px 0">Curtain</td><td style="text-align:right;font-weight:700">$250</td></tr><tr><td style="padding:4px 30px 4px 0">Lamp</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Chair</td><td style="text-align:right;font-weight:700">$300</td></tr></table></div>`,o:["He will have one hundred fifty dollars left.","He will have seven hundred fifty dollars left.","He will have four hundred dollars left."],a:0,sen:"For question two, look at the picture. Ken has nine hundred dollars. He buys a door and a curtain. How much will he have left?",szh:"第二題，請看圖片。肯有九百元。他買了一扇門和一組窗簾。他還剩多少錢？",en:"He will have one hundred fifty dollars left.",zh:"價目表上門(door)500元、窗簾(curtain)250元，一共750元，900減750剩150元。750元是花掉的錢，不是剩下的；400元是只買了門、忘記窗簾。選 A"},
{n:3,p:0,fig:WINDOW,o:["A plant is standing on the bed next to the curtain.","A plant is standing on the floor next to the curtain.","A lamp is standing on the floor next to the curtain."],a:1,sen:"For question three, look at the picture. Which is true about the bedroom?",szh:"第三題，請看圖片。關於這間臥室，何者正確？",en:"A plant is standing on the floor next to the curtain.",zh:"臥室(bedroom)左邊窗簾(curtain)旁的地板(floor)上有一盆植物，正確。植物不在床上；檯燈是放在床邊的小桌上，不是在地板上。選 B"},
{n:4,p:0,fig:STAIRS,o:["It is at the bottom of the stairs.","It is at the top of the stairs.","It is on the wall next to the stairs."],a:1,sen:"For question four, look at the picture. Where is the plant?",szh:"第四題，請看圖片。植物在哪裡？",en:"It is at the top of the stairs.",zh:"從樓梯(stair)往上看，植物放在樓梯最上面，正確。它不在樓梯底部(bottom)；牆(wall)上只有扶手，沒有植物。選 B"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Flats Sold</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="96" y="75" width="44" height="75" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="70" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">North</text><text x="118" y="167" text-anchor="middle">East</text><text x="184" y="167" text-anchor="middle">West</text></g></svg>`,o:["They sold sixty flats.","They sold seventy flats.","They sold forty flats."],a:0,sen:"For question five, look at the picture. The North block and the West block sold flats this year. How many flats did they sell in all?",szh:"第五題，請看圖片。北區大樓和西區大樓今年賣出了一些小公寓。他們一共賣了多少間？",en:"They sold sixty flats.",zh:"圖中北區大樓(block)賣40間、西區賣20間小公寓(flat)，加起來60間。70是北區加東區的總數，看錯了項目；40是只算了北區。選 A"},
{n:6,p:1,o:["After lunch, I think.","Let's continue from the bottom of page forty.","Chapter two was very interesting."],a:1,sen:"Which page should we start on today?",szh:"我們今天應該從哪一頁開始？",en:"Let's continue from the bottom of page forty.",zh:"問從「哪一頁(page)」開始，答「從第四十頁下面(bottom)繼續(continue)」正確。「午餐後」答的是時間；「第二章(chapter)很有趣(interest)」說的是過去的感想，沒回答哪一頁。選 B"},
{n:7,p:1,o:["I didn't make a mistake on the test.","It's raining, so take an umbrella.","That's OK. Ours look the same."],a:2,sen:"Sorry, I took your umbrella by mistake.",szh:"抱歉(sorry)，我不小心(mistake)拿錯了你的雨傘。",en:"That's OK. Ours look the same.",zh:"對方道歉(sorry)拿錯(mistake)傘，回「沒關係，我們的傘長得一樣」最自然。「下雨了，帶把傘吧」只是重複 umbrella；「我考試沒有出錯」只是重複 mistake。選 C"},
{n:8,p:1,o:["I wouldn't. It's been there since last Friday.","The microwave is next to the window.","Yes, I'd rather eat pizza than rice."],a:0,sen:"Is this pizza still good to eat?",szh:"這個披薩(pizza)還能(good)吃嗎？",en:"I wouldn't. It's been there since last Friday.",zh:"問披薩(pizza)還能不能吃，答「我不會吃，它從上週五就放在那裡了」是間接說不能吃。「是的，我寧願(rather)吃披薩不吃飯」答的是喜好；「微波爐(microwave)在窗戶旁邊」答的是地點。選 A"},
{n:9,p:1,o:["Yes, the chopsticks are next to the napkins.","Then don't worry. I'll get you a fork.","Sure, I'll use them after you."],a:1,sen:"I can't use chopsticks very well.",szh:"我不太會用筷子(chopstick)。",en:"Then don't worry. I'll get you a fork.",zh:"對方說不太會用筷子(chopstick)，回「別擔心，我拿叉子給你」最貼心自然。「筷子在餐巾紙(napkin)旁邊」答的是位置，對方沒問；「好啊，你用完我再用」像在借筷子，答非所問。選 B"},
{n:10,p:1,o:["I read the news on page two.","He's a fisherman in our town.","Yes, they found him alive this afternoon."],a:2,sen:"Is there any news about the lost fisherman?",szh:"那位失蹤的漁夫(fisherman)有任何消息嗎？",en:"Yes, they found him alive this afternoon.",zh:"問失蹤漁夫(fisherman)的消息，答「有，今天下午(afternoon)找到他了，還活著(alive)」正確。「他是我們鎮(town)上的漁夫」答的是他是誰；「我在第二頁(page)讀到新聞」重複 news，沒說消息內容。選 C"},
{n:11,p:1,o:["Which one are you more interested in?","The music room is on the second floor.","Yes, I joined it last year."],a:0,sen:"Should I join the art club or the music club?",szh:"我應該參加(join)美術社還是音樂社？",en:"Which one are you more interested in?",zh:"對方問選哪個社團，反問「你對哪一個比較有興趣(interest)？」幫他想，最自然。選擇疑問句不能用 Yes 回答，而且「我去年參加(join)了」答的是自己；「音樂教室在二樓(floor)」答的是地點。選 A"},
{n:12,p:1,o:["Sorry, I don't have any keys.","Don't worry. I'll leave my keys at home.","Hurry! Go back and get them before someone takes them."],a:2,sen:"I just realized I left my keys in the men's room.",szh:"我剛發現(realize)我把鑰匙忘在男廁(men's room)了。",en:"Hurry! Go back and get them before someone takes them.",zh:"對方發現(realize)鑰匙忘在男廁(men's room)，回「快(hurry)回去拿，免得被人拿走」最自然。「抱歉，我沒有鑰匙」對方沒跟你借；「我會把鑰匙留在家」只是重複 keys、leave，跟對方的問題無關。選 C"},
{n:13,p:1,o:["No, but it's only a ten-minute walk.","Yes, I mailed a letter there.","It's two blocks from my house."],a:0,sen:"Is there a direct bus to the post office?",szh:"有直達(direct)郵局(post office)的公車嗎？",en:"No, but it's only a ten-minute walk.",zh:"問有沒有直達(direct)公車，答「沒有，不過走路只要十分鐘」正確又貼心。「離我家兩個街區(block)」說的是離「我家」多遠，沒回答公車；「有，我在那裡寄過信」的 Yes 後面接的是寄信，答非所問。選 A"},
{n:14,p:1,o:["He lost the game, so he's a loser.","He dreamed about a queen last night.","I'm sure he will. He's very determined."],a:2,sen:"Do you think he'll achieve his dream?",szh:"你覺得他會實現(achieve)他的夢想嗎？",en:"I'm sure he will. He's very determined.",zh:"問他會不會實現(achieve)夢想，答「一定會，他非常有決心(determine)」正確。「他昨晚夢到女王(queen)」把 dream 當成睡覺做夢，是同字陷阱；「他輸了比賽，所以是輸家(loser)」沒回答夢想的問題。選 C"},
{n:15,p:1,o:["Did you check behind the dryer? She loves warm places.","Kittens are very cute.","Yes, she's two months old."],a:0,sen:"I can't find my kitten anywhere.",szh:"我到處都找不到我的小貓(kitten)。",en:"Did you check behind the dryer? She loves warm places.",zh:"對方找不到小貓(kitten)，幫忙想「你找過烘衣機(dryer)後面了嗎？她喜歡溫暖的地方」最自然。「小貓很可愛」沒有幫忙；「是的，她兩個月大」答的是年紀，Yes 也接不上。選 A"},
{n:16,p:2,o:["The fifth floor.","The eighth floor.","The third floor."],a:1,sen:"W: Is your new apartment on the fifth floor? &nbsp;M: No, my old one was. The new one is three floors higher. &nbsp;W: Wow, you must have a great view! &nbsp;Q: Which floor does the man live on now?",szh:"女：你的新公寓(apartment)在五樓(floor)嗎？　男：不是，舊的才是。新的再高三層。　女：哇，景色一定很棒！　問：男士現在住幾樓？",en:"The eighth floor.",zh:"舊公寓(apartment)在五樓，新的再高三層，五加三是八樓。五樓是舊家；三是多出來的層數，不是樓層。選 B"},
{n:17,p:2,o:["Cleaning up before a visit.","Making the bed at six o'clock.","Waiting for guests on the stairs."],a:0,sen:"W: Our guests will come at six. Is the bathroom ready? &nbsp;M: Not yet. I'll clean it after I wash the floor in the hall. &nbsp;W: Good. I'll make the bed in the bedroom. &nbsp;M: Should I clean the stairs, too? &nbsp;W: Yes, please. Then we will be ready. &nbsp;Q: What are the speakers doing?",szh:"女：我們的客人六點會到。浴室(bathroom)準備好了嗎？　男：還沒。我洗完走廊的地板(floor)就去清。　女：好。我去臥室(bedroom)鋪床。　男：樓梯(stair)也要清嗎？　女：要，麻煩你。這樣我們就準備好了。　問：說話的人在做什麼？",en:"Cleaning up before a visit.",zh:"客人六點到，兩人分頭清浴室(bathroom)、洗地板(floor)、鋪臥室(bedroom)的床、清樓梯(stair)，所以是在為訪客打掃準備。「六點」是客人來的時間，不是鋪床的時間；兩人也不是在樓梯上等客人，而是在打掃。選 A"},
{n:18,p:2,o:["Open the door.","Close the window.","Close the curtain."],a:2,sen:"M: The sun is in my eyes. Could you close the window? &nbsp;W: But then we won't get any fresh air. &nbsp;M: Oh, you're right. Just the curtain, then. &nbsp;Q: What will the woman do?",szh:"男：太陽照到我眼睛了。你可以關(close)窗戶(window)嗎？　女：可是那樣就沒有新鮮(fresh)空氣了。　男：喔，你說得對。那就只拉窗簾(curtain)吧。　問：女士會做什麼？",en:"Close the curtain.",zh:"男士原本請她關窗(window)，女士說會沒有新鮮(fresh)空氣，男士改成只拉上窗簾(curtain)。關窗是被否定的請求；開門(door)對話沒有提到要做。選 C"},
{n:19,p:2,o:["The wind.","A thief.","The woman's cat."],a:0,sen:"W: I saw a strange movement behind the curtain last night. &nbsp;M: A thief? Or was it your cat? &nbsp;W: My cat was asleep on my bed. It was only the wind from the open window. &nbsp;Q: What moved the curtain?",szh:"女：我昨晚看到窗簾(curtain)後面有奇怪的(strange)動靜(movement)。　男：小偷？還是你的貓？　女：我的貓在我床上睡覺。那只是開著的窗戶(window)吹進來的風。　問：是什麼讓窗簾動？",en:"The wind.",zh:"女士說貓在床上睡覺，動靜(movement)只是開著的窗戶(window)吹進來的風。小偷和貓都是男士的猜測，被女士否定了。選 A"},
{n:20,p:2,o:["Go to the beach in July.","Go to the beach in September.","Visit a quiet town in the mountains."],a:1,sen:"W: Let's go to the beach this summer. &nbsp;M: It's too crowded in July. How about a quiet town in the mountains? &nbsp;W: I'd rather see the sea. Let's go to the beach in September, when it's quiet. &nbsp;M: Fine with me. &nbsp;Q: What will they do?",szh:"女：我們今年夏天(summer)去海邊(beach)吧。　男：七月太擠了。去山上安靜的小鎮(town)怎麼樣？　女：我寧願(rather)看海。我們九月去海邊吧，那時比較安靜。　男：我沒問題。　問：他們會做什麼？",en:"Go to the beach in September.",zh:"男士嫌七月海邊(beach)太擠，提議去山上小鎮(town)，女士寧願(rather)看海，改成九月去海邊，男士同意。七月去海邊是被否定的時間；山上小鎮是被女士拒絕的提議。選 B"},
{n:21,p:2,o:["Three hundred dollars.","One hundred fifty dollars.","Six hundred dollars."],a:0,sen:"W: Let's order pizza. A large one is three hundred dollars. &nbsp;M: There are five of us, so we need two. &nbsp;W: Good news. Today, if you buy one, you get one free. &nbsp;Q: How much will they pay?",szh:"女：我們訂披薩(pizza)吧。一個大的三百元。　男：我們有五個人，需要兩個。　女：好消息，今天買一送一。　問：他們要付多少錢？",en:"Three hundred dollars.",zh:"要兩個大披薩(pizza)，但今天買一送一，所以只付一個的錢，三百元。六百元是沒算到買一送一；一百五十元是把價錢除以二，算錯了。選 A"},
{n:22,p:2,o:["In his mother's kitchen.","On the second floor of a house.","In a shop that sells machines for the home."],a:2,sen:"M: Excuse me. I want a gift for my mother. &nbsp;W: What does she like? &nbsp;M: She loves to cook, but her old microwave is broken. &nbsp;W: We have new ones on the second floor, next to the dryers. &nbsp;M: How much is the white one? &nbsp;W: It's four hundred dollars. It's on sale this week. &nbsp;Q: Where are the speakers?",szh:"男：不好意思。我想幫我媽媽找禮物。　女：她喜歡什麼？　男：她愛做菜，但她的舊微波爐(microwave)壞了。　女：新的在二樓(floor)，在烘衣機(dryer)旁邊。　男：那台白色的多少錢？　女：四百元，這週特價(sale)。　問：說話的人在哪裡？",en:"In a shop that sells machines for the home.",zh:"男士在找送媽媽的禮物，女士介紹二樓(floor)新的微波爐(microwave)和烘衣機(dryer)，還說價錢和特價，所以兩人在賣家電的店裡。廚房和洗衣間只是這些機器平常放的地方，他們不是在那裡，而是在談要買的東西。選 C"},
{n:23,p:2,o:["Help the woman on Sunday.","Study for a test.","Paint the bedroom wall."],a:1,sen:"W: Can you help me paint the bedroom wall this afternoon? &nbsp;M: I'd love to, but I have a big test tomorrow morning. &nbsp;W: Then how about Sunday? &nbsp;M: Sunday is perfect. &nbsp;Q: What will the man probably do this afternoon?",szh:"女：你今天下午(afternoon)可以幫我油漆臥室(bedroom)的牆(wall)嗎？　男：我很想，但我明天早上有個大考試。　女：那星期天呢？　男：星期天可以。　問：男士今天下午可能會做什麼？",en:"Study for a test.",zh:"男士明天早上有大考試，所以今天下午(afternoon)會準備考試。油漆牆(wall)他婉拒了，改到星期天；星期天幫忙不是「今天下午」的事。選 B"},
{n:24,p:2,o:["The pizza.","The microwave.","An old banana."],a:2,sen:"W: What's that smell in the kitchen? Is the pizza going bad? &nbsp;M: No, I ate the pizza for lunch. But I just discovered an old banana behind the microwave. &nbsp;W: Throw it out, please! &nbsp;Q: What made the smell?",szh:"女：廚房裡那是什麼味道？披薩(pizza)壞掉了嗎？　男：沒有，披薩我午餐吃掉了。但我剛在微波爐(microwave)後面發現(discover)一根舊香蕉(banana)。　女：拜託快丟掉！　問：味道是什麼造成的？",en:"An old banana.",zh:"男士說披薩(pizza)午餐就吃掉了，臭味來自在微波爐(microwave)後面發現(discover)的舊香蕉(banana)。披薩是女士猜錯的；微波爐只是香蕉被找到的位置。選 C"},
{n:25,p:2,o:["It is good enough for the gate.","It will not last long.","It costs more than the other paint."],a:1,sen:"W: I see you're painting the front gate again. &nbsp;M: Yes. It's the third time this year. &nbsp;W: Why not use the paint from the store? It costs more, but it lasts. &nbsp;M: Maybe. But the cheap paint is fine for me. &nbsp;W: Last time you said that, and the rain washed it off in a week. &nbsp;Q: What does the woman think about the cheap paint?",szh:"女：我看到你又在油漆前門(gate)了。　男：對，今年已經第三次了。　女：為什麼不用店裡的油漆？比較貴，但可以撐很久。　男：也許吧，但便宜的漆對我來說就夠了。　女：你上次也這樣說，結果下雨一週就沖掉了。　問：女士覺得便宜的油漆怎麼樣？",en:"It will not last long.",zh:"女士說上次便宜的漆一週就被雨沖掉，今年已經是第三次油漆，意思是便宜的漆撐不久。「夠用了」是男士自己的想法；「比較貴」說的是店裡的油漆，不是便宜的那種。選 B"},
{n:26,p:3,pic:true,o:[BARS("Hours in Each Room",["Bedroom","Kitchen","Study"],[20,50,80]),BARS("Hours in Each Room",["Bedroom","Kitchen","Study"],[80,20,50]),BARS("Hours in Each Room",["Bedroom","Kitchen","Study"],[50,20,80])],a:2,sen:"Last month, I wrote down how many hours I spent in each room of my home, but not the hours I was asleep. I thought my bedroom would be first. But I was wrong. I spent more time in the study than in my bedroom. The kitchen was last, because I'm not a good cook. &nbsp;Q: Which chart shows the speaker's hours?",szh:"上個月，我記下自己在家裡每個房間(room)待了幾小時，但睡覺的時間不算。我以為臥室(bedroom)會是第一名，但我錯了。我待在書房的時間比臥室多。廚房最少，因為我不太會(good)做菜。　問：哪張圖是說話者的時數？",en:"Study most, bedroom second, kitchen last.",zh:"書房比臥室(bedroom)多，廚房最少，所以書房最高、臥室第二、廚房最低。臥室最高的那張是說話者原本以為的結果；廚房第二的那張不符合「廚房最少」。選 C"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27a'),PH('q27b')],a:0,sen:"This summer, our apartment building painted the walls along the stairs, and everyone voted on the color. At first, blue was the most popular. But many people realized that blue would make the stairs look cold. Then green got more votes, but the manager said green was too dark. In the end, we chose yellow, and the walls look warm and bright now. &nbsp;Q: What color did they paint the walls?",szh:"今年夏天(summer)，我們的公寓(apartment)大樓(building)要粉刷樓梯(stair)旁的牆(wall)，大家投票選顏色。一開始藍色最受歡迎。但很多人發現(realize)藍色會讓樓梯看起來很冷(cold)。接著綠色票變多，但管理員說綠色太暗了。最後我們選了黃色，現在牆看起來溫暖又明亮。　問：他們把牆漆成什麼顏色？",en:"Yellow.",zh:"藍色因為看起來太冷(cold)被放棄，綠色因為管理員說太暗也沒選，這兩個都是投票過程中的顏色；最後選的是黃色，所以牆漆成黃色。 選 A"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28a'),PH('q28c')],a:1,sen:"Our class is doing a play about a queen who travels around the world. I wanted to be the queen, but Amy got the part. Then my teacher couldn't determine whether I should be a fisherman or a cook. In the end, she made me the fisherman. &nbsp;Q: What will the speaker wear in the play?",szh:"我們班要演一齣關於女王(queen)環遊世界(world)的戲。我想演女王，但角色給了 Amy。接著老師無法決定(determine)我該(whether)演漁夫(fisherman)還是廚師。最後她讓我演漁夫。　問：說話者在戲裡會穿什麼？",en:"Fisherman clothes.",zh:"說話者想演女王(queen)，但角色給了 Amy；老師在漁夫(fisherman)和廚師之間猶豫，最後決定演漁夫，所以會穿漁夫的衣服。女王是 Amy 的角色；廚師是沒被選上的另一個選擇。選 B"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29a'),PH('q29b')],a:2,sen:"Last Sunday, a strong wind hit our town. The Wangs' roof lost a lot of pieces. The windows of the Lins' house broke. Our house was lucky. The roof and windows were fine, but a big tree fell on our front gate. &nbsp;Q: What happened to the speaker's house?",szh:"上星期天，一陣強風吹襲我們鎮(town)上。王家的屋頂(roof)掉了很多塊。林家的窗戶(window)破了。我們家很幸運，屋頂和窗戶都沒事，但一棵大樹倒在我們家的前門(gate)上。　問：說話者的家發生了什麼事？",en:"A big tree fell on the front gate.",zh:"屋頂(roof)掉落是王家；窗戶(window)破掉是林家；說話者家的屋頂和窗戶都沒事，只有一棵大樹倒在前門(gate)上。選 C"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30a'),PH('q30b')],a:2,sen:"My family usually eats dinner at the small kitchen table. Tonight was my birthday, and Dad wanted to have a party on the roof. But just after we went up, it started to rain. So we ran back down and ate pizza on the living room floor. &nbsp;Q: Where did the family eat dinner tonight?",szh:"我家通常在廚房的小餐桌吃晚餐。今晚是我生日，爸爸想在屋頂(roof)上開派對。但我們才剛上去就開始下雨，所以我們跑回樓下，坐在客廳地板(floor)上吃披薩(pizza)。　問：這家人今晚在哪裡吃晚餐？",en:"On the living room floor.",zh:"廚房餐桌是「平常」吃飯的地方；屋頂(roof)是原本的計畫，但下雨了；最後是在客廳地板(floor)上吃披薩(pizza)。選 C"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 20 回　房屋與房間　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
