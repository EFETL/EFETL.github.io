<style>

<script>
/* 圖形素材（第11回 運動與比賽） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/11/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const BASKETBALL=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q1.jpg" alt="question 1 picture">`;
const BASEBALL=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q2.jpg" alt="question 2 picture">`;
const SHUTTLE=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q3.jpg" alt="question 3 picture">`;
const BALLOON=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q4.jpg" alt="question 4 picture">`;
const FOOTBALL=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:BASKETBALL,o:["In PE, they play baseball on the field.","In PE, they play dodge ball on the court.","In PE, they play basketball on the court."],a:2,sen:"For question one, look at the picture. What sport are they playing?",szh:"第一題，請看圖片。他們在打什麼運動？",en:"They play basketball on the court in PE.",zh:"體育課(PE)他們在球場(court)打籃球(basketball)，選 C。B 的躲避球(dodge ball)也在球場，但球類不同。"},
{n:2,p:0,fig:BASEBALL,o:["He's holding a baseball bat.","He's holding a bowling ball.","He's holding a tennis racket."],a:0,sen:"For question two, look at the picture. What is the boy holding?",szh:"第二題，請看圖片。男孩拿著什麼？",en:"A baseball bat.",zh:"男孩拿著棒球(baseball)球棒(bat)，選 A。B 的保齡球(bowling)也是球，但他手上不是。"},
{n:3,p:0,fig:SHUTTLE,o:["They are playing football on the grass.","They are playing baseball in a park.","They are playing badminton over a net."],a:2,sen:"For question three, look at the picture. What game is this?",szh:"第三題，請看圖片。這是什麼運動？",en:"Badminton over a net.",zh:"他們在打羽球(badminton)，球從網子上方(over)飛過，選 C。足球和棒球都不是在打羽球。"},
{n:4,p:0,fig:BALLOON,o:["There are many colorful balloons here.","There is a piano in the corner.","There is a swimming pool outside."],a:0,sen:"For question four, look at the picture. What is at the party?",szh:"第四題，請看圖片。派對上有什麼？",en:"Many colorful balloons.",zh:"派對上有許多彩色氣球(balloon)，選 A。鋼琴和游泳池都是派對可能有的東西，但圖片中沒有。"},
{n:5,p:0,fig:FOOTBALL,o:["A baseball game is on the field.","A bike race is on the field.","A football game is on the field."],a:2,sen:"For question five, look at the picture. What is on the field?",szh:"第五題，請看圖片。場上正在進行什麼？",en:"A football game.",zh:"球場(field)上正在進行足球(football)比賽(game)，選 C。棒球賽和單車賽也能在場上舉行，但圖中不是。"},

{n:6,p:1,o:["It's shaped like a ball.","My cousin is very thin.","I exercise to stay fit."],a:2,sen:"How do you keep your body in shape?",szh:"你怎麼保持身材？",en:"I exercise to stay fit.",zh:"問怎麼保持身材，答『我運動(exercise)來保持健康(fit)』，選 C。A 重複 shape 的字音卻答非所問；B 的瘦(thin)是別人的狀況。"},
{n:7,p:1,o:["We won by two points.","I mostly play first base.","Go straight, then turn left."],a:1,sen:"What is your job in the ball game?",szh:"在球賽中你負責什麼？",en:"I mostly play first base.",zh:"問在球賽的位置，答『我主要守一壘(base)』，選 B。A 是比賽結果，C 是指路(straight)，都沒回答問題。"},
{n:8,p:1,o:["I'll see you tonight at seven.","I'm looking for my bowling shoes.","I've had a headache all day."],a:2,sen:"Why do you look so tired tonight?",szh:"你今晚怎麼看起來這麼累？",en:"I've had a headache all day.",zh:"問為何看起來累，答『我整天都頭痛(headache)』，選 C。A 回答時間，B 回答找東西(保齡球 bowling 鞋)，都不是原因。"},
{n:9,p:1,o:["In the gym after school.","My aunt taught me last year.","I hurt my toe playing it."],a:1,sen:"Who taught you to play dodge ball?",szh:"誰教你玩躲避球的？",en:"My aunt taught me last year.",zh:"問誰教(teach)你躲避球，答『我阿姨(aunt)去年教我』，選 B。A 回答地點(where)；C 說腳趾(toe)受傷，答非所問。"},
{n:10,p:1,o:["It's sunny, but a bit cold.","We did it last Sunday.","We'll play inside the gym."],a:2,sen:"What will we do if the weather is bad?",szh:"如果天氣不好我們怎麼辦？",en:"We'll play inside the gym.",zh:"問若(if)天氣不好怎麼辦，答『我們在體育館裡面打』，選 C。A 只是描述天氣，B 用過去式講上週的事。"},
{n:11,p:1,o:["Put it under the desk.","Just a bottle of water.","I'm glad you like my bag."],a:1,sen:"What should I put in my sports bag?",szh:"運動包該放什麼？",en:"Just a bottle of water.",zh:"問運動包該放什麼，答『只要一瓶水(bottle)』，選 B。A 說放哪裡(under)，C 說我很高興(glad)你喜歡，都沒回答要放什麼。"},
{n:12,p:1,o:["Yes, I'm making good progress.","About three kilometers each time.","Last month was very rainy."],a:0,sen:"Have you improved your running this month?",szh:"這個月你的跑步有進步嗎？",en:"Yes, I'm making good progress.",zh:"問是否進步，答『有，我進步(progress)很多』，選 A。B 回答距離，C 重複 month 卻是講天氣。"},
{n:13,p:1,o:["It indicates that you may slip.","It's near the back door.","I didn't sign the form."],a:0,sen:"What does that warning sign mean?",szh:"那個警告標誌是什麼意思？",en:"It indicates that you may slip.",zh:"問標誌的意思，答『它指出(indicate)你可能會滑倒(slip)』，選 A。B 回答位置；C 重複 sign 的音，並提到表格(form)，與標誌無關。"},
{n:14,p:1,o:["The final score was six to five.","Losing is not a failure.","We had difficulty catching the ball."],a:2,sen:"Why did your team lose the final game?",szh:"你們隊為什麼輸了決賽？",en:"We had difficulty catching the ball.",zh:"問為什麼輸，答『我們接球(catch)很困難(difficulty)』，選 C。A 只講比數，B 談失敗(failure)的道理，都沒說出輸的原因。"},
{n:15,p:1,o:["A plan on the blackboard.","Mr. Lin is our new coach.","Please write your name here."],a:0,sen:"What did the coach write for us?",szh:"教練為我們寫了什麼？",en:"A plan on the blackboard.",zh:"問教練寫了什麼，答『黑板(blackboard)上的一份計畫』，選 A。B 回答教練是誰，C 重複 write 卻是要你寫名字。"},

{n:16,p:2,o:["Basketball.","Football.","Baseball."],a:0,
 sen:"W: What do you play in PE class? &nbsp;M: We usually play basketball on the school court. &nbsp;W: Fun! &nbsp;Q: What does the man play in PE?",
 szh:"女：你們體育課(PE)玩什麼？　男：我們通常在學校球場(court)打籃球(basketball)。　女：好玩！　問：男士體育課玩什麼？",
 en:"Basketball.",zh:"男士體育課打籃球(basketball)，選 A。"},
{n:17,p:2,o:["A glove and some tape.","A bat and a baseball.","A helmet and a ball."],a:1,sen:"M: What should I bring for the game? &nbsp;W: A bat and a baseball; we will practice hitting. &nbsp;M: Got it. &nbsp;Q: What should the man bring?",szh:"男：比賽我該帶什麼？　女：一支球棒(bat)和一顆棒球(baseball)，我們要練打擊。　男：了解。　問：男士該帶什麼？",en:"A bat and a baseball.",zh:"女士說要帶一支球棒(bat)和一顆棒球(baseball)，選 B。A 的手套與膠帶(tape)、C 的頭盔都沒被提到。"},
{n:18,p:2,o:["Baseball.","Bowling.","Badminton."],a:2,sen:"W: What are they doing in the gym? &nbsp;M: They are hitting a small thing with feathers over a high net. &nbsp;W: It looks fun. Can we play, too? &nbsp;M: Sure. Let's get some rackets. &nbsp;Q: What game are they playing?",szh:"女：他們在體育館做什麼？　男：他們在用球拍把一個有羽毛的小東西打過高高的網子。　女：看起來好玩，我們也能玩嗎？　男：當然，去拿幾支球拍吧。　問：他們在玩什麼比賽？",en:"Badminton.",zh:"有羽毛的小東西、網子與球拍都指向羽球(badminton)，選 C。棒球(baseball)和保齡球(bowling)不用網子和球拍。"},
{n:19,p:2,o:["On the big field.","Behind the gym.","Near the mall."],a:0,sen:"M: Where is the football match held? &nbsp;W: On the big field behind the school. &nbsp;M: Let's go. &nbsp;Q: Where is the football match?",szh:"男：足球(football)比賽在哪裡舉行？　女：在學校後面的大球場(field)。　男：走吧。　問：足球比賽在哪裡？",en:"On the field.",zh:"足球(football)比賽在球場(field)舉行，選 A。"},
{n:20,p:2,o:["He tried to steal a bike.","He tried to fix a bike.","He tried to sell his bike."],a:0,sen:"W: What was the movie about? &nbsp;M: An evil man took a boy's bike at night and hid it behind his house. &nbsp;W: How sad! Did the boy find it? &nbsp;M: Yes, in the end. &nbsp;Q: What did the man do?",szh:"女：那部電影在演什麼？　男：一個壞(evil)男人在晚上拿走男孩的腳踏車，把它藏在他家後面。　女：好可憐！男孩找到了嗎？　男：有，最後找到了。　問：那個男人做了什麼？",en:"He tried to steal a bike.",zh:"男人在晚上拿走男孩的腳踏車並藏起來，就是想偷(steal)，選 A。B 的修理與 C 的賣掉都沒發生。"},
{n:21,p:2,o:["Washing his face.","Combing his hair.","Taking a shower."],a:1,sen:"W: Why is Tom still in the bathroom? The game starts soon. &nbsp;M: He is looking in the mirror. His hair is not right yet. &nbsp;W: Oh, Tom! &nbsp;Q: What is Tom doing?",szh:"女：Tom 為什麼還在浴室？比賽快開始了。　男：他在照鏡子，頭髮還不夠整齊。　女：哦，Tom！　問：Tom 在做什麼？",en:"Combing his hair.",zh:"他對著鏡子整理頭髮，是在梳頭(comb)，選 B。洗臉和洗澡也會在浴室，但對話提到的是頭髮。"},
{n:22,p:2,o:["To the mall.","To a jazz club.","To the gym."],a:0,sen:"M: What do you do after exercise? &nbsp;W: I take a bus downtown and buy some shoes. Sometimes I have ice cream there. &nbsp;M: Sounds nice. &nbsp;Q: Where does the woman go after exercise?",szh:"男：你運動後都做什麼？　女：我搭公車到市區買鞋子，有時候在那裡吃冰淇淋。　男：聽起來不錯。　問：女士運動後去哪裡？",en:"To the mall.",zh:"她到市區買鞋子、吃冰淇淋，是去購物中心(mall)，選 A。爵士(jazz)俱樂部與體育館都沒提到。"},
{n:23,p:2,o:["He is quiet.","He is talkative.","He is lazy."],a:1,sen:"W: How is the new team member? &nbsp;M: He talks to everyone, even during practice. &nbsp;W: Is that a problem? &nbsp;M: No, we all like it. He is always welcome here. &nbsp;Q: What is the new member like?",szh:"女：新隊員怎麼樣？　男：他跟每個人說話，連練習時也是。　女：那是問題嗎？　男：不是，我們都喜歡。他在這裡永遠受歡迎(welcome)。　問：新隊員是什麼樣的人？",en:"He is talkative.",zh:"他和每個人說話、連練習也不停，表示很愛講話(talkative)，選 B。A 安靜(quiet)正好相反。"},
{n:24,p:2,o:["Mr. Chen.","The coach.","Her class."],a:2,sen:"M: Wow, who arranged this sports day? &nbsp;W: Mr. Chen only watched. Our class did everything by ourselves. &nbsp;M: It is the best one on earth! &nbsp;Q: Who arranged the sports day?",szh:"男：哇，這場運動會是誰安排的？　女：陳老師只是在旁邊看，我們班自己(ourselves)全部做完。　男：這是全世界(earth)最棒的！　問：運動會是誰安排的？",en:"Her class did it.",zh:"女士說陳老師只在旁邊看，是她們班自己(ourselves)辦的，選 C。A 的陳老師被提到但只是旁觀，容易誤選。"},
{n:25,p:2,o:["A basketball game.","The Dragon Boat Festival.","The school sports day."],a:1,sen:"W: It is early summer, and many Chinese families are making zongzi. &nbsp;M: Yes, and there is a boat race by the river this weekend. &nbsp;W: I love it. &nbsp;Q: What event are they talking about?",szh:"女：現在是初夏，很多中國(Chinese)家庭在包粽子。　男：對，這個週末河邊還有划船比賽。　女：我好愛。　問：他們在談什麼活動(event)？",en:"The Dragon Boat Festival.",zh:"初夏包粽子又有划船比賽，是端午節(Dragon Boat Festival)，選 B。學校運動會也有比賽，但與粽子無關。"},

{n:26,p:3,pic:true,o:[BARS("Ball Games",["Base","Basket","Foot"],[50,80,20]),BARS("Ball Games",["Base","Basket","Foot"],[80,50,20]),BARS("Ball Games",["Base","Basket","Foot"],[20,50,80])],a:1,sen:"Our school counted which ball game each student joined. Baseball had the most players this autumn, because our team won a big event. Basketball was in the middle, and football had the fewest. So the baseball bar should be the tallest. &nbsp;Q: Which chart shows the ball games?",szh:"我們學校統計每位學生參加的球類比賽(game)。今年秋天(autumn)棒球(baseball)最多人，因為我們隊贏了大型賽事(event)；籃球(basketball)中等；足球(football)最少。所以棒球長條最高。　問：哪張圖顯示球類比賽？",en:"Baseball most, football least.",zh:"棒球(baseball)最多人、足球最少，符合『棒球最高』的圖，選 B。籃球(basketball)是中間，容易誤選。"},
{n:27,p:3,pic:true,o:[BARS("Progress",["Wk1","Wk2","Wk3"],[80,55,30]),BARS("Progress",["Wk1","Wk2","Wk3"],[55,80,30]),BARS("Progress",["Wk1","Wk2","Wk3"],[30,55,80])],a:0,sen:"My coach used a tape to measure my jumping progress. In week one I jumped the highest, because I was fresh and fit. In week two I was in the middle, and in week three the lowest, because of a slip and a headache. So my progress went down each week. &nbsp;Q: Which chart shows my progress?",szh:"教練用捲尺(tape)量我的跳躍進步(progress)。第一週跳最高，因為體力好又健美(fit)；第二週中等；第三週最低，因為滑倒(slip)又頭痛(headache)。所以我的表現逐週下降。　問：哪張圖顯示我的進步？",en:"Week1 highest, week3 lowest.",zh:"第一週最高、第三週最低，進步逐週下降，選 A。第三週因滑倒(slip)與頭痛表現最差。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('bread'),IMG('rice')],a:1,
 sen:"Before every big match, my aunt teaches us to eat light. She says heavy noodles or oily rice can give us a headache during the game. So she prepares soft bread for the whole team, which is easy to move with and keeps us fit. &nbsp;Q: What food does the aunt prepare before the match?",
 szh:"每場大賽(match)前，我阿姨(aunt)教(teach)我們吃清淡。她說重口味的麵或油飯會讓我們在比賽(game)中頭痛(headache)。所以她為全(whole)隊準備軟麵包(bread)，方便帶著移動(move)，也能保持健美(fit)。　問：阿姨賽前準備什麼食物？",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 11 回　運動與比賽　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
