<div class="bar">
 <b>🖨 第 11 回　運動與比賽　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第11回 運動與比賽） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/11/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/11/p3_${n}.jpg?v=r11qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const BASKETBALL=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q1.jpg" alt="question 1 picture">`;
const BASEBALL=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q2.jpg" alt="question 2 picture">`;
const SHUTTLE=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q3.jpg" alt="question 3 picture">`;
const BALLOON=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q4.jpg" alt="question 4 picture">`;
const FOOTBALL=`<img class="pic-img p0img" src="gept-listening-img/11/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:BASKETBALL,o:["A boy in a white shirt has the ball.","A boy in a dark blue shirt has the ball.","Four boys are playing basketball in a gym."],a:1,sen:"For question one, look at the picture. Which is true about the picture?",szh:"第一題，請看圖片。關於這張圖，何者正確？",en:"A boy in a dark blue shirt has the ball.",zh:"圖中四個男生在戶外球場(court)打籃球(basketball)，拿球(ball)運球的是穿深藍色無袖上衣的男生，正確。穿白衣的男生是在旁邊防守，沒有拿球；他們是在室外、後面有樹和圍牆，不是在體育館裡。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">SPORTS SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Bat</td><td style="text-align:right;font-weight:700">$350</td></tr><tr><td style="padding:4px 30px 4px 0">Ball</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Cap</td><td style="text-align:right;font-weight:700">$250</td></tr><tr><td style="padding:4px 30px 4px 0">Gloves</td><td style="text-align:right;font-weight:700">$400</td></tr></table></div>`,o:["He will have two hundred dollars left.","He will have three hundred fifty dollars left.","He will have five hundred fifty dollars left."],a:0,sen:"For question two, look at the picture. Ken has seven hundred dollars. He buys a bat and a ball. How much will he have left?",szh:"第二題，請看圖片。肯有七百元。他買了一支球棒和一顆球。他還剩多少錢？",en:"He will have two hundred dollars left.",zh:"價目表上球棒(bat)350元、球(ball)150元，一共500元，700減500剩200元。剩三百五十元是只扣掉球棒、忘了球的算法；剩五百五十元是只扣掉球、忘了球棒的算法。選 A"},
{n:3,p:0,fig:SHUTTLE,o:["Four men are playing badminton in a gym.","Two men are playing badminton in a park.","Two men are playing badminton in a gym."],a:2,sen:"For question three, look at the picture. Which is true about the picture?",szh:"第三題，請看圖片。關於這張圖，何者正確？",en:"Two men are playing badminton in a gym.",zh:"兩位男士在室內綠色球場(court)打羽球(badminton)，正確。地上是綠色球場、後面是牆，不是在公園；場上只有兩個人，不是四個。選 C"},
{n:4,p:0,fig:BALLOON,o:["Many balloons are in the air, and nobody is on the sofa.","Many balloons are in the air, and a man is sitting on the sofa.","All of the balloons are on the floor."],a:0,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"Many balloons are in the air, and nobody is on the sofa.",zh:"房間裡很多氣球(balloon)飄在空中，沙發上沒有人，正確。沙發上沒有男人(man)坐著；只有少數幾顆氣球在地上，大部分都飄在天花板下面(under)。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Sports Day</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="96" y="75" width="44" height="75" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="70" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Baseball</text><text x="118" y="167" text-anchor="middle">Football</text><text x="184" y="167" text-anchor="middle">Bowling</text></g></svg>`,o:["Fifty students chose them.","Thirty students chose them.","Seventy students chose them."],a:0,sen:"For question five, look at the picture. Some students chose football and bowling for Sports Day. How many students chose those two sports in all?",szh:"第五題，請看圖片。有些學生在運動會選了足球和保齡球。選這兩項運動的學生一共有多少？",en:"Fifty students chose them.",zh:"圖中足球(football)30人、保齡球(bowling)20人，加起來50人。三十人只算了足球；七十人是把棒球(baseball)40人和足球30人加在一起，看錯了項目。選 A"},
{n:6,p:1,o:["We play it in PE every Friday.","My aunt did, when I was ten.","I hurt my toe in the last game."],a:1,sen:"Who taught you how to play dodge ball?",szh:"誰教你玩躲避球的？",en:"My aunt did, when I was ten.",zh:"問「誰」教(teach)你玩躲避球(dodge ball)，答「我阿姨(aunt)，在我十歲時」才是人物。「我們每週五體育課(PE)玩」答的是時間地點；「我上一場傷到腳趾(toe)」與誰教的無關。選 B"},
{n:7,p:1,o:["Yes, I bought it at the mall.","Then you should lie down for a while.","I'm glad to hear that."],a:1,sen:"I have a terrible headache.",szh:"我頭痛得好厲害。",en:"Then you should lie down for a while.",zh:"對方說頭痛(headache)得很厲害，建議「那你該躺一下」最自然。「聽到這個我很高興(glad)」情緒用錯了；「對，我在購物中心(mall)買的」把 have 誤會成擁有某樣東西。選 B"},
{n:8,p:1,o:["Under the bench, next to the bats.","Yes, I'm very thirsty.","I drink two bottles a day."],a:0,sen:"Where should I put this bottle of water?",szh:"這瓶水我該放哪裡？",en:"Under the bench, next to the bats.",zh:"問一瓶(bottle)水要放哪裡，答「放在長椅下面(under)，球棒(bat)旁邊」才是地點。「是的，我很渴」用 Yes 回答 where 問句；「我一天喝兩瓶」只是重複 bottle。選 A"},
{n:9,p:1,o:["My Chinese teacher is very thin.","Yes, I'm Chinese.","A little. I can read the menu now."],a:2,sen:"Are you making any progress with your Chinese?",szh:"你的中文有沒有進步？",en:"A little. I can read the menu now.",zh:"問中文(Chinese)有沒有進步(progress)，答「有一點，我現在看得懂菜單了」用例子說明進步。「是的，我是中國人」把 Chinese 當成國籍；「我的中文老師很瘦(thin)」與進步無關。選 C"},
{n:10,p:1,o:["Are you OK? Can you stand up?","I'll wash the floor tomorrow.","Go straight, and the gym is on the left."],a:0,sen:"I slipped on the wet floor in the gym.",szh:"我在體育館濕地板上滑倒了。",en:"Are you OK? Can you stand up?",zh:"對方說在體育館滑倒(slip)，關心「你還好嗎？站得起來嗎？」最自然。「直走(straight)，體育館在左邊」是在指路，只重複 gym；「我明天會洗地板」沒有關心對方。選 A"},
{n:11,p:1,o:["I signed the form this morning.","No running. The floor is wet.","It's right next to the pool."],a:1,sen:"What does that sign by the pool indicate?",szh:"游泳池邊那個標示指的是什麼？",en:"No running. The floor is wet.",zh:"問標示指出(indicate)什麼意思，答「禁止奔跑，地板是濕的」說明了內容。「就在泳池旁邊」答的是位置；「我今天早上簽了表格(form)」用 sign/signed 的同音陷阱。選 B"},
{n:12,p:1,o:["You're welcome. It was nothing.","I'd love to, but I have a baseball game.","Yes, I went there last Saturday."],a:1,sen:"Would you like to come to the jazz event at the mall this Saturday?",szh:"這週六你要不要來購物中心的爵士音樂活動？",en:"I'd love to, but I have a baseball game.",zh:"對方邀你週六參加購物中心(mall)的爵士(jazz)活動(event)，「我很想去，但(but)我有棒球(baseball)比賽(game)」是委婉拒絕。「我上週六去過」時態不對；「不客氣(welcome)」是回應道謝的話，用錯場合。選 B"},
{n:13,p:1,o:["We'll play them again in autumn.","The final score was six to five.","We had difficulty catching the ball."],a:2,sen:"Why did your team lose the game?",szh:"你們隊為什麼輸了比賽？",en:"We had difficulty catching the ball.",zh:"問「為什麼」輸了比賽(game)，答「我們接(catch)球很困難(difficulty)」才是原因。「最後比數六比五」只是結果；「秋天(autumn)會再跟他們比」答的是時間。選 C"},
{n:14,p:1,o:["Yes, he never talks to anyone.","Mine is the same. He talks all through dinner.","He should stop at the next corner."],a:1,sen:"My little brother is the most talkative boy on earth.",szh:"我弟弟是世界上最愛講話的男孩。",en:"Mine is the same. He talks all through dinner.",zh:"對方說弟弟是全世界(earth)最愛講話(talkative)的人，回「我弟也一樣，整頓晚餐都在講」最自然。「對，他從不跟人說話」和愛講話矛盾；「他應該在下個轉角停」答非所問。選 B"},
{n:15,p:1,o:["Yes, I'll comb my hair later.","No, I didn't see the game.","Isn't it in your sports bag?"],a:2,sen:"Have you seen my comb anywhere?",szh:"你有看到我的梳子嗎？",en:"Isn't it in your sports bag?",zh:"對方找梳子(comb)，反問「不是在你的運動包裡嗎？」是在幫忙找。「對，我待會再梳頭」答的是自己的事；「沒有，我沒看比賽(game)」只重複 see。選 C"},
{n:16,p:2,o:["Play basketball on the field.","Play dodge ball in the gym.","Play basketball in the gym."],a:1,sen:"W: Do we have PE outside on the field today? &nbsp;M: No, it's raining, so we'll move to the basketball court in the gym. &nbsp;W: So we'll play basketball? &nbsp;M: No, Mr. Lin wants us to play dodge ball. &nbsp;Q: What will they do in PE today?",szh:"女：我們今天體育課(PE)在外面運動場(field)上嗎？　男：不是，下雨了，所以要移到(move)體育館的籃球場(court)。　女：所以要打籃球(basketball)？　男：不是，林老師要我們玩躲避球(dodge ball)。　問：他們今天體育課要做什麼？",en:"Play dodge ball in the gym.",zh:"下雨所以從運動場(field)移到(move)體育館的籃球場(court)，但老師要玩的是躲避球(dodge ball)，不是籃球。在運動場上是原本的地點，已經改了；打籃球是女士猜錯的。選 B"},
{n:17,p:2,o:["A ball.","A bottle of water.","A bat."],a:0,sen:"M: What should I bring to baseball practice? &nbsp;W: Your bat and a bottle of water. &nbsp;M: What about a ball? &nbsp;W: Don't worry. The coach has a whole box of them. &nbsp;Q: What doesn't the man need to bring?",szh:"男：棒球(baseball)練習我該帶什麼？　女：你的球棒(bat)和一瓶(bottle)水。　男：那球呢？　女：別擔心，教練有一整(whole)箱。　問：男士不需要帶什麼？",en:"A ball.",zh:"教練有一整(whole)箱球(ball)，所以男士不用帶球。球棒(bat)和一瓶(bottle)水是女士叫他要帶的東西。選 A"},
{n:18,p:2,o:["Two hundred and ten.","One hundred twenty.","Ninety."],a:0,sen:"W: How did you do at bowling last night? &nbsp;M: I got one hundred twenty in the first game. &nbsp;W: Not bad! &nbsp;M: But only ninety in the second. I hurt my finger. &nbsp;Q: How many points did the man get in the two games?",szh:"女：你昨晚打保齡球(bowling)打得怎樣？　男：第一局(game)一百二十分。　女：不錯嘛！　男：但(but)第二局只有九十分，我傷到手指了。　問：男士兩局共得幾分？",en:"Two hundred and ten.",zh:"第一局(game)一百二十分加第二局九十分，兩局共兩百一十分。九十分只是第二局；一百二十分只是第一局。選 A"},
{n:19,p:2,o:["The man.","The city team coach.","The man's brother."],a:2,sen:"W: Can you teach my son to play badminton this autumn? &nbsp;M: I'd like to, but I'll be away. My brother can do it. &nbsp;W: Is he good? &nbsp;M: He plays for the city team. &nbsp;Q: Who will teach the woman's son?",szh:"女：今年秋天(autumn)你可以教(teach)我兒子打羽球(badminton)嗎？　男：我很想，但(but)我會不在。我弟弟可以教。　女：他打得好嗎？　男：他是市代表隊的。　問：誰會教女士的兒子？",en:"The man's brother.",zh:"女士原本請男士教(teach)，但男士秋天(autumn)不在，改由他弟弟教羽球(badminton)。男士本人沒辦法教；對話沒有說市代表隊的教練要來，市隊只是說明弟弟很厲害。選 C"},
{n:20,p:2,o:["A girl stopped a man from stealing.","A man stole a famous painting.","A girl tried to steal a painting."],a:0,sen:"M: How was the movie last night? &nbsp;W: Great. An evil man tried to steal a famous painting. &nbsp;M: Did he get it? &nbsp;W: Almost. But a little girl saw him and called the police. &nbsp;Q: What happened in the movie?",szh:"男：昨晚的電影怎麼樣？　女：很棒。一個壞(evil)男人(man)想偷(steal)一幅名畫。　男：他偷到了嗎？　女：差一點，但一個小女孩看到他，打電話報警了。　問：電影裡發生了什麼事？",en:"A girl stopped a man from stealing.",zh:"壞(evil)人想偷(steal)名畫，「差一點」就成功，但被小女孩發現並報警，所以是女孩阻止了他。「男人偷走了名畫」忽略了 almost；想偷畫的是男人，不是女孩。選 A"},
{n:21,p:2,o:["Visit her aunt's house.","Stay home with her aunt.","Go to the races with her aunt."],a:2,sen:"M: Are you going to the Dragon Boat Festival races by the river? &nbsp;W: I wanted to, but my aunt is coming to visit. &nbsp;M: Bring her with you! &nbsp;W: Good idea. She loves Chinese culture. &nbsp;Q: What will the woman probably do?",szh:"男：你要去河邊看端午節(Dragon Boat Festival)的龍舟賽嗎？　女：我本來想去，但(but)我阿姨(aunt)要來。　男：帶她一起去啊！　女：好主意，她很喜歡中華(Chinese)文化(culture)。　問：女士可能會做什麼？",en:"Go to the races with her aunt.",zh:"女士本來因為阿姨(aunt)要來而不能去，男士建議帶阿姨一起去，女士說好主意，阿姨又喜歡中華(Chinese)文化(culture)，所以會帶阿姨去看龍舟賽。待在家是原本的狀況，已經改變；是阿姨要來她家，不是她去阿姨家。選 C"},
{n:22,p:2,o:["He thinks it is more fun than swimming.","He thinks it is the best way to stay fit.","He thinks it is hard on the body."],a:2,sen:"W: You look thin. Are you OK? &nbsp;M: I'm fine. I exercise every morning to stay fit. &nbsp;W: Do you still run? &nbsp;M: Not anymore. It hurt my knees, so now I go to the pool. &nbsp;Q: What does the man think about running?",szh:"女：你看起來很瘦(thin)。你還好嗎？　男：我很好。我每天早上運動(exercise)來保持健康(fit)。　女：你還在跑步嗎？　男：不跑了。跑步讓我的膝蓋受傷，所以現在我去游泳池。　問：男士覺得跑步怎麼樣？",en:"He thinks it is hard on the body.",zh:"男士說跑步會讓膝蓋痛，所以改去游泳，可見他認為跑步對身體負擔大。他放棄跑步，所以不會覺得比游泳有趣；他每天運動(exercise)保持健康(fit)靠的是現在的游泳，不是跑步，也沒有說跑步是最好的方法。選 C"},
{n:23,p:2,o:["Putting up a sign.","Cleaning the blackboard.","Fixing the door."],a:0,sen:"W: Hold this end up, Ken. &nbsp;M: Is it over the door now? &nbsp;W: A little higher. It says Welcome, so everyone must see it. &nbsp;M: How about now? &nbsp;W: Perfect. Where's the tape? &nbsp;M: It's on the desk next to the blackboard. &nbsp;Q: What are the speakers doing?",szh:"女：把這一頭舉高，Ken。　男：現在在門上方(over)了嗎？　女：再高一點。上面寫著歡迎(Welcome)，所以大家一定要看得到。　男：現在呢？　女：很好。膠帶(tape)在哪裡？　男：在桌上，黑板(blackboard)旁邊。　問：說話的人在做什麼？",en:"Putting up a sign.",zh:"兩人把寫著歡迎的東西舉到門上方(over)，還在找膠帶(tape)要貼，所以是在掛一個告示牌。黑板(blackboard)只是膠帶放的位置，沒有人在擦黑板；門是掛牌子的位置，沒有人在修門。選 A"},
{n:24,p:2,o:["She won't go.","In the afternoon.","In the morning."],a:1,sen:"W: If it rains tomorrow, will the football game still be on? &nbsp;M: Yes, but they'll play in the afternoon, not in the morning. &nbsp;W: Good. I'm busy in the morning, so I can help. &nbsp;M: Thanks. We really appreciate it. &nbsp;Q: If it rains, when will the woman be at the game?",szh:"女：如果(if)明天下雨，足球(football)比賽(game)還會照常嗎？　男：會，但(but)會改到下午，不是早上。　女：太好了，我早上很忙，這樣我就能幫忙。　男：謝謝，我們真的很感激(appreciate)。　問：如果下雨，女士什麼時候會在比賽現場？",en:"In the afternoon.",zh:"如果(if)下雨，足球(football)比賽改到下午；女士早上忙，下午剛好能去幫忙。早上是原本的比賽時間，也是她沒空的時間；她說能去幫忙，所以不是不去。選 B"},
{n:25,p:2,o:["How to cook rice well.","The man's birthday dinner.","A dinner for the woman's mother."],a:2,sen:"M: Do you need help with the rice? &nbsp;W: No, thanks. My sister and I are making the whole dinner ourselves. &nbsp;M: Your mom isn't cooking tonight? &nbsp;W: No. It's her birthday, so she gets a night off. &nbsp;M: What a nice idea! What will you make for her? &nbsp;W: Fish, soup, and rice. We bought everything this morning, and I hope she likes it. &nbsp;M: I'm sure she will. &nbsp;Q: What are the speakers talking about?",szh:"男：妳需要人幫忙煮飯(rice)嗎？　女：不用，謝謝。我和妹妹要自己(ourselves)做整(whole)頓晚餐。　男：妳媽媽今晚不下廚嗎？　女：對。今天是她生日，所以她可以休息一晚。　男：真是好主意！妳們要為她做什麼？　女：魚、湯和飯。我們今天早上把東西都買好了，希望她會喜歡。　男：我相信她會的。　問：說話的人在談什麼？",en:"A dinner for the woman's mother.",zh:"女士和妹妹自己(ourselves)做整(whole)頓晚餐，因為今天是媽媽生日，要讓媽媽休息，所以他們談的是為女士的媽媽準備的一頓晚餐。飯(rice)只是其中一道菜，兩人沒有在討論怎麼煮；過生日的是女士的媽媽，不是男士。選 C"},
{n:26,p:3,pic:true,o:[BARS("Bowling Scores",["Ben","Amy","Ken"],[20,80,50]),BARS("Bowling Scores",["Ben","Amy","Ken"],[50,80,20]),BARS("Bowling Scores",["Ben","Amy","Ken"],[80,50,20])],a:0,sen:"Last Friday, our class went bowling. Ben usually wins, but this time Amy got the highest score. Ken did better than Ben, but he was still far behind Amy. Ben said his arm hurt, but nobody believed him. &nbsp;Q: Which chart shows their bowling scores?",szh:"上週五我們班去打保齡球(bowling)。Ben 通常都贏，但(but)這次 Amy 分數最高。Ken 比 Ben 好，但還是遠遠落後 Amy。Ben 說他手臂痛，但沒人相信他。　問：哪張圖是他們的保齡球分數？",en:"Amy highest, Ken second, Ben lowest.",zh:"Amy 最高，Ken 比 Ben 好，所以 Amy 第一、Ken 第二、Ben 最低。Ben 最高的那張是「通常」的情形；Amy 最高但 Ben 第二的那張，與「Ken 比 Ben 好」不符。選 A"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27b'),PH('q27c')],a:2,sen:"Nina loves exercise. Last week, she played badminton on the school court every day. On Saturday, she went bowling with her cousin. But on Sunday, she dropped a heavy ball on her toe. Now the doctor says she must rest for two weeks, so she just watches her team's dodge ball game from a bench. &nbsp;Q: What is Nina doing now?",szh:"妮娜熱愛運動(exercise)。上星期她每天都在學校的球場(court)打羽毛球(badminton)。星期六她跟表姊去打保齡球(bowling)。但星期日她把一顆很重的球(ball)掉在腳趾上。現在醫生說她得休息兩週，所以她只能坐在長椅上看她們隊的躲避球(dodge ball)比賽。　問：妮娜現在在做什麼？",en:"She is watching a game from a bench.",zh:"打羽毛球(badminton)是上星期的事，打保齡球(bowling)是星期六的事，這兩項都是「以前」；星期日腳趾受傷後，醫生要她休息，所以現在只能坐在長椅上看躲避球(dodge ball)比賽。 選 C"},
{n:28,p:3,pic:true,o:[PH('q28c'),PH('q28b'),PH('q28a')],a:1,sen:"Every year, our town has dragon boat races on the river for the Dragon Boat Festival. My dad always rows in the boat. This year, he hurt his back, so he watched from the bridge. My brother took his place in the boat, and I hit the big drum at the front. &nbsp;Q: What did the speaker's dad do this year?",szh:"每年端午節(Dragon Boat Festival)我們鎮上都會在河上舉辦龍舟賽，我爸爸每年都會上船划。今年他傷到背，所以在橋上觀看。我哥哥代替他上船，我則在船頭打大鼓。　問：說話者的爸爸今年做了什麼？",en:"He watched from the bridge.",zh:"爸爸「每年」都划船，但今年傷到背，只能在橋上看。上船划龍舟的是代替他的哥哥；在船頭打鼓的是說話者自己，要分清楚是誰做的事。選 B"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29a'),PH('q29c')],a:2,sen:"Our school's football field is being fixed this month. The coach wanted to move practice to the basketball court, but it's too small, and the basketball team needs it. So every afternoon, we take a bus to the beach and run on the sand. It's hard, but it really keeps us fit. &nbsp;Q: Where does the football team practice this month?",szh:"這個月我們學校的足球(football)場(field)在整修。教練想把練習移到(move)籃球(basketball)場(court)，但(but)太小了，而且籃球隊要用。所以每天下午我們搭公車到海邊在沙灘上跑步。很辛苦，但真的讓我們保持體能(fit)。　問：足球隊這個月在哪裡練習？",en:"On the beach.",zh:"足球(football)場(field)在整修不能用；教練想移到(move)籃球場(court)，但太小又被籃球隊用；所以這個月在海邊沙灘上練。草地球場和籃球場都是被否定的地點。選 C"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30b'),PH('q30c')],a:1,sen:"My cousin Ray wasn't good at baseball at first. He couldn't hit the ball, and he couldn't catch it, either. But he didn't see it as a failure. He practiced with his dad every evening. Now he still isn't a good hitter, but he catches almost every ball at second base. &nbsp;Q: What can Ray do well now?",szh:"我表哥 Ray 一開始不太會打棒球(baseball)，他打不到球(ball)，也接(catch)不到球。但(but)他不把這看成失敗(failure)，每天晚上都和爸爸練習。現在他還是不太會打擊，但他守二壘(base)幾乎每球都接得到。　問：Ray 現在擅長什麼？",en:"Catching the ball at second base.",zh:"Ray 現在「還是不太會打擊」，所以打到球不是他擅長的；漏接是他「一開始」的樣子；現在他守二壘(base)幾乎每球都接(catch)得到。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 11 回　運動與比賽　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
