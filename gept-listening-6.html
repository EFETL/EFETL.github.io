<title>GEPT 初級 聽力測驗　第6回　家人與親戚</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#fff5ec,#fff9f4 70%);color:#22303f;line-height:1.6;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#f6d365,#fda085 60%,#ff7a9c);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(253,160,133,.35);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.14);}
  header.top p{margin:0;font-size:.92rem;opacity:.96;}
  .meta{margin-top:14px;font-size:.86rem;background:rgba(255,255,255,.24);
    padding:9px 13px;border-radius:10px;}
  .notice{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;
    padding:11px 15px;margin-bottom:14px;font-size:.86rem;color:#78350f;
    display:flex;align-items:flex-start;gap:9px;line-height:1.55;}
  .notice .ic{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#fff5ec 70%,rgba(255,245,236,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.9rem;
    box-shadow:0 4px 12px rgba(253,160,133,.14);}
  .bar .track{flex:1;height:9px;background:#f1e4dc;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#ffb02e,#ff7a59);transition:width .35s;}
  .bar #count{font-weight:700;color:#e0740a;}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#43cea2,#3ab0d6);}
  .section-desc{font-size:.86rem;color:var(--gray);margin:0 4px 10px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(253,160,133,.09);}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .qhead .num{display:inline-block;color:#fff;background:var(--coral);font-weight:700;
    border-radius:8px;padding:1px 10px;font-size:.92rem;}
  .play{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
    color:#fff;font-weight:800;font-size:.92rem;border-radius:22px;padding:8px 16px;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);box-shadow:0 4px 12px rgba(255,93,143,.3);}
  .play:active{transform:translateY(1px);}
  .play.playing{background:linear-gradient(135deg,#22b573,#1a9e63);}
  .play .wave{font-size:.8rem;opacity:.9;}
  .hintq{font-size:.8rem;color:var(--gray);}
  .fig{text-align:center;margin:4px 0 12px;}
  .fig svg{max-width:100%;height:auto;}
  .pic-img{border-radius:9px;border:1px solid #e6ded7;object-fit:cover;}
  .fig .pic-img{max-width:230px;width:100%;max-height:150px;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:.95rem;background:#fbfdff;}
  .opt:hover{border-color:var(--coral);background:#fff4ee;}
  .opt input{margin-top:3px;accent-color:var(--coral);}
  .opt .lab{font-weight:800;color:var(--coral);min-width:18px;}
  .opt.sel{border-color:var(--coral);background:#ffeee6;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .opt.listen .otext{display:none;}
  .opt.listen.lock .otext{display:inline;}
  .opt.listen .lab{font-size:1.05rem;}
  /* picture options (Part 4) */
  .picopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0;}
  .picopt{border:2px solid var(--line);border-radius:12px;padding:9px 6px;cursor:pointer;
    text-align:center;transition:.15s;background:#fbfdff;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .picopt:hover{border-color:var(--coral);background:#fff4ee;}
  .picopt.sel{border-color:var(--coral);background:#ffeee6;}
  .picopt.correct{border-color:var(--green);background:var(--green-bg);}
  .picopt.wrong{border-color:var(--red);background:var(--red-bg);}
  .picopt .lab{font-weight:800;color:var(--coral);align-self:flex-start;margin-left:4px;}
  .picopt.correct .lab{color:var(--green);}.picopt.wrong .lab{color:var(--red);}
  .picopt img.pic-img{width:100%;height:82px;}
  .picopt svg{width:100%;max-width:132px;height:auto;}
  .picopt svg.chart{max-width:100%;}
  .legend{display:flex;gap:12px;justify-content:center;font-size:.72rem;margin:2px 0 6px;color:#556;flex-wrap:wrap;}
  .legend i{display:inline-block;width:11px;height:11px;border:1px solid #999;margin-right:4px;vertical-align:-1px;}
  table.mini{border-collapse:collapse;font-size:.62rem;margin:0 auto;}
  table.mini th{background:#33414f;color:#fff;padding:2px 4px;}
  table.mini td{border:1px solid #bbb;padding:2px 4px;text-align:center;}
  .board{background:#111;color:#ffd24a;border-radius:5px;padding:5px;font-family:"Courier New",monospace;display:inline-block;}
  .board table{border-collapse:collapse;font-size:.6rem;color:#ffd24a;}
  .board th{color:#7fd7ff;padding:1px 4px;border-bottom:1px solid #444;}
  .board td{padding:1px 4px;text-align:center;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.9rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:.8rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .scriptbox{background:#f4f8ff;border-radius:8px;padding:7px 11px;margin:5px 0;font-size:.88rem;color:#20364d;}
  .exp .scriptbox b{color:var(--blue-dark);}
  .exp .en{color:#1c4f7a;background:#eef7ff;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .exp .zh{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff9f4 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--coral);border:2px solid var(--coral);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#ffb02e,#ff7a59,#ff5d8f);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(255,122,89,.18);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#ff7a59,#ff5d8f);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:.95rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:.95rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:.85rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:.8rem;margin:24px 0;}
.fig .p0img{max-width:440px;max-height:330px;width:100%;height:auto;}
</style>

<div class="wrap">

    <span>📈</span><span>我的成績 · 錯題回收 — 作答後看進步曲線、最弱單字與題型、一鍵重練</span>

<script>
/* ====== 圖形素材（第6回 家人與親戚） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/6/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const COW=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q1.jpg" alt="question 1 picture">`;
const HEN=`<svg width="120" height="108" viewBox="0 0 120 110"><ellipse cx="56" cy="66" rx="34" ry="26" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="86" cy="44" r="15" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><path d="M80 30 q3 -8 6 0 q3 -8 6 0 q3 -8 5 2" fill="#e53935" stroke="#1a1a1a" stroke-width="1"/><circle cx="90" cy="42" r="2" fill="#1a1a1a"/><path d="M100 46 l10 -3 l-10 6 z" fill="#ffb703"/><path d="M22 62 q-12 4 -6 16 q8 -2 10 -10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><g stroke="#ffb703" stroke-width="2.5"><line x1="48" y1="90" x2="48" y2="104"/><line x1="64" y1="90" x2="64" y2="104"/></g></svg>`;
const LAMB=`<svg width="126" height="108" viewBox="0 0 126 110"><g fill="#fff" stroke="#1a1a1a" stroke-width="2"><circle cx="52" cy="58" r="14"/><circle cx="70" cy="52" r="14"/><circle cx="86" cy="60" r="14"/><circle cx="60" cy="70" r="14"/><circle cx="78" cy="72" r="14"/></g><ellipse cx="98" cy="58" rx="12" ry="14" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="88" cy="52" rx="4" ry="6" fill="#3a3a3a"/><ellipse cx="108" cy="52" rx="4" ry="6" fill="#3a3a3a"/><circle cx="96" cy="56" r="2" fill="#fff"/><circle cx="102" cy="56" r="2" fill="#fff"/><g stroke="#3a3a3a" stroke-width="2.5"><line x1="60" y1="84" x2="60" y2="100"/><line x1="80" y1="84" x2="80" y2="100"/></g></svg>`;
const FRAME=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q3.jpg" alt="question 3 picture">`;
const GLASSES=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q4.jpg" alt="question 4 picture">`;
const BLOUSE=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q5.jpg" alt="question 5 picture">`;
const CAKE=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q2.jpg" alt="question 2 picture">`;
/* ====== 大題 ====== */
const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];



/* ====== 題庫（第6回 家人與親戚） ====== */
const Q=[
{n:1,p:0,fig:COW,o:["The farmer feeds a cow and a hen.","The farmer feeds a lamb and a hen.","The farmer feeds a cow and a pig."],a:0,sen:"For question one, look at the picture. What is on the farm?",szh:"第一題，請看圖片。農場上有什麼？",en:"The farmer feeds a cow and a hen.",zh:"農夫(farmer)餵的是母牛(cow)和母雞(hen)，選 A。B 把牛換成小羊(lamb)、C 把雞換成豬，都和圖片不符。"},
{n:2,p:0,fig:CAKE,o:["The family has a Mother's Day party.","The family has a birthday party.","The family has a Father's Day party."],a:0,sen:"For question two, look at the picture. What is the family celebrating?",szh:"第二題，請看圖片。家人在慶祝什麼？",en:"A Mother's Day party.",zh:"全家(family)在辦母親節(Mother's Day)派對(party)，選 A。Father's Day 聽起來很像，但是父親節，不是圖中的節日。"},
{n:3,p:0,fig:FRAME,o:["My sister, my cousin and my son are in it.","My brother, my cousin and my daughter are in it.","My brother, my cousin and my son are in it."],a:1,sen:"For question three, look at the picture. Who is in the family photo?",szh:"第三題，請看圖片。全家福裡有誰？",en:"My brother, my cousin and my daughter are in the family photo.",zh:"選 B。照片裡有一位年輕男子、一位年輕女子和一個小女孩，所以是哥哥或弟弟 (brother)、表親 (cousin) 和女兒 (daughter)；照片裡沒有男孩，所以有兒子 (son) 的選項都不對。"},
{n:4,p:0,fig:GLASSES,o:["Grandmother lost her old keys.","Grandmother lost her old umbrella.","Grandmother lost her old glasses."],a:2,sen:"For question four, look at the picture. What did grandmother lose?",szh:"第四題，請看圖片。奶奶弄丟了什麼？",en:"Her old glasses.",zh:"奶奶(grandmother)弄丟的是舊眼鏡(glasses)，選 C。鑰匙和雨傘是同樣句型的干擾，要聽清楚物品。"},
{n:5,p:0,fig:BLOUSE,o:["She wears a white blouse with a pattern.","She wears a black skirt with a pattern.","She wears a black blouse with a pattern."],a:2,sen:"For question five, look at the picture. What is the girl wearing?",szh:"第五題，請看圖片。女孩穿什麼？",en:"A black blouse with a pattern.",zh:"女孩穿有圖案(pattern)的黑色(black)上衣(blouse)，選 C。A 顏色錯(白色)、B 衣服種類錯(裙子)。"},

{n:6,p:1,o:["She was born last Sunday.","It's my cousin's baby daughter.","It's a lovely day, isn't it?"],a:1,sen:"Whose lovely baby is this?",szh:"這個可愛的寶寶是誰的？",en:"My cousin's baby daughter.",zh:"問寶寶(baby)是誰的，答『我表親(cousin)的女兒(daughter)』，選 B。A 回答的是『何時出生』，C 只是重複 lovely 的閒聊。"},
{n:7,p:1,o:["It's on Sunday, at her house.","A party with a lot of flowers.","Mother's Day is my favorite holiday."],a:1,sen:"What is your idea for Mother's Day?",szh:"你母親節有什麼點子？",en:"A party with a lot of flowers.",zh:"問母親節(Mother's Day)的點子(idea)，答『一場有很多(lot)花的派對(party)』，選 B。A 答的是時間地點，C 只重複 Mother's Day 沒回答點子。"},
{n:8,p:1,o:["Yes, I wish it were easier.","It starts at nine tomorrow morning.","The final game is on Saturday."],a:0,sen:"Is the final exam difficult?",szh:"期末考很難嗎？",en:"Yes; I wish it were easier.",zh:"問期末考難不難(difficult)，答『對，我希望(wish)它容易一點』，選 A。B 答的是時間，C 重複 final 卻答非所問。"},
{n:9,p:1,o:["The show starts at eight tonight.","She's an actress, my father's cousin.","She's wearing a long black dress."],a:1,sen:"Who is that woman on TV?",szh:"電視上那個女人是誰？",en:"An actress, my father's cousin.",zh:"問那位女士是誰，答『她是演員(actress)，我爸爸(father)的表親(cousin)』，選 B。A 回答時間(八點 eight)，C 只描述衣服。"},
{n:10,p:1,o:["We have dinner together every Sunday.","We live on Green Street.","Eight, including my grandfather."],a:2,sen:"How many people are there in your family?",szh:"你家有幾個人？",en:"Eight, including grandfather.",zh:"問家(family)裡幾人，答『八(eight)個，包括我爺爺(grandfather)』，選 C。A 是聚餐頻率，B 是住址(where)。"},
{n:11,p:1,o:["He's very tall for his age.","He's fourteen, in junior high school.","My brother plays baseball after school."],a:1,sen:"How old is your younger brother now?",szh:"你弟弟現在幾歲？",en:"Fourteen, in junior high school.",zh:"問弟弟(brother)幾歲，答『十四(fourteen)歲，念國中(junior high school)』，選 B。A 說身高，C 重複 brother 卻說運動。"},
{n:12,p:1,o:["Not yet. The last step is difficult.","Because I wanted to learn more.","There's a big tree in my yard."],a:0,sen:"Have you already finished the family tree?",szh:"你的家族樹已經做好了嗎？",en:"Not yet; the last step is hard.",zh:"問是否已經(already)做完，答『還沒，最後一步(step)很難(difficult)』，選 A。B 答的是原因(why)，C 重複 tree 卻無關。"},
{n:13,p:1,o:["About two hours, I think.","Spaghetti, and apple pie for dessert.","Grandmother lives near the station."],a:1,sen:"What did grandmother cook for the reunion?",szh:"團圓飯奶奶煮了什麼？",en:"Spaghetti and apple pie.",zh:"問奶奶煮了什麼，答『義大利麵(spaghetti)和蘋果(apple)派』，選 B。A 答的是時間長度，C 重複 grandmother 卻說住處。"},
{n:14,p:1,o:["They'll come to visit us next Sunday.","They are both over seventy years old.","In an old house with a high ceiling."],a:2,sen:"Where do your grandparents live?",szh:"你的祖父母住哪裡？",en:"In an old house with a high ceiling.",zh:"問祖父母住哪裡，答『住在有高天花板(ceiling)的老房子』，選 C。A 答時間(when)，B 答年齡(how old)。"},
{n:15,p:1,o:["I'm not sure. Maybe someone next door.","It's too old to be used any more.","The water in the kitchen is cold."],a:0,sen:"Who broke the water pipe?",szh:"是誰弄壞了水管？",en:"Not sure; maybe someone next door.",zh:"問誰弄壞水管(pipe)，答『不確定，也許是隔壁某人(someone)』，選 A。B 說管子太舊(used)，卻沒說是誰；C 重複 water 卻答非所問。"},

{n:16,p:2,o:["Two grandsons and a niece.","A grandson and a granddaughter.","A son and a granddaughter."],a:1,sen:"W: How many grandchildren does grandma have? &nbsp;M: Two: a grandson and a granddaughter. &nbsp;W: How sweet. &nbsp;Q: What grandchildren does grandma have?",szh:"女：奶奶有幾個孫子女？　男：兩個：一個孫子(grandson)和一個孫女(granddaughter)。　女：真甜蜜。　問：奶奶有哪些孫輩？",en:"A grandson and a granddaughter.",zh:"奶奶有一個孫子(grandson)和一個孫女(granddaughter)，選 B。A、C 各混入一個錯的人物，要兩個都對才行。"},
{n:17,p:2,o:["A couple with a small child.","A farmer and his animals.","A teacher and her students."],a:1,sen:"W: Who lives on that farm? &nbsp;M: The farmer, with his cow, hen and a little lamb. &nbsp;W: A busy farm. &nbsp;Q: Who lives on the farm?",szh:"女：那座農場住著誰？　男：農夫(farmer)，還有他的母牛(cow)、母雞(hen)和一隻小羊(lamb)。　女：好忙的農場。　問：誰住在農場？",en:"A farmer and his animals.",zh:"農場住著農夫(farmer)和他的牛、雞、羊，選 B。A、C 都是人，但不是對話說的農夫。"},
{n:18,p:2,o:["A photo of the street.","A picture of Grandfather.","A map of the town."],a:2,sen:"M: We're lost. I can't find Grandfather's street. &nbsp;W: Don't worry. My daughter put something in my bag. It shows every street in town. &nbsp;M: Great idea! Let's take a look. &nbsp;Q: What did the daughter put in the bag?",szh:"男：我們迷路了，我找不到爺爺(Grandfather)家那條街(street)。　女：別擔心，我女兒(daughter)在我包包裡放了東西，它會顯示鎮上每條街。　男：好主意！我們來看看。　問：女兒在包包裡放了什麼？",en:"A map of the town.",zh:"對話說女兒放了一樣東西在包包裡，它能顯示鎮上每條街(street)，那就是地圖(map)，選 C。A 的照片只拍一條街，B 的圖片和找路無關。"},
{n:19,p:2,o:["She is a farmer.","She is a teacher.","She is an actress."],a:2,sen:"W: Who will be the host for our Mother's Day show? &nbsp;M: Ms. Wang. She is a female star you often see in TV dramas. &nbsp;W: Oh, I love her! &nbsp;Q: What is Ms. Wang's job?",szh:"女：誰來主持我們的母親節(Mother's Day)表演？　男：王女士，就是常在電視劇裡看到的女性(female)明星。　女：哦，我好愛她！　問：王女士的工作是什麼？",en:"She is an actress.",zh:"『常在電視劇(TV dramas)裡看到的女性(female)明星』就是女演員(actress)，選 C。對話沒說老師或農夫，要從線索推論。"},
{n:20,p:2,o:["It ate an apple quickly.","It ate the straw quickly.","It drank some milk quickly."],a:1,sen:"M: What did the lamb do? &nbsp;W: The little lamb ate the straw very quickly. &nbsp;M: Hungry lamb! &nbsp;Q: What did the lamb do?",szh:"男：那隻小羊做了什麼？　女：小羊(lamb)很快(quick)地吃了稻草(straw)。　男：餓壞的羊！　問：小羊做了什麼？",en:"It ate the straw quickly.",zh:"小羊(lamb)很快(quick)地吃了稻草(straw)，選 B。三個選項都有 quickly，要聽清楚吃的東西。"},
{n:21,p:2,o:["She is too negative.","She plans too many parties.","She is too busy to plan."],a:0,sen:"W: Nobody will like my party idea. It won't be a success. &nbsp;M: Why do you always think about the bad side? &nbsp;W: Sorry. Anyway, I will start planning. &nbsp;Q: What does the man say about the woman?",szh:"女：沒人會喜歡我的派對(party)點子(idea)，不會成功(success)的。　男：你為什麼總是想壞的一面？　女：抱歉。不過(anyway)我還是會開始計畫。　問：男士覺得女士怎麼樣？",en:"She is too negative.",zh:"女士說沒人會喜歡、不會成功(success)，男士叫她別老想壞的一面，表示她太負面(negative)，選 A。B、C 重複 party、plan 的概念卻不是男士的看法。"},
{n:22,p:2,o:["Another chance to win.","A different coach.","A day off."],a:0,sen:"M: You look sad. Did you lose the game? &nbsp;W: Yes, I played badly. There is another game next week. &nbsp;M: What do you hope for? &nbsp;W: To play them again and do better. &nbsp;Q: What does the woman want?",szh:"男：你看起來很難過，比賽輸了嗎？　女：對，我打得很差(badly)。下週還有一場比賽。　男：你希望什麼？　女：希望再跟他們打一次，表現更好。　問：女士想要什麼？",en:"Another chance to win.",zh:"女士輸了比賽，希望再跟對手打一次、表現更好，也就是想再有一次機會(chance)，選 A。B 換教練、C 放假，對話都沒提。"},
{n:23,p:2,o:["A woman and her baby.","A man and his two sons.","A couple and their child."],a:2,sen:"W: Has anyone moved into the old house on our street? &nbsp;M: Yes. A man and his wife arrived yesterday, with their little boy. &nbsp;W: Nice neighbors. &nbsp;Q: Who moved in?",szh:"女：有人搬進我們街(street)上那間老房子了嗎？　男：有，一位先生和他太太昨天帶著他們的小男孩來了。　女：好鄰居。　問：誰搬進來了？",en:"A couple and their child.",zh:"一個男人和他太太帶著小男孩搬來，就是一對夫妻(couple)和他們的孩子(child)，選 C。B 的男士和兩個兒子少了太太。"},
{n:24,p:2,o:["It was ruined by juice.","It was lost on the bus.","It was too small for her."],a:0,sen:"M: You look unhappy. What's wrong? &nbsp;W: I spilled juice on my new blouse. &nbsp;M: Did you wash it? &nbsp;W: Yes, following the label, but the stain is still there. &nbsp;Q: What happened to the blouse?",szh:"男：你看起來不開心，怎麼了？　女：我把果汁灑在新上衣(blouse)上。　男：你洗過了嗎？　女：洗了，照標籤(following the label)洗，但污漬還在。　問：上衣怎麼了？",en:"It was ruined by juice.",zh:"女士把果汁灑在上衣(blouse)上，照標籤(following the label)洗了污漬還在，等於毀了(ruin)，選 A。B、C 是對話沒提到的其他問題。"},
{n:25,p:2,o:["Her phone number.","The alphabet.","Some new colors."],a:1,sen:"W: How is your little cousin doing at school? &nbsp;M: Very well. She can already say all twenty-six letters, from A to Z. &nbsp;W: Wow, she is only five! &nbsp;Q: What has the cousin learned?",szh:"女：你的小表妹(cousin)在學校還好嗎？　男：很好，她已經(already)會說二十六個字母，從 A 到 Z。　女：哇，她才五歲！　問：表妹學會了什麼？",en:"The alphabet.",zh:"表親(cousin)已經(already)會說A到Z二十六個字母，就是學會字母表(alphabet)，選 B。A、C 對話沒提。"},

{n:26,p:3,pic:true,o:[BARS("Cousins",["Amy","Ben","Cid"],[50,80,20]),BARS("Cousins",["Amy","Ben","Cid"],[20,50,80]),BARS("Cousins",["Amy","Ben","Cid"],[80,50,20])],a:2,sen:"In our class we did a survey about how many cousins each individual child has. Amy has the most cousins, a really big family. Ben has fewer, in the middle. Cid has the least, only a few. So Amy's bar should be the tallest. &nbsp;Q: Which chart shows the number of cousins?",szh:"我們班調查每位個別(individual)孩子(child)有幾個表親(cousin)。Amy 最多，家族(family)很大；Ben 中等；Cid 最少。所以 Amy 的長條最高。　問：哪張圖顯示表親人數？",en:"Amy most, Cid least.",zh:"Amy 的表親(cousin)最多、Cid 最少，Amy 的長條最高，選 C。要注意 Ben 在中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Family Size",["Grandpa","Dad","Me"],[80,55,30]),BARS("Family Size",["Grandpa","Dad","Me"],[30,55,80]),BARS("Family Size",["Grandpa","Dad","Me"],[55,80,30])],a:0,sen:"My grandfather often says families are getting smaller. In his childhood the family was the biggest, with eight children. My father's family was middle-sized. My own family is the smallest, with only two children. So the numbers go down over time. &nbsp;Q: Which chart shows our family sizes?",szh:"我爺爺(grandfather)常說家庭越來越小。他小時候家(family)最大，有八(eight)個小孩；我爸爸(father)家中等；我自己的家最小，只有兩個孩子。所以數字隨時間下降。　問：哪張圖顯示家庭人數？",en:"Grandpa biggest, me smallest.",zh:"爺爺(grandfather)家八個小孩最多、我家最少，數字逐代下降，選 A。要看清楚是『越來越少』，不是越來越多。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('bread'),IMG('rice')],a:0,
 sen:"For Mother's Day, my whole family cooked together. My father wanted rice and my sister wanted bread, but our mother's favorite is spaghetti. So in the end we made a big plate of spaghetti noodles for her, and she was very happy. &nbsp;Q: What did the family make for mother?",
 szh:"母親節(Mother's Day)那天全家(family)一起煮飯。爸爸(father)想吃飯，姊姊想吃麵包，但媽媽最愛義大利麵(spaghetti)。所以最後我們做了一大盤義大利麵(即麵 noodles)給她，她很開心。　問：家人為媽媽做了什麼？",
 en:"Spaghetti (noodles).",zh:"家人做了義大利麵(spaghetti/noodles)，選 A。飯、麵包為干擾。"},
{n:29,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:2,
 sen:"My grandmother lives on a small farm with many animals. She keeps a big cow for milk and some hens for eggs. But her favorite food to cook is not from the farm; she loves to make a warm bowl of noodles for her grandson every weekend. &nbsp;Q: What does grandmother love to cook?",
 szh:"我奶奶(grandmother)住在有很多動物的小農場，她養一頭母牛(cow)擠奶、幾隻母雞(hen)生蛋。但她最愛煮的不是農場的東西，而是每週末為孫子(grandson)煮一碗熱麵(noodles)。　問：奶奶最愛煮什麼？",
 en:"A warm bowl of noodles.",zh:"奶奶最愛煮麵(noodles)，選 C。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('park'),IMG('beach')],a:2,
 sen:"Every year on Mother's Day our family takes a trip. Grandfather likes the mountain and my cousin likes the park, but this year mother chose the beach. We built sand castles with the baby, and the whole family had a wonderful time by the sea. &nbsp;Q: Where did the family go this year?",
 szh:"每年母親節(Mother's Day)我們家(family)都會旅行。爺爺(grandfather)喜歡山，表親(cousin)喜歡公園，但今年媽媽選了海邊(beach)。我們和寶寶(baby)一起堆沙堡，全家在海邊玩得很開心。　問：今年家人去了哪裡？",
 en:"The beach.",zh:"今年一家人去海邊(beach)，選 C。山、公園為干擾。"}
];

/* ====== 音檔播放（AAC/.m4a，各廠牌手機皆支援）====== */
let curAudio=null, curBtn=null;
function resetPlayBtn(b){ if(!b) return; b.classList.remove('playing'); b.querySelector('.txt').textContent = b.dataset.played?'重播':'播放'; }
function stopAudio(){ if(curAudio) curAudio.pause(); if(curBtn) resetPlayBtn(curBtn); curAudio=null; curBtn=null; }
function playAudio(audio,btn){
  if(curAudio===audio){                       // 同一題：暫停 / 繼續
    if(audio.paused){ audio.play(); btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…'; }
    else { audio.pause(); }
    return;
  }
  if(curAudio){ curAudio.pause(); resetPlayBtn(curBtn); }   // 換題：停掉上一段
  curAudio=audio; curBtn=btn; btn.dataset.played='1';
  btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…';
  audio.play().catch(()=>resetPlayBtn(btn));
}

/* ====== 產生畫面 ====== */
const form=document.getElementById('quiz');
let lastP=-1;
Q.forEach(q=>{
  if(q.p!==lastP){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].t;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].d;
    form.appendChild(st); form.appendChild(sd); lastP=q.p;
  }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const head=document.createElement('div'); head.className='qhead';
  head.innerHTML=`<span class="num">${q.n}</span>
    <button type="button" class="play"><span class="wave">🔊</span><span class="txt">播放</span></button>
    <span class="hintq">聆聽後作答</span>`;
  card.appendChild(head);
  const audio=document.createElement('audio'); audio.preload='none'; audio.src='gept-listening-audio/6/q'+q.n+'.m4a?v=r6p0d-20261003'; card.appendChild(audio);
  const pbtn=head.querySelector('.play');
  pbtn.addEventListener('click',()=>playAudio(audio,pbtn));
  audio.addEventListener('ended',()=>{ if(curBtn===pbtn){ resetPlayBtn(pbtn); curAudio=null; curBtn=null; } });
  audio.addEventListener('pause',()=>{ if(curAudio===audio && curBtn===pbtn && !audio.ended){ pbtn.classList.remove('playing'); pbtn.querySelector('.txt').textContent='繼續'; } });
  if(q.fig){ const f=document.createElement('div'); f.className='fig'; f.innerHTML=q.fig; card.appendChild(f); }
  if(q.pic){
    if(q.legend){ const lg=document.createElement('div'); lg.innerHTML=PIE_LEGEND; card.appendChild(lg.firstChild); }
    const wrap=document.createElement('div'); wrap.className='picopts';
    q.o.forEach((opt,i)=>{
      const cell=document.createElement('label'); cell.className='picopt'; cell.dataset.i=i;
      cell.innerHTML=`<span class="lab">${'ABC'[i]}</span>${opt}<input type="radio" name="q${q.n}" value="${i}" hidden>`;
      cell.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.picopt').forEach(o=>o.classList.remove('sel')); cell.classList.add('sel'); updateProgress(); });
      wrap.appendChild(cell);
    });
    card.appendChild(wrap);
  } else {
    q.o.forEach((opt,i)=>{
      const lab=document.createElement('label'); lab.className=(q.p===0?'opt listen':'opt'); lab.dataset.i=i;
      lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABC'[i]}</span><span class="otext">${opt}</span>`;
      lab.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); lab.classList.add('sel'); updateProgress(); });
      card.appendChild(lab);
    });
  }
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n; card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
const TOT=Q.length;
function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOT}`;
  document.getElementById('fill').style.width=(c/TOT*100)+'%';
  hint.textContent = c===TOT ? '已完成全部 30 題' : (c===0 ? '尚未作答任何題目（仍可送出查看解析）' : `已作答 ${c} 題，未作答 ${TOT-c} 題（仍可送出）`);
}

submitBtn.addEventListener('click',()=>{
  stopAudio();
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick=sel?parseInt(sel.value):null;
    if(pick===null) blank++;
    const card=document.getElementById('q'+q.n);
    const cls=q.pic?'.picopt':'.opt';
    card.querySelectorAll(cls).forEach(o=>{
      o.classList.add('lock');
      const inp=o.querySelector('input'); if(inp) inp.disabled=true;
      const i=parseInt(o.dataset.i);
      if(i===q.a) o.classList.add('correct');
      if(pick!==null && i===pick && pick!==q.a) o.classList.add('wrong');
    });
    const correct=pick===q.a; if(correct) ok++;
    const exp=document.getElementById('exp'+q.n);
    const tag=correct?'答對':(pick===null?'未作答':'答錯');
    exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABC'[q.a]}</span>
      <div class="scriptbox"><b>聽力原文</b>　${q.sen}<br><span style="color:#7a4a12">${q.szh}</span></div>
      <div class="en"><b>EN</b>&nbsp;${q.en}</div><div class="zh"><b>中</b>&nbsp;${q.zh}</div>`;
    exp.classList.add('show');
  });
  document.getElementById('scoreNum').textContent=Math.round(ok/TOT*120);
  document.getElementById('scoreTxt').textContent=`／120 分　${Math.round(ok/TOT*120)>=80?'達參考通過線 ✅':'未達通過線（80）'}（答對 ${ok}／${TOT} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOT-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  try{
    var _m=location.pathname.match(/gept-listening-(\d+)\.html/);
    var _round=_m?parseInt(_m[1]):0;
    var _ans=Q.map(function(q){var s=form.querySelector('input[name="q'+q.n+'"]:checked');var pk=s?parseInt(s.value):null;return {n:q.n,p:q.p,pick:pk,a:q.a,ok:pk===q.a};});
    var _rec={round:_round,date:new Date().toISOString(),score:Math.round(ok/TOT*120),total:TOT,correct:ok,blank:blank,ans:_ans};
    var _K='efetl_listening_results';
    var _all=JSON.parse(localStorage.getItem(_K)||'[]');
    _all.push(_rec);
    localStorage.setItem(_K,JSON.stringify(_all.slice(-800)));
    if(window.EFETL_CLOUD){EFETL_CLOUD.upload(_rec);}
  }catch(_e){}
  const res=document.getElementById('result'); res.classList.add('show');
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  stopAudio(); form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt,.picopt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');const inp=o.querySelector('input');if(inp)inp.disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress(); window.scrollTo({top:0,behavior:'smooth'});
});

updateProgress();
</script>
</body>
