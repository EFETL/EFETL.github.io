<div class="bar">

<div id="root"></div>
<script>
/* 圖形素材（第31回 天氣） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/31/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/31/p3_${n}.jpg?v=r31qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const RAINCLOUD=`<img class="pic-img p0img" src="gept-listening-img/31/p0_q1.jpg" alt="question 1 picture">`;
const LIGHTNING=`<img class="pic-img p0img" src="gept-listening-img/31/p0_q2.jpg" alt="question 2 picture">`;
const TYPHOON=`<img class="pic-img p0img" src="gept-listening-img/31/p0_q3.jpg" alt="question 3 picture">`;
const UMBRELLA=`<img class="pic-img p0img" src="gept-listening-img/31/p0_q4.jpg" alt="question 4 picture">`;
const SNOWFLAKE=`<img class="pic-img p0img" src="gept-listening-img/31/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:RAINCLOUD,o:["They are walking on the sidewalk with umbrellas.","They are standing together under one huge umbrella.","They are riding motorcycles in the rain."],a:0,sen:"For question one, look at the picture. What are the people doing on this rainy street?",szh:"第一題，請看圖片。在這條下雨(rainy)的街上，人們在做什麼？",en:"They are walking on the sidewalk with umbrellas.",zh:"圖中好幾個人各自撐著雨傘(umbrella)，走在濕濕的人行道(sidewalk)上，正確。圖中沒有人在騎機車(motorcycle)，右邊只停著一台腳踏車；每個人都撐自己的傘、而且在走路，不是一起站在一把巨大(huge)的傘下。選 A"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">RAIN SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Umbrella</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Coat</td><td style="text-align:right;font-weight:700">$400</td></tr><tr><td style="padding:4px 30px 4px 0">Shoes</td><td style="text-align:right;font-weight:700">$250</td></tr><tr><td style="padding:4px 30px 4px 0">Hat</td><td style="text-align:right;font-weight:700">$100</td></tr></table></div>`,o:["He will have six hundred fifty dollars left.","He will have one hundred fifty dollars left.","He will have four hundred dollars left."],a:1,sen:"For question two, look at the picture. Sam has eight hundred dollars. On a stormy day, he buys a coat and shoes. How much will he have left?",szh:"第二題，請看圖片。山姆有八百元。在一個暴風雨(stormy)的日子，他買了一件外套和一雙鞋子。他還剩多少錢？",en:"He will have one hundred fifty dollars left.",zh:"價目表上外套(coat)400元、鞋子(shoes)250元，一共650元，800減650剩150元。剩六百五十元是把花掉的錢當成剩下的錢；剩四百元是只買了外套、忘記鞋子。選 B"},
{n:3,p:0,fig:TYPHOON,o:["Big waves are hitting the wall, and people are running away.","The sea is calm, and the wind is blowing the trees.","Big waves are hitting the wall, and the wind is blowing the trees."],a:2,sen:"For question three, look at the picture. What is the typhoon doing to the coast?",szh:"第三題，請看圖片。颱風(typhoon)對海岸造成什麼影響？",en:"Big waves are hitting the wall, and the wind is blowing the trees.",zh:"大浪打上海邊的堤牆，強風把椰子樹吹得歪向一邊，正確。圖中一個人都沒有，所以「人們在逃跑」不對；海浪很大，不是平靜的海。選 C"},
{n:4,p:0,fig:UMBRELLA,o:["She is holding an umbrella and walking on the bridge.","She is putting her umbrella into a bucket.","She is holding an umbrella and looking at the sea."],a:2,sen:"For question four, look at the picture. What is the woman doing?",szh:"第四題，請看圖片。這位女士在做什麼？",en:"She is holding an umbrella and looking at the sea.",zh:"女士撐著雨傘(umbrella)站在海邊，望著海，正確。橋在很遠的後方，她不是走在橋上；她手上還握著傘，沒有把傘放進(into)水桶(bucket)裡。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Park Cleanup</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="96" y="75" width="44" height="75" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="70" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="228" y="125" width="44" height="25" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="120" font-size="14" font-weight="700" text-anchor="middle">10</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Leaves</text><text x="118" y="167" text-anchor="middle">Bottles</text><text x="184" y="167" text-anchor="middle">Cups</text><text x="250" y="167" text-anchor="middle">Bags</text></g></svg>`,o:["They picked up sixty.","They picked up seventy.","They picked up forty."],a:0,sen:"For question five, look at the picture. After the storm, the students cleaned the park. How many leaves and cups did they pick up in all?",szh:"第五題，請看圖片。暴風雨過後，學生們打掃公園。他們一共撿了多少片樹葉和多少個杯子？",en:"They picked up sixty.",zh:"圖中樹葉(leaf)40片、杯子20個，加起來60。七十是把瓶子30個當成杯子；四十只算了樹葉，忘了杯子。選 A"},
{n:6,p:1,o:["The bus comes every ten minutes.","Yes, I like your red umbrella.","You're so careless! You can use mine today."],a:2,sen:"I left my umbrella on the bus again.",szh:"我又把雨傘忘在公車上了。",en:"You're so careless! You can use mine today.",zh:"對方說又(again)把雨傘(umbrella)忘在公車上，回「你真粗心(careless)！今天先用我的吧」最自然。「公車每十(ten)分鐘一班」只是重複 bus；「是的，我喜歡(like)你的紅色(red)雨傘」傘已經不見了，答非所問。選 C"},
{n:7,p:1,o:["I'll check the weather tomorrow.","Only ten degrees. You'll need a coat.","It was hot and humid yesterday."],a:1,sen:"What's the temperature outside right now?",szh:"現在外面氣溫(temperature)幾度？",en:"Only ten degrees. You'll need a coat.",zh:"問「現在」的氣溫(temperature)，答「只有十(ten)度，你需要穿外套」才是現在的溫度。「昨天又熱又潮濕(humid)」時間不對；「我明天再查天氣(weather)」沒有回答，時間也不對。選 B"},
{n:8,p:1,o:["No, there won't be any storms tonight.","Yes, I heard your voice on the radio.","Hear it? It woke me up three times!"],a:2,sen:"Did you hear the thunder last night?",szh:"你昨晚有聽到打雷(thunder)嗎？",en:"Hear it? It woke me up three times!",zh:"問有沒有聽到昨晚的雷聲(thunder)，回「何止聽到？它把我吵醒三次！」是間接的肯定。「我在廣播聽到你的聲音(voice)」只是重複 hear；「今晚不會有暴風雨(storm)」時間和內容都不對。選 C"},
{n:9,p:1,o:["Because a typhoon is coming.","The principal did, after the typhoon news.","At seven this morning."],a:1,sen:"Who made the decision to close the school today?",szh:"今天是誰決定(decision)停課的？",en:"The principal did, after the typhoon news.",zh:"問「誰」做的決定(decision)，答「校長，在看到颱風(typhoon)消息之後」才是人物。「因為颱風要來」答的是原因；「今天早上七點」答的是時間。選 B"},
{n:10,p:1,o:["Did you eat too many of these grapes again?","Lunch is at twelve today.","Please don't touch my lunch."],a:0,sen:"My stomach feels bad after eating these grapes at lunch.",szh:"午餐吃了這些(these)葡萄(grape)之後，我的胃(stomach)不太舒服(bad)。",en:"Did you eat too many of these grapes again?",zh:"對方說午餐(lunch)後胃(stomach)不舒服，回「你是不是又吃了太多這些(these)葡萄(grape)？」是在關心原因，最自然。「今天十二點吃午餐」只是重複 lunch；「請不要碰(touch)我的午餐」與對方的不舒服無關。選 A"},
{n:11,p:1,o:["Yes, it's very humid today.","I mean the air feels hot and wet.","I don't like rainy weather."],a:1,sen:"What do you mean by humid weather?",szh:"你說的潮濕(humid)天氣是什麼意思？",en:"I mean the air feels hot and wet.",zh:"問 humid 是什麼意思(mean)，答「我是說空氣感覺又熱又濕」是在解釋。用 Yes 回答 wh- 問句不對；「我不喜歡下雨(rainy)天」沒有解釋意思。選 B"},
{n:12,p:1,o:["I maintain it myself. My dad taught me.","It's on the sidewalk outside.","Once a month, with a bucket of water."],a:0,sen:"Who takes care of your motorcycle?",szh:"誰在照顧你的機車(motorcycle)？",en:"I maintain it myself. My dad taught me.",zh:"問「誰」照顧機車(motorcycle)，答「我自己保養(maintain)，是我爸教我的」回答了人物。「一個月一次，用一桶(bucket)水」答的是多久一次、怎麼做；「它停在外面人行道(sidewalk)上」答的是地點。選 A"},
{n:13,p:1,o:["I like the story you told me.","Then let's bring the chairs into the house.","It was sunny all day yesterday."],a:1,sen:"The weather report says a storm is coming tonight.",szh:"氣象報告說今晚暴風雨要來。",en:"Then let's bring the chairs into the house.",zh:"對方說天氣(weather)預報今晚有暴風雨(storm)，回「那我們把椅子搬進(into)屋裡吧」是合理的準備。「昨天整天晴天」時間不對；「我喜歡(like)你講的故事(story)」是 story 和 storm 的音近陷阱。選 B"},
{n:14,p:1,o:["They clapped for ten minutes.","With their hands, of course.","Lisa just played the violin very well."],a:2,sen:"Why is everyone clapping?",szh:"為什麼大家都在鼓掌(clap)？",en:"Lisa just played the violin very well.",zh:"問大家為什麼鼓掌(clap)，答「Lisa 剛剛小提琴(violin)拉得很好」說出原因。「當然是用手」答的是怎麼拍；「他們拍了十(ten)分鐘」時態和內容都不對。選 C"},
{n:15,p:1,o:["Only about eighty. The rain kept many people home.","I voted for Ms. Wang.","It will rain until ten P.M."],a:0,sen:"How many voters came out in the rain today?",szh:"今天有多少選民(voter)冒雨出來投票？",en:"Only about eighty. The rain kept many people home.",zh:"問有「多少」選民(voter)，答「只有大約八十(eighty)人，雨讓很多人待在家」回答了數量。「我投給王女士」說的是自己投給誰；「雨會下到晚上十點(P.M.)」答的是時間。選 A"},
{n:16,p:2,o:["At six P.M.","At ten P.M.","At eight P.M."],a:2,sen:"W: The weather information on my phone says the typhoon will hit at ten P.M. tonight. &nbsp;M: Not anymore. It's moving faster, so it'll come two hours earlier. &nbsp;W: Then I'll leave work at six to get home in time. &nbsp;Q: When will the typhoon hit now?",szh:"女：我手機上的天氣(weather)資訊(information)說颱風(typhoon)今晚十點(P.M.)會來。　男：不是了。它移動得比較快，會提早兩小時到。　女：那我六點下班，才能及時到家。　問：颱風現在預計什麼時候來？",en:"At eight P.M.",zh:"原本預報晚上十點，但颱風(typhoon)走得快、提早兩小時，所以是八點。十點是原本的時間，已經改了；六點是女士要下班的時間。選 C"},
{n:17,p:2,o:["He broke her window in the storm.","He is kind and friendly.","He wanted money for his help."],a:1,sen:"M: Have you met our new neighbor yet? &nbsp;W: Yes. After the storm, he helped me fix my window and didn't want any money. &nbsp;M: How nice! &nbsp;W: He even brought my kids some Coke. &nbsp;Q: What is the new neighbor like?",szh:"男：你見過(yet)我們的新鄰居了嗎？　女：見過了。暴風雨(storm)過後，他幫我修窗戶，而且不收錢。　男：真好！　女：他還帶了可樂(Coke)給我的孩子。　問：新鄰居是個怎麼樣的人？",en:"He is kind and friendly.",zh:"鄰居主動幫忙修窗戶、不收錢，還送可樂給孩子，換句話說就是「親切友善(friendly)」。窗戶是被暴風雨(storm)弄壞的，不是他打破的；他「不要」錢，所以要錢的說法正好相反。選 B"},
{n:18,p:2,o:["Twenty-two degrees.","Ten degrees.","Thirty-two degrees."],a:0,sen:"W: It was so hot at lunch. The temperature was thirty-two degrees. &nbsp;M: It's much cooler now, after all that thunder and rain. &nbsp;W: Yes. It dropped ten degrees in an hour. &nbsp;Q: What is the temperature now?",szh:"女：午餐(lunch)時好熱，氣溫(temperature)有三十二度。　男：打雷(thunder)下雨之後，現在涼多了。　女：對，一個小時就降了十度。　問：現在氣溫幾度？",en:"Twenty-two degrees.",zh:"午餐時三十二度，降了十(ten)度，所以現在是二十二度。三十二度是午餐時的氣溫；十度是下降的度數，不是現在的溫度。選 A"},
{n:19,p:2,o:["A tie.","A watch.","An umbrella."],a:2,sen:"W: Let's get Dad a tie for Father's Day. &nbsp;M: He has ten ties, and he never wears them. &nbsp;W: How about a new watch, then? &nbsp;M: Too expensive. But he's always losing his umbrella in the rainy season. &nbsp;W: Good idea. Let's get him a big one. &nbsp;Q: What will they buy for Dad?",szh:"女：父親節買條領帶(tie)給爸爸吧。　男：他有十(ten)條領帶，從來都不戴。　女：那買新手錶呢？　男：太貴了。不過他雨(rainy)季老是弄丟雨傘(umbrella)。　女：好主意，買一把大的給他。　問：他們要買什麼給爸爸？",en:"An umbrella.",zh:"領帶(tie)被否定，因為爸爸從來不戴；手錶也被否定，因為太貴；男士提到爸爸常弄丟雨傘(umbrella)，女士同意「買一把大的」，所以是雨傘。選 C"},
{n:20,p:2,o:["Cleaning the school gym.","Moving a school event.","A lesson about thunder."],a:1,sen:"W: Are our class races still on for Saturday? &nbsp;M: Not on the field. The weather report says thunder and heavy rain. &nbsp;W: Can we use the gym? &nbsp;M: It's too small for races, but the ball games can go there. &nbsp;W: Then let's do the races on Sunday, if the sky is clear. &nbsp;M: Good idea. I'll tell the other teachers. &nbsp;Q: What are the speakers talking about?",szh:"女：我們班的賽跑星期六還照常嗎？　男：不能在操場辦。氣象(weather)報告說會打雷(thunder)還有大雨。　女：我們可以用體育館嗎？　男：賽跑太小了，但球類比賽可以在那裡辦。　女：那賽跑改到星期天，如果天空放晴的話。　男：好主意。我去告訴其他老師。　問：說話的兩個人在談什麼？",en:"Moving a school event.",zh:"兩人因為星期六會打雷(thunder)下大雨，不能在操場辦賽跑，所以把比賽改到別天、球類比賽改到體育館，是在調整學校活動。他們只是借用體育館，沒有在打掃它；提到打雷只是下雨的原因，並不是在上自然課。選 B"},
{n:21,p:2,o:["Bitter cold, with lots of snow.","Hot and humid.","Warm, but not humid."],a:2,sen:"W: You moved to Canada last year, right? How's the climate there? &nbsp;M: Winters are bitter cold, with snow for months. But summers are warm and dry. &nbsp;W: So not humid like Taiwan? &nbsp;M: Not at all. &nbsp;Q: What are summers like where the man lives?",szh:"女：你去年搬到加拿大，對吧？那裡氣候(climate)如何？　男：冬天嚴寒(bitter)，下好幾個月的雪(snow)。但夏天溫暖又乾燥。　女：所以不像(like)台灣那麼潮濕(humid)？　男：完全不會。　問：男士住的地方夏天如何？",en:"Warm, but not humid.",zh:"問的是夏天：溫暖又乾燥，也就是「溫暖但不潮濕(humid)」。嚴寒(bitter)下雪是冬天的情形；又熱又潮濕是台灣，男士說那裡完全不會。選 C"},
{n:22,p:2,o:["Finish the tennis game.","Stop playing and go inside.","Watch the lightning from the court."],a:1,sen:"M: Let's finish our tennis game. Just ten more minutes. &nbsp;W: Look at that lightning! And I can hear thunder. &nbsp;M: But it's still far away. &nbsp;W: The weather expert on TV says that's already too close. &nbsp;M: OK, you win. &nbsp;Q: What will they most likely do?",szh:"男：我們把網球打完吧，再十(ten)分鐘就好。　女：你看那道閃電(lightning)！我也聽到打雷(thunder)了。　男：可是還很遠。　女：電視上的氣象(weather)專家(expert)說那樣已經太近了。　男：好吧，你贏了。　問：他們最可能做什麼？",en:"Stop playing and go inside.",zh:"男士原本想打完球，但女士引用專家(expert)的說法，男士說「好吧，你贏了」，表示接受女士的意見，不打了、進室內。打完球是男士被說服前的想法；站在球場上看閃電(lightning)正是專家說危險的事。選 B"},
{n:23,p:2,o:["At an airport.","In a hotel.","On a bus."],a:0,sen:"W: Excuse me. Is my flight to Tokyo still at seven P.M.? &nbsp;M: I'm sorry. The typhoon is too strong, so there are no flights tonight. &nbsp;W: Oh no! I have to be in Tokyo tomorrow morning. &nbsp;M: There is one at nine. I can change your ticket now. &nbsp;W: Thank you. Where can I sleep tonight? &nbsp;M: A free bus will take you to a hotel near here. &nbsp;Q: Where are the speakers?",szh:"女：不好意思。我飛東京的班機還是晚上七點(P.M.)嗎？　男：很抱歉。颱風(typhoon)太強了，所以今晚沒有班機。　女：天啊！我明天早上一定要到東京。　男：明天九點有一班。我現在可以幫妳換機票。　女：謝謝。我今晚可以睡哪裡？　男：有免費巴士會載妳到這附近的一家旅館。　問：說話的人在哪裡？",en:"At an airport.",zh:"男子說颱風(typhoon)讓今晚的班機都取消，並幫女子換機票，所以兩人在機場櫃台。旅館只是之後巴士會載她去的地方，她還沒到；巴士也是之後才搭，現在不在車上。選 A"},
{n:24,p:2,o:["It could be a bad idea.","It is fine in sunny weather.","It is fine for a short walk."],a:0,sen:"M: The weather report says it will be sunny all day, so I'll leave my umbrella at home. &nbsp;W: Last Friday the report said sunny, too. &nbsp;M: And? &nbsp;W: I walked home in the rain, and my shoes were wet for two days. &nbsp;M: Well, it's only a short walk to the bus stop. &nbsp;W: Hmm. That's what I said last Friday, too. &nbsp;Q: What does the woman think about leaving the umbrella at home?",szh:"男：氣象(weather)報告說今天整天晴天，所以我要把雨傘留在家裡。　女：上星期五報告也說晴天。　男：然後呢？　女：我淋著雨走回家，鞋子濕了兩天。　男：嗯，只是走一小段路去公車站而已。　女：嗯。我上星期五也是這麼說的。　問：女士覺得把雨傘留在家裡怎麼樣？",en:"It could be a bad idea.",zh:"女士說上星期五報告也說晴天，結果她淋雨、鞋子濕了兩天，最後說「我上星期五也是這麼說的」，意思是留傘可能是個壞主意。晴天是男士的理由；走一小段路也是男士的說法，女士並不同意。選 A"},
{n:25,p:2,o:["A million dollars.","Ten thousand dollars.","Ten million dollars."],a:1,sen:"M: Did you hear? Jack won a million dollars! &nbsp;W: In fact, it was only ten thousand. People like to make stories bigger. &nbsp;M: Well, that's still a lot. &nbsp;Q: How much money did Jack win?",szh:"男：你聽說了嗎？Jack 贏了一百萬(million)元！　女：事實上(fact)只有一萬(ten thousand)元。大家都喜歡(like)把故事(story)說得更誇張。　男：嗯，那還是很多啊。　問：Jack 贏了多少錢？",en:"Ten thousand dollars.",zh:"男士聽說一百萬(million)，但女士更正：事實上(fact)只有一萬元。一百萬是被誇大的傳言；一千萬是把 ten 和 million 拼在一起的陷阱。選 B"},
{n:26,p:3,pic:true,o:[BARS("Thunder Days",["Taipei","Tainan","Hualien"],[50,20,80]),BARS("Thunder Days",["Taipei","Tainan","Hualien"],[80,50,20]),BARS("Thunder Days",["Taipei","Tainan","Hualien"],[50,80,20])],a:2,sen:"Last summer, our class counted the days with thunder in three cities: Taipei, Tainan, and Hualien. Many people imagine that Hualien gets the most storms, because it's next to the sea. In fact, it had the fewest thunder days. And Tainan had more than Taipei. &nbsp;Q: Which chart shows the thunder days last summer?",szh:"去年夏天，我們班統計了台北、台南、花蓮三個城市打雷(thunder)的天數。很多人想像(imagine)花蓮靠海，暴風雨(storm)最多。事實上(fact)，花蓮打雷的天數最少。而台南比台北多。　問：哪張圖是去年夏天的打雷天數？",en:"Tainan most, Taipei second, Hualien fewest.",zh:"花蓮最少，台南又比台北多，所以台南最高、台北第二、花蓮最低。台北最高的那張與「台南比台北多」相反；花蓮最高的那張是大家「想像」的情形，事實上花蓮最少。選 C"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27b'),PH('q27c')],a:2,sen:"Last Friday, a typhoon hit our town, and there was no school. I wanted to practice the violin, but my baby sister was sleeping. My mom told me to read a story book, but I finished it the night before. Then rain started to come in through a hole in the roof. So I helped Dad put a bucket under it. &nbsp;Q: What did the speaker do during the typhoon?",szh:"上週五颱風(typhoon)來襲，學校停課。我想練小提琴(violin)，但小妹妹在睡覺。媽媽叫我讀故事(story)書，但我前一晚就看完了。後來雨水從屋頂的破洞漏進來，所以我幫爸爸在下面放一個水桶(bucket)。　問：說話者在颱風天做了什麼？",en:"He helped his dad put a bucket under the hole.",zh:"練小提琴(violin)因為妹妹在睡覺而沒做；讀故事(story)書因為前一晚已看完也沒做；最後是幫爸爸在漏水處放水桶(bucket)。選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:0,sen:"My brother usually rides his motorcycle to work, even on rainy days. But yesterday afternoon, there was a lot of lightning, so he left his motorcycle at the office. He wanted to take a taxi home, but there were none. So he took the bus. This morning, he walked to the office to get his motorcycle. &nbsp;Q: How did the brother get home yesterday?",szh:"我哥哥通常騎機車(motorcycle)上班，下雨(rainy)天也一樣。但昨天下午閃電(lightning)很多，所以他把機車留在公司。他想搭計程車回家，但一台都沒有，所以他搭公車。今天早上他走路去公司牽機車。　問：哥哥昨天怎麼回家的？",en:"By bus.",zh:"騎機車(motorcycle)是平常的方式，但昨天因為閃電(lightning)把機車留在公司；他想搭計程車卻叫不到；最後搭公車回家。走路是今天早上去公司的方式，不是昨天回家。選 A"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29b'),PH('q29c')],a:0,sen:"After the rain stopped, I took my little sister to the park. She wanted to jump into the water on the sidewalk, but her shoes were new, so I said no. Next, she wanted to feed the pigeons, but we had no bread with us. In the end, she picked up some red leaves from the wet grass and took them home. &nbsp;Q: What did the sister do in the park?",szh:"雨停之後，我帶妹妹去公園。她想跳(jump)進(into)人行道(sidewalk)上的積水，但她的鞋子是新的，所以我說不行。接著她想餵鴿子(pigeon)，但我們沒帶麵包。最後她從濕草地上撿了一些紅色(red)的葉子(leaf)帶回家。　問：妹妹在公園做了什麼？",en:"She picked up red leaves.",zh:"跳(jump)進積水被哥哥(說話者)阻止，因為鞋子是新的；餵鴿子(pigeon)因為沒帶麵包也沒做成；最後她撿了紅色葉子(leaf)。選 A"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:1,sen:"My grandma is going to Japan this winter to see the snow. I wanted to give her a necklace, but she doesn't like to wear one on trips. My mom said a warm hat would be good, but Grandma already has lots of hats. So I bought her a pair of warm gloves for the bitter cold. &nbsp;Q: What did the speaker give Grandma?",szh:"奶奶今年冬天要去日本看雪(snow)。我想送她一條項鍊(necklace)，但她旅行時不喜歡(like)戴項鍊。媽媽說送保暖的帽子不錯，但奶奶已經有很多帽子了。所以我買了一雙保暖手套給她，對抗嚴寒(bitter)。　問：說話者送了奶奶什麼？",en:"A pair of warm gloves.",zh:"項鍊(necklace)因為奶奶旅行不戴而作罷；帽子是媽媽的建議，但奶奶已經有很多；最後買的是一雙保暖手套。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 31 回　天氣　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
