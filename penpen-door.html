<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彭彭企鵝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#d7f0fa; --sky-top:#bfe8fb; --sky-bot:#f1fbff; --ice:#ffffff; --ice-edge:#b5dff2;
  --ink:#12305a; --ink-soft:#4f6d93; --bubble:#ffffff; --sheet:#ffffff; --line:#cfe6f2;
  --accent:#ff6a57; --accent-live:#e23b52; --beak:#ff9f1c; --beak-low:#e9830b; --scarf:#ff6a57; --scarf-dark:#e0513f;
  --pg-body:#1e3a63; --pg-wing:#294a7c; --chip:#ffffff; --chip-ink:#12305a; --snow:rgba(255,255,255,.95);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#070f24; --sky-top:#0d1b3d; --sky-bot:#2a4a86; --ice:#e6f1fb; --ice-edge:#8fb4da;
    --ink:#eaf3ff; --ink-soft:#a9c0e0; --bubble:#17294f; --sheet:#14264a; --line:#2b4373;
    --chip:#1d3260; --chip-ink:#eaf3ff; --pg-body:#0f1d38; --pg-wing:#1a3460; --snow:rgba(255,255,255,.55);
  }
}
:root[data-theme="dark"]{
  --page:#070f24; --sky-top:#0d1b3d; --sky-bot:#2a4a86; --ice:#e6f1fb; --ice-edge:#8fb4da;
  --ink:#eaf3ff; --ink-soft:#a9c0e0; --bubble:#17294f; --sheet:#14264a; --line:#2b4373;
  --chip:#1d3260; --chip-ink:#eaf3ff; --pg-body:#0f1d38; --pg-wing:#1a3460; --snow:rgba(255,255,255,.55);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--page);color:var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:'Fredoka','Noto Sans TC','PingFang TC','Microsoft JhengHei',ui-rounded,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
[hidden]{display:none !important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stage{
  position:relative;container-type:inline-size;
  height:min(100%,177.7778vw);aspect-ratio:9/16;max-width:100vw;
  display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(var(--sky-top),var(--sky-bot));
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 14% 9%,var(--snow) 0 .7cqw,transparent .8cqw),
    radial-gradient(circle at 86% 15%,var(--snow) 0 .5cqw,transparent .6cqw),
    radial-gradient(circle at 72% 36%,var(--snow) 0 .6cqw,transparent .7cqw),
    radial-gradient(circle at 9% 44%,var(--snow) 0 .45cqw,transparent .55cqw);
}

.top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:3cqw 4.5cqw 1cqw}
.brand{font-size:4.4cqw;font-weight:600;letter-spacing:.01em}
.iconbtn{width:10.5cqw;height:10.5cqw;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;padding:0}
.iconbtn svg{width:52%;height:52%}

.bubble{position:relative;flex:0 0 26%;margin:2cqw 5cqw 0;background:var(--bubble);border-radius:6cqw;box-shadow:0 .9cqw 0 var(--line)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-2.6cqw;width:5.5cqw;height:5.5cqw;background:var(--bubble);transform:translateX(-50%) rotate(45deg);border-radius:1cqw}
.btext{height:100%;overflow:auto;display:flex;padding:3.5cqw 5cqw;box-sizing:border-box;border-radius:6cqw}
.binner{margin:auto;width:100%;text-align:center}
.en{margin:0;font-size:6.2cqw;font-weight:500;line-height:1.3}
.zh{margin:1.6cqw 0 0;font-size:4.1cqw;line-height:1.45;color:var(--ink-soft)}
.zh:empty{display:none}

.scene{position:relative;flex:1;min-height:0;margin-top:3cqw}
.floe{position:absolute;left:6%;right:6%;bottom:1%;height:13%;border-radius:50%;background:var(--ice);border:.7cqw solid var(--ice-edge)}
svg.penguin{position:absolute;left:50%;bottom:3.5%;height:96%;aspect-ratio:320/420;transform:translateX(-50%);overflow:visible}

.controls{position:relative;display:flex;flex-direction:column;align-items:center;gap:2.2cqw;padding:0 5cqw 4.5cqw}
.heard{min-height:1.5em;max-width:100%;font-size:3.7cqw;color:var(--ink-soft);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:2cqw;width:100%;overflow-x:auto;padding:.5cqw .5cqw 1cqw;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:99px;padding:2cqw 3.8cqw;font-size:3.9cqw}
.typebox{display:flex;gap:2cqw;width:100%}
.typebox input{flex:1;min-width:0;font:inherit;font-size:max(16px,4cqw);padding:2.4cqw 4cqw;border-radius:99px;border:1.5px solid var(--line);background:var(--chip);color:var(--chip-ink)}
.send{border:0;border-radius:99px;padding:0 5cqw;background:var(--ink);color:var(--bubble);font-size:4cqw;font-weight:500}
.row{display:flex;align-items:center;justify-content:center;gap:9cqw}
.side{width:12.5cqw;height:12.5cqw;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);color:var(--chip-ink);display:grid;place-items:center;padding:0}
.side svg{width:50%;height:50%}
.mic{position:relative;width:23cqw;height:23cqw;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;padding:0;box-shadow:0 1.3cqw 0 rgba(0,0,0,.18);transition:transform .08s}
.mic:active{transform:translateY(.8cqw);box-shadow:0 .5cqw 0 rgba(0,0,0,.18)}
.mic svg{width:44%;height:44%}
.mic .i-stop{display:none}
.mic.on{background:var(--accent-live)}
.mic.on .i-mic{display:none}
.mic.on .i-stop{display:block}
.mic.on::after{content:"";position:absolute;inset:-2cqw;border-radius:50%;border:.9cqw solid var(--accent-live);opacity:.7;animation:pulse 1.1s ease-out infinite}
.status{min-height:1.4em;font-size:3.6cqw;color:var(--ink-soft);text-align:center}

/* Penguin */
.penguin .bob,.penguin .tilt{transform-origin:160px 392px}
.penguin .bob{animation:bob 3.2s ease-in-out infinite}
.penguin .bob.hop{animation:hop .75s ease-out 1}
.penguin .tilt{transition:transform .35s ease}
.penguin .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.penguin .eyes{transition:transform .3s ease}
.penguin .jaw{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.4)}
.penguin .wl{transform-origin:62px 215px}
.penguin .wr{transform-origin:258px 215px}
.penguin .dots{opacity:0;transition:opacity .2s}
.penguin .dots circle{animation:dot 1s ease-in-out infinite}
.penguin .dots circle:nth-child(2){animation-delay:.15s}
.penguin .dots circle:nth-child(3){animation-delay:.3s}
.penguin .rings{opacity:0}
.penguin .rings circle{fill:none;stroke:var(--accent);stroke-width:5;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite;opacity:0}
.penguin .rings circle:nth-child(2){animation-delay:.5s}
.penguin .rings circle:nth-child(3){animation-delay:1s}

.stage[data-state="listening"] .tilt{transform:rotate(-4deg) translateY(4px)}
.stage[data-state="listening"] .rings{opacity:1}
.stage[data-state="listening"] .wr{animation:raise .5s ease-out forwards}
.stage[data-state="thinking"] .eyes{transform:translateY(-6px)}
.stage[data-state="thinking"] .dots{opacity:1}
.stage[data-state="speaking"] .jaw{animation:talk .24s ease-in-out infinite alternate}
.stage[data-state="speaking"] .wl{animation:flapL .5s ease-in-out infinite alternate}
.stage[data-state="speaking"] .wr{animation:flapR .5s ease-in-out infinite alternate}
.stage[data-mood="oops"][data-state="speaking"] .tilt{transform:rotate(6deg)}

@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-28px) scale(.97,1.04)}58%{transform:translateY(0) scale(1.05,.94)}80%{transform:translateY(-7px) scale(1,1)}100%{transform:translateY(0) scale(1,1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.4)}}
@keyframes flapL{to{transform:rotate(12deg)}}
@keyframes flapR{to{transform:rotate(-12deg)}}
@keyframes raise{to{transform:rotate(-38deg)}}
@keyframes dot{50%{transform:translateY(-6px)}}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.4);opacity:0}}
@keyframes pulse{0%{transform:scale(.95);opacity:.7}100%{transform:scale(1.18);opacity:0}}

/* Overlays */
.start{position:absolute;inset:0;z-index:5;display:flex;justify-content:center;align-items:flex-start;padding-top:24%;background:rgba(10,30,60,.38)}
.startbtn{border:0;border-radius:8cqw;background:var(--bubble);color:var(--ink);padding:5cqw 9cqw;box-shadow:0 1.2cqw 0 var(--line);text-align:center}
.startbtn b{display:block;font-size:8cqw;font-weight:600}
.startbtn span{display:block;margin-top:1cqw;font-size:4cqw;color:var(--ink-soft)}
.pick{width:84%;background:var(--bubble);border-radius:7cqw;padding:5cqw 5cqw 4cqw;box-shadow:0 1.2cqw 0 var(--line);text-align:center}
.pick>b{display:block;font-size:7cqw;font-weight:600}
.pick>span{display:block;margin:1cqw 0 3.5cqw;font-size:4cqw;color:var(--ink-soft)}
.pick small{display:block;margin-top:3.5cqw;font-size:3cqw;line-height:1.5;color:var(--ink-soft)}
.lv{display:flex;align-items:center;gap:3.5cqw;width:100%;margin-top:2.6cqw;padding:3.4cqw 4.5cqw;border:1.5px solid var(--line);border-radius:5cqw;background:var(--chip);color:var(--chip-ink);text-align:left}
.lv i{font-style:normal;font-size:8cqw;line-height:1}
.lv b{display:block;font-size:5.4cqw;font-weight:600}
.lv span{display:block;font-size:3.7cqw;color:var(--ink-soft)}
.dots{display:flex;justify-content:center;gap:2.6cqw;min-height:3.4cqw}
.dots i{width:3cqw;height:3cqw;border-radius:50%;border:.5cqw solid var(--ink-soft);opacity:.6}
.dots i.on{background:var(--accent);border-color:var(--accent);opacity:1}
.bye{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2.4cqw;background:rgba(10,30,60,.6);color:#fff;text-align:center;padding:0 8cqw}
.bye b{font-size:11cqw;font-weight:700}
.bye span{font-size:4.6cqw;line-height:1.5}
.bye .stars{font-size:9cqw;letter-spacing:1.5cqw}
#gear{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--sheet);color:var(--ink);border-radius:6cqw 6cqw 0 0;padding:5cqw 6cqw 6cqw;box-shadow:0 -1cqw 4cqw rgba(0,0,0,.18)}
.sheet h2{margin:0 0 3cqw;font-size:5cqw;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{border:0;background:none;font-size:4.2cqw;color:var(--ink-soft);padding:1cqw 2cqw}
.set{margin-top:3.4cqw}
.set label{display:block;font-size:3.9cqw;font-weight:500;margin-bottom:1.4cqw}
.seg{display:flex;gap:1.6cqw}
.seg button{flex:1;border:1.5px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:3cqw;padding:2.4cqw 1cqw;font-size:3.9cqw}
.seg button.on{background:var(--ink);color:var(--bubble);border-color:var(--ink)}
.note{margin:3.4cqw 0 0;font-size:3.5cqw;line-height:1.5;color:var(--ink-soft)}

@media (prefers-reduced-motion: reduce){
  .penguin *,.mic::after{animation:none !important}
  .penguin .tilt,.penguin .eyes{transition:none}
}

/* ---- door mode: no typing, no chips, no settings visible; kids just talk ---- */
#kbd,#chips,#typebox,#gear{display:none !important}
.row{justify-content:center}
.hello{width:84%;border:0;border-radius:9cqw;background:var(--bubble);color:var(--ink);padding:7cqw 5cqw 6cqw;box-shadow:0 1.4cqw 0 var(--line);text-align:center;animation:helloPulse 2.2s ease-in-out infinite}
.hello i{display:block;font-style:normal;font-size:20cqw;line-height:1}
.hello b{display:block;margin-top:2cqw;font-size:8.5cqw;font-weight:600}
.hello span{display:block;margin-top:1.4cqw;font-size:4.6cqw;color:var(--ink-soft)}
.hello small{display:block;margin-top:3.5cqw;font-size:3cqw;line-height:1.5;color:var(--ink-soft)}
@keyframes helloPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@media (prefers-reduced-motion: reduce){.hello{animation:none}}
#dots{display:none}
.power{border:0;border-radius:99px;padding:1.8cqw 4.2cqw;font-size:3.9cqw;font-weight:600;background:var(--accent-live);color:#fff;box-shadow:0 .7cqw 0 rgba(0,0,0,.16);white-space:nowrap}
.power:active{transform:translateY(.5cqw);box-shadow:0 .2cqw 0 rgba(0,0,0,.16)}
.power.off{background:#2f9e6b}
svg.penguin{--pg-body:#27518f;--pg-wing:#1f4380;--cap:#3a6fc4;--ol:#4a2b2e}
#dbg{max-width:100%;font-size:2.8cqw;line-height:1.4;color:var(--ink-soft);text-align:center;word-break:break-all;opacity:.85}
#unlock{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:8;max-width:86%;background:#ffe27a;color:#4a3500;border-radius:99px;padding:2.4cqw 5cqw;font-size:4cqw;font-weight:600;text-align:center;box-shadow:0 .8cqw 0 rgba(0,0,0,.12)}
/* penguin parts: where each one pivots */
.penguin .walker,.penguin .air{transform-box:view-box;transform-origin:160px 392px}
.penguin .head{transform-box:view-box;transform-origin:160px 214px}
.penguin .fl{transform-box:view-box;transform-origin:118px 388px}
.penguin .fr{transform-box:view-box;transform-origin:202px 388px}
.penguin .wwl{transform-box:view-box;transform-origin:62px 215px}
.penguin .wwr{transform-box:view-box;transform-origin:258px 215px}
.penguin .shadow{transform-box:fill-box;transform-origin:center}
/* the old poses only ever leaned one way: the head now does the leaning, from both sides */
.stage[data-state="listening"] .tilt{transform:translateY(3px)}
.stage[data-mood="oops"][data-state="speaking"] .tilt{transform:none}
/* mic ring grows with the volume it hears, so a teacher can see the mic is alive */
.mic::before{content:"";pointer-events:none;position:absolute;inset:-1cqw;border-radius:50%;border:.7cqw solid #fff;opacity:calc(var(--lvl,0) * .85);transform:scale(calc(1 + var(--lvl,0) * .28));transition:transform .06s,opacity .06s}
</style>
</head>
<body>
<main class="stage" id="stage" data-state="idle" data-mood="happy">
  <header class="top">
    <div class="brand">彭彭企鵝</div>
    <button class="iconbtn" id="gear" type="button" aria-label="設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2.4" fill="var(--chip)"/><circle cx="15" cy="17" r="2.4" fill="var(--chip)"/></svg>
    </button>
    <button class="power" id="power" type="button" aria-pressed="false">⏹ 停止聆聽</button>
  </header>

  <section class="bubble" aria-live="polite">
    <div class="btext"><div class="binner">
      <p class="en" id="en">Hi! I'm Pen-Pen. Say hello!</p>
      <p class="zh" id="zh">嗨！我是 Pen-Pen，跟我打招呼吧！</p>
    </div></div>
  </section>

  <section class="scene">
    <div class="floe"></div>
    <svg class="penguin" viewBox="0 0 320 420" role="img" aria-label="企鵝 Pen-Pen">
      <g class="walker">
      <ellipse class="shadow" cx="160" cy="398" rx="108" ry="11" fill="rgba(18,48,90,.16)"/>
      <g class="air"><g class="bob"><g class="tilt">
        <g class="foot fl"><path d="M86 392 C84 404 96 410 108 407 C112 412 126 412 130 406 C142 406 150 398 146 390 C140 382 96 382 86 392Z" fill="var(--beak)" stroke="var(--ol)" stroke-width="3.5" stroke-linejoin="round"/><path d="M106 398 v8 M122 399 v8" stroke="var(--ol)" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="foot fr"><path d="M234 392 C236 404 224 410 212 407 C208 412 194 412 190 406 C178 406 170 398 174 390 C180 382 224 382 234 392Z" fill="var(--beak)" stroke="var(--ol)" stroke-width="3.5" stroke-linejoin="round"/><path d="M214 398 v8 M198 399 v8" stroke="var(--ol)" stroke-width="2.6" stroke-linecap="round"/></g>
        <g class="ww wwl"><g class="wing wl"><path d="M62 215 C14 250 10 320 40 336 C70 322 86 270 92 232Z" fill="var(--pg-wing)" stroke="var(--ol)" stroke-width="4" stroke-linejoin="round"/></g></g>
        <g class="ww wwr"><g class="wing wr"><path d="M258 215 C306 250 310 320 280 336 C250 322 234 270 228 232Z" fill="var(--pg-wing)" stroke="var(--ol)" stroke-width="4" stroke-linejoin="round"/></g></g>
        <path d="M160 150 C84 150 46 232 50 304 C54 366 104 396 160 396 C216 396 266 366 270 304 C274 232 236 150 160 150Z" fill="var(--pg-body)" stroke="var(--ol)" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M160 246 C112 246 92 296 98 338 C103 374 130 390 160 390 C190 390 217 374 222 338 C228 296 208 246 160 246Z" fill="#fff"/>
        <g class="head">
          <path d="M160 92 C98 92 66 134 66 180 C66 232 108 258 160 258 C212 258 254 232 254 180 C254 134 222 92 160 92Z" fill="var(--pg-body)" stroke="var(--ol)" stroke-width="4.5" stroke-linejoin="round"/>
          <path d="M160 156 C136 128 86 140 86 188 C86 226 120 246 160 246 C200 246 234 226 234 188 C234 140 184 128 160 156Z" fill="#fff"/>
          <circle cx="100" cy="206" r="12" fill="#ff9fb0" opacity=".6"/>
          <circle cx="220" cy="206" r="12" fill="#ff9fb0" opacity=".6"/>
          <g class="eyes">
            <g class="eye"><ellipse cx="124" cy="186" rx="10" ry="13" fill="#11223f"/><circle cx="128" cy="180" r="4" fill="#fff"/><circle cx="121" cy="191" r="2" fill="#fff"/></g>
            <g class="eye"><ellipse cx="196" cy="186" rx="10" ry="13" fill="#11223f"/><circle cx="200" cy="180" r="4" fill="#fff"/><circle cx="193" cy="191" r="2" fill="#fff"/></g>
          </g>
          <g class="jaw"><path d="M143 207 Q160 236 177 207 Q160 213 143 207Z" fill="#ff7b72" stroke="var(--ol)" stroke-width="2.6" stroke-linejoin="round"/></g>
          <path d="M136 200 Q160 184 184 200 Q160 218 136 200Z" fill="var(--beak)" stroke="var(--ol)" stroke-width="3" stroke-linejoin="round"/>
          <path d="M84 148 C80 98 122 68 166 70 C216 72 246 104 238 150 C206 140 116 140 84 148Z" fill="var(--cap)" stroke="var(--ol)" stroke-width="4" stroke-linejoin="round"/>
          <path d="M162 71 C150 100 150 128 158 144 M162 71 C180 100 184 128 178 144" fill="none" stroke="var(--ol)" stroke-width="1.8" stroke-dasharray="5 4" opacity=".55"/>
          <circle cx="164" cy="70" r="5" fill="var(--cap)" stroke="var(--ol)" stroke-width="3"/>
          <path d="M66 156 C106 176 214 176 254 156 C246 138 76 138 66 156Z" fill="var(--cap)" stroke="var(--ol)" stroke-width="4" stroke-linejoin="round"/>
          <text x="162" y="130" text-anchor="middle" font-family="Fredoka,'Noto Sans TC',sans-serif" font-size="25" font-weight="700" letter-spacing="1.5" fill="#fff4dc" stroke="var(--ol)" stroke-width=".6" transform="rotate(-3 162 124)">EFETL</text>
        </g>
        <path d="M66 244 Q160 286 254 244 L262 270 Q160 316 58 270Z" fill="var(--scarf)" stroke="var(--ol)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M208 282 L238 350 L205 358 L184 298Z" fill="var(--scarf-dark)" stroke="var(--ol)" stroke-width="3.5" stroke-linejoin="round"/>
        <ellipse cx="176" cy="284" rx="19" ry="14" fill="var(--scarf)" stroke="var(--ol)" stroke-width="3.5"/>
        <g class="dots" fill="var(--ink)"><circle cx="236" cy="104" r="6"/><circle cx="258" cy="86" r="8"/><circle cx="284" cy="64" r="10"/></g>
      </g></g>
      <g class="rings"><circle cx="160" cy="180" r="110"/><circle cx="160" cy="180" r="110"/><circle cx="160" cy="180" r="110"/></g>
      </g>
      </g>
    </svg>
  </section>

  <section class="controls">
    <div class="heard" id="heard"></div>
    <div class="chips" id="chips"></div>
    <div class="typebox" id="typebox" hidden>

  </div>
</main>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), enEl = $('#en'), zhEl = $('#zh'), heardEl = $('#heard'), statusEl = $('#status');
  const micBtn = $('#mic'), typebox = $('#typebox'), typeInput = $('#typeinput'), bob = $('.penguin .bob');

  /* ---------- settings ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const settings = Object.assign({ lang: 'en-US', level: 1, zh: true, slow: false }, store.get('penpen', {}));
  const SEG = {
    lang: [['en-US', 'English'], ['zh-TW', '中文']],
    level: [[0, '國小低'], [1, '國小高'], [2, '國中']],
    zh: [[true, '顯示'], [false, '隱藏']],
    slow: [[false, '正常'], [true, '慢速']]
  };
  const LEVELS = [
    'Very easy: 3-7 words per sentence, only basic words (colors, animals, food, family, numbers). Present tense only.',
    'Easy: up to 10 words per sentence, common everyday words.',
    'Simple but natural: up to 14 words per sentence. You may use past tense and simple "why" questions.'
  ];
  function renderSeg(key) {
    const box = $('#seg-' + key);
    box.innerHTML = '';
    SEG[key].forEach(([val, label]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if (settings[key] === val) b.className = 'on';
      b.onclick = () => {
        settings[key] = val;
        store.set('penpen', settings);
        renderSeg(key);
        if (key === 'zh') show(lastEn, lastZh);
      };
      box.appendChild(b);
    });
  }
  Object.keys(SEG).forEach(renderSeg);
  // Settings are for the teacher: hold the gear for 1.5 seconds.
  const gear = $('#gear');
  let gearTimer = null;
  gear.setAttribute('aria-label', '設定（長按 1.5 秒）');
  gear.addEventListener('pointerdown', () => { clearTimeout(gearTimer); gearTimer = setTimeout(() => { $('#sheet').hidden = false; }, 1500); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gear.addEventListener(ev, () => clearTimeout(gearTimer)));
  gear.addEventListener('contextmenu', e => e.preventDefault());
  $('#closesheet').onclick = () => { $('#sheet').hidden = true; };

  /* ---------- state + display ---------- */
  const STATUS = {
    idle: '直接跟我說話，中文或英文都可以',
    listening: '我在聽… 說完停一下就好',
    thinking: 'Pen-Pen is thinking…',
    speaking: 'Pen-Pen is talking…'
  };
  let state = 'idle', lastEn = '', lastZh = '', lastActive = Date.now();
  function setState(s) {
    state = s;
    lastActive = Date.now();   // any change (listening, thinking, speaking, idle) restarts the idle timer
    if (typeof kick === 'function') kick();
    stage.dataset.state = s;
    statusEl.textContent = STATUS[s];
    micBtn.classList.toggle('on', s === 'listening');
    micBtn.setAttribute('aria-pressed', s === 'listening' ? 'true' : 'false');
    micBtn.setAttribute('aria-label', s === 'listening' ? '停止收音' : '按一下開始說話');
  }
  function show(en, zh) {
    lastEn = en; lastZh = zh;
    enEl.textContent = en;
    zhEl.textContent = settings.zh ? zh : '';
  }
  /* ---------- penguin choreography: walk, hop, sway, shake, nod, wave, dance ---------- */
  const PG = {};
  ['walker', 'air', 'head', 'fl', 'fr', 'wwl', 'wwr', 'shadow'].forEach(k => { PG[k] = document.querySelector('.penguin .' + k); });
  const calm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const live = new Set();
  let posX = 0, walking = false, wantHome = false, kickRes = null;
  const MAXX = 92;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const sgn = () => (Math.random() < .5 ? -1 : 1);
  const R = d => 'rotate(' + d + 'deg)';
  const T = v => ({ transform: v });
  function A(name, frames, ms, opts, keep) {
    const el = PG[name];
    if (!el || !el.animate) return Promise.resolve();
    const a = el.animate(frames, Object.assign({ duration: ms, easing: 'ease-in-out' }, opts || {}));
    if (!keep) live.add(a);
    const p = a.finished.then(() => {}, () => {}).then(() => { live.delete(a); });
    p.anim = a;
    return p;
  }
  function setX(x) { posX = Math.max(-MAXX, Math.min(MAXX, x)); PG.walker.style.transform = 'translateX(' + posX + 'px)'; }
  // The state changed (listening / thinking / speaking): drop whatever the head, wings and body were doing and choose again.
  function kick() {
    live.forEach(a => { try { a.cancel(); } catch (e) {} });
    live.clear();
    if (kickRes) { const r = kickRes; kickRes = null; r(); }
  }
  const wake = () => new Promise(r => { kickRes = r; });

  const feetTap = (ms, n) => Promise.all([
    A('fl', [T('translateY(0)'), T('translateY(-13px)'), T('translateY(0)')], ms / n, { iterations: n }),
    A('fr', [T('translateY(0)'), T('translateY(-13px)'), T('translateY(0)')], ms / n, { iterations: n, delay: ms / n / 2 })
  ]);
  // 擺頭: the head swings left and right
  const mSway = () => { const s = sgn(); return Promise.all([
    A('head', [T(R(0)), T(R(-12 * s)), T(R(12 * s)), T(R(-8 * s)), T(R(8 * s)), T(R(0))], 1700),
    A('air', [T(R(0)), T(R(2 * s)), T(R(-2 * s)), T(R(0))], 1700)
  ]); };
  // 搖頭: quick "no"
  const mShake = () => A('head', [T('translateX(0) ' + R(0)), T('translateX(-9px) ' + R(-7)), T('translateX(9px) ' + R(7)), T('translateX(-9px) ' + R(-7)), T('translateX(9px) ' + R(7)), T('translateX(-4px) ' + R(-3)), T('translateX(0) ' + R(0))], 1000);
  // 點頭
  const mNod = () => A('head', [T('translateY(0)'), T('translateY(8px)'), T('translateY(0)'), T('translateY(8px)'), T('translateY(0)')], 900);
  // look around
  const mLook = () => A('head', [T('translateX(0) ' + R(0)), T('translateX(-9px) ' + R(-6)), T('translateX(-9px) ' + R(-6)), T('translateX(9px) ' + R(6)), T('translateX(9px) ' + R(6)), T('translateX(0) ' + R(0))], 2000);
  // curious head tilt (either side), used while listening
  const mCurious = () => { const s = sgn(); return Promise.all([
    A('head', [T(R(0)), T(R(10 * s)), T(R(10 * s)), T(R(-6 * s)), T(R(0))], 1500),
    A('air', [T('translateY(0)'), T('translateY(3px)'), T('translateY(0)')], 1500)
  ]); };
  const mThink = () => { const s = sgn(); return A('head', [T('translateY(0) ' + R(0)), T('translateY(-3px) ' + R(-9 * s)), T('translateY(-3px) ' + R(-9 * s)), T('translateY(0) ' + R(0))], 1500); };
  // wave with the right wing
  const mWave = () => Promise.all([
    A('wwr', [T(R(0)), T(R(-64)), T(R(-30)), T(R(-64)), T(R(-30)), T(R(-64)), T(R(0))], 1300),
    A('head', [T(R(0)), T(R(7)), T(R(7)), T(R(0))], 1300)
  ]);
  // jump with a little squash and stretch, both wings up, feet tucked
  const mHop = () => Promise.all([
    A('air', [T('translateY(0) scale(1,1)'), { transform: 'translateY(0) scale(1.07,.9)', offset: .15 }, { transform: 'translateY(-48px) scale(.96,1.06)', offset: .5 }, { transform: 'translateY(0) scale(1.08,.9)', offset: .82 }, T('translateY(0) scale(1,1)')], 780, { easing: 'ease-out' }),
    A('shadow', [T('scale(1)'), { transform: 'scale(.7)', offset: .5 }, T('scale(1)')], 780),
    A('wwl', [T(R(0)), { transform: R(44), offset: .5 }, T(R(0))], 780),
    A('wwr', [T(R(0)), { transform: R(-44), offset: .5 }, T(R(0))], 780),
    A('fl', [T('translateY(0)'), { transform: 'translateY(-12px)', offset: .5 }, T('translateY(0)')], 780),
    A('fr', [T('translateY(0)'), { transform: 'translateY(-12px)', offset: .5 }, T('translateY(0)')], 780)
  ]);
  const mHopWave = async () => { await mHop(); await mWave(); };
  // dance: flap, rock, tap feet, swing the head
  const mDance = () => { const s = sgn(); return Promise.all([
    A('air', [T(R(0)), T(R(-4 * s) + ' translateY(-6px)'), T(R(0)), T(R(4 * s) + ' translateY(-6px)'), T(R(0)), T(R(-4 * s) + ' translateY(-6px)'), T(R(0))], 1600),
    A('wwl', [T(R(0)), T(R(34)), T(R(0)), T(R(34)), T(R(0)), T(R(34)), T(R(0))], 1600),
    A('wwr', [T(R(0)), T(R(-34)), T(R(0)), T(R(-34)), T(R(0)), T(R(-34)), T(R(0))], 1600, { delay: 200 }),
    A('head', [T(R(0)), T(R(-10 * s)), T(R(10 * s)), T(R(-10 * s)), T(R(10 * s)), T(R(0))], 1600),
    feetTap(1600, 4)
  ]); };
  // turn around (a full spin on the spot)
  const mTurn = () => A('air', [T('scale(1,1)'), { transform: 'scale(.04,1)', offset: .35 }, { transform: 'scale(-1,1)', offset: .6 }, { transform: 'scale(.04,1)', offset: .8 }, T('scale(1,1)')], 1100);
  // waddle across the ice
  async function mWalk(dist, o) {
    o = o || {};
    if (walking) return;
    const from = posX, to = Math.max(-MAXX, Math.min(MAXX, posX + dist)), d = to - from;
    if (Math.abs(d) < 14) return;
    walking = true;
    const steps = Math.max(2, Math.round(Math.abs(d) / (o.stride || 24))), n = steps * 2;
    const ms = Math.abs(d) / (o.speed || 90) * 1000, dir = d > 0 ? 1 : -1, rock = o.rock || 6, hopY = o.bob || 6;
    const wk = [], bounce = [];
    for (let k = 0; k <= n; k++) {
      wk.push(T('translateX(' + (from + d * k / n) + 'px) ' + R(k % 2 ? (k % 4 === 1 ? rock : -rock) : 0)));
      bounce.push(T('translateY(' + (k % 2 ? -hopY : 0) + 'px)'));
    }
    const w = A('walker', wk, ms, { easing: 'linear', fill: 'forwards' }, true);
    await Promise.all([w, A('air', bounce, ms, { easing: 'linear' }), A('head', [T(R(0)), T(R(5 * dir)), T(R(0))], ms), feetTap(ms, steps),
      o.flap ? A('wwl', [T(R(0)), T(R(26)), T(R(10)), T(R(26)), T(R(0))], ms) : null, o.flap ? A('wwr', [T(R(0)), T(R(-26)), T(R(-10)), T(R(-26)), T(R(0))], ms) : null]);
    setX(to);
    try { w.anim.cancel(); } catch (e) {}
    walking = false;
  }
  // run: dash across the ice and back, flippers out behind, bouncing
  const RUN = { speed: 250, stride: 16, rock: 9, bob: 11, flap: true };
  const mRun = async () => {
    const dir = posX > 20 ? -1 : posX < -20 ? 1 : sgn();
    await mWalk(dir * rnd(110, 190), RUN);
    if (Math.random() < .6) await mWalk(-dir * rnd(90, 190), RUN);
  };
  // wiggle: sway the whole body from side to side
  const mWiggle = () => Promise.all([
    A('air', [T(R(0)), T(R(-7)), T(R(7)), T(R(-7)), T(R(7)), T(R(-5)), T(R(5)), T(R(0))], 1400),
    A('head', [T(R(0)), T(R(8)), T(R(-8)), T(R(8)), T(R(-8)), T(R(0))], 1400),
    A('wwl', [T(R(0)), T(R(20)), T(R(0)), T(R(20)), T(R(0))], 1400),
    A('wwr', [T(R(0)), T(R(-20)), T(R(0)), T(R(-20)), T(R(0))], 1400)
  ]);
  // jump with a full spin
  const mJumpTwist = () => Promise.all([
    A('air', [T('translateY(0) scale(1,1)'), { transform: 'translateY(0) scale(1.07,.9)', offset: .12 }, { transform: 'translateY(-54px) scale(.04,1.05)', offset: .38 }, { transform: 'translateY(-54px) scale(-1,1.05)', offset: .56 }, { transform: 'translateY(-20px) scale(.04,1)', offset: .74 }, { transform: 'translateY(0) scale(1.06,.92)', offset: .9 }, T('translateY(0) scale(1,1)')], 1000, { easing: 'ease-out' }),
    A('shadow', [T('scale(1)'), { transform: 'scale(.65)', offset: .45 }, T('scale(1)')], 1000),
    A('wwl', [T(R(0)), { transform: R(48), offset: .45 }, T(R(0))], 1000),
    A('wwr', [T(R(0)), { transform: R(-48), offset: .45 }, T(R(0))], 1000)
  ]);
  const walkR = () => { const dir = posX > 30 ? -1 : posX < -30 ? 1 : sgn(); return mWalk(dir * rnd(40, 90)); };
  const walkHome = () => mWalk(-posX);

  function pick(list) {
    let r = Math.random() * list.reduce((t, x) => t + x[0], 0);
    for (const [w, f] of list) { if ((r -= w) <= 0) return f; }
    return list[0][1];
  }
  function pickMove() {
    const st = stage.dataset.state, mood = stage.dataset.mood;
    if (wantHome) { wantHome = false; if (Math.abs(posX) > 15) return walkHome; }
    const wk = walking ? mSway : walkR;
    if (!startEl.hidden) return pick([[3, mHopWave], [2, mSway], [2, wk], [1, mLook]]);   // waiting for someone to tap
    if (st === 'speaking') {
      if (mood === 'excited') return pick([[3, mHopWave], [2, mDance], [2, mHop], [2, wk], [1, mSway]]);
      if (mood === 'oops') return pick([[3, mShake], [2, mNod], [1, mLook]]);
      return pick([[3, mSway], [2, mNod], [2, mWave], [2, wk], [1, mDance]]);
    }
    if (st === 'listening') return pick([[3, mCurious], [2, mLook], [1, mNod]]);
    if (st === 'thinking') return pick([[3, mThink], [2, mLook]]);
    const wr = walking ? mWiggle : mRun;
    return pick([[3, mSway], [2, mLook], [3, wk], [3, wr], [2, mWiggle], [2, mHopWave], [1, mTurn], [1, mDance], [2, mJumpTwist]]);
  }
  function gap() {
    if (!startEl.hidden) return rnd(1600, 3800);
    const st = stage.dataset.state;
    if (st === 'speaking') return rnd(60, 260);
    if (st === 'listening' || st === 'thinking') return rnd(150, 500);
    return rnd(1200, 3200);
  }
  async function director() {
    for (;;) {
      const mv = calm ? null : pickMove();
      if (mv) { try { await Promise.race([mv(), wake()]); } catch (e) { try { console.warn('[Pen-Pen] move failed', e); } catch (x) {} } }
      await Promise.race([sleep(gap()), wake()]);
    }
  }
  function hop() { kick(); }
  setState('idle');

  /* ---------- speech out (TTS) ---------- */
  let voices = [], speakToken = 0, spoken = '';
  const hasTTS = 'speechSynthesis' in window;
  function loadVoices() { try { voices = speechSynthesis.getVoices(); } catch (e) {} }
  if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function pickVoice() {
    const en = voices.filter(v => /^en[-_]/i.test(v.lang));
    const pref = ['Natural', 'Premium', 'Enhanced', 'Aria', 'Jenny', 'Ava', 'Samantha', 'Google US English', 'Karen', 'Zira', 'Allison'];
    for (const n of pref) { const v = en.find(x => x.name.includes(n)); if (v) return v; }
    return en.find(v => /en[-_]US/i.test(v.lang)) || en[0] || null;
  }
  // Built-in phone voice: only a fallback when the Worker's natural voice is unavailable.
  function speakDevice(text) {
    return new Promise(res => {
      if (!hasTTS) return res();
      let done = false;
      const finish = () => { if (!done) { done = true; res(); } };
      try { speechSynthesis.cancel(); } catch (e) {}
      setTimeout(() => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        const v = pickVoice(); if (v) u.voice = v;
        u.rate = settings.slow ? 0.65 : 0.95;
        u.pitch = 1.0;
        u.onend = finish; u.onerror = finish;
        try { speechSynthesis.speak(u); } catch (e) { finish(); }
        setTimeout(finish, 20000);
      }, 60);
    });
  }

  // Natural voice from the Worker (/tts). One <audio> element, unlocked by the first tap,
  // so phones allow it to play later replies that arrive after a network wait.
  const player = new Audio();
  player.preload = 'auto';
  const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  let audioUnlocked = false, ttsCtl = null, stopPlay = null, lastAudio = { text: '', url: '' };
  const unlockEl = $('#unlock');
  const showUnlock = () => { unlockEl.hidden = false; };
  function unlockAudio() {
    unlockEl.hidden = true;
    if (mic && mic.ctx.state !== 'running') { try { mic.ctx.resume(); } catch (e) {} }
    if (audioUnlocked) return;
    audioUnlocked = true;
    try { player.src = SILENT; const p = player.play(); if (p) p.catch(() => { audioUnlocked = false; }); } catch (e) { audioUnlocked = false; }
  }
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, true));

  async function voiceUrl(text) {
    if (lastAudio.text === text) return lastAudio.url;
    ttsCtl = new AbortController();
    const res = await fetch(WORKER_URL.replace(/\/chat$/, '/tts'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
      signal: ttsCtl.signal
    });
    if (!res.ok) throw new Error('tts ' + res.status);
    const url = URL.createObjectURL(await res.blob());
    if (lastAudio.url) URL.revokeObjectURL(lastAudio.url);
    lastAudio = { text, url };
    return url;
  }
  function playUrl(url) {
    return new Promise((res, rej) => {
      const rate = settings.slow ? 0.75 : 1;
      const timer = setTimeout(() => res(), 30000);
      stopPlay = () => { clearTimeout(timer); res(); };
      player.onended = stopPlay;
      player.onerror = () => rej(new Error('play'));
      player.src = url;
      player.defaultPlaybackRate = rate; player.playbackRate = rate;
      player.preservesPitch = true;
      const p = player.play();
      if (p) p.catch(e => { if (e && e.name === 'NotAllowedError') showUnlock(); rej(e); });
    });
  }
  function dbgVoice(msg) {
    const el = document.getElementById('dbg');
    if (!el || !/[?&]debug=1/.test(location.search)) return;
    el.hidden = false; el.textContent = msg;
  }
  async function speak(text) {
    const token = speakToken;
    try {
      const url = await voiceUrl(text);
      if (token !== speakToken) return;
      dbgVoice('🔊 自然語音（Worker /tts）正常');
      await playUrl(url);
    } catch (e) {
      if (token !== speakToken || (e && e.name === 'AbortError')) return;
      const why = e && e.name === 'TypeError' ? '連不上或被網域限制（CORS）' : String(e && e.message || e);

    }
    if (token !== listenToken) return;
    if (!res) {                                              // nobody spoke: stay in standby and keep listening
      if (state === 'listening') setState('idle');
      autoListen();
      return;
    }
    transcribeVad(res);
  }
  async function transcribeVad(res) {
    setState('thinking');
    show('…', '');
    heardEl.textContent = '辨識中…';
    ctl = new AbortController();
    try {
      const wav = encodeWav(res.chunks, res.rate);
      const r = await fetch(STT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ audio: b64FromBuffer(wav), lang: 'auto' }),
        signal: ctl.signal
      });
      if (!r.ok) throw { code: r.status === 429 ? 'rate_limited' : 'http' };
      const data = await r.json();
      let text = (data.text || '').trim();
      if (text && isArtifact(text, res)) text = '';
      vadFail = 0;
      if (!text) {
        show(lastEn === '…' ? '' : lastEn, lastZh);
        heardEl.textContent = emptyListens >= 2 ? '點一下麥克風，再跟我說話。' : '沒聽清楚，靠近一點再說一次。';
        setState('idle');
        emptyListens++; autoListen();
        return;
      }
      emptyListens = 0;
      setState('idle');
      ask(text, 'voice');
    } catch (e) {
      if (e && e.name === 'AbortError') { show(lastEn === '…' ? '' : lastEn, lastZh); setState('idle'); return; }
      vadFail++;
      if (vadFail >= 2) vadOff = true;                      // the Whisper route keeps failing: switch to the browser recognizer
      const m = ERR[e && e.code] || ERR.http;
      show(m[0], m[1]);
      heardEl.textContent = '辨識失敗：' + (e && (e.code || e.name || e.message) || 'error');
      setState('idle');
      autoListen();
    }
  }

  const powerBtn = $('#power');
  function pauseListening() {
    paused = true;
    listenToken++; if (vadStop) vadStop();
    clearTimeout(autoTimer);
    cancelSpeech();
    if (ctl) { try { ctl.abort(); } catch (e) {} }
    if (nativeRec) { try { nativeRec.abort(); } catch (e) {} nativeRec = null; }
    if (mediaRec && mediaRec.state !== 'inactive') { recAbort = true; try { mediaRec.stop(); } catch (e) {} }
    closeMic(); meter(0);
    turns.length = 0; sid = ''; round = 0; emptyListens = 0;
    stage.dataset.mood = 'happy';
    STATUS.idle = '已暫停：不收音，也不會傳送任何資料';
    setState('idle');
    show('Zzz… tap Start to wake me up!', '已暫停。點右上角「開始聆聽」叫醒我。');
    heardEl.textContent = '';
    powerBtn.textContent = '▶ 開始聆聽'; powerBtn.classList.add('off'); powerBtn.setAttribute('aria-pressed', 'true');
  }
  function resumeListening() {
    paused = false; recAbort = false; emptyListens = 0; vadOff = false; vadFail = 0;
    STATUS.idle = '直接跟我說話，中文或英文都可以';
    statusEl.textContent = STATUS.idle;
    show(HINT.en, HINT.zh);
    heardEl.textContent = '';
    powerBtn.textContent = '⏹ 停止聆聽'; powerBtn.classList.remove('off'); powerBtn.setAttribute('aria-pressed', 'false');
    startListening();
  }
  powerBtn.onclick = () => { if (paused) resumeListening(); else pauseListening(); };

  function startListening() {
    if (paused || round >= MAX_ROUNDS || startEl.hidden === false) return;
    recAbort = false;
    if (Q.get('stt') === 'native' || vadOff) { if (SR && !nativeOff) startNative(); else startRecorder(); return; }
    startVad();
  }

  async function startRecorder() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
      noMic('這個瀏覽器不能收音，請點句子或打字。');
      return;
    }
    cancelSpeech();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch (e) {
      noMic(e && e.name === 'NotAllowedError' ? '麥克風被擋住了，請到瀏覽器設定允許麥克風。' : '找不到麥克風。');
      return;
    }
    // Volume meter so we can tell "mic is silent" from "speech not understood".
    let peak = 0, meter = null, ac = null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();
      const an = ac.createAnalyser(); an.fftSize = 1024;
      ac.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      meter = setInterval(() => {
        an.getByteTimeDomainData(buf);
        let m = 0; for (let i = 0; i < buf.length; i++) m = Math.max(m, Math.abs(buf[i] - 128) / 128);
        peak = Math.max(peak, m);
        if (state === 'listening') heardEl.textContent = m > 0.03 ? '🎤 收到聲音了…' : '🎤 請說話…';
      }, 150);
    } catch (e) {}
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', ''].find(m => !m || MediaRecorder.isTypeSupported(m));
    const chunks = [];
    try { mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); }
    catch (e) { stream.getTracks().forEach(t => t.stop()); noMic('無法開始錄音，請點句子或打字。'); return; }
    const rec = mediaRec;
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      clearTimeout(recTimer); clearInterval(meter);
      stream.getTracks().forEach(t => t.stop());
      try { ac && ac.close(); } catch (e) {}
      mediaRec = null;
      if (recAbort) { setState('idle'); return; }
      const blob = new Blob(chunks, { type: rec.mimeType || mime || 'audio/webm' });
      if (Date.now() - recStart < 700 || blob.size < 1500) {
        heardEl.textContent = '太短了，說完話再按一次停止。';
        setState('idle');
        return;
      }
      transcribe(blob, peak);
    };
    recStart = Date.now();
    rec.start();
    stage.dataset.mood = 'happy';
    STATUS.listening = '我在聽… 說完再按一下';
    setState('listening');
    heardEl.textContent = '🎤 請說話…';
    recTimer = setTimeout(stopListening, 8000);
  }

  /* ---------- controls ---------- */
  micBtn.onclick = () => {
    if (paused) { resumeListening(); return; }
    if (state === 'listening') { stopListening(); return; }
    if (state === 'thinking') { if (ctl) ctl.abort(); return; }
    emptyListens = 0; startListening();
  };
  $('#replay').onclick = async () => {
    if (!lastEn || lastEn === '…' || state === 'thinking' || state === 'listening') return;
    setState('speaking');
    const token = ++speakToken;
    await speak(lastEn);
    if (token === speakToken && state === 'speaking') setState('idle');
  };
  $('#kbd').onclick = () => {
    typebox.hidden = !typebox.hidden;
    if (!typebox.hidden) typeInput.focus();
  };
  function sendTyped() {
    const t = typeInput.value;
    typeInput.value = '';
    ask(t, 'type');
  }
  $('#send').onclick = sendTyped;
  typeInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendTyped(); } });

  ['Hello!', 'My name is Amy.', '我喜歡 dog', 'How do you say 蘋果?', 'I am hungry.'].forEach(t => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.textContent = t;
    b.onclick = () => ask(t, 'chip');
    $('#chips').appendChild(b);
  });

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  /* ---------- start (a tap unlocks speech on phones) ---------- */
  $('#hello').onclick = () => beginSession(DOOR_LEVEL);
  director();
  keepAwake();
  show(HINT.en, HINT.zh);
  { const p = player.play ? (player.src = SILENT, player.play()) : null; if (p) p.then(() => { audioUnlocked = true; }, () => showUnlock()); }
  setTimeout(startListening, 400);
})();
</script>
</body>
</html>
