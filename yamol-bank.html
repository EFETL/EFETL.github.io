<title>阿摩 110–115 郵局五法考古題｜互動練習</title>
<style>
:root{
  --green:#00824a; --green-d:#005c33; --green-l:#e7f4ec;
  --gold:#c8902a; --ink:#222; --muted:#5f6b63; --line:#d9e4dc;
  --bg:#f6faf7; --card:#fff; --red:#c0392b; --red-l:#fdecea;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:17px; line-height:1.85; -webkit-text-size-adjust:100%;
}
.wrap{max-width:920px;margin:0 auto;padding:0 18px 80px}
header.top{
  background:linear-gradient(135deg,var(--green),var(--green-d));
  color:#fff;padding:30px 18px;text-align:center;
}
header.top .wrap{padding-bottom:0}
header.top h1{margin:0 0 6px;font-size:1.7em;letter-spacing:1px}
header.top p{margin:4px 0;opacity:.92;font-size:.95em}
.backlink{display:inline-block;margin-top:12px;color:#fff;
  border:1px solid rgba(255,255,255,.6);border-radius:20px;
  padding:5px 16px;text-decoration:none;font-size:.9em}
.backlink:hover{background:rgba(255,255,255,.15)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);display:flex;gap:6px;
  padding:8px 18px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
nav.tabs button{flex:1;border:0;background:transparent;font-size:1em;
  font-family:inherit;padding:10px;border-radius:8px;cursor:pointer;
  color:var(--muted);font-weight:700}
nav.tabs button.on{background:var(--green-l);color:var(--green-d)}
section.pane{display:none;padding-top:22px}
section.pane.on{display:block}
h2.sec{font-size:1.35em;color:var(--green-d);border-left:6px solid var(--green);
  padding-left:12px;margin:30px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.card h3{margin:0 0 10px;font-size:1.12em;color:var(--green-d)}
.card h3 .art{font-size:.72em;color:var(--gold);font-weight:700;margin-left:8px}
.card ul{margin:8px 0;padding-left:1.3em}
.card li{margin:6px 0}
.tag{display:inline-block;background:var(--green-l);color:var(--green-d);
  border-radius:6px;padding:1px 8px;font-size:.8em;font-weight:700;margin-right:6px}
.hl{background:#fff5d6;padding:0 3px;border-radius:3px;font-weight:700}
.warn{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.96em;
  background:#fff;border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
th{background:var(--green);color:#fff;font-weight:700}
tbody tr:nth-child(even){background:var(--green-l)}
.mnem{background:var(--green-l);border:1px dashed var(--green);border-radius:10px;
  padding:12px 16px;margin:12px 0;font-size:.98em}
.mnem b{color:var(--green-d)}

/* quiz */
.quizbar{position:sticky;top:54px;z-index:15;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;margin:6px 0 16px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.quizbar .score{font-weight:800;color:var(--green-d);font-size:1.05em}
.quizbar .prog{flex:1;min-width:120px;height:10px;background:var(--green-l);
  border-radius:8px;overflow:hidden}
.quizbar .prog>i{display:block;height:100%;width:0;background:var(--green);transition:.3s}
.quizbar button{border:1px solid var(--green);background:#fff;color:var(--green-d);
  font-family:inherit;font-size:.9em;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:700}
.quizbar button:hover{background:var(--green-l)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.q .stem{font-weight:700;margin-bottom:12px}
.q .stem .no{display:inline-block;background:var(--green);color:#fff;border-radius:50%;
  width:1.7em;height:1.7em;line-height:1.7em;text-align:center;margin-right:8px;font-size:.92em}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);
  background:#fbfdfb;border-radius:10px;padding:11px 14px;margin:7px 0;cursor:pointer;
  font-family:inherit;font-size:1em;line-height:1.6;transition:.15s}
.opt:hover{border-color:var(--green)}
.opt .lab{font-weight:800;color:var(--green-d);margin-right:6px}
.opt.correct{background:var(--green-l);border-color:var(--green);color:var(--green-d)}
.opt.wrong{background:var(--red-l);border-color:var(--red);color:var(--red)}
.opt.lock{cursor:default}
.exp{margin-top:10px;padding:11px 14px;border-radius:10px;background:#f3f8f4;
  border-left:4px solid var(--green);font-size:.97em;display:none}
.exp.show{display:block}
.exp b{color:var(--green-d)}
footer{text-align:center;color:var(--muted);font-size:.85em;margin-top:40px}
@media(max-width:520px){body{font-size:16.5px}.wrap{padding:0 12px 60px}}
@media print{nav.tabs,.quizbar,.backlink{display:none}section.pane{display:block!important}
  .exp{display:block!important}.q,.card{break-inside:avoid}}


.filters{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
.filters .row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:7px 0}
.filters .row>span.lbl{font-weight:800;color:var(--green-d);min-width:4.6em;font-size:.93em}
.chip{border:1.5px solid var(--line);background:#fbfdfb;border-radius:999px;padding:5px 13px;
  cursor:pointer;font-family:inherit;font-size:.9em;color:var(--muted);font-weight:700}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.go{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go button.main{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 20px;
  font-family:inherit;font-size:1em;font-weight:800;cursor:pointer}
.go button.main:hover{background:var(--green-d)}
.go .cnt{color:var(--muted);font-size:.92em}
.meta{font-size:.8em;color:var(--muted);font-weight:400;margin-left:6px}
.badge{display:inline-block;border-radius:6px;padding:0 7px;font-size:.75em;font-weight:800;margin-right:5px;vertical-align:2px}
.b-off{background:#e7f4ec;color:#005c33;border:1px solid #9ccdb2}
.b-amo{background:#fff5d6;color:#8a6414;border:1px solid #e0c469}
.b-low{background:#fdecea;color:#c0392b;border:1px solid #e8a49b}
.b-half{background:#eef1fb;color:#33459b;border:1px solid #a9b5e4}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>

否則處以 2 萬至 10 萬元罰鍰","C":"須事先獲得交通部同意，否則處以 2 萬至 10 萬元罰鍰","D":"須事先獲得中華郵政公司同意，否則處以 20 萬至 100 萬元罰鍰"},"k":"內勤","p":0,"d":"資料來源：網路及其他網友整理的網頁"},{"l":0,"y":110,"a":"A","c":0.77,"s":"以運送為業之鐵路、長途汽車、船舶、航空器，無正當理由拒絕載運郵件時，應受何懲處？","o":{"A":"處 2 萬元以上 10 萬元以下罰鍰","B":"處 5 萬元以上 25 萬元以下罰鍰","C":"處 10 萬元以上 50 萬元以下罰鍰","D":"處 20 萬元以上 100 萬元以下罰鍰"},"k":"模擬","p":0,"d":"郵政法第45條\n依第26條第1項規定負輔助載運郵件責任者，有下列情事之一時，\n處新台幣2萬元以上10萬元以下\n罰鍰：\n一、\n無正當事由拒絕載運郵件\n二、故意延誤載運郵件"},{"l":0,"y":110,"a":"D","c":0.84,"s":"依郵政法規定，下列何者非依法律，不得作為檢查、徵收或扣押之標的？ A.郵件 B.郵政資產 C.郵政款項 D.郵政公用物","o":{"A":"僅 A、B、C","B":"僅 B、C、D","C":"僅 A、B、D","D":"A、B、C、D"},"k":"模擬","p":0,"d":"第 8 條\n郵件、郵政資產、郵政款項及郵政公用物，非依法律，不得作為檢查、徵\n收或扣押之標的。"},{"l":0,"y":110,"a":"D","c":0.93,"s":"依民國 112 年 6 月 28 日修正之郵政法規定，除中華郵政公司及受其委託者外，國內互寄之文件，任何人不得以遞送為營業之項目，不包括下列何者？（相關條文施行日期，由行政院以命令定之）","o":{"A":"國立臺灣大學交寄之信函","B":"交通部交寄之信函","C":"司法院交寄之信函","D":"私立東吳大學交寄 1 件重量 550 公克之信函"},"k":"模擬","p":0,"d":"私立學校，限制 \n500公克 \n以下\n若改為公立學校，則無限制\n另補充一題\n依 107 年 12 月 5 日修正之郵政法規定，除中華郵政公司及受其委託者外，任何人不得以遞送下列何種文件為營業？（相關條文施行日期，由行政院以命令定之）\n(A) 某甲由臺北寄至德國之跨境郵簡\n(B) 私立東海大學交寄，收件人為我國教育部之 1 件 620 公克信函\n(C) 國立交通大學交寄，收件人為日本名古屋大學之 1 件 300 公克信函\n(D) 高雄市政府寄給在臺南某乙之 1 件 520 公克信函\nAns：(D)"},{"l":0,"y":110,"a":"C","c":0.89,"s":"依郵政法規定，下列何者得請求補償？","o":{"A":"收件人聲稱已獲授與求償權，但無法提出證據證明","B":"包裹遞交收件人時封面完好，但因內件性質減少重量","C":"保價郵件因地震毀損","D":"快捷郵件因颱風毀損"},"k":"模擬","p":0,"d":"C---戰事不賠，其他皆賠"},{"l":0,"y":110,"a":"B","c":0.82,"s":"依郵政法規定，下列何者將受處刑罰？","o":{"A":"誤收他人之郵件，故意不返還者","B":"無故開拆或隱匿他人之郵件或以其他方法窺視其內容者","C":"未受中華郵政公司委託，而以遞送明信片為營業者","D":"中華郵政公司以外之人，未經該公司同意，使用與郵政、郵局相同之圖形、記號，表彰其營業名稱者"},"k":"模擬","p":0,"d":"郵政法 第 36 條\n意圖供行使之用，而偽造、變造郵政認知證、國際回信郵票券或其他表示郵資已付符誌者，處六月以上五年以下有期徒刑，得併科新臺幣三萬元以下\n罰金\n。\n行使前項偽造、變造之物，或意圖供行使之用而收集或交付於人者，處三年以下有期徒刑，得併科新臺幣三萬元以下\n罰金\n。\n意圖供重複行使之用，而於郵票、明信片及特製郵簡之印花或表示郵資已付符誌之上，塗用膠類、油類、漿類或其他化合物者，處一年以下有期徒刑、拘役或新臺幣九千元以下\n罰金\n。其行使之者，亦同。\n第 38 條\n無故開拆或隱匿他人之郵件或以其他方法窺視其內容者，處拘役或新臺幣九萬元以下\n罰金\n。"},{"l":0,"y":110,"a":"B","c":0.86,"s":"有關郵票之規定，下列敘述何者錯誤？","o":{"A":"持有公告廢止之郵票者，自廢止之日起 6 個月內，得向中華郵政公司換取新票","B":"郵票之發行，應由中華郵政公司擬訂式樣、圖案、價格及數量，報請主管機關核定後發行","C":"污損之郵票，失其效用","D":"郵政服務人員意圖供行使之用，而變造郵票者，加重其刑至二分之一"},"k":"模擬","p":0,"d":"第 十六 條\n郵費之交付，以郵票或其他表示郵資已付符誌證明之。\n郵票、含有郵票符誌之明信片或特製郵簡\n，由\n中華郵政公司擬訂\n式樣、圖案及價格\n，報請\n主管機關層轉\n行政院\n核定\n後發行。\n第 十七\n條　　\n中華郵政公司於報請主管機關核定\n後，將其發行之\n郵票\n廢止\n之。但\n應\n於\n一個月\n前公告，並停止該郵票售賣。\n持有前項廢止之郵票者，\n自\n廢止之日\n起\n六個月\n內\n，\n得\n向中華郵政公司換取新票。\n　污損之郵票，失其效用。明信片及特製郵簡上表示價格之花紋有污損時，亦同。"},{"l":0,"y":110,"a":"B","c":0.92,"s":"依郵政法規定，下列何者非屬中華郵政公司免納稅捐之範圍？","o":{"A":"供投遞郵件使用之電動機車","B":"中華郵政公司將其所有建物之外牆出租給廣告業者使用收取之租金","C":"供遞送郵件業務使用之局屋","D":"供遞送郵件業務使用之業務單據"},"k":"模擬","p":0,"d":"郵政法第 9 條\n中華郵政公司經營之\n遞送郵件業務\n及供該項業務使用之\n郵政公用物\n、\n業務\n單據\n，免納一切稅捐。"},{"l":0,"y":110,"a":"B","c":0.87,"s":"依 107 年 12 月 5 日修正之郵政法規定，有關用詞定義，下列敘述何者錯誤？(本法部分條文施行日期， 由行政院 以命令定之)","o":{"A":"印刷物：指新聞紙、雜誌、書籍、型錄等印刷文件","B":"信函：指寄交特定人或特定地址以傳達訊息之文件，且包括明信片、郵簡、印刷物、盲人文件","C":"小包：指寄交特定人或特定地址不逾一公斤之小件物品","D":"遞送：指文件或物品之收寄、封發、運輸、投遞"},"k":"模擬","p":0,"d":"郵政法 第 4 條\n一、函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱。\n二、信函：指寄交特定人或特定地址以傳達訊息之文件，但\n不包括\n明信片、郵簡、印刷物、盲人文件。\n97\n1"},{"l":0,"y":110,"a":"B","c":0.95,"s":"有事實足認郵件內裝之物不適用優惠資費，而寄件人不同意開拆時，依郵政法規定，中華郵政公司之處理方式為何？","o":{"A":"不得拒絕接受該郵件","B":"得拒絕接受該郵件","C":"得加收特別處理費後接受該郵件","D":"得延後投遞該郵件"},"k":"模擬","p":0,"d":"郵政法 第 10 條\n中華郵政公司或其服務人員，不得開拆他人之郵件。但有事實足認內裝之物為郵政禁寄物品、不適用優惠資費\n或違反郵政法規，經寄件人或收件人同意開拆者，不在此限。\n郵件經依前項但書規定開拆查驗後，\n應\n予驗訖之證明。\n寄件人或收件人不同意開拆時，中華郵政公司\n得\n拒絕接受\n或遞送該郵件\n。"},{"l":0,"y":110,"a":"C","c":0.83,"s":"依郵政法規定，寄件人或收件人之郵件補償請求權，自郵件寄件之日起，逾幾個月不行使而消滅？","o":{"A":"一個月","B":"三個月","C":"六個月","D":"一年"},"k":"模擬","p":0,"d":"§\n33\n補償後發現原郵件\n3\n個月\n(Post Ltd.\n於履行補償後，發現原寄郵件之全部或一部，\n應\n通知受領補償者，\n得\n於收到通知之日起，三個月內，退還補償金的全部或一部，請求交付該發現支原寄郵件\n)\n§\n34\n補償請求權消滅時效\n6\n個月\n(\n寄件人或收件人於\n6\n個月內查詢者，以已請求補償論\n)\n§\n35\n補償\n金\n請求權消滅時效\n5\n年\n(\n自受領補償人收到通知之日起\n)\n101\n1"},{"l":0,"y":110,"a":"C","c":0.88,"s":"依郵政法規定，意圖供重複行使之用，而於郵票上塗用膠類、油類、漿類或其他化合物者，下列敘述何者錯誤？","o":{"A":"得處一年以下有期徒刑","B":"郵政服務人員犯該罪者，加重其刑至二分之一","C":"負輔助載運郵件責任者之服務人員犯該罪者，不加重其刑","D":"負輔助載運郵件責任者之服務人員犯該罪者，加重其刑至二分之一"},"k":"模擬","p":0,"d":"第三十六條　　意圖供行使之用，而\n偽造、變造\n郵政認知證、國際回信郵票券或其他表示郵資已付符誌者，\n處\n六月以上\n五年\n以下\n有期徒刑，得併科\n新臺幣三萬元以下\n罰金\n。\n行使\n前項偽造、變造之物，或意圖供行使之用而收集或交付於人者，\n處\n三年\n以下\n有期徒刑，得併科\n新臺幣三萬元以下\n罰金\n。\n　　意圖供\n重複\n行使之用，而於郵票、明信片及特製郵簡之印花或表示郵資已付符誌之上，塗用膠類、油類、漿類或其他化合物者，\n處\n一年\n以下\n有期徒刑、\n拘役\n或\n新臺幣九千元以下\n罰金\n。其行使之者，亦同\n。\n第三十七條　　\n郵政服務人員\n犯前條之罪或刑法第二百零二條或第二百零四條\n關於郵票\n之罪者\n，\n加重其刑至二分之一\n。\n(\n規定負輔助載運郵件責任者之服務人員\n” \n以運送為業之鐵路、長途汽車、船舶、航空器，均有輔助載運郵件及其處理人員\n”\n，適用之。\n)\n21\n1"},{"l":0,"y":110,"a":"B","c":0.82,"s":"有關特製郵簡之規定，下列敘述何者正確？","o":{"A":"須另加封套","B":"特製郵簡上表示價格之花紋有污損時，失其效用","C":"其式樣、圖案及價格，由中華郵政公司報請交通部核定後發行","D":"意圖供行使之用，而變造特製郵簡者，得處新臺幣二萬元以上十萬元以下罰鍰"},"k":"模擬","p":0,"d":"(A)免加封套\n(C)行政院核定\n(D)處6個月以上5年以下有期徒刑，併科3萬元以下罰金"},{"l":0,"y":110,"a":"C","c":0.86,"s":"依郵政法第5條之1規定，中華郵政公司所提供之「遞送普及服務」，下列敘述何者錯誤？","o":{"A":"服務範圍僅限於我國境內","B":"必須永久提供該項服務且品質良好","C":"該服務須價格低廉","D":"僅須提供基本之遞送服務"},"k":"外勤","p":0,"d":"郵政法 \n修正日期：民國 112 年 06 月 28 日\n第 5-1 條\n為保障國民基本通信權益，主管機關應確保提供國內之遞送普及服務。\n前項所稱之遞送普及服務，指於國內就下列各款，永久提供品質良好、\n價格允當\n之基本遞送服務：\n一、單件不逾二公斤之函件。\n二、單件不逾二十公斤及長寬高合計不逾一百五十公分之包裹。\n三、其他經主管機關指定之文件或物品。\n中華郵政公司應提供前項普及服務。但因天災、事變或其他不可抗力情事致執行顯有困難，該公司得公告限制或停辦前項郵件之遞送服務。\n遞送普及服務之服務標準，由主管機關定之。"},{"l":0,"y":110,"a":"C","c":0.89,"s":"依郵政法規定，有關郵件之收件地址係地面層以外樓層之郵件投遞方式，下列敘述何者錯誤？","o":{"A":"地面層設有管理服務人員或郵件收發處者，各類郵件得交管理服務人員或郵件收發處收領","B":"地面層未設有管理服務人員或郵件收發處而僅設置受信設備、對講機或電鈴者，平常郵件投入受信設 備","C":"地面層未設有管理服務人員或郵件收發處而僅設置受信設備、對講機或電鈴者，欠資郵件請收件人至 鄰近郵局補付欠資後投遞","D":"地面層未設有管理服務人員或郵件收發處而僅設置受信設備、對講機或電鈴者，欠資郵件請收件人至 地面層補付欠資後投遞"},"k":"外勤","p":0,"d":"郵政法 \n修正日期：民國 112 年 06 月 28 日\n第 24 條\n收件地址係地面層以外樓層之郵件，依下列方式投遞：\n一、地面層設有管理服務人員或郵件收發處者，各類郵件得交管理服務人員或郵件收發處收領。\n二、無法依前款規定投遞、地面層未設有管理服務人員或郵件收發處而僅設置受信設備、對講機或電鈴者，平常郵件投入受信設備，掛號郵件及\n欠資\n郵件，請\n收件人至地面層領取或補付欠資\n。\n掛號郵件及欠資郵件無法依前項規定投遞者，依第四十八條所訂之規則有關投遞規定辦理。"},{"l":0,"y":110,"a":"A","c":0.73,"s":"依郵政法有關寄件人或收件人之補償規定，下列敘述何者正確？","o":{"A":"補償請求權自郵件交寄之日起，逾六個月不行使而消滅","B":"補償請求權自郵件交寄之日起，逾二年不行使而消滅","C":"補償金請求權，自受領補償人收到通知之日起，逾六個月不行使而消滅","D":"補償金請求權，自受領補償人收到通知之日起，逾二年間不行使而消滅"},"k":"外勤","p":0,"d":"第 34 條\n1.寄件人或收件人之\n補償請求權\n，自郵件交寄之日起，\n逾六個月\n不行使而消滅。\n2.寄件人或收件人，如於前項期間內曾向中華郵政公司查詢該郵件者，以已經請求補償論。\n第 35 條\n補償金確定後，應通知受領補償人。\n補償金請求權\n，自受領補償人收到通知之日起，\n逾五年\n間不行使而消滅。"},{"l":0,"y":110,"a":"C","c":0.85,"s":"依郵政法規定，下列何種行為非僅處行政罰鍰，而須處以拘役或罰金？","o":{"A":"負輔助載運郵件責任者無正當事由拒絕載運郵件或故意延誤載運郵件","B":"誤收他人之郵件，故意不返還者","C":"無故開拆或隱匿他人之郵件或以其他方法窺視其內容者","D":"未受中華郵政公司委託，而以遞送郵政專營之文件為營業者"},"k":"外勤","p":0,"d":"免費公開(貼個法條也收鑽石不懂???\n(A) 負輔助載運郵件責任者無正當事由拒絕載運郵件或故意延誤載運郵件\n第 45 條\n依第二十六條第一項規定負輔助載運郵件責任者，有下列情事之一時，處新臺幣\n二萬元以上十萬元以下\n罰鍰：\n一、無正當事由拒絕載運郵件。\n二、故意延誤載運郵件。\n(B) 誤收他人之郵件，故意不返還者\n第 39 條\n誤收他人之郵件，故意不返還者，處新臺幣\n二千元以上一萬元以下\n罰鍰。\n(C) 無故開拆或隱匿他人之郵件或以其他方法窺視其內容者\n第 38 條\n無故開拆或隱匿他人之郵件或以其他方法窺視其內容者，處\n拘役\n或\n新臺幣九萬元以下\n罰金。\n(D) 未受中華郵政公司委託，而以遞送郵政專營之文件為營業者\n第 40 條\n1.違反第六條規定者，處新臺幣\n二十萬元以上一百萬元以下\n罰鍰，並通知其停止該等行為；\n未停止者\n，\n得按次處罰\n。\n2.違反第六條之一規定者，經主管機關令其限期"},{"l":0,"y":110,"a":"B","c":0.85,"s":"依郵政法規定，有關「小包」郵件，下列敘述何者錯誤？","o":{"A":"小件之物品","B":"重量不得逾五百公克","C":"可作限時或掛號交寄","D":"小包為函件之一種"},"k":"外勤","p":0,"d":"郵政法 \n修正日期：民國 112 年 06 月 28 日\n第 4 條\n本法用詞，定義如下：\n... 略...\n七、\n小包\n：指寄交特定人或特定地址不逾\n一公斤\n之小件物品。\n... 略...\n25\n2"},{"l":0,"y":110,"a":"D","c":0.95,"s":"依郵政法規定，遞送之定義不包括下列何者？","o":{"A":"文件或物品之封發","B":"文件或物品之收寄","C":"文件或物品之運輸","D":"文件或物品之倉儲"},"k":"外勤","p":0,"d":"第 4 條\n本法用詞，定義如下：\n十一、遞送：指文件或物品之收寄、封發、運輸、投遞。"},{"l":0,"y":110,"a":"D","c":0.93,"s":"依郵政法規定，下列何者應納稅捐？","o":{"A":"中華郵政公司運輸郵件之汽車","B":"臺北郵件處理中心之辦公大樓","C":"中華郵政公司處理郵件之機具設備","D":"中華郵政公司出租之土地"},"k":"外勤","p":0,"d":"第 9 條 \n中華郵政公司經營之\n遞送郵件業務及供該項業務使用之郵政公用物、業務單據，免納一切稅捐。\n 郵件在航運發生海難時，不分擔共同海損。"},{"l":0,"y":110,"a":"C","c":0.96,"s":"依郵政法規定，有關郵件，下列敘述何者錯誤？","o":{"A":"郵件在航運發生海難時，不分擔共同海損","B":"中華郵政公司之服務人員因收寄郵件知悉之秘密，離職後仍有保守秘密之義務","C":"運送業者未受中華郵政公司委託所載運之文件亦稱郵件","D":"國際郵件事務適用國際郵政公約或協定之規定"},"k":"外勤","p":0,"d":"第 6 條 \n除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業。\n但國內、外互寄之跨境文件，不在此限：\n 一、明信片。\n 二、郵簡。 \n三、信函： \n（一）各級政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄。 \n（二）前目以外之人所交寄，且單件重量五百公克以下或單件資費不逾十三倍基礎郵資。 \n運送業者，除附送與貨物有關之通知外，不得為前項文件之遞送。"},{"l":0,"y":110,"a":"C","c":0.83,"s":"有關違反郵政法第六條郵政專營之規定者，下列敘述何者正確？","o":{"A":"得處新臺幣十萬元以上五十萬元以下罰鍰","B":"對違反者應先令其限期改正，如屆期不改正，方得處罰鍰","C":"經通知其停止該等行為而未停止者，得按次處罰","D":"中華郵政公司得派員會同警察機關實施行政檢查"},"k":"外勤","p":0,"d":"第 40 條 \n違反第六條規定者，處新臺幣二十萬元以上一百萬元以下罰鍰，並通知其停止該等行為；未停止者，得按次處罰。 \n違反第六條之一規定者，經主管機關令其限期改正而屆期不改正者，處新臺幣二萬元以上十萬元以下罰鍰，並得按次處罰。"},{"l":0,"y":110,"a":"D","c":0.86,"s":"依郵政法規定，下列何者應由交通部核定？","o":{"A":"盲人文件之資費","B":"郵票之圖案","C":"有郵票符誌之明信片其價格","D":"廢止已發行之郵票"},"k":"外勤","p":0,"d":"(D)發行: 行政院核定\n     廢止: 交通部核定"},{"l":0,"y":110,"a":"D","c":0.97,"s":"下列何者非屬郵政法之立法目的？","o":{"A":"增進公共利益","B":"提供普遍、公平、合理之郵政服務","C":"健全郵政發展","D":"促進產業創新"},"k":"模擬","p":0,"d":"第 一 章 總則\n第 1 條\n為\n健全郵政發展\n，\n提供普遍、公平、合理之郵政服務\n，\n增進公共利益\n，特制定本法；本法未規定者，依其他法律之規定。"},{"l":0,"y":110,"a":"D","c":0.95,"s":"下列敘述何者正確？","o":{"A":"郵政法的主管機關為行政院","B":"郵政法的主管機關為交通部及行政院","C":"郵政法的主管機關為立法院","D":"郵政法的主管機關為交通部"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.7,"s":"有關中華郵政股份有限公司組織型態之敘述，下列何者錯誤？","o":{"A":"交通部為該公司唯一股東","B":"屬國營公司","C":"屬行政機關","D":"屬營利社團法人"},"k":"模擬","p":0,"d":"依我國民法所成立的\n法人\n又可區分為「\n社團法人\n」及「\n財團法人\n」兩大類\n社團法人\n是以成員為成立的基礎\n財團法人\n，是指依照一定的程序，將特定的捐助財產獨立化，使捐助財產獲得自然人一樣能夠享受權利、負擔義務資格的\n法人\n，故\n財團法人\n的權利義務主體為「財產」。"},{"l":0,"y":110,"a":"D","c":0.85,"s":"依郵政法第 4 條用詞定義規定，何者非屬「信函」？","o":{"A":"信封封面同時書寫收件人姓名及地址，以傳達訊息之文件","B":"信封封面僅書有收件人姓名，以傳達訊息之文件","C":"信封封面僅書有收件人地址，以傳達訊息之文件","D":"明信片、郵簡、印刷物、盲人文件"},"k":"模擬","p":0,"d":"信函：指寄交特定人或特定地址以傳達訊息之文件，但不包括明信片、郵簡、印刷物、盲人文件"},{"l":0,"y":110,"a":"D","c":0.86,"s":"依民國 112 年 6 月 28 日修正之郵政法規定，有關用詞定義，下列敘述何者錯誤？","o":{"A":"遞送：指文件或物品之收寄、封發、運輸、投遞","B":"小包：指寄交特定人或特定地址不逾一公斤之小件物品","C":"函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱","D":"信函：指寄交特定人或特定地址以傳達訊息之文件，且包括明信片、郵簡、 印刷物、盲人文件"},"k":"模擬","p":0,"d":"不\n包括明信片、郵簡、 印刷物、盲人文件"},{"l":0,"y":110,"a":"C","c":0.61,"s":"依郵政法規定，有關得按「盲人文件」交寄之規定，下列何者錯誤？","o":{"A":"愛盲基金會寄交臺北市啟明學校之專供盲人使用之錄音帶、錄音片、錄音線及特製紙張","B":"臺北市啟明學校寄給一般盲生使用之錄音帶、錄音片、錄音線及特製紙張","C":"愛盲基金會寄給一般盲生使用之錄音帶、錄音片、錄音線及特製紙張，交寄時並在封面 註明「盲人文件」字樣","D":"愛盲基金會寄給一般盲生使用之印有點痕或凸出字樣,交寄時並在封面註明「盲人文件 」字樣"},"k":"模擬","p":0,"d":"分開理解盲人文件：\n1、指盲人所用印有點痕或凸出字樣，交寄時在封面註明「盲人文件」字樣之文件\n→只要做到以上\"點痕、註明\"，都算盲人文件\n2、專供盲人使用之錄音帶、錄音片、錄音線及特製紙張\n→這個條件則是\n一定要從立案之盲人學校寄出\n，或寄給立案盲人學校，才符合盲人文件標準"},{"l":0,"y":110,"a":"D","c":0.77,"s":"依郵政法，下列的立法定義何者錯誤？","o 中華郵政公司外，任何人不得發行、製作與郵票類似，且具有交付郵資證明之票證"},"k":"模擬","p":0,"d":"中華郵政公司於報請主管機關核定後，將其發行之郵票廢止之。但應於一個月前公告，並停止該郵票售賣。\n持有前項廢止之郵票者，自廢止之日起六個月內，得向中華郵政公司換取新票"},{"l":0,"y":110,"a":"B","c":0.71,"s":"下列敘述何者錯誤？","o":{"A":"雜誌為 7 日以上 3 個月以下按期發行者","B":"新聞紙為每日或每隔 7 日以下按期發行者","C":"將已發行之郵票廢止，須由中華郵政公司報交通部核定","D":"欠資郵件之欠資及欠資手續費以向收件人收取為原則"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"A","c":0.71,"s":"中華郵政公司於包裹轉運期間，發現其內容易於自然變質或消滅時，應如何處理？","o":{"A":"為寄件人之利益，得立即變賣之","B":"為收件人之利益，得立即變賣之","C":"為寄件人之利益，得通知寄件人儘速領回","D":"為收件人之利益，得通知收件人儘速領取"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.74,"s":"依郵件處理規則之規定，郵件須符合下列哪些條件，其資費得予優待？A、大宗交寄之郵件 B 、依中華郵政公司規定書寫郵遞區號 C、當場繳納郵資 D、分區捆紮","o":{"A":"僅 A、B、C","B":"僅 B、C、D","C":"僅 A、B、D","D":"A、B、C、D"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"B","c":0.48,"s":"寄件人於 102 年 9 月 16 日在臺北金南郵局交寄內裝黃金戒指數枚之國內保價信函 1 件，內裝 物實際價值 12,000 元，保價金額 10,000 元，9 月 23 日投交收件人時，發現郵件包裝破損， 內裝物一部損失，按 9 月 16 日黃金市價約損失 2,000 元，若以 9 月 23 日黃金市價則僅損失 1,500 元(金價下跌緣故)，有關補償及郵資返還規定，何者正確？","o":{"A":"需補償 2,000 元並退還保價費以外之郵資","B":"僅補償 2,000 元，郵資不退","C":"僅補償 1,500 元並退還保價費以外之郵資","D":"因保價金額低於內裝物實際價值，於有損失時，依規定不得請求任何補償。因此，郵局得 不予補償"},"k":"模擬","p":0,"d":"此題B選項，應為正確解答，適用條文，應為郵件處理規則第64條，條文前略，報值或保價郵件全部或\"一部\"遺失、被竊或毀損，\"應予補償時\"，按所報或所保價值之全部或一部予以補償。一部損失，以實價補償，其實價，\"\"依收寄時及收寄地之市價定之。\"\" 最多以原件所報，或所保價值為限。\n題中所述，價值超過所保金額，那一部分只是不負補償責任，但是一萬元的價值部分，還是在補償範圍內。所以，因一部損失所減損的價值，依照 依收寄時及收寄地之市價定之，減損2000，仍在補償範圍內，而，郵件只是部分減損，並未提及可歸責於郵政公司的因素導致延誤，仍有按照正常時效送達，所以郵資部分，不適用減免。\n以上，即為個人認為，選項B 為正確解答之原因。"},{"l":0,"y":110,"a":"C","c":0.87,"s":"有關禁止交寄之文件或物品，於郵局收寄後發現者，下列處理方式何者錯誤？","o":{"A":"封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理者，於原寄郵局發現者，退還寄件人","B":"物品之性質或其封裝有傷害郵政服務人員或污損郵件或郵政設備之虞者，於原寄郵局發現 者，退還寄件人","C":"放射性物品，退還寄件人","D":"寄達國禁止輸入或流通之文件或物品，除依規定送交相關主管機關處理外，退還寄件人"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"A","c":0.84,"s":"航空郵件收寄後，因不可歸責於中華郵政公司之事由，致郵件未能交由航空郵路運送時，得 改由其他較為迅速之郵路運送，相關資費應如何處理？","o":{"A":"所付航空資費不予退還","B":"若以海運替代運送者，退還運費差額","C":"退還航空資費百分之五十","D":"全額退還航空資費"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.67,"s":"中華郵政公司非依法規不得拒絕郵件之遞送，但下列何者為例外？","o":{"A":"投遞人員曾被動物咬傷地點 100 公尺範圍，得逕拒絕","B":"投遞人員曾被動物咬傷地點 300 公尺範圍，得逕拒絕","C":"郵件規格不符中華郵政公司公告者，得拒絕","D":"偏遠地區不符成本之郵件，得拒絕"},"k":"模擬","p":0,"d":"郵政法第19條\n中華郵政公司非依法規，不得拒絕遞送第五條之一第二項各款之文件或物品。\n但禁寄物品或郵件規格不符中華郵政公司公告者\n，不在此限。"},{"l":0,"y":110,"a":"D","c":0.4,"s":"【已刪除】31.中華郵政公司為營運之必要，得委託下列何者遞送郵件： a.年滿 20 歲、國民中學以上學校畢業、身心健康之自然人 b.人力派遣業 c.快遞業 d.汽車貨 運業 e.汽車路線貨運業 f.航空貨運承攬業 g.海運貨運承攬業","o":{"A":"abc","B":"def","C":"cde","D":"efg"},"k":"模擬","p":0,"d":"第五十二條\n中華郵政公司得委託他人運輸郵件，其條件如下：\n一、\n陸路運輸\n：受託人須為汽車貨運業、汽車路線貨運業、汽車貨櫃貨運業、公路汽車客運業或鐵路機構。\n二、\n航空運輸\n：受託人須為航空貨運承攬業或航空運輸業。\n三、\n水路運輸\n：受託人須為船舶運送業、船務代理業或海運承攬運送業。\n中華郵政公司得委託他人收寄或投遞郵件，其條件如下：\n一、受託人為自然人者，須成年、國民中學以上學校畢業及身心健康。\n二、受託人為郵政代辦所者，除經理人須符合前款規定外，該代辦所應設於機關、學校、公司、行號、團體或其他公眾得自由出入之場所內。"},{"l":0,"y":110,"a":"D","c":0.52,"s":"郵政公司得委託他人遞送郵件，如受託人為自然人者，其年齡必須滿多少歲？","o":{"A":"三十歲","B":"二十歲","C":"五十歲","D":"十八歲"},"k":"模擬","p":0,"d":"現在所定義的成年到底是18還是20歲 ?\n1\n1"},{"l":0,"y":110,"a":"B","c":0.76,"s":"自然人得接受中華郵政公司委託遞送郵件之條件，除須成年及身心健康外，須何學校 以上畢業？","o":{"A":"國小畢業","B":"國中畢業","C":"高中畢業","D":"專科畢業"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"B","c":0.77,"s":"無着郵件，無法退還者，其內裝文件或物品係有價值或得為買賣標的者，自郵件交寄日起， 滿幾年無人認領者，即變賣之？","o":{"A":"1 年","B":"3 年","C":"5 年","D":"10 年"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.74,"s":"郵件經查詢如有遺失、被竊或毀損依法應予補償，郵局應儘速支付補償金，至遲應自查詢之 翌日起多久內為之？","o":{"A":"一個月","B":"二個月","C":"三個月","D":"六個月"},"k":"模擬","p":0,"d":"免費!免費!免費!\n第六十三條 郵件經查有遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送，依本法應予補償者，郵局應憑交寄執據或郵件封皮儘速支付補償金，至遲應自查詢之次日起三個月內為之。\n 國際郵件，經查詢逾三個月仍未能獲致結果時，寄件人得以書面聲明，如不符合補償條\n件者，願將已領之補償金退還，向郵局申請先予補償。"},{"l":0,"y":110,"a":"B","c":0.8,"s":"某甲於臺北金南郵局採國內快捷方式，交寄標單 1 件，實收郵資共 120 元，今因郵局之過失 發生郵件延誤送達，致某甲未能得標，損失預期獲利 60 萬元，寄件人得請求：","o":{"A":"按損失金額 60 萬元請求補償，並請求返還 120 元郵資","B":"僅得請求返還 120 元郵資","C":"得請求返還 120 元郵資，並免費再寄送相同郵件 1 次","D":"不得請求返還國內快捷郵資"},"k":"模擬","p":0,"d":"64條\n3.限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致者，其補償金額如下：\n一、限時郵件及\n國內快捷郵件，依所收取之全部資費補償。\n二、國際快捷郵件，依所收取全部資費之百分之五十補償。\n68條\n中華郵政公司交付補償金後，除郵件遞送延誤及掛號郵件未依中華郵政公司公告之處理規定遞送者外，即取得受領補償人對於相關郵件寄件人、收件人或其他人所得為之權利。但以所付補償金額為限。\n69條\n郵件遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送者，中華郵政公司應依本法及本規則規定補償；因上開事由所致之其他損失或損害，不予補償或賠償。\nㅤㅤ"},{"l":0,"y":110,"a":"A","c":0.92,"s":"中華郵政公司依法規不得拒絕遞送郵政法第 5 條之 1 第 2 項各款之文件或物品。下列何 種郵件，中華郵政公司不得拒絕遞送？","o":{"A":"郵政專營之信函、明信片及郵簡","B":"郵件規格不符中華郵政公司公告者","C":"寄往國外之郵件","D":"郵件內裝禁寄物品"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.96,"s":"有關郵件遞送之敘述，下列何者錯誤？","o":{"A":"中華郵政公司為確認收件人之真偽，得請收件人出示必要之證明","B":"各類郵件收件人有二人以上者，得向其中任何一人投遞","C":"中華郵政公司得於公私團體及其他公眾出入處所，設置收受郵件專用器具，以收取郵件 ，此係為提供普遍之用郵服務，故無須取得所有權人或其管理人同意","D":"凡以運送為業之鐵路、長途汽車、船舶、航空器，均有輔助載運郵件及其處理人員之責"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.93,"s":"依郵政法規定，有關郵件無法投遞之處理程序，下列何者錯誤？","o":{"A":"應先退還寄件人","B":"郵件無法退還者，由中華郵政公司招領揭示之","C":"招領揭示經過相當時期，無人領取時，送交當地警察局處理","D":"招領揭示經過相當時期，無人領取時，由中華郵政公司處分"},"k":"模擬","p":0,"d":"郵政法 第 22 條\n:\n各類郵件，應按其表面所書收件人之地址投遞之。\n但依第二十四條或依第四十八條所訂之規則有關改投、改寄或不按址投遞情形，不在此限。\n郵件無法投遞，應退還寄件人。\n無法退還，由中華郵政公司招領揭示之\n。\n經過相當時期，無人領取時，得由中華郵政公司處分之\n。"},{"l":0,"y":110,"a":"C","c":0.97,"s":"郵件所載收件人有 2 人以上者，應如何處理？","o":{"A":"須問寄件人意見","B":"須問所有收件人意見","C":"得向其中任何 1 人投遞之","D":"不得收受遞送"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.84,"s":"依郵政法規定，郵件之收件地址係地面層以外樓層之郵件投遞方式，下列敘述何者錯誤？","o":{"A":"地面層設有管理服務人員或郵件收發處者，各類郵件得交管理服務人員或郵件收發處收 領","B":"地面層未設有管理服務人員或郵件收發處而僅設置受信設備者、對講機或電鈴者，平常 郵件投入受信設備","C":"地面層未設有管理服務人員或郵件收發處而僅設置受信設備者、對講機或電鈴者，掛號 郵件繕發招領通知單請收件人至鄰近郵局領取","D":"地面層未設有管理服務人員或郵件收發處而僅設置受信設備者、對講機或電鈴者，欠資 郵件請收件人至地面層補付欠資後投遞"},"k":"模擬","p":0,"d":"郵政法 第 24 條\n收件地址係地面層以外樓層之郵件，依下列方式投遞：\n一、地面層設有管理服務人員或郵件收發處者，各類郵件得交管理服務人員或郵件收發處收領。\n二、無法依前款規定投遞、地面層未設有管理服務人員或郵件收發處而僅設置受信設備、對講機或電鈴者，平常郵件投入受信設備，掛號郵件及欠資郵件，請收件人至地面層領取或補付欠資。\n掛號郵件及欠資郵件無法依前項規定投遞者，依第四十八條所訂之規則有關投遞規定辦理。\nㅤㅤ\nㅤㅤ\n何者錯誤：\n(A) 地面層\n設有\n管理服務人員或郵件收發處者，各類郵件得交\n管理服務人員\n或\n郵件收發處\n收領\n(O)\n(B) 地面層\n未設\n有管理服務人員或郵件收發處而僅設置受信設備者、對講機或電鈴者，平常 郵件\n投入受信設備\n(O)\n(C) 地面層未設有管理服務人員或郵件收發處而僅設置受信設備者、對講機或電鈴者，掛號 郵件繕發招領通知單請收件人至鄰近郵局領取\n(D) 地面"},{"l":0,"y":110,"a":"D","c":0.93,"s":"依郵政法規定，中華郵政公司請長途客運公司輔助載運郵件，其載運費用如何決定？","o":{"A":"由行政院訂之","B":"由交通部訂之","C":"由中華郵政公司訂定公告之","D":"由中華郵政公司與運送業者商訂之"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.77,"s":"依郵政法規定，下列何者正確？","o":{"A":"郵政服務人員遞送郵件經過渡口有免費優先通行權","B":"郵政稽核人員查核郵件經過海關有優先通行權","C":"郵政服務人員遞送郵政公用物經過道路有優先通行權","D":"郵政行銷人員推展業務經過橋樑有免費優先通行權"},"k":"模擬","p":0,"d":"ㅤㅤ\n郵政法 第27條 \n郵政服務人員為遞送郵件或郵政公用物，經過道路、橋樑、海關、渡口等交通線路時，有優先通行權。\nㅤㅤ\n(A) 郵政服務人員\n遞送 \n郵件\n經過\n渡口\n有\n免費\n優先通行權（沒有免費）\n(B) 郵政稽核人員\n查核\n郵件\n經過\n海關\n有優先通行權（沒有查核）\n(C) 郵政服務人員\n遞送 \n郵政公用物\n經過\n道路\n有優先通行權\n(O)\n(D) 郵政行銷人員\n推展業務\n經過\n橋樑 \n有\n免費\n優先通行權（沒有拓展業務跟免費）"},{"l":0,"y":110,"a":"B","c":0.85,"s":"依郵政法規定，交通部得派員會同下列何機關派員攜帶證明文件，進入 違反郵政法 之場所實施檢查？","o":{"A":"司法機關","B":"警察機關","C":"司法警察機關","D":"檢察機關"},"k":"模擬","p":0,"d":"郵政法 第二十八條\n主管機關得派員或會同警察機關派員攜帶證明文件，進入違反本法之場所實施檢查，並要求提供相關資料，該場所之所有人、負責人、居住人、看守人、使用人或可為其代表之人，不得規避、妨礙或拒絕。"},{"l":0,"y":110,"a":"A","c":0.84,"s":"依郵政法規定，下列何種郵件發生部分遺失或被竊時，不得向中華郵政公司請求補償？","o":{"A":"掛號函件","B":"包裹郵件","C":"快捷郵件","D":"報值郵件"},"k":"模擬","p":0,"d":"掛號 全失竊才有"},{"l":0,"y":110,"a":"A","c":0.66,"s":"依郵政法規定，下列何者不得向中華郵政公司請求補償？","o":{"A":"掛號郵件全部毀損","B":"包裹郵件一部被竊","C":"快捷郵件全部遺失","D":"保價郵件因颱風一部毀損"},"k":"模擬","p":0,"d":"郵政法第29條\n郵件有下列情形之一者，寄件人得向中華郵政公司請求補償：\n一、包裹郵件、快捷郵件、報值郵件、保價郵件全部或一部遺失、被竊或毀損。\n二、前款以外之其他\n各類掛號郵件全部遺失或被竊\n。\n三、限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致。\n四、掛號郵件未依中華郵政公司公告之處理規定遞送。"},{"l":0,"y":110,"a":"D","c":0.89,"s":"依郵政法規定，COVID-19（武漢肺炎）防疫期間政府公告禁止口罩郵寄出口，民眾倘因所 交寄之國際包裹或國際快捷郵件遭海關查獲夾寄口罩而沒入郵件者，下列敘述何者正確？","o":{"A":"得向中華郵政公司請求補償，但郵資不退還","B":"得向中華郵政公司請求補償，並返還未利用郵資","C":"不得向中華郵政公司請求任何補償，但可請求返還未利用郵資","D":"不得向中華郵政公司請求任何補償，郵資亦不退還"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"D","c":0.88,"s":"依郵政法規定，郵件遞交收件人時，不得以毀損論之認定標準，不包括 下列何者？","o":{"A":"封面無破裂痕跡","B":"重量未減少","C":"重量雖減少，其原因由於該物件之性質","D":"郵件準時送達"},"k":"模擬","p":0,"d":"《郵政法》第32條規定了在郵件毀損或損失時，不得要求補償的情況。 \n其內容包括，若郵件遞交收件人或退回寄件人時，封面沒有破裂痕跡且重量未減少，則不得以毀損論；若重量雖有減少但原因是物品本身的性質，也同樣不得以毀損論。 \n另外，若郵件因時間、市價變動等因素而導致其價值減損，也不得因此而主張是損失。\nㅤㅤ\n毀損的判斷標準\n郵件封面無破裂痕跡且重量未減輕。\n重量雖然減輕，但原因是物品本身的性質（例如，生鮮食品因腐爛而減輕重量）。\n損失的判斷標準\n因時間經過或市價波動導致郵件價值減損（例如，報價變動的股票或證券）。"},{"l":0,"y":110,"a":"D","c":0.83,"s":"依郵件遺失、被竊或毀損，寄件人或收件人之補償請求權，自郵件交寄之日起，逾多久不 行使而消滅？","o":{"A":"一年","B":"三個月","C":"一個月","D":"六個月"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.8,"s":"郵政法規定，郵件補償金請求權，自受領補償人收到通知之日起，逾________幾年間不行 使而消滅？","o":{"A":"1 年","B":"3 年","C":"5 年","D":"15 年"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"B","c":0.77,"s":"意圖供行使之用，而偽造郵資已付符誌者，應處如何之徒刑？","o":{"A":"三月以上三年以下有期徒刑","B":"六月以上五年以下有期徒刑","C":"一年以上五年以下有期徒刑","D":"三年以上七年以下有期徒刑"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"C","c":0.74,"s":"意圖供重複行使之用，在郵票上塗膠類或其他化合物者，處刑責或罰金多少？","o":{"A":"1 年以下有期徒刑、拘役或新臺幣 9 萬元以下罰金","B":"3 年以下有期徒刑、拘役或新臺幣 9 萬元以下罰金","C":"1 年以下有期徒刑、拘役或新臺幣 9 千元以下罰金","D":"3 年以下有期徒刑、拘役或新臺幣 9 千元以下罰金"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"D","c":0.89,"s":"郵政法關於郵政服務人員之規定，下列敘述何者錯誤？","o":{"A":"指服務於中華郵政公司之人員","B":"犯郵政法第三十六條關於表示郵資已付符誌之罪者，加重其刑至二分之一","C":"犯刑法第二百零二條或第二百零四條關於郵票之罪者，加重其刑至二分之一","D":"郵政法第三十七條郵政服務人員加重刑罰之規定，對於依郵政法第二十六條規定負輔助 載運郵件責任者之服務人員不適用之"},"k":"模擬","p":0,"d":"郵政法第44條 第三十七條及刑法第一百三十三條之規定，於依第二十六條規定負輔助載運郵件責任者之服務人員，適用之。\n7\n0\n相關試題\n 23.郵政法關於郵政服務人員之規定，下列敘述何者錯誤？\r (A)指服務於中華郵政公司之人員\r (B)犯郵政法第三十六條關於表示郵資已付符誌之罪者，加重其刑至二分之一\r (C)犯刑法第二百零二條或第二百零四條關於郵票之罪者，加重其刑至二分之一\r (D)郵政法第三十七條郵政服務人員加重刑罰之規定，對於依郵政法第二十六條規定負輔助載運郵件責任者\r 之服務人員不適用之\r \n #1767223\n 42.郵政法關於郵政服務人員之規定，下列敘述何者錯誤？\r (A) 指服務於中華郵政公司之人員\r (B) 犯郵政法第三十六條關於表示郵資已付符誌之罪者，加重其刑至二分之一\r (C) 犯刑法第二百零二條或第二百零四條關於郵票之罪者，加重其刑至二分之一\r (D) 郵政法第三十七條郵"},{"l":0,"y":110,"a":"A","c":0.79,"s":"無故開拆或隱匿他人之郵件或以其他方法窺視其內容者，依郵政法規定，其罰則為何？","o":{"A":"處新臺幣九萬元以下罰金","B":"處新臺幣九萬元以下罰鍰","C":"處六月以下有期徒刑","D":"處九月以下有期徒刑"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"A","c":0.92,"s":"誤收他人之郵件，故意不返還者，處多少罰鍰？","o":{"A":"新臺幣 2,000 元以上 10,000 元以下","B":"新臺幣 3,000 元以上 20,000 元以下","C":"新臺幣 4,000 元以上 30,000 元以下","D":"新臺幣 5,000 元以上 40,000 元以下"},"k":"模擬","p":0,"d":"第 39 條\n誤收他人之郵件，故意不返還者，處\n新臺幣二千元以上一萬元以下罰鍰\n。"},{"l":0,"y":110,"a":"D","c":0.82,"s":"依郵政法規定，除中華郵政公司及受其委託者外，任何人不得以遞送郵政專營之文件為營 業。違反者將處多少罰鍰，並通知其停止該等行為；未停止者，得按次處罰？","o":{"A":"新臺幣 10 萬元以上 50 萬元以下罰鍰","B":"新臺幣 10 萬元以上 100 萬元以下罰鍰","C":"新臺幣 20 萬元以上 50 萬元以下罰鍰","D":"新臺幣 20 萬元以上 100 萬元以下罰鍰"},"k":"模擬","p":0,"d":""},{"l":0,"y":110,"a":"D","c":0.91,"s":"關於違法使用與郵局、郵政（含中文及外文）相同之文字、圖形、記號或其聯合式，表彰 其營業名稱、服務或產品者，下列何處罰正確？","o":{"A":"處新臺幣 2 萬元以上 10 萬元以下罰鍰，並強制其停止營業","B":"處新臺幣 2 萬元以上 10 萬元以下罰鍰，並責令賠償中華郵政公司損失","C":"處新臺幣 10 萬元以上 50 萬元以下罰鍰，並通知其停止該等行為","D":"處新臺幣 2 萬元以上 10 萬元以下罰鍰，並令其限期改善，屆期不改善，得按次連續處罰"},"k":"模擬","p":0,"d":"郵政法第47條：違反第七條規定者，處新臺幣\n二萬元以上十萬元\n以下\n罰鍰\n，並令其\n限期改善\n；屆期不改善者，\n得按次\n連續處罰。\n郵政法第7條：除\n中華郵政公司\n或\n經其同意者外\n，\n任何人\n不得使用與郵政、郵局（含中文及外文）相同之文字、圖形、記號或其聯合式，表彰其營業名稱、服務或產品。"},{"l":0,"y":110,"a":"C","c":0.82,"s":"依郵政法規定，一般公司、行號發行、製作與郵票類似，且具有交付郵資證明之票證者， 其罰則為何？","o":{"A":"處拘役或新臺幣九萬元以下罰金","B":"處新臺幣二千元以上一萬元以下罰鍰","C":"處新臺幣二萬元以上十萬元以下罰鍰，得按次連續處罰","D":"處新臺幣十萬元以上五十萬元以下罰鍰，得按次連續處罰"},"k":"模擬","p":0,"d":"郵政法第42條：違反第十五條規定者，處新臺幣\n二萬元以上十萬元\n以下\n罰鍰\n，並\n得按次\n連續處罰。\n郵政法第15條：除\n中華郵政公司\n外，\n任何人\n不得\n發行\n、\n製作\n與\n郵票\n類似，且具有\n交付郵資證明之票證\n。"},{"l":0,"y":110,"a":"A","c":0.77,"s":"26依郵政法規定，違反郵政法第二十八條規定，規避、妨礙、拒絕檢查或提供資料者，罰則 為何？","o":{"A":"得處新臺幣二萬元以上十萬元以下罰鍰","B":"得處新臺幣二萬元以上十萬元以下罰金","C":"得處拘役","D":"得處新臺幣九萬元以下罰金"},"k":"模擬","p":0,"d":"第四十三條\n違反第二十八條規定，規避、妨礙、拒絕檢查或提供資料者，處新臺幣二萬元以上十萬元以下罰鍰，並得按次連續處罰。"},{"l":0,"y":110,"a":"B","c":0.79,"s":"27凡以運送為業之鐵路、長途汽車、船舶、航空器，均有輔助載運郵件及其處理人員之責。 無正當事由拒絕載運郵件或故意延誤載運郵件者應受何種處罰？","o":{"A":"拘役","B":"罰鍰","C":"易科罰金","D":"依所訂契約處罰"},"k":"模擬","p":0,"d":"第四十五條\n依第二十六條第一項規定負輔助載運郵件責任者，有下列情事之一時，處新臺幣二萬元以上十萬元以下罰鍰：\n一、 無正當事由拒絕載運郵件。\n二、 故意延誤載運郵件。"},{"l":0,"y":110,"a":"C","c":0.87,"s":"28廠商販售印有「行動郵局」字樣之造型瓶裝礦泉水，依郵政法規定，下列敘述何者正確？","o":{"A":"須事先獲得中華郵政公司同意，否則處以 10 萬至 50 萬罰鍰","B":"須事先獲交通部同意，否則處以 10 萬至 50 萬罰鍰","C":"須事先獲得中華郵政公司同意，否則處以 2 到 10 萬元罰鍰","D":"事後向交通部報備即可"},"k":"模擬","p":0,"d":"第四十一條\n違反第七條規定者，處新臺幣二萬元以上十萬元以下罰鍰，並令其限期改善；屆期不改善者，得按次連續處罰。"},{"l":0,"y":110,"a":"A","c":0.96,"s":"29違反郵政法第 28 條規定，規避、妨礙、拒絕檢查或提供資料者，處罰鍰外並得依下列何種 方式連續處罰？","o":{"A":"按次","B":"按日","C":"按月","D":"按季"},"k":"模擬","p":0,"d":"四十三條\n違反第二十八條規定，規避、妨礙、拒絕檢查或提供資料者，處新臺幣二萬元以上十萬元以下罰鍰，並得按次連續處罰。\n第二十八條\n主管機關得派員或會同警察機關派員攜帶證明文件，進入違反本法之場所實施檢查，並要求提供相關資料，該場所之所有人、負責人、居住人、看守人、使用人或可為其代表之人，不得規避、妨礙或拒絕。\n4\n0\n相關試題\n 41.違反郵政法第28條規定，規避、妨礙、拒絕檢查或提供資料者，處罰鍰外並得依下列何種方式連續處罰？\r (A)按次\r (B)按日\r (C)按月\r (D)按季\n #245802\n 30. 郵政法第 48 條中有關禁寄物品之種類與其處分方法及其他相  (C) (D)\n。"},{"l":0,"y":111,"a":"C","c":1.0,"s":"依郵政法規定，有關郵件種類、資費之交付、補償金額等事項之規則，下列敘述何者正確？","o":{"A":"由中華郵政公司自行訂定","B":"由中華郵政公司擬訂","C":"由行政院核定","D":"由立法院制定"},"k":"內勤","p":1,"d":"第 48 條\n郵件種類\n、定義、處理程序、交寄、\n資費之交付\n、載運、投遞與查詢\n補償確定之程序、金額與其方法\n、禁寄物品之種類與其處分方法、受委託遞送郵件者之資格條件、委託程序與責任及其他相關事項之規則，\n由\n主管機關擬訂，報請行政院核定\n之。\n100\n5"},{"l":0,"y":111,"a":"D","c":1.0,"s":"依郵政法規定，下列敘述何者正確？","o":{"A":"明信片之郵件種類屬於印刷物","B":"郵政認知證及國際回信郵票券，均為有價證券","C":"遞送普及服務之服務標準，由行政院以命令定之","D":"印刷物之資費，由中華郵政公司訂定"},"k":"內勤","p":1,"d":"(A)明信片\n不屬於\n印刷物 (印刷物:新聞紙、雜誌、型錄、書籍)\n(B)僅國際回信郵票券，為有價證券。\n郵政認知券：用以證明持證本人之證件。\n(C)遞送普及服務之服務標準，由\n主管機關(交通部)\n定之"},{"l":0,"y":111,"a":"D","c":1.0,"s":"依郵政法第六條規定，有關中華郵政公司專營權之文件範圍，下列敘述何者正確？","o":{"A":"包括明信片、郵簡、印刷物","B":"包括法務部於國內寄交美國財政部之國際航空信函","C":"包括教育部交寄之盲人文件","D":"包括政府機關交寄之國內信函，其單件重量大於 500 公克者"},"k":"內勤","p":1,"d":"《郵政法》第 6 條完整條文\n除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業。但國內、外互寄之跨境文件，不在此限：\n一、明信片。\n [\n1\n]\n二、郵簡。\n [\n1\n]\n三、信函：\n（一）各級政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄。 \n政府機關不受限500G D選項\n（二）前目以外之人所交寄，且單件重量五百公克以下或單件資費不逾十三倍基礎郵資（目前為新臺幣 104 元）。\n [\n1\n, \n2\n]\nㅤㅤ"},{"l":0,"y":111,"a":"C","c":1.0,"s":"依郵政法規定，有關郵件補償，下列敘述何者錯誤？","o":{"A":"包裹郵件或保價郵件一部遺失，經收件人無異議接受者，不得請求補償","B":"保價郵件內裝禁寄物品，全部遺失，不得請求補償","C":"保價郵件因戰事致損失，應予補償","D":"報值郵件因颱風致損失，不得請求補償"},"k":"內勤","p":1,"d":"包裹 快捷 報值 保價 \n全部/一部\n遺失 被竊 毀損\n上述郵件以外之\n掛號\n郵件 \n全部 遺失 被竊\n (\n沒有毀損\n)\n限時 快捷遞送延誤\n保價\n天災\n致損得請求補償 戰時不得請求補償"},{"l":0,"y":111,"a":"C","c":1.0,"s":"郵政法賦予中華郵政公司之權利與義務，下列敘述何者錯誤？","o":{"A":"負有提供遞送普及服務之義務","B":"郵件、郵政資產、郵政款項及郵政公用物，非依法律，不得作為檢查、徵收或扣押之標的","C":"各種郵政公用物，皆免納一切稅捐","D":"郵件在航運發生海難時，不分擔共同海損"},"k":"內勤","p":1,"d":"43.郵政法賦予中華郵政公司之權利與義務，下列敘述何者錯誤？\n(A) 負有提供遞送普及服務之義務→\n第 5-1 條\n(B) 郵件、郵政資產、郵政款項及郵政公用物，非依法律，不得作為檢查、徵收或扣押之標的→\n第 8 條\n(C) 各種郵政公用物，皆免納一切稅捐\n→\n第 9 條\n 中華郵政公司經營之\n遞送郵件業務及供該項業務使用之郵政公用物、業務單據\n，免納一切稅捐。\n(D) 郵件在航運發生海難時，不分擔共同海損→\n第 9 條"},{"l":0,"y":111,"a":"C","c":1.0,"s":"依郵政法規定，有關郵票之廢止，下列敘述何者正確﹖","o":{"A":"須報經行政院核定","B":"應於三個月前公告，並停止該郵票售賣","C":"持有廢止之郵票者，自廢止之日起六個月內，得換取新票","D":"持有廢止之郵票者，得向中華郵政公司換取同等面額之現金"},"k":"內勤","p":1,"d":""},{"l":0,"y":111,"a":"D","c":1.0,"s":"依郵政法第六條規定，有關中華郵政公司專營權之文件範圍，下列敘述何者正確 ﹖","o":{"A":"包括明信片、郵簡、印刷物","B":"包括法務部於國內寄交美國財政部之國際航空信函","C":"包括教育部交寄之盲人文件","D":"包括政府機關交寄之國內信函，其單件重量大於 500 公克者"},"k":"內勤","p":1,"d":""},{"l":0,"y":111,"a":"C","c":1.0,"s":"依郵政法規定，有關郵件補償，下列敘述何者錯誤﹖","o":{"A":"包裹郵件或保價郵件一部遺失，經收件人無異議接受者，不得請求補償","B":"保價郵件內裝禁寄物品，全部遺失，不得請求補償","C":"保價郵件因戰事致損失，應予補償","D":"報值郵件因颱風致損失，不得請求補償"},"k":"內勤","p":1,"d":"郵政法31條"},{"l":0,"y":111,"a":"D","c":1.0,"s":"某日甲地法院工讀生至乙郵局欲以便利箱 （包裹）交寄一大箱文件，收件人為丙地法院， 乙郵局窗 口服務人員請甲工讀生自行開拆郵件檢查。 請問乙郵局人員係依據郵政法之何規定而為郵件之檢查？ A. 經寄件人或收件人同意開拆者 B.懷疑內裝物為郵政禁寄物品 C.不適用優惠資費 D.違反郵政法規規 定","o":{"A":"ABCD","B":"僅 ABC","C":"僅 ABD","D":"僅 ACD"},"k":"外勤","p":1,"d":"真是陷阱題....\n B.懷疑內裝物為郵政禁寄物品×\n有事實證明\n內裝為郵政禁寄物品\n107\n1"},{"l":0,"y":111,"a":"D","c":1.0,"s":"郵政法有關「特製郵簡」之定義特徵，下列哪些正確？ A.以整張紙適當摺疊粘貼 B.依中華郵政 公司公告之紙張尺寸 、 規格製作 C.加封套交寄之文件 D.封面印有郵票符誌 ， 由中華郵政公司發行者 E. 須加印中華郵政公司許可字號","o":{"A":"ABCDE","B":"僅 ABCE","C":"僅 ABCD","D":"僅 ABDE"},"k":"外勤","p":1,"d":"參郵政法第4條第四款\n本法用詞，定義如下：\n四、郵簡：指\n以整張紙適當摺疊粘貼\n，並\n依中華郵政公司公告之紙張尺寸、規格\n，\n加印許可文字\n之不加封套交寄之文件。\n郵簡封面印有郵票符誌，由中華郵政公司發行者\n，\n為特製郵簡\n。"},{"l":0,"y":111,"a":"C","c":1.0,"s":"依郵政法規定，有關郵票之廢止及發行規定，下列敘述何者錯誤？","o":{"A":"由中華郵政公司報請主管機關核定後廢止之","B":"廢止郵票應於一個月前公告，並停止該郵票售賣","C":"持有廢止之郵票者，自廢止之日起一年內，得向中華郵政公司換取新票","D":"發行新郵票應由中華郵政公司擬訂式樣、圖案及價格，報請主管機關層轉行政院核定後發行"},"k":"外勤","p":1,"d":"郵政法 第16條\n郵票、含有郵票符誌之明信片或特製郵簡，由中華郵政公司擬訂式樣、圖案及價格，報請主管機關層轉行政院核定後發行。\n郵政法 第17條\n中華郵政公司於報請主管機關核定後，將其發行之郵票廢止之，\n但\n應於一個月前公告，並停止該郵票售賣。\n持有前項廢止之郵票者，\n自廢止之日起六個月內，得向中華郵政公司換取新票。"},{"l":0,"y":111,"a":"D","c":1.0,"s":"依郵政法規定，郵件之補償金確定後，應通知受領補償人。受領補償人收到通知之日起，補償金請 求權逾多久不行使即消滅？","o":{"A":"三個月","B":"六個月","C":"二年","D":"五年"},"k":"外勤","p":1,"d":"郵政法 第35條\n補償金確定後，應通知受領補償人。\n補償金請求權，自受領補償人收到通知之日起，逾5年間不行使而消滅。"},{"l":0,"y":111,"a":"B","c":1.0,"s":"依郵政法規定，郵件資費之定價參考為何？ A.應適當反映成本 B.視政府預算補貼多寡 C.應有 合理利潤 D.應隨物價指數彈性調整","o":{"A":"ABCD","B":"僅 AC","C":"僅 ABC","D":"僅 ACD"},"k":"外勤","p":1,"d":"郵件之資費應\n適當反映成本\n及\n合理利潤\n。\n29\n1"},{"l":0,"y":111,"a":"B","c":1.0,"s":"中華郵政公司肩負遞送普及服務責任，惟依郵政法第 9 條，該公司之「免稅」範圍，下列敘述何者 正確？ A.中華郵政公司經營之遞送郵件業務 B.郵儲壽各項業務單據 C.供遞送郵件業務使用之郵政 公用物","o":{"A":"ABC","B":"僅 AC","C":"僅 BC","D":"僅 AB"},"k":"外勤","p":1,"d":"看到遞送就是免稅"},{"l":0,"y":111,"a":"A","c":1.0,"s":"依郵政法規定，寄件人得向中華郵政公司請求郵件補償之情形，下列何者錯誤？","o":{"A":"普通掛號信函全部毀損","B":"快捷郵件毀損，內裝物部份遺失","C":"掛號郵件誤當作平常郵件，逕投入收件人信箱","D":"限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失"},"k":"外勤","p":1,"d":"郵政法\n修正日期：民國 112 年 06 月 28 日\n第 29 條\n郵件有下列情形之一者，寄件人得向中華郵政公司請求補償：\n一、包裹郵件、快捷郵件、報值郵件、保價郵件全部或一部遺失、被竊或毀損。\n二、前款以外之其他\n各類掛號\n郵件\n全部遺失\n或\n被竊\n。\n三、限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致。\n四、掛號郵件未依中華郵政公司公告之處理規定遞送。\n前項求償權，有下列情形之一者，得由收件人行使：\n一、收件人提出證據，證明已由寄件人授與求償權。\n二、郵件一部毀損或被竊，收件人收受其餘部分並聲明保留求償權。\n寄件人或收件人除依前二項規定請求補償外，不得依其他法律向中華郵政公司請求賠償。"},{"l":0,"y":111,"a":"B","c":1.0,"s":"依郵政法規定，何項資費之調整非由中華郵政公司自行訂定？","o":{"A":"國際信函","B":"國內郵簡","C":"包裹","D":"國內新聞紙、雜誌"},"k":"外勤","p":1,"d":"郵政法 \n修正日期：民國 112 年 06 月 28 日\n第 14 條\n第六條\n第一項限由中華郵政公司或受其委託者遞送文件之資費，由中華郵政公司擬訂，報請主管機關核定後實施。\n前項以外\n郵件之資費，由\n中華郵政\n公司\n自行訂定\n。\n郵件之資費應適當反映成本及合理利潤。\n第 6 條\n除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業。但國內、外互寄之跨境文件，不在此限：\n一、明信片。\n二、郵簡。\n三、信函：\n（一）各級政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄。\n（二）前目以外之人所交寄，且單件重量五百公克以下或單件資費不逾十三倍基礎郵資。\n運送業者，除附送與貨物有關之通知外，不得為前項文件之遞送。"},{"l":0,"y":111,"a":"D","c":1.0,"s":"依郵政法規定，郵件無法投遞時，應如何處置？","o":{"A":"依寄件人之指示辦理","B":"逕由中華郵政公司招領揭示","C":"逕由中華郵政公司處分之","D":"退還寄件人"},"k":"外勤","p":1,"d":"郵政法 \n修正日期：民國 112 年 06 月 28 日\n第 22 條\n各類郵件，應按其表面所書收件人之地址投遞之。但依第二十四條或依第四十八條所訂之規則有關改投、改寄或不按址投遞情形，不在此限。\n郵件無法投遞，應退還寄件人。\n無法退還，由中華郵政公司招領揭示之。經過相當時期，無人領取時，得由中華郵政公司處分之。"},{"l":0,"y":111,"a":"A","c":1.0,"s":"某甲於 8 月 5 日向 A 郵局交寄國際保價快捷郵件 1 件至烏克蘭 ， 郵資2,920 元 、 保價金額新臺幣8,000 元，8 月 15 日接獲 A 郵局通知該郵件因戰爭而部分毀損，請問某甲依郵政法得向郵局請求之補償金額為 多少？","o":{"A":"0 元","B":"新臺幣 10,920 元","C":"新臺幣 2,920 元","D":"新臺幣 8,000 元"},"k":"外勤","p":1,"d":"戰事全部不賠"},{"l":0,"y":111,"a":"B","c":1.0,"s":"依郵政法規定，有關遞送普及服務，下列敘述何者錯誤？","o":{"A":"中華郵政公司非依法規，不得拒絕遞送郵政法第五條之一第二項各款之郵件","B":"應服務之範圍含國內及國外","C":"因不可抗力情事致執行顯有困難，得停辦遞送普及服務","D":"遞送郵件之種類含指定之文件或物品"},"k":"外勤","p":1,"d":"郵政法  第 5-1 條\n1-為保障國民基本通信權益，主管機關應確保提供國內之遞送普及服務。\n2-前項所稱之遞送普及服務，指於國內就下列各款，永久提供品質良好、價格允當之基本遞送服務：\n一、單件不逾二公斤之函件。\n二、單件不逾二十公斤及長寬高合計不逾一百五十公分之包裹。\n三、其他經主管機關指定之文件或物品。\n3-中華郵政公司應提供前項普及服務。但因天災、事變或其他不可抗力情事致執行顯有困難，該公司得公告限制或停辦前項郵件之遞送服務。\n4-遞送普及服務之服務標準，由主管機關定之"},{"l":0,"y":111,"a":"C","c":1.0,"s":"某運送業者（A 公司）未受中華郵政公司委託，以遞送明信片為營業，依郵政法規定，下列敘述何者 正確？","o":{"A":"主管機關得派員會同郵局人員至其場所實施檢查","B":"A 公司如拒絕主管機關之檢查，處新臺幣 15 萬元罰金","C":"對違法遞送文件之 A 公司，處新臺幣 20 萬元以上 100 萬元以下罰鍰，並通知其停止該行為","D":"中華郵政公司得扣押該違法遞送之文件"},"k":"外勤","p":1,"d":"(A) 主管機關得派員會同\n郵局人員\n至其場所實施檢查(警察機關)\n(B) A 公司如拒絕主管機關之檢查，處新臺幣\n 15 萬元罰金\n(2-10萬罰鍰)\n(C) 對違法遞送文件之 A 公司，處新臺幣 20 萬元以上 100 萬元以下罰鍰，並通知其停止該行為\n(D) \n中華郵政公司\n得扣押該違法遞送之文件(中華郵政公司不是行政或執法機關，無權扣押或處罰他人)"},{"l":0,"y":111,"a":"D","c":1.0,"s":"中華郵政公司經下列何者之核定，方得投資或經營郵政法第五條第一款至第六所定業務之相關業務？","o":{"A":"經濟部商業司","B":"財政部","C":"金融監督管理委員會","D":"交通部"},"k":"外勤","p":1,"d":"郵政法 \n修正日期：民國 112 年 06 月 28 日\n第 5 條\n中華郵政公司，得經營下列業務：\n一、遞送郵件。\n二、儲金。\n三、匯兌。\n四、簡易人壽保險。\n五、集郵及其相關商品。\n六、郵政資產之營運。\n七、經\n交通部\n核定，得接受委託辦理其他業務及投資或經營第一款至第六款相關業務。"},{"l":0,"y":111,"a":"B","c":1.0,"s":"依郵政法規定，有關中華郵政公司或其服務人員之保守秘密義務，下列敘述何者正確？","o":{"A":"該服務人員包括受中華郵政公司委託者所僱用之人","B":"指因職務而知悉之他人秘密","C":"服務人員離職後即無保密義務","D":"服務人員離職滿 7 年後即無保密義務"},"k":"外勤","p":1,"d":"郵政法 \n修正日期：民國 112 年 06 月 28 日\n第 11 條\n中華郵政公司或其服務人員\n因職務知悉他人秘密者\n，有保守秘密之義務；其服務人員離職者，亦同。"},{"l":0,"y":111,"a":"B","c":0.94,"s":"2 依郵政法規定，下列敘述何者正確？","o":{"A":"中華郵政公司或其服務人員遇有事實足以認定內裝之物不適用優惠資費，得不經寄件人或收件人同意開 拆查驗郵件","B":"郵件依規定開拆查驗後，應予驗訖證明","C":"關於各類郵件或其事務，國際郵政公約或協定有規定者，依其規定。但其規定與本法牴觸者，國際郵件 事務應適用本法之規定","D":"中華郵政公司或其服務人員因職務知悉他人秘密者，有保守秘密之義務；其服務人員離職者，即無此義務"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"D","c":0.93,"s":"3 依郵政法第 6 條，除中華郵政公司及受其委託者外，任何人不得以遞送文件為營業（國內、外互寄之跨境 文件不在此限），但不包括下列何者？","o":{"A":"明信片、郵簡","B":"各級政府機關、公立學校、公營事業機構或軍事單位所交寄之信函","C":"單件重量 500 克以下或單件資費不逾 13 倍基礎郵資之信函","D":"附送與貨物有關之通知"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"D","c":0.82,"s":"4 郵政法第 4 條有關用詞定義，下列何者錯誤？","o":{"A":"函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱","B":"印刷物：指新聞紙、雜誌、書籍、型錄等印刷文件","C":"基礎郵資：指經主管機關核定實施之信函第一級距重量資費","D":"遞送：指文件或物品之收寄及投遞"},"k":"升資","p":0,"d":"遞送：指文件或物品之收寄、封發、運輸、投遞。\n（收封運投）\n4\n0\n相關試題\n 5 依郵政法規定，遞送普及服務之服務標準，由下列何者定之？\r 以下罰金","B":"某甲應依郵政法處 3 年以下有期徒刑，得併科新臺幣 3 萬元以下罰金","C":"某甲應依郵政法處 1 年以下有期徒刑、拘役或新臺幣 9 千元以下罰金","D":"某甲應加重其刑至二分之一"},"k":"升資","p":0,"d":"基本處刑之法律適用錯誤（選項 A、B、C 錯誤）\n某甲偽造的是「郵票」，在法律客體上，偽造實體郵票屬於《中華民國刑法》第 202 條第 1 項之罪（處 6 月以上 5 年以下有期徒刑，得併科 1,000 元以下罰金）。\n《郵政法》第 36 條第 1 項規定的客體則是「郵政認知證、國際回信郵票券或其他表示郵資已付符誌」，兩者的構成要件及適用法規並不相同。因此選項中敘述「依郵政法處……」在主刑適用法條的論述上是錯誤的。\n [\n1\n, \n2\n, \n3\n, \n4\n]\n職務身分之特別加重（選項 D 正確）\n依據《郵政法》第 37 條明文規定：「\n郵政服務人員\n犯前條之罪或\n刑法第二百零二條\n或第二百零四條\n關於郵票之罪者，加重其刑至二分之一。\n」\n某甲為「郵政現職員工」，身分屬於郵政服務人員，其私自偽造郵票的行為已觸犯上述法條，故依法必須「加重其刑至二分之一」。\n [\n1\n, \n2\n, \n3\n]\n❌"},{"l":0,"y":111,"a":"B","c":0.89,"s":"4 在郵政法規定中，下列何者必須由中華郵政公司擬訂，報請主管機關轉行政院核定？","o":{"A":"信函資費核定權","B":"有郵票符誌之明信片圖案核定權","C":"快捷郵件資費核定權","D":"郵票廢止核定權"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"B","c":0.86,"s":"5 今有一民眾誤收他人郵件，故意不返還，依郵政法應予查處，其罰則為何？","o":{"A":"處拘役或新臺幣 9 萬元以下罰金","B":"處新臺幣 2 千元以上 1 萬元以下罰鍰","C":"處拘役或新臺幣 2 萬元以上 10 萬元以下罰金","D":"處新臺幣 2 萬元以上 10 萬元以下罰鍰"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"A","c":0.9,"s":"6 今有一經營物件快遞之民營公司，擅自定名為「超速民營郵局」 ，依郵政法規定，該公司應受下列何項 處罰？","o":{"A":"處新臺幣 2 萬元以上 10 萬元以下罰鍰，並令其限期改善；屆期不改善者，得按次連續處罰","B":"處新臺幣 10 萬元以上 50 萬元以下罰鍰，並令其限期改善；屆期不改善者，得按次連續處罰","C":"處新臺幣 2 萬元以上 10 萬元以下罰鍰，並強制其立即停止營業","D":"處新臺幣 10 萬元以上 50 萬元以下罰鍰，並強制其立即停止營業"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"B","c":0.89,"s":"8 依郵政法規定，無故開拆或隱匿他人之郵件或以其他方法窺視其內容者，其罰則為何？","o":{"A":"處拘役或新臺幣 9 萬元以下罰鍰","B":"處拘役或新臺幣 9 萬元以下罰金","C":"處 2 萬元以上 10 萬元以下罰鍰","D":"處 2 萬元以上 10 萬元以下罰金"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"B","c":0.97,"s":"9 依郵政法之規定，有關遞送普及服務之事項，下列何者錯誤？","o":{"A":"提供遞送普及服務之函件，為單件不逾 2 公斤者","B":"中華郵政公司應提供遞送普及服務，不論天災、事變或其他不可抗力情事均應執行","C":"遞送普及服務之服務標準，由主管機關定之","D":"規範遞送普及服務事項，係為保障國民基本通信權益"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"D","c":0.84,"s":"11 依郵政法第 6 條之規定，除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業？","o":{"A":"國立臺灣大學交寄至收件人為美國哈佛大學之 1 件 450 公克之信函","B":"小花於臺北交寄之明信片，收件人為在日本大阪的姊姊","C":"淡江大學交寄，收件人為我國教育部之單件 680 公克信函","D":"屏東市政府交寄給在臺北花先生之郵簡"},"k":"升資","p":0,"d":"根據中華民國\n郵政法第 6 條\n規定，除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業。但\n國內、外互寄之跨境文件，不在此限\n： [\n1\n]\n明信片\n。\n [\n1\n]\n郵簡\n。\n [\n1\n]\n信函\n：\n各級政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄。\n前目以外之人（如一般私人、私立學校）所交寄，且\n單件重量 500 公克以下\n或單件資費不逾 13 倍基礎郵資。\n [\n1\n]\n0\n0\n相關試題\n 12 下列關於郵政法中名詞之敘述，何者正確？\r (A)基礎郵資：指經主管機關核定實施之信函第一級距重量資費 (B)印刷物：指明信片、郵簡、型錄等印刷文件 (C)小包：指寄交特定人或特定地址不逾 2 公斤之小件物品 (D)特製郵簡：郵簡封面無須印郵票符誌便可交寄，由中華郵政公司發行者\n #3017440\n 13 依郵件處理規則之規定，下列敘述何者錯誤？\r (A)保價郵件"},{"l":0,"y":111,"a":"A","c":0.93,"s":"12 下列關於郵政法中名詞之敘述，何者正確？","o":{"A":"基礎郵資：指經主管機關核定實施之信函第一級距重量資費","B":"印刷物：指明信片、郵簡、型錄等印刷文件","C":"小包：指寄交特定人或特定地址不逾 2 公斤之小件物品","D":"特製郵簡：郵簡封面無須印郵票符誌便可交寄，由中華郵政公司發行者"},"k":"升資","p":0,"d":""},{"l":0,"y":111,"a":"C","c":0.95,"s":"41 依郵政法之規定，中華郵政公司有特定郵件之專營權，下列何者屬之？","o":{"A":"某甲公司交寄之國際快捷","B":"某乙機關交寄之國內包裹","C":"某丙軍事單位交寄之國內掛號信函","D":"某丁民眾交寄之國內印刷物"},"k":"升資","p":0,"d":""},{"l":0,"y":112,"a":"B","c":1.0,"s":"某學生甲今年 12 歲，為送生日禮物自行向 A 郵局交寄掛號小包 1 件，收件人為同年齡之乙，依郵政 法規定，甲交寄行為之法律效力，下列何者正確？","o":{"A":"無效","B":"因視為有行為能力而有效","C":"須經甲父母之承認始生效力","D":"應依民法未成年人行為能力之規定"},"k":"內勤","p":1,"d":""},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定，有關各類郵件或其事務，國際郵政公約或協定之規定與郵政法牴觸者，其適用順序， 下列敘述何者錯誤？","o":{"A":"非國際郵件之事務，適用郵政法之規定","B":"國際郵件事務，適用國際郵政公約或協定之規定","C":"國內包裹，應適用郵政法之規定","D":"各類郵件均應優先適用國際郵政公約或協定之規定"},"k":"內勤","p":1,"d":"(D) 各類郵件\n均應優先\n適用國際郵政公約或協定之規定\nㅤㅤ\n郵政法 第13條\nㅤㅤ\n關於各類郵件或其事務，國際郵政公約或協定有規定者，依其規定\n。\n但其規定與本法牴觸者，除國際郵件事務外，適用本法之規定\n。\n17\n1"},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法用詞之定義，下列何者由中華郵政公司發行？ A.雜誌 B.新聞紙 C.特製郵簡 D.郵票","o":{"A":"僅 ACD","B":"僅 D","C":"僅 CD","D":"ABCD"},"k":"內勤","p":1,"d":"郵政法 第四條\n本法用詞，定義如下：\n一、函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱。\n二、信函：指寄交特定人或特定地址以傳達訊息之文件，但不包括明信片、郵簡、印刷物、盲人文件。\n三、明信片：指書於單一紙片上，不加封套交寄，並依中華郵政公司公告之紙質、規格製作之文件。\n四、郵簡：指以整張紙適當摺疊粘貼，並依中華郵政公司公告之紙張尺寸、規格，加印許可文字之不加封套交寄之文件。郵簡封面印有郵票符誌，由中華郵政公司發行者，為特製郵簡。\n（C）\n五、印刷物：指新聞紙、雜誌、書籍、型錄等印刷文件。\n（A&B）\n六、盲人文件：指盲人所用印有點痕或凸出字樣，交寄時在封面註明「盲人文件」字樣之文件。另專供盲人使用之錄音帶、錄音片、錄音線及特製紙張，係發自或寄交立案之盲人學校者，視同盲人文件。\n七、小包：指寄交特定人或特定地址不逾一公斤之小件物品。\n八、包裹：指小包以外，寄交特定人或特定地址之"},{"l":0,"y":112,"a":"B","c":1.0,"s":"依郵政法規定，有關信函之敘述，下列何者錯誤？","o":{"A":"信函指寄交特定人或特定地址以傳達訊息之文件","B":"盲人文件屬於信函","C":"限時信函遞送延誤，為中華郵政公司之過失所致者，寄件人得向該公司請求補償","D":"明信片、郵簡不屬於信函"},"k":"內勤","p":1,"d":"第 4 條\n本法用詞，定義如下：\n一、函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱。\n二、信函：指寄交特定人或特定地址以傳達訊息之文件，但不包括明信片、郵簡、印刷物、盲人文件。\n三、明信片：指書於單一紙片上，不加封套交寄，並依中華郵政公司公告之紙質、規格製作之文件。\n四、郵簡：指以整張紙適當摺疊粘貼，並依中華郵政公司公告之紙張尺寸、規格，加印許可文字之不加封套交寄之文件。郵簡封面印有郵票符誌，由中華郵政公司發行者，為特製郵簡。\n五、印刷物：指新聞紙、雜誌、書籍、型錄等印刷文件。\n六、盲人文件：指盲人所用印有點痕或凸出字樣，交寄時在封面註明「盲人文件」字樣之文件。另專供盲人使用之錄音帶、錄音片、錄音線及特製紙張，係發自或寄交立案之盲人學校者，視同盲人文件。\n七、小包：指寄交特定人或特定地址不逾一公斤之小件物品。\n八、包裹：指小包以外，寄交特定人或特定地址之物品。\n九、郵件：指中華"},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，有關郵件補償，下列敘述何者錯誤？","o":{"A":"包裹郵件因其性質致損失，不得請求補償","B":"快捷郵件一部遺失，收件人無異議接受郵件者，不得請求補償","C":"報值郵件，因戰事致損失，應予補償","D":"保價郵件，因颱風致損失，應予補償"},"k":"內勤","p":1,"d":"想請問(D)颱風是天災，為什麼可以補償\n依第 31 條\n第二十九條第一項所列郵件，有下列情事之一者，不得請求補償：\n一、因郵件之性質或瑕疵致損失者。\n二、因\n天災\n事變或其他不可抗力之情事致損失者。但保價郵件，以因戰事致有損失為限。\n三、在外國境內損失，依該國之法規，不負補償責任者。\n四、郵件係禁寄物品或其他依法規不得遞送之物品者。\n五、因郵件未妥為封裝，經告知仍未改善致損失者。\n六、收件人無異議接受郵件者。\n34\n1"},{"l":0,"y":112,"a":"A","c":1.0,"s":"依郵政法規定，郵件無法投遞之處理方式，下列敘述何者正確？","o":{"A":"應先退還寄件人","B":"逕由中華郵政公司招領揭示之","C":"逕由中華郵政公司處分之","D":"內裝物係無價值者，得由中華郵政公司銷燬之"},"k":"內勤","p":1,"d":"郵政法第22條第2項\nㅤㅤ\n郵件無法投遞，應退還寄件人\n。無法退還，由中華郵政公司招領揭示之。經過相當時期，無人領取時，得由中華郵政公司處分之。"},{"l":0,"y":112,"a":"B","c":1.0,"s":"依郵政法規定，有關郵票之敘述，下列何者錯誤？","o":{"A":"除中華郵政公司外，任何人不得發行、製作與郵票類似，且具有交付郵資證明之票證","B":"郵票之廢止，由中華郵政公司報請主管機關層轉行政院核定後廢止之","C":"廢止之郵票應於 1 個月前公告，並停止該郵票售賣","D":"持有中華郵政公司已廢止之郵票者，得自廢止之日起 6 個月內換取新票"},"k":"內勤","p":1,"d":"B交通部核定"},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定 ， 下列得由中華郵政公司自行訂定資費之郵件為何？ A.國際明信片 B.國際郵簡 C. 國際信函 D.小包 E.包裹","o":{"A":"僅 ABC","B":"僅 CDE","C":"僅 ABCD","D":"ABCDE"},"k":"內勤","p":1,"d":"依據郵政法\n第 14 條\nI \n 第六條第一項限由中華郵政公司或受其委託者遞送文件之資費\n，由中華郵政公司擬訂，報請主管機關核定後實施。\nII \n前項以外郵件之資費\n，\n由中華郵政公司自行訂定\n。\nㅤㅤ\n在看\n第 6 條\nI 除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業。\n但國內、外互寄之跨境文件，不在此限\n：\n  一、\n明信片\n。\n  二、\n郵簡\n。\n  三、\n信函\n：\n  （一）各級政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄。\n  （二）前目以外之人所交寄，且單件重量五百公克以下或單件資費不逾十三倍基礎郵資。\nㅤㅤ\nㅤㅤ\n以上述可得知，明信片、郵簡以及符合那兩個條件之1的信函 ，是由中華郵政公司擬訂，交通部核定\n其餘郵件資費由中華郵政公司自訂，但請\n特別注意\n紅字寫到國內外互寄支跨境文件不再此限\nㅤㅤ\n所以選項全部都是中華郵政公司自訂\nA.\n國際\n明"},{"l":0,"y":112,"a":"B","c":1.0,"s":"依郵政法規定，有關郵件業務及免稅之敘述，下列何者錯誤？","o":{"A":"郵件非依法律，不得作為檢查、徵收或扣押之標的","B":"中華郵政公司所經營業務及郵政公用物皆免納一切稅捐","C":"中華郵政公司使用之機具設備、物品等皆為郵政公用物範疇","D":"郵件在航運發生海難時，不分擔共同海損"},"k":"內勤","p":1,"d":"中華郵政公司經營之遞送郵件業務及供該項業務使用之郵政公用物、業務單據，免納一切稅捐。\n郵件在航運發生海難時，不分擔共同海損。"},{"l":0,"y":112,"a":"B","c":1.0,"s":"日前經新聞媒體揭露，某甲郵差於遞送途中掉落一郵件，被乙民眾拾獲，案關郵件經甲郵局報警後， 警察於乙民眾家中尋獲該郵件，請問本案依郵政法得如何處置？","o":{"A":"由警察局依郵政法第 38 條有關隱匿他人之郵件，處拘役或新臺幣九萬元以下罰金","B":"由交通部依郵政法第 38 條有關隱匿他人之郵件，處拘役或新臺幣九萬元以下罰金","C":"由警察局依郵政法第 39 條誤收他人之郵件，故意不返還者，處新臺幣二千元以上一萬元以下罰鍰","D":"由交通部依郵政法第 39 條誤收他人之郵件，故意不返還者，處新臺幣二千元以上一萬元以下罰鍰"},"k":"內勤","p":1,"d":"這題我始終覺得怪。刑責應該是要經由法院裁判才對，不然如果你偽造郵票，交通部判你2年有期徒刑，非經過法院判決，你要如何上訴救濟？"},{"l":0,"y":112,"a":"D","c":1.0,"s":"郵政法之立法目的不包括下列何者？","o":{"A":"健全郵政發展","B":"增進公共利益","C":"提供普遍、公平、合理之郵政服務","D":"鼓勵國民儲蓄、促進資本形成，以配合國家政策"},"k":"外勤","p":1,"d":"第 一 章 總則\n第 1 條\n為健全郵政發展，提供普遍、公平、合理之郵政服務，增進公共利益，特制定本法；本法未規定者，依其他法律之規定"},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，下列何者得委託中華郵政公司，代表政府與外國或國際郵政組織談判國際郵政事務 及簽署有關協定？","o":{"A":"法務部","B":"外交部","C":"交通部","D":"國防部"},"k":"外勤","p":1,"d":"第 一 章 總則\n第 2 條\n本法主管機關為交通部。\n第 六 章 附則\n第 47 條\n主管機關得委託中華郵政公司，代表政府與外國或國際郵政組織談判國際郵政事務及簽署有關協定；其協定事項，並應依相關法規規定辦理。"},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定 ， 中華郵政公司收寄之文件或物品 ， 下列何者交寄時係不加封套？ A.盲人文件 B.小 包 C.特製郵簡 D.明信片","o":{"A":"僅 ABD","B":"僅 D","C":"僅 CD","D":"ABCD"},"k":"外勤","p":1,"d":"第 一 章 總則\n第4條\n三、明信片：指書於單一紙片上，\n不加封套交寄\n，並依中華郵政公司公告之紙質、規格製作之文件。\n四、郵簡：指以整張紙適當摺疊粘貼，並依中華郵政公司公告之紙張尺寸、規格，加印許可文字之\n不加封套交寄之文件\n。郵簡封面印有郵票符誌，由中華郵政公司發行者，為特製郵簡。"},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定，有關基礎郵資，下列敘述何者正確？","o":{"A":"經行政院核定後實施","B":"指小包第一級距重量資費","C":"指各類郵件第一級距重量資費","D":"指信函第一級距重量資費"},"k":"外勤","p":1,"d":"第 一 章 總則\n第 4 條\n十、基礎郵資：指經主管機關核定實施之\n信函第一級距重量資費。"},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定，中華郵政公司經營之遞送郵件業務，享有免納稅捐優惠之期間為何？","o":{"A":"中華郵政公司成立之日起五年內","B":"中華郵政公司成立之日起五年之後","C":"依所得稅法之規定","D":"無期間之限制"},"k":"外勤","p":1,"d":""},{"l":0,"y":112,"a":"B","c":1.0,"s":"依郵政法規定，有關郵票，下列何者非由行政院核定？","o":{"A":"圖案","B":"廢止已發行之郵票","C":"式樣","D":"價格"},"k":"外勤","p":1,"d":""},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定，與郵件有關之敘述，下列何者正確？","o":{"A":"中華郵政公司運輸郵件使用之郵車應納稅捐","B":"郵件之資費不須考慮反映合理利潤","C":"郵件在船運發生海難時，應分擔共同海損","D":"除另有規定外，郵件應經寄件人或收件人同意，中華郵政公司方得開拆查驗"},"k":"外勤","p":1,"d":"(A)\n中華郵政公司經營之遞送郵件業務及供該項業務使用之郵政公用物、業務單據，免納一切稅捐。\n（第9條）\n(B)\n郵件之資費應適當反映成本及合理利潤。\n（第14條）\n(C)\n郵件在航運發生海難時，不分擔共同海損。\n（第9條）\n(D)\n中華郵政公司或其服務人員，不得開拆他人之郵件。但有事實足認內裝之物為郵政禁寄物品、不適用優惠資費或違反郵政法規，經寄件人或收件人同意開拆者，不在此限。\n郵件經依前項但書規定開拆查驗後，應予驗訖之證明。寄件人或收件人不同意開拆時，中華郵政公司得拒絕接受或遞送該郵件。\n(第10條）"},{"l":0,"y":112,"a":"B","c":1.0,"s":"有關郵政法規定之罰則，下列敘述何者正確？","o":{"A":"郵政服務人員犯郵政法第 36 條之罪，無加重其刑","B":"郵政服務人員犯刑法第 204 條關於郵票之罪，加重其刑至二分之一","C":"郵政服務人員，犯刑法第 202 條關於印花稅票之罪，加重其刑至二分之一","D":"負輔助載運郵件責任者之服務人員，犯郵政法第 36 條之罪，無加重其刑"},"k":"外勤","p":1,"d":"第 37 條\n郵政服務人員犯前條之罪或刑法第202條或第204條關於郵票之罪者，加重其刑至二分之一。"},{"l":0,"y":112,"a":"D","c":1.0,"s":"下列何者非屬郵政法所稱「函件」之種類？","o":{"A":"印刷物","B":"盲人文件","C":"小包","D":"包裹"},"k":"外勤","p":1,"d":"第 4 條\n本法用詞，定義如下：\n一、函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱。\n16\n2"},{"l":0,"y":112,"a":"A","c":1.0,"s":"下列何者非屬郵政法所定之郵政專營權文件？","o":{"A":"各級政府機關（構） 、公立學校、公法人、公營事業機構或軍事單位寄至美國之信函","B":"封面未書寫收件人姓名，僅書寫國內收件地址之 20 公克文件","C":"國內明信片","D":"國內郵簡"},"k":"外勤","p":1,"d":"第 6 條\n除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業。但\n國內、外互寄之跨境文件，不在此限\n：\n一、明信片。\n二、郵簡。\n三、信函：\n（一）各級政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄。\n（二）前目以外之人所交寄，且單件重量五百公克以下或單件資費不逾十三倍基礎郵資。"},{"l":0,"y":112,"a":"B","c":1.0,"s":"依郵政法規定，有關郵政、郵局之名稱專用權，下列敘述何者錯誤？","o":{"A":"經中華郵政公司同意者，可以使用","B":"除有例外規定者，任何人不得使用郵政、郵局之中文，惟英文不在此限","C":"除有例外規定者，任何人不得使用郵政、郵局之文字、圖形、記號或其聯合式","D":"除有例外規定者，任何人不得使用於表彰其營業名稱、服務或產品"},"k":"外勤","p":1,"d":"第 7 條\n除\n中華郵政公司或經其同意者外，任何人不得使用\n與郵政、郵局（含中文及外文）相同之文字、圖形、記號或其聯合式，表彰其營業名稱、服務或產品"},{"l":0,"y":112,"a":"B","c":1.0,"s":"依郵政法規定，有關郵件之投遞方式，下列敘述何者錯誤？","o":{"A":"各類郵件之收件人有二人以上者，得向其中任何一人投遞之","B":"郵件投遞後，收件人向郵局聲明相關郵件之收受已提起訴訟時，應依訴訟結果再次投遞","C":"地面層設有管理服務人員或郵件收發處者，各類郵件得交其收領","D":"地面層未設有管理服務人員或郵件收發處而僅設置受信設備、對講機或電鈴者，掛號郵件請收件人至地 面層領取"},"k":"外勤","p":1,"d":"第 23 條\n各類郵件之收件人有二人以上者，得向其中任何一人投遞之。\n前項郵件在未投遞前，收件人間發生爭議，向中華郵政公司聲明，對於其郵件之收受已提起訴訟時，應依確定之判決或訴訟結果投遞之。"},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，寄件人不得請求補償之情形，下列敘述何者錯誤？","o":{"A":"因郵件之性質或瑕疵致損失者","B":"郵件內裝禁寄物品者","C":"保價郵件因天災事變或其他不可抗力之情事致損失","D":"收件人無異議接受郵件者"},"k":"外勤","p":1,"d":"第 31 條\n第二十九條第一項所列郵件，有下列情事之一者，不得請求補償：\n一、因郵件之性質或瑕疵致損失者。\n二、因天災事變或其他不可抗力之情事致損失者。但保價郵件，以因戰事致有損失為限。\n三、在外國境內損失，依該國之法規，不負補償責任者。\n四、郵件係禁寄物品或其他依法規不得遞送之物品者。\n五、因郵件未妥為封裝，經告知仍未改善致損失者。\n六、收件人無異議接受郵件者。"},{"l":0,"y":112,"a":"B","c":1.0,"s":"依郵政法規定，於物品之上塗用膠類、油類、漿類或其他化合物者，意圖供重複行使之用，處 1 年 以下有期徒刑、拘役或新臺幣九千元以下罰金，下列何者非屬之？","o":{"A":"郵票","B":"無印花符誌之明信片","C":"特製郵簡之印花","D":"表示郵資已付符誌"},"k":"外勤","p":1,"d":"第 36 條\n意圖供行使之用，而偽造、變造郵政認知證、國際回信郵票券或其他表示郵資已付符誌者，處六月以上五年以下有期徒刑，得併科新臺幣三萬元以下罰金。\n行使前項偽造、變造之物，或意圖供行使之用而收集或交付於人者，處三年以下有期徒刑，得併科新臺幣三萬元以下罰金。\n意圖供重複行使之用，而於郵票、明信片及特製郵簡之印花或表示郵資已付符誌之上，塗用膠類、油類、漿類或其他化合物者，處一年以下有期徒刑、拘役或新臺幣九千元以下罰金。其行使之者，亦同。"},{"l":0,"y":112,"a":"C","c":1.0,"s":"郵件遞交收件人或退還寄件人時，依郵政法「不得以毀損論」之情形，下列敘述何者錯誤？","o":{"A":"封面無破裂痕跡","B":"重量亦未減少","C":"收件人無異議接受郵件者","D":"重量雖減少，其原因由於該物件之性質者"},"k":"外勤","p":1,"d":"問個問題\n題目沒有寫是哪幾項\n是只針對32條的規定考嗎?\n不然用下面的法條，如果寄29條的郵件\n也有無異議這條耶\n郵政法 第 31 條\n第二十九條第一項所列郵件，\n有下列情事之一者，不得請求補償：\n一、因郵件之性質或瑕疵致損失者。\n二、因天災事變或其他不可抗力之情事致損失者。但保價郵件，以因戰事致有損失為限。\n三、在外國境內損失，依該國之法規，不負補償責任者。\n四、郵件係禁寄物品或其他依法規不得遞送之物品者。\n五、因郵件未妥為封裝，經告知仍未改善致損失者。\n六、\n收件人無異議接受郵件者\n。\n郵政法 第 29 條\n郵件有下列情形之一者，寄件人得向中華郵政公司請求補償：\n一、包裹郵件、快捷郵件、報值郵件、保價郵件全部或一部遺失、被竊或毀損。\n二、前款以外之其他各類掛號郵件全部遺失或被竊。\n三、限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致。\n四、掛號郵件未依中華郵政公司公告之處理規"},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定，有關中華郵政公司遞送專營權之文件範圍，下列敘述何者正確？","o":{"A":"包括國內明信片、印刷物","B":"包括中央銀行於國內寄交美國財政部之國際航空郵簡","C":"包括教育部寄交國內盲人學校之盲人文件","D":"包括公立學校交寄之國內信函，其單件資費逾 13 倍基礎郵資者"},"k":"營運職","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，意圖危害國家安全或社會安定，以毀壞之方法危害郵政核心資通系統設備之功能正 常運作者，有關其刑罰，下列何者正確？","o":{"A":"處五年以上十二年以下有期徒刑，得併科新臺幣五千萬元以下罰金","B":"處六個月以上五年以下有期徒刑，得併科新臺幣一千萬元以下罰金","C":"處三年以上十年以下有期徒刑，得併科新臺幣五千萬元以下罰金","D":"處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金"},"k":"營運職","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，下列何者非依法律 ，不得作為扣押之標的？ A.寄件人向收受郵件專用器具交寄之 信函 B.中華郵政公司委託他人遞送之包裹 C.郵局營業使用之房屋 D.客戶遺落於郵局櫃檯之人壽保 險單","o":{"A":"僅 AB","B":"僅 BD","C":"僅 ABC","D":"ABCD"},"k":"營運職","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"甲交寄之保價郵件一部遺失，收件人為乙，依郵政法規定，有關補償請求權，下列敘述何者正確？","o":{"A":"甲之補償請求權，自郵件交寄之日起，逾三個月不行使而消滅","B":"甲之補償請求權，自郵件交寄之次日起，逾六個月不行使而消滅","C":"甲如授與乙求償權，乙之補償請求權，自郵件交寄之日起，逾六個月不行使而消滅","D":"該保價郵件若係因颱風致一部遺失，甲無補償請求權"},"k":"營運職","p":1,"d":""},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定，下列何者非屬中華郵政公司得經營之業務？","o":{"A":"郵政儲金","B":"以智慧型收受郵件專用器具（i 郵箱）遞送郵件","C":"郵政匯兌","D":"旅平險、住宅火災保險"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"D","c":1.0,"s":"A 公司未受中華郵政公司委託，以遞送往美國之國際函件為營業，依郵政法規定，主管機關得如何 處置？","o":{"A":"得通知其停止該等行為","B":"通知後未停止其行為，得按次處罰","C":"得處新臺幣 10 萬元罰鍰","D":"A 公司未違反郵政法之規定，不得處罰"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，有關郵件之資費，下列敘述何者錯誤？","o":{"A":"國內信函之資費，由交通部核定","B":"國內郵簡之資費，由中華郵政公司擬訂","C":"各類郵件之資費均應由交通部核定","D":"國內明信片之資費，由交通部核定"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"D","c":1.0,"s":"依郵政法規定，其他表示郵資已付符誌，不包括下列何者？ A.無郵票符誌之明信片 B.國際回信郵 票券 C.郵政認知證 D.以郵政規章所許可之印字機或其他方法印刷或加蓋以表示郵資業已付訖之符誌","o":{"A":"僅 AB","B":"僅 AC","C":"僅 ABD","D":"僅 ABC"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，有關小包之敘述，下列何者錯誤？","o":{"A":"限時小包遞送延誤，因天災事變所致者，不得向中華郵政公司請求補償","B":"小包屬於函件之一種","C":"小包限重為 2 公斤","D":"民營運送業者得遞送小包"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，下列敘述何者正確？","o":{"A":"郵政服務人員為運送郵政款項，經過道路時，有優先通行權","B":"主管機關依郵政法第 28 條規定實施檢查，該場所之所有人如拒絕檢查，得處新臺幣十萬元罰金","C":"負輔助載運郵件責任者，因天災而延誤載運郵件，不處罰","D":"中華郵政公司為確認寄件人之真偽，得要求其出示國民身分證"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"A","c":1.0,"s":"依郵政法規定，下列寄件人或收件人不得請求郵件補償之情事為何？","o":{"A":"掛號函件全部毀損","B":"包裹郵件一部遺失","C":"快捷郵件全部遺失","D":"保價郵件一部毀損"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，危害郵政核心資通系統（下稱系統），應加重其刑至二分之一者為何？","o":{"A":"製作專供犯罪之電腦程式，而供自己或他人犯危害系統之罪者","B":"意圖危害國家安全或社會安定者","C":"犯第 35-1 條及第 35-2 條各項之罪並致損及金融市場穩定者","D":"以竊取、毀壞或其他非法方法危害系統者"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，有關郵件之補償規定，下列敘述何者錯誤？","o":{"A":"有權請求補償者為郵件之寄件人或收件人","B":"補償請求權，自郵件交寄之日起，逾六個月不行使而消滅","C":"補償金確定後，自郵件交寄之日起，逾五年間不行使而消滅","D":"補償金確定後，自受領補償人收到通知之日起，逾五年間不行使而消滅"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"C","c":1.0,"s":"依郵政法規定，下列何者為中華郵政公司「不得拒絕遞送」之情事？","o":{"A":"郵件內裝禁寄物品","B":"郵件規格不符中華郵政公司公告","C":"主管機關指定遞送之文件或物品","D":"因天災、事變或其他不可抗力情事致執行顯有困難且經中華郵政公司公告"},"k":"專一","p":1,"d":""},{"l":0,"y":112,"a":"D","c":0.91,"s":"依郵政法規定，中華郵政公司營之遞送郵件業務，享有免納稅捐優惠之期間為何？","o":{"A":"中革郵政公司成立之日起五年內","B":"中華郵政公司成立之日起五年之後","C":"依所得稅法之規定","D":"無期間之限制"},"k":"外勤","p":0,"d":"第 一 章 總則\n第 9 條\n中華郵政公司經營之遞送郵件業務及供該項業務使用之郵政公用物、業務單據，免納一切稅捐。"},{"l":0,"y":112,"a":"B","c":0.93,"s":"依郵政法規定，有關郵票，下列何者非由行政院核定？","o":{"A":"圖案","B":"廢止己發行之郵票","C":"式樣","D":"價格"},"k":"外勤","p":0,"d":"第 一 章 總則\n第 16 條\n郵票、含有郵票符誌之明信片或特製郵簡，由中華郵政公司擬訂\n式樣、圖案及價格，報請主管機關層轉行政院核定後發行。\n第 17 條\n中華郵政公司於報請主管機關核定後，將其發行之郵票廢止之。但應於一個月前公告，並停止該郵票售賣。\n持有前項廢止之郵票者，自廢止之日起六個月內，得向中華郵政公司換取新票。"},{"l":0,"y":112,"a":"B","c":0.97,"s":"依郵政法規定，下列何者非屬「遞送」之作業流程？","o":{"A":"文件或物品之收寄","B":"文件或物品之物流加工","C":"文件或物品之運輸","D":"文件或物品之投遞"},"k":"升等","p":0,"d":"郵政法第四條，指的是文件或物品的收寄 、封發、運輸、投遞。\n16\n2"},{"l":0,"y":112,"a":"C","c":0.85,"s":"依郵政法規定，下列何者非屬中華郵政公司遞送普及服務範疇？","o":{"A":"單件不逾 2 公斤之函件","B":"單件不逾 20 公斤及長寬高合計不逾 150 公分之包裹","C":"單件不逾 20 公斤及長寬高合計不逾 150 公分之快捷郵件","D":"其他經主管機關指定之文件或物品"},"k":"升等","p":0,"d":"第 5-1 條\n為保障國民基本通信權益，主管機關應確保提供國內之遞送普及服務。\n前項所稱之遞送普及服務，指於國內就下列各款，永久提供品質良好、價格允當之基本遞送服務：\n一、單件不逾二公斤之函件。\n二、單件不逾二十公斤及長寬高合計不逾一百五十公分之包裹。\n三、其他經主管機關指定之文件或物品。\n中華郵政公司應提供前項普及服務。但因天災、事變或其他不可抗力情事致執行顯有困難，該公司得公告限制或停辦前項郵件之遞送服務。\n遞送普及服務之服務標準，由主管機關定之。\nㅤㅤ\nㅤㅤ\nㅤㅤ\n資料來源郵政法規"},{"l":0,"y":112,"a":"D","c":0.7,"s":"依郵政法規定，有關中華郵政公司於履行補償後，發現原寄郵件之全部或一部時之處理規定，下列何者正確？","o":{"A":"受領補償者得於受領補償之日起，6 個月內，退還補償金之全部或一部，請求交付該項發現之原寄郵件","B":"受領補償者得於受領補償之日起，3 個月內，退還補償金之全部或一部，請求交付該項發現之原寄郵件","C":"受領補償者得於收到通知之日起，6 個月內，退還補償金之全部或一部，請求交付該項發現之原寄郵件","D":"受領補償者得於收到通知之日起，3 個月內，退還補償金之全部或一部，請求交付該項發現之原寄郵件"},"k":"升等","p":0,"d":"郵政法 第33條\n中華郵政公司於履行補償後，發現原寄郵件之全部或一部時，應通知受領補償者，得於收到通知之日起，三個月內，退還補償金之全部或一部，請求交付該項發現之原寄郵件。\n40\n1"},{"l":0,"y":112,"a":"C","c":0.86,"s":"依郵政法規定，有關郵件資費之訂定，下列敘述何者正確？","o":{"A":"基礎郵資係指經立法院核定實施之不逾 20 公克信函資費","B":"信函資費 遺失、被竊或毀損，寄件人得向中華郵政公司請求補償","B":"限時郵件遞送延誤，經查明為中華郵政公司之過失所致，寄件人得向中華郵政公司請求補償","C":"掛號郵件未依中華郵政公司公告之處理規定遞送，寄件人得向中華郵政公司請求補償","D":"寄件人或收件人除依規定請求補償外，得依其他法律向中華郵政公司請求賠償"},"k":"專一","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，下列何種資費，由中華郵政公司自行訂定？","o":{"A":"明信片","B":"郵簡","C":"信函","D":"包裹"},"k":"專一","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，下列敘述何者錯誤？","o":{"A":"郵政資產：指中華郵政公司經營業務所使用之動產、不動產及其他權利","B":"郵政公用物：指專供中華郵政公司使用之建築物、土地、機具、設備、物品、車、船、航空器及其他相關運輸工 具","C":"郵票：指中華郵政公司發行，具有交付郵資證明之票證","D":"郵政認知證：指萬國郵政聯盟各會員國間相互約定，發售及兌換回信郵票之一種有價證券"},"k":"專一","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，各級政府機關（構） 、公立學校、公法人、公營事業機構或軍事單位以外之人所交寄，且單件 重量幾公克以下或單件資費不逾十三倍基礎郵資之信函，除中華郵政公司及受其委託者外，任何人不得以遞送該文 件為營業？","o":{"A":"200 公克","B":"300 公克","C":"400 公克","D":"500 公克"},"k":"專一","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，對於郵票之發行、廢止等相關事項，下列敘述何者錯誤？","o":{"A":"除中華郵政公司外，其他人不得發行郵票","B":"郵票之式樣、圖案及價格由中華郵政公司擬訂","C":"郵票之廢止，應於 1 個月前公告","D":"郵票之圖案，由交通部擬訂報請行政院核定"},"k":"專一","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，中華郵政公司遞送之文件或物品，下列何者非屬函件？","o":{"A":"特製郵簡","B":"盲人文件","C":"印刷物","D":"國際包裹"},"k":"營運職","p":1,"d":""},{"l":0,"y":114,"a":"C","c":1.0,"s":"依郵政法規定 ， 甲經營之貨運公司未經中華郵政公司同意 ， 不得使用與郵政 、 郵局相同之文字 、 圖形等 ， 是為下列何種行為？ A.表彰營業名稱 B.表彰服務 C.表彰產品 D.宣稱其為郵局之大宗郵件交寄客戶","o":{"A":"僅 BC","B":"僅 AB","C":"僅 ABC","D":"僅 ABD"},"k":"營運職","p":1,"d":""},{"l":0,"y":114,"a":"C","c":1.0,"s":"依郵政法規定，某甲為 11 歲之學生，於郵局購買郵票並交寄掛號信函，其行為之法律效力為何？","o":{"A":"經甲之父母同意後始生效力","B":"無效","C":"視為有行為能力人之行為而有效","D":"推定為有行為能力人之行為"},"k":"營運職","p":1,"d":""},{"l":0,"y":114,"a":"C","c":1.0,"s":"依郵政法規定，有關中華郵政公司或其服務人員因職務知悉他人秘密者，下列敘述何者正確？","o":{"A":"僅中華郵政公司之服務人員應負保守秘密之義務，該公司則無此義務","B":"服務人員自離職之日起即免負保密義務","C":"服務人員離職後仍應持續負保守秘密之義務","D":"得由服務人員視該秘密之重要性而自行決定保密期限"},"k":"營運職","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"國際郵政公約或協定關於郵件或其事務之規定，如與郵政法之規定牴觸，應如何適用法律？","o":{"A":"適用涉外民事法律適用法","B":"一律優先適用國際郵政公約或協定","C":"適用仲裁法","D":"除國際郵件事務外，適用郵政法之規定"},"k":"營運職","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，有關名詞定義，下列敘述何者錯誤？","o":{"A":"函件指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱","B":"信函指寄交特定人或特定地址以傳達訊息之文件","C":"小包指寄交特定人或特定地址不逾一公斤之小件物品","D":"郵政認知證指萬國郵政聯盟發售，用以證明持證本人之證件"},"k":"內勤","p":1,"d":"郵政法 第四條\n郵政認知證：指\n中華郵政公司發售\n，用以證明持證本人之證件。"},{"l":0,"y":114,"a":"B","c":1.0,"s":"依郵政法規定，有關寄件人不得向中華郵政公司請求補償之情事，下列敘述何者錯誤？","o":{"A":"因郵件性質或瑕疵致損失者","B":"保價郵件因天災事變或其他不可抗力致損失者","C":"郵件係禁寄物品","D":"收件人無異議接受郵件者"},"k":"內勤","p":1,"d":"郵政法 第 31 條:（不得請求補償之情形）﹝1﹞\n第二十九條所列郵件，有下列情事之一者，不得請求補償：\n一、因郵件之性質或瑕疵致損失者。\n二、因天災事變或其他不可抗力之情事致損失者。\n但保價郵件，以因戰事致有損失為限\n。"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，各類郵件收件人有二人以上者，在郵件未投遞前，收件人間發生爭議，向中華郵政公司聲明，對於 郵件之收受已提起訴訟時，中華郵政公司應如何投遞？","o":{"A":"得向其中任何一收件人投遞","B":"得依任一收件人要求向其投遞","C":"應請所有收件人簽名或蓋章後，向其中一人投遞","D":"應依確定判決或訴訟結果投遞"},"k":"內勤","p":1,"d":""},{"l":0,"y":114,"a":"B","c":1.0,"s":"依郵政法規定，郵件無法投遞時之處理方式，下列何者正確？","o":{"A":"交主管機關公告招領","B":"應退還寄件人","C":"逕由中華郵政公司招領之","D":"逕由中華郵政公司處分之"},"k":"內勤","p":1,"d":"退還→招領→處分"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，有關中華郵政公司或其服務人員就他人郵件得否開拆查驗之敘述，下列何者錯誤？","o":{"A":"經寄件人或收件人同意，有事實足認內裝之物為郵政禁寄物品，得開拆查驗","B":"經寄件人或收件人同意，有事實足認內裝之物不適用優惠資費，得開拆查驗","C":"經寄件人或收件人同意，有事實足認內裝之物違反郵政法規，得開拆查驗","D":"寄件人或收件人不同意開拆郵件時，中華郵政公司仍應接受或遞送該郵件"},"k":"內勤","p":1,"d":"郵政法第10條\n1. 中華郵政公司或其服務人員，不得開拆他人之郵件。但有事實足認內裝之物為\n郵政禁寄物品\n、\n不適用優惠資費\n或\n違反郵政法規\n，經寄件人或收件人\n同意開拆\n者，不在此限。\n2. 郵件經依前項但書規定開拆查驗後，應予驗訖之證明。寄件人或收件人\n不同意開拆\n時，中華郵政公司得\n拒絕接受或遞送\n該郵件。"},{"l":0,"y":114,"a":"A","c":1.0,"s":"依郵政法規定，下列敘述何者錯誤？","o":{"A":"郵政核心資通系統係指中華郵政公司支持儲金、匯兌及壽險業務持續運作必要或防護需求等級為高之業務資通系統","B":"單件重量為一公斤之函件，中華郵政公司非依法規，不得拒絕遞送","C":"郵政服務人員為遞送郵件或郵政公用物，經過道路、橋樑、海關、渡口等交通路線時，有優先通行權","D":"交通部為提供郵政服務，設國營中華郵政股份有限公司"},"k":"內勤","p":1,"d":"第4條第二十項 郵政核心資通系統：指中華郵政公司支持儲金及匯兌業務持續運作必要或防護需求等級為高之儲金及匯兌業務資通系統。\n沒有壽險！！"},{"l":0,"y":114,"a":"B","c":1.0,"s":"依郵政法規定，有關遞送普及服務之敘述，下列何者錯誤？","o":{"A":"中華郵政公司應永久提供品質良好、價格允當之基本遞送服務","B":"遞送普及服務範圍包括單件不逾五公斤之函件","C":"遞送普及服務範圍包括單件不逾二十公斤及長寬高合計不逾一百五十公分之包裹","D":"遞送普及服務範圍包括其他經交通部指定之文件或物品"},"k":"內勤","p":1,"d":"根據你正在瀏覽的頁面內容，第 41 題考的是 \n郵政法中關於遞送普及服務的範圍與規定\n。\nㅤㅤ\n? 題目重點\n依郵政法，普及服務的定義是：\n中華郵政公司必須 \n永久提供品質良好、價格合理的基本遞送服務\n。\n普及服務範圍包括：\n單件不逾二十公斤，且長寬高合計不逾一百五十公分的包裹\n。\n其他經交通部指定的文件或物品\n。\n而「單件不逾五公斤之函件」的說法是錯誤的，因為函件並沒有以「五公斤」作為限制標準。\nㅤㅤ\n? 選項解析\n(A) 中華郵政公司應永久提供品質良好、價格允當之基本遞送服務 → ✅ 正確。\n(B) 遞送普及服務範圍包括單件不逾五公斤之函件 → ❌ 錯誤，函件並非以五公斤為限制。\n(C) 遞送普及服務範圍包括單件不逾二十公斤及長寬高合計不逾一百五十公分之包裹 → ✅ 正確。\n(D) 遞送普及服務範圍包括其他經交通部指定之文件或物品 → ✅ 正確。\nㅤㅤ\n? 結論\n正確答案是 \n(B) "},{"l":0,"y":114,"a":"A","c":1.0,"s":"依郵政法規定，有關資費訂定之敘述，下列何者錯誤？","o":{"A":"郵簡之資費，由中華郵政公司擬訂，報請主管機關層轉行政院核定後實施","B":"包裹之資費，由中華郵政公司自行訂定","C":"小包之資費，由中華郵政公司自行訂定","D":"郵件之資費，應適當反映成本及合理利潤"},"k":"內勤","p":1,"d":"第六條\n除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業。但國內、外互寄之跨境文件，不在此限：\n一、明信片。\n二、郵簡。\n三、信函：\n（一）各級政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄。\n（二）前目以外之人所交寄，且單件重量五百公克以下或單件資費不逾十三倍基礎郵資。\n運送業者，除附送與貨物有關之通知外，不得為前項文件之遞送。"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，有關郵件請求補償之規定，下列敘述何者正確？","o":{"A":"限時郵件遞送延誤，經查明為中華郵政公司過失所致者，寄件人不得向該公司請求補償","B":"掛號信函一部遺失時，寄件人得向中華郵政公司請求補償","C":"收件人未經寄件人授權，無論何種情形均不得行使求償權","D":"寄件人或收件人除依郵政法第二十九條規定請求補償外，不得依其他法律向中華郵政公司請求賠償"},"k":"內勤","p":1,"d":"郵政法 第 29 條\n郵件有下列情形之一者，寄件人得向中華郵政公司請求補償：\n一、包裹郵件、快捷郵件、報值郵件、保價郵件全部或一部遺失、被竊或毀損。\n二、前款以外之其他各類掛號郵件\n全部\n遺失或被竊。\n三、限時郵件、快捷郵件遞送延誤，\n經查明為中華郵政公司之過失所致。\n四、掛號郵件未依中華郵政公司公告之處理規定遞送。\n前項求償權，有下列情形之一者，\n得由收件人行使：\n一、收件人提出證據，證明已由寄件人授與求償權。\n二、郵件一部毀損或被竊，收件人收受其餘部分並聲明保留求償權。\n寄件人或收件人除依前二項規定請求補償外，不得依其他法律向中華郵政公司請求賠償。"},{"l":0,"y":114,"a":"C","c":1.0,"s":"依郵政法規定，有關郵政法罰則之敘述，下列何者錯誤？","o":{"A":"意圖供重複行使之用，而於郵票上塗用膠類、油類、漿類或其他化合物者，處一年以下有期徒刑、拘役或新臺幣九千元 以下罰金","B":"無故開拆或隱匿他人之郵件或以其他方法窺視其內容者，處拘役或新臺幣九萬元以下罰金","C":"意圖危害國家安全或社會安定 ， 而竊取 、 毀壞或其他非法方法危害郵政核心資通系統設備之功能正常運作者 ， 處一年以 上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金","D":"郵政服務人員犯刑法第二百零二條或第二百零四條關於郵票之罪者，加重其刑至二分之一"},"k":"內勤","p":1,"d":"? 條文對照解析\n(A) 郵票塗改\n條文規定：意圖供重複使用而在郵票上塗用膠類、油類、漿類或其他化合物者，處 \n一年以下有期徒刑、拘役或新臺幣九千元以下罰金\n。\n→ 敘述正確。\n(B) 無故開拆或隱匿郵件\n條文規定：無故開拆、隱匿他人郵件或窺視內容者，處 \n一年以下有期徒刑、拘役或新臺幣九萬元以下罰金\n。\n→ 敘述正確。\n(C) 危害郵政核心資通系統\n條文規定：意圖危害國家安全或社會安定，竊取、毀壞或其他非法方法危害郵政核心資通系統設備功能正常運作者，處 \n三年以上十年以下有期徒刑，得併科新臺幣一千萬元以下罰金\n。\n題目敘述卻寫成「一年以上七年以下」，刑度明顯錯誤。\n→ \n錯誤選項\n。\n(D) 郵政服務人員犯郵票之罪\n條文規定：郵政服務人員犯刑法第 202 條或第 204 條關於郵票之罪者，\n加重其刑至二分之一\n。\n→ 敘述正確。\nㅤㅤ\n? 結論\n? 正確答案是 \n(C)\n，因為題目中的刑"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，郵件在航運發生海難時，須否分擔共同海損？","o":{"A":"係以被保存郵件價值與共同海損總額之比例，計算應分擔額","B":"分擔 3 分之 1 共同海損","C":"分擔 2 分之 1 共同海損","D":"不分擔共同海損"},"k":"外勤","p":1,"d":""},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，運送業者得經營遞送之文件或物品，不包括下列何者？","o":{"A":"包裹","B":"小包","C":"附送與貨物有關之通知","D":"A 公司於國內之投標文件（文件重量 400 公克）"},"k":"外勤","p":1,"d":"郵政法ㅤ第 6 條\n除中華郵政公司及受其委託者外，任何人不得以遞送下列文件為營業：\n一、明信片。\n二、郵簡。\n三、信函\n但書:（二）前目以外之人所交寄，\n且單件重量五百公克以下\n或單件資費不逾十三倍基礎郵資。\n(D) A 公司於國內之投標文件（400 公克）--在五百公克以下允運送業者不可以經營\nㅤㅤ\n(D) A 公司於國內之投標文件（400 公克）\n1. 這屬於「信函」性質\n2. 且重量在郵政專營範圍內\n3. 運送業者不得經營 ✖"},{"l":0,"y":114,"a":"B","c":1.0,"s":"依郵政法規定，中華郵政公司經營之業務及供業務使用之物或單據，下列何者不適用免納稅捐之優惠？","o":{"A":"設置於學校之郵筒","B":"郵局閒置空間之出租業務","C":"遞送郵件所使用之汽車","D":"遞送郵件業務"},"k":"外勤","p":1,"d":""},{"l":0,"y":114,"a":"B","c":1.0,"s":"依郵政法規定，含有郵票符誌之明信片，係由下列何者發行？","o":{"A":"交通部","B":"中華郵政公司","C":"行政院","D":"任何人皆得製作及發行"},"k":"外勤","p":1,"d":"第 16 條\n郵費之交付，以郵票或其他表示郵資已付符誌證明之。\n郵票、含有郵票符誌之明信片或特製郵簡，由中華郵政公司擬訂式樣、圖案及價格，報請主管機關層轉行政院核定後發行。"},{"l":0,"y":114,"a":"B","c":1.0,"s":"依郵政法規定，無故開拆或隱匿他人之郵件，其罰則下列何者正確？","o":{"A":"處新臺幣 2 萬元以上 10 萬元以下罰鍰","B":"處拘役或新臺幣 9 萬元以下罰金","C":"處 1 年以下有期徒刑","D":"處 3 年以下有期徒刑，得併科新臺幣 3 萬元以下罰金"},"k":"外勤","p":1,"d":"第\n 38 \n條\n無故開拆或隱匿他人之郵件或以其他方法窺視其內容者，處拘役或新臺幣九萬元以下罰金。"},{"l":0,"y":114,"a":"A","c":1.0,"s":"依郵政法規定，下列何者為郵政法主管機關？","o":{"A":"交通部","B":"財政部","C":"內政部","D":"行政院"},"k":"外勤","p":1,"d":""},{"l":0,"y":114,"a":"A","c":1.0,"s":"依郵政法規定，中華郵政公司於報請主管機關核定後，將其發行之郵票廢止之。但應於多久前公告，並停止該 郵票售賣？","o":{"A":"1 個月","B":"2 個月","C":"3 個月","D":"4 個月"},"k":"外勤","p":1,"d":"第 17 條\n中華郵政公司於報請主管機關核定後，將其發行之郵票廢止之。但應於\n一個月前公告\n，並停止該郵票售賣。\n持有前項廢止之郵票者，自廢止之日起六個月內，得向中華郵政公司換取新票。\n發行之郵票廢止之，一個月前公告\n，並停止該郵票售賣。\n廢止之日起六個月內\n，得向中華郵政公司換取新票。\n10\n1"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，下列敘述何者錯誤？","o":{"A":"函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱","B":"明信片：指書於單一紙片上，不加封套交寄，並依中華郵政公司公告之紙質、規格製作之文件","C":"盲人文件：指盲人所用印有點痕或凸出字樣，交寄時在封面註明「盲人文件」字樣之文件","D":"小包：指寄交特定人或特定地址不逾 2 公斤之小件物品"},"k":"外勤","p":1,"d":"不講法條，說的明白點，\n本土式講解，記一輩子~~~\n中華郵政送的所有，不管什麼洨，都叫\"郵件\"，\n郵件扣掉\"包裹\"以外，不管什麼洨，都叫\"函件\"，\n函件內的子項都是個別定義項目。\n小包是不逾一公斤的\"物件\"\n包裹是不逾長寬高150公分，20公斤的\"物件\"(←這是普及化、基本的遞送定義)"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，補償金確定後，應通知受領補償人。補償金請求權，自受領補償人收到通知之日起，逾幾年間 不行使而消滅？","o":{"A":"2 年","B":"3 年","C":"4 年","D":"5 年"},"k":"外勤","p":1,"d":"第\n 34 \n條\n寄件人或收件人之\n補償請求權\n，自郵件交寄之日起，逾六個月不行使而消滅。\n寄件人或收件人，如於前項期間內曾向中華郵政公司查詢該郵件者，以已經請求補償論。\n第\n 35 \n條\n補償金\n確\n定後，應通知受領補償人。補償金請求權，自受領補償人收到通知之日起，\n逾五年\n間不行使而消滅。"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，下列敘述何者錯誤？","o":{"A":"除中華郵政公司或經其同意者外，任何人不得使用與郵政、郵局（含中文及外文）相同之文字、圖形、記號或其 聯合式，表彰其營業名稱、服務或產品","B":"郵件、郵政資產、郵政款項及郵政公用物，非依法律，不得作為檢查、徵收或扣押之標的","C":"無行為能力人或限制行為能力人，關於郵政事務對中華郵政公司所為之行為，視為有行為能力人之行為","D":"關於各類郵件或其事務，國際郵政公約或協定有規定者，依其規定。但其規定與郵政法牴觸者，均適用郵政法之 規定"},"k":"外勤","p":1,"d":"第 13 條\n關於各類郵件或其事務，國際郵政公約或協定有規定者，依其規定。但其規定與本法牴觸者，除國際郵件事務外，適用本法之規定。"},{"l":0,"y":114,"a":"B","c":1.0,"s":"依郵政法規定，收件人得行使補償請求權之情形，下列何者錯誤？","o":{"A":"收件人提出證據，證明已由寄件人授與求償權","B":"在外國境內損失","C":"郵件一部毀損，收件人收受其餘部分並聲明保留求償權","D":"郵件一部被竊，收件人收受其餘部分並聲明保留求償權"},"k":"外勤","p":1,"d":""},{"l":0,"y":114,"a":"A","c":1.0,"s":"依郵政法規定，誤收他人郵件故意不返還者，有關處罰規定下列何者正確？","o":{"A":"處新臺幣二千元以上一萬元以下罰鍰","B":"處新臺幣二萬元以上十萬元以下罰鍰","C":"處新臺幣二十萬元以上一百萬元以下罰鍰","D":"沒有相關處罰規定"},"k":"外勤","p":1,"d":""},{"l":0,"y":114,"a":"C","c":1.0,"s":"依郵政法用詞定義，下列何者屬印刷物？ A.明信片 B.雜誌 C.書籍 D.型錄","o":{"A":"僅 ACD","B":"僅 ABD","C":"僅 BCD","D":"僅 ABC"},"k":"外勤","p":1,"d":""},{"l":0,"y":114,"a":"C","c":1.0,"s":"依郵政法有關郵件投遞之規定，下列敘述何者錯誤？","o":{"A":"除另有約定外，各類郵件應按其表面所書收件人之地址投遞","B":"收件地址係地面層以外樓層，地面層設有管理服務人員或郵件收發處者，各類郵件得交該管理服務人員或郵件收 發處收領","C":"收件地址係地面層以外樓層 ， 地面層未設有管理服務人員或郵件收發處者 ， 而僅設置受信設備 、 對講機或電鈴者 ， 各類郵件均應請收件人至地面層領取","D":"中華郵政公司為確認收件人之真偽，得請其出示必要之證明"},"k":"外勤","p":1,"d":"第 24 條\n收件地址係地面層以外樓層之郵件，依下列方式投遞：\n一、地面層設有管理服務人員或郵件收發處者，各類郵件得交管理服務人員或郵件收發處收領。\n二、無法依前款規定投遞、地面層未設有管理服務人員或郵件收發處而僅設置受信設備、對講機或電鈴者，平常郵件投入受信設備，掛號郵件及欠資郵件，請收件人至地面層領取或補付欠資。\n掛號郵件及欠資郵件無法依前項規定投遞者，依第四十八條所訂之規則有關投遞規定辦理。"},{"l":0,"y":114,"a":"D","c":1.0,"s":"依郵政法規定，下列敘述何者正確？","o":{"A":"中華郵政公司得經營之業務不包括郵政資產之營運","B":"中華郵政公司或其服務人員因職務知悉他人秘密者，有保守秘密之義務，其服務人員離職者，不在此限","C":"
