位，計算其補償金額。\n三、國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權一百五十計算單位，計算其補償金額。\n報值或保價郵件全部或一部遺失、被竊或毀損，應予補償時，按所報或所保價值之全部或一部予以補償。一部損失，以實價補償，其實價，依收"},{"l":2,"y":112,"a":"A","c":0.64,"s":"依郵務營業規章規定，保價郵件一部遺失，以實價補償者，其實價如何決定之？","o":{"A":"依收寄時及收寄地之市價定之，最多以原件所報或所保價值為限","B":"依收寄時及目的地之市價定之，最多以原件所報或所保價值為限","C":"依送達時及目的地之市價定之，最多以原件所報或所保價值為限","D":"依送達時及收寄地之市價定之，最多以原件所報或所保價值為限"},"k":"升等","p":0,"d":""},{"l":2,"y":112,"a":"B","c":0.53,"s":"依郵務營業規章規定，國內互寄單本書籍及小包混合交寄，其總重量最高限重為多少？","o":{"A":"6 公斤","B":"5 公斤","C":"3 公斤","D":"2 公斤"},"k":"升等","p":0,"d":"郵務營業規章 第三十二條\n印刷物每件重量限制為二公斤。但國內互寄單本書籍，或寄往國外之書\n籍無論單本或多本，均得展至\n五公斤\n。其尺寸限度與信函之規定同。"},{"l":2,"y":113,"a":"A","c":0.9,"s":"依郵務營業規章規定，下列敘述何者錯誤？","o":{"A":"明信片交寄時，應於封套正面註明「明信片」字樣","B":"新聞紙交寄時，應於封套正面註明「新聞紙」字樣","C":"雜誌交寄時，應於封套正面註明「雜誌」字樣","D":"盲人文件交寄時，應在封面註明「盲人文件」字樣"},"k":"半日制","p":0,"d":"B. C\n第二十四條\n1 寄件人向本公司登記交寄之新聞紙或雜誌，應於其名稱之下或封面、封底之明顯位置刊載「中華郵政某某聞字第某號登記證登記為新聞紙交寄」或「中華郵政某某雜字第某號登記證登記為雜誌交寄」字樣。\n2 新聞紙或雜誌交寄時，應於封套正面註明「新聞紙」或「雜誌」字樣；寄往國外之新聞紙，以國際郵務通用之法文或英文註明之(見附表二)。\nD\n第三十五條\n1 盲人文件指盲人所用印有點痕或凸出字樣，交寄時在封面註明「盲人文件」字樣之文件。另專供盲人使用之錄音帶、錄音片、錄音線及特製紙張，係發自或寄交立案之盲人學校者，視同盲人文件。\n2 專供盲人使用之磁片、光碟片或電子儲存裝置，係發自或寄交立案之盲人學校者，得按盲人文件計費交寄。\n3 盲人文件交寄時，應在封面註明「盲人文件」字樣；寄往國外者，以國際郵務通用之法文或英文(見附表二)註明同義字樣。\n4 盲人文件免付水陸路普通資費；交由航空郵路寄遞者"},{"l":2,"y":113,"a":"D","c":0.84,"s":"有關明信片，下列敘述何者錯誤？","o":{"A":"國外明信片應為橫式","B":"國內橫式明信片得補足郵資差額，作國外明信片使用","C":"薄紙製成之各種圖解、照片、花紋、圖案或其他剪件，全部黏貼而不改變明信片紙質、規格者，得黏貼於明信片之背面交寄","D":"紙張經折疊壓製，外形類似明信片者，按印刷物交寄"},"k":"半日制","p":0,"d":"紙張經折疊壓製，外形類似明信片者，按\n印刷物\n交寄----信函。"},{"l":2,"y":113,"a":"C","c":0.96,"s":"依郵務營業規章規定，國內定期發行之刊物，經中華郵政公司認定係屬商業性廣告、宣傳品或公司、行號發行為本身業務或特定個人宣傳者，其篇幅逾全部篇幅達百分之多少者，不得按新聞紙或雜誌交寄？","o":{"A":"30","B":"40","C":"50","D":"60"},"k":"半日制","p":0,"d":"20-1條\n國內\n定期發行之\n刊物，\n符合\n郵件處理規則\n第十條\n第一項及\n第二項規定之\n條件者，\n得向本公司\n申請登記，\n經同意後\n按新聞紙或\n雜誌\n交寄。\n前項刊物，\n經本公司\n認定係屬\n商業性\n廣告、\n宣傳品或\n公司、\n行號發行\n為本身\n業務或\n特定\n個人宣傳者，\n其篇幅\n逾全部篇幅\n百分之50者，\n不得按\n新聞紙或\n雜誌交寄"},{"l":2,"y":113,"a":"B","c":0.74,"s":"依郵務營業規章規定，已登記之新聞紙或雜誌，其登記之事項如有變更，應於變更之日起幾日內，向郵局申請變更登記？","o":{"A":"5 日","B":"10 日","C":"15 日","D":"20 日"},"k":"半日制","p":0,"d":"21條\n第三項\n已登記之\n新聞紙或\n雜誌，\n其登記之事項\n如有變更，\n應於\n變更之日起\n10日內，\n向郵局\n申請\n變更登記。"},{"l":2,"y":113,"a":"A","c":0.73,"s":"下列何者應按印刷物付費交寄？","o":{"A":"新聞紙或雜誌非向指定之郵局窗口交寄者","B":"新聞紙或雜誌封面上所書刊物名稱及地址與原登記相同者","C":"明信片上黏貼附件不符規定，致裝入封套者","D":"國內郵簡夾寄附件者"},"k":"半日制","p":0,"d":"A 第二十八條\n1 新聞紙或雜誌，有下列情形之一者，應按印刷物付費交寄：\n 一、封面上所書刊物名稱及地址與原登記不同者。\n 二、非經登記之報社或其派報處所或雜誌社交寄者。\n 三、非向指定之郵局窗口交寄者。\n 四、本規章第二十二條第一項第二款之情形者。\n 五、應登記之事項有變更，而未於期限內辦理變更者。\n 六、內頁頁數、版面不全，或未編訂頁次、版次，或重複編訂者。\n 七、非當期雜誌。但零星補寄在一百件以內，並於封面註明「補寄」字樣者，不在此限。\n 八、由民營遞送業者代寄或僅交寄偏遠地區者。\n 九、寄往國外之雜誌。\n2 前項各款情形，於交寄後始發現經郵局通知者，寄件人應按印刷物資費補付差額，並限於接到通知之次日起五日內付清；未付清前，不得再按新聞紙或雜誌交寄。\nㅤㅤ"},{"l":2,"y":113,"a":"A","c":0.95,"s":"依郵務營業規章規定，非當期雜誌，零星補寄在多少件以內，並於封面註明「補寄」字樣者，得按雜誌付費交寄？","o":{"A":"100 件","B":"200 件","C":"300 件","D":"400 件"},"k":"半日制","p":0,"d":"28條\n新聞紙或\n雜誌，\n有下列\n情形之一者，\n應按\n印刷物\n付費交寄：\n一、封面上\n所書刊物\n名稱及\n地址\n與原登記\n不同者。\n二、非經\n登記之\n報社或\n其派報處所或\n雜誌社\n交寄者。\n三、非向\n指定之\n郵局窗口\n交寄者。\n四、本規章\n第二十二條\n第一項\n第二款之情形者。\n（22條1項2款）\n內容係屬\n商業性\n廣告、宣傳品\n或公司行號\n發行\n為本身業務\n或特定個人\n宣傳，\n其篇幅\n逾全部篇幅\n百分之五十，\n且一年內\n累計\n達三次者。\n五、應登記之\n事項\n有變更，\n而未於\n期限內\n辦理變更者。\n六、內頁\n頁數、版面\n不全，\n或未編訂\n頁次、\n版次，\n或重複\n編訂者。\n七、非當期\n雜誌。\n但零星\n補寄\n在一百件-------A\n以內，\n並於封面\n註明\n「補寄」\n字樣者\n，不在此限。\n八、由民營\n遞送業者\n代寄或\n僅交寄\n偏遠地區者。\n九、寄往\n國外之\n雜誌。"},{"l":2,"y":113,"a":"D","c":0.92,"s":"依郵務營業規章規定，下列敘述何者錯誤？","o":{"A":"電子函件之郵寄資費包括郵資及特別處理費","B":"電子函件之郵資依郵件資費表之規定暨函件編輯頁數計算","C":"電子函件客戶，如密碼遺忘、被竊或不擬繼續交寄電子函件時，得申請暫停或終止帳戶","D":"掛號電子函件之寄件人得以電話、網際網路或其他經郵局同意之方式向電子郵局申辦查詢，或以電話逕向投遞局查詢。由電子郵局繕寫或列印「國內掛號函件及包裹查單」，其申請以傳真回復者，免付查詢費"},"k":"半日制","p":0,"d":"A B 第三十八條\n 電子函件之郵寄資費包括郵資及特別處理費。郵資依郵件資費表之規定暨函件編輯頁數計算；特別處理費依信封、信紙及列印封裝成本等由本公司訂定之，於郵件交寄時向寄件人收取之。\nC 第四十二條\n1 電子函件客戶，如密碼遺忘、被竊或不擬繼續交寄電子函件時，得申請暫停或終止帳戶。\n2 前項帳戶之終止，客戶於填妥帳戶終止申請表後寄電子郵局辦理。\nD 第四十四條\n1 掛號電子函件之寄件人得以電話、網際網路或其他經郵局同意之方式向電子郵局申辦查詢，或以電話逕向投遞局查詢。\n2 前項查詢由電子郵局繕寫或列印「國內掛號函件及包裹查單」，利用一般郵路查詢者，免付查詢費。但申請以傳真回復者，應加付傳真查詢費。"},{"l":2,"y":113,"a":"A","c":0.79,"s":"有關得通知收件人至郵局領取包裹，下列何者正確？","o":{"A":"包裹破損須當面開驗者","B":"報值、保價或代收貨款（不限金額）者","C":"應由收件人自辦報關手續或應納稅捐（不限金額）者","D":"重量在二公斤以上之包裹，其收件人地址車輛通行不便者"},"k":"半日制","p":0,"d":"第五十六條\n1 包裹有下列情形之一者，得通知收件人至郵局領取：\nA) 一、包裹破損須當面開驗者。\nB) 二、報值、保價或代收貨款金額達一定數額以上者。\nC) 三、應由收件人自辦報關手續或應納稅捐在規定數額以上者。\n 四、應交付其他費用者。\nD) 五、重量在三公斤以上之包裹，其收件人地址車輛通行不便者。\n2 前項通知至郵局領取之包裹，收件人應自通知之次日起十五日內領取，逾期未領者，應按逾期日數交付逾期保管費，如無法投遞退回時，向寄件人收取之。\n3 進口國際包裹之收件人未能於前項期間內領取者，得依前項規定交付保管費，申請展期，但至多以二個月為限。"},{"l":2,"y":113,"a":"D","c":0.88,"s":"下列哪一種類郵件不得以未來郵件交寄？","o":{"A":"國內包裹","B":"國內普通平常函件","C":"國際普通平常函件","D":"快捷郵件"},"k":"半日制","p":0,"d":"這題用時間比喻較好理解，快捷郵件講求「速度」，未來郵件則會經過「一段時間後」才寄到。"},{"l":2,"y":113,"a":"B","c":0.88,"s":"依郵務營業規章規定，下列敘述何者錯誤？","o":{"A":"得經由 i 郵箱收領之郵件須為掛號郵件","B":"掛號郵件改投遞至 i 郵箱前，須經寄件人同意","C":"掛號郵件投入 i 郵箱，視為一次投遞","D":"掛號郵件同時書寫 i 郵箱地址及收件人地址者，除依規定逕予招領或另有特別約定者外，郵件逕投入所指定之 i 郵箱"},"k":"半日制","p":0,"d":"A\n#218 2 得經由 i 郵箱收領之郵件須為掛號郵件。\n#219\nC 3 掛號郵件投入 i 郵箱，視為一次投遞。\nB 5 前項情形經郵局通知收件人後，掛號郵件得改以收件人同意之方式或本規章規定之方式投遞。但以能通知者為限，不能通知時，郵件得送交指定郵局招領。\nD 6 掛號郵件同時書寫 i 郵箱地址及收件人地址者，除依規定逕予招領或另有特別約定者外，郵件逕投入所指定之 i 郵箱。"},{"l":2,"y":113,"a":"D","c":0.86,"s":"以 i 郵箱提供掛號郵件投遞服務時，應通知收件人之事項，不含下列何者？","o":{"A":"郵件號碼","B":"取件方式","C":"i 郵箱的設置地點","D":"寄件人姓名"},"k":"半日制","p":0,"d":"郵務營業規章 第220條\n第1項\n以i郵箱提供掛號郵件投遞服務時，應通知收件人下列事項：\n一、\n郵件號碼\n、\n取件方式\n及所需資訊。\n二、\ni郵箱的設置地點\n。"},{"l":2,"y":113,"a":"C","c":0.85,"s":"依郵務營業規章規定，報值郵件經郵局發單通知領取者，收件人應自通知之次日起多少日內領取，逾期未領者，依無法投遞郵件之規定處理？","o":{"A":"5 日","B":"10 日","C":"15 日","D":"20 日"},"k":"半日制","p":0,"d":"83條\n報值\n郵件\n經郵局\n發單\n通知\n領取者，\n收件人\n應自通知之\n次日起\n15日內\n領取，\n逾期\n未領者，\n依無法\n投遞郵件之\n規定處理。\n0\n1"},{"l":2,"y":113,"a":"D","c":0.75,"s":"依郵務營業規章規定，下列敘述何者正確？","o":{"A":"保價郵件經郵局發單通知領取者，收件人應自通知之日起 20 日內領取","B":"保價郵件經郵局發單通知領取者，收件人應自通知之日起 30 日內領取","C":"保價郵件經郵局發單通知領取者，收件人應自通知之次日起 20 日內領取","D":"保價郵件經郵局發單通知領取者，收件人應自通知之次日起 30 日內領取"},"k":"半日制","p":0,"d":"95條\n保價郵件\n經郵局\n發單\n通知領取者，\n收件人\n應自通知之\n次日起\n30日內\n領取，\n逾期\n未領者，\n依郵件處理規則\n有關\n無法\n投遞\n郵件之\n規定\n處理之。"},{"l":2,"y":113,"a":"D","c":0.83,"s":"依郵務營業規章規定，代收貨款郵件經郵局通知領取者，收件人應於下列哪一期間向指定郵局領取，逾期未領者，除寄件人預先在託運單或詳情單上有所聲明或另為聲明，依其聲明辦理外，應將該郵件退回原寄郵局？","o":{"A":"自通知之日起 10 日內","B":"自通知之日起 15 日內","C":"自通知之次日起 10 日內","D":"自通知之次日起 15 日內"},"k":"半日制","p":0,"d":"103條\n代收貨款\n郵件\n經郵局\n通知\n領取者，\n收件人\n應自通知之\n次日起\n15日內\n向指定\n郵局領取，\n逾期未領者，\n除寄件人\n預先在\n託運單或\n詳情單上\n有所聲明\n或另為聲明，\n依其聲明\n辦理外，\n應將\n該郵件\n退回\n原寄郵局。"},{"l":2,"y":113,"a":"D","c":0.86,"s":"依郵務營業規章規定，下列敘述何者錯誤？","o":{"A":"信函每件重量不得逾 2 公斤。但郵政法第六條第一項所定專營之文件不在此限","B":"新聞紙、雜誌每件重量不得逾 2 公斤","C":"國內包裹每件重量限制為 20 公斤","D":"印刷物專袋，每袋重量限制為 10 公斤以上 20 公斤以下，惟寄達之國外郵政有不同規定者依其規定"},"k":"半日制","p":0,"d":"34條\n第2項\n印刷物\n專袋，\n每袋重量\n限制為\n10公斤以上\n25公斤以下，\n惟寄達之\n國外郵政\n有不同規定者\n依其規定。"},{"l":2,"y":113,"a":"D","c":0.89,"s":"下列何者非屬交寄代收貨款郵件應付費用？","o":{"A":"普通資費","B":"其他特種資費","C":"代收貨款費","D":"轉帳匯費"},"k":"半日制","p":0,"d":"99條\n第一項\n交寄\n代收貨款郵件，\n除普通\n資費及\n其他特種\n資費外，\n每件\n另付\n代收貨款費，\n其按航空、\n限時\n寄遞\n或\n要求\n回執者，\n並應加付\n相關資費。\nㅤㅤ\n第二項\n前項\n代收貨款費\n內含\n報值費。\nㅤㅤ\n第三項\n代收貨款郵件\n免收\n轉帳匯費。"},{"l":2,"y":113,"a":"C","c":0.94,"s":"依郵務營業規章規定，代收貨款郵件，除另有規定外，如因故無法收取貨款完成投遞時，寄件人得檢具交寄憑證向郵局申請退回代收貨款費之百分之多少？","o":{"A":"30","B":"40","C":"50","D":"60"},"k":"半日制","p":0,"d":"105條\n第二項\n代收貨款郵件，\n除第214第2項規定外，\n如因故\n無法\n收取貨款\n完成投遞時，\n寄件人\n得檢具\n交寄憑證\n向郵局\n申請\n退回\n代收貨款費之\n百分之50。\nㅤㅤ\nㅤㅤ\nㅤㅤ\n214條\n第二項\n代收貨款郵件\n全部\n遺失、\n被竊或\n毀損\n應予\n補償者，\n並退還其\n代收貨款費。\n0\n1"},{"l":2,"y":113,"a":"B","c":0.76,"s":"依郵務營業規章規定，下列敘述何者正確？","o":{"A":"申請廣告回信登記，應填申請書及回信樣張二份並預存郵資。預存郵資金額由郵局視實際情形酌定，並於取消登記交還登記證一個月後，全數退還","B":"代收貨款郵件，經郵局依郵政法與郵件處理規則及郵務營業規章規定完成投遞，並收取貨款交付於寄件人者，中華郵政公司履行義務之責任即為完成","C":"寄件人交寄代收貨款郵件，應填明代收貨款金額，其填寫詳情單者，並應於封面顯明地位黏貼郵局供用之「代收貨款」藍色簽條","D":"代收貨款郵件託運單，除由郵局供用外，寄件人得依式自行印製，但不得於單上加註寄件人姓名(名稱)"},"k":"半日制","p":0,"d":"A)第一百零七條\n申請廣告回信登記，應填申請書及回信樣張二份並預存郵資。預存郵資金額由郵局視實際情形酌定，並於取消登記交還登記證二個月後，未積欠郵資者，全數退還。\n第一百零五條\nB) 1 代收貨款郵件，經郵局依郵政法與郵件處理規則及本規章規定完成投遞，並收取貨款交付於寄件人者，本公司履行義務之責任即為完成。\n2 代收貨款郵件，除第二百十四條第二項規定外，如因故無法收取貨款完成投遞時，寄件人得檢具交寄憑證向郵局申請退回代收貨款費之百分之五十。\n第一百零一條\nC)1 寄件人交寄代收貨款郵件，應填明代收貨款金額，其填寫詳情單者，並應於封面顯明地位黏貼郵局供用之「代收貨款」紅色簽條。\n2 代收貨款金額經塗改者，不予收寄。\n3 代收貨款郵件所書金額與郵局服務人員登載金額不一致者，以郵件所書金額為代收金額。\n4 代收貨款郵件所書之文字與數字金額不一致者，以文字金額為代收金額。\n第一百條\n1 寄件人交寄"},{"l":2,"y":113,"a":"A","c":0.8,"s":"依郵務營業規章規定，下列敘述何者錯誤？","o":{"A":"廣告回信用戶對其原發而經寄回之廣告回信，得拒收","B":"廣告回信原屬平常或較低資費函件，回信人改按特別處理或較高資費函件寄遞時，應將全部應付之資費預先付足，並將廣告回信標誌劃銷","C":"已由回信人付足全部郵資之廣告回信，廣告回信用戶免付手續費","D":"回信人所付郵資不足者，應補足差額並加付手續費"},"k":"半日制","p":0,"d":"111條\n第一項\n廣告回信\n寄回時，\n無須\n預付郵資。\n但回信\n原屬\n平常或\n較低資費\n函件，\n回信人\n改按特別\n處理或\n較高資費\n函件寄遞時，\n應將\n全部應付之\n資費\n預先付足，\n並將\n廣告回信\n標誌\n劃銷\n。\n第二項\n前項已由\n回信人\n付足全部\n郵資之\n廣告回信，\n廣告回信用戶\n免付手續費；\n所付郵資\n不足者，\n應補足\n差額\n並加付\n手續費。\n第三項\n廣告回信用戶\n對其原發\n而經寄回之\n廣告回信，\n不得拒收。"},{"l":2,"y":113,"a":"C","c":0.86,"s":"依郵務營業規章規定，廣告回信用戶連續幾年未使用者，郵局得撤銷其登記？","o":{"A":"1 年","B":"2 年","C":"3 年","D":"4 年"},"k":"半日制","p":0,"d":"111\n第三項\n廣告回信用戶\n有下列\n情形之一者，\n郵局\n得撤銷\n其登記：\n一、用戶\n未繳付\n郵資及\n手續費，\n經郵局\n通知後\n仍未依限\n繳付者。\n二、連續\n三年\n未使用者。\n三、地址\n遷移\n不明者。\n5\n0\n相關試題\n 22.依郵務營業規章規定，下列敘述何者錯誤？(A)存證信函留存郵局之副本，在郵局保存期限內，寄件人得交驗原執據，按申請時現行存證費交付查閱費或證明費，申請查閱或另具副本申請證明(B)存證信函經郵局收寄後，除依規定申請撤回外，寄件人不得申請更改收件人姓名及地址(C)寄件人依規定申請撤回存證信函，得將留存郵局副本同時撤回(D)存證信函在未投交收件人以前，有遺失或滅失而其原因非可歸責於寄件人者，寄件人得交驗原執據，補繕正本，由郵局重行證明，免費遞送\n #3355014\n 23.下列何者為各級郵局均可收寄之郵件？(A)國內代收貨款報值郵件、傳真郵件(B)國內代收貨款保價郵件、存證"},{"l":2,"y":113,"a":"A","c":0.57,"s":"依郵務營業規章規定，下列敘述何者錯誤？","o":{"A":"存證信函留存郵局之副本，在郵局保存期限內，寄件人得交驗原執據，按申請時現行存證費交付查閱費或證明費，申請查閱或另具副本申請證明","B":"存證信函經郵局收寄後，除依規定申請撤回外，寄件人不得申請更改收件人姓名及地址","C":"寄件人依規定申請撤回存證信函，得將留存郵局副本同時撤回","D":"存證信函在未投交收件人以前，有遺失或滅失而其原因非可歸責於寄件人者，寄件人得交驗原執據，補繕正本，由郵局重行證明，免費遞送"},"k":"半日制","p":0,"d":"A)\n第一百十七條\n1 存證信函留存郵局之副本，在郵局保存期限內，寄件人得交驗原執據，申請查閱或另具副本申請證明。原執據遺失或滅失，無法交驗者，應提供其本人身分證明文件。收件人能提供相關掛號號碼及身分證明文件證明其確為收件人時，亦得申請掣給副本證明。\n2 前項申請查閱或申請證明者，應按申請時現行存證費半數交付查閱費或證明費，用郵票或郵資券黏貼於申請書上，以郵戳蓋銷之。\n3 申請證明而內容不符者，郵局應拒絕證明，其證明費不予退還。\nB)\n第一百十九條\n 存證信函經郵局收寄後，除依規定申請撤回外，寄件人不得申請更改收件人姓名及地址。如須按新地址重行交寄者，由寄件人另作一存證信函交寄；因無法投遞退還寄件人之存證信函，須按新地址重行交寄者亦同。\nC)\n第一百二十條\n1 寄件人依規定申請撤回存證信函，得將留存郵局副本同時撤回。但作成總副本而存證信函僅撤回一部分者，其留存郵局總副本不得一併撤回。\n2 "},{"l":2,"y":113,"a":"A","c":0.65,"s":"下列何者為各級郵局均可收寄之郵件？","o":{"A":"國內代收貨款報值郵件、傳真郵件","B":"國內代收貨款保價郵件、存證信函","C":"存證信函、國內代收貨款報值郵件","D":"傳真郵件、存證信函"},"k":"半日制","p":0,"d":"112條：存證信函限在辦理該項業務之郵局交寄，但可寄至國內外任何郵路通達的地方\n刪去法後就剩A了\n我是這樣記的：存證信函要把信件副本放在郵局三年，所以辦理該業務的郵局空間要大一點、才足以容納\n不知道真正的原因是什麼，或許知道的人可以留言告訴我一下！\n考試在即祝福大家順利呀"},{"l":2,"y":113,"a":"A","c":0.82,"s":"有關寄件人申請撤回國內快捷郵件時，相關撤回費及已付之資費，下列敘述何者正確？","o":{"A":"郵件尚在原寄局者，其已付之資費全數退還，並免付撤回費","B":"郵件已離開原寄局，尚未到達投遞局者，扣除國內包裹往返資費後退還餘額，應付撤回費。但原付資費不足扣抵者，免予補收包裹資費","C":"郵件已到達投遞局，尚未投遞者，免付撤回費，其已付之資費扣除國內包裹往返資費後，退還餘額。但原付資費不足扣抵者，免予補收包裹資費","D":"申請撤回之國內快捷郵件係報值者，於扣除國內包裹資費時，其已付之報值費應予退還"},"k":"半日制","p":0,"d":"第七十二條之一\n1 寄件人申請撤回國內快捷郵件時，相關撤回費及已付之資費，依下列規定辦理：\nA: 一、郵件尚在原寄局者，其已付之資費全數退還，並免付撤回費。\nB: 二、郵件已離開原寄局，尚未到達投遞局者，扣除國內包裹往返資費後退還餘額，並免付撤回費。但原付資費不足扣抵者，免予補收包裹資費。\nC: 三、郵件已到達投遞局，尚未投遞者，應付撤回費，其已付之資費扣除國內包裹往返資費後，退還餘額。但原付資費不足扣抵者，免予補收包裹資費。\nD: 2 申請撤回之國內快捷郵件係報值者，於扣除國內包裹資費時，其已付之報值費，不予退還。"},{"l":2,"y":113,"a":"B","c":0.94,"s":"依郵務營業規章規定，下列何者非屬郵件之交寄處所？","o":{"A":"郵政代辦所","B":"物流業者","C":"i 郵箱","D":"經郵局委託之人"},"k":"半日制","p":0,"d":"122條\n郵件應\n依規定\n分別\n向下列之\n郵局或\n受本公司\n委託者\n或\n收受郵件\n專用器具\n交寄：\n一、 郵局。 \n二、 郵政\n代辦所。 \n三、 郵票\n代售處。 \n四、 郵局\n所設之\n信箱、\n信筒、\ni郵箱或\n其他\n收受郵件\n專用器具。 \n五、 其他經\n郵局\n委託之人。 \n0\n1\n相關試題\n 27.有關函件之封面書寫規定，下列敘述何者錯誤？(A)函件除小包及包裹外，應於郵件封面上註明種類以供辨認(B)函件未註明種類者，應按信函付費交寄(C)郵局服務人員為核對郵資，於必要時，得經寄件人或收件人同意拆驗函件之內件，並予驗訖證明(D)寄往國外函件之封面，應以國際郵務通用之法文或英文註明函件種類或寄遞方式\n #3355019\n 28.有關郵件封面書寫之敘述，下列何者錯誤？(A)郵件應分別書寫收件人、寄件人之姓名、詳細地址及郵遞區號(B)字體長寬大於 4 毫米，字跡應清晰(C)寄件人指定投遞地區或行"},{"l":2,"y":113,"a":"A","c":0.71,"s":"有關函件之封面書寫規定，下列敘述何者錯誤？","o":{"A":"函件除小包及包裹外，應於郵件封面上註明種類以供辨認","B":"函件未註明種類者，應按信函付費交寄","C":"郵局服務人員為核對郵資，於必要時，得經寄件人或收件人同意拆驗函件之內件，並予驗訖證明","D":"寄往國外函件之封面，應以國際郵務通用之法文或英文註明函件種類或寄遞方式"},"k":"半日制","p":0,"d":"第一百二十三條\nA.B:1 函件除信函及明信片外，應於封面上註明種類以供辨認；未註明者，按信函付費交寄。\nC:2 郵局服務人員為核對郵資，於必要時，得經寄件人或收件人同意拆驗函件之內件，並予驗訖證明。\nD:3 寄往國外函件之封面，應以國際郵務通用之法文或英文註明函件種類或寄遞方式（見附表二）。"},{"l":2,"y":113,"a":"D","c":0.77,"s":"有關郵件封面書寫之敘述，下列何者錯誤？","o":{"A":"郵件應分別書寫收件人、寄件人之姓名、詳細地址及郵遞區號","B":"字體長寬大於 4 毫米，字跡應清晰","C":"寄件人指定投遞地區或行業之大宗郵件，經郵局同意，得免書寫收件人姓名、地址及郵遞區號","D":"寄往國外之郵件封面以外國文字書寫者，應附註收件人中文地址及郵遞區號"},"k":"半日制","p":0,"d":"第一百二十四條\nA.B.C:1 郵件應分別書寫收件人、寄件人之姓名、詳細地址及郵遞區號，字體長寬大於四毫米，字跡應清晰。但寄件人指定投遞地區或行業之大宗郵件，經郵局同意，得免書寫收件人姓名、地址及郵遞區號。\n2 國內互寄之郵件封面以外國文字書寫者，應附註收件人中文地址及郵遞區號。\nD:3 寄往國外郵件封面，應以英文或寄達國通用文字書寫，以寄達國文字書寫者，國名應加註英文；其以中文書寫者，僅寄達國通行者為限。\n4 國內互寄郵件封面未書寫收件人郵遞區號或書寫錯誤，致無法使用自動化設備分揀處理者，郵局得延後處理，或退還寄件人補正後再寄。"},{"l":2,"y":113,"a":"D","c":0.75,"s":"有關橫式信封書寫規定，下列何者正確？","o":{"A":"收件人郵遞區號、地址、姓名依序分行書寫於信封中間偏左位置","B":"寄件人郵遞區號、地址、姓名書於右上角","C":"寄件人郵遞區號、地址、姓名可書於背面右上角","D":"寄國外者，依各國規定書寫"},"k":"半日制","p":0,"d":"第一百二十六條\n 郵件封面應依下列規定書寫：\n 一、直式信封直寫者：收件人地址書於右側，郵遞區號書於右上角紅框格內，姓名書於中間位置；寄件人姓名、地址書於左下側，郵遞區\n號書於左下角紅框格內。\nA.B.D 二、橫式信封橫寫者：收件人郵遞區號、地址、姓名依序分行書寫於信封中間偏右位置；寄件人郵遞區號、地址、姓名書於左上角。但寄國外者，依各國規定書寫。\n.\nC沒看到規章裡有提及"},{"l":2,"y":113,"a":"D","c":0.84,"s":"郵件封面除書寫姓名、地址及郵遞區號外，另應保留空白，有關其用途之敘述，下列何者錯誤？","o":{"A":"黏貼郵票","B":"黏貼簽條","C":"註明郵務事項","D":"得劃為數格，備供續書姓名地址"},"k":"半日制","p":0,"d":"127條\n郵件封面\n除書寫\n姓名、\n地址及\n郵遞區號外，\n應保留\n空白，\n以備\n黏貼郵票、\n簽條或\n註明\n郵務事項\n之用。\n函件\n封面\n劃為數格，\n意圖\n備供\n續書\n姓名地址者，\n不予收寄；\n其由\n寄件人\n自行投入\n信箱信筒者，\n退還\n寄件人，\n無法\n退還時，\n經原寄\n郵局\n招領揭示\n期滿後，\n依無著\n郵件之\n規定處理。\n已使用\n並留有\n前次\n收寄件人\n相關資料、\n所蓋郵戳\n或所貼\n郵票、條碼\n之封套或\n箱匣，\n應予清除\n或覆蓋後\n始得使用。"},{"l":2,"y":113,"a":"C","c":0.86,"s":"寄件人交寄之封套或箱匣為已使用過並留有前次收寄件人相關資料、所蓋郵戳或所貼郵票、條碼者，郵局人員之正確處理方式為何？","o":{"A":"可予收寄","B":"逕予拒絕收寄","C":"封套或箱匣先請寄件人清除或覆蓋後始得收寄","D":"延後處理"},"k":"半日制","p":0,"d":"這題考查的是中華郵政關於「舊包材重複使用（綠色環保精神）」與「郵務自動化/人工辨識安全」之間的折衷實務規範：\n法規依據\n：\n依據\n《中華郵政股份有限公司郵務營業規章》第 127 條第 3 項\n規定，已使用並留有前次所蓋郵戳或所貼郵票之封套，不得重行使用。其目的在於避免舊的資訊造成郵差投遞、機器分揀（讀取舊條碼、舊郵遞區號）的錯誤，同時防止重複使用郵票的違法行為。\n [\n1\n, \n2\n]\n實務與考試標準處理方式\n：\n為了響應環保（如\n郵局便利箱重複使用可折抵郵資\n的政策），郵局並不會採取直接拒絕收寄的強硬態度。\n正確做法\n：郵局臨櫃人員會採取\n輔導、協助\n的立場，\n要求寄件人必須先用立可帶、麥克筆、或是貼紙，將前次的收寄件人姓名地址、舊郵戳、舊郵票以及最重要的「舊條碼」徹底清除或覆蓋（塗黑）\n。\n收寄前提\n：等到封面上只剩下這一次完整且乾淨的新寄送資訊後，郵局才會正式予以收寄。\n [\n1\n,"},{"l":2,"y":113,"a":"B","c":0.96,"s":"郵件未妥為封裝，致發生污毀其他郵件、郵政設備、交通運輸工具或傷害郵局服務人員者，下列何者應負損害賠償責任？","o":{"A":"郵局收寄人員","B":"寄件人","C":"收件人","D":"郵局收寄人員之主管"},"k":"半日制","p":0,"d":"第一百二十八條\n寄件人應依郵件種類、性質及重量，妥為封裝，以維護郵件、郵政設備及郵局服務人員之安全及衛生，郵件雖經郵局收寄，寄件人仍不免除其責任。\n郵件未妥為封裝，致發生污毀其他郵件、郵政設備、交通運輸工具或傷害郵局服務人員者，寄件人應負損害賠償責任。"},{"l":2,"y":113,"a":"D","c":0.65,"s":"下列何種函件必須裝入封套並緘封交寄？","o":{"A":"明信片","B":"硬紙片作成者","C":"郵簡","D":"印刷物"},"k":"半日制","p":0,"d":""},{"l":2,"y":113,"a":"C","c":0.95,"s":"下列何者不得作為郵件封裝之紙料使用？","o":{"A":"堅韌不透明之白色紙料","B":"堅韌不透明之牛皮紙料","C":"報紙、廣告紙","D":"經中華郵政公司同意之材質"},"k":"半日制","p":0,"d":"章 \n第一百三十條\n1 郵件不得使用釘書機或安全鈕扣封裝。除明信片、郵簡、硬紙片作成及成捲者外，其餘函件應裝入封套並緘封交寄。\n2 用於郵件封裝之紙料，應使用堅韌不透明之白色或牛皮紙料，或經本公司同意之材質。\n3 郵件封裝不符前二項規定者，郵局得延後處理。"},{"l":2,"y":113,"a":"D","c":0.81,"s":"寄件人使用透明口洞信封，下列可以收寄之情形為何？","o":{"A":"透明紙在燈光下有反光者","B":"信封完全透明者","C":"信封口洞無透明紙保護者","D":"有 2 個透明口洞者"},"k":"半日制","p":0,"d":""},{"l":2,"y":113,"a":"C","c":0.76,"s":"依郵務營業規章規定，寄件人同時交寄大宗各類掛號郵件至少達幾件以上，得使用大宗掛號郵件執據存根聯單 1 式 2 份，交郵局查點、簽章並加蓋郵戳後，退還 1 份，作為執據？","o":{"A":"3 件","B":"4 件","C":"5 件","D":"10 件"},"k":"半日制","p":0,"d":"134條\n寄件人\n交寄\n各類\n掛號郵件時，\n應由\n郵局\n掣給執據。\n寄件人\n同時\n交寄\n大宗各類\n掛號郵件\n五件以上者，\n使用\n大宗掛號\n郵件\n執據\n存根聯單\n一式二份，\n交郵局\n查點、簽章\n並加蓋\n郵戳後，\n退還一份，\n作為執據。\n註明\n「投交\n收件人\n親收」之\n國際\n掛號函件，\n其執據\n應由郵局\n加蓋\n戳記\n標明。\n報值、保價\n或代收\n貨款郵件，\n郵局\n服務人員\n應將\n報值、保價或\n代收貨款\n金額\n於執據上\n註明之。"},{"l":2,"y":113,"a":"B","c":0.73,"s":"依郵務營業規章規定，寄件人一次交寄之函件(小包、包裹及快捷郵件除外)至少達幾件以上且種類相同者，得依規定交付資費後，由郵局逐件加蓋「郵資已付」戳記，為交付資費之證明？","o":{"A":"100 件","B":"20 件","C":"10 件","D":"5 件"},"k":"半日制","p":0,"d":"第一百五十四條\n1 郵局得使用「郵資已付」戳記，證明資費已付。\n2 寄件人一次交寄之函件在二十件以上且種類相同者，得依規定交付資費後，由郵局逐件加蓋「郵資已付」戳記，為交付資費之證明。但小包、包裹及快捷郵件之寄件人，不受上述交寄件數之限制。"},{"l":2,"y":113,"a":"B","c":0.76,"s":"依郵務營業規章規定，無法投遞或按規定不予寄遞而不能退還寄件人之郵件，應由原寄局招領揭示多久，逾期無人領取者即稱為無著郵件？","o":{"A":"15 日","B":"1 個月","C":"3 個月","D":"6 個月"},"k":"半日制","p":0,"d":"第二百零三條\n1 無法投遞或按規定不予寄遞而不能退還寄件人之郵件，應由原寄局招領揭示一個月，逾期無人領取者為無著郵件。\n2 寄件人聲明拋棄或無法投遞免退回者，視為無著郵件。"},{"l":2,"y":113,"a":"A","c":0.77,"s":"依郵務營業規章規定，國際掛號函件全部遺失或被竊之補償金額，每件依國際貨幣基金特別提款權(SDR)之多少計算單位，計算其補償金額？","o":{"A":"(SDR)30 計算單位","B":"(SDR)40 計算單位","C":"(SDR)60 計算單位","D":"(SDR)150 計算單位"},"k":"半日制","p":0,"d":"第二百十一條\n1 包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，依下列規定：\n 一、國內掛號函件，每件為新臺幣五百七十五元。\n 二、國際掛號函件，每件依國際貨幣基金特別提款權（SDR）三十計算單位，計算其補償金額。\n 三、國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權（SDR）一百五十計算單位，計算其補償金額。"},{"l":2,"y":113,"a":"C","c":0.68,"s":"依郵務營業規章規定，郵件存局候領期間之規定，下列敘述何者錯誤？","o":{"A":"國內郵件存局候領期間，以候領之次日起算 15 日為限，但收件人得以書面申請延長至 1 個月","B":"國內快捷郵件存局候領期間，自候領之次日起算，以 5 日為限，但收件人得以書面申請延長至 1 個月","C":"國際郵件存局候領期間，以候領之次日起算 1 個月為限，但收件人得以書面申請延長至 2 個月","D":"存局候領之國際郵件，自候領之次日起算 15 日內，免付保管費。逾期者，除函件免付費外，其他郵件按逾期日數交付逾期保管費"},"k":"半日制","p":0,"d":"第一百八十八條\nA:1 國內郵件存局候領期間，以候領之次日起算十五日為限，但收件人得以書面申請延長至一個月。逾期未領者，依無法投遞郵件之規定處理。\n2 寄件人於前項期限內申請提前退回或於封面上註明留存幾日無人領取即退回字樣者，郵局應依其申請或註記辦理。\nB:3 存局候領之國內快捷郵件，自候領之次日起算，以五日為限，逾期未領者依第一項後段之規定辦理。但收件人得以書面申請延長至一個月。\n4 前三項情形之郵件，依規定應補收逾期保管費、退回費者，於退回時向寄件人補收之。\n第一百八十八條之一\nD:1 存局候領之國際郵件，自候領之次日起算十五日內，免付保管費。逾期者，除函件免付費外，其他郵件比照第五十六條第三項規定，按逾期日數交付逾期保管費。\nC:2 國際郵件存局候領期間，以候領之次日起算二個月為限。逾期未領者，依無法投遞郵件之規定處理。"},{"l":2,"y":113,"a":"A","c":0.62,"s":"有關欠資郵件之投遞規定，下列何者錯誤？","o":{"A":"未付資費之國內欠資郵件，於投遞時，向收件人收取欠資差額及欠資手續費","B":"未付足資費之欠資郵件，除另有規定外，於投遞時，向收件人收取欠資差額及欠資手續費","C":"寄往國外之欠資函件，退還寄件人補足資費差額","D":"寄往國外之欠資函件，無法退還寄件人時，除信函及明信片按欠資函件寄發外，其他函件不予寄遞，招領揭示期滿依無著郵件處理"},"k":"半日制","p":0,"d":"第一百七十八條\nA:1 未付資費之國內欠資郵件，契約自始不成立，退還寄件人，並依下列規定辦理：\n 一、經寄件人補付資費者，得由寄件人申請將該郵件再向收件人投遞。\n 二、無法退還寄件人者，不予寄遞，於招領揭示期滿後，依無著郵件規定處理。\nB:2 未付足資費之欠資郵件，除另有規定外，於投遞時，向收件人收取欠資差額及欠資手續費。\n第一百八十條\nC.D:1 寄往國外之欠資函件，退還寄件人補足資費差額。無法退還時，除信函及明信片作欠資函件寄發外，其他函件不予寄遞，於招領揭示期滿後，依無著郵件規定處理。\n2 大批交寄之國際信函及明信片，資費不足，無法退還寄件人補付者，不予寄遞，於招領揭示期滿後，作無著郵件處理。"},{"l":2,"y":113,"a":"C","c":0.77,"s":"有關「無著郵件」之相關敘述，下列何者錯誤？","o":{"A":"寄件人聲明拋棄或無法投遞免退回者，視為無著郵件","B":"無著郵件由中華郵政公司指定之郵局拆閱處理，能獲知寄件人地址者，即將原件裝入特製封套，退還寄件人","C":"無法退還之無著郵件，係無價值或不得為買賣標的者，自郵件交寄日起屆滿查詢期限 6 個月後銷燬","D":"無法退還之無著郵件，係有價值或得為買賣標的者，自郵件交寄日起滿 3 年無人認領者變賣之"},"k":"半日制","p":0,"d":"第二百零三條\n1 無法投遞或按規定不予寄遞而不能退還寄件人之郵件，應由原寄局招領揭示一個月，逾期無人領取者為無著郵件。\nA:2 寄件人聲明拋棄或無法投遞免退回者，視為無著郵件。\n第二百零四條\nB:1 無著郵件由本公司指定之郵局拆閱處理，能獲知寄件人地址者，即將原件裝入特製封套，退還寄件人；無法退還者，按下列規定處理：\nC: 一、內裝文件或物品係無價值或不得為買賣標的者，自郵件交寄日起屆滿查詢期限一個月後銷燬之。其性質易於腐壞或不能久存者，得由郵局隨時銷燬之。\nD: 二、內裝文件或物品係有價值或得為買賣標的者，自郵件交寄日起滿三年無人認領者，即變賣之；其性質易於腐壞不能久存或數量有消減之虞者，得先行變賣，並將價款保存至郵件交寄日起滿三年為止。\n2 前項退還寄件人之郵件，如原件為欠資郵件或按規定應補付郵資差額或另付資費者，於投交時向寄件人收取。"},{"l":2,"y":113,"a":"B","c":0.71,"s":"限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致者，下列補償金額何者錯誤？","o":{"A":"限時郵件及國內快捷郵件，依所收取之全部資費補償","B":"國際快捷郵件，依所收取之全部資費補償","C":"國際快捷郵件，依所收取全部資費之 50%補償","D":"作為補償金額之資費均不含報值費、保價費、代收貨款費及回執費"},"k":"半日制","p":0,"d":"#211\n3 限時郵件、快捷郵件遞送延誤，經查明為本公司之過失所致者，其補償金額如下：\nA: 一、限時郵件及國內快捷郵件，依所收取之全部資費補償。\nB.C: 二、國際快捷郵件，依所收取全部資費之百分之五十補償。\nD:5 前二項之資費均不含報值費、保價費、代收貨款費及回執費。"},{"l":2,"y":113,"a":"D","c":0.82,"s":"有關公眾郵資機之使用規定，下列敘述何者錯誤？","o":{"A":"客戶得向郵局申請核發郵資機使用登記證","B":"寄件人一次交寄 20 件以上(小包 10 件以上)且種類相同之函件，得將郵資總數彙印郵資券，連同郵件交由郵局收寄人員核驗後，貼於大宗函件彙計郵資單查證聯上","C":"郵件所貼郵資券金額逾郵件資費者，不得要求郵局找補現金","D":"使用郵資機之郵件，自行投入信箱、信筒、i 郵箱或其他收受郵件專用器具即可"},"k":"半日制","p":0,"d":"第一百五十七條\n1 寄件人交寄郵件，得貼用郵資機印出之符誌，證明郵資已付。\nA:2 客戶使用郵資機，應填具申請書向郵局申請核發使用登記證。\n第一百五十八條\nB:1 郵資機印出之符誌，應印於郵件封面或印於空白郵資券再黏貼於郵件封面上。但寄件人一次交寄之函件二十件以上(小包十件以上)且種類相同者，得將郵資總數彙印郵資券，連同郵件交由郵局收寄人員核驗後，貼於大宗函件彙計郵資單查證聯上，並由郵局在相關函件上加蓋「郵資已付」戳記。\nC:2 郵資機印出之符誌，不得以任何方式抵作現金使用；其一經使用後，視為蓋銷之郵票。\nD:第一百五十九條\n 使用郵資機之郵件應向指定之郵局交寄；其自行投入信箱、信筒、i 郵箱或其他收受郵件專用器具者，按欠資郵件處理。"},{"l":2,"y":113,"a":"D","c":0.77,"s":"租用專用信箱或信袋之相關規定，下列敘述何者錯誤？","o":{"A":"專用信箱或專用信袋租金按季計算，至少預付半年","B":"寄交專用箱袋租用人或由其轉交之掛號郵件，領取時，應蓋用租箱時印鑑單上所留之印鑑或簽名","C":"非掛號郵件，均投置箱袋內，由租用人自行開取","D":"利用專用信箱或專用信袋從事非法行為者，郵局得終止其租約，退還租用人預付之租金及鎖鑰保證金"},"k":"半日制","p":0,"d":"第一百九十一條\nA:1 專用信箱或專用信袋租金按季計算，至少預付半年，起租或停租時不滿一季者，其畸零日數按月計算。中途停租，其已付之款項，應扣除本季已租用月份之租金後退還之。\n2 租用專用信箱或專用信袋應交存鎖鑰保證金，於停租並交回鑰匙時退還之。\n第一百九十四條\n1 書明專用箱袋號數之郵件，無論是否書有收件人地址，郵局依下列規定處理：\nC: 一、非掛號郵件，均投置箱袋內，由租用人自行開取。\n二、掛號郵件，郵局僅將通知單或書有「掛號郵件待領」字樣之小牌投置箱袋內，由租用人憑前條第一項印鑑單上之印鑑或簽名領取，未\n領取前，寄件人仍得申請撤回。\n2 前項郵件，係限時或快捷郵件並書有專用箱袋號數及收件人地址者，除依規定逕予招領或另有特別約定者外，無論是否掛號，均按址投遞。\n3 第一項待領之掛號郵件，專用信箱或專用信袋租用人得比照第一百七十七條規定申請改投遞。\n第一百九十五條\nB: 前條寄交專用箱袋"},{"l":2,"y":113,"a":"C","c":0.72,"s":"有關郵件之特約記帳戶規定，下列敘述何者錯誤？","o":{"A":"寄件人應以相當於 1 個月交寄郵件所需郵資之金額預存於郵局","B":"於交寄時當場交付郵資者，或快捷郵件及包裹之訂約戶取具保證者，得經郵局同意免交預存郵資","C":"特約記帳戶郵資應於次月底以前付清","D":"特約記帳戶預存郵資數額，須依郵資之增減隨時調整"},"k":"半日制","p":0,"d":"第一百五十六條\nA.B.C:1 與郵局簽訂特約記帳戶之寄件人，應以相當於一個月交寄郵件所需郵資之金額預存於郵局，逐月結算郵資並於次月二十日以前付清。但於申請許可登記時聲明交寄時當場交付郵資者，或快捷郵件及包裹之訂約戶取具保證者，得經郵局同意免交預存郵資。\nD:2 前項預存金數額，依郵資之增減隨時調整，於註銷登記郵資付清時退還之。\nㅤㅤ"},{"l":2,"y":113,"a":"C","c":0.88,"s":"平常郵件應按址投遞或投入受信箱內，遇例外情況得將郵件投交收件人或投遞於收件地址適當位置。下列何者非屬於上述例外情況？","o":{"A":"郵件體積過大","B":"收件地址未裝設受信箱","C":"收件人拒絕受領郵件","D":"無法投入受信箱者"},"k":"半日制","p":0,"d":"第一百六十二條\n 按址投遞地區之郵件依下列方式投遞：\nABD 一、平常郵件於按址投遞區域應按郵件封面所書地址投遞，收件地址裝設有受信箱者，將郵件投入受信箱內。郵件體積過大、收件地址未裝設受信箱或無法投入受信箱者，郵件應投交收件人或投遞於收件地址適當位置。"},{"l":2,"y":113,"a":"D","c":0.72,"s":"甲君至郵局交寄掛號信函 1 件(無報值保價)，郵資 NT$36，內裝市價 NT$3,600 金飾，因郵政公司之過失不慎遺失，寄件人得請求之補償金額為多少？","o":{"A":"NT$3,600","B":"NT$3,600 加郵資 NT$36","C":"NT$575 加郵資 NT$36","D":"NT$575"},"k":"半日制","p":0,"d":"第二百十一條\n1 包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，依下列規定：\n 一、國內掛號函件，每件為新臺幣五百七十五元。\n 二、國際掛號函件，每件依國際貨幣基金特別提款權（SDR）三十計算單位，計算其補償金額。\n 三、國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權（SDR）一百五十計算單位，計算其補償金額。"},{"l":2,"y":113,"a":"C","c":0.74,"s":"有關 i 郵箱業務之敘述，下列何者正確？","o":{"A":"掛號郵件有不予投入 i 郵箱之情形者，郵件得逕送交指定郵局招領","B":"掛號郵件經投入 i 郵箱，即視為已領取","C":"收件人開箱後，如將掛號郵件留置 i 郵箱內，不影響該郵件已妥投之效力","D":"收件人未於期限內領取之掛號郵件，經自 i 郵箱取出送往指定郵局招領者，扣除 i 郵箱待領日數後郵件招領期限為 15 天"},"k":"半日制","p":0,"d":"第二百十九條\nA:5 前項情形經郵局通知收件人後，掛號郵件得改以收件人同意之方式或本規章規定之方式投遞。但以能通知者為限，不能通知時，郵件得送交指定郵局招領。\n.\n第二百二十條\n1 以 i 郵箱提供掛號郵件投遞服務時，應通知收件人下列事項：\n 一、郵件號碼、取件方式及所需資訊。\n 二、i 郵箱的設置地點。\nB:2 掛號郵件經投入 i 郵箱，即視為已送達。收件人開啟 i 郵箱，使郵件處於得取出之狀態，即視為已領取，並以開箱時間為妥投時間。\nC:3 收件人開箱後，如將掛號郵件留置 i 郵箱內，不影響該郵件已妥投之效力。\n4 投入 i 郵箱之掛號郵件未經收件人領取前，寄件人仍得申請撤回，但代收貨款郵件以收件人未付款者為限。\n.\n第二百二十一條\n1 掛號郵件經投入 i 郵箱，收件人未於投入之次日起算二日內領取者，本公司得於前述待領期限屆滿之次日起取出郵件，送交指定郵局招領，並通知收件人前往領取。代"},{"l":2,"y":115,"a":"C","c":0.98,"s":"甲為 12 歲之學生，於中華郵政公司設於學校內之智慧型收受郵件專用器具(i 郵箱)完成交寄郵件，依郵政 法規定，其行為之法律效力為何？","o":{"A":"應經甲之父母同意，始生效力","B":"應由甲之老師陪同交寄，始生效力","C":"視為有行為能力人之行為而有效","D":"無效"},"k":"外勤","p":0,"d":"第 12 條\n無行為能力人或限制行為能力人，關於郵政事務對中華郵政公司所為之行為，視為有行為能力人之行為。"},{"l":2,"y":115,"a":"B","c":0.77,"s":"依郵務營業規章規定，下列何者非屬中華郵政公司經營之基本郵件業務？","o":{"A":"電子函件","B":"掛號郵件","C":"包裹","D":"盲人文件"},"k":"半日制","p":0,"d":"第四條\n基本郵件：\n一、信函。\n二、明信片。\n三、郵簡。\n四、印刷物。\n五、盲人文件。\n六、電子函件。\n七、小包。\n八、包裹。\nㅤㅤ\n第五條\n特種郵件：\n一、航空郵件。\n二、限時郵件、可追蹤函件、快捷郵件。\n三、\n掛號郵件。\n四、報值郵件。\n五、保價郵件。\n六、代收貨款郵件。\n七、廣告回信。\n八、存證信函。\n九、傳真函件。\n十、未來郵件。"},{"l":2,"y":115,"a":"B","c":0.91,"s":"依郵務營業規章規定，下列何者非屬中華郵政公司經營之特種郵件業務？","o":{"A":"快捷郵件","B":"郵簡","C":"限時郵件","D":"航空郵件"},"k":"半日制","p":0,"d":"第四條\n基本郵件：\n一、信函。\n二、明信片。\n三、\n郵簡。\n四、印刷物。\n五、盲人文件。\n六、電子函件。\n七、小包。\n八、包裹。\nㅤㅤ\n第五條\n特種郵件：\n一、航空郵件。\n二、限時郵件、可追蹤函件、快捷郵件。\n三、掛號郵件。\n四、報值郵件。\n五、保價郵件。\n六、代收貨款郵件。\n七、廣告回信。\n八、存證信函。\n九、傳真函件。\n十、未來郵件。"},{"l":2,"y":115,"a":"A","c":0.79,"s":"依郵務營業規章規定，有關國內明信片之規格，下列敘述何者錯誤？","o":{"A":"紙張須以每平方公尺一百八十公克以上，且不逾二百六十公克","B":"紙張以白色紙料印製","C":"尺寸最大者為十四公分八毫米乘十公分五毫米","D":"尺寸最小者十四公分乘九公分"},"k":"半日制","p":0,"d":"基本郵件業務\n第十三條：\n明信片指書寫於單一紙片上，不加封套交寄，並依本公司公告之紙質、規格製作之文件。\n國內明信片規格應為長方形，並須以\n每平方公尺一百八十公克以上，且不逾二百五十公克\n之白色紙料印製，其尺寸最大者為十四公分八毫米乘十公分五毫米，最小者十四公分乘九公分。國際明信片規格應依萬國郵政公約之規定。許可差均為二毫米。\n明信片紙張表面應平整光滑，不得有突出部分。\n本公司得發行印有郵資符誌之郵政明信片。國外明信片應為橫式，並加印國際郵務通用之法文或英文郵政明信片字樣。國內橫式明信片得補足郵資差額，作國外明信片使用。"},{"l":2,"y":115,"a":"C","c":0.91,"s":"依郵務營業規章規定，國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按下列何者寄遞？","o":{"A":"印刷物","B":"小包","C":"信函","D":"包裹"},"k":"半日制","p":0,"d":"第十九條\n郵簡\n夾寄\n任何附件時，依\n下列方式處理：\n一、\n國內\n郵簡，\n應劃去\n「郵簡」字樣，\n改按\n信函\n寄遞。\nㅤㅤ\nㅤㅤ\n二、\n國際\n航空郵簡，\n經退還\n寄件人\n補足\n航空\n信函\n資費者，\n得劃去\n「航空郵簡」字樣\n及其同義之\n國際郵務通用文字，\n改按\n航空\n信函寄遞；\n無法退還者，\n應\n劃去「航空郵簡」字樣\n及其同義之\n國際郵務通用文字，\n改按\n水陸郵路寄遞。\n無法\n按水路郵路寄遞者，\n改按\n欠資信函\n寄遞。"},{"l":2,"y":115,"a":"C","c":0.92,"s":"依郵務營業規章規定，型錄指文件內容百分之幾以上為商品或服務之價格、功能、規格及使用方式，以文字、照片或圖片方式印製者？","o":{"A":"30","B":"40","C":"50","D":"60"},"k":"半日制","p":0,"d":"第二十九條\n書籍指新聞紙、雜誌、型錄以外，裝訂成冊之圖書冊籍。\n型錄指文件內容\n百分之五十\n以上為商品或服務之價格、功能、規格及使用方式，以文字、照片或圖片方式印製者。"},{"l":2,"y":115,"a":"A","c":0.9,"s":"依郵務營業規章規定，非當期雜誌，但零星補寄在多少件以內，並於封面註明「補寄」字樣者，得按雜誌付費交寄？","o":{"A":"100 件","B":"200 件","C":"300 件","D":"400 件"},"k":"半日制","p":0,"d":""},{"l":2,"y":115,"a":"C","c":0.78,"s":"依郵務營業規章規定，同日同一收件人之印刷物總重量超過多少公斤者？得通知收件人至郵局領取。收件人應自通知之次日起幾日內至指定郵局領取？","o":{"A":"5 公斤、10 日","B":"10 公斤、10 日","C":"5 公斤、15 日","D":"10 公斤、15 日"},"k":"半日制","p":0,"d":"第三十三條\n同日同一收件人之印刷物總重量超過\n五公斤\n者，得通知收件人至郵局領取。 \n前項招領之印刷物，收件人應自通知之次日起\n十五日\n內至指定郵局領取，逾期未領者，應按逾期日數交付逾期保管費，如無法投遞退回時，向寄件人收取之。"},{"l":2,"y":115,"a":"C","c":0.69,"s":"依郵務營業規章規定，寄往國外同一地址同一收件人之多件印刷物，得裝袋按印刷物專袋交寄。印刷物專袋，每袋重量限制為多少公斤範圍內？惟寄達之國外郵政有不同規定者依其規定。","o":{"A":"五公斤以上二十公斤以下","B":"五公斤以上二十五公斤以下","C":"十公斤以上二十五公斤以下","D":"十公斤以上三十公斤以下"},"k":"半日制","p":0,"d":"第三十四條\n1-\n寄往國外\n同一地址\n同一收件人之\n多件印刷物，\n得裝袋\n按印刷物專袋交寄。\n2-\n印刷物專袋，\n每袋重量限制\n為十公斤以上二十五公斤以下，\n惟寄達之國外郵政\n有不同規定者\n依其規定(見附表一)。"},{"l":2,"y":115,"a":"C","c":0.86,"s":"依郵務營業規章規定，電子函件之郵寄資費包括下列何種費用？","o":{"A":"郵資及列印費","B":"郵資及工本費","C":"郵資及特別處理費","D":"郵資及人事費"},"k":"半日制","p":0,"d":""},{"l":2,"y":115,"a":"A","c":0.86,"s":"依郵務營業規章規定，國內包裹每件重量限制為多少公斤？其尺寸最大限度為長寬高三邊合計不得大於多少公分？","o":{"A":"20 公斤、150 公分","B":"20 公斤、200 公分","C":"30 公斤、150 公分","D":"30 公斤、200 公分"},"k":"半日制","p":0,"d":""},{"l":2,"y":115,"a":"D","c":0.85,"s":"依郵務營業規章規定，包裏應按下列何者情況妥為封裝？ A.內裝物性質 B.途程遠近 C.運輸狀況","o":{"A":"僅 A","B":"僅 B","C":"僅 C","D":"ABC"},"k":"半日制","p":0,"d":"四十九條\n第一項前段\n包裹應按\n內裝物性質、\n途程遠近\n及運輸狀況\n妥為封裝，\n除本規章有關封裝之規定外，\n並依下列規定辦理：\n一、數件物品\n未經包裝或密封為一件者，\n不得交寄。\n二、金銀貴重物品\n及金屬物\n或笨重之物品，\n應使用堅固之\n金屬、木質或\n玻璃纖維箱匣裝寄，\n並以木屑、棉花或海棉\n等物充塞之，\n木質箱匣之木板厚度\n至少 1 公分。\n包裹重逾10 公斤者，\n木板厚度至少應為 1.5 公分，\n多層夾板製成之箱匣，\n四角包以金屬者，\n木板厚度可減至 0.5 公分。\n5\n1"},{"l":2,"y":115,"a":"B","c":0.91,"s":"依郵務營業規章規定，代收貨款郵件，除本規章其他項規定外，如因故無法收取貨款完成投遞時，寄件人得檢具交寄憑證向郵局申請退回代收貨款費百分之多少？","o":{"A":"40","B":"50","C":"55","D":"60"},"k":"半日制","p":0,"d":"第一百零五條\n代收貨款郵件，經郵局依郵政法與郵件處理規則及本規章規定完成投遞，並收取貨款交付於寄件人者，本公司履行義務之責任即為完成。\n代收貨款郵件，除第二百十四條第二項規定外，如因故無法收取貨款完成投遞時，寄件人得檢具交寄憑證向郵局申請退回代收貨款費之\n百分之五十\n。"},{"l":2,"y":115,"a":"D","c":0.79,"s":"依郵務營業規章規定，廣告回信用戶，郵局得撤銷其登記之情形，下列敘述何者錯誤？","o":{"A":"用戶未繳付郵資及手續費，經郵局通知後仍未依限繳付者","B":"連續三年未使用者","C":"地址遷移不明者","D":"連續二年未使用者"},"k":"半日制","p":0,"d":"第111條\n第一項\n廣告回信\n應\n按照郵局同意登記\n之\n回信信封、明信片或貼紙上\n所印之\n用戶名稱、地址\n及郵遞區號\n寄遞，\n用戶名稱\n如經塗改，\n依欠資郵件規定處理。\nㅤ\n廣告回信用戶地址\n如有變更，\n應立即向郵局\n辦理變更移轉\n或取消登記手續。\n第二項\n廣告回信用戶\n有下列情形之一者，\n郵局得撤銷其登記：\n一、用戶\n未繳付\n郵資\n及手續費，\n經郵局通知後\n仍未依限繳付者。\n二、連續三年\n未使用者。\n三、地址\n遷移\n不明者。\n9\n1"},{"l":2,"y":115,"a":"D","c":0.74,"s":"依郵務營業規章規定，未來郵件之保管期限最短及最長各為多久？","o":{"A":"最短 10 日，最長不逾 20 年","B":"最短 10 日，最長不逾 30 年","C":"最短 15 日，最長不逾 20 年","D":"最短 15 日，最長不逾 30 年"},"k":"半日制","p":0,"d":"120條之2\n第一項\n未來郵件之保管期限\n最短15日，\n最長不逾30年。"},{"l":2,"y":115,"a":"B","c":0.77,"s":"依郵務營業規章規定，掛號郵件經投入 i 郵箱，收件人未於投入之次日起算幾日內領取者？中華郵政公司得於前述待領期限屆滿之次日起取出郵件，送交指定郵局招領，並通知收件人前往領取。","o":{"A":"1 日","B":"2 日","C":"3 日","D":"5 日"},"k":"半日制","p":0,"d":"第220條\n第一項\n掛號郵件\n經投入i郵箱，\n收件人\n未於投入之\n次日起\n算二日內\n領取者，\n本公司得於前述\n待領期限屆滿之\n次日起\n取出郵件，\n送交\n指定郵局招領，\n並通知\n收件人\n前往領取。\n代收貨款郵件\n雖經\n收件人\n繳納\n代收貨款款項，\n而逾期未領取者\n亦同。\n6\n1"},{"l":2,"y":115,"a":"B","c":0.88,"s":"依郵務營業規章規定，有關明信片之敘述，下列何者錯誤？","o":{"A":"國內橫式明信片得補足郵資差額，作國外明信片使用","B":"明信片紙張表面應平整光滑，得有突出部分","C":"國外明信片應為橫式","D":"紙張經折疊壓製，外形類似明信片者，按信函交寄"},"k":"半日制","p":0,"d":"13條第四項\n本公司得發行\n印有郵資符誌之\n郵政明信片。\nC\n國外明信片\n應為橫式，\n並加印\n國際郵務通用之\n法文或英文\n郵政明信片字樣（見附表二）。\nA國內橫式明信片\n得補足郵資差額，\n作國外明信片使用。\nB\n13條\n第三項\n明信片紙張表面應平整光滑，不得有突出部分。\nD\n17第三項\n紙張\n經折疊壓製，\n外形類似明信片者，\n按信函交寄。\n5\n1"},{"l":2,"y":115,"a":"C","c":0.84,"s":"依郵務營業規章規定，有關撤銷新聞紙或雜誌交寄之登記，下列敘述何者錯誤？","o":{"A":"內容涉及違法情事，經法院判決有罪確定或相關主管機關處分確定者","B":"內容係屬商業性廣告、宣傳品或公司行號發行為本身業務或特定個人宣傳，其篇幅逾全部篇幅百分之五十，且一年內累計達三次者","C":"經同意以新聞紙或雜誌交寄之次日起七個月內，未向指定郵局交寄者，或交寄後自行中斷交寄，新聞紙逾三個月、雜誌逾七個月者","D":"已交由民營遞送業者投遞或僅交寄偏遠地區者"},"k":"半日制","p":0,"d":"經同意以新聞紙或雜誌交寄之次日起\n6個月內，未向指定郵局交寄者，或交寄後自行中斷交寄，新聞 紙逾3個月、雜誌逾6個月者\n。"},{"l":2,"y":115,"a":"D","c":0.83,"s":"依郵務營業規章規定，有關得通知收件人至郵局領取包裹，下列敘述何者錯誤？","o":{"A":"包裹破損須當面開驗者","B":"報值、保價或代收貨款金額達一定數額以上者","C":"應交付其他費用者","D":"重量在二公斤以上之包裹，其收件人地址車輛通行不便者"},"k":"半日制","p":0,"d":"D-應更正為\n三公斤\n以上之包裹，其收件人地址車輛通行不便者"},{"l":2,"y":115,"a":"D","c":0.77,"s":"依郵務營業規章規定，寄件人申請撤回國際包裹時，相關撤回費及已付之資費，下列敘述何者錯誤？","o":{"A":"包裹尚在原寄局者，其已付之資費全數退還並免付撤回費","B":"相關包裹已離開原寄局，但尚在我國境內，經截留退回者，其已付之資費扣除原寄局與退回地之國內包裹往返資費後，退還餘額，並應付撤回費","C":"包裹已離開我國境內，於未投遞前，經截留退回者，其已付之資費，不予退還，並應付撤回費","D":"撤回之國際包裹係保價者，於扣除國內包裹資費時，其已付之保價費，應予退還"},"k":"半日制","p":0,"d":"54條第三項\n寄件人申請\n撤回國際包裹時，\n相關撤回費及\n已付之資費，\n依下列規定辦理：\nㅤㅤ\n一、包裹\n尚---在原寄局者，\n其已付之資費\n全數退還\n並---免付撤回費。\n二、相關包裹\n已---離開原寄局，\n但尚---在我國境內，\n經截留退回者，\n其已付之資費\n扣除\n原寄局與退回地之\n國---內包裹往返資費後，\n退還餘額，\n並應付\n撤回費。\n三、包裹\n已---離開我國境內，\n於---未投遞前，\n經截留退回者，\n其已付之資費，\n不予退還，\n並應付撤回費。\n54第四項\n第一項及第三項\n不准出口或\n申請撤回之國際包裹\n係保價者，\n於扣除\n國---內包裹資費時，\n其已付之保價費，\n不予退還。\n5\n1"},{"l":2,"y":115,"a":"B","c":0.81,"s":"依郵務營業規章規定，有關報值郵件之敘述，下列何者錯誤？","o":{"A":"掛號郵件經寄件人報明價值加付報值費於國內互寄者，為報值郵件","B":"證書、有價證券、契據、支票、匯票、黃金戒指、投標文件及其他一切重要具有價值文件之非裝寄法定紙幣報值信函，均得裝寄","C":"報值郵件每件報值最高限額由中華郵政公司定之","D":"報值信函使用郵局特製封套裝寄者，應於封背規定簽印位置及緘封處之報值封誌上，由寄件人簽名或蓋章"},"k":"半日制","p":0,"d":"郵務營業規章第77條：掛號郵件經寄件人報明價值加付報值費於國內互寄者，為報值郵件。\n報值信函分為裝寄法定紙幣及非裝寄法定紙幣二種。非裝寄法定紙幣報值信函，例如\n證書、有價證券、契據、支票、匯票、單據、投標文件\n及其他一切重要\n具有價值文件\n，均得裝寄。"},{"l":2,"y":115,"a":"B","c":0.86,"s":"依郵務營業規章規定，有關保價郵件之敘述，下列何者錯誤？","o":{"A":"掛號郵件經寄件人報明保價金額，加付保價費交寄者，為保價郵件","B":"保價郵件每件保價最高限額，由交通部定之","C":"國際保價信函業務限於中華郵政公司指定並公告之郵局辦理","D":"國際保價郵件寄達之國外郵政未辦理保價業務者，不予收寄"},"k":"半日制","p":0,"d":"第八十六條\n掛號郵件\n經寄件人\n報明保價金額，\n加付保價費交寄者，\n為保價郵件。\n保價郵件每件\n保價最高限額，\n由本公司定之。\n國際保價信函業務\n限於本公司指定\n並公告之郵局辦理。\n第八十七條\n國際保價郵件寄達之\n國外郵政\n未辦理保價業務者\n(見附表一第四欄)，\n不予收寄。\n15\n1"},{"l":2,"y":115,"a":"A","c":0.79,"s":"依郵務營業規章規定，有關 i 郵箱業務之敘述，下列何者錯誤？","o":{"A":"掛號郵件改投遞至 i 郵箱前，須經寄件人同意","B":"得經由 i 郵箱收領之郵件須為掛號郵件","C":"收件人開箱後，如將掛號郵件留置 i 郵箱內，不影響該郵件已妥投之效力","D":"掛號郵件投入 i 郵箱，視為一次投遞"},"k":"半日制","p":0,"d":"第二百十九條：\n（Ａ）掛號郵件改投遞至i郵箱前，須經\n收件人\n同意。\nㅤㅤ\n第二百十八條：\n（Ｂ）得經i郵箱收領之郵件須為掛號郵件。\nㅤㅤ\n第二百二十條：\n（Ｃ）收件人開箱後，如將掛號郵件留置i郵箱內，不影響該郵件已妥投之效力。\nㅤㅤ\n第二百十九條：\n（Ｄ）掛號郵件投入i郵箱，視為一次投遞。"},{"l":2,"y":115,"a":"D","c":0.87,"s":"依郵務營業規章規定，下列敘述何者錯誤？","o":{"A":"電子函件之郵資依郵件資費表之規定暨函件編輯頁數計算","B":"客戶交寄之電子函件傳送至電子郵局，電腦即先核對客戶之密碼、交寄郵件批號、郵件資費、記帳信用額度等資料","C":"電子函件客戶，如密碼遺忘、被竊或不擬繼續交寄電子函件時，得申請暫停或終止帳戶","D":"掛號電子函件查詢，由電子郵局繕寫或列印「國內掛號函件及包裹查單」，利用一般郵路查詢者或申請以傳真回復者，皆免付相關查詢費"},"k":"半日制","p":0,"d":"（Ａ）第三十八條：\n電子函件之郵資依郵件資費表之規定暨函件編輯頁數計算\n（Ｂ）第四十一條：\n客戶交寄之電子函件傳送至電子郵局，電腦即先核對客戶之密碼、交寄郵件批號、郵件資費、記帳信用額度等資料\n（Ｃ）第四十二條：\n電子函件客戶，如密碼遺忘、被竊或不擬繼續交寄電子函件時，得申請暫停或終止帳戶\n（Ｄ）第四十四條：\n掛號電子函件查詢，由電子郵局繕寫或列印「國內掛號函件及包裹查單」，利用一般郵路查詢者，\n免付查詢費。\n但申請以傳真回復者，應加付傳真查詢費"},{"l":2,"y":115,"a":"C","c":0.77,"s":"依郵務營業規章規定，有關廣告回信郵件，下列敘述何者錯誤？","o":{"A":"寄件人對其所發未貼郵票之回信信封、明信片、徵詢函回答表件或刊在報章雜誌之空白回信卡片或貼紙，經回信人寄回時，代回信人交付郵資，並按件計付手續費者，為廣告回信","B":"廣告回信應先向當地郵局申請轉送所屬各等郵局申請登記","C":"申請廣告回信登記，應填申請書一份並預存郵資。預存郵資金額由郵局視實際情形酌定，並於取消登記 交還登記證三個月後，未積欠郵資者，全數退還","D":"廣告回信用戶領到登記證後，應依照郵局同意之回信樣本及規定式樣印製回信信封、明信片或貼紙，其上並應加印登記證字號及交寄郵件種類"},"k":"半日制","p":0,"d":"這題答案是不是有問題?\n第一百零六條\n寄件人對其所發未貼郵票之回信信封、明信片、徵詢函回答表件或刊在報章雜誌之空白回信卡片或貼紙，經回信人寄回時，代回信人交付郵資，並按件計付手續費者，為廣告回信。\n廣告回信應先向當地郵局申請轉送所屬各等郵局申請登記\n；國際廣告回信業務另依萬國郵政公約規定辦理。\n第一百零七條\n申請廣告回信登記，\n應填申請書及回信樣張二份並預存郵資\n。預存郵資金額由郵局視實際情形酌定，\n並於取消登記交還登記證二個月後\n，未積欠郵資者，全數退還。"},{"l":2,"y":115,"a":"C","c":0.84,"s":"依郵務營業規章規定，國內互寄之郵件封面以外國文字書寫時，應附註下列何項資訊？","o":{"A":"寄件人中文姓名","B":"寄件人中文地址及郵遞區號","C":"收件人中文地址及郵遞區號","D":"僅需註明收件人中文國名"},"k":"半日制","p":0,"d":"第124條\n郵件應分別\n書寫收件人、寄件人之\n姓名、詳細地址\n及郵遞區號，\n字體長寬\n大於四毫米，\n字跡應清晰。\n但寄件人\n指定投遞地區或\n行業之\n大宗郵件，\n經郵局同意，\n得免書寫\n收件人\n姓名、地址及郵遞區號。\n國內互寄之\n郵件封面\n以外國文字書寫者，\n應附註\n收件人\n中文地址及郵遞區號。\n寄往\n國外郵件封面，\n應以英文或\n寄達國\n通用文字書寫，\n以寄達國文字書寫者，\n國名應\n加註英文；\n其以中文書寫者，\n僅寄達國通行者為限。\n國內互寄郵件\n封面未書寫收件人\n郵遞區號或\n書寫錯誤，\n致無法使用\n自動化設備\n分揀處理者，\n郵局得\n延後處理，或\n退還寄件人\n補正後再寄。\n4\n1"},{"l":2,"y":115,"a":"B","c":0.71,"s":"依郵務營業規章規定，寄件人交寄平常函件，如須取得交寄證明，證明手續費的郵票或郵資票券應貼於何處？","o":{"A":"函件封面","B":"交寄平常函件證明單正本上","C":"交寄平常函件證明單副本上","D":"申請書上"},"k":"半日制","p":0,"d":"第一百三十五條\n寄件人交寄平常函件如須取得交寄證明，應於交寄時填「\n交寄平常函件證明單\n」一式二份，並將交付證明手續費之郵票或郵資票券貼於\n證明單正本\n上，連同函件交郵局點收、簽章並蓋銷，以作為相關函件確已交寄之憑證。但本公司對其所負之責任，與未經證明之平常函件相同。"},{"l":2,"y":115,"a":"A","c":0.92,"s":"依郵務營業規章規定，郵局掣給「交寄平常函件證明單」的服務，僅限於下列何種情況？","o":{"A":"當場交寄之平常函件","B":"已投入信箱信筒者","C":"投入 i 郵箱者","D":"只要未逾七日皆可補證"},"k":"半日制","p":0,"d":"136條\n交寄證明以\n當場交寄之\n平常函件為限，\n非當場或\n已投入信箱信筒者，\n不予補證。"},{"l":2,"y":115,"a":"B","c":0.95,"s":"依郵務營業規章規定，購買郵票或各類出售品要求發給購票證明時，應於何時申請？","o":{"A":"事後一週內","B":"當場申請","C":"事後一個月內","D":"郵票使用完畢後"},"k":"半日制","p":0,"d":"149條\n購買郵票或\n各類出售品，\n而要求發給\n購票證明者，\n應當場\n申請，\n事後\n不予補證。"},{"l":2,"y":115,"a":"C","c":0.77,"s":"依郵務營業規章規定，郵資機如有非法使用，致郵局受有損害，應由下列何者負損害賠償責任？","o":{"A":"郵局","B":"郵資機供應商","C":"申請人","D":"郵資機使用人"},"k":"半日制","p":0,"d":"160條\n郵資機\n如有\n非法使用，\n致郵局\n受有損害者，\n由申請人\n負損害\n賠償責任。"},{"l":2,"y":115,"a":"B","c":0.87,"s":"依郵務營業規章規定，不按址投遞區域，郵局在公用受信箱或集體受信箱中，僅投遞何種郵件？","o":{"A":"各類掛號郵件","B":"平常郵件","C":"快捷郵件","D":"限時郵件"},"k":"半日制","p":0,"d":"163條\n第一項\n不按址投遞區域之\n郵件依下列方式投遞：\n一、收件人\n通知寄件人，\n將郵件寄交\n當地郵局\n按址投遞地區內\n之行號或\n住戶\n代為收轉。\n二、收件人\n以書面通知\n當地郵局\n將郵件投交\n當地郵局\n按址投遞區內\n指定之行號或\n住戶\n代為收轉。\n三、收件人\n在郵局投遞路線\n必經之路邊、\n岔道口、\n行號或\n住戶門前，\n自行設置\n受信箱，\n並以書面\n通知當地郵局\n，\n將其郵件投入\n該受信箱內，\n由收件人\n自行提取。\nㅤㅤ\n四、收件人\n用書面指定\n一郵局\n寄放其郵件，\n由收件人\n到該郵局領取。\n五、將郵件投入\n郵局在車輛可通達，\n且為公眾必經之\n適當地點，\n所設置之\n公用受信箱或\n集體受信箱，\n由村鄰長或\n公推之負責人\n負責提取分發，\n或由收件人\n自行提取。\n第二項\n未依前項各款\n規定\n辦理之郵件，\n留存最近\n投遞局所，\n或郵政代辦所，\n待收件人\n或其委託代領人\n前來領取，\n待領期限\n一個"},{"l":2,"y":115,"a":"C","c":0.83,"s":"依郵務營業規章規定，郵件收件人地址變更，新地址不在原投遞局投遞區域內須轉寄他局投遞的服務，稱為什麼？","o":{"A":"改投","B":"改送","C":"改寄","D":"轉址"},"k":"半日制","p":0,"d":"167條\n收件人或\n代收人\n地址變更，\n郵件須改\n向新地址投交者，\n如其新地址\n在原投遞局\n投遞區域內，\n稱為改投，\n不在原投遞局\n投遞區域內\n須轉寄\n他局投遞者\n，\n稱為改寄。\n7\n1"},{"l":2,"y":115,"a":"B","c":0.73,"s":"依郵務營業規章規定，公私機構申請郵件改投或改寄新地址時，申請書上除蓋用機構印章外，還應經誰簽名或蓋章？","o":{"A":"經收郵件人員","B":"負責人","C":"承辦人","D":"郵件部門經理"},"k":"半日制","p":0,"d":"根據\n中華郵政股份有限公司郵務營業規章\n第 169 條第 2 項的規定： [\n1\n]\n「申請書應由申請人簽名或蓋章，\n申請人為公私機構時，除蓋用機構印章外，並應經負責人簽名或蓋章\n。」"},{"l":2,"y":115,"a":"A","c":0.77,"s":"依郵務營業規章規定，同一地址改投或改寄同一新地址的服務，其申請次數限制為何？","o":{"A":"一次為限","B":"一次為限，但有特殊情形，得於期滿前以書面再申請一次","C":"二次為限","D":"二次為限，但有特殊情形，得於期滿前以書面再申請一次"},"k":"半日制","p":0,"d":"170條\n第一項\n申請\n改投或\n改寄\n新地址之\n有效期間，\n自郵局同意\n提供該服務之\n始日起\n以六個月為限。\n逾期仍\n照郵件封面\n所書地址投遞。\n第二項\n同一地址\n改投或\n改寄\n同一新地址者，\n其申請\n以一次為限。"},{"l":2,"y":115,"a":"C","c":0.88,"s":"依郵務營業規章規定，郵寄法定紙幣、金銀條塊等貴重物品至國外，應裝入下列何種郵件內交寄？","o":{"A":"國際掛號函件","B":"國際報值包裹","C":"國際保價函件或保價包裹","D":"國際快捷郵件"},"k":"半日制","p":0,"d":"第143條，寄往國外者，裝入\n保價函件\n或\n保價包裹\n內。"},{"l":2,"y":115,"a":"C","c":0.74,"s":"依郵務營業規章規定，無著郵件中內裝有價值物品，自郵件交寄日起滿多久無人認領者，即變賣之？","o":{"A":"滿六個月","B":"滿一年","C":"滿三年","D":"滿五年"},"k":"半日制","p":0,"d":"第204條，二、 內裝文件或物品係有價值或得為買賣標的者，自郵件\n交寄日起滿三年\n無人認領者，即變賣之；其性質易於腐壞不能久存或數量有消減之虞者，得先行變賣，並將價款保存至郵件\n交寄日起滿三年\n為止。"},{"l":2,"y":115,"a":"B","c":0.7,"s":"依郵務營業規章規定，國際快捷郵件的查詢期限，自交寄之次日起算多久？","o":{"A":"三個月","B":"四個月","C":"六個月","D":"一年"},"k":"半日制","p":0,"d":"第207條，前條之查詢期限自交寄之次日起算六個月。但\n國際快捷郵件\n之查詢期限自\n交寄之次日起算四個月\n。"},{"l":2,"y":115,"a":"D","c":0.78,"s":"國內互寄橫式信封橫寫時，依郵務營業規章規定，寄件人郵遞區號、地址、姓名應書於何處？","o":{"A":"右下角","B":"左下角","C":"中間偏右位置","D":"左上角"},"k":"半日制","p":0,"d":"12\n0"},{"l":2,"y":115,"a":"B","c":0.74,"s":"依郵務營業規章規定，掛號郵件未以報值或保價郵件交寄致生損失時，郵局所負之責任以何者為限？","o":{"A":"郵件內裝物實際價值","B":"該郵件全部遺失、被竊或毀損時可得請求之補償金額","C":"該郵件所付之全部資費","D":"新臺幣一千元"},"k":"半日制","p":0,"d":"第217條之1，掛號郵件未以報值郵件或保價郵件交寄致生損失，本公司所負之責任，以該郵件\n全部遺失\n、\n被竊\n或\n毀損\n時可得請求之\n補償金額\n為限"},{"l":2,"y":115,"a":"C","c":0.76,"s":"依郵務營業規章規定，國內包裹及國內快捷郵件遺失、被竊或毀損，若全部或一部分損失之實價少於所定之補償金額者，應如何補償？","o":{"A":"仍按所定補償金額上限補償","B":"按所定補償金額上限減半補償","C":"按實價補償之，其實價，依收寄時及收寄地之市價定之","D":"郵局不予補償，但退還郵資"},"k":"半日制","p":0,"d":"第220條，前二項包裹及快捷郵件全部或一部分損失之實價少於所定之補償金額者，按\n實價補償之\n；其實價，依\n收寄時及收寄地之市價定之"},{"l":2,"y":115,"a":"A","c":0.66,"s":"依郵務營業規章規定，寄件人向原寄郵局申請掣給掛號郵件執據副本時，應付的費用為何？","o":{"A":"每份按原掛號資費付費","B":"每份收取手續費新臺幣 10 元","C":"每份按原掛號資費減半付費","D":"僅收取紙張工本費"},"k":"半日制","p":0,"d":"第一百三十八條\n寄件人交寄掛號郵件時或於交寄後，得向原寄郵局繳驗原執據申請掣給執據副本。\n原執據遺失、喪失或毀損，如未逾查詢期限，得繕具申請書，列明郵件種類、交寄日期或郵件號碼、收寄件人姓名、地址及原執據遺失、喪失或毀損原因等，並提出身分證明文件，申請查明掣給執據副本。寄件人為機關團體、公司行號者，申請書上應加蓋印信及其負責人印章。\n執據副本每份按原掛號資費付費\n，以郵票或郵資券貼於申請書上，以郵戳蓋銷之。\n交寄郵件之執據或執據副本因遺失被他人冒用所致損失，由寄件人自行負責。"},{"l":2,"y":115,"a":"D","c":0.74,"s":"依郵務營業規章規定，寄件人使用郵資機印出符誌一次交寄的函件數量達到何種標準時，得將郵資總數彙印郵資券，貼於大宗函件彙計郵資單查證聯上？","o":{"A":"函件十件以上且種類相同","B":"函件十件以上(小包二十件以上)，種類可以不相同","C":"函件十五件以上(小包五件以上)且種類相同","D":"函件二十件以上(小包十件以上)且種類相同"},"k":"半日制","p":0,"d":"158條\n郵資機\n印出之\n符誌，\n應印於\n郵件封面或\n印於空白\n郵資券\n再黏貼於\n郵件封面上。\n但寄件人\n一次\n交寄之\n函件\n20件以上\n(小包10件以上)\n且種類\n相同者，\n得將\n郵資總數\n彙印郵資券，\n連同郵件\n交由郵局\n收寄人員\n核驗後，\n貼於\n大宗\n函件\n彙計\n郵資單\n查證聯上，\n並由郵局\n在相關函件上\n加蓋\n「郵資已付」戳記。\n郵資機\n印出之\n符誌，\n不得以\n任何方式\n抵作現金\n使用；\n其一經\n使用後，\n視為\n蓋銷之郵票。\n6\n1"},{"l":2,"y":115,"a":"B","c":0.8,"s":"依郵務營業規章規定，寄往國外之欠資函件，若無法退還寄件人，且非信函及明信片時，應如何處理？","o":{"A":"作欠資函件寄發","B":"不予寄遞，於招領揭示期滿後，依無著郵件規定處理","C":"逕予銷燬","D":"退回原寄國郵政"},"k":"半日制","p":0,"d":"180條\n寄往\n國外之\n欠資函件，\n退還\n寄件人\n補足\n資費差額。\nㅤㅤ\n無法退還時，\n除信函及\n明信片\n作欠資函件\n寄發外，\n其他函件\n不予寄遞，\n於招領揭示\n期滿後，\n依無著郵件\n規定處理。\nㅤㅤ\n大批交寄之\n國際\n信函及明信片，\n資費不足，\n無法退還\n寄件人補付者，\n不予寄遞，\n於招領揭示\n期滿後，\n作無著郵件處理。\n0\n1"},{"l":2,"y":115,"a":"B","c":0.85,"s":"依郵務營業規章規定，國內郵件存局候領期間為十五日，但收件人可以書面申請延長至最長多久？","o":{"A":"二十日","B":"一個月","C":"二個月","D":"三個月"},"k":"半日制","p":0,"d":"186條\n各郵局\n設有\n存局候領處，\n寄件人得\n將郵件\n寄存該處，\n由收件人\n到郵局\n憑身分證明文件\n領取。\n存局候領之\n國內\n郵件，\n自候領之次日\n起\n算15日內，\n免付保管費。\n如\n收件人以書面\n申請延長，\n自第16日起，\n函件比照\n第33條第2項規定、\n包裹及快捷郵件\n比照第56條第2項規定，\n按日交付\n逾期保管費。\n前項逾期保管費，\n如收件人\n拒付或\n怠於交付，\n依\n無法投遞\n郵件之\n規定處理。\n0\n1"},{"l":2,"y":115,"a":"C","c":0.74,"s":"依郵務營業規章規定，國內包裹／快捷郵件單件以外箱尺寸計費，長寬高三者合計超過 90 公分者，遺失或毀損補償金額上限為何？","o":{"A":"新臺幣五百七十五元","B":"新臺幣八百六十五元","C":"新臺幣一千一百五十五元","D":"新臺幣一千四百四十元"},"k":"半日制","p":0,"d":"212條\n國內\n包裹及\n國內\n快捷郵件\n遺失、\n被竊或\n毀損之\n補償金額，\n依下列規定：\n一、單件\n以重量\n計費者：\n（一）5公斤以下者，\n不逾新臺幣575元。\n（二）超過5公斤\n至10公斤以下者，\n不逾新臺865元。\n（三）超過\n10公斤者，\n不逾新臺幣1155元。\n二、單件\n以外箱尺寸\n計費者：\n（一）長寬高\n三者合計\n不超過60公分者，\n不逾新臺幣575元。\n（二）長寬高\n三者合計\n超過60公分\n至90公分以下者，\n不逾新臺幣865元。\n（三）長寬高\n三者\n合計\n超過90公分者，\n不逾新臺幣1155元。\nㅤㅤ\n國際\n包裹及\n國際\n快捷\n郵件遺失、\n被竊\n或毀損之\n補償金額，\n依國際貨幣\n基金特別\n提款權（SDR），\n每件以\n40計算單位\n及按實重\n每公斤4.5\n計算單位，\n混合計算\n其數額。\nㅤㅤ\n前二項\n包裹及\n快捷郵件\n全部或\n一部分\n損失之\n實價\n少於所定\n之補償金額者，\n按實"},{"l":2,"y":115,"a":"B","c":0.79,"s":"依郵務營業規章規定，報值郵件全部遺失、被竊或毀損應予補償時，郵局對於已付資費的退還規定為何？","o":{"A":"退還其郵資及保價費、報值費","B":"退還其郵資，但保價費、報值費不予退還","C":"僅退還保價費、報值費","D":"不退還任何資費"},"k":"半日制","p":0,"d":"第二百十一條\n包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，依下列規定：\n一、國內掛號函件，每件為新臺幣五百七十五元。\n二、國際掛號函件，每件依國際貨幣基金特別提款權（SDR）三十計算單位，計算其補償金額。\n三、國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權（SDR）一百五十計算單位，計算其補償金額。\n報值或保價郵件\n全部或一部遺失、被竊或毀損，應予補償時，按所報或所保價值之全部或一部予以補償。一部損失，以實價補償，其實價，依收寄時及收寄地之市價定之，最多以原件所報或所保價值為限。\n限時郵件、快捷郵件遞送延誤，經查明為本公司之過失所致者，其補償金額如下：\n一、限時郵件及國內快捷郵件，依所收取之全部資費補償。\n二、國際快捷郵件，依所收取全部資費之百分之五十補償。\n掛號郵件未依本公司公告之處理規定遞送，應予補償者，依所收取之全部資費補償。\n前二項之資費"},{"l":2,"y":115,"a":"C","c":0.73,"s":"依郵務營業規章規定，郵局支付補償金後若發現原寄郵件，受領補償者得於多久時間內退還補償金並請求交付原寄郵件？","o":{"A":"收到通知之日起，一個月內","B":"收到通知之次日起，二個月內","C":"收到通知之日起，三個月內","D":"收到通知之次日起，四個月內"},"k":"半日制","p":0,"d":"第二百十五條\n本公司於履行補償後，發現原寄郵件之全部或一部時，應通知受領補償者，得於收到通知之日起，三個月內，退還補償金之全部或一部，請求交付該項發現之原寄郵件。"},{"l":2,"y":115,"a":"B","c":0.54,"s":"依郵務營業規章規定，郵件因遺失、被竊、毀損、遞送延誤等事由所致之其他損失或損害，郵局應如何處理？","o":{"A":"應依實際損失給予補償","B":"不予補償或賠償","C":"僅補償其郵資差額","D":"依郵政法規定賠償，但不補償"},"k":"半日制","p":0,"d":"第217條，郵件遺失、被竊、毀損、遞送延誤或掛號郵件未依本公司公告之處理規定遞送者，本公司應依郵政法及郵件處理規則規定補償；因\n上開事由所致之其他損失或損害，不予補償或賠償\n。"},{"l":2,"y":115,"a":"B","c":0.69,"s":"依郵務營業規章規定，混合交寄郵件，未於封面註明「混合交寄」字樣，而按較低之費率交付郵資者，下列何者正確？","o":{"A":"按各件不同費率分別計算後合計，向收件人補收欠資及欠資手續費","B":"依較高之費率，按全件重量，向收件人補收欠資及欠資手續費","C":"逕行退還寄件人，不予投遞","D":"依較低之費率，按全件重量，向寄件人補收欠資及欠資手續費"},"k":"半日制","p":0,"d":"第133條，混合交寄郵件，未於封面註明「混合交寄」字樣，而按較低之費率交付郵資者，應依\n較高之費率，按全件重量，向收件人補收欠資及欠資手續費"},{"l":2,"y":115,"a":"D","c":0.86,"s":"依郵務營業規章規定，收件人委託他人代領報值包裹及保價郵件，代領人之領取手續及應提示之證件、物品，下列敘述何者正確？","o":{"A":"應交驗收件人委託書或印章，並由代領人出示其身分證明文件即可領取","B":"應交驗掛號郵件招領通知單，並由代領人簽名或蓋章領取","C":"應交驗掛號郵件招領通知單，並由代領人出示其身分證明文件即可領取","D":"應交驗掛號郵件招領通知單、收件人委託書，並由代領人出示其身分證明文件、簽名或蓋章領取"},"k":"半日制","p":0,"d":"164條\n依郵政法或\n郵件處理規則規定\n招領郵件之\n領取手續\n及應提示之\n證件、物品\n如下：\n一、收件人\n親自領取\n各類掛號郵件者，\n應交回\n掛號郵件\n招領通知單，\n出示身分證明文件\n並加蓋印章。\n如未攜帶\n印章者，\n得簽署全名\n代替蓋章，\n其姓名與\n羅馬拼音\n並列登記者，\n擇一簽署。\n二、收件人\n委託他人\n代領\n報值包裹及\n保價郵件\n以外之\n掛號郵件者，\n應交驗\n掛號郵件招領\n通知單、\n收件人\n委託書或\n印章，\n並由\n代領人\n出示其\n身分證明文件、\n簽名或\n蓋章領取。\n三、收件人\n委託他人\n代領\n報值包裹\n及保價郵件者，\n應交驗\n掛號郵件\n招領通知單、\n收件人\n委託書，\n並由\n代領人\n出示其身分證明文件，\n簽名或\n蓋章領取。\nㅤㅤ\n四、投交\n收件人親收之\n國際\n掛號函件\n不得委託\n他人代領。\n五、收件人\n或代領人\n領取\n招領之\n平常郵件，\n憑郵件招領\n通知單領取，\n郵局於\n必要時，\n得請"},{"l":3,"y":110,"a":"D","c":0.81,"s":"依郵政儲金匯兌法之規定，郵政儲金匯兌事務，由中華郵政股份有限公司辦理，屬下列何機關主管？","o":{"A":"行政院","B":"金融監督管理委員會","C":"中央銀行","D":"交通部"},"k":"內勤","p":0,"d":""},{"l":3,"y":110,"a":"D","c":0.77,"s":"依郵政儲金匯兌法之規定，郵政儲金初次存入時，由存入之郵局，按其種類分別發給儲金簿或單據，作為憑證， 下列何者非為「按其種類」所稱之種類？","o":{"A":"存簿儲金","B":"定期儲金","C":"劃撥儲金","D":"郵政禮券"},"k":"內勤","p":0,"d":"70\n0"},{"l":3,"y":110,"a":"D","c":0.77,"s":"依郵政儲金匯兌法之規定，郵政儲金投資公債、公司債、金融債券及短期票券之投資限額、對象及其他交易之 限制及運用管理辦法，由下列何機關定之？","o":{"A":"由交通部定之","B":"由交通部會同中央銀行定之","C":"由交通部會同金融監督管理委員會定之","D":"由交通部會同金融監督管理委員會及中央銀行定之"},"k":"內勤","p":0,"d":"郵政儲金匯兌法 第 18 條\n三、投資公債、公司債、金融債券及短期票券。\n前項第三款之投資限額、對象及其他交易之限制及運用管理辦法，由交通部會同金融監督管理委員會及中央銀行定之。"},{"l":3,"y":110,"a":"B","c":0.69,"s":"依郵政儲金匯兌法之規定，下列何者為郵政儲金匯兌法立法目的之一？","o":{"A":"鼓勵國民投資","B":"促進資本形成","C":"發展國民經濟","D":"保障郵政安全"},"k":"內勤","p":0,"d":"郵政儲金匯兌法\n為鼓勵國民儲蓄、促進資本形成，以配合國家政策，並增進民眾便利，保障郵政儲金匯兌安全，特制定本法；本法未規定者，依其他法律之規定。\n簡易人壽保險\n為提供國民基本經濟保障，健全簡易人壽保險制度，便利全民投保，增進社會福祉，特制定本法。本法未規定者，適用其他法律之規定。"},{"l":3,"y":110,"a":"D","c":0.84,"s":"依郵政儲金匯兌法所定之罰鍰，下列敘述何者錯誤？","o":{"A":"原則上由金融監督管理委員會處罰之","B":"未經中央銀行之許可而辦理外匯業務之處罰，由中央銀行為之","C":"所為之處罰，應通知交通部","D":"經限期繳納，屆期不繳納者，依郵政儲金匯兌法加倍處罰，並移送強制執行"},"k":"內勤","p":0,"d":"郵政儲金匯兌法 第 29 條\n本法所定之罰鍰，由金融監督管理委員會處罰之。但第二十六條第六款之處罰，由中央銀行為之。\n前項金融監督管理委員會及中央銀行所為之處罰，應通知交通部。\n依本法所處之罰鍰，經限期繳納，屆期不繳納者，依法移送強制執行。"},{"l":3,"y":110,"a":"C","c":0.97,"s":"某甲今年 10 歲，攜帶壓歲錢連同儲金簿至郵局窗口存款 6,000 元並已入帳，依郵政儲金匯兌法規定，其效力如何？","o":{"A":"經父母同意始生效力","B":"經監護人承認始生效力","C":"視為有行為能力人之行為","D":"一律無效"},"k":"內勤","p":0,"d":"《郵政儲金匯兌法第五條》\n無行為能力\n或\n限制行為能力人\n，關於\n郵政儲匯事務\n，\n對中華郵政公司所為之行為\n，視為\n有行為能力人之行為\n。\n16\n1"},{"l":3,"y":110,"a":"C","c":0.97,"s":"某丙至郵局聲稱其遭詐騙，將存款匯入郵局他人帳戶，要求停止該帳戶交易活動並退回款項，郵局應如何妥適 處理？","o":{"A":"窗口人員可提供受款人帳戶資料，請某丙逕行聯繫","B":"窗口人員可沖銷交易，退回款項","C":"郵局對顧客之儲金及匯款資料有保密義務，請某丙報警並循法律途徑解決","D":"請某丙向銀行公會申請退回款項"},"k":"內勤","p":0,"d":""},{"l":3,"y":110,"a":"C","c":0.84,"s":"依郵政儲金匯兌法之規定，有關存簿儲金，儲戶計息之最高存款限額相關規定，下列敘述何者正確？","o":{"A":"由交通部擬訂","B":"報由中央銀行及金融監督管理委員會定之","C":"超過限額之數，不給利息","D":"儲戶計息之最高存款限額不適用郵政員工"},"k":"內勤","p":0,"d":"(A)是由中華郵政公司擬訂沒錯，但沒打完整，故不是答案。完整句子為：「存簿儲金，儲戶計息之最高存款限額，由中華郵政公司擬訂，報由交通部會同中央銀行及金融監督管理委員會定之。」\n(B)報由交通部會同中央銀行及金融監督管理委員會定之。\n(C)原則上是如此，除了不適用政府機關、自治團體或公益法人外。\n(D)政府機關是以機關為單位，不適用政府機關裡頭的個人。\n34\n1"},{"l":3,"y":110,"a":"B","c":0.91,"s":"依郵政儲金匯兌法之規定，國內匯兌及國際匯兌，分為下列何種？","o":{"A":"信匯及電匯","B":"票匯及電匯","C":"票匯及信匯","D":"信匯、票匯及電匯"},"k":"內勤","p":0,"d":"第\n 21 \n條\n國內匯兌及國際匯兌\n，分為\n票匯\n及\n電匯\n二種。\n郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑。\n郵政匯票及郵政禮券應記載事項，由中華郵政公司擬訂，報交通部核定。"},{"l":3,"y":110,"a":"D","c":0.9,"s":"依郵政儲金匯兌法規定，中華郵政公司有下列哪一種情事之一者，處新臺幣 50 萬元以上 250 萬元以下罰鍰？","o":{"A":"郵政儲金利率未依第九條規定以年率為準或未於營業場所揭示","B":"未依第十條規定建立內部控制及稽核制度","C":"郵政儲金之運用未依第十八條授權訂定之限制及運用管理辦法辦理","D":"規避、妨礙或拒絕檢查"},"k":"內勤","p":0,"d":"第26條:(對內違反規定)處30-150萬罰鍰\n第27條:(對外妨礙調查)處50-250萬罰鍰\n57\n1"},{"l":3,"y":110,"a":"C","c":0.85,"s":"下列何者非屬郵政儲金可投資的項目？","o":{"A":"公債","B":"公司債","C":"長期票券","D":"金融債券"},"k":"模擬","p":0,"d":"郵政儲金匯兌法 第 18 條\n郵政儲金之運用範圍如下：\n一、轉存中央銀行。\n二、轉存中央銀行以外之其他金融機構。\n三、投資公債、公司債、金融債券及短期票券。\n四、投資受益憑證及上市（櫃）股票。\n五、參與金融同業拆款市場。\n六、提供（中長期）資金轉存金融機構辦理政府核准之重大建設及民間投\n資計畫。\n七、其他經交通部、金融監督管理委員會及中央銀行核准者。"},{"l":3,"y":110,"a":"B","c":0.86,"s":"依郵政儲金匯兌法規定，得接受他人存款之儲金種類為？","o":{"A":"存簿儲金","B":"劃撥儲金","C":"綜合儲金","D":"定期儲金"},"k":"模擬","p":0,"d":"第 3 條\n郵政儲金之種類如下：\n一、存簿儲金：指存款人憑郵政儲金簿或依約定方式，隨時存入或提取之儲金。\n二、定期儲金：指有一定時期之限制，存款人憑存單或依約定方式提取之儲金。\n三、\n劃撥儲金\n：指存款人得以其帳戶辦理存款、提款、匯款、撥款、轉帳及申請領用劃撥支票，\n並得接受他人存款之儲金。"},{"l":3,"y":110,"a":"B","c":0.76,"s":"某甲 107 年 10 月 1 日購買郵政匯票一張，以掛號郵寄受款人，但因受款人出國，郵差 107 年 10 月 5 日開掛號 郵件招領單置於受款人信箱，通知受款人至郵局領取，請問該郵政匯票之兌領請求權消滅時效如何計算？","o":{"A":"自 107 年 10 月 1 日起算二年","B":"自 107 年 10 月 1 日起算三年","C":"自 107 年 10 月 5 日起算二年","D":"自 107 年 10 月 5 日起算三年"},"k":"模擬","p":0,"d":"郵政匯票兌領請求權：發票日起算3年。"},{"l":3,"y":110,"a":"C","c":0.93,"s":"有關儲戶提取郵政儲金存款，下列敘述何者錯誤？","o":{"A":"應持郵局發給之憑證及約定之預留印鑑辦理","B":"憑證或印鑑遺失時，應向中華郵政公司辦理掛失止付","C":"在儲戶未辦妥掛失止付前，中華郵政公司對於依規定程序並已盡善良管理人注意義務所為之給付，如係冒領，亦應 負責","D":"中華郵政公司為確認取款人之真偽，得請其出示必要之證明"},"k":"模擬","p":0,"d":"郵政儲金匯兌法 第 15 條\n儲戶提取存款之憑證或印鑑遺失時，應向中華郵政公司辦理掛失止付；在儲戶未辦妥掛失止付前，中華郵政公司對於依規定程序並已盡善良管理人注意義務所為之給付，縱係冒領，亦不負責任。"},{"l":3,"y":110,"a":"B","c":0.76,"s":"中華郵政公司辦理郵政儲金匯兌業務，下列何者由交通部會同金融監督管理委員會定之？","o":{"A":"防制洗錢作業要點","B":"建立內部控制及稽核制度之辦法","C":"存簿儲金計息之最高存款限額","D":"郵政儲金匯兌業務作業規章"},"k":"模擬","p":0,"d":"AD都是行政院\nC交通部會同金管會及中央銀行\n99\n1"},{"l":3,"y":110,"a":"D","c":0.88,"s":"下列何者非屬郵政儲金之運用範圍？","o":{"A":"投資受益憑證及上市(櫃)股票","B":"投資公債、公司債、金融債券及短期票券","C":"轉存中央銀行","D":"小額放款"},"k":"模擬","p":0,"d":"政儲金匯兌法 第 18 條\n郵政儲金之運用範圍如下：\n一、轉存中央銀行。\n二、轉存中央銀行以外之其他金融機構。\n三、投資公債、公司債、金融債券及短期票券"},{"l":3,"y":110,"a":"A","c":0.94,"s":"中華郵政公司發行，並由其依面額對持有人無條件付款之無記名有價證券為何？","o":{"A":"郵政禮券","B":"郵政匯票","C":"國際郵政匯票","D":"電傳送現"},"k":"模擬","p":0,"d":"第 4 條\n郵政匯兌之種類如下：\n一、國內匯兌：指公眾以一定金額委託中華郵政公司支付與國內受款人之業務。\n二、國際匯兌：指公眾以一定金額委託中華郵政公司轉付與國外受款人，及接受通匯國匯入轉付與國內受款人之業務。\n三、\n郵政禮券：指中華郵政公司發行，並由其依面額對持有人無條件付款之\n無記名\n有價證券。\n郵政禮券：無記名，有賀券與奠券兩種，可依婚喪喜慶需要選擇。\n郵政匯票：採記名，所以即使遺失別人也無法領，只有付款人及受領方可以領。\n電傳送現：係匯款局以傳真方式寄送現金，每筆匯款限額最高8萬元。"},{"l":3,"y":110,"a":"C","c":0.56,"s":"下列何者無需訂於郵政儲金匯兌監督管理辦法？","o":{"A":"新增業務之許可","B":"郵局之增設","C":"未依法辦理儲金匯兌業務之處罰","D":"財務報表之揭露"},"k":"模擬","p":0,"d":"郵政儲金匯兌法第30條\n郵政儲金匯兌監督管理辦法\n1.新增業務之許可\n2.財務報表之揭露\n3.負責人之定義及其應具備資格條件\n4.郵局之增設、遷移、裁撤\n360\n1"},{"l":3,"y":110,"a":"B","c":0.78,"s":"中華郵政公司有下列何種情事，處新臺幣五十萬元以上二百五十萬元以下罰鍰？","o":{"A":"未經中央銀行之許可而辦理外匯業務","B":"逾期提報財務報告或未於規定期限內繳納查核費用","C":"儲金利率未於營業場所揭示","D":"違反規定，洩漏顧客之郵政儲金或匯款等有關資料"},"k":"模擬","p":0,"d":"郵儲法-第 26 條\n中華郵政公司有下列情事之一者，處新臺幣\n三十萬元以上一百五十萬元\n以\n下罰鍰：\n一、郵政儲金利率未依第九條規定以年率為準或未於營業場所揭示。（C）\n二、未依第十條規定建立內部控制及稽核制度。\n三、違反第十一條第一項規定，逕依第三人請求，而停止帳戶交易活動或\n給付匯款；或違反第十一條第二項規定，\n洩漏顧客之郵政儲金或匯款\n等有關資料。（D）\n四、郵政儲金之運用未依第十八條授權訂定之限制及運用管理辦法辦理。\n五、郵政儲金及匯兌業務未依第三十條授權訂定之監督管理辦法辦理。\n六、未經中央銀行之許可而辦理外匯業務。（A）"},{"l":3,"y":110,"a":"D","c":0.83,"s":"下列何者非屬中華郵政公司依法得經營之業務？","o":{"A":"匯兌","B":"中華郵政公司房地產出租業務","C":"集郵商品","D":"財產保險"},"k":"模擬","p":0,"d":"如果D選項為簡易人壽保險的話\n四個選項都算正確"},{"l":3,"y":110,"a":"C","c":0.57,"s":"某甲交寄國際快捷郵件 1 件，重量及內件價值分別為 2 公斤、新臺幣 2,100 元，今於運遞過 程中全部毀損，請問郵局應支付之補償金額約當多少新臺幣？（國際貨幣基金特別提款權與 新臺幣之比為 1：47）","o":{"A":"新臺幣 2,303 元","B":"新臺幣 1,880 元","C":"新臺幣 2,100 元","D":"新臺幣 2,091 元"},"k":"模擬","p":0,"d":"按公式算出來補償金是2303 $\n但題目有提到內部價值為2100$\n郵件處理規則第65條 第三項提到\n前二項包裹及快捷郵件\n全部或一部\n損\n失之實價少於所定之補償金額者，按實價補償之\n；其實價，依收寄時及收寄地之市價定之。\n補償金額 -＞2303$\n實價—＞2100$ \n所以按實價賠 \n答案：C"},{"l":3,"y":110,"a":"B","c":0.79,"s":"依郵件處理規則規定，國際包裹及國際快捷郵件之補償金額，依國際貨幣基金特別提款權， 每件以「多少」計算 單位及每公斤「多少」計算單位，混合計算其數額？","o":{"A":"三十，四點七","B":"四十，四點五","C":"四十，四點七","D":"五十，四點五"},"k":"模擬","p":0,"d":"國內\n包裹\n及\n國內快捷郵件\n遺失、被竊或毀損之補償金額，依下列規定：\n一、單件以重量計費者：\n（一）五公斤以下者，不逾新臺幣五百七十五元。\n（二）超過五公斤至十公斤以下者，不逾新臺幣八百六十五元。\n（三）超過十公斤者，不逾新臺幣一千一百五十五元。\n二、單件以外箱尺寸計費者：\n（一）長寬高三者合計不超過六十公分者，不逾新臺幣五百七十五元。\n（二）長寬高三者合計超過六十公分至九十公分以下者，不逾新臺幣八百六十五元。\n（三）長寬高三者合計超過九十公分者，\n不逾新臺幣一千一百五十五元。\n國際包裹\n及\n國際快捷郵件\n遺失、被竊或毀損之補償金額，依國際貨幣基金特別提款權（SDR），\n每件以四十計算單位及按實重每公斤四點五計算單位\n，混合計算其數額。\n前二項包裹及快捷郵件全部或一部分損失之實價少於所定之補償金額者，按實價補償之；其實價，依收寄時及收寄地之市價定之。"},{"l":3,"y":111,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，有關存簿儲金之利息，下列何者錯誤？","o":{"A":"儲戶計息之最高存款限額，由中華郵政公司擬訂，報由交通部會同行政院定之","B":"超過最高存款限額，不給利息","C":"計息最高存款限額之限制，於政府機關、自治團體或公益法人，不適用之","D":"存簿儲金之利息，應免一切稅捐"},"k":"營運職","p":1,"d":""},{"l":3,"y":111,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，本法施行日期，由何者以命令定之？","o":{"A":"交通部","B":"金融監督管理委員會","C":"行政院","D":"總統"},"k":"營運職","p":1,"d":""},{"l":3,"y":111,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定，有關郵政匯票事項，下列何者正確？","o":{"A":"郵政匯票受款人之兌領請求權，自發票日起算，五年間不行使，因時效而消滅","B":"郵政匯票逾第 22 條期間未經兌款者，中華郵政公司應通知匯款人領回，匯款人並得要求退還匯費","C":"郵政匯票遺失，匯款人或受款人不得申請掛失","D":"郵政匯票毀損，匯款人或受款人得繳回，並領回匯款，原匯票即予作廢"},"k":"營運職","p":1,"d":""},{"l":3,"y":111,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，下列敘述何者錯誤？","o":{"A":"郵政禮券屬記名式之有價證券","B":"中華郵政公司為確認取款人之真偽，得請其出示必要之證明","C":"中華郵政公司經營之郵政儲金匯兌業務，其會計帳務應獨立處理之","D":"限制行為能力人，關於郵政儲金及匯兌事務，對中華郵政公司所為之行為，視為有行為能力人之行為"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"B","c":1.0,"s":"依郵政儲金匯兌法之規定，中華郵政公司辦理郵政儲金匯兌業務違反法令、章程或有礙健全經營時，金融 監督管理委員會除得予以糾正、命其限期改善外，得視情節之輕重為處分，下列敘述何者錯誤？","o":{"A":"撤銷法定會議之決議","B":"停止全部郵政儲金匯兌業務","C":"命令解除辦理該項郵政儲金匯兌業務之負責人職務","D":"命令解除辦理該項郵政儲金匯兌業務之職員職務"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，除下列何者情形，中華郵政公司不得接受第三人有關停止帳戶交易活動或給付 匯款之請求？","o":{"A":"立法院之書面通知","B":"檢察機關之書面通知","C":"交通部之書面通知","D":"國稅局之書面通知"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司及其服務人員對於顧客之郵政儲金或匯款等有關資料，下列敘述 何者正確？","o":{"A":"除其他法律或交通部之書面通知，應保守秘密","B":"除其他法律或法院之裁判外，應保守秘密","C":"除其他法律或檢察機關之書面通知外，應保守秘密","D":"除其他法律或金融監督管理委員會另有規定外，應保守秘密"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定，有關國際匯兌之處理，下列敘述何者錯誤？","o":{"A":"依 萬 國 郵 政 聯 盟 所 定 郵 政 匯 兌 協 定 及 其 施 行 細 則 辦 理","B":"依我國與國外雙邊郵政匯兌協定辦理","C":"依郵政儲金匯兌法規定辦理","D":"依銀行法辦理"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，郵政儲金運用範圍之投資限額、對象及其他交易之限制及運用管理辦法，由交通 部會同金融監督管理委員會及中央銀行定之為下列何者？","o":{"A":"投資公債、公司債、金融債券及短期票券","B":"轉存中央銀行以外之其他金融機構","C":"投資受益憑證及上市（櫃）股票","D":"參與金融同業拆款市場"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，有關存簿儲金之利息，下列敘述何者錯誤？","o":{"A":"儲戶計息之最高存款限額，由中華郵政公司擬訂，報由交通部會同中央銀行及金融監督管理委員會定之","B":"利息於中華郵政公司成立之日起五年內，免納一切稅捐","C":"超過最高存款限額之數，不給利息","D":"計息超過最高存款限額之限制，於政府機構、自治團體或公益法人，不適用之"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定，有關罰鍰之敘述，下列何者錯誤？","o":{"A":"除第二十六條第六款之處罰外，所定之罰鍰，由金融監督管理委員會處罰之","B":"中華郵政公司依第 26 條和第 27 條規定受罰時，得對應負責之人求償","C":"所處之罰鍰，經限期繳納，屆期不繳納者，依法移送強制執行","D":"應通知銀行公會"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理郵政儲金之利率，下列敘述何者錯誤？","o":{"A":"應以年率為準","B":"於營業場所揭示","C":"未依第九條規定辦理，由中央銀行處罰","D":"未依第九條規定辦理，處新臺幣三十萬元以上一百五十萬元以下罰鍰"},"k":"專一","p":1,"d":"答案應為D\n第 26 \n條\n中華郵政公司有下列情事之一者，處新臺幣\n三十萬元以上一百五十萬元以下\n罰鍰：\n一、郵政儲金利率未依第九條規定以年率為準或未於營業場所揭示。\n→\n(A) 於營業場所揭示&\n(B) 應以年率為準\n(C) 如未以年率為準，處新臺幣三十萬元以上一百五十萬元以下罰鍰"},{"l":3,"y":111,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定 ， 中華郵政公司於金融監督管理委員會依第十三條規定辦理時 ， 有下列何種情形 ， 處中華郵政公司新臺幣五十萬元以上二百五十萬元以下罰鍰？ A.對檢查人員詢問其職務上之事項，無正當理 由不為答復 B.逾期提報財務報告、財產目錄或其他有關資料及報告 C.未經中央銀行之許可而辦理外匯業務","o":{"A":"僅 AB","B":"僅 AC","C":"僅 BC","D":"ABC"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，有關郵政匯兌之敘述，下列何者錯誤？","o":{"A":"郵政匯票遺失或毀損，匯款人或受款人得申請掛失或繳回，並領回匯款，原匯票即予作廢","B":"郵政匯票逾兌領請求權期間未經兌款者，中華郵政公司應通知受款人領回","C":"國內匯兌及國際匯兌，分為票匯及電匯二種","D":"郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑"},"k":"專一","p":1,"d":""},{"l":3,"y":111,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，有關該法施行日期，下列敘述何者正確？","o":{"A":"由行政院以命令定之","B":"由金融監督管理委員會定之","C":"由交通部定之","D":"由中華郵政公司報交通部核定"},"k":"內勤","p":1,"d":"郵政儲金匯兌法 第 31 條\n本法施行日期，由\n行政院\n以命令定之。"},{"l":3,"y":111,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，下列何者非屬制定該法目的之一？","o":{"A":"鼓勵國民儲蓄","B":"促進資本形成","C":"增進企業便利","D":"保障郵政儲金匯兌安全"},"k":"內勤","p":1,"d":"郵政儲金匯兌法\n第1條\n為\n鼓勵國民儲蓄\n、\n促進資本形成\n，以\n配合國家政策\n，並\n增進\n民眾\n便利\n，\n保障郵政儲金匯兌安全\n，特制定本法；本法未規定者，依其他法律之規定。"},{"l":3,"y":111,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，指中華郵政公司發行，並由其依面額對持有人無條件付款之無記名有價證券， 係指下列何者？","o":{"A":"國內匯兌","B":"國際匯兌","C":"郵政禮券","D":"劃撥支票"},"k":"內勤","p":1,"d":"郵政禮券：(記法：有3無)\n無條件\n、\n無記名\n、\n無期限\n的有價證券\n郵政匯票：(記法：匯字裡面有3點水，所以是3年)受款人之兌領請求權，自\n發票日\n起算，\n三年間\n不行使，因時效而消滅。\n郵政禮券及郵政匯票應記載事項，由中華郵政公司擬定，報交通部核定。"},{"l":3,"y":111,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，無行為能力人或限制行為能力人，關於郵政儲金及匯兌事務，對中華郵政公司 所為之行為，其效力為何？","o":{"A":"一律無效","B":"視為有行為能力人之行為","C":"僅辦理郵政儲金有效","D":"僅辦理郵政匯兌有效"},"k":"內勤","p":1,"d":""},{"l":3,"y":111,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，下列何種郵政儲金，每一人或每一團體僅得為一戶？","o":{"A":"存簿儲金","B":"劃撥儲金","C":"定期儲金","D":"分期付息之定期儲金"},"k":"內勤","p":1,"d":""},{"l":3,"y":111,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，郵政匯票受款人之兌領請求權，自發票日起算，多久期間不行使，因時效而消 滅？","o":{"A":"一年間","B":"三年間","C":"五年間","D":"十年間"},"k":"內勤","p":1,"d":"五年的是補償金請求權"},{"l":3,"y":111,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理郵政儲金匯兌業務，應建立內部控制及稽核制度，下列敘述 何者正確？","o":{"A":"其辦法由交通部訂定之","B":"其辦法由金融監督管理委員會訂定之","C":"其辦法由交通部會同金融監督管理委員會定之","D":"未依規定建立，處新臺幣五十萬元以上二百五十萬元以下罰鍰"},"k":"內勤","p":1,"d":"辦法由 交通部＋金融監督管理委員會 訂定，在第10條\n罰則在第26條，罰30萬到150萬"},{"l":3,"y":111,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理郵政儲金匯兌業務違反法令、章程或有礙健全經營時，下列 敘述何者錯誤？","o":{"A":"金融監督管理委員會得予以糾正、命其限期改善","B":"得視情節之輕重處分","C":"得停止部分郵政儲金匯兌業務之處分","D":"並應通知中央銀行"},"k":"內勤","p":1,"d":"第 12 條\n中華郵政公司辦理郵政儲金匯兌業務違反法令、章程或有礙健全經營時，金融監督管理委員會除得予以\n糾正（A）\n、\n命其限期改善（B)\n外，得視情節之輕重，為下列處分，並通知交通部：\n一、撤銷法定會議之決議。\n二、\n停止部分郵政儲金匯兌業務(C)\n。\n三、命令（\nD）解除\n辦理該項郵政儲金匯兌業務之負責人\n或職員之職務或停止其於一定期間內執行職務。\n四、其他必要之處置。\n中華郵政公司辦理外匯業務違反外匯法令之規定者，中央銀行得視情節之輕重，停止其一定期間經營全部或一部外匯之業務，並通知交通部。"},{"l":3,"y":111,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，有關劃撥儲金之敘述，下列何者錯誤？","o":{"A":"指存款人憑郵政儲金簿或依約定方式，隨時存入或提取之儲金","B":"存款人得以其帳戶辦理匯款、撥款、轉帳","C":"申請領用之劃撥支票，準用票據法有關支票之規定","D":"得接受他人存款之儲金"},"k":"內勤","p":1,"d":"郵政儲金匯兌法\n第 3 條\nㅤㅤ\n郵政儲金之種類如下：\n一、存簿儲金：指存款人憑郵政儲金簿或依約定方式，隨時存入或提取之儲金。\n(A)\n二、定期儲金：指有一定時期之限制，存款人憑存單或依約定方式提取之儲金。\n三、劃撥儲金：指存款人得以其帳戶辦理存款、提款、\n匯款、撥款、轉帳\n及申請領用劃撥支票，並得\n接受他人存款\n之儲金。\nㅤㅤ\n第 16 條\n中華郵政公司辦理\n劃撥儲金\n之劃撥支票業務，準用\n票據法\n有關支票之規定。"},{"l":3,"y":111,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定 ， 中華郵政公司有下列何種情形 ， 處新臺幣三十萬元以上一百五十萬元以下罰鍰？ A.規避、妨礙或拒絕檢查 B.郵政儲金之運用未依第十八條授權訂定之限制及運用管理辦法辦理 C.洩漏顧客 之郵政儲金或匯款等有關資料","o":{"A":"僅 AB","B":"僅 AC","C":"僅 BC","D":"ABC"},"k":"內勤","p":1,"d":"第 26 條\n利率、內控、\n洩漏個資(B)\n、\n儲金運用違規(C)\n、沒經許可辦外匯\n30 萬 ～ 150 萬元\n第 27 條\n規避妨礙拒絕檢查(A)\n、隱匿毀損帳冊、對檢查人員問話拒答或說謊\n50 萬 ～ 250 萬元"},{"l":3,"y":111,"a":"C","c":0.97,"s":"13 下列何者非屬郵政儲金匯兌法第 1 條（總則）立法理由？","o":{"A":"鼓勵國民儲蓄、促進資本形成，以配合國家政策","B":"增進民眾便利","C":"保障員工福利","D":"保障郵政儲金匯兌安全"},"k":"升資","p":0,"d":"為鼓勵國民儲蓄、促進資本形成，以配合國家政策，並增進民眾便利，保障郵政儲金匯兌安全，特制定本法；本法未規定者，依其他法律之規定。\n鼓促配增保=>聯想：古代有錢人美酒配咖啡住古厝配珍寶\n0\n0\n相關試題\n 14 下列何者非中華郵政公司辦理之儲金業務？\r (A)存簿儲金 (B)定期儲金 (C)劃撥儲金 (D)黃金存摺\n #3017592\n 15 依郵政儲金匯兌法規定，下列敘述何者錯誤？\r (A)中華郵政公司為確認取款人之真偽，得請其出示必要之證明 (B)中華郵政公司經營之郵政儲金匯兌業務，其會計帳務應獨立處理 (C)中華郵政公司經營之郵政儲金匯兌業務及該業務使用之郵政公用物、業務單據，於中華郵政公司成立之 日起 10 年內，免納一切稅捐 (D)中華郵政公司辦理郵政儲金之利率，應以年率為準，並於營業場所揭示\n #3017593\n 16 依郵政儲金匯兌法規定，下列何者非郵政儲金之運用範圍？\r (A"},{"l":3,"y":111,"a":"D","c":0.98,"s":"14 下列何者非中華郵政公司辦理之儲金業務？","o":{"A":"存簿儲金","B":"定期儲金","C":"劃撥儲金","D":"黃金存摺"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"C","c":0.98,"s":"15 依郵政儲金匯兌法規定，下列敘述何者錯誤？","o":{"A":"中華郵政公司為確認取款人之真偽，得請其出示必要之證明","B":"中華郵政公司經營之郵政儲金匯兌業務，其會計帳務應獨立處理","C":"中華郵政公司經營之郵政儲金匯兌業務及該業務使用之郵政公用物、業務單據，於中華郵政公司成立之 日起 10 年內，免納一切稅捐","D":"中華郵政公司辦理郵政儲金之利率，應以年率為準，並於營業場所揭示"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"A","c":0.92,"s":"16 依郵政儲金匯兌法規定，下列何者非郵政儲金之運用範圍？","o":{"A":"投資期貨市場","B":"參與金融同業拆款市場","C":"投資公債、公司債、金融債券及短期票券","D":"提供（中長期）資金轉存金融機構辦理政府核准之重大建設及民間投資計畫"},"k":"升資","p":0,"d":"郵政儲金匯兌法 第十七條\n郵政儲金之運用範圍如下：\n一、 轉存中央銀行。\n二、 轉存中央銀行以外之其他金融機構。\n三、 投資公債、公司債、金融債券及短期票券。(由交通部會同金管會及中央銀行定之)\n四、 投資受益憑證及上市(櫃)股票。(由交通部會同金管會定之)\n五、 參與金融同業拆款市場。\n六、 \n提供(中長期)資金轉存金融機構辦理政府核准之重大建設及民間投資計畫\n。\n七、 其他經交通部、金融監督管理委員會及中央銀行核准者。\n順帶一提 \n簡易人壽保險法 第二十七條\n中華郵政公司得經交通部核可，提供重大公共建設計畫之融資所需款項\n0\n0\n相關試題\n 21 依郵政儲金匯兌法之規定，有關郵政儲金之運用範圍，下列何者錯誤？ (A)投資受益憑證及上市（櫃）股票 (B)轉存臺灣銀行以外之其他金融機構 (C)投資公債、公司債、金融債券及短期票券 (D)提供（中長期）資金轉存金融機構辦理政府核准之重大建設及"},{"l":3,"y":111,"a":"B","c":0.84,"s":"17 郵政儲金投資受益憑證及上市（櫃）股票之限制及運用管理辦法，由下列何者定之？","o":{"A":"由交通部會同金融監督管理委員會及中央銀行定之","B":"由交通部會同金融監督管理委員會定之","C":"由交通部會同中央銀行定之","D":"由交通部會同審計部定之"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"C","c":0.84,"s":"19 郵政儲金匯兌法對於郵政儲金業務之規定，下列敘述何者錯誤？","o":{"A":"中華郵政公司辦理劃撥儲金之劃撥支票業務，準用票據法有關支票之規定","B":"存簿儲金之利息，應免一切稅捐","C":"自治團體開立之存簿儲金戶，逾計息之最高存款限額，超過限額之數，不給利息","D":"公益法人開立之存簿儲金戶，逾計息之最高存款限額，超過限額之數，仍給利息"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"B","c":0.95,"s":"21 依郵政儲金匯兌法之規定，下列敘述何者錯誤？","o":{"A":"國內匯兌分為電匯及票匯二種","B":"郵政匯票應記載事項由財政部核定","C":"郵政匯票應記載事項由交通部核定","D":"國際匯兌分為電匯及票匯二種"},"k":"升資","p":0,"d":"第 21 條\n1.國內匯兌及國際匯兌，分為票匯及電匯二種。\n2.郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑。\n3.郵政匯票及郵政禮券應記載事項，由中華郵政公司擬訂，報交通部核定。"},{"l":3,"y":111,"a":"C","c":0.94,"s":"23 下列何者不適用郵政儲金匯兌法第 27 條金融檢查違規裁罰之規定？","o":{"A":"規避、妨礙或拒絕檢查","B":"隱匿或毀損業務或財務狀況之帳冊文件","C":"逕依第三者請求，洩漏顧客之郵政儲金或匯款等有關資料","D":"對檢查人員詢問其職務上之事項，無正當理由不為答復或故意答復不實"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"D","c":0.84,"s":"24 關於郵政儲金匯兌法規定之罰則，下列敘述何者正確？","o":{"A":"郵政儲金之運用未依郵政儲金匯兌法第 18 條授權訂定之限制及運用管理辦法辦理，處新臺幣 30 萬元以 上 250 萬元以下罰鍰","B":"中華郵政公司未依郵政儲金匯兌法第 10 條規定建立內部控制及稽核制度，處新臺幣 50 萬元以上 250 萬 元以下罰鍰","C":"中華郵政公司未於營業場所揭示郵政儲金利率，處新臺幣 50 萬元以上 150 萬元以下罰鍰","D":"中華郵政公司任意洩漏顧客之郵政儲金或匯款資料，處新臺幣 30 萬元以上 150 萬元以下罰鍰"},"k":"升資","p":0,"d":"第 26 條\n中華郵政公司有下列情事之一者，處新臺幣三十萬元以上一百五十萬元以下罰鍰：\n一、郵政儲金利率未依第九條規定以年率為準或未於營業場所揭示。\n(C)錯誤\n二、未依第十條規定建立內部控制及稽核制度。\n(B)錯誤\n三、違反第十一條第一項規定，逕依第三人請求，而停止帳戶交易活動或給付匯款；或違反第十一條第二項規定，洩漏顧客之郵政儲金或匯款等有關資料。\n(D)正確\n四、郵政儲金之運用未依第十八條授權訂定之限制及運用管理辦法辦理。\n(A)錯誤\n五、郵政儲金及匯兌業務未依第三十條授權訂定之監督管理辦法辦理。\n六、未經中央銀行之許可而辦理外匯業務。\n3\n0\n相關試題\n 25 郵政儲金匯兌法對於郵政禮券之規定，下列敘述何者錯誤？ (A)屬郵政匯兌業務之一種 (B)由中華郵政公司發行 (C)中華郵政公司依其面額對持有人無條件付款 (D)為記名之有價證券\n #3017603\n 26 依郵件處理規則規定"},{"l":3,"y":111,"a":"D","c":0.96,"s":"25 郵政儲金匯兌法對於郵政禮券之規定，下列敘述何者錯誤？","o":{"A":"屬郵政匯兌業務之一種","B":"由中華郵政公司發行","C":"中華郵政公司依其面額對持有人無條件付款","D":"為記名之有價證券"},"k":"升資","p":0,"d":"郵政禮券是不記名的有價證券。所以禮券是憑券兌領，不得掛失。\n0\n0\n相關試題\n 26 依郵件處理規則規定，無法投遞之包裹經寄件人表示拋棄者，下列處理方式何者正確？\r (A)依無法投遞郵件規定處理 (B)直接銷燬 (C)依無著郵件規定處理 (D)送交環保機關處理\n #3017604\n 27 依郵件處理規則規定，限時郵件投入收件人向郵局租用之專用信箱者，其送達時間，下列敘述何者正確？\r (A)郵件到達投遞局時間 (B)郵件投入信箱時間 (C)收件人開箱取件時間 (D)收件人拆閱郵件時間\n #3017605\n 28 郵件處理規則對於可追蹤函件之規定，下列敘述何者錯誤？\r (A)國際掛號函件 (B)由寄達郵政機構優先處理 (C)交由專差儘速投遞 (D)有提供網路追蹤資訊\n #3017606\n 29 依郵件處理規則規定，下列敘述何者錯誤？\r (A)印刷物得作小包或包裹交寄 (B)明信片因黏貼附件致表"},{"l":3,"y":111,"a":"A","c":0.96,"s":"30 中華郵政公司辦理郵政儲金匯兌業務，應建立內部控制及稽核制度；其辦法由何單位定之？","o":{"A":"交通部會同金融監督管理委員會","B":"交通部","C":"中央銀行","D":"金融監督管理委員會"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"C","c":0.63,"s":"25 下列何者為郵政儲金匯兌法第 1 條明定之立法目的？","o":{"A":"為健全郵政發展","B":"提供普遍、公平、合理之郵政服務","C":"增進民眾便利","D":"提供國民基本經濟保障"},"k":"升資","p":0,"d":"簡易人壽保險法\n-\n經濟健全便增福\n1.\n國民基本經濟保障\n2.\n健全簡易人壽保險制度\n3.\n便利全民投保，增進社會福祉\n郵政儲金匯兌法\n-\n儲資國民安\n1.\n鼓勵國民儲蓄\n2.\n促進資本形成\n3.\n配合國家政策\n4.\n增進民眾便利\n5.\n保障郵政儲金匯兌安全\n郵政法\n-\n健全公公\n1.\n健全郵政發展\n2.\n提供普遍、公平、合理之郵政服務\n3.\n增進公共利益"},{"l":3,"y":111,"a":"C","c":0.95,"s":"26 有關郵政儲金之敘述，下列何者正確？","o":{"A":"劃撥儲金之利息，應免一切稅捐","B":"儲戶存簿儲金若超過最高存款限額，該戶即全部不給任何利息","C":"劃撥儲金支票業務，準用票據法有關支票之規定","D":"儲戶印鑑遺失，雖未辦妥掛失，如若存款遭冒領，中華郵政公司仍應負責任"},"k":"升資","p":0,"d":"存簿儲金之利息，應免一切稅捐。\n存簿儲金，儲戶計息之最高存款限額，超過限額之數，不給利息。\n這項限制，政府機關、自治團體、公益法人不適用之。\n儲戶印鑑遺失，若未向中華郵政辦掛失止付，致金錢遭別人冒領。中華郵政不負賠償責任。"},{"l":3,"y":111,"a":"A","c":0.9,"s":"27 下列何者非屬郵政儲金運用範圍？","o":{"A":"從事衍生性商品交易","B":"轉存中央銀行以外之其他金融機構","C":"參與金融同業拆款市場","D":"投資公債、公司債、金融債券及短期票券"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"C","c":0.79,"s":"28 依郵政儲金匯兌法，有關郵政匯票之規定，下列敘述何者正確？","o":{"A":"郵政匯票受款人之兌領請求權，自收票日起算，3 年間不行使，因時效而消滅","B":"郵政匯票逾兌付期間未經兌款者，中華郵政公司應通知匯款人領回，並以原開發票據辦理退還匯費","C":"郵政匯票遺失或毀損，受款人得申請掛失或繳回，並領回匯款，原匯票即予作廢","D":"郵政匯票及郵政禮券應記載事項，由票據交換所擬訂，報交通部核定"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"C","c":0.83,"s":"29 下列何者為郵政儲金匯兌事務之主管機關？","o":{"A":"行政院","B":"金融監督管理委員會","C":"交通部","D":"中華郵政公司"},"k":"升資","p":0,"d":"郵政儲金匯兌\n第 2 條\n郵政儲金匯兌事務，由中華郵政股份有限公司（以下簡稱中華郵政公司）辦理，屬交通部主管，業務並受金融監督管理委員會監督；其涉及外匯業務經營者，應經中央銀行許可。\n6\n0\n相關試題\n 30 中華郵政公司經營郵政儲金匯兌事務，涉及外匯業務經營者，應經那一個機關許可？\r (A)財政部 (B)中央銀行 (C)行政院 (D)經濟部\n #3017458\n 31 中華郵政公司辦理郵政儲金匯兌業務違反法令、章程或有礙健全經營時，依郵政儲金匯兌法規定得為之處\r 分，下列敘述何者錯誤？ (A)撤銷法定會議之決議 (B)得予以糾正、命其限期改善 (C)停止全部或一部儲金匯兌業務 (D)命令解除辦理該項郵政儲金匯兌業務之負責人之職務或停止其於一定期間內執行職務\n #3017459\n 32 依郵政儲金匯兌法之規定，本法所定之罰鍰，由那個機關處罰之？\r (A)交通部 (B)金融監督管理委員會 ("},{"l":3,"y":111,"a":"B","c":0.98,"s":"30 中華郵政公司經營郵政儲金匯兌事務，涉及外匯業務經營者，應經那一個機關許可？","o":{"A":"財政部","B":"中央銀行","C":"行政院","D":"經濟部"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"C","c":0.71,"s":"31 中華郵政公司辦理郵政儲金匯兌業務違反法令、章程或有礙健全經營時，依郵政儲金匯兌法規定得為之處 分，下列敘述何者錯誤？","o":{"A":"撤銷法定會議之決議","B":"得予以糾正、命其限期改善","C":"停止全部或一部儲金匯兌業務","D":"命令解除辦理該項郵政儲金匯兌業務之負責人之職務或停止其於一定期間內執行職務"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"B","c":0.93,"s":"32 依郵政儲金匯兌法之規定，本法所定之罰鍰，由那個機關處罰之？","o":{"A":"交通部","B":"金融監督管理委員會","C":"行政院","D":"中央銀行"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"B","c":0.97,"s":"33 下列關於郵政儲金匯兌法之規定，何者錯誤？","o":{"A":"限制行為能力人，關於郵政儲金及匯兌事務，對中華郵政公司所為之行為，視為有行為能力人之行為","B":"辦理郵政儲金之利率，應以月率為準，並於營業場所揭示","C":"辦理郵政儲金之利率，應以年率為準，並於營業場所揭示","D":"無行為能力人，關於郵政儲金及匯兌事務，對中華郵政公司所為之行為，視為有行為能力人之行為"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"D","c":0.91,"s":"34 依郵政儲金匯兌法之規定，中華郵政公司辦理郵政儲金匯兌業務，下列何者錯誤？","o":{"A":"為確認取款人之真偽，得請其出示必要之證明","B":"經營之郵政儲金匯兌業務，其會計帳務應獨立處理之","C":"對於顧客之郵政儲金或匯款等有關資料，除其他法律或金融監督管理委員會另有規定外，應保守秘密","D":"非依金融監督管理委員會之指示，不得接受第三人有關停止帳戶交易活動或給付匯款之請求"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"A","c":0.96,"s":"35 中華郵政公司辦理郵政儲金匯兌業務，財務報表之揭露，未依規定之監督管理辦法辦理，應處何種金額 罰鍰？","o":{"A":"新臺幣 30 萬元以上 150 萬元以下罰鍰","B":"新臺幣 30 萬元以上 250 萬元以下罰鍰","C":"新臺幣 20 萬元以上 150 萬元以下罰鍰","D":"新臺幣 20 萬元以上 250 萬元以下罰鍰"},"k":"升資","p":0,"d":""},{"l":3,"y":111,"a":"C","c":0.53,"s":"37 依郵政儲金匯兌法第 30 條之規定，中華郵政公司辦理郵政儲金匯兌業務，下列那一選項所列事項之監督 管理辦法，由交通部會同相關監督機關定之？①負責人應具備之資格條件 ②郵局之遷移及裁撤 ③新增 業務之許可 ④內稽內控制度之建立","o":{"A":"①③④","B":"②③④","C":"①②③","D":"①②③④"},"k":"升資","p":0,"d":"第 10 條\n中華郵政公司辦理郵政儲金匯兌業務，應建立\n內部控制及稽核制度\n；其辦法，由\n交通部會同金融監督管理委員會定之。\n第 30 條\n中華郵政公司辦理郵政儲金匯兌業務\n，其新增業務之許可\n、財務報表之揭露、\n負責人\n之定義與其應具備\n資格條件\n、\n郵局之增設、遷移與裁撤\n及其他相關等事項之監督管理辦法，由\n交通部會同金融監督管理委員會定\n之；其涉及外匯業務者，並應會同中央銀行定之。"},{"l":3,"y":112,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，郵政匯票受款人之兌領請求權，自發票日起算，多久間不行使，因時效而消滅？","o":{"A":"一年","B":"二年","C":"三年","D":"四年"},"k":"內勤","p":1,"d":"第 22 條\n郵政匯票受款人之兌領請求權，自發票日起算，三年間不行使，因時效而消滅。"},{"l":3,"y":112,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司經營之郵政儲金匯兌業務，何者應獨立處理之？","o":{"A":"人事資料","B":"會計帳務","C":"政風事務","D":"客戶個資"},"k":"內勤","p":1,"d":"第7條（會計獨立）\n﹝1﹞中華郵政公司經營之郵政儲金匯兌業務，其\n會計帳務\n應獨立處理之。"},{"l":3,"y":112,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理何項業務，準用票據法有關支票之規定？","o":{"A":"劃撥儲金之劃撥支票業務","B":"存簿儲金之活期支票業務","C":"存簿儲金之劃撥支票業務","D":"劃撥儲金之活期支票業務"},"k":"內勤","p":1,"d":"郵政儲金匯兌法第16條\n中華郵政公司辦理劃撥儲金之劃撥支票業務，\n準用\n票據法有關支票之規定。\n46\n1"},{"l":3,"y":112,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，國內匯兌及國際匯兌，分為哪幾種？","o":{"A":"僅 AB","B":"僅 BC","C":"僅 ABC","D":"ABCD"},"k":"內勤","p":1,"d":"第 21 條\n國內匯兌及國際匯兌，分為票匯及電匯二種。\n郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑。\n郵政匯票及郵政禮券應記載事項，由中華郵政公司擬訂，報交通部核定。\nㅤㅤ"},{"l":3,"y":112,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，郵政匯兌除電匯外，應以何者為憑？ A.郵政匯票 B.郵政禮券 C.美金旅 行支票","o":{"A":"僅 A","B":"僅 AB","C":"僅 BC","D":"ABC"},"k":"內勤","p":1,"d":"第21條（郵政匯兌的種類）\n﹝1﹞國內匯兌及國際匯兌，分為票匯及電匯二種。\n﹝2﹞郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑。\n﹝3﹞郵政匯票及郵政禮券應記載事項，由中華郵政公司擬訂，報交通部核定。"},{"l":3,"y":112,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定 ， 郵政儲金之運用範圍 ， 下列敘述何者正確？ A.轉存中央銀行 B.投資受益 憑證及上市（櫃）股票 C.投資公債、公司債、金融債券及短期票券 D.參與金融同業拆款市場","o":{"A":"僅 AC","B":"僅 BC","C":"僅 ABD","D":"ABCD"},"k":"內勤","p":1,"d":"第十八條\n郵政儲金之運用範圍如下：\n一、 轉存中央銀行。\n二、 轉存中央銀行以外之其他金融機構。\n三、 投資公債、公司債、金融債券及短期票券。\n四、 投資受益憑證及上市(櫃)股票。\n五、 參與金融同業拆款市場。\n六、 提供(中長期)資金轉存金融機構辦理政府核准之重大建設及民間投資計畫。\n七、 其他經交通部、金融監督管理委員會及中央銀行核准者。\n前項第三款之投資限額、對象及其他交易之限制及運用管理辦法，由交通部會同金融監督管理委員會及中央銀行定之。\n第一項第四款之限制及運用管理辦法，由交通部會同金融監督管理委員會定之。"},{"l":3,"y":112,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，有關郵政儲金之利息，下列敘述何者正確？","o":{"A":"存簿儲金之利息，應免一切稅捐","B":"劃撥儲金之利息，應免一切稅捐","C":"郵政儲金之利息，應免一切稅捐","D":"郵政儲金之利息，於中華郵政公司成立之日起五年內，免納一切稅捐"},"k":"內勤","p":1,"d":"依《郵政儲金匯兌法》第20條規定：\n「存簿儲金之利息，應免一切稅捐。」\n因此：\n(A) ✔ 正確\n：法律明文規定只有\n存簿儲金\n的利息免一切稅捐。\n(B) ✘ 錯誤\n：劃撥儲金利息並沒有此免稅規定。\n(C) ✘ 錯誤\n：不是所有郵政儲金（如定期、劃撥）利息都免稅，僅限存簿儲金。\n(D) ✘ 錯誤\n：五年免稅的是\n中華郵政公司經營之郵政儲金匯兌業務及其業務使用之郵政公用物、業務單據\n，不是郵政儲金利息。該規定見《郵政儲金匯兌法》第8條。\n考試記憶口訣\n存簿利息 → 免稅\n（第20條）\n業務、公用物、單據 → 公司成立5年免稅\n（第8條）"},{"l":3,"y":112,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，有關存簿儲金，下列敘述何者錯誤？","o":{"A":"每一人或每一團體僅得為一戶","B":"儲戶計息之最高存款限額，由中華郵政公司擬訂","C":"政府機關、自治團體或公益法人超過存款限額之數，不給利息","D":"指存款人憑郵政儲金簿或依約定方式，隨時存入或提取之儲金"},"k":"內勤","p":1,"d":"存簿儲金，儲戶計息之最高存款限額，由中華郵政公司擬訂，\n報由交通部會同中央銀行及金融監督管理委員會定之"},{"l":3,"y":112,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，郵政匯票逾期未經兌款者，中華郵政公司應如何處理？","o":{"A":"通知匯款人領回，並退還全部匯費","B":"通知匯款人領回，匯款人不得要求退還匯費","C":"通知受款人領回，並退還部分匯費","D":"將該筆匯款繳交國庫"},"k":"營運職","p":1,"d":""},{"l":3,"y":112,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理郵政儲金匯兌業務，有下列何種情形時，由中華郵政公司 擬訂，報交通部核定？ A.郵政禮券應記載事項 B.投資受益憑證之限制及運用管理辦法 C.投資公債之 投資限額、對象及其他交易之限制及運用管理辦法","o":{"A":"僅 A","B":"僅 AB","C":"僅 C","D":"僅 BC"},"k":"營運職","p":1,"d":""},{"l":3,"y":112,"a":"C","c":1.0,"s":"Google 開發的智慧型個人助理「Google 助理」具有強大功能，能夠使用自然語言處理和使用者進行 雙向對話，這是屬於哪一種人工智慧的類型？","o":{"A":"超級人工智慧 Super AI","B":"強人工智慧 Strong AI","C":"弱人工智慧 Weak AI" ,"k":"專一","p":1,"d":""},{"l":3,"y":112,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，有關郵政匯兌，下列敘述何者錯誤？","o":{"A":"郵政匯票遺失或毀損，匯款人或受款人得申請掛失或繳回，並領回匯款，原匯票即予作廢","B":"國內匯兌及國際匯兌，分為信匯及電匯二種","C":"郵政匯票逾期未經兌款者，中華郵政公司應通知匯款人領回，匯款人不得要求退還匯費","D":"郵政匯票受款人之兌領請求權，自發票日起算，三年間不行使，因時效而消滅"},"k":"專一","p":1,"d":""},{"l":3,"y":112,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司有下列何種情事，處新臺幣三十萬元以上一百五十萬元以下 罰鍰？ A.未經中央銀行之許可而辦理外匯業務 B.未建立內部控制及稽核制度 C.逕依第三人請求，而 停止帳戶交易活動或給付匯款","o":{"A":"僅 AB","B":"僅 BC","C":"僅 AC","D":"ABC"},"k":"專一","p":1,"d":""},{"l":3,"y":112,"a":"B","c":0.71,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理外匯業務違反外匯法令之規定者，中央銀行得視情節之輕重，為下列何者行為？ A.停止其一定期間經營全部之業務 B.停止其一定期間經營一部外匯之業務 C.並通知交通部 D.並通知交通部及金融監督管理委員會，另處以罰鍰","o":{"A":"僅 AB","B":"僅 BC","C":"僅 ABC","D":"ABCD"},"k":"內勤","p":0,"d":"郵政儲金匯兌法  第十二條\n中華郵政公司辦理郵政儲金匯兌業務違反法令、章程或有礙健全經營時，金融監督管理委員會除得予以糾正、命其限期改善外，得視情節之輕重，為下列處分，並通知交通部：\n一、撤銷法定會議之決議。\n二、停止部分郵政儲金匯兌業務。\n三、命令解除辦理該項郵政儲金匯兌業務之負責人或職員之職務或停止其於一定期間內執行職務。\n四、其他必要之處置。\n中華郵政公司辦理外匯業務違反外匯法令之規定者，中央銀行得視情節之輕重，停止其一定期間經營全部或一部外匯之業務，並通知交通部。\nㅤㅤ\nㅤㅤ"},{"l":3,"y":112,"a":"B","c":0.62,"s":"郵政核心資通系統係指中華郵政公司支持何種業務持續運作必要或防護需求等級為高之該種業務資通系統？ A.郵務業務 B.儲金及匯兌業務 C.壽險業務","o":{"A":"僅 A","B":"僅 B","C":"僅 C","D":"ABC"},"k":"升等","p":0,"d":"郵政\n核心資通系統\n：指中華郵政公司\n支持儲金及匯兌業務持續運作必要或防護需求等級為高\n之\n儲金及匯兌業務資通系統。"},{"l":3,"y":112,"a":"D","c":0.79,"s":"依郵政儲金匯兌法規定，下列何機關得隨時派員或委託適當機構，攜帶證明文件，檢查中華郵政公司之郵政儲 金匯兌業務、財務及其他有關事項？","o":{"A":"中央銀行","B":"銀行公會","C":"交通部","D":"金融監督管理委員會"},"k":"升等","p":0,"d":"郵政儲金匯兌法第13條（\n接受檢查及提供相關資料之義務\n）【相關罰則】§27. ﹝1﹞ \n金融監督管理委員會\n得隨時派員或委託適當機構，攜帶證明文件，檢查中華郵政公司之郵政儲金匯兌業務、財務及其他有關事項，或令中華郵政公司於限期內據實提報財務報告、財產目錄或其他有關資料及報告。"},{"l":3,"y":112,"a":"D","c":0.84,"s":"依郵政儲金匯兌法規定，有關中華郵政公司辦理郵政儲金之利率，下列敘述何者正確？","o":{"A":"營業場所可不揭示","B":"應以日率為準","C":"應以月率為準","D":"應以年率為準"},"k":"升等","p":0,"d":""},{"l":3,"y":112,"a":"C","c":0.75,"s":"依郵政儲金匯兌法規定，國內匯兌及國際匯兌，分為下列何種？","o":{"A":"信匯、票匯及電匯","B":"信匯及電匯","C":"票匯及電匯","D":"信匯及票匯"},"k":"升等","p":0,"d":"國內匯兌及國際匯兌，分為\n票匯及電匯\n二種。\n​\n郵政匯兌除\n電匯\n外，應以\n郵政匯票或郵政禮券\n為憑。\n​郵政匯票及郵政禮券應記載事項，由\n中華郵政公司擬訂，報交通部核定\n。"},{"l":3,"y":112,"a":"C","c":0.72,"s":"依郵政儲金匯兌法規定，下列何者非屬郵政儲金之運用範圍？","o":{"A":"轉存中央銀行","B":"轉存中央銀行以外之其他金融機構","C":"提供（短期）資金轉存金融機構辦理政府核准之重大建設及民間投資計畫","D":"參與金融同業拆款市場"},"k":"升等","p":0,"d":"一、​轉存中央銀行。\n二、​轉存中央銀行以外之其他金融機構。\n三、​投資公債、公司債、金融債券及短期票券。\n四、​投資受益憑證及上市(櫃)股票。\n五、​參與金融同業拆款市場。\n六、​提供(中長期)資金轉存金融機構辦理政府核准之重大建設及民間投資計畫。\n七、​其他經交通部、金融監督管理委員會及中央銀行核准者。"},{"l":3,"y":112,"a":"C","c":0.8,"s":"依郵政儲金匯兌法規定，郵政匯票及郵政禮券應記載事項，由中華郵政公司擬訂，報請下列何機關核定？","o":{"A":"中央銀行","B":"銀行公會","C":"交通部","D":"金融監督管理委員會"},"k":"升等","p":0,"d":"第21條（郵政匯兌的種類）\n﹝1﹞ \n國內匯兌及國際匯兌，分為票匯及電匯二種\n。 ﹝2﹞ 郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑。 ﹝3﹞ 郵政匯票及郵政禮券應記載事項，由中華郵政公司擬訂，報交通部核定。"},{"l":3,"y":112,"a":"C","c":0.8,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理郵政儲金匯兌業務，其新增業務之許可、財務報表之揭露等事項之 監督管理辦法，由何機關定之？","o":{"A":"交通部","B":"金融監督管理委員會","C":"交通部會同金融監督管理委員會","D":"交通部會同金融監督管理委員會及銀行公會"},"k":"升等","p":0,"d":""},{"l":3,"y":112,"a":"B","c":0.47,"s":"下列何者業務之處理，除依萬國郵政聯盟所定郵政匯兌協定及其施行細則或我國與國外雙邊郵政匯兌協定辦理 外，依郵政儲金匯兌法規定辦理？","o":{"A":"僅國內匯兌","B":"僅國際匯兌","C":"國內匯兌或國際匯兌","D":"國內匯兌、國際匯兌或郵政禮券"},"k":"升等","p":0,"d":"國際匯兌之處理，除依萬國郵政聯盟所定郵政匯兌協定及其施行細則或我國與國外雙邊郵政匯兌協定辦理外，依本法之規定辦理。"},{"l":3,"y":112,"a":"D","c":0.84,"s":"依郵政儲金匯兌法規定，有關郵政儲金，下列敘述何者錯誤？","o":{"A":"儲戶提取存款之憑證遺失時，應向中華郵政公司辦理掛失止付","B":"儲戶提取存款之印鑑遺失時，應向中華郵政公司辦理掛失止付","C":"郵政儲金初次存入時，由存入之郵局，按其種類分別發給郵政儲金簿或單據，作為憑證","D":"在儲戶未辦妥掛失止付前，中華郵政公司對於依規定程序並已盡善良管理人注意義務所為之給付，縱係冒領，亦 須負責任"},"k":"升等","p":0,"d":"儲戶提取存款之\n憑證或印鑑\n遺失時，應向中華郵政公司辦理掛失止付；在儲戶未辦妥掛失止付前，中華郵政公司對於依規定程序並已盡善良管理人注意義務所為之給付，縱係冒領，亦不負責任。"},{"l":3,"y":112,"a":"B","c":0.66,"s":"依郵政儲金匯兌法規定，有關存簿儲金，下列敘述何者錯誤？","o":{"A":"指存款人憑郵政儲金簿或依約定方式，隨時存入或提取之儲金","B":"儲戶計息之最高存款限額，由中華郵政公司擬訂，報由交通部會同金融監督管理委員會定之","C":"每一人或每一團體僅得為一戶","D":"利息應免一切稅捐"},"k":"升等","p":0,"d":"中郵擬定,交通會同央行金管會定之\n30\n1"},{"l":3,"y":112,"a":"C","c":0.62,"s":"依郵政儲金匯兌法規定，中華郵政公司有下列何種情事之一者，處新臺幣三十萬元以上一百五十萬元以下罰鍰？ A.隱匿或毀損業務或財務狀況之帳冊文件 B.未依第十條規定建立內部控制及稽核制度 C.違反第十一條第二項規 定，洩漏顧客之郵政儲金或匯款等有關資料","o":{"A":"僅 AB","B":"僅 AC","C":"僅 BC","D":"ABC"},"k":"升等","p":0,"d":"A罰五十萬元以上二百五十萬元以下罰鍰"},{"l":3,"y":113,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司開辦「印尼小額安心匯款」前，應經下列何者許可？","o":{"A":"交通部","B":"經濟部","C":"中央銀行","D":"金融監督管理委員會"},"k"
