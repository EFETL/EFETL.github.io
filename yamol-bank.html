件，但\n不包括\n明信片、郵簡、印刷物、\n盲人文件\n。\n... 略..."},{"l":1,"y":110,"a":"B","c":0.76,"s":"有關郵件，下列敘述何者錯誤？","o":{"A":"郵件表面所書之收件人得有二人","B":"不包括新聞紙、書籍","C":"包括函件、包裹","D":"郵件之資費應反映合理利潤"},"k":"外勤","p":0,"d":"第 4 條\n本法用詞，定義如下： \n一、函件：指信函、明信片、郵簡、印刷物、盲人文件、小包之總稱。\n 二、信函：\n指寄交特定人或特定地址以傳達訊息之文件，\n但\n不包括明信片、郵簡、印刷物、盲人文件。 \n 五、印刷物：指新聞紙、雜誌、書籍、型錄等印刷文件。\n33\n1"},{"l":1,"y":110,"a":"C","c":0.83,"s":"有關郵件應按信函交寄者，下列敘述何者錯誤？","o":{"A":"明信片表面非平整光滑或有突出部分者","B":"國內郵簡夾寄附件","C":"直式明信片","D":"紙張經折疊壓製，外形類似明信片者"},"k":"外勤","p":0,"d":"第 6 條\n1.明信片因黏貼附件致表面欠缺平整光滑或有突出部分者，均應裝入封套內，按信函交寄。\n2.紙張經折疊壓製，外形類似明信片者，按信函交寄。"},{"l":1,"y":110,"a":"C","c":0.81,"s":"有關以新聞紙或雜誌交寄郵件，下列敘述何者正確？","o":{"A":"國內定期發行刊物得向文化部申請登記經同意後，向郵政公司以新聞紙或雜誌交寄","B":"國內定期發行刊物每日或每隔七日按期發行者為新聞紙","C":"國內定期發行刊物每隔七日以上三個月以下按期發行者為雜誌","D":"國內定期發行刊物經中華郵政公司認定屬商業性廣告得依新聞紙、雜誌交寄"},"k":"外勤","p":0,"d":"第 10 條\n國內定期發行之刊物，符合下列各款規定者，得向中華郵政公司申請登記，經同意後按新聞紙或雜誌交寄：\n一、以報導或評論政治、經濟、科學、文化或其他公益事項為目的之刊物。\n二、政府或民意機關發行之公報或宣傳政令刊物。\n前項所稱\n新聞紙，為每日或每隔六日以下按期發行者\n；\n所稱\n雜誌，為七日以上三個月以下按期發行者。\n第一項刊物，經中華郵政公司認定屬商業性廣告、宣傳品或公司行號發行為本身業務或特定個人宣傳者，不得依新聞紙或雜誌交寄。"},{"l":1,"y":110,"a":"B","c":0.8,"s":"依郵件處理規則規定，下列何者情形，包裹得通知收件人至郵局領取？","o":{"A":"收件人地址在2樓以上無電梯者","B":"應交付其他費用或應由收件人自辦驗關手續或應納稅捐在規定數額以上","C":"內裝禁寄物品須當面開驗者","D":"重量3公斤以上，收件人地址欠詳者"},"k":"外勤","p":0,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 51 條\n包裹\n有下列情形之一者，\n得\n通知\n收件人\n至\n郵局領取\n：\n一、破損須當面開驗。\n二、報值、保價或代收貨款金額達一定數額以上。\n三、應由\n收件人自辦驗關手續\n或\n應納稅捐在規定數額以上\n。\n四、應交付其他費用。\n五、重量在三公斤以上，其收件人地址車輛通行不便。"},{"l":1,"y":110,"a":"B","c":0.68,"s":"郵件經查有遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送，依郵 政法應予補償者，至遲應自何時起為之？","o":{"A":"查詢之次日起6個月內","B":"查詢之次日起3個月內","C":"查詢之次日起1個月內","D":"查詢之次日起15天內"},"k":"外勤","p":0,"d":"第 63 條\n郵件經查有遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送\n，依本法應予補償者，郵局應憑交寄執據或郵件封皮儘速支付補償金，\n至遲應自查詢之次日起三個月內為之\n。\n國際郵件，經查詢逾三個月仍未能獲致結果時，寄件人得以書面聲明，如不符合補償條件者，願將已領之補償金退還，向郵局申請先予補償。"},{"l":1,"y":110,"a":"B","c":0.77,"s":"依郵件處理規則規定，有關掛號郵件特別處理，下列敘述何者錯誤？","o":{"A":"國際掛號函件得依寄件人之申請，限定投交收件人本人親收","B":"國際掛號郵件，經寄件人報明價值加付報值費交寄者，為報值郵件","C":"報值郵件或保價郵件之報值金額或保價金額，不得超過內裝文件或物品之實際價值","D":"掛號郵件，經寄件人報明保價金額，加付保價費交寄者，為保價郵件"},"k":"外勤","p":0,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 30 條\n掛號郵件經\n寄件人\n報明價值\n加付\n報值\n費\n於\n國內\n互寄者，為\n報值\n郵件。\n掛號郵件經寄件人報明保價金額，加付保價費交寄者，為保價郵件。"},{"l":1,"y":110,"a":"B","c":0.89,"s":"有關因收件人或代收人地址變更，郵件須改向新地址投交，下列敘述何者正確？","o":{"A":"新地址在原投遞區域內者，為改寄","B":"新地址不在原投遞區域內，而須轉寄其他郵局投遞者，為改寄","C":"新地址不在原投遞區域內，而須轉寄其他郵局投遞者，為改投","D":"不予改投、改寄退回寄件人重寄"},"k":"外勤","p":0,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 53 條\n因收件人或代收人地址變更，郵件須改向新地址投交，新地址在原投遞區域內者，為改投；\n新地址不在原投遞區域內，而須轉寄其他郵局投遞者，為改寄。"},{"l":1,"y":110,"a":"C","c":0.91,"s":"依郵件處理規則規定，有關禁寄之文件或物品於郵局收寄後發現者處理方式，下列敘述何者錯誤？","o":{"A":"於原寄郵局發現物品之性質或其封裝有傷害郵政服務人員或污損郵件或郵政設備之虞者，退還寄件人","B":"易燃、易爆裂或其他危險物品，交相關主管機關處理","C":"放射性物品，除依規定送交相關主管機關處理外，退還寄件人","D":"鴉片、嗎啡及其他麻醉物品，交相關主管機關處理"},"k":"外勤","p":0,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 37 條\n下列文件或物品，禁止交寄：\n一、物品之性質或其封裝有傷害郵政服務人員或污損郵件或郵政設備之虞者。\n二、封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理者。\n三、易燃、易爆裂或其他危險物品。但立案機構以特殊方法封裝互寄之易壞生物學物料，經相關主管機關核發運輸憑照者，不在此限。\n四、活生動物。但蜜蜂、蠶、水蛭、由立案機構互寄之寄生蟲或為消除害蟲之蟲類、寄往日本之包裹內裝不夾泥土之無害活紅蚯蚓者，不在此限。\n五、放射性物品。\n六、鴉片、嗎啡及其他麻醉物品。但經相關主管機關核發運輸憑照或司法機關、司法警察機關備文證明係供訴訟證據之用，並作保價或報值郵件在國內互寄，或作保價郵件寄往國外供醫藥或科學之用，經寄達國准許者，不在此限。\n七、猥褻妨害風化之文件或物品。但由司法機關或司法警察機關備文證明係供訴訟證據之用，作掛號郵件互寄者"},{"l":1,"y":110,"a":"C","c":0.72,"s":"掛號及限時、快捷等郵件，經查係中華郵政公司未按公告之處理規定遞送或過失致延誤者之補償方 式，下列敘述何者錯誤？","o":{"A":"限時郵件、國內快捷郵件依所收取之全部資費補償","B":"國際快捷郵件依所收取全部資費之50%補償","C":"國際掛號函件依所收取之全部資費補償","D":"相關補償資費不含回執費"},"k":"外勤","p":0,"d":"郵件處理規則§64\n限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致者，其補償金額如下：\nV (A) \n限時郵件\n及\n國內快捷郵件\n，依所收取之\n全部資費補償\n。\nV (B)\n國際快捷郵件\n，依所收取全部資費之\n百分之五十補償\n。\nV(D)前二項之資費均不含報值費、保價費、代收貨款費及\n回執費\n。\n故(C)為答案\n有誤煩請告知~ 感謝\n59\n8"},{"l":1,"y":110,"a":"B","c":0.76,"s":"某甲於110年2月17日交寄國際快捷郵件至馬來西亞，重量為1.1公斤，郵資540元，託運單填寫 內件價值為新臺幣3,000元，經查詢寄達國郵政驗後確認全件遺失，應予補償，應給予新臺幣多少元（四 捨五入）？（國際貨幣基金特別提款權每1單位為新臺幣47元）","o":{"A":"2,113元","B":"2,653元","C":"3,000元","D":"5,113元"},"k":"外勤","p":0,"d":"4.5x1.1(kg)=4.95\n(4.95+40)x47元=2112.65\n約2113元再加上540\n補償2652.65\n整數 2653元"},{"l":1,"y":110,"a":"A","c":0.8,"s":"依郵件處理規則規定，無法投遞之國內非掛號雜誌，退回原寄郵局，並發單通知寄件人，自通知之 次日起多少期間內至指定郵局補付郵資領回？","o":{"A":"十五日","B":"一個月","C":"二個月","D":"三個月"},"k":"外勤","p":0,"d":"郵件處理規則§56\n無法投遞之國內\n非掛號新聞紙\n、\n雜誌\n，退回原寄郵局，並發單通知寄件人，\n自\n通知之次日起十五日內至指定郵局補付郵資領回\n；屆期未領者，依無著郵件規定處理。\n答案：A\n有誤請指正 ~ 感謝~"},{"l":1,"y":110,"a":"A","c":0.91,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"寄件人向郵局申請登記為電子函件用戶後，將文件資料透過網際網路傳送至電子郵局，列印轉成實體 郵件後投交收件人者，為電磁函件","B":"未付資費或未付足資費之郵件，為欠資郵件","C":"包裹經變賣或銷燬者，由中華郵政公司以拍照或其他適當方法存證備查","D":"大宗交寄之郵件，寄件人已依中華郵政公司之規定書寫郵遞區號，並分區捆紮者，得予優待"},"k":"外勤","p":0,"d":"郵件處理規則§17\n寄件人向郵局申請登記為電子函件用戶後，將文件資料透過網際網路傳送至電子郵局，列印轉成實體郵件後投交收件人者，為\n電\n子\n函件\n。\n故答案為A"},{"l":1,"y":110,"a":"A","c":0.82,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"郵票自核准之日起，始生交付郵費證明之效力","B":"郵件上之郵票或其他表示郵資已付之符誌，應逐一分開端正勻貼，不得重疊；其被掩蓋者，失其效用","C":"由明信片、特製郵簡或特製信封上剪下之郵資符誌，失其效用","D":"郵件上之郵票或其他表示郵資已付之符誌，有剪割、拼集、塗刮、塗抹膠漿或已使用且經洗刷者，不 為遞送"},"k":"外勤","p":0,"d":"免費公開 免費公開 免費公開 免鑽免鑽免鑽\n郵件處理規則第 18-1 條\n郵票自\n發行之日起\n，\n始生交付郵費證明之效力\n。"},{"l":1,"y":110,"a":"A","c":0.74,"s":"郵件以其機關或機構之地址為收件地址者，如接收郵件人員或郵件收發處拒收掛號郵件時， 應如何處理？","o":{"A":"通知收件人至郵局領取","B":"依無法投遞郵件規定處理","C":"依無著郵件規定處理","D":"退回原寄郵局"},"k":"模擬","p":0,"d":"郵件以其機關或機構之地址為收件地址者，得交與機關或機構內之接收郵件人員或郵件收發處。 \n接收郵件人員或郵件收發處拒收掛號郵件時，\n通知收件人至郵局領取\n。"},{"l":1,"y":110,"a":"B","c":0.86,"s":"經按址投遞而無法投交之掛號郵件及依規定通知領取之掛號郵件，均送交指定郵局招領，屆 期未領者退回寄件人，是以，103 年 6 月 16 日通知招領之掛號郵件，其招領到期日為何？","o":{"A":"103 年 6 月 30 日","B":"103 年 7 月 1 日","C":"103 年 7 月 4 日","D":"103 年 7 月 7 日"},"k":"模擬","p":0,"d":""},{"l":1,"y":110,"a":"C","c":0.82,"s":"某甲之住家將由基隆市中正區遷移至同市之仁愛區，新地址仍在原投遞局投遞區域內，為便 利郵件之收受，其得向郵局申請何項服務？","o":{"A":"轉址","B":"改址","C":"改投","D":"改寄"},"k":"模擬","p":0,"d":""},{"l":1,"y":110,"a":"A","c":0.83,"s":"自行加印「郵資已付」戳記之郵件，未貼足郵票自行投入信箱信筒者，應如何處理？","o":{"A":"依欠資郵件規定處理","B":"依無著郵件規定處理","C":"依無法投遞郵件規定處理","D":"公告招領"},"k":"模擬","p":0,"d":"請問 自行加印「郵資已付」戳記之郵件\n這樣算是 偽造有價\n或是 違反發行類似郵票？\n要罰金？"},{"l":1,"y":110,"a":"D","c":0.62,"s":"有關欠資郵件之處理，下列何者錯誤？","o":{"A":"欠資郵件經付清欠資及欠資手續費後，始得投遞","B":"收件人拒付欠資及欠資手續費，或因不能投遞退回原寄郵局時，向寄件人收取","C":"寄件人拒絕交付欠資及欠資手續費者，依無著郵件規定處理","D":"國內欠資小包或包裹經退回原寄郵局，由寄件人付清欠資及欠資手續費者，得由寄件人於 交付時，申請將該小包或包裹再向收件人投遞"},"k":"模擬","p":0,"d":"第五十五條\n欠資郵件未經付清欠資及欠資手續費者，不予投遞。收件人拒付欠資及欠資手續費，或因不能投遞退回原寄郵局時，向寄件人收取；寄件人拒絕交付者，依無著郵件規定處理。\n國內欠資\n信函、明信片\n經退回原寄郵局，由寄件人付清欠資及欠資手續費者，得由寄件人於交付時，申請將該信函、明信片再向收件人投遞。\n15\n1"},{"l":1,"y":110,"a":"B","c":0.73,"s":"郵件處理規則，有關期間之規定，何者錯誤？","o":{"A":"無法投遞之國內非掛號新聞紙、雜誌，寄件人應自通知之次日起 15 日內至指定郵局補付郵 資領回","B":"無法退還之無著郵件，內裝文件或物品係無價值或不得為買賣標的者，自郵件交寄日起屆 滿查詢期限 6 個月後銷燬之","C":"存證信函留存郵局之副本，自交寄日起，由郵局保存 3 年","D":"無法退還之無著郵件，內裝文件或物品係有價值或得為買賣標的者，自郵件交寄日起滿 3 年無人認領者，即變賣之"},"k":"模擬","p":0,"d":"內裝文件或物品係無價值或不得為買賣標的者，自郵件交寄日起屆滿查詢期限\n一個月後\n銷燬之。其性質易於腐壞或不能久存者，得由郵局隨時銷燬之。"},{"l":1,"y":110,"a":"D","c":0.63,"s":"國內郵件查詢期限為何，逾該期限者，郵局得不予查詢，並不負補償責任？","o":{"A":"交寄之日起 3 個月","B":"交寄之次日起 3 個月","C":"交寄之日起 6 個月","D":"交寄之次日起 6 個月"},"k":"模擬","p":0,"d":"郵件處理規則第60條       (110/10/30修法)\n掛號郵件之查詢期限自交寄之次日起算六個月。\n但國際快捷郵件之查詢期限自交寄之次日起算四個月。\n逾前項查詢期限者，郵局得不予提供查詢，並不負補償責任。"},{"l":1,"y":110,"a":"A","c":0.73,"s":"某甲之住家將由新北市中和區搬遷至臺中市大雅區，為便利收受郵件，其得向郵局申請何 項服務？","o":{"A":"改寄","B":"改投","C":"改址","D":"轉寄"},"k":"模擬","p":0,"d":"(A)\n改\n寄\n----\n非\n原投遞局\n(B)\n改投\n----原投遞局\n41\n1"},{"l":1,"y":110,"a":"A","c":0.77,"s":"某甲之住家將由新北市中和區搬遷至臺中市大雅區，為便利收受郵件，其得向郵局申請何項 服務？","o":{"A":"改寄","B":"改投","C":"改址","D":"轉寄"},"k":"模擬","p":0,"d":""},{"l":1,"y":111,"a":"D","c":1.0,"s":"下列法令何者與中華郵政股份有限公司之設置無關？","o":{"A":"公司法","B":"郵政法","C":"中華郵政股份有限公司設置條例","D":"郵件處理規則"},"k":"外勤","p":1,"d":"郵政公司雖是國營公司，但也是營利法人團體，設置也需照公司法規定\n\"郵件處理規則\"僅是針對中華郵政公司如何處理郵件的方式\n跟公司設置無關"},{"l":1,"y":111,"a":"B","c":1.0,"s":"某甲擬以電子函件交寄文件資料，依郵件處理規則規定，下列作法何者正確？","o":{"A":"寄件人攜帶電子文件資料至郵局窗口臨櫃交寄","B":"寄件人須向郵局申請登記為電子函件用戶","C":"寄件人透過網際網路傳送文件資料至任一實體郵局","D":"寄件人向郵局提供收件人電子文件資料與信箱網址傳送投交"},"k":"外勤","p":1,"d":"第十七條\n寄件人向郵局申請登記為電子函件用戶後，將文件資料透過網際網路傳送至電子郵局，列印轉成實體郵件後投交收件人者，為電子函件。"},{"l":1,"y":111,"a":"D","c":1.0,"s":"有關郵件處理規則訂定之法源依據為何？","o":{"A":"消費者保護法第 1 條","B":"簡易人壽保險法第 1 條","C":"郵政儲金匯兌法第 1 條","D":"郵政法第 48 條"},"k":"外勤","p":1,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 1 條\n本規則依\n郵政法\n（以下簡稱本法）第\n四十八條\n規定訂定之。\n4\n1"},{"l":1,"y":111,"a":"C","c":1.0,"s":"A 郵局收寄寄件人申請 「限定投交收件人本人親收」 之函件 ， 依郵件處理規則規定 ， 下列敘述何者錯誤？","o":{"A":"僅限國際掛號函件","B":"A 郵局應加收投交收件人親收之資費","C":"A 郵局應加收回執費","D":"函件封面應用國際郵務通用之法文或英文註明「投交收件人親收」字樣"},"k":"外勤","p":1,"d":"免費公開 免費公開 免費公開\n第 29 條\n1-國際掛號函件得依寄件人之申請，限定投交收件人本人親收。\n2-前項函件，除應加付投交收件人親收之資費外，其封面並應用國際郵務通用之法文或英文註明「投交收件人親收」字樣。\n97\n2"},{"l":1,"y":111,"a":"D","c":1.0,"s":"依郵件處理規則有關掛號郵件不予投入 i 郵箱之情形，下列何者錯誤？","o":{"A":"郵件外包裝出現破損者","B":"郵件附有回執者","C":"i 郵箱滿櫃，經投遞二次仍無空格櫃可供使用","D":"以報值、保價或代收貨款交寄郵件"},"k":"外勤","p":1,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 48-1 條\n掛號郵件有下列情形之一者，中華郵政公司\n不予投入i郵箱\n：\n一、體積過大致無法投入。\n二、外包裝出現破損。\n三、發生天災事變或其他不可抗力事由，致i郵箱毀（破）損或故障，無法達到投放功能。\n四、報值、保價或代收貨款金額逾中華郵政公司公告之金額。\n五、i郵箱滿櫃，經投遞二次仍無空格櫃可供使用。\n六、附有回執。\n七、無法重（補）製或複製之文件或物品。\n前項不予投入i郵箱之掛號郵件處理方式，由中華郵政公司公告之。"},{"l":1,"y":111,"a":"C","c":1.0,"s":"郵件經查遺失毀損或掛號郵件未依中華郵政公司公告之處理規定遞送應予補償者，郵局至遲應於下 列何期限內儘速支付補償金？","o":{"A":"至遲應自交寄之次日起 3 個月內為之","B":"至遲應自遺失之次日起 3 個月內為之","C":"至遲應自查詢之次日起 3 個月內為之","D":"至遲應自受理交寄憑據或郵件封皮次日起 3 個月內為之"},"k":"外勤","p":1,"d":"郵件處理規則第63條\n郵件經查有遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送，依本法應予補償者，郵局應憑交寄執據或郵件封皮儘速支付補償金，至遲應自查詢之次日起三個月內為之。\n國際郵件，經查詢逾三個月仍未能獲致結果時，寄件人得以書面聲明，如不符合補償條件者，願將已領之補償金退還，向郵局申請先予補償。\n27\n1"},{"l":1,"y":111,"a":"D","c":1.0,"s":"有關欠資郵件及處理之敘述，下列何者錯誤？","o":{"A":"未付資費或未付足資費之郵件，為欠資郵件","B":"欠資郵件，除另有規定外，向收件人收取欠資及欠資手續費","C":"欠資郵件未經付清欠資及欠資手續費者，不予投遞","D":"國內欠資包裹、小包、快捷由寄件人付清欠資及欠資手續費者，得於交付時由其申請將該包裹、小包、 快捷向收件人投遞"},"k":"外勤","p":1,"d":"(D)國內欠資\n包裹、小包、快捷\n由寄件人付清欠資及欠資手續費者，得於交付時由其申請將該\n包裹、小包、 快捷\n向收件人投遞\n國內欠資\n信函、明信片\n經退回原寄郵局，由寄件人付清欠資及欠資手續費者，得由寄件人於交付時，申請將該\n信函、明信片\n再向收件人投遞。\n75\n1"},{"l":1,"y":111,"a":"C","c":1.0,"s":"依郵件處理規則規定，有關收寄後發現禁止交寄之文件、物品之處理方式（不考慮例外情形），下 列何者正確？","o":{"A":"易燃、易爆裂或其他危險物品：退還寄件人","B":"活生動物：交相關主管機關處理","C":"鴉片、嗎啡及其他麻醉物品：交相關主管機關處理","D":"彩票及與彩票有關之廣告傳單：退還寄件人"},"k":"外勤","p":1,"d":"22.依郵件處理規則規定，有關收寄後發現禁止交寄之文件、物品之處理方式（不考慮例外情形），下 列何者正確？\n(A) 易燃、易爆裂或其他危險物品：爆炸違法--交相關主管機關處理\n(B) 活生動物：小貓小狗不收,可是沒違法，退還寄件人\n(C) 鴉片、嗎啡及其他麻醉物品：毒品違法--交相關主管機關處理\n(D) 彩票及與彩票有關之廣告傳單：賭博違法--交相關主管機關處理 \nㅤㅤ\n當然以上若有公文許可,為例外"},{"l":1,"y":111,"a":"B","c":1.0,"s":"依郵件處理規則規定，有關投遞之敘述，下列何者錯誤？","o":{"A":"郵件投遞區域分為按址投遞區域及不按址投遞區域","B":"寄交停泊港埠之船舶或其船員之郵件或未經外國軍艦艦長指定收件地址之郵件，留局待領","C":"掛號郵件應由收件人、代收人、代理人、同居家屬或收件地址之接收郵件人員、管理服務人員或郵件收 發處收領","D":"掛號郵件得經由中華郵政公司設置之智慧型收受郵件專用器具（i 郵箱）收領"},"k":"外勤","p":1,"d":"免費公開 免費公開 免費公開\n第 46 條\n寄交停泊港埠之本國或外國軍艦之郵件，向該艦艦長所指定之收件地址遞交之。外國軍艦之郵件，未經指定收件地址者，得向其使領館或經其指定之地址遞交。\n86\n1"},{"l":1,"y":111,"a":"A","c":1.0,"s":"某甲將價值新臺幣 （以下同）8,500 元 ， 重量為10 公斤物品 ， 以國際快捷郵件交寄A 國 ， 郵資共2,765 元，因寄達國遺失，通知補償，依郵政處理規則規定，請問下列補償金何者正確（國際貨幣基金特別提款 權 1 單位＝47 元）？","o":{"A":"新臺幣 6,760 元","B":"新臺幣 8,500 元","C":"新臺幣 9,883 元","D":"新臺幣 11,265 元"},"k":"外勤","p":1,"d":"國際包裹及國際快捷郵件遺失、被竊或毀損之補償金額，依國際貨幣基金特別提款權，每件以\n四十\n計算單位及按實重\n每公斤\n四點五\n計算單位，混合計算其數額。\n國際貨幣基金特別提款 權 1 單位＝\n47 \n元\n10(公斤)\n×\n4.5\n=45\n45+\n40\n=85\n85×\n47\n=3995\n3995+2765(把郵資還給人家)=6760\n113\n2"},{"l":1,"y":111,"a":"B","c":1.0,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"郵局認為郵件內裝有禁寄之文件或物品，或夾寄他人郵件者，得請寄件人或收件人當面拆驗，拒絕拆驗 者，不予遞送。拆驗時，其查閱不得逾越必要範圍","B":"收件人應承擔郵件因內裝有禁寄之文件、物品或不依規定交寄之責任","C":"郵寄法定紙幣、硬幣、金銀條塊、金銀器具、寶石珍飾等貴重物品，以法令許可者為限","D":"航空郵件收寄後，因不可歸責於中華郵政公司之事由，致郵件未能交由航空郵路運送時，得改由其他較 為迅速之郵路運送，所付航空資費不予退還"},"k":"外勤","p":1,"d":"(A)第 39 條\n郵局認為郵件內裝有禁寄之文件或物品，或夾寄他人郵件者，得請寄件人或收件人當面拆驗，拒絕拆驗者，不予遞送。拆驗時，其查閱不得逾越必要範圍。\n(B)第 40 條\n寄件人\n應承擔郵件因內裝有禁寄之文件、物品或不依規定交寄之責任，如致中華郵政公司或其他郵件受有損害者，該公司得向\n寄件人\n請求賠償。\n郵件雖經郵局收寄，\n寄件人\n仍不免除前項責任。\n(C)第 41 條\n郵寄法定紙幣、硬幣、金銀條塊、金銀器具、寶石珍飾等貴重物品，以法令許可者為限。\n(D)\n第 42 條\n郵件按其所付資費，分別由水陸郵路、航空郵路運送之。\n航空郵件收寄後，因不可歸責於中華郵政公司之事由，致郵件未能交由航空郵路運送時，得改由其他較為迅速之郵路運送，所付航空資費不予退還。"},{"l":1,"y":111,"a":"B","c":1.0,"s":"依郵件處理規則規定，下列敘述何者正確？","o":{"A":"掛號郵件之查詢期限自交寄之日起算六個月。但國際快捷郵件之查詢期限自交寄之日起算四個月","B":"掛號郵件之查詢期限自交寄之次日起算六個月。但國際快捷郵件之查詢期限自交寄之次日起算四個月","C":"掛號郵件之查詢期限自交寄之日起算四個月。但國際快捷郵件之查詢期限自交寄之日起算六個月","D":"掛號郵件之查詢期限自交寄之次日起算四個月。但國際快捷郵件之查詢期限自交寄之次日起算六個月"},"k":"外勤","p":1,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 60 條\n掛號郵件之查詢期限自交寄之次日起算六個月\n。\n但國際快捷郵件之查詢期限自交寄之次日起算四個月\n。\n逾前項查詢期限者，郵局得不予提供查詢，並不負補償責任。"},{"l":1,"y":111,"a":"D","c":1.0,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"中華郵政公司得委託他人運輸郵件","B":"中華郵政公司得委託他人收寄郵件","C":"中華郵政公司得委託他人投遞郵件","D":"中華郵政公司得委託他人拆閱及檢查郵件"},"k":"外勤","p":1,"d":"郵件處理規則 \n修正日期：民國 111 年 05 月 27 日\n第 52 條\n中華郵政公司\n得\n委託他人\n運輸郵件\n，其條件如下：\n一、陸路運輸：受託人須為汽車貨運業、汽車路線貨運業、汽車貨櫃貨運業、公路汽車客運業或鐵路機構。\n二、航空運輸：受託人須為航空貨運承攬業或航空運輸業。\n三、水路運輸：受託人須為船舶運送業、船務代理業或海運承攬運送業。\n中華郵政公司\n得\n委託他人\n收寄\n或\n投遞郵件\n，其條件如下：\n一、受託人為自然人者，須成年、國民中學以上學校畢業及身心健康。\n二、受託人為郵政代辦所者，除經理人須符合前款規定外，該代辦所應設於機關、學校、公司、行號、團體或其他公眾得自由出入之場所內。"},{"l":1,"y":111,"a":"A","c":1.0,"s":"依郵件處理規則規定，下列敘述何者正確？","o":{"A":"無法投遞之包裹經寄件人表示拋棄者，依無著郵件規定處理","B":"中華郵政公司於包裹轉運期間，發現其內容易於自然變質或消滅時，為寄件人之利益，得不經通知或其 他手續，立即變賣之。變賣所得全部價款，通知寄件人領取","C":"郵件上之郵票或其他表示郵資已付之符誌，應逐一分開端正勻貼，不得重疊；其被掩蓋者，不為遞送， 退還郵票現金價值予寄件人","D":"限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以收件人收件時間為送達時間"},"k":"外勤","p":1,"d":"(B) 中華郵政公司於包裹轉運期間，發現其內容易於自然變質或消滅時，為寄件人之利益，得不經通知或其 他手續，立即變賣之。\n變賣所得全部價款，通知寄件人領取\n第 16 條\n中華郵政公司於包裹轉運期間，發現其內容易於自然變質或消滅時，為寄件人之利益，得不經通知或其他手續，立即變賣之。無法變賣時，得銷燬之。\n包裹經變賣或銷燬者，由中華郵政公司以拍照或其他適當方法存證備查。\n第一項\n變賣所得價款，於扣除各項費用後，賸餘款項通知寄件人領取。"},{"l":1,"y":111,"a":"C","c":1.0,"s":"依郵件處理規則規定，有關無著郵件之敘述，下列何者錯誤？","o":{"A":"無法投遞或依規定不予寄遞而不能退還寄件人之郵件 ， 應由原寄郵局招領揭示一個月 ， 屆期無人領取者， 為無著郵件","B":"寄件人聲明拋棄或無法投遞免退回者，視為無著郵件","C":"無著郵件，由原寄郵局拆閱處理","D":"無著郵件，能獲知寄件人地址者，即將原件裝入特製封套，退還寄件人"},"k":"外勤","p":1,"d":"無著郵件由指定郵局拆閱處理"},{"l":1,"y":111,"a":"B","c":1.0,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"郵簡依寄遞區域分國內郵簡及國際航空郵簡二種","B":"任何人依中華郵政公司公告之紙質、尺寸、規格向其申請許可印製之郵簡，應於最醒目之位置註明許可 文字及號碼，限供自用","C":"國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按信函寄遞","D":"國際航空郵簡夾寄任何附件，經退還寄件人補足航空信函資費者，得劃去「航空郵簡」字樣及其同義之 國際郵務通用文字，改按航空信函寄遞"},"k":"外勤","p":1,"d":"第 7 條\n(A)郵簡依寄遞區域分國內郵簡及國際航空郵簡二種。\n(B)任何人依中華郵政公司公告之紙質、尺寸、規格向其申請許可印製之郵簡，\n應於指定位置註明許可文字及號碼\n，\n供自用或出售\n。\n第 8 條\n(C)國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按信函寄遞。\n(D)國際航空郵簡夾寄任何附件，經退還寄件人補足航空信函資費者，得劃去「航空郵簡」字樣及其同義之國際郵務通用文字，改按航空信函寄遞。無法退還者，應劃去「航空郵簡」字樣及其同義之國際郵務通用文字，改由水陸郵路寄遞。"},{"l":1,"y":111,"a":"A","c":0.97,"s":"10 以運送為業之鐵路、長途汽車、船舶、航空器，均有輔助載運郵件及其處理人員之責，相關載運費用，下 列敘述何者正確？","o":{"A":"由中華郵政公司與運送業者商訂之","B":"由中華郵政公司自行訂定之","C":"由交通部訂定之","D":"由交通部與內政部會商訂定之"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"C","c":0.92,"s":"26 依郵件處理規則規定，無法投遞之包裹經寄件人表示拋棄者，下列處理方式何者正確？","o":{"A":"依無法投遞郵件規定處理","B":"直接銷燬","C":"依無著郵件規定處理","D":"送交環保機關處理"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"B","c":0.95,"s":"27 依郵件處理規則規定，限時郵件投入收件人向郵局租用之專用信箱者，其送達時間，下列敘述何者正確？","o":{"A":"郵件到達投遞局時間","B":"郵件投入信箱時間","C":"收件人開箱取件時間","D":"收件人拆閱郵件時間"},"k":"升資","p":0,"d":"郵件處理規則\n第二十四條    \n限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以其投入時間為送達時間。\n0\n0\n相關試題\n 28 郵件處理規則對於可追蹤函件之規定，下列敘述何者錯誤？\r (A)國際掛號函件 (B)由寄達郵政機構優先處理 (C)交由專差儘速投遞 (D)有提供網路追蹤資訊\n #3017606\n 29 依郵件處理規則規定，下列敘述何者錯誤？\r (A)印刷物得作小包或包裹交寄 (B)明信片因黏貼附件致表面欠缺平整光滑或有突出部分者，均應裝入封套內，按信函交寄 (C)中華郵政公司以外之任何人印製之明信片，其紙質、規格不合規定者，按信函交寄 (D)國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按印刷物寄遞\n #3017607\n 30 中華郵政公司辦理郵政儲金匯兌業務，應建立內部控制及稽核制度；其辦法由何單位定之？\r (A)交通部會同金融監督管理委員會 (B)交通部 (C)中央銀"},{"l":1,"y":111,"a":"A","c":0.76,"s":"28 郵件處理規則對於可追蹤函件之規定，下列敘述何者錯誤？","o":{"A":"國際掛號函件","B":"由寄達郵政機構優先處理","C":"交由專差儘速投遞","D":"有提供網路追蹤資訊"},"k":"升資","p":0,"d":"國際非掛號函件\n，由寄達郵政機構優先處理並交由專差儘速投遞及提供網路追蹤資訊者，為可追蹤函件。"},{"l":1,"y":111,"a":"D","c":0.93,"s":"29 依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"印刷物得作小包或包裹交寄","B":"明信片因黏貼附件致表面欠缺平整光滑或有突出部分者，均應裝入封套內，按信函交寄","C":"中華郵政公司以外之任何人印製之明信片，其紙質、規格不合規定者，按信函交寄","D":"國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按印刷物寄遞"},"k":"升資","p":0,"d":"(D) 國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按印刷物寄遞\n郵件處理規則\n第 8 條\n國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按信函寄遞。\n1\n0\n相關試題\n 30 中華郵政公司辦理郵政儲金匯兌業務，應建立內部控制及稽核制度；其辦法由何單位定之？\r (A)交通部會同金融監督管理委員會 (B)交通部 (C)中央銀行 (D)金融監督管理委員會\n #3017608\n 31 下列敘述何者錯誤？\r (A)刊物經中華郵政公司認定屬於商業性廣告、宣傳品或公司行號發行為本身業務或特定個人宣傳者，不得 依新聞紙或雜誌交寄 (B)型錄郵件，指文件內容百分之五十以上為商品或服務之價格、功能、規格及使用方式，以文字、照片或 圖片方式印製者 (C)印刷物不得作小包或包裹交寄 (D)無法投遞之包裹經寄件人表示拋棄者，依無著郵件規定處理\n #3017609\n 32 對於依法應予補償之郵件，郵局應憑交寄執據"},{"l":1,"y":111,"a":"C","c":0.84,"s":"32 對於依法應予補償之郵件，郵局應憑交寄執據或郵件封皮儘速支付補償金，至遲應自查詢之次日起幾個月 內為之？","o":{"A":"1 個月","B":"2 個月","C":"3 個月","D":"6 個月"},"k":"升資","p":0,"d":"郵件處理規則第63條：郵件經查有遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送，依本法應予補償者，郵局應憑交寄執據或郵件封皮儘速支付補償金，至遲應自查詢之次日起三個月內為之。\n0\n0\n相關試題\n 33 依郵件處理規則規定，國際快捷郵件之查詢期限，下列何者正確？\r (A)自交寄之次日起算 1 個月 (B)自交寄之次日起算 3 個月 (C)自交寄之次日起算 4 個月 (D)自交寄之次日起算 6 個月\n #3017611\n 34 依郵件處理規則規定，下列敘述何者錯誤？\r (A)郵局認為郵件內裝有禁寄之文件或物品，或夾寄他人郵件者，得請寄件人或收件人當面拆驗，拒絕拆驗 者，不予遞送 (B)存證信函留存郵局之副本，自交寄之次日起，由郵局保存 3 年，期滿後銷燬之 (C)國際掛號函件得依寄件人之申請，限定投交收件人本人親收 (D)寄件人應承擔郵件因內裝有禁寄之文件、物品或不依規"},{"l":1,"y":111,"a":"C","c":0.87,"s":"33 依郵件處理規則規定，國際快捷郵件之查詢期限，下列何者正確？","o":{"A":"自交寄之次日起算 1 個月","B":"自交寄之次日起算 3 個月","C":"自交寄之次日起算 4 個月","D":"自交寄之次日起算 6 個月"},"k":"升資","p":0,"d":"郵件處理規則\n第 60 條\n1.掛號郵件之查詢期限自交寄之次日起算六個月。但國際快捷郵件之查詢期限自交寄之次日起算四個月。\n2.逾前項查詢期限者，郵局得不予提供查詢，並不負補償責任。\n0\n0\n相關試題\n 12 依郵件處理規則規定，掛號郵件之查詢期限，下列何者正確？ (A)自交寄之次日起算 3 個月 (B)自交寄之次日起算 4 個月 (C)自交寄之次日起算 6 個月 (D)自交寄之次日起算 1 年\n #3664250\n 34 依郵件處理規則規定，下列敘述何者錯誤？\r (A)郵局認為郵件內裝有禁寄之文件或物品，或夾寄他人郵件者，得請寄件人或收件人當面拆驗，拒絕拆驗 者，不予遞送 (B)存證信函留存郵局之副本，自交寄之次日起，由郵局保存 3 年，期滿後銷燬之 (C)國際掛號函件得依寄件人之申請，限定投交收件人本人親收 (D)寄件人應承擔郵件因內裝有禁寄之文件、物品或不依規定交寄之責任，如致中華郵"},{"l":1,"y":111,"a":"B","c":0.77,"s":"34 依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"郵局認為郵件內裝有禁寄之文件或物品，或夾寄他人郵件者，得請寄件人或收件人當面拆驗，拒絕拆驗 者，不予遞送","B":"存證信函留存郵局之副本，自交寄之次日起，由郵局保存 3 年，期滿後銷燬之","C":"國際掛號函件得依寄件人之申請，限定投交收件人本人親收","D":"寄件人應承擔郵件因內裝有禁寄之文件、物品或不依規定交寄之責任，如致中華郵政公司或其他郵件受 有損害者，該公司得向寄件人請求賠償"},"k":"升資","p":0,"d":"(B) 存證信函留存郵局之副本，自交寄之\n次日\n起，由郵局保存 3 年，期滿後銷燬之\n==>存證信函留存郵局之副本，自交寄\n日\n起，由郵局保存\n三年\n，期滿後銷燬之。"},{"l":1,"y":111,"a":"D","c":0.81,"s":"35 依郵件處理規則規定，有關郵件補償，下列敘述何者錯誤？","o":{"A":"快捷郵件全部遺失、被竊或毀損應予補償者，於給予補償金時，並退還其郵資","B":"代收貨款郵件全部遺失、被竊或毀損應予補償者，並退還其代收貨款費","C":"國際包裹及國際快捷郵件遺失、被竊或毀損之補償金額，依國際貨幣基金特別提款權，每件以 40 計算 單位及按實重每公斤 4.5 計算單位，混合計算其數額","D":"國內包裹及國內快捷郵件遺失、被竊或毀損之補償金額，單件以重量計費，超過 10 公斤者，不逾新臺 幣 1,515 元"},"k":"升資","p":0,"d":"包裹郵件、快捷郵件、報值郵件、保價郵件全部遺失、被竊或毀損應予補償者，於給與補償金時，並退還其郵資。但\n保價費、報值費\n，不予退還。\n代收貨款郵件全部遺失、被竊或毀損應予補償者，\n並退還其代收貨款費\n。\n5\n0\n相關試題\n 36 下列敘述何者錯誤？\r (A)郵票自發行之日起，始生交付郵費證明之效力 (B)郵件上之郵票或其他表示郵資已付之符誌，有剪割、拼集、塗刮、塗抹膠漿或已使用且經洗刷者，不為遞送 (C)由明信片、特製郵簡或特製信封上剪下之郵資符誌，失其效用 (D)郵件上之郵票或其他表示郵資已付之符誌，應逐件端正勻貼，其被掩蓋者仍然有效\n #3017614\n 37 下列何種文件或物品，非屬郵件處理規則第 37 條所列禁止交寄？\r (A)物品性質或其封裝有傷害郵政服務人員或污損郵件或郵政設備之虞者 (B)封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理者 (C)放射性物品 (D)農特產品\n #3"},{"l":1,"y":111,"a":"D","c":0.98,"s":"36 下列敘述何者錯誤？","o":{"A":"郵票自發行之日起，始生交付郵費證明之效力","B":"郵件上之郵票或其他表示郵資已付之符誌，有剪割、拼集、塗刮、塗抹膠漿或已使用且經洗刷者，不為遞送","C":"由明信片、特製郵簡或特製信封上剪下之郵資符誌，失其效用","D":"郵件上之郵票或其他表示郵資已付之符誌，應逐件端正勻貼，其被掩蓋者仍然有效"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"D","c":0.97,"s":"37 下列何種文件或物品，非屬郵件處理規則第 37 條所列禁止交寄？","o":{"A":"物品性質或其封裝有傷害郵政服務人員或污損郵件或郵 人可印製明信片，惟應向中華郵政公司申請許可並依公告之紙質、規格印製","C":"國內定期發行之刊物，符合郵件處理規則規定者，得向中華郵政公司申請登記，經同意後按新聞紙或雜 誌交寄","D":"中華郵政公司以外之任何人可印製郵簡，惟應向中華郵政公司申請許可並依公告之紙質、尺寸、規格 印製"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"B","c":0.85,"s":"16 依郵件處理規則規定，中華郵政公司得委託他人運輸郵件，有關陸路運輸之受託人，不包括下列何者？","o":{"A":"汽車路線貨運業","B":"巿區汽車客運業","C":"汽車貨櫃貨運業","D":"公路汽車客運業"},"k":"升資","p":0,"d":"根據\n中華郵政「郵件處理規則」第五十二條\n第一項第一款規定，中華郵政公司得委託他人辦理\n陸路運輸\n郵件，其合格的受託人資格\n僅限於下列 5 種對象\n： [\n1\n]\n汽車貨運業\n(A) 汽車路線貨運業\n(C) 汽車貨櫃貨運業\n(D) 公路汽車客運業\n鐵路機構\n4\n0\n相關試題\n 17 今有顧客某甲交寄國內報值包裹一件，重量 7 公斤（包裹郵資 100 元），報值金額 3,000 元（報值費 12 元）\r ， 總郵資合計 112 元，嗣因故全部毀損，請問某甲得向郵局請求之金額，下列何者正確？ (A) 865 元 (B) 3,000 元 (C) 3,100 元 (D) 3,112 元\n #3017445\n 18 有關郵件資費之規定，下列何者錯誤？\r (A)郵件交寄時，應依種類付足資費 (B)大宗交寄之郵件，寄件人已依中華郵政公司之規定書寫郵遞區號，並分區捆紮者，得予優待 (C)郵件需依規定作特別"},{"l":1,"y":111,"a":"C","c":0.74,"s":"17 今有顧客某甲交寄國內報值包裹一件，重量 7 公斤（包裹郵資 100 元），報值金額 3,000 元（報值費 12 元） ， 總郵資合計 112 元，嗣因故全部毀損，請問某甲得向郵局請求之金額，下列何者正確？","o":{"A":"865 元","B":"3,000 元","C":"3,100 元","D":"3,112 元"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"D","c":0.93,"s":"18 有關郵件資費之規定，下列何者錯誤？","o":{"A":"郵件交寄時，應依種類付足資費","B":"大宗交寄之郵件，寄件人已依中華郵政公司之規定書寫郵遞區號，並分區捆紮者，得予優待","C":"郵件需依規定作特別處理時，應另付特別處理費","D":"郵件之各種資費，由中華郵政公司之主管機關公告之"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"C","c":0.88,"s":"19 依郵件處理規則規定，下列那項已遞交之郵件，可交由郵局退回？","o":{"A":"報值郵件","B":"保價郵件","C":"尚未拆封之函件","D":"無拆過痕跡之包裹"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"C","c":0.55,"s":"20 易燃、易爆裂或其他危險物品，原則上為禁寄物品，郵件處理規則定有例外得為交寄之要件，下列何者不 屬之？","o":{"A":"立案機構以特殊方法封裝互寄者","B":"交寄之物為易壞生物學物料","C":"經中華郵政公司報請交通部核准者","D":"經相關主管機關核發運輸憑照者"},"k":"升資","p":0,"d":"第 37 條\n下列文件或物品，禁止交寄：\nㅤㅤ\n三、易燃、易爆裂或其他危險物品。但立案機構以\n特殊方法封裝\n互寄之\n易壞生物學物料\n，經相關主管機關\n核發運輸憑照者\n，不在此限。"},{"l":1,"y":111,"a":"C","c":0.69,"s":"21 依郵件處理規則第 48 條之 1 規定，掛號郵件有特殊情形者，中華郵政公司不予投入 i 郵箱，下列何者不 符該條文之敘述？","o":{"A":"體積過大致無法投入","B":"外包裝出現破損","C":"報值、保價或代收貨款金額逾主管機關公告之金額","D":"i 郵箱滿櫃，經投遞二次仍無空格櫃可供使用"},"k":"升資","p":0,"d":"第 48-1 條\n掛號郵件有下列情形之一者，中華郵政公司不予投入i郵箱：\n一、體積過大致無法投入。\n二、外包裝出現破損。\n三、發生天災事變或其他不可抗力事由，致i郵箱毀（破）損或故障，無法達到投放功能。\n四、報值、保價或代收貨款金額\n逾中華郵政公司公告\n之金額。\n五、i郵箱滿櫃，經投遞二次仍無空格櫃可供使用。\n六、附有回執。\n七、無法重（補）製或複製之文件或物品。"},{"l":1,"y":111,"a":"C","c":0.9,"s":"22 依郵件處理規則第 10 條之規定，郵件處理規則所稱「雜誌」 ，係指何者？","o":{"A":"每日或每隔 7 日以下按期發行者","B":"每日或每隔 6 日以下按期發行者","C":"7 日以上 3 個月以下按期發行者","D":"6 日以上 3 個月以下按期發行者"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"A","c":0.88,"s":"23 依郵件處理規則第 34 條之規定，存證信函留存郵局之副本，其保存年限為何？","o":{"A":"自交寄日起保存 3 年","B":"自交寄次日起保存 3 年","C":"自交寄日起保存 5 年","D":"自交寄次日起保存 5 年"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"A","c":0.81,"s":"24 小魚上週至郵局交寄的國內單件包裹，以外箱尺寸計費，其長 39 公分、寬 18 公分、高 28 公分，運送過 程中致包裹毀損，請問其補償金額為不逾新臺幣多少元？","o":{"A":"865 元","B":"375 元","C":"575 元","D":"1,155 元"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"B","c":0.81,"s":"36 中華郵政公司於金融監督管理委員會檢查業務時，對檢查人員詢問受查人職務上之事項，無正當理由不為 答復，應如何裁罰？","o":{"A":"處新臺幣 50 萬元以上 250 萬元以下罰金","B":"處新臺幣 50 萬元以上 250 萬元以下罰鍰","C":"處新臺幣 30 萬元以上 150 萬元以下罰金","D":"處新臺幣 30 萬元以上 150 萬元以下罰鍰"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"B","c":0.88,"s":"38 郵件處理規則所定有關在原寄郵局收寄後即發現係屬禁止交寄之文件或物品，其處理方式，下列何者 錯誤？","o":{"A":"國內互寄之活生寵物鼠，退還寄件人","B":"猥褻妨害風化之文件或物品，退還寄件人","C":"物品之封裝有傷害郵政服務人員之虞，退還寄件人","D":"封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理，退還寄件人"},"k":"升資","p":0,"d":"其他無例外這個有例外>猥褻妨害風化之文件或物品。但由司法機關或司法警察機關備文證明係供訴訟證據之用，作掛號郵件互寄者，不在此限。\n4\n1\n相關試題\n 39 中華郵政公司得以附約經營下列何者？\r (A)外幣保單 (B)利變型保險 (C)健康保險 (D) 1 年期定期壽險\n #3017467\n 40 下列何人的郵政簡易人壽保險之保險金額總數受有限制？\r (A)要保人 (B)被保險人 (C)受益人 (D)要保人及受益人\n #3017468\n 41 依郵政法之規定，中華郵政公司有特定郵件之專營權，下列何者屬之？\r (A)某甲公司交寄之國際快捷 (B)某乙機關交寄之國內包裹 (C)某丙軍事單位交寄之國內掛號信函 (D)某丁民眾交寄之國內印刷物\n #3017469\n 42 簡易人壽保險法所定之行政處罰，由何機構為之？\r (A)金融監督管理委員會 (B)交通部 (C)行政院 (D)中華民國人壽保險商業同"},{"l":1,"y":111,"a":"D","c":0.95,"s":"43 中華郵政公司壽險資金得經交通部核可，提供何種融資所需款項？","o":{"A":"重大國防建設計畫","B":"重大地方建設計畫","C":"重大科技建設計畫","D":"重大公共建設計畫"},"k":"升資","p":0,"d":""},{"l":1,"y":111,"a":"D","c":0.87,"s":"48 依郵件處理規則規定，下列何種禁寄之物品於郵局收寄後發現者，退還寄件人；外國寄來者，退回原寄郵局？","o":{"A":"易燃、易爆裂或其他危險物品","B":"放射性物品","C":"猥褻妨害風化之物品","D":"活生動物"},"k":"升資","p":0,"d":""},{"l":1,"y":112,"a":"D","c":1.0,"s":"甲先生向 A 郵局交寄包裹郵件 1 件重量 1.5 公斤並委託代收貨款 880 元，支付郵資 100 元，代收貨 款資費 30 元，郵遞過程中因故全部遺失，請問依郵件處理規則規定應補償多少元？","o":{"A":"880 元","B":"980 元","C":"910 元","D":"1,010 元"},"k":"外勤","p":1,"d":""},{"l":1,"y":112,"a":"C","c":1.0,"s":"依郵件處理規則規定，辦理關於掛號郵件查詢之期限，逾期郵局得不予提供查詢，並不負補償責任， 下列敘述何者正確？","o":{"A":"掛號郵件自交寄之日起 4 個月","B":"國內快捷自交寄之次日起 4 個月","C":"國際快捷郵件自交寄之次日起 4 個月","D":"存證信函掛號郵件自交寄之次日起 4 年"},"k":"外勤","p":1,"d":"第 60 條\n掛號郵件之查詢期限自交寄之次日起算六個月。但國際快捷郵件之查詢期限自交寄之次日起算四個月。"},{"l":1,"y":112,"a":"B","c":1.0,"s":"依郵件處理規則規定，下列何者國內欠資郵件由寄件人付清欠資及欠資手續費後，寄件人得申請再 向收件人投遞？","o":{"A":"新聞紙、雜誌","B":"信函、明信片","C":"印刷物、型錄","D":"包裹"},"k":"外勤","p":1,"d":""},{"l":1,"y":112,"a":"D","c":1.0,"s":"依郵件處理規則規定，包裹得通知收件人至郵局領取之情形，下列敘述何者錯誤？","o":{"A":"破損須當面開驗","B":"應由收件人自辦驗關手續或應納稅捐在規定數額以上","C":"報值、保價或代收貨款金額達一定數額以上","D":"重量在五公斤以上，其收件人地址車輛通行不便"},"k":"外勤","p":1,"d":"郵件處理規則\n第 51 條\n包裹有下列情形之一者，得通知收件人至郵局領取：\n一、\n破損須當面開驗\n。\n二、\n報值、保價或代收貨款金額達一定數額以上\n。\n三、\n應由收件人自辦驗關手續或應納稅捐在規定數額以上\n。\n四、\n應交付其他費用\n。\n五、\n重量在三公斤以上，其收件人地址車輛通行不便\n。\n(D)重量在\n五\n公斤以上，其收件人地址車輛通行不便\n   ➡️正確為\n三公斤\n40\n1"},{"l":1,"y":112,"a":"C","c":1.0,"s":"依郵件處理規則規定，有關掛號郵件收領方式，下列敘述何者錯誤？","o":{"A":"由收件人、代收人、代理人、同居家屬收領","B":"由收件地址之接收郵件人員、管理服務人員收領","C":"投入住戶受信箱","D":"投入 i 郵箱"},"k":"外勤","p":1,"d":"第 48 條\n掛號郵件應由收件人、代收人、代理人、同居家屬或收件地址之接收郵件人員、管理服務人員或郵件收發處收領。\n掛號郵件亦得經由中華郵政公司設置於道路、住宅、商場、工廠、機關、學校、公私團體及其他公眾出入處所，供民眾交寄或領取文件或物品之智慧型收受郵件專用器具（以下簡稱i郵箱）收領。"},{"l":1,"y":112,"a":"C","c":1.0,"s":"依郵件處理規則規定，下列何種郵件得依寄件人申請，以「限定投交收件人本人親收」收寄？","o":{"A":"國內快捷郵件","B":"國內存證信函掛號函件","C":"國際掛號函件","D":"國際包裹郵件"},"k":"外勤","p":1,"d":"第 29 條\n國際掛號函件得依寄件人之申請，限定投交收件人本人親收。\n前項函件，除應加付投交收件人親收之資費外，其封面並應用國際郵務通用之法文或英文註明「投交收件人親收」字樣。"},{"l":1,"y":112,"a":"A","c":1.0,"s":"依郵件處理規則規定，有關國內定期發行之刊物，得申請以新聞紙或雜誌交寄，其申請條件之敘述， 下列何者錯誤？","o":{"A":"得向中華民國出版商業同業公會全國聯合會申請登記，經同意後按新聞紙或雜誌交寄","B":"所稱新聞紙為每日或每隔六日以下按期發行者","C":"所稱雜誌為七日以上三個月以下按期發行者","D":"刊物經中華郵政公司認定屬商業性廣告、宣傳品或公司行號發行為本身業務或特定個人宣傳者，不得依 新聞紙或雜誌交寄"},"k":"外勤","p":1,"d":""},{"l":1,"y":112,"a":"A","c":1.0,"s":"依郵件處理規則規定，下列何者非屬已遞交之郵件，不得交由郵局退回之情形？","o":{"A":"附回執掛號郵件","B":"有拆過痕跡之函件","C":"報值或保價郵件","D":"包裹"},"k":"外勤","p":1,"d":"第 57 條\n已遞交之下列郵件，不得交由郵局退回：\n一、有拆過痕跡之函件。\n二、報值或保價郵件。\n三、包裹。"},{"l":1,"y":112,"a":"B","c":1.0,"s":"依郵件處理規則規定，有關郵件之改投、改寄，下列敘述何者正確？","o":{"A":"新地址在原投遞區域內者，為改寄","B":"新地址在原投遞區域內者，為改投","C":"新地址不在原投遞區域內，而須轉寄其他郵局投遞者，為改投","D":"包裹不得申請改投新地址"},"k":"外勤","p":1,"d":"根據中華郵政規定，若收件人地址變更，新地址仍在「原投遞郵局」的區域內，郵件改投新址稱為\n改投\n。若新地址已超出原投遞局區域，須轉寄至其他郵局，則稱為「改寄」。"},{"l":1,"y":112,"a":"D","c":1.0,"s":"甲 112 年 8 月 18 日交寄掛號郵件，經按址投遞 2 次而無法投交收件人，於 112 年 8 月 23 日通知招 領，請問屆期未領日期為何？","o":{"A":"112 年 9 月 2 日","B":"112 年 9 月 4 日","C":"112 年 9 月 6 日","D":"112 年 9 月 7 日"},"k":"外勤","p":1,"d":""},{"l":1,"y":112,"a":"D","c":1.0,"s":"依郵件處理規則規定，有關明信片之規定，下列敘述何者錯誤？","o":{"A":"明信片應依中華郵政公司公告之紙質、規格製作","B":"中華郵政公司以外之任何人印製之明信片，其紙質、規格不合規定者，按信函交寄","C":"明信片因黏貼附件致表面欠缺平整光滑或有突出部分者，均應裝入封套內，按信函交寄","D":"紙張經折疊壓製，外形類似明信片，得按明信片交寄"},"k":"外勤","p":1,"d":"第 5 條\n明信片應依中華郵政公司公告之紙質、規格製作。\n明信片紙張表面應平整光滑，不得有突出部分。\n明信片，分橫式、直式二種。\n中華郵政公司以外之任何人印製明信片者，應依前三項規定製作，並不得刊印「郵政」字樣及郵資符誌或類似花紋。\n中華郵政公司以外之任何人印製之明信片，其紙質、規格不合規定者，按信函交寄。\n第 6 條\n明信片因黏貼附件致表面欠缺平整光滑或有突出部分者，均應裝入封套內，按信函交寄。\n紙張經折疊壓製，外形類似明信片者，按信函交寄。"},{"l":1,"y":112,"a":"D","c":1.0,"s":"依郵件處理規則規定，有關國際包裹及國際快捷郵件遺失、被竊或毀損之補償金額， 依國際貨幣基 金特別提款權，以下列何者計算單位，混合計算其數額？","o":{"A":"每件以三十計算單位及按實重每公斤四計算單位","B":"每件以三十計算單位及按實重每公斤四點五計算單位","C":"每件以四十計算單位及按實重每公斤四計算單位","D":"每件以四十計算單位及按實重每公斤四點五計算單位"},"k":"外勤","p":1,"d":""},{"l":1,"y":112,"a":"C","c":1.0,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"郵票自發行之日起，始生交付郵費證明之效力","B":"郵件上之郵票或其他表示郵資已付之符誌，有剪割、拼集、塗刮、塗抹膠漿或已使用且經洗刷者，不為 遞送","C":"限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以收件人收件時間為送達時間","D":"由明信片、特製郵簡或特製信封上剪下之郵資符號，失其效用"},"k":"外勤","p":1,"d":"第 24 條\n限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以其投入時間為送達時間。\n7\n1"},{"l":1,"y":112,"a":"D","c":1.0,"s":"有關中華郵政公司得公告不按址投遞地區之郵件， 下列敘述何者正確？ A.孤島 B.羊腸小道在二 公里以上，非郵路所必經之地區 C.偏遠地區住戶或村落，平均一個月郵件不足四十件者 D.其他因交通 不便，投遞顯有困難，經中華郵政公司訂定之特殊區域","o":{"A":"僅 ABC","B":"僅 ABD","C":"僅 BCD","D":"ABCD"},"k":"外勤","p":1,"d":"第 49 條\n下列地區之郵件，中華郵政公司得不按址投遞，並公告之：\n一、深山。\n二、孤島。\n三、羊腸小道在二公里以上，非郵路所必經之地區。\n四、偏遠地區住戶或村落，平均一個月郵件不足四十件者。\n五、其他因交通不便，投遞顯有困難，經中華郵政公司訂定之特殊區域。"},{"l":1,"y":112,"a":"B","c":1.0,"s":"依郵件處理規則規定，無法投遞或依規定不予寄遞而不能退還寄件人之郵件，應由原寄郵局招領揭 示多久，屆期無人領取者，為無著郵件？","o":{"A":"15 天","B":"1 個月","C":"2 個月","D":"3 個月"},"k":"外勤","p":1,"d":"第 58 條\n無法投遞或依規定不予寄遞而不能退還寄件人之郵件，應由原寄郵局招領揭示一個月，屆期無人領取者，為無著郵件"},{"l":1,"y":112,"a":"D","c":0.8,"s":"甲先生向 A 郵局交包裹郵件 1 件重量 1.5 公斤並委託代收貨款 880 元，支付郵資 100 元，代收貨款資費 30 元，郵遞過程中因故全部遺失，請問依郵件處理規則規定應補償多少元？","o":{"A":"880 元","B":"980 元","C":"910 元","D":"1010 元"},"k":"外勤","p":0,"d":"郵件處理規則\n第 67 條\n包裹郵件、快捷郵件、報值郵件、保價郵件全部遺失、被竊或毀損應予補償者，於給予補償金時，並退還其郵資。但保價費、報值費，不予退還。\n代收貨款郵件全部遺失、被竊或毀損應予補償者，並退還其代收貨款費\n。\n880+100+30=1010\n54\n2"},{"l":1,"y":112,"a":"B","c":0.83,"s":"依郵件處理規則規定，下列何者國内欠資郵件由寄件人付清欠資及欠資手續費後，寄件人得申請再向收件人 投遞？","o":{"A":"新聞紙、雜誌","B":"信函、明信片","C":"印刷物、型錄","D":"包裹"},"k":"外勤","p":0,"d":"第55條\n國內欠資信函、明信片經退回原寄郵局，由寄件人付清欠資及欠資手續費者，得由寄件人於交付時，申請將該信函、明信片再向收件人投遞"},{"l":1,"y":112,"a":"A","c":0.88,"s":"勿依郵件處理規則規定，有關國内定期發行之刊物，得申請以新聞紙或雑誌交寄，其申請條件之敘述，下列 何者錯誤？","o":{"A":"得向中華民國出版商業同業公會全國聯合會申請登記，經同意後按新聞紙或雑誌交寄","B":"所稱新聞紙為每日或每隔六日以下按期發行者","C":"所稱雑誌為七日以上三個月以下按期發行","D":"刊物經中華郵政公司認定屬商業性廣告、宣傳品或公司行號發行為本身業或特定個人宣傳 者，不得依新聞紙或雜誌交寄"},"k":"外勤","p":0,"d":"第 10 條\n國內定期發行之刊物，符合下列各款規定者，得向中華郵政公司申請登記，經同意後按新聞紙或雜誌交寄："},{"l":1,"y":112,"a":"D","c":0.89,"s":"如甲 112 年 8 月 18 日交寄掛號郵件，經按址投遞 2 次而無法投交收件人，於 112 年 8 月 23 日通知招領，請 問屆期未領日期為何？","o":{"A":"112 年 9 月 2 日","B":"112 年 9 月 4 日","C":"112 年 9 月 6 日","D":"112 年 9 月 7 日"},"k":"外勤","p":0,"d":"第 50 條\n經按址投遞而無法投交之掛號郵件及依規定通知領取之掛號郵件，均送交指定郵局招領；其招領期間，自通知招領之次日起算十五日，屆期未領者，退回寄件人。"},{"l":1,"y":112,"a":"D","c":0.85,"s":"依郵件處理規則規定，有關國際包裹及國際快捷郵件遗失、被竊或毁損之補償金額，依國際貨幣基金特别提 款權，以下列何者計算單位，混合計算其數額？","o":{"A":"每件以三十計算單位及按實重每公斤四計算單位","B":"每件以三十計算單位及按實重每公斤四點五計算單位","C":"每件以四十計算單位及按實重每公斤四計算單位","D":"每件以四十計算單位及按實重每公斤四點五計算單位"},"k":"外勤","p":0,"d":"第65條\n國際包裹及國際快捷郵件遺失、被竊或毀損之補償金額，依國際貨幣基金特別提款權，每件以四十計算單位及按實重每公斤四點五計算單位，混合計算其數額"},{"l":1,"y":112,"a":"C","c":0.79,"s":"下列何者不是中華郵政公司經營郵務業務所依據的規定？","o":{"A":"郵政法","B":"郵件處理規則","C":"公司設置條例","D":"公司章程規定"},"k":"半日制","p":0,"d":"第一條\n本公司依郵政法、郵件處理規則及公司章程規定，經營郵務業務。"},{"l":1,"y":112,"a":"B","c":0.71,"s":"依郵件處理規則規定，有關明信片，下列敘述何者正確？","o":{"A":"紙張經折疊壓製，外形似明信片為明信片","B":"明信片黏貼附件致表面有突出部份者，應裝入封套內按信函交寄","C":"中華郵政公司以外任何人印製明信片其紙質、規格由交通部訂定","D":"中華郵政公司以及其他任何人印製明信片均應刊印「郵政」字樣"},"k":"升等","p":0,"d":"第五條\n明信片應依中華郵政公司公告之紙質、規格製作。\n明信片紙張表面應平整光滑，不得有突出部分。\n明信片，分橫式、直式二種。\n中華郵政公司以外之任何人印製明信片者，應依前三項規定製作，並不得刊印「郵政」字樣及郵資符誌或類似花紋。\n中華郵政公司以外之任何人印製之明信片，其紙質、規格不合規定者，按信函交寄\nㅤㅤ\n(C) 中華郵政公司以外任何人印製明信片其紙質、規格由\n交通部\n訂定"},{"l":1,"y":112,"a":"A","c":0.7,"s":"依郵件處理規則規定，有關電子函件交寄，下列敘述何者正確？","o":{"A":"寄件人須向郵局申請登記成為電子函件用戶","B":"寄件人持電子文件資料向指定郵局臨櫃交寄","C":"指定郵局轉成電子函件向收件人發送電子郵件","D":"電子函件不受理掛號交寄"},"k":"升等","p":0,"d":"什麼是電子函件業務?\n電子函件是寄件者將個人電腦編製完成的文件，透過郵局提供的\n電腦軟體\n轉換成電子格式郵件，藉由網路傳送至郵局主機，經主機依郵遞區號排序整理後，封發至列封點，並以自動化高速列印封裝設備，轉換成實體郵件，再由郵差遞送給收件人的\n新種郵寄方式。\n適用範圍\n1、\n一般函件\n：信函、宣傳單、各式通知、研究報告、定期會訊、邀請函...等。\n2、\n各式套用格式之表報\n：對帳單、成績單、扣繳憑單、檢驗報告...等。"},{"l":1,"y":112,"a":"A","c":0.7,"s":"依郵件處理規則規定，有關禁寄物品之處置，下列敘述何者正確？","o":{"A":"原寄郵局發現封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理者，退還寄件人","B":"原寄郵局發現活生動物，交相關主管機關處理","C":"鴉片、嗎啡及其他麻醉物品，退還寄件人","D":"彩票及與彩票有關之廣告傳單，退還寄件人"},"k":"升等","p":0,"d":"第 37 條\n下列文件或物品，禁止交寄：\n一、物品之性質或其封裝有傷害郵政服務人員或污損郵件或郵政設備之虞者。\n二、封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理者。\n三、易燃、易爆裂或其他危險物品。但立案機構以特殊方法封裝互寄之易壞生物學物料，經相關主管機關核發運輸憑照者，不在此限。\n四、活生動物。但蜜蜂、蠶、水蛭、由立案機構互寄之寄生蟲或為消除害蟲之蟲類、\n寄往日本之包裹內\n裝不夾泥土之無害活紅蚯蚓者，不在此限。\n五、放射性物品。\n六、鴉片、嗎啡及其他麻醉物品。但經相關\n主管機關核發運輸憑照\n或司法機關、司法警察機關備文證明\n係供訴訟證據之用\n，並作保價或報值郵件在國內互寄，或作保價郵件寄往國外供醫藥或科學之用，經寄達國准許者，不在此限。\n七、猥褻妨害風化之文件或物品。但由司法機關或司法警察機關備文證明係供訴訟證據之用，作掛號郵件互寄者，不在此限。\n八、寄達國禁止輸入或流通之文件或物品。"},{"l":1,"y":112,"a":"C","c":0.67,"s":"依郵件處理規則規定，郵件投遞區域分為按址投遞區域及不按址投遞區域，下列敘述何者非得公告為不按址投 遞？","o":{"A":"深山、孤島","B":"偏遠地區住戶或村落，平均一個月郵件不足四十件者","C":"曲折迂迴巷弄","D":"收件地址飼養之動物有攻擊郵政服務人員或中華郵政公司委託遞送郵件人員之虞，經通知未改善者"},"k":"升等","p":0,"d":"郵件以機關、學校、公司、行號、團體、事務所或其他機構（以下簡稱機關或機構）或其負責人、員工、居住人為收件人或寄由其轉交者，均以其機關或機構為其收件地址。\n前項機關或機構之分支機關或機構，與本機關或總機構設在同一處所時，其郵件得交與本機關或總機構。\n郵件以其機關或機構之地址為收件地址者，得交與機關或機構內之接收郵件人員或郵件收發處。接收郵件人員或郵件收發處拒收掛號郵件時，通知收件人至郵局領取。\n9\n2"},{"l":1,"y":112,"a":"B","c":0.6,"s":"依郵件處理規則規定，郵件以其機關或機構之地址為收件地址者，有關其投遞方式，下列敘述何者錯誤？","o":{"A":"以機關或機構之地址為收件地址之郵件得交與其接收郵件人員或郵件收發處","B":"機關或機構接收郵件人員或郵件收發處拒收掛號郵件時，依無法投遞郵件退還寄件人","C":"分支機關或機構與本機關或總機構設在同一處所時，其郵件得交與本機關或總機構","D":"郵件寄由機關或機構轉交者，均以其機關或機構為其收件地址"},"k":"升等","p":0,"d":"(B) \n機關或機構接收郵件人員或郵件收發處\n拒收掛號郵件\n時\n，\n依無法投遞郵件退還寄件人 \n→ \n通知收件人至郵局領取\n。"},{"l":1,"y":112,"a":"D","c":0.59,"s":"依郵件處理規則規定，有關限時郵件，下列敘述何者錯誤？","o":{"A":"國內郵件加付限時費，按班限時投遞者，為限時郵件","B":"限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以其投入時間為送達時間","C":"限時郵件遞送延誤，經查明為中華郵政公司之過失所致者，依所收取之全部資費補償","D":"寄件人自願放棄延誤補償金，而請求補寄相同之國內郵件者，得免費收寄之"},"k":"升等","p":0,"d":"依郵件處理規則規定，有關限時郵件，下列敘述何者錯誤？\n(A) 國內郵件加付限時費，按班限時投遞者，為限時郵件\n(B) 限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以其投入時間為送達時間\n(C) 限時郵件遞送延誤，經查明為中華郵政公司之過失所致者，依所收取之全部資費補償\n(D) 寄件人自願放棄\n延誤\n補償金，而請求補寄相同之國內郵件者，得免費收寄之----(\n遞送延誤\n)\n第 23 條\n國內郵件加付限時費，按班限時投遞者，為限時郵件。\n第 24 條\n限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以其投入時間為送達時間。\n第 64 條\n1.包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，依下列規定：\n   一、國內掛號函件，每件為新臺幣五百七十五元。\n   二、國際掛號函件，每件依國際貨幣基金特別提款權三十計算單位，計算其補償金額。\n   三"},{"l":1,"y":112,"a":"C","c":0.74,"s":"依郵件處理規則規定，有關存證信函，下列敘述何者錯誤？","o":{"A":"應以掛號信函交寄","B":"留存郵局之副本自交寄日起由郵局保存三年","C":"郵局留存之副本期滿後通知寄件人領回銷燬","D":"應加付存證相關資費並依中華郵政公司規定方式繕寫"},"k":"升等","p":0,"d":"存證信函留存郵局之副本，自交寄日起，由郵局保存三年，期滿後銷燬之。"},{"l":1,"y":112,"a":"B","c":0.61,"s":"依郵件處理規則規定，有關無著郵件之處理，下列敘述何者正確？","o":{"A":"無著郵件，由內政部指定之郵局拆閱處理","B":"無著郵件經郵局拆閱能獲知寄件人地址者，即將原件裝入特製封套，退還寄件人","C":"無法退還無著郵件內裝文件或物品係無價值或不得為買賣標的者，自郵件交寄日起屆滿查詢期限六個月後銷燬之","D":"無法退還無著郵件內裝文件或物品係有價值或得為買賣標的者，自郵件交寄日起滿一年無人認領者，即變賣之"},"k":"升等","p":0,"d":"郵件處理規則第59條\n無著郵件，由中華郵政公司指定之郵局拆閱處理，能獲知寄件人地址者，即將原件裝入特製封套，退還寄件人；無法退還者，依下列規定處理：\n一、內裝文件或物品係無價值或不得為買賣標的者，自郵件交寄日起屆滿查詢期限一個月後銷燬之。其性質易於腐壞或不能久存者，得由郵局隨時銷燬之。\n二、內裝文件或物品係有價值或得為買賣標的者，自郵件交寄日起滿三年無人認領者，即變賣之；其性質易於腐壞、不能久存或數量有消減之虞者，得先行變賣，並將價款保存至郵件交寄日起滿三年為止。\n前項退還寄件人之郵件，原件為欠資郵件或按規定應補付郵資差額或另付資費者，於投交時向寄件人收取。\nA:中華郵政公司指定之郵局\nC:一個月\nD:三年"},{"l":1,"y":113,"a":"B","c":0.71,"s":"有關存證信函，下列敘述何者錯誤？","o":{"A":"使用不脫色筆或打字複寫，或書寫後複印、影印，每格限書一字，均需色澤明顯，字跡端正","B":"寄件人不願自留副本者，得僅作成副本一份。需增加正本或副本由郵局證明者，增加之份數每份按存證費收費","C":"存證信函同時交寄兩件以上，其內容完全相同，僅收件人姓名、地址及郵遞區號不同者，得作成總副本二份，並將各收件人姓名、地址及郵遞區號另紙聯記一併交與郵局。除第一件外，餘件按存證費減半收費","D":"存證信函留存郵局之副本，依郵件處理規則第三十四條第二項規定，自交寄日起，由郵局保存三年，期滿後銷燬之"},"k":"半日制","p":0,"d":"第一百十三條\n1 寄件人交寄存證信函，應依下列規定：\n 一、使用郵局存證信函用紙或其他符合郵局規定之格式紙張書寫。\n 二、使用本國文字，並得加註標點符號或阿拉伯數字。但信內述及之外國人名或事物名稱必須引用原文者，得用外國文字書寫。\nA: 三、使用不脫色筆或打字複寫，或書寫後複印、影印，每格限書一字，均需色澤明顯，字跡端正。\n 四、信函內之寄件人及收件人姓名、地址及郵遞區號與封面所書(示)者相同。\n 五、信函如有附件，以與存證信函本身有關文件為限，文件以外之物品不得附寄。正本具有附件者，副本亦須備附件，如無法製備者，應\n以照片或影印本代替。\n 六、存證信函正副本文字，如有塗改增刪，應於正副本之末註明「在某頁某行第幾格下塗改增刪若干字」字樣，由寄件人簽名或蓋章。但\n塗改增刪每頁不得逾二十字。\n2 寄件人交寄存證信函亦得於郵局提供之網路平台繕打或匯入檔案後，傳輸至郵局列印之。\n第一百十四條\n1 "},{"l":1,"y":114,"a":"C","c":1.0,"s":"依郵件處理規則規定，中華郵政公司經公告後，得不按址投遞地區，下列何者錯誤？","o":{"A":"偏遠地區住戶或村落，平均一個月郵件不足四十件者","B":"深山","C":"羊腸小道在一公里以上","D":"孤島"},"k":"外勤","p":1,"d":"(C) 羊腸小道在一公里以上\n(C) 羊腸小道在\n二\n公里以上，\n非郵路必經之地"},{"l":1,"y":114,"a":"B","c":1.0,"s":"依郵件處理規則規定，中華郵政公司得委託他人運輸郵件，其中未包含下列何者？","o":{"A":"公路汽車客運業","B":"計程車運輸業","C":"航空運輸業","D":"船務代理業"},"k":"外勤","p":1,"d":""},{"l":1,"y":114,"a":"C","c":1.0,"s":"依郵件處理規則規定，有關掛號郵件不予投入 i 郵箱之情形，下列何者錯誤？","o":{"A":"郵件體積過大致無法投入","B":"郵件外包裝出現破損","C":"以報值、保價或代收貨款金額未逾中華郵政公司公告之金額","D":"無法重（補）製或複製之文件或物品"},"k":"外勤","p":1,"d":"(C) 以報值、保價或代收貨款金額\n未\n逾中華郵政公司公告之金額\n(C) 以報值、保價或代收貨款金額\n逾\n中華郵政公司公告之金額"},{"l":1,"y":114,"a":"B","c":1.0,"s":"依郵件處理規則規定，限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，下列何種時間為送達時間？","o":{"A":"以送達投遞局時間為送達時間","B":"以投入專用信箱或專用信袋時間為送達時間","C":"以收件人收取郵件時間為送達時間","D":"以寄件人寄交信件時間為送達時間"},"k":"外勤","p":1,"d":""},{"l":1,"y":114,"a":"D","c":1.0,"s":"依郵件處理規則規定 ， 郵局收寄後發現禁止交寄之文件或物品之處理方式 （不考慮例外情形） ， 下列何者正確？","o":{"A":"活生動物：交相關主管機關處理","B":"放射性物品：退還寄件人","C":"易燃、易爆裂或其他危險物品：退還寄件人","D":"寄達國禁止輸入或流通之文件或物品：除依規定送交相關主管機關處理外，退還寄件人"},"k":"外勤","p":1,"d":"觀念記法，\n平常的情況下，都不讓你持有或者本身就是違法的東西，\n怎麼還會笨笨的退給你，直接交主管機關了呀！\nㅤㅤ\nㅤㅤ\nㅤㅤ\n17\n3"},{"l":1,"y":114,"a":"B","c":1.0,"s":"依郵件處理規則規定，下列敘述何者正確？","o":{"A":"無法投遞之包裹，因往返詢問致內容自然變質或消滅者，中華郵政公司負補償責任","B":"無法投遞之包裹經寄件人表示拋棄者，依無著郵件規定處理","C":"中華郵政公司於包裹轉運期間，發現其內容易於自然變質或消滅時，為收件人之利益，得不經通知或其他手續， 立即變賣之","D":"包裹變賣所得價款，於扣除各項費用後，賸餘款項通知收件人領取"},"k":"外勤","p":1,"d":""},{"l":1,"y":114,"a":"A","c":1.0,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"國際非掛號函件，由寄達郵政機構優先處理並交由專差儘速投遞及提供網路追蹤資訊者，為速遞函件","B":"郵件在國內指定之地區間互寄或經外國郵政機構同意與其指定之郵局間互寄，以最快速方法優先處理，並在約定 之時間內送達收件人者，為快捷郵件","C":"郵件交付相關航空資費，以航空郵路寄遞者，為航空郵件","D":"國內郵件加付限時費，按班限時投遞者，為限時郵件"},"k":"外勤","p":1,"d":"第二十六條 \n國際非掛號函件\n，由寄達郵政機構優先處理並交由專差儘速投遞及提供網路追蹤資訊\n者，為\n可追蹤函件\n。"},{"l":1,"y":114,"a":"A","c":1.0,"s":"依郵件處理規則規定，寄件人應承擔郵件因內裝有禁寄之文件、物品或不依規定交寄之責任，如致中華郵政公 司或其他郵件受有損害者，該公司得向何人請求賠償？","o":{"A":"寄件人","B":"收件人","C":"收件地址之接收郵件人員","D":"無法請求賠償"},"k":"外勤","p":1,"d":""},{"l":1,"y":114,"a":"A","c":1.0,"s":"依郵件處理規則規定，下列何者非屬包裹得通知收件人至郵局領取之情形？","o":{"A":"重量在二公斤以上，其收件人地址車輛通行不便","B":"應由收件人自辦驗關手續或應納稅捐在規定數額以上","C":"報值、保價或代收貨款金額達一定數額以上","D":"破損須當面開驗"},"k":"外勤","p":1,"d":"第五十一條\n包裹有下列情形之一者，得通知收件人至郵局領取： \n一、破損須當面開驗。 \n二、報值、保價或代收貨款金額達一定數額以上。 \n三、應由收件人自辦驗關手續或應納稅捐在規定數額以上。 \n四、應交付其他費用。 \n五、重量在\n三公斤\n以上，其收件人地址車輛通行不便。"},{"l":1,"y":114,"a":"B","c":1.0,"s":"依郵件處理規則規定，有關掛號郵件與國際快捷郵件之查詢郵件期限，下列敘述何者正確？","o":{"A":"掛號郵件自交寄之日起算六個月，國際快捷郵件自交寄之日起算四個月","B":"掛號郵件自交寄之次日起算六個月，國際快捷郵件自交寄之次日起算四個月","C":"掛號郵件自交寄之日起算四個月，國際快捷郵件自交寄之日起算六個月","D":"掛號郵件自交寄之次日起算四個月，國際快捷郵件自交寄之次日起算六個月"},"k":"外勤","p":1,"d":"當日：\n登記的新聞或雜誌，資料變更日起10日內申請變更\n存證信函自交寄日起保存三年      \n郵票發行之日起有效力\n改投改寄，可提供該服務之日起六個月（改掛號至服務處一年）\n無著郵件銷毀：交寄日起滿查詢期限一個月後\n無著郵件賣掉：交寄日起三年\n次日：\n新聞雜誌交寄之次日起六個月內沒交，撤銷登記\n新聞雜誌沒遵守規定按印刷物付費者，於收到通知次日起五日內付清\n招領：通知次日起十五日內（保價三十日）\n查詢日期：交寄日次日起六個月（快捷四個月）\n郵局賠償：查詢之次日起三個月\n還給郵局賠償?：通知次日起三個月\ni郵箱：投入次日算兩天，再之後的次日拿去招領\n超煩"},{"l":1,"y":114,"a":"A","c":1.0,"s":"依郵件處理規則規定，有關包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被 竊之補償金額，下列敘述何者正確？","o":{"A":"國內掛號函件，每件為新臺幣五百七十五元","B":"國際掛號函件，每件依國際貨幣基金特別提款權四十計算單位，計算其補償金額","C":"國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權一百三十計算單位，計算其補償金額","D":"報值或保價郵件全部或一部遺失、被竊或毀損，應予補償時，按所報或所保價值之全部或一部予以補償。一部損 失，以實價補償，其實價，依投遞時及投遞地之市價定之"},"k":"外勤","p":1,"d":"目前中華郵政的規定有出入；根據【郵件處理規則】的最新規定，國際掛號函件的補償金額，每件為國際貨幣基金特別提款權三十計算單位，而不是四十計算單位。\n14\n1"},{"l":1,"y":114,"a":"D","c":1.0,"s":"依郵件處理規則規定，下列敘述何者正確？ A.掛號郵件，經寄件人報明價值加付報值費於國內互寄者，為報 值郵件 B.掛號郵件，經寄件人報明價值加付報值費於國際互寄者，為報值郵件 C.掛號郵件，經寄件人報明保價 金額，加付保價費交寄者，為保價郵件 D.報值郵件或保價郵件之報值金額或保價金額，不得超過內裝文件或物品 之實際價值","o":{"A":"僅 AB","B":"僅 CD","C":"僅 ABC","D":"僅 ACD"},"k":"外勤","p":1,"d":"掛號郵件，經寄件人報明價值加付報值費於國\n際\n互寄者，為報值郵件\n正解：國內"},{"l":1,"y":114,"a":"C","c":1.0,"s":"依郵件處理規則規定，報值包裹、保價郵件、代收貨款郵件及印刷物之收件地址為按址投遞區域者，郵局應按 址投遞。但上述郵件得通知收件人至郵局領取之規定，下列敘述何者錯誤？","o":{"A":"報值包裹報值金額達中華郵政公司訂定並公告之一定數額以上","B":"保價郵件保價金額達中華郵政公司訂定並公告之一定數額以上","C":"同日同一收件人之代收貨款郵件總重量超過五公斤","D":"同日同一收件人之印刷物總重量超過五公斤"},"k":"外勤","p":1,"d":"第\n 44 \n條\n報值包裹、保價郵件、代收貨款郵件及印刷物之收件地址為按址投遞區域者，郵局應按址投遞。但報值、保價及代收貨款金額達中華郵政公司訂定並公告之一定數額以上，或同日同一收件人之印刷物總重量超過五公斤者，得通知收件人至郵局領取。\n前項郵件應繳貨款、關稅或其他費用者，於繳清後，始予遞交。"},{"l":1,"y":114,"a":"C","c":1.0,"s":"依郵件處理規則規定，下列敘述何者正確？","o":{"A":"包裹郵件、快捷郵件全部遺失、被竊或毀損應予補償者，於給予補償金時，並退還其郵資，包括保價費、報值費","B":"報值郵件、保價郵件全部遺失、被竊或毀損應予補償者，於給予補償金時，並退還其郵資，包括保價費、報值費","C":"國際掛號函件因不可抗力致全部遺失、被竊或毀損而不予補償者，其已付各項資費，寄件人得請求退還，但不包 括保價費","D":"代收貨款郵件全部遺失、被竊或毀損應予補償者，退還費用不包括代收貨款費"},"k":"外勤","p":1,"d":"國際掛號函件因不可抗力致全部遺失、被竊或毀損而不予補償者，其已付各項資費，寄件人得請求退還，但不包 括保價費"},{"l":1,"y":114,"a":"A","c":1.0,"s":"依郵件處理規則規定，有關國內包裹及國內快捷郵件遺失、被竊或毀損之補償金額，下列敘述何者正確？","o":{"A":"單件重量五公斤以下者，不逾新臺幣五百七十五元","B":"單件長寬高三者合計超過五十公分至一百公分以下者，不逾新臺幣八百六十五元","C":"單件重量超過五公斤至十五公斤以下者，不逾新臺幣八百六十五元","D":"單件重量超過十五公斤者，不逾新臺幣一千一百五十五元"},"k":"外勤","p":1,"d":"(B) 單件長寬高三者合計超過\n五十公分至一百公分\n以下者，不逾新臺幣八百六十五元\n正解：60公分至90公分\nㅤㅤ\n(C) 單件重量超過五公斤至\n十五公斤\n以下者，不逾新臺幣八百六十五元\n正解：10公斤\nㅤㅤ\n(D) 單件重量超過\n十五公斤\n者，不逾新臺幣一千一百五十五元\n正解：10公斤\nㅤㅤ\n第 65 條\n國內包裹\n及\n國內快捷\n郵件遺失、被竊或毀損之補償金額，依下列規定：\n一、單件以重量計費者：\n（一）\n5\n公斤以下者，不逾新臺幣\n575\n元。\n（二）超過\n5\n公斤至\n10\n公斤以下者，不逾新臺幣\n865\n元。\n（三）超過\n10\n公斤者，不逾新臺幣\n1155\n元。\n二、單件以外箱尺寸計費者：\n（一）長寬高三者合計不超過\n60\n公分者，不逾新臺幣\n575\n元。\n（二）長寬高三者合計超過\n60\n公分至\n90\n公分以下者，不逾新臺幣\n865\n元。\n（三）長寬高三者合計超過\n90\n公分者，不逾"},{"l":1,"y":115,"a":"A","c":0.79,"s":"依郵件處理規則規定，下列何者不須另付特別處理費？","o":{"A":"電子函件","B":"航空郵件","C":"限時郵件","D":"快捷郵件"},"k":"外勤","p":0,"d":"郵件處理規則\n第 18 條\n郵件交寄時，應依種類付足資費；其費率依相關資費表之規定。但大宗交寄之郵件，寄件人已依中華郵政公司之規定書寫郵遞區號，並分區捆紮者，得予優待。\n郵件依第三章規定作特別處理時，應另付特別處理費。\nㅤㅤ\n第 三 章 郵件之特別處理\n第 22 條\n郵件交付相關航空資費，以航空郵路寄遞者，為\n航空郵件\n。\n第 23 條\n國內郵件加付限時費，按班限時投遞者，為\n限時郵件\n。\nㅤㅤ\n第 27 條\n郵件在國內指定之地區間互寄或經外國郵政機構同意與其指定之郵局間互寄，或交由在寄達國提供遞送服務之民營公司，以最快速方法優先處理，並在約定之時間內送達收件人者，為\n快捷郵件\n。\nㅤㅤ"},{"l":1,"y":115,"a":"A","c":0.93,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"國際航空郵簡夾寄任何附件，不為遞送","B":"郵件上之郵票或其他表示郵資已付之符誌，應逐一分開端正勻貼，不得重疊；其被掩蓋者，失其效用","C":"郵件上之郵票或其他表示郵資已付之符誌，有剪割、拼集、塗刮、塗抹膠漿或已使用且經洗刷者，不為遞送","D":"由明信片、特製郵簡或特製信封上剪下之郵資符誌，失其效用"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"D","c":0.85,"s":"下列收件地址為按址投遞區域郵件，依郵件處理規則規定，何者得通知收件人至郵局領取？","o":{"A":"同日同一收件人之報值包裹總重量超過五公斤者","B":"同日同一收件人之保價郵件總重量超過五公斤者","C":"同日同一收件人之代收貨款郵件總重量超過五公斤者","D":"同日同一收件人之印刷物總重量超過五公斤者"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"D","c":0.75,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"無法投遞之包裹，因往返詢問致內容自然變質或消滅者，中華郵政公司不負補償責任","B":"報值郵件或保價郵件之報值金額或保價金額，超過內裝文件或物品之實際價值者，於有損失時，不得請求任何補 償","C":"掛號郵件逾查詢期限者，郵局得不予提供查詢，並不負補償責任","D":"郵件遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送者，不予補償或賠償"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.61,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"收件人拒付欠資及欠資手續費，或因不能投遞退回原寄郵局時，向寄件人收取；寄件人拒絕交付者，依無著郵件 規定處理","B":"無著郵件，由中華郵政公司指定之郵局拆閱處理，能獲知寄件人地址者，即將原件裝入特製封套，退還寄件人； 無法退還者，自郵件交寄日起屆滿查詢期限一個月後銷燬之","C":"寄件人聲明拋棄或無法投遞免退回者，視為無著郵件","D":"退還寄件人之無著郵件，原件為欠資郵件或按規定應補付郵資差額或另付資費者，於投交時向寄件人收取"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"D","c":0.71,"s":"依郵件處理規則規定，有關中華郵政公司得不按址投遞地區，下列何者錯誤？","o":{"A":"羊腸小道在二公里以上，非郵路所必經之地區","B":"偏遠地區住戶或村落，平均一個月郵件不足四十件者","C":"其他因交通不便，投遞顯有困難，經中華郵政公司訂定之特殊區域","D":"收件人於其收件地址飼養之動物有攻擊郵政服務人員或中華郵政公司委託遞送郵件人員之虞"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.81,"s":"依郵件處理規則規定，國際掛號函件及國際掛號印刷物專袋全部遺失或被竊之補償金額分別為下列何者？","o":{"A":"國際掛號函件：每件依國際貨幣基金特別提款權三十計算單位，國際掛號印刷物專袋：每袋依國際貨幣基金特別 提款權一百計算單位","B":"國際掛號函件：每件依國際貨幣基金特別提款權三十計算單位，國際掛號印刷物專袋：每袋依國際貨幣基金特別 提款權一百五十計算單位","C":"國際掛號函件：每件依國際貨幣基金特別提款權四十計算單位，國際掛號印刷物專袋：每袋依國際貨幣基金特別 提款權一百計算單位","D":"國際掛號函件：每件依國際貨幣基金特別提款權四十計算單位，國際掛號印刷物專袋：每袋依國際貨幣基金特別 提款權一百五十計算單位"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.9,"s":"依郵件處理規則規定，禁止交寄之放射性物品於郵局收寄後發現者，如何處理？","o":{"A":"於原寄郵局發現者，退還寄件人","B":"其由外國寄來者，退回原寄郵局","C":"交相關主管機關處理","D":"除依規定送交相關主管機關處理外，退還寄件人"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"A","c":0.92,"s":"依郵件處理規則規定，因收件人地址變更，郵件須改向新地址投交，且新地址仍在原投遞區域內者，稱為下列 何者？","o":{"A":"改投","B":"改寄","C":"退回","D":"招領"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.97,"s":"依郵件處理規則規定，郵件以機關、學校為收件人或寄由其轉交者，應以何處為其收件地址？","o":{"A":"負責人戶籍地","B":"該機關或機構","C":"郵政信箱","D":"存局候領處"},"k":"外勤","p":0,"d":""},{"l ，欲向中華郵政公司申請登記按「雜誌」交寄者，其發行頻率應為 下列何者？","o":{"A":"每日或隔週六日按期發行","B":"七日以上三個月以下按期發行","C":"三個月以上六個月以下按期發行","D":"六個月以上一年以下按期發行"},"k":"外勤","p":0,"d":"其發行頻率應為 \n7日以上，3個月以下"},{"l":1,"y":115,"a":"B","c":0.89,"s":"依郵件處理規則規定，無法投遞之國內函件，若無寄件人姓名、地址，應如何處理？","o":{"A":"公告招領三個月","B":"退回原寄郵局","C":"變賣之","D":"逕予銷燬"},"k":"外勤","p":0,"d":"第 56 條\n無法投交收件人或經收件人拒絕收受之郵件，為無法投遞郵件。\n無法投遞之國內函件，退還寄件人；無寄件人姓名、地址者，退回原寄郵局。但寄件人交寄時，於封面上註明無法投遞免退回者，不在此限。\n無法投遞之國內非掛號新聞紙、雜誌，退回原寄郵局，並發單通知寄件人，自通知之次日起十五日內至指定郵局補付郵資領回；屆期未領者，依無著郵件規定處理。\n無法投遞之國際函件，無論封面有無寄件人姓名、地址，均退回原寄國。但未書有寄件人姓名、地址之明信片及未以寄達國通曉之文字註明應行退回之非掛號印刷物，不予退回原寄國，逕依無著郵件規定處理。\n無法投遞之國內及國際包裹，寄件人在相關包裹單據上有註記者，依其註記辦理。"},{"l":1,"y":115,"a":"B","c":0.83,"s":"依郵件處理規則規定，中華郵政公司以外之任何人印製明信片時，應遵循相關規定。若其紙質、規格不合規定 者，應如何處理？","o":{"A":"應按郵簡交寄","B":"應按信函交寄","C":"應退還寄件人補足資費","D":"不予遞送，並依無著郵件規定處理"},"k":"外勤","p":0,"d":"根據中華郵政規範，一般民眾或民間企業若自行印製明信片，除須遵循官方規格外，亦不得刊印「郵政」字樣及郵資符誌或類似花紋。若未符合紙質或規格限制，\n郵局將視同信函來辦理，並依信函之郵資標準計費"},{"l":1,"y":115,"a":"B","c":0.84,"s":"甲寄出一件國內單件包裹，重量為 8 公斤，不幸在運送過程中遺失。依郵件處理規則規定，該包裹之補償金額 上限為多少？","o":{"A":"新臺幣 575 元","B":"新臺幣 865 元","C":"新臺幣 1,155 元","D":"依實際價值賠償，無上限"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.91,"s":"中華郵政公司之郵簡依寄遞區域可分幾種郵簡？","o":{"A":"一種","B":"二種","C":"三種","D":"四種"},"k":"外勤","p":0,"d":"郵簡依寄遞區域分\n國內郵簡\n及\n國際航空郵簡\n二種。"},{"l":1,"y":115,"a":"B","c":0.88,"s":"依郵件處理規則規定，掛號郵件之查詢期限自交寄之次日起算為多少時間，逾前述查詢期限者，郵局得不予提供查詢，並不負補償責任？","o":{"A":"三個月","B":"六個月","C":"一年","D":"五年"},"k":"外勤","p":0,"d":"郵件處理規則 \n第 60 條\n掛號郵件之查詢期限自交寄之次日起算六個月。但國際快捷郵件之查詢期限自交寄之次日起算四個月。\n逾前項查詢期限者，郵局得不予提供查詢，並不負補償責任。"},{"l":1,"y":115,"a":"D","c":0.96,"s":"依郵件處理規則規定，無法投遞之國內函件，中華郵政公司處置方式何者正確？","o":{"A":"逕行處分","B":"送交交寄局候領","C":"送交警察局候領","D":"退還寄件人"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.83,"s":"依郵件處理規則規定，國內郵件經查有遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理 規定遞送，依郵政法應予補償者，郵局應憑交寄執據或郵件封皮儘速支付補償金，至遲應自查詢之次日起幾個月內為之？","o":{"A":"一個月","B":"二個月","C":"三個月","D":"六個月"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.96,"s":"有關郵件處理規則訂定之法源依據為何？","o":{"A":"簡易人壽保險法第 1 條","B":"郵政儲金匯兌法第 1 條","C":"郵政法第 48 條","D":"中華郵政股份有限公司設置條例"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.91,"s":"依郵件處理規則規定，下列何者非屬掛號郵件不予投入 i 郵箱之情形？","o":{"A":"郵件體積過大致無法投入","B":"郵件外包裝出現破損","C":"以報值、保價或代收貨款金額未逾中華郵政公司公告之金額","D":"i 郵箱滿櫃，經投遞二次仍無空格櫃可供使用"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"D","c":0.83,"s":"依郵件處理規則規定，已遞交之何者郵件，不得交由郵局退回？ A.有拆過痕跡之函件 B.報值或保價郵件 C. 包裹","o":{"A":"僅 AB","B":"僅 AC","C":"僅 BC","D":"ABC"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"D","c":0.85,"s":"依郵件處理規則規定，國內定期發行之刊物，符合下列各款規定者，得向中華郵政公司申請登記，經同意後按 新聞紙或雜誌交寄，下列何者非屬之？","o":{"A":"政府或民意機關發行之公報","B":"政府或民意機關發行之宣傳政令刊物","C":"以報導或評論政治、經濟、科學、文化或其他公益事項為目的之刊物","D":"以報導或評論政治、經濟、科學、文化或其他公益事項為目的之刊物，經中華郵政公司認定屬商業性廣告、宣傳品或公司行號發行為本身業務或特定個人宣傳者定之"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.91,"s":"依郵件處理規則規定，有關郵件遞送之敘述，下列何者錯誤？","o":{"A":"掛號郵件招領期間，自通知招領之次日起算十五日","B":"包裹有應交付其他費用，得通知收件人至郵局領取","C":"寄交停泊港埠之船舶或其船員之郵件，留局待領","D":"包裹有報值、保價或代收貨款金額達一定數額以上，得通知收件人至郵局領取"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.9,"s":"依郵件處理規則規定，存證信函留存郵局之副本，自交寄日起，由郵局保存幾年，期滿後銷燬之？","o":{"A":"一年","B":"二年","C":"三年","D":"五年"},"k":"外勤","p":0,"d":"郵件處理規則第34條\n存證信函留存郵局之副本，自交寄日起，由郵局保存三年，期滿後銷燬之。"},{"l":1,"y":115,"a":"D","c":0.95,"s":"依郵件處理規則規定，下列何者屬於禁止交寄之文件或物品？ A.封口用之金屬扣鈕有鋒利之邊緣，致妨害郵 件處理之文件或物品 B.放射性物品 C.寄達國禁止流通之文件或物品","o":{"A":"僅 AB","B":"僅 BC","C":"僅 AC","D":"ABC"},"k":"外勤","p":0,"d":"郵件處理規則第37條\n下列文件或物品，禁止交寄：\n一、物品之性質或其封裝有傷害郵政服務人員或污損郵件或郵政設備之虞者。\n二、\n封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理者。\n三、易燃、易爆裂或其他危險物品。但立案機構以特殊方法封裝互寄之易壞生物學物料，經相關主管機關核發運輸憑照者，不在此限。\n四、活生動物。但蜜蜂、蠶、水蛭、由立案機構互寄之寄生蟲或為消除害蟲之蟲類、寄往日本之包裹內裝不夾泥土之無害活紅蚯蚓者，不在此限。\n五、\n放射性物品\n。\n六、鴉片、嗎啡及其他麻醉物品。但經相關主管機關核發運輸憑照或司法機關、司法警察機關備文證明係供訴訟證據之用，並作保價或報值郵件在國內互寄，或作保價郵件寄往國外供醫藥或科學之用，經寄達國准許者，不在此限。\n七、猥褻妨害風化之文件或物品。但由司法機關或司法警察機關備文證明係供訴訟證據之用，作掛號郵件互寄者，不在此限。\n八、\n寄達國禁止輸入或流通之文件或物"},{"l":1,"y":115,"a":"B","c":0.78,"s":"依郵件處理規則規定，有關欠資郵件規定，下列敘述何者錯誤？","o":{"A":"未付資費或未付足資費之郵件，為欠資郵件","B":"欠資郵件，除另有規定外，向寄件人收取欠資及欠資手續費","C":"欠資郵件因不能投遞退回原寄郵局時，向寄件人收取欠資及欠資手續費","D":"國內欠資信函、明信片經退回原寄郵局，由寄件人付清欠資及欠資手續費者，得由寄件人於交付時，申請將該信函、明信片再向收件人投遞"},"k":"外勤","p":0,"d":"郵件處理規則\n第 54 條\n1.未付資費或未付足資費之郵件，為欠資郵件。\n2.欠資郵件，除另有規定外，向收件人收取欠資及欠資手續費。\n第 55 條\n1.欠資郵件未經付清欠資及欠資手續費者，不予投遞。收件人拒付欠資及欠資手續費，或因不能投\n遞退回原寄郵局時，向寄件人收取；寄件人拒絕交付者，依無著郵件規定處理。\n2.國內欠資信函、明信片經退回原寄郵局，由寄件人付清欠資及欠資手續費者，得由寄件人於交付\n時，申請將該信函、明信片再向收件人投遞。"},{"l":1,"y":115,"a":"D","c":0.82,"s":"依郵件處理規則規定，下列何種郵件其查詢期限為自交寄之次日起算四個月？","o":{"A":"國內快捷郵件","B":"國內報值郵件","C":"國際掛號函件","D":"國際快捷郵件"},"k":"外勤","p":0,"d":"郵件處理規則第60條\n掛號郵件之查詢期限自交寄之次日起算六個月。但國際快捷郵件之查詢期限自交寄之次日起算四個月。"},{"l":1,"y":115,"a":"D","c":0.85,"s":"依郵件處理規則規定，郵票自何時起，始生交付郵費證明之效力？","o":{"A":"自購買之日起","B":"自交寄之日起","C":"自公告之日起","D":"自發行之日起"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.95,"s":"依郵件處理規則規定，下列何者為「掛號郵件」之必要條件？","o":{"A":"必須限制投交收件人本人","B":"封面註明「掛號」字樣、交付資費、編號登記及掣給執據","C":"僅需交付資費即可","D":"必須保價"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.88,"s":"甲寄出一件國內單件包裹，重量為九公斤，不幸在運送過程中遺失。依郵件處理規則規定，該包裹之補償金額 上限為多少？","o":{"A":"新臺幣五百七十五元","B":"新臺幣八百六十五元","C":"新臺幣一千一百五十五元","D":"依實際價值賠償，無上限"},"k":"外勤","p":0,"d":"郵件處理規則第65條\n國內包裹及國內快捷郵件遺失、被竊或毀損之補償金額，依下列規定：\n一、單件以重量計費者：\n（一）\n五公斤以下\n者，不逾\n新臺幣575\n元。\n（二）\n超過五公斤至十公斤\n者，不逾新臺幣\n865元。\n（三）\n超過十公斤\n者，不逾新臺幣\n1155元\n。\n二、單件以外箱尺寸計費者：\n（一）長寬高三者合計\n60公分以下\n者，不逾新臺幣\n575元\n。\n（二）長寬高三者合計\n超過60公分至90公分\n者，不逾新臺\n幣865元\n。\n（三）長寬高三者合計\n超過90公分者\n，不逾新臺幣\n1155元\n。"},{"l":1,"y":115,"a":"D","c":0.94,"s":"依郵件處理規則規定，中華郵政公司對於寄件人交寄郵件之內容，除下列何者外，不予證明？","o":{"A":"報值包裹","B":"快捷郵件","C":"保價信函","D":"存證信函留存郵局之副本"},"k":"外勤","p":0,"d":"第 3 條\n中華郵政股份有限公司（以下簡稱中華郵政公司）對於寄件人交寄郵件之內容，\n除存證信函留存郵局之副本外\n，\n不予證明\n。"},{"l":1,"y":115,"a":"C","c":0.96,"s":"依郵件處理規則規定，國內郵簡若夾寄任何附件時，郵局將如何處理？","o":{"A":"直接退回給寄件人","B":"改按國內包裹寄遞","C":"劃去「郵簡」字樣，改按信函寄遞","D":"視為無著郵件處理"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"D","c":0.96,"s":"依郵件處理規則規定，有關「電子函件」之定義，下列敘述何者正確？","o":{"A":"收件人自行上網下載列印之郵件","B":"郵局代為發送至收件人電子信箱之郵件","C":"寄件人將文件存入隨身碟交由郵局列印寄送","D":"文件資料透過網際網路傳送至電子郵局，列印轉成實體郵件後投交收件人"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"D","c":0.87,"s":"依郵件處理規則規定，下列何種活生動物禁止交寄？","o":{"A":"蜜蜂","B":"蠶","C":"寄往日本包裹內裝不夾泥土之無害活紅蚯蚓","D":"供觀賞用之活魚"},"k":"外勤","p":0,"d":"郵件處理規則第37條\n下列文件或物品，禁止交寄：\n一、物品之性質或其封裝有傷害郵政服務人員或污損郵件或郵政設備之虞者。\n二、封口用之金屬扣鈕有鋒利之邊緣，致妨害郵件處理者。\n三、易燃、易爆裂或其他危險物品。但立案機構以特殊方法封裝互寄之易壞生物學物料，經相關主管機關核發運輸憑照者，不在此限。\n四、\n活生動物\n。但\n蜜蜂、蠶、水蛭、由立案機構互寄之寄生蟲或為消除害蟲之蟲類、寄往日本之包裹內裝不夾泥土之無害活紅蚯蚓者，不在此限\n。\n五、放射性物品。\n六、鴉片、嗎啡及其他麻醉物品。但經相關主管機關核發運輸憑照或司法機關、司法警察機關備文證明係供訴訟證據之用，並作保價或報值郵件在國內互寄，或作保價郵件寄往國外供醫藥或科學之用，經寄達國准許者，不在此限。\n七、猥褻妨害風化之文件或物品。但由司法機關或司法警察機關備文證明係供訴訟證據之用，作掛號郵件互寄者，不在此限。\n八、寄達國禁止輸入或流通之文件或物"},{"l":1,"y":115,"a":"D","c":0.93,"s":"依郵件處理規則規定，航空郵件收寄後，因不可歸責於中華郵政之事由，致郵件未能交由航空郵路運送時，有 關航空資費之處理，下列何者正確？","o":{"A":"全額退還寄件人","B":"退還一半航空資費","C":"補償等值之郵票","D":"所付航空資費不予退還"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.95,"s":"依郵件處理規則規定，偏遠地區住戶或村落，平均一個月郵件不足多少件者，中華郵政公司得不按址投遞？","o":{"A":"二十件","B":"三十件","C":"四十件","D":"五十件"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.84,"s":"依郵件處理規則規定，無法投遞且不能退還寄件人之郵件，應由原寄郵局招領揭示多久，屆期無人領取即為無 著郵件？","o":{"A":"十五日","B":"一個月","C":"三個月","D":"六個月"},"k":"外勤","p":0,"d":"無法投遞之國內\n非掛號新聞紙、雜誌\n，退回原寄郵局，並發單通知寄件人，\n自通知之次日起十五日內\n至指定郵局補付郵資領回；屆期未領者，依無著郵件規定處理。\n無法投遞或依規定不予寄遞而\n不能退還寄件人之郵件\n，應由\n原寄郵局招領揭示一個月\n，屆期無人領取者，為無著郵件。"},{"l":1,"y":115,"a":"D","c":0.96,"s":"依郵件處理規則規定，收件人接收郵件時，若未當場聲明有瑕疵並已出據領取郵件者，將產生何種效果？","o":{"A":"得於三日內請求補償","B":"得於七日內請求補償","C":"得請求退還郵資","D":"不得請求補償"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.97,"s":"依郵件處理規則規定，國內掛號函件全部遺失或被竊時，每件補償金額為何？","o":{"A":"新臺幣三百元","B":"新臺幣五百元","C":"新臺幣五百七十五元","D":"新臺幣一千一百五十五元"},"k":"外勤","p":0,"d":"郵件處理規則第64條\n❇️包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他\n各類掛號函件\n全部\n遺失或被竊\n之補償金額，依下列規定：\n一、\n國內掛號函件\n，每件為新臺幣\n575元\n。\n二、\n國際掛號函件，\n每件依國際貨幣基金特別提款權\n30計算單位\n，計算其補償金額。\n三、\n國際掛號印刷物專袋\n，每袋依國際貨幣基金特別提款權\n150計算單位\n，計算其補償金額。\n❇️報值或保價郵件\n全部或一部\n遺失、被竊或毀損，\n應予補償時，按\n所報或所保價值之全部或一部\n予以補償。一部損失，以實價補償，其實價，依收寄時及收寄地之市價定之，最多以原件所報或所保價值為限。\n❇️\n限時郵件、快捷郵件\n遞送延誤\n，經查明為\n中華郵政公司之過失所致\n者，其補償金額如下：\n一、\n限時郵件及國內快捷郵件\n，依所收取之\n全部資費\n補償。\n二、\n國際快捷郵件\n，依所收取\n全部資費之50%\n補償。\n掛號郵件未依中華郵政公司公"},{"l":1,"y":115,"a":"D","c":0.87,"s":"依郵件處理規則規定，郵件遺失給與補償金時，下列何項費用依法「不予退還」？","o":{"A":"國內掛號費","B":"國內包裹資費","C":"代收貨款費","D":"保價費及報值費"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"B","c":0.89,"s":"某甲交寄包裹時於封面上註明「無法投遞免退回」。若該包裹經按址投遞無法交給收件人時，依郵件處理規則 規定，郵局應如何處理？","o":{"A":"退回原寄郵局招領一個月","B":"視為無著郵件處理","C":"送交相關主管機關","D":"立即變賣並保留價款"},"k":"外勤","p":0,"d":"郵件處理規則第15條\n無法投遞之包裹經寄件人表示拋棄者，依無著郵件規定處理。"},{"l":1,"y":115,"a":"C","c":0.8,"s":"依郵件處理規則規定，國內非掛號新聞紙因無法投遞退回原寄郵局後，寄件人應於郵局發單通知之次日起幾日 內至指定郵局補付郵資領回？","o":{"A":"七日內","B":"十日內","C":"十五日","D":"三十日內"},"k":"外勤","p":0,"d":"無法投遞之\n國內非掛號新聞紙、雜誌，退回原寄郵局\n，並發單通知寄件人，自\n通知之次日起十五日\n內至指定郵局補付郵資領回；屆期未領者，依無著郵件規定處理。\n無法投遞或依規定不予寄遞而\n不能退還寄件人之郵件\n，應由\n原寄郵局招領揭示一個月\n，屆期無人領取者，為無著郵件。"},{"l":1,"y":115,"a":"D","c":0.8,"s":"依郵件處理規則規定，無著郵件經拆閱仍無法退還寄件人，若內裝物品為「有價值或得為買賣標的之玩具」， 其變賣期限規定為何？","o":{"A":"自交寄日起滿一個月無人認領，即變賣之","B":"自交寄日起滿六個月無人認領，即變賣之","C":"自交寄日起滿一年無人認領，即變賣之","D":"自交寄日起滿三年無人認領，即變賣之"},"k":"外勤","p":0,"d":"郵件處理規則第59條\n無著郵件\n，由中華郵政公司指定之郵局拆閱處理，能獲知寄件人地址者，即將原件裝入特製封套，退還寄件人；無法退還者，依下列規定處理：\n一、內裝文件或物品係\n無價值或不得為買賣標的者\n，\n自郵件交寄日起屆滿查詢期限一個月後銷燬之。\n其性質易於腐壞或不能久存者，得由郵局隨時銷燬之。\n二、內裝文件或物品係\n有價值或得為買賣標的者\n，自郵件交寄日起滿三年無人認領者，即變賣之\n；其性質易於腐壞、不能久存或數量有消減之虞者，得先行變賣，\n並將價款保存至郵件交寄日起滿三年為止\n。\n前項退還寄件人之郵件，原件為\n欠資郵件\n或按規定應補付郵資差額或另付資費者，\n於投交時向寄件人收取。"},{"l":1,"y":115,"a":"D","c":0.97,"s":"依郵件處理規則規定，下列敘述何者錯誤？","o":{"A":"明信片應依中華郵政公司公告之紙質、規格製作","B":"明信片紙張表面應平整光滑，不得有突出部分","C":"明信片分橫式、直式二種","D":"中華郵政公司以外之任何人印製明信片者，應依規定製作，並刊印「郵政」字樣及郵資符誌或類似花紋"},"k":"外勤","p":0,"d":""},{"l":1,"y":115,"a":"C","c":0.79,"s":"國際快捷郵件遞送延誤，經查明為中華郵政公司之過失所致者，其補償金額為何？","o":{"A":"依所收取全部資費之百分之三十補償","B":"依所收取全部資費之百分之四十補償","C":"依所收取全部資費之百分之五十補償","D":"依所收取全部資費之全部資費補償"},"k":"外勤","p":0,"d":"郵件處理規則第64條\n❇️包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他\n各類掛號函件\n全部\n遺失或被竊\n之補償金額，依下列規定：\n一、國內掛號函件，每件為新臺幣575元。\n二、國際掛號函件，每件依國際貨幣基金特別提款權30計算單位，計算其補償金額。\n三、\n國際掛號印刷物專袋，\n每袋依國際貨幣基金特別提款權150計算單位，計算其補償金額。\n❇️\n報值或保價郵件\n全部或一部遺失、被竊或毀損，應予補償時，按所報或所保價值之全部或一部予以補償。一部損失，以實價補償，其實價，依收寄時及收寄地之市價定之，最多以原件所報或所保價值為限。\n❇️\n限時郵件、快捷郵件\n遞送延誤，經查明為中華郵政公司之過失所致者，其補償金額如下：\n一、\n限時郵件及國內快捷郵件\n，依所收取\n之全部資費\n補償。\n二、\n國際快捷郵件，\n依所收取\n全部資費之50%\n補償\n。掛號郵件未依中華郵政公司公告之處理規定遞送，應予補償者，依"},{"l":1,"y":115,"a":"C","c":0.81,"s":"依郵件處理規則規定，國際掛號印刷物專袋全部遺失或被竊之補償金額為何？","o":{"A":"每袋依國際貨幣基金特別提款權三十計算單位，計算其補償金額","B":"每袋依國際貨幣基金特別提款權五十計算單位，計算其補償金額","C":"每袋依國際貨幣基金特別提款權一百五十計算單位，計算其補償金額","D":"每袋依國際貨幣基金特別提款權五百七十五計算單位，計算其補償金額"},"k":"外勤","p":0,"d":"郵件處理規則第64條\n❇️包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他\n各類掛號函件\n全部\n遺失或被竊\n之補償金額，依下列規定：\n一、\n國內掛號函件\n，每件為新臺幣\n575元\n。\n二、\n國際掛號函件\n，每件依國際貨幣基金特別提款權\n30計算單位\n，計算其補償金額。\n三、\n國際掛號印刷物專袋\n，每袋依國際貨幣基金特別提款權\n150計算單位\n，計算其補償金額。"},{"l":1,"y":115,"a":"D","c":0.79,"s":"依郵件處理規則規定，包裹及快捷郵件全部或一部損失之實價少於所定之補償金額者，按實價補償之；其實價 依下列何者定之？","o":{"A":"依投遞時及投遞地之市價定之","B":"依投遞時及收寄地之市價定之","C":"依收寄時及投遞地之市價定之","D":"依收寄時及收寄地之市價定之"},"k":"外勤","p":0,"d":""},{"l":2,"y":110,"a":"D","c":0.74,"s":"下列何項郵件之費用非由中華郵政公司自行公告並訂定之？","o":{"A":"包裹、快捷","B":"中華郵政公司所訂之大宗印刷物郵資折扣優待給予標準","C":"存證信函之「存證費」","D":"信函"},"k":"模擬","p":0,"d":"郵政法第14 條\n第六條第一項限由中華\n郵政\n公司或受其委託者遞送文件之資費，由中華\n郵政\n公司擬訂，報請主管機關核定後實施。 前項以外郵件之資費，由中華\n郵政\n公司自行訂定。"},{"l":2,"y":110,"a":"C","c":0.59,"s":"有關郵費及郵票之規定，下列敘述何者錯誤","o":{"A":"印刷物之資費，由中華郵政公司自行訂定","B":"持有公告 廢止之郵票者，得自廢止之日起 6 個月內，向中華郵政公司換取新票","C":"郵票之發行，由中華郵政公司擬訂式樣、圖案、價格及數量，報請主管機關層轉行政院 核定後發行","D":"特製郵簡上表示價格之花紋有污損時失其用"},"k":"模擬","p":0,"d":"答案C錯在\n數量"},{"l":2,"y":110,"a":"C","c":0.76,"s":"郵費之交付證明方式，以下何者錯誤？","o":{"A":"以郵票證明","B":"以中華郵政公司發行，含有郵票符誌之明信片、特製郵簡證明","C":"以中華郵政公司發行之郵政認知證證明","D":"以郵資機印出之郵資卷證明"},"k":"模擬","p":0,"d":"第16條\n郵票\n其他表示郵資已付符誌（定義在第4條十九、）：\n含有郵票符誌之明信片、特製郵簡、以郵資機或郵政規章所許可之印字機或其他方法印刷或加蓋以表示郵資業已付訖之符誌"},{"l":2,"y":110,"a":"C","c":0.77,"s":"中華郵政公司對於寄件人所交寄之郵件內容，下列何者應予證明？","o":{"A":"掛號信函","B":"存證信函之正本","C":"存證信函留存郵局之副本","D":"存證信函顧客留存之副本"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"A","c":0.74,"s":"下列有關特製郵簡之敘述，何者錯誤？","o":{"A":"國內郵簡夾寄附件時，得劃去郵簡字樣改按印刷物寄遞","B":"可分為國內郵簡及國際航空郵簡二種","C":"任何人得向中華郵政公司申請印製無郵資符誌之郵簡供自用或出售","D":"民眾向中華郵政公司申請印製之 郵簡，交寄時應付足郵資"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"B","c":0.85,"s":"國內定期發行以報導或評論政治、經濟、科學、文化或其他公益事項為目的之刊物，得向中 華郵政公司申請登記按下列何種郵件交寄？","o":{"A":"印刷品","B":"新聞紙或雜誌","C":"書籍","D":"小包"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"C","c":0.87,"s":"有關明信片之敘述，下列何者錯誤？","o":{"A":"中華郵政公司以外之任何人印製之明信片，其紙質、規格不合規定者，按信函交付郵資","B":"明信片紙張表面應平整光滑，不得有突出部分","C":"明信片因黏貼附件致表面欠缺平整光滑或有突出部分者，均應裝入封套內，按小包交寄","D":"紙張經折疊壓製，外形類似明信片，按信函交寄"},"k":"模擬","p":0,"d":"明信片因黏貼附件致表面欠缺平整光滑或有突出部分者，均應裝入封套內，按\n小包\n交寄。 \n信函"},{"l":2,"y":110,"a":"A","c":0.87,"s":"限時郵件投入收件人向郵局租用之專用信箱，下列何者為送達時間？","o":{"A":"投入時間","B":"送達信箱所在地郵局時間","C":"收件人開箱時間","D":"郵局電話通知時間"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"B","c":0.37,"s":"有關郵件處理規則，下列敘述何者錯誤？","o":{"A":"函件於封面上註明「掛號」字樣，加付掛號費，向郵局或中華郵政公司委託者交寄，並取得執據者，為掛號函件","B":"國際掛號包裹得依寄件人之申請，限定投交收件人本人親收","C":"交寄之信函，郵局認其裝有禁寄之文件或物品、錢幣或夾寄他人郵件者，得請寄件人當面拆驗，拒絕拆驗者，不予收寄。拆驗時，不得查閱信函內容","D":"郵件因內裝有禁寄之文件或物品或不依規定交寄，致其他郵件受有損害者，郵局得向寄件人請求賠償"},"k":"模擬","p":0,"d":"第三十九條\n郵局認為郵件內裝有禁寄之文件或物品，或夾寄他人郵件者，得請\n寄件人或收件人\n當面拆驗，拒絕拆驗者，不予遞送。拆驗時，其查閱不得逾越必要範圍。"},{"l":2,"y":110,"a":"B","c":0.92,"s":"掛號信函交寄時，依中華郵政公司規定方式繕寫，以內容完全相同之副本留存郵局者為下列 何郵件？","o":{"A":"掛號回執","B":"存證信函","C":"報值郵件","D":"電子郵件"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"A","c":0.8,"s":"關於存證信函，下列何項錯誤？","o":{"A":"信函格式無特別規定","B":"寄件人須加付存證相關資費","C":"留存之副本自交寄日起，由郵局保存 3 年，期滿後銷燬","D":"中華郵政公司對於寄件人交寄郵件之內容，除存證信函留存郵局之副本外，不予證明"},"k":"模擬","p":0,"d":"錯誤：（A) \n郵件處理規則第34條\n掛號信函交寄時，加付存證相關資費，\n依中華郵政公司規定方式繕寫\n，以內容完全相同之副本留存郵局備作證據者，為存證信函。\n存證信函留存郵局之副本，自交寄日起，由郵局保存三年，期滿後銷燬之。\n11\n1"},{"l":2,"y":110,"a":"C","c":0.61,"s":"有關代收貨價郵件，下列敘述何者正確？","o":{"A":"僅限交寄報值郵件，可加付代收貨價費，請郵局於投遞時向收件人代收貨價","B":"僅限交寄保價郵件，可加付代收貨價費，請郵局於投遞時向收件人代收貨價","C":"交寄報值或保價郵件，可加付代收貨價費，請郵局於投遞時向收件人代收貨價","D":"寄件人交寄任何郵件，均可加付代收貨價費後，請郵局於投遞時向收件人代收貨價"},"k":"模擬","p":0,"d":"正確：（C)\n郵件處理規則 第 32條\n寄件人\n按中華郵政公司公告之報值或保價限額\n，交付代收貨款費，請郵局於投遞時向收件人代收貨款之郵件，為代收貨款郵件。"},{"l":2,"y":110,"a":"B","c":0.58,"s":"依郵件處理規則之規定，例外允許寄往國外之鴉片、嗎啡及其他麻醉物品之要件為何？(1)作 保價包裹交寄(2)經交通部准許(3)供醫藥或科學之用(4)經寄達國准許","o":{"A":"僅(1)(2)(4)","B":"僅(1)(3)(4)","C":"僅(2)(3)(4)","D":"(1)(2)(3)(4)"},"k":"模擬","p":0,"d":"正確：（B)1.3.4\n郵件處理規則 第37條\n鴉片、嗎啡及其他麻醉物品。\n但\n「2」\n經相關主管機關核發運輸憑照或司法機關、司法警察機關\n備文證明係供訴訟證據之用，並作保價或報值郵件在國內互寄，\n或\n「1」\n作保價郵件寄往國外\n「3」\n供醫藥或科學之用\n，\n「4」\n經寄達國准許者，不在此限。\n29\n1"},{"l":2,"y":110,"a":"B","c":0.95,"s":"由明信片、特製郵簡或特製信封上剪下之郵資符誌，用以寄送郵件之效力如何？","o":{"A":"可抵郵資","B":"失其效用","C":"個別認定","D":"折價抵用"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"A","c":0.9,"s":"交寄存證信函留存郵局之副本，該副本：","o":{"A":"自交寄之日起，由郵局保存 3 年，期滿後銷毀之","B":"自交寄之日起，由郵局保存 3 年，期滿後退還寄件人","C":"自交寄之日起，由郵局保存 1 年，期滿後銷毀之","D":"自交寄之日起，由郵局保存 1 年，期滿後退還寄件人"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"B","c":0.6,"s":"有關投遞郵件之敘述，下列何者錯誤？","o":{"A":"郵件投遞區域分為按址投遞區域及不按址投遞區域","B":"報值包裹、保價郵件、代收貨價郵件之收件地址為按址投遞區域者，郵局一律應按址投遞","C":"郵件應繳貨價、關稅或其他費用者，於繳清後，始予遞交","D":"寄交停泊港埠之船舶或其船員之郵件，向該船舶遞交，不能向船舶遞交者，得向其所屬之 機關或公司遞交之"},"k":"模擬","p":0,"d":"複製貼上也要賺?不懂?\n免費!免費!免費!\n報值包裹、保價郵件、代收貨款郵件及印刷物之收件地址為按址投遞區域者，\n郵局\n應\n按址投遞\n。\n6\n1"},{"l":2,"y":110,"a":"A","c":0.74,"s":"依郵件處理規則規定，下列敘述何者正確？","o":{"A":"包裹重量在 3 公斤以上，其收件人地址車輛通行不便，得通知收件人至郵局領取","B":"同日同一收件人之印刷物總重量超過 3 公斤，得通知收件人至郵局領取","C":"羊腸小道在 3 公里以上，非郵路所必經之地區，得不按址投遞","D":"偏遠地區住戶或村落，平均一個月郵件不足 30 件者，得不按址投遞"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"A","c":0.7,"s":"依郵件處理規則，有關郵件投遞及收件人領取的敘述，下列何者錯誤？","o":{"A":"中華郵政公司得不按址投遞，並公告之，不按址投遞郵件之投遞方式，由交通部訂定","B":"掛號郵件招領期間，自通知招領之次日起算十五日","C":"包裹有應交付其他費用，得通知收件人至郵局領取","D":"包裹重量在三公斤以上，其收件人地址車輛通行不便，得通知收件人至郵局領取"},"k":"模擬","p":0,"d":"(A) 中華郵政公司得不按址投遞，並公告之，不按址投遞郵件之投遞方式，由\n交通部\n訂定 \n中華郵政公司訂定"},{"l":2,"y":110,"a":"B","c":0.65,"s":"得通知收件人至郵局領取的包裹，下列何者錯誤？","o":{"A":"破損須當面開驗者","B":"所有應納稅捐者","C":"應交付其他費用者","D":"保價金額達一定數額以上者"},"k":"模擬","p":0,"d":"包裹有下列情形之一者，得通知收件人至郵局領取：\n一、破損須當面開驗。\n二、報值、保價或代收貨款金額達一定數額以上。\n三、應由收件人自辦驗關手續或應納稅捐在規定數額以上。\n四、應交付其他費用。\n五、重量在三公斤以上，其收件人地址車輛通行不便。"},{"l":2,"y":110,"a":"A","c":0.69,"s":"依郵件處理規則之規定，下列何者由寄件人付清欠資及欠資手續費後，得由寄件人於交付時 ，申請再向收件人投遞？","o":{"A":"信函、明信片","B":"信函、印刷物","C":"信函、小包","D":"小包、明信片"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"D","c":0.73,"s":"已遞交之下列郵件，何者得交由郵局退回？","o":{"A":"報值或保價信函","B":"有拆過痕跡之信函","C":"包裹","D":"尚未拆過之信函"},"k":"模擬","p":0,"d":"第 57 條\n已遞交之下列郵件，不得交由郵局退回：\n一、有拆過痕跡之函件。\n二、報值或保價郵件。\n三、包裹。"},{"l":2,"y":110,"a":"D","c":0.81,"s":"依郵件處理規則規定，無法投遞之國內非掛號新聞紙、雜誌，退回原寄郵局，並發單通知寄 件人，自通知之「多少」日起「幾」日內至指定郵局補付郵資領回？","o":{"A":"當日起五日內","B":"當日起十五日內","C":"次日起五日內","D":"次日起十五日內"},"k":"模擬","p":0,"d":"無法投遞之國內\n非掛號\n新聞紙、雜誌退回原寄局發單通知寄件人\n自通知之\n次日\n起十五日內至\n指定\n郵局補付郵資領回\n，逾期未領者，依無著郵件處理。"},{"l":2,"y":110,"a":"D","c":0.73,"s":"有關無法投遞郵件之規定，下列敘述何者錯誤？","o":{"A":"無法投遞之國內及國際包裹，依寄件人在相關包裹聯單或發遞單上批註之意旨辦理","B":"無法投遞之國內函件退還寄件人，無寄件人姓名、地址者，退回原寄局。但寄件人交寄時 於封面上註明無法投遞 免退回者，不在此限","C":"無法投遞之國內非掛號新聞紙、雜誌退回原寄局發單通知寄件人至指定郵局補付郵資領回","D":"無法投遞之國際函件，無論封面有無寄件人姓名、地址，均不予退回原寄國，逕依無著郵 件規定處理"},"k":"模擬","p":0,"d":""},{"l":2,"y":110,"a":"C","c":0.61,"s":"下列查詢郵件期限，何者正確？","o":{"A":"國際郵件自交寄之次日起算六個月","B":"國際快捷郵件自交寄之日起算四個月","C":"掛號郵件自交寄之次日起算六個月","D":"逾期限者，郵局應予查詢，並不負補償責任"},"k":"模擬","p":0,"d":"(C) \n國內\n郵件自交寄之次日起算六個月 \n     國內郵件=掛號郵件嗎?因為法規是寫掛號郵件"},{"l":2,"y":110,"a":"C","c":0.81,"s":"依郵件處理規則規定，寄往國外之掛號印刷物專袋遺失，每袋依國際貨幣基金特別提款權多 少計算單位，計算補償金額？","o":{"A":"50","B":"100","C":"150","D":"200"},"k":"模擬","p":0,"d":"郵件處理規則第六十四條\n包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，依下列規定：\n一、國內掛號函件，每件為新臺幣五百七十五元。\n二、國際掛號函件，每件依國際貨幣基金特別提款權三十計算單位，計算其補償金額。\n三、國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權\n一百五十\n計算單位，計算其補償金額。\n報值或保價郵件全部或一部遺失、被竊或毀損，應予補償時，按所報或所保價值之全部或一部予以補償。一部損失，以實價補償，其實價，依收寄時及收寄地之市價定之，最多以原件所報或所保價值為限。\n限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致者，其補償金額如下：\n一、限時郵件及國內快捷郵件，依所收取之全部資費補償。\n二、國際快捷郵件，依所收取全部資費之百分之五十補償。\n掛號郵件未依中華郵政公司公告之處理規定遞送，應予補償者，依所收取之全部資費補償。\n前二項之"},{"l":2,"y":110,"a":"A","c":0.8,"s":"依郵件處理規則規定，限時郵件延誤送達，經查明為郵局之過失所致者，原寄郵局或投遞郵 局應憑郵件封皮，退還報值費、保價費外已付資費之多少？","o":{"A":"100％","B":"75％","C":"50％","D":"25％"},"k":"模擬","p":0,"d":"郵件處理規則第六十四條\n限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致者，其補償金額如下：\n一、限時郵件及國內快捷郵件，依所收取之\n全部資費補償\n。\n2\n0\n相關試題\n 17.依郵政處理規則規定，限時郵件延誤送達，經查明為郵局之過失所致者，原寄郵局或投遞郵局應憑郵件封皮， 退還報值費、保價費、代收貨款費及回執費外已付資費之多少？ (A) 100％(B) 75％(C) 50％ (D) 25％ .\n #1968710\n 46.國際快捷郵件延遲送達，經查明為郵局之過失所致者，原寄郵局或投遞郵局應憑交寄執據或\r 郵件封皮，除報值費、保價費外之資費，其退還百分比例應為多少？\r (A) 百分之百 \r (B) 百分之八十 \r (C) 百分之六十 \r (D) 百分之五十\n #2764855\n 47.某甲於臺北金南郵局採國內快捷方式，交寄標單 1 件，實收郵資共 120 元，今因郵局之過失\r 發"},{"l":2,"y":110,"a":"D","c":0.77,"s":"國際快捷郵件延遲送達，經查明為郵局之過失所致者，原寄郵局或投遞郵局應憑交寄執據或 郵件封皮，除報值費、保價費外之資費，其退還百分比例應為多少？","o":{"A":"百分之百","B":"百分之八十","C":"百分之六十","D":"百分之五十"},"k":"模擬","p":0,"d":"限時郵件、快捷郵件遞送延誤，\n經查明為中華郵政公司之過失所致者\n，其補償金額如下：\n一、限時郵件及國內快捷郵件，依所收取之全部資費補償。\n二、國際快捷郵件，依所收取全部資費之百分之五十補償。"},{"l":2,"y":110,"a":"D","c":0.53,"s":"保價郵件、報值或掛號包裹，其全部遺失、被竊或毀損應予補償者，於給與補償金時，並退 還下列何費用？","o":{"A":"郵資、報值費或保價費","B":"郵資、保價費 及 報值費","C":"郵資、代收貨價費","D":"僅郵資"},"k":"模擬","p":0,"d":"包裹郵件、快捷郵件、報值郵件、保價郵件\n全部遺失、被竊或毀損應予補償者，於給予補償金時，並退還其郵資。\n但保價費、報值費，不予退還\n。 \n代收貨款郵件全部遺失、被竊或毀損應予補償者，並退還其代收貨款費。"},{"l":2,"y":110,"a":"C","c":0.85,"s":"寄件人得向中華郵政公司請求補償之情形不含下列何項？","o":{"A":"掛號郵件全部遺失","B":"報值郵件一部被竊","C":"非以掛號郵件交寄之婚禮邀請卡遭誤投","D":"包裹郵件一部毀損"},"k":"模擬","p":0,"d":""},{"l":2,"y":111,"a":"B","c":0.83,"s":"7 下列何者非屬寄件人得向中華郵政公司請求補償之情形？","o":{"A":"包裹郵件一部遺失、被竊或毀損","B":"國內普通函件全部遺失或被竊","C":"限時郵件、快捷郵件遞送延誤，經查明為中華郵政公司之過失所致","D":"掛號郵件未依中華郵政公司公告之處理規定遞送"},"k":"升資","p":0,"d":""},{"l":2,"y":111,"a":"C","c":0.92,"s":"31 下列敘述何者錯誤？","o":{"A":"刊物經中華郵政公司認定屬於商業性廣告、宣傳品或公司行號發行為本身業務或特定個人宣傳者，不得 依新聞紙或雜誌交寄","B":"型錄郵件，指文件內容百分之五十以上為商品或服務之價格、功能、規格及使用方式，以文字、照片或 圖片方式印製者","C":"印刷物不得作小包或包裹交寄","D":"無法投遞之包裹經寄件人表示拋棄者，依無著郵件規定處理"},"k":"升資","p":0,"d":""},{"l":2,"y":112,"a":"B","c":0.85,"s":"寄件人同時交寄大宗各類掛號郵件多少件以上者，得使用大宗掛號郵件執據存根聯單一式二份，交郵局查點、簽章並加蓋郵戳後，退還一份，作為執據？","o":{"A":"4 件","B":"5 件","C":"6 件","D":"10 件"},"k":"半日制","p":0,"d":"第一百三十七條\n寄件人交寄各類掛號郵件時，應由郵局掣給執據。\n寄件人同時交寄大宗各類掛號郵件五件以上者，使用大宗掛號郵件執據存\n根聯單一式二份，交郵局查點、簽章並加蓋郵戳後，退還一份，作為執據\n。"},{"l":2,"y":112,"a":"A","c":0.91,"s":"寄件人一次交寄之函件在多少件以上且種類相同者，得依規定交付資費後，由郵局逐件加蓋「郵資已付」戳記，為交付資費之證明。但小包、包裹及快捷郵件之寄件人，不受上述交寄件數之限制？","o":{"A":"20 件","B":"30 件","C":"40 件","D":"50 件"},"k":"半日制","p":0,"d":"154條\n郵局得\n使用\n「郵資已付」\n戳記，\n證明\n資費已付。\n寄件人\n一次\n交寄之函件\n在二十件以上\n且種類\n相同者，\n得依規定\n交付資費後\n由郵局\n逐件\n加蓋\n「郵資已付」\n戳記，\n為交付\n資費之\n證明。\n但小包、\n包裹及\n快捷\n郵件之\n寄件人，\n不受上述\n交寄\n件數之限制。\n比較\n155條\n寄件人\n每次\n交寄之函件\n在一百件以上\n且種類\n相同者，\n得向所在地\n郵局申請，\n經與\n管轄責任中心局\n簽訂\n「自行加印\n郵資已付\n戳記\n交寄\n大宗郵件\n合約書」及\n發給\n許可證，\n由寄件人\n於封套上\n依照\n郵局規定\n位置及格式，\n自行\n加印\n「郵資已付」\n戳記\n之符誌，\n並向郵局\n交寄。\n前項\n自印\n「郵資已付」\n戳記之\n郵件，除\n特約記帳戶\n於指定\n郵局交寄外，\n應當場\n交付郵資。\n未貼足\n郵票\n自行投入\n信箱、信筒、i郵箱\n或其他收受郵件\n專用器具者，\n依\n欠資郵件\n規定處理。\n0\n1"},{"l":2,"y":112,"a":"B","c":0.89,"s":"寄件人每次交寄之函件在多少件以上且種類相同者，得向所在地郵局申請，經與管轄責任中心局簽訂「自行加印郵資已付戳記交寄大宗郵件合約書」及發給許可證，由寄件人於封套上依照郵局規定位置及格式，自行加印「郵資已付」戳記之符誌，並向郵局交寄？","o":{"A":"50 件","B":"100 件","C":"150 件","D":"200 件"},"k":"半日制","p":0,"d":""},{"l":2,"y":112,"a":"C","c":0.89,"s":"下列敘述何者錯誤？","o":{"A":"寄件人交寄郵件，得貼用郵資機印出之符誌，證明郵資已付","B":"客戶使用郵資機，應填具申請書向郵局申請核發使用登記證","C":"郵資機印出之符誌，得以抵作現金使用","D":"使用郵資機之郵件應向指定之郵局交寄；其自行投入信箱、信筒、i 郵箱或其他收受郵件專用器具者， 按欠資郵件處理"},"k":"半日制","p":0,"d":""},{"l":2,"y":112,"a":"C","c":0.81,"s":"申請改投或改寄新地址之有效期間，自郵局同意提供該服務之始日起以幾個月為限。逾期仍照郵件封面所書地址投遞？","o":{"A":"2 個月","B":"4 個月","C":"6 個月","D":"12 個月"},"k":"半日制","p":0,"d":"170條\n第一項\n申請\n改投或\n改寄\n新地址之\n有效期間，\n自郵局\n同意提供\n該服務之\n始日起\n以六個月為限。\n逾期\n仍照\n郵件封面\n所書地址\n投遞。"},{"l":2,"y":112,"a":"D","c":0.83,"s":"改寄之郵件，除國際出口郵件另依萬國郵政公約或協定辦理外，下列何者依規定應另付資費？","o":{"A":"信函","B":"明信片","C":"郵簡","D":"小包"},"k":"半日制","p":0,"d":"172條\n第一項\n除本規章\n另有規定外，\n改投\n之\n郵件\n免納資費。\nㅤㅤ\n第二項\n改寄之\n郵件，\n除\n國際\n出口郵件\n另依\n萬國郵政\n公約\n或協定\n辦理外，\n應分別\n依下列規定\n另付或\n免付資費：\n一、函件：\n(一)\n信函、\n明信片、\n郵簡、\n盲人文件，\n免付資費。\n(二)\n印刷物、小包，\n另付\n自寄達地\n改寄\n新寄達地\n資費。\nㅤㅤ\nㅤㅤ\n二、包裹：\n(一)\n按照\n寄達地\n寄往\n新寄達地\n之資費\n另付資費。\n其應交付\n逾期保管費者，\n並交付\n逾期保管費。\n(二)\n報值或\n保價包裹\n並應\n另付\n報值或\n保價費。\n但國內\n代收貨款\n包裹，\n不在此限。\n0\n1"},{"l":2,"y":112,"a":"B","c":0.56,"s":"有關未付資費之國內欠資郵件，下列敘述何者錯誤？","o":{"A":"未付資費之國內欠資郵件，契約自始不成立，退還寄件人","B":"經寄件人補付資費及欠資手續費者，得由寄件人申請將該郵件再向收件人投遞","C":"無法退還寄件人者，不予寄遞，於招領揭示期滿後，依無著郵件規定處理","D":"未付足資費之欠資郵件，除另有規定外，於投遞時，向收件人收取欠資差額及欠資手續費"},"k":"半日制","p":0,"d":"當郵件因為沒貼郵票被退回給「寄件人」時，寄件人只需要 \n「補貼郵票」\n（補足資費）就好，\n不需要付手續費\n。\nㅤㅤ\nㅤㅤ\n我真服啦\n7\n1"},{"l":2,"y":112,"a":"A","c":0.87,"s":"無法投遞或按規定不予寄遞而不能退還寄件人之郵件，應由原寄局招領揭示幾個月，逾期無人領取者為無著郵件？","o":{"A":"1 個月","B":"2 個月","C":"3 個月","D":"4 個月"},"k":"半日制","p":0,"d":"203條\n第一項\n無法投遞或\n按規定\n不予寄遞\n而不能退還\n寄件人之郵件，\n應由\n原寄局\n招領揭示\n一個月，\n逾期\n無人領取者\n為無著郵件。\n第二項\n寄件人\n聲明拋棄或\n無法投遞\n免退回者，\n視為\n無著郵件。"},{"l":2,"y":112,"a":"B","c":0.87,"s":"郵件應分別書寫收件人、寄件人之姓名、詳細地址及郵遞區號，字體長寬大於幾毫米，且字跡應清晰？","o":{"A":"3 毫米","B":"4 毫米","C":"5 毫米","D":"6 毫米"},"k":"半日制","p":0,"d":""},{"l":2,"y":112,"a":"B","c":0.64,"s":"不按址投遞區域之郵件，郵局依收件人書面指定一郵局寄放其郵件，由收件人到該郵局領取，其待領期限為何？","o":{"A":"15 天","B":"1 個月","C":"2 個月","D":"3 個月"},"k":"半日制","p":0,"d":"第一百六十三條\n不按址投遞區域之郵件依下列方式投遞：\n一、收件人通知寄件人，將郵件寄交當地郵局按址投遞地區內之行號或住戶代為收轉。\n二、收件人以書面通知當地郵局將郵件投交當地郵局按址投遞區內指定之行號或住戶代為收轉。\n三、收件人在郵局投遞路線必經之路邊、岔道口、行號或住戶門前，自行設置受信箱，並以書面通知當地郵局，將其郵件投入該受信箱內，由收件人自行提取。\n四、收件人用書面指定一郵局寄放其郵件，由收件人到該郵局領取。\n五、將郵件投入郵局在車輛可通達，且為公眾必經之適當地點，所設置之公用受信箱或集體受信箱，由村鄰長或公推之負責人負責提取分發，或由收件人自行提取。\n未依前項各款規定辦理之郵件，留存最近投遞局所，或郵政代辦所，待收件人或其委託代領人前來領取，待領期限一個月。前項第四款寄放郵件待領期限亦同。逾期未領，視為無法投遞郵件，依相關規定處理之。 \n第一項第三款、第五款由郵局或收件人設置之受"},{"l":2,"y":112,"a":"C","c":0.84,"s":"存局候領之國內快捷郵件，自候領之次日起算，以多少日為限？","o":{"A":"3 日","B":"4 日","C":"5 日","D":"6 日"},"k":"半日制","p":0,"d":"第一百八十八條\n國內郵件存局候領期間，以候領之次日起算十五日為限，但收件人得以書 面申請延長至一個月。逾期未領者，依無法投遞郵件之規定處理。 寄件人於前項期限內申請提前退回或於封面上註明留存幾日無人領取即退 回字樣者，郵局應依其申請或註記辦理。 \n存局候領之國內快捷郵件，自候領之次日起算，以五日為限\n，逾期未領者 依第一項後段之規定辦理。但收件人得以書面申請延長至一個月。 前三項情形之郵件，依規定應補收逾期保管費、退回費者，於退回時向寄 件人補收之。"},{"l":2,"y":112,"a":"B","c":0.82,"s":"包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，下列規定何者錯誤？","o":{"A":"國內掛號函件，每件為新臺幣五百七十五元","B":"國際掛號函件，每件依國際貨幣基金特別提款權（SDR）四十計算單位，計算其補償金額","C":"國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權（SDR）一百五十計算單位，計算其補償金額","D":"報值或保價郵件全部或一部遺失、被竊或毀損，應予補償時，按所報或所保價值之全部或一部予以補償。一部損失，以實價補償，其實價，依收寄時及收寄地之市價定之，最多以原件所報或所保價值為限"},"k":"半日制","p":0,"d":"第211條：\n包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，依下列規定：\n一、國內掛號函件，每件為新臺幣575元。\n二、\n國際掛號函件，每件依國際貨幣基金特別提款權（SDR）30計算單位，計算其補償金額。\n三、國際掛號印刷物專袋，每袋依國際貨幣基金特別提款權（SDR）150計算單位，計算其補償金額。"},{"l":2,"y":112,"a":"A","c":0.98,"s":"中華郵政公司為辦理各項業務，設於各地之營業處所，稱為下列何者？","o":{"A":"郵局","B":"管轄局","C":"責任中心局","D":"分行"},"k":"半日制","p":0,"d":"第三條\n本公司為辦理各項業務，設於各地之營業處所，稱為郵局。"},{"l":2,"y":112,"a":"C","c":0.85,"s":"下列何者不是中華郵政公司經營之基本郵件業務？","o":{"A":"盲人文件","B":"電子函件","C":"快捷郵件","D":"包裹"},"k":"半日制","p":0,"d":"第四條\n本公司經營基本郵件業務如下：\n一、信函。\n二、明信片。\n三、郵簡。\n四、印刷物。\n五、盲人文件。\n六、電子函件。\n七、小包。\n八、包裹。"},{"l":2,"y":112,"a":"C","c":0.85,"s":"下列何者不是中華郵政公司經營之特種郵件業務？","o":{"A":"限時郵件","B":"掛號郵件","C":"電子函件","D":"代收貨款郵件"},"k":"半日制","p":0,"d":"第五條\n本公司經營特種郵件業務如下：\n一、航空郵件。\n二、限時郵件、可追蹤函件、快捷郵件。\n三、掛號郵件。\n四、報值郵件。\n五、保價郵件。\n六、代收貨款郵件。\n七、廣告回信。\n八、存證信函。\n九、傳真函件。\n十、未來郵件。"},{"l":2,"y":112,"a":"C","c":0.86,"s":"客戶於利用郵務業務時，如有特別指示，郵局窗口人員應如何辦理？","o":{"A":"依用郵客戶指示辦理","B":"請其與郵局完成議價簽約後辦理","C":"請其應先與中華郵政公司以書面締結特約","D":"得立即電話洽詢中華郵政公司同意"},"k":"半日制","p":0,"d":"第七條\n客戶利用本規章之郵務業務，其權利義務關係，除郵政法與其相關法規命令另有規定外，依本規章之規定。\n客戶利用本規章之郵務業務，如有特別指示，應先與本公司以書面締結特約，始生效力\n，但不得違反法令上之強行規定或公序良俗。"},{"l":2,"y":112,"a":"A","c":0.89,"s":"「信函」每件尺寸最小限制，不得小於幾公分？（許可差 2 毫米）","o":{"A":"14 公分× 9 公分","B":"14 公分×10 公分 5 毫米","C":"14 公分 8 毫米× 9 公分","D":"14 公分 8 毫米×10 公分 5 毫米"},"k":"半日制","p":0,"d":"第十二條\n信函每件重量不得逾二公斤。但郵政法第六條第一項所定專營之文件不在此限。\n信函每件尺寸限制如下：\n一、尺寸最大限制，長寬厚各不逾六十公分，合計以九十公分為限；成捲者，其長度及直徑之二倍，合計以一百零四公分為限，最大一面之尺寸不逾九十公分。許可差均為二毫米。\n二、尺寸最小限制，不得小於十四公分乘九公分，許可差二毫米\n；成捲者，其長度及直徑之二倍，合計不得小於十七公分，其最大一面之尺寸不得小於十公分。\n寄件人交寄之信函，其規格不符合第一項或第二項規定者，應重裝或分裝。"},{"l":2,"y":112,"a":"A","c":0.76,"s":"下列哪種郵件寄件人得加付資費申請限定投交收件人本人親收？","o":{"A":"國際掛號函件","B":"國際包裹","C":"國際快捷郵件","D":"各類掛號郵件皆可"},"k":"半日制","p":0,"d":"第七十五條\n國際掛號函件\n，寄件人得依郵件處理規則第二十九條規定，\n加付資費申請限定投交收件人本人親收"},{"l":2,"y":112,"a":"D","c":0.77,"s":"有關「特製郵簡」，下列敘述何者錯誤？","o":{"A":"須以整張紙適當摺疊粘貼，不加封套交寄","B":"依中華郵政公司公告之紙張尺寸、規格，加印許可文字","C":"郵簡的封面必須印有郵票符誌","D":"任何人皆得向中華郵政公司申請印製，供自用或出售"},"k":"半日制","p":0,"d":"第十八條\n郵簡指以整張紙適當摺疊粘貼，並依本公司公告之紙張尺寸、規格，加印許可文字之不加封套交寄之文件。\n郵簡封面印有郵票符誌，由本公司發行者，為特製郵簡\n。"},{"l":2,"y":112,"a":"D","c":0.93,"s":"國內郵簡夾寄任何附件時，應劃去「郵簡」字樣，改按下列何者寄遞？","o":{"A":"依無法投遞之郵件處理","B":"印刷物","C":"小包","D":"信函"},"k":"半日制","p":0,"d":"第十九條\n郵簡夾寄任何附件時，依下列方式處理：\n一、國內郵簡，應劃去「郵簡」字樣，\n改按信函寄遞。"},{"l":2,"y":112,"a":"C","c":0.76,"s":"已登記之新聞紙或雜誌，其登記之事項如有變更，應於變更之日起多久內，向郵局申請變更登記？","o":{"A":"5 日","B":"7 日","C":"10 日","D":"1 個月"},"k":"半日制","p":0,"d":"已登記之新聞紙或雜誌，其登記之事項如有變更，應於變更之日起\n十日內\n，向郵局申請變更登記。"},{"l":2,"y":112,"a":"B","c":0.67,"s":"新聞紙或雜誌未符合郵務營業規章規定，於交寄後始發現經郵局通知者，寄件人應按印刷物資費補付差額，應於接到通知之次日起幾日內付清？","o":{"A":"3 日","B":"5 日","C":"7 日","D":"10 日"},"k":"半日制","p":0,"d":"第二十八條\n新聞紙或雜誌，有下列情形之一者，應按印刷物付費交寄：\n一、封面上所書刊物名稱及地址與原登記不同者。\n二、非經登記之報社或其派報處所或雜誌社交寄者。\n三、非向指定之郵局窗口交寄者。\n四、本規章第二十二條第一項第二款之情形者。\n五、應登記之事項有變更，而未於期限內辦理變更者。\n六、內頁頁數、版面不全，或未編訂頁次、版次，或重複編訂者。\n七、非當期雜誌。但零星補寄在一百件以內，並於封面註明「補寄」字樣者，不在此限。\n八、由民營遞送業者代寄或僅交寄偏遠地區者。\n九、寄往國外之雜誌。\n前項各款情形，於交寄後始發現經郵局通知者，寄件人應按印刷物資費補付差額，並限於接到通知之次日起五日內付清；未付清前，不得再按新聞紙或雜誌交寄。"},{"l":2,"y":112,"a":"C","c":0.8,"s":"寄往國外之書籍，無論單本或多本之限重為多少？","o":{"A":"1 公斤","B":"2 公斤","C":"5 公斤","D":"10 公斤"},"k":"半日制","p":0,"d":"第三十二條\n印刷物每件重量限制為二公斤。但\n國內互寄單本書籍，或寄往國外之書籍無論單本或多本，均得展至五公斤\n。其尺寸限度與信函之規定同"},{"l":2,"y":112,"a":"A","c":0.83,"s":"同日同一收件人之印刷物總重量超過多少公斤，得通知收件人自通知之次日起 15 日內至指定郵局領取？","o":{"A":"5 公斤","B":"10 公斤","C":"15 公斤","D":"25 公斤"},"k":"半日制","p":0,"d":"第三十三條\n同日同一收件人之印刷物總重量\n超過五公斤者\n，得通知收件人至郵局領取。"},{"l":2,"y":112,"a":"D","c":0.74,"s":"盲人文件尺寸限度與信函規定同，每件重量不得逾幾公斤？","o":{"A":"1 公斤","B":"2 公斤","C":"5 公斤","D":"7 公斤"},"k":"半日制","p":0,"d":"第三十五條\n盲人文件指盲人所用印有點痕或凸出字樣，交寄時在封面註明「盲人文件」字樣之文件。另專供盲人使用之錄音帶、錄音片、錄音線及特製紙張，係發自或寄交立案之盲人學校者，視同盲人文件。\n專供盲人使用之磁片、光碟片或電子儲存裝置，係發自或寄交立案之盲人學校者，得按盲人文件計費交寄。\n盲人文件交寄時，應在封面註明「盲人文件」字樣；寄往國外者，以國際郵務通用之法文或英文(見附表二)註明同義字樣。\n盲人文件免付水陸路普通資費；交由航空郵路寄遞者，國內應付航空費，國際應付新聞紙航空資費；按限時或掛號等特別處理者，應付相關特別處理資費。\n盲人文件每件重量不得逾七公斤\n，其尺寸限度與信函規定同。"},{"l":2,"y":112,"a":"C","c":0.9,"s":"電子函件之郵寄資費包括郵資及下列何種費用？","o":{"A":"列印費","B":"工本費","C":"特別處理費","D":"人事費"},"k":"半日制","p":0,"d":"第三十八條\n電子函件之郵寄資費包括\n郵資及特別處理費\n。郵資依郵件資費表之規定暨函件編輯頁數計算；特別處理費依信封、信紙及列印封裝成本等由本公司訂定之，於郵件交寄時向寄件人收取之。"},{"l":2,"y":112,"a":"A","c":0.79,"s":"寄往國外之「小包」應黏貼綠色報關簽條，其申報價值逾多少國際貨幣基金特別提款權（Special Drawing Right，SDR）須另附報關單？","o":{"A":"300 計算單位","B":"200 計算單位","C":"150 計算單位","D":"100 計算單位"},"k":"半日制","p":0,"d":"第四十五條\n小包指寄交特定人或特定地址不逾一公斤之小件物品。印刷物亦得做小包交寄。\n小包寄往國外者，每件重量限制為二公斤。\n小包之尺寸限度與信函規定同。\n小包應於封面註明「小包」字樣；寄往國外者，以國際郵務通用之法文或英文註明之（見附表二），並應黏貼綠色報關簽條，\n其申報價值逾國際貨幣基金特別提款權(Special Drawing Right，簡稱SDR)三００計算單位者，另附報關單\n。"},{"l":2,"y":112,"a":"B","c":0.77,"s":"國際包裹交由航空郵路寄遞者，其尺寸限度為何？","o":{"A":"任一尺度均不得大於 100 公分，長度加長度以外最大周圍合計不得大於 200 公分","B":"任一尺度均不得大於 105 公分，長度加長度以外最大周圍合計不得大於 200 公分","C":"任一尺度均不得大於 120 公分，長度加長度以外最大周圍合計不得大於 300 公分","D":"任一尺度均不得大於 150 公分，長度加長度以外最大周圍合計不得大於 300 公分"},"k":"半日制","p":0,"d":"第四十八條\n國際包裹每件尺寸及重量限制除寄達之國外郵政另有規定外，依國際包裹資費表之規定。\n國際包裹尺寸除寄達之國外郵政另有規定外，應符合下列限制：\n一、交由水陸郵路寄遞者，任何一尺寸不得大於一公尺五十公分，長度加長度以外之最大周圍合計亦不得大於三公尺。\n二、交由航空郵路寄遞者，任何一尺寸不得大於一公尺五公分，長度加長度以外之最大周圍合計亦不得大於二公尺。\n三、最小尺寸與信函之規定同。"},{"l":2,"y":112,"a":"D","c":0.71,"s":"有關「可追蹤函件」，下列敘述何者錯誤？","o":{"A":"限為國際非掛號函件","B":"按址投遞，收件人免簽收","C":"不受理書面查詢","D":"遺失依法補償"},"k":"半日制","p":0,"d":"第七十一條\n國際非掛號函件\n，由寄達郵政機構優先處理並交由專差儘速投遞及提供網路追蹤資訊者，為可追蹤函件。\n可追蹤函件係\n按址投遞，免收件人簽收，且不受理書面查詢及補償。"},{"l":2,"y":112,"a":"D","c":0.78,"s":"收件人於接收包裹時，當場向投遞人員聲明有瑕疵時，應如何處理？","o":{"A":"包裹先交收件人保管，惟應請收件人出具書面聲明攜回陳報","B":"請收件人先簽收包裹，事後再聯絡處理","C":"包裹應暫緩投交，立即聯絡寄件人至郵局領回","D":"包裹應暫緩投交，並請收件人至郵局辦理"},"k":"半日制","p":0,"d":"依據郵務營業規章第57條，當收件人於領取包裹時當場聲明瑕疵，或郵局主動通知包裹有瑕疵時：\n郵局應與收件人填具「一式兩份」的清單，雙方會同簽名並各執一份，以此做為責任歸屬的依據。\n清單內需記載：交寄日期/號碼/原寄局、包裹外觀/封裝情形、重量、內裝物品、收件人聲明事項。\n若投遞時發現包裹瑕疵，應暫緩投交，請收件人至郵局依上述規定辦理。"},{"l":2,"y":112,"a":"C","c":0.83,"s":"下列何者不得以報值信函交寄？","o":{"A":"新臺幣 5,000 元","B":"有價證券","C":"黃金戒指","D":"投標文件"},"k":"半日制","p":0,"d":"第77條\n掛號郵件經寄件人報明價值加付報值費於國內互寄者，為報值郵件。 \n報值信函分為裝寄\n法定\n紙幣及\n非\n裝寄\n法定\n紙幣二種。\n非\n裝寄\n法定\n紙幣報值信函，例如證\n書、有價證券、契據、支票、匯票、單據、投標文件\n及其他一切重要具有價值文件，均得裝寄。 \n報值郵件每件報值最高限額由本公司定之。"},{"l":2,"y":112,"a":"A","c":0.58,"s":"廣告回信應按照郵局同意登記之回信信封、明信片或貼紙上所印之用戶名稱、地址及郵遞區號寄遞，下列何者如經塗改，將依欠資郵件規定處理？","o":{"A":"用戶名稱","B":"用戶地址","C":"郵遞區號","D":"以上皆不得塗改"},"k":"半日制","p":0,"d":"ㅤㅤ\nㅤㅤ\n中華郵政的\n《\n郵務營業規章\n》第 111 條\n主要是針對\n廣告回信\n的寄遞規範、變更手續以及取消登記的條件做出規定。 \n第 111 條 條文內容\n第一項\n：廣告回信應按照郵局同意登記之回信信封、明信片或貼紙上所印之用戶名稱、地址及郵遞區號寄遞，\n用戶名稱如經塗改\n，\n依欠資郵件規定處理"},{"l":2,"y":112,"a":"C","c":0.91,"s":"存證信函留存郵局之副本，自交寄日起，由郵局保存多久，期滿後銷燬之？","o":{"A":"1 年","B":"2 年","C":"3 年","D":"5 年"},"k":"半日制","p":0,"d":"交寄存證信函有什麼規定?\n一、使用郵局存證信函用紙或其他符合郵局規定之格式紙張書寫。\n二、使用本國文字，並得加註標點符號或阿拉伯數字。但信內述及之外國人名或事物名稱必須引用原文者，得用外國文字書寫。\n三、使用不脫色筆或打字複寫，或書寫後複印、影印，每格限書一字，均需色澤明顯，字跡端正。\n四、信函內之寄件人及收件人姓名、地址及郵遞區號與封面所書(示)者相同。\n五、信函如有附件，以與存證信函本身有關文件為限，文件以外之物品不得附寄。正本具有附件者，副本亦須備附件，如無法製備者，應以照片或影印本代替。\n六、存證信函正副本文字，如有塗改增刪，應於正副本之末註明「在某頁某行第幾格下塗改增刪若干字」字樣，由寄件人簽名或蓋章。但塗改增刪每頁不得逾二十字。\n七、存證信函留存郵局之副本，依郵件處理規則第三十四條第二項規定，自交寄日起，由郵局保存三年，期滿後銷燬之。"},{"l":2,"y":112,"a":"D","c":0.86,"s":"「未來郵件」之最短及最長保管期限各為多久？","o":{"A":"最短 7 日，最長不逾 10 年","B":"最短 7 日，最長不逾 20 年","C":"最短 15 日，最長不逾 20 年","D":"最短 15 日，最長不逾 30 年"},"k":"半日制","p":0,"d":"一、定義：\n「未來郵件」(未來信)係指本公司提供寄件人“寫信給未來”的服務，顧客只要指定寄送日期及收件地點，郵件就可於約定時效內送達收件人手中。\n貼心提醒：\n所謂「約定時效」係指郵件依據顧客指定寄送日期寄送並依本公司全球資訊網公告之各類郵件投遞時效送達收件人。\nㅤㅤ\n二、指定交寄期限（郵件保管期）：\n最短15日，最長不逾30年。\nㅤㅤ\n三、適用郵件種類：\n(一)國內普通掛號函件、掛號小包、國內包裹。（暫不收寄各類限時掛號郵件、快捷郵件，但可加附回執）\n(二)國內普通平常函件（含信函、明信片、印刷物、小包）\n(三)國際(含大陸地區)普通平常函件。\nㅤㅤ\n四、收寄限制：\n(一)包裹郵件限制使用未來郵件專用紙箱。\n(二)寄達地為國內及國際（含大陸地區）。\n(三)現金、金銀條塊、寶石珍飾等貴重物品，應請顧客按報值郵件交寄，「報值郵件」每件價值以新臺幣5萬元為上限。\n(四)郵件性質易於腐壞，無法於常"},{"l":2,"y":112,"a":"D","c":0.72,"s":"有關「信函」之尺寸限制，成捲者，其長度及直徑之二倍，合計不得小於幾公分？最大一面之尺寸不得小於幾公分？（許可差 2 毫米）","o":{"A":"27 公分、10 公分","B":"20 公分、14 公分","C":"14 公分、9 公分","D":"17 公分、10 公分"},"k":"半日制","p":0,"d":"第十二條\n信函每件重量不得逾二公斤。但郵政法第六條第一項所定專營之文件不在此限。\n信函每件尺寸限制如下：\n一、尺寸最大限制，長寬厚各不逾六十公分，合計以九十公分為限；成捲者，其長度及直徑之二倍，合計以一百零四公分為限，最大一面之尺寸不逾九十公分。許可差均為二毫米。\n二、尺寸最小限制，不得小於十四公分乘九公分，許可差二毫米；成捲者，\n其長度及直徑之二倍，合計不得小於十七公分，其最大一面之尺寸不得小於十公分。\n寄件人交寄之信函，其規格不符合第一項或第二項規定者，應重裝或分裝。"},{"l":2,"y":112,"a":"B","c":0.76,"s":"有關國內明信片的規格，下列敘述何者錯誤？","o":{"A":"國內明信片尺寸最小者為 14 公分乘 9 公分","B":"紙張厚度每平方公尺 150 公克以上、250 公克以下","C":"須以白色紙料印製","D":"國內橫式明信片得補足郵資差額，作國外明信片使用"},"k":"半日制","p":0,"d":"第十三條\n明信片指書寫於單一紙片上，不加封套交寄，並依本公司公告之紙質、規格製作之文件。\n國內明信片規格應為長方形，並須以\n每平方公尺一百八十公克以上，且不逾二百五十公克之\n白色\n紙料印製\n，其尺寸最大者為十四公分八毫米乘十公分五毫米，最小者十四公分乘九公分。國際明信片規格應依萬國郵政公約之規定。許可差均為二毫米。\n明信片紙張表面應平整光滑，不得有突出部分。\n本公司得發行印有郵資符誌之郵政明信片。國外明信片應為橫式，並加印國際郵務通用之法文或英文郵政明信片字樣（見附表二）。國內橫式明信片得補足郵資差額，作國外明信片使用。"},{"l":2,"y":112,"a":"B","c":0.84,"s":"交寄未印郵資符誌之直式、橫式明信片，應分別將郵票黏貼於何處位置？","o":{"A":"正面上端右角、正面上端右角","B":"正面上端左角、正面上端右角","C":"正面上端左角、正面上端左角","D":"正面上端右角、正面上端左角"},"k":"半日制","p":0,"d":""},{"l":2,"y":112,"a":"D","c":0.75,"s":"新聞紙或雜誌申請交寄登記時，應填具登記申請書，檢附幾份最近出刊之該刊物，向責任中心局辦理登記？且寄件人於每期交寄時，應檢送幾份供收寄郵局查驗？","o":{"A":"3 份、2 份","B":"2 份、1 份","C":"1 份、1 份","D":"3 份、1 份"},"k":"半日制","p":0,"d":"第二章 第四節 印刷物\n第二十一條\n新聞紙或雜誌申請交寄登記時，應填具登記申請書，檢附下列資料及證件正本與影本（正本驗畢發還），並指定交寄之郵局，送交發行所在地郵局轉由所屬責任中心局辦理登記，核發交寄登記證：\n一、最近出刊之該刊物三份。\n二、公司、行號之登記證明文件及其負責人身分證明文件。\n三、其他法人或非法人團體之設立證明文件及其負責人身分證明文件。\n前項申請書約定事項，由本公司另定之。\n政府或民意機關發行之公報、刊物，得檢附第一項第一款刊物，填具申請書加蓋機關印信，申請按新聞紙或雜誌交寄。\n已登記之新聞紙或雜誌，其登記之事項如有變更，應於變更之日起十日內，向郵局申請變更登記。\n寄件人應於每期交寄時，檢送一份供收寄郵局查驗。\n新聞紙或雜誌之申請與管理，由本公司另定之。"},{"l":2,"y":112,"a":"C","c":0.67,"s":"經同意以新聞紙交寄之次日起幾個月內，未向指定郵局交寄；或交寄後自行中斷交寄逾幾個月者，中華郵政公司得撤銷新聞紙交寄之登記？","o":{"A":"3 個月、3 個月","B":"3 個月、6 個月","C":"6 個月、3 個月","D":"6 個月、6 個月"},"k":"半日制","p":0,"d":"第二十二條\n有下列情形之一者，撤銷新聞紙或雜誌交寄之登記：\n一、內容涉及違法情事，經法院判決有罪確定或相關主管機關處分確定者。\n二、內容係屬商業性廣告、宣傳品或公司行號發行為本身業務或特定個人宣傳，其篇幅逾全部篇幅百分之五十，且一年內累計達三次者。\n三、經同意以新聞紙或雜誌交寄之次日起\n六個月內，未向指定郵局交寄者\n，或交寄後自行中斷交寄，\n新聞紙逾三個月、雜誌逾六個月者\n。\n四、已交由民營遞送業者投遞或僅交寄偏遠地區者。\n前項第三款所定期間，如因不可抗力或其他正當理由，經寄件人申請展期者，不在此限。"},{"l":2,"y":112,"a":"A","c":0.89,"s":"國內包裹每件重量限制為多少公斤？其尺寸最大限度長寬高三邊合計不得大於多少公分？","o":{"A":"20 公斤、150 公分","B":"20 公斤、300 公分","C":"30 公斤、150 公分","D":"30 公斤、300 公分"},"k":"半日制","p":0,"d":"第四十六條\n可遞送之物品，除郵件處理規則規定之禁寄物品或郵件規格不符本公司公告者外，得按包裹交寄。印刷物亦得做包裹交寄。\n國內包裹每件重量限制為二十公斤\n，其尺寸最小限度與信函之規定同，\n最大限度為長寬高三邊合計亦不得大於一百五十公分。"},{"l":2,"y":112,"a":"D","c":0.81,"s":"包裹應按下列何種規定妥為封裝？ A.內裝物性質 B.途程遠近 C.運輸狀況 D.包裝或密封為一件","o":{"A":"僅 ABC","B":"僅 ACD","C":"僅 ABD","D":"ABCD"},"k":"半日制","p":0,"d":"49條\n第一項\n包裹\n應按\n內裝物性質、A\n途程遠近及B\n運輸狀況C\n妥為封裝，\n除本規章\n有關\n封裝之規定外，\n並依\n下列規定\n辦理：\n一、數件\n物品D\n未經包裝或D\n密封D\n為一件者，D\n不得交寄。"},{"l":2,"y":112,"a":"B","c":0.8,"s":"寄件人申請撤回國際包裹時，相關撤回費及已付之資費之敘述，下列何者錯誤？","o":{"A":"包裹尚在原寄局者，其已付之資費全數退還並免付撤回費","B":"相關包裹已離開原寄局，但尚在我國境內，經截留退回者，其已付之資費扣除原寄局與退回地之國內包 裹往返資費後，退還餘額，並免付撤回費","C":"包裹已離開我國境內，於未投遞前，經截留退回者，其已付之資費，不予退還，並應付撤回費","D":"包裹係保價者，於扣除國內包裹資費時，其已付之保價費，不予退還"},"k":"半日制","p":0,"d":"郵務營業規章 第54條\n二、相關包裹已離開原寄局，但尚在我國境內，經截留退回者，其已付之資費扣除原寄局與退回地之國內包裹往返資費後，退還餘額，並\n應付撤回費\n。"},{"l":2,"y":112,"a":"C","c":0.65,"s":"有關「存證信函」，下列敘述何者錯誤？","o":{"A":"得寄至國內、國外任何郵遞通達之地方","B":"文件以外之物品不得附寄","C":"寄往國外之存證信函，依寄達之國外郵政之規定不受理回執者，不予收寄","D":"如有塗改增刪文字，每頁不得逾 20 字"},"k":"半日制","p":0,"d":"第一百十二條: 寄往國外之存證信函，依寄達之國外郵政之規定不受理回執者，免納回執費，並由寄件人自行衡酌交寄。"},{"l":2,"y":112,"a":"B","c":0.56,"s":"有關「未來郵件」，下列敘述何者正確？","o":{"A":"係指寄件人指定郵件未來之收到日期、收件人及收件地址，由郵局於約定時效內送達收件人者","B":"未來郵件可加附回執","C":"國內快捷郵件得以未來郵件交寄","D":"國際（含大陸地區）普通掛號函件得以未來郵件交寄"},"k":"半日制","p":0,"d":"(A)\n112-1 寄件人指定未來之寄出日期、收件人及收件地址，由郵局於約定時效內送達收件人者，為未來郵件。\n(B)(C)(D)\n112-2 得以未來郵件交寄之郵件種類如下：\n一、國內普通掛號函件、國內包裹（不收寄各類限時掛號郵件、快捷郵件，但\n可加附回執\n）。\n二、國內普通平常函件（含信函、明信片、印刷物、小包）。\n三、國際（含大陸地區）普通平常函件。\n14\n1"},{"l":2,"y":112,"a":"C","c":0.71,"s":"有關廣告回信業務，下列敘述何者正確？","o":{"A":"郵局僅辦理國內廣告回信，尚未開辦國際廣告回信","B":"回信信封、明信片或貼紙皆得裝入信封郵寄，備供回信人填寫寄回","C":"廣告回信用戶連續 3 年未使用者，郵局得撤銷其登記","D":"廣告回信用戶地址如有變更，應於 10 日內向郵局辦理變更移轉或取消登記手續"},"k":"半日制","p":0,"d":"(A) 106 條  廣告回信應先向當地郵局申請轉送所屬各等郵局申請登記；國際廣告回信業務另依萬國郵政公約規定辦  理。\n(B)108 條  回信信封或明信片得裝入信封郵寄，備供回信人填寫寄回，\n                 貼紙得依式刊印於新聞紙、雜誌上，備供填寫剪貼於空白信封或類似明信片之硬紙片上寄回。\n(D)111條  廣告回信用戶地址如有變更，應立即向郵局辦理變更移轉或取消登記手續。"},{"l":2,"y":112,"a":"A","c":0.74,"s":"甲小姐至郵局窗口交寄代收貨款郵件，郵件封面所書應收貨款金額為新臺幣（下同）2,000 元，郵局服務人員登載金額 2,100 元，匯款匯費為 30 元，請問郵務士於遞送該郵件時應代收之貨款金額為多少？","o":{"A":"2,000 元","B":"2,030 元","C":"2,100 元","D":"2,130 元"},"k":"半日制","p":0,"d":"99 條   \n代收貨款郵件免收轉帳匯費。\n101條 代收貨款郵件所書金額與郵局服務人員登載金額不一致者，以郵件所書金額為代收金額。"},{"l":2,"y":112,"a":"B","c":0.64,"s":"乙先生至郵局窗口以報值信函交寄現金新臺幣（下同）2,000 元，寄件人於封面以大寫數字書明「報值金額貳仟元」，郵局服務人員於電腦繕打之執據上誤入報值金額為 3,000 元，如該郵件因故不慎遺失，寄件人得領之補償金及退還郵資應為多少？","o":{"A":"2,000 元，加上所付全部郵資（但不含報值費）","B":"3,000 元，加上所付全部郵資（但不含報值費）","C":"2,000 元，加上所付全部郵資","D":"3,000 元，加上所付全部郵資"},"k":"半日制","p":0,"d":"第80條\n報值信函或報值小包\n之報值數額，寄件人應在\n封面以大寫數字書明\n，由\n郵局服務人員於執據上註明\n之；\n報值包裹或報值快捷郵件\n之報值數額，寄件人應在交寄報值包裹或報值快捷\n郵件單據或郵件封面上以大寫數字書明\n，由郵局服務人員將執據掣給寄件人。嗣後\n發生補償\n問題時，應以\n執據上註明之報值金額為準\n。 \n郵局服務人員對於報值郵件之內容，有疑問時，得請寄件人當面點驗及封裝。"},{"l":2,"y":112,"a":"D","c":0.65,"s":"小美住新竹市，自美國網站購買日常用品一批，有關國際包裹進口之相關規定，下列敘述何者錯誤？","o":{"A":"包裹倘應踐行報關手續者，原則上由寄件人或收件人自行辦理","B":"包裹非在駐有海關之郵局投遞者，得由郵局代為報關","C":"包裹屬非結匯進口物品，且價值未超過免繳輸入許可證限額者，得由郵局代為報關","D":"郵局代為報關之包裹，如經海關拆驗有違禁或依規定禁止輸入或輸出之物品，應退回原寄國"},"k":"半日制","p":0,"d":"第五十八條\n包裹應踐行報關手續者，由寄件人或收件人自行辦理。但下列包裹得由郵局代為報關：\n一、包裹非在駐有海關之郵局交寄或投遞者。\n二、進口國際包裹，非結匯進口物品，其價值未超過免繳輸入許可證限額者。\n郵局代為報關之包裹，如經海關拆驗有違禁或依規定禁止輸入或輸出之物品，應依海關有關法規之規定處理，並由收件人或寄件人對其內容自行負責。\n收件人自行辦理報關手續之進口國際包裹，經海關拆驗後，收件人應對其內容負責；委託他人代領者亦同。驗關後由郵局與海關雙方人員會同投交收件人。"},{"l":2,"y":112,"a":"B","c":0.64,"s":"有關收件人領取代收貨款郵件，下列敘述何者錯誤？","o":{"A":"收件人應自通知之次日起 15 日內向指定郵局領取","B":"逾期未領者，應將該郵件退回原寄件人","C":"領取前應先由收件人確認郵件，並由郵局向收件人收取應代收之貨款","D":"郵局驗明收件人無誤並請收件人於收據上簽名或蓋章後，將郵件交付收件人"},"k":"半日制","p":0,"d":"第一百零三條\n代收貨款郵件經郵局通知領取者，收件人應自通知之次日起十五日內向指定郵局領取，逾期未領者，除寄件人預先在託運單或詳情單上有所聲明或另為聲明，依其聲明辦理外，\n應將該郵件退回原寄郵局。"},{"l":2,"y":112,"a":"B","c":0.39,"s":"A 君於 112 年 6 月 10 日交寄普通掛號郵件，於 6 月 20 日辦理查詢，嗣 A 君於 6 月 25 日接獲郵局通知該掛號 郵件遺失依法應予補償，經 A 君於 9 月 10 日提供交寄憑據，其補償金支付至遲應於下列何日期前為之？","o":{"A":"112 年 9 月 10 日","B":"112 年 9 月 20 日","C":"112 年 9 月 25 日","D":"112 年 12 月 10 日"},"k":"升等","p":0,"d":"A 君於 112 年 6 月 10 日交寄普通掛號郵件，\n於 6 月 20 日辦理\n查詢\n，嗣 A 君於 6 月 25 日接獲郵局通知該掛號 郵件遺失依法應予補償，經 A 君於 9 月 10 日提供交寄憑據，其補償金支付至遲應於下列何日期前為之？\nㅤㅤ\n112 年 6 月 20 日-->112 年 9 月 21 日 內\n第 63 條\n郵件經查有遺失、被竊、毀損、遞送延誤或掛號郵件未依中華郵政公司公告之處理規定遞送，依本法應予補償者，郵局應憑交寄執據或郵件封皮儘速支付補償金，至遲應自\n查詢\n之\n次日\n起\n三個月\n內\n為之。"},{"l":2,"y":112,"a":"D","c":0.52,"s":"依郵務營業規章規定，郵件收寄業務，分基本郵件業務及特種郵件業務兩種，下列何者是中華郵政公司經營之 特種郵件業務？","o":{"A":"電子函件","B":"盲人文件","C":"郵簡","D":"未來郵件"},"k":"升等","p":0,"d":"第 五 條 本公司經營特種郵件業務如下：\n 一、航空郵件。\n 二、限時郵件、可追蹤函件、快捷郵件。\n 三、掛號郵件。\n四、報值郵件。\n五、保價郵件。\n六、代收貨款郵件。\n七、廣告回信。\n八、存證信函。\n九、傳真函件。\n十、未來郵件。"},{"l":2,"y":112,"a":"A","c":0.32,"s":"依郵務營業規章規定，有關郵局得拒絕收件人申請改投或改寄之情形，下列敘述何者錯誤？","o":{"A":"原收件地址為不按址投遞區域者","B":"有收件人地址之郵件，改交同地郵局存局候領者","C":"性質複雜者","D":"僅限於即將寄到之郵件者"},"k":"升等","p":0,"d":"郵務營業規章 第一百七十一條\n有下列情形之一者，其郵件改投或改寄之申請，郵局得拒絕之：\n一、性質複雜者。\n二、僅限於即將寄到之郵件者。\n三、有收件人地址之郵件，改交同地郵局存局候領者。"},{"l":2,"y":112,"a":"A","c":0.52,"s":"依郵務營業規章規定，郵票或各類出售品，一經售出，除當場聲明有瑕疵者外，不得請求退還。但因現場交寄 郵件需要，得向郵局請求換取，則下列敘述何者錯誤？","o":{"A":"得以所購之便利箱向郵局換取不同面額之等值郵票","B":"得以所購之郵政明信片向郵局換取不同面額之等值郵票","C":"得以所購之郵票向郵局換取不同面額之等值郵票","D":"得以所購之特製郵簡向郵局換取不同面額之等值郵票"},"k":"升等","p":0,"d":"(一)購買郵票或各類出售品，而要求發給購票證明者，\n應當場申請，事後不予補證\n。\n (二)前項郵票或各類出售品，一經售出，除當場聲明有瑕疵者外，不得請求退還。\n但因現場交寄郵件需要，得以所購之郵票、郵政明信片、特製郵簡、特製信封向郵局換取不同面額之等值郵票、郵政明信片、特製郵簡、特製信封或便利箱袋使用。"},{"l":2,"y":112,"a":"C","c":0.51,"s":"依郵務營業規章規定，寄件人申請撤回國內快捷郵件時，如郵件尚在原寄局，相關撤回費及已付之資費如何處 理？","o":{"A":"應付撤回費，其已付之資費全數退還","B":"應付撤回費，其已付之資費扣除國內包裹資費百分之五十後退還餘額","C":"免付撤回費，其已付之資費全數退還","D":"免付撤回費，其已付之資費扣除國內包裹資費百分之五十後退還餘額"},"k":"升等","p":0,"d":"第七十二條之一\n寄件人申請撤回國內快捷郵件時，相關撤回費及已付之 資費，依下列規定辦理：\n一、郵件尚在\n原寄局者\n，其已付之資費全數退還，並 免付撤回費\n。\n 二、郵件已離開原寄局，\n尚未到達\n投遞局者，扣除國 內包裹往返資費後退還餘額，並免付撤回費。 但 原付資費不足扣抵者，\n免予\n補收包裹資費\n。"},{"l":2,"y":112,"a":"D","c":0.67,"s":"依郵務營業規章規定，有關代收貨款郵件，下列敘述何者錯誤？","o":{"A":"代收貨款金額經塗改者，不予收寄","B":"代收貨款郵件免收轉帳匯費","C":"代收貨款郵件所書金額與郵局服務人員登載金額不一致者，以郵件所書金額為代收金額","D":"代收貨款郵件所書之文字與數字金額不一致者，以當事人真意為代收金額"},"k":"升等","p":0,"d":"郵務營業規章   第一百零一條\n寄件人交寄代收貨款郵件，應填明代收貨款金額，其填寫詳情單者，並應於封面顯明地位黏貼郵局供用之「代收貨款」紅色簽條。 \n代收貨款金額經塗改者，不予收寄。 \n代收貨款郵件所書金額與郵局服務人員登載金額不一致者，以郵件所書金額為代收金額。 \n代收貨款郵件所書之文字與數字金額不一致者，以\n文字金額\n為代收金額。"},{"l":2,"y":112,"a":"D","c":0.75,"s":"依郵務營業規章規定，與郵局簽訂特約記帳戶之寄件人於下列何種情形，得經郵局同意免交預存郵資？","o":{"A":"寄件人與郵局有業務往來者","B":"寄件人在郵局有辦理存款及保險者","C":"寄件人信用良好者","D":"寄件人申請許可登記時，聲明交寄時當場交付郵資者"},"k":"升等","p":0,"d":"郵務營業規章\n第四節 郵資已付戳記\n第一百五十六條\n與郵局簽訂特約記帳戶之寄件人，應以相當於一個月交寄郵件所需郵資之金額預存於郵局，逐月結算郵資並於次月二十日以前付清。但於申請許可登記時聲明交寄時當場交付郵資者，或快捷郵件及包裹之訂約戶取具保證者，得經郵局同意免交預存郵資。\n前項預存金數額，依郵資之增減隨時調整，於註銷登記郵資付清時退還之。"},{"l":2,"y":112,"a":"A","c":0.53,"s":"依郵務營業規章規定，有關郵件存局候領期間，下列敘述何者正確？","o":{"A":"國內郵件存局候領期間，以候領之次日起算十五日為限，但收件人得以書面申請延長至一個月","B":"國內快捷郵件存局候領期間，自候領之次日起算，以十五日為限，但收件人得以書面申請延長至一個月","C":"國際郵件存局候領期間，以候領之次日起算十五日為限，但收件人得以書面申請延長至一個月","D":"國際郵件存局候領期間，以候領之次日起算十五日為限，但收件人得以書面申請延長至二個月"},"k":"升等","p":0,"d":"郵務營業規章\n第七條\n郵件查詢及補償\n第一百八十八條\n國內郵件存局候領期間，以候領之次日起算十五日為限，但收件人得以書面申請延長至一個月。逾期未領者，依無法投遞郵件之規定處理。\n寄件人於前項期限內申請提前退回或於封面上註明留存幾日無人領取即退回字樣者，郵局應依其申請或註記辦理。\n存局候領之國內快捷郵件，自候領之次日起算，以五日為限，逾期未領者依第一項後段之規定辦理。但收件人得以書面申請延長至一個月。\n前三項情形之郵件，依規定應補收逾期保管費、退回費者，於退回時向寄件人補收之。\n第一百八十八條之一\n存局候領之國際郵件，自候領之次日起算十五日內，免付保管費。逾期者，除函件免付費外，其他郵件比照第五十六條第三項規定，按逾期日數交付逾期保管費。\n國際郵件存局候領期間，以候領之次日起算二個月為限。逾期未領者，依無法投遞郵件之規定處理。"},{"l":2,"y":112,"a":"C","c":0.5,"s":"某甲交寄限時掛號附回執小包 1 件，其資費共 102 元（即小包資費60 元、掛號資費20 元、限時資費 7 元、普通回執費 15 元），因郵局投遞人員未依中華郵政公司公告之處理規定遞送，其可向郵局請求補償之金額為新臺幣多少元？","o":{"A":"575 元","B":"102 元","C":"87 元","D":"80 元"},"k":"升等","p":0,"d":"某甲交寄限時掛號附回執小包 1 件，其資費共 102 元（即小包\n資費\n60 元、掛號\n資費\n20 元、限時\n資費\n 7 元、普通\n回執費 \n15 元），因郵局投遞人員\n未依中華郵政公司公告之處理規定遞送\n，其可向郵局請求補償之金額為新臺幣多少元？\n(A) 575 元\n(B) 102 元\n(C) 87 元\n(D) 80 元\n答案：60+20+7\n第 64 條\n包裹郵件、快捷郵件、報值郵件、保價郵件以外之其他各類掛號函件全部遺失或被竊之補償金額，依下列規定：\n一、國內掛號函件，每件為新臺幣五百七十五元。\n二、國際掛號函件，每件依國際貨幣基金特別提款權三十計算單
