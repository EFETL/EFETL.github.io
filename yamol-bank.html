機關得視情節之輕重，停止其 一定期間經營全部或一部外匯之業務？","o":{"A":"交通部","B":"金融監督管理委員會","C":"中央銀行","D":"經濟部"},"k":"內勤","p":1,"d":"郵政儲金匯兌法\n第12條 第二款\n中華郵政公司辦理外匯業務違反外匯法令之規定者，\n中央銀行\n得視情節之輕重，停止其一定期間經營全部或一部外匯之業務，並通知交通部。"},{"l":3,"y":114,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定，關於存簿儲金，下列敘述何者錯誤？","o":{"A":"每一人或每一團體僅得為一戶","B":"利息應免一切稅捐","C":"本國自然人之儲戶，超過計息最高存款限額之數，不給利息","D":"政府機關之儲戶，超過計息最高存款限額之數，不給利息"},"k":"內勤","p":1,"d":"郵政儲金匯兌法第19條\n1.存簿儲金，每一人或每一團體僅得為一戶。\n2.存簿儲金，儲戶計息之最高存款限額，由中華郵政公司擬訂，報由交通部會同中央銀行及金融監督管理委員會定之；超過限額之數，不給利息。\n3.\n前項限制，於政府機關、自治團體或公益法人，不適用之。"},{"l":3,"y":114,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，關於郵政匯兌，下列敘述何者錯誤？","o":{"A":"含國內匯兌及國際匯兌","B":"分為信匯及電匯","C":"除電匯外，應以郵政匯票或郵政禮券為憑","D":"郵政禮券應記載事項，由中華郵政公司擬訂，報交通部核定"},"k":"內勤","p":1,"d":"郵政儲金匯兌法\n第 21 條\n1  \n國內匯兌及國際匯兌\n，分為\n票匯及電匯\n二種。\n2  \n郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑。\n3  \n郵政匯票及郵政禮券應記載事項，由中華郵政公司擬訂，報交通部核定。\nㅤㅤ\n沒有信匯，故答案為B"},{"l":3,"y":114,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理劃撥儲金之劃撥支票業務，準用下列何者規定？","o":{"A":"金融消費者保護法之規定","B":"票據法有關支票之規定","C":"銀行法之規定","D":"商業登記法之規定"},"k":"內勤","p":1,"d":""},{"l":3,"y":114,"a":"C","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司有下列何種情事，將被處新臺幣三十萬元以上一百五十萬元以下罰鍰？ A. 未依規定建立內部控制及稽核制度 B.洩漏顧客郵政儲金或匯款資料 C.規避、妨礙或拒絕檢查","o":{"A":"僅 AC","B":"僅 BC","C":"僅 AB","D":"ABC"},"k":"內勤","p":1,"d":"俊杰，你答對了 ✅，第 45 題正確答案是 \n(C) 僅 AB\n。\nㅤㅤ\n? 條文重點（依《郵政儲金匯兌法》）\n中華郵政公司若有下列情事，會被處 \n新臺幣三十萬元以上、一百五十萬元以下罰鍰\n：\n未依規定建立內部控制及稽核制度\n → 屬於重大管理疏失，會被處罰。\n洩漏顧客郵政儲金或匯款資料\n → 涉及顧客隱私與金融安全，會被處罰。\n規避、妨礙或拒絕檢查\n → 這一項的處罰規定不同，通常是更高層級的行政處分或其他法律責任，不在「三十萬至一百五十萬罰鍰」的範圍內。\nㅤㅤ\n? 選項解析\n(A) 僅 AC → ❌ 錯誤，C 不在該罰鍰範圍。\n(B) 僅 BC → ❌ 錯誤，C 不在該罰鍰範圍。\n(C) \n僅 AB → 正確\n，因為 A 與 B 都屬於該罰鍰規範。\n(D) ABC → ❌ 錯誤，包含了不適用的 C。"},{"l":3,"y":114,"a":"B","c":1.0,"s":"依郵政儲金匯兌法規定，儲戶於 5 月 5 日因郵政存簿儲金簿遺失，向中華郵政公司辦理掛失止付，發現5 月 2 日遭 人盜領 5 萬元存款，而中華郵政公司已依規定程序並已盡善良管理人注意義務為之給付，中華郵政公司責任為何？","o":{"A":"中華郵政公司應負全部責任","B":"中華郵政公司免負責任","C":"中華郵政公司負一半責任","D":"中華郵政公司應與儲戶協商責任歸屬"},"k":"內勤","p":1,"d":""},{"l":3,"y":114,"a":"D","c":1.0,"s":"依郵政儲金匯兌法規定 ， 金融監督管理委員會得隨時派員檢查或令中華郵政公司於限期內據實提報之事項為何？ A. 檢查郵政儲金匯兌業務 B.檢查財務 C.提報財務報告 D.提報財產目錄","o":{"A":"僅 ABC","B":"僅 BCD","C":"僅 ACD","D":"ABCD"},"k":"內勤","p":1,"d":"金融監督管理委員會得隨時派員或委託適當機構，攜帶證明文件，檢查中華郵政公司之郵政儲金匯兌業務、財務及其他有關事項，或令中華郵政公司於限期內據實提報\n財務報告、財產目錄或其他有關資料及報告\n。"},{"l":3,"y":114,"a":"A","c":1.0,"s":"依郵政儲金匯兌法規定，中華郵政公司不得接受第三人有關停止帳戶交易活動或給付匯款之請求，下列何者除外？","o":{"A":"法院之裁判或檢察機關之書面通知","B":"法律事務所書函","C":"債權人存證信函","D":"立法院民意陳情函"},"k":"內勤","p":1,"d":"第 48 題考的是 \n郵政儲金匯兌法中關於第三人請求停止帳戶交易或匯款的例外情形\n。\nㅤㅤ\n? 條文重點\n依《郵政儲金匯兌法》規定：\n原則上，中華郵政公司 \n不得接受第三人\n 有關停止帳戶交易或給付匯款的請求。\n但有一個 \n例外\n：若是 \n法院的裁判\n 或 \n檢察機關的書面通知\n，郵政公司必須依法配合。\n其他如法律事務所書函、債權人存證信函、立法院民意陳情函，都不具法律效力，郵政公司不得接受。\nㅤㅤ\n? 選項解析\n(A) 法院之裁判或檢察機關之書面通知 → ✅ 正確，屬於例外情形。\n(B) 法律事務所書函 → ❌ 不具法律效力。\n(C) 債權人存證信函 → ❌ 不具法律效力。\n(D) 立法院民意陳情函 → ❌ 不具法律效力。\nㅤㅤ\n? 結論\n正確答案是 \n(A) 法院之裁判或檢察機關之書面通知\n。"},{"l":3,"y":115,"a":"C","c":0.94,"s":"甲今年 14 歲帶著 6 歲的弟弟乙，攜帶郵政儲金簿到郵局把壓歲錢存到帳戶，依郵政儲金匯兌法規定，甲乙兩者對中華郵政公司所為之行為，其法律效力如何？","o":{"A":"經父母同意始生效力","B":"甲乙兩者均無效","C":"甲乙兩者皆有效","D":"甲無效、乙有效"},"k":"內勤","p":0,"d":"第 5 條\n無行為能力人或限制行為能力人，關於郵政儲金及匯兌事務，對中華郵政公司所為之行為，視為有行為能力人之行為。 \n3\n1"},{"l":3,"y":115,"a":"B","c":0.86,"s":"依郵政儲金匯兌法規定，中華郵政公司辦理下列何者業務，準用票據法有關支票之規定？","o":{"A":"美金旅行支票","B":"劃撥儲金之劃撥支票業務","C":"劃撥儲金之活期支票業務","D":"存簿儲金之活期支票業務"},"k":"內勤","p":0,"d":"第 16 條\n中華郵政公司辦理\n劃撥儲金之劃撥支票業務\n，\n準用票據法\n有關支票之規定。\nㅤㅤ\nㅤㅤ"},{"l":3,"y":115,"a":"C","c":0.98,"s":"依郵政儲金匯兌法規定，儲戶提取存款之印鑑遺失，未辦理掛失止付，帳戶存款遭冒領，中華郵政公司應負責任為何？","o":{"A":"如確實遭冒領，中華郵政公司應負賠償責任","B":"不論是否冒領，中華郵政公司應負一切責任","C":"中華郵政公司依規定程序並已盡善良管理人注意義務所為之給付，縱係冒領，亦不負責任","D":"依法院裁判"},"k":"內勤","p":0,"d":""},{"l":3,"y":115,"a":"D","c":0.93,"s":"依郵政儲金匯兌法規定，中華郵政公司經營之郵政儲金匯兌業務，下列何者應獨立處理之？","o":{"A":"法令遵循","B":"人事管理","C":"防制洗錢","D":"會計帳務"},"k":"內勤","p":0,"d":""},{"l":3,"y":115,"a":"C","c":0.93,"s":"依郵政儲金匯兌法規定，下列敘述何者錯誤？","o":{"A":"存簿儲金指存款人憑郵政儲金簿或依約定方式，隨時存入或提取之儲金","B":"存簿儲金，每一人僅得為一戶","C":"存簿儲金，自然人儲戶不論存款多寡，皆給利息","D":"存簿儲金之利息，應免一切稅捐"},"k":"內勤","p":0,"d":""},{"l":3,"y":115,"a":"A","c":0.81,"s":"依郵政儲金匯兌法規定，下列何者為郵政儲金運用範圍？ A.轉存中央銀行 B.投資金融債券 C.投資上櫃股票 D.個人房屋貸款 E.參與金融同業拆款市場","o":{"A":"僅 ABCE","B":"僅 ABE","C":"僅 ABD","D":"僅 ACD"},"k":"內勤","p":0,"d":"第 18 條\n郵政儲金之運用範圍如下：\n一、轉存中央銀行（A）\n。\n二、轉存中央銀行以外之其他金融機構。\n三、投資公債、公司債、\n金融債券（B）\n及短期票券。\n四、\n投資受益憑證及上市（櫃）股票。（C）\n五、\n參與金融同業拆款市場（E）\n。\n六、提供（中長期）資金轉存金融機構辦理政府核准之重大建設及民間投資計畫。\n七、其他經交通部、金融監督管理委員會及中央銀行核准者。\n前項第三款之投資限額、對象及其他交易之限制及運用管理辦法，由交通部會同金融監督管理委員會及中央銀行定之。\n第一項第四款之限制及運用管理辦法，由交通部會同金融監督管理委員會定之。"},{"l":3,"y":115,"a":"A","c":0.85,"s":"依郵政儲金匯兌法規定，中華郵政公司有下列何者情事，處新臺幣 50 萬元以上 250 萬元以下罰鍰？","o":{"A":"規避、妨礙或拒絕檢查","B":"未依規定建立內部控制及稽核制度","C":"未經中央銀行許可而辦理外匯業務","D":"任意洩露顧客匯款資料"},"k":"內勤","p":0,"d":""},{"l":3,"y":115,"a":"D","c":0.84,"s":"依郵政儲金匯兌法規定，國際匯兌之處理依據，包含下列何者？ A.郵政儲金匯兌法 B.國際商法 C.萬國郵政聯盟所定郵政匯兌協定 D.我國與國外雙邊郵政匯兌協定","o":{"A":"僅 ABC","B":"僅 BCD","C":"僅 ABD","D":"僅 ACD"},"k":"內勤","p":0,"d":""},{"l":3,"y":115,"a":"C","c":0.62,"s":"依郵政儲金匯兌法規定，下列敘述何者正確？","o":{"A":"郵政匯票受款人之兌領請求權，自發票日起算，五年間不行使，因時效而消滅","B":"郵政匯票逾兌領時效者，中華郵政公司應通知受款人領回，受款人不得要求退還匯費","C":"郵政匯票業經兌領或領回匯款時，中華郵政公司應拒絕受理申請掛失或繳回毀損匯票","D":"郵政匯票毀損，應由匯款人申請繳回，受款人不得申請"},"k":"內勤","p":0,"d":"(A)\n第 22 條\n郵政匯票受款人之兌領請求權，自發票日起算，\n三年間不\n行使，因時效而消滅\n（B）\n第 23 條\n郵政匯票逾前條期間未經兌款者，中華郵政公司應通知\n匯\n款人\n領回，\n匯\n款人\n不得要求退還匯費。\n(C) (D)\n第 24 條\n郵政匯票遺失或毀損，\n匯款人或受款人(D)\n得申請掛失或繳回，並領回匯款，原匯票即予作廢。\n郵政匯票業經兌領或已依前項領回匯款時，中華郵政公司應拒絕受理前項申請。"},{"l":4,"y":110,"a":"B","c":0.88,"s":"簡易人壽保險法所定之行政處罰，應如何辦理？","o":{"A":"由交通部為之，並應通知金融監督管理委員會","B":"由金融監督管理委員會為之，並應通知交通部","C":"由行政院為之，並應通知交通部","D":"由交通部自行決定"},"k":"內勤","p":0,"d":""},{"l":4,"y":110,"a":"C","c":0.78,"s":"依簡易人壽保險法規定，下列何者不是簡易人壽保險法的立法意旨？","o":{"A":"提供國民基本經濟保障","B":"健全簡易人壽保險制度","C":"符合顧客投保需求","D":"增進社會福祉"},"k":"內勤","p":0,"d":"文字遊戲，c錯在不是符合顧客投保需求，而是便利全民投保"},{"l":4,"y":110,"a":"C","c":0.9,"s":"依簡易人壽保險法規定，有關契約之效力，下列敘述何者錯誤？","o":{"A":"保險契約得由本人或第三人訂立之","B":"由第三人訂立之保險契約，未經被保險人書面同意，並約定保險金額者，其契約無效","C":"被保險人依B所為之同意，得隨時以電話通知保險人及要保人撤銷之","D":"被保險人依規定行使其撤銷權者，視為要保人終止保險契約"},"k":"內勤","p":0,"d":"電話\n➡️書面"},{"l":4,"y":110,"a":"A","c":0.9,"s":"依簡易人壽保險法規定，有關續期保險費之繳付，下列敘述何者錯誤？","o":{"A":"續期保險費自繳費日起一個月未交付者，保險人應於五日內催告","B":"自當期繳費日起算三個月為寬限期間","C":"寬限期間屆滿仍未交付保險費時，其保險契約效力停止","D":"保險契約停止效力後，被保險人發生之保險事故，保險人不負保險責任"},"k":"內勤","p":0,"d":"續期保險費自繳費日起一個月未交付者，保險人應於10日內催告"},{"l":4,"y":110,"a":"C","c":0.77,"s":"依簡易人壽保險法規定，有關受益人故意致被保險人於死或雖未致死者，或故意傷害被保險人者，下列敘述何 者錯誤？","o":{"A":"無請求死亡人壽保險金額之權","B":"無請求傷害保險金額之權","C":"有其他受益人，由其他受益人按比例領受全部保險金額","D":"無其他受益人時，其保險金額作為被保險人遺產"},"k":"內勤","p":0,"d":"有其他受益人，由其他受益人平均領受全部保險金額"},{"l":4,"y":110,"a":"C","c":0.94,"s":"依簡易人壽保險法規定，下列何者不是郵政簡易人壽保險得經營之險種？","o":{"A":"保險期間十年之死亡保險","B":"保險期間二十年之生死合險","C":"專設帳簿之投資型保險","D":"以附約方式經營之健康保險"},"k":"內勤","p":0,"d":"簡易人壽保險之類型\n以\n主約\n方式包括：\n生存保險\n、\n死亡保險\n、\n生死合險\n得以\n附約\n方式經營者：\n健康保險\n、\n傷害保險"},{"l":4,"y":110,"a":"B","c":0.87,"s":"依簡易人壽保險法規定，有關終止保險契約之權利及代位行使因保險事故所生對於第三人之請求權，下列敘述 何者錯誤？","o":{"A":"要保人得隨時向保險人聲明終止保險契約","B":"受益人得隨時向保險人聲明終止保險契約","C":"保險人不得代位行使要保人因保險事故所生對於第三人之請求權","D":"保險人不得代位行使受益人因保險事故所生對於第三人之請求權"},"k":"內勤","p":0,"d":"37\n1"},{"l":4,"y":110,"a":"C","c":0.7,"s":"依簡易人壽保險法規定，下列何者不是郵政簡易人壽保險之資金運用項目？","o":{"A":"不動產、放款","B":"有價證券、國外投資","C":"投資保險相關事業","D":"從事衍生性商品交易"},"k":"內勤","p":0,"d":"第 27 條\n郵政簡易人壽保險資金之運用，除存款外，依保險法第一百四十六條\n第一項第一款至第三款\n、\n第五款\n、\n第七款\n、\n第八款\n、第一百四十六條第三項、第一百四十六條之一至第一百四十六條之四、第一百四十六條之七及第一百四十六條之八之規定辦理。\n保險法146條第一款\n保險業資金之運用，除存款外，以下列各款為限：\n一\n、有價證券。\n(B)\n二\n、不動產。\n(A)\n三\n、放款。\n(A)\n四、辦理經主管機關核准之專案運用、公共及社會福利事業投資。\n(郵政簡易人壽不適用)\n五\n、國外投資。\n(B)\n六、投資保險相關事業。\n(C)(郵政簡易人壽不適用)\n七\n、從事衍生性商品交易。\n(D)\n八\n、其他經主管機關核准之資金運用。\n來源：全國法規資料庫\n163\n1"},{"l":4,"y":110,"a":"B","c":0.42,"s":"依簡易人壽保險法規定，有關郵政簡易人壽保險之資本額及資金之融資，下列敘述何者錯誤？","o":{"A":"郵政簡易人壽保險之資本，由交通部報請行政院核定","B":"應按資本總額百分之二十五繳存保證金於國庫","C":"提供重大公共建設計畫之融資總額，不得超過資金總額百分之三十","D":"所稱資金，包括業主權益及各種責任準備金"},"k":"內勤","p":0,"d":"！注意（A)(D)已修法！\n（A)《簡易人壽保險法 第29條》\n郵政簡易人壽保險之資本，由\n交通部會商金融監督管理委員會後核定\n，\n並按\n實收\n資本總額百分之十五繳存保證金於國庫\n(D) 所稱資金，包括業主權益及各種\n責任\n準備金\n因此此題（A)(B)(D)皆錯\n223\n2"},{"l":4,"y":110,"a":"A","c":0.24,"s":"依簡易人壽保險法規定，下列何者是由交通部會同金融監督管理委員會定之？","o":{"A":"投保規則","B":"銷售前採行之程序","C":"業務員之管理","D":"精算人員之資格、聘用與簽證 (E)以上皆是"},"k":"內勤","p":0,"d":"第\n 31 \n條\n郵政簡易人壽保險有關之各種保險單條款、保險費與其他相關資料、\n銷售前採行之程序\n、負責人資格、\n精算人員資格\n、\n聘用與簽證\n、核保理賠人員資格、\n業務員管理\n及其他相關事項之辦法，由交通部會同金融監督管理委員會定之。\n184\n3"},{"l":4,"y":110,"a":"D","c":0.79,"s":"要保人或被保險人故意隱匿，或因過失遺漏，或為不實之說明，足以變更或減少保險人對於危險之估計者，保險人得 解除保險契約；保險契約經保險人解除時，要保人得申請下列何種給付？","o":{"A":"責任準備金","B":"應得之責任準備金","C":"保單價值準備金","D":"應得之保單價值準備金"},"k":"模擬","p":0,"d":"第 十五 條\n訂立保險契約\n或\n依前條規定申請恢復保險契約效力\n時，\n要保人及被保險人\n對於保險人之書面詢問，應據實說明。\n要保人或被保險人故意隱匿，或因過失遺漏，或為不實之說明，足以變更或減少保險人對於危險之估計者，保險人得解除保險契約；其危險發生後，亦同。但要保人或被保險人證明危險之發生與其隱匿、遺漏或為不實之說明無關者，不在此限。\n第 十六 條\n前條\n解除權之行使\n，\n自保險人\n知\n有解除之原因\n後，經過\n一個月\n不行使而消滅\n；或\n自保險契約訂立或恢復保險契約效力至保險事故\n發生\n日\n滿二年\n，即有可以解除之原因，亦不得解除保險契約\n。\n依前項規定解除保險契約時，要保人除得依第二十一條規定\n(\n保險費已付足一年以上者，要保人得依規定，申請返還其\n應得\n之保單價值準備金\n)\n，申請\n應得之保單價值準備金\n外，不得為其他請求。\n知:+1月\n發生:+2年"},{"l":4,"y":110,"a":"D","c":0.95,"s":"要保人可指定或變更受益人的時機，並不包括下列何者？","o":{"A":"訂立保險契約時","B":"保險契約滿期前","C":"保險事故發生前","D":"保險事故發生，申請理賠時"},"k":"模擬","p":0,"d":"第 17 條\n要保人在訂立保險契約時、保險契約滿期前或保險事故發生前\n，除保險契約另有約定外，得指定或變更受益人。但被保險人為第三人時，應先得其書面同意。\n未指定受益人時，以被保險人死亡為保險給付事由者，其保險金額作為被保險人之遺產；非以被保險人死亡為保險給付事由者，以被保險人為受益人。但保險金給付前被保險人死亡時，其保險金額或保單價值準備金作為被保險人之遺產。"},{"l":4,"y":110,"a":"C","c":0.8,"s":"中華郵政公司辦理郵政簡易人壽保險業務，應提撥安定基金，如未依限繳付者，將遭處新臺幣多少 的罰鍰？","o":{"A":"20 萬元以上 100 萬元以下","B":"30 萬元以上 150 萬元以下","C":"24 萬元以上 120 萬元以下","D":"50 萬元以上 250 萬元以下"},"k":"模擬","p":0,"d":"簡易人壽保險法 第 36 條\n中華郵政公司對於\n安定基金\n之提撥，如未依限或拒絕繳付者，金融監督管理委員會得視情節之輕重，\n處新臺幣\n二十四萬元以上一百二十萬元以下\n罰鍰。"},{"l":4,"y":110,"a":"B","c":0.9,"s":"依簡易人壽保險法規定，下列敘述何者錯誤？","o":{"A":"以他人為被保險人時，須要保人與被保險人有保險利益","B":"簡易人壽保險之保險人，對於保險費，得以訴訟請求交付","C":"簡易人壽保險之保險人，不得代位行使要保人或受益人因保險事故所生對於第三人之請求權","D":"郵政簡易人壽保險之會計帳務，應獨立處理"},"k":"模擬","p":0,"d":"(A)\n第　九　條\n以他人為被保險人時，須要保人與被保險人有保險利益\n。\n(#37-\n違反\nà\n處新臺幣三十萬元以上一百五十萬元以下罰鍰，並得撤換其核保或精算人員\n)\n(B)\n第 十二 條\n簡易人壽保險之保險人，對於保險費，不得以訴訟請求交付\n。\n(C)\n第二十四條\n　　簡易人壽保險之保險人，\n不得代位行使\n要保人或受益人因保險事故所生對於第三人之請求權。\n(D)\n第二十八條\n　　郵政簡易人壽保險之會計帳務，應獨立處理之。\n(#37-\n違反\nà\n處新臺幣三十萬元以上一百五十萬元以下罰鍰\n，並得撤換其核保或精算人員\n)"},{"l":4,"y":110,"a":"D","c":0.95,"s":"依簡易人壽保險法規定，要保人於保險契約未指定受益人時，以被保險人死亡為保險給付事由者，其保險金額應如何 處理？","o":{"A":"由要保人領取","B":"保險人無須給付","C":"繳交國庫","D":"作為被保險人之遺產"},"k":"模擬","p":0,"d":""},{"l":4,"y":110,"a":"C","c":0.79,"s":"有關簡易人壽保險對於要保人之規定，下列何者正確？","o":{"A":"訂立保險契約時，要保人對於保險人之書面詢問，可不據實說明","B":"要保人在訂立保險契約時、保險契約滿期後或保險事故發生前，除保險契約另有約定外，得指定或變更受益人","C":"要保人得隨時向保險人聲明終止保險契約","D":"簡易人壽保險之保險費付足一年以上者，要保人得以保險單為質，向保險人申請借款，但以其累計所繳保險費金額為限"},"k":"模擬","p":0,"d":"A 第 15 條\n訂立保險契約或依前條規定申請恢復保險契約效力時，\n要保人及被保險人\n對於保險人之書面詢問，應據實說明。\n要保人或被保險人故意隱匿，或因過失遺漏，或為不實之說明，足以變更或減少保險人對於危險之估計者，保險人得解除保險契約；其危險發生後，亦同。但要保人或被保險人證明危險之發生與其隱匿、遺漏或為不實之說明無關者，不在此限。\nB 第 17 條\n要保人在訂立\n保險契約\n時\n、保險契約滿期\n前\n或保險事故發生\n前\n，除保險契約另有約定外，得指定或變更受益人。但被保險人為第三人時，應先得其書面同意。\n未指定受益人時，以被保險人死亡為保險給付事由者，其保險金額作為被保險人之遺產；非以被保險人死亡為保險給付事由者，以被保險人為受益人。但保險金給付前被保險人死亡時，其保險金額或保單價值準備金作為被保險人之遺產。\nC 第 18 條\n要保人得隨時向保險人聲明終止保險契約；其終止效力，不溯及既往。"},{"l":4,"y":110,"a":"C","c":0.91,"s":"依簡易人壽保險法規定，由第三人訂立之保險契約，其權利之移轉或出質，未經何人以書面承認， 不生效力？","o":{"A":"要保人","B":"保險人","C":"被保險人","D":"受益人"},"k":"模擬","p":0,"d":"第二十六條\n　　由第三人訂立之保險契約，其權利之移轉或出質，非\n經被保險人以書面承認\n，不生效力。\n(#37-\n違反\nà\n處新臺幣三十萬元以上一百五十萬元以下罰鍰，並得撤換其核保或精算人員\n)\n12\n1"},{"l":4,"y":110,"a":"B","c":0.74,"s":"要保人某甲向中華郵政公司購買郵政簡易人壽保險的生死合險，並以某乙為被保險人，於某乙發生完全失能狀態時， 則「完全失能保險金」應以何人為受益人？","o":{"A":"某甲","B":"某乙","C":"某乙的法定繼承人","D":"某甲的法定繼承人"},"k":"模擬","p":0,"d":"簡易人壽保險-第 17 條\n要保人在訂立保險契約時、保險契約滿期前或保險事故發生前，除保險契\n約另有約定外，得指定或變更受益人。但被保險人為第三人時，應先得其\n書面同意。\n未指定受益人時\n，以被保險人死亡為保險給付事由者，其保險金額作為被\n保險人之遺產；\n非以被保險人死亡為保險給付事由者，以被保險人為受益\n人。\n但保險金給付前被保險人死亡時，其保險金額或保單價值準備金作為\n被保險人之遺產。"},{"l":4,"y":110,"a":"C","c":0.69,"s":"依簡易人壽保險法規定，有關郵政簡易人壽保險資金之運用，下列何者非其資金運用之範圍？","o":{"A":"放款","B":"國外投資","C":"投資保險相關事業","D":"經主管機關核准從事衍生性商品交易"},"k":"模擬","p":0,"d":"簡易人壽保險法  第 27 條\n郵政簡易人壽保險資金之運用，除存款外，\n依保險法第一百四十六條第一\n項第一款至第三款、第五款、第七款、第八款、第一百四十六條第三項、\n第一百四十六條之一至第一百四十六條之四、第一百四十六條之七及第一\n百四十六條之八之規定辦理。\n保險法  第 146 條\n保險業資金之運用，除存款外，以下列各款為限：\n一、有價證券。\n二、不動產。\n三、放款。\n四、辦理經主管機關核准之專案運用、公共及社會福利事業投資。\n五、國外投資。\n六、投資保險相關事業。\n七、從事衍生性商品交易。\n八、其他經主管機關核准之資金運用。\n前項所定資金，包括業主權益及各種準備金。\n150\n2"},{"l":4,"y":110,"a":"C","c":0.92,"s":"下列何者不屬於郵政法第 5 條第 1 至 6 款所規定，中華郵政公司得經營之業務？","o":{"A":"出租郵局外牆張貼房地產廣告","B":"與集郵有關之商品","C":"長期照護療養","D":"簡易人壽保險"},"k":"模擬","p":0,"d":"第 五 條 中華郵政公司，得經營下列業務：\n一、遞送郵件。\n二、儲金。\n三、匯兌。\n四、\n簡易人壽保險\n。\n五、\n集郵及其相關商品\n。\n六、\n郵政資產之營運\n。\n七、經交通部核定，得接受委託辦理其他業務及投資或經營第一款至第六款相關業\n務。\n而沒有在以上的就是（c）"},{"l":4,"y":111,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，簡易人壽保險之保險費付足一年以上者，要保人得以保險單為質，在什麼範 圍內，向保險人申請借款？","o":{"A":"在其責任準備金額內","B":"在其保單價值準備金額內","C":"在其所繳保費金額內","D":"在其保險金額內"},"k":"營運職","p":1,"d":""},{"l":4,"y":111,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，除保險契約另有約定外，要保人得在何時指定或變更受益人？ A.訂立保 險契約時 B.保險契約滿期前 C.恢復契約效力前 D.保險事故發生前","o":{"A":"僅 ABC","B":"僅 ABD","C":"僅 BCD","D":"ABCD"},"k":"營運職","p":1,"d":""},{"l":4,"y":111,"a":"A","c":1.0,"s":"機器人理財公司常「透過演算法偵測，將虧損部位先行認列虧損，降低資本利得；再同時買進相關性 高的資產」的服務，請問屬於下列何種事實？","o":{"A":"稅務虧賣(Tax Loss Harvesting)","B":"直接指數化(Direct Indexing)投資下的盈虧自負","C":"廣義自迴歸條件異方差(General Autoregressive Conditional Heteroskedasticity, GARCH)策略下的誤差相抵","D":"指數加權移動平均(Exponentially Weighted Moving Average, EWMA)方法下的偏誤修正 貳、非選擇題三大題（每題 10 分） 第一題： 依郵政法規定，請回答下列問題： （一）中華郵政公司或其服務人員，原則上不得開拆他人之郵件，但在哪些情形下，經寄件人或 收件 人同意開拆者，不在此限？請說明之。【8 分】 （二）承第（一）小題，如寄件人或收件人不同意開拆時，中華郵政公司得作何處理？【2 分】 第二題： 中華郵政公司違反下列規定時，處分機關為何？如何處分？ （一）未經中央銀行之許可而辦理外匯業務。【5 分】 （二）辦理外匯業務違反外匯法令。【5 分】 第三題： 依簡易人壽保險法規定，請說明要保人或被保險人有哪些情事時，保險人得解除保險契約？另請 說明保險人行使解除權的期限以及保險人依規定解除保險契約時，要保人得行使之請求權。 【10 分】"},"k":"營運職","p":1,"d":""},{"l":4,"y":111,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，簡易人壽保險法之立法意旨，下列敘述何者錯誤？","o":{"A":"增進社會福祉","B":"促進保險科技化","C":"提供國民基本經濟保障","D":"健全簡易人壽保險制度"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，受益人故意致被保險人於死，如無其他受益人時，其保險金額之給付，下列敘述 何者正確？","o":{"A":"給付保險人","B":"給付受益人","C":"作為被保險人遺產","D":"作為要保人之遺產"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，下列何者為簡易人壽保險得經營之險種？","o":{"A":"年金保險","B":"生存保險","C":"以主約方式經營之傷害保險","D":"專設帳簿之投資型保險"},"k":"專一","p":1,"d":"簡易人壽保險法第四條\n簡易人壽保險包括生存保險、死亡保險及生死合險，並得以附約方式經營健康保險及傷害保險。\n沒有年金\n健康與傷害險不是主約"},{"l":4,"y":111,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，中華郵政公司得經主管機關核可，提供重大公共建設計畫之融資所需款項，其提 供總額不得超過資金總額之多少比例？","o":{"A":"百分之十","B":"百分之二十","C":"百分之三十","D":"百分之四十"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"B","c":1.0,"s":"郵政簡易人壽保險之資本，應按資本總額之多少比例繳存保證金於國庫？","o":{"A":"百分之十","B":"百分之十五","C":"百分之二十","D":"百分之二十五"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"D","c":1.0,"s":"依簡易人壽保險法規定 ， 郵政簡易人壽保險有關各種保險單條款 、 核保理賠人員資格之辦法 ， 由下列何者定之？","o":{"A":"行政院會同立法院","B":"行政院會同金融監督管理委員會","C":"財政部會同金融監督管理委員會","D":"交通部會同金融監督管理委員會"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，有關郵政簡易人壽保險契約之效力，下列敘述何者錯誤？","o":{"A":"保險金額超過規定限額時，其超過部分之契約無效，超過部分所繳之保險費，應予無息退還","B":"續期保險費自當期繳費日起算一個月為寬限期間，寬限期間屆滿仍未交付保險費時，其保險契約效力終止","C":"保險契約停止效力後，要保人得於二年以內申請恢復契約效力","D":"經保險人同意恢復效力之保險契約，溯自繳清應繳保險費及其利息之日起恢復效力"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，有關保險人之規定，下列敘述何者錯誤？","o":{"A":"保險人同意承保後，應填發保險單","B":"保險人於同意承保前，預收相當於第一期保險費之金額，保險人應負之保險責任，以保險人同意承保時，溯 自預收相當於第一期保險費金額時開始","C":"簡易人壽保險之保險人，對於保險費，不得以訴訟請求交付","D":"簡易人壽保險之保險人，得代位行使要保人或受益人因保險事故所生對於第三人之請求權"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，保險單借款未清償前，如因發生下列哪些情事時，其所欠之本息，應於給付之金 額內扣抵之？ A.保險契約效力停止 B.保險契約終止 C.保險契約滿期 D.發生保險事故","o":{"A":"僅 ABC","B":"僅 ABD","C":"僅 BCD","D":"ABCD"},"k":"專一","p":1,"d":""},{"l":4,"y":111,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，由中華郵政股份有限公司以外之其他保險業者經營簡易人壽保險業務之主管機 關為何？","o":{"A":"交通部","B":"經濟部","C":"審計部","D":"金融監督管理委員會"},"k":"內勤","p":1,"d":"簡易人壽保險法第二條II\nㅤㅤ\n其他保險業者經營簡易人壽保險業務，由\n金融監督管理委員會\n主管\n，並適用第四條、第六條至第二十六條之規定。"},{"l":4,"y":111,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，有關被保險人應否施以健康檢查，下列敘述何者正確？","o":{"A":"依險種而定","B":"依投保金額而定","C":"應施以健康檢查","D":"免施以健康檢查"},"k":"內勤","p":1,"d":"簡易人壽保險法\n第6條\n：\n簡易人壽保險對於被保險人，\n免施以健康檢查"},{"l":4,"y":111,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，由保險契約所發生之權利，自得為請求之日起，逾幾年不行使而消滅？","o":{"A":"一年","B":"二年","C":"三年","D":"五年"},"k":"內勤","p":1,"d":"簡易人壽保險法》第 29 條規定，由保險契約所發生之權利，自得為請求之日起，逾\n五年\n不行使而消滅。"},{"l":4,"y":111,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，郵政簡易人壽保險有關之精算人員資格、聘用與簽證之辦法，由下列何者定之？","o":{"A":"行政院會同立法院","B":"行政院會同金融監督管理委員會","C":"財政部會同金融監督管理委員會","D":"交通部會同金融監督管理委員會"},"k":"內勤","p":1,"d":"簡易人壽保險法第31條\nㅤㅤ\n郵政簡易人壽保險有關之各種保險單條款、保險費與其他相關資料、銷售前採行之程序、負責人資格、精算人員資格、聘用與簽證、核保理賠人員資格、業務員管理及其他相關事項之辦法，由\n交通部 會同金融監督管理委員\n會定之"},{"l":4,"y":111,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，有關保險契約之解除，下列敘述何者錯誤？","o":{"A":"訂立保險契約或依規定申請恢復保險契約效力時，要保人及被保險人對於保險人之書面詢問，應據實說明","B":"要保人或被保險人故意隱匿，或因過失遺漏，或為不實之說明，足以變更或減少保險人對於危險之估計者， 保險人得解除保險契約","C":"解除權之行使，自保險人知有解除之原因後，經過 15 天不行使而消滅","D":"自保險契約訂立或恢復保險契約效力至保險事故發生日滿二年，即有可以解除之原因，亦不得解除保險契約"},"k":"內勤","p":1,"d":"解除權之行使，自保險人知有解除之原因後，經過 一個月不行使而消滅"},{"l":4,"y":111,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，保險契約有下列各款情事之一者，保險人不負給付保險金額之責任，下列敘述 何者錯誤？","o":{"A":"被保險人因犯罪處死、拒捕或越獄致死者","B":"被保險人在保險契約發生效力或恢復效力後三年以內故意自殺者","C":"健康保險之被保險人故意自殺或墮胎所致疾病、失能、流產或死亡","D":"傷害保險之被保險人故意自殺，或因犯罪行為所致傷害、失能或死亡"},"k":"內勤","p":1,"d":"一年"},{"l":4,"y":111,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，有關保險契約之終止，下列敘述何者錯誤？","o":{"A":"要保人得隨時向保險人聲明終止保險契約","B":"其終止效力，不溯及既往","C":"其保險費已付足一年以上者，被保險人得依規定，申請返還其應得之保單價值準備金","D":"保險單借款未清償前，因保險契約效力終止時，其所欠之本息，應於給付之金額內扣抵之"},"k":"內勤","p":1,"d":"(C) 其保險費已付足一年以上者，\n被保險人\n要保人\n得依規定，申請返還其應得之保單價值準備金"},{"l":4,"y":111,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，有關被保險人之規定，下列敘述何者錯誤？","o":{"A":"非中華民國國民，不得為被保險人","B":"以他人為被保險人時，須受益人與被保險人有保險利益","C":"要保人得依規定指定或變更受益人，但被保險人為第三人時，應先得其書面同意","D":"由第三人訂立之保險契約，其權利之移轉或出質，非經被保險人以書面承認，不生效力"},"k":"內勤","p":1,"d":"第7條\n非中華民國國民，不得為被保險人。\n (A)\n第9條\n以他人為被保險人時，須\n要保人與被保險人 (B)\n有保險利益。\n第17條\n要保人在訂立保險契約時、保險契約滿期前或保險事故發生前，除保險契約另有約定外，得\n指定或變更受益人\n。但被保險人為第三人時，應先得其\n書面同意\n。\n (C)\n第26條\n由第三人訂立之保險契約，其權利之移轉或出質，非經\n被保險人以書面承認\n，不生效力。\n (D)"},{"l":4,"y":111,"a":"A","c":1.0,"s":"1 依郵政法，下列何者非屬中華郵政公司得經營之業務？","o":{"A":"發行公債","B":"儲金、匯兌","C":"遞送郵件","D":"簡易人壽保險"},"k":"升資","p":0,"d":"【題目】\n1 依郵政法，下列何者非屬中華郵政公司得經營之業務？\n(A) 發行公債\nㅤㅤ\n【法條】\n郵政法第五條\n法條內容中，中華郵政公司得經營之業務，並不包含 (A)\n發行公債。\nㅤㅤ\n中華郵政公司，得經營下列業務：\n一、遞送郵件。(C)\n二、儲金。(B)\n三、匯兌。(B)\n四、簡易人壽保險。(D)\n五、集郵及其相關商品。\n六、郵政資產之營運。\n七、經交通部核定，得接受委託辦理其他業務及投資或經營第一款至第六款相關業務。\n【參考網址】\n郵政法§5-全國法規資料庫 (moj.gov.tw)"},{"l":4,"y":111,"a":"D","c":0.88,"s":"39 依簡易人壽保險法規定，以他人為被保險人時，保險利益須存在何人之間？","o":{"A":"保險人、被保險人","B":"要保人、受益人","C":"被保險人、受益人","D":"要保人、被保險人"},"k":"升資","p":0,"d":""},{"l":4,"y":111,"a":"B","c":0.92,"s":"40 續期保險費自繳費日起 1 個月未交付者，保險人應於幾日內催告，並自當期繳費日起算幾個月為寬限期間？","o":{"A":"10 天；2 個月","B":"10 天；3 個月","C":"15 天；2 個月","D":"15 天；3 個月"},"k":"升資","p":0,"d":""},{"l":4,"y":111,"a":"D","c":0.94,"s":"41 簡易人壽保險得經營之 :"ABCD"},"k":"升等","p":0,"d":"簡易人壽保險之保險費付足一年以上者，要保人得以保險單為質，在其保單價值準備金額內，向保險人申請借款。\n前項借款未清償前，因保險契約效力停止、終止、滿期或發生保險事故時，其所欠之本息，應於給付之金額內扣抵之。"},{"l":4,"y":112,"a":"A","c":0.71,"s":"依簡易人壽保險法規定，下列敘述何者正確？ A.簡易人壽保險之保險人，不得代位行使要保人或受益人因保 險事故所生對於第三人之請求權 B.由保險契約所發生之權利，自得為請求之日起，逾五年不行使而消滅 C.郵政 簡易人壽保險之會計帳務，應獨立處理之 D.中華郵政公司經依本法規定處罰並限期令其改正後，屆期仍不改正者， 不得按次處罰","o":{"A":"僅 ABC","B":"僅 ABD","C":"僅 BCD","D":"ABCD"},"k":"升等","p":0,"d":"為什麼a選項可以 求問"},{"l":4,"y":113,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，以未滿十五歲之未成年人為被保險人訂立之簡易人壽保險契約，除健康保 險及喪葬費用之給付外，其餘死亡給付之約定效力為何？","o":{"A":"無效","B":"在一定金額內有效","C":"於被保險人滿十五歲時始生效力","D":"超過遺產稅喪葬費扣除額之一半者無效"},"k":"營運職","p":1,"d":""},{"l":4,"y":113,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，保險契約停止效力後，被保險人發生保險事故，保險人應負之保險責任為 何？","o":{"A":"負部分保險責任","B":"負全部保險責任","C":"不負保險責任","D":"待契約恢復效力，負全部保險責任"},"k":"營運職","p":1,"d":""},{"l":4,"y":113,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，下列敘述何者正確？ A.保險契約，自填發保險單之翌日發生效力 B.簡 易人壽保險對於被保險人，免施以健康檢查 C.中華民國國民及外國人均得為簡易人壽保險被保險人 D. 保險契約停止效力後，要保人得於二年以內申請恢復契約效力","o":{"A":"僅 BD","B":"僅 ABD","C":"僅 BCD","D":"僅 AB"},"k":"營運職","p":1,"d":""},{"l":4,"y":113,"a":"C","c":1.0,"s":"依郵政法規定 ， 中華郵政公司經營下列何項業務 ， 及供該項業務使用之郵政公用物 、 業務單據 ， 免納一切稅捐？","o":{"A":"集郵及其相關商品","B":"簡易人壽保險","C":"遞送郵件之業務","D":"郵政儲金"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"A","c":1.0,"s":"有關郵政簡易人壽保險之最高、最低保險金額及同一被保險人之保險金額總數之訂定，下列敘述何者正確？","o":{"A":"由交通部會同金融監督管理委員會定之","B":"由中華郵政公司函報交通部核定","C":"由中華郵政公司自行訂定","D":"由交通部定之"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，受益人故意致被保險人於死或雖未致死者，無請求死亡人壽保險金額之權，但有其他 受益人時，其保險金額如何處理？","o":{"A":"保險金額作為被保險人遺產","B":"由其他受益人平均領受全部保險金額","C":"由要保人領受全部保險金額","D":"由要保人及其他受益人平均領受全部保險金額"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，本法所定之行政處罰，由何機關為之？","o":{"A":"交通部","B":"法務部","C":"內政部","D":"金融監督管理委員會"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，保險人對於保險契約發生何種情事，不負給付保險金額之責任？ A.被保險人在保險 契約發生效力或恢復效力後一年以內故意自殺 B.要保人故意致被保險人於死 C.被保險人因犯罪處死、拒捕或越 獄致死 D.健康保險之被保險人故意自殺或墮胎所致疾病、失能、流產或死亡","o":{"A":"ABCD","B":"僅 ABD","C":"僅 ABC","D":"僅 BCD"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，由第三人訂立之保險契約，下列敘述何者錯誤？","o":{"A":"未經被保險人書面同意，並約定保險金額者，其契約無效","B":"被保險人得隨時以書面通知保險人及要保人撤銷之","C":"未經要保人書面同意，被保險人不得行使撤銷權","D":"被保險人行使其撤銷權者，視為要保人終止保險契約"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，下列敘述何者正確？","o":{"A":"簡易人壽保險法未規定者，僅適用民法之規定","B":"以他人為被保險人時，須要保人與受益人有保險利益","C":"簡易人壽保險之保險人，對於保險費，不得以訴訟請求交付","D":"保險契約，自填發保險單之翌日發生效力"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，經保險人同意恢復效力之保險契約，自何時起恢復效力？","o":{"A":"自保險人同意恢復效力之日起","B":"自保險人同意恢復效力之次月 1 日起","C":"溯自繳清應繳保險費之日起","D":"溯自繳清應繳保險費及其利息之日起"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，有關終止保險契約及其終止效力，下列敘述何者正確？","o":{"A":"被保險人得隨時向保險人聲明終止保險契約；其終止效力，不溯及既往","B":"被保險人得隨時向保險人聲明終止保險契約；其終止效力，溯及既往","C":"要保人得隨時向保險人聲明終止保險契約；其終止效力，不溯及既往","D":"要保人得隨時向保險人聲明終止保險契約；其終止效力，溯及既往"},"k":"專一","p":1,"d":""},{"l":4,"y":113,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，下列敘述何者正確？ A.簡易人壽保險對於被保險人，免施以健康檢查 B.中華民國 國民及外國人均得為簡易人壽保險之被保險人 C.其他保險業者不得經營簡易人壽保險業務 D.保險金額超過規定 限額時，其超過部分之契約無效，超過部分所繳之保險費，應予無息退還","o":{"A":"僅 ACD","B":"僅 AD","C":"僅 AC","D":"ABCD"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，除另有約定外，有關要保人得指定或變更受益人之時點，下列敘述何者錯誤？","o":{"A":"恢復契約效力前","B":"訂立保險契約時","C":"保險契約滿期前","D":"保險事故發生前"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，有關被保險人行使撤銷權之敘述，下列何者正確？","o":{"A":"得隨時以書面通知保險人及要保人撤銷之","B":"非經要保人同意，不得行使撤銷權","C":"契約成立滿 3 個月後始得撤銷之","D":"得以電話或書面通知保險人撤銷之"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，有關受益人之權利，下列敘述何者錯誤？","o":{"A":"受益人故意致被保險人於死或雖未致死者，無請求死亡人壽保險金額之權","B":"受益人故意傷害被保險人者，無請求傷害保險金額之權","C":"受益人故意傷害被保險人但未致死者，得請求部分傷害保險金額","D":"有其他受益人，由其他受益人平均領受全部保險金額"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，有關以他人為被保險人，下列敘述何者正確？","o":{"A":"須受益人與被保險人有保險利益","B":"須要保人與被保險人有保險利益","C":"須保險人與被保險人有保險利益","D":"須要保人與受益人有保險利益"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，中華郵政公司對於安定基金之提撥，如未依限或拒絕繳付者，主管機關得視情節之輕 重，處多少罰鍰？","o":{"A":"新臺幣二十四萬元以上一百二十萬元以下","B":"新臺幣三十萬元以上一百五十萬元以下","C":"新臺幣五十萬元以上二百萬元以下","D":"新臺幣一百萬元以上三百萬元以下"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，有關以保險單為質向保險人申請借款，下列敘述何者錯誤？","o":{"A":"保險費付足一年以上者","B":"在所繳保費金額範圍內","C":"由要保人為之","D":"借款未清償前，因保險契約效力停止、終止、滿期或發生保險事故時，其所欠之本息，應於給付之金額內扣抵之"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，下列敘述何者錯誤？","o":{"A":"中華郵政公司經營之簡易人壽保險，以中華郵政公司為保險人","B":"保險人同意承保後，應填發保險單","C":"保險契約，自填發保險單之日發生效力","D":"簡易人壽保險之保險人，對於保險費，得以訴訟請求交付"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"B","c":1.0,"s":"依簡易人壽保險法規定 ， 訂立保險契約或申請恢復保險契約效力時 ， 何人對於保險人之書面詢問 ， 應據實說明？","o":{"A":"要保人及受益人","B":"要保人及被保險人","C":"要保人或受益人","D":"要保人或被保險人"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，下列敘述何者正確？","o":{"A":"保險人得代位行使要保人或受益人因保險事故所生對於第三人之請求權","B":"保險人得代位行使要保人或被保險人因保險事故所生對於第三人之請求權","C":"保險人不得代位行使要保人或受益人因保險事故所生對於第三人之請求權","D":"保險人不得代位行使要保人或被保險人因保險事故所生對於第三人之請求權"},"k":"專一","p":1,"d":""},{"l":4,"y":114,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，要保人得隨時向保險人聲明終止保險契約，其終止效力如何？","o":{"A":"契約自始無效","B":"終止效力不溯及既往","C":"要保人得於二年以內申請恢復契約效力","D":"要保人對於保單價值準備全無任何請求權"},"k":"營運職","p":1,"d":""},{"l":4,"y":114,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，有關保險人之除外責任，下列何者錯誤？","o":{"A":"要保人故意致被保險人於死","B":"被保險人在保險契約發生效力或恢復效力後一年以內故意自殺","C":"被保險人因犯罪處死、拒捕或越獄致死","D":"被保險人因戰爭或其他變亂致死者"},"k":"營運職","p":1,"d":""},{"l":4,"y":114,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，下列何者為簡易人壽保險得以主約方式經營之保險？","o":{"A":"健康保險","B":"生死合險","C":"傷害保險","D":"年金保險"},"k":"內勤","p":1,"d":"主約：生存、死亡、生死\n附約：健康、傷害\n*沒有在賣年金保險*"},{"l":4,"y":114,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，保險契約未指定受益人時，以被保險人死亡為保險給付事由者，以下列何項金額作為被保 險人之遺產？","o":{"A":"保險金額","B":"保險費","C":"生存保險金","D":"滿期保險金"},"k":"內勤","p":1,"d":"簡易人壽保險法\n第17條\n1.要保人在訂立保險契約時、保險契約滿期前或保險事故發生前，除保險契約另有約定外，得指定或變更受益人。但被保險人為第三人時，應先得其書面同意。\n2.\n未指定受益人時，以被保險人死亡為保險給付事由者，其保險金額作為被保險人之遺產\n；非以被保險人死亡為保險給付事由者，以被保險人為受益人。但保險金給付前被保險人死亡時，其保險金額或保單價值準備金作為被保險人之遺產。"},{"l":4,"y":114,"a":"A","c":1.0,"s":"依簡易人壽保險法規定 ， 簡易人壽保險之保險費付足一年以上者 ， 何人得以保險單為質 ， 在其保單價值準備金額內 ， 向保險人申請借款？","o":{"A":"要保人","B":"被保險人","C":"受益人","D":"業務員"},"k":"內勤","p":1,"d":"第 23 條\n簡易人壽保險之保險費付足一年以上者，要保人得以保險單為質，在其保單價值準備金額內，向保險人申請借款。\n前項借款未清償前，因保險契約效力停止、終止、滿期或發生保險事故時，其所欠之本息，應於給付之金額內扣抵之。"},{"l":4,"y":114,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，簡易人壽保險之保險人，對於要保人或受益人因保險事故所生對於第三人之請求權，下列 敘述何者正確？","o":{"A":"得於一年內代位行使","B":"得於二年內代位行使","C":"得於五年內代位行使","D":"不得代位行使"},"k":"內勤","p":1,"d":"條文重點\n「簡易人壽保險之保險人，不得代位行使要保人或受益人因保險事故所生對於第三人之請求權。」\n1. 什麼是代位求償？\n在一般保險（例如車險、火險）中，保險公司在理賠後，可以「代位」行使被保險人對第三人的請求權。\n例如：車禍中，保險公司先賠給你，之後可以代替你向肇事者追償。\n2. 為何簡易人壽保險禁止代位？\n人壽保險的性質是 保障生命與死亡風險，而不是財產損害。\n保險事故（如死亡、失能）通常涉及個人生命，並非第三人可直接補償的財產損失。\n若允許保險公司代位，可能會造成受益人權益受限，甚至引發倫理爭議。\n3. 制度設計的意義\n保險金給付屬於 被保險人或受益人的專屬權利。\n保險公司不得以「我已經賠了，所以我要去追第三人」的方式介入。\n保障了受益人能完整取得保險金，不受其他法律糾葛影響。\n? 總結\n第 24 條的精神是：簡易人壽保險的保險人不能代位求償，因為人壽保險的給付是基於生命保障，不是財"},{"l":4,"y":114,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，中華郵政公司得經交通部核可，提供重大公共建設計畫之融資所需款項。但其提供總額， 不得超過「資金」總額百分之三十。前述所定「資金」，包括業主權益，以及下列何項之金額？","o":{"A":"保險金額","B":"保單價值準備金","C":"各種準備金","D":"保險費"},"k":"內勤","p":1,"d":"第 17 題考的是 \n《簡易人壽保險法》第 27 條\n的規定。\nㅤㅤ\n? 條文重點\n中華郵政公司得經交通部核可，提供重大公共建設計畫之融資所需款項。\n但其提供總額，不得超過「資金」總額的 \n30%\n。\n所謂「資金」，包括：\n業主權益\n各種準備金\nㅤㅤ\n? 選項解析\n(A) 保險金額 → 錯誤，保險金額是契約給付，不屬於資金範疇。\n(B) 保單價值準備金 → 錯誤，這是針對保單借款的概念，並非融資資金定義。\n(C) \n各種準備金 → 正確\n，法律明文規定資金包括業主權益及各種準備金。\n(D) 保險費 → 錯誤，保險費是要保人繳納的金額，不屬於資金。\nㅤㅤ\n? 結論\n正確答案是 \n(C) 各種準備金\n。\n這題的關鍵在於理解「資金」的法律定義：它不是保險契約的金額或費用，而是公司本身的 \n業主權益＋各種準備金\n。"},{"l":4,"y":114,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，由第三人訂立之保險契約，其權利之移轉或出質，非經下列何人以書面承認，不生效力？","o":{"A":"被保險人","B":"保險人","C":"要保人","D":"受益人"},"k":"內勤","p":1,"d":"第 18 題考的是 \n《簡易人壽保險法》第 18 條\n的規定。\nㅤㅤ\n? 條文重點\n如果保險契約是由 \n第三人訂立\n（也就是不是被保險人自己簽的契約），\n那麼契約的 \n權利移轉或出質\n（例如轉讓或拿去抵押），\n必須經 \n被保險人\n 書面承認，才會生效。\nㅤㅤ\n? 選項解析\n(A) \n被保險人 → 正確\n，法律明文規定必須由被保險人書面承認。\n(B) 保險人 → 錯誤，保險公司不是承認主體。\n(C) 要保人 → 錯誤，要保人雖是契約訂立人，但若是第三人訂立，仍需被保險人承認。\n(D) 受益人 → 錯誤，受益人只是保險金的領取人，沒有承認效力。\nㅤㅤ\n? 結論\n正確答案是 \n(A) 被保險人\n。\n這題的關鍵在於：\n第三人訂立契約時，必須尊重被保險人的意志\n，因此法律要求被保險人書面承認，才能保障契約效力。\n8\n1"},{"l":4,"y":114,"a":"B","c":1.0,"s":"依簡易人壽保險法規定，有關寬限期間屆滿仍未交付保險費時，其保險契約效力停止，其中寬限期間係自當期繳費 日起算多久期間？","o":{"A":"一個月","B":"三個月","C":"六個月","D":"一年"},"k":"內勤","p":1,"d":"3個月寬限期"},{"l":4,"y":114,"a":"A","c":1.0,"s":"依簡易人壽保險法規定，有關保險人解除保險契約時，要保人得依規定申請下列何項金額？","o":{"A":"應得之保單價值準備金","B":"保險金額","C":"保險費金額","D":"責任準備金"},"k":"內勤","p":1,"d":"第 50 題考的是 \n簡易人壽保險法中，保險人解除契約時要保人可申請的金額\n。\nㅤㅤ\n? 條文重點\n依《簡易人壽保險法》規定：\n當保險人解除保險契約時，要保人並不是可以拿回全部的保險金額或已繳保險費。\n法條明定，要保人得依規定申請 \n「應得之保單價值準備金」\n。\n保單價值準備金是保險公司依契約及精算原則累積的金額，代表契約解除時要保人可取回的部分。\nㅤㅤ\n? 選項解析\n(A) \n應得之保單價值準備金 → ✅ 正確\n。\n(B) 保險金額 → ❌ 錯誤，保險金額是事故發生時的理賠金，不是解除契約時可申請的金額。\n(C) 保險費金額 → ❌ 錯誤，已繳保險費不會全額退還。\n(D) 責任準備金 → ❌ 錯誤，責任準備金是保險公司內部的準備金，不是要保人可申請的。\nㅤㅤ\n? 結論\n正確答案是 \n(A) 應得之保單價值準備金\n。"},{"l":4,"y":114,"a":"C","c":1.0,"s":"依簡易人壽保險法規定，有關郵政簡易人壽保險之資本，下列敘述何者正確？","o":{"A":"按實收資本總額百分之五十繳存保證金於國庫","B":"不用繳存保證金","C":"由交通部會商金融監督管理委員會後核定","D":"由財政部核定"},"k":"內勤","p":1,"d":"根據《簡易人壽保險法》第 29 條最新規定：\n「郵政簡易人壽保險之資本，\n由交通部會商金融監督管理委員會後核定\n，並按實收資本總額\n百分之十五\n繳存保證金於國庫。」"},{"l":4,"y":114,"a":"D","c":1.0,"s":"依簡易人壽保險法規定，下列敘述何者錯誤？","o":{"A":"要保人在保險契約滿期前，除保險契約另有約定外，得指定或變更受益人","B":"要保人為不實之說明，足以變更保險人對於危險之估計者，保險人得解除保險契約","C":"簡易人壽保險之保險人，對於保險費，不得以訴訟請求支付","D":"要保人得隨時向保險人聲明終止保險契約；其終止效力，溯及既往"},"k":"內勤","p":1,"d":"第 52 題考的是 簡易人壽保險法中契約效力與要保人、保險人權利義務的規定。\n? 條文重點\n依《簡易人壽保險法》：\n(A) 要保人在契約滿期前，除契約另有約定外，確實可以指定或變更受益人 → ✅ 正確。\n(B) 要保人若有不實說明，足以影響保險人對危險的估計，保險人得解除契約 → ✅ 正確。\n(C) 簡易人壽保險的特性之一，就是保險人不得透過訴訟請求保險費 → ✅ 正確。\n(D) 要保人得隨時聲明終止契約，但其效力是「自聲明之後生效」，不會溯及既往 → ❌ 錯誤。\n? 選項解析\n(A) 正確\n(B) 正確\n(C) 正確\n(D) 錯誤，因為終止效力不會追溯過去，只在聲明後生效。\n? 結論\n正確答案是 (D) 要保人得隨時向保險人聲明終止保險契約；其終止效力，溯及既往。\n20\n1"},{"l":4,"y":115,"a":"C","c":0.96,"s":"依簡易人壽保險法規定，其主要立法目的為何？","o":{"A":"提高壽險資金投資效益","B":"增加郵局營業收入","C":"提供國民基本經濟保障","D":"提升壽險業務競爭力"},"k":"內勤","p":0,"d":""},{"l":4,"y":115,"a":"B","c":0.96,"s":"依簡易人壽保險法規定，有關簡易人壽保險對於被保險人之健康檢查，下列敘述何者正確？","o":{"A":"視投保金額決定","B":"免施以健康檢查","C":"視年齡或險種決定","D":"強制健康檢查"},"k":"內勤","p":0,"d":""},{"l":4,"y":115,"a":"A","c":0.94,"s":"依簡易人壽保險法規定，續期保險費自繳費日起一個月未交付者，保險人應於幾日內催告？","o":{"A":"十日","B":"十二日","C":"十五日","D":"二十日"},"k":"內勤","p":0,"d":""},{"l":4,"y":115,"a":"B","c":0.78,"s":"依簡易人壽保險法規定，郵政簡易人壽保險之資本經核定後，應按實收資本總額百分之幾繳存保證金於國庫？","o":{"A":"百分之十","B":"百分之十五","C":"百分之二十","D":"百分之三十"},"k":"內勤","p":0,"d":"16題配合18題 重大建設要30%，要給國庫15%（一半）保證金（個人記憶用）"},{"l":4,"y":115,"a":"A","c":0.67,"s":"依簡易人壽保險法規定，以受監護宣告尚未撤銷者為被保險人，除健康保險及喪葬費用之給付外，其餘死亡給付部分之效力為何？","o":{"A":"無效","B":"有效","C":"一定金額以內有效","D":"滿十五歲時有效"},"k":"內勤","p":0,"d":"依據郵政簡易人壽保險法第七之一條\n訂立保險契約時已受監護宣告尚未撤銷者為被保險人除喪葬費用外，其餘死亡給付部分無效\n雖然坊間保險契約都會告訴要保人說15歲才會賠，但是必須以法條條例為主"},{"l":4,"y":115,"a":"D","c":0.88,"s":"依簡易人壽保險法規定，有關受益人之敘述，下列何者錯誤？","o":{"A":"受益人故意致被保險人於死者，無請求死亡人壽保險金額之權","B":"受益人故意傷害被保險人者，無請求傷害保險金額之權","C":"由第三人訂立之保險契約，於指定或變更受益人時，應先得被保險人書面同意","D":"未指定受益人時，非以被保險人死亡為保險給付事由者，以要保人為受益人"},"k":"內勤","p":0,"d":""},{"l":4,"y":115,"a":"C","c":0.9,"s":"依簡易人壽保險法規定，保險契約停止效力後，得由何人於多久期限內申請恢復契約效力？","o":{"A":"被保險人；一年","B":"要保人；一年","C":"要保人；二年","D":"受益人；二年"},"k":"內勤","p":0,"d":""},{"l":4,"y":115,"a":"D","c":0.94,"s":"中華郵政公司經依簡易人壽保險法規定處罰並限期令其改正後，屆期仍不改正者，得如何處置？","o":{"A":"口頭警告","B":"暫停營業","C":"先移送法院審理後再處罰","D":"按次處罰"},"k":"內勤","p":0,"d":""},{"l":4,"y":115,"a":"B","c":0.76,"s":"依簡易人壽保險法規定，下列敘述何者正確？ A.保險契約停止效力後，被保險人發生之保險事故，保險人不負保 險責任 B.要保人或被保險人故意隱匿，足以變更或減少保險人對於危險之估計者，保險人得解除保險契約 C.解除權 之行使，自保險人知有解除之原因後，經過三個月不行使而消滅 D.保險人依規定解除保險契約時，要保人得申請應得 之保單價值準備金及所繳保費差額","o":{"A":"僅 ABC","B":"僅 AB","C":"僅 BD","D":"僅 ACD"},"k":"內勤","p":0,"d":"依簡易人壽保險法 第 16 條\n1 前條解除權之行使，自保險人知有解除之原因後，經過一個月不行使而消滅；或自保險\n契約訂立或恢復保險契約效力至保險事故發生日滿二年，即有可以解除之原因，亦不得\n解除保險契約。\n2 依前項規定解除保險契約時，要保人除得依第二十一條規定，申請應得之保單價值準備\n金外，不得為其他請求。\nㅤㅤ\n解除期限 知1個月 、不知最長2年內"}];
const LAWS=["郵政法","郵件處理規則","郵務營業規章","郵政儲金匯兌法","簡易人壽保險法"];
const YEARS=[...new Set(DATA.map(d=>d.y))].sort();
const KINDS=[...new Set(DATA.map(d=>d.k))];
const sel={law:new Set(),year:new Set(),kind:new Set(),src:new Set()};
function chips(el,items,key,labels){
  document.getElementById(el).innerHTML=items.map((v,i)=>
    `<button class="chip" data-k="${key}" data-v="${v}">${labels?labels[i]:v}</button>`).join('');
}
chips('fLaw',LAWS.map((_,i)=>i),'law',LAWS);
chips('fYear',YEARS,'year');
chips('fKind',KINDS,'kind');
chips('fSrc',[1,0],'src',['官方答案','阿摩統計']);
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k,v=isNaN(b.dataset.v)?b.dataset.v:+b.dataset.v;
  if(sel[k].has(v)){sel[k].delete(v);b.classList.remove('on')}else{sel[k].add(v);b.classList.add('on')}
  count();
});
function pick(){
  return DATA.filter(d=>(!sel.law.size||sel.law.has(d.l))&&(!sel.year.size||sel.year.has(d.y))
    &&(!sel.kind.size||sel.kind.has(d.k))&&(!sel.src.size||sel.src.has(d.p)));
}
function count(){document.getElementById('cnt').textContent='符合 '+pick().length+' 題';}
count();
let cur=[],done=0,ok=0;
function render(qs){
  cur=qs;done=0;ok=0;
  document.getElementById('bar').style.display=qs.length?'flex':'none';
  if(!qs.length){document.getElementById('list').innerHTML='<div class="empty">沒有符合條件的題目</div>';return}
  document.getElementById('list').innerHTML=qs.map((d,i)=>{
    const badge = d.p ? '<span class="badge b-off">官方答案</span>'
      : (d.c<0.6 ? `<span class="badge b-low">阿摩 ${Math.round(d.c*100)}% 低信心</span>`
                 : `<span class="badge b-amo">阿摩 ${Math.round(d.c*100)}%</span>`);
    const half = d.k==='半日制' ? '<span class="badge b-half">半日制</span>' : '';
    const opts=['A','B','C','D'].filter(k=>d.o[k]).map(k=>
      `<button class="opt" data-q="${i}" data-o="${k}"><span class="lab">(${k})</span>${d.o[k]}</button>`).join('');
    return `<div class="q" id="q${i}">
      <div class="stem"><span class="no">${i+1}</span>${badge}${half}${d.s}
        <span class="meta">${LAWS[d.l]}．${d.y} 年．${d.k}</span></div>
      ${opts}
      <div class="exp" id="e${i}"><b>正解：(${d.a})</b> ${d.o[d.a]||''}${d.d?'<br><b>詳解：</b>'+d.d:''}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
  bar();
}
function answer(b){
  const i=+b.dataset.q, box=document.getElementById('q'+i);
  if(box.dataset.done)return;
  box.dataset.done=1;done++;
  const a=cur[i].a;
  box.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    if(o.dataset.o===a)o.classList.add('correct');
  });
  if(b.dataset.o===a){ok++}else{b.classList.add('wrong')}
  document.getElementById('e'+i).classList.add('show');
  bar();
}
function bar(){
  document.getElementById('score').textContent=ok+' / '+done+(cur.length?'（共 '+cur.length+' 題）':'');
  document.getElementById('prog').style.width=(cur.length?done/cur.length*100:0)+'%';
}
document.getElementById('start').onclick=()=>{render(pick());scrollTo(0,300)};
document.getElementById('shuffle').onclick=()=>{
  const a=pick().slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}
  render(a.slice(0,50));scrollTo(0,300)};
document.getElementById('showall').onclick=()=>{
  cur.forEach((d,i)=>{const box=document.getElementById('q'+i);
    if(!box.dataset.done){box.dataset.done=1;done++;
      box.querySelectorAll('.opt').forEach(o=>{o.classList.add('lock');if(o.dataset.o===d.a)o.classList.add('correct')})}
    document.getElementById('e'+i).classList.add('show')});
  bar()};
document.getElementById('reset').onclick=()=>render(cur);
</script>
</body></html>
