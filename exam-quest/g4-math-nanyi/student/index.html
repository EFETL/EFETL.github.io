const SUBJECT='e4math-nanyi-1', ENDPOINT='https://script.google.com/macros/s/AKfycbzPt9-_BdRtHhH6f6GAuE9LLRXK8m3j7uavDxpm0xaaJCitl2KfOoYcviYgDZNdNjflLg/exec', SITE='四年級數學・南一版';
const PRAISE=[['🌟','太棒了!答對了!'],['🏆','你好厲害!'],['🎉','答對囉!繼續加油!'],['👏','完全正確!'],['⭐','很會喔!再接再厲!'],['🥇','真聰明!'],['🐳','小鯨魚幫你拍拍手!']];
const CHEER=['沒關係,錯的地方就是進步的地方!','差一點點!再想一想,你可以的!','加油!小鯨魚相信你!','別擔心,我們一起把它弄懂!'];
const $=s=>document.querySelector(s);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let me=ls.get(SUBJECT+'_name')||'';
const best=()=>{try{return JSON.parse(ls.get(SUBJECT+'_best')||'{}')}catch(e){return {}}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function meChip(){$('#me').textContent=me?('👤 '+me+'　修改'):'👤 填名字';}
$('#me').onclick=()=>enroll(()=>{home()});
function enroll(then,force){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML='<div class="card"><div style="font-size:3rem">🐳</div><h2 style="margin:4px 0">你好!請告訴小鯨魚你的名字</h2><input id="nm" maxlength="6" placeholder="中文姓名" value="'+esc(me)+'"><button class="btn big" id="go">開始闖關</button></div>';
  document.body.appendChild(m);const inp=m.querySelector('#nm');inp.focus();
  m.querySelector('#go').onclick=()=>{const v=inp.value.trim();if(v.length<2){inp.style.borderColor='#e67e22';return}me=v;ls.set(SUBJECT+'_name',v);m.remove();meChip();then()};
}
function stars(n){return '⭐'.repeat(n)+'☆'.repeat(3-n)}
function home(){
  const b=best();
  let h='<div class="card hello"><div class="w">🐳</div><div><b>'+(me?me+',':'')+'歡迎來闖關!</b><br>每一關大約 15 題,答對會得到星星喔!先從 A-1 開始吧。<br><small style="color:#6a7f92">範圍:'+esc(D.range)+'</small></div></div>';
  ['A','B','C','D','E'].forEach(P=>{
    const ls_=D.levels.map((L,i)=>[L,i]).filter(x=>x[0].paper===P);if(!ls_.length)return;
    const got=ls_.reduce((a,[L,i])=>a+(b[i]?b[i].stars:0),0);
    h+='<h3 style="margin:18px 4px 4px">第 '+P+' 回　<small style="color:#6a7f92;font-weight:400">⭐ '+got+' / '+ls_.length*3+'</small></h3><div class="lv">';
    ls_.forEach(([L,i])=>{const r=b[i];
      h+='<button class="lvb'+(r?' done':'')+'" onclick="start('+i+')"><div class="n">'+L.name+'</div><div class="s">'+(r?stars(r.stars):'☆☆☆')+'</div><small>'+esc(L.title)+'・'+L.qs.length+' 題'+(r?'　最高 '+r.score+' 分':'')+'</small></button>';});
    h+='</div>';});
  $('#app').innerHTML=h;
}
let S;
function start(li){
  if(!me)return enroll(()=>start(li));
  S={li,i:0,right:0,wrong:[],done:false};show();
}
function show(){
  const L=D.levels[S.li],q=L.qs[S.i],n=L.qs.length;S.tried=0;S.gone=[];S.answered=false;
  let h='<div class="top"><span>第 '+L.name+' 關</span><span>'+(S.i+1)+' / '+n+'</span></div><div class="bar"><i style="width:'+(S.i/n*100)+'%"></i></div><div class="card"><span class="sect">'+esc(q.secTitle)+'</span>';
  if(q.passage||q.fig)h+='<div class="pass">'+q.passage+(q.fig?'<div class="figbox">'+q.fig+'</div>':'')+'</div>';
  h+='<div class="q">'+(S.i+1)+'. '+q.q+'</div><div id="ch">';
  if(q.kind==='tf')h+='<div class="tf"><button class="opt" data-k="0">○</button><button class="opt" data-k="1">×</button></div>';
  else if(q.kind==='choice')h+=q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'">'+'①②③④⑤⑥'[k]+' '+o+'</button>').join('');
  else if(q.kind==='num')h+='<div class="self-ans">算一算,把答案打在下面(只要數字)。</div><input id="nin" inputmode="decimal" autocomplete="off" style="font:inherit;font-size:1.4rem;width:100%;border:3px solid var(--c2);border-radius:14px;padding:8px 12px;background:var(--card);color:var(--ink)"><button class="btn big" id="nok">確定</button>';
  else h+='<div class="self-ans">自己寫在紙上想一想,想好了就按下面的按鈕看答案。</div><button class="btn" id="rev">看答案</button>';
  h+='</div><div id="fb"></div></div>';$('#app').innerHTML=h;
  document.querySelectorAll('#ch .opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  const r=$('#rev');if(r)r.onclick=revealSelf;const nk=$('#nok');if(nk){nk.onclick=checkNum;$('#nin').onkeydown=e=>{if(e.key==='Enter')checkNum()}}
}
function efigH(q){return q.efig?'<div class="figbox" style="margin-top:8px;background:#fff;border-radius:12px;padding:6px;text-align:center"><small style="color:#6a7f92">📖 看圖學一學</small><br>'+q.efig+'</div>':''}
function confetti(){const c=document.createElement('div');c.className='cf';let h='';for(let k=0;k<22;k++)h+='<i style="left:'+Math.random()*100+'%;animation-delay:'+Math.random()*.5+'s">'+rnd(['⭐','🎉','✨','🌟','💙'])+'</i>';c.innerHTML=h;document.body.appendChild(c);setTimeout(()=>c.remove(),2600)}
function pick(k){
  if(S.answered)return;const L=D.levels[S.li],q=L.qs[S.i];
  const btns=[...document.querySelectorAll('#ch .opt')];
  if(k===q.ans){
    S.answered=true;S.right++;btns[k].classList.add('ok');const p=rnd(PRAISE);confetti();
    $('#fb').innerHTML='<div class="fb ok"><div class="big">'+p[0]+'</div><b>'+p[1]+'</b>'+(q.exp?'<br>'+esc(q.exp):'')+efigH(q)+'</div>'+nextBtn();
    return;
  }
  S.tried++;btns[k].classList.add('no');btns[k].style.pointerEvents='none';
  const canRetry=q.kind==='choice'&&S.tried===1&&q.opts.length>=3;
  if(canRetry){
    const cand=q.opts.map((_,j)=>j).filter(j=>j!==q.ans&&j!==k&&!S.gone.includes(j));
    if(cand.length){const g=rnd(cand);S.gone.push(g);btns[g].classList.add('gone')}
    $('#fb').innerHTML='<div class="fb no"><div class="big">💪</div><b>'+rnd(CHEER)+'</b><br>小鯨魚幫你劃掉一個不對的選項,再試一次!</div>';
  }else{
    S.answered=true;btns.forEach((b,j)=>{b.style.pointerEvents='none';if(j===q.ans)b.classList.add('ok')});
    S.wrong.push({q:q.qt,mine:q.kind==='tf'?(k?'×':'○'):(q.optsT?q.optsT[k]:''),right:q.kind==='tf'?(q.ans?'×':'○'):q.optsT[q.ans],exp:q.exp,sec:q.secTitle});
    $('#fb').innerHTML='<div class="fb no"><div class="big">💪</div><b>'+rnd(CHEER)+'</b><br>正確答案是綠色這個。'+(q.exp?'<br>'+esc(q.exp):'')+'</div>'+nextBtn();
  }
}
function checkNum(){
  if(S.answered)return;const q=D.levels[S.li].qs[S.i];
  const raw=($('#nin').value||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[,，\s]/g,'');
  if(raw==='')return;const v=parseFloat(raw);S.tried++;
  if(!isNaN(v)&&Math.abs(v-q.ans)<1e-9){S.answered=true;S.right++;const p=rnd(PRAISE);confetti();$('#fb').innerHTML='<div class="fb ok"><div class="big">'+p[0]+'</div><b>'+p[1]+'</b>'+(q.exp?'<br>'+esc(q.exp):'')+efigH(q)+'</div>'+nextBtn();$('#nok').style.display='none';$('#nin').disabled=true;return}
  if(S.tried===1){$('#fb').innerHTML='<div class="fb no"><div class="big">💪</div><b>'+rnd(CHEER)+'</b><br>再算算看,檢查一下每一步!</div>';return}
  S.answered=true;S.wrong.push({q:q.qt,mine:raw,right:q.ansT||'',exp:q.exp,sec:q.secTitle});
  $('#fb').innerHTML='<div class="fb no"><div class="big">💪</div><b>'+rnd(CHEER)+'</b><br>正確答案是 <b>'+esc(q.ansT||'')+'</b>。'+(q.exp?'<br>'+esc(q.exp):'')+efigH(q)+'</div>'+nextBtn();$('#nok').style.display='none';$('#nin').disabled=true;
}
function revealSelf(){
  const q=D.levels[S.li].qs[S.i];
  $('#ch').innerHTML='<div class="self-ans"><b>參考答案:</b>'+esc(q.ansT||'')+'<br>'+esc(q.exp)+efigH(q)+'</div><button class="btn" id="yes">我答對了 👍</button><button class="btn alt" id="no">我再練習 💪</button>';
  $('#yes').onclick=()=>{S.right++;confetti();next()};
  $('#no').onclick=()=>{S.wrong.push({q:q.qt,mine:'(自評)',right:q.ansT||'',exp:q.exp,sec:q.secTitle});next()};
}
function nextBtn(){return '<button class="btn big" onclick="next()">'+(S.i+1>=D.levels[S.li].qs.length?'看成績 🎊':'下一題 ➜')+'</button>'}
function next(){S.i++;if(S.i>=D.levels[S.li].qs.length)finish();else show()}
function finish(){
  const L=D.levels[S.li],n=L.qs.length,score=Math.round(S.right/n*100),st=score>=90?3:score>=70?2:score>=50?1:0;
  const b=best();if(!b[S.li]||score>b[S.li].score)b[S.li]={score,stars:st};ls.set(SUBJECT+'_best',JSON.stringify(b));
  upload(S.li,score,n);if(st>=2)confetti();
  const msg=st===3?'太厲害了!全部都難不倒你!':st===2?'很棒!再看一下錯的題目就更完美了!':st===1?'不錯喔!看看下面的解析,再挑戰一次會更好!':'沒關係,這一關有一點難。看看解析,再來一次,你一定可以的!';
  let h='<div class="card"><div class="stars">'+stars(st)+'</div><div class="score">答對 '+S.right+' / '+n+' 題</div><p style="text-align:center">'+msg+'</p>';
  if(S.wrong.length){h+='<h3>🔍 一起看看這些題目</h3>'+S.wrong.map(w=>'<div class="wrong"><b>'+esc(w.q)+'</b><br>你選:'+esc(w.mine)+'　正確:<b style="color:var(--ok)">'+esc(w.right)+'</b><br>'+esc(w.exp)+'</div>').join('')}
  h+='<button class="btn big" onclick="start('+S.li+')">再挑戰這一關 🔁</button><button class="btn big alt" onclick="home()">回到關卡 🏠</button></div>';
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function upload(li,score,n){
  if(!ENDPOINT||!me)return;
  const L=D.levels[li];
  const ans=['【交卷】第'+L.name+'關｜闖關練習｜答對 '+S.right+'/'+n].concat(S.wrong.map(w=>'✗ 題目:'+w.q.replace(/｜/g,'/')+'｜學生答:'+w.mine.replace(/｜/g,'/')+'｜正解:'+w.right.replace(/｜/g,'/')+'｜單元:'+w.sec.replace(/｜/g,'/')));
  try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({subject:SUBJECT,site:SITE,name:me,round:('ABCDE'.indexOf(L.paper)+1)*10+L.sub,score,total:n,correct:S.right,blank:0,ans})})}catch(e){}
}
meChip();if(!me)enroll(home);else home();
</script></body></html>
