<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>三年級數學・翰林版｜段考闖關</title>
<style>
:root{--c:#1f6fb2;--c2:#e8f3fc;--ok:#2e9b5a;--okbg:#e6f6ec;--warm:#ff9f43;--warmbg:#fff3e2;--ink:#1b2a3a;--card:#fff;--bg:#f3f8fc}
@media(prefers-color-scheme:dark){:root{--c:#6fb4ec;--c2:#17324a;--ok:#5fd08c;--okbg:#17382a;--warm:#ffb870;--warmbg:#3b2d1a;--ink:#e8f0f7;--card:#1e2a36;--bg:#121b24}}
*{box-sizing:border-box}html{font-size:20px;-webkit-text-size-adjust:100%}
body{margin:0;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;touch-action:manipulation}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,var(--c),#46a0e0);color:#fff;padding:14px 16px}
header .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 16px}
header h1{font-size:1.15rem;margin:0;flex:1}
.me{font-size:.85rem;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 12px;cursor:pointer;border:0;color:#fff;font:inherit}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 10px rgba(30,80,130,.12);padding:16px 18px;margin:14px 0}
.hello{display:flex;gap:14px;align-items:center}.hello .w{font-size:3.4rem}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lvb{background:var(--card);border:3px solid var(--c2);border-radius:20px;padding:14px;text-align:center;cursor:pointer;font:inherit;color:inherit;box-shadow:0 2px 8px rgba(30,80,130,.1)}
.lvb:active{transform:scale(.97)}.lvb .n{font-size:1.5rem;font-weight:800;color:var(--c)}.lvb .s{font-size:1.6rem;letter-spacing:4px;min-height:2.2rem}.lvb small{color:#6a7f92;font-size:.8rem}
.lvb.done{border-color:var(--ok)}
.bar{height:14px;background:var(--c2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#46a0e0,var(--ok));width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:#6a7f92}
.sect{display:inline-block;background:var(--c2);color:var(--c);border-radius:99px;padding:0 12px;font-size:.8rem;font-weight:700}
.pass{background:var(--c2);border-radius:14px;padding:10px 14px;margin:8px 0;font-size:.95rem}
.q{font-size:1.1rem;font-weight:600;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:1.05rem;background:var(--card);color:var(--ink);border:3px solid var(--c2);border-radius:16px;padding:12px 16px;margin:10px 0;cursor:pointer;min-height:56px}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--warm);background:var(--warmbg);opacity:.75}.opt.gone{opacity:.25;text-decoration:line-through;pointer-events:none}
.tf{display:flex;gap:14px}.tf .opt{text-align:center;font-size:2rem;font-weight:800}
.fb{border-radius:18px;padding:12px 16px;margin:12px 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)}.fb.no{background:var(--warmbg);border:2px solid var(--warm)}
.fb .big{font-size:2.6rem;line-height:1.2;animation:pop .45s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.btn{display:inline-block;font:inherit;font-weight:700;font-size:1.05rem;background:var(--c);color:#fff;border:0;border-radius:99px;padding:10px 28px;margin:8px 6px 0 0;cursor:pointer;min-height:48px}
.btn.alt{background:var(--c2);color:var(--c)}.btn.big{display:block;width:100%;margin-top:12px}
.stars{font-size:3rem;letter-spacing:6px;text-align:center;animation:pop .6s}.score{text-align:center;font-size:1.3rem;font-weight:800}
.wrong{border-top:1px dashed #b9cbdb;padding:8px 0;font-size:.9rem}.wrong b{color:var(--warm)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}.cf i{position:absolute;top:-30px;font-style:normal;font-size:1.6rem;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.6}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .card{max-width:420px;width:100%;text-align:center}.modal input{font:inherit;font-size:1.3rem;text-align:center;border:3px solid var(--c2);border-radius:14px;padding:8px;width:100%;margin:10px 0;background:var(--card);color:var(--ink)}
.figtbl{border-collapse:collapse;margin:6px 0;font-size:.85rem}.figtbl th,.figtbl td{border:1px solid #8aa;padding:3px 10px;text-align:center}.figtbl th{background:var(--c2)}
.figbox svg{max-width:100%;height:auto}.self-ans{background:var(--c2);border-radius:12px;padding:8px 12px;margin:8px 0}
.hide{display:none}
</style></head><body>

  const b=best();if(!b[S.li]||score>b[S.li].score)b[S.li]={score,stars:st};ls.set(SUBJECT+'_best',JSON.stringify(b));
  upload(S.li,score,n);if(st>=2)confetti();
  const msg=st===3?'太厲害了!全部都難不倒你!':st===2?'很棒!再看一下錯的題目就更完美了!':st===1?'不錯喔!看看下面的解析,再挑戰一次會更好!':'沒關係,這一關有一點難。看看解析,再來一次,你一定可以的!';
  let h='<div class="card"><div class="stars">'+stars(st)+'</div><div class="score">答對 '+S.right+' / '+n+' 題</div><p style="text-align:center">'+msg+'</p>';
  if(S.wrong.length){h+='<h3>🔍 一起看看這些題目</h3>'+S.wrong.map(w=>'<div class="wrong"><b>'+esc(w.q)+'</b><br>你選:'+esc(w.mine)+'　正確:<b style="color:var(--ok)">'+esc(w.right)+'</b><br>'+esc(w.exp)+'</div>').join('')}
  h+='<button class="btn big" onclick="start('+S.li+')">再挑戰這一關 🔁</button><button class="btn big alt" onclick="home()">回到關卡 🏠</button></div>';
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function upload(li,score,n){
  if(!ENDPOINT||!me)return;
  const L=D.levels[li];
  const ans=['【交卷】第'+L.name+'關｜闖關練習｜答對 '+S.right+'/'+n].concat(S.wrong.map(w=>'✗ 題目:'+w.q.replace(/｜/g,'/')+'｜學生答:'+w.mine.replace(/｜/g,'/')+'｜正解:'+w.right.replace(/｜/g,'/')+'｜單元:'+w.sec.replace(/｜/g,'/')));
  try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({subject:SUBJECT,site:SITE,name:me,round:('ABCDE'.indexOf(L.paper)+1)*10+L.sub,score,total:n,correct:S.right,blank:0,ans})})}catch(e){}
}
meChip();if(!me)enroll(home);else home();
</script></body></html>
