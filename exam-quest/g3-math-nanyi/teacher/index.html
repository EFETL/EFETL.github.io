  let H=[],q=2,c=0;while(H.length<8){let ok=1;for(let d=2;d*d<=q;d++)if(q%d==0){ok=0;break}if(ok)H.push(Math.floor((Math.sqrt(q)%1)*4294967296)>>>0);q++}
  const b=[...new TextEncoder().encode(m)],l=b.length*8;b.push(128);while(b.length%64!=56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=R(w[i-15],7)^R(w[i-15],18)^(w[i-15]>>>3),s1=R(w[i-2],17)^R(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
    let[a,bb,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=R(e,6)^R(e,11)^R(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=R(a,2)^R(a,13)^R(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
    H=[(H[0]+a)|0,(H[1]+bb)|0,(H[2]+cc)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0]}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
async function sha(s){const t='ek1:'+s;try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return sha256js(t)}
async function tryIn(){const v=$('#pw').value;if(await sha(v)===HASH){try{sessionStorage.setItem('t_'+SUBJECT,'1')}catch(e){}open_()}else{$('#msg').textContent='密碼不對,請再試一次';}}
$('#ok').onclick=tryIn;$('#pw').onkeydown=e=>{if(e.key==='Enter')tryIn()};
function open_(){$('#lock').classList.add('hide');$('#main').classList.remove('hide');drawKey();loadStat()}
try{if(sessionStorage.getItem('t_'+SUBJECT)==='1')open_()}catch(e){}
document.querySelectorAll('.tabs [data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs [data-t]').forEach(x=>x.classList.toggle('on',x===b));$('#key').classList.toggle('hide',b.dataset.t!=='key');$('#stat').classList.toggle('hide',b.dataset.t!=='stat');$('#print').classList.toggle('hide',b.dataset.t!=='print')});
let WRONG={};  // 題目前 60 字 → 答錯人次
function drawKey(){
  let h='<div class="note noprint">紅字為答案。若學生已在網頁闖關,題號旁的紅色標籤會顯示「全班答錯人次」,幫你決定先講哪幾題。</div>';
  T.forEach((P,pi)=>{
    h+='<div class="card paper"><h2>第 '+'ABCDE'[pi]+' 卷　老師解答</h2>';
    h+='<div class="card" style="background:var(--c2);padding:8px 12px"><b>講評建議</b>:本卷共 '+P.n+' 題。'+P.secs.map(s=>s.title+'('+s.n+'題)').join('、')+'。<span class="note">題目答錯人次來自學生闖關,有資料後會自動標在題號旁。</span></div>';
    let cur=-1,k=0;
    P.qs.forEach(q=>{
      if(q.sec!==cur){cur=q.sec;h+='<div class="sec">'+'一二三四五六七八九十'[cur]+'、'+esc(q.secTitle)+'</div>';if(q.passage)h+='<div class="passage">'+q.passage+'</div>';if(q.fig)h+='<div class="figbox">'+q.fig+'</div>'}
      k++;
      const a=q.kind==='tf'?(q.ans?'×':'○'):q.kind==='choice'?'①②③④⑤⑥'[q.ans]:'';
      h+='<div class="it" data-qt="'+esc(q.qt)+'">'+(a?'<span class="paren">(<span class="ans">'+a+'</span>)</span>':'')+k+'. '+q.q+'<span class="wr hide"></span>';
      if(q.opts)h+='<div class="opts">'+q.opts.map((o,j)=>'<span>'+'①②③④⑤⑥'[j]+' '+o+'</span>').join('')+'</div>';
      if(q.kind==='self'||q.kind==='num')h+='<div class="opts ans">答:'+esc(q.ansT||'')+'</div>';
      if(q.exp)h+='<div class="exp">解析:'+esc(q.exp)+'</div>';
      if(q.efig)h+='<div class="figbox" style="margin-left:3.2em">'+q.efig+'</div>';
      h+='</div>';
    });
    h+='</div>';
  });
  $('#key').innerHTML=h;
}
function mark(){document.querySelectorAll('#key .it').forEach(el=>{const n=WRONG[el.dataset.qt];const w=el.querySelector('.wr');if(n){w.textContent='答錯 '+n+' 人次';w.classList.remove('hide')}})}
async function loadStat(){
  const box=$('#stat');box.innerHTML='<div class="card">讀取中…(約需 5～10 秒)</div>';
  const url=ENDPOINT+'?subject='+SUBJECT+'&key='+KEY;let rows=null;
  try{const c=new AbortController();setTimeout(()=>c.abort(),15000);const r=await fetch(url,{signal:c.signal});const j=await r.json();rows=j.rows||[]}catch(e){
    try{rows=await new Promise((res,rej)=>{const cb='cb'+Date.now();const s=document.createElement('script');window[cb]=j=>{res(j.rows||[]);s.remove()};s.src=url+'&callback='+cb;s.onerror=()=>rej();document.head.appendChild(s);setTimeout(()=>rej(),15000)})}catch(e2){}}
  if(rows===null){box.innerHTML='<div class="card">讀取失敗,請重新整理再試。</div><button class="btn p" onclick="loadStat()">重試</button>';return}
  if(!rows.length){box.innerHTML='<div class="card">還沒有學生交卷。學生在闖關頁完成一關後,成績會出現在這裡。</div>';return}
  const byQ={},stu={};
  rows.forEach(r=>{const nm=r.name;(stu[nm]=stu[nm]||[]).push(r);(r.ans||[]).forEach(l=>{if(l.startsWith('✗')){const m=l.match(/題目:(.*?)｜學生答/);if(m){const k=m[1].slice(0,60);byQ[k]=(byQ[k]||0)+1}}})});
  WRONG=byQ;mark();
  const top=Object.entries(byQ).sort((a,b)=>b[1]-a[1]).slice(0,10);
  let h='<div class="card"><b>🎯 最該重講的題目</b>(答錯人次)<table class="t">'+top.map(([q,n])=>'<tr><td>'+esc(q)+'</td><td style="width:60px">'+n+'</td></tr>').join('')+'</table></div>';
  h+='<div class="card"><b>👥 學生成績</b>(共 '+Object.keys(stu).length+' 位、'+rows.length+' 次交卷)<table class="t"><tr><th>姓名</th><th>各關最高分</th><th>交卷次數</th></tr>'+Object.entries(stu).map(([n,rs])=>{const b={};rs.forEach(r=>{const l='ABCDE'[Math.floor(r.round/10)-1]+'-'+(r.round%10);b[l]=Math.max(b[l]||0,r.score)});return '<tr><td>'+esc(n)+'</td><td>'+Object.keys(b).sort().map(l=>l+' '+b[l]).join('　')+'</td><td>'+rs.length+'</td></tr>'}).join('')+'</table></div>';
  h+='<button class="btn p noprint" onclick="loadStat()">重新整理</button>';box.innerHTML=h;
}
</script></body></html>
