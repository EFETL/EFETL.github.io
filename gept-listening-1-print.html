<script>
/* 圖形素材（第1回 餐廳與烹飪） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/1/${n}.jpg" alt="${n}">`;
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
// Part1 scene SVGs
const F_TABLE=`<img class="pic-img p0img" src="gept-listening-img/1/p0_q1.jpg" alt="question 1 picture">`;
const F_FRY=`<img class="pic-img p0img" src="gept-listening-img/1/p0_q2.jpg" alt="question 2 picture">`;
const F_MENU=`<img class="pic-img p0img" src="gept-listening-img/1/p0_q3.jpg" alt="question 3 picture">`;
const F_BBQ=`<img class="pic-img p0img" src="gept-listening-img/1/p0_q4.jpg" alt="question 4 picture">`;
const F_DINO=`<img class="pic-img p0img" src="gept-listening-img/1/p0_q5.jpg" alt="question 5 picture">`;
// Part4 drink SVGs
const D_COFFEE=`<svg width="80" height="80" viewBox="0 0 80 80"><path d="M22 30 h30 v20 q0 12 -15 12 q-15 0 -15 -12z" fill="#fff" stroke="#1a1a1a" stroke-width="2.4"/><path d="M52 34 h8 q6 0 6 8 t-6 8 h-6" fill="none" stroke="#1a1a1a" stroke-width="2.2"/><path d="M30 24 q3 -6 -1 -10 M40 24 q3 -6 -1 -10" fill="none" stroke="#999" stroke-width="1.6"/><ellipse cx="37" cy="66" rx="20" ry="4" fill="none" stroke="#1a1a1a" stroke-width="1.4"/></svg>`;
const D_BEER=`<svg width="80" height="80" viewBox="0 0 80 80"><path d="M26 26 h26 v34 q0 6 -6 6 h-14 q-6 0 -6 -6z" fill="#fff" stroke="#1a1a1a" stroke-width="2.4"/><path d="M52 32 h9 v20 h-9" fill="none" stroke="#1a1a1a" stroke-width="2.2"/><path d="M26 30 q4 -8 13 -6 q9 -2 13 6" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><g stroke="#1a1a1a" stroke-width="1" opacity=".5"><line x1="33" y1="40" x2="33" y2="60"/><line x1="45" y1="40" x2="45" y2="60"/></g></svg>`;
const D_TEA=`<svg width="80" height="80" viewBox="0 0 80 80"><path d="M20 32 h34 v14 q0 14 -17 14 q-17 0 -17 -14z" fill="#fff" stroke="#1a1a1a" stroke-width="2.4"/><path d="M54 36 h8 q6 0 6 8 t-6 8 h-6" fill="none" stroke="#1a1a1a" stroke-width="2.2"/><ellipse cx="37" cy="66" rx="22" ry="4" fill="none" stroke="#1a1a1a" stroke-width="1.6"/><path d="M30 27 q3 -6 -1 -10 M42 27 q3 -6 -1 -10" fill="none" stroke="#999" stroke-width="1.6"/></svg>`;
// Part4 receipt SVG
const RC=(total)=>`<svg width="118" height="126" viewBox="0 0 118 128"><rect x="8" y="8" width="102" height="112" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><text x="59" y="27" text-anchor="middle" font-size="12" font-weight="700">BILL</text><text x="16" y="48" font-size="11">BBQ set</text><text x="102" y="48" text-anchor="end" font-size="11">200</text><text x="16" y="67" font-size="11">Drink</text><text x="102" y="67" text-anchor="end" font-size="11">50</text><line x1="16" y1="77" x2="102" y2="77" stroke="#1a1a1a"/><text x="16" y="98" font-size="12" font-weight="700">Total</text><text x="102" y="98" text-anchor="end" font-size="13" font-weight="700">${total}</text></svg>`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:F_TABLE,o:["A coffee cup and a bottle of beer on a saucer.","A coffee cup and a teapot on a saucer.","A teapot and a bottle of beer on a tray."],a:1,sen:"For question one, look at the picture. What is on the table?",szh:"第一題，請看圖片。桌上有什麼？",en:"A coffee cup and a teapot are on a saucer.",zh:"選 B。桌上的白色小盤（saucer）上放著一個咖啡杯（coffee cup）和一個茶壺（teapot），沒有啤酒瓶（bottle of beer）。"},
{n:2,p:0,fig:F_FRY,o:["He is frying eggs in the kitchen.","He is baking bread in the kitchen.","He is washing dishes in the kitchen."],a:0,sen:"For question two, look at the picture. What is the cook doing in the kitchen?",szh:"第二題，請看圖片。廚師在廚房裡做什麼？",en:"He is frying eggs in the kitchen.",zh:"廚師(cook)正在廚房(kitchen)煎(fry)蛋，選 A。B 是烤麵包、C 是洗碗，動作不同。"},
{n:3,p:0,fig:F_MENU,o:["The waitress is holding a tray at the cafe.","The waitress is holding a menu at the cafe.","The waitress is holding a teapot at the cafe."],a:1,sen:"For question three, look at the picture. What is the waitress holding?",szh:"第三題，請看圖片。女服務生拿著什麼？",en:"The waitress is holding a menu.",zh:"女服務生(waitress)在咖啡館(cafe)拿著菜單(menu)，選 B。A 托盤、C 茶壺都不是她手上拿的東西。"},
{n:4,p:0,fig:F_BBQ,o:["They are having a picnic and drinking beer.","They are having a barbecue and drinking tea.","They are having a barbecue and drinking beer."],a:2,sen:"For question four, look at the picture. What are the people doing?",szh:"第四題，請看圖片。人們在做什麼？",en:"They are having a barbecue and drinking beer.",zh:"人們在烤肉(barbecue)、喝啤酒(beer)，選 C。A 是野餐、B 喝的是茶，都和圖片不同。"},
{n:5,p:0,fig:F_DINO,o:["It is a cute dessert shaped like a cat.","It is a cute dessert shaped like a dinosaur.","It is a cute dessert shaped like a heart."],a:1,sen:"For question five, look at the picture. What does the dessert look like?",szh:"第五題，請看圖片。這個甜點看起來像什麼？",en:"It is a cute dessert shaped like a dinosaur.",zh:"這是一個做成恐龍(dinosaur)形狀、很可愛(cute)的甜點(dessert)，選 B。貓和愛心都不是圖中的形狀。"},

{n:6,p:1,o:["Yes, please. I prefer chocolate cake.","I ate lunch at noon.","It cost about five dollars."],a:0,sen:"Would you like some dessert after your meal?",szh:"用餐後想來點甜點嗎？",en:"Offered dessert; the reply says which cake they prefer.",zh:"問要不要甜點，答『好的，我比較喜歡(prefer)巧克力蛋糕』，選 A。B 回答吃飯時間、C 回答價錢，都沒回答問題。"},
{n:7,p:1,o:["It opens around seven o'clock.","That cafe doesn't exist anymore.","I always have tea in the morning."],a:0,sen:"What time does the cafe open in the morning?",szh:"咖啡館早上幾點開？",en:"Asking the opening time; it opens around seven.",zh:"問咖啡館幾點開，答『大約七點』，選 A。B 說店已不存在(exist)，C 在講自己的習慣，都沒回答時間。"},
{n:8,p:1,o:["I usually go there on Fridays.","The coffee here is really strong.","There's one on the upper floor."],a:2,sen:"Excuse me, where can I find a good coffee bar?",szh:"請問哪裡有不錯的咖啡吧？",en:"Asking where; there is one on the upper floor.",zh:"問哪裡有咖啡吧(bar)，答『樓上(upper)有一間』，選 C。A 回答時間、B 在說咖啡濃淡，都沒回答地點。"},
{n:9,p:1,o:["It went well. I start on Monday.","It was last Friday afternoon.","Whatever you want is fine with me."],a:0,sen:"How was your interview at the new restaurant?",szh:"你在新餐廳的面試如何？",en:"Asking how the interview went; it went well.",zh:"問面試(interview)如何，答『很順利，我週一開始上班』，選 A。B 回答的是時間，C 答非所問。"},
{n:10,p:1,o:["Yes, we have both kinds of wine.","Our special today is barbecue chicken.","Yes, we serve lunch until two."],a:0,sen:"Do you serve wine from France or America?",szh:"你們有法國或美國的酒嗎？",en:"They have wine from both France and America.",zh:"問有沒有法國(France)或美國(America)的酒(wine)，答『兩種都有』，選 A。B 講今日特餐、C 講午餐時間，都沒回答酒的問題。"},
{n:11,p:1,o:["I'd like the soup, please.","There's a big sign on the door.","Sure. Do you have a pen?"],a:2,sen:"Could you sign here to confirm your order?",szh:"可以在這裡簽名確認餐點嗎？",en:"Asked to sign; the reply asks for a pen.",zh:"請對方簽名(sign)，答『好，你有筆(pen)嗎？』，選 C。B 重複 sign 一字但答非所問，A 是在點餐。"},
{n:12,p:1,o:["I searched everywhere for the key.","Our head cook will do it.","It cost about two thousand dollars."],a:1,sen:"Who will operate the new oven in the kitchen?",szh:"誰會操作廚房裡的新烤箱？",en:"The head cook will operate the oven.",zh:"問誰操作(operate)新烤箱，答『我們的主廚(cook)會做』，選 B。A 在說找(search)鑰匙、C 回答價錢，都不是回答『誰』。"},
{n:13,p:1,o:["The forks are in the drawer.","That brown table is really old.","Sure, I'll do it right now."],a:2,sen:"Would you do me a favor and clear the table?",szh:"可以幫我一個忙、清理桌子嗎？",en:"Asked a favor to clear the table; agreeing.",zh:"請對方幫忙(favor)清理桌子，答『好，我馬上做』，選 C。A 講叉子在抽屜(drawer)、B 講棕色(brown)桌子很舊，都沒有回應請求。"},
{n:14,p:1,o:["Thanks! I made it myself.","It happened last night at home.","No, the cafeteria is closed today."],a:0,sen:"This tomato soup tastes wonderful!",szh:"這番茄湯真好喝！",en:"Praised the soup; the cook thanks you and says she made it.",zh:"稱讚番茄湯好喝(taste)，回『謝謝，我自己做的』，選 A。B 說事情發生(happen)的時間、C 提到自助餐廳(cafeteria)，與稱讚無關。"},
{n:15,p:1,o:["I like to sit by the window.","Hot tea would be nice.","It's a cold day today."],a:1,sen:"Do you want a hot drink or a cold one?",szh:"你想喝熱的還是冷的？",en:"Choosing a hot drink: hot tea.",zh:"問要熱的還是冷的飲料(drink)，答『熱茶(tea)不錯』，選 B。C 提到 cold 但只是在說天氣，沒有回答選擇。"},

{n:16,p:2,o:["At a library.","At a bank.","At a restaurant."],a:2,
 sen:"W: Good evening. Do you have a table for two? &nbsp;M: Yes, would you prefer the dining room or a seat at the bar? &nbsp;W: The dining room, please. &nbsp;Q: Where are they?",
 szh:"女：晚安，有兩人的位子嗎？　男：有，您想坐餐廳區(dining room)還是吧台(bar)？　女：餐廳區，謝謝。　問：他們在哪裡？",
 en:"Asking for a table, dining room or bar — a restaurant.",zh:"問訂位、餐廳區或吧台，判斷在餐廳，選 C。"},
{n:17,p:2,o:["A driver.","A waiter.","A doctor."],a:1,
 sen:"M: May I take your order? &nbsp;W: Yes, I will have the barbecue chicken and a soft drink. &nbsp;M: Good choice. &nbsp;Q: What is the man's job?",
 szh:"男：請問要點餐了嗎？　女：好，我要烤雞(barbecue)和一杯汽水(soft drink)。　男：好選擇(choice)。　問：男士的工作是什麼？",
 en:"Taking an order — he is a waiter.",zh:"由『請問要點餐嗎』可知他是服務生(waiter)，選 B。"},
{n:18,p:2,o:["Some soup.","A cold drink.","A dessert."],a:2,sen:"W: Would you like anything else, sir? &nbsp;M: I'm full, but I still want something sweet. &nbsp;W: Our chocolate cake is very popular. &nbsp;M: Good, I'll try a piece. &nbsp;Q: What will the man order?",szh:"女：先生，還要別的嗎？　男：我吃飽了，但還是想吃點甜的。　女：我們的巧克力蛋糕很受歡迎。　男：好，我來一塊。　問：男士會點什麼？",en:"He wants something sweet: chocolate cake, a dessert.",zh:"男士想吃甜的、點蛋糕，也就是甜點(dessert)，選 C。他已經吃飽，所以不是再點湯；飲料也沒有被提到。"},
{n:19,p:2,o:["They are angry at the team.","They are cheering for the team.","They are playing for the team."],a:1,sen:"W: Did you hear the people shouting outside? &nbsp;M: Yes. Our school team just won the game. &nbsp;W: Great! Everyone is so happy. &nbsp;Q: What are the people outside doing?",szh:"女：你有聽到外面的人在大叫嗎？　男：有，我們學校的隊伍剛剛贏了比賽。　女：太棒了！大家都好開心。　問：外面的人在做什麼？",en:"They are shouting happily because the team won — cheering.",zh:"隊伍贏了、大家很開心地喊叫，表示他們在歡呼(cheer)，選 B。A 生氣不符合『很開心』；C 在比賽的是球員，不是外面的人。"},
{n:20,p:2,o:["A barbecue.","Fried fish.","Toast."],a:1,
 sen:"W: What is today's special? &nbsp;M: Fried fish with carrots and tomatoes. &nbsp;W: Sounds delicious. I will take it. &nbsp;Q: What will the woman eat?",
 szh:"女：今天的特餐是什麼？　男：香煎魚(fried fish)配胡蘿蔔(carrot)和番茄(tomato)。　女：聽起來很好吃，我要這個。　問：女士會吃什麼？",
 en:"She orders the fried fish special.",zh:"她點了今日特餐『香煎魚(fried fish)』，選 B。"},
{n:21,p:2,o:["Buy a new pillow.","Go to bed early tonight.","Sleep for a little while."],a:2,sen:"W: You look very tired today. &nbsp;M: Yes. My pillow was too hard, so I slept badly. &nbsp;W: Why don't you close your eyes for ten minutes after lunch? &nbsp;Q: What does the woman suggest?",szh:"女：你今天看起來很累。　男：對，我的枕頭(pillow)太硬，我睡不好。　女：午餐後何不閉眼休息十分鐘？　問：女士建議什麼？",en:"She suggests closing his eyes for ten minutes — a short sleep.",zh:"女士建議午餐後閉眼十分鐘，也就是睡一小會兒，選 C。A 買枕頭(pillow)是男士提到的原因，不是女士的建議。"},
{n:22,p:2,o:["On the upper floor.","In the kitchen.","Behind the bar."],a:0,
 sen:"W: Excuse me, where is the restroom? &nbsp;M: Go up to the upper floor, down the narrow hallway. &nbsp;W: Thank you. &nbsp;Q: Where is the restroom?",
 szh:"女：不好意思，洗手間在哪裡？　男：上樓到上層(upper)，走窄窄的(narrow)走廊。　女：謝謝。　問：洗手間在哪裡？",
 en:"It's on the upper floor.",zh:"洗手間在上層(upper floor)，選 A。"},
{n:23,p:2,o:["Right now.","Next week.","The next day."],a:2,sen:"M: Here is my credit card. &nbsp;W: I'm sorry, sir. We only take cash today. &nbsp;M: I have no money with me. &nbsp;W: Please sign here with this pen and pay tomorrow. &nbsp;Q: When will the man pay?",szh:"男：這是我的信用卡。　女：抱歉，先生，我們今天只收現金。　男：我身上沒有錢。　女：請用這支筆(pen)在這裡簽名(sign)，明天再付。　問：男士什麼時候付款？",en:"She tells him to sign and pay tomorrow, the next day.",zh:"女士請他簽名、明天再付，也就是隔天，選 C。他今天沒有現金，所以不是現在(A)；也沒說下週(B)。"},
{n:24,p:2,o:["When it is still dark.","At six in the evening.","After the sun comes up."],a:0,sen:"W: Your cafe opens very early, right? &nbsp;M: Yes. I get up at four, but the sun does not come up until six. &nbsp;W: So it is still dark when you open? &nbsp;M: Yes, always. &nbsp;Q: When does the man open the cafe?",szh:"女：你的咖啡館(cafe)開得很早，對吧？　男：對，我四點起床，但太陽六點才升起。　女：所以你開店時天還是黑的？　男：對，一直都是。　問：男士何時開店？",en:"He opens when the sun is not up yet, so it is still dark.",zh:"太陽六點才升起，而他開店時天還是黑的，選 A。C 的太陽升起是干擾（六點是日出時間，不是他開店時間）。"},
{n:25,p:2,o:["The oven is making smoke.","The menu is wrong.","The coffee is cold."],a:0,
 sen:"M: Waiter, something in the oven is burning! &nbsp;W: Don't worry, it is just some smoke. There is no fire. &nbsp;Q: What is the problem?",
 szh:"男：服務生，烤箱(oven)裡有東西燒焦了！　女：別擔心，只是一些煙，沒有起火(fire)。　問：問題是什麼？",
 en:"The oven is making smoke (but no fire).",zh:"烤箱(oven)冒煙，但沒有火(fire)，選 A。"},

{n:26,p:3,pic:true,o:[IMG('coffee'),IMG('tea'),IMG('beer')],a:1,
 sen:"I went to the cafe after work. I was very thirsty, but I did not want coffee because it was late at night. I do not drink beer or wine either. So in the end, I ordered a nice hot cup of tea. It was just what I needed. &nbsp;Q: What did the speaker order?",
 szh:"我下班後去咖啡館(cafe)。我很渴，但因為很晚了，不想喝咖啡(coffee)；我也不喝啤酒(beer)或酒(wine)。所以最後我點了一杯熱茶(tea)，正好解渴。　問：說話者點了什麼？",
 en:"Not coffee, beer or wine — in the end a hot cup of tea.",zh:"不喝咖啡、啤酒、酒，最後點了熱茶(tea)，選 B。"},
{n:27,p:3,pic:true,o:[BARS("Favorite Dessert",["Cake","Ice cream","Carrot"],[80,55,20]),BARS("Favorite Dessert",["Cake","Ice cream","Carrot"],[50,80,25]),BARS("Favorite Dessert",["Cake","Ice cream","Carrot"],[30,55,80])],a:0,sen:"Our cafe asked one hundred customers about their favorite dessert. The results were clear. Chocolate cake was the most popular. Ice cream came in second. Only a few people chose carrot cake. So we will bake more chocolate cake from now on. &nbsp;Q: Which chart shows the result?",szh:"我們咖啡館(cafe)問了一百位客人最愛的甜點(dessert)。結果很清楚(clear)：巧克力蛋糕最受歡迎、冰淇淋第二、只有少數人選胡蘿蔔(carrot)蛋糕。所以我們以後會多烤(bake)一些巧克力蛋糕。　問：哪一張圖表符合結果？",en:"Cake most, ice cream second, carrot fewest — Cake tallest, Carrot shortest.",zh:"蛋糕最多、冰淇淋次之、胡蘿蔔(carrot)最少，符合『Cake 最高、Carrot 最低』的圖表，選 A。"},
{n:28,p:3,pic:true,o:[RC("200"),RC("250"),RC("300")],a:1,
 sen:"At the restaurant I ordered a barbecue set for two hundred dollars and a soft drink for fifty dollars. The waiter said there was no extra charge. So the total on my bill was two hundred and fifty dollars. &nbsp;Q: Which receipt is correct?",
 szh:"我在餐廳點了兩百元的烤肉(barbecue)套餐和五十元的汽水(soft drink)。服務生(waiter)說沒有額外費用，所以帳單總共兩百五十元。　問：哪一張收據正確？",
 en:"200 + 50 = 250, no extra charge.",zh:"200＋50＝250，無額外費用，總額 250，選 B。"},
{n:29,p:3,pic:true,o:[CLK(8,0),CLK(7,0),CLK(6,0)],a:2,sen:"The cafe near my house opens early every day. On weekdays it opens at seven A.M., but on weekends it opens even earlier, at six A.M., before dawn. I cannot deny that the first cup of coffee there is the best part of my morning. Today is Sunday, so I can go at six. &nbsp;Q: What time does the cafe open today?",szh:"我家附近的咖啡館(cafe)每天都開得早。平日早上七點(A.M.)開，但週末更早，清晨(dawn)前的六點就開。我不得不承認，那裡的第一杯咖啡是我早晨最棒的時刻。今天是星期日，所以我六點就能去。　問：咖啡館今天幾點開？",en:"Today is Sunday (weekend), so it opens at six.",zh:"今天週日(週末)，六點開，選 C(6:00)。七點是平日(干擾)。"},
{n:30,p:3,pic:true,o:[IMG('rice'),IMG('bread'),IMG('noodles')],a:2,
 sen:"For dinner tonight I did not want to cook. I thought about frying some fish or baking bread in the oven, but I was too tired. In the end, I just ordered a big bowl of hot noodles from the restaurant near my home. &nbsp;Q: What did the speaker have for dinner?",
 szh:"今晚我不想煮(cook)飯。我想過煎(fry)魚或用烤箱(oven)烤(bake)麵包，但太累了。最後我只是向家附近的餐廳點了一大碗熱麵。　問：說話者晚餐吃了什麼？",
 en:"Too tired to cook; ordered a bowl of noodles.",zh:"懶得煮，最後點了一碗熱麵，選 C。麵包、白飯是他想過但沒做的(干擾)。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 1 回　餐廳與烹飪　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
