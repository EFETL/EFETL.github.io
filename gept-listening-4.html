<title>GEPT 初級 聽力測驗　第4回　心情與感受</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#fff5ec,#fff9f4 70%);color:#22303f;line-height:1.6;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#f6d365,#fda085 60%,#ff7a9c);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(253,160,133,.35);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.14);}
  header.top p{margin:0;font-size:.92rem;opacity:.96;}
  .meta{margin-top:14px;font-size:.86rem;background:rgba(255,255,255,.24);
    padding:9px 13px;border-radius:10px;}
  .notice{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;
    padding:11px 15px;margin-bottom:14px;font-size:.86rem;color:#78350f;
    display:flex;align-items:flex-start;gap:9px;line-height:1.55;}
  .notice .ic{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#fff5ec 70%,rgba(255,245,236,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.9rem;
    box-shadow:0 4px 12px rgba(253,160,133,.14);}
  .bar .track{flex:1;height:9px;background:#f1e4dc;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#ffb02e,#ff7a59);transition:width .35s;}
  .bar #count{font-weight:700;color:#e0740a;}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#43cea2,#3ab0d6);}
  .section-desc{font-size:.86rem;color:var(--gray);margin:0 4px 10px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(253,160,133,.09);}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .qhead .num{display:inline-block;color:#fff;background:var(--coral);font-weight:700;
    border-radius:8px;padding:1px 10px;font-size:.92rem;}
  .play{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
    color:#fff;font-weight:800;font-size:.92rem;border-radius:22px;padding:8px 16px;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);box-shadow:0 4px 12px rgba(255,93,143,.3);}
  .play:active{transform:translateY(1px);}
  .play.playing{background:linear-gradient(135deg,#22b573,#1a9e63);}
  .play .wave{font-size:.8rem;opacity:.9;}
  .hintq{font-size:.8rem;color:var(--gray);}
  .fig{text-align:center;margin:4px 0 12px;}
  .fig svg{max-width:100%;height:auto;}
  .pic-img{border-radius:9px;border:1px solid #e6ded7;object-fit:cover;}
  .fig .pic-img{max-width:230px;width:100%;max-height:150px;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:.95rem;background:#fbfdff;}
  .opt:hover{border-color:var(--coral);background:#fff4ee;}
  .opt input{margin-top:3px;accent-color:var(--coral);}
  .opt .lab{font-weight:800;color:var(--coral);min-width:18px;}
  .opt.sel{border-color:var(--coral);background:#ffeee6;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .opt.listen .otext{display:none;}
  .opt.listen.lock .otext{display:inline;}
  .opt.listen .lab{font-size:1.05rem;}
  /* picture options (Part 4) */
  .picopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0;}
  .picopt{border:2px solid var(--line);border-radius:12px;padding:9px 6px;cursor:pointer;
    text-align:center;transition:.15s;background:#fbfdff;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .picopt:hover{border-color:var(--coral);background:#fff4ee;}
  .picopt.sel{border-color:var(--coral);background:#ffeee6;}
  .picopt.correct{border-color:var(--green);background:var(--green-bg);}
  .picopt.wrong{border-color:var(--red);background:var(--red-bg);}
  .picopt .lab{font-weight:800;color:var(--coral);align-self:flex-start;margin-left:4px;}
  .picopt.correct .lab{color:var(--green);}.picopt.wrong .lab{color:var(--red);}
  .picopt img.pic-img{width:100%;height:82px;}
  .picopt svg{width:100%;max-width:132px;height:auto;}
  .picopt svg.chart{max-width:100%;}
  .legend{display:flex;gap:12px;justify-content:center;font-size:.72rem;margin:2px 0 6px;color:#556;flex-wrap:wrap;}
  .legend i{display:inline-block;width:11px;height:11px;border:1px solid #999;margin-right:4px;vertical-align:-1px;}
  table.mini{border-collapse:collapse;font-size:.62rem;margin:0 auto;}
  table.mini th{background:#33414f;color:#fff;padding:2px 4px;}
  table.mini td{border:1px solid #bbb;padding:2px 4px;text-align:center;}
  .board{background:#111;color:#ffd24a;border-radius:5px;padding:5px;font-family:"Courier New",monospace;display:inline-block;}
  .board table{border-collapse:collapse;font-size:.6rem;color:#ffd24a;}
  .board th{color:#7fd7ff;padding:1px 4px;border-bottom:1px solid #444;}
  .board td{padding:1px 4px;text-align:center;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.9rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:.8rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .scriptbox{background:#f4f8ff;border-radius:8px;padding:7px 11px;margin:5px 0;font-size:.88rem;color:#20364d;}
  .exp .scriptbox b{color:var(--blue-dark);}
  .exp .en{color:#1c4f7a;background:#eef7ff;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .exp .zh{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff9f4 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--coral);border:2px solid var(--coral);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#ffb02e,#ff7a59,#ff5d8f);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(255,122,89,.18);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#ff7a59,#ff5d8f);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:.95rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:.95rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:.85rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:.8rem;margin:24px 0;}
.fig .p0img{max-width:440px;max-height:330px;width:100%;height:auto;}
</style>

<div class="wrap">

  <div class="notice">

  </div>
  <a href="gept-listening-progress.html" style="display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #3ab0d6;color:#0a6a86;border-radius:12px;padding:11px 16px;margin-bottom:18px;text-decoration:none;font-size:.9rem;font-weight:700;box-shadow:0 3px 10px rgba(58,176,214,.16);">
    <span>📈</span><span>我的成績 · 錯題回收 — 作答後看進步曲線、最弱單字與題型、一鍵重練</span>
  </a>

<script>
/* ====== 圖形素材（第4回 心情與感受） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/4/${n}.jpg" alt="${n}">`;
const FACE=(mood)=>`<img class="pic-img" src="gept-listening-img/4/face_${mood}.jpg" alt="${mood}">`;
const FACES=(mood)=>`<div style="text-align:center">${FACE(mood)}</div>`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
/* ====== 大題 ====== */
const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];



/* ====== 題庫（第4回 心情與感受） ====== */
const Q=[
{n:1,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q1.jpg" alt="question 1 picture">`,o:["She feels nervous, with a worried face.","She feels sad, with tears in her eyes.","She feels happy, with a bright and pleased smile."],a:2,sen:"For question one, look at the picture. How does the girl feel?",szh:"第一題，請看圖片。女孩感覺如何？",en:"She feels happy and pleased.",zh:"她開心(happy)，帶著明亮(bright)、滿意(pleased)的笑容，選 C。A 緊張(nervous)、B 難過(sad)的表情都和圖不同。"},
{n:2,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q2.jpg" alt="question 2 picture">`,o:["He looks excited; his joy is easy to see.","He looks afraid; his fear is easy to see.","He looks angry; his anger is easy to see."],a:2,sen:"For question two, look at the picture. How does the man look?",szh:"第二題，請看圖片。男士看起來如何？",en:"He looks angry; his anger is easy to see.",zh:"他看起來生氣(angry)，怒氣(anger)很明顯，選 C。A 興奮(excited)、B 害怕(afraid)的情緒都不是圖中男士的表情。"},
{n:3,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q3.jpg" alt="question 3 picture">`,o:["He is afraid; fear and shock show on his face.","He is happy; joy and pleasure show on his face.","He is mad; anger shows on his face."],a:0,sen:"For question three, look at the picture. How does the boy feel?",szh:"第三題，請看圖片。男孩感覺如何？",en:"He is afraid; fear shows on his face.",zh:"他害怕(afraid)，臉上滿是恐懼(fear)與驚嚇(shock)，選 A。B 開心、C 生氣(mad)的表情都不符。"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q4.jpg" alt="question 4 picture">`,o:["She is surprised, and her eyes are wide.","She is satisfied, and she smiles.","She is sleepy, and she yawns."],a:0,sen:"For question four, look at the picture. What is her reaction?",szh:"第四題，請看圖片。她的反應是什麼？",en:"She is surprised, and her eyes are wide open.",zh:"選 A。她睜大眼睛、嘴巴張開，看起來很驚訝（surprised）；不是滿意（satisfied）微笑（smiles），也不是想睡（sleepy）打哈欠（yawns）。"},
{n:5,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q5.jpg" alt="question 5 picture">`,o:["She feels happy, excited, and proud.","She feels down, blue, and sad.","She feels nervous, afraid, and alone."],a:1,sen:"For question five, look at the picture. How does she feel today?",szh:"第五題，請看圖片。她今天心情如何？",en:"She feels down, blue and sad.",zh:"她情緒低落(down)、憂鬱(blue)、有點難過(sad)，選 B。A 是開心興奮、C 是緊張害怕，心情都不同。"},

{n:6,p:1,o:["I have a big exam this week.","At twelve o'clock, I think.","Don't be so nervous. It's easy."],a:0,sen:"Why do you look so nervous today?",szh:"你今天怎麼看起來這麼緊張？",en:"I have a big exam this week.",zh:"問為何緊張(nervous)，答『這週有大考』，選 A。A 回答時間、C 重複 nervous 但是在安慰人，都沒回答原因。"},
{n:7,p:1,o:["I'm so excited. It's marvelous!","I read the news every morning.","It will come by mail soon."],a:0,sen:"How do you feel about the good news?",szh:"你對這個好消息有什麼感覺？",en:"I'm so excited. It's marvelous!",zh:"問對好消息的感覺，答『我好興奮(excite)，太棒了(marvelous)』，選 A。B 重複 news 但講習慣、C 講消息會寄來(come)，都沒說感覺。"},
{n:8,p:1,o:["I have a long list of them.","My brother likes to copy me.","Cooking. I make yummy dumplings."],a:2,sen:"What is your favorite hobby?",szh:"你最喜歡的嗜好是什麼？",en:"Cooking; I make yummy dumplings.",zh:"問最喜歡的嗜好(hobby)，答『煮菜，我做好吃的(yummy)水餃(dumpling)』，選 C。A 說有一長串(list)清單、B 說弟弟愛模仿(copy)，都沒說出嗜好。"},
{n:9,p:1,o:["It was in the school gym.","Yes, I'm very satisfied with it.","We'll get it back next week."],a:1,sen:"Are you happy with your test result?",szh:"你對考試結果滿意嗎？",en:"Yes, I'm very satisfied with it.",zh:"問對成績是否滿意，答『是，我很滿意(satisfy)』，選 B。A 回答地點、C 說何時發回，都沒回答是否滿意。"},
{n:10,p:1,o:["He looks just like his father.","He turns twelve next month.","He went to bed after midnight."],a:2,sen:"Why does the boy look so sleepy?",szh:"男孩為什麼看起來這麼想睡？",en:"He went to bed after midnight.",zh:"問男孩為何想睡，答『他過了午夜(midnight)才睡』，選 C。A 講長相、B 講十二(twelve)歲生日，都不是原因。"},
{n:11,p:1,o:["I prepared for the test last week.","In the park near my home.","A basket of eggs and hamburgers."],a:2,sen:"What did you prepare for the picnic?",szh:"你為野餐準備了什麼？",en:"A basket of eggs and hamburgers.",zh:"問野餐準備(prepare)了什麼，答『一籃(basket)蛋(egg)和漢堡(hamburger)』，選 C。A 重複 prepare 但講考試、B 回答地點，都沒回答準備了什麼。"},
{n:12,p:1,o:["I don't have any tickets left.","It was humorous. We laughed a lot.","The show starts at seven o'clock."],a:1,sen:"How was the comedy show last night?",szh:"昨晚的喜劇表演如何？",en:"It was humorous; we laughed a lot.",zh:"問喜劇表演如何，答『很幽默(humorous)，我們笑很多』，選 B。A 講票的事、C 講開演時間，都沒評論表演。"},
{n:13,p:1,o:["Since last week, I think.","Something smells good in the kitchen.","Yes, I have a strange feeling."],a:2,sen:"Do you sense that something is wrong?",szh:"你有感覺到不對勁嗎？",en:"Yes, I have a strange feeling.",zh:"問是否感覺(sense)到不對勁，答『是，我有種奇怪的感覺(feeling)』，選 C。A 的 since 聽起來像 sense 但在說時間、B 重複 something 卻是在講味道。"},
{n:14,p:1,o:["He broke my toy on purpose.","I'll see him around twelve.","He is my cousin from Asia."],a:0,sen:"Why are you so angry at him?",szh:"你為什麼這麼生他的氣？",en:"He broke my toy on purpose.",zh:"問為何生他的氣(angry)，答『他故意弄壞我的玩具(toy)』，選 A。B 說何時見他、C 介紹他是誰，都不是原因。"},
{n:15,p:1,o:["I walked backward to the door.","It lasted until midnight.","The loud sound shocked me."],a:2,sen:"What surprised you at the party?",szh:"派對上什麼事讓你驚訝？",en:"The loud sound shocked me.",zh:"問什麼讓你驚訝(surprise)，答『巨大的聲音嚇到(shock)我』，選 C。A 說自己往後(backward)走、B 說持續到何時，都沒說驚訝的事。"},

{n:16,p:2,o:["Angry and mad.","Happy and pleased.","Afraid and blue."],a:1,
 sen:"W: How did you feel when you won? &nbsp;M: I was so happy and pleased, it was a bright day. &nbsp;W: Wonderful. &nbsp;Q: How did the man feel?",
 szh:"女：你贏的時候感覺如何？　男：我又開心(happy)又滿意(pleased)，真是明亮(bright)的一天。　女：太好了。　問：男士感覺如何？",
 en:"Happy and pleased.",zh:"男士又開心(happy)又滿意(pleased)，選 B。"},
{n:17,p:2,o:["A cockroach.","A butterfly.","A mouse."],a:0,sen:"M: Why did your sister scream just now? &nbsp;W: She saw a big brown bug fly across the kitchen. &nbsp;M: Oh no! Is she okay? &nbsp;W: Yes, but she hates them. &nbsp;Q: What frightened the sister?",szh:"男：你妹妹剛剛為什麼尖叫？　女：她看到一隻大大的棕色蟲子飛過廚房。　男：天啊！她還好嗎？　女：還好，但她很討厭牠們。　問：什麼嚇到妹妹？",en:"A big brown bug flew across the kitchen — a cockroach.",zh:"飛過廚房的大棕色蟲子是蟑螂(cockroach)，選 A。蝴蝶(butterfly)也會飛，但不會讓人尖叫、討厭；老鼠不會飛。"},
{n:18,p:2,o:["Because he lost his wallet.","Because of exam stress.","Because he missed the bus."],a:1,sen:"W: You look down. What's wrong? &nbsp;M: I feel a lot of stress before the exam, and I'm nervous. &nbsp;W: Relax. &nbsp;Q: Why does the man feel down?",szh:"女：你看起來很低落(down)，怎麼了？　男：考試前我壓力(stress)很大，很緊張(nervous)。　女：放輕鬆。　問：男士為何心情低落？",en:"Exam stress makes him nervous.",zh:"考試壓力(stress)讓他緊張(nervous)、低落(down)，選 B。弄丟錢包、錯過公車都沒提到。"},
{n:19,p:2,o:["The Lantern Festival.","A school sports day.","A family birthday."],a:0,sen:"M: Why are so many people excited tonight? &nbsp;W: It's the Lantern Festival; people all over Asia celebrate it. &nbsp;M: How lively! &nbsp;Q: What are the people celebrating?",szh:"男：今晚為什麼這麼多人興奮(excite)？　女：是元宵節(Lantern Festival)，全亞洲(Asia)的人(people)都在慶祝。　男：好熱鬧！　問：人們在慶祝什麼？",en:"The Lantern Festival.",zh:"人們在慶祝元宵節(Lantern Festival)，選 A。運動會和生日都沒有提到。"},
{n:20,p:2,o:["A school play.","An international show.","A cooking class."],a:1,sen:"W: How was the concert? &nbsp;M: It was an international show, truly marvelous and yummy snacks too. &nbsp;W: Sounds great. &nbsp;Q: What kind of show was it?",szh:"女：演唱會如何？　男：那是國際(international)級的演出，真是太棒了(marvelous)，點心也很好吃(yummy)。　女：聽起來很讚。　問：那是什麼樣的演出？",en:"An international, marvelous show.",zh:"那是國際(international)級、很棒(marvelous)的演出，選 B。提到點心(yummy)只是附帶，不是演出種類。"},
{n:21,p:2,o:["Very exciting.","A little scary.","Just an ordinary one."],a:2,sen:"M: Did you do anything special this weekend? &nbsp;W: Not really. I cleaned my room, watched TV, and went to bed early, like I usually do. &nbsp;Q: How was the woman's weekend?",szh:"男：你這個週末有做什麼特別的事嗎？　女：沒有，我打掃(clean)房間、看電視、早睡，跟平常(usual)一樣。　問：女士的週末如何？",en:"She did what she usually does — an ordinary weekend.",zh:"她做的都是平常(usual)會做的事，所以是平凡的(ordinary)一個週末，選 C。她說沒有特別的事，所以不會是很刺激或可怕。"},
{n:22,p:2,o:["Take a long rest.","Ask the teacher for help.","Focus on studying."],a:2,sen:"W: I have a big test tomorrow, and I feel so nervous. &nbsp;M: Turn off your phone and read your notes again. You will be fine. &nbsp;W: Okay, I will try. &nbsp;Q: What does the man suggest?",szh:"女：我明天有一場大考，我好緊張。　男：把手機關掉，再讀一次筆記，你會沒事的。　女：好，我試試看。　問：男士建議什麼？",en:"Turn off the phone and read notes — focus on studying.",zh:"男士要她關手機、再讀筆記，就是專心(focus)讀書，選 C。休息(A)和問老師(B)都不是他說的。"},
{n:23,p:2,o:["He is angry with her.","He is deaf.","He is very sleepy."],a:1,sen:"W: Your uncle did not turn around when I called him. &nbsp;M: He did not hear you. He cannot hear at all. &nbsp;W: Oh, I did not know that. &nbsp;Q: What is the matter with the uncle?",szh:"女：我叫你叔叔，他都沒有回頭。　男：他沒聽到你，他完全聽不到。　女：喔，我不知道。　問：叔叔怎麼了？",en:"He cannot hear at all — he is deaf.",zh:"叔叔完全聽不到，就是聾人(deaf)，選 B。他沒回頭不是生氣(A)或想睡(C)，而是聽不到。"},
{n:24,p:2,o:["A big dog scared him.","He heard a funny joke.","He wanted to go home."],a:0,sen:"W: Why did the boy step back so quickly? &nbsp;M: A big dog ran toward him. &nbsp;W: No wonder! I am afraid of big dogs, too. &nbsp;Q: Why did the boy step back?",szh:"女：男孩為什麼那麼快往後退？　男：一隻大狗朝他跑過去。　女：難怪(wonder)！我也怕大狗。　問：男孩為何後退？",en:"A big dog ran toward him and scared him.",zh:"大狗跑向他，嚇到他才往後退，選 A。笑話和回家都沒提到。"},
{n:25,p:2,o:["It has a big garden.","It is convenient to live in.","It looks very new."],a:1,sen:"M: How do you like your new home? &nbsp;W: It is two minutes from the MRT station, and the supermarket is next door. &nbsp;M: Nice! &nbsp;W: It is also small, so it is easy to clean. &nbsp;Q: What does the woman like about her new home?",szh:"男：你喜歡你的新家嗎？　女：離捷運站兩分鐘，隔壁就是超市。　男：真不錯！　女：它也很小，所以很好打掃(clean)。　問：女士喜歡新家的什麼？",en:"It is near the station and the supermarket — convenient.",zh:"離捷運站和超市都很近，代表生活方便(convenient)，選 B。她說房子小，所以沒有大花園。"},

{n:26,p:3,pic:true,o:[FACE('happy'),FACE('sad'),FACE('angry')],a:0,
 sen:"Today was a marvelous day for me. In the morning I was a little nervous about my speech, but it went well. My friends came to cheer for me, and I felt so happy and pleased. All my stress was gone by the afternoon. &nbsp;Q: How does the speaker feel at the end?",
 szh:"今天對我來說是很棒(marvelous)的一天。早上我對演講有點緊張(nervous)，但很順利。朋友們來(come)為我加油，我覺得(feel)好開心(happy)、好滿意(pleased)。到下午我所有壓力(stress)都消失了。　問：說話者最後的心情如何？",
 en:"Happy and pleased.",zh:"說話者最後開心(happy)，選 A(笑臉)。"},
{n:27,p:3,pic:true,o:[BARS("Stress Level",["Mon","Wed","Fri"],[55,85,30]),BARS("Stress Level",["Mon","Wed","Fri"],[85,55,30]),BARS("Stress Level",["Mon","Wed","Fri"],[30,55,85])],a:1,sen:"I kept a feelings diary for one long week. On Monday my stress was the highest because of many tests. By Wednesday it dropped to the middle, and by Friday I felt the most relaxed, with the least stress. &nbsp;Q: Which chart shows my stress level?",szh:"我記錄了漫長(long)一週(week)的心情。星期一因為很多考試，壓力(stress)最高；到星期三降到中間；星期五最放鬆，壓力最低。　問：哪張圖符合我的壓力狀況？",en:"Highest Mon, lowest Fri (going down).",zh:"週一壓力最高、逐日下降，符合『Mon 最高、Fri 最低』的圖，選 B。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:0,
 sen:"When I feel sad or blue, cooking makes me happy. My favorite thing to prepare is fresh bread, which smells wonderful in the oven. I do not make noodles or rice when I am down, because bread is my real comfort food. &nbsp;Q: What does the speaker prepare when feeling down?",
 szh:"當我難過(sad)或憂鬱(blue)時，煮飯讓我開心(happy)。我最愛準備(prepare)的是新鮮麵包(bread)，在烤箱裡香噴噴。我心情低落(down)時不做麵或飯，因為麵包才是我真正的療癒食物。　問：說話者心情低落時會準備什麼？",
 en:"Fresh bread.",zh:"說話者做的是麵包(bread)，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[FACE('happy'),FACE('surprised'),FACE('afraid')],a:1,
 sen:"At the surprise party, we hid in the dark and waited. When my sister opened the door and turned on the light, we all shouted. Her eyes went wide and her mouth opened round—she was completely surprised and shocked, but not afraid. &nbsp;Q: How did the sister look?",
 szh:"在驚喜(surprise)派對上，我們躲在暗處等待。當姊姊開門、打開燈時，我們一起大喊。她瞪大眼睛、嘴巴張成圓形——她完全嚇(shock)到、非常驚訝(surprise)，但並不害怕(afraid)。　問：姊姊看起來如何？",
 en:"Surprised (wide eyes, round mouth).",zh:"姊姊很驚訝(surprise)，選 B(驚訝臉)。害怕臉為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('park'),IMG('beach')],a:2,
 sen:"Whenever I feel stress, I go somewhere to relax. I do not climb the mountain, and I do not sit in the park. Instead, I go to the beach, where the sound of the waves calms my emotion and washes my worries away. &nbsp;Q: Where does the speaker go to relax?",
 szh:"每當我覺得有壓力(stress)，我會去某個地方放鬆。我不爬山，也不坐公園，而是去海邊(beach)，海浪的聲音能安撫我的情緒(emotion)、洗去煩惱。　問：說話者去哪裡放鬆？",
 en:"The beach.",zh:"說話者去海邊(beach)放鬆，選 C。山、公園為干擾。"}
];

/* ====== 音檔播放（AAC/.m4a，各廠牌手機皆支援）====== */
let curAudio=null, curBtn=null;
function resetPlayBtn(b){ if(!b) return; b.classList.remove('playing'); b.querySelector('.txt').textContent = b.dataset.played?'重播':'播放'; }
function stopAudio(){ if(curAudio) curAudio.pause(); if(curBtn) resetPlayBtn(curBtn); curAudio=null; curBtn=null; }
function playAudio(audio,btn){
  if(curAudio===audio){                       // 同一題：暫停 / 繼續
    if(audio.paused){ audio.play(); btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…'; }
    else { audio.pause(); }
    return;
  }
  if(curAudio){ curAudio.pause(); resetPlayBtn(curBtn); }   // 換題：停掉上一段
  curAudio=audio; curBtn=btn; btn.dataset.played='1';
  btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…';
  audio.play().catch(()=>resetPlayBtn(btn));
}

/* ====== 產生畫面 ====== */
const form=document.getElementById('quiz');
let lastP=-1;
Q.forEach(q=>{
  if(q.p!==lastP){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].t;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].d;
    form.appendChild(st); form.appendChild(sd); lastP=q.p;
  }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const head=document.createElement('div'); head.className='qhead';
  head.innerHTML=`<span class="num">${q.n}</span>
    <button type="button" class="play"><span class="wave">🔊</span><span class="txt">播放</span></button>
    <span class="hintq">聆聽後作答</span>`;
  card.appendChild(head);
  const audio=document.createElement('audio'); audio.preload='none'; audio.src='gept-listening-audio/4/q'+q.n+'.m4a?v=r4p0d-20261003'; card.appendChild(audio);
  const pbtn=head.querySelector('.play');
  pbtn.addEventListener('click',()=>playAudio(audio,pbtn));
  audio.addEventListener('ended',()=>{ if(curBtn===pbtn){ resetPlayBtn(pbtn); curAudio=null; curBtn=null; } });
  audio.addEventListener('pause',()=>{ if(curAudio===audio && curBtn===pbtn && !audio.ended){ pbtn.classList.remove('playing'); pbtn.querySelector('.txt').textContent='繼續'; } });
  if(q.fig){ const f=document.createElement('div'); f.className='fig'; f.innerHTML=q.fig; card.appendChild(f); }
  if(q.pic){
    if(q.legend){ const lg=document.createElement('div'); lg.innerHTML=PIE_LEGEND; card.appendChild(lg.firstChild); }
    const wrap=document.createElement('div'); wrap.className='picopts';
    q.o.forEach((opt,i)=>{
      const cell=document.createElement('label'); cell.className='picopt'; cell.dataset.i=i;
      cell.innerHTML=`<span class="lab">${'ABC'[i]}</span>${opt}<input type="radio" name="q${q.n}" value="${i}" hidden>`;
      cell.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.picopt').forEach(o=>o.classList.remove('sel')); cell.classList.add('sel'); updateProgress(); });
      wrap.appendChild(cell);
    });
    card.appendChild(wrap);
  } else {
    q.o.forEach((opt,i)=>{
      const lab=document.createElement('label'); lab.className=(q.p===0?'opt listen':'opt'); lab.dataset.i=i;
      lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABC'[i]}</span><span class="otext">${opt}</span>`;
      lab.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); lab.classList.add('sel'); updateProgress(); });
      card.appendChild(lab);
    });
  }
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n; card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
const TOT=Q.length;
function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOT}`;
  document.getElementById('fill').style.width=(c/TOT*100)+'%';
  hint.textContent = c===TOT ? '已完成全部 30 題' : (c===0 ? '尚未作答任何題目（仍可送出查看解析）' : `已作答 ${c} 題，未作答 ${TOT-c} 題（仍可送出）`);
}

submitBtn.addEventListener('click',()=>{
  stopAudio();
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick=sel?parseInt(sel.value):null;
    if(pick===null) blank++;
    const card=document.getElementById('q'+q.n);
    const cls=q.pic?'.picopt':'.opt';
    card.querySelectorAll(cls).forEach(o=>{
      o.classList.add('lock');
      const inp=o.querySelector('input'); if(inp) inp.disabled=true;
      const i=parseInt(o.dataset.i);
      if(i===q.a) o.classList.add('correct');
      if(pick!==null && i===pick && pick!==q.a) o.classList.add('wrong');
    });
    const correct=pick===q.a; if(correct) ok++;
    const exp=document.getElementById('exp'+q.n);
    const tag=correct?'答對':(pick===null?'未作答':'答錯');
    exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABC'[q.a]}</span>
      <div class="scriptbox"><b>聽力原文</b>　${q.sen}<br><span style="color:#7a4a12">${q.szh}</span></div>
      <div class="en"><b>EN</b>&nbsp;${q.en}</div><div class="zh"><b>中</b>&nbsp;${q.zh}</div>`;
    exp.classList.add('show');
  });
  document.getElementById('scoreNum').textContent=Math.round(ok/TOT*120);
  document.getElementById('scoreTxt').textContent=`／120 分　${Math.round(ok/TOT*120)>=80?'達參考通過線 ✅':'未達通過線（80）'}（答對 ${ok}／${TOT} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOT-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  try{
    var _m=location.pathname.match(/gept-listening-(\d+)\.html/);
    var _round=_m?parseInt(_m[1]):0;
    var _ans=Q.map(function(q){var s=form.querySelector('input[name="q'+q.n+'"]:checked');var pk=s?parseInt(s.value):null;return {n:q.n,p:q.p,pick:pk,a:q.a,ok:pk===q.a};});
    var _rec={round:_round,date:new Date().toISOString(),score:Math.round(ok/TOT*120),total:TOT,correct:ok,blank:blank,ans:_ans};
    var _K='efetl_listening_results';
    var _all=JSON.parse(localStorage.getItem(_K)||'[]');
    _all.push(_rec);
    localStorage.setItem(_K,JSON.stringify(_all.slice(-800)));
    if(window.EFETL_CLOUD){EFETL_CLOUD.upload(_rec);}
  }catch(_e){}
  const res=document.getElementById('result'); res.classList.add('show');
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  stopAudio(); form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt,.picopt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');const inp=o.querySelector('input');if(inp)inp.disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress(); window.scrollTo({top:0,behavior:'smooth'});
});

updateProgress();
</script>

<script id="ak-core">(function(){
if(window.AK)return;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(secs){
 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);
  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>

<style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
