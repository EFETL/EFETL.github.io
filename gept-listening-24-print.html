<div class="bar">
 <b>🖨 第 24 回　購物　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>

 <button class="a tonly" onclick="show('a')">兩份都印</button>
</div>
<div id="root"></div>
<script>
/* 圖形素材（第24回 購物） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/24/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/24/p3_${n}.jpg?v=r24hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const STORE=`<img class="pic-img p0img" src="gept-listening-img/24/p0_q1.jpg" alt="question 1 picture">`;
const PRICETAG=`<img class="pic-img p0img" src="gept-listening-img/24/p0_q2.jpg" alt="question 2 picture">`;
const SHOPBAG=`<img class="pic-img p0img" src="gept-listening-img/24/p0_q3.jpg" alt="question 3 picture">`;
const CONVENIENCE=`<img class="pic-img p0img" src="gept-listening-img/24/p0_q4.jpg" alt="question 4 picture">`;
const SWEATER=`<img class="pic-img p0img" src="gept-listening-img/24/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:STORE,o:["She is showing a red sweater to a woman in yellow.","She is putting a red sweater into a shopping bag.","She is showing a yellow sweater to a woman in red."],a:0,sen:"For question one, look at the picture. What is the salesperson doing?",szh:"第一題，請看圖片。店員(salesperson)在做什麼？",en:"She is showing a red sweater to a woman in yellow.",zh:"穿牛仔襯衫的店員(salesperson)拿著衣架，把一件紅色毛衣(sweater)拿給穿黃色衣服的女士看，正確。她沒有把毛衣放進購物袋，毛衣還掛在衣架上；顏色說反了，毛衣是紅的、客人穿的是黃色。選 A"},
{n:2,p:0,fig:PRICETAG,o:["The sweater was fifty, and now it's twenty-five.","The shirt was twenty-five, and now it's fifty.","The shirt was fifty, and now it's twenty-five."],a:2,sen:"For question two, look at the picture. What is true about the price?",szh:"第二題，請看圖片。關於價格(price)，何者正確？",en:"The shirt was fifty, and now it's twenty-five.",zh:"紅色特價(sale)吊牌寫著原本 50、現在 25，也就是半價，而且掛在一件格子襯衫上，正確。把原價和現價說反了，價格是變便宜不是變貴；吊牌掛的是有領子和扣子的襯衫，不是毛衣(sweater)。選 C"},
{n:3,p:0,fig:SHOPBAG,o:["She is holding up a sweater, with a shopping bag on her arm.","She is putting on a sweater, with a shopping bag on her arm.","She is holding up a sweater, with a shopping bag at her feet."],a:0,sen:"For question three, look at the picture. What is the woman doing?",szh:"第三題，請看圖片。這位女士在做什麼？",en:"She is holding up a sweater, with a shopping bag on her arm.",zh:"她笑著雙手舉起一件米色毛衣(sweater)，白色購物袋掛在手臂上，正確。她只是拿起來看，沒有在穿；購物袋掛在手臂上，不是放在腳邊。選 A"},
{n:4,p:0,fig:CONVENIENCE,o:["A man in a hat is paying the salesperson.","A man in a hat is drinking coffee at the counter.","A man in a hat is selling snacks to the salesperson."],a:0,sen:"For question four, look at the picture. What is happening in the convenience store?",szh:"第四題，請看圖片。便利商店(convenience store)裡發生什麼事？",en:"A man in a hat is paying the salesperson.",zh:"戴毛帽的男子把錢遞給櫃台後面的店員(salesperson)，是在付錢，正確。賣(sell)東西的是櫃台後的店員，不是戴帽子的客人；櫃台上雖然有一杯咖啡，但他沒有在喝。選 A"},
{n:5,p:0,fig:SWEATER,o:["Only two sweaters are hanging in a row.","Many sweaters are lying on a table.","Many sweaters are hanging in a row."],a:2,sen:"For question five, look at the picture. What can you see in the picture?",szh:"第五題，請看圖片。圖中可以看到什麼？",en:"Many sweaters are hanging in a row.",zh:"許多(many)五顏六色的毛衣(sweater)用衣架一排掛(hang)在桿子上，正確。圖中毛衣很多，不是只有兩件；毛衣是掛著的，不是平放在桌上。選 C"},
{n:6,p:1,o:["Yes, I bought one for my mom, too.","Then take it back to the store and change it.","It's the biggest store in town."],a:1,sen:"I bought this sweater for my mom, but it's too big.",szh:"我買(buy)了這件毛衣(sweater)給我媽，可是太大了。",en:"Then take it back to the store and change it.",zh:"對方說毛衣買太大，建議「那就拿回店(store)裡換」是在解決問題，最自然。「我也買了一件給我媽」只是重複 bought 和 mom；「那是鎮上最大的店」只是由 big 聯想，沒有回應。選 B"},
{n:7,p:1,o:["The small one just north of the station.","It opens at seven every day.","I bought three buns this morning."],a:0,sen:"Which shop sells the best buns around here?",szh:"這附近哪一家店(shop)賣(sell)的包子(bun)最好吃？",en:"The small one just north of the station.",zh:"問「哪一家」店，答「車站北(north)邊那家小店」才是在指認店家。「我今天早上買了三個包子」只是重複 buns；「每天七點開」答的是營業時間，沒說是哪一家。選 A"},
{n:8,p:1,o:["Go straight ahead. It's next to the juice.","It's thirty dollars a bottle.","Yes, it's very cold."],a:0,sen:"Excuse me, where can I find bottled water?",szh:"請問瓶裝水(water)在哪裡？",en:"Go straight ahead. It's next to the juice.",zh:"問 Where 在哪裡，答「直直往前(ahead)走，就在果汁旁邊」才是位置。「一瓶三十元」答的是價格；用 Yes 回答 Where 問句，而且水冰不冰不是問題重點。選 A"},
{n:9,p:1,o:["Sure, I'll contact you tomorrow.","Then why not wear glasses?","Yes, they're very cheap."],a:1,sen:"These contact lenses cost me a lot of money.",szh:"這些隱形眼鏡(contact lens)花了我好多錢。",en:"Then why not wear glasses?",zh:"對方抱怨隱形眼鏡(contact lens)很貴，建議「那何不戴眼鏡？」最自然。「我明天跟你聯絡」只是重複 contact 這個字；「是啊，它們很便宜」和對方說很貴的意思相反。選 B"},
{n:10,p:1,o:["My cousin and her new puppy.","It was in the park on Wednesday.","I went there by bus."],a:0,sen:"Who did you go to the Christmas fair with?",szh:"你和誰一起去聖誕(Christmas)市集(fair)？",en:"My cousin and her new puppy.",zh:"問 Who 和誰去，答「我表姊和她的新小狗(puppy)」才是同伴。「星期三(Wednesday)在公園」答的是時間地點；「我搭公車去」答的是怎麼去。選 A"},
{n:11,p:1,o:["Yes, she has a very loud voice.","That person tried to leave without paying.","She works in the shoe shop."],a:1,sen:"Why did the salesperson shout at that man?",szh:"店員(salesperson)為什麼對那個男人大吼(shout)？",en:"That person tried to leave without paying.",zh:"問 Why 為什麼，答「那個人(person)想不付錢就走」是原因。「她在鞋店工作」答的是在哪工作；用 Yes 回答 Why 問句，說她聲音大也不是原因。選 B"},
{n:12,p:1,o:["Yes, I have many things, too.","She'll be six years old next month.","Maybe she just wants to be like you."],a:2,sen:"My little sister envies everything I have.",szh:"我妹妹羨慕(envy)我擁有的每樣東西。",en:"Maybe she just wants to be like you.",zh:"對方說妹妹什麼都羨慕(envy)，回「也許她只是想跟你一樣」是在解釋並安慰，最自然。「我也有很多(many)東西(thing)」答非所問，只是由 everything 聯想；「她下個月滿六歲」和羨慕無關。選 C"},
{n:13,p:1,o:["Yes, we should.","Actually, I'm not hungry. You choose.","I ordered it last night."],a:1,sen:"Should we order pizza or noodles?",szh:"我們該點(order)披薩還是麵(noodle)？",en:"Actually, I'm not hungry. You choose.",zh:"這是二選一的問句，回「其實(actually)我不餓，你決定」是委婉地把選擇交給對方，最自然。用 Yes 回答 or 問句不合理；「我昨晚點過了」時態不對，而且沒說點的是什麼。選 B"},
{n:14,p:1,o:["Yes, I'll take a bag, thanks.","It costs a thousand dollars.","No, it's imported from Italy."],a:2,sen:"Is this bag made in Taiwan?",szh:"這個包包是台灣製的嗎？",en:"No, it's imported from Italy.",zh:"問是不是台灣製，答「不是，是從義大利進口(import)的」最直接。「要一千元」答的是價錢；「好，我要一個袋子，謝謝」把 bag 誤會成店員要給的購物袋。選 C"},
{n:15,p:1,o:["Everything is half price.","At the store on Main Street.","Not until the first of next month."],a:2,sen:"When does the big sale begin?",szh:"大特價(sale)什麼時候開始(begin)？",en:"Not until the first of next month.",zh:"問 When 什麼時候，答「要到下個月一號(first)才開始」才是時間。「在大街上的那家店(store)」答的是地點；「全部半價」說的是折扣，不是時間。選 C"},
{n:16,p:2,o:["Four hundred dollars.","Six hundred dollars.","Eight hundred dollars."],a:1,sen:"W: How much are these shirts? &nbsp;M: Four hundred dollars each. But if you buy two, the second one is half price. &nbsp;W: Great. Then I'll take two. &nbsp;Q: How much will the woman pay?",szh:"女：這些襯衫多少錢？　男：一件四百元。不過買(buy)兩件的話，第二件半價(price)。　女：太好了，那我拿兩件。　問：女士要付多少錢？",en:"Six hundred dollars.",zh:"第一件四百元，第二件半價(price)是兩百元，合計六百元。四百元只是一件的價錢；八百元是沒有打折的兩件價錢。選 B"},
{n:17,p:2,o:["To the night market.","To the supermarket.","To the convenience store."],a:2,sen:"M: I need some water. Is the supermarket still open? &nbsp;W: No, it closes at ten. And the night market is too far. &nbsp;M: Then I'll try the convenience store across the street. &nbsp;W: Good idea. It never closes. &nbsp;Q: Where will the man go?",szh:"男：我需要買水(water)。超市還開著嗎？　女：沒有，十點就關了。夜市又太遠。　男：那我去對面的便利商店(convenience store)看看。　女：好主意，那裡從不打烊。　問：男士會去哪裡？",en:"To the convenience store.",zh:"超市十點已經關門，夜市太遠，所以男士改去對街的便利商店(convenience store)。超市和夜市都是被否定的選擇。選 C"},
{n:18,p:2,o:["Make the price signs.","Pack the cookies.","Sell the cookies."],a:1,sen:"W: Our class fair is on Wednesday. It's a good opportunity to make money for our trip. &nbsp;M: Who will sell the cookies? Amy has band practice that day. &nbsp;W: Then I'll sell them, and you can pack them into bags. &nbsp;M: Fine. And Ben can make the price signs. &nbsp;Q: What will the man do?",szh:"女：我們班的園遊會(fair)在星期三(Wednesday)，是幫畢業旅行賺錢的好機會(opportunity)。　男：誰來賣(sell)餅乾？Amy 那天要練樂團(band)。　女：那我來賣，你負責把餅乾裝(pack)進袋子。　男：好。Ben 可以做價格(price)牌。　問：男士會做什麼？",en:"Pack the cookies.",zh:"要分清楚誰做什麼：女士賣(sell)餅乾，男士打包(pack)，Ben 做價格(price)牌，Amy 要練團不能來。賣餅乾是女士的工作；做價格牌是 Ben 的工作。選 B"},
{n:19,p:2,o:["The jacket is good quality.","Her sister needs a new jacket.","The jacket is too old."],a:0,sen:"M: Is this jacket any good? &nbsp;W: My sister bought the same one five years ago. &nbsp;M: And? &nbsp;W: She still wears it every winter, and it looks almost new. &nbsp;Q: What does the woman mean?",szh:"男：這件夾克好嗎？　女：我姊姊五年前買(buy)了一模一樣的。　男：然後呢？　女：她每年冬天還在穿，看起來(look)幾乎還是新的。　問：女士的意思是什麼？",en:"The jacket is good quality.",zh:"穿了五年還像新的，換句話說就是「品質(quality)很好」。姊姊的夾克看起來還很新，不需要買新的；夾克雖然買了五年，但女士是在稱讚它耐穿，不是說它太舊。選 A"},
{n:20,p:2,o:["A pork bun and coffee.","A beef bun and coffee.","A pork bun and tea."],a:2,sen:"W: I'd like to order a beef bun and a cup of coffee. &nbsp;M: Sorry, we just sold the last beef bun. &nbsp;W: Oh. Then a pork bun, please. And make that tea, not coffee. &nbsp;M: Sure. &nbsp;Q: What will the woman get?",szh:"女：我想點(order)一個牛肉包(bun)和一杯咖啡。　男：抱歉，最後一個牛肉包剛賣(sell)完了。　女：喔，那給我豬肉包。飲料改成茶，不要咖啡。　男：好的。　問：女士會拿到什麼？",en:"A pork bun and tea.",zh:"牛肉包賣完了，改成豬肉包；飲料也從咖啡改成茶。牛肉包加咖啡是她一開始點的；豬肉包加咖啡只改了一半，她後來也把咖啡改成茶了。選 C"},
{n:21,p:2,o:["A famous singer.","Her grandmother.","Her music teacher."],a:1,sen:"M: Lisa sang so well at the Christmas party. She has real talent. &nbsp;W: Yes. Many people think a famous singer inspired her. &nbsp;M: Or her music teacher? &nbsp;W: Actually, it was her grandmother. She sang to Lisa every night. &nbsp;Q: Who inspired Lisa?",szh:"男：Lisa 在聖誕(Christmas)派對上唱得真好，她真有天分(talent)。　女：對。很多人以為是某位有名的(famous)歌手啟發(inspire)了她。　男：還是她的音樂老師？　女：其實(actually)是她奶奶，奶奶每天晚上都唱歌給她聽。　問：誰啟發了 Lisa？",en:"Her grandmother.",zh:"女士先說很多人「以為」是有名的(famous)歌手，男士猜音樂老師，最後女士用「其實(actually)」更正：是她奶奶。歌手是別人的誤會；音樂老師是男士的猜測。選 B"},
{n:22,p:2,o:["On Wednesday.","On Friday.","On Thursday."],a:1,sen:"M: The pet shop has puppies for sale. Let's go on Wednesday. &nbsp;W: I'm going on a hike on Wednesday. How about Thursday? &nbsp;M: The shop is closed on Thursdays. &nbsp;W: Then let's go the next day, after school. &nbsp;M: OK. &nbsp;Q: When will they go to the pet shop?",szh:"男：寵物店有小狗(puppy)在賣(sale)。我們星期三(Wednesday)去吧。　女：星期三我要去健行(hike)。星期四呢？　男：那家店(shop)星期四公休。　女：那就隔天放學後去。　男：好。　問：他們什麼時候去寵物店？",en:"On Friday.",zh:"星期三女士要健行(hike)，星期四店公休，所以改成星期四的隔天，也就是星期五。星期三和星期四都被否定了。選 B"},
{n:23,p:2,o:["His brother always cuts the cake.","They don't like the same cake.","The two pieces are never the same size."],a:2,sen:"M: My brother and I always argue about the last piece of cake. &nbsp;W: Why not divide it in two? &nbsp;M: We do, but there's always a difference in size. &nbsp;W: Then let one of you cut it, and the other choose first. &nbsp;Q: Why do the man and his brother still argue?",szh:"男：我和我哥老是為了最後一塊蛋糕吵架(argue)。　女：何不切成(divide)兩半？　男：我們有切，但大小總是有差別(difference)。　女：那就一個人切，另一個人先(first)選。　問：男士和哥哥為什麼還是會吵？",en:"The two pieces are never the same size.",zh:"男士說他們有切成(divide)兩半，但大小總有差別(difference)，換句話說就是「兩塊永遠不一樣大」。對話沒說一直是哥哥切，「一人切、一人選」是女士給的新辦法；他們搶的是同一塊蛋糕，不是喜好不同。選 C"},
{n:24,p:2,o:["Buy less water.","Have no water for a week.","Buy a lot of water."],a:0,sen:"W: Why are you buying so much water? &nbsp;M: The news says our town may have no water next week. &nbsp;W: That's not a crisis. They'll only stop the water for two hours on Monday morning. &nbsp;M: Oh. Then I'll put most of these back. &nbsp;Q: What will the man do?",szh:"女：你為什麼買(buy)這麼多水(water)？　男：新聞說我們鎮下週可能會停水。　女：那不算危機(crisis)啦，只有星期一早上停兩個小時。　男：喔，那我把大部分放回去。　問：男士會怎麼做？",en:"Buy less water.",zh:"男士原本要買一大堆水，聽到只停水兩小時後說要把大部分放回去，也就是「少買一點水」。買很多水是他原本的打算；整週沒水是他誤會的新聞，其實只停兩小時。選 A"},
{n:25,p:2,o:["It rubs his chin.","He wants a different size.","The quality is poor."],a:0,sen:"M: I'd like to return this sweater. &nbsp;W: Is something wrong with the quality? &nbsp;M: No, the quality is fine, and it looks nice. But the top is too high, and it rubs my chin. &nbsp;W: Would you like a different size? &nbsp;M: No, thanks. Just my money back. &nbsp;Q: Why is the man returning the sweater?",szh:"男：我想退這件毛衣(sweater)。　女：是品質(quality)有問題嗎？　男：不是，品質沒問題，看起來(look)也不錯。但是領口太高，會磨到(rub)我的下巴(chin)。　女：要換別的尺寸嗎？　男：不用，謝謝，退錢就好。　問：男士為什麼要退毛衣？",en:"It rubs his chin.",zh:"男士說品質(quality)沒問題，退貨原因是領口太高磨到(rub)下巴(chin)。他明說品質很好；店員問要不要換尺寸，他說不用，只要退錢。選 A"},
{n:26,p:3,pic:true,o:[BARS("Christmas Sales",["Clothes","Toys","Books"],[50,80,20]),BARS("Christmas Sales",["Clothes","Toys","Books"],[80,20,50]),BARS("Christmas Sales",["Clothes","Toys","Books"],[80,50,20])],a:2,sen:"Our store sells clothes, toys, and books. We counted every purchase this Christmas. In general, toys sell the most at Christmas. But this year was very cold, so more people bought clothes than toys. Books did not sell as well as toys. &nbsp;Q: Which chart shows this year's Christmas sales?",szh:"我們店(store)賣(sell)衣服、玩具和書。我們統計了今年聖誕節(Christmas)的每一筆購買(purchase)。一般(general)來說，聖誕節玩具賣得最好。但今年很冷，所以買衣服的人比買玩具的多。書賣得沒有玩具好。　問：哪張圖表是今年的聖誕節銷售(sale)？",en:"Clothes most, toys second, books least.",zh:"今年衣服比玩具多，書又比玩具少，所以衣服最高、玩具第二、書最低。玩具最高的那張是「一般」年份的情形；衣服最高但書比玩具多的那張，和「書賣得沒有玩具好」相反。選 C"},
{n:27,p:3,pic:true,o:[BARS("Phone Sales",["Amy","Ben","Carl"],[40,80,20]),BARS("Phone Sales",["Amy","Ben","Carl"],[80,40,20]),BARS("Phone Sales",["Amy","Ben","Carl"],[80,20,40])],a:1,sen:"Three people sell phones in our shop. Ben is smart and funny, so many customers think he sells the most. But this month, Amy sold more phones than Ben, because she explains the quality of each phone so well. Carl thinks selling is boring, and he sold only half as many phones as Ben. &nbsp;Q: Which chart shows this month's phone sales?",szh:"我們店(shop)裡有三個人賣(sell)手機。Ben 聰明(smart)又有趣，所以很多客人以為他賣得最多。但這個月 Amy 賣出的手機比 Ben 多，因為她把每支手機的品質(quality)介紹得很好。Carl 覺得賣東西很無聊(boring)，他賣的只有 Ben 的一半。　問：哪張圖表是這個月的手機銷售量？",en:"Amy most, Ben second, Carl half of Ben.",zh:"這個月 Amy 比 Ben 多，Carl 只有 Ben 的一半，所以是 Amy 最高、Ben 第二、Carl 最低的圖。Ben 最高的那張是客人「以為」的情形；Amy 最高但 Carl 比 Ben 多的那張，和「Carl 只賣了 Ben 的一半」相反。選 B"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:2,sen:"My aunt sells natural soap at a night market. Her soap comes in many shapes: round, square, and heart. People like to rub it on their hands and smell it. Last month, the round soap sold the most. But this month, the heart soap is more popular, because Valentine's Day is coming. &nbsp;Q: Which soap sells the most this month?",szh:"我阿姨在夜市賣(sell)天然(natural)香皂。她的香皂有很多(many)形狀(shape)：圓形、方形和心形。大家喜歡把香皂在手上搓一搓(rub)聞香味。上個月圓形的賣最好，但這個月心形的比較受歡迎，因為情人節快到了。　問：這個月哪一種香皂賣最好？",en:"The heart soap.",zh:"圓形香皂是「上個月」賣最好的；方形只被提到有這個形狀(shape)；這個月因為情人節，心形最受歡迎。選 C"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29a'),PH('q29c')],a:0,sen:"I bought three sweaters as Christmas gifts: a red one, a blue one, and a green one. I planned to give the green one to my sister. But she doesn't like green, so she got the red one. My dad took the blue one. The green one went to my grandfather, whom I visit every Sunday. &nbsp;Q: Which sweater did the speaker's sister get?",szh:"我買(buy)了三件毛衣(sweater)當聖誕(Christmas)禮物：紅、藍、綠各一件。我本來打算把綠色的給妹妹，但她不喜歡綠色，所以她拿了紅色的。爸爸拿了藍色的。綠色的給了我每週日去探望的(whom)爺爺。　問：說話者的妹妹拿到哪一件毛衣？",en:"The red one.",zh:"綠色原本是要給妹妹的，但她不喜歡綠色，最後給了爺爺；藍色是爸爸的；妹妹拿的是紅色。選 A"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30a'),PH('q30b')],a:1,sen:"My uncle makes buns. At first, he hoped to sell many of them at the night market, but it was too crowded. Then he opened a small shop near the train station, but it cost too much money. Now he rides a bicycle around our town every morning with a big box of buns, and he rings a bell. People come out of their houses to buy them. &nbsp;Q: How does the uncle sell his buns now?",szh:"我叔叔做包子(bun)。一開始(first)他希望(hope)在夜市賣很多，但那裡太擠。後來他在火車站附近開了一間小店(shop)，但花費太高。現在他每天早上騎腳踏車載著一大箱包子在鎮上繞，一邊搖鈴(bell)，大家就從家裡出來買(buy)。　問：叔叔現在怎麼賣包子？",en:"From his bicycle.",zh:"夜市是一開始(first)的地點，但太擠；車站旁的小店是後來試的，但太花錢；現在是騎腳踏車搖鈴(bell)沿街賣。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 24 回　購物　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
