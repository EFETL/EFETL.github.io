<html lang="zh-Hant">

<title>GEPT 初級 聽力測驗　第14回　日常用品</title>
<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#fff5ec,#fff9f4 70%);color:#22303f;line-height:1.6;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#f6d365,#fda085 60%,#ff7a9c);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(253,160,133,.35);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.14);}
  header.top p{margin:0;font-size:.92rem;opacity:.96;}
  .meta{margin-top:14px;font-size:.86rem;background:rgba(255,255,255,.24);
    padding:9px 13px;border-radius:10px;}
  .notice{background:#fffbeb;border:1.5px solid #f59e0b;border-radius:12px;
    padding:11px 15px;margin-bottom:14px;font-size:.86rem;color:#78350f;
    display:flex;align-items:flex-start;gap:9px;line-height:1.55;}
  .notice .ic{font-size:1.1rem;flex-shrink:0;margin-top:1px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#fff5ec 70%,rgba(255,245,236,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.9rem;
    box-shadow:0 4px 12px rgba(253,160,133,.14);}
  .bar .track{flex:1;height:9px;background:#f1e4dc;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#ffb02e,#ff7a59);transition:width .35s;}
  .bar #count{font-weight:700;color:#e0740a;}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#43cea2,#3ab0d6);}
  .section-desc{font-size:.86rem;color:var(--gray);margin:0 4px 10px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(253,160,133,.09);}
  .qhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .qhead .num{display:inline-block;color:#fff;background:var(--coral);font-weight:700;
    border-radius:8px;padding:1px 10px;font-size:.92rem;}
  .play{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
    color:#fff;font-weight:800;font-size:.92rem;border-radius:22px;padding:8px 16px;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);box-shadow:0 4px 12px rgba(255,93,143,.3);}
  .play:active{transform:translateY(1px);}
  .play.playing{background:linear-gradient(135deg,#22b573,#1a9e63);}
  .play .wave{font-size:.8rem;opacity:.9;}
  .hintq{font-size:.8rem;color:var(--gray);}
  .fig{text-align:center;margin:4px 0 12px;}
  .fig svg{max-width:100%;height:auto;}
  .pic-img{border-radius:9px;border:1px solid #e6ded7;object-fit:cover;}
  .fig .pic-img{max-width:230px;width:100%;max-height:150px;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:.95rem;background:#fbfdff;}
  .opt:hover{border-color:var(--coral);background:#fff4ee;}
  .opt input{margin-top:3px;accent-color:var(--coral);}
  .opt .lab{font-weight:800;color:var(--coral);min-width:18px;}
  .opt.sel{border-color:var(--coral);background:#ffeee6;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .opt.listen .otext{display:none;}
  .opt.listen.lock .otext{display:inline;}
  .opt.listen .lab{font-size:1.05rem;}
  /* picture options (Part 4) */
  .picopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0;}
  .picopt{border:2px solid var(--line);border-radius:12px;padding:9px 6px;cursor:pointer;
    text-align:center;transition:.15s;background:#fbfdff;display:flex;flex-direction:column;align-items:center;gap:6px;}
  .picopt:hover{border-color:var(--coral);background:#fff4ee;}
  .picopt.sel{border-color:var(--coral);background:#ffeee6;}
  .picopt.correct{border-color:var(--green);background:var(--green-bg);}
  .picopt.wrong{border-color:var(--red);background:var(--red-bg);}
  .picopt .lab{font-weight:800;color:var(--coral);align-self:flex-start;margin-left:4px;}
  .picopt.correct .lab{color:var(--green);}.picopt.wrong .lab{color:var(--red);}
  .picopt img.pic-img{width:100%;height:82px;}
  .picopt svg{width:100%;max-width:132px;height:auto;}
  .picopt svg.chart{max-width:100%;}
  .legend{display:flex;gap:12px;justify-content:center;font-size:.72rem;margin:2px 0 6px;color:#556;flex-wrap:wrap;}
  .legend i{display:inline-block;width:11px;height:11px;border:1px solid #999;margin-right:4px;vertical-align:-1px;}
  table.mini{border-collapse:collapse;font-size:.62rem;margin:0 auto;}
  table.mini th{background:#33414f;color:#fff;padding:2px 4px;}
  table.mini td{border:1px solid #bbb;padding:2px 4px;text-align:center;}
  .board{background:#111;color:#ffd24a;border-radius:5px;padding:5px;font-family:"Courier New",monospace;display:inline-block;}
  .board table{border-collapse:collapse;font-size:.6rem;color:#ffd24a;}
  .board th{color:#7fd7ff;padding:1px 4px;border-bottom:1px solid #444;}
  .board td{padding:1px 4px;text-align:center;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.9rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:.8rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .scriptbox{background:#f4f8ff;border-radius:8px;padding:7px 11px;margin:5px 0;font-size:.88rem;color:#20364d;}
  .exp .scriptbox b{color:var(--blue-dark);}
  .exp .en{color:#1c4f7a;background:#eef7ff;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .exp .zh{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:6px 10px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff9f4 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--coral);border:2px solid var(--coral);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#ffb02e,#ff7a59,#ff5d8f);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(255,122,89,.18);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#ff7a59,#ff5d8f);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:.95rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:.95rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:.85rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:.8rem;margin:24px 0;}
.fig .p0img{max-width:440px;max-height:330px;width:100%;height:auto;}
</style>

<div class="wrap">
  <header class="top">
    <h1>GEPT 初級　聽力測驗　<span style="opacity:.9">第14回　日常用品</span></h1>
    <p>互動聽力練習　&middot;　依官方四大題型與難度命題</p>
    <div class="meta">共 4 大題、30 題　|　每題按 🔊 播放，聆聽後作答　|　送出後顯示聽力原文、中英解析與分數</div>
  </header>

  <div class="notice">
    <span class="ic">🎧</span>
    <span>每題皆附<strong>語音朗讀音檔</strong>，iPhone、Android 各廠牌手機與電腦瀏覽器皆可播放（請開啟媒體音量）。點各題的 <strong>🔊 播放</strong> 鈕聆聽；正式考試每題只播一次，練習時可重播。</span>
  </div>
  <a href="gept-listening-progress.html" style="display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #3ab0d6;color:#0a6a86;border-radius:12px;padding:11px 16px;margin-bottom:18px;text-decoration:none;font-size:.9rem;font-weight:700;box-shadow:0 3px 10px rgba(58,176,214,.16);">
    <span>📈</span><span>我的成績 · 錯題回收 — 作答後看進步曲線、最弱單字與題型、一鍵重練</span>
  </a>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="count">0 / 30</span>
    </div>
  </div>

  <form id="quiz"></form>

  <div class="result" id="result">
    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>

      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">送出並查看解析</button>
    <div class="hint" id="hint">尚未作答任何題目</div>

<script>
/* ====== 圖形素材（第14回 日常用品） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/14/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const KNIFEPLATE=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q1.jpg" alt="question 1 picture">`;
const POT=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q2.jpg" alt="question 2 picture">`;
const FRIDGE=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q3.jpg" alt="question 3 picture">`;
const TOWEL=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q4.jpg" alt="question 4 picture">`;
const KITE=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q5.jpg" alt="question 5 picture">`;
/* ====== 大題 ====== */
const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];



/* ====== 題庫（第14回 日常用品） ====== */
const Q=[
{n:1,p:0,fig:KNIFEPLATE,o:["A fork, a plate and a glass.","A knife, a bowl and a glass.","A knife, a plate and a glass."],a:2,sen:"For question one, look at the picture. What is on the table?",szh:"第一題，請看圖片。桌上有什麼？",en:"A knife, a plate and a glass.",zh:"桌(table)上有刀(knife)、盤子(plate)和玻璃杯(glass)，選 C。A 少了刀、B 的碗(bowl)不是圖中的，各有一處不同。"},
{n:2,p:0,fig:POT,o:["A kettle and a bowl are on the stove.","A pot and a pan are on the stove.","Two cups and a plate are on the stove."],a:1,sen:"For question two, look at the picture. What is on the stove?",szh:"第二題，請看圖片。爐子上有什麼？",en:"A pot and a pan are on the stove.",zh:"爐子(stove)上有鍋子(pot)和平底鍋(pan)，選 B。水壺與碗、杯子與盤子都不是爐上的東西。"},
{n:3,p:0,fig:FRIDGE,o:["The watermelon is in the refrigerator.","The watermelon is on the table.","The watermelon is in the sink."],a:0,sen:"For question three, look at the picture. What keeps food cool?",szh:"第三題，請看圖片。什麼讓食物保冷？",en:"The watermelon is in the refrigerator.",zh:"西瓜(watermelon)放在冰箱(refrigerator)裡保冷，選 A。放桌上(table)或水槽都不會保冷。"},
{n:4,p:0,fig:TOWEL,o:["I see a towel, soap and a comb.","I see a bucket, soap and a toothbrush.","I see a towel, soap and a toothbrush."],a:2,sen:"For question four, look at the picture. What is in the bathroom?",szh:"第四題，請看圖片。浴室裡有什麼？",en:"A towel, soap and a toothbrush.",zh:"浴室裡有毛巾(towel)、肥皂(soap)和牙刷(toothbrush)，選 C。A、B 各有一樣東西不同，要聽清楚。"},
{n:5,p:0,fig:KITE,o:["They are flying a paper plane.","They are flying a blue kite.","They are flying a pink kite."],a:2,sen:"For question five, look at the picture. What are the children flying?",szh:"第五題，請看圖片。孩子們在放什麼？",en:"They are flying a pink kite.",zh:"孩子們放的是粉紅色(pink)風箏(kite)，選 C。B 的風箏顏色是藍色，要聽清楚顏色。"},

{n:6,p:1,o:["It's a special day today.","Perhaps later. I'm using it.","At the hardware store."],a:1,sen:"May I borrow your special tool?",szh:"我可以借你的特別工具嗎？",en:"Perhaps later. I'm using it.",zh:"問能否借(borrow)工具，答『也許(perhaps)晚點，我正在用』，選 B。A 重複 special 卻沒回答；C 回答地點。"},
{n:7,p:1,o:["On the sofa, in the middle.","I usually watch it at night.","About two hours a day."],a:0,sen:"Where do you usually sit to watch TV?",szh:"你通常坐哪看電視？",en:"On the sofa, in the middle.",zh:"問通常(usually)坐哪看電視，答『坐沙發(sofa)正中間(middle)』，選 A。B 回答時間，C 回答多久。"},
{n:8,p:1,o:["My car is blue and small.","Yes, I drive every day.","Only about ten minutes."],a:1,sen:"Can you really drive a car well?",szh:"你真的很會開車嗎？",en:"Yes, I drive every day.",zh:"問是否很會開車(drive)，答『是，我每天都開』，選 B。A 描述車子，C 回答時間長短。"},
{n:9,p:1,o:["I play with my brother.","In the public park.","I play the guitar and trumpet."],a:2,sen:"What instruments can you play?",szh:"你會演奏什麼樂器？",en:"I play the guitar and trumpet.",zh:"問會演奏什麼樂器，答『我會吉他(guitar)和小號(trumpet)』，選 C。A 重複 play 卻在講和誰玩；B 回答地點(public 公共的)。"},
{n:10,p:1,o:["I'll reach home by six.","The shelf is made of wood.","Yes, I can. I grow fast."],a:2,sen:"Can you reach the top shelf now?",szh:"你現在搆得到最上層架子嗎？",en:"Yes, I can. I grow fast.",zh:"問現在搆得到架子嗎，答『可以，我長(grow)得很快』，選 C。A 重複 reach 卻是講到家；B 講架子材質。"},
{n:11,p:1,o:["It's very sharp, so be careful.","To fix my coat, of course.","I carry it in my pocket."],a:1,sen:"Why do you carry that needle around?",szh:"你為什麼隨身帶著那根針？",en:"To fix my coat, of course.",zh:"問為何帶著針(needle)，答『當然是補我的外套』，選 B。A 提醒針很利，C 回答放在哪裡，都不是原因(why)。"},
{n:12,p:1,o:["It opens at ten o'clock.","I bought a good book there.","Next to the public library."],a:2,sen:"Where is the new bookstore?",szh:"新的書店在哪裡？",en:"Next to the public library.",zh:"問書店(bookstore)在哪，答『在公共(public)圖書館旁邊』，選 C。A 回答時間；B 重複書店卻沒回答位置。"},
{n:13,p:1,o:["I don't know. Perhaps it's broken.","Who bought it for you?","It's in the toy box."],a:0,sen:"Why did the toy gun jam again?",szh:"玩具槍為什麼又卡住了？",en:"I don't know. Perhaps it's broken.",zh:"問槍為何卡住(jam)，答『我不知道，也許(perhaps)壞了』，選 A。B 反問是誰(who)買的；C 只說放在哪裡。"},
{n:14,p:1,o:["It's a warm wool coat.","Just a sheet of paper.","Only on cold winter days."],a:1,sen:"What do you keep in your coat pocket?",szh:"你外套口袋裡放什麼？",en:"Just a sheet of paper.",zh:"問口袋(pocket)裡放什麼，答『只有一張(sheet)紙』，選 B。A 重複 coat 在描述外套；C 回答何時。"},
{n:15,p:1,o:["It's open until five o'clock.","I really like the kangaroos.","My cousin works at the zoo."],a:1,sen:"What animal do you like at the zoo?",szh:"你喜歡動物園的哪種動物？",en:"I really like the kangaroos.",zh:"問喜歡的動物，答『我很喜歡袋鼠(kangaroo)』，選 B。A 回答開放時間；C 重複 zoo 卻沒回答。"},

{n:16,p:2,o:["A spoon and a cup.","A pen and a book.","A knife and a plate."],a:2,sen:"W: What do I need to cut the cake? &nbsp;M: A knife and a clean plate. &nbsp;W: Thanks. &nbsp;Q: What does the woman need?",szh:"女：切蛋糕我需要什麼？　男：一把刀(knife)和一個乾淨的盤子(plate)。　女：謝謝。　問：女士需要什麼？",en:"A knife and a plate.",zh:"女士需要刀(knife)和盤子(plate)，選 C。"},
{n:17,p:2,o:["On the table.","In the refrigerator.","Next to the stove."],a:1,sen:"M: I bought fresh milk. Where should it go? &nbsp;W: It goes bad when it is warm. Don't put it on the table or next to the stove. &nbsp;M: Okay. &nbsp;Q: Where should the milk go?",szh:"男：我買了新鮮牛奶，該放哪裡？　女：牛奶變熱就會壞掉，不要放在桌上或爐子旁邊。　男：好。　問：牛奶該放哪裡？",en:"In the refrigerator.",zh:"牛奶怕熱，不能放桌上或爐子旁，要放冰箱(refrigerator)，選 B。A、C 正是女士說不要放的地方。"},
{n:18,p:2,o:["A bed and a desk.","A chair and a bookcase.","A sofa and a small table."],a:2,sen:"W: What furniture did you order for the living room? &nbsp;M: A comfortable sofa and a small table. &nbsp;W: Nice choice. &nbsp;Q: What did the man order?",szh:"女：客廳你訂了什麼家具？　男：一張舒服的沙發(sofa)和一張小桌子(table)。　女：不錯。　問：男士訂了什麼？",en:"A sofa and a table.",zh:"男士訂了沙發(sofa)和桌子(table)，選 C。"},
{n:19,p:2,o:["A towel and some soap.","A hat and a camera.","A book and a pen."],a:0,sen:"M: What should I bring to the pool? &nbsp;W: You will be wet when you come out. And the shower room has nothing to wash with. &nbsp;M: Okay. &nbsp;Q: What should the man bring?",szh:"男：去游泳池我該帶什麼？　女：你出來時全身會濕，而且淋浴間沒有任何可以洗澡的東西。　男：好。　問：男士該帶什麼？",en:"A towel and some soap.",zh:"身體濕了要擦乾、沒洗澡用品，所以要帶毛巾(towel)和肥皂(soap)，選 A。帽子、相機與書都不是游泳後需要的。"},
{n:20,p:2,o:["On New Year's Day.","On Valentine's Day.","On Teacher's Day."],a:1,sen:"M: When did he give her the gift? &nbsp;W: It was February fourteenth, and he also gave her a red rose. &nbsp;M: How romantic. &nbsp;Q: When did he give the gift?",szh:"男：他什麼時候送她禮物的？　女：是二月十四日，他還送了她一朵紅玫瑰。　男：好浪漫。　問：他何時送禮物？",en:"On Valentine's Day.",zh:"二月十四日加上紅玫瑰是情人節(Valentine's Day)，選 B。新年與教師節的日期都不對。"},
{n:21,p:2,o:["A friend helped him.","He bought a new one.","He fixed it himself."],a:2,sen:"W: How did your brother fix the bike? &nbsp;M: He didn't ask anyone. You can try it by yourself, too. &nbsp;W: I'll try. &nbsp;Q: How did the brother fix the bike?",szh:"女：你弟弟怎麼修好腳踏車的？　男：他沒問任何人。你也可以自己(yourself)試試。　女：我會試。　問：弟弟怎麼修好腳踏車？",en:"He fixed it himself.",zh:"他沒問任何人，表示是自己(himself)修的，選 C。朋友幫忙與買新的都與對話不符。"},
{n:22,p:2,o:["To Singapore.","To Japan.","To Canada."],a:0,sen:"M: Where is your family flying this summer? &nbsp;W: To Singapore, to see the city and the food. &nbsp;M: Have fun! &nbsp;Q: Where is the family flying?",szh:"男：你家今夏要飛去哪？　女：去新加坡(Singapore)，看看城市和美食。　男：玩得開心！　問：這家人要飛去哪？",en:"To Singapore.",zh:"這家人要飛去新加坡(Singapore)，選 A。"},
{n:23,p:2,o:["Turn up the TV.","Open the door.","Call his mother."],a:1,sen:"W: Did you hear that? &nbsp;M: Hear what? I can hardly hear anything with the TV on. &nbsp;W: Listen! Someone is knocking, I think. &nbsp;Q: What will the man probably do next?",szh:"女：你聽到了嗎？　男：聽到什麼？電視開著我幾乎(hardly)聽不到任何東西。　女：聽！我想有人在敲(knock)門。　問：男士接下來可能做什麼？",en:"Open the door.",zh:"有人在敲(knock)門，男士接著最可能去開門，選 B。調大電視會更聽不到，所以 A 錯。"},
{n:24,p:2,o:["A watermelon and a tangerine.","A banana and an apple.","A melon and a lemon."],a:0,sen:"M: What fruit should we buy for the party? &nbsp;W: One big green one that is red and sweet inside, and a small orange one. &nbsp;M: Sounds yummy. &nbsp;Q: What fruit will they buy?",szh:"男：派對我們該買什麼水果？　女：一顆外面綠綠、裡面紅紅甜甜的大水果，和一顆橘色的小水果。　男：聽起來好吃。　問：他們要買什麼水果？",en:"A watermelon and a tangerine.",zh:"外綠內紅的大水果是西瓜(watermelon)，橘色小水果是橘子(tangerine)，選 A。瓜(melon)外綠但裡面不是紅色。"},
{n:25,p:2,o:["Borrow a good book.","Buy a new bike.","Sell his old kite."],a:0,sen:"W: What will you do after class? &nbsp;M: Borrow a good book at the bookstore near school. &nbsp;W: Enjoy reading. &nbsp;Q: What will the man do after class?",szh:"女：下課後你要做什麼？　男：去學校附近的書店(bookstore)借(borrow)一本好書。　女：閱讀愉快。　問：男士下課後要做什麼？",en:"Borrow a book at the bookstore.",zh:"男士要去書店(bookstore)借(borrow)書，選 A。"},

{n:26,p:3,pic:true,o:[BARS("Items Sold",["Pot","Towel","Kite"],[50,80,20]),BARS("Items Sold",["Pot","Towel","Kite"],[80,50,20]),BARS("Items Sold",["Pot","Towel","Kite"],[20,50,80])],a:1,sen:"Our shop sells many daily items and counts them each week. Pots sold the most, because people cook more at home now and think a good pot is important. Towels were in the middle, and kites sold the fewest, since it is not the windy season. It is easy to see that the pot bar should be the tallest. &nbsp;Q: Which chart shows the items sold?",szh:"我們店賣許多日常用品(item)，每週統計。鍋子(pot)賣最多，因為大家現在多在家煮飯，覺得好鍋子很重要(important)；毛巾(towel)中等；風箏(kite)最少，因為不是有風的季節。很容易(easy)看出鍋子長條最高。　問：哪張圖顯示物品銷量？",en:"Pots most, kites least.",zh:"鍋子最多、風箏最少，符合『Pot 最高』的圖，選 B。毛巾在中間，容易誤選。"},
{n:27,p:3,pic:true,o:[BARS("Gift Ideas",["Soap","Book","Toy"],[80,55,30]),BARS("Gift Ideas",["Soap","Book","Toy"],[55,80,30]),BARS("Gift Ideas",["Soap","Book","Toy"],[30,55,80])],a:0,sen:"For Valentine's Day, our class voted on the best gift idea, and the winning idea got a small prize. Soap was the most popular, because it is useful and cheap. A book from the bookstore was in the middle, and a toy was the least popular. Our teacher asked us to pay attention to the numbers. So the soap bar is the highest and the toy the lowest. &nbsp;Q: Which chart shows the gift ideas?",szh:"為了情人節(Valentine's Day)，我們班票選最好的禮物點子，勝出的點子有小獎品(prize)。肥皂(soap)最受歡迎，因為實用又便宜；書店(bookstore)的書中等；玩具最少。老師要我們注意(attention)數字。所以肥皂最高、玩具最低。　問：哪張圖顯示禮物點子？",en:"Soap most, toy least.",zh:"肥皂最多、玩具最少，符合『Soap 最高、Toy 最低』的圖，選 A。書店的書在中間，容易誤選。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:0,sen:"When we go camping, we bring only simple tools and one small pot, because the purpose of the trip is to rest. We can hardly make heavy noodles or steam rice without a real stove. The solution is easy: we usually toast some bread over the fire, spread jam on it, and enjoy it under the stars. &nbsp;Q: What do they eat while camping?",szh:"我們露營時只帶簡單工具(tool)和一個小鍋(pot)，因為旅行的目的(purpose)是休息。沒有真正的爐子(stove)幾乎(hardly)不能煮麵或蒸飯。解決辦法(solution)很簡單(easy)：我們通常(usually)在火上烤麵包，塗上果醬(jam)，在星空下享用。　問：他們露營時吃什麼？",en:"Toasted bread with jam.",zh:"他們吃烤麵包(bread)，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:2,sen:"My aunt in Singapore invited us for dinner. Her kitchen has a shiny wok, a big refrigerator and a fish tank. She did not serve dry rice or plain bread that night. Instead, she cooked a huge plate of fried noodles, a dish that everyone admired. &nbsp;Q: What did the aunt cook for dinner?",szh:"我在新加坡(Singapore)的阿姨請我們吃晚餐。她的廚房有亮亮的炒鍋(wok)、大冰箱(refrigerator)和一個魚缸(tank)。那晚她沒端白飯或普通麵包，而是炒了一大盤麵，一道大家都讚賞(admire)的菜。　問：阿姨晚餐煮了什麼？",en:"A plate of fried noodles.",zh:"阿姨炒了麵(noodles)，選 C。飯、麵包為干擾。"},
{n:30,p:3,pic:true,o:[IMG('beach'),IMG('mountain'),IMG('park')],a:0,sen:"On Valentine's Day, our whole family wanted a fun day out. My father liked the mountain and my brother liked the park. But we chose the beach, because we could sit upon the warm sand, apply sunscreen, fly a pink kite with a long rope, and admire the sunset together to express our love. &nbsp;Q: Where did the family spend the day?",szh:"情人節(Valentine's Day)那天，全家想出遊。爸爸喜歡山，弟弟喜歡公園，但我們選了海邊，因為可以坐在(upon)溫暖的沙上、擦(apply)防曬乳、用長繩(rope)放粉紅色(pink)風箏(kite)，一起欣賞(admire)夕陽，表達(express)我們的愛。　問：一家人在哪裡度過這一天？",en:"The beach.",zh:"一家人去海邊(beach)，選 A。山、公園為干擾。"}
];

/* ====== 音檔播放（AAC/.m4a，各廠牌手機皆支援）====== */
let curAudio=null, curBtn=null;
function resetPlayBtn(b){ if(!b) return; b.classList.remove('playing'); b.querySelector('.txt').textContent = b.dataset.played?'重播':'播放'; }
function stopAudio(){ if(curAudio) curAudio.pause(); if(curBtn) resetPlayBtn(curBtn); curAudio=null; curBtn=null; }
function playAudio(audio,btn){
  if(curAudio===audio){                       // 同一題：暫停 / 繼續
    if(audio.paused){ audio.play(); btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…'; }
    else { audio.pause(); }
    return;
  }
  if(curAudio){ curAudio.pause(); resetPlayBtn(curBtn); }   // 換題：停掉上一段
  curAudio=audio; curBtn=btn; btn.dataset.played='1';
  btn.classList.add('playing'); btn.querySelector('.txt').textContent='播放中…';
  audio.play().catch(()=>resetPlayBtn(btn));
}

/* ====== 產生畫面 ====== */
const form=document.getElementById('quiz');
let lastP=-1;
Q.forEach(q=>{
  if(q.p!==lastP){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].t;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].d;
    form.appendChild(st); form.appendChild(sd); lastP=q.p;
  }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const head=document.createElement('div'); head.className='qhead';
  head.innerHTML=`<span class="num">${q.n}</span>
    <button type="button" class="play"><span class="wave">🔊</span><span class="txt">播放</span></button>
    <span class="hintq">聆聽後作答</span>`;
  card.appendChild(head);
  const audio=document.createElement('audio'); audio.preload='none'; audio.src='gept-listening-audio/14/q'+q.n+'.m4a?v=r14p0c-20261003'; card.appendChild(audio);
  const pbtn=head.querySelector('.play');
  pbtn.addEventListener('click',()=>playAudio(audio,pbtn));
  audio.addEventListener('ended',()=>{ if(curBtn===pbtn){ resetPlayBtn(pbtn); curAudio=null; curBtn=null; } });
  audio.addEventListener('pause',()=>{ if(curAudio===audio && curBtn===pbtn && !audio.ended){ pbtn.classList.remove('playing'); pbtn.querySelector('.txt').textContent='繼續'; } });
  if(q.fig){ const f=document.createElement('div'); f.className='fig'; f.innerHTML=q.fig; card.appendChild(f); }
  if(q.pic){
    if(q.legend){ const lg=document.createElement('div'); lg.innerHTML=PIE_LEGEND; card.appendChild(lg.firstChild); }
    const wrap=document.createElement('div'); wrap.className='picopts';
    q.o.forEach((opt,i)=>{
      const cell=document.createElement('label'); cell.className='picopt'; cell.dataset.i=i;
      cell.innerHTML=`<span class="lab">${'ABC'[i]}</span>${opt}<input type="radio" name="q${q.n}" value="${i}" hidden>`;
      cell.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.picopt').forEach(o=>o.classList.remove('sel')); cell.classList.add('sel'); updateProgress(); });
      wrap.appendChild(cell);
    });
    card.appendChild(wrap);
  } else {
    q.o.forEach((opt,i)=>{
      const lab=document.createElement('label'); lab.className=(q.p===0?'opt listen':'opt'); lab.dataset.i=i;
      lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABC'[i]}</span><span class="otext">${opt}</span>`;
      lab.querySelector('input').addEventListener('change',()=>{ card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); lab.classList.add('sel'); updateProgress(); });
      card.appendChild(lab);
    });
  }
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n; card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
const TOT=Q.length;
function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOT}`;
  document.getElementById('fill').style.width=(c/TOT*100)+'%';
  hint.textContent = c===TOT ? '已完成全部 30 題' : (c===0 ? '尚未作答任何題目（仍可送出查看解析）' : `已作答 ${c} 題，未作答 ${TOT-c} 題（仍可送出）`);
}

submitBtn.addEventListener('click',()=>{
  stopAudio();
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick=sel?parseInt(sel.value):null;
    if(pick===null) blank++;
    const card=document.getElementById('q'+q.n);
    const cls=q.pic?'.picopt':'.opt';
    card.querySelectorAll(cls).forEach(o=>{
      o.classList.add('lock');
      const inp=o.querySelector('input'); if(inp) inp.disabled=true;
      const i=parseInt(o.dataset.i);
      if(i===q.a) o.classList.add('correct');
      if(pick!==null && i===pick && pick!==q.a) o.classList.add('wrong');
    });
    const correct=pick===q.a; if(correct) ok++;
    const exp=document.getElementById('exp'+q.n);
    const tag=correct?'答對':(pick===null?'未作答':'答錯');
    exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABC'[q.a]}</span>
      <div class="scriptbox"><b>聽力原文</b>　${q.sen}<br><span style="color:#7a4a12">${q.szh}</span></div>
      <div class="en"><b>EN</b>&nbsp;${q.en}</div><div class="zh"><b>中</b>&nbsp;${q.zh}</div>`;
    exp.classList.add('show');
  });
  document.getElementById('scoreNum').textContent=Math.round(ok/TOT*120);
  document.getElementById('scoreTxt').textContent=`／120 分　${Math.round(ok/TOT*120)>=80?'達參考通過線 ✅':'未達通過線（80）'}（答對 ${ok}／${TOT} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOT-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  try{
    var _m=location.pathname.match(/gept-listening-(\d+)\.html/);
    var _round=_m?parseInt(_m[1]):0;
    var _ans=Q.map(function(q){var s=form.querySelector('input[name="q'+q.n+'"]:checked');var pk=s?parseInt(s.value):null;return {n:q.n,p:q.p,pick:pk,a:q.a,ok:pk===q.a};});
    var _rec={round:_round,date:new Date().toISOString(),score:Math.round(ok/TOT*120),total:TOT,correct:ok,blank:blank,ans:_ans};
    var _K='efetl_listening_results';
    var _all=JSON.parse(localStorage.getItem(_K)||'[]');
    _all.push(_rec);
    localStorage.setItem(_K,JSON.stringify(_all.slice(-800)));
    if(window.EFETL_CLOUD){EFETL_CLOUD.upload(_rec);}
  }catch(_e){}
  const res=document.getElementById('result'); res.classList.add('show');
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  stopAudio(); form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt,.picopt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');const inp=o.querySelector('input');if(inp)inp.disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress(); window.scrollTo({top:0,behavior:'smooth'});
});

updateProgress();
</script>

<script id="ak-core">(function(){
if(window.AK)return;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(secs){
 if(!secs)return[];
 if(!Array.isArray(secs[0]&&secs[0].items)&&Array.isArray(secs))secs=[{title:'',items:secs}];
 return secs.map(function(s){return{title:s.title||'',items:(s.items||[]).map(function(x,i){return Array.isArray(x)?[x[0],x[1]]:[i+1,x]})}}).filter(function(s){return s.items.length});
}
function table(s){
 var long=s.items.some(function(x){return String(x[1]).length>3});
 var h=s.title?'<h3>'+esc(s.title)+'</h3>':'';
 if(long){
  return h+'<ol class="ak-list">'+s.items.map(function(x){return'<li><b>'+esc(x[0])+'.</b> '+esc(x[1])+'</li>'}).join('')+'</ol>';
 }
 var out=h;
 for(var i=0;i<s.items.length;i+=10){
  var r=s.items.slice(i,i+10);
  out+='<table class="ak-t"><tr><th>題號</th>'+r.map(function(x){return'<th>'+esc(x[0])+'</th>'}).join('')+'</tr><tr><th>答案</th>'+r.map(function(x){return'<td>'+esc(x[1])+'</td>'}).join('')+'</tr></table>';
 }
 return out;
}
window.AK=function(fn){
 function run(){
  var secs;
  try{secs=norm(typeof fn==='function'?fn():fn)}catch(e){console.warn('AK',e);return}
  window.__AK_DATA=secs;
  if(!secs.length)return;
  var n=secs.reduce(function(a,s){return a+s.items.length},0);
  var btn=document.createElement('button');btn.id='ak-btn';btn.type='button';btn.textContent='📋 答案總表';if(window.AK_BTN_STYLE)btn.style.cssText=window.AK_BTN_STYLE;
  var box=document.createElement('div');box.id='ak-box';
  box.innerHTML='<div class="ak-card" role="dialog" aria-label="答案總表"><div class="ak-head"><b>📋 答案總表（教師用，共 '+n+' 題）</b><span><button type="button" class="ak-p">🖨 列印答案</button><button type="button" class="ak-x" aria-label="關閉">✕</button></span></div><div class="ak-body">'+secs.map(table).join('')+'</div></div>';
  document.body.appendChild(btn);document.body.appendChild(box);
  function close(){box.classList.remove('show');document.documentElement.classList.remove('ak-on')}
  btn.onclick=function(){box.classList.add('show');document.documentElement.classList.add('ak-on')};
  box.querySelector('.ak-x').onclick=close;
  box.onclick=function(e){if(e.target===box)close()};
  box.querySelector('.ak-p').onclick=function(){window.print()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
 }
 if(document.readyState==='complete')setTimeout(run,0);else window.addEventListener('load',function(){setTimeout(run,0)});
};
})();</script>
