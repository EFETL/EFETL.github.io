<div id="root"></div>
<script>
/* 圖形素材（第29回 規則與公共服務） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/29/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/29/p3_${n}.jpg?v=r29hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const GOVBUILDING=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q1.jpg" alt="question 1 picture">`;
const GAVEL=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q2.jpg" alt="question 2 picture">`;
const BALLOT=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q3.jpg" alt="question 3 picture">`;
const EAGLE=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q4.jpg" alt="question 4 picture">`;
const CHESS=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:GOVBUILDING,o:["There are red flowers in front of the large white building.","There are yellow flowers in front of the large white building.","Many citizens are standing on the grass in front of the building."],a:0,sen:"For question one, look at the picture. What can you see in front of the government building?",szh:"第一題，請看圖片。在這棟政府(government)建築前面可以看到什麼？",en:"There are red flowers in front of the large white building.",zh:"大(large)白色建築前面的草地上有一圈紅色的花，正確。花是紅色，不是黃色；草地上一個人都沒有，沒有很多市民(citizen)站著。選 A"},
{n:2,p:0,fig:GAVEL,o:["A judge's hammer is on the desk next to three books.","A judge's hammer is on top of three books.","A judge's hammer is on the desk next to two books."],a:0,sen:"For question two, look at the picture. What is on the judge's desk?",szh:"第二題，請看圖片。法官(judge)的桌上有什麼？",en:"A judge's hammer is on the desk next to three books.",zh:"法官(judge)的木槌放在桌上，旁邊疊著三本厚書，正確。木槌是放在桌面上，不在書的上面；書是三本，不是兩本。選 A"},
{n:3,p:0,fig:BALLOT,o:["A woman is taking papers out of the box, and nobody is waiting.","A man is putting his vote into the box, and others are waiting in line.","A woman is putting her vote into the box, and others are waiting in line."],a:2,sen:"For question three, look at the picture. What is happening at the election center?",szh:"第三題，請看圖片。投票所(election center)裡正在發生什麼事？",en:"A woman is putting her vote into the box, and others are waiting in line.",zh:"一位女士正把選票(vote)投進透明的箱子，後面還有很多人拿著選票排隊，正確。投票的是女士，不是男士；她是把紙放進去，不是拿出來，而且後面有很多人在等。選 C"},
{n:4,p:0,fig:EAGLE,o:["An eagle with a white head is sitting in a tree.","Two eagles are flying in the blue sky.","An eagle with a white head is flying with its wings open."],a:2,sen:"For question four, look at the picture. What is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"An eagle with a white head is flying with its wings open.",zh:"一隻白頭的老鷹(eagle)張開翅膀在藍天飛(fly)，正確。圖中只有一隻，不是兩隻；牠在天上飛，不是停在樹上。選 C"},
{n:5,p:0,fig:CHESS,o:["Two people are playing chess, and one is moving a white piece.","Two people are playing chess, and one is moving a black piece.","Two people are playing cards at a table."],a:0,sen:"For question five, look at the picture. What are the people doing?",szh:"第五題，請看圖片。這些人在做什麼？",en:"Two people are playing chess, and one is moving a white piece.",zh:"兩個人在下西洋棋(chess)，左邊的人正用手拿起一顆白色(淺色)的棋子，正確。他拿的是白棋，不是黑棋；桌上是棋盤，不是在玩紙牌。選 A"},
{n:6,p:1,o:["Yes, I voted twice.","I don't know yet. I need to learn more about them.","Last Sunday, at the school center."],a:1,sen:"Who will you vote for in the election?",szh:"選舉(election)你要投(vote)給誰？",en:"I don't know yet. I need to learn more about them.",zh:"問要投給「誰」，答「我還不知道(know)，要多(more)了解他們」是很自然的回答。「上週日在學校活動中心(center)」答的是時間和地點；用 Yes 回答 who 問句不對，而且投兩次(twice)也不合理。選 B"},
{n:7,p:1,o:["Sure, I'll babysit him tonight.","Yes, dinner is at six.","Really? He bought me dinner last week."],a:2,sen:"My uncle never pays for dinner. He's so stingy.",szh:"我叔叔從來不付晚餐錢，他好小氣。",en:"Really? He bought me dinner last week.",zh:"對方說叔叔很小氣(stingy)，回「真的嗎？他上週還請我吃晚餐(dinner)」是自然地表示不同看法。「好，我今晚會照顧(babysit)他」把叔叔當小孩，不合理；「是的，晚餐六點開始」只是重複 dinner。選 C"},
{n:8,p:1,o:["Last week, with some diplomats.","He has been there twice.","To talk with their leaders about a new trade policy."],a:2,sen:"Why did the president visit Korea?",szh:"總統(president)為什麼去韓國(Korea)？",en:"To talk with their leaders about a new trade policy.",zh:"問「為什麼」去，答「去和他們的領袖談新的貿易政策(policy)」是目的。「上週和一些外交官(diplomat)一起」答的是時間和同行的人；「他去過兩次(twice)」答的是次數。選 C"},
{n:9,p:1,o:["My cousin sent it. She studies overseas.","Britain is a great country.","I'll send you one, too."],a:0,sen:"Where did you get this postcard from Britain?",szh:"這張英國(Britain)寄來的明信片(postcard)你是從哪裡拿到的？",en:"My cousin sent it. She studies overseas.",zh:"問明信片(postcard)哪來的，答「我表姊寄的，她在國外(overseas)讀書」說明來源。「英國是很棒(great)的國家」只是重複 Britain；「我也寄一張給你」沒有回答是哪來的。選 A"},
{n:10,p:1,o:["Excuse me, is this chess set yours?","No problem. Take your time.","I learned it twice."],a:1,sen:"I'm a beginner at chess, so please don't play too fast.",szh:"我是西洋棋(chess)初學者(beginner)，請不要下太快。",en:"No problem. Take your time.",zh:"對方說自己是初學者(beginner)、請不要下太快，回「沒問題，慢慢來」最自然。「不好意思(excuse me)，這副棋是你的嗎？」答非所問；「我學了兩次(twice)」不合理，也沒回應對方的請求。選 B"},
{n:11,p:1,o:["My regular barber on King Road.","About twice a month.","It's a quarter past nine."],a:1,sen:"How often do you get your hair cut?",szh:"你多久剪一次頭髮？",en:"About twice a month.",zh:"問「多久」剪一次頭髮，答「大約一個月兩次(twice)」是頻率。「King 路上我常去的(regular)理髮師(barber)」答的是在哪裡、給誰剪；「九點十五分(quarter)」答的是時刻，不是頻率。選 B"},
{n:12,p:1,o:["It suddenly stopped on the bridge.","It's a modern bus from China.","Number twenty-five goes to the pool."],a:0,sen:"What happened to the bus engine?",szh:"公車的引擎(engine)怎麼了？",en:"It suddenly stopped on the bridge.",zh:"問引擎(engine)發生什麼事，答「它在橋上突然(sudden)停了」才是發生的事。「它是中國(China)來的新型(modern)公車」只是介紹公車；「二十五號(number)公車去游泳池(pool)」說的是路線。選 A"},
{n:13,p:1,o:["Her name is Ms. Lee.","Yes. She took care of my sister's kids for two years.","I'll babysit on Sunday."],a:1,sen:"Can we trust the new babysitter?",szh:"我們可以信任(trust)新來的保母嗎？",en:"Yes. She took care of my sister's kids for two years.",zh:"問能不能信任(trust)保母，答「可以，她照顧我姊姊的孩子兩年了」給出理由。「我星期日會當保母(babysit)」變成自己去照顧，人物不對；「她的名字(name)是李小姐」答的是她是誰，沒說能不能信任。選 B"},
{n:14,p:1,o:["Calm down. It's not your fault.","The weather is calm today.","She always knows what to do."],a:2,sen:"Dad was really angry, but Mom stayed calm.",szh:"爸爸很生氣，但媽媽保持冷靜。",en:"She always knows what to do.",zh:"對方說媽媽很冷靜(calm)，回「她總是知道(know)該怎麼做」是接著稱讚媽媽。「冷靜下來，不是你的錯」把對方當成生氣的人，人物不對；「今天天氣很平靜」只是借用 calm 的另一個意思。選 C"},
{n:15,p:1,o:["Not really. The man at the shop said about fifty dollars.","The photographer took a picture of it.","Yes, it's a modern painting."],a:0,sen:"Is this old painting worth a lot of money?",szh:"這幅舊畫值(worth)很多錢嗎？",en:"Not really. The man at the shop said about fifty dollars.",zh:"問舊畫值不值(worth)很多錢，答「不太值，店裡的人說大約五十元」直接回答價值。「是的，它是現代(modern)畫」和「舊畫」矛盾；「攝影師(photographer)拍了它的照片」沒有回答值多少錢。選 A"},
{n:16,p:2,o:["The woman's brother.","Someone from the county.","The woman."],a:0,sen:"M: I got a letter about my house from the county, but I don't understand it. &nbsp;W: My brother is a lawyer. He can read it for you. &nbsp;M: Is he expensive? &nbsp;W: For you, it's free. &nbsp;Q: Who will help the man?",szh:"男：我收到縣(county)政府寄來一封關於我房子的信，但我看不懂。　女：我哥哥是律師(lawyer)，他可以幫你看。　男：他會很貴嗎？　女：對你免費。　問：誰會幫男士？",en:"The woman's brother.",zh:"女士說她哥哥是律師(lawyer)，可以幫男士看信，所以幫忙的是女士的哥哥。女士只是介紹人，不是她自己看；縣政府(county)是寄信來的單位，不是幫忙的人。選 A"},
{n:17,p:2,o:["Twenty.","Twelve.","Thirty-two."],a:1,sen:"W: How many people voted in the class election? &nbsp;M: Thirty-two. Amy got twenty votes. &nbsp;W: And Ben? &nbsp;M: He got all the rest. &nbsp;Q: How many votes did Ben get?",szh:"女：班上選舉(election)有多少人投票(vote)？　男：三十二人。Amy 得到二十票。　女：那 Ben 呢？　男：剩下的全是他的。　問：Ben 得到幾票？",en:"Twelve.",zh:"總共三十二票，Amy 二十票，剩下三十二減二十是十二票。二十票是 Amy 的票數；三十二是投票總人數。選 B"},
{n:18,p:2,o:["The woman has seven more days.","The shop is right.","The woman can return the shoes."],a:1,sen:"W: The shop claims I can't return these shoes. &nbsp;M: But you have the right to return them in seven days. &nbsp;W: I bought them ten days ago. &nbsp;M: Oh. Then I'm afraid they're right. &nbsp;Q: What does the man mean at the end?",szh:"女：那家店聲稱(claim)我不能退這雙鞋。　男：可是你有權利(right)在七天內退貨。　女：我是十天前買的。　男：喔，那恐怕店家是對的(right)。　問：男士最後的意思是什麼？",en:"The shop is right.",zh:"七天內才能退，她已經買了十天，所以男士最後同意店家是對的。她已經超過期限，不能退鞋；七天是退貨期限，不是她還剩七天。選 B"},
{n:19,p:2,o:["He teaches law.","He works in China.","He's a diplomat in Britain."],a:0,sen:"W: Your father works overseas, right? &nbsp;M: He did for twenty years. He was a diplomat in Britain and China. &nbsp;W: Where is he now? &nbsp;M: He came home last year. Now he teaches law at a university. &nbsp;Q: What does the man's father do now?",szh:"女：你爸爸在國外(overseas)工作，對吧？　男：他做了二十年，在英國(Britain)和中國(China)當外交官(diplomat)。　女：他現在在哪？　男：他去年回國了，現在在大學教法律(law)。　問：男士的爸爸現在做什麼？",en:"He teaches law.",zh:"在英國和中國當外交官是以前二十年的工作，去年回國後在大學教法律(law)。當外交官、在中國工作都是過去的事。選 A"},
{n:20,p:2,o:["An hour.","Forty-five minutes.","Fifteen minutes."],a:1,sen:"W: Let's go swimming at the public pool. &nbsp;M: It closes at five, and it's already a quarter past four. &nbsp;W: We can still swim for a while. Let's go! &nbsp;Q: How much time do they have before the pool closes?",szh:"女：我們去公共游泳池(pool)游泳吧。　男：它五點關，現在已經四點十五分(quarter past four)了。　女：還是可以游一下，走吧！　問：游泳池關門前他們還有多少時間？",en:"Forty-five minutes.",zh:"現在四點十五分，五點關門，所以還有四十五分鐘。十五分鐘是把 quarter 直接當答案；一小時是忘了已經過了十五分鐘。選 B"},
{n:21,p:2,o:["She makes a lot of money.","She teaches chess.","She takes pictures for work."],a:2,sen:"M: Is your sister still a chess teacher? &nbsp;W: No, she's a photographer now. She takes pictures for a newspaper. &nbsp;M: Does she like it? &nbsp;W: She loves it, but the pay isn't great. &nbsp;Q: What is true about the woman's sister?",szh:"男：你姊姊還在教西洋棋(chess)嗎？　女：沒有，她現在是攝影師(photographer)，替報社拍照。　男：她喜歡嗎？　女：她很喜歡，但薪水不怎麼好(great)。　問：關於女士的姊姊何者正確？",en:"She takes pictures for work.",zh:"姊姊現在是攝影師(photographer)，「替報社拍照」就是她的工作。教西洋棋是以前的工作；薪水不怎麼好，所以不是賺很多錢。選 C"},
{n:22,p:2,o:["He builds cars for money.","He works at a car factory.","He learned from videos."],a:2,sen:"M: My brother can build a car engine by himself. &nbsp;W: Wow! Does he work at a car factory? &nbsp;M: No, he's still a student. He learned everything from videos. &nbsp;Q: What do we know about the man's brother?",szh:"男：我哥哥可以自己組裝(build)汽車引擎(engine)。　女：哇！他在汽車工廠工作嗎？　男：不是，他還是學生，全都是看影片學的。　問：關於男士的哥哥我們知道什麼？",en:"He learned from videos.",zh:"男士說哥哥是看影片學會組裝引擎的。女士問他是不是在汽車工廠工作，男士說不是；他還是學生，沒有靠組裝汽車賺錢。選 C"},
{n:23,p:2,o:["He was sick.","He was too expensive.","He wasn't good."],a:1,sen:"W: You look so handsome! New haircut? &nbsp;M: Yes. My regular barber was sick, so I went to a new one. &nbsp;W: Will you go back to the new one? &nbsp;M: No. He was good, but he charged twice as much. &nbsp;Q: Why won't the man go back to the new barber?",szh:"女：你好帥(handsome)！剛剪頭髮？　男：對。我常去的(regular)理髮師(barber)生病了，所以我去了一家新的。　女：你還會再去那家新的嗎？　男：不會。他剪得很好，但收費是兩倍(twice)。　問：男士為什麼不再去新的理髮師那裡？",en:"He was too expensive.",zh:"新理髮師收費是兩倍，換句話說就是「太貴」。男士說他剪得很好，所以不是技術不好；生病的是原本常去的理髮師，不是新的那位。選 B"},
{n:24,p:2,o:["Mrs. Wang.","A cook in the kitchen.","Mrs. Wang's sister."],a:2,sen:"M: Excuse me, are you Mrs. Wang? &nbsp;W: No, I'm her sister. She's in the kitchen. &nbsp;M: Oh, sorry. You look just like her. &nbsp;Q: Who is the woman?",szh:"男：不好意思(excuse me)，請問您是王太太嗎？　女：不是，我是她妹妹。她在廚房。　男：喔，抱歉，你們長得好像。　問：這位女士是誰？",en:"Mrs. Wang's sister.",zh:"女士說自己不是王太太，而是她的妹妹。王太太本人在廚房；廚房是王太太所在的地方，女士不是廚師。選 C"},
{n:25,p:2,o:["Three thousand.","One thousand.","Two thousand."],a:0,sen:"W: Did the number of visitors to our town decrease this year? &nbsp;M: No, it went up. &nbsp;W: Really? How many came last year? &nbsp;M: Two thousand. And this year, a thousand more came. &nbsp;Q: How many visitors came this year?",szh:"女：今年來我們鎮上的遊客人數(number)減少(decrease)了嗎？　男：沒有，增加了。　女：真的？去年來了多少人？　男：兩千人。今年又多(more)了一千人。　問：今年來了多少遊客？",en:"Three thousand.",zh:"去年兩千人，今年多了一千人，所以是三千人。兩千是去年的人數；一千是增加的人數。選 A"},
{n:26,p:3,pic:true,o:[BARS("What to Build",["Pool","Library","Park"],[80,50,20]),BARS("What to Build",["Pool","Library","Park"],[50,80,20]),BARS("What to Build",["Pool","Library","Park"],[20,50,80])],a:1,sen:"Our county asked citizens what the government should build next. Many people thought a new pool would win, because our summers are so hot. But the library got more votes than the pool. The park got the fewest votes, because we already have a large one. &nbsp;Q: Which chart shows the votes?",szh:"我們縣(county)問市民(citizen)政府(government)下一個該蓋(build)什麼。很多人以為新游泳池(pool)會贏，因為夏天很熱。但圖書館得到的票(vote)比游泳池多(more)。公園得票最少，因為我們已經有一座大(large)公園了。　問：哪張圖顯示投票結果？",en:"Library most, pool second, park fewest.",zh:"圖書館比游泳池多，公園最少，所以圖書館最高、游泳池第二、公園最低。游泳池最高的那張是大家原本以為的結果；公園最高的那張和「公園最少」相反。選 B"},
{n:27,p:3,pic:true,o:[BARS("Class Election",["Ken","Lisa","Tom"],[60,80,40]),BARS("Class Election",["Ken","Lisa","Tom"],[80,40,60]),BARS("Class Election",["Ken","Lisa","Tom"],[80,60,40])],a:2,sen:"Last Friday, our class held an election to elect a class president. Our teacher wrote down each vote on the blackboard with chalk. When the counting began, Lisa was ahead. But in the end, Ken got the most votes, twice as many as Tom. Tom was not happy that he came in last. &nbsp;Q: Which chart shows the election result?",szh:"上星期五我們班舉行選舉(election)，要選(elect)出班長(president)。老師用粉筆(chalk)把每一票(vote)寫在黑板上。剛開始計票時 Lisa 領先。但最後 Ken 得票最多，是 Tom 的兩倍(twice)。Tom 很不高興自己是最後一名。　問：哪張圖表是這次選舉的結果？",en:"Ken most, Lisa second, Tom last.",zh:"最後 Ken 最多、是 Tom 的兩倍(twice)，Tom 最後一名，所以 Lisa 是第二，選 Ken 最高、Lisa 第二、Tom 最低的圖。Lisa 最高的那張只是「剛開始計票」時的情形；Ken 最高但 Tom 比 Lisa 多的那張，和「Tom 是最後一名」相反。選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28a'),PH('q28c')],a:2,sen:"My cousin joined the police force last year. At first, he walked around the town center every day. He hoped to drive a police car this year, but he didn't get the job. Now he rides a bicycle in the large park by the river. People there respect him, because he is always calm and kind. &nbsp;Q: How does the cousin do his job now?",szh:"我表哥去年加入警察(police force)。一開始，他每天在市中心(center)走路巡邏。他希望今年能開警車，但沒有被選上。現在他在河邊的大(large)公園騎腳踏車巡邏。那裡的人都很尊敬(respect)他，因為他總是冷靜(calm)又親切。　問：表哥現在怎麼執行勤務？",en:"He rides a bicycle in the park.",zh:"走路巡邏市中心是去年剛開始的工作；開警車是他希望但沒做到的；現在是在公園騎腳踏車。走路和開警車的照片都不是他現在的工作方式。選 C"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29c'),PH('q29a')],a:0,sen:"My aunt is a diplomat in Korea, and she sends me something every birthday. When I was little, she always sent toys. Last year, she sent me a book about Korea. This year, she was very busy, so she just sent a postcard with a cool picture of snowy mountains. &nbsp;Q: What did the aunt send this year?",szh:"我阿姨是駐韓國(Korea)的外交官(diplomat)，每年生日都會寄東西給我。我小時候她總是寄玩具。去年她寄了一本關於韓國的書。今年她很忙，只寄了一張明信片(postcard)，上面有很酷(cool)的雪山照片。　問：阿姨今年寄了什麼？",en:"A postcard with a picture of snowy mountains.",zh:"玩具是說話者小時候收到的；書是去年寄的；今年寄的是雪山明信片(postcard)。拿玩具熊和看書的照片都是以前的禮物。選 A"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:1,sen:"Last Saturday, I had to babysit my baby brother. First, I sang to him in his bed, but he didn't stop crying. Then I tried to give him some milk, but he didn't want it. In the end, I held him in my arms and walked around the garden. Thank God, he fell asleep in five minutes. &nbsp;Q: What finally made the baby sleep?",szh:"上週六我得照顧(babysit)小弟弟。一開始我在他床邊唱歌給他聽，但他還是一直哭。接著我想餵他喝奶，但他不要。最後我把他抱(hold)在懷裡，在花園裡走來走去。謝天謝地(Thank God)，他五分鐘就睡著了。　問：最後是什麼讓寶寶睡著的？",en:"Walking around the garden with him in her arms.",zh:"在床邊唱歌，他還是哭；餵奶，他不要；最後抱著他在花園走，他才睡著。唱歌和餵奶的照片都是沒有用的方法。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 29 回　規則與公共服務　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
