<script>
/* 圖形素材（第29回 規則與公共服務） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/29/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const GOVBUILDING=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q1.jpg" alt="question 1 picture">`;
const GAVEL=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q2.jpg" alt="question 2 picture">`;
const BALLOT=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q3.jpg" alt="question 3 picture">`;
const EAGLE=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q4.jpg" alt="question 4 picture">`;
const CHESS=`<img class="pic-img p0img" src="gept-listening-img/29/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:GOVBUILDING,o:["A big hospital where doctors work.","A library where people read books.","A government center where the president works."],a:2,sen:"For question one, look at the picture. What building is this?",szh:"第一題，請看圖片。這是什麼建築？",en:"A government center where the president works.",zh:"這是政府(government)辦公的中心(center)，總統(president)在這裡工作，選 C。醫院和圖書館都不是圖中的建築。"},
{n:2,p:0,fig:GAVEL,o:["A photographer uses this for pictures.","A judge uses this in a courtroom.","A teacher uses this with chalk."],a:1,sen:"For question two, look at the picture. Who uses this tool?",szh:"第二題，請看圖片。誰使用這個工具？",en:"A judge uses this in a courtroom.",zh:"法官(judge)在法庭裡使用這個木槌，選 B。理髮師和老師用的是別的工具。"},
{n:3,p:0,fig:BALLOT,o:["Citizens run a race in the park.","Citizens vote to elect a new leader.","Citizens eat dinner at a long table."],a:1,sen:"For question three, look at the picture. What is happening?",szh:"第三題，請看圖片。發生什麼事？",en:"Citizens vote to elect a new leader.",zh:"公民(citizen)在投票(vote)選出(elect)新的領導人，選 B。賽跑和吃晚餐都不是圖中的事。"},
{n:4,p:0,fig:EAGLE,o:["A great eagle flies in the blue sky.","A large plane flies in the blue sky.","A red kite flies in the blue sky."],a:0,sen:"For question four, look at the picture. What flies in the sky?",szh:"第四題，請看圖片。天空中飛的是什麼？",en:"A great eagle flies in the blue sky.",zh:"選 A。藍天中有一隻巨大（great）的老鷹（eagle）展翅飛翔；天上沒有大飛機（plane），也沒有紅色風箏（kite）。"},
{n:5,p:0,fig:CHESS,o:["Two people play cards at a table.","Two people play chess at a table.","Two people play table tennis nearby."],a:1,sen:"For question five, look at the picture. What game is this?",szh:"第五題，請看圖片。這是什麼遊戲？",en:"Two people play chess at a table.",zh:"兩個人在桌上下西洋棋(chess)，選 B。撲克牌和桌球都不是圖中的遊戲。"},

{n:6,p:1,o:["Yes, I think it's the right policy.","The diplomat made that claim twice.","The meeting is on Tuesday."],a:0,sen:"Do you support the new plan?",szh:"你支持這個新方案嗎？",en:"Yes, I think it's the right policy.",zh:"問是否支持新方案，答『是的，我認為這是正確(right)的政策(policy)』，選 A。B 說外交官(diplomat)主張(claim)過兩次(twice)，C 回答開會時間，都沒回答是否支持。"},
{n:7,p:1,o:["Only a quarter of us can go.","My phone number is on the card.","A large dinner for about forty people."],a:2,sen:"How big is the party tonight?",szh:"今晚的宴會有多大？",en:"A large dinner for about forty people.",zh:"問宴會多大，答『大約四十人的大(large)晚宴(dinner)』，選 C。A 說開始時間，B 說地點，都沒有回答規模。"},
{n:8,p:1,o:["The workers go home at five.","It's across the street from the pool.","They build modern car engines there."],a:2,sen:"What are they making in that factory?",szh:"他們在那間工廠做什麼？",en:"They build modern car engines there.",zh:"問工廠在做什麼，答『他們在那裡打造(build)現代(modern)汽車引擎(engine)』，選 C。A 說下班時間，B 說位置。"},
{n:9,p:1,o:["The station is on Park Road.","I respect the police force.","Thank God, they arrived safely."],a:1,sen:"What do you think of the officers?",szh:"你覺得那些警官如何？",en:"I respect the police force.",zh:"問對警官的看法，答『我尊敬(respect)警察單位(force)』，選 B。A 說警局位置，C 說他們何時到。"},
{n:10,p:1,o:["To China and Korea, I hope.","For two weeks in the summer.","I'll send you a postcard."],a:0,sen:"Where will you travel next year?",szh:"你明年要去哪旅行？",en:"To China and Korea, I hope.",zh:"問明年要去哪，答『希望去中國(China)和韓國(Korea)』，選 A。B 回答多久，C 說要寄明信片(postcard)，沒有說地點。"},
{n:11,p:1,o:["I cut it last Sunday.","About twenty dollars, I think.","My regular barber on Park Street."],a:2,sen:"Who cut your hair so well?",szh:"誰把你的頭髮剪得這麼好？",en:"My regular barber on Park Street.",zh:"問誰剪的頭髮，答『我常去的(regular)理髮師(barber)，在公園街』，選 C。A 重複 cut 但說的是時間，B 回答價錢。"},
{n:12,p:1,o:["Yes, he's a beginner.","A sudden storm stopped him.","Excuse me, is he your brother?"],a:1,sen:"Why was the young hiker so late?",szh:"那位年輕登山客為什麼遲到這麼久？",en:"A sudden storm stopped him.",zh:"問為什麼遲到，答『突然(sudden)來了暴風雨，擋住了他』，選 B。A 用 Yes 回答 Why 問句，C 說的是年紀。"},
{n:13,p:1,o:["The wedding is next Saturday.","They hired two cooks last year.","She's worth it; you can trust her."],a:2,sen:"Should we hire this person for the wedding?",szh:"婚禮我們該請這個人嗎？",en:"She's worth it; you can trust her.",zh:"問該不該請這個人，答『她值得(worth)，你可以信任(trust)她』，選 C。A 說婚禮日期，B 重複 hire 但說的是去年的廚師。"},
{n:14,p:1,o:["Yes, prices are decreasing a little.","I'll babysit your son tonight.","Yes, my uncle is very stingy."],a:0,sen:"Is the money problem getting better?",szh:"錢的問題有好轉嗎？",en:"Yes, prices are decreasing a little.",zh:"問錢的問題有沒有好轉，答『有，物價有一點下降(decrease)』，選 A。B 說要幫忙顧小孩(babysit)，C 說叔叔小氣(stingy)，都沒回答。"},
{n:15,p:1,o:["I'd love to visit it someday.","Yes, Britain holds a fair election.","I know the name of that country."],a:1,sen:"Do you admire that country's system?",szh:"你欣賞那個國家的制度嗎？",en:"Yes, Britain holds a fair election.",zh:"問是否欣賞那國的制度，答『是的，英國(Britain)舉行(hold)公平的選舉(election)』，選 B。A 說想去旅行，C 只說知道國名。"},

{n:16,p:2,o:["A responsible citizen.","A busy tourist.","A quiet stranger."],a:0,sen:"W: What should everyone in this country be? &nbsp;M: A responsible citizen who follows the rules. &nbsp;W: Well said. &nbsp;Q: What should everyone be?",szh:"女：這個國家的每個人都該是什麼？　男：遵守規則、負責任的公民(citizen)。　女：說得好。　問：每個人都該是什麼？",en:"A responsible citizen.",zh:"每個人都該是負責(responsible)又守規則的公民(citizen)，選 A。tourist 和 stranger 都不是在說國民責任。"},
{n:17,p:2,o:["A police officer.","A judge.","A lawyer."],a:1,sen:"M: Who will decide if the thief is guilty? &nbsp;W: The man in the black robe who sits at the front of the room. &nbsp;M: Does he work for the police? &nbsp;W: No. He makes sure everyone follows the law. &nbsp;Q: Who will decide?",szh:"男：誰來決定小偷有沒有罪？　女：坐在房間前面、穿黑袍的那個人。　男：他替警察工作嗎？　女：不是。他確保每個人都遵守法律(law)。　問：誰來決定？",en:"A judge.",zh:"穿黑袍、坐在前面、確保大家守法的是法官(judge)，選 B。男士問是不是警察，女士說不是。"},
{n:18,p:2,o:["A party.","A concert.","An election."],a:2,sen:"W: Why are there so many flags and posters on the street? &nbsp;M: People are choosing a new leader next Sunday. &nbsp;W: Can everyone choose? &nbsp;M: Yes, all the adults can. &nbsp;Q: What big event is next week?",szh:"女：街上為什麼有這麼多旗子和海報？　男：下週日大家要選出新領導人。　女：每個人都能選嗎？　男：對，所有成年人都可以。　問：下週有什麼大事？",en:"An election.",zh:"大家要選出新的領導人，這是選舉(election)，選 C。旗子和海報讓人聯想到派對，但實際是選領導人。"},
{n:19,p:2,o:["They will elect a president.","They will visit a park.","They will build a bridge."],a:0,sen:"M: What will the citizens do on that day? &nbsp;W: They will elect a new president for the country. &nbsp;M: A big choice. &nbsp;Q: What will the citizens do?",szh:"男：那天公民會做什麼？　女：他們會選出(elect)國家新的總統(president)。　男：重大的抉擇。　問：公民會做什麼？",en:"Elect a new president.",zh:"公民們會選出(elect)新的總統(president)，選 A。對話裡沒有提到旅行或蓋橋。"},
{n:20,p:2,o:["Japan and Britain.","China and Korea.","America and Canada."],a:1,sen:"M: Some overseas students will stay with us. &nbsp;W: Where are they from? &nbsp;M: One comes from Beijing, and the other comes from Seoul. &nbsp;Q: Which countries are the students from?",szh:"男：有一些海外(overseas)學生要來跟我們住。　女：他們來自哪裡？　男：一位來自北京，另一位來自首爾。　問：這些學生來自哪些國家？",en:"China and Korea.",zh:"北京在中國(China)，首爾在韓國(Korea)，選 B。其他國家對話中都沒有提到。"},
{n:21,p:2,o:["A lawyer.","A teacher.","A banker."],a:0,sen:"M: I do not understand this paper from the company. &nbsp;W: Do not sign it yet. &nbsp;M: Who can read it for me? &nbsp;W: Someone who studied law at a university. &nbsp;Q: Who should the man ask?",szh:"男：我看不懂公司給的這份文件。　女：先別簽。　男：誰能幫我看？　女：學過法律(law)的人。　問：男士該問誰？",en:"A lawyer.",zh:"學過法律的人是律師(lawyer)，選 A。teacher 也讀過大學，但對話強調的是法律。"},
{n:22,p:2,o:["An eagle.","A plane.","A kite."],a:0,sen:"M: Look up! Something big is flying over the mountain. &nbsp;W: Is it a plane? &nbsp;M: No. It has huge wings and sharp eyes. &nbsp;Q: What did the man see?",szh:"男：看上面！有個大東西飛過山頭。　女：是飛機嗎？　男：不是。它有巨大的翅膀和銳利的眼睛。　問：男士看到什麼？",en:"An eagle.",zh:"有翅膀和銳利眼睛的大型飛行動物是老鷹(eagle)，選 A。女士問是不是飛機，男士說不是。"},
{n:23,p:2,o:["Football.","Chess.","Cards."],a:1,sen:"W: What does your brother do after dinner? &nbsp;M: He plays a game with black and white pieces on a board. &nbsp;W: Is he good? &nbsp;M: Not yet. He only learned it last week. &nbsp;Q: What game does he play?",szh:"女：你弟弟晚餐後做什麼？　男：他玩一種黑白棋子在棋盤上的遊戲。　女：他厲害嗎？　男：還不行。他上週才學。　問：他玩什麼遊戲？",en:"Chess.",zh:"黑白棋子、棋盤，是西洋棋(chess)，選 B。他才剛學，是初學者。"},
{n:24,p:2,o:["Rude and noisy.","Handsome and friendly.","Old and tired."],a:1,sen:"M: What is the new barber like? &nbsp;W: A handsome, friendly barber who cuts hair well. &nbsp;M: I'll go there. &nbsp;Q: What is the barber like?",szh:"男：新的理髮師怎麼樣？　女：一位英俊(handsome)、友善的理髮師(barber)，剪得很好。　男：我要去那。　問：理髮師怎麼樣？",en:"A handsome, friendly barber.",zh:"理髮師又英俊(handsome)又友善，選 B。其他形容都不是對話中的描述。"},
{n:25,p:2,o:["It is dirty.","It is closed.","It is cool."],a:2,sen:"W: How is the new public pool? &nbsp;M: It is cool and refreshing, great for summer. &nbsp;W: Let's swim there. &nbsp;Q: How is the public pool?",szh:"女：新的公共游泳池如何？　男：又涼(cool)又清爽，夏天最棒。　女：我們去游泳吧。　問：公共游泳池(pool)如何？",en:"Cool and refreshing.",zh:"游泳池(pool)又涼(cool)又清爽，選 C。dirty 和 closed 對話中都沒提到。"},

{n:26,p:3,pic:true,o:[BARS("Votes",["Lin","Wang","Chen"],[20,50,80]),BARS("Votes",["Lin","Wang","Chen"],[50,80,20]),BARS("Votes",["Lin","Wang","Chen"],[80,50,20])],a:2,sen:"In our school election, we counted the votes for three people. Lin got the most votes and was elected class leader. Wang came second, and Chen got the fewest. So the Lin bar should be the tallest. &nbsp;Q: Which chart shows the votes?",szh:"在我們學校的選舉(election)中，我們數了三個人的票(vote)。Lin 最多票，被選為(elect)班長；Wang 第二；Chen 最少。所以 Lin 長條最高。　問：哪張圖顯示票數？",en:"Lin most, Chen fewest.",zh:"Lin 票數最多、Chen 最少，所以最高的長條是 Lin，選 C。"},
{n:27,p:3,pic:true,o:[BARS("Crime Rate",["2021","2022","2023"],[80,55,30]),BARS("Crime Rate",["2021","2022","2023"],[30,55,80]),BARS("Crime Rate",["2021","2022","2023"],[55,80,30])],a:0,sen:"The government studied crime in our county. In 2021 the rate was the highest. Then a new police policy worked well, so in 2022 it was in the middle, and by 2023 it had dropped to the lowest. So the crime rate went down each year. &nbsp;Q: Which chart shows the crime rate?",szh:"政府(government)研究了我們縣(county)的犯罪。2021 年最高；後來新的警察政策(policy)奏效，2022 年中等；到 2023 年降到最低。所以犯罪率逐年下降。　問：哪張圖顯示犯罪率？",en:"2021 highest, 2023 lowest.",zh:"2021 年最高、逐年下降，符合『2021 最高、2023 最低』，選 A。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:2,
 sen:"After a long day of public service, the tired city workers had only a short break. They could not wait for slow noodles or steamed rice at a busy restaurant. So the office provided fresh bread for everyone, and they ate it quickly before going back to help more citizens. &nbsp;Q: What did the city workers eat?",
 szh:"公共服務忙了一整天後，疲累的市府員工只有短暫的休息。他們沒法在忙碌餐廳等慢的麵或蒸飯。所以辦公室提供新鮮麵包(bread)給大家，他們快速吃完，再回去服務更多公民(citizen)。　問：市府員工吃什麼？",
 en:"Fresh bread.",zh:"市府員工吃麵包(bread)，選 C。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('noodles'),IMG('rice'),IMG('bread')],a:0,
 sen:"To thank the citizens who helped in the election, the mayor held a big dinner. He said the hard-working helpers deserved more than plain bread or dry rice. So he treated everyone to a large bowl of hot noodles, and all the guests respected his kind heart. &nbsp;Q: What did the mayor treat the helpers to?",
 szh:"為了感謝在選舉(election)中幫忙的公民(citizen)，市長辦了一場大晚宴(dinner)。他說辛勤的幫手值得比普通麵包或乾飯更好的。所以他請大家吃一大碗熱麵(noodle)，所有賓客都尊敬(respect)他善良的心。　問：市長請幫手吃什麼？",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 29 回　規則與公共服務　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
