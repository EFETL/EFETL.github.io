</head><body>
<div class="bar">
 <b>🖨 第 3 回　數量與比較　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第3回 數量與比較） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/3/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/3/p3_${n}.jpg?v=r3hard-20261009" alt="picture ${n}">`;
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CAL=`<img class="pic-img p0img" src="gept-listening-img/3/p0_q1.jpg" alt="question 1 picture">`;
const MOON=`<img class="pic-img p0img" src="gept-listening-img/3/p0_q3.jpg" alt="question 3 picture">`;
const RULER=(cm)=>{const L=Math.round(cm/30*150);let ticks='';for(let i=0;i<=30;i++){const x=13+i*5;const tall=i%5===0;ticks+=`<line x1="${x}" y1="88" x2="${x}" y2="${tall?74:80}" stroke="#1a1a1a" stroke-width="1"/>`;if(tall)ticks+=`<text x="${x}" y="70" text-anchor="middle" font-size="8">${i}</text>`;}
 return `<svg class="chart" width="176" height="120" viewBox="0 0 176 120"><rect x="13" y="30" width="${L}" height="20" fill="#ffd166" stroke="#1a1a1a" stroke-width="1.5"/><text x="${13+L+4}" y="45" font-size="12" font-weight="800" fill="#e6007e">${cm} cm</text><rect x="10" y="88" width="156" height="16" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>${ticks}</svg>`;};
const TRAINPLAT=`<img class="pic-img p0img" src="gept-listening-img/3/p0_q5.jpg" alt="question 5 picture">`;
const DAYCARD=(d,we)=>`<svg width="96" height="98" viewBox="0 0 96 100"><rect x="14" y="12" width="68" height="76" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="14" y="12" width="68" height="26" rx="8" fill="${we?'#e6007e':'#2b8cff'}"/><rect x="14" y="30" width="68" height="8" fill="${we?'#e6007e':'#2b8cff'}"/><text x="48" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${d}</text><text x="48" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">${we?'weekend':'weekday'}</text></svg>`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CAL,o:["She is standing and checking a monthly calendar.","She is standing and drinking a glass of water.","She is sitting at the desk and writing in her diary."],a:0,sen:"For question one, look at the picture. What is the woman doing?",szh:"第一題，請看圖片。這位女士在做什麼？",en:"She is standing and checking a monthly calendar.",zh:"女士站在桌邊，手指著桌上一整個月的月曆在查看(check)，正確。她是站著，不是坐著寫日記(diary)；桌上雖然有一杯水，但她沒有在喝。選 A"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">PRICE LIST</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Diary</td><td style="text-align:right;font-weight:700">$120</td></tr><tr><td style="padding:4px 30px 4px 0">Pen</td><td style="text-align:right;font-weight:700">$50</td></tr><tr><td style="padding:4px 30px 4px 0">Ruler</td><td style="text-align:right;font-weight:700">$30</td></tr><tr><td style="padding:4px 30px 4px 0">Bag</td><td style="text-align:right;font-weight:700">$80</td></tr></table></div>`,o:["She will have eighty dollars left.","She will have one hundred seventy dollars left.","She will have fifty dollars left."],a:2,sen:"For question two, look at the picture. Amy has two hundred dollars. She buys a diary and a ruler. How much will she have left?",szh:"第二題，請看圖片。艾咪有兩百元。她買了一本日記(diary)和一把尺。她還剩多少錢？",en:"She will have fifty dollars left.",zh:"價目表上日記(diary)120元、尺30元，一共150元，200減150剩50元。剩八十元是只買了日記、忘了算尺；剩一百七十元是只扣掉尺的錢、忘了日記。選 C"},
{n:3,p:0,fig:MOON,o:["A full moon and two people standing by the water.","A full moon and one person standing by the water.","A half moon and one person standing by the water."],a:1,sen:"For question three, look at the picture. What can you see in the picture?",szh:"第三題，請看圖片。你在圖中看到什麼？",en:"A full moon and one person standing by the water.",zh:"夜空有一個又圓又亮的滿月(moon)，湖邊站著一個人，正確。湖邊只有一個人，不是兩個；月亮是圓的，不是半月。選 B"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/3/p0_q4.jpg" alt="question 4 picture">`,o:["He is measuring the length of a table.","He is checking his weight on a scale.","He is measuring the length of a sofa."],a:0,sen:"For question four, look at the picture. What is the man doing?",szh:"第四題，請看圖片。這位男士在做什麼？",en:"He is measuring the length of a table.",zh:"男士拉著黃色捲尺，在量(measure)木桌的長度(length)，正確。他沒有站在體重計(scale)上量體重；沙發在後面，他量的是前面的桌子。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Books Read</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">60</text><rect x="96" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="95" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="83" width="44" height="67" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="78" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="228" y="117" width="44" height="33" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="112" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Jan</text><text x="118" y="167" text-anchor="middle">Feb</text><text x="184" y="167" text-anchor="middle">Mar</text><text x="250" y="167" text-anchor="middle">Apr</text></g></svg>`,o:["She read sixty books.","She read thirty books.","She read fifty books."],a:2,sen:"For question five, look at the picture. Kate read books in February and April. How many books did she read in all?",szh:"第五題，請看圖片。凱特在二月和四月讀了書。她一共讀了多少本？",en:"She read fifty books.",zh:"圖中二月是30本、四月是20本，加起來50本。六十本是一月那根最高的長條，看錯月份；三十本是只算了二月，漏掉四月。選 C"},
{n:6,p:1,o:["It took two hours by train.","Until the end of the month.","At my uncle's house beside the station."],a:1,sen:"How long will you stay in Tainan?",szh:"你會在台南待多久？",en:"Until the end of the month.",zh:"問會待(stay)「多久」，答「待到這個月(month)底」才是時間長度。「在車站旁邊(beside)的叔叔家」答的是地點；「搭火車花了兩小時」是路上花的時間，時態也不對。選 B"},
{n:7,p:1,o:["Ask Amy. She was sitting there a minute ago.","Yes, I keep a diary, too.","It's on the desk beside the lamp."],a:0,sen:"Whose diary is this on the desk?",szh:"桌上這本日記是誰的？",en:"Ask Amy. She was sitting there a minute ago.",zh:"問日記(diary)是「誰的(whose)」，答「問 Amy，她一分鐘(minute)前坐在那裡」，間接指出可能的主人。「在檯燈旁邊的桌上」答的是地點；「是的，我也寫日記」用 Yes 回答 whose 問句。選 A"},
{n:8,p:1,o:["The game was canceled because of the rain.","I hate basketball, too.","Oh, no! You should put some ice on it."],a:2,sen:"I hurt my ankle during the basketball game.",szh:"我在籃球比賽中弄傷了腳踝。",en:"Oh, no! You should put some ice on it.",zh:"對方說比賽中(during)弄傷腳踝(ankle)，回「喔不！你應該冰敷一下」是關心加建議。「比賽因雨取消(cancel)」和對方說的「比賽中受傷」矛盾；「我也討厭(hate)籃球」對方並沒有說討厭。選 C"},
{n:9,p:1,o:["At the pool beside my school.","Weekly, usually on Saturday mornings.","For about an hour."],a:1,sen:"How often do you go swimming?",szh:"你多久去游泳一次？",en:"Weekly, usually on Saturday mornings.",zh:"問「多久一次」，答「每週(weekly)一次，通常星期六早上」是頻率。「在學校旁邊的游泳池」答的是地點；「大約一小時」答的是每次多久，不是多久一次。選 B"},
{n:10,p:1,o:["She dropped her ice cream on the grass.","Yes, she sometimes stays with my elder sister.","She goes to kindergarten."],a:0,sen:"Why did the little girl burst into tears?",szh:"那個小女孩為什麼突然大哭？",en:"She dropped her ice cream on the grass.",zh:"問為什麼突然大哭(burst into tears)，答「她的冰淇淋掉到草地(grass)上了」是原因。「她讀幼兒園(kindergarten)」不是哭的理由；why 問句不能用 Yes 回答，「有時(sometimes)住我姊姊(elder)家」也不是原因。選 A"},
{n:11,p:1,o:["Yes, I studied vocabulary for the test.","Mr. Lin teaches at an elementary school.","Oh, I hope it's nothing serious."],a:2,sen:"The test was canceled because Mr. Lin is sick.",szh:"考試取消了，因為林老師生病了。",en:"Oh, I hope it's nothing serious.",zh:"對方說考試(test)因林老師(Mr.)生病而取消(cancel)，回「希望不嚴重」是在關心老師，最自然。用 Yes 說「我有讀單字(vocabulary)準備考試」接不上；「林老師在小學(elementary school)教書」答非所問。選 C"},
{n:12,p:1,o:["I'll go to a new school next term.","Small, but the teachers were really kind.","It's beside the park."],a:1,sen:"What was your former school like?",szh:"你以前的學校怎麼樣？",en:"Small, but the teachers were really kind.",zh:"問以前的(former)學校「怎麼樣」，答「很小，但老師很親切」是在描述學校。「我下學期(term)要去新學校」答的是未來；「在公園旁邊」用現在式答地點，沒說學校怎麼樣。選 B"},
{n:13,p:1,o:["He was tall, with short gray hair.","No, I didn't describe him.","I saw him on the platform."],a:0,sen:"Could you briefly describe the man you saw?",szh:"你可以簡單描述一下你看到的那個男人嗎？",en:"He was tall, with short gray hair.",zh:"請對方簡單(brief)描述(describe)那個人，答「他很高，灰色短髮」就是外表描述。「我在月台(platform)上看到他」答的是地點；「不，我沒有描述他」只是重複 describe，答非所問。選 A"},
{n:14,p:1,o:["It was very hot last summer.","I go swimming every weekend.","I always wear a hat and stay out of the noon sun."],a:2,sen:"How do you protect your skin in summer?",szh:"你夏天怎麼保護皮膚？",en:"I always wear a hat and stay out of the noon sun.",zh:"問怎麼保護(protect)皮膚，答「我總是戴帽子、避開中午的太陽」是方法。「去年夏天很熱」答非所問；「每個週末(weekend)去游泳」是活動，不是保護皮膚的方法。選 C"},
{n:15,p:1,o:["Yes, the test was boring, too.","Let's decorate it with some pictures.","Our classroom is on the second floor."],a:1,sen:"Our classroom looks so plain and boring.",szh:"我們的教室看起來好單調、好無聊。",en:"Let's decorate it with some pictures.",zh:"對方嫌教室太單調，回「我們用一些圖畫來佈置(decorate)吧」是解決辦法。「對，考試(test)也很無聊」只是重複 boring；「我們的教室在二樓」答的是位置，沒有回應。選 B"},
{n:16,p:2,o:["One hour and forty minutes.","Forty minutes.","Two hours and forty minutes."],a:0,sen:"W: What time does the movie start? &nbsp;M: At seven. It's over at eight forty. &nbsp;W: Then let's eat after the movie. &nbsp;M: We'll be too hungry by then. Let's make some noodles before we go. &nbsp;Q: How long is the movie?",szh:"女：電影幾點(time)開始？　男：七點，八點四十結束。　女：那我們看完電影再吃飯。　男：那時候會太餓，我們出門前先煮(make)點麵吧。　問：電影多長？",en:"One hour and forty minutes.",zh:"七點開始、八點四十結束，所以電影一小時四十分鐘(minute)。四十分鐘是只聽到 forty；兩小時四十分是算錯了。選 A"},
{n:17,p:2,o:["Taking a bus to school.","Buying pens and snacks.","The girl's money for the month."],a:2,sen:"W: Mom gives me three hundred dollars on the first day of every month. &nbsp;M: What do you use it for? &nbsp;W: Bus tickets, pens, and sometimes a snack. &nbsp;M: And if it's gone before the month ends? &nbsp;W: Then I wait. I can't ask for more. &nbsp;M: That sounds hard. &nbsp;Q: What are the speakers talking about?",szh:"女：媽媽每個月(month)一號給我三百元。　男：妳用它做什麼？　女：買公車票、筆，有時候(sometimes)買點心。　男：如果月底前用完了呢？　女：那就等。我不能再多要。　男：聽起來很辛苦。　問：說話的兩個人在談什麼？",en:"The girl's money for the month.",zh:"女孩說媽媽每個月(month)一號給她三百元，用來買車票、筆和點心，用完就要等到下個月，所以兩人談的是她一個月的零用錢。公車票和筆、點心只是錢的用途；對話也不是在談搭車上學或買東西。選 C"},
{n:18,p:2,o:["Only on the weekend.","On Friday and the weekend.","Every weekday."],a:1,sen:"W: Is the night market open every day? &nbsp;M: No. It's closed on weekdays, except Friday. &nbsp;W: So it's open three days a week? &nbsp;M: That's right. &nbsp;Q: When is the night market open?",szh:"女：夜市每天都開嗎？　男：不是，平日(weekday)不開，但星期五有開。　女：所以一週開三天？　男：沒錯。　問：夜市什麼時候開？",en:"On Friday and the weekend.",zh:"平日(weekday)不開，但星期五例外，加上週末(weekend)兩天，剛好一週三天。說每個平日都開正好相反；只有週末的話就漏了星期五，也不是三天。選 B"},
{n:19,p:2,o:["Platform five.","Platform two.","Platform four."],a:0,sen:"M: Does the fast train to Taipei leave from platform two? &nbsp;W: Usually, but today it leaves from platform five. &nbsp;M: Where's platform five? &nbsp;W: It's just beside platform four. &nbsp;Q: Where does the fast train leave from today?",szh:"男：往台北的快車是從第二月台(platform)出發嗎？　女：通常是，但今天從第五月台出發。　男：第五月台在哪？　女：就在第四月台旁邊(beside)。　問：快車今天從哪裡出發？",en:"Platform five.",zh:"快車平常在第二月台(platform)，但今天改在第五月台。第二月台是平常的；第四月台只是用來說明第五月台的位置。選 A"},
{n:20,p:2,o:["In a drink shop.","In a book shop.","At a train station."],a:2,sen:"M: Is this the right platform for the five o'clock to Taipei? &nbsp;W: Yes, but it's late today. It will come at ten past five. &nbsp;M: Only ten minutes late. Is there a place to sit? &nbsp;W: Yes, beside the drink machine. &nbsp;M: Thanks. I'll read my book there. &nbsp;Q: Where are the speakers?",szh:"男：請問這是往台北五點整那班車的月台(platform)嗎？　女：是的，但今天會晚點。它會在五點十分(past)到。　男：只晚十分鐘(minute)。有地方坐嗎？　女：有，在飲料機旁邊(beside)。　男：謝謝。我去那裡看書。　問：說話的兩個人在哪裡？",en:"At a train station.",zh:"男子問的是往台北那班車的月台(platform)，女子說車會在五點十分(past)進站，所以兩人在火車站。飲料機只是旁邊的設備，不是飲料店；男子要在座位看自己的書，不是在書店。選 C"},
{n:21,p:2,o:["At a kindergarten.","At an elementary school.","At a high school."],a:1,sen:"M: Does your elder sister still teach at a kindergarten? &nbsp;W: Not anymore. She teaches at an elementary school now. &nbsp;M: Does she like it? &nbsp;W: Yes, but she complains that the kids talk too much. &nbsp;Q: Where does the woman's sister work now?",szh:"男：你姊姊(elder sister)還在幼兒園(kindergarten)教書嗎？　女：沒有了，她現在在小學(elementary school)教書。　男：她喜歡嗎？　女：喜歡，但她抱怨(complain)小孩話太多。　問：女士的姊姊現在在哪裡工作？",en:"At an elementary school.",zh:"姊姊以前在幼兒園(kindergarten)，現在在小學(elementary school)教書。幼兒園是以前的工作；高中在對話中沒有出現。選 B"},
{n:22,p:2,o:["Thirty-five centimeters.","Forty centimeters.","Forty-five centimeters."],a:0,sen:"M: Is your new bag similar in size to mine? &nbsp;W: Let's measure them. Mine is forty centimeters long. &nbsp;M: And mine is five centimeters shorter. &nbsp;Q: What is the length of the man's bag?",szh:"男：你的新包包跟我的大小差不多(similar)嗎？　女：我們量(measure)一下。我的長四十公分。　男：我的短五公分。　問：男士的包包長度(length)是多少？",en:"Thirty-five centimeters.",zh:"女士的包包四十公分，男士的短五公分，所以是三十五公分。四十公分是女士包包的長度(length)；四十五公分是加了五公分，方向算反了。選 A"},
{n:23,p:2,o:["It helps him do well on a test.","He likes to listen to the clock.","It is not good for his thinking."],a:2,sen:"M: Our classroom was in silence all through the test. &nbsp;W: That must be good for you. &nbsp;M: Not really. I could hear every little sound, even the clock. &nbsp;W: What do you do at home? &nbsp;M: I study with a little music. &nbsp;Q: What does the man think about studying in silence?",szh:"男：考試(test)時我們教室一片寂靜(silence)。　女：那對你應該很好。　男：不見得。我連最小的聲音(sound)都聽得到，連時鐘都聽得到。　女：你在家都怎麼做？　男：我會放一點音樂讀書。　問：男士覺得在安靜中讀書怎麼樣？",en:"It is not good for his thinking.",zh:"男子說安靜(silence)時連時鐘的聲音(sound)都聽得到，在家要放一點音樂才讀得下書，意思是安靜對他的思考沒有幫助。他沒有說安靜讓他考得好；他聽得到時鐘是受干擾，不是喜歡聽。選 C"},
{n:24,p:2,o:["A young child.","A teenager.","A college student."],a:1,sen:"M: Who won the race this morning? &nbsp;W: The tall boy in the red shirt. &nbsp;M: The college student? &nbsp;W: No, he's only fifteen. He just looks older. &nbsp;Q: Who won the race?",szh:"男：今天早上的賽跑誰贏了？　女：穿紅衣服的那個高個子男生。　男：那個大學生嗎？　女：不是，他才十五歲，只是看起來比較大。　問：誰贏了賽跑？",en:"A teenager.",zh:"贏的男生才十五歲，換句話說就是青少年(teenager)。大學生是男士猜錯、被否定的；十五歲也不是小小孩(young child)。選 B"},
{n:25,p:2,o:["Twice a year.","Every month.","Once a year."],a:0,sen:"W: Do you have a health check every month? &nbsp;M: No, that's too often. It's yearly, in September. &nbsp;W: And the eye test? &nbsp;M: Once a term, so twice a year. &nbsp;Q: How often do they have the eye test?",szh:"女：你們每個月都做健康檢查(check)嗎？　男：沒有，那太頻繁了。是每年(yearly)一次，在九月。　女：那視力檢查(test)呢？　男：每學期(term)一次，所以一年(year)兩次。　問：他們多久做一次視力檢查？",en:"Twice a year.",zh:"問的是視力檢查(test)：每學期(term)一次，一年兩次。一年一次是健康檢查(yearly)；每個月是女士猜錯、被否定的。選 A"},
{n:26,p:3,pic:true,o:[BARS("My Weekend Hours",["Reading","Games","Sports"],[20,70,50]),BARS("My Weekend Hours",["Reading","Games","Sports"],[70,50,20]),BARS("My Weekend Hours",["Reading","Games","Sports"],[20,50,70])],a:2,sen:"I kept a diary of my weekend time for a month. My mom thinks I spend the most time on games, but she is wrong. I spent more time on sports than on games. Reading came last, so I'm going to read more next month. &nbsp;Q: Which chart shows how the speaker spent weekend time this month?",szh:"我用日記(diary)記錄了一個月的週末(weekend)時間(time)。媽媽以為我花最多時間玩遊戲，但她錯了。我花在運動的時間比玩遊戲多。閱讀排最後，所以我下個月要多讀書。　問：哪張圖是說話者這個月週末時間的分配？",en:"Sports most, games second, reading least.",zh:"運動比遊戲多，閱讀最少，所以運動最高、遊戲第二、閱讀最低。遊戲最高的那張是媽媽「以為」的情形；閱讀最高的那張是說話者下個月的計畫，不是這個月。選 C"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"During this term, Lily has measured her plant every weekday. On the first day of the month, it was only a few centimeters in length, so she measured it beside a small pot. A month later, it was so tall that she needed a long ruler. Today is the last day of the month. Her classmates are still measuring their plants, but Lily has already measured hers, and now she is writing the length in her diary. &nbsp;Q: What is Lily doing now?",szh:"在這個學期(term)裡，莉莉每個平日(weekday)都量她的植物(measure)。這個月第一天，它的長度(length)只有幾公分，所以她在小花盆旁邊(beside)量它。一個月後，它長得好高，她需要一把很長的尺。今天是這個月(month)的最後一天。同學們還在量他們(their)的植物，但莉莉已經量完了，現在正把長度寫在日記(diary)裡。　問：莉莉現在在做什麼？",en:"She is writing in her diary.",zh:"這個月第一天她量的是只有幾公分的小苗，一個月後量的是很高的植物，這兩個都是「以前」的事；今天已經量完了，現在她正把長度寫進日記(diary)，所以現在是在寫日記。選 B"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:0,sen:"My elder brother plays on a youth basketball team. Last month, he hurt his ankle during a game. At first, he thought it was a minor problem, but the doctor told him not to run for a period of two months. He hates staying at home, so now he swims twice a week. Swimming doesn't hurt his ankle. &nbsp;Q: What does the brother do for exercise now?",szh:"我哥哥(elder brother)是青少年(youth)籃球隊的隊員。上個月他在比賽中(during)扭傷了腳踝(ankle)。一開始他以為是小(minor)問題，但醫生要他兩個月內(period)不要跑步。他討厭(hate)待在家，所以現在一週游泳兩次。游泳不會傷到他的腳踝。　問：哥哥現在做什麼運動？",en:"He swims.",zh:"打籃球是他受傷前的運動；醫生說兩個月(period)內不能跑步；現在他改成游泳，不會傷到腳踝(ankle)。選 A"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29c'),PH('q29a')],a:2,sen:"My little sister is in kindergarten. Every month, each child has a job in the classroom. Last month, my sister fed the fish. This month, her teacher asked her to water the plants by the window. Next month, she hopes to feed the rabbits. &nbsp;Q: What is the sister's job this month?",szh:"我妹妹讀幼兒園(kindergarten)。每個月(month)每個小朋友在教室都有一份工作。上個月妹妹負責餵(feed)魚。這個月老師要她幫窗邊的植物澆水。下個月她希望能餵兔子。　問：妹妹這個月的工作是什麼？",en:"Watering the plants.",zh:"餵(feed)魚是上個月的工作；餵兔子是她希望下個月做的；這個月是幫窗邊的植物澆水。選 C"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30c'),PH('q30b')],a:1,sen:"Let me describe my uncle's trip to Kaohsiung last weekend. He wanted to take the fast train, because of its speed. But when he got to the platform, all the seats were full. The bus takes too long, so he didn't take it. In the end, his friend drove him there by car. &nbsp;Q: How did the uncle go to Kaohsiung?",szh:"我來描述(describe)一下叔叔上週末去高雄的旅程。他想搭快車，因為速度(speed)快。但他到月台(platform)時，座位全滿了。巴士太花時間，所以他沒搭。最後他朋友開車載他去。　問：叔叔怎麼去高雄的？",en:"His friend drove him there by car.",zh:"快車是他想搭的，但到月台(platform)時座位全滿；巴士太慢他沒搭；最後是朋友開車載他去。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 3 回　數量與比較　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
