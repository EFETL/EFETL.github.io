<script>
/* 圖形素材（第3回 數量與比較） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/3/${n}.jpg" alt="${n}">`;
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CAL=`<img class="pic-img" src="gept-listening-img/3/calendar.jpg" alt="calendar">`;
const MOON=`<svg width="130" height="118" viewBox="0 0 130 120"><rect x="6" y="6" width="118" height="108" rx="10" fill="#1b2340"/><g fill="#fff"><circle cx="34" cy="30" r="1.6"/><circle cx="96" cy="24" r="1.4"/><circle cx="108" cy="70" r="1.6"/><circle cx="22" cy="82" r="1.3"/><circle cx="60" cy="18" r="1.2"/></g><circle cx="66" cy="62" r="34" fill="#f4e08a"/><circle cx="80" cy="54" r="30" fill="#1b2340"/></svg>`;
const RULER=(cm)=>{const L=Math.round(cm/30*150);let ticks='';for(let i=0;i<=30;i++){const x=13+i*5;const tall=i%5===0;ticks+=`<line x1="${x}" y1="88" x2="${x}" y2="${tall?74:80}" stroke="#1a1a1a" stroke-width="1"/>`;if(tall)ticks+=`<text x="${x}" y="70" text-anchor="middle" font-size="8">${i}</text>`;}
 return `<svg class="chart" width="176" height="120" viewBox="0 0 176 120"><rect x="13" y="30" width="${L}" height="20" fill="#ffd166" stroke="#1a1a1a" stroke-width="1.5"/><text x="${13+L+4}" y="45" font-size="12" font-weight="800" fill="#e6007e">${cm} cm</text><rect x="10" y="88" width="156" height="16" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>${ticks}</svg>`;};
const TRAINPLAT=`<img class="pic-img" src="gept-listening-img/3/trainplat.jpg" alt="trainplat">`;
const DAYCARD=(d,we)=>`<svg width="96" height="98" viewBox="0 0 96 100"><rect x="14" y="12" width="68" height="76" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="14" y="12" width="68" height="26" rx="8" fill="${we?'#e6007e':'#2b8cff'}"/><rect x="14" y="30" width="68" height="8" fill="${we?'#e6007e':'#2b8cff'}"/><text x="48" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${d}</text><text x="48" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">${we?'weekend':'weekday'}</text></svg>`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];

{n:1,p:0,fig:CAL,o:["She is checking the monthly calendar for this weekend.","She hates feeding grass to the young horse.","She is measuring the length of a diary."],a:0,

{n:2,p:0,fig:CLK(9,10),o:["The teenager is reading his old diary.","The young boy hates every test.","It is ten past nine; only a few minutes left."],a:2,

{n:3,p:0,fig:MOON,o:["There was a brief moment of total silence.","The bright moon shines during the night.","People stay on the platform for a month."],a:1,
 sen:"For question three, look at the picture. What do we see in the night sky?",szh:"第三題，請看圖片。夜空中我們看見什麼？",

{n:4,p:0,fig:`<img class="pic-img" src="gept-listening-img/3/ruler.jpg" alt="ruler">`,o:["He uses a scale to measure the length of the object.","He wants to protect his weak ankle.","Mr. Lin will cancel the term test."],a:0,
 sen:"For question four, look at the picture. What is the man measuring?",szh:"第四題，請看圖片。男士在量什麼？",
 en:"He measures the length with a scale.",zh:"他用尺(scale)測量(measure)物體長度(length)，選 A。protect/ankle、Mr./cancel/term 為干擾。"},
{n:5,p:0,fig:TRAINPLAT,o:["The elder man will decorate their new house.","Sometimes he feels sleepy beside the window.","The fast train leaves platform two at high speed."],a:2,
 sen:"For question five, look at the picture. What does the sign tell us?",szh:"第五題，請看圖片。告示告訴我們什麼？",
 en:"The train leaves platform two at high speed.",zh:"快車將從二號月台(platform)高速(speed)離站，選 C。elder/decorate/their、sometimes/beside 為干擾。"},

{n:6,p:1,o:["I really hate cockroaches in the kitchen.","For a brief period, about a month.","Whose diary is on the desk?"],a:1,

{n:7,p:1,o:["It is Mr. Wang's; please describe it for us.","The child burst into tears at midnight.","I measure the grass every weekday."],a:0,

{n:8,p:1,o:["The moon rises beside the tall tower.","Their former teacher was very kind.","On weekdays after class, and sometimes on the weekend."],a:2,

{n:11,p:1,o:["Their diary looks quite similar to mine.","He hurt his ankle during the game.","I learn new vocabulary and stay after each term."],a:2,

{n:12,p:1,o:["The elder lady will decorate the hall.","A sudden sound frightened the young child beside me.","Mr. Chen keeps a yearly diary."],a:1,

{n:14,p:1,o:["The youth complained about the long test.","Their diary is similar to a monthly report.","I measure it and wear a similar support to protect it."],a:2,

{n:15,p:1,o:["The children feed the grass to the young sheep.","Mr. Lee, my former teacher, is an elder gentleman.","I check my diary every weekday morning."],a:1,

{n:16,p:2,o:["About one hundred minutes.","About one hundred years.","About one hundred platforms."],a:0,

{n:17,p:2,o:["During the weekday.","Beside the moon.","Once a month, when the moon is full."],a:2,

{n:21,p:2,o:["At the kindergarten.","At an elementary school.","At the train platform."],a:1,

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 3 回　數量與比較　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
