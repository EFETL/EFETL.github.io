<style>

<div class="bar">
 <b>🖨 第 3 回　數量與比較　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">只印學生卷</button>
 <button class="t" onclick="show('t')">只印教師卷</button>

<div id="root"></div>
<script>
/* 圖形素材（第3回 數量與比較） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/3/${n}.jpg" alt="${n}">`;
const CLK=(h,m)=>{const ma=m*6,ha=(h%12)*30+m*0.5,r=Math.PI/180;
 const hx=(60+Math.sin(ha*r)*20).toFixed(1),hy=(54-Math.cos(ha*r)*20).toFixed(1);
 const mx=(60+Math.sin(ma*r)*30).toFixed(1),my=(54-Math.cos(ma*r)*30).toFixed(1);
 return `<svg width="110" height="100" viewBox="0 0 120 110"><circle cx="60" cy="54" r="40" fill="#fff" stroke="#1a1a1a" stroke-width="3"/><g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"><line x1="60" y1="18" x2="60" y2="25"/><line x1="60" y1="83" x2="60" y2="90"/><line x1="24" y1="54" x2="31" y2="54"/><line x1="89" y1="54" x2="96" y2="54"/></g><line x1="60" y1="54" x2="${hx}" y2="${hy}" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/><line x1="60" y1="54" x2="${mx}" y2="${my}" stroke="#e6007e" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="54" r="3.5" fill="#1a1a1a"/></svg>`;};
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CAL=`<img class="pic-img p0img" src="gept-listening-img/3/p0_q1.jpg" alt="question 1 picture">`;
const MOON=`<img class="pic-img p0img" src="gept-listening-img/3/p0_q3.jpg" alt="question 3 picture">`;
const RULER=(cm)=>{const L=Math.round(cm/30*150);let ticks='';for(let i=0;i<=30;i++){const x=13+i*5;const tall=i%5===0;ticks+=`<line x1="${x}" y1="88" x2="${x}" y2="${tall?74:80}" stroke="#1a1a1a" stroke-width="1"/>`;if(tall)ticks+=`<text x="${x}" y="70" text-anchor="middle" font-size="8">${i}</text>`;}
 return `<svg class="chart" width="176" height="120" viewBox="0 0 176 120"><rect x="13" y="30" width="${L}" height="20" fill="#ffd166" stroke="#1a1a1a" stroke-width="1.5"/><text x="${13+L+4}" y="45" font-size="12" font-weight="800" fill="#e6007e">${cm} cm</text><rect x="10" y="88" width="156" height="16" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>${ticks}</svg>`;};
const TRAINPLAT=`<img class="pic-img p0img" src="gept-listening-img/3/p0_q5.jpg" alt="question 5 picture">`;
const DAYCARD=(d,we)=>`<svg width="96" height="98" viewBox="0 0 96 100"><rect x="14" y="12" width="68" height="76" rx="8" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><rect x="14" y="12" width="68" height="26" rx="8" fill="${we?'#e6007e':'#2b8cff'}"/><rect x="14" y="30" width="68" height="8" fill="${we?'#e6007e':'#2b8cff'}"/><text x="48" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${d}</text><text x="48" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">${we?'weekend':'weekday'}</text></svg>`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CAL,o:["She is checking the monthly calendar for this weekend.","She is writing in her diary at a desk.","She is measuring the length of a desk."],a:0,sen:"For question one, look at the picture. What is the woman doing?",szh:"第一題，請看圖片。女士在做什麼？",en:"She is checking the monthly calendar.",zh:"她在看每月(monthly)月曆、確認這個週末(weekend)，選 A。B 是在寫日記(diary)、C 是在量(measure)桌子長度(length)，動作都不同。"},
{n:2,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/3/p0_q2.jpg" alt="question 2 picture">`,o:["It's ten to nine on the wall clock.","It's twenty past nine on the wall clock.","It's ten past nine on the wall clock."],a:2,sen:"For question two, look at the picture. What time does the clock show?",szh:"第二題，請看圖片。時鐘顯示幾點？",en:"The clock shows ten past nine.",zh:"時鐘指九點過(past)十分，選 C。A 是八點五十、B 是九點二十，分針位置不同。"},
{n:3,p:0,fig:MOON,o:["A big airplane flies across the night sky.","A bright moon shines in the night sky.","Bright fireworks light up the night sky."],a:1,sen:"For question three, look at the picture. What do we see in the night sky?",szh:"第三題，請看圖片。夜空中我們看見什麼？",en:"A bright moon shines in the night sky.",zh:"夜空中月亮(moon)在發光，選 B。飛機和煙火都不是圖中看到的東西。"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/3/p0_q4.jpg" alt="question 4 picture">`,o:["He is using a scale to measure the length.","He is using a scale to measure the weight.","He is using a phone to check the time."],a:0,sen:"For question four, look at the picture. What is the man measuring?",szh:"第四題，請看圖片。男士在量什麼？",en:"He measures the length with a scale.",zh:"他用尺(scale)測量(measure)長度(length)，選 A。B 量的是重量、C 是用手機查看(check)時間，都和圖不同。"},
{n:5,p:0,fig:TRAINPLAT,o:["The slow train leaves from platform two.","The fast train leaves from platform five.","The fast train leaves from platform two."],a:2,sen:"For question five, look at the picture. What does the sign tell us?",szh:"第五題，請看圖片。告示告訴我們什麼？",en:"The fast train leaves from platform two.",zh:"告示寫快車從二號月台(platform)出發，選 C。A 的慢車、B 的五號月台各有一個細節和告示不同。"},

{n:6,p:1,o:["At a hotel near the station.","For about a month.","I hate waiting in long lines."],a:1,sen:"How long will you stay here?",szh:"你會在這裡待多久？",en:"For about a month.",zh:"問會停留(stay)多久，答『大約一個月(month)』，選 B。A 回答地點、C 說討厭(hate)排隊，都沒回答時間長度。"},
{n:7,p:1,o:["It's my young cousin's diary.","It's on the desk beside the lamp.","I write one every weekend."],a:0,sen:"Whose diary is this?",szh:"這是誰的日記？",en:"It belongs to my young cousin.",zh:"問日記是誰的(whose)，答『我年紀小的(young)堂弟的』，選 A。B 回答位置(beside)、C 談寫日記的頻率，都沒回答是誰的。"},
{n:8,p:1,o:["In the park beside the school.","I feel a little cold today.","Usually on weekdays after school."],a:2,sen:"When do you feel free?",szh:"你什麼時候有空？",en:"Usually on weekdays after school.",zh:"問何時有空，答『通常平日(weekday)放學後』，選 C。A 回答地點、B 重複 feel 但在說冷不冷，都沒回答時間。"},
{n:9,p:1,o:["Please keep the change.","Yes, I write in it weekly.","For about ten minutes a day."],a:1,sen:"Do you keep a diary?",szh:"你有寫日記的習慣嗎？",en:"Yes, I write in it weekly.",zh:"問是否寫日記，答『有，我每週(weekly)寫』，選 B。A 重複 keep 卻是付錢時的話、C 回答時間長度(minute)，都不是在回答。"},
{n:10,p:1,o:["It was brief but really good.","It starts at seven this evening.","He runs at a great speed."],a:0,sen:"How was the elder brother's speech?",szh:"哥哥（長輩）的演講如何？",en:"His speech was brief but really good.",zh:"問哥哥演講如何，答『很簡短(brief)但很棒』，選 A。B 回答時間、C 的 speed 聽起來像 speech 但在說跑步速度。"},
{n:11,p:1,o:["The test starts in ten minutes.","I went to Kenting last summer.","I study and learn new vocabulary."],a:2,sen:"What do you do during the school term?",szh:"學期(term)中你都做些什麼？",en:"I study and learn new vocabulary.",zh:"問學期中做什麼，答『念書、學新單字(vocabulary)』，選 C。A 是考試(test)開始時間、B 是過去的旅行，都不是在說平常做什麼。"},
{n:12,p:1,o:["He's five years old, I think.","A loud sound scared him.","He sometimes plays beside the river."],a:1,sen:"Why did the little boy burst into tears?",szh:"小男孩為什麼突然大哭？",en:"A loud sound scared him.",zh:"問男孩為何大哭，答『一個很大的聲音(sound)嚇到他』，選 B。A 回答年齡、C 說他有時(sometimes)在河邊玩，都沒回答原因。"},
{n:13,p:1,o:["Yes, because of the bad weather.","Only about two hours by train.","I sometimes work on weekends."],a:0,sen:"Did they cancel the weekend trip?",szh:"他們取消週末的旅行了嗎？",en:"Yes, because of the bad weather.",zh:"問是否取消(cancel)旅行，答『是，因為天氣不好』，選 A。B 回答車程時間、C 重複 weekend 但在說自己的工作，都不是回答。"},
{n:14,p:1,o:["It's only a minor injury.","It happened last Friday, during the game.","I always wear good shoes."],a:2,sen:"How do you protect your weak ankle?",szh:"你怎麼保護受傷的腳踝？",en:"She always wears good shoes to protect it.",zh:"問如何保護(protect)腳踝，答『我總是穿好鞋』，選 C。A 說傷勢輕微(minor)、B 說何時發生，都沒回答怎麼保護。"},
{n:15,p:1,o:["He teaches at an elementary school.","He's kind and very funny.","Their classroom is on the second floor."],a:1,sen:"What is your former teacher like?",szh:"你以前的老師是怎樣的人？",en:"He is kind and very funny.",zh:"問以前(former)的老師是怎樣的人，答『他很親切又很風趣』，選 B。A 說他在國小(elementary school)教書、C 說教室位置，都沒描述個性。"},

{n:16,p:2,o:["One hour and forty minutes.","Two hours and ten minutes.","Until eight forty."],a:0,sen:"W: What time does the new movie start? &nbsp;M: At seven. It will be over at eight forty. &nbsp;W: Then we can eat dinner afterward. &nbsp;Q: How long is the movie?",szh:"女：這部新電影幾點開始？　男：七點，八點四十分結束。　女：那我們之後可以去吃晚餐。　問：電影多長？",en:"From seven to eight forty is one hour and forty minutes.",zh:"七點到八點四十分是一小時四十分鐘(minute)，選 A。C 的八點四十是結束時間，不是長度。"},
{n:17,p:2,o:["Once a week.","Once a year.","Once a month."],a:2,sen:"M: How often does the club meet? &nbsp;W: Once a month, usually when the moon is full. &nbsp;M: Only monthly? &nbsp;Q: How often does the club meet?",szh:"男：社團多久聚一次？　女：一個月(month)一次，通常在滿月(moon)的時候。　男：只有每月(monthly)一次？　問：社團多久聚一次？",en:"Once a month.",zh:"社團每月(month)聚一次，選 C。每週、每年都不對。"},
{n:18,p:2,o:["Every weekday.","Only on the weekend.","Only on Monday."],a:1,sen:"W: When is the market open? &nbsp;M: Only on the weekend, never on weekdays. &nbsp;W: Thanks. &nbsp;Q: When is the market open?",szh:"女：市集什麼時候開？　男：只有週末(weekend)，平日(weekday)都不開。　女：謝謝。　問：市集何時營業？",en:"Only on the weekend.",zh:"市集只在週末(weekend)營業，平日(weekday)不開，選 B。"},
{n:19,p:2,o:["From platform two.","From platform five.","From the front gate."],a:0,sen:"M: Which platform does the fast train leave from? &nbsp;W: From platform two; it moves at great speed. &nbsp;M: Great. &nbsp;Q: Where does the train leave from?",szh:"男：這班快車從哪個月台(platform)開？　女：二號月台，速度(speed)很快。　男：好。　問：火車從哪裡出發？",en:"From platform two.",zh:"火車從二號月台(platform)出發，選 A。"},
{n:20,p:2,o:["He cleaned the classroom.","He moved the desks.","He decorated the classroom."],a:2,sen:"W: Wow, the classroom looks so different! &nbsp;M: Thanks. I put colorful paper on the walls and hung balloons on the door. &nbsp;W: Is it for the party tomorrow? &nbsp;M: Yes. Our teacher wants it to look happy. &nbsp;Q: What did the man do?",szh:"女：哇，教室看起來完全不一樣了！　男：謝謝，我在牆上貼了彩色紙，門上掛了氣球。　女：是為了明天的派對嗎？　男：對，老師希望教室看起來很開心。　問：男士做了什麼？",en:"He put paper and balloons up — he decorated the room.",zh:"他貼彩色紙、掛氣球，就是在佈置(decorate)教室，選 C。打掃和搬桌子都沒有提到。"},
{n:21,p:2,o:["At a kindergarten.","At an elementary school.","At a high school."],a:1,sen:"M: Where does your elder sister teach? &nbsp;W: She used to teach little children aged four and five. Now her students are six to twelve years old. &nbsp;M: I see. &nbsp;Q: Where does she teach now?",szh:"男：你姊姊在哪裡教書？　女：她以前教四、五歲的小朋友，現在她的學生是六到十二歲。　男：了解。　問：她現在在哪裡教書？",en:"Her students are six to twelve — an elementary school.",zh:"學生六到十二歲是國小(elementary school)，選 B。四、五歲是以前教的幼兒園(kindergarten)，是干擾。"},
{n:22,p:2,o:["Measure it with a scale.","Cut the paper in half.","Ask the teacher for help."],a:0,sen:"M: How can I make an exact copy of this length? &nbsp;W: Use a scale to measure it first. &nbsp;M: Good idea. &nbsp;Q: What should the man do first?",szh:"男：我要怎麼精確複製這個長度(length)？　女：先用尺(scale)量(measure)一下。　男：好主意。　問：男士應先做什麼？",en:"Use a scale to measure it.",zh:"先用尺(scale)測量(measure)長度，選 A。"},
{n:23,p:2,o:["He made a lot of noise.","He asked for some help.","He complained about the noise."],a:2,sen:"W: Why did everyone stop talking? &nbsp;M: Our neighbor knocked on the wall and shouted something. &nbsp;W: Oh. He must be angry about the noise. &nbsp;M: Yes. Then we all felt sorry. &nbsp;Q: What did the neighbor do?",szh:"女：大家為什麼都不說話了？　男：鄰居敲牆壁，還大喊了一些話。　女：喔，他一定是因為噪音在生氣。　男：對，然後我們都覺得很抱歉。　問：鄰居做了什麼？",en:"The neighbor knocked and shouted about the noise — he complained.",zh:"鄰居敲牆、對噪音生氣，就是在抱怨(complain)，選 C。A 製造噪音的是男士他們，不是鄰居。"},
{n:24,p:2,o:["A young child.","A teenager.","An elder man."],a:1,sen:"M: Who won the school race this morning? &nbsp;W: The boy in the red shirt, the tall one. He is only fifteen years old. &nbsp;M: Wow, he runs very fast! &nbsp;Q: Who won the race?",szh:"男：今天早上的學校賽跑誰贏了？　女：穿紅衣服的那個高個子男生，他才十五歲。　男：哇，他跑得好快！　問：誰贏了比賽？",en:"A fifteen-year-old boy won — a teenager.",zh:"十五歲的男生是青少年(teenager)，選 B。小孩年紀更小，年長者年紀更大，都不是十五歲。"},
{n:25,p:2,o:["A yearly health check.","A monthly math test.","A weekly sports day."],a:0,sen:"W: What happens at your school every September? &nbsp;M: Every student has a health check. &nbsp;W: Is that every year? &nbsp;M: Yes. They never skip it. &nbsp;Q: What happens at the school each year?",szh:"女：你們學校每年九月會有什麼活動？　男：每位學生都要健康檢查。　女：是每年都有嗎？　男：對，從不省略。　問：學校每年有什麼活動？",en:"A health check every year — a yearly health check.",zh:"每年九月做健康檢查，就是年度(yearly)健康檢查，選 A。每月考試、每週運動會都沒有提到。"},

{n:26,p:3,pic:true,o:[CLK(7,15),CLK(8,30),CLK(8,0)],a:2,sen:"My weekday schedule is fixed and I check it every morning. I wake up at seven fifteen. The house is full of silence at that hour, so I eat a brief breakfast. I always leave home at eight o'clock, so I have never been late in the past three years. &nbsp;Q: What time does the speaker leave home?",szh:"我的平日(weekday)作息固定，每天早上都會檢查(check)。我七點十五分起床。那個時間家裡一片安靜(silence)，所以我很快(brief)吃早餐。我總是八點準時出門，所以過去(past)三年從沒遲到。　問：說話者幾點出門？",en:"He leaves home at eight o'clock.",zh:"說話者八點出門，選 C(8:00)。七點十五是起床時間(干擾)。"},
{n:27,p:3,pic:true,o:[BARS("Reading Time",["Wk1","Wk2","Wk3"],[30,55,80]),BARS("Reading Time",["Wk1","Wk2","Wk3"],[80,55,30]),BARS("Reading Time",["Wk1","Wk2","Wk3"],[55,80,30])],a:1,sen:"I measure my weekly reading time over a period of three weeks and record it on a chart. In week one I read the most, about eighty minutes. In week two it dropped to the middle, and in week three it was the least. So the amount kept going down each week. &nbsp;Q: Which chart shows my reading time?",szh:"我在三週的期間(period)測量(measure)每週(weekly)閱讀時間並記在圖表上。第一週最多，約八十分鐘(minute)；第二週中等；第三週最少。所以數量每週遞減。　問：哪張圖符合我的閱讀時間？",en:"Week1 most, week3 least (going down).",zh:"第一週最多、逐週遞減，符合『Wk1 最高、Wk3 最低』的圖，選 B。"},
{n:28,p:3,pic:true,o:[RULER(24),RULER(12),RULER(18)],a:0,sen:"In science class we measure the length of three sticks and compare their scale. The sticks look similar at first, but the first one is the longest, about twenty-four centimeters. The second is the shortest, and the third is somewhere in the middle. Please choose the longest one. &nbsp;Q: Which ruler shows the longest stick?",szh:"自然課我們測量(measure)三根棒子的長度(length)，比較它們的刻度(scale)。這些棒子乍看很相似(similar)，但第一根最長，約二十四公分；第二根最短；第三根中等。請選最長的。　問：哪把尺顯示最長的棒子？",en:"The longest is 24 cm.",zh:"最長的是 24 公分，選 A(24 cm)。"},
{n:29,p:3,pic:true,o:[DAYCARD("SAT",1),DAYCARD("MON",0),DAYCARD("SUN",1)],a:2,sen:"During the term my family is always busy on weekdays, so we rest together on the weekend. We do not go out on Saturday because of my brother's youth baseball class, but on Sunday we always visit our grandparents. &nbsp;Q: Which day does the family visit grandparents?",szh:"學期(term)中家人平日(weekday)都很忙，所以我們在週末(weekend)一起休息。週六因弟弟的青少年(youth)棒球課不出門，但週日我們總會去看祖父母。　問：家人哪一天去看祖父母？",en:"On Sunday (a weekend day).",zh:"家人在週日(Sunday，週末)去看祖父母，選 C。週六因有課不出門(干擾)。"},
{n:30,p:3,pic:true,o:[IMG('cat'),IMG('dog'),IMG('bird')],a:1,
 sen:"In my diary I often describe the pet I feed every day. It is not a cat, and it is not a small bird. It is a big, friendly dog that loves to run on the grass. Sometimes I take it for a walk beside the river. &nbsp;Q: Which pet does the speaker feed?",
 szh:"在我的日記(diary)裡，我常描述(describe)每天餵(feed)的寵物。牠不是貓，也不是小鳥。牠是一隻友善的大狗，喜歡在草地(grass)上奔跑。有時(sometimes)我帶牠去河邊(beside)散步。　問：說話者養的是哪一種寵物？",
 en:"A big friendly dog.",zh:"說話者養的是大狗(dog)，選 B。日記(diary)、描述(describe)、餵(feed)、草地(grass)。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 3 回　數量與比較　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
