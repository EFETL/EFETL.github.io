<script>
/* 圖形素材（第26回 個性與習慣） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/26/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/26/p3_${n}.jpg?v=r26qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const SOUPBOWL=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q1.jpg" alt="question 1 picture">`;
const HIPPO=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q2.jpg" alt="question 2 picture">`;
const DONKEY=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q3.jpg" alt="question 3 picture">`;
const LANTERN=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q4.jpg" alt="question 4 picture">`;
const CAGE=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:SOUPBOWL,o:["A glass of water is in front of the bowl of soup.","A glass of milk is behind the bowl of soup.","A glass of water is behind the bowl of soup."],a:2,sen:"For question one, look at the picture. What is on the table?",szh:"第一題，請看圖片。桌上有什麼？",en:"A glass of water is behind the bowl of soup.",zh:"桌上有一碗(bowl)放著湯匙的雞湯(soup)，碗的後面(behind)有一杯透明的水，正確。杯子裡是清澈的水，不是白色的牛奶；水杯在湯碗後面，不是前面。選 C"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">LUNCH MENU</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Soup</td><td style="text-align:right;font-weight:700">$80</td></tr><tr><td style="padding:4px 30px 4px 0">Noodles</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Juice</td><td style="text-align:right;font-weight:700">$40</td></tr><tr><td style="padding:4px 30px 4px 0">Tea</td><td style="text-align:right;font-weight:700">$30</td></tr></table></div>`,o:["He will have one hundred twenty dollars left.","He will have two hundred dollars left.","He will have two hundred twenty dollars left."],a:0,sen:"For question two, look at the picture. Ken has three hundred dollars. He buys a bowl of soup and a bowl of noodles. How much will he have left?",szh:"第二題，請看圖片。Ken 有三百元。他買了一碗湯和一碗麵。他還剩多少錢？",en:"He will have one hundred twenty dollars left.",zh:"菜單上湯(soup)80元、麵(noodles)100元，一共180元，300減180剩120元。剩兩百元是只買了麵、忘記湯的算法；剩兩百二十元是只買了湯、忘記麵。選 A"},
{n:3,p:0,fig:DONKEY,o:["A man is carrying a bundle of wood next to a donkey.","A donkey is pulling a bundle of wood behind it.","A donkey is carrying a bundle of wood on its back."],a:2,sen:"For question three, look at the picture. What is happening in the countryside?",szh:"第三題，請看圖片。鄉下(countryside)發生什麼事？",en:"A donkey is carrying a bundle of wood on its back.",zh:"一頭驢子(donkey)背上綁著一大捆(bundle)木柴，走在鄉間小路上，正確。木柴是背在背上，不是拖在後面(behind)；圖中沒有人，只有驢子。選 C"},
{n:4,p:0,fig:LANTERN,o:["A woman is hanging a red lantern on a tree.","A woman is holding up a white lantern and smiling.","A woman is holding up a red lantern and smiling."],a:2,sen:"For question four, look at the picture. What is the woman doing?",szh:"第四題，請看圖片。這位女士在做什麼？",en:"A woman is holding up a red lantern and smiling.",zh:"女士面帶微笑，手裡舉著一盞紅色燈籠(lantern)，正確。燈籠是紅色的，不是白色；她是用手舉著，沒有把燈籠掛到樹上。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Books Read</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="96" y="90" width="44" height="60" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="85" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="110" width="44" height="40" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="105" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="228" y="70" width="44" height="80" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="65" font-size="14" font-weight="700" text-anchor="middle">40</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Amy</text><text x="118" y="167" text-anchor="middle">Ben</text><text x="184" y="167" text-anchor="middle">Carl</text><text x="250" y="167" text-anchor="middle">Tom</text></g></svg>`,o:["They read seventy books in all.","They read ninety books in all.","They read fifty books in all."],a:0,sen:"For question five, look at the picture. Ben and Tom read some books last month. How many did they read in all?",szh:"第五題，請看圖片。Ben 和 Tom 上個月讀了一些書。他們一共讀了多少本？",en:"They read seventy books in all.",zh:"圖中 Ben 讀30本、Tom 讀40本，加起來70本。90本是 Amy 的50本加 Tom 的40本，看錯了人；50本是 Amy 一個人的數字，也是 Ben 加 Carl 的結果，都不是 Ben 加 Tom。選 A"},
{n:6,p:1,o:["Wow, he's really honest.","I lost my wallet last Saturday.","Yes, he gave me a gift, too."],a:0,sen:"Ken found a wallet and gave it back to the owner.",szh:"Ken 撿到一個錢包，把它還給了失主。",en:"Wow, he's really honest.",zh:"這是一句陳述，回「哇，他真誠實(honest)」是在評論 Ken 的品格，最自然。「我上週六(Saturday)掉了錢包」只是重複 wallet；「他也送我禮物」只是重複 gave，和還錢包無關。選 A"},
{n:7,p:1,o:["She's from Europe, I think.","Yes, I like her a lot.","Polite, and willing to listen to everybody."],a:2,sen:"What's your new manager like?",szh:"你們新經理(manager)是個什麼樣的人？",en:"Polite, and willing to listen to everybody.",zh:"What is she like 問的是個性，答「有禮貌(polite)，而且願意(willing)聽每個人(everybody)說話」才是個性。「她好像來自歐洲(Europe)」答的是從哪裡來；用 Yes 回答 What 問句，把 like 誤會成「喜歡」。選 C"},
{n:8,p:1,o:["Sorry, I only have fifty dollars with me.","Thanks. I'll pay you back on Friday.","It costs four hundred dollars."],a:0,sen:"Can you lend me four hundred dollars?",szh:"你可以借(lend)我四(four)百元嗎？",en:"Sorry, I only have fifty dollars with me.",zh:"對方要借四百元，回「抱歉，我身上只有五十元」是委婉拒絕，最自然。「這要四百元」只是重複數字，像在說價錢；「謝謝，我星期五還你」人物顛倒，好像自己才是借錢的人。選 A"},
{n:9,p:1,o:["He's a very diligent boy.","He sounds a bit lazy.","Yes, I slept very well last night."],a:1,sen:"My brother never helps at home. He just sleeps all day.",szh:"我哥哥從不幫忙家事，整天只會睡覺。",en:"He sounds a bit lazy.",zh:"從不幫忙、整天睡覺，回「他聽起來有點懶(lazy)」最自然。「我昨晚睡得很好」只是由 sleeps 聯想；「他是很勤勞的(diligent)男孩」和對方說的意思正好相反。選 B"},
{n:10,p:1,o:["The light is in the kitchen.","He's a very responsible engineer.","Not until Saturday morning, I'm afraid."],a:2,sen:"When will the engineer come to repair the light?",szh:"工程師(engineer)什麼時候會來修(repair)燈？",en:"Not until Saturday morning, I'm afraid.",zh:"問 When 什麼時候，答「恐怕要到星期六(Saturday)早上」才是時間。「他是很負責的(responsible)工程師」答的是他的為人；「燈在廚房」答的是地點。選 C"},
{n:11,p:1,o:["About ten minutes long.","Why honesty is important.","I'll give it next Friday."],a:1,sen:"What's the topic of your speech?",szh:"你演講(speech)的主題(topic)是什麼？",en:"Why honesty is important.",zh:"問 What 主題(topic)，答「為什麼誠實(honesty)很重要」才是內容。「下週五發表」答的是時間；「大約十分鐘」答的是長度。選 B"},
{n:12,p:1,o:["I know. I forgot my umbrella.","Thanks. I bought it in Europe.","Yes, it's a wonderful suit."],a:0,sen:"Your suit is all wet!",szh:"你的西裝(suit)全濕(wet)了！",en:"I know. I forgot my umbrella.",zh:"對方驚訝西裝濕了，回「我知道，我忘了帶傘」是在解釋原因，最自然。「謝謝，我在歐洲(Europe)買的」把它當成稱讚；「是啊，這套西裝很棒(wonderful)」也像在回應稱讚，沒有回應濕掉這件事。選 A"},
{n:13,p:1,o:["I may be late for the game.","The game is in the side room.","Not really. Could you explain them now?"],a:2,sen:"Do you know the rules of this game?",szh:"你知道這個遊戲的規則(rule)嗎？",en:"Not really. Could you explain them now?",zh:"問知不知道規則(rule)，答「不太知道，你現在(now)可以解釋(explain)一下嗎？」最自然。「遊戲在側邊(side)的房間」答的是地點；「我可能(may)會晚到」只是重複 game，沒有回答。選 C"},
{n:14,p:1,o:["I'll develop the photos tomorrow.","My parents insisted on them when I was little.","Yes, my manners are good."],a:1,sen:"How did you develop such good manners?",szh:"你是怎麼養成(develop)這麼好的禮貌(manner)的？",en:"My parents insisted on them when I was little.",zh:"問 How 怎麼養成禮貌(manner)，答「我小時候爸媽很堅持(insist)」是在說原因和過程。「我明天去洗照片」把 develop 換成「沖洗照片」的意思；用 Yes 回答 How 問句不合理。選 B"},
{n:15,p:1,o:["No, I ate it last night.","Go ahead. I've had enough.","Yes, it was the last one."],a:1,sen:"Is it OK if I eat the last piece of cake?",szh:"我可以吃(eat)最後(last)一塊蛋糕嗎？",en:"Go ahead. I've had enough.",zh:"對方問能不能吃最後一塊，回「吃吧，我已經吃夠了」是大方答應，最自然。「對，那是最後一塊」沒有回答可不可以吃；「不行，我昨晚吃掉了」和蛋糕還在的情況矛盾。選 B"},
{n:16,p:2,o:["He is humble.","He is proud.","He is lazy."],a:0,sen:"W: You got first place on the math test! &nbsp;M: Thanks, but I was just lucky. The questions were easy this time. &nbsp;W: You always say that. &nbsp;Q: What is the man like?",szh:"女：你數學考試拿第一名耶！　男：謝謝，不過我只是運氣好，這次題目很簡單。　女：你每次都這樣說。　問：男士是個什麼樣的人？",en:"He is humble.",zh:"男士拿第一名卻說只是運氣好、題目簡單，而且「每次都這樣說」，表示他很謙虛(humble)。驕傲(proud)的人會誇自己，他正好相反；能考第一名，不會是懶惰(lazy)的人。選 A"},
{n:17,p:2,o:["The man who is an engineer.","The woman by the window.","The woman in the gray suit."],a:1,sen:"M: Is the new manager Mr. Brown? &nbsp;W: No, Mr. Brown is our new engineer. The manager is Ms. Lin. &nbsp;M: The woman in the gray suit? &nbsp;W: No, that's Ms. Wu. Ms. Lin is the one by the window. &nbsp;Q: Who is the new manager?",szh:"男：新經理(manager)是 Brown 先生嗎？　女：不是，Brown 先生是新來的工程師(engineer)。經理是林小姐。　男：穿灰色套裝(suit)的那位？　女：不是，那是吳小姐。林小姐是窗邊那位。　問：誰是新經理？",en:"The woman by the window.",zh:"女士更正了兩次：Brown 先生是工程師(engineer)，穿灰色套裝(suit)的是吳小姐，經理林小姐是站在窗邊的那位。工程師和穿灰色套裝的都不是經理。選 B"},
{n:18,p:2,o:["Take photos.","Explain the rules.","Bring the bags."],a:1,sen:"W: Our class is cleaning the side of the lake on Saturday. Who will bring the bags? &nbsp;M: I will. And Ken can bring water. &nbsp;W: Then I'll make the rules and explain them to everybody. &nbsp;M: Great. Amy is willing to take photos. &nbsp;Q: What will the woman do?",szh:"女：我們班星期六(Saturday)要去清理湖(lake)邊(side)。誰帶袋子？　男：我帶。Ken 可以帶水。　女：那我來訂規則(rule)，跟大家(everybody)解釋(explain)。　男：好，Amy 願意(willing)拍照。　問：女士會做什麼？",en:"Explain the rules.",zh:"要分清楚誰做什麼：男士帶袋子、Ken 帶水、女士訂規則(rule)並解釋(explain)、Amy 拍照。帶袋子是男士的工作；拍照是 Amy 的工作。選 B"},
{n:19,p:2,o:["She is generous.","She is brave.","She is selfish."],a:2,sen:"M: Can I try one of your cookies? &nbsp;W: Sorry, I need them all. I'm really hungry. &nbsp;M: But you have twenty of them! &nbsp;W: So? They're mine. &nbsp;Q: What does the man think of the woman?",szh:"男：我可以吃一塊你的餅乾嗎？　女：抱歉，我全部都要，我好餓。　男：可是你有二十塊耶！　女：所以呢？那是我的。　問：男士覺得女士是什麼樣的人？",en:"She is selfish.",zh:"女士有二十塊餅乾卻一塊都不肯分，男士的驚訝表示他覺得她很自私(selfish)。慷慨(generous)的人會分享，她正好相反；對話和勇敢(brave)無關。選 C"},
{n:20,p:2,o:["A new worker's good habits.","A new phone for the shop.","Thank-you cards for customers."],a:0,sen:"W: Have you met Tom, the new worker? &nbsp;M: Yes. He came at seven today and swept the floor before anyone else arrived. &nbsp;W: He did the same yesterday. &nbsp;M: And he always says thank you to the customers. &nbsp;W: Good. The last worker only looked at his phone. &nbsp;M: Tom is different. I hope he stays. &nbsp;Q: What are the speakers talking about?",szh:"女：你見過新來的員工 Tom 了嗎？　男：見過。他今天七點就到，在別人來之前把地掃好了。　女：他昨天也這樣。　男：而且他總是對客人說謝謝。　女：很好。上一個(last)員工只會看(look)手機。　男：Tom 不一樣。我希望(hope)他留下來。　問：說話的兩個人在談什麼？",en:"A new worker's good habits.",zh:"兩人在談新員工 Tom：很早到、先掃地、對客人說謝謝，和上一個(last)只看手機的員工不同，所以是在談新員工的好習慣。手機是上一個員工愛看的，不是要買新手機；說謝謝是 Tom 的習慣，沒有人提到謝卡。選 A"},
{n:21,p:2,o:["He should have kept the money for himself.","He should not have picked up the wallet.","It was the right thing, but not easy."],a:2,sen:"M: Ken found a wallet with five hundred dollars in it. &nbsp;W: Really? What did he do with it? &nbsp;M: He took it to the police. Nobody saw him pick it up. &nbsp;W: Wow. I'm not sure I could do that. &nbsp;M: You mean you would keep it? &nbsp;W: No! I mean it's hard to do the right thing when nobody is watching. &nbsp;Q: What does the woman think about Ken?",szh:"男：Ken 撿到一個皮夾，裡面有五百元。　女：真的？他怎麼處理？　男：他拿去給警察。沒人看到他撿起來。　女：哇，我不確定我做不做得到。　男：你是說你會留下來？　女：不是！我是說沒人看的時候還要做對的事很難。　問：女士覺得 Ken 怎麼樣？",en:"It was the right thing, but not easy.",zh:"女士說沒人看的時候做對的事很難，表示她覺得 Ken 把皮夾交給警察是對的，但不容易，這正是誠實(honest)的表現。她明說不是要把錢留下來，所以「應該自己留著錢」是錯的；撿起皮夾是為了交給警察，女士沒有批評這件事。選 C"},
{n:22,p:2,o:["In a library.","In a pet store.","On the second floor."],a:0,sen:"M: Excuse me, please keep your voice down. &nbsp;W: Sorry. I'm just helping my son choose a book. &nbsp;M: That's fine, but other people are reading. &nbsp;W: You're right. Where can I find books about animals? &nbsp;M: Go up to the second floor. They're next to the window. &nbsp;W: Thank you. &nbsp;Q: Where are the speakers?",szh:"男：不好意思，請小聲一點。　女：抱歉。我只是在幫我兒子選書。　男：沒關係，但其他人在看書。　女：你說得對。請問哪裡可以找到動物的書？　男：到二樓去。就在窗戶旁邊。　女：謝謝你。　問：說話的兩個人在哪裡？",en:"In a library.",zh:"要小聲、別人在看書、在找書、書在樓上，這些線索都指向圖書館。談到動物的書，不代表在寵物店(store)；二樓是男士叫女士「上去」的地方，他們現在還沒在二樓。選 A"},
{n:23,p:2,o:["She is very polite.","She is selfish.","She is lazy."],a:0,sen:"M: How was dinner at Ken's house? &nbsp;W: Wonderful. His little sister said thank you after every dish. &nbsp;M: Really? She's only four. &nbsp;W: Yes! And she waited until everybody had food before she began to eat. &nbsp;Q: What is Ken's sister like?",szh:"男：在 Ken 家吃晚餐怎麼樣？　女：很棒(wonderful)。他妹妹每上一道菜都說謝謝。　男：真的嗎？她才四(four)歲耶。　女：對啊！而且她等大家(everybody)都有食物了才開始吃(eat)。　問：Ken 的妹妹是什麼樣的人？",en:"She is very polite.",zh:"每道菜都說謝謝、等大家都拿到食物才開動，表示她很有禮貌(polite)。她會等別人先拿，不是自私(selfish)；對話沒有提到她懶惰(lazy)。選 A"},
{n:24,p:2,o:["Amy looked at his paper.","He was dishonest on the test.","He did very well on his own."],a:1,sen:"W: Did Ben really get a hundred on the test? &nbsp;M: He did. But the teacher saw him looking at Amy's paper. &nbsp;W: Oh no. So the score isn't really his. &nbsp;M: Right. He has to take the test again. &nbsp;Q: What do we know about Ben?",szh:"女：Ben 這次考試真的考一百分？　男：是啊，但老師看到他在看 Amy 的考卷。　女：糟糕，所以那個分數其實不是他自己的。　男：對，他得重考。　問：關於 Ben 我們知道什麼？",en:"He was dishonest on the test.",zh:"老師看到 Ben 偷看 Amy 的考卷，所以他考試不誠實(dishonest)。分數不是他自己考出來的；偷看的是 Ben，不是 Amy 看他的考卷。選 B"},
{n:25,p:2,o:["On Saturday.","On Monday.","On Sunday morning."],a:2,sen:"M: I always confuse these two elements on science tests. &nbsp;W: Me too, but my notes help. I'll lend them to you. &nbsp;M: Thanks! Can I give them back on Saturday? &nbsp;W: How about Sunday morning? I'm out all day Saturday, and the test is on Monday. &nbsp;M: Sure. &nbsp;Q: When will the man give back the notes?",szh:"男：自然考試我總是搞混(confuse)這兩種元素(element)。　女：我也是，不過我的筆記很有用，借(lend)你。　男：謝謝！我星期六(Saturday)還你可以嗎？　女：星期日早上好嗎？我星期六整天不在，而且星期一就要考試了。　男：好。　問：男士什麼時候還筆記？",en:"On Sunday morning.",zh:"男士想星期六還，但女士星期六整天不在，改成星期日早上，男士同意。星期六是被改掉的時間；星期一是考試的日子，女士要在考試前拿回筆記。選 C"},
{n:26,p:3,pic:true,o:[BARS("A Good Friend",["Honest","Brave","Generous"],[80,45,20]),BARS("A Good Friend",["Honest","Brave","Generous"],[80,20,45]),BARS("A Good Friend",["Honest","Brave","Generous"],[45,80,20])],a:1,sen:"In our class, we talked about a good friend's character. Then everybody voted: should a good friend be honest, brave, or generous? I thought brave would win, but it came in last. More students chose generous than brave. And honest got almost twice as many votes as generous. Nobody wants a dishonest friend, so honesty is very important to us. &nbsp;Q: Which chart shows the class votes?",szh:"我們班討論了好朋友該有的個性(character)。接著大家(everybody)投票：好朋友應該誠實(honest)、勇敢(brave)，還是慷慨(generous)？我以為勇敢會贏，結果它是最後一名。選慷慨的比選勇敢的多。而誠實的票數幾乎是慷慨的兩倍。沒人想要不誠實(dishonest)的朋友，所以誠實(honesty)對我們來說很重要。　問：哪張圖表是全班的投票結果？",en:"Honest most, generous second, brave last.",zh:"誠實最多、慷慨第二、勇敢最後，所以是誠實最高、勇敢最低的那張。勇敢最高的那張是說話者原本「以為」的結果；誠實最高但勇敢比慷慨多的那張，和「勇敢最後一名」相反。選 B"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27b'),PH('q27c')],a:2,sen:"This month, my sister Mia helped a lot at home. She is a little lazy about washing dishes, so she only washed them twice. She put away our clothes a few times, but she was sick for a week. Mia loves flowers, so she watered the plants on the balcony almost every day. She is becoming more responsible. &nbsp;Q: What did Mia do most often at home this month?",szh:"這個月我妹妹 Mia 在家幫了很多忙。她洗碗有點懶(lazy)，所以只洗了兩次。她收了幾次衣服，但後來生病(sick)了一星期。Mia 很喜歡花，所以她幾乎每天都在陽台澆植物。她變得越來越負責(responsible)。　問：Mia 這個月在家最常做什麼？",en:"She watered the plants.",zh:"洗碗她有點懶(lazy)，只洗兩次；收衣服做了幾次就因為生病(sick)停了；她幾乎每天都在陽台澆植物，所以最常做的是澆花。 選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28a'),PH('q28c')],a:0,sen:"Last summer, my family visited the countryside in Europe. Our guide said we could ride horses up the hill. My sister was brave and rode a big horse. But I was afraid of horses, so I rode a small donkey. My dad was willing to walk with the guide. &nbsp;Q: How did the speaker go up the hill?",szh:"去年夏天我們全家去歐洲(Europe)的鄉下(countryside)。導遊(guide)說我們可以騎馬上山。我妹妹很勇敢(brave)，騎了一匹大馬。但我怕馬，所以騎了一頭小驢子(donkey)。爸爸願意(willing)跟導遊一起走路。　問：說話者怎麼上山？",en:"On a small donkey.",zh:"騎大馬的是勇敢(brave)的妹妹；和導遊(guide)走路上山的是爸爸；說話者怕馬，騎的是小驢子(donkey)。選 A"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29a'),PH('q29c')],a:1,sen:"For the Lantern Festival, each student in our class made a lantern. I wanted to make a big round one, but it kept falling down. My second try was a fish, but it looked ugly. In the end, I made a small yellow star, and everybody liked it. &nbsp;Q: Which lantern did the speaker make in the end?",szh:"元宵節我們班每個學生都做了一盞燈籠(lantern)。我想做一個大大的圓形(round)燈籠，但它一直塌掉(fall)。第二次我做了一條魚，但看起來很醜(ugly)。最後我做了一顆黃色的小星星，大家(everybody)都很喜歡。　問：說話者最後做了哪一盞燈籠？",en:"A small yellow star lantern.",zh:"大圓燈籠(lantern)一直塌掉沒做成；魚形燈籠太醜(ugly)；最後做的是黃色小星星燈籠。選 B"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30a'),PH('q30b')],a:1,sen:"Last Sunday, my class went to the zoo. We wanted to see the lions first, but their cage was closed for repair. The hippopotamus was bathing, with only its head above the water. The best part was the elephant. It threw water on its back and got everybody near it wet. &nbsp;Q: Which animal did the class not see at the zoo?",szh:"上週日我們班去動物園。我們想先看獅子，但牠們的籠子(cage)關起來在整修(repair)。河馬(hippopotamus)在洗澡(bathe)，只有頭(head)露出水面。最精彩的是大象，牠把水往背上噴，把附近的每個人(everybody)都弄濕(wet)了。　問：全班在動物園「沒有」看到哪一種動物？",en:"The lions.",zh:"河馬(hippopotamus)和大象都看到了；獅子的籠子(cage)在整修，所以沒看到獅子。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 26 回　個性與習慣　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
