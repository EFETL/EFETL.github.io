<script>
/* 圖形素材（第26回 個性與習慣） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/26/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const SOUPBOWL=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q1.jpg" alt="question 1 picture">`;
const HIPPO=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q2.jpg" alt="question 2 picture">`;
const DONKEY=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q3.jpg" alt="question 3 picture">`;
const LANTERN=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q4.jpg" alt="question 4 picture">`;
const CAGE=`<img class="pic-img p0img" src="gept-listening-img/26/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:SOUPBOWL,o:["A round bowl of soup, ready to eat.","A plate of noodles with a fork.","A glass of milk and some bread."],a:0,sen:"For question one, look at the picture. What is on the table?",szh:"第一題，請看圖片。桌上是什麼？",en:"A round bowl of soup to eat.",zh:"桌上是一個圓(round)碗(bowl)裝的湯(soup)，可以吃(eat)了，選 A。B 是麵、C 是牛奶，都不是圖中的東西。"},
{n:2,p:0,fig:HIPPO,o:["A big hippopotamus bathes in the lake.","A big elephant bathes in the lake.","A big crocodile rests by the lake."],a:0,sen:"For question two, look at the picture. What animal is this?",szh:"第二題，請看圖片。這是什麼動物？",en:"A hippopotamus bathing in the lake.",zh:"這是一隻河馬(hippopotamus)在湖(lake)裡泡水(bathe)，選 A。大象和鱷魚看起來有點像，但不是圖中的動物。"},
{n:3,p:0,fig:DONKEY,o:["A horse carries a bundle through the countryside.","A donkey pulls a cart through the countryside.","A donkey carries a bundle through the countryside."],a:2,sen:"For question three, look at the picture. What carries the load?",szh:"第三題，請看圖片。什麼在載貨？",en:"A donkey carries a bundle in the countryside.",zh:"驢子(donkey)馱著一捆(bundle)貨物走過鄉間(countryside)，選 C。A 是馬、B 是拉車，動物或方式不對。"},
{n:4,p:0,fig:LANTERN,o:["A red lantern held by a polite woman.","A red lantern held by a little boy.","A blue lantern held by a polite woman."],a:0,sen:"For question four, look at the picture. What is at the festival?",szh:"第四題，請看圖片。節慶上有什麼？",en:"A red lantern is held by a polite woman.",zh:"選 A。照片中一位面帶微笑、有禮貌的（polite）女士拿著紅色（red）燈籠（lantern）；沒有小男孩（little boy），燈籠也不是藍色（blue）。"},
{n:5,p:0,fig:CAGE,o:["A little monkey sits behind the cage.","A brave lion sits behind the cage.","A brave tiger sits behind the cage."],a:1,sen:"For question five, look at the picture. What is behind the bars?",szh:"第五題，請看圖片。柵欄後面是什麼？",en:"A brave lion sits behind the cage.",zh:"籠子(cage)後面(behind)坐著一頭勇敢(brave)的獅子，選 B。老虎和猴子都不是圖中的動物。"},

{n:6,p:1,o:["She starts her job next week.","Yes, her honesty impresses everybody.","I can't wait to meet the leader."],a:1,sen:"Do you trust the new leader?",szh:"你信任新的領導者嗎？",en:"Her honesty impresses everybody.",zh:"問是否信任新領導者，答『是的，她的誠實(honesty)讓每個人(everybody)佩服』，選 B。A 回答的是工作何時開始，C 沒有回答信不信任。"},
{n:7,p:1,o:["He's diligent with a responsible character.","He sits at the side of the room.","Yes, he joined our class today."],a:0,sen:"What is your new classmate like?",szh:"你的新同學是什麼樣的人？",en:"He's diligent with a responsible character.",zh:"問新同學是什麼樣的人，答『他很勤勞(diligent)，個性(character)負責(responsible)』，選 A。B 只說座位，C 用 Yes 回答疑問詞問句。"},
{n:8,p:1,o:["Yes, I work from nine to five.","He works in the next building.","Not at all. He's generous, never selfish."],a:2,sen:"Is your boss hard to work with?",szh:"你的老闆很難相處嗎？",en:"Not at all. He's generous, never selfish.",zh:"問老闆是否難相處，答『一點也不，他很慷慨(generous)，從不自私(selfish)』，選 C。A 在說上班時間，B 在說他在哪工作，都沒有回答。"},
{n:9,p:1,o:["In the last room on the left.","You may explain your idea now.","I'll develop that idea next week."],a:1,sen:"When can I share my opinion?",szh:"我什麼時候可以說我的想法？",en:"You may explain your idea now.",zh:"問何時可以說想法，答『你現在(now)就可以(may)解釋(explain)』，選 B。A 回答的是地點，C 是評論想法，沒有說時間。"},
{n:10,p:1,o:["The engineer comes at three o'clock.","In the room next to the lake.","Our topic is the bridge repair."],a:2,sen:"What will the meeting be about?",szh:"這場會議要討論什麼？",en:"Our topic is the bridge repair.",zh:"問會議內容，答『我們的主題(topic)是橋的修理(repair)』，選 C。A 說時間、B 說地點，都不是問題要的資訊。"},
{n:11,p:1,o:["He's proud and gave a short speech.","He won the game on Saturday.","The champion is my best friend."],a:0,sen:"How was the champion after his win?",szh:"冠軍贏了之後表現如何？",en:"He's proud and gave a short speech.",zh:"問冠軍贏了之後的表現，答『他很自豪(proud)，還發表了簡短的演講(speech)』，選 A。B 說的是比賽日期，C 沒有描述他的表現。"},
{n:12,p:1,o:["I bought it last Saturday.","The suit is wet and looks ugly.","Yes, I wore it yesterday too."],a:1,sen:"Why won't you wear that jacket?",szh:"你為什麼不穿那件外套？",en:"The suit is wet and looks ugly.",zh:"問為什麼不穿，答『這套西裝(suit)濕了，看起來很醜(ugly)』，選 B。A 說買的時間，C 用 Yes 回答 Why 問句。"},
{n:13,p:1,o:["Sure, I'll lend it. Don't confuse the elements.","I bought it at the science fair.","I borrowed it from the library."],a:0,sen:"Can I borrow your science kit?",szh:"我可以借你的科學組嗎？",en:"Sure, I'll lend it; don't confuse the elements.",zh:"問能不能借，答『當然，我借(lend)你，但別搞混(confuse)那些元素(element)』，選 A。C 重複 borrow 但說的是自己向圖書館借，沒回答問題。"},
{n:14,p:1,o:["We leave on Saturday morning.","It takes about four days.","It costs four thousand dollars."],a:1,sen:"How long is the trip to Europe?",szh:"去歐洲的旅程要多久？",en:"It takes about four days.",zh:"問旅程多久，答『大約要四(four)天』，選 B。A 回答何時出發，C 回答多少錢，雖然也有 four 這個字，但不是時間長度。"},
{n:15,p:1,o:["I built a house near the lake.","Insist on good manners every day.","Good habits are hard to find."],a:1,sen:"How can I build good habits?",szh:"我要怎麼養成好習慣？",en:"Insist on good manners every day.",zh:"問怎麼養成好習慣，答『每天都堅持(insist)好禮貌(manners)』，選 B。A 重複 build 但說的是蓋房子，C 沒有給方法。"},

{n:16,p:2,o:["He is proud.","He is lazy.","He is brave."],a:2,sen:"W: Did you hear the news? A man ran into a burning house. &nbsp;M: Did he save the little girl? &nbsp;W: Yes. He was not afraid at all, and he did not wait for help. &nbsp;Q: What is the man like?",szh:"女：你聽到新聞了嗎？有個男人衝進著火的房子。　男：他救了那個小女孩嗎？　女：救了。他一點都不怕，也沒有等人來幫忙。　問：這個男人是什麼樣的人？",en:"He is brave.",zh:"男人衝進火場救人、一點都不怕，是勇敢(brave)的人，選 C。他沒有炫耀，所以不是驕傲(proud)的 A。"},
{n:17,p:2,o:["He is honest.","He is generous.","He is brave."],a:0,sen:"M: Your grandpa found a wallet in the park, right? &nbsp;W: Yes. He took it to the police station. &nbsp;M: Was there money inside? &nbsp;W: A lot. But he did not take any. &nbsp;Q: What is her grandfather like?",szh:"男：你爺爺在公園撿到一個皮夾，對嗎？　女：對。他把它送到警察局。　男：裡面有錢嗎？　女：很多。但他一毛也沒拿。　問：她的爺爺是什麼樣的人？",en:"He is honest.",zh:"撿到很多錢卻交給警察、一毛不拿，是誠實(honest)的人，選 A。他沒有把錢送人，所以不是慷慨(generous)的 B。"},
{n:18,p:2,o:["A friendly guest.","A new worker.","A responsible manager."],a:2,sen:"W: Who runs your father's company? &nbsp;M: A responsible manager who cares for the whole team. &nbsp;W: Lucky workers. &nbsp;Q: Who runs the company?",szh:"女：你爸爸的公司誰在管？　男：一位負責(responsible)、關心整個團隊的經理(manager)。　女：員工真幸運。　問：誰在管理公司？",en:"A responsible manager.",zh:"是負責(responsible)的經理(manager)，選 C。worker 在對話中出現但只是被照顧的員工，不是管理者。"},
{n:19,p:2,o:["They are lazy.","They are diligent.","They are noisy."],a:1,sen:"M: Why does Class Three always win the prize? &nbsp;W: They finish their homework before dinner. &nbsp;M: Even on weekends? &nbsp;W: Yes, and they never miss a class. &nbsp;Q: What kind of students are they?",szh:"男：為什麼三班總是得獎？　女：他們在晚餐前就寫完功課。　男：連週末也是嗎？　女：是的，而且他們從不缺課。　問：他們是什麼樣的學生？",en:"They are diligent.",zh:"他們總是提早寫完功課、從不缺課，是勤奮(diligent)的學生，選 B。lazy 的 A 剛好相反。"},
{n:20,p:2,o:["Near the sea.","In a big city.","In the countryside."],a:2,sen:"W: Where do your grandparents live? &nbsp;M: In the quiet countryside, near a beautiful lake. &nbsp;W: How peaceful. &nbsp;Q: Where do the grandparents live?",szh:"女：你祖父母住哪？　男：在安靜的鄉間(countryside)，一座美麗的湖(lake)附近。　女：真寧靜。　問：祖父母住哪？",en:"In the countryside near a lake.",zh:"祖父母住在湖(lake)邊安靜的鄉間(countryside)，選 C。他們提到 beautiful lake，但沒有說海或大城市。"},
{n:21,p:2,o:["A teacher.","An engineer.","A bus driver."],a:1,sen:"M: What does your mother do? &nbsp;W: She is an engineer who can repair almost any machine. &nbsp;M: Very clever. &nbsp;Q: What is the mother's job?",szh:"男：你媽媽做什麼工作？　女：她是工程師(engineer)，幾乎什麼機器都能修(repair)。　男：真聰明。　問：媽媽的工作是什麼？",en:"An engineer who can repair machines.",zh:"媽媽是會修理(repair)機器的工程師(engineer)，選 B。其他職業對話中都沒提到。"},
{n:22,p:2,o:["She is shy.","She is selfish.","She is generous."],a:2,sen:"W: I forgot my pencil case. &nbsp;M: Ask Amy. She will lend you one. &nbsp;W: Even her new pen? &nbsp;M: Sure. She gives things to everyone. &nbsp;Q: What is Amy like?",szh:"女：我忘了帶鉛筆盒。　男：去問 Amy。她會借你一個。　女：連她的新筆也借嗎？　男：當然。她什麼東西都會給大家。　問：Amy 是什麼樣的人？",en:"She is generous.",zh:"Amy 願意借(lend)東西、什麼都分給大家，是慷慨(generous)的人，選 C。selfish 的 B 剛好相反。"},
{n:23,p:2,o:["He gave a speech.","He gave a test.","He made a new rule."],a:0,sen:"M: How was the meeting this morning? &nbsp;W: Boring. The principal talked about safety for twenty minutes. &nbsp;M: Did everybody listen? &nbsp;W: No. Some students were sleeping. &nbsp;Q: What did the principal do?",szh:"男：今天早上的集會怎麼樣？　女：很無聊。校長講了二十分鐘的安全。　男：每個人都有聽嗎？　女：沒有。有些學生在睡覺。　問：校長做了什麼？",en:"He gave a speech.",zh:"校長站著講了二十分鐘，是發表演講(speech)，選 A。安全是主題(topic)，但他並沒有出考試或訂新規則。"},
{n:24,p:2,o:["He is a driver.","He is a teacher.","He is a guide."],a:2,sen:"W: Who is the man with the little flag? &nbsp;M: Mr. Lin. He takes visitors around the old town. &nbsp;W: Does he tell stories about the city? &nbsp;M: Yes, he knows everything about it. &nbsp;Q: What is Mr. Lin's job?",szh:"女：拿著小旗子的男人是誰？　男：林先生。他帶遊客逛老城區。　女：他會講這座城市的故事嗎？　男：會，他什麼都知道。　問：林先生的工作是什麼？",en:"He is a guide.",zh:"帶遊客逛城、講城市的故事，是導遊(guide)，選 C。teacher 也會講故事，但他帶的是遊客，不是學生。"},
{n:25,p:2,o:["A cold drink.","Some hot soup.","A sandwich."],a:1,sen:"M: What should a sick person eat? &nbsp;W: Some hot soup is easy to eat and good for them. &nbsp;M: I will make some. &nbsp;Q: What should a sick person eat?",szh:"男：生病的人該吃什麼？　女：熱湯(soup)好吃(eat)又對身體好。　男：我來煮。　問：生病的人該吃什麼？",en:"Hot soup to eat.",zh:"熱湯(soup)好入口又對身體好，選 B。cold drink 對生病的人較不適合。"},

{n:26,p:3,pic:true,o:[BARS("Best Traits",["Honest","Brave","Kind"],[80,50,20]),BARS("Best Traits",["Honest","Brave","Kind"],[50,80,20]),BARS("Best Traits",["Honest","Brave","Kind"],[20,50,80])],a:0,sen:"Our class voted for the most important character trait. Honesty got the most votes, because nobody wants a dishonest friend. Being brave was in the middle, and being kind, though loved, got the fewest votes this time. So the honest bar should be the tallest. &nbsp;Q: Which chart shows the votes?",szh:"我們班票選最重要的個性(character)特質。誠實(honesty)最多票，因為沒有人想要不誠實(dishonest)的朋友；勇敢(brave)中等；善良雖受喜愛，這次票最少。所以誠實長條最高。　問：哪張圖顯示票數？",en:"Honest most, kind least.",zh:"誠實(honest)票數最多、善良最少，所以最高的長條是 Honest，選 A。"},
{n:27,p:3,pic:true,o:[BARS("Study Hours",["Mon","Wed","Fri"],[55,80,30]),BARS("Study Hours",["Mon","Wed","Fri"],[30,55,80]),BARS("Study Hours",["Mon","Wed","Fri"],[80,55,30])],a:2,sen:"A diligent student wrote down her study hours. On Monday she studied the most, full of energy. On Wednesday it was in the middle, and by Friday the least, because she felt lazy at the end of the week. So her study hours kept falling each day. &nbsp;Q: Which chart shows her study hours?",szh:"一位勤奮(diligent)的學生記下她的讀書時數。星期一讀最多，精力充沛；星期三中等；到星期五最少，因為週末前她變懶(lazy)了。所以她的讀書時數一天天下降(fall)。　問：哪張圖顯示她的讀書時數？",en:"Mon most, Fri least.",zh:"週一最多、一路下降到週五最少，符合『Mon 最高、Fri 最低』，選 C。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('rice'),IMG('bread')],a:2,
 sen:"My grandmother is a humble and generous person who loves to feed her guests. When we visit, she does not make heavy noodles or dry rice, which take too long. Instead, she bakes warm bread for everyone, and while we eat, she tells us wonderful old stories. &nbsp;Q: What does grandmother make for her guests?",
 szh:"我奶奶是個謙虛(humble)又慷慨(generous)的人，愛招待客人。我們去時，她不做費時的重口味麵或乾飯，而是為大家烤溫熱的麵包(bread)，我們吃(eat)的時候她講很棒(wonderful)的老故事。　問：奶奶為客人做什麼？",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 26 回　個性與習慣　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
