<script>
/* 圖形素材（第6回 家人與親戚） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/6/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/6/p3_${n}.jpg?v=r6qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const COW=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q1.jpg" alt="question 1 picture">`;
const HEN=`<svg width="120" height="108" viewBox="0 0 120 110"><ellipse cx="56" cy="66" rx="34" ry="26" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><circle cx="86" cy="44" r="15" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><path d="M80 30 q3 -8 6 0 q3 -8 6 0 q3 -8 5 2" fill="#e53935" stroke="#1a1a1a" stroke-width="1"/><circle cx="90" cy="42" r="2" fill="#1a1a1a"/><path d="M100 46 l10 -3 l-10 6 z" fill="#ffb703"/><path d="M22 62 q-12 4 -6 16 q8 -2 10 -10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/><g stroke="#ffb703" stroke-width="2.5"><line x1="48" y1="90" x2="48" y2="104"/><line x1="64" y1="90" x2="64" y2="104"/></g></svg>`;
const LAMB=`<svg width="126" height="108" viewBox="0 0 126 110"><g fill="#fff" stroke="#1a1a1a" stroke-width="2"><circle cx="52" cy="58" r="14"/><circle cx="70" cy="52" r="14"/><circle cx="86" cy="60" r="14"/><circle cx="60" cy="70" r="14"/><circle cx="78" cy="72" r="14"/></g><ellipse cx="98" cy="58" rx="12" ry="14" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2"/><ellipse cx="88" cy="52" rx="4" ry="6" fill="#3a3a3a"/><ellipse cx="108" cy="52" rx="4" ry="6" fill="#3a3a3a"/><circle cx="96" cy="56" r="2" fill="#fff"/><circle cx="102" cy="56" r="2" fill="#fff"/><g stroke="#3a3a3a" stroke-width="2.5"><line x1="60" y1="84" x2="60" y2="100"/><line x1="80" y1="84" x2="80" y2="100"/></g></svg>`;
const FRAME=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q3.jpg" alt="question 3 picture">`;
const GLASSES=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q4.jpg" alt="question 4 picture">`;
const BLOUSE=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q5.jpg" alt="question 5 picture">`;
const CAKE=`<img class="pic-img p0img" src="gept-listening-img/6/p0_q2.jpg" alt="question 2 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:COW,o:["He is sitting on the fence and feeding the cow.","He is feeding the cow, and a hen is standing near his feet.","He is feeding the cow, and a hen is standing on the fence."],a:1,sen:"For question one, look at the picture. What is the farmer doing?",szh:"第一題，請看圖片。農夫在做什麼？",en:"He is feeding the cow, and a hen is standing near his feet.",zh:"農夫(farmer)站著用手餵母牛(cow)吃草，一隻母雞(hen)就站在他的腳邊，正確。說他坐在柵欄上不對，他是站在地上；說母雞站在柵欄上也不對，母雞在地上。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">GIFT SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Flowers</td><td style="text-align:right;font-weight:700">$350</td></tr><tr><td style="padding:4px 30px 4px 0">Blouse</td><td style="text-align:right;font-weight:700">$250</td></tr><tr><td style="padding:4px 30px 4px 0">Cake</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Card</td><td style="text-align:right;font-weight:700">$50</td></tr></table></div>`,o:["She will have two hundred dollars left.","She will have one hundred dollars left.","She will have three hundred fifty dollars left."],a:1,sen:"For question two, look at the picture. It is Mother's Day. Amy has seven hundred dollars. She buys flowers and a blouse for her mother. How much will she have left?",szh:"第二題，請看圖片。今天是母親節(Mother's Day)。艾咪有七百元。她買了花和一件上衣(blouse)要送給媽媽。她還剩多少錢？",en:"She will have one hundred dollars left.",zh:"價目表上花350元、上衣(blouse)250元，一共600元，700減600剩100元。剩兩百元是把花和蛋糕(150元)算成她買的東西；剩三百五十元是只買了花、忘記上衣。選 B"},
{n:3,p:0,fig:FRAME,o:["A young man, two young women, and a little girl.","A young man, a young woman, and a baby in the woman's arms.","A young man, a young woman, and a little girl between them."],a:2,sen:"For question three, look at the picture. Who is in the family photo?",szh:"第三題，請看圖片。全家(family)福照片裡有誰？",en:"A young man, a young woman, and a little girl between them.",zh:"照片裡是一位年輕男子、一位年輕女子，中間夾著一個小女孩(girl)，正確。小女孩已經會笑著靠在兩人中間，不是被女子抱在懷裡的寶寶(baby)；照片裡只有一位年輕女子，不是兩位。選 C"},
{n:4,p:0,fig:GLASSES,o:["She is looking for her glasses on the sofa, but they are on the table.","She is looking for her glasses on the sofa, and the glasses box is empty.","She is sitting on the sofa with her glasses on."],a:1,sen:"For question four, look at the picture. What is the grandmother doing?",szh:"第四題，請看圖片。奶奶在做什麼？",en:"She is looking for her glasses on the sofa, and the glasses box is empty.",zh:"奶奶(grandmother)掀開沙發坐墊在找東西，桌上的眼鏡(glasses)盒是打開的、裡面空空的，所以她在找眼鏡，正確。桌上只有空盒子，眼鏡不在桌上；她彎著腰在找，沒有坐在沙發上，臉上也沒戴眼鏡。選 B"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Farm Animals</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="125" width="44" height="25" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="120" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="96" y="88" width="44" height="62" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="83" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="162" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="45" font-size="14" font-weight="700" text-anchor="middle">80</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Cows</text><text x="118" y="167" text-anchor="middle">Lambs</text><text x="184" y="167" text-anchor="middle">Hens</text></g></svg>`,o:["The farmer has eighty.","The farmer has one hundred.","The farmer has one hundred thirty."],a:1,sen:"For question five, look at the picture. How many cows and hens does the farmer have in all?",szh:"第五題，請看圖片。農夫(farmer)一共有多少隻乳牛(cow)和母雞(hen)？",en:"The farmer has one hundred.",zh:"圖中乳牛(cow)20隻、母雞(hen)80隻，加起來100隻。80只是母雞的數量；130是把小羊(lamb)50隻和母雞80隻加在一起，看錯了項目。選 B"},
{n:6,p:1,o:["Sure, you can hold the baby.","Yes, and he turns fourteen this year.","No, she's my cousin's daughter."],a:2,sen:"Is that baby over there your little brother?",szh:"那邊那個寶寶是你弟弟嗎？",en:"No, she's my cousin's daughter.",zh:"問那個寶寶(baby)是不是弟弟(brother)，答「不是，她是我表姊的女兒(daughter)」，用 she 也點出寶寶是女生。說「是，他今年滿十四(fourteen)歲」和「寶寶」矛盾；「當然，你可以抱寶寶」是回應請求，沒回答是不是弟弟。選 C"},
{n:7,p:1,o:["Let's cook Mom a spaghetti dinner.","Mom had a great idea last year.","It's on the second Sunday in May."],a:0,sen:"What's your idea for Mother's Day this year?",szh:"你今年母親節有什麼點子？",en:"Let's cook Mom a spaghetti dinner.",zh:"問母親節(Mother's Day)的點子(idea)，提議「我們煮一頓義大利麵(spaghetti)晚餐給媽媽」就是點子。「在五月第二個星期日」答的是日期；「媽媽去年有個好點子」重複 idea，但人物和時間都不對。選 A"},
{n:8,p:1,o:["Yes, it was quick and easy.","It's difficult to find your street.","Don't worry. Let's do it step by step."],a:2,sen:"This math homework is so difficult.",szh:"這份數學作業好難。",en:"Don't worry. Let's do it step by step.",zh:"對方抱怨作業很難(difficult)，回「別擔心，我們一步一步(step)來」最自然。說「是啊，又快(quick)又簡單」和「很難」矛盾；「你家的街(street)很難找」只是重複 difficult，話題完全不同。選 C"},
{n:9,p:1,o:["An actress. She's my father's cousin.","She's on at eight every night.","Yes, her black hair is really long."],a:0,sen:"Who's that woman with long black hair on TV?",szh:"電視上那個黑色長髮的女人是誰？",en:"An actress. She's my father's cousin.",zh:"問「是誰」，答「一位女演員(actress)，是我爸爸(father)的表妹(cousin)」說出身分。「她每晚八(eight)點播出」答的是時間；用 Yes 回答 who 問句，又只重複黑(black)頭髮。選 A"},
{n:10,p:1,o:["Eight, if you count my grandmother and grandfather.","My family lives in Tainan.","There are a lot of people on our street."],a:0,sen:"How many people are there in your family?",szh:"你家有幾個人？",en:"Eight, if you count my grandmother and grandfather.",zh:"問家(family)裡幾個人，答「算上爺爺奶奶的話有八(eight)個」是人數。「我們這條街(street)人很多(a lot of)」重複 many people，說的卻是街上；「我家住在台南」答的是地點。選 A"},
{n:11,p:1,o:["He'll be home at about six.","Fourteen. It's his last year of junior high school.","He's much taller than our father now."],a:1,sen:"How old is your brother now?",szh:"你哥哥現在幾歲？",en:"Fourteen. It's his last year of junior high school.",zh:"問哥哥(brother)幾歲，答「十四(fourteen)歲，是他國中(junior high school)最後一年」。「他現在比爸爸(father)高很多」答的是身高；「他大約六點到家」答的是時間。選 B"},
{n:12,p:1,o:["Yes, there's a big apple tree in our yard.","Almost. I just need a photo of my grandfather.","No, I finished it yesterday."],a:1,sen:"Have you already finished your family tree for class?",szh:"你上課要用的家族樹已經做完了嗎？",en:"Almost. I just need a photo of my grandfather.",zh:"問家族(family)樹是否已經(already)做完，答「快好了，只差一張爺爺(grandfather)的照片」是間接回答「還沒」。「院子裡有棵大蘋果(apple)樹」只是重複 tree；先說 No 又說昨天做完，前後矛盾。選 B"},
{n:13,p:1,o:["Thanks, I'd like some apple juice.","Then let's buy some more juice.","Quick, wash it in cold water before it's ruined."],a:2,sen:"Oh no, I got juice on my new blouse.",szh:"糟了，我把果汁弄到新上衣上了。",en:"Quick, wash it in cold water before it's ruined.",zh:"對方的新上衣(blouse)沾到果汁，建議「快(quick)用冷水洗，免得毀了(ruin)」最自然。「那我們再買些果汁」和「謝謝，我要蘋果(apple)汁」都只是重複 juice，沒有回應衣服弄髒的事。選 C"},
{n:14,p:1,o:["We'll visit them this weekend.","They're both over seventy.","They live with us, so I see them every day."],a:2,sen:"Where do your grandmother and grandfather live?",szh:"你的爺爺奶奶住在哪裡？",en:"They live with us, so I see them every day.",zh:"問住哪裡，答「他們和(with)我們住，所以我每天都見得到」是間接說出地點。「兩人都七十多歲了」答的是年紀；「我們這週末要去看他們」答的是時間。選 C"},
{n:15,p:1,o:["Thanks. I'd like a glass of water.","A pipe upstairs must be broken. I'll call someone.","Yes, our ceiling is very high."],a:1,sen:"Look! Water is coming through the ceiling!",szh:"你看！水從天花板滲下來了！",en:"A pipe upstairs must be broken. I'll call someone.",zh:"對方發現水從天花板(ceiling)滲下來，回「樓上一定是水管(pipe)破了，我來找人(someone)處理」最合理。「是啊，天花板很高」只重複 ceiling；「謝謝，我要一杯水」把狀況聽成請喝水。選 B"},
{n:16,p:2,o:["Five.","One.","Four."],a:0,sen:"W: Does your grandmother have any granddaughters? &nbsp;M: Just one, my cousin Amy. The others are all boys. &nbsp;W: How many boys? &nbsp;M: Four, and I'm one of her grandsons. &nbsp;Q: How many grandsons and granddaughters does the grandmother have in all?",szh:"女：你奶奶有孫女(granddaughter)嗎？　男：只有一個，就是我表妹(cousin) Amy，其他都是男生。　女：有幾個男生？　男：四個，我就是她的孫子(grandson)之一。　問：奶奶總共有幾個孫子和孫女？",en:"Five.",zh:"孫女(granddaughter)只有 Amy 一個，孫子(grandson)有四個，加起來是五個。「一個」只是孫女的人數，男士說 one of her grandsons 也容易誤導；「四個」只算了孫子。選 A"},
{n:17,p:2,o:["Hens and lambs.","Cows and hens.","Cows and lambs."],a:0,sen:"M: Your uncle is a farmer, right? Does he still keep cows? &nbsp;W: Not any more. He sold them last year and bought some lambs. &nbsp;M: What about his hens? &nbsp;W: He still has them. We get eggs from them every week. &nbsp;Q: What animals does the farmer have now?",szh:"男：你叔叔是農夫(farmer)，對吧？他還養乳牛(cow)嗎？　女：沒有了，他去年把牛賣了，買了幾隻小羊(lamb)。　男：那他的母雞(hen)呢？　女：還在，我們每週都拿牠們下的蛋。　問：農夫現在養什麼動物？",en:"Hens and lambs.",zh:"乳牛(cow)去年已經賣掉，後來買了小羊(lamb)，母雞(hen)也還在，所以現在是母雞和小羊。有乳牛的兩個答案都把已經賣掉的動物算進去了。選 A"},
{n:18,p:2,o:["Visiting the grandfather's house.","Finding out where a family member lives.","Moving in with an aunt."],a:1,sen:"M: Is your grandfather still on Park Street? &nbsp;W: No, he used to live there. Last year he moved in with my aunt. &nbsp;M: So where is he now? &nbsp;W: I'll show you on this map. He lives here, on River Street. &nbsp;M: Oh, that's very close to my house. &nbsp;Q: What are the speakers doing?",szh:"男：你爺爺(grandfather)還住在公園街(Street)嗎？　女：不，他以前(used to)住那裡。去年他搬去和我阿姨一起住。　男：那他現在在哪裡？　女：我在這張地圖(map)上指給你看。他住在這裡，河濱街。　男：喔，離我家很近。　問：說話的兩個人在做什麼？",en:"Finding out where a family member lives.",zh:"男子問爺爺(grandfather)是不是還住公園街，女子說他以前(used to)住那裡，再用地圖(map)指出現在住在河濱街，所以兩人是在弄清楚家人住哪裡。他們只是在看地圖，沒有真的去爺爺家；搬去和阿姨住的是爺爺，不是說話的人。選 B"},
{n:19,p:2,o:["She's a teacher.","She makes blouses.","She's an actress."],a:2,sen:"W: Who's that woman in the blouse with a flower pattern? &nbsp;M: That's Ms. Lin. She used to teach at my junior high school. &nbsp;W: Really? I think I've seen her on TV. &nbsp;M: You have. She left school five years ago. Now she plays mothers in TV dramas. &nbsp;Q: What is Ms. Lin's job now?",szh:"女：那個穿花朵圖案(pattern)上衣(blouse)的女人是誰？　男：那是林女士(Ms.)，她以前在我的國中(junior high school)教書。　女：真的嗎？我好像在電視上看過她。　男：妳看過。她五年前離開學校，現在在電視劇裡演媽媽。　問：林女士現在的工作是什麼？",en:"She's an actress.",zh:"林女士(Ms.)五年前離開學校，現在在電視劇裡演媽媽，換句話說就是女演員(actress)。老師是她以前的工作；上衣(blouse)只是她今天穿的衣服，和工作無關。選 C"},
{n:20,p:2,o:["A visit to see animals.","Buying apples for the hens.","Moving the hens to a new place."],a:0,sen:"W: The farmer is waiting for us at ten tomorrow. &nbsp;M: What should we bring? &nbsp;W: Some apples for the hens, and some straw for the lamb. &nbsp;M: The hens are quick, so we must be careful with the apples. &nbsp;W: Don't worry. The farmer will show us how. &nbsp;Q: What are the speakers talking about?",szh:"女：農夫(farmer)明天十點等我們。　男：我們該帶什麼？　女：一些蘋果(apple)給母雞(hen)，還有一些稻草(straw)給小羊(lamb)。　男：母雞動作很快(quick)，所以我們要小心處理蘋果。　女：別擔心。農夫會教我們怎麼做。　問：說話的兩個人在談什麼？",en:"A visit to see animals.",zh:"兩人要去見農夫，帶蘋果(apple)給母雞(hen)、稻草(straw)給小羊(lamb)，所以是在談一趟去看動物的行程。蘋果是從家裡帶去的，不是要去買；對話中沒有人要搬動母雞。選 A"},
{n:21,p:2,o:["Fourteen guests is a fine number.","Fifty guests will come.","Last year's party was not a success."],a:0,sen:"W: I don't think my party idea will be a success. Nobody will come. &nbsp;M: Don't be so negative. Fourteen people have already said yes. &nbsp;W: But I sent invitations to fifty people. &nbsp;M: Last year only eight came to your party, and everyone had a great time. &nbsp;W: That's true, I guess. &nbsp;Q: What does the man think about the party?",szh:"女：我覺得我的派對(party)點子(idea)不會成功(success)，沒有人會來。　男：別那麼負面(negative)，已經(already)有十四(fourteen)個人說要來了。　女：可是我寄了五十張邀請給別人。　男：去年只有八個人來妳的派對，大家都玩得很開心。　女：這倒是真的。　問：男士覺得這場派對怎麼樣？",en:"Fourteen guests is a fine number.",zh:"男士說已經(already)有十四(fourteen)人答應，又提到去年只有八人來、大家還是玩得很開心，意思是十四個客人已經夠好了。五十是女士寄出邀請的人數，不是會來的人數；去年的派對大家玩得很開心，所以不是不成功(success)。選 A"},
{n:22,p:2,o:["Tomorrow.","Next year.","Next week."],a:1,sen:"M: You look sad. How was the singing show? &nbsp;W: I sang badly. I forgot the words. &nbsp;M: Can you try again soon? &nbsp;W: I wish I could try again tomorrow, but the next show is next year. Anyway, I'll practice hard. &nbsp;Q: When will the woman get another chance?",szh:"男：妳看起來很難過，歌唱表演怎麼樣？　女：我唱得很差(badly)，忘詞了。　男：很快可以再試一次嗎？　女：真希望(wish)明天就能再試，但下一場是明年。不管怎樣(anyway)，我會努力練習。　問：女士什麼時候會有下一次機會(chance)？",en:"Next year.",zh:"下一場表演在明年，所以下一次機會(chance)是明年。「明天」只是她希望(wish)的，不是真的；「下週」對話中沒有提到。選 B"},
{n:23,p:2,o:["A little girl.","A couple and their child.","An old couple."],a:2,sen:"W: Did someone move into the empty house on our street? &nbsp;M: Yes, an old couple. &nbsp;W: But I saw a little girl there this morning. &nbsp;M: That's their granddaughter. She only comes on weekends. &nbsp;Q: Who lives in the house?",szh:"女：有人(someone)搬進我們這條街(street)上那間空房子嗎？　男：有，一對老夫妻(couple)。　女：可是我今天早上在那裡看到一個小女孩(girl)。　男：那是他們的孫女(granddaughter)，她只有週末才來。　問：誰住在那間房子？",en:"An old couple.",zh:"搬進來住的是一對老夫妻(couple)；小女孩(girl)是他們的孫女(granddaughter)，只有週末來玩，不住那裡。說「一對夫妻和他們的孩子(child)」把只是來訪的孫女當成住在那裡的小孩。選 C"},
{n:24,p:2,o:["Sing the alphabet song.","Say only eight letters.","Write the whole alphabet."],a:0,sen:"W: Your daughter is only three. Does she know the alphabet yet? &nbsp;M: She can sing the whole alphabet song. &nbsp;W: Wow! Can she write it, too? &nbsp;M: Not yet. Just the first eight letters. &nbsp;Q: What can the man's daughter do?",szh:"女：你女兒(daughter)才三歲，她認識字母(alphabet)了嗎？　男：她會唱完整首字母歌。　女：哇！她也會寫嗎？　男：還不會，只會寫前八(eight)個字母。　問：男士的女兒會做什麼？",en:"Sing the alphabet song.",zh:"女兒(daughter)能唱完整首字母(alphabet)歌。她只會寫前八(eight)個字母，所以還不會寫全部字母；八個是「寫」的數量，她「唱」的是全部，不是只會說八個。選 A"},
{n:25,p:2,o:["On Sunday at noon.","On Saturday evening.","On Sunday evening."],a:2,sen:"M: Dad wants to have a family dinner on Saturday. &nbsp;W: I'm busy on Saturday. How about the following day? &nbsp;M: My grandmother has a party at noon that day. &nbsp;W: Then let's eat together that evening. &nbsp;Q: When will the family have dinner?",szh:"男：爸爸想在星期六辦家庭(family)晚餐。　女：我星期六很忙，隔天(the following day)呢？　男：奶奶那天中午有派對(party)。　女：那我們那天晚上一起吃吧。　問：家人什麼時候吃晚餐？",en:"On Sunday evening.",zh:"女士星期六沒空，提議隔天(the following day)，也就是星期日；奶奶星期日中午有派對(party)，所以改在星期日晚上。星期六是被女士否定的日子；星期日中午是奶奶的派對時間。選 C"},
{n:26,p:3,pic:true,o:[BARS("Who We Talk To",["Mom","Dad","Grandma"],[70,40,20]),BARS("Who We Talk To",["Mom","Dad","Grandma"],[70,20,40]),BARS("Who We Talk To",["Mom","Dad","Grandma"],[40,20,70])],a:1,sen:"Our teacher asked each student one question, and every individual answer went into a chart: Who do you talk to most at home? Most students chose a female family member. Mothers came first, of course. But fathers did not come second. More students chose their grandmothers. &nbsp;Q: Which chart shows the answers?",szh:"老師問每位學生一個問題，每一個個別(individual)的回答都做成圖表：在家最常跟誰說話？大部分學生選了女性(female)家人(family)。媽媽當然是第一名。但爸爸(father)不是第二名，選奶奶(grandmother)的學生比選爸爸的多。　問：哪張圖表顯示調查結果？",en:"Mom most, grandma second, dad fewest.",zh:"媽媽第一；爸爸(father)不是第二，選奶奶(grandmother)的人比爸爸多，所以順序是媽媽、奶奶、爸爸，大多數人選的也確實是女性(female)家人。爸爸排第二的那張正好是說話者否定的情形；奶奶最高的那張與「媽媽第一」不符。選 B"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27a'),PH('q27b')],a:0,sen:"My grandfather is always looking for his glasses. Yesterday, he looked on the kitchen table, but they weren't there. Then he asked my little brother, but my brother didn't have them. Finally, I started to laugh. They were on top of his head the whole time! &nbsp;Q: Where were the grandfather's glasses?",szh:"我爺爺(grandfather)老是在找他的眼鏡(glasses)。昨天他先找廚房餐桌，可是不在那裡。接著他問我弟弟(brother)，但弟弟也沒拿。最後我笑了出來——眼鏡一直都在他頭頂上！　問：爺爺的眼鏡在哪裡？",en:"On top of his head.",zh:"爺爺(grandfather)找了餐桌、問了弟弟(brother)都沒找到，最後發現眼鏡(glasses)一直戴在他的頭頂上。餐桌是他找過但不在的地方；弟弟說他沒拿，所以不是在弟弟手上。選 A"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28a'),PH('q28c')],a:2,sen:"Last summer, I stayed on my grandfather's farm. My grandmother asked me to get the eggs from the hens, but the hens were not happy to see me, so she did it herself. Milking the cow was too difficult for me, so my grandfather did that. My job was to feed the baby lamb with a bottle of milk every morning. &nbsp;Q: What was the speaker's job on the farm?",szh:"去年夏天我住在爺爺(grandfather)的農場。奶奶(grandmother)要我去母雞(hen)那裡撿蛋，可是母雞不太歡迎我，所以她自己去撿。擠牛(cow)奶對我來說太難(difficult)，所以由爺爺做。我的工作是每天早上用奶瓶餵小羊(lamb)喝奶。　問：說話者在農場的工作是什麼？",en:"Feeding the baby lamb with a bottle.",zh:"說話者的工作是每天早上用奶瓶餵小羊(lamb)。撿雞(hen)蛋本來要她做，但最後是奶奶自己去；擠牛(cow)奶太難(difficult)，是爺爺做的。選 C"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29a'),PH('q29c')],a:2,sen:"Every Mother's Day, we take Mom to a restaurant. This year, Dad had a different idea. He wanted to cook spaghetti for her at home. But he cooked it too long and ruined it. Mom just laughed, and we ordered a pizza and ate it at home. &nbsp;Q: What did the family eat on Mother's Day this year?",szh:"每年母親節(Mother's Day)我們都帶媽媽去餐廳。今年爸爸有個不一樣的點子(idea)：在家煮義大利麵(spaghetti)給她吃。可是他煮太久，把麵煮壞了(ruin)。媽媽只是笑一笑，我們就叫了披薩在家吃。　問：今年母親節這家人吃了什麼？",en:"A pizza at home.",zh:"去餐廳是往年的習慣，今年沒去；爸爸想煮的義大利麵(spaghetti)被他煮壞(ruin)了，沒有吃成；最後是在家吃叫來的披薩。選 C"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:0,sen:"My grandfather used to go fishing by the river every Sunday. Last year, he hurt his leg, and now walking far is difficult for him. My cousin gave him an old piano, but he says he is too old to learn. These days, he grows tomatoes in pots on the roof, and he is very proud of them. &nbsp;Q: What does the grandfather do now?",szh:"我爺爺(grandfather)以前(used to)每個星期日都去河邊釣魚。去年他傷了腳，現在走遠路對他來說很難(difficult)。我表哥(cousin)送他一台舊鋼琴，但他說自己太老學不來。最近他在屋頂上用盆子種番茄，而且很以它們為榮。　問：爺爺現在都做什麼？",en:"He grows tomatoes in pots on the roof.",zh:"釣魚是爺爺(grandfather)以前(used to)的習慣，傷了腳之後就沒去了；鋼琴是表哥(cousin)送的，但他說太老不學；他現在做的是在屋頂上種番茄。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 6 回　家人與親戚　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);

<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
