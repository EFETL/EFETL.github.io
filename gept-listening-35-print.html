<script>
/* 圖形素材（第35回 材料與能源） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/35/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/35/p3_${n}.jpg?v=r35std-20261030" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const HAMMER=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q1.jpg" alt="question 1 picture">`;
const GASPUMP=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q2.jpg" alt="question 2 picture">`;
const PIANO=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q3.jpg" alt="question 3 picture">`;
const SHOE=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q4.jpg" alt="question 4 picture">`;
const SUBWAY=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q5.jpg?v=p0fix-20261010" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:HAMMER,o:["A hammer with a rubber head and a wooden handle.","A hammer with a metal head and a metal handle.","A hammer with a metal head and a wooden handle."],a:2,sen:"For question one, look at the picture. What is on the table?",szh:"第一題，請看圖片。桌上有什麼？",en:"A hammer with a metal head and a wooden handle.",zh:"桌上是一把鐵鎚(hammer)，鎚頭是灰色金屬(metal)，握把是木頭，正確。鎚頭是金屬不是橡膠(rubber)；握把是咖啡色木頭，不是金屬。選 C"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">Tool Shop</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Hammer</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Iron Pot</td><td style="text-align:right;font-weight:700">$250</td></tr><tr><td style="padding:4px 30px 4px 0">Rubber Boot</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Metal Box</td><td style="text-align:right;font-weight:700">$200</td></tr></table></div>`,o:["He will have two hundred fifty dollars left.","He will have one hundred dollars left.","He will have three hundred fifty dollars left."],a:1,sen:"For question two, look at the picture. A man with a beard has five hundred dollars. He buys a hammer and an iron pot. How much will he have left?",szh:"第二題，請看圖片。一位留鬍子(beard)的男士有五百元。他買了一把鐵鎚(hammer)和一個鐵(iron)鍋。他還剩多少錢？",en:"He will have one hundred dollars left.",zh:"價目表上鐵鎚(hammer)150元、鐵(iron)鍋250元，一共400元，500減400剩100元。剩250元是只扣了鐵鍋、忘記鐵鎚；剩350元是只扣了鐵鎚、忘記鐵鍋。選 B"},
{n:3,p:0,fig:PIANO,o:["Someone is playing the piano near a window.","There is a plant on top of the piano.","Someone is cleaning the piano near a window."],a:0,sen:"For question three, look at the picture. Which is true about the picture?",szh:"第三題，請看圖片。關於這張圖，何者正確？",en:"Someone is playing the piano near a window.",zh:"有人雙手放在琴鍵上，在窗邊彈鋼琴(piano)，正確。手指是按在琴鍵上彈奏，不是在擦鋼琴；盆栽放在窗邊的地上，不在鋼琴上面。選 A"},
{n:4,p:0,fig:SHOE,o:["A black sports shoe in the water.","A blue rubber shoe in the water.","A blue rubber shoe on dry ground."],a:1,sen:"For question four, look at the picture. What is on the person's foot?",szh:"第四題，請看圖片。這個人腳上穿著什麼？",en:"A blue rubber shoe in the water.",zh:"腳上是一隻藍色的橡膠(rubber)雨鞋(shoe)，踩在水裡，水面還有一圈圈波紋，正確。地面全是水，不是乾的；鞋子是藍色雨鞋，不是黑色運動鞋。選 B"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Gas Station</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">60</text><rect x="96" y="83" width="44" height="67" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="78" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="228" y="67" width="44" height="83" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="62" font-size="14" font-weight="700" text-anchor="middle">50</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Mon</text><text x="118" y="167" text-anchor="middle">Tue</text><text x="184" y="167" text-anchor="middle">Wed</text><text x="250" y="167" text-anchor="middle">Thu</text></g></svg>`,o:["Ninety cars bought gasoline.","One hundred cars bought gasoline.","Sixty cars bought gasoline."],a:0,sen:"For question five, look at the picture. This chart shows how many cars came to the gas station each day. On Monday and Wednesday, how many cars bought gasoline?",szh:"第五題，請看圖片。這張圖顯示每天有多少輛車來加油站(gas station)。星期一和星期三，一共有多少輛車買了汽油(gasoline)？",en:"Ninety cars bought gasoline.",zh:"圖中星期一60輛、星期三30輛，加起來90輛。100輛是把星期一和星期二加在一起；60輛只算了星期一，漏掉星期三。選 A"},
{n:6,p:1,o:["My parents give it to me on Sundays.","I spent the whole weekend at home.","I save most of it for the future."],a:2,sen:"How do you spend your pocket money?",szh:"你的零用錢怎麼花？",en:"I save most of it for the future.",zh:"問零用錢怎麼(how)花(spend)，答「大部分存起來留給未來(future)」是在說用法。「爸媽每週日給我」答的是錢從哪來、什麼時候拿；「我整個週末都待在家」只是重複 spend 的另一個意思（度過時間）。選 C"},
{n:7,p:1,o:["Mix it with some juice. It's easier that way.","The doctor's office is on the third floor.","Yes, I can smell the bread from here."],a:0,sen:"This medicine smells terrible.",szh:"這個藥(medicine)聞起來好可怕。",en:"Mix it with some juice. It's easier that way.",zh:"對方抱怨藥(medicine)很難聞(smell)，建議「把它和果汁混在一起(mix)，這樣比較好吞」最自然。「我在這裡就聞得到麵包(bread)」只是重複 smell；「醫生診所在三(third)樓」和藥的味道無關。選 A"},
{n:8,p:1,o:["I took a lot of pictures together.","The third one. It's light and not too expensive.","I'll pay with my credit card."],a:1,sen:"Which camera do you think is the best?",szh:"你覺得哪一台相機(camera)最好(best)？",en:"The third one. It's light and not too expensive.",zh:"問「哪一台」相機(camera)最好(best)，答「第三(third)台，又輕又不會太貴」直接指出是哪一台並說明理由。「我們一起(together)拍了很多照片」答非所問；「我會用信用卡(credit card)付」答的是怎麼付錢。選 B"},
{n:9,p:1,o:["Take that path along the river. You can't miss it.","It's about thirty dollars.","I took the subway this morning."],a:0,sen:"Excuse me, sir. How do I get to the subway station?",szh:"先生(sir)，不好意思，請問地鐵站怎麼走？",en:"Take that path along the river. You can't miss it.",zh:"問地鐵(subway)站怎麼(how)走，答「沿著河邊那條小路(path)走，你不會錯過(miss)的」是在指路。「我今天早上搭了地鐵」只是重複 subway，說的是自己的事；「大約三十元」答的是價錢。選 A"},
{n:10,p:1,o:["Quiet, please. The baby is sleeping.","Really? But you've played for six years!","I'll play the piano for you."],a:1,sen:"I'm going to quit the piano.",szh:"我打算不學(quit)鋼琴了。",en:"Really? But you've played for six years!",zh:"對方說要放棄(quit)鋼琴(piano)，回「真的嗎？你都彈六年了！」表示驚訝和可惜，最自然。「我彈鋼琴給你聽」只是重複 piano；「請安靜，寶寶在睡覺」用和 quit 發音相近的 quiet 當陷阱。選 B"},
{n:11,p:1,o:["It's a kind of game from Germany.","Put it in the box, please.","Rubber, I think. It's soft."],a:2,sen:"What kind of material is this ball made from?",szh:"這顆球是用哪一種(kind)材料(material)做的？",en:"Rubber, I think. It's soft.",zh:"問球是什麼材料(material)做的(from)，答「我想是橡膠(rubber)，它軟軟的」才是材料。「它是德國(Germany)的一種(kind)遊戲」只是重複 kind 和 from；「請把它放進盒子」沒回答問題。選 C"},
{n:12,p:1,o:["Not bad. I only got the rectangle question wrong.","It had plus and minus questions.","I'll do it after dinner."],a:0,sen:"How did you do on the math quiz?",szh:"你數學小考(quiz)考得怎麼樣？",en:"Not bad. I only got the rectangle question wrong.",zh:"問小考(quiz)考得「怎麼樣」，答「還不錯，只錯了長方形(rectangle)那題」是在說結果。「有加(plus)減(minus)的題目」說的是考卷內容，不是考得好不好；「我晚餐後再做」時態不對，問的是已經考完的小考。選 A"},
{n:13,p:1,o:["Let's have the party on the balcony.","Yes, we have a big balcony.","Oh no! Was anybody hurt?"],a:2,sen:"The storm damaged our balcony last night.",szh:"昨晚的暴風雨把我們家陽台(balcony)弄壞(damage)了。",en:"Oh no! Was anybody hurt?",zh:"對方說陽台(balcony)被暴風雨弄壞(damage)，回「糟了！有人受傷嗎？」最自然。「對，我們有個大陽台」只是重複 balcony；陽台都壞了還說「在陽台開派對」，不合理。選 C"},
{n:14,p:1,o:["The mail carrier, about an hour ago.","Put it on the table, please.","Yes, I brought it."],a:0,sen:"Who brought this letter?",szh:"這封信是誰拿來的？",en:"The mail carrier, about an hour ago.",zh:"問「誰」拿信來，答「郵差(mail carrier)，大約一小時前」說出人物。「請放在桌上」答非所問；用 Yes 回答 wh- 問句不對。選 A"},
{n:15,p:1,o:["I'm full, thanks. It was delicious, though.","Yes, it's from the west.","I went to Turkey last year."],a:0,sen:"Would you like some more turkey?",szh:"你要再來點火雞(turkey)嗎？",en:"I'm full, thanks. It was delicious, though.",zh:"對方請你再吃火雞(turkey)，回「我飽了，謝謝，不過真的很好吃(delicious)」是委婉拒絕又稱讚，最自然。「我去年去過土耳其」是 Turkey 同音陷阱；「對，它來自(from)西部(west)」和要不要再吃無關。選 A"},
{n:16,p:2,o:["It is too heavy.","It costs too much.","It is worth the money."],a:2,sen:"W: I want a new pan. This thin metal one is only forty dollars. &nbsp;M: What about that iron one? &nbsp;W: It's one hundred twenty dollars, and it's very heavy. &nbsp;M: My grandmother cooked with an iron pan for fifty years. &nbsp;W: Fifty years? Then I'll take the iron one. &nbsp;Q: What does the man think about the iron pan?",szh:"女：我想買新鍋子。這個薄的金屬(metal)鍋只要四十元。　男：那個鐵(iron)鍋呢？　女：要一百二十元，而且很重。　男：我外婆用鐵鍋煮了五十年。　女：五十年？那我買鐵鍋。　問：男士覺得鐵鍋怎麼樣？",en:"It is worth the money.",zh:"男士沒有談價錢或重量，只說外婆用鐵(iron)鍋煮了五十年，言下之意是又耐用又值得買，所以他覺得它物有所值。「太重」是女士說的缺點，「太貴」是女士提到的價錢，男士都沒有這樣說。選 C"},
{n:17,p:2,o:["A TV show in the living room.","Cooking in the kitchen.","How to spend less money at home."],a:2,sen:"W: This month's energy bill is so high! &nbsp;M: Look at the living room. The TV is on, and nobody is watching it. &nbsp;W: Oh, and I left the lights on in the kitchen, too. &nbsp;M: Let's turn things off when we leave a room. &nbsp;W: Good idea. Then the bill will be lower next month. &nbsp;Q: What are the speakers talking about?",szh:"女：這個月的能源(energy)帳單好高！　男：看看客廳。電視開著，卻沒人在看。　女：喔，而且我也忘了關廚房的燈。　男：離開房間時就把東西關掉吧。　女：好主意。這樣下個月的帳單就會比較低。　問：說話的人在談什麼？",en:"How to spend less money at home.",zh:"兩人看到帳單太高，發現電視和燈沒關，決定離開房間就關掉，好讓下個月的帳單變低，所以是在談怎樣在家裡少花錢(能源 energy 費用)。電視和廚房只是他們發現浪費電的地方，不是談話的主題。選 C"},
{n:18,p:2,o:["Burning some paper.","Cleaning the windows.","Cooking a meal."],a:1,sen:"M: What's that smell? Is something burning? &nbsp;W: No, I'm using vinegar on the windows. &nbsp;M: Vinegar? Not soap? &nbsp;W: It works better, and it's cheap. Look how clean the glass is! &nbsp;Q: What is the woman doing?",szh:"男：那是什麼味道(smell)？有東西燒焦了嗎？　女：沒有，我在用醋(vinegar)擦窗戶。　男：醋？不用肥皂？　女：效果比較好又便宜，你看玻璃多乾淨！　問：女士在做什麼？",en:"Cleaning the windows.",zh:"女士用醋(vinegar)擦窗戶，也就是在清潔窗戶。醋常用來煮菜，但她不是在做飯(meal)；燒東西是男士聞到味道後的猜測，被女士否定了。選 B"},
{n:19,p:2,o:["At the museum.","In a subway station.","On a bus."],a:1,sen:"M: Wow, look at that mass of people! &nbsp;W: It's always like this at six. Remember, the bus is slower, so we take the west line to the museum. &nbsp;M: Is that our train? &nbsp;W: Not yet. Ours comes in three minutes, so stay behind the yellow line. &nbsp;M: OK. Oh, I think I hear it now! &nbsp;Q: Where are the speakers?",szh:"男：哇，你看那一大群(mass)人！　女：六點都是這樣。記得(remember)公車比較慢，所以我們搭西(west)線去博物館。　男：那班是我們的車嗎？　女：還不是。我們的車三分鐘後到，所以站在黃線後面。　男：好。喔，我好像聽到車來了！　問：說話的人在哪裡？",en:"In a subway station.",zh:"他們看到一大群(mass)人、等著搭西線的列車、要站在黃線後面，這些都是在地鐵(subway)站月台上的情形。博物館只是目的地，還沒到；公車是女士說「比較慢」而不搭的交通工具。選 B"},
{n:20,p:2,o:["She's encouraging him.","She's laughing at him.","She's telling him to quit."],a:0,sen:"M: I did badly on the science quiz again. Maybe I should just quit. &nbsp;W: Don't be a fool! You got forty last time and sixty this time. &nbsp;M: Well, that's twenty points better. &nbsp;W: See? Keep going! &nbsp;Q: What is the woman doing?",szh:"男：我自然小考(quiz)又考差了，也許我乾脆放棄(quit)算了。　女：別傻(fool)了！你上次四十分，這次六十分。　男：嗯，進步二十分。　女：看吧？繼續加油！　問：女士在做什麼？",en:"She's encouraging him.",zh:"女士指出他從四十分進步到六十分，要他繼續加油，是在鼓勵(encourage)他。她說「別傻了」不是在嘲笑他，而是勸他不要放棄；叫他放棄(quit)正好相反。選 A"},
{n:21,p:2,o:["Eat lunch first.","See the doctor again.","Take the medicine right away."],a:0,sen:"W: Why do you keep touching your ear? &nbsp;M: It hurts. The doctor gave me some medicine. &nbsp;W: Did you take it yet? &nbsp;M: Not yet. He said to take it after a meal, and I haven't had lunch. &nbsp;Q: What will the man probably do next?",szh:"女：你為什麼一直摸耳朵(ear)？　男：很痛。醫生給了我一些藥(medicine)。　女：你吃了嗎？　男：還沒。醫生說飯(meal)後吃，我還沒吃午餐。　問：男士接下來可能會做什麼？",en:"Eat lunch first.",zh:"藥(medicine)要飯(meal)後吃，他還沒吃午餐，所以接下來要先吃午餐。馬上吃藥不符合醫生的指示；他已經看過醫生了，不需要再去。選 A"},
{n:22,p:2,o:["At four o'clock.","At seven o'clock.","At three-thirty."],a:2,sen:"M: When should I put the turkey in the oven? &nbsp;W: It needs three hours, and dinner is at seven. &nbsp;M: Plus thirty minutes to rest after it comes out, right? &nbsp;W: Right. So don't be late. &nbsp;Q: When should the man put the turkey in the oven?",szh:"男：火雞(turkey)要什麼時候放進烤箱？　女：要烤三小時，晚餐七點開始。　男：再加上(plus)出爐後放三十分鐘，對吧？　女：對，所以別晚了。　問：男士應該幾點把火雞放進烤箱？",en:"At three-thirty.",zh:"七點開飯，往前扣掉出爐後放的三十分鐘是六點半，再扣烤三小時，就是三點半。四點是忘了加(plus)那三十分鐘；七點是晚餐時間。選 C"},
{n:23,p:2,o:["It's too slow.","It's very exciting.","He hasn't started it."],a:1,sen:"W: Did you finish the book about the lost kingdom? &nbsp;M: Almost. I'm at the part where the prince climbs over the fence. &nbsp;W: Do you like it? &nbsp;M: The beginning was slow, but now I can't stop reading. &nbsp;Q: What does the man think of the book now?",szh:"女：那本關於失落王國(kingdom)的書你看完了嗎？　男：快了，我看到王子爬過圍籬(fence)那段。　女：你喜歡嗎？　男：開頭很慢，但現在我停不下來。　問：男士現在覺得這本書怎樣？",en:"It's very exciting.",zh:"「現在停不下來」換句話說就是很精彩。很慢是開頭的感覺，不是現在；他已經快看完了，不是還沒開始。選 B"},
{n:24,p:2,o:["One hundred dollars.","Eighty dollars.","Fifty dollars."],a:2,sen:"M: These guavas are fifty dollars a bag. &nbsp;W: The shop across the street offers two bags for eighty. &nbsp;M: But theirs aren't as sweet as these. &nbsp;W: OK, then let's just get one bag here. &nbsp;Q: How much will they spend?",szh:"男：這些芭樂(guava)一袋五十元。　女：對面那家店提供(offer)兩袋八十元。　男：可是他們的沒有這些甜。　女：好吧，那就在這裡買一袋。　問：他們會花(spend)多少錢？",en:"Fifty dollars.",zh:"最後決定在這家買一袋，五十元。八十元是對面店兩袋的價錢，被男士以不夠甜否定；一百元是把這家買兩袋算進去，但他們只買一袋。選 C"},
{n:25,p:2,o:["Stamps.","Old cameras.","Fixing cars."],a:1,sen:"W: Your dad has a big stamp collection. &nbsp;M: Not just stamps. He also collects old cameras. &nbsp;W: Which does he like best? &nbsp;M: Well, he spends every weekend on his cameras, and he hasn't bought a stamp in years. &nbsp;Q: What does the man's dad like best?",szh:"女：你爸爸有很多郵票收藏(collection)。　男：不只郵票，他也收集舊相機(camera)。　女：他最(best)喜歡哪一個？　男：嗯，他每個週末都花(spend)在相機上，而且好多年沒買郵票了。　問：男士的爸爸最喜歡什麼？",en:"Old cameras.",zh:"週末都花在相機(camera)上、好多年沒買郵票，表示他最喜歡舊相機。郵票是女士以為的，但爸爸已經很久沒買；修車對話沒有提到，他花時間的是相機。選 B"},
{n:26,p:3,pic:true,o:[BARS("Energy at Home",["Heater","Lights","Fridge"],[50,20,80]),BARS("Energy at Home",["Heater","Lights","Fridge"],[80,20,50]),BARS("Energy at Home",["Heater","Lights","Fridge"],[20,80,50])],a:1,sen:"Our science teacher asked us to check how much energy each thing in our home uses. I was sure the lights used the most, because they're on all evening. But when I completed my chart, the numbers proved me wrong. The refrigerator used more than the lights. And in winter, our heater used even more than the refrigerator. &nbsp;Q: Which chart shows the speaker's home in winter?",szh:"自然老師要我們查家裡每樣東西用多少能源(energy)。我原本確定電燈用最多，因為整晚都開著。但我完成(complete)表格後，數字證明(prove)我錯了。冰箱用得比電燈多；冬天時，暖氣又比冰箱用得更多。　問：哪張圖是說話者家裡冬天的情形？",en:"Heater most, fridge second, lights least.",zh:"冰箱比電燈多、暖氣又比冰箱多，所以暖氣最高、冰箱第二、電燈最低。電燈最高的那張是說話者原本的猜測，被數字證明(prove)是錯的；冰箱最高的那張和「暖氣比冰箱用更多」相反。選 B"},
{n:27,p:3,pic:true,o:[PH('q27b'),PH('q27a'),PH('q27c')],a:0,sen:"Last week, a strong wind damaged the old wooden fence in our yard. Dad wanted to build a new metal fence, but it cost too much. So on Saturday, he got out his hammer and fixed the broken parts himself. He wanted to paint the fence white on Sunday, too, but it rained all day. &nbsp;Q: What did Dad do last weekend?",szh:"上週一陣強風把我們院子的舊木頭圍籬(fence)吹壞(damage)了。爸爸想蓋新的金屬(metal)圍籬，但太貴了。所以星期六他拿出鐵鎚(hammer)，自己把壞掉的地方修好。他星期天也想把圍籬漆成白色，但下了一整天雨。　問：爸爸上週末做了什麼？",en:"He fixed the wooden fence with a hammer.",zh:"新的金屬(metal)圍籬太貴沒蓋；星期天想油漆卻下雨沒漆成；真正做了的是星期六用鐵鎚(hammer)修木頭圍籬。選 A"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:2,sen:"My mom used to drive to work every day. Last month, gasoline got so expensive that she decided to save energy and money. She thought about the subway, but the station is far from her office. So she bought a bicycle. Now she rides along the river path to work on a daily basis, and she says she feels healthier, too. &nbsp;Q: How does the speaker's mom go to work now?",szh:"我媽媽以前每天開車上班。上個月汽油(gasoline)變得好貴，她決定要節省能源(energy)和錢。她考慮過搭地鐵(subway)，但車站離她公司很遠。所以她買了一台腳踏車，現在每天(on a daily basis)沿著河邊小路(path)騎車上班，她說自己也變得更健康了。　問：說話者的媽媽現在怎麼上班？",en:"She rides a bicycle.",zh:"開車是以前的方式，因為汽油(gasoline)太貴而放棄；地鐵(subway)只是考慮過，因為車站離公司太遠沒採用；現在是騎腳踏車沿河邊小路(path)上班。選 C"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29c'),PH('q29b')],a:1,sen:"For my best friend's birthday, we planned to sing at KTV together. But when we got there, every room was full. Next, we thought about a movie, but nobody could agree on one. In the end, we went to her favorite restaurant and shared a big turkey dinner. It was delicious, and she said it was her best birthday ever. &nbsp;Q: How did they spend the birthday?",szh:"為了我最好(best)朋友的生日，我們計畫一起(together)去 KTV 唱歌。但到了那裡，每間包廂都客滿。接著我們想去看電影，可是大家選不出要看哪部。最後我們去她最喜歡的餐廳，一起吃了一頓豐盛的火雞(turkey)大餐。非常好吃(delicious)，她說這是她最棒的生日。　問：她們怎麼度過(spend)這個生日？",en:"They had a turkey dinner at a restaurant.",zh:"KTV 因為客滿沒唱成；看電影因為選不出片子也沒去；最後是在餐廳吃火雞(turkey)大餐。前兩個都是沒做成的計畫。選 B"},
{n:30,p:3,pic:true,o:[BARS("Going to School",["Subway","Bicycle","Car"],[50,25,80]),BARS("Going to School",["Subway","Bicycle","Car"],[80,20,45]),BARS("Going to School",["Subway","Bicycle","Car"],[80,45,25])],a:2,sen:"Our teacher asked how we get to school every day. Last year, most of us came by car with our parents. But gasoline costs more now, so many families quit driving to school. This year, the subway is the top choice. And now more students ride bicycles than come by car. &nbsp;Q: Which chart shows this year's answers?",szh:"老師問我們每天怎麼(how)來上學。去年我們大部分人是爸媽開車送來的。但現在汽油(gasoline)變貴了，所以很多家庭不再(quit)開車送小孩上學。今年第一名是搭捷運(subway)，而且現在騎腳踏車的學生比坐車來的多。　問：哪張圖是今年的答案？",en:"Subway most, bike second, car fewest.",zh:"今年捷運(subway)第一，騎腳踏車的又比坐車的多，所以捷運最高、腳踏車第二、汽車最低。汽車最高的那張是去年的情形，後來因為汽油(gasoline)變貴很多家庭不再(quit)開車；捷運最高但汽車第二的那張，和「腳踏車比坐車多」相反。選 C"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 35 回　材料與能源　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
