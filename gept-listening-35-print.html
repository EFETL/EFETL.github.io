<script>
/* 圖形素材（第35回 材料與能源） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/35/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const HAMMER=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q1.jpg" alt="question 1 picture">`;
const GASPUMP=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q2.jpg" alt="question 2 picture">`;
const PIANO=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q3.jpg" alt="question 3 picture">`;
const SHOE=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q4.jpg" alt="question 4 picture">`;
const SUBWAY=`<img class="pic-img p0img" src="gept-listening-img/35/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:HAMMER,o:["A saw with a wooden handle.","A brush with a wooden handle.","A hammer with a wooden handle."],a:2,sen:"For question one, look at the picture. What tool is this?",szh:"第一題，請看圖片。這是什麼工具？",en:"A hammer with a wooden handle.",zh:"這個工具是鎚子(hammer)，選 C。鋸子和刷子的樣子都不同。"},
{n:2,p:0,fig:GASPUMP,o:["Gasoline from the gas station.","Clean water from the river.","Wood from the forest."],a:0,sen:"For question two, look at the picture. What gives cars power?",szh:"第二題，請看圖片。什麼給汽車動力？",en:"Gasoline from the gas station.",zh:"給汽車動力的是加油站(gas)的汽油(gasoline)，選 A。河水和木頭都不能讓車子跑。"},
{n:3,p:0,fig:PIANO,o:["A piano in the living room.","A drum in the living room.","A guitar in the living room."],a:0,sen:"For question three, look at the picture. What makes music?",szh:"第三題，請看圖片。什麼發出音樂？",en:"A piano in the living room.",zh:"發出音樂的是鋼琴(piano)，選 A。鼓和吉他都不是圖中的樂器。"},
{n:4,p:0,fig:SHOE,o:["A red rubber shoe.","A blue rubber shoe.","A green rubber shoe."],a:1,sen:"For question four, look at the picture. What is on his foot?",szh:"第四題，請看圖片。他腳上是什麼？",en:"A blue rubber shoe.",zh:"他腳上是藍色的橡膠(rubber)鞋(shoe)，選 B。紅色和綠色的鞋顏色不對。"},
{n:5,p:0,fig:SUBWAY,o:["They ride their bikes to work.","They take the bus to work.","They take the subway to work."],a:2,sen:"For question five, look at the picture. How do many people travel?",szh:"第五題，請看圖片。許多人怎麼移動？",en:"They take the subway to work.",zh:"許多人搭地鐵(subway)上班，選 C。腳踏車和公車都不是圖中的交通工具。"},

{n:6,p:1,o:["On the first of every month.","I spend half and save half.","It comes from my part-time job."],a:1,sen:"How do you use your monthly money?",szh:"你每月的錢怎麼用？",en:"I spend half and save half.",zh:"問錢怎麼用，答『我花(spend)一半、存一半』，選 B。A 回答時間，C 回答錢的來源(from)。"},
{n:7,p:1,o:["We're doing our best together.","How about a game on Friday?","Our coach's name is Mr. Lin."],a:0,sen:"How is your team doing this year?",szh:"你們隊今年表現如何？",en:"We're doing our best together.",zh:"問隊伍表現，答『我們一起(together)盡力(best)』，選 A。B 是邀請(How about)，C 只說教練的名字。"},
{n:8,p:1,o:["The third camera is the best.","Don't fool yourself. It's too expensive.","They don't offer a discount."],a:0,sen:"Which camera should I buy on sale?",szh:"特價時我該買哪台相機？",en:"The third camera is the best.",zh:"問該買哪台相機(camera)，答『第三(third)台最好』，選 A。B 勸人別自欺(fool)，C 說沒有優惠(offer)，都沒選出相機。"},
{n:9,p:1,o:["It has two bedrooms and a balcony.","Around six, after I get off work.","Take the path behind the park."],a:2,sen:"How do I reach your apartment?",szh:"我要怎麼到你的公寓？",en:"Take the path behind the park.",zh:"問怎麼到公寓，答『走公園後面的小路(path)』，選 C。A 描述公寓(balcony)，B 回答時間。"},
{n:10,p:1,o:["A delicious meal. Everyone smiled.","It was for twelve people.","Remember to wash the dishes."],a:0,sen:"How was the big dinner you cooked?",szh:"你煮的大餐如何？",en:"A delicious meal. Everyone smiled.",zh:"問晚餐如何，答『美味(delicious)的一餐(meal)，大家都笑了』，選 A。B 回答人數，C 提醒洗碗(remember)。"},
{n:11,p:1,o:["The storm did serious damage.","They're guava trees, I think.","We picked them last summer."],a:0,sen:"What happened to the fruit trees?",szh:"果樹發生了什麼事？",en:"The storm did serious damage.",zh:"問果樹怎麼了，答『暴風雨造成嚴重的損害(damage)』，選 A。B 說是什麼樹(guava)，C 說去年夏天採果。"},
{n:12,p:1,o:["It had plus and minus problems.","We drew a rectangle in class.","You did well on that hard quiz."],a:2,sen:"How did I do on the math test?",szh:"我的數學測驗考得如何？",en:"You did well on that hard quiz.",zh:"問考得如何，答『你那場很難的小考(quiz)考得不錯』，選 C。A 說題目有加(plus)減(minus)，B 說畫長方形(rectangle)，都沒說成績。"},
{n:13,p:1,o:["My brother collects coins too.","No, don't quit your collection.","The post office is closed."],a:1,sen:"Should I stop collecting stamps?",szh:"我該停止收集郵票嗎？",en:"No, don't quit your collection.",zh:"問是否停止收集，答『不，別放棄(quit)你的收藏(collection)』，選 B。A 說哥哥，C 說郵局沒開。"},
{n:14,p:1,o:["I bought vinegar and some eggs.","At six, right after work.","By the fence in the yard."],a:2,sen:"Where did you leave the grocery bag?",szh:"你把買菜的袋子放哪了？",en:"By the fence in the yard.",zh:"問袋子放哪，答『在院子的籬笆(fence)旁』，選 C。A 說買了醋(vinegar)，B 回答時間。"},
{n:15,p:1,o:["It's Mom's birthday next week.","Yes, we sang at KTV together.","I paid by credit card."],a:1,sen:"Did you have fun at the birthday party?",szh:"生日派對你玩得開心嗎？",en:"Yes, we sang at KTV together.",zh:"問派對開不開心，答『開心，我們一起(together)去 KTV 唱歌』，選 B。A 說生日日期，C 說付款方式(credit card)。"},

{n:16,p:2,o:["Wood.","Glass.","Iron."],a:2,sen:"W: What material is this chair made from? &nbsp;M: It's very heavy and cold. Look, a small magnet sticks to the leg. &nbsp;W: I see. Thank you very much. &nbsp;Q: What is the chair made of?",szh:"女：這張椅子是用什麼材料(material)做的？　男：它又重又冰。你看，一小塊磁鐵吸在椅腳上。　女：我懂了。非常謝謝。　問：椅子是用什麼做的？",en:"Iron.",zh:"又重又冷、磁鐵會吸住，所以是鐵(iron)，選 C。木頭和玻璃都不會吸住磁鐵。"},
{n:17,p:2,o:["Pay a fine.","Move his car.","Call the police."],a:1,sen:"W: Excuse me, sir. You can't park here. &nbsp;M: Oh, I didn't see the sign. I'm sorry. &nbsp;W: It's all right, but please hurry. &nbsp;M: Okay. I'll go now. &nbsp;Q: What will the man do?",szh:"女：先生(sir)，不好意思，這裡不能停車。　男：喔，我沒看到標誌。對不起。　女：沒關係，但請快一點。　男：好，我馬上走。　問：男士會做什麼？",en:"Move his car.",zh:"這裡不能停車、他說馬上走，就是把車開走，選 B。罰款是可能的後果，但女士沒要他付錢。"},
{n:18,p:2,o:["It got cold.","It burned.","It was too salty."],a:1,sen:"W: Mom, there's a strange smell in the kitchen. &nbsp;M: Oh no! I forgot the fish on the stove. &nbsp;W: Quick! Turn it off! &nbsp;Q: What happened to the fish?",szh:"女：媽，廚房有股怪味(smell)。　男：糟了！我忘了爐子上的魚。　女：快！把火關掉！　問：魚怎麼了？",en:"It burned.",zh:"有怪味、忘了爐上的魚，要趕快關火，推斷魚燒焦了，選 B。魚變冷或太鹹都不會要趕快關火。"},
{n:19,p:2,o:["On a subway train.","On a school bus.","In a library."],a:0,sen:"W: What did you say? I can't hear you over the noise. &nbsp;M: Sorry! The train is so loud. Let's talk after we get off at the next station. &nbsp;W: Okay. &nbsp;Q: Where are they?",szh:"女：你說什麼？吵得我聽不到。　男：抱歉！火車好吵。我們到下一站下車再聊。　女：好。　問：他們在哪裡？",en:"On a subway train.",zh:"吵鬧的火車、下一站下車，推斷在地鐵(subway)上，選 A。校車不會有車站，圖書館也不吵。"},
{n:20,p:2,o:["She laughs at Tom.","She teaches Tom math.","She encourages Tom."],a:2,sen:"M: I want to be a doctor in the future, but my math is bad. &nbsp;W: Don't give up, Tom. I believe you can do it. &nbsp;M: Thanks. That makes me feel better. &nbsp;Q: What does the woman do?",szh:"男：我未來(future)想當醫生，可是我的數學很差。　女：別放棄，湯姆。我相信你做得到。　男：謝謝。這讓我好過多了。　問：女士做了什麼？",en:"She encourages Tom.",zh:"她說別放棄、相信他做得到，這是鼓勵(encourage)，選 C。她沒有取笑，也沒有教數學。"},
{n:21,p:2,o:["Some candy.","Some medicine.","Some juice."],a:1,sen:"W: Why is your ear red, Jack? &nbsp;M: It hurts a lot. The doctor gave me some pills and said to take them after meals. &nbsp;W: Then don't forget them! &nbsp;Q: What did the doctor give Jack?",szh:"女：傑克，你的耳朵(ear)為什麼紅紅的？　男：很痛。醫生給我一些藥丸，說飯後要吃。　女：那別忘了吃！　問：醫生給了傑克什麼？",en:"Some medicine.",zh:"醫生給的藥丸要飯後吃，就是藥(medicine)，選 B。糖果和果汁不會由醫生開、也不用飯後吃。"},
{n:22,p:2,o:["A fish.","A turkey.","A chicken."],a:1,sen:"W: What are you cooking for Thanksgiving dinner? &nbsp;M: A big bird. It's the traditional food, and it takes four hours in the oven. &nbsp;W: It smells great already. &nbsp;Q: What is the man cooking?",szh:"女：感恩節晚餐你在煮什麼？　男：一隻大鳥。這是傳統食物，要在烤箱裡烤四個小時。　女：已經聞起來很香了。　問：男士在煮什麼？",en:"A turkey.",zh:"感恩節傳統的大鳥是火雞(turkey)，選 B。雞(chicken)也是鳥，但不是感恩節的傳統食物。"},
{n:23,p:2,o:["A quiet farm behind the fence.","A tiny village behind the fence.","A magic kingdom behind the fence."],a:2,sen:"M: What is that place in the story? &nbsp;W: A magic kingdom hidden behind the tall fence. &nbsp;M: Sounds exciting. &nbsp;Q: What place is in the story?",szh:"男：故事裡那個地方是什麼？　女：一個藏在高籬笆(fence)後的魔法王國(kingdom)。　男：聽起來刺激。　問：故事裡是什麼地方？",en:"A kingdom behind the fence.",zh:"是籬笆(fence)後的魔法王國(kingdom)，選 C。農場和小村莊都不是故事裡的地方。"},
{n:24,p:2,o:["Sing at KTV together with friends.","Sleep at home all day.","Study alone at the library."],a:0,sen:"M: What will you do to celebrate? &nbsp;W: Sing at KTV together with all my friends. &nbsp;M: Sounds fun. &nbsp;Q: How will the woman celebrate?",szh:"男：你要怎麼慶祝？　女：和所有朋友一起(together)去 KTV 唱歌。　男：聽起來很好玩。　問：女士要怎麼慶祝？",en:"Sing at KTV together.",zh:"和朋友一起(together)去 KTV 唱歌，選 A。睡覺和獨自念書都不是她要做的事。"},
{n:25,p:2,o:["A mail carrier from the west.","A police officer from the east.","A bus driver from downtown."],a:0,sen:"W: Who brings the letters every day? &nbsp;M: A friendly mail carrier from the west part of town. &nbsp;W: He is always on time. &nbsp;Q: Who brings the letters?",szh:"女：每天是誰送信？　男：一位來自城西(west)、友善的郵差(mail carrier)。　女：他總是準時。　問：誰送信？",en:"A mail carrier from the west.",zh:"送信的是城西(west)的郵差(mail carrier)，選 A。警察和公車司機都不送信。"},

{n:26,p:3,pic:true,o:[BARS("Energy Use",["Home","Cars","Shops"],[20,50,80]),BARS("Energy Use",["Home","Cars","Shops"],[50,80,20]),BARS("Energy Use",["Home","Cars","Shops"],[80,50,20])],a:2,sen:"Our town studied where energy is used. Homes use the most energy, for cooking and lights. Cars, which burn gasoline, are in the middle, and shops use the least. The mayor said the study is complete, and the numbers prove it. So the home bar should be the tallest. &nbsp;Q: Which chart shows the energy use?",szh:"我們鎮研究能量(energy)用在哪。家庭最多，用於煮飯和照明；燒汽油(gasoline)的汽車中等；商店最少。鎮長說研究已完成(complete)，數字也證明(prove)了這一點。所以家庭長條最高。　問：哪張圖顯示能源使用？",en:"Home most, shops least.",zh:"家庭最多、商店最少，家庭長條最高，選 C。"},
{n:27,p:3,pic:true,o:[BARS("Gas Price",["Jan","Feb","Mar"],[30,55,80]),BARS("Gas Price",["Jan","Feb","Mar"],[55,80,30]),BARS("Gas Price",["Jan","Feb","Mar"],[80,55,30])],a:2,sen:"The station recorded the gasoline price over three months. In January it was the highest, so few drivers filled up. In February it was in the middle, and by March the lowest. The station changed the price on a weekly basis, so drivers did not want to miss the low price. So the gas price went down each month. &nbsp;Q: Which chart shows the gas price?",szh:"加油站記錄三個月的汽油(gasoline)價格。一月最高，所以少有駕駛加油；二月中等；到三月最低。加油站每週調整(basis)價格，所以駕駛不想錯過(miss)低價。所以油價逐月下降。　問：哪張圖顯示油價？",en:"Jan highest, Mar lowest.",zh:"一月最高、三月最低、逐月下降，選 C。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('bread'),IMG('noodles')],a:1,sen:"When the gas ran out at our cabin, we could not cook a hot meal. Outside, a mass of dark clouds covered the sky. There was no energy to boil noodles or steam rice on the electric stove. So we ate fresh bread instead, and Dad kindly mixed a cold drink for us. It was still a delicious, simple meal by candlelight. &nbsp;Q: What did they eat when the gas ran out?",szh:"小屋裡瓦斯(gas)用完時，我們沒法煮熱餐(meal)。外面一大片(mass)烏雲蓋住天空。沒有能量(energy)在電爐上煮麵或蒸飯。所以我們改吃新鮮麵包(bread)，爸爸好心(kind)調了冷飲(mix)給我們。在燭光下仍是一頓美味(delicious)簡單的餐。　問：瓦斯用完時他們吃什麼？",en:"Fresh bread.",zh:"瓦斯沒了他們吃麵包(bread)，選 B。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:1,sen:"After a whole day fixing the metal fence with a hammer, the workers were tired and hungry. They did not want dry bread or plain rice after such hard work. So the boss, a man with a long beard, ordered a big bowl of hot noodles for everyone, and they enjoyed the delicious meal together. &nbsp;Q: What did the workers eat after the hard day?",szh:"用鎚子(hammer)修了一整天金屬(metal)籬笆(fence)後，工人們又累又餓。這麼辛苦後他們不想吃乾麵包或白飯。所以留著長鬍子(beard)的老闆為大家點了一大碗熱麵(noodle)，他們一起(together)享用美味(delicious)的餐。　問：辛苦一天後工人吃什麼？",en:"A bowl of noodles.",zh:"工人吃了熱麵(noodle)，選 B。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('beach'),IMG('park'),IMG('mountain')],a:0,sen:"For our energy-saving trip, we did not want to spend gasoline on a long drive. Some liked the far mountain and others liked the park. But we chose the nearby beach, because we could take the subway there and enjoy the sea using very little energy. My cousin from Germany came along. &nbsp;Q: Where did they go for the energy-saving trip?",szh:"為了省能源之旅，我們不想在長途開車上花(spend)汽油(gasoline)。有些人喜歡遠處的山，有些人喜歡公園，但我們選了近的海邊(beach)，因為可以搭地鐵(subway)去，用很少的能量(energy)享受大海。我來自德國(Germany)的表哥也一起來。　問：省能源之旅他們去哪？",en:"The beach.",zh:"省能源之旅去海邊(beach)，選 A。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 35 回　材料與能源　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}

  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。

  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));

  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}

  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */

  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}

  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;

    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
