<script>
/* 圖形素材（第34回 田野與環境） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/34/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const FARM=`<img class="pic-img p0img" src="gept-listening-img/34/p0_q1.jpg" alt="question 1 picture">`;
const SHEEP=`<img class="pic-img p0img" src="gept-listening-img/34/p0_q2.jpg" alt="question 2 picture">`;
const PIG=`<img class="pic-img p0img" src="gept-listening-img/34/p0_q3.jpg" alt="question 3 picture">`;
const POND=`<img class="pic-img p0img" src="gept-listening-img/34/p0_q4.jpg" alt="question 4 picture">`;
const RECYCLE=`<img class="pic-img p0img" src="gept-listening-img/34/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:FARM,o:["A school near a quiet village.","A farm near a quiet village.","A factory near a quiet village."],a:1,sen:"For question one, look at the picture. What place is this?",szh:"第一題，請看圖片。這是什麼地方？",en:"A farm near a quiet village.",zh:"這是安靜村莊旁的農場(farm)，選 B。學校和工廠都不是圖中的地方。"},
{n:2,p:0,fig:SHEEP,o:["Sheep are eating grass in the field.","Horses are eating grass in the field.","Goats are eating grass in the field."],a:0,sen:"For question two, look at the picture. What animals graze here?",szh:"第二題，請看圖片。這裡是什麼動物在吃草？",en:"Sheep are eating grass in the field.",zh:"在田裡吃草的是綿羊(sheep)，選 A。馬和山羊都不是圖中的動物。"},
{n:3,p:0,fig:PIG,o:["A pig is playing in the mud.","A duck is playing in the mud.","A dog is playing in the mud."],a:0,sen:"For question three, look at the picture. What animal is in the mud?",szh:"第三題，請看圖片。泥裡是什麼動物？",en:"A pig is playing in the mud.",zh:"泥裡的動物是豬(pig)，選 A。鴨子和狗都不是圖中的動物。"},
{n:4,p:0,fig:POND,o:["A duck and a frog live by the pond.","A turtle and a snail live by the pond.","A cat and a mouse live by the pond."],a:1,sen:"For question four, look at the picture. What lives by the water?",szh:"第四題，請看圖片。水邊住著什麼？",en:"A turtle and a snail live by the pond.",zh:"池塘(pond)邊住的是烏龜(turtle)和蝸牛(snail)，選 B。鴨與青蛙、貓與老鼠都不是圖中的動物。"},
{n:5,p:0,fig:RECYCLE,o:["We throw it into the river.","We recycle it at the center.","We burn it behind the school."],a:1,sen:"For question five, look at the picture. What do we do with waste?",szh:"第五題，請看圖片。垃圾我們怎麼處理？",en:"We recycle it at the center.",zh:"垃圾要拿去回收(recycle)，選 B。丟進河裡和燒掉都會造成污染，也不是圖中做的事。"},

{n:6,p:1,o:["Yes, you must keep the ticket.","It's next to the bus stop.","It cost nine dollars, I think."],a:0,sen:"Do I need to save this bus ticket?",szh:"這張公車票我需要留著嗎？",en:"Yes, you must keep the ticket.",zh:"問票要不要留著，答『是的，你必須(must)留(keep)著這張票(ticket)』，選 A。B 回答位置(next)，C 回答價錢(nine)。"},
{n:7,p:1,o:["Really, I took a bath at six.","I'm sure it will rain today.","There's no towel in the bathroom."],a:0,sen:"Are you sure you washed today?",szh:"你確定今天洗過澡了嗎？",en:"Really, I took a bath at six.",zh:"問是否洗過澡，答『真的(really)，我六點洗過澡(bath)了』，選 A。A 只重複 sure 和 today 談天氣，C 說浴室沒毛巾。"},
{n:8,p:1,o:["Next Monday, after science class.","My science teacher is Mr. Lin.","It's on the shelf, I think."],a:2,sen:"Where did you put my science book?",szh:"你把我的自然課本放哪了？",en:"It's on the shelf, I think.",zh:"問書放哪，答『我想在架子上』，選 C。A 回答時間(next)，B 只重複 science。"},
{n:9,p:1,o:["Last Sunday, at around nine o'clock.","Someone saw it by the pond.","He's a very small brown dog."],a:1,sen:"How did you find the lost dog?",szh:"你怎麼找到走失的狗？",en:"Someone saw it by the pond.",zh:"問怎麼找到狗，答『有人在池塘(pond)邊看到牠』，選 B。A 回答時間，C 描述狗的樣子。"},
{n:10,p:1,o:["Around nine in the evening.","On the floor, by your foot.","It's a wax candle, I think."],a:1,sen:"Where did the wax stop dripping?",szh:"蠟在哪裡停止滴落？",en:"On the floor, by your foot.",zh:"問蠟滴在哪，答『在地板上，你的腳(foot)旁邊』，選 B。A 回答時間(nine)，C 只重複 wax，說是蠟燭(candle)。"},
{n:11,p:1,o:["My classmate was absent today.","The lesson is in room nine.","We must not pollute the water."],a:2,sen:"What is the key point of the water lesson?",szh:"水的這堂課重點是什麼？",en:"We must not pollute the water.",zh:"問重點，答『我們不可以污染(pollute)水』，選 C。A 說同學(classmate)缺席，B 回答教室。"},
{n:12,p:1,o:["It's on Friday at nine.","A free swimsuit and a towel.","Sixty students joined this year."],a:1,sen:"What comes with the swimming class?",szh:"游泳課附贈什麼？",en:"A free swimsuit and a towel.",zh:"問游泳課附什麼，答『免費的泳衣(swimsuit)和毛巾』，選 B。A 回答時間，C 回答人數(sixty)。"},
{n:13,p:1,o:["It's about sixty miles long.","We had a picnic there once.","Many animals live in it."],a:2,sen:"Why should we protect this river?",szh:"我們為什麼要保護這條河？",en:"Many animals live in it.",zh:"問為何要保護河，答『很多動物住(live)在裡面』，選 C。A 回答長度，B 說野餐。"},
{n:14,p:1,o:["We should be aware of pollution.","It was written in Korean.","The title is very long."],a:0,sen:"What is the message of the new book?",szh:"這本新書的訊息是什麼？",en:"We should be aware of pollution.",zh:"問書的訊息，答『我們應該注意(aware)污染(pollution)』，選 A。B 說書的語言(Korean)，C 說書名(title)。"},
{n:15,p:1,o:["They are on the right-hand side.","Nine bins, and sixty students joined.","We recycle them every Friday."],a:1,sen:"How many recycling bins are there, and who joined?",szh:"有幾個回收桶，誰參加了？",en:"Nine bins, and sixty students joined.",zh:"問幾個桶、誰參加，答『九(nine)個桶，六十(sixty)位學生參加』，選 B。A 回答位置(right-hand)，C 回答頻率。"},

{n:16,p:2,o:["In a city office.","At a fish market.","On a farm, raising pigs."],a:2,sen:"W: Where does your uncle work? &nbsp;M: On a farm, raising pigs and sheep. &nbsp;W: Hard work. &nbsp;Q: Where does the uncle work?",szh:"女：你叔叔在哪工作？　男：在農場(farm)，養豬(pig)和羊。　女：辛苦。　問：叔叔在哪工作？",en:"On a farm raising pigs.",zh:"叔叔在農場(farm)養豬(pig)，選 C。辦公室和魚市場都不是他工作的地方。"},
{n:17,p:2,o:["Recycle them into new ones.","Burn them in the yard.","Throw them in the river."],a:0,sen:"M: What should we do with these old bottles? &nbsp;W: Recycle the trash into new bottles. &nbsp;M: Good for the earth. &nbsp;Q: What should they do with the bottles?",szh:"男：這些舊瓶子該怎麼辦？　女：把垃圾(trash)回收(recycle)成新瓶子。　男：對地球好。　問：他們該怎麼處理瓶子？",en:"Recycle the trash.",zh:"把瓶子回收(recycle)成新瓶子，選 A。燒掉和丟河裡都會造成污染。"},
{n:18,p:2,o:["Clean, with sheep around.","Crowded, with many cars.","Dirty, with factories nearby."],a:0,sen:"W: What is the countryside like there? &nbsp;M: Clean, with sheep and a healthy environment. &nbsp;W: Sounds lovely. &nbsp;Q: What is the countryside like?",szh:"女：那裡的鄉間如何？　男：很乾淨，有綿羊(sheep)和健康的環境(environment)。　女：聽起來很美。　問：那裡的鄉間如何？",en:"Clean, with sheep.",zh:"那裡乾淨、有綿羊(sheep)，選 A。擁擠和骯髒都與對話不符。"},
{n:19,p:2,o:["A snail on a leaf.","A fish in the pond.","A turtle in the pond."],a:2,sen:"M: What did you see near the water? &nbsp;W: A slow turtle resting in the pond. &nbsp;M: How cute. &nbsp;Q: What did the woman see?",szh:"男：水邊你看到什麼？　女：一隻慢吞吞的烏龜(turtle)在池塘(pond)裡休息。　男：好可愛。　問：女士看到什麼？",en:"A turtle in the pond.",zh:"女士看到池塘(pond)裡的烏龜(turtle)，選 C。蝸牛(snail)和魚都不是她看到的。"},
{n:20,p:2,o:["For money.","For a school project.","For future children."],a:2,sen:"W: Why do you pick up litter in the park every Sunday? &nbsp;M: I want the next generation to have a clean place to play. &nbsp;W: That's kind of you. &nbsp;Q: Why does the man pick up litter?",szh:"女：你為什麼每個星期天都在公園撿垃圾？　男：我希望下一代(generation)有乾淨的地方玩。　女：你真好心。　問：男士為什麼撿垃圾？",en:"For future children.",zh:"希望下一代(generation)有乾淨的地方玩，就是為了未來的孩子，選 C。賺錢和學校作業都沒有被提到。"},
{n:21,p:2,o:["A bus driver.","A station officer.","A flight attendant."],a:1,sen:"W: I lost my ticket, and the train leaves soon. What should I do? &nbsp;M: Don't worry. The man in the uniform at the gate can confirm your seat. &nbsp;W: Thank you so much. &nbsp;Q: Who will help the woman?",szh:"女：我的票弄丟了，火車快開了。我該怎麼辦？　男：別擔心。門口穿制服的那位先生可以確認(confirm)你的座位。　女：真謝謝你。　問：誰會幫助女士？",en:"A station officer.",zh:"門口穿制服、能確認座位的人是車站的人員(officer)，選 B。公車司機和空服員都不在火車站的門口。"},
{n:22,p:2,o:["To the library.","To a bookstore.","To the gym."],a:0,sen:"W: Ben, why are you carrying so many books? &nbsp;M: I'm taking them back. The reading room there is quiet, so I will also do my homework. &nbsp;W: Good idea. &nbsp;Q: Where is Ben going?",szh:"女：班，你為什麼抱著這麼多書？　男：我要把它們還回去。那裡的閱讀室很安靜，所以我也會在那裡做(do)功課。　女：好主意。　問：班要去哪裡？",en:"To the library.",zh:"還書又有安靜的閱讀室，是圖書館(library)，選 A。書店不用還書，體育館也沒有閱讀室。"},
{n:23,p:2,o:["A sun hat for the trip.","A warm coat for winter.","A swimsuit for the pond."],a:2,sen:"M: What should I pack for the trip to the lake? &nbsp;W: A swimsuit, so you can swim in the pond. &nbsp;M: Great idea. &nbsp;Q: What should the man pack?",szh:"男：去湖邊我該打包什麼？　女：一件泳衣(swimsuit)，這樣你能在池塘(pond)游泳。　男：好主意。　問：男士該打包什麼？",en:"A swimsuit for the pond.",zh:"要打包泳衣(swimsuit)去池塘(pond)游泳，選 C。太陽帽和外套不是女士說的東西。"},
{n:24,p:2,o:["From Korea.","From Japan.","From China."],a:0,sen:"M: Who is the new boy sitting next to you? &nbsp;W: His name is Min. He came from Seoul last week. &nbsp;M: Is it hard for him? &nbsp;W: A little. It's a new experience for him. &nbsp;Q: Where is Min from?",szh:"男：坐你旁邊的新男生是誰？　女：他叫敏。他上週從首爾來的。　男：對他來說很辛苦(hard)嗎？　女：有一點。這對他是新的經驗(experience)。　問：敏來自哪裡？",en:"From Korea.",zh:"首爾(Seoul)是韓國的首都，所以敏來自韓國，選 A。日本和中國都不是首爾所在的國家。"},
{n:25,p:2,o:["The pipe is broken.","The tap is dirty.","The pipe is frozen."],a:2,sen:"W: Why is there no water from the tap? &nbsp;M: It's really cold. It's zero degrees outside, and water can't flow in the pipe. &nbsp;W: Oh! Let's warm it with a hot towel. &nbsp;Q: Why is there no water?",szh:"女：水龍頭為什麼沒水？　男：天氣真的(really)很冷。外面零(zero)度，水在水管裡沒辦法流動(flow)。　女：喔！我們用熱毛巾溫一下。　問：為什麼沒有水？",en:"The pipe is frozen.",zh:"零度、水不能流動、要用熱毛巾溫，推斷水管結冰了，選 C。水管壞掉或水龍頭髒都不會需要加熱。"},

{n:26,p:3,pic:true,o:[BARS("Recycled",["Paper","Glass","Metal"],[20,50,80]),BARS("Recycled",["Paper","Glass","Metal"],[80,50,20]),BARS("Recycled",["Paper","Glass","Metal"],[50,80,20])],a:1,sen:"Our school counted what we recycle each week. We recycle the most paper, because we use it every day, except on weekends. Even tiny scraps go into the white bin. Glass is in the middle, and metal cans are the least. So the paper bar should be the tallest. &nbsp;Q: Which chart shows what we recycle?",szh:"我們學校統計每週回收(recycle)的東西。紙最多，因為每天都用，週末除外(except)。連小小(tiny)的紙屑也丟進白色(white)的箱子。玻璃中等；金屬罐最少。所以紙的長條最高。　問：哪張圖顯示回收物？",en:"Paper most, metal least.",zh:"紙最多、玻璃中等、金屬罐最少，紙的長條最高，選 B。"},
{n:27,p:3,pic:true,o:[BARS("River Trash",["2021","2022","2023"],[55,80,30]),BARS("River Trash",["2021","2022","2023"],[30,55,80]),BARS("River Trash",["2021","2022","2023"],[80,55,30])],a:2,sen:"The town measured the trash in the river each year. In 2021 there was the most garbage and pollution, and trash covered the water surface. Then people started to recycle, so in 2022 it was in the middle, and by 2023 the least. The mayor emphasized that dirty water can poison fish. So the river trash went down each year. &nbsp;Q: Which chart shows the river trash?",szh:"小鎮每年量河裡的垃圾(trash)。2021 年垃圾(garbage)和污染(pollution)最多，垃圾蓋住水面(surface)；後來大家開始回收(recycle)，2022 年中等；到 2023 年最少。鎮長強調(emphasize)髒水會毒(poison)死魚。所以河裡垃圾逐年下降。　問：哪張圖顯示河裡的垃圾？",en:"2021 most, 2023 least.",zh:"2021 最多、2023 最少、逐年下降，選 C。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('bread'),IMG('noodles')],a:1,sen:"When our class visited the farm to learn about the environment, we stayed all morning. We could watch tiny yellow chicks running everywhere. There was no kitchen there to boil noodles or steam rice for so many students. So the farmer gave everyone fresh bread that he baked himself, and we ate it beside the pig pen. &nbsp;Q: What did the students eat at the farm?",szh:"我們班去農場(farm)學習環境(environment)時待了整個上午。我們能看(watch)到小小(tiny)的黃色(yellow)小雞到處(everywhere)跑。那裡沒有廚房為這麼多學生煮麵或蒸飯。所以農夫給大家他自己烤的新鮮麵包(bread)，我們在豬(pig)圈旁吃。　問：學生在農場吃什麼？",en:"Fresh bread.",zh:"學生吃麵包(bread)，選 B。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('noodles'),IMG('rice'),IMG('bread')],a:0,sen:"After a whole day cleaning up trash by the pond, the volunteers were cold and tired. The group included students and teachers, and everyone had a dirty face. They did not want dry bread or cold rice after such hard work for the environment. So a kind grandmother cooked them a big bowl of hot noodles, and everyone felt their energy recover. &nbsp;Q: What did the grandmother cook?",szh:"在池塘(pond)邊清了一整天垃圾(trash)後，志工們又冷又累。這群人包括(include)學生和老師，每個人的臉(face)都髒髒的。為環境(environment)這麼辛苦後，他們不想吃乾麵包或冷飯。所以一位好心的奶奶為他們煮了一大碗熱麵(noodle)，大家都覺得體力恢復(recover)了。　問：奶奶煮了什麼？",en:"A bowl of noodles.",zh:"奶奶煮了熱麵(noodle)，選 A。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('park'),IMG('beach')],a:2,sen:"Our environment club planned a clean-up trip. Some liked the mountain and others liked the park. But we chose the beach, because there was the most garbage to recycle there, and we could keep the coast clean while we enjoyed the sea. We gained a clean beach, and the sea gave us a feeling of freedom. &nbsp;Q: Where did the club go for their clean-up trip?",szh:"我們環境(environment)社計畫一趟淨灘活動。有些人喜歡山，有些人喜歡公園，但我們選了海邊(beach)，因為那裡最多垃圾(garbage)要回收(recycle)，我們能在享受大海的同時保持海岸乾淨。我們得到(gain)一片乾淨的海灘，大海也給我們自由(freedom)的感覺。　問：社團去哪裡淨灘？",en:"The beach.",zh:"社團去海邊(beach)淨灘，選 C。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 34 回　田野與環境　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
