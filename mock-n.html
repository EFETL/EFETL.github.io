<style>
  :root{
    --blue:#2b8cff; --blue-dark:#1f6fe0;
    --coral:#ff7a59; --amber:#ffb02e; --pink:#ff5d8f;
    --bg:#f3f9ff; --card:#ffffff; --line:#e3edf9;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#f0f7ff,#fff7f2 70%);color:#22303f;line-height:1.6;
    font-size:16px;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5ec6ff,#7d8bff 55%,#b88bff);color:#fff;
    border-radius:18px;padding:24px 22px;margin-bottom:16px;box-shadow:0 8px 22px rgba(93,141,255,.3);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:.92rem;opacity:.95;}
  .meta{margin-top:14px;font-size:.86rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#f0f7ff 70%,rgba(240,247,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.9rem;
    box-shadow:0 4px 12px rgba(43,140,255,.1);}
  .bar .track{flex:1;height:9px;background:#e9f1fb;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2b8cff);transition:width .35s;}
  .bar #count{font-weight:700;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:12px;
    padding:10px 16px;margin:24px 0 6px;font-size:1.05rem;
    box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .section-title.s0{background:linear-gradient(135deg,#ff9a6c,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2b8cff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#b06bff);}
  .section-title.s3{background:linear-gradient(135deg,#42d392,#22b573);}
  .section-desc{font-size:.86rem;color:var(--gray);margin:0 4px 10px;}
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:5px solid var(--amber);
    border-radius:12px;padding:15px 17px;margin:14px 0;font-size:.95rem;
    box-shadow:0 3px 10px rgba(255,176,46,.08);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage .blk{display:inline-block;min-width:1.6em;text-align:center;font-weight:800;
    color:#fff;background:var(--coral);border-radius:6px;padding:0 4px;margin:0 2px;font-size:.85rem;}
  .email-h{font-size:.85rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:700;
    border-radius:8px;padding:1px 9px;margin-right:8px;font-size:.92rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:11px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:.95rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eef6ff;}
  .opt input{margin-top:3px;accent-color:var(--blue);}
  .opt .lab{font-weight:800;color:var(--blue);min-width:18px;}
  .opt.sel{border-color:var(--blue);background:#e7f2ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.9rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:7px;padding:2px 10px;font-size:.8rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .tag.blank{background:var(--gray);}
  .exp .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;
    white-space:pre-line;}
  .written{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:15px 17px;margin:12px 0;box-shadow:0 3px 10px rgba(43,140,255,.07);}

  .written .prompt{margin-bottom:10px;}
  .written .blankline{display:inline-block;background:#fbfdff;border:1px dashed var(--line);
    border-radius:8px;padding:6px 10px;margin-top:6px;}
  .written button.reveal{background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:10px;padding:8px 16px;font-weight:800;font-size:.9rem;cursor:pointer;}
  .written .ans{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.92rem;}
  .written .ans.show{display:block;}
  .written .ans .tag{display:inline-block;font-weight:800;color:#fff;background:var(--blue);
    border-radius:7px;padding:2px 10px;font-size:.8rem;margin-bottom:7px;}
  .written .ans .body{color:#7a4a12;background:#fff7ea;border-radius:8px;padding:8px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff7f2 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:14px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ff8a5b,#ff5d8f);
    box-shadow:0 6px 16px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:14px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:16px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2b8cff,#b06bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,140,255,.15);}
  .result.show{display:block;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2b8cff,#b06bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:.95rem;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:.95rem;}
  .result .bd span{font-weight:800;}
  .hint{text-align:center;font-size:.85rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:.8rem;margin:24px 0;}
</style>

<div class="wrap">

<script>
const PARTS = [{"title": "Ⅰ　字彙題", "desc": "共 10 題。第 1–8 題為單字選填；第 9–10 題為劃線字詞同義詞選擇。"}, {"title": "Ⅱ　對話題", "desc": "共 10 題，請依對話內容選出一個最適合的答案。"}, {"title": "Ⅲ　綜合測驗", "desc": "共 8 題，兩篇短文各 4 個空格，請依文意選出最適合的答案。"}, {"title": "Ⅳ　閱讀測驗", "desc": "共 14 題，請依短文內容選出最適當的答案。"}];
const PASSAGES = {"21": "<div class=\"passage\"><h3>第 21–24 題</h3>\nThe idea of remote work is not new, but it was the global pandemic that turned it from a rare perk into a mainstream practice. Many companies that had long resisted the idea found <span class=\"blk\">21</span> compelled to adopt it almost overnight, only to discover that productivity had not declined as sharply <span class=\"blk\">22</span> managers had feared. <span class=\"blk\">23</span>, the arrangement has its drawbacks: employees often struggle to separate work from private life, and there is growing concern that teams <span class=\"blk\">24</span> members rarely meet in person may find it hard to build trust.</div>", "25": "<div class=\"passage\"><h3>第 25–28 題</h3>\nCoral reefs, <span class=\"blk\">25</span> cover less than one percent of the ocean floor, support roughly a quarter of all marine species. Rising sea temperatures force corals to expel the algae living in their tissues, leaving them white and vulnerable. Bleached corals can recover <span class=\"blk\">26</span> the water cools quickly enough, but prolonged heat usually proves fatal. Conservationists argue that, <span class=\"blk\">27</span> the damage already done, protecting the remaining reefs should be a global priority. Only by cutting emissions drastically <span class=\"blk\">28</span> hope to preserve them.</div>", "29": "<div class=\"passage\"><h3>第 29–30 題</h3>\n<b>Notice to Library Patrons</b><br><br>Beginning March 3, the Main Library will extend its weekday hours until midnight during the exam period, but the Rare Books Room will continue to close at 6 p.m. Owing to renovation work, group study rooms on the second floor will be unavailable until further notice; students may instead reserve rooms on the third floor through the library website, up to 48 hours in advance. Reservations not claimed within 15 minutes of the start time will be released to walk-in users. Food is not permitted anywhere in the building, though covered beverages are allowed.</div>", "31": "<div class=\"passage\"><h3>第 31–32 題</h3>\n<b>Text Messages</b><br><br>Nina: Did you manage to get the concert tickets?<br>Owen: I tried, but they were sold out by the time I logged in.<br>Nina: Ugh. Maybe we can check resale sites?<br>Owen: Prices there are triple the original. My cousin works at the venue, though. He said they sometimes release a few seats the day before.<br>Nina: Worth a shot. Can you ask him?<br>Owen: Already did. He'll text me on Thursday if anything opens up.<br>Nina: Fingers crossed, then.</div>", "33": "<div class=\"passage\"><h3>第 33–35 題</h3>\nConventional economic wisdom holds that more choices make consumers happier, since a wider selection increases the likelihood of finding an option that suits individual tastes. Yet psychologist Barry Schwartz challenges this assumption. In a well-known experiment, shoppers who encountered 24 varieties of jam were more likely to stop and sample, but those who faced only six were roughly ten times more likely to actually buy a jar. Schwartz argues that an excess of options leads to \"decision fatigue\" and heightens the fear of missing out on a better alternative, so that even a satisfying purchase leaves buyers feeling uneasy. Critics note, however, that results have been inconsistent across studies, suggesting that the effect depends on factors such as the shopper's expertise and whether the options are easy to compare.</div>", "36": "<div class=\"passage\"><h3>第 36–38 題</h3>\nCities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. Dark surfaces such as asphalt and rooftops absorb solar radiation during the day and release it slowly at night, while the scarcity of vegetation reduces the cooling that would otherwise result from evaporation. Heat produced by vehicles and air conditioners compounds the problem. Beyond discomfort, the effect raises energy demand and can aggravate health risks for the elderly. Planners have responded with a range of measures: reflective \"cool roofs,\" parks and street trees, and green roofs planted with vegetation. Studies show that cool roofs can lower indoor temperatures significantly, yet in cold climates they may increase winter heating costs, which illustrates that no single solution suits every city.</div>", "39": "<div class=\"passage\"><h3>第 39–42 題</h3>\nWhen Maria opened her bakery in a quiet neighborhood, she assumed that the quality of her bread would speak for itself. Months later, however, sales remained flat, and she was on the verge of closing. A regular customer casually mentioned that most people nearby commuted early and passed the shop before it opened at 8 a.m. Maria initially dismissed the remark, convinced that early hours would not justify the cost of extra labor. After a sleepless week of running the numbers, she opened at 5:30 a.m. on a trial basis, and a morning rush of commuters materialized almost immediately. Encouraged, she began offering pre-orders through a messaging app, which not only smoothed out the crowds but also reduced waste, since she could bake according to demand. Three years on, she employs six people, yet she still credits that offhand comment from a customer, rather than any marketing campaign, with saving her business.</div>"};
const Q = [{"n": 1, "p": 0, "stem": "The government introduced stricter regulations to _____ the spread of misinformation online.", "o": ["amplify", "endorse", "curb", "summon"], "a": 2, "exp": "(C) curb（抑制） ✓ \"curb the spread of\" 為常見搭配，表示「抑制、遏止」。\n❌ (A) amplify：放大，與立法目的相反\n❌ (B) endorse：背書、認可，語意不合\n❌ (D) summon：傳喚、召集，不接 spread"}, {"n": 2, "p": 0, "stem": "Despite her _____ schedule, Dr. Lin always found time to mentor her graduate students.", "o": ["hectic", "tentative", "fragile", "vacant"], "a": 0, "exp": "(A) hectic（忙亂的） ✓ \"hectic schedule\" 為「忙得不可開交的行程」，與 Despite 形成讓步對比。\n❌ (B) tentative：暫定的，不能與 found time 形成對比\n❌ (C) fragile：易碎的，不修飾 schedule\n❌ (D) vacant：空著的，與 Despite 的轉折語意相反"}, {"n": 3, "p": 0, "stem": "The company's decision to lay off hundreds of workers drew widespread _____ from labor unions.", "o": ["compensation", "cooperation", "consideration", "condemnation"], "a": 3, "exp": "(D) condemnation（譴責） ✓ \"draw condemnation from\" 表「招致……的譴責」，裁員引來工會批評。\n❌ (A) compensation：補償，工會不會因裁員「給予補償」\n❌ (B) cooperation：合作，語意與裁員後的反應不符\n❌ (C) consideration：考量，不帶批評意味"}, {"n": 4, "p": 0, "stem": "The witness's account was _____ with the security footage, which proved that he was telling the truth.", "o": ["contrary", "consistent", "concerned", "confused"], "a": 1, "exp": "(B) consistent（一致的） ✓ \"be consistent with\" 表「與……一致」，證詞與監視器畫面相符才能證明他說實話。\n❌ (A) contrary：需搭配 to，且語意相反\n❌ (C) concerned：關心的，語意不通\n❌ (D) confused：困惑的，不接 with 表一致"}, {"n": 5, "p": 0, "stem": "The scientist's findings were so _____ that they forced the entire field to reconsider long-held assumptions.", "o": ["predictable", "groundbreaking", "trivial", "redundant"], "a": 1, "exp": "(B) groundbreaking（開創性的） ✓ so...that 結構：成果「開創性」，才會迫使整個領域重新檢討舊有假設。\n❌ (A) predictable：可預料的，不會迫使重新檢討\n❌ (C) trivial：瑣碎的，結果與結構不符\n❌ (D) redundant：多餘的，語意不通"}, {"n": 6, "p": 0, "stem": "Employees who _____ company policies may face disciplinary action, including termination.", "o": ["violate", "validate", "venture", "vacate"], "a": 0, "exp": "(A) violate（違反） ✓ \"violate policies\" 違反規定，才會面臨懲處甚至解僱。\n❌ (B) validate：驗證、使有效，不會招致懲處\n❌ (C) venture：冒險，不及物或接 into\n❌ (D) vacate：騰出、搬離，不接 policies"}, {"n": 7, "p": 0, "stem": "The mayor's remarks were deliberately _____, allowing him to avoid committing himself to any specific policy.", "o": ["explicit", "abrupt", "ambiguous", "adequate"], "a": 2, "exp": "(C) ambiguous（模稜兩可的） ✓ 刻意說得「模稜兩可」，才能避免承諾具體政策。\n❌ (A) explicit：明確的，會造成明確承諾，與句意相反\n❌ (B) abrupt：突然的，無法達到避免承諾的效果\n❌ (D) adequate：足夠的，語意不通"}, {"n": 8, "p": 0, "stem": "Years of overfishing have _____ fish populations in the region to dangerously low levels.", "o": ["deployed", "deprived", "deposited", "depleted"], "a": 3, "exp": "(D) depleted（耗盡、大幅減少） ✓ \"deplete A to low levels\" 表使資源減少到很低的程度。\n❌ (A) deployed：部署，不接魚群\n❌ (B) deprived：需用 deprive A of B，此處結構不合\n❌ (C) deposited：存放，語意不通"}, {"n": 9, "p": 0, "stem": "The board met the manager's proposal with considerable <i>skepticism</i>.", "o": ["enthusiasm", "doubt", "relief", "hostility"], "a": 1, "exp": "(B) doubt（懷疑） ✓ *skepticism* 意為「懷疑、質疑」，與 doubt 同義。\n❌ (A) enthusiasm：熱情，意思相反\n❌ (C) relief：寬慰，語意不符\n❌ (D) hostility：敵意，程度與語意過強且不同"}, {"n": 10, "p": 0, "stem": "The CEO attempted to <i>mitigate</i> the damage caused by the scandal.", "o": ["conceal", "exaggerate", "lessen", "assess"], "a": 2, "exp": "(C) lessen（減輕） ✓ *mitigate* 意為「減輕、緩和」，與 lessen 同義。\n❌ (A) conceal：隱瞞，並非減輕損害\n❌ (B) exaggerate：誇大，意思相反\n❌ (D) assess：評估，語意不同"}, {"n": 11, "p": 1, "stem": "Customer: I was charged twice for the same order.<br>Agent: _____<br>Customer: Then I'll expect the refund within the week.", "o": ["Our records show you only ordered once, so there is nothing to refund.", "I apologize. The duplicate charge will be reversed within five business days.", "You'll need to speak to your bank, since we can't see payment data.", "Unfortunately, refunds are only processed after thirty days."], "a": 1, "exp": "(B) I apologize. The duplicate charge will be reversed within five business days. ✓ 客服承諾五個工作日內退款，顧客才會說「那我期待一週內收到退款」。\n❌ (A) Our records show you only ordered once, so there is nothing to refund.：否認重複扣款，顧客不會再提退款\n❌ (C) You'll need to speak to your bank, since we can't see payment data.：推給銀行，顧客不會預期一週內退款\n❌ (D) Unfortunately, refunds are only processed after thirty days.：三十天與顧客「一週內」的期待矛盾"}, {"n": 12, "p": 1, "stem": "A: Do you mind if I open the window?<br>B: _____<br>A: Oh, then I'll just turn on the fan.", "o": ["Actually, I'd rather you didn't. I'm just getting over a cold.", "Not at all, go right ahead.", "Yes, I'd be glad to open it for you.", "I don't mind either way, so it's up to you."], "a": 0, "exp": "(A) Actually, I'd rather you didn't. I'm just getting over a cold. ✓ B 婉拒開窗，A 才改說「那我開電扇就好」。\n❌ (B) Not at all, go right ahead.：等於同意，A 無須改開電扇\n❌ (C) Yes, I'd be glad to open it for you.：同意開窗，與 A 的回應矛盾\n❌ (D) I don't mind either way, so it's up to you.：無所謂，A 不會改變做法"}, {"n": 13, "p": 1, "stem": "Interviewer: What would you say is your greatest weakness?<br>Candidate: _____<br>Interviewer: That's a refreshingly honest answer.", "o": ["I don't really have any weaknesses.", "I'm never late and always meet my deadlines.", "I tend to take on too much because I find it hard to say no to colleagues.", "I would prefer not to discuss that."], "a": 2, "exp": "(C) I tend to take on too much because I find it hard to say no to colleagues. ✓ 具體承認缺點，面試官才會稱讚「坦率」。\n❌ (A) I don't really have any weaknesses.：否認缺點，不會被稱為坦率\n❌ (B) I'm never late and always meet my deadlines.：這是優點，並未回答缺點\n❌ (D) I would prefer not to discuss that.：迴避問題，不算坦率"}, {"n": 14, "p": 1, "stem": "A: I heard the project deadline got pushed back again.<br>B: _____<br>A: Tell me about it. I've already rescheduled two client meetings.", "o": ["Great, now we can finally relax for a while.", "I didn't even know the project had started.", "Good news travels fast around here.", "That's the third time this month. It's throwing everything off."], "a": 3, "exp": "(D) That's the third time this month. It's throwing everything off. ✓ B 抱怨延期造成混亂，A 以 Tell me about it（我懂）附和。\n❌ (A) Great, now we can finally relax for a while.：正面反應，A 不會用 Tell me about it 附和\n❌ (B) I didn't even know the project had started.：與 A 的附和不連貫\n❌ (C) Good news travels fast around here.：延期不是好消息，語意不合"}, {"n": 15, "p": 1, "stem": "Student: Professor, would it be possible to get an extension on the essay?<br>Professor: _____<br>Student: I understand. I'll hand it in on Friday as planned.", "o": ["I'm afraid I can't make exceptions, since grades are due next week.", "Certainly, take as long as you need.", "Sure, hand it in whenever you like.", "The essay isn't due until next month."], "a": 0, "exp": "(A) I'm afraid I can't make exceptions, since grades are due next week. ✓ 教授拒絕延期，學生才說「我了解，照原定星期五交」。\n❌ (B) Certainly, take as long as you need.：同意延期，學生不會照原訂時間交\n❌ (C) Sure, hand it in whenever you like.：同意延期，與學生回應矛盾\n❌ (D) The essay isn't due until next month.：與學生「星期五交」矛盾"}, {"n": 16, "p": 1, "stem": "A: How did the negotiation go?<br>B: _____<br>A: Well, a compromise is better than nothing.", "o": ["They accepted every one of our demands.", "We walked out after five minutes.", "Neither side got everything it wanted, but we reached a deal.", "It hasn't started yet."], "a": 2, "exp": "(C) Neither side got everything it wanted, but we reached a deal. ✓ 雙方各讓步而達成協議，A 才會說「妥協總比沒有好」。\n❌ (A) They accepted every one of our demands.：全盤接受，無需談「妥協」\n❌ (B) We walked out after five minutes.：談判破裂，不會有妥協\n❌ (D) It hasn't started yet.：尚未開始，無從評論結果"}, {"n": 17, "p": 1, "stem": "Customer: This jacket looks great, but it's a bit out of my budget.<br>Clerk: _____<br>Customer: In that case, I'll wait until then.", "o": ["It goes on sale next Monday, if you can hold off until then.", "It's actually our most affordable item.", "We raised the price just this morning.", "Sorry, we never offer discounts."], "a": 0, "exp": "(A) It goes on sale next Monday, if you can hold off until then. ✓ 店員提出下週一特價，顧客才說「那我等到那時候」。\n❌ (B) It's actually our most affordable item.：與顧客「超出預算」及 until then 不合\n❌ (C) We raised the price just this morning.：漲價不會讓顧客想等\n❌ (D) Sorry, we never offer discounts.：不打折，顧客無從等到 then"}, {"n": 18, "p": 1, "stem": "A: I can't believe Mark quit without giving notice.<br>B: _____<br>A: You're right. Maybe there's more to the story.", "o": ["Yes, he certainly deserves a promotion.", "Exactly, he must be a lazy person.", "Obviously, he hated all of us.", "Well, let's not jump to conclusions before we hear his side."], "a": 3, "exp": "(D) Well, let's not jump to conclusions before we hear his side. ✓ B 勸別妄下結論，A 才回「你說得對，也許另有隱情」。\n❌ (A) Yes, he certainly deserves a promotion.：與離職事件無關\n❌ (B) Exactly, he must be a lazy person.：妄下定論，A 不會回「也許另有隱情」\n❌ (C) Obviously, he hated all of us.：同樣武斷，與 A 的回應矛盾"}, {"n": 19, "p": 1, "stem": "Passenger: Excuse me, does this train stop at Taichung?<br>Attendant: _____<br>Passenger: Then I'd better get off and wait for the next one.", "o": ["Yes, we'll arrive in about ten minutes.", "Not this one. It's an express that runs straight to Kaohsiung.", "It certainly does, so you can stay on board.", "I'm afraid the station is closed today."], "a": 1, "exp": "(B) Not this one. It's an express that runs straight to Kaohsiung. ✓ 此班車不停台中，乘客才決定下車等下一班。\n❌ (A) Yes, we'll arrive in about ten minutes.：會停靠，乘客不必下車\n❌ (C) It certainly does, so you can stay on board.：與乘客「下車等下一班」矛盾\n❌ (D) I'm afraid the station is closed today.：車站關閉與「等下一班」不合"}, {"n": 20, "p": 1, "stem": "A: Would you rather work from home or in the office?<br>B: _____<br>A: I see your point, but I'd miss the face-to-face interaction.", "o": ["Home, definitely. I save two hours of commuting every day.", "The office. I love the face-to-face chats.", "It depends on the weather.", "I haven't decided which restaurant to try."], "a": 0, "exp": "(A) Home, definitely. I save two hours of commuting every day. ✓ B 選擇在家工作並給理由，A 才說「我懂，但我會想念面對面互動」。\n❌ (B) The office. I love the face-to-face chats.：B 選辦公室，A 不會說 but I'd miss\n❌ (C) It depends on the weather.：與工作地點無關\n❌ (D) I haven't decided which restaurant to try.：答非所問"}, {"n": 21, "p": 2, "stem": "(21)", "o": ["themselves", "them", "their", "they"], "a": 0, "exp": "(A) themselves ✓ find oneself + 過去分詞：主詞 companies 為動作者，反身代名詞 themselves 作受詞。\n❌ (B) them：找不到反身結構，且指稱不同對象\n❌ (C) their：所有格後須接名詞\n❌ (D) they：主格不能作 found 的受詞"}, {"n": 22, "p": 2, "stem": "(22)", "o": ["as", "than", "that", "what"], "a": 0, "exp": "(A) as ✓ as sharply as 為同等比較，後一個 as 引導比較子句。\n❌ (B) than：須與 more/less 搭配\n❌ (C) that：此處不構成比較\n❌ (D) what：不能引導比較子句"}, {"n": 23, "p": 2, "stem": "(23)", "o": ["Even so", "Likewise", "As a result", "In addition"], "a": 0, "exp": "(A) Even so ✓ 前文說生產力沒下降（正面），後文說仍有缺點，需讓步轉折。\n❌ (B) Likewise：表相同，語氣不合\n❌ (C) As a result：表因果，前後非因果\n❌ (D) In addition：表補充，但前後方向相反"}, {"n": 24, "p": 2, "stem": "(24)", "o": ["who", "which", "whose", "whom"], "a": 2, "exp": "(C) whose ✓ teams whose members...：所有格關係代名詞，指「團隊的成員」。\n❌ (A) who：主格，後面已有主詞 members\n❌ (B) which：主格/受格，不表所屬\n❌ (D) whom：受格，語意不合"}, {"n": 25, "p": 2, "stem": "(25)", "o": ["what", "that", "where", "which"], "a": 3, "exp": "(D) which ✓ 非限定用法，逗號後用 which 指 reefs 且作 cover 的主詞。\n❌ (A) what：不能有先行詞\n❌ (B) that：不可用於逗號之後的非限定子句\n❌ (C) where：reefs 非地點，且後面缺主詞"}, {"n": 26, "p": 2, "stem": "(26)", "o": ["unless", "although", "provided", "whereas"], "a": 2, "exp": "(C) provided ✓ provided (that) = 只要，引導條件：只要水溫迅速下降，珊瑚就能恢復。\n❌ (A) unless：「除非」會使語意相反\n❌ (B) although：讓步，與後句 but 不合\n❌ (D) whereas：對比連接詞，非條件"}, {"n": 27, "p": 2, "stem": "(27)", "o": ["given", "giving", "to give", "having given"], "a": 0, "exp": "(A) given ✓ given + 名詞片語 = 「考慮到」，介系詞用法。\n❌ (B) giving：現在分詞語意為主動\n❌ (C) to give：不定詞，文法不合\n❌ (D) having given：主詞 protection 不是給予者"}, {"n": 28, "p": 2, "stem": "(28)", "o": ["we can", "can we", "we will", "will be"], "a": 1, "exp": "(B) can we ✓ Only + 副詞片語置句首，主句須倒裝：can we hope。\n❌ (A) we can：未倒裝\n❌ (C) we will：未倒裝\n❌ (D) will be：缺主詞"}, {"n": 29, "p": 3, "stem": "Which of the following is true about the extended hours?", "o": ["They apply to every section of the library.", "They will remain in place after the exam period.", "They do not apply to the Rare Books Room.", "They are limited to the third floor."], "a": 2, "exp": "(C) They do not apply to the Rare Books Room. ✓ 公告說 Rare Books Room 仍於下午六點關閉。\n❌ (A) They apply to every section of the library.：Rare Books Room 例外\n❌ (B) They will remain in place after the exam period.：僅限考試期間\n❌ (D) They are limited to the third floor.：公告說的是 Main Library，並非只限三樓"}, {"n": 30, "p": 3, "stem": "What might happen if a student arrives 20 minutes late for a reserved room?", "o": ["The reservation will be extended by 20 minutes.", "The room may be given to someone without a reservation.", "The student will be fined.", "The student must rebook 48 hours in advance."], "a": 1, "exp": "(B) The room may be given to someone without a reservation. ✓ 逾時 15 分鐘未到，預約會釋出給現場使用者。\n❌ (A) The reservation will be extended by 20 minutes.：公告未提延長\n❌ (C) The student will be fined.：公告未提罰款\n❌ (D) The student must rebook 48 hours in advance.：公告未要求重新預約"}, {"n": 31, "p": 3, "stem": "What does Owen imply about the resale sites?", "o": ["Their prices are unreasonably high.", "They only sell tickets for other events.", "They are run by his cousin.", "They usually have many seats available."], "a": 0, "exp": "(A) Their prices are unreasonably high. ✓ Owen 說價格是原價的三倍，暗示太貴。\n❌ (B) They only sell tickets for other events.：文中未提\n❌ (C) They are run by his cousin.：他的表哥在場館工作，不是經營轉售網站\n❌ (D) They usually have many seats available.：文中未提"}, {"n": 32, "p": 3, "stem": "What is likely to happen on Thursday?", "o": ["The concert will take place.", "Nina will buy tickets from a resale site.", "Owen will call the venue to ask for a refund.", "Owen may hear from his cousin about released seats."], "a": 3, "exp": "(D) Owen may hear from his cousin about released seats. ✓ 表哥說若有釋出座位會在週四傳訊息。\n❌ (A) The concert will take place.：文中未提演出日期\n❌ (B) Nina will buy tickets from a resale site.：兩人嫌轉售太貴\n❌ (C) Owen will call the venue to ask for a refund.：與退費無關"}, {"n": 33, "p": 3, "stem": "What is the main idea of the passage?", "o": ["Consumers prefer jam to other products.", "Having too many options can reduce satisfaction and purchases.", "Economists have proven that more choice is always better.", "Shoppers dislike sampling products."], "a": 1, "exp": "(B) Having too many options can reduce satisfaction and purchases. ✓ 全文討論「選擇過多反而降低購買與滿意度」。\n❌ (A) Consumers prefer jam to other products.：僅為實驗例子\n❌ (C) Economists have proven that more choice is always better.：Schwartz 質疑此觀點\n❌ (D) Shoppers dislike sampling products.：試吃比例反而較高"}, {"n": 34, "p": 3, "stem": "According to the experiment, which statement is true?", "o": ["Shoppers who saw only six jams were more likely to buy.", "Shoppers who saw 24 jams were more likely to buy.", "Shoppers who saw 24 jams refused to sample.", "Both groups bought about the same amount."], "a": 0, "exp": "(A) Shoppers who saw only six jams were more likely to buy. ✓ 六種組的購買可能性約為十倍。\n❌ (B) Shoppers who saw 24 jams were more likely to buy.：購買率較低\n❌ (C) Shoppers who saw 24 jams refused to sample.：24 種組較常試吃\n❌ (D) Both groups bought about the same amount.：差異約十倍"}, {"n": 35, "p": 3, "stem": "What can be inferred about the critics' view?", "o": ["They have proven Schwartz's experiment false.", "They believe shoppers never feel fatigue.", "The effect of choice overload does not hold in every situation.", "They agree completely with Schwartz."], "a": 2, "exp": "(C) The effect of choice overload does not hold in every situation. ✓ 結果在各研究不一致，取決於專業度與可比較性。\n❌ (A) They have proven Schwartz's experiment false.：只說結果不一致\n❌ (B) They believe shoppers never feel fatigue.：文中未說\n❌ (D) They agree completely with Schwartz.：批評者提出保留"}, {"n": 36, "p": 3, "stem": "Why do cities remain warm at night?", "o": ["Dark surfaces gradually release heat absorbed during the day.", "Street lamps generate large amounts of heat.", "Vegetation traps heat near the ground.", "Evaporation from rivers warms the air."], "a": 0, "exp": "(A) Dark surfaces gradually release heat absorbed during the day. ✓ 瀝青與屋頂白天吸熱、夜間緩慢釋放。\n❌ (B) Street lamps generate large amounts of heat.：文中未提\n❌ (C) Vegetation traps heat near the ground.：植被減少是原因，反而有降溫效果\n❌ (D) Evaporation from rivers warms the air.：蒸發是降溫"}, {"n": 37, "p": 3, "stem": "The word \"compounds\" in the passage is closest in meaning to _____.", "o": ["solves", "worsens", "combines", "explains"], "a": 1, "exp": "(B) worsens ✓ compound the problem = 使問題更嚴重。\n❌ (A) solves：意思相反\n❌ (C) combines：字面近似但此處非「混合」\n❌ (D) explains：語意不符"}, {"n": 38, "p": 3, "stem": "What does the passage suggest about cool roofs?", "o": ["They are useless in hot climates.", "They always reduce heating costs.", "They are effective but not ideal everywhere.", "They are more costly than green roofs."], "a": 2, "exp": "(C) They are effective but not ideal everywhere. ✓ 冷屋頂降低室溫，但寒冷氣候可能增加暖氣費。\n❌ (A) They are useless in hot climates.：在熱地區有效\n❌ (B) They always reduce heating costs.：寒冷氣候反而可能增加\n❌ (D) They are more costly than green roofs.：文中未比較成本"}, {"n": 39, "p": 3, "stem": "Why were Maria's sales flat at first?", "o": ["Her bread was of poor quality.", "The shop opened after many potential customers had already passed by.", "Her prices were too high.", "She had no regular customers."], "a": 1, "exp": "(B) The shop opened after many potential customers had already passed by. ✓ 通勤者在早上八點開店前就經過。\n❌ (A) Her bread was of poor quality.：文中未說品質差\n❌ (C) Her prices were too high.：文中未提價格\n❌ (D) She had no regular customers.：有一位常客"}, {"n": 40, "p": 3, "stem": "How did Maria first react to the customer's remark?", "o": ["She changed her hours immediately.", "She angrily rejected it.", "She doubted that it would be worth the extra cost.", "She hired more staff at once."], "a": 2, "exp": "(C) She doubted that it would be worth the extra cost. ✓ dismissed...convinced early hours would not justify the cost。\n❌ (A) She changed her hours immediately.：她先是駁回\n❌ (B const TOTAL = Q.length;

/* ====== 產生選擇題畫面 ====== */
const form = document.getElementById('quiz');
let lastPart = -1;
Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  const isBlank=/^\(\d+\)$/.test(q.stem);
  const stemHtml = isBlank ? `第 ${q.n} 格` : q.stem;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${stemHtml}</div>`;
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${'ABCD'[i]}</span><span>${opt}</span>`;
    lab.querySelector('input').addEventListener('change',()=>{
      pickAnswer(q,i);
    });
    card.appendChild(lab);
  });
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');
let submitted=false;

/* 選擇答案後立即鎖定並顯示該題解析 */
function pickAnswer(q,pick){
  const card=document.getElementById('q'+q.n);
  card.querySelectorAll('.opt').forEach(o=>{
    o.classList.add('lock');
    o.querySelector('input').disabled=true;
    const i=parseInt(o.dataset.i);
    if(i===pick) o.classList.add('sel');
    if(i===q.a) o.classList.add('correct');
    if(i===pick && pick!==q.a) o.classList.add('wrong');
  });
  const correct = pick===q.a;
  const exp=document.getElementById('exp'+q.n);
  const tag = correct ? '答對' : '答錯';
  exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${'ABCD'[q.a]}</span>
    <div class="body">${q.exp}</div>`;
  exp.classList.add('show');
  updateProgress();
}

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  if(submitted) return;
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題，可以交卷查看總分了` : (c===0 ? '尚未作答任何題目（每題選擇後立即顯示解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（可隨時交卷）`);
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    const card=document.getElementById('q'+q.n);
    if(pick===null){
      blank++;
      card.querySelectorAll('.opt').forEach(o=>{
        o.classList.add('lock');
        o.querySelector('input').disabled=true;
        const i=parseInt(o.dataset.i);
        if(i===q.a) o.classList.add('correct');
      });
      const exp=document.getElementById('exp'+q.n);
      exp.innerHTML=`<span class="tag blank">未作答　正解：${'ABCD'[q.a]}</span>
        <div class="body">${q.exp}</div>`;
      exp.classList.add('show');
    } else if(pick===q.a){
      ok++;
    }
  });
  const res=document.getElementById('result');
  const score = ok*2;
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('scoreTxt').textContent=`分（選擇題 / 84 分，答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  res.classList.add('show');
  submitted=true;
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  res.scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitted=false;
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

/* ====== 非選擇題（點擊查看解析） ====== */
const writtenDiv=document.getElementById('written');
WRITTEN.forEach((w,idx)=>{
  const card=document.createElement('div'); card.className='written';
  card.innerHTML=`<h4>${w.title}</h4>
    <div class="prompt">${w.prompt}</div>
    <button type="button" class="reveal" id="wb${idx}">查看答案與解析</button>
    <div class="ans" id="wa${idx}">
      <span class="tag">參考答案</span>
      <div class="body">${w.ans}</div>
      <div class="body">${w.exp}</div>
    </div>`;
  writtenDiv.appendChild(card);
  card.querySelector('#wb'+idx).addEventListener('click',()=>{
    card.querySelector('#wa'+idx).classList.add('show');
    card.querySelector('#wb'+idx).style.display='none';
  });
});

updateProgress();
</script>

}

  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>
