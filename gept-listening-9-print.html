<script>
/* 圖形素材（第9回 食物與飲料） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/9/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const ICECREAM=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q1.jpg" alt="question 1 picture">`;
const MILK=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q2.jpg" alt="question 2 picture">`;
const FRUIT=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q3.jpg" alt="question 3 picture">`;
const COOKIE=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q4.jpg" alt="question 4 picture">`;
const CANDY=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:ICECREAM,o:["The girl is eating ice cream.","The girl is eating a cookie.","The girl is eating some cereal."],a:0,sen:"For question one, look at the picture. What is the girl eating?",szh:"第一題，請看圖片。女孩在吃什麼？",en:"The girl eats ice cream.",zh:"女孩吃的是冰淇淋(ice cream)，選 A。B 餅乾(cookie)、C 穀片(cereal)都是點心或早餐，但不是圖中的食物。"},
{n:2,p:0,fig:MILK,o:["The glass is full of orange juice.","The glass is full of cold tea.","The glass is full of fresh milk."],a:2,sen:"For question two, look at the picture. What is in the glass?",szh:"第二題，請看圖片。杯子裡是什麼？",en:"The glass is full of fresh milk.",zh:"杯子裡裝滿新鮮牛奶(milk)，選 C。柳橙汁和冷茶都是飲料，但顏色和圖片不符。"},
{n:3,p:0,fig:FRUIT,o:["The bowl has rice and a fried egg.","The bowl has noodles and some soup.","The bowl has fruit and vegetables."],a:2,sen:"For question three, look at the picture. What is in the bowl?",szh:"第三題，請看圖片。碗裡是什麼？",en:"The bowl has fruit and vegetables.",zh:"碗裡是水果(fruit)和蔬菜(vegetable)，選 C。A 飯加蛋、B 麵加湯是別的餐點。"},
{n:4,p:0,fig:COOKIE,o:["She baked a tray of cookies.","She baked a loaf of bread.","She baked a big birthday cake."],a:0,sen:"For question four, look at the picture. What did she bake?",szh:"第四題，請看圖片。她烤了什麼？",en:"She baked a tray of cookies.",zh:"她烤了一盤餅乾(cookie)，選 A。B 麵包、C 蛋糕也是烘焙食物，但不是圖中的。"},
{n:5,p:0,fig:CANDY,o:["There is candy and a cereal bar.","There is toast and a boiled egg.","There are fries and a hot dog."],a:0,sen:"For question five, look at the picture. What is on the plate?",szh:"第五題，請看圖片。盤子上是什麼？",en:"Candy and a cereal bar.",zh:"盤子上有糖果(candy)和穀物(cereal)棒，選 A。B、C 是別種食物。"},

{n:6,p:1,o:["About five o'clock, I think.","Just chicken, please. No beef.","Dinner is ready, come and eat."],a:1,sen:"What meat would you like for dinner?",szh:"晚餐你想吃什麼肉？",en:"Just chicken, please. No beef.",zh:"問晚餐想吃什麼肉(meat)，答『只要雞肉(chicken)，不要牛肉(beef)』，選 B。A 答時間(五點 five)，C 重複 dinner 卻沒回答。"},
{n:7,p:1,o:["It took about five hours.","Yes, I could eat everything.","I enjoyed the long trip very much."],a:1,sen:"Are you hungry after the long trip?",szh:"長途旅行後你餓了嗎？",en:"Yes; I could eat everything.",zh:"問是否餓了(hungry)，答『對，我什麼(everything)都吃得下』，選 B。A 答花多久，C 重複 trip 卻沒回答餓不餓。"},
{n:8,p:1,o:["Fish is good for your heart.","I bought it at the east market.","Steam it before adding any salt."],a:2,sen:"How should I cook this fish?",szh:"這條魚我該怎麼煮？",en:"Steam it before adding any salt.",zh:"問魚怎麼煮，答『先蒸(steam)，加鹽(salt)之前(before)』，選 C。A 談魚對心臟(heart)的好處，B 答在哪買(east 東邊)，都沒回答怎麼煮。"},
{n:9,p:1,o:["Because there's something dirty in it.","At a restaurant near the station.","Soup is my favorite food."],a:0,sen:"Why won't you finish your soup?",szh:"你為什麼不把湯喝完？",en:"Something dirty is in it.",zh:"問為何不喝完(finish)，答『因為裡面有髒(dirty)東西』，選 A。B 答地點，C 重複 soup 卻沒說原因。"},
{n:10,p:1,o:["I moved there when I was five.","It's about two hours from here.","Its sweet fruit and pretty beaches."],a:2,sen:"What is your hometown famous for?",szh:"你的家鄉以什麼聞名？",en:"Its fruit and pretty beaches.",zh:"問家鄉(hometown)以什麼聞名，答『甜美的水果和漂亮(pretty)的海灘』，選 C。A 答幾歲搬去(five)，B 答距離。"},
{n:11,p:1,o:["A square flag with a heart design.","It lasted about two hours.","His hand motion was really fast."],a:0,sen:"What did the magic show have on stage?",szh:"魔術表演的舞台上有什麼？",en:"A square flag with a heart design.",zh:"問魔術(magic)表演舞台上有什麼，答『有愛心圖案(design)的方形(square)旗子(flag)』，選 A。B 答長度，C(motion/fast)講手法，沒回答舞台上有什麼。"},
{n:12,p:1,o:["It's two o'clock in the afternoon.","None of these. Yours is blue.","These socks are on sale today."],a:1,sen:"Excuse me, is this my sock?",szh:"不好意思，這是我的襪子嗎？",en:"None of these; yours is in your bag.",zh:"問這是不是他的襪子(sock)，答『這些都不是，你的(yours)是藍色的』，選 B。A 答時間，C 重複 socks 卻講特價。"},
{n:13,p:1,o:["My health is much better now, thanks.","The doctor's office opens at nine today.","Eat less fat. Don't eat until full."],a:2,sen:"How can I improve my health?",szh:"我要怎麼改善健康？",en:"Eat less fat; don't eat until full.",zh:"問怎麼改善(improve)健康，答『少吃脂肪(fat)，別吃到(until)太飽』，選 C。A 講現在的情況，B 講診所時間，都沒回答方法。"},
{n:14,p:1,o:["The dog is about five years old.","He walks his dog after dinner.","It saw a cat and ran off, barking."],a:2,sen:"Why did the dog run away so quickly?",szh:"狗為什麼跑得那麼快？",en:"It saw a cat and ran off, barking.",zh:"問狗為何跑，答『牠看到貓就跑開(off)，邊跑邊叫(bark)』，選 C。A 答年齡，B 重複 dog 卻說遛狗時間。"},
{n:15,p:1,o:["Because he was a very honest man.","He asked them not to interrupt him.","A big crowd came to hear him."],a:1,sen:"What did the honest man ask the crowd?",szh:"那位誠實的人請大家做什麼？",en:"He asked them not to interrupt him.",zh:"問誠實的人要大家做什麼，答『要他們別打斷(interrupt)他』，選 B。A 回答原因，C 重複 crowd 卻講人潮。"},

{n:16,p:2,o:["Toast and eggs.","Rice and fish.","Milk and cereal."],a:2,sen:"W: What do you eat for breakfast? &nbsp;M: Usually milk and cereal; it is quick and healthy. &nbsp;W: Sounds good. &nbsp;Q: What does the man eat for breakfast?",szh:"女：你早餐吃什麼？　男：通常是牛奶(milk)加穀片(cereal)，又快又健康。　女：不錯。　問：男士早餐吃什麼？",en:"Milk and cereal.",zh:"男士早餐吃牛奶(milk)加穀片(cereal)，選 C。A、B 是別的早餐。"},
{n:17,p:2,o:["Chicken, but not beef.","Beef, but not pork.","Pork, but not chicken."],a:1,sen:"M: Which meat does your family like? &nbsp;W: We love beef, but we never eat pork. &nbsp;M: I see. &nbsp;Q: What meat does the family like?",szh:"男：你家喜歡吃什麼肉？　女：我們愛牛肉(beef)，但從不吃豬肉(pork)。　男：了解。　問：這家人喜歡什麼肉？",en:"Beef, but not pork.",zh:"這家人愛牛肉(beef)、不吃豬肉(pork)，選 B。A、C 把肉的種類換掉了。"},
{n:18,p:2,o:["A hot soup.","Ice cream.","A fruit salad."],a:1,sen:"W: What would you like after dinner? &nbsp;M: Something cold and sweet. I like it on a cone. &nbsp;W: Good choice. It is a hot night. &nbsp;Q: What does the man want?",szh:"女：晚餐後你想吃什麼？　男：冷冷甜甜的東西，我喜歡放在甜筒上的。　女：好選擇，今晚很熱。　問：男士想要什麼？",en:"Ice cream.",zh:"男士要又冷又甜、放在甜筒上的東西，就是冰淇淋(ice cream)，選 B。A 熱湯不冷；C 水果沙拉不放甜筒。"},
{n:19,p:2,o:["Be quiet.","Come here.","Go home."],a:0,sen:"W: Why did Ken put a finger on his lips just now? &nbsp;M: Because his baby sister is sleeping in the next room. &nbsp;W: Oh, I see. Let's talk quietly. &nbsp;Q: What does Ken's gesture mean?",szh:"女：小肯剛剛為什麼把手指放在嘴唇上？　男：因為他的小妹妹在隔壁房間睡覺。　女：喔，我懂了，我們小聲說話吧。　問：小肯的手勢(gesture)是什麼意思？",en:"Be quiet.",zh:"小肯把手指放在嘴唇上，是因為妹妹在睡覺，手勢(gesture)的意思是『安靜』，選 A。B、C 對話都沒提。"},
{n:20,p:2,o:["Sugar.","Salt.","Milk."],a:0,sen:"M: This tea is too bitter. &nbsp;W: I know. I'll put something sweet in it. &nbsp;M: Good idea. Then it will taste much better. &nbsp;Q: What will the woman add?",szh:"男：這杯茶太苦了。　女：我知道，我會加點甜的東西進去。　男：好主意，這樣會好喝很多。　問：女士會加什麼？",en:"Sugar.",zh:"茶太苦，要放甜的東西讓它變甜，就是加糖(sugar)，選 A。B 鹽是鹹的；C 牛奶不會變甜。"},
{n:21,p:2,o:["Seventeen.","Five.","Twelve."],a:1,sen:"W: There were seventeen cookies this morning. &nbsp;M: Tom ate six, and I ate six. &nbsp;W: Oh no! Is there anything left? &nbsp;Q: How many cookies are left?",szh:"女：今天早上有十七(seventeen)片餅乾(cookie)。　男：湯姆吃了六片，我也吃了六片。　女：天啊！還剩什麼嗎？　問：還剩幾片餅乾？",en:"Five.",zh:"原有十七(seventeen)片，湯姆吃六片、我吃六片，共十二片，17 - 12 = 5，選 B。C 十二是吃掉的數量，A 是原有的數量。"},
{n:22,p:2,o:["They want more money.","They want a new boss.","They want peace, not a strike."],a:2,sen:"W: What do the workers want? &nbsp;M: They want peace, so they refuse to strike. &nbsp;W: Wise choice. &nbsp;Q: What do the workers want?",szh:"女：工人們想要什麼？　男：他們想要和平(peace)，所以拒絕(refuse)罷工(strike)。　女：明智。　問：工人們想要什麼？",en:"They want peace, not a strike.",zh:"工人要和平(peace)、拒絕(refuse)罷工(strike)，選 C。A 加薪、B 換老闆，對話都沒提。"},
{n:23,p:2,o:["They ate lunch under a tree.","They flew kites on the grass.","They played basketball and seesaw."],a:2,sen:"M: What did the children do in the park? &nbsp;W: First they were shooting baskets. Then they played on the seesaw. &nbsp;M: Sounds like a fun day. &nbsp;Q: What did the children do?",szh:"男：孩子們在公園做了什麼？　女：他們先投(shoot)籃，然後玩翹翹板(seesaw)。　男：聽起來是好玩的一天。　問：孩子們做了什麼？",en:"They played basketball and seesaw.",zh:"孩子們先投籃(shoot)，再玩翹翹板(seesaw)，選 C。A 吃午餐、B 放風箏，對話都沒提。"},
{n:24,p:2,o:["Embarrassed.","Hungry.","Excited."],a:0,sen:"W: Why is Frank's face so red? &nbsp;M: He slipped on the stairs in front of the whole class. &nbsp;W: Poor Frank. &nbsp;Q: How does Frank feel?",szh:"女：法蘭克的臉怎麼這麼紅？　男：他在全班面前從樓梯上滑倒。　女：可憐的法蘭克。　問：法蘭克覺得如何？",en:"Embarrassed.",zh:"他在全班面前滑倒，臉很紅，感覺尷尬(embarrassed)，選 A。B 餓、C 興奮，與跌倒不符。"},
{n:25,p:2,o:["It costs too much money.","It can hurt your heart.","It takes too long to cook."],a:1,sen:"M: Why should we eat less fatty food? &nbsp;W: Too much fat can hurt the heart, and even cause death. &nbsp;M: That's serious. &nbsp;Q: Why eat less fatty food?",szh:"男：為什麼要少吃油膩食物？　女：太多脂肪(fat)會傷心臟(heart)，甚至導致死亡(death)。　男：真嚴重。　問：為什麼要少吃油膩食物？",en:"It can hurt your heart.",zh:"太多脂肪(fat)會傷心臟(heart)，甚至致死(death)，選 B。A 價錢、C 烹調時間，對話都沒提。"},

{n:26,p:3,pic:true,o:[BARS("Favorite Food",["Meat","Fruit","Candy"],[20,50,80]),BARS("Favorite Food",["Meat","Fruit","Candy"],[50,80,20]),BARS("Favorite Food",["Meat","Fruit","Candy"],[80,50,20])],a:2,sen:"Our class voted for our favorite food. Among all the choices, meat got the most votes, because many students love beef and pork. Fruit was in the middle, and candy got the fewest votes, since parents say it has too much sugar. So the meat bar should be the tallest. &nbsp;Q: Which chart shows the votes?",szh:"我們班投票選最愛的食物(food)。所有選項當中(among)，肉(meat)最多票，因為很多學生愛牛肉(beef)和豬肉(pork)；水果(fruit)中等；糖果(candy)最少，因為爸媽說糖(sugar)太多。所以肉的長條最高。　問：哪張圖顯示票數？",en:"Meat most, candy least.",zh:"肉(meat)最多票、糖果(candy)最少，所以肉的長條最高，選 C。水果在中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Drinks Sold",["Milk","Tea","Cola"],[55,80,30]),BARS("Drinks Sold",["Milk","Tea","Cola"],[80,55,30]),BARS("Drinks Sold",["Milk","Tea","Cola"],[30,55,80])],a:1,sen:"Our shop counted the drinks we sold today. Milk sold the most, because it takes away hunger and is healthy. Tea was in the middle. Cola sold the least, since we told people it has too much sugar. So the milk bar is the highest and cola the lowest. &nbsp;Q: Which chart shows the drinks sold?",szh:"我們店統計今天賣出的飲料。牛奶(milk)最多，因為能解除飢餓(hunger)又健康；茶中等。可樂最少，因為我們告訴大家它糖(sugar)太多。所以牛奶最高、可樂最低。　問：哪張圖顯示飲料銷量？",en:"Milk most, cola least.",zh:"牛奶(milk)最多、可樂最少，所以牛奶最高、可樂最低，選 B。茶在中間，不是最高。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:0,
 sen:"My grandmother makes her own food from simple things like flour, butter and salt. She does not buy noodles or rice from the shop. Instead, every morning she bakes warm bread, and the whole family loves its smell. &nbsp;Q: What food does grandmother make?",
 szh:"我奶奶用麵粉(flour)、奶油(butter)和鹽(salt)這些簡單材料自己做食物(food)。她不從店裡買麵或飯，而是每天早上烤溫熱的麵包(bread)，全家都愛那香味。　問：奶奶做什麼食物？",
 en:"Bread.",zh:"奶奶做麵包(bread)，選 A。麵、飯為干擾。"},

 szh:"大餐後，我爸爸從不喝啤酒(beer)，因為要開車；晚上也避免咖啡(coffee)，否則睡不著。所以他最後總是選一杯熱茶(tea)，他說那是一天中最珍貴(precious)的飲料。　問：爸爸飯後喝什麼？",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 9 回　食物與飲料　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
