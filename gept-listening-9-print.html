<script>
/* 圖形素材（第9回 食物與飲料） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/9/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/9/p3_${n}.jpg?v=r9std-20261030" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const ICECREAM=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q1.jpg" alt="question 1 picture">`;
const MILK=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q2.jpg" alt="question 2 picture">`;
const FRUIT=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q3.jpg" alt="question 3 picture">`;
const COOKIE=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q4.jpg" alt="question 4 picture">`;
const CANDY=`<img class="pic-img p0img" src="gept-listening-img/9/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:ICECREAM,o:["She is eating chocolate ice cream.","She is eating white ice cream.","She is giving her ice cream to a friend."],a:1,sen:"For question one, look at the picture. What is the girl doing?",szh:"第一題，請看圖片。女孩在做什麼？",en:"She is eating white ice cream.",zh:"女孩拿著甜筒，正在吃白色的冰淇淋(ice cream)，正確。冰淇淋是白色的，不是巧克力口味；圖中只有她一個人，她是自己在吃，沒有把冰淇淋給朋友。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">SNACK MENU</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Candy</td><td style="text-align:right;font-weight:700">$20</td></tr><tr><td style="padding:4px 30px 4px 0">Cookie</td><td style="text-align:right;font-weight:700">$30</td></tr><tr><td style="padding:4px 30px 4px 0">Milk</td><td style="text-align:right;font-weight:700">$40</td></tr><tr><td style="padding:4px 30px 4px 0">Cereal</td><td style="text-align:right;font-weight:700">$60</td></tr><tr><td style="padding:4px 30px 4px 0">Juice</td><td style="text-align:right;font-weight:700">$70</td></tr></table></div>`,o:["He will have thirty dollars left.","He will have sixty dollars left.","He will have seventy dollars left."],a:0,sen:"For question two, look at the picture. Ben has one hundred dollars. He buys a cookie and a glass of milk. How much will he have left?",szh:"第二題，請看圖片。班有一百元。他買了一塊餅乾(cookie)和一杯牛奶(milk)。他還剩多少錢？",en:"He will have thirty dollars left.",zh:"價目表上餅乾(cookie)30元、牛奶(milk)40元，合計70元，100減70剩30元。剩六十元是只扣掉牛奶、忘了餅乾；剩七十元是只扣掉餅乾、忘了牛奶。選 A"},
{n:3,p:0,fig:FRUIT,o:["There are apples, pears, and carrots in the bowl.","There is fruit in the bowl, but there are no vegetables.","There are apples, oranges, and carrots in the bowl."],a:2,sen:"For question three, look at the picture. What is in the wooden bowl?",szh:"第三題，請看圖片。木碗裡有什麼？",en:"There are apples, oranges, and carrots in the bowl.",zh:"木碗裡有蘋果、柳橙、紅蘿蔔，還有花椰菜和番茄，正確。碗裡沒有梨子；碗裡除了水果(fruit)也有紅蘿蔔、花椰菜這些蔬菜(vegetable)，不是沒有蔬菜。選 C"},
{n:4,p:0,fig:COOKIE,o:["She is putting some cookies into the oven.","She is holding a cake, and there is butter on the table.","She is holding some cookies, and there is butter on the table."],a:2,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"She is holding some cookies, and there is butter on the table.",zh:"女士雙手端著一盤剛烤好的餅乾(cookie)對著鏡頭笑，桌上有一塊奶油(butter)，旁邊還有一大罐麵粉，正確。她端的是一片一片的餅乾，不是蛋糕；她是把餅乾端出來給人看，不是放進烤箱。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Party Food</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="90" width="44" height="60" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="85" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="96" y="70" width="44" height="80" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="65" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="45" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="228" y="110" width="44" height="40" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="105" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Cookies</text><text x="118" y="167" text-anchor="middle">Candy</text><text x="184" y="167" text-anchor="middle">Cereal</text><text x="250" y="167" text-anchor="middle">Fruit</text></g></svg>`,o:["They bought forty.","They bought sixty.","They bought fifty."],a:1,sen:"For question five, look at the picture. The class bought some candy and some fruit for a party. How many did they buy in all?",szh:"第五題，請看圖片。班上為了派對買了一些糖果(candy)和一些水果(fruit)。他們一共買了多少？",en:"They bought sixty.",zh:"圖中糖果(candy)40、水果(fruit)20，加起來60。四十只算了糖果、漏掉水果；五十是穀片(cereal)那一根，看錯項目了。選 B"},
{n:6,p:1,o:["Dinner is ready. Come and eat.","About five o'clock, I think.","Anything but beef. I don't eat it."],a:2,sen:"What kind of meat would you like for dinner?",szh:"你晚餐想吃哪一種肉？",en:"Anything but beef. I don't eat it.",zh:"問晚餐想吃哪種肉(meat)，答「牛肉(beef)以外都可以，我不吃牛肉」是在說選擇。「大約五(five)點」答的是時間；「晚餐好了，來吃吧」只重複 dinner，沒有回答問題。選 C"},
{n:7,p:1,o:["The kitchen is next to the living room.","Then let me make you something fast.","Everything in the store is on sale."],a:1,sen:"I'm so hungry I could eat everything in the kitchen.",szh:"我餓到可以把廚房裡的東西全吃光。",en:"Then let me make you something fast.",zh:"對方說餓(hungry)到能吃光一切(everything)，回「那我快(fast)點弄點東西給你吃」最自然。「廚房在客廳旁邊」只重複 kitchen；「店裡所有東西都在特價」只重複 everything，都沒回應他很餓。選 B"},
{n:8,p:1,o:["I bought it at the east market.","Steam it, and add a little salt before you serve it.","Fish is good for your heart."],a:1,sen:"How should I cook this fish?",szh:"這條魚我該怎麼煮？",en:"Steam it, and add a little salt before you serve it.",zh:"問魚要怎麼煮，答「用蒸的(steam)，上桌前(before)加一點鹽(salt)」是做法。「魚對心臟(heart)好」說的是營養，不是做法；「我在東(east)市場買的」答的是在哪裡買。選 B"},
{n:9,p:1,o:["I found something dirty in it.","Soup is my favorite food.","At a restaurant near the station."],a:0,sen:"Why didn't you finish your soup?",szh:"你為什麼沒把湯喝完？",en:"I found something dirty in it.",zh:"問為什麼沒喝完(finish)湯，答「我在裡面發現髒(dirty)東西」是原因。「在車站附近的餐廳」答的是地點；「湯是我最愛的食物(food)」只重複 soup，也和沒喝完互相矛盾。選 A"},
{n:10,p:1,o:["It's about two hours east of here.","I moved there when I was five.","Its sweet fruit and pretty beaches."],a:2,sen:"What is your hometown famous for?",szh:"你的家鄉以什麼出名？",en:"Its sweet fruit and pretty beaches.",zh:"問家鄉(hometown)以什麼出名，答「香甜的水果(fruit)和漂亮的(pretty)海灘」是特色。「我五歲搬去那裡」答的是時間；「在這裡東(east)邊大約兩小時」答的是位置。選 C"},
{n:11,p:1,o:["Everyone was at the party.","I walk my dog after dinner.","Maybe he just wants to keep your house safe."],a:2,sen:"Our dog barks at everyone who walks by.",szh:"我們家的狗會對每個經過的人吠。",en:"Maybe he just wants to keep your house safe.",zh:"對方說家裡的狗對每個經過的人吠(bark)，回「也許牠只是想保護你們家」是合理的回應。「我晚餐後遛狗」只重複 walk 和 dog；「每個人都在派對上」只重複 everyone，都和狗吠無關。選 C"},
{n:12,p:1,o:["I bought five pairs last week.","No, none of them are mine. Mine are blue.","They're on sale today."],a:1,sen:"Excuse me, are these socks yours?",szh:"不好意思，這些襪子是你的嗎？",en:"None of them. Mine are blue.",zh:"問這些襪子(sock)是不是你的(yours)，答「都不是(none)，我的是藍色的」直接回答。「今天特價」答非所問；「我上週買了五(five)雙」只是接 socks 的話題，沒說是不是他的。選 B"},
{n:13,p:1,o:["Eat less fat and more vegetables.","The doctor's office opens at nine.","My health is much better now, thanks."],a:0,sen:"How can I improve my health?",szh:"我要怎麼改善健康？",en:"Eat less fat and more vegetables.",zh:"問怎麼改善(improve)健康，答「少吃油脂(fat)、多吃蔬菜(vegetable)」是建議。「我的健康好多了，謝謝」答成自己，人物不對；「診所九點開門」答的是時間。選 A"},
{n:14,p:1,o:["It means \"Be quiet.\"","It means a lot to me.","He did it with his right hand."],a:0,sen:"What does that gesture mean?",szh:"那個手勢是什麼意思？",en:"It means \"Be quiet.\"",zh:"問那個手勢(gesture)是什麼意思，答「意思是『安靜』」直接解釋。「他用右手比的」說的是怎麼比，不是意思；「這對我意義重大」只重複 mean，意思完全不同。選 A"},
{n:15,p:1,o:["No, I'm not cold at all.","Oh, thanks. I'll be right there.","Dinner is at six every day."],a:1,sen:"Sorry to interrupt your peace and quiet, but dinner is getting cold.",szh:"抱歉打擾(interrupt)你的清靜(peace)，但晚餐要涼了。",en:"Oh, thanks. I'll be right there.",zh:"對方打斷(interrupt)你、提醒晚餐快涼了，回「喔，謝謝，我馬上來」最自然。「不，我一點都不冷」把飯菜變涼聽成人覺得冷；「晚餐每天六點」只重複 dinner，沒有回應。選 B"},
{n:16,p:2,o:["Fruit and milk.","Cereal with milk.","Fruit with sugar."],a:0,sen:"W: Do you still have cereal with milk for breakfast? &nbsp;M: Not anymore. To be frank, my doctor said it has too much sugar. &nbsp;W: So what do you eat now? &nbsp;M: Just some fruit and a glass of milk. &nbsp;Q: What does the man eat for breakfast now?",szh:"女：你早餐還是吃牛奶(milk)加穀片(cereal)嗎？　男：不吃了。老實說(frank)，醫生說它糖(sugar)太多。　女：那你現在吃什麼？　男：只吃一些水果(fruit)和一杯牛奶。　問：男士現在早餐吃什麼？",en:"Fruit and milk.",zh:"男士以前吃牛奶加穀片(cereal)，因為糖(sugar)太多不吃了，現在是水果(fruit)配一杯牛奶(milk)。穀片加牛奶是以前的早餐；糖是醫生要他少吃的東西，不是加在水果上。選 A"},
{n:17,p:2,o:["Making chicken sandwiches for lunch.","Buying fruit and milk at the store.","Packing for a picnic."],a:2,sen:"M: Is everything ready for tomorrow? &nbsp;W: Almost. I made chicken sandwiches this morning, and I have some fruit and milk, too. &nbsp;M: I'll put them in the big bag. Did you get the blanket? &nbsp;W: Yes, it's by the front door. &nbsp;M: Great. The park is far from here, so let's leave before ten. &nbsp;W: OK. I hope the weather stays nice. &nbsp;Q: What are the speakers doing?",szh:"男：明天的東西都準備好了嗎？　女：差不多了。我今天早上做了雞肉三明治，也有一些水果(fruit)和牛奶(milk)。　男：我把它們放進大袋子裡。妳拿毯子了嗎？　女：拿了，就在前門邊。　男：太好了。公園離這裡很遠，所以我們十點前出發吧。　女：好。我希望天氣一直很好。　問：說話的人在做什麼？",en:"Packing for a picnic.",zh:"兩人把雞肉(chicken)三明治、水果、牛奶和毯子放進大袋子，還要去很遠的公園，所以是在準備野餐。三明治是女士已經做好的，不是現在在做；水果和牛奶是她手上已經有的，不是去買。選 C"},
{n:18,p:2,o:["In a vegetable store.","At a restaurant.","In a kitchen."],a:2,sen:"M: The vegetables are ready. Where should I put them? &nbsp;W: On the big plate by the stove. Then wash your hands and bring the other plates here. &nbsp;M: How many people are coming tonight? &nbsp;W: Six. Mom says dinner is at seven, so we don't have much time. &nbsp;M: OK. I'll set the table in the other room now. &nbsp;Q: Where are the speakers?",szh:"男：蔬菜(vegetable)準備好了。我要放在哪裡？　女：放在爐子旁邊那個大盤子上。然後洗手，把其他盤子拿過來。　男：今晚有多少人要來？　女：六個。媽媽說晚餐七點開飯，所以我們沒有很多時間。　男：好。我現在去另一個房間擺餐桌。　問：說話的人在哪裡？",en:"In a kitchen.",zh:"爐子、盤子、剛準備好的蔬菜(vegetable)，加上「媽媽說晚餐七點」，表示兩人在家裡的廚房準備晚餐。蔬菜是自己要煮的，不是在店裡買；他們要擺自己家的餐桌，不是在餐廳。選 C"},
{n:19,p:2,o:["Sit down.","Stand up.","Raise their hands."],a:0,sen:"W: Why did the teacher make that motion with her hand? &nbsp;M: She wanted us to sit down. &nbsp;W: Oh, I thought she wanted us to stand up. &nbsp;M: No. Look, everyone else sat down. &nbsp;Q: What did the teacher want the students to do?",szh:"女：老師為什麼用手比那個動作(motion)？　男：她要我們坐下。　女：喔，我以為她要我們站起來。　男：不是，你看，其他人都坐下了。　問：老師要學生做什麼？",en:"Sit down.",zh:"老師用手比的動作(motion)是要大家坐下，女士以為是站起來，被男士更正。站起來是女士誤會的意思；舉手是看到「用手比」容易聯想的陷阱，對話沒有提到。選 A"},
{n:20,p:2,o:["Nothing.","Sugar.","Salt."],a:1,sen:"M: This soup tastes strange. &nbsp;W: Did you put salt in it? &nbsp;M: Yes, two spoons. It was in the white box. &nbsp;W: The white box? That's the sugar! &nbsp;Q: What did the man put in the soup?",szh:"男：這湯味道好奇怪。　女：你有加鹽(salt)嗎？　男：有，兩匙，在白色盒子裡的。　女：白色盒子？那是糖(sugar)！　問：男士在湯裡加了什麼？",en:"Sugar.",zh:"男士以為自己加的是鹽(salt)，但他用的是白色盒子裡的東西，女士說那是糖(sugar)，所以湯裡加的是糖。鹽是他以為加的；他加了兩匙，不是什麼都沒加。選 B"},
{n:21,p:2,o:["Four.","Three.","Seven."],a:0,sen:"W: There were seventeen cookies this morning. &nbsp;M: I ate five, and Tom ate five. &nbsp;W: And Mom took some to work. Now there are only three left. &nbsp;Q: How many cookies did Mom take?",szh:"女：今天早上有十七(seventeen)片餅乾(cookie)。　男：我吃了五(five)片，Tom 吃了五片。　女：媽媽還帶了一些去上班。現在只剩三片。　問：媽媽帶走了幾片餅乾？",en:"Four.",zh:"十七(seventeen)片減掉兩人各吃的五(five)片，剩七片；現在只剩三片，所以媽媽帶走四片。三是剩下的片數；七是媽媽拿之前剩下的片數。選 A"},
{n:22,p:2,o:["The city will refuse to pay the drivers.","The buses will run as usual.","The drivers will strike."],a:1,sen:"W: Are the bus drivers going to strike tomorrow? &nbsp;M: They wanted to, but the city agreed to pay them more. &nbsp;W: So the buses will run? &nbsp;M: Yes, just like any other day. &nbsp;Q: What will happen tomorrow?",szh:"女：公車司機明天要罷工(strike)嗎？　男：他們本來要，但市政府同意加薪了。　女：所以公車會照常開？　男：對，就跟平常一樣。　問：明天會發生什麼事？",en:"The buses will run as usual.",zh:"司機本來要罷工(strike)，但市政府同意加薪，所以明天公車照常行駛。罷工是原本的打算，已經取消；市政府是同意付錢，不是拒絕(refuse)。選 B"},
{n:23,p:2,o:["They played basketball.","They played on the seesaw.","They fixed the seesaw."],a:0,sen:"M: Did the kids play on the seesaw at the park? &nbsp;W: They wanted to, but it was broken. &nbsp;M: So what did they do? &nbsp;W: They shot baskets until dinner. &nbsp;Q: What did the kids do at the park?",szh:"男：孩子們在公園有玩翹翹板(seesaw)嗎？　女：他們想玩，但壞了。　男：那他們做了什麼？　女：他們一直投籃(shoot)到(until)晚餐時間。　問：孩子們在公園做了什麼？",en:"They played basketball.",zh:"翹翹板(seesaw)壞了沒玩成，孩子們改去投籃(shoot baskets)，換句話說就是打籃球。玩翹翹板是他們想做但沒做成的；對話沒說他們修好翹翹板。選 A"},
{n:24,p:2,o:["It is too burned to take to the party.","It will be fine after a small fix.","The man should make another cake."],a:1,sen:"M: I burned the top of my cake last night, so I'm too embarrassed to take it to the class party. &nbsp;W: Don't be. Cut off the dark part, and put some cream on top. &nbsp;M: Will that really work? &nbsp;W: Sure. Nobody will notice, and it will taste great. &nbsp;M: OK, I'll try. &nbsp;Q: What does the woman think about the cake?",szh:"男：我昨晚把蛋糕的上面烤焦了，所以我不好意思(embarrass)把它帶去班上的派對。　女：不用這樣。把黑的部分切掉，再在上面抹一些奶油(cream)。　男：那樣真的行嗎？　女：當然。沒人會發現，而且會很好吃。　男：好，我試試看。　問：女士覺得這個蛋糕怎麼樣？",en:"It will be fine after a small fix.",zh:"女士說把焦黑的部分切掉、抹上奶油(cream)，沒人會發現、還會好吃，意思是稍微修一下就沒問題。「烤得太焦不能帶去」是男士不好意思(embarrass)的想法，女士說「不用這樣」；她也沒有要他重做一個。選 B"},
{n:25,p:2,o:["Her doctor told her to stop eating meat.","To keep her heart healthy.","It doesn't taste good."],a:1,sen:"M: Why do you cut the fat off your meat? &nbsp;W: My doctor says too much fat is bad for the heart. &nbsp;M: Bad enough to cause death? &nbsp;W: Over many years, yes. So I don't take any chances with my food. &nbsp;Q: Why does the woman cut the fat off her meat?",szh:"男：你為什麼把肉(meat)上的肥肉(fat)切掉(off)？　女：醫生說太多油脂對心臟(heart)不好。　男：嚴重到會致死(death)嗎？　女：長年下來，會。所以我吃的食物(food)一點也不冒險。　問：女士為什麼把肉上的肥肉切掉？",en:"To keep her heart healthy.",zh:"女士說醫生告訴她太多油脂(fat)對心臟(heart)不好，所以切掉肥肉是為了保護心臟。她沒說肥肉不好吃；醫生只說油脂太多不好，並沒有要她不吃肉(meat)，她還是在吃肉。選 B"},
{n:26,p:3,pic:true,o:[BARS("Lunch Boxes",["Beef","Chicken","Pork"],[20,80,50]),BARS("Lunch Boxes",["Beef","Chicken","Pork"],[80,50,20]),BARS("Lunch Boxes",["Beef","Chicken","Pork"],[50,80,20])],a:2,sen:"Our school shop sells three kinds of lunch boxes: beef, chicken, and pork. Last month, the beef boxes sold the best. This month, the price of beef went up, so more students bought chicken boxes than beef ones. Among the three, pork still sold the fewest, because many students don't eat it. &nbsp;Q: Which chart shows this month's lunch box sales?",szh:"我們學校的福利社賣三種便當：牛肉(beef)、雞肉(chicken)和豬肉(pork)。上個月牛肉便當賣最好。這個月牛肉漲價，所以買雞肉便當的學生比牛肉的多。三種之中(among)，豬肉便當還是賣最少，因為很多學生不吃豬肉。　問：哪張圖是這個月的便當銷量？",en:"Chicken most, beef second, pork least.",zh:"這個月雞肉(chicken)比牛肉(beef)多，豬肉(pork)仍然最少，所以雞肉最高、牛肉第二、豬肉最低。牛肉最高的那張是上個月的情形；豬肉排第二的那張和「豬肉還是賣最少」相反。選 C"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27a'),PH('q27b')],a:0,sen:"Tom came home from school very hungry. He wanted a bowl of cereal, but the milk was finished. He saw a cold chicken leg, but it was for dinner. His mom was baking square cookies with flour, each with a flag design, but they were for a party. So Tom washed some fruit and ate it at the kitchen table. &nbsp;Q: What did Tom eat?",szh:"湯姆放學回家，餓(hungry)得不得了。他想吃一碗麥片(cereal)，但牛奶(milk)喝完了。他看到一隻冷雞腿(chicken)，但那是留給晚餐的。媽媽正用麵粉(flour)烤方形(square)餅乾，每塊都有旗子(flag)圖案(design)，但那是給派對的。所以湯姆洗了一些水果(fruit)，坐在廚房桌子旁吃。　問：湯姆吃了什麼？",en:"He ate some fruit.",zh:"麥片(cereal)因為牛奶(milk)沒了吃不成，冷雞腿(chicken)是晚餐要吃的，媽媽烤的餅乾也是給派對的，這三樣他都沒吃。最後他洗了水果(fruit)坐在桌邊吃，所以吃的是水果。 選 A"},
{n:28,p:3,pic:true,o:[PH('q28c'),PH('q28b'),PH('q28a')],a:2,sen:"Every Sunday, my grandmother cooks for the whole family. She grew up in a time of hunger, so she never wastes any food. She used to make pork dumplings, but my uncle stopped eating meat last year. Then she tried fried rice with vegetables, but my little sister refused to eat it. Now she steams big vegetable buns, and we eat them until the plate is empty. &nbsp;Q: What does the grandmother make on Sundays now?",szh:"每個星期天，我奶奶都會為全家煮飯。她在飢餓(hunger)的年代長大，所以從不浪費食物(food)。她以前包豬肉(pork)水餃，但我叔叔去年開始不吃肉(meat)。後來她試著做蔬菜(vegetable)炒飯，可是我妹妹不肯(refuse)吃。現在她蒸(steam)大顆的蔬菜包子，我們一直吃到(until)盤子空了。　問：奶奶現在星期天做什麼？",en:"Big steamed vegetable buns.",zh:"豬肉(pork)水餃是「以前」做的，因為叔叔不吃肉(meat)而停了；蔬菜炒飯因為妹妹不肯(refuse)吃也放棄；「現在」是蒸(steam)蔬菜包子。選 C"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29b'),PH('q29c')],a:2,sen:"Last spring, our class took a trip to a farm in the east. My friend Amy loved the big cows. The boys laughed at the chubby pigs and took many pictures of them. But for me, the most precious sight was a mother chicken with seven baby chickens walking behind her. &nbsp;Q: What did the speaker like best on the farm?",szh:"去年春天，我們班到東部(east)的一座農場旅行。我朋友 Amy 很喜歡那些大乳牛。男生們笑那些胖嘟嘟的(chubby)豬，還拍了很多照片。但對我來說，最珍貴的(precious)景象(sight)是一隻母雞(chicken)後面跟著七隻小雞。　問：說話者在農場最喜歡什麼？",en:"A mother chicken with her baby chickens.",zh:"大乳牛是 Amy 喜歡的；胖嘟嘟的(chubby)豬是男生們在笑、在拍的；說話者自己覺得最珍貴的(precious)景象(sight)是母雞(chicken)帶著七隻小雞。選 C"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:0,sen:"Last night, my little brother and I watched a magic show at the night market. The magic man showed us his empty black hat. Everyone thought he would take out a rabbit. But when he put his hand in, he pulled out a white chicken! Then he said, \"Now for the rabbit,\" but all he took out was some flowers. &nbsp;Q: What came out of the hat first?",szh:"昨晚我和弟弟在夜市看魔術(magic)表演。魔術師讓我們看他空空的黑帽子。大家都以為他會拿出一隻兔子。可是他把手伸進去，拉出來的是一隻白色的雞(chicken)！接著他說：「現在輪到兔子了」，結果拿出來的只有一些花。　問：帽子裡第一個出來的是什麼？",en:"A white chicken.",zh:"大家以為會出現兔子，但第一個拉出來的是一隻白雞(chicken)；後來說要變兔子，拿出來的卻是花。兔子從頭到尾都沒出現；花是第二個出來的，不是第一個。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 9 回　食物與飲料　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
