 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);

const FRUIT=`<svg width="120" height="100" viewBox="0 0 120 102"><path d="M18 60 q42 30 84 0 q-4 26 -42 26 q-38 0 -42 -26 z" fill="#e0c19a" stroke="#1a1a1a" stroke-width="2"/><circle cx="40" cy="46" r="16" fill="#e53935" stroke="#1a1a1a" stroke-width="2"/><path d="M40 30 q3 -6 8 -4" fill="none" stroke="#43a047" stroke-width="2"/><circle cx="70" cy="42" r="17" fill="#ffb703" stroke="#1a1a1a" stroke-width="2"/><path d="M84 34 q14 -6 20 4 q-14 4 -20 -4" fill="#ffe08a" stroke="#1a1a1a" stroke-width="1.5"/></svg>`;
const COOKIE=`<svg width="104" height="102" viewBox="0 0 104 104"><circle cx="52" cy="52" r="40" fill="#d9a05b" stroke="#1a1a1a" stroke-width="2.5"/><g fill="#5a3a1b"><circle cx="40" cy="38" r="4"/><circle cx="64" cy="44" r="4"/><circle cx="50" cy="62" r="4"/><circle cx="70" cy="66" r="3.5"/><circle cx="34" cy="58" r="3.5"/><circle cx="60" cy="28" r="3"/></g></svg>`;
const CANDY=`<svg width="120" height="86" viewBox="0 0 120 88"><ellipse cx="60" cy="44" rx="26" ry="20" fill="#ff6f91" stroke="#1a1a1a" stroke-width="2.5"/><path d="M34 44 L14 30 L18 44 L14 58 Z" fill="#ff9ab0" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><path d="M86 44 L106 30 L102 44 L106 58 Z" fill="#ff9ab0" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/><g stroke="#fff" stroke-width="3"><line x1="50" y1="34" x2="58" y2="54"/><line x1="62" y1="34" x2="70" y2="54"/></g></svg>`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:ICECREAM,o:["The girl eats ice cream made with cream and sugar.","The chef fries beef, pork and chicken.","Milk and cereal are on the table."],a:0,
 sen:"For question one, look at the picture. What is the girl eating?",szh:"第一題，請看圖片。女孩在吃什麼？",
 en:"Ice cream with cream and sugar.",zh:"女孩吃用鮮奶油(cream)和糖(sugar)做的冰淇淋(ice cream)，選 A。beef/pork/chicken、milk/cereal 為干擾。"},
{n:2,p:0,fig:MILK,o:["The candy is on a square plate.","A magic flag waves before the crowd.","Fresh milk, good food for a hungry child."],a:2,
 sen:"For question two, look at the picture. What is in the glass?",szh:"第二題，請看圖片。杯子裡是什麼？",
 en:"Fresh milk, food for a hungry child.",zh:"杯裡是新鮮牛奶(milk)，是給飢餓(hungry)孩子的好食物(food)，選 C。candy/square、magic/flag/before 為干擾。"},
{n:3,p:0,fig:FRUIT,o:["The socks are dirty among the plates.","In the bowl are fruit and vegetables, not meat.","He shoots the ball off the seesaw."],a:1,
 sen:"For question three, look at the picture. What is in the bowl?",szh:"第三題，請看圖片。碗裡是什麼？",
 en:"Fruit and vegetables, not meat.",zh:"碗裡是水果(fruit)和蔬菜(vegetable)，不是肉(meat)，選 B。sock/dirty/among、shoot/off/seesaw 為干擾。"},
{n:4,p:0,fig:COOKIE,o:["She baked cookies with flour, butter and a little salt.","The frank man made a rude gesture.","None of the fruit is yours."],a:0,
 sen:"For question four, look at the picture. What did she bake?",szh:"第四題，請看圖片。她烤了什麼？",
 en:"Cookies with flour, butter and salt.",zh:"她用麵粉(flour)、奶油(butter)和一點鹽(salt)烤餅乾(cookie)，選 A。frank/gesture、none/yours 為干擾。"},
{n:5,p:0,fig:CANDY,o:["The pork improves in the east.","She interrupts the peace.","Sweet candy and a chubby cereal bar are on the plate."],a:2,
 sen:"For question five, look at the picture. What is on the plate?",szh:"第五題，請看圖片。盤子上是什麼？",
 en:"Candy and a chubby cereal bar.",zh:"盤上是甜糖果(candy)和一條胖胖(chubby)的穀物(cereal)棒，選 C。pork/improve/east、interrupt/peace 為干擾。"},

{n:6,p:1,o:["The magic show has a square design.","Beef or pork, please, but no chicken fat.","None of it is yours."],a:1,
 sen:"What meat would you like for dinner?",szh:"晚餐你想吃什麼肉？",
 en:"Beef or pork, no chicken fat.",zh:"問想吃什麼肉(meat)，答『牛肉(beef)或豬肉(pork)，但不要雞(chicken)的肥油(fat)』，選 B。magic/square/design、none/yours 為干擾。"},
{n:7,p:1,o:["Yes, my hunger is huge; I could eat everything.","The flag waves in the east.","The sock is dirty."],a:0,
 sen:"Are you hungry after the long trip?",szh:"長途旅行後你餓了嗎？",
 en:"So hungry; I could eat everything.",zh:"問是否餓(hungry)，答『對，我的飢餓(hunger)感很強，什麼(everything)都吃得下』，選 A。flag/east、sock/dirty 為干擾。"},
{n:8,p:1,o:["He shoots off the seesaw.","The peace is precious.","Steam it first, before you add salt and sugar."],a:2,
 sen:"How should I cook this fish?",szh:"這條魚我該怎麼煮？",
 en:"Steam it before adding salt and sugar.",zh:"問怎麼煮魚，答『先蒸(steam)，之後(before)再加鹽(salt)和糖(sugar)』，選 C。shoot/off/seesaw、peace/precious 為干擾。"},
{n:9,p:1,o:["The magic flag is pretty.","It is too dirty, so I refuse to finish it.","Among the fruit, none is fresh."],a:1,
 sen:"Why won't you finish your soup?",szh:"你為什麼不把湯喝完？",
 en:"Too dirty; I refuse to finish it.",zh:"問為何不喝完(finish)，答『太髒(dirty)了，我拒絕(refuse)喝完』，選 B。magic/flag/pretty、among/none 為干擾。"},
{n:10,p:1,o:["My hometown is famous for fruit and candy; a precious, pretty place.","The dog barks off the seesaw.","He made a fast motion."],a:0,
 sen:"What is your hometown famous for?",szh:"你的家鄉以什麼聞名？",
 en:"Fruit and candy; a precious, pretty place.",zh:"問家鄉(hometown)以什麼聞名，答『水果(fruit)和糖果(candy)，是個珍貴(precious)又美麗(pretty)的地方』，選 A。bark/off/seesaw、fast/motion 為干擾。"},
{n:11,p:1,o:["The beef is fat.","He refused the milk.","A square flag, and a red heart design."],a:2,
 sen:"What did the magic show have on stage?",szh:"魔術表演的舞台上有什麼？",
 en:"A square flag and a heart design.",zh:"問魔術(magic)表演舞台上有什麼，答『一面方形(square)旗(flag)，還有一個紅心(heart)圖案(design)』，選 C。beef/fat、refuse/milk 為干擾。"},
{n:12,p:1,o:["The cereal is salty.","Among all the socks, none of them is yours.","He ate everything before noon."],a:1,
 sen:"Excuse me, is this my sock?",szh:"不好意思，這是我的襪子嗎？",
 en:"Among the socks, none is yours.",zh:"問襪子(sock)是不是他的，答『這些襪子當中(among)，沒有一雙(none)是你的(yours)』，選 B。cereal、everything/before 為干擾。"},
{n:13,p:1,o:["Eat less fat, and do not eat until you feel too full.","The flag is off.","The chicken is dirty."],a:0,
 sen:"How can I improve my health?",szh:"我要怎麼改善健康？",
 en:"Eat less fat; do not eat until too full.",zh:"問怎麼改善(improve)健康，答『少吃脂肪(fat)，別吃到(until)太飽』，選 A。flag/off、chicken/dirty 為干擾。"},
{n:14,p:1,o:["The candy is precious.","He steamed the pork.","It saw a cat off in the east and made a fast motion, then barked."],a:2,
 sen:"Why did the dog run away so quickly?",szh:"狗為什麼跑得那麼快？",
 en:"It saw a cat and made a fast motion.",zh:"問狗為何跑，答『牠看到遠處(off)東邊(east)一隻貓，快速(fast)動了一下(motion)，然後叫(bark)』，選 C。candy/precious、steam/pork 為干擾。"},
{n:15,p:1,o:["The ice cream is precious.","To be frank, please do not interrupt me with rude gestures.","None of the flags is square."],a:1,
 sen:"What did the honest man ask the crowd?",szh:"那位誠實的人請大家做什麼？",
 en:"Frankly, do not interrupt with rude gestures.",zh:"問誠實的人說什麼，答『坦白(frank)說，請別用無禮的手勢(gesture)打斷(interrupt)我』，選 B。ice cream/precious、none/square 為干擾。"},

{n:16,p:2,o:["Milk and cereal.","Beef and rice.","Fruit and candy."],a:0,
 sen:"W: What do you eat for breakfast? &nbsp;M: Usually milk and cereal; it is quick and healthy. &nbsp;W: Sounds good. &nbsp;Q: What does the man eat for breakfast?",
 szh:"女：你早餐吃什麼？　男：通常是牛奶(milk)加穀片(cereal)，又快又健康。　女：不錯。　問：男士早餐吃什麼？",
 en:"Milk and cereal.",zh:"男士早餐吃牛奶(milk)加穀片(cereal)，選 A。"},
{n:17,p:2,o:["Chicken.","Fish.","Beef, but not pork."],a:2,
 sen:"M: Which meat does your family like? &nbsp;W: We love beef, but we never eat pork. &nbsp;M: I see. &nbsp;Q: What meat does the family like?",
 szh:"男：你家喜歡吃什麼肉？　女：我們愛牛肉(beef)，但從不吃豬肉(pork)。　男：了解。　問：這家人喜歡什麼肉？",
 en:"Beef, not pork.",zh:"這家人愛牛肉(beef)、不吃豬肉(pork)，選 C。"},
{n:18,p:2,o:["A cookie.","Ice cream with sugar on top.","A salty snack."],a:1,
 sen:"W: What do you want for dessert? &nbsp;M: Ice cream, please, with a little sugar on top. &nbsp;W: Yummy. &nbsp;Q: What does the man want for dessert?",
 szh:"女：你甜點想吃什麼？　男：冰淇淋(ice cream)，上面加一點糖(sugar)。　女：好吃。　問：男士甜點想吃什麼？",
 en:"Ice cream with sugar.",zh:"男士甜點想吃加糖(sugar)的冰淇淋(ice cream)，選 B。"},
{n:19,p:2,o:["More vegetables and fruit.","More meat.","More candy."],a:0,
 sen:"M: How can I eat in a healthier way? &nbsp;W: Eat more vegetables and fruit every day. &nbsp;M: I will try. &nbsp;Q: What should the man eat more of?",
 szh:"男：我要怎麼吃得更健康？　女：每天多吃蔬菜(vegetable)和水果(fruit)。　男：我會試試。　問：男士該多吃什麼？",
 en:"More vegetables and fruit.",zh:"該多吃蔬菜(vegetable)和水果(fruit)，選 A。"},
{n:20,p:2,o:["Add more salt.","Add butter.","Add sugar, not salt."],a:2,
 sen:"W: The tea tastes bitter. What should I add? &nbsp;M: Add sugar, not salt, to make it sweet. &nbsp;W: Good idea. &nbsp;Q: What should the woman add?",
 szh:"女：這茶好苦，我該加什麼？　男：加糖(sugar)，不是鹽(salt)，讓它變甜。　女：好主意。　問：女士該加什麼？",
 en:"Sugar, not salt.",zh:"該加糖(sugar)不是鹽(salt)，選 C。"},
{n:21,p:2,o:["Seventeen.","Five.","About seventeen, in five boxes."],a:1,
 sen:"M: How many cookies are left? &nbsp;W: Only five now; we started with seventeen. &nbsp;M: We ate a lot! &nbsp;Q: How many cookies are left?",
 szh:"男：還剩幾片餅乾？　女：現在只剩五(five)片；我們一開始有十七(seventeen)片。　男：我們吃了不少！　問：還剩幾片餅乾？",
 en:"Five.",zh:"還剩五(five)片，選 B。原本十七(seventeen)片是起始數(干擾)。"},
{n:22,p:2,o:["They want peace, and refuse to strike.","They want war.","They want candy."],a:0,
 sen:"W: What do the workers want? &nbsp;M: They want peace, so they refuse to strike. &nbsp;W: Wise choice. &nbsp;Q: What do the workers want?",
 szh:"女：工人們想要什麼？　男：他們想要和平(peace)，所以拒絕(refuse)罷工(strike)。　女：明智。　問：工人們想要什麼？",
 en:"Peace; they refuse to strike.",zh:"工人要和平(peace)、拒絕罷工(strike)，選 A。"},
{n:23,p:2,o:["Read a book.","Eat cereal.","Shoot baskets and play on the seesaw."],a:2,
 sen:"M: What did the children do in the park? &nbsp;W: They shot some baskets and played on the seesaw. &nbsp;M: Fun day. &nbsp;Q: What did the children do?",
 szh:"男：孩子們在公園做什麼？　女：他們投(shoot)籃，還玩了翹翹板(seesaw)。　男：好玩的一天。　問：孩子們做了什麼？",
 en:"Shot baskets and played on the seesaw.",zh:"孩子投(shoot)籃、玩翹翹板(seesaw)，選 C。"},
{n:24,p:2,o:["A lovely sight.","An embarrassing sight of him falling.","A peaceful scene."],a:1,
 sen:"W: Why is your brother's face so red? &nbsp;M: It was an embarrassing sight; he fell in front of everyone. &nbsp;W: Poor him. &nbsp;Q: Why is the brother embarrassed?",
 szh:"女：你弟弟的臉怎麼這麼紅？　男：那是很尷尬(embarrass)的畫面(sight)，他當眾跌倒。　女：真可憐。　問：弟弟為什麼尷尬？",
 en:"An embarrassing sight of falling.",zh:"那是很尷尬(embarrass)的畫面(sight)，選 B。"},
{n:25,p:2,o:["Too much fat can hurt the heart, even cause death.","Fruit is precious.","Milk is white."],a:0,
 sen:"M: Why should we eat less fatty food? &nbsp;W: Too much fat can hurt the heart, and even cause death. &nbsp;M: That's serious. &nbsp;Q: Why eat less fatty food?",
 szh:"男：為什麼要少吃油膩食物？　女：太多脂肪(fat)會傷心臟(heart)，甚至導致死亡(death)。　男：真嚴重。　問：為什麼要少吃油膩食物？",
 en:"Fat hurts the heart, causes death.",zh:"脂肪(fat)傷心臟(heart)、甚至致死(death)，選 A。"},

{n:26,p:3,pic:true,o:[BARS("Favorite Food",["Meat","Fruit","Candy"],[20,50,80]),BARS("Favorite Food",["Meat","Fruit","Candy"],[50,80,20]),BARS("Favorite Food",["Meat","Fruit","Candy"],[80,50,20])],a:2,
 sen:"Our class voted for our favorite food. Meat got the most votes, because many students love beef and pork. Fruit was in the middle, and candy got the fewest votes, since parents say it has too much sugar. So the meat bar should be the tallest. &nbsp;Q: Which chart shows the votes?",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 9 回　食物與飲料　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
