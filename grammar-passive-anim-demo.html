<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>被動式動畫 Demo（實驗版）</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    color:#22303f;line-height:1.65;background:linear-gradient(180deg,#eef6ff,#fff4f7 70%);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 70px;}
  .note{background:#fff3e8;border:1px solid #ffd8b8;border-radius:14px;padding:14px 18px;margin-bottom:20px;
    font-size:.92rem;color:#8a5a25;}
  .note b{color:#c9611a;}
  .narrowNote{display:none;background:#fff0f3;border:1px solid #ffc3d2;border-radius:14px;padding:12px 16px;
    margin-bottom:16px;font-size:.88rem;color:#c2568f;}
  @media (max-width:899px){ .narrowNote{display:block;} }

  header.hero{background:linear-gradient(135deg,#f6d365,#fda085 55%,#ffb199);color:#5c3410;
    border-radius:22px;padding:26px 26px;margin-bottom:24px;box-shadow:0 10px 26px rgba(253,160,133,.4);}
  header.hero h1{margin:0 0 8px;font-size:1.6rem;}
  header.hero p{margin:0;font-size:.94rem;opacity:.95;}

  .q{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:20px;
    box-shadow:0 4px 14px rgba(43,140,255,.10);border:1px solid #eef1f8;}
  .qtop{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
  .qnum{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#ffe9d6;color:#c9611a;
    font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;}
  .tagk{margin-left:auto;flex:0 0 auto;display:inline-block;font-size:.75rem;font-weight:800;color:#fff;
    border-radius:99px;padding:3px 11px;background:linear-gradient(135deg,#ff9a4d,#ff6ea9);}

  .lineLab{font-size:.72rem;font-weight:800;color:#8a94a2;background:#f0f3f8;border-radius:8px;
    padding:1px 8px;margin-right:8px;vertical-align:2px;display:inline-block;}

  .activeLine{font-size:1.15rem;padding:14px 16px;background:#fffaf3;border:1.5px dashed #ffcfa0;
    border-radius:12px;margin-bottom:12px;line-height:1.9;}
  .buildLine{font-size:1.15rem;padding:14px 16px;background:#f7fbff;border:1.5px solid #dcecff;
    border-radius:12px;line-height:1.9;min-height:1.9em;}

  .wSubj,.wObj{cursor:default;border-radius:6px;padding:1px 5px;font-weight:800;transition:opacity .35s .1s,text-decoration-color .35s;}
  .wSubj{background:#fff0e0;color:#c9611a;}
  .wObj{background:#e8f4ff;color:#1a6fc9;}
  .wSubj.used,.wObj.used{opacity:.3;text-decoration:line-through;}
  .verbOld{font-weight:700;color:#5a6472;transition:opacity .3s;}
  .verbOld.used{opacity:.25;text-decoration:line-through;}

  .slotNewSubj,.slotVerb,.slotAgent{font-weight:900;border-radius:6px;padding:1px 7px;opacity:0;transition:opacity .25s;}
  .slotNewSubj.show,.slotVerb.show,.slotAgent.show{opacity:1;}
  .slotNewSubj{background:#e8f4ff;color:#1a6fc9;}
  .slotVerb{background:#eafaf2;color:#0f7a52;}
  .slotAgent{background:#fff0e0;color:#c9611a;}

  .flyClone{position:fixed;font-weight:900;padding:1px 7px;border-radius:6px;white-space:nowrap;
    z-index:999;pointer-events:none;will-change:left,top;}

  .stepbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;}
  .hintk{font-size:.78rem;color:#8a94a2;font-weight:800;}
  .sbtn{border:none;cursor:pointer;font-weight:800;font-size:.84rem;padding:10px 16px;border-radius:12px;
    color:#fff;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 3px 9px rgba(0,0,0,.14);}
  .sbtn:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .sbtn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .sbtn .sn{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;
    background:rgba(255,255,255,.34);color:#fff;font-size:.72rem;font-weight:900;}
  .sbtn.b1{background:linear-gradient(135deg,#2ab7ff,#4fd1ff);}
  .sbtn.b2{background:linear-gradient(135deg,#a855ff,#c98bff);}
  .sbtn.b3{background:linear-gradient(135deg,#ff8a1e,#ffb347);}
  .sbtn.on{box-shadow:0 0 0 3px rgba(255,255,255,.85),0 5px 14px rgba(0,0,0,.22);}
  .replay{border:none;cursor:pointer;font-weight:800;font-size:.8rem;padding:8px 14px;border-radius:12px;
    color:#c9611a;background:#fff3e8;margin-left:auto;}

  footer{text-align:center;color:#9aa4b2;font-size:.8rem;margin-top:34px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>🧪 被動式「移動動畫」實驗 Demo</h1>
    <p>受詞真的飛到句首變新主詞、主詞真的飛到句尾變 by+受詞——不是文字淡入，是位置移動。這頁只是給老師看效果用的實驗版，還沒正式上線。</p>
  </header>

  <div class="narrowNote">📱 螢幕較窄，這裡先顯示「直接跳到結果」版本（不做飛行動畫）。想看完整移動動畫效果，請用電腦或平板（寬度 ≥900px）打開這頁。</div>

  <div class="note">👆 點下面的「1 / 2 / 3」按鈕，注意觀察：<b>藍色的受詞</b>會飛到句首變新主詞，<b>橘色的主詞</b>會飛到句尾變 by+受格，<b>動詞</b>原地變成 be+過去分詞。</div>

  <div id="app"></div>

  <footer>EFETL © 2025　‧　實驗版，僅供評估，尚未正式上線</footer>
</div>

<script>
const WIDE = window.matchMedia('(min-width:900px)').matches;

const DEMO = [
 {tag:"現在簡單式",
  subj:"Tom", verb:"cleans", obj:"the room", tail:" every day.",
  newSubj:"The room", newVerb:"is cleaned", agent:"by Tom"},
 {tag:"過去簡單式（不規則動詞）",
  subj:"She", verb:"wrote", obj:"this letter", tail:".",
  newSubj:"This letter", newVerb:"was written", agent:"by her"},
 {tag:"情態助動詞 must",
  subj:"The manager", verb:"must sign", obj:"this form", tail:".",
  newSubj:"This form", newVerb:"must be signed", agent:"by the manager"}
];

const app = document.getElementById("app");
let html = '';
DEMO.forEach((d,i)=>{
  html +=
  '<div class="q" data-i="'+i+'">'+
    '<div class="qtop"><span class="qnum">'+(i+1)+'</span><span class="tagk">'+d.tag+'</span></div>'+
    '<div><span class="lineLab">主動</span></div>'+
    '<div class="activeLine">'+
      '<span class="wSubj" data-role="subj">'+d.subj+'</span> '+
      '<span class="verbOld" data-role="verb">'+d.verb+'</span> '+
      '<span class="wObj" data-role="obj">'+d.obj+'</span>'+d.tail+
    '</div>'+
    '<div><span class="lineLab">被動</span></div>'+
    '<div class="buildLine">'+
      '<span class="slotNewSubj" data-slot="subj">'+d.newSubj+'</span> '+
      '<span class="slotVerb" data-slot="verb">'+d.newVerb+'</span> '+
      '<span class="slotAgent" data-slot="agent">'+d.agent+'</span>'+d.tail+
    '</div>'+
    '<div class="stepbtns">'+
      '<span class="hintk">一步一步點：</span>'+
      '<button class="sbtn b1" type="button" data-s="1"><span class="sn">1</span>受詞飛到句首</button>'+
      '<button class="sbtn b2" type="button" data-s="2"><span class="sn">2</span>動詞變 be+p.p.</button>'+
      '<button class="sbtn b3" type="button" data-s="3"><span class="sn">3</span>主詞飛到句尾</button>'+
      '<button class="replay" type="button" data-replay="'+i+'">↺ 重播</button>'+
    '</div>'+
  '</div>';
});
app.innerHTML = html;

function flyText(sourceEl, destEl, colorClass){
  const startRect = sourceEl.getBoundingClientRect();
  const endRect = destEl.getBoundingClientRect();
  const clone = document.createElement('span');
  clone.className = 'flyClone ' + colorClass;
  clone.textContent = destEl.textContent;
  clone.style.left = startRect.left + 'px';
  clone.style.top = startRect.top + 'px';
  clone.style.fontSize = getComputedStyle(sourceEl).fontSize;
  document.body.appendChild(clone);
  requestAnimationFrame(()=>{
    clone.style.transition = 'left .65s cubic-bezier(.22,.85,.3,1), top .65s cubic-bezier(.22,.85,.3,1)';
    clone.style.left = endRect.left + 'px';
    clone.style.top = endRect.top + 'px';
  });
  const done = ()=>{ clone.remove(); destEl.classList.add('show'); };
  clone.addEventListener('transitionend', done, {once:true});
  setTimeout(done, 800); // safety fallback
}

function resetCard(card){
  card.querySelectorAll('.sbtn').forEach(b=>{ b.classList.remove('on'); b.disabled = false; });
  card.querySelectorAll('.slotNewSubj,.slotVerb,.slotAgent').forEach(s=>s.classList.remove('show'));
  card.querySelectorAll('.wSubj,.wObj,.verbOld').forEach(s=>s.classList.remove('used'));
  card.dataset.step = '0';
}

app.addEventListener('click',(ev)=>{
  const rp = ev.target.closest('.replay');
  if(rp){ resetCard(rp.closest('.q')); return; }

  const b = ev.target.closest('.sbtn');
  if(!b) return;
  const card = b.closest('.q');
  const s = +b.dataset.s;
  const cur = +(card.dataset.step || 0);
  if(s !== cur+1) return; // 只允許照順序 1→2→3
  card.dataset.step = s;
  b.classList.add('on');
  b.disabled = true;

  if(s===1){
    const obj = card.querySelector('[data-role="obj"]');
    const slot = card.querySelector('[data-slot="subj"]');
    if(WIDE){ flyText(obj, slot, 'wObj'); }
    else { slot.classList.add('show'); }
    obj.classList.add('used');
  } else if(s===2){
    const verb = card.querySelector('[data-role="verb"]');
    const slot = card.querySelector('[data-slot="verb"]');
    verb.classList.add('used');
    slot.classList.add('show');
  } else if(s===3){
    const subj = card.querySelector('[data-role="subj"]');
    const slot = card.querySelector('[data-slot="agent"]');
    if(WIDE){ flyText(subj, slot, 'wSubj'); }
    else { slot.classList.add('show'); }
    subj.classList.add('used');
  }
});
</script>
</body>
</html>
