<script>
const P=[{"id":"p1","name":"卷一　錯題彙整卷","sub":"阿摩全站正確率最低的 50 題","desc":"取材自 110–115 年真實試卷，依阿摩公開作答統計計算「全站正確率」，挑出五法中最多人答錯的 50 題。每題標示正確率、作答人數與 ABCD 選答分布，錯得越兇的排越前面。","real":true,"qs":[{"s":"依郵政法規定，有關郵件種類、資費之交付、補償金額等事項之規則，下列敘述何者正確？","o":{"A":"由中華郵政公司自行訂定","B":"由中華郵政公司擬訂","C":"由行政院核定","D":"由立法院制定"},"a":"C","e":"《郵政法》§48 明定：郵件種類、定義、處理程序、交寄、資費之交付、載運、投遞與查詢補償確定之程序、金額與其方法、禁寄物品之種類與其處分方法等事項之規則，<b>由主管機關（交通部）擬訂，報請行政院核定之</b>。所以「擬訂」是交通部、「核定」是行政院，兩者不可混淆。中華郵政公司只是被規範的對象，不能自行訂定，也不是由立法院制定（那是法律，不是規則）。<b>口訣：規則＝交通部擬訂、行政院核定。</b>","law":"郵政法","meta":"111 年真題．全站正確率 59%．4,169 人次．官方參考答案","acc":0.592,"dist":[333,1350,2469,17]},{"s":"依郵政法規定，有關郵政公用物之敘述，下列何者錯誤？","o":{"A":"郵政服務人員為遞送郵政公用物，經過道路時有優先通行權","B":"中華郵政公司供遞送郵件業務使用之郵政公用物免納一切稅捐","C":"郵政公用物，非依法律，不得作為徵收之標的","D":"郵政公用物在航運發生海難時，不分擔共同海損"},"a":"D","e":"(D) 錯在主體。《郵政法》§9 第2項規定不分擔共同海損的是「<b>郵件</b>」，不是「郵政公用物」。(A) §27 郵政服務人員為遞送郵件<b>或郵政公用物</b>經過道路、橋樑、海關、渡口有優先通行權，正確。(B) §9 第1項供<b>遞送郵件業務</b>使用之郵政公用物免納一切稅捐，正確。(C) §8 郵件、郵政資產、郵政款項及郵政公用物，非依法律不得作為檢查、徵收或扣押之標的，正確。<b>陷阱：海難不分擔共同海損的主體只有「郵件」。</b>","law":"郵政法","meta":"115 年真題．全站正確率 65%．2,769 人次．阿摩統計","acc":0.65,"dist":[498,213,258,1800]},{"s":"依郵政法規定，非由中華郵政公司自行訂定資費之郵件為下列何者？","o":{"A":"逾 500 公克之國內信函","B":"國際信函","C":"國內快捷郵件","D":"國內包裹"},"a":"A","e":"《郵政法》§14：<b>§6 第1項專營範圍內文件的資費</b>（明信片、郵簡、信函），由中華郵政公司擬訂、報請交通部核定；<b>其餘郵件資費由中華郵政公司自行訂定</b>。§6 專營的信函限「單件重量 500 公克以下或資費不逾 13 倍基礎郵資」，因此<b>逾 500 公克的國內信函已不在專營範圍</b>—但注意題目問「非由公司自行訂定者」，答案是 (A)。這題極易誤選 (B)：國際信函屬跨境文件，<b>不在專營範圍</b>，故由公司自行訂定。<b>記法：只有專營的明信片、郵簡、信函要報交通部核定。</b>","law":"郵政法","meta":"110 年真題．全站正確率 66%．9,211 人次．阿摩統計","acc":0.661,"dist":[6089,1924,632,566]},{"s":"日前經新聞媒體揭露，某甲郵差於遞送途中掉落一郵件，被乙民眾拾獲，案關郵件經甲郵局報警後， 警察於乙民眾家中尋獲該郵件，請問本案依郵政法得如何處置？","o":{"A":"由警察局依郵政法第 38 條有關隱匿他人之郵件，處拘役或新臺幣九萬元以下罰金","B":"由交通部依郵政法第 38 條有關隱匿他人之郵件，處拘役或新臺幣九萬元以下罰金","C":"由警察局依郵政法第 39 條誤收他人之郵件，故意不返還者，處新臺幣二千元以上一萬元以下罰鍰","D":"由交通部依郵政法第 39 條誤收他人之郵件，故意不返還者，處新臺幣二千元以上一萬元以下罰鍰"},"a":"B","e":"兩層次要分開看：①<b>行為態樣</b>—民眾把撿到的郵件藏在家裡，是「<b>隱匿他人之郵件</b>」，適用 §38（處拘役或新臺幣 9 萬元以下罰金），而非 §39「誤收他人郵件故意不返還」（那是罰鍰 2 千～1 萬元）。②<b>處罰機關</b>—郵政法第五章罰則所定之罰鍰及處罰，由< 由公司自行訂定</b>。§70（郵件處理規則）並補充所稱資費指明信片、郵簡、信函之<b>普通資費</b>，不含特別處理費。故選 (C)。<b>背三樣：明信片、郵簡、信函。</b>","law":"郵政法","meta":"考點：資費核定權（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政法第 6 條規定，除中華郵政公司及受其委託者外，下列何者「得」由民營運送業者以遞送為營業？","o":{"A":"某私人公司交寄之國內信函，單件重量 480 公克","D":"某市政府交寄之國內信函，單件重量 300 公克","B":"某民眾交寄之國內明信片","C":"某私人公司交寄之國內小包，單件重量 800 公克"},"a":"C","e":"§6 第1項專營範圍：①<b>明信片</b> ②<b>郵簡</b> ③<b>信函</b>—信函又分兩類：政府機關（構）、公立學校、公法人、公營事業機構或軍事單位所交寄者<b>不論輕重一律專營</b>；其他人交寄者則以<b>單件重量 500 公克以下或單件資費不逾 13 倍基礎郵資</b>為限。(A) 480 公克在專營內、(D) 市政府交寄一律專營、(B) 明信片專營。<b>小包不在專營之列</b>，民營業者可送，故選 (C)。另 §6 第2項：運送業者除<b>附送與貨物有關之通知</b>外，不得遞送上述文件。","law":"郵政法","meta":"考點：專營權範圍（6 年連續）．近 6 年出現 6/6 年"},{"s":"甲於 115 年 3 月 1 日交寄掛號包裹，該包裹於運送途中全部遺失。依郵政法規定，下列敘述何者正確？","o":{"A":"甲之補償請求權自 115 年 3 月 1 日起算，逾 3 個月不行使而消滅","D":"甲之補償請求權自 115 年 3 月 1 日起算，逾 6 個月不行使而消滅","B":"甲之補償請求權自 115 年 3 月 2 日起算，逾 6 個月不行使而消滅","C":"甲之補償請求權自收到補償金確定通知之日起算，逾 6 個月不行使而消滅"},"a":"D","e":"郵政法 §34：寄件人或收件人之<b>補償請求權，自「郵件交寄之日」起，逾 6 個月</b>不行使而消滅（起算點是<b>交寄日當日</b>，不是次日；「次日起算 6 個月」是郵件處理規則 §60 的<b>查詢期限</b>，兩者常被混考）。另 §34 第2項：於該期間內曾向公司<b>查詢該郵件者，以已經請求補償論</b>。(C) 是 §35 的<b>補償金請求權（5 年）</b>。","law":"郵政法","meta":"考點：補償時效（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政法規定，下列何種情形，寄件人「仍得」向中華郵政公司請求補償？","o":{"D":"保價郵件因戰事致有損失","B":"包裹因內裝水果之性質腐壞致損失","C":"郵件內裝禁寄物品致全部遺失","A":"收件人無異議接受郵件後始發現內裝物短少"},"a":"D","e":"郵政法 §31 列舉<b>不得請求補償</b>六款：①郵件之性質或瑕疵 ②天災事變或其他不可抗力，<b>但保價郵件以因戰事致有損失為限（＝保價郵件因戰事仍可請求補償）</b> ③在外國境內損失依該國法規不負補償責任 ④禁寄物品 ⑤未妥為封裝經告知仍未改善 ⑥收件人無異議接受郵件。故 (D) 為例外中的例外，可請求補償。<b>這是六年來最愛出的『例外中的例外』：颱風地震→不賠；但保價郵件遇戰事→要賠。</b>","law":"郵政法","meta":"考點：不得請求補償之事由（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政法規定，中華郵政公司或其服務人員得開拆他人郵件之要件，下列敘述何者錯誤？","o":{"B":"須有事實足認內裝之物為郵政禁寄物品、不適用優惠資費或違反郵政法規","D":"須經寄件人或收件人同意","C":"開拆查驗後應予驗訖之證明","A":"寄件人或收件人不同意開拆時，中華郵政公司仍應接受並遞送該郵件"},"a":"A","e":"郵政法 §10：原則<b>不得開拆</b>；例外須「<b>有事實足認</b>（禁寄物品／不適用優惠資費／違反郵政法規）」<b>且經寄件人或收件人同意</b>，兩要件缺一不可；開拆後<b>應予驗訖之證明</b>。第2項後段明定：<b>寄件人或收件人不同意開拆時，中華郵政公司「得拒絕接受或遞送」該郵件</b>，故 (A) 錯誤。<b>重點：不給拆＝可以不收、不送。</b>","law":"郵政法","meta":"考點：開拆查驗（6 年連續）．近 6 年出現 6/6 年"},{"s":"某物流公司未經中華郵政公司同意，在其貨車車身噴上「快遞郵局」字樣招攬業務。依郵政法規定，其法律效果為何？","o":{"B":"處新臺幣 2 萬元以上 10 萬元以下罰鍰，並令其限期改善；屆期不改善者，得按次連續處罰","D":"處新臺幣 20 萬元以上 100 萬元以下罰鍰，並通知其停止該等行為","A":"處拘役或新臺幣 9 萬元以下罰金","C":"處新臺幣 2 千元以上 1 萬元以下罰鍰"},"a":"B","e":"使用與「郵政、郵局」（含中文及外文）相同之文字、圖形、記號或其聯合式表彰營業名稱、服務或產品，違反 §7，依 <b>§41 處 2 萬～10 萬元罰鍰，並令限期改善，屆期不改善得按次連續處罰</b>。(D) 20～100 萬元是 <b>§40 違反 §6 專營權</b>之罰則，兩者是每年互換的陷阱。<b>口訣：冒名（招牌）2～10 萬、搶生意（專營）20～100 萬。</b>","law":"郵政法","meta":"考點：名稱專用與罰則（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政法規定，下列何者「不」享有免納一切稅捐之優惠？","o":{"C":"中華郵政公司經營之遞送郵件業務","A":"供遞送郵件業務使用之郵政公用物","B":"供遞送郵件業務使用之業務單據","D":"中華郵政公司經營之集郵及其相關商品業務"},"a":"D","e":"郵政法 §9 第1項：免納一切稅捐者，<b>僅限「遞送郵件業務」及供「該項業務」使用之郵政公用物、業務單據</b>。集郵商品、郵政資產出租、儲金、壽險等其他業務<b>均不在免稅範圍</b>。另注意 <b>§9 免稅無期間限制</b>，與<b>郵政儲金匯兌法 §8「公司成立之日起 5 年內免稅」</b>不同—這是三法交叉比較的必考點。","law":"郵政法","meta":"考點：免稅範圍（5 年）．近 6 年出現 5/6 年"},{"s":"甲為 9 歲之國小學生，自行至郵局購買郵票並交寄掛號信函。依郵政法規定，甲該行為之效力為何？","o":{"B":"無效，須由法定代理人代為之","C":"效力未定，經法定代理人承認始生效力","A":"視為有行為能力人之行為，有效","D":"推定為有行為能力人之行為，得由法定代理人舉證推翻"},"a":"A","e":"郵政法 §12：<b>無行為能力人或限制行為能力人</b>，關於<b>郵政事務</b>對中華郵政公司所為之行為，<b>視為有行為能力人之行為</b>。「視為」是法律擬制，<b>不容反證推翻</b>，故 (D) 的「推定」為錯誤用語。<b>郵政儲金匯兌法 §5 有完全相同的規定</b>（適用於儲金及匯兌事務）；但<b>簡易人壽保險法並無此條</b>—三法比較必考。","law":"郵政法","meta":"考點：視為有行為能力（5 年）．近 6 年出現 5/6 年"},{"s":"依郵政法規定，以毀壞之方法危害郵政核心資通系統設備之功能正常運作者，其刑罰為何？","o":{"B":"處 6 個月以上 5 年以下有期徒刑，得併科新臺幣 1 千萬元以下罰金","C":"處 1 年以上 7 年以下有期徒刑，得併科新臺幣 1 千萬元以下罰金","D":"處 3 年以上 10 年以下有期徒刑，得併科新臺幣 5 千萬元以下罰金","A":"處 5 年以上 12 年以下有期徒刑，得併科新臺幣 5 千萬元以下罰金"},"a":"C","e":"郵政法 §35-1：以竊取、毀壞或其他非法方法危害郵政核心資通系統設備之功能正常運作者，<b>處 1 年以上 7 年以下有期徒刑，得併科新臺幣 1,000 萬元以下罰金</b>；<b>意圖危害國家安全或社會安定</b>而犯之者，<b>加重為 3 年以上 10 年以下有期徒刑，得併科 5,000 萬元以下罰金</b>；<b>致損及金融市場穩定者，加重其刑至二分之一</b>；<b>未遂犯罰之</b>。此為 111 年增訂後 112～115 年連四年出題的新熱區。<b>兩組數字：1~7 年／1 千萬；3~10 年／5 千萬。</b>","law":"郵政法","meta":"考點：郵政核心資通系統（4 年新興）．近 6 年出現 4/6 年"},{"s":"依郵政法規定，有關遞送普及服務之敘述，下列何者正確？","o":{"C":"服務範圍及於國內及國外","D":"應遞送之函件為單件不逾 1 公斤者","B":"服務標準由中華郵政公司定之","A":"因天災、事變或其他不可抗力情事致執行顯有困難者，中華郵政公司得公告限制或停辦"},"a":"A","e":"郵政法 §5-1：①服務範圍<b>限於國內</b> ②應遞送者為<b>單件不逾 2 公斤之函件</b>、<b>單件不逾 20 公斤且長寬高合計不逾 150 公分之包裹</b>、其他經<b>主管機關指定</b>之文件或物品 ③<b>服務標準由主管機關（交通部）定之</b> ④因天災、事變或其他不可抗力致執行顯有困難者，<b>公司得公告限制或停辦</b>。另 §19：公司<b>非依法規不得拒絕</b>遞送上述郵件，<b>但禁寄物品或規格不符公司公告者除外</b>。故選 (A)。","law":"郵政法","meta":"考點：遞送普及服務（5 年）．近 6 年出現 5/6 年"},{"s":"依郵件處理規則規定，有關查詢期限之敘述，下列何者正確？","o":{"B":"掛號郵件自交寄之日起算 6 個月；國際快捷郵件自交寄之日起算 4 個月","D":"掛號郵件自交寄之次日起算 6 個月；國際快捷郵件自交寄之次日起算 4 個月","A":"掛號郵件自交寄之次日起算 4 個月；國際快捷郵件自交寄之次日起算 6 個月","C":"一律自交寄之次日起算 6 個月"},"a":"D","e":"§60：掛號郵件之查詢期限自<b>交寄之「次日」</b>起算 <b>6 個月</b>；<b>但國際快捷郵件</b>自交寄之次日起算 <b>4 個月</b>。逾期者郵局<b>得不予提供查詢，並不負補償責任</b>。與郵政法 §34 補償請求權「自交寄<b>之日</b>起 6 個月」的起算點不同，<b>次日 vs 當日</b>是每年的送分／送命關鍵。<b>只有「國際」快捷是 4 個月，國內快捷仍是 6 個月。</b>","law":"郵件處理規則","meta":"考點：查詢期限（5 年）．近 6 年出現 5/6 年"},{"s":"甲交寄國內掛號信函 1 件（未報值、未保價），內裝價值新臺幣 8,000 元之商品禮券，郵資 36 元，於遞送途中全部遺失。依郵件處理規則規定，甲得請求之補償金額為何？","o":{"A":"新臺幣 8,000 元","D":"新臺幣 8,000 元及郵資 36 元","C":"新臺幣 575 元","B":"新臺幣 575 元及郵資 36 元"},"a":"C","e":"§64 第1項第1款：包裹、快捷、報值、保價郵件<b>以外</b>之其他各類掛號函件<b>全部遺失或被竊</b>，<b>國內掛號函件每件補償新臺幣 575 元</b>（定額，與內裝物實際價值無關）。又 §67 規定「退還郵資」僅適用於<b>包裹、快捷、報值、保價</b>四種郵件，<b>普通掛號函件不退郵資</b>，故 (B) 錯。<b>這正是報值／保價郵件存在的理由：不報值，郵局只賠 575 元。</b>","law":"郵件處理規則","meta":"考點：國內掛號函件補償額（4 年）．近 6 年出現 4/6 年"},{"s":"甲交寄以「重量」計費之國內包裹 1 件，重量 12 公斤，於運送途中全部毀損。依郵件處理規則規定，其補償金額上限為何？","o":{"B":"新臺幣 575 元","D":"新臺幣 865 元","C":"新臺幣 1,155 元","A":"新臺幣 1,515 元"},"a":"C","e":"§65 第1項第1款（以<b>重量</b>計費）：<b>5 公斤以下→575 元</b>；<b>超過 5 至 10 公斤→865 元</b>；<b>超過 10 公斤→1,155 元</b>。第2款（以<b>外箱尺寸</b>計費，長寬高三者合計）：<b>不超過 60 公分→575 元</b>；<b>超過 60 至 90 公分→865 元</b>；<b>超過 90 公分→1,155 元</b>。另第3項：<b>實價少於所定補償金額者，按實價補償</b>，其實價依<b>收寄時及收寄地</b>之市價定之。<b>背法：575／865／1,155 三階，重量看 5 與 10、尺寸看 60 與 90。</b>","law":"郵件處理規則","meta":"考點：國內包裹補償上限（4 年）．近 6 年出現 4/6 年"},{"s":"依郵件處理規則規定，下列禁寄物品於郵局收寄後發現時，何者之處理方式為「交相關主管機關處理」？","o":{"B":"封口用之金屬扣鈕有鋒利邊緣致妨害郵件處理者","A":"放射性物品","D":"寄達國禁止輸入或流通之文件或物品","C":"物品之性質或其封裝有傷害郵政服務人員之虞者"},"a":"A","e":"§38 依危險性分兩類處理：①<b>退還寄件人</b>（外國寄來者退回原寄郵局）—封裝鋒利、有傷害服務人員或污損郵件設備之虞、活生動物、寄達國禁止輸入流通者（後者另須先送交相關主管機關）②<b>交相關主管機關處理</b>—<b>放射性物品</b>、<b>易燃易爆或其他危險物品</b>、<b>鴉片嗎啡及其他麻醉物品</b>、<b>猥褻妨害風化之文件物品</b>、彩票及其廣告傳單等。<b>判準：會傷人或違禁的交主管機關，只是包裝不合格的退寄件人。</b>","law":"郵件處理規則","meta":"考點：禁寄物品處理（5 年）．近 6 年出現 5/6 年"},{"s":"依郵件處理規則規定，有關無著郵件之敘述，下列何者錯誤？","o":{"C":"無法投遞或依規定不予寄遞而不能退還寄件人之郵件，應由原寄郵局招領揭示 1 個月，屆期無人領取者為無著郵件","A":"寄件人聲明拋棄或無法投遞免退回者，視為無著郵件","B":"無著郵件內裝物品係有價值或得為買賣標的者，自郵件交寄日起滿 1 年無人認領即變賣之","D":"無著郵件由中華郵政公司指定之郵局拆閱處理"},"a":"B","e":"(B) 錯：§59 第1項第2款—<b>有價值或得為買賣標的</b>者，自郵件交寄日起<b>滿 3 年</b>無人認領才變賣；其性質易於腐壞、不能久存或數量有消減之虞者得先行變賣，<b>並將價款保存至交寄日起滿 3 年為止</b>。另第1款：<b>無價值或不得為買賣標的</b>者，自交寄日起<b>屆滿查詢期限 1 個月後銷燬</b>。(C) 為 §58、(A) 為 §58 第2項、(D) 為 §59 第1項，均正確。<b>兩個數字：銷燬看查詢期限＋1 個月；變賣要 3 年。</b>","law":"郵件處理規則","meta":"考點：無著郵件（5 年）．近 6 年出現 5/6 年"},{"s":"依郵件處理規則規定，下列掛號郵件何者「仍得」投入 i 郵箱？","o":{"C":"附有回執之掛號郵件","D":"外包裝出現破損之掛號郵件","B":"代收貨款金額未逾中華郵政公司公告金額之掛號郵件","A":"無法重（補）製或複製之文件或物品"},"a":"B","e":"§48-1 列舉<b>不予投入 i 郵箱</b>之情形：①體積過大致無法投入 ②外包裝破損 ③<b>附有回執</b> ④<b>報值、保價或代收貨款金額「逾中華郵政公司公告之金額」</b> ⑤無法重（補）製或複製之文件或物品 ⑥i 郵箱<b>滿櫃且經投遞 2 次</b>仍無空格櫃。故金額<b>未逾</b>公告金額者仍可投入，選 (B)。<b>兩個常見偷換：門檻是「中華郵政公司」公告（不是主管機關）；滿櫃要「2 次」（不是 1 次）。</b>","law":"郵件處理規則","meta":"考點：i 郵箱（4 年新興）．近 6 年出現 4/6 年"},{"s":"依郵件處理規則規定，下列何者「非」屬中華郵政公司得公告不按址投遞之地區？","o":{"D":"深山、孤島","A":"羊腸小道在 2 公里以上，非郵路所必經之地區","C":"偏遠地區住戶或村落，平均一個月郵件不足 40 件者","B":"巷弄狹窄致郵務機車無法通行之市區"},"a":"B","e":"§49 列舉得不按址投遞之地區：<b>深山、孤島</b>；<b>羊腸小道在 2 公里以上且非郵路所必經</b>；<b>偏遠地區住戶或村落平均一個月郵件不足 40 件</b>；<b>收件地址飼養之動物有攻擊郵政服務人員或受託遞送人員之虞，經通知未改善者</b>；其他因交通不便投遞顯有困難、經公司訂定之特殊區域。<b>市區巷弄狹窄不在列舉之內</b>，故選 (B)。112 年考「曲折迂迴巷弄」、115 年考「動物攻擊」，出題模式固定。<b>數字：2 公里、40 件。</b>","law":"郵件處理規則","meta":"考點：不按址投遞區域（4 年）．近 6 年出現 4/6 年"},{"s":"依郵件處理規則規定，有關欠資郵件之敘述，下列何者正確？","o":{"D":"欠資郵件，除另有規定外，向寄件人收取欠資及欠資手續費","A":"收件人拒付欠資者，退回原寄郵局向寄件人收取；寄件人亦拒絕交付者，依無著郵件規定處理","C":"國內欠資包裹經退回原寄郵局，由寄件人付清欠資後，得申請再向收件人投遞","B":"欠資郵件未付清欠資及欠資手續費者，仍應先予投遞"},"a":"A","e":"§54、§55：①欠資郵件除另有規定外，<b>向「收件人」收取</b>欠資及欠資手續費（故 A 錯）②<b>未付清者不予投遞</b>（故 D 錯）③收件人拒付或不能投遞退回原寄郵局時<b>向寄件人收取；寄件人拒絕交付者依無著郵件規定處理</b>（B 正確）④<b>僅「國內欠資信函、明信片」</b>經退回後由寄件人付清，得申請再向收件人投遞—<b>包裹、小包不在此列</b>（故 C 錯）。","law":"郵件處理規則","meta":"考點：欠資郵件（4 年）．近 6 年出現 4/6 年"},{"s":"依郵件處理規則規定，有關郵件種類定義之敘述，下列何者錯誤？","o":{"A":"郵件交付相關航空資費，以航空郵路寄遞者，為航空郵件","C":"國內郵件加付限時費，按班限時投遞者，為限時郵件","D":"國際「掛號」函件由寄達郵政機構優先處理並交由專差儘速投遞及提供網路追蹤資訊者，為可追蹤函件","B":"限時郵件投入收件人向郵局租用之專用信箱或專用信袋者，以其投入時間為送達時間"},"a":"D","e":"(D) 錯在「掛號」。§26：<b>可追蹤函件限於「國際『非掛號』函件」</b>—由寄達郵政機構優先處理、交由專差儘速投遞並提供網路追蹤資訊者。可追蹤函件<b>按址投遞、收件人免簽收、不受理書面查詢、遺失不予補償</b>（因非掛號），是每年必設的陷阱。(A) §22、(C) §23、(B) §24 均正確。","law":"郵件處理規則","meta":"考點：限時／快捷／可追蹤定義（5 年）．近 6 年出現 5/6 年"},{"s":"依郵件處理規則規定，有關存證信函之敘述，下列何者正確？","o":{"C":"存證信函得以平信交寄","D":"中華郵政公司對於寄件人交寄郵件之內容，除存證信函留存郵局之副本外，不予證明","A":"存證信函留存郵局之副本，自交寄之次日起由郵局保存 3 年","B":"存證信函留存郵局之副本期滿後，應通知寄件人領回"},"a":"D","e":"§3：中華郵政公司對於寄件人交寄郵件之內容，<b>除存證信函留存郵局之副本外，不予證明</b>（B 正確，此為存證信函存在的核心價值）。§34：存證信函應以<b>掛號信函</b>交寄（A 錯）；留存郵局之副本<b>自「交寄日」起由郵局保存 3 年，期滿後銷燬之</b>（C 錯在「次日」、D 錯在「通知領回」—是<b>銷燬</b>不是退還）。","law":"郵件處理規則","meta":"考點：存證信函（5 年）．近 6 年出現 5/6 年"},{"s":"依郵務營業規章規定，下列何者「非」屬中華郵政公司經營之基本郵件業務？","o":{"B":"電子函件","D":"盲人文件","C":"存證信函","A":"小包"},"a":"C","e":"§4 <b>基本郵件業務（8 種）</b>：信函、明信片、郵簡、印刷物、<b>盲人文件</b>、<b>電子函件</b>、<b>小包</b>、包裹。§5 <b>特種郵件業務（10 種）</b>：航空郵件、限時郵件／可追蹤函件／快捷郵件、掛號郵件、報值郵件、保價郵件、代收貨款郵件、廣告回信、<b>存證信函</b>、傳真函件、未來郵件。故選 (C)。<b>最易錯：電子函件是「基本」、掛號郵件是「特種」—115 年半日制卷第 1、2 題連考兩次。</b>","law":"郵務營業規章","meta":"考點：基本／特種郵件業務（必考骨架）．近 6 年出現 2/6 年"},{"s":"依郵務營業規章規定，有關國內明信片規格之敘述，下列何者錯誤？","o":{"D":"應為長方形，並須以白色紙料印製","B":"紙張須以每平方公尺 180 公克以上，且不逾 260 公克","C":"尺寸最大者為 14 公分 8 毫米乘 10 公分 5 毫米","A":"紙張表面應平整光滑，不得有突出部分"},"a":"B","e":"§13 第2項：國內明信片須以每平方公尺 <b>180 公克以上、且不逾「250」公克</b>之白色紙料印製；尺寸<b>最大 14.8 公分×10.5 公分、最小 14 公分×9 公分</b>，許可差均 2 毫米。(B) 的「260 公克」為數字置換，正是 115 年半日制卷的原題陷阱。<b>併記：信函最小亦為 14×9 公分；成捲信函長度＋直徑 2 倍合計最小 17 公分、最大一面最小 10 公分。</b>","law":"郵務營業規章","meta":"考點：信函／明信片規格（4 年）．近 6 年出現 4/6 年"},{"s":"依郵務營業規章規定，下列重量限制之敘述，何者錯誤？","o":{"A":"信函每件重量不得逾 2 公斤","C":"新聞紙、雜誌每件重量不得逾 2 公斤","D":"盲人文件每件重量不得逾 7 公斤","B":"印刷物專袋每袋重量限制為 5 公斤以上 20 公斤以下"},"a":"B","e":"§34 第2項：<b>印刷物專袋每袋重量限制為「10 公斤以上 25 公斤以下」</b>（寄達之國外郵政有不同規定者依其規定），故 (B) 錯。(A) §12、(C) §26、(D) §35 第5項均正確。<b>重量總表：信函 2、新聞紙雜誌 2、盲人文件 7、書籍與小包 5、國內包裹 20（長寬高合計 150 公分）、印刷物專袋 10～25。</b>","law":"郵務營業規章","meta":"考點：重量限制群組（4 年）．近 6 年出現 4/6 年"},{"s":"依郵務營業規章規定，報值郵件與保價郵件經郵局發單通知領取者，收件人分別應自通知之次日起多久內領取？","o":{"D":"報值 15 日、保價 15 日","C":"報值 15 日、保價 30 日","A":"報值 30 日、保價 15 日","B":"報值 30 日、保價 30 日"},"a":"C","e":"§83 第1項：<b>報值郵件</b>經發單通知者，收件人應自通知之<b>次日起 15 日內</b>領取，逾期依<b>無法投遞郵件</b>之規定處理。§95 第1項：<b>保價郵件</b>應自通知之<b>次日起 30 日內</b>領取，逾期依郵件處理規則有關無法投遞郵件之規定處理。<b>這是規章最經典的一組數字差異：報值 15、保價 30。</b>另併記：<b>代收貨款郵件 15 日</b>（逾期退回原寄郵局）、<b>印刷物逾 5 公斤者 15 日</b>、<b>包裹 15 日</b>（進口國際包裹得申請展期，至多 2 個月）。","law":"郵務營業規章","meta":"考點：報值／保價招領期限（4 年）．近 6 年出現 4/6 年"},{"s":"依郵務營業規章規定，有關代收貨款郵件之敘述，下列何者錯誤？","o":{"B":"代收貨款費內含報值費","C":"代收貨款郵件免收轉帳匯費","D":"如因故無法收取貨款完成投遞時，寄件人得檢具交寄憑證申請退回代收貨款費之 50%","A":"代收貨款郵件所書之文字與數字金額不一致者，以數字金額為代收金額"},"a":"A","e":"§99～§105：(B) 代收貨款費<b>內含報值費</b>、(C) <b>免收轉帳匯費</b>、(D) 因故無法收取貨款完成投遞者，寄件人得檢具交寄憑證申請<b>退回代收貨款費之百分之五十</b>，均正確。(A) 錯—代收貨款<b>金額經塗改者不予收寄</b>；郵件所書金額與郵局人員登載金額不一致者，<b>以「郵件所書」金額為代收金額</b>（112 年考過：封面書 2,000、電腦登載 2,100，應代收 <b>2,000 元</b>）。","law":"郵務營業規章","meta":"考點：代收貨款（3 年）．近 6 年出現 3/6 年"},{"s":"依郵務營業規章規定，有關廣告回信之敘述，下列何者錯誤？","o":{"C":"廣告回信用戶對其原發而經寄回之廣告回信，不得拒收","A":"回信人所付郵資不足者，應補足差額並加付手續費","B":"回信信封上所印之「用戶名稱」如經塗改，依欠資郵件規定處理","D":"廣告回信用戶連續 2 年未使用者，郵局得撤銷其登記"},"a":"D","e":"§111 第3項：郵局得撤銷廣告回信登記之情形為①用戶<b>未繳付郵資及手續費</b>經通知仍未依限繳付 ②<b>連續「3 年」未使用</b> ③<b>地址遷移不明</b>。故 (D) 的「2 年」錯誤。(C) §110 第3項（<b>不得拒收</b>是常考陷阱）、(A) §110 第2項、(B) §111 第1項均正確。<b>注意 (B)：只有「用戶名稱」被塗改才依欠資處理，地址、郵遞區號不在此列。</b>","law":"郵務營業規章","meta":"考點：廣告回信（3 年）．近 6 年出現 3/6 年"},{"s":"依郵務營業規章規定，有關未來郵件之敘述，下列何者錯誤？","o":{"B":"係指寄件人指定未來之寄出日期、收件人及收件地址，由郵局於約定時效內送達收件人者","D":"保管期限最短 15 日，最長不逾 30 年","C":"國內快捷郵件得以未來郵件交寄","A":"應收之資費為現行郵件郵資加付特別處理及保管費"},"a":"C","e":"§121-1、§121-2：得以未來郵件交寄者為①<b>國內普通掛號函件、國內包裹</b>（<b>不收寄各類限時掛號郵件、快捷郵件</b>，但<b>可加附回執</b>）②國內普通平常函件 ③<b>國際（含大陸地區）普通「平常」函件</b>。故 (C) 快捷郵件不得交寄，為錯誤。(B) 注意是指定<b>寄出</b>日期（不是收到日期）；(D) <b>15 日～30 年</b>為固定考點；(A) 正確。","law":"郵務營業規章","meta":"考點：未來郵件（3 年）．近 6 年出現 3/6 年"},{"s":"依郵務營業規章規定，有關 i 郵箱業務之敘述，下列何者錯誤？","o":{"D":"得經由 i 郵箱收領之郵件須為掛號郵件","A":"掛號郵件改投遞至 i 郵箱前，須經寄件人同意","B":"掛號郵件投入 i 郵箱，視為一次投遞","C":"收件人開箱後如將掛號郵件留置 i 郵箱內，不影響該郵件已妥投之效力"},"a":"A","e":"§218 以下：(D) <b>限掛號郵件</b>、(B) 投入 i 郵箱<b>視為一次投遞</b>、(C) 開箱後留置<b>不影響妥投效力</b>，均正確。(A) 錯—改投遞至 i 郵箱<b>無須經寄件人同意</b>（僅在寄件人於封面另有指定或約定時依其指定）。另一關鍵數字：掛號郵件投入 i 郵箱後，收件人未於<b>投入之次日起算 2 日內</b>領取者，公司得於待領期限屆滿之次日起取出，送交指定郵局招領。","law":"郵務營業規章","meta":"考點：i 郵箱（3 年）．近 6 年出現 3/6 年"},{"s":"依郵務營業規章規定，有關郵件存局候領期間之敘述，下列何者正確？","o":{"B":"國內郵件自候領之次日起算 15 日為限，收件人得以書面申請延長至 1 個月","C":"國內快捷郵件自候領之次日起算 15 日為限","A":"國際郵件自候領之次日起算 15 日為限","D":"存局候領郵件一律不得申請延長"},"a":"B","e":"<b>三個期限務必分開記</b>：<b>國內郵件 15 日</b>（得以書面申請延長至 <b>1 個月</b>）；<b>國內快捷郵件 5 日</b>；<b>國際郵件 2 個月</b>。另存局候領之國際郵件自候領次日起算 <b>15 日內免付保管費</b>，逾期者除函件免付外，其他郵件按逾期日數交付逾期保管費。故選 (B)。","law":"郵務營業規章","meta":"考點：存局候領期限（3 年）．近 6 年出現 3/6 年"},{"s":"依郵務營業規章規定，包裹郵件全部遺失應予補償時，下列何項費用「不予」退還？","o":{"C":"郵資","B":"保價費及報值費","D":"代收貨款費","A":"以上皆應退還"},"a":"B","e":"§214：包裹、快捷、報值、保價郵件全部遺失、被竊或毀損應予補償者，於給予補償金時<b>並退還其郵資，但「保價費、報值費」不予退還</b>；<b>代收貨款郵件</b>全部遺失、被竊或毀損應予補償者，<b>並退還其代收貨款費</b>。故選 (B)。<b>邏輯：報值費、保價費是「買保險的錢」，理賠了就不退保費；郵資是「運費」，沒送到當然要退。</b>","law":"郵務營業規章","meta":"考點：補償與退費（5 年，最高頻）．近 6 年出現 5/6 年"},{"s":"依郵政儲金匯兌法規定，有關郵政儲金匯兌事務之主管與監督，下列敘述何者正確？","o":{"B":"屬金融監督管理委員會主管，業務受交通部監督","A":"屬交通部主管，業務受金融監督管理委員會監督；涉及外匯業務經營者應經中央銀行許可","D":"屬交通部主管，業務受中央銀行監督","C":"屬行政院主管，業務受金融監督管理委員會監督"},"a":"A","e":"§2：郵政儲金匯兌事務由中華郵政公司辦理，<b>屬交通部主管，業務受金融監督管理委員會監督</b>；其<b>涉及外匯業務經營者，應經中央銀行許可</b>。三個機關各司其職是六年來每年必考：<b>主管＝交通部、監督＝金管會、外匯＝中央銀行</b>。另 §29：罰鍰由<b>金管會</b>處罰，<b>但未經中央銀行許可辦外匯（§26 第6款）由中央銀行處罰</b>，並通知交通部。","law":"郵政儲金匯兌法","meta":"考點：主管機關與監督（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政儲金匯兌法規定，下列何種郵政儲金「得」接受他人存款，並得申請領用支票辦理匯款、撥款、轉帳？","o":{"D":"存簿儲金","C":"定期儲金","A":"劃撥儲金","B":"綜合儲金"},"a":"A","e":"§3 郵政儲金<b>僅三種</b>：<b>存簿儲金、定期儲金、劃撥儲金</b>（「綜合儲金」、「黃金存摺」等均非法定種類，是常見誘答）。<b>劃撥儲金</b>：存款人得以其帳戶辦理匯款、撥款、轉帳，<b>得接受他人存款</b>，並得<b>申請領用劃撥支票</b>（§16 準用票據法有關支票之規定）。<b>存簿儲金</b>則憑儲金簿或約定方式隨時存取、<b>每一人或每一團體僅得為一戶</b>、<b>利息免一切稅捐</b>。","law":"郵政儲金匯兌法","meta":"考點：儲金種類（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政儲金匯兌法規定，下列何者「非」屬郵政儲金之運用範圍？","o":{"A":"轉存中央銀行以外之其他金融機構","C":"投資受益憑證及上市（櫃）股票","D":"參與金融同業拆款市場","B":"對一般民眾辦理小額信用放款"},"a":"B","e":"§18 運用範圍：<b>轉存中央銀行、轉存中央銀行以外之其他金融機構、投資公債公司債金融債券及短期票券、投資受益憑證及上市（櫃）股票、參與金融同業拆款市場、提供（中長期）資金轉存金融機構辦理政府核准之重大建設及民間投資計畫、其他經核准之運用</b>。<b>郵政儲金不得直接對民眾放款</b>（郵局無授信業務），故選 (B)。另誘答常見「投資期貨」「從事衍生性商品交易」「投資未上市櫃股票」「中小企業中長期放款」—<b>均不在範圍內</b>。","law":"郵政儲金匯兌法","meta":"考點：儲金運用範圍（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政儲金匯兌法規定，有關郵政匯兌之敘述，下列何者錯誤？","o":{"D":"郵政匯兌之種類為國內匯兌、國際匯兌及郵政禮券","C":"國內匯兌及國際匯兌，分為信匯及電匯二種","A":"郵政匯兌除電匯外，應以郵政匯票或郵政禮券為憑","B":"郵政禮券為中華郵政公司發行、依面額對持有人無條件付款之無記名有價證券"},"a":"C","e":"(C) 錯。§21：國內匯兌及國際匯兌，分為「<b>票匯及電匯</b>」二種—<b>沒有「信匯」</b>。這是六年來最穩定的送分兼陷阱題，只要看到「信匯」就是錯。(D) §4、(A) §21 第2項、(B) §4 第3款均正確。<b>再記：郵政禮券是「無記名」有價證券，遺失不得掛失兌領。</b>","law":"郵政儲金匯兌法","meta":"考點：匯兌種類與匯票（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政儲金匯兌法規定，郵政匯票受款人之兌領請求權，自何時起算、經多久不行使而因時效消滅？","o":{"B":"自匯票寄達受款人之日起算，3 年","A":"自發票日起算，3 年","C":"自發票日起算，5 年","D":"自匯票掛失日起算，5 年"},"a":"A","e":"§22：郵政匯票受款人之兌領請求權，<b>自「發票日」起算，3 年間</b>不行使，因時效而消滅。§23：逾該期間未經兌款者，公司應通知<b>匯款人</b>領回，<b>匯款人不得要求退還匯費</b>。<b>四法時效交叉表：郵件補償請求權 6 個月／補償金請求權 5 年／郵政匯票 3 年／簡易壽險契約權利 5 年。</b>","law":"郵政儲金匯兌法","meta":"考點：匯票時效（6 年連續）．近 6 年出現 6/6 年"},{"s":"依郵政儲金匯兌法規定，有關免稅之敘述，下列何者正確？","o":{"A":"郵政儲金匯兌業務於中華郵政公司成立之日起 10 年內免納一切稅捐","B":"郵政儲金匯兌業務於中華郵政公司成立之日起 5 年內免納一切稅捐；存簿儲金之利息應免一切稅捐","C":"所有郵政儲金之利息均免一切稅捐","D":"郵政儲金匯兌業務永久免納一切稅捐"},"a":"B","e":"§8：中華郵政公司經營之郵政儲金匯兌業務及該業務使用之郵政公用物、業務單據，於<b>公司成立之日起「5 年內」免納一切稅捐</b>（有期間限制，與郵政法 §9 遞送郵件業務<b>無期間限制</b>不同）。§20：<b>「存簿儲金」之利息，應免一切稅捐</b>—<b>僅限存簿儲金，劃撥、定期儲金之利息不免稅</b>，故 (C) 錯。這組交叉比較是每年的高頻陷阱。","law":"郵政儲金匯兌法","meta":"考點：免稅（5 年）．近 6 年出現 5/6 年"},{"s":"儲戶甲之郵政存簿儲金簿於 5 月 2 日遭竊，5 月 5 日始向中華郵政公司辦理掛失止付，惟存款已於 5 月 3 日遭人冒領。郵局係依規定程序辦理並已盡善良管理人之注意義務。依郵政儲金匯兌法規定，郵局之責任為何？","o":{"C":"應負全部賠償責任","A":"不負責任","B":"應負二分之一責任","D":"應與儲戶協商分擔"},"a":"A","e":"§19（部分版本列為 §15）：儲戶提取存款應持郵局發給之憑證及約定之預留印鑑；憑證或印鑑遺失時應辦理掛失止付。<b>在儲戶「未辦妥掛失止付」前，公司對於依規定程序並已盡善良管理人注意義務所為之給付，「縱係冒領，亦不負責任」</b>。故選 (A)。<b>關鍵三要件：未掛失＋依規定程序＋盡善良管理人注意義務。</b>","law":"郵政儲金匯兌法","meta":"考點：掛失止付與善良管理人（4 年）．近 6 年出現 4/6 年"},{"s":"依郵政儲金匯兌法規定，中華郵政公司於下列何種情形，「得」接受第三人有關停止帳戶交易活動或給付匯款之請求？","o":{"C":"銀行公會之書面通知","A":"被害人親屬之存證信函","D":"法院之裁判或檢察機關之書面通知","B":"新聞媒體查證之書面函詢"},"a":"D","e":"§11、§12：中華郵政公司及其服務人員對於顧客之郵政儲金或匯款等有關資料，<b>除其他法律或金融監督管理委員會另有規定外，應保守秘密</b>；且<b>非依法院之裁判、檢察機關之書面通知或其他法律規定，不得接受第三人</b>有關停止帳戶交易活動或給付匯款之請求。故選 (D)。<b>實務對應：民眾被詐騙匯款到他人帳戶，郵局不得應其要求逕行凍結或退款，應請其報警循法律途徑處理。</b>","law":"郵政儲金匯兌法","meta":"考點：保密與停止交易（4 年）．近 6 年出現 4/6 年"},{"s":"依郵政儲金匯兌法規定，中華郵政公司有下列何種情事，應處新臺幣 50 萬元以上 250 萬元以下罰鍰？","o":{"A":"郵政儲金利率未以年率為準或未於營業場所揭示","C":"未依規定建立內部控制及稽核制度","B":"規避、妨礙或拒絕金融監督管理委員會之檢查","D":"洩漏顧客之郵政儲金或匯款等有關資料"},"a":"B","e":"<b>兩級距分明</b>：<b>§27（50 萬～250 萬元）—妨礙金檢類</b>：規避、妨礙或拒絕檢查；隱匿或毀損業務或財務狀況之帳冊文件；逾期提報財務報告、財產目錄或其他有關資料及報告；對檢查人員詢問其職務上事項無正當理由不為答復或故意答復不實。<b>§26（30 萬～150 萬元）—業務違規類</b>：利率未以年率為準或未揭示、未建立內控稽核、違法接受第三人停止帳戶請求、洩漏顧客資料、儲金運用違反授權辦法、未經中央銀行許可辦外匯。故選 (B)。<b>口訣：擋金檢最貴。</b>","law":"郵政儲金匯兌法","meta":"考點：罰則兩級距（5 年）．近 6 年出現 5/6 年"},{"s":"依郵政儲金匯兌法規定，下列何者「非」屬該法第 1 條明定之立法目的？","o":{"D":"鼓勵國民儲蓄、促進資本形成","B":"增進民眾便利","A":"保障郵政儲金匯兌安全","C":"提供普遍、公平、合理之郵政服務"},"a":"C","e":"§1：為<b>鼓勵國民儲蓄、促進資本形成，以配合國家政策，增進民眾便利，並保障郵政儲金匯兌安全</b>，特制定本法。(C)「提供普遍、公平、合理之郵政服務」是<b>郵政法 §1</b>之用語。<b>三法目的交叉表：郵政法＝健全郵政發展、普遍公平合理之郵政服務、增進公共利益；儲匯法＝鼓勵儲蓄、促進資本形成、增進民眾便利、保障安全；簡易壽險法＝提供國民基本經濟保障、健全簡易人壽保險制度、便利全民投保、增進社會福祉。</b>","law":"郵政儲金匯兌法","meta":"考點：立法目的（3 年）．近 6 年出現 3/6 年"},{"s":"依簡易人壽保險法規定，有關被保險人之敘述，下列何者錯誤？","o":{"A":"以他人為被保險人時，須要保人與被保險人有保險利益","B":"非中華民國國民，不得為被保險人","C":"由第三人訂立之保險契約，其權利之移轉或出質，非經被保險人以書面承認，不生效力","D":"外國人得為要保人、被保險人及受益人"},"a":"D","e":"§7 第1項：<b>非中華民國國民，不得為「被保險人」</b>—但外國人<b>得為要保人及受益人</b>，故 (D) 錯（111 年原題答案即為「得為要保人及受益人」）。(A) §9 保險利益須存在於<b>要保人與被保險人</b>之間（不是與受益人）；(C) §8：由第三人訂立之保險契約，其權利之移轉或出質<b>非經被保險人書面承認不生效力</b>；且未經被保險人<b>書面同意並約定保險金額</b>者<b>契約無效</b>。","law":"簡易人壽保險法","meta":"考點：保險利益／被保險人（6 年連續）．近 6 年出現 6/6 年"},{"s":"依簡易人壽保險法規定，有關受益人之敘述，下列何者正確？","o":{"B":"要保人得於保險事故發生後變更受益人","A":"未指定受益人且以被保險人死亡為保險給付事由者，保險金額作為要保人之遺產","D":"受益人故意致被保險人於死而無其他受益人時，保險金額作為被保險人之遺產","C":"要保人變更受益人無須經任何人同意"},"a":"D","e":"§17、§22：①受益人<b>故意致被保險人於死或雖未致死</b>者，<b>無請求死亡人壽保險金額之權</b>；有其他受益人時由其他受益人<b>平均</b>領受全部保險金額；<b>無其他受益人時，保險金額作為「被保險人」之遺產</b>（C 正確）②未指定受益人且以被保險人死亡為給付事由者，保險金額作為<b>「被保險人」之遺產</b>（B 錯）③要保人得指定或變更受益人之時點為<b>訂立契約時、契約滿期前、保險事故發生前</b>（A 錯，事故發生後不得變更）④<b>被保險人為第三人時，指定或變更受益人應先得其書面同意</b>（D 錯）。","law":"簡易人壽保險法","meta":"考點：受益人（6 年連續）．近 6 年出現 6/6 年"},{"s":"依簡易人壽保險法規定，郵政簡易人壽保險之最高、最低保險金額及同一被保險人之保險金額總數，由下列何者定之？投保金額超過限額時其效力為何？","o":{"A":"中華郵政公司定之；超過部分契約有效，保險費計息退還","B":"交通部會同金融監督管理委員會定之；超過部分契約無效，保險費無息退還","C":"交通部定之；超過部分契約無效，保險費計息退還","D":"金融監督管理委員會定之；超過部分契約有效，保險費無息退還"},"a":"B","e":"§5：郵政簡易人壽保險之<b>最高、最低保險金額及同一被保險人之保險金額總數，由「交通部會同金融監督管理委員會」定之</b>；<b>保險金額超過限額時，其超過部分之契約「無效」，超過部分所繳之保險費應予「無息」退還</b>。兩個關鍵字：<b>會同</b>（不是單獨）、<b>無息</b>（不是計息）。另注意受金額總數限制的是<b>「被保險人」</b>，不是要保人。","law":"簡易人壽保險法","meta":"考點：保險金額限額（6 年連續）．近 6 年出現 6/6 年"},{"s":"依簡易人壽保險法規定，有關續期保險費未交付之處理，下列敘述何者錯誤？","o":{"D":"續期保險費自繳費日起 1 個月未交付者，保險人應於 10 日內催告","B":"自當期繳費日起算 3 個月為寬限期間","C":"寬限期間屆滿仍未交付保險費時，保險契約效力停止","A":"保險契約停止效力後，被保險人得於 2 年以內申請恢復契約效力"},"a":"A","e":"(A) 錯在<b>主體</b>：停效後得申請<b>恢復契約效力者為「要保人」</b>，不是被保險人；期間為<b>2 年以內</b>。§13、§14 完整時間軸：<b>繳費日起 1 個月未交付 → 保險人 10 日內催告 → 自當期繳費日起算 3 個月寬限期 → 屆滿未交付則效力停止 → 要保人得於 2 年內申請復效 → 經同意者「溯自繳清應繳保險費及其利息之日」起恢復效力</b>。停效期間發生保險事故，<b>保險人不負責任</b>。","law":"簡易人壽保險法","meta":"考點：停效與復效（6 年連續）．近 6 年出現 6/6 年"},{"s":"依簡易人壽保險法規定，下列敘述何者正確？","o":{"D":"簡易人壽保險對於被保險人，應視投保金額決定是否施以健康檢查","C":"簡易人壽保險之保險人，對於保險費，得以訴訟請求交付","B":"簡易人壽保險之保險人，不得代位行使要保人或受益人因保險事故所生對於第三人之請求權","A":"由保險契約所發生之權利，自得為請求之日起，逾 2 年不行使而消滅"},"a":"B","e":"(B) 正確，§24：保險人<b>不得代位</b>行使要保人或受益人因保險事故所生對於第三人之請求權（人身保險本質使然）。(D) 錯：§6 <b>免施以健康檢查</b>（本法兩大特色之一，不看金額、不看年齡、不看險種）。(C) 錯：§12 保險費<b>不得以訴訟請求交付</b>（另一大特色，欠繳保費的效果是停效而非被告）。(A) 錯：§25 契約所生權利之時效為<b>5 年</b>。","law":"簡易人壽保險法","meta":"考點：兩大特色（免體檢／不得訴訟請求保費）．近 6 年出現 5/6 年"},{"s":"依簡易人壽保險法規定，有關保險人解除契約之敘述，下列何者錯誤？","o":{"D":"訂立保險契約或申請恢復契約效力時，要保人及被保險人對於保險人之書面詢問，應據實說明","C":"要保人或被保險人故意隱匿或因過失遺漏或為不實之說明，足以變更或減少保險人對於危險之估計者，保險人得解除契約","A":"解除權自保險人知有解除之原因後，經過 3 個月不行使而消滅","B":"自契約訂立或恢復效力至保險事故發生日滿 2 年，即有可以解除之原因，亦不得解除契約"},"a":"A","e":"(A) 錯：§16 解除權之除斥期間為「<b>自保險人知有解除之原因後，經過「1 個月」不行使而消滅</b>」。(B) 為另一道防線：<b>自契約訂立或復效至事故發生「滿 2 年」，縱有可解除之原因亦不得解除</b>。另 §16 但書：保險人依規定解除契約時，要保人<b>得申請「應得之保單價值準備金」</b>。<b>兩個數字：知情後 1 個月、契約滿 2 年。</b>","law":"簡易人壽保險法","meta":"考點：據實說明與解除權（5 年）．近 6 年出現 5/6 年"},{"s":"依簡易人壽保險法規定，有關保險單借款之敘述，下列何者錯誤？","o":{"A":"保險費須付足 1 年以上","D":"由要保人以保險單為質向保險人申請借款","C":"借款額度以其累計所繳保險費金額為限","B":"借款未清償前，因保險契約效力停止、終止、滿期或發生保險事故時，其所欠之本息應於給付之金額內扣抵之"},"a":"C","e":"(C) 錯：§23 借款額度以「<b>保單價值準備金額</b>」為限，<b>不是「所繳保險費金額」，也不是「責任準備金」</b>。這三個名詞的置換是本法最常見的陷阱。(A)(D)(B) 均正確；(B) 的四種扣抵情形（<b>效力停止、終止、滿期、發生保險事故</b>）在 111、112 年連續兩份卷考出，屬必背清單。","law":"簡易人壽保險法","meta":"考點：保單借款（4 年）．近 6 年出現 4/6 年"},{"s":"依簡易人壽保險法規定，下列敘述何者錯誤？","o":{"C":"中華郵政公司經營之簡易人壽保險，屬交通部主管，業務並受金融監督管理委員會監督","B":"由中華郵政公司以外之其他保險業者經營簡易人壽保險業務者，其主管機關為金融監督管理委員會","A":"本法所定之行政處罰，由金融監督管理委員會為之，並應通知交通部","D":"中華郵政公司經依本法規定處罰並限期令其改正後，屆期仍不改正者，不得按次處罰"},"a":"D","e":"(D) 錯：經處罰並限期令其改正後，<b>屆期仍不改正者，「得按次處罰」</b>。(C)(B) §2：中華郵政經營者<b>屬交通部主管、業務受金管會監督</b>；<b>其他保險業者經營簡易人壽保險則由金管會主管</b>。(A) §40：本法所定之行政處罰，由<b>金管會</b>為之，並應通知交通部。<b>與郵政法（罰鍰由交通部）、儲匯法（罰鍰由金管會，外匯部分由中央銀行）併記。</b>","law":"簡易人壽保險法","meta":"考點：主管機關與行政處罰（5 年）．近 6 年出現 5/6 年"}]},{"id":"p3","name":"卷三　綜合測試卷","sub":"結合易錯與高頻，全新自編 50 題","desc":"把卷一的「易錯點」與卷二的「高頻核心」合併評估後重新命題，加重情境題、計算題與三法交叉比較題，配題完全比照 112 年「專業職(二)晉升專業職(一)：郵政法規概要」實卷。","real":false,"qs":[{"s":"有關中華郵政公司各項業務之免稅規定，下列敘述何者正確？","o":{"B":"遞送郵件業務免納一切稅捐，無期間限制；郵政儲金匯兌業務自公司成立之日起 5 年內免納一切稅捐","D":"遞送郵件業務與郵政儲金匯兌業務均自公司成立之日起 5 年內免納一切稅捐","A":"遞送郵件業務自公司成立之日起 5 年內免稅；郵政儲金匯兌業務無期間限制","C":"公司經營之各項業務均免納一切稅捐，無期間限制"},"a":"B","e":"<b>郵政法 §9</b>：中華郵政公司經營之<b>遞送郵件業務</b>及供該項業務使用之郵政公用物、業務單據，<b>免納一切稅捐（無期間限制）</b>。<b>郵政儲金匯兌法 §8</b>：郵政儲金匯兌業務及該業務使用之郵政公用物、業務單據，於<b>公司成立之日起「5 年內」免納一切稅捐（有期間限制）</b>。另<b>儲匯法 §20</b>：<b>存簿儲金之利息</b>應免一切稅捐（永久，但僅限存簿儲金）。集郵商品、資產出租等業務<b>不免稅</b>。","law":"郵政法","meta":"考點：跨法比較：免稅期間"},{"s":"下列交寄情形，何者「不」在中華郵政公司之郵政專營權範圍內，民營運送業者得以遞送為營業？","o":{"D":"國防部交寄之國內信函，單件重量 1,200 公克","A":"某科技公司交寄之國內信函，單件重量 450 公克","B":"某大學交寄至日本東京之國際航空信函，單件重量 300 公克","C":"某民眾交寄之國內郵簡"},"a":"B","e":"郵政法 §6 第1項但書：「<b>國內、外互寄之跨境文件，不在此限</b>」—國際信函屬跨境文件，<b>不受專營權限制</b>，故 (B) 民營業者可送。(D) 國防部屬<b>軍事單位</b>，其交寄之信函<b>不論輕重一律專營</b>；(A) 一般人交寄且<b>500 公克以下</b>，在專營內；(C) <b>郵簡</b>本身即為專營三類文件之一。<b>判斷順序：先看是不是跨境（跨境→不專營）→ 再看是不是明信片/郵簡（→專營）→ 信函則看寄件人身分與重量。</b>","law":"郵政法","meta":"考點：情境：專營權判斷"},{"s":"依郵政法規定，有關郵票之發行與廢止，下列敘述何者正確？","o":{"B":"發行由中華郵政公司擬訂式樣、圖案及價格，報請交通部核定；廢止則報請交通部層轉行政院核定","C":"發行由中華郵政公司擬訂式樣、圖案及價格，報請交通部層轉行政院核定；廢止則報請交通部核定","A":"發行與廢止均由交通部核定","D":"發行與廢止均須報請行政院核定"},"a":"C","e":"<b>兩層核定必須拆開記</b>：§16 第2項—<b>郵票、含有郵票符誌之明信片或特製郵簡之「發行」</b>，由中華郵政公司擬訂式樣、圖案及價格，<b>報請主管機關（交通部）「層轉行政院」核定後發行</b>；§17 第1項—郵票之「<b>廢止</b>」，中華郵政公司<b>報請主管機關（交通部）核定</b>後為之，<b>但應於 1 個月前公告並停止售賣</b>；持有廢止郵票者<b>自「廢止之日」起 6 個月內得換取新票，且只能換新票、不得換現金</b>。","law":"郵政法","meta":"考點：易錯：郵票發行與廢止的兩層核定"},{"s":"依郵政法規定，下列違法行為與其法律效果之配對，何者正確？","o":{"D":"無故開拆他人郵件 → 處新臺幣 2 萬元以上 10 萬元以下罰鍰","C":"未受委託而以遞送國內明信片為營業 → 處拘役或新臺幣 9 萬元以下罰金","B":"誤收他人郵件故意不返還 → 處新臺幣 2 千元以上 1 萬元以下罰鍰","A":"未經同意使用「郵局」字樣表彰其產品 → 處新臺幣 20 萬元以上 100 萬元以下罰鍰"},"a":"B","e":"<b>四級距對照</b>：①<b>§38 無故開拆或隱匿他人郵件、以其他方法窺視內容 → 拘役或 9 萬元以下罰「金」（刑罰）</b> ②<b>§39 誤收他人郵件故意不返還 → 2 千～1 萬元罰「鍰」（行政罰）</b> ③<b>§40 違反 §6 專營權 → 20 萬～100 萬元罰鍰</b>，並通知停止，未停止得按次處罰 ④<b>§41 違反 §7 名稱專用 → 2 萬～10 萬元罰鍰</b>，並令限期改善，屆期不改善得按次連續處罰。故 (D)(C)(A) 均為錯置，選 (B)。<b>辨別：罰「鍰」是行政罰、罰「金」是刑罰。</b>","law":"郵政法","meta":"考點：易錯：罰則四級距"},{"s":"一件掛號郵件之收件人記載為甲、乙二人，住於同一地址。投遞前甲、乙就該郵件之收受發生爭議並向中華郵政公司聲明已提起訴訟。依郵政法規定，中華郵政公司應如何處理？","o":{"C":"得向甲、乙其中任何一人投遞","D":"應依確定之判決或訴訟結果投遞","A":"應先招領揭示，屆期無人領取時處分之","B":"應退還寄件人，由寄件人自行處理"},"a":"D","e":"§23：各類郵件之收件人有<b>二人以上者，「得向其中任何一人投遞」</b>（原則）；<b>但前項郵件在未投遞前，收件人間發生爭議並向公司聲明對於郵件之收受已提起訴訟時，應依「確定之判決或訴訟結果」投遞之</b>（例外）。故本題有訴訟事實，選 (D)。<b>注意：關鍵在「未投遞前」且「已提起訴訟並聲明」，缺一則回到原則。</b>","law":"郵政法","meta":"考點：情境：收件人二人以上"},{"s":"依郵政法規定，下列何種情形，「收件人」得行使郵件補償請求權？","o":{"A":"收件人主張郵件內裝物價值高於補償金額","D":"郵件一部毀損，收件人收受其餘部分並聲明保留求償權","B":"收件人為郵件之實際所有權人","C":"郵件在外國境內損失，依該國法規不負補償責任"},"a":"D","e":"§29 第2項：求償權<b>原則屬寄件人</b>，僅下列二種情形<b>得由收件人行使</b>：①<b>收件人提出證據，證明已由寄件人授與求償權</b> ②<b>郵件一部毀損或被竊，收件人收受其餘部分並聲明保留求償權</b>。(C) 是 §31 第3款<b>不得請求補償</b>之事由。另 §29 第3項：寄件人或收件人<b>除依本法請求補償外，不得依其他法律向中華郵政公司請求賠償</b>（法定限額責任）。","law":"郵政法","meta":"考點：核心：補償請求權人"},{"s":"依郵政法規定，郵件遞交收件人或退還寄件人時，下列何種情形「不得」以毀損或損失論？","o":{"A":"封面有明顯破裂痕跡，重量減少","D":"封面無破裂痕跡，重量亦未減少","B":"封面無破裂痕跡，但重量減少且原因不明","C":"內裝物完好，但收件人主張延誤致其商機損失"},"a":"D","e":"§32：①郵件遞交或退還時，<b>封面無破裂痕跡、重量亦未減少者，不得以毀損論</b>；<b>重量雖減少，其原因由於該物件之性質者，亦同</b>（例如水分蒸發）②郵件遞交或退還時，<b>如因時間關係或市價變動而減損其全部或一部價值者，不得以損失論</b>。(C) 之商機損失屬「其他損失或損害」，依郵件處理規則 §69、郵務營業規章 §217<b>不予補償或賠償</b>。故本題選 (D)。","law":"郵政法","meta":"考點：易錯：不得以毀損／損失論"},{"s":"依郵政法規定，下列敘述何者錯誤？","o":{"A":"本法主管機關為交通部","B":"交通部為提供郵政服務，設國營中華郵政股份有限公司","C":"主管機關得委託中華郵政公司，代表政府與外國或國際郵政組織談判國際郵政事務及簽署有關協定","D":"郵政法第五章罰則所定之罰鍰，由行政院處罰之"},"a":"D","e":"(D) 錯：郵政法罰則所定之罰鍰及處罰，<b>由主管機關「交通部」為之</b>（非行政院、非警察機關、非金管會）。(A) §2、(B) §3、(C) §47 均正確。<b>三法處罰機關對照：郵政法→交通部；郵政儲金匯兌法→金管會（未經央行許可辦外匯者由中央銀行）；簡易人壽保險法→金管會（並通知交通部）。</b>","law":"郵政法","meta":"考點：核心：主管機關與委託談判"},{"s":"依郵政法規定，有關輔助載運郵件之敘述，下列何者錯誤？","o":{"D":"以運送為業之鐵路、長途汽車、船舶、航空器，均有輔助載運郵件及其處理人員之責","B":"載運費用得由中華郵政公司與運送業者商訂之","A":"負輔助載運責任者無正當事由拒絕載運郵件，處新臺幣 2 萬元以上 10 萬元以下罰鍰","C":"負輔助載運責任者因颱風致延誤載運郵件，仍應依法處罰"},"a":"C","e":"§26：以運送為業之<b>鐵路、長途汽車、船舶、航空器</b>均有輔助載運郵件及其處理人員之責；載運費用<b>由中華郵政公司與運送業者「商訂」</b>（非由交通部訂定）。§45：負輔助載運責任者<b>①無正當事由拒絕載運郵件 ②「故意」延誤載運郵件</b>，處 <b>2 萬～10 萬元罰鍰</b>。因颱風延誤屬<b>有正當事由且非故意</b>，不予處罰，故 (C) 錯誤。","law":"郵政法","meta":"考點：核心：輔助載運義務"},{"s":"依郵政法規定，關於各類郵件或其事務，國際郵政公約或協定之規定與郵政法牴觸時，其適用順序為何？","o":{"C":"一律優先適用國際郵政公約或協定","A":"一律優先適用郵政法","D":"國際郵件事務適用國際郵政公約或協定；非國際郵件事務適用郵政法","B":"由交通部個案決定"},"a":"D","e":"§13：關於各類郵件或其事務，<b>國際郵政公約或協定有規定者，依其規定</b>；<b>但其規定與本法牴觸者，「除國際郵件事務外」，適用本法之規定</b>。換言之：<b>國際郵件事務→公約優先；非國際郵件（國內郵件）事務→郵政法優先</b>。故選 (D)。","law":"郵政法","meta":"考點：核心：國際公約適用順序"},{"s":"12 歲之甲同時到郵局辦理下列事務。依現行法規，下列敘述何者錯誤？","o":{"B":"甲購買郵票並交寄掛號信函，依郵政法規定視為有行為能力人之行為","D":"甲以壓歲錢存入其存簿儲金帳戶，依郵政儲金匯兌法規定視為有行為能力人之行為","A":"甲自行辦理郵政匯兌，依郵政儲金匯兌法規定視為有行為能力人之行為","C":"甲自行投保郵政簡易人壽保險，依簡易人壽保險法規定視為有行為能力人之行為"},"a":"C","e":"<b>「視為有行為能力人」只有兩部法有</b>：①<b>郵政法 §12</b>—關於<b>郵政事務</b> ②<b>郵政儲金匯兌法 §5</b>—關於<b>郵政儲金及匯兌事務</b>。<b>簡易人壽保險法「並無」此規定</b>，未成年人投保仍回歸民法及該法 §7、§7-1、§8 之規範（例如未滿 15 歲之死亡給付於滿 15 歲時始生效力），故 (C) 錯誤。<b>這是三法交叉比較最經典的一題。</b>","law":"郵政儲金匯兌法","meta":"考點：跨法比較：視為有行為能力"},{"s":"依郵政儲金匯兌法規定，有關存簿儲金儲戶計息之最高存款限額，下列敘述何者正確？","o":{"D":"由中華郵政公司自行訂定並公告","A":"由中華郵政公司擬訂，報由交通部核定","B":"由中華郵政公司擬訂，報由交通部會同金融監督管理委員會定之","C":"由中華郵政公司擬訂，報由交通部會同中央銀行及金融監督管理委員會定之"},"a":"C","e":"§19：存簿儲金儲戶計息之最高存款限額，由中華郵政公司擬訂，<b>報由交通部「會同中央銀行及金融監督管理委員會」定之</b>—<b>三個機關缺一不可</b>，少寫中央銀行即錯（112 年原題即以此設陷）。另：<b>超過限額之數不給利息</b>；但<b>政府機關、自治團體或公益法人</b>不適用該限額（即超過部分<b>仍給息</b>）。","law":"郵政儲金匯兌法","meta":"考點：易錯：存簿儲金限額之核定機關"},{"s":"依郵政儲金匯兌法規定，下列何者「非」屬應訂於郵政儲金匯兌業務監督管理辦法之事項？","o":{"C":"負責人應具備之資格條件","D":"郵局之增設、遷移及裁撤","B":"新增業務之許可","A":"違反本法之罰鍰額度"},"a":"A","e":"§30 授權訂定之監督管理辦法涵蓋：<b>負責人應具備之資格條件、郵局之增設、遷移及裁撤、新增業務之許可、財務報表之揭露</b>等，由<b>交通部會同金管會</b>（涉外匯者並會同中央銀行）定之。<b>罰鍰額度屬「法律保留」事項，直接規定於本法 §26、§27，不得授權以辦法定之</b>，故選 (A)。另注意：<b>內部控制及稽核制度之建立係 §10 另行授權</b>，不在 §30 之列（111 年原題即以此設陷）。","law":"郵政儲金匯兌法","meta":"考點：易錯：監督管理辦法涵蓋事項"},{"s":"依郵政儲金匯兌法規定，下列何種業務之處理，應優先依萬國郵政聯盟所定郵政匯兌協定及其施行細則，或我國與國外雙邊郵政匯兌協定辦理，該等協定未規定者始依本法辦理？","o":{"C":"國內匯兌","A":"國際匯兌","D":"郵政禮券之發行","B":"劃撥儲金之支票業務"},"a":"A","e":"§25：<b>「國際匯兌」</b>之處理，除依萬國郵政聯盟所定郵政匯兌協定及其施行細則，或我國與國外雙邊郵政匯兌協定辦理外，依本法之規定辦理。<b>國內匯兌不涉及國際協定</b>，故不適用此優先順序。112 年原題全站正確率僅 47%，多數人誤選「國內匯兌或國際匯兌」。<b>記法：有『國際』兩字才輪得到公約。</b>","law":"郵政儲金匯兌法","meta":"考點：易錯：國際匯兌之法源順序"},{"s":"依郵政儲金匯兌法規定，有關郵政禮券之敘述，下列何者錯誤？","o":{"A":"由中華郵政公司發行","C":"由中華郵政公司依面額對持有人無條件付款","D":"屬記名之有價證券，遺失得申請掛失兌領","B":"應記載事項由中華郵政公司擬訂，報交通部核定"},"a":"D","e":"§4 第3款：郵政禮券指中華郵政公司發行，並由其<b>依面額對持有人無條件付款之「無記名」有價證券</b>。既為<b>無記名</b>，<b>遺失即不得掛失兌領</b>（誰持有誰兌領），故 (D) 錯誤。(B) 郵政匯票及郵政禮券之<b>應記載事項，由中華郵政公司擬訂，報「交通部」核定</b>（不是金管會、不是中央銀行）。","law":"郵政儲金匯兌法","meta":"考點：核心：郵政禮券性質"},{"s":"甲於 112 年 5 月 10 日購買郵政匯票寄交乙，乙一直未兌領。依郵政儲金匯兌法規定，下列敘述何者正確？","o":{"A":"乙之兌領請求權自 112 年 5 月 10 日起算 3 年，於 115 年 5 月 10 日屆滿","C":"乙之兌領請求權自匯票寄達乙之日起算 3 年","D":"逾期未經兌款者，中華郵政公司應通知乙領回匯款","B":"逾期未經兌款者，甲領回匯款時得請求退還匯費"},"a":"A","e":"§22：郵政匯票受款人之兌領請求權，<b>自「發票日」起算，3 年間</b>不行使因時效消滅（故 (A) 正確、(C) 錯）。§23：逾該期間未經兌款者，公司應通知「<b>匯款人</b>（甲）」領回，<b>匯款人不得要求退還匯費</b>（故 (D)(B) 錯—通知的是匯款人不是受款人，且匯費不退）。<b>匯費是勞務對價，郵局已經做了工，當然不退。</b>","law":"郵政儲金匯兌法","meta":"考點：核心：匯票逾期處理"},{"s":"中華郵政公司辦理外匯業務違反外匯法令。依郵政儲金匯兌法規定，下列敘述何者正確？","o":{"D":"由金融監督管理委員會停止其一定期間經營全部業務","B":"由中央銀行視情節之輕重，停止其一定期間經營一部外匯之業務，並通知交通部","A":"由交通部停止其外匯業務，並通知中央銀行","C":"由中央銀行處新臺幣 50 萬元以上 250 萬元以下罰鍰"},"a":"B","e":"外匯事項一律歸<b>中央銀行</b>：①<b>經營</b>外匯業務<b>應經中央銀行許可</b>（§2）②<b>違反外匯法令</b>者，<b>中央銀行得視情節之輕重，停止其一定期間經營「全部或一部」外匯之業務，並通知交通部</b>（本題選項僅列「一部」，仍屬正確敘述）③<b>未經中央銀行許可而辦理外匯業務</b>（§26 第6款）之<b>罰鍰由中央銀行處罰</b>，其餘罰鍰由<b>金管會</b>處罰（§29）。故選 (B)。","law":"郵政儲金匯兌法","meta":"考點：核心：外匯業務違規之處理機關"},{"s":"依郵政儲金匯兌法規定，中華郵政公司辦理下列何項業務，準用票據法有關支票之規定？","o":{"B":"存簿儲金之提款業務","D":"定期儲金之質借業務","A":"劃撥儲金之劃撥支票業務","C":"國際匯兌之電匯業務"},"a":"A","e":"§16：中華郵政公司辦理<b>「劃撥儲金之劃撥支票」業務，準用票據法有關支票之規定</b>。三種儲金的功能差異務必分清：<b>存簿儲金</b>（憑儲金簿或約定方式隨時存取、每人限一戶、利息免稅）／<b>定期儲金</b>（有一定時期之限制）／<b>劃撥儲金</b>（可辦匯款撥款轉帳、<b>得接受他人存款</b>、<b>得申請領用劃撥支票</b>）。","law":"郵政儲金匯兌法","meta":"考點：核心：劃撥儲金與票據法"},{"s":"依郵政儲金匯兌法規定，下列何機關得隨時派員或委託適當機構，攜帶證明文件，檢查中華郵政公司之郵政儲金匯兌業務、財務及其他有關事項？","o":{"C":"交通部","B":"中央銀行","A":"金融監督管理委員會","D":"審計部"},"a":"A","e":"§13：<b>金融監督管理委員會</b>得<b>隨時</b>派員或委託適當機構，攜帶證明文件，檢查中華郵政公司之<b>郵政儲金匯兌業務、財務及其他有關事項</b>，或令其於限期內據實<b>提報財務報告、財產目錄或其他有關資料及報告</b>。妨礙該檢查者，依 <b>§27 處 50 萬～250 萬元罰鍰</b>（四種情事：規避妨礙拒絕檢查、隱匿或毀損帳冊文件、逾期提報、對詢問無正當理由不答復或答復不實）。","law":"郵政儲金匯兌法","meta":"考點：核心：金融檢查"},{"s":"依郵政儲金匯兌法規定，下列敘述何者錯誤？","o":{"B":"中華郵政公司經營之郵政儲金匯兌業務，其會計帳務應獨立處理之","C":"中華郵政公司辦理郵政儲金之利率，應以年率為準，並於營業場所揭示","D":"中華郵政公司及其服務人員對於顧客之郵政儲金或匯款等有關資料，除其他法律或金融監督管理委員會另有規定外，應保守秘密","A":"中華郵政公司得依律師事務所之書面查詢，提供被繼承人之存款資料"},"a":"A","e":"(A) 錯：律師事務所<b>非法定得查詢之機關</b>。得取得顧客儲金匯款資料者，須有<b>其他法律規定或金管會另有規定</b>，實務上如<b>法院之裁判、檢察機關之書面通知、行政執行機關或警察機關依法辦案</b>等；律師受託處理遺產訴訟<b>不在此列</b>。(B) §7、(C) §9（<b>年率</b>，非月率或日率；未揭示者依 §26 處 30 萬～150 萬元罰鍰）、(D) §11 均正確。","law":"郵政儲金匯兌法","meta":"考點：核心：會計獨立與保密"},{"s":"依郵政儲金匯兌法規定，本法之施行日期由下列何者定之？","o":{"D":"交通部以命令定之","C":"金融監督管理委員會以命令定之","B":"行政院以命令定之","A":"總統公布之日施行"},"a":"B","e":"郵政儲金匯兌法之<b>施行日期，由「行政院」以命令定之</b>。<b>併記郵政法 §49 亦為「由行政院以命令定之」</b>。這類冷門但年年出現的條文題，屬於「知道就 2 分、不知道就猜」的必背清單。","law":"郵政儲金匯兌法","meta":"考點：核心：本法施行日期"},{"s":"依郵務營業規章規定，下列何種情形，郵局「得」拒絕收件人改投或改寄之申請？","o":{"C":"原收件地址位於不按址投遞區域者","D":"申請人為公私機構而未經負責人簽名蓋章者","A":"有收件人地址之郵件，改交同地郵局存局候領者","B":"新地址不在原投遞局投遞區域內者"},"a":"A","e":"§171 <b>僅列三款</b>得拒絕之情形：①<b>性質複雜者</b> ②<b>僅限於即將寄到之郵件者</b> ③<b>有收件人地址之郵件，改交同地郵局存局候領者</b>。(B) 新地址不在原投遞區域內者正是「<b>改寄</b>」之定義（§167），當然可以申請。此題原型（112 年職階晉升卷）全站正確率僅 <b>32%</b>，是六年最低。<b>另記：申請有效期間自郵局同意提供之始日起「6 個月」為限；同一地址改投或改寄同一新地址「以一次為限」。</b>","law":"郵務營業規章","meta":"考點：易錯：郵局得拒絕改投改寄之三款"},{"s":"甲交寄國內限時掛號附回執函件 1 件，資費合計新臺幣 120 元（函件資費 68 元、掛號費 20 元、限時費 7 元、回執費 25 元）。因郵局未依中華郵政公司公告之處理規定遞送，甲請求補償。依規定甲得請求之補償金額為何？","o":{"B":"新臺幣 575 元","D":"新臺幣 120 元","C":"新臺幣 95 元","A":"新臺幣 100 元"},"a":"C","e":"§211 第4項、第5項：掛號郵件<b>未依公司公告之處理規定遞送</b>應予補償者，依<b>所收取之全部資費</b>補償，<b>但該資費「不含報值費、保價費、代收貨款費及回執費」</b>。故 120 − 回執費 25 ＝ <b>95 元</b>。(B) 575 元是<b>掛號函件「全部遺失或被竊」</b>之定額補償，情形不同不可混用。<b>解題步驟：先判斷是「遺失」還是「未依規定遞送／延誤」→ 前者定額、後者退資費（扣四費）。</b>","law":"郵務營業規章","meta":"考點：計算：補償金額扣除項"},{"s":"甲交寄以外箱尺寸計費之國內包裹 1 件，長寬高三者合計 85 公分，內裝物實際市價新臺幣 1,300 元，於運送途中全部遺失。依規定甲得獲之補償金額為何？","o":{"A":"新臺幣 575 元","D":"新臺幣 865 元","C":"新臺幣 1,155 元","B":"新臺幣 1,300 元"},"a":"D","e":"§212 第1項第2款（以<b>外箱尺寸</b>計費）：<b>合計不超過 60 公分→575 元；超過 60 至 90 公分→865 元；超過 90 公分→1,155 元</b>。本題 85 公分落在第二階，上限 <b>865 元</b>；又第3項規定「實價<b>少於</b>所定補償金額者按實價補償」，本題實價 1,300 元<b>高於</b>上限，故仍以上限 865 元為準。<b>兩段式判斷：先查上限 → 再比實價，取小者。</b>","law":"郵務營業規章","meta":"考點：計算：包裹補償上限"},{"s":"依郵務營業規章規定，顧客因現場交寄郵件需要，得以下列何者向郵局換取不同面額之等值郵票？","o":{"A":"先前購買之便利箱","C":"先前購買之特製郵簡","D":"他人贈與之郵政禮券","B":"已蓋銷之郵票"},"a":"C","e":"§149 第2項但書：郵票或各類出售品一經售出，除當場聲明有瑕疵外不得請求退還；<b>但因現場交寄郵件需要，得以所購之「郵票、郵政明信片、特製郵簡、特製信封」向郵局換取不同面額之等值郵票、郵政明信片、特製郵簡、特製信封「或便利箱袋」使用</b>。可作為<b>換取來源</b>者僅上述四種，<b>便利箱只能是換得的標的、不能拿來換</b>（112 年原題陷阱）。另 §149 第1項：要求發給<b>購票證明應「當場」申請，事後不予補證</b>。","law":"郵務營業規章","meta":"考點：易錯：郵票出售品之換取"},{"s":"依郵務營業規章及郵件處理規則規定，有關新聞紙、雜誌交寄之敘述，下列何者錯誤？","o":{"A":"新聞紙指每日或每隔 6 日以下按期發行者；雜誌指 7 日以上 3 個月以下按期發行者","B":"經認定屬商業性廣告、宣傳品或公司行號為本身業務宣傳，其篇幅逾全部篇幅 50% 者，不得按新聞紙或雜誌交寄","C":"已登記之新聞紙或雜誌，其登記事項如有變更，應於變更之日起 10 日內向郵局申請變更登記","D":"非當期雜誌零星補寄在 200 件以內並註明「補寄」字樣者，得按雜誌付費交寄"},"a":"D","e":"(D) 錯：非當期雜誌零星補寄<b>在「100 件」以內</b>並於封面註明「補寄」字樣者，得按雜誌付費交寄（113、115 年連續兩年考出，答案均為 100 件）。(A) 郵件處理規則 §10 之定義、(B) 郵務營業規章 §20-1 第2項、(C) 變更登記 <b>10 日</b>內，均正確。<b>併記撤銷登記事由：經同意交寄之次日起「6 個月」內未交寄，或交寄後自行中斷交寄，新聞紙逾「3 個月」、雜誌逾「6 個月」者。</b>","law":"郵務營業規章","meta":"考點：核心：新聞紙與雜誌"},{"s":"依郵務營業規章規定，有關報值郵件與保價郵件之敘述，下列何者正確？","o":{"B":"掛號郵件經寄件人報明價值加付報值費於國際互寄者，為報值郵件","D":"報值信函得裝寄黃金戒指等貴重金屬飾品","A":"報值郵件每件報值最高限額由中華郵政公司定之；保價郵件每件保價最高限額亦由中華郵政公司定之","C":"報值金額或保價金額得高於內裝文件或物品之實際價值，以增加保障"},"a":"A","e":"(B) 錯：<b>報值郵件限於「國內」互寄</b>（國際者為保價郵件）。(D) 錯：報值信函以裝寄<b>證書、有價證券、契據、支票、匯票、投標文件及其他重要具價值「文件」</b>為限，<b>黃金戒指等物品不得以報值信函裝寄</b>（應以保價郵件交寄）。(C) 錯：郵件處理規則 §31—報值或保價金額<b>不得超過內裝文件或物品之實際價值</b>，超過者於有損失時<b>不得請求任何補償</b>。(A) 正確：兩者之最高限額<b>均由中華郵政公司定之</b>（非交通部）。","law":"郵務營業規章","meta":"考點：核心：報值與保價郵件"},{"s":"依郵務營業規章及郵件處理規則規定，有關存證信函之敘述，下列何者錯誤？","o":{"A":"應以掛號信函交寄，並加付存證相關資費","D":"留存郵局之副本自交寄日起保存 3 年，期滿後銷燬之","C":"在保存期限內申請查閱或證明者，應按申請時現行存證費之半數交付查閱費或證明費","B":"寄件人申請撤回存證信函時，留存郵局之副本不得同時撤回"},"a":"B","e":"(B) 錯：<b>寄件人依規定申請撤回存證信函，得將留存郵局之副本同時撤回</b>。(A) 郵件處理規則 §34、(D) 保存 <b>3 年</b>（自「交寄日」起算，非次日）、(C) §117 第2項<b>半數</b>（113 年原題即漏掉「半數」而成為錯誤選項）均正確。<b>另記：存證信函在未投交收件人前遺失或滅失且非可歸責於寄件人者，寄件人得交驗原執據補繕正本，由郵局重行證明「免費」遞送；收寄後除撤回外，不得申請更改收件人姓名及地址。</b>","law":"郵務營業規章","meta":"考點：核心：存證信函全套規定"},{"s":"依郵務營業規章規定，混合交寄郵件未於封面註明「混合交寄」字樣，而按較低費率交付郵資者，應如何處理？","o":{"D":"按各件不同費率分別計算後合計，向寄件人補收欠資","B":"依較高之費率，按全件重量，向收件人補收欠資及欠資手續費","A":"依較低之費率，按全件重量，向寄件人補收欠資及欠資手續費","C":"逕行退還寄件人，不予投遞"},"a":"B","e":"§133：①不同費率之郵件得併裝為一件，<b>於封面註明「混合交寄」字樣</b>後寄遞，<b>總重量不得逾其中最高限重之郵件重量</b>；計費方式為<b>按各件不同費率分別計算後合計</b> ②<b>未註明「混合交寄」而按較低費率付郵資者，應依「較高」之費率、按「全件」重量，向「收件人」補收欠資及欠資手續費</b> ③已註明但未付足者，僅補收欠資及手續費。收件人拒付時依無法投遞郵件之規定處理。<b>懲罰邏輯：沒註明就用最貴的算、用全部重量算。</b>","law":"郵務營業規章","meta":"考點：核心：混合交寄"},{"s":"依郵務營業規章及郵件處理規則規定，下列包裹何者「非」屬得通知收件人至郵局領取之情形？","o":{"D":"包裹破損須當面開驗者","A":"應由收件人自辦驗關手續或應納稅捐在規定數額以上者","C":"重量在 2 公斤以上之包裹，其收件人地址車輛通行不便者","B":"報值、保價或代收貨款金額達中華郵政公司訂定並公告之一定數額以上者"},"a":"C","e":"§56（規章）／§51（處理規則）：得通知收件人至郵局領取之包裹情形包括①<b>破損須當面開驗</b> ②<b>應由收件人自辦驗關手續或應納稅捐在規定數額以上</b> ③<b>報值、保價或代收貨款金額達一定數額以上</b> ④<b>應交付其他費用</b> ⑤<b>重量在「3 公斤」以上之包裹，其收件人地址車輛通行不便者</b>。(C) 之「2 公斤」為數字置換（114、115 年連續考出），故選 (C)。<b>另記：經通知者，收件人應自通知之「次日起 15 日內」領取，逾期按日交付逾期保管費；進口國際包裹得申請展期，至多 2 個月。</b>","law":"郵務營業規章","meta":"考點：核心：通知至郵局領取之情形"},{"s":"依郵務營業規章規定，寄件人申請撤回國際包裹，該包裹已離開我國境內、於未投遞前經截留退回者，其撤回費及已付資費應如何處理？","o":{"B":"已付資費全數退還，並免付撤回費","A":"已付資費扣除國內包裹往返資費後退還餘額，並免付撤回費","C":"已付資費不予退還，並應付撤回費","D":"已付資費不予退還，並免付撤回費"},"a":"C","e":"§54 第3項三階段：①<b>尚在原寄局</b>→資費<b>全數退還</b>、<b>免付</b>撤回費 ②<b>已離開原寄局但尚在我國境內</b>經截留退回→扣除原寄局與退回地之<b>國內包裹往返資費</b>後退還餘額，<b>並應付</b>撤回費 ③<b>已離開我國境內</b>於未投遞前經截留退回→<b>資費不予退還，並應付撤回費</b>。另第4項：撤回之國際包裹係保價者，於扣除國內包裹資費時，其已付之<b>保價費不予退還</b>。故選 (C)。<b>走得越遠、罰得越重。</b>","law":"郵務營業規章","meta":"考點：核心：撤回國際包裹"},{"s":"依郵務營業規章規定，掛號郵件未以報值郵件或保價郵件交寄致生損失時，中華郵政公司所負之責任以何者為限？","o":{"D":"郵件內裝物之實際價值","B":"該郵件全部遺失、被竊或毀損時可得請求之補償金額","C":"該郵件所付之全部資費","A":"新臺幣 1,155 元"},"a":"B","e":"§217-1：掛號郵件<b>未以報值或保價郵件交寄</b>致生損失，公司所負之責任<b>以「該郵件全部遺失、被竊或毀損時可得請求之補償金額」為限</b>（例如國內掛號函件即 575 元）。與 §217「因遺失被竊毀損延誤等事由所致之<b>其他損失或損害，不予補償或賠償</b>」併讀，構成郵政補償的<b>法定限額責任體系</b>。<b>實務意義：貴重物品一定要報值或保價，否則賠不到實際價值。</b>","law":"郵務營業規章","meta":"考點：核心：掛號郵件未報值保價之責任上限"},{"s":"下列立法目的與其所屬法律之配對，何者正確？","o":{"C":"提供國民基本經濟保障 → 郵政儲金匯兌法","D":"鼓勵國民儲蓄、促進資本形成 → 簡易人壽保險法","A":"便利全民投保、增進社會福祉 → 簡易人壽保險法","B":"增進公共利益、健全郵政發展 → 郵政儲金匯兌法"},"a":"A","e":"<b>三法目的必背</b>：①<b>郵政法 §1</b>—健全郵政發展、提供<b>普遍、公平、合理</b>之郵政服務、增進<b>公共利益</b> ②<b>郵政儲金匯兌法 §1</b>—<b>鼓勵國民儲蓄、促進資本形成</b>，以配合國家政策、<b>增進民眾便利</b>、保障郵政儲金匯兌安全 ③<b>簡易人壽保險法 §1</b>—提供國民<b>基本經濟保障</b>、健全簡易人壽保險制度、<b>便利全民投保</b>、增進<b>社會福祉</b>。故僅 (A) 正確。<b>這三組每年都被互相對調當誘答。</b>","law":"簡易人壽保險法","meta":"考點：跨法比較：三法立法目的"},{"s":"依簡易人壽保險法規定，有關被保險人身分之特別規定，下列敘述何者正確？","o":{"D":"以未滿 15 歲之未成年人為被保險人者，除健康保險及喪葬費用之給付外，其餘死亡給付之約定無效","A":"以受監護宣告尚未撤銷者為被保險人者，除健康保險及喪葬費用之給付外，其餘死亡給付部分於其監護宣告撤銷時始生效力","B":"以未滿 15 歲之未成年人為被保險人者，除健康保險及喪葬費用之給付外，其餘死亡給付之約定於被保險人滿 15 歲時始生效力","C":"未滿 15 歲之未成年人及受監護宣告者，均不得為被保險人"},"a":"B","e":"<b>兩者效果不同，必須對照記</b>：①<b>未滿 15 歲之未成年人</b>—除健康保險及喪葬費用之給付外，其餘死亡給付之約定<b>「於被保險人滿 15 歲時始生效力」</b>（效力未定，等長大就生效）②<b>受監護宣告尚未撤銷者</b>—除健康保險及喪葬費用之給付外，其餘死亡給付部分<b>「無效」</b>（自始無效，不會因撤銷監護而復活）。另喪葬費用之保險金額<b>不得超過遺產稅喪葬費扣除額之半數</b>。故選 (B)。","law":"簡易人壽保險法","meta":"考點：易錯：受監護宣告 vs 未滿 15 歲"},{"s":"依簡易人壽保險法規定，有關郵政簡易人壽保險得經營險種之敘述，下列何者正確？","o":{"B":"得以主約方式經營傷害保險","D":"得經營專設帳簿之投資型保險","C":"得經營年金保險","A":"得以附約方式經營健康保險及傷害保險"},"a":"A","e":"§4：簡易人壽保險<b>本體（主約）為「生存保險、死亡保險、生死合險」三種</b>；<b>得以「附約」方式經營「健康保險及傷害保險」</b>。故 (B) 錯（傷害保險只能是附約）、(A) 正確。<b>不得經營者</b>：<b>年金保險</b>、<b>專設帳簿之投資型保險</b>、外幣保單、財產保險（如防疫險、住宅火災保險、旅平險屬產險或非簡易壽險範圍）—這些每年都是誘答常客。","law":"簡易人壽保險法","meta":"考點：核心：險種範圍"},{"s":"依簡易人壽保險法規定，有關保險契約效力之敘述，下列何者正確？","o":{"A":"保險契約自要保人填寫要保書之日發生效力","C":"保險契約自保險人同意承保之日發生效力","B":"保險契約自填發保險單之日發生效力","D":"保險契約自繳付第一期保險費之日發生效力"},"a":"B","e":"§11：保險人同意承保後應<b>填發保險單</b>，保險契約<b>自「填發保險單之日」發生效力</b>（注意是「之日」，不是「之翌日」—113 年即以「翌日」設陷）。<b>但</b>保險人於同意承保前<b>預收相當於第一期保險費之金額</b>者，其應負之保險責任，<b>以保險人同意承保時，溯自「預收相當於第一期保險費金額」時開始</b>。另 §14 復效者，<b>溯自繳清應繳保險費「及其利息」之日</b>起恢復效力。","law":"簡易人壽保險法","meta":"考點：核心：保險人責任開始"},{"s":"依簡易人壽保險法規定，下列何種情形，保險人「仍應」負給付保險金額之責任？","o":{"A":"被保險人於保險契約發生效力後 1 年以內故意自殺","D":"被保險人因犯罪處死、拒捕或越獄致死","B":"被保險人於保險契約發生效力後 3 年因疾病死亡","C":"要保人故意致被保險人於死"},"a":"B","e":"§20 不負給付責任之情形：①<b>被保險人於契約發生效力或恢復效力後「1 年以內」故意自殺</b> ②<b>要保人故意致被保險人於死</b> ③<b>被保險人因犯罪處死、拒捕或越獄致死</b> ④健康保險之被保險人故意自殺或墮胎所致疾病、失能、流產或死亡 ⑤傷害保險之被保險人故意自殺，或因犯罪行為所致傷害、失能或死亡。<b>「戰爭或其他變亂致死」並非除外責任</b>（114 年考點）。(B) 正常疾病死亡當然理賠。另 §21：發生上述 ①②等情形且保費付足 1 年以上者，<b>保險人應將保單價值準備金給付與應得之人</b>。","law":"簡易人壽保險法","meta":"考點：核心：除外責任"},{"s":"依簡易人壽保險法規定，下列敘述何者正確？","o":{"C":"受益人得隨時向保險人聲明終止保險契約，其終止效力溯及既往","D":"要保人得隨時向保險人聲明終止保險契約，其終止效力不溯及既往","A":"被保險人得隨時以電話通知保險人及要保人撤銷其先前所為之書面同意","B":"被保險人行使撤銷權者，視為保險人解除保險契約"},"a":"D","e":"<b>終止（§18）</b>：<b>「要保人」得隨時</b>向保險人聲明終止保險契約，其終止效力<b>不溯及既往</b>；保險費已付足 1 年以上者，得申請返還應得之保單價值準備金。<b>撤銷（§8）</b>：由第三人訂立之契約，被保險人以書面所為之同意，<b>得隨時以「書面」通知「保險人及要保人」撤銷之</b>；撤銷權之行使<b>視為「要保人終止保險契約」</b>（不是保險人解除、也不是自始無效）。故 (C)(A)(B) 均錯。","law":"簡易人壽保險法","meta":"考點：核心：終止與撤銷"},{"s":"依簡易人壽保險法規定，有關郵政簡易人壽保險之資本及資金，下列敘述何者錯誤？","o":{"A":"資本由交通部會商金融監督管理委員會後核定","B":"資本經核定後，應按實收資本總額 15% 繳存保證金於國庫","D":"得經交通部核可，提供重大公共建設計畫之融資，其提供總額不得超過資金總額 30%","C":"所稱資金，僅指業主權益，不包括各種準備金"},"a":"C","e":"(C) 錯：所稱「<b>資金</b>」<b>包括業主權益及各種準備金（責任準備金等）</b>。(A)(B) §29：資本由<b>交通部會商金管會</b>核定，並按<b>實收資本總額 15%</b> 繳存保證金於國庫。(D) §31：得經交通部核可提供<b>重大公共建設計畫</b>融資，總額<b>不得超過資金總額 30%</b>。<b>兩個百分比要記牢：保證金 15%、重大公建融資 30%（口訣：給國庫的是一半—30% 的一半是 15%）。</b>","law":"簡易人壽保險法","meta":"考點：核心：資本、保證金與資金運用"},{"s":"依簡易人壽保險法規定，下列敘述何者正確？","o":{"B":"由保險契約所發生之權利，自得為請求之日起，逾 2 年不行使而消滅","A":"由保險契約所發生之權利，自保險事故發生之日起，逾 5 年不行使而消滅","C":"由保險契約所發生之權利，自得為請求之日起，逾 5 年不行使而消滅","D":"中華郵政公司經處罰並限期令其改正，屆期仍不改正者，不得按次處罰"},"a":"C","e":"§25：<b>由保險契約所發生之權利，自「得為請求之日」起，逾 5 年不行使而消滅</b>（起算點是「得為請求之日」，不是事故發生日）。(D) 錯：經依本法規定處罰並限期令其改正後，<b>屆期仍不改正者「得按次處罰」</b>。<b>四法時效總表：郵件補償請求權 6 個月（交寄日起）／郵件補償金請求權 5 年（收到通知日起）／郵政匯票兌領請求權 3 年（發票日起）／簡易壽險契約權利 5 年（得請求日起）／保險人解除權 1 個月（知情後）。</b>","law":"簡易人壽保險法","meta":"考點：核心：時效與按次處罰"},{"s":"甲於 115 年 3 月 10 日交寄國內掛號包裹，未收到投遞通知。依郵件處理規則規定，下列敘述何者正確？","o":{"B":"甲最遲應於 115 年 9 月 10 日前提出查詢","A":"甲最遲應於 115 年 9 月 11 日前提出查詢","D":"甲提出查詢後，郵局至遲應自甲提出查詢之日起 3 個月內支付補償金","C":"甲之補償請求權自 115 年 3 月 11 日起算 6 個月"},"a":"A","e":"<b>三條時間線分開算</b>：①<b>查詢期限（§60）</b>—自<b>交寄之「次日」</b>起算 6 個月：3/11 起算 → <b>9/11</b> 屆滿，故 (B) 錯、(A) 正確 ②<b>補償金支付（§63）</b>—至遲應自「<b>查詢之次日</b>」起 3 個月內為之，故 (D) 錯在「查詢之日」 ③<b>補償請求權（郵政法 §34）</b>—自「<b>交寄之日</b>」起 6 個月，故 (C) 錯在「次日」。<b>口訣：查詢算次日、請求算當日；付款從查詢次日起 3 個月。</b>","law":"郵件處理規則","meta":"考點：情境：時間軸計算"},{"s":"依郵件處理規則規定，有關「可追蹤函件」之敘述，下列何者正確？","o":{"D":"限為國際掛號函件","C":"按址投遞，收件人應簽收","A":"由寄達郵政機構優先處理並交由專差儘速投遞，且提供網路追蹤資訊","B":"遺失時依國際掛號函件標準補償"},"a":"A","e":"§26：<b>可追蹤函件限為「國際『非掛號』函件」</b>—由<b>寄達郵政機構優先處理、交由專差儘速投遞、並提供網路追蹤資訊</b>者。因其<b>非掛號</b>，故<b>按址投遞、收件人免簽收、不受理書面查詢、遺失亦不予補償</b>。(D)(C)(B) 均為典型誤導。<b>一句話：可追蹤＝看得到、但賠不到。</b>","law":"郵件處理規則","meta":"考點：易錯：可追蹤函件"},{"s":"依郵件處理規則規定，下列何者「得」例外交寄？","o":{"D":"供醫藥或科學之用，作保價包裹交寄並經寄達國准許之嗎啡","C":"經中華郵政公司報請交通部核准之易爆裂物品","B":"寄往日本之包裹內裝夾泥土之活紅蚯蚓","A":"供觀賞用之活魚"},"a":"D","e":"§37、§38 之例外：①<b>鴉片、嗎啡及其他麻醉物品</b>—<b>供醫藥或科學之用、作保價包裹交寄、並經寄達國准許</b>者，得例外交寄（三要件缺一不可）②<b>易燃易爆或其他危險物品</b>—經<b>相關主管機關核發運輸憑照</b>且以特殊方法封裝、或<b>立案機構</b>互寄之<b>易壞生物學物料</b> ③<b>活生動物</b>—<b>蜜蜂、水蛭、蠶</b>，由立案機構互寄之<b>寄生蟲及消除害蟲之蟲類</b>，以及<b>寄往特定國家包裹內裝「不夾泥土」之無害活紅蚯蚓</b>。(B) 夾泥土即不可、(A) 活魚不在例外之列。","law":"郵件處理規則","meta":"考點：核心：禁寄物品之例外"},{"s":"依郵件處理規則規定，有關無法投遞郵件之處理，下列敘述何者錯誤？","o":{"D":"無法投遞之國內函件，退還寄件人；無寄件人姓名、地址者，退回原寄郵局","C":"無法投遞之國內非掛號新聞紙、雜誌，退回原寄郵局並發單通知寄件人，自通知之次日起 15 日內至指定郵局補付郵資領回","B":"無法投遞之國際函件，一律退回原寄國","A":"寄件人於封面註明「無法投遞免退回」者，視為無著郵件"},"a":"B","e":"(B) 錯：§56 第4項—無法投遞之國際函件<b>原則退回原寄國</b>，<b>但「未書有寄件人姓名、地址之明信片」及「未以寄達國通曉之文字註明應行退回之非掛號印刷物」，不予退回原寄國，逕依無著郵件規定處理</b>，故非「一律」。(D)(C) 為 §56 第2、3 項；(A) 為 §58 第2項，均正確。","law":"郵件處理規則","meta":"考點：核心：無法投遞郵件之處理"},{"s":"依郵件處理規則規定，中華郵政公司得委託他人運輸郵件，下列何者「非」屬得受託之陸路運輸業者？","o":{"D":"公路汽車客運業","A":"汽車路線貨運業","B":"汽車貨櫃貨運業","C":"計程車運輸業"},"a":"C","e":"§52：中華郵政公司得委託他人運輸郵件，陸路運輸之受託人限於<b>公路汽車客運業、汽車路線貨運業、汽車貨櫃貨運業</b>等；<b>市區汽車客運業（111 年考點）、計程車運輸業（114 年考點）均不在其列</b>。另受託<b>收寄或投遞</b>郵件之自然人，須具備<b>成年、國民中學以上學校畢業、身心健康</b>之條件。<b>注意：公司「不得」委託他人拆閱及檢查郵件。</b>","law":"郵件處理規則","meta":"考點：核心：委託運輸與收寄投遞"},{"s":"依郵件處理規則規定，下列何者「非」屬掛號郵件之合法收領方式？","o":{"B":"由收件人之同居家屬收領","A":"由收件地址之管理服務人員或郵件收發處收領","D":"投入收件人之住戶受信箱","C":"經由中華郵政公司設置之 i 郵箱收領"},"a":"D","e":"§48：掛號郵件應由<b>收件人、代收人、代理人、同居家屬</b>，或<b>收件地址之接收郵件人員、管理服務人員或郵件收發處</b>收領；亦<b>得經由 i 郵箱收領</b>。<b>掛號郵件不得逕投入住戶受信箱</b>（那是平常郵件的投遞方式），故選 (D)。<b>對照郵政法 §24：地面層未設管理員而僅有受信設備者，「平常郵件」投入受信設備，「掛號郵件及欠資郵件」請收件人至地面層領取或補付欠資。</b>","law":"郵件處理規則","meta":"考點：核心：掛號郵件收領方式"},{"s":"依郵件處理規則規定，國際掛號函件、包裹及保價郵件因不可抗力致全部遺失、被竊或毀損而不予補償者，其已付各項資費之處理，下列何者正確？","o":{"D":"全部不予退還","B":"寄件人得請求退還，但保價費不包括在內","A":"寄件人得請求退還全部資費，包括保價費","C":"退還半數資費"},"a":"B","e":"§66：國際掛號函件、包裹及保價郵件<b>因不可抗力</b>致全部遺失、被竊或毀損<b>而不予補償</b>者，其<b>已付各項資費，寄件人得請求退還；但「保價費」不包括在內</b>。邏輯與 §67 一致—<b>保價費、報值費是承保對價，一旦承保成立即不退</b>。與郵政法 §31 第2款併讀：天災事變不可抗力原則不補償，<b>但保價郵件以因戰事致損失為限仍應補償</b>。","law":"郵件處理規則","meta":"考點：核心：不可抗力之資費退還"},{"s":"依郵件處理規則規定，有關郵票及郵資符誌效力之敘述，下列何者錯誤？","o":{"D":"郵票自發行之日起，始生交付郵費證明之效力","B":"郵件上之郵票應逐一分開端正勻貼，不得重疊；其被掩蓋者，失其效用","C":"由明信片、特製郵簡或特製信封上剪下之郵資符誌，仍得作為郵資使用","A":"郵票有剪割、拼集、塗刮、塗抹膠漿或已使用且經洗刷者，不為遞送"},"a":"C","e":"(C) 錯：§21—由明信片、特製郵簡或特製信封上<b>剪下之郵資符誌，「失其效用」</b>。(D) §18-1（<b>發行之日</b>，不是印製日、購買日或公告日）、(B) §19、(A) §20 均正確。<b>另記郵政法 §18：污損之郵票失其效用；明信片及特製郵簡上表示價格之花紋有污損時亦同。</b>","law":"郵件處理規則","meta":"考點：核心：郵票效力"},{"s":"依郵件處理規則及郵務營業規章規定，下列期限之敘述，何者錯誤？","o":{"A":"經按址投遞而無法投交之掛號郵件，送交指定郵局招領，自通知招領之次日起算 15 日","B":"掛號郵件經投入 i 郵箱，收件人未於投入之次日起算 2 日內領取者，公司得取出送交指定郵局招領","C":"無法投遞而不能退還寄件人之郵件，由原寄郵局招領揭示 1 個月，屆期無人領取者為無著郵件","D":"存局候領之國內快捷郵件，自候領之次日起算以 15 日為限"},"a":"D","e":"(D) 錯：<b>存局候領之「國內快捷郵件」自候領之次日起算以「5 日」為限</b>；<b>國內（一般）郵件為 15 日</b>（得以書面申請延長至 1 個月）、<b>國際郵件為 2 個月</b>。(A) §50 掛號招領 <b>15 日</b>、(B) i 郵箱待領 <b>2 日</b>、(C) §58 招領揭示 <b>1 個月</b>，均正確。<b>期限總表：i 郵箱 2 日／快捷存局候領 5 日／掛號招領 15 日／國內存局候領 15 日（可延至 1 個月）／無著揭示 1 個月／國際存局候領 2 個月／存證信函副本 3 年／無著有價變賣 3 年。</b>","law":"郵件處理規則","meta":"考點：核心：招領與待領期限"},{"s":"依郵件處理規則規定，中華郵政公司對於寄件人交寄郵件之內容，下列何者「得」予以證明？","o":{"B":"報值包裹之內裝物","C":"保價信函之內裝物","A":"存證信函留存郵局之副本","D":"快捷郵件之內裝物"},"a":"A","e":"§3：中華郵政公司對於寄件人交寄郵件之內容，<b>除「存證信函留存郵局之副本」外，不予證明</b>。報值、保價郵件雖有報明價值或保價金額，但郵局<b>僅就金額負補償責任，並不證明其內容為何</b>。這正是存證信函在民事上作為「意思表示到達證明」的法律價值所在。故選 (A)。","law":"郵件處理規則","meta":"考點：核心：郵件內容不予證明"}]}];
let cur=0,state=[];
function init(){ state=P.map(p=>({done:new Set(),ok:0})); render(); }
function render(){
  const p=P[cur],st=state[cur];
  const cnt={};p.qs.forEach(q=>cnt[q.law]=(cnt[q.law]||0)+1);
  let h=`<div class="paperhead"><h2>${p.name}</h2><div class="sub">${p.sub}</div><p>${p.desc}</p>
    <div class="mix">${Object.keys(cnt).map(k=>`<span>${k} ${cnt[k]} 題</span>`).join('')}<span>合計 ${p.qs.length} 題</span></div></div>`;
  h+=p.qs.map((q,i)=>{
    const hot=p.real&&q.acc<0.55?'<span class="badge b-hot">全站正確率 '+Math.round(q.acc*100)+'%</span>':'';
    const opts=['A','B','C','D'].filter(k=>q.o[k]).map(k=>
      `<button class="opt" data-i="${i}" data-o="${k}"><span class="lab">(${k})</span>${q.o[k]}</button>`).join('');
    const dist=q.dist?`<div class="dist">阿摩選答分布：${['A','B','C','D'].map((L,x)=>L+' '+Math.round(q.dist[x]/q.dist.reduce((a,b)=>a+b,0)*100)+'%').join('　')}</div>`:'';
    return `<div class="q" id="q${i}"><div class="stem"><span class="no">${i+1}</span>
      <span class="badge b-law">${q.law}</span>${hot}${q.s}<span class="meta2">${q.meta}</span></div>
      ${opts}<div class="exp" id="e${i}"><b>正解：(${q.a})</b> ${q.o[q.a]}${dist}<div style="margin-top:8px">${q.e}</div></div></div>`;
  }).join('');
  document.getElementById('body').innerHTML=h;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b));
  bar();
}
function ans(b){
  const i=+b.dataset.i,st=state[cur],p=P[cur],box=document.getElementById('q'+i);
  if(st.done.has(i))return; st.done.add(i);
  const a=p.qs[i].a;
  box.querySelectorAll('.opt').forEach(o=>{o.classList.add('lock');if(o.dataset.o===a)o.classList.add('correct')});
  if(b.dataset.o===a)st.ok++; else b.classList.add('wrong');
  document.getElementById('e'+i).classList.add('show'); bar();
}
function bar(){const st=state[cur],p=P[cur];
  document.getElementById('score').textContent=st.ok+' / '+st.done.size+'（共 '+p.qs.length+' 題）';
  document.getElementById('prog').style.width=(st.done.size/p.qs.length*100)+'%';}
document.getElementById('showall').onclick=()=>{const st=state[cur],p=P[cur];
  p.qs.forEach((q,i)=>{const box=document.getElementById('q'+i);
    if(!st.done.has(i)){st.done.add(i);box.querySelectorAll('.opt').forEach(o=>{o.classList.add('lock');if(o.dataset.o===q.a)o.classList.add('correct')})}
    document.getElementById('e'+i).classList.add('show')}); bar();};
document.getElementById('reset').onclick=()=>{state[cur]={done:new Set(),ok:0};render();};
document.querySelectorAll('nav.tabs button').forEach((b,i)=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');cur=i;render();scrollTo(0,0);});
init();
</script></body></html>
