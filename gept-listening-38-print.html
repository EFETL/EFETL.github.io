<script>
/* 圖形素材（第38回 安全與危險） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/38/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const POLICE=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q1.jpg" alt="question 1 picture">`;
const WARNING=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q2.jpg" alt="question 2 picture">`;
const PRISON=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q3.jpg" alt="question 3 picture">`;
const JEEP=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q4.jpg" alt="question 4 picture">`;
const HORSE=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:POLICE,o:["A policeman who keeps us safe.","A doctor who helps sick people.","A teacher who helps students learn."],a:0,sen:"For question one, look at the picture. Who keeps us safe?",szh:"第一題，請看圖片。誰保護我們的安全？",en:"A policeman who keeps us safe.",zh:"保護我們安全的是警察(policeman)，選 A。醫生與老師也幫助人，但不是圖中的人。"},
{n:2,p:0,fig:WARNING,o:["A bus stop sign by the road.","A danger sign by the road.","A hospital sign by the road."],a:1,sen:"For question two, look at the picture. What warns you?",szh:"第二題，請看圖片。什麼在警告你？",en:"A danger sign by the road.",zh:"警告人的是路邊(by)的危險(danger)標誌，選 B。公車站與醫院標誌不是用來警告的。"},
{n:3,p:0,fig:PRISON,o:["To a bank for more money.","To prison, after the police arrest them.","Home, to sleep until noon."],a:1,sen:"For question three, look at the picture. Where do robbers go?",szh:"第三題，請看圖片。搶匪會去哪裡？",en:"To prison, after the police arrest them.",zh:"搶匪被警察(police)逮捕(arrest)後會進監獄(prison)，選 B。回銀行或回家睡覺都不是他們的下場。"},
{n:4,p:0,fig:JEEP,o:["A jeep on the snowy mountain.","A bus on the snowy mountain.","A motorcycle on the snowy mountain."],a:0,sen:"For question four, look at the picture. What vehicle is this?",szh:"第四題，請看圖片。這是什麼車？",en:"A jeep on the snowy mountain.",zh:"圖中是雪(snowy)山(mountain)上的吉普車(jeep)，選 A。公車與摩托車地點相同但車種不對。"},
{n:5,p:0,fig:HORSE,o:["A small donkey in a palace yard.","A royal horse in a palace yard.","A black sheep in a palace yard."],a:1,sen:"For question five, look at the picture. What animal is this?",szh:"第五題，請看圖片。這是什麼動物？",en:"A royal horse in a palace yard.",zh:"選 B。照片中是一匹披著華麗金色馬鞍的白馬(horse),站在宮殿的庭院裡,看起來很尊貴(royal)。驢子(donkey)和綿羊(sheep)都不是照片中的動物。"},

{n:6,p:1,o:["Around eight this evening.","Shall we go for a walk?","Yes, I read enough for tonight."],a:2,sen:"Have you studied for the test tonight?",szh:"你今晚為考試讀書了嗎？",en:"Yes, I read enough for tonight.",zh:"問今晚讀書了沒，答『有，今晚(evening 相關)我讀(read)夠(enough)了』，選 C。A 回答時間（今晚(evening)八點），B 邀約散步(shall)，都沒回答。"},
{n:7,p:1,o:["The package is on my desk.","It's very heavy, I think.","Probably Friday, but I'm not certain."],a:0,sen:"Where is the parcel you were expecting?",szh:"你在等的包裹在哪？",en:"The package is on my desk.",zh:"問包裹在哪，答『包裹(package)在我的桌上(on)』，選 A。B 說它很(very)重，C 說何時到(certain)，都沒回答位置。"},
{n:8,p:1,o:["No, it didn't hit anything.","The horse ran away yesterday.","The cart is made of wood."],a:0,sen:"Did the runaway cart cause any harm?",szh:"那台失控的推車有造成傷害嗎？",en:"No, it didn't hit anything.",zh:"問推車有沒有造成傷害，答『沒有，它沒撞(hit)到任何東西(anything)』，選 A。B 講馬昨天(yesterday)跑掉(away)，C 講材質，都沒回答。"},
{n:9,p:1,o:["On the mountain, near the lake.","Yes, we need extra help.","It will take about two hours."],a:1,sen:"Do we need more people for the rescue?",szh:"救援需要更多人手嗎？",en:"Yes, we need extra help.",zh:"問救援是否需要更多人，答『是，我們需要額外(extra)的幫手』，選 B。A 回答地點(mountain)，C 回答時間，都沒回答是否需要。"},
{n:10,p:1,o:["At the pumpkin farm, I think.","They must beat it with water.","The wind blew in that direction."],a:1,sen:"How can the firefighters stop the wildfire?",szh:"消防員怎麼阻止野火？",en:"They must beat it with water.",zh:"問消防員怎麼阻止野火，答『他們必須用水撲滅(beat)它』，選 B。A 回答地點(pumpkin)，C 描述風向(direction)，都沒回答方法。"},
{n:11,p:1,o:["On the wall near the door.","There are ten rules in all.","Write them down in a notebook."],a:2,sen:"How can I remember the safety rules?",szh:"我要怎麼記住安全規則？",en:"Write them down in a notebook.",zh:"問怎麼記住規則，答『把它們(them)寫(write)在筆記本上』，選 C。A 回答位置，B 回答數量，都沒回答方法。"},
{n:12,p:1,o:["I bought it last summer, actually.","My uncle drives a red jeep.","It's worse; it makes me dizzy."],a:2,sen:"How do you like your old car now?",szh:"你現在覺得你的舊車如何？",en:"It's worse; it makes me dizzy.",zh:"問舊車現在如何，答『更糟(worse)了，讓我頭暈(dizzy)』，選 C。A 回答購買時間，B 講叔叔的吉普車(jeep)，都沒回答感受。"},
{n:13,p:1,o:["A mosquito bites me every night.","My thumb is bigger than yours.","Since yesterday morning, I think."],a:0,sen:"Why is your thumb so red and swollen?",szh:"你的大拇指為什麼又紅又腫？",en:"A mosquito bites me every night.",zh:"問拇指(thumb)為何紅腫，答『蚊子(mosquito)每晚咬(bite)我』，選 A。B 比較大小，C 回答時間(yesterday)，都沒說明原因。"},
{n:14,p:1,o:["Halloween, with a big pumpkin.","At my grandma's house on Sunday.","Easter. Everyone comes back home."],a:2,sen:"What holiday brings the family together in spring?",szh:"春天什麼節日讓家人團聚？",en:"Easter. Everyone comes back home.",zh:"問春天哪個節日讓家人團聚，答『復活節(Easter)，每個人(everyone)都回家』，選 C。萬聖節與南瓜(pumpkin)是秋天，B 回答地點，都不對。"},
{n:15,p:1,o:["Near the police station.","I was asleep at ten.","There was a bad accident."],a:2,sen:"Why were the roads closed last night?",szh:"昨晚道路為什麼封閉？",en:"There was a bad accident.",zh:"問道路為何封閉，答『發生了嚴重事故(accident)』，選 C。A 回答地點(police)，B 說我睡著了(asleep)，都沒說明原因。"},

{n:16,p:2,o:["Someone robbed it.","A storm hit it.","A fire started."],a:0,sen:"W: I came back from my trip, and my window was broken. My TV and my money are gone. &nbsp;M: That's terrible. You should call the police right away. &nbsp;W: I will. &nbsp;Q: What happened to the woman's house?",szh:"女：我旅行回來，窗戶破了。我的電視和錢都不見了。　男：太糟了。你應該馬上報警(police)。　女：我會的。　問：女士的家發生了什麼事？",en:"Someone robbed it.",zh:"窗戶破、電視和錢不見，還要報警，表示被人搶劫/偷竊(rob)，選 A。暴風(hit)雖會弄破窗戶，但不會帶走電視和錢。"},
{n:17,p:2,o:["Turn off the music.","Use a speaker.","Buy a new phone."],a:1,sen:"W: I can't hear the music from your phone. &nbsp;M: Yes, the sound is too low. &nbsp;W: Use the big black box on the shelf. It's much louder. &nbsp;M: Good idea. I'll get it now. &nbsp;Q: What does the woman suggest?",szh:"女：我聽不到你手機的音樂。　男：對，聲音太小。　女：用架上那個黑色大箱子。它大聲(much)多了。　男：好主意。我現在去拿。　問：女士建議什麼？",en:"Use a speaker.",zh:"黑色大箱子聲音更大，就是喇叭/擴音器(speaker)，選 B。她沒有要他關音樂或買新手機。"},
{n:18,p:2,o:["It kicked the boy.","It bit the boy.","It ran away."],a:0,sen:"W: Why did the boy cry? &nbsp;M: He walked behind his uncle's horse. It suddenly hit him with its back leg, and he fell down. &nbsp;W: Poor boy. Is he okay? &nbsp;M: Yes, only a little scared. &nbsp;Q: What did the horse do?",szh:"女：那個男孩為什麼哭？　男：他走到他叔叔的馬(horse)後面。牠突然用後腿打(hit)他，他就跌倒了。　女：可憐的孩子。他還好嗎？　男：還好，只是有點嚇到。　問：馬做了什麼？",en:"It kicked the boy.",zh:"馬用後腿打他，就是踢(kick)他，選 A。對話沒說咬(bite)人或跑走(away)。"},
{n:19,p:2,o:["It is boring.","It is confusing.","It is too expensive."],a:1,sen:"W: Do you like your new phone app? &nbsp;M: I'm a new user. I press the wrong button every time, and I don't know where anything is. &nbsp;W: Maybe you need a lesson. &nbsp;Q: What does the man think of the app?",szh:"女：你喜歡你的新手機程式嗎？　男：我是新使用者(user)。我每次都按錯鈕，也不知道東西在哪。　女：也許你需要上一堂課。　問：男士覺得這個程式如何？",en:"It is confusing.",zh:"他每次按錯鈕、找不到東西，表示程式讓他很困惑，選 B。他沒說無聊或太貴。"},
{n:20,p:2,o:["A big dog, walked by its master.","A white horse, washed by a boy.","A big horse, ridden by its master."],a:2,sen:"W: What did you see on the ranch? &nbsp;M: A big horse, ridden by its master. &nbsp;W: Beautiful. &nbsp;Q: What did the man see?",szh:"女：你在牧場看到什麼？　男：一匹大馬(horse)，被牠的主人(master)騎著。　女：真美。　問：男士看到什麼？",en:"A big horse, ridden by its master.",zh:"看到主人(master)騎的馬(horse)，選 C。狗與被洗的白馬都不是對話內容。"},
{n:21,p:2,o:["He hit it on a door.","He cried all night.","An insect bit it."],a:2,sen:"W: Why is your eye so red and big? &nbsp;M: I think something bit me while I was sleeping. &nbsp;W: Does it hurt? &nbsp;M: A little, but it itches more. &nbsp;W: Put some ice on it. &nbsp;Q: What happened to the man's eye?",szh:"女：你的眼睛(eye)為什麼又紅又腫？　男：我想是睡覺時有東西咬了我。　女：會痛嗎？　男：有一點，但更癢。　女：敷點冰塊。　問：男士的眼睛發生了什麼事？",en:"An insect bit it.",zh:"他說睡覺時有東西咬他，又癢又腫，是被蟲咬，選 C。他沒說撞到門或哭了一整夜。"},
{n:22,p:2,o:["By jeep, up the mountain.","By bus, up the mountain.","By boat, up the river."],a:0,sen:"W: How did the rescue team reach the top? &nbsp;M: By jeep, all the way up the mountain. &nbsp;W: Tough drive. &nbsp;Q: How did the team reach the top?",szh:"女：救援隊怎麼到山頂的？　男：開吉普車(jeep)，一路上(mountain)山。　女：辛苦的路。　問：救援隊怎麼到山頂？",en:"By jeep, up the mountain.",zh:"開吉普車(jeep)上山(mountain)，選 A。公車同樣上山，但對話說的是吉普車。"},
{n:23,p:2,o:["A careful driver.","A brave hero.","A lazy helper."],a:1,sen:"W: Would you really go into that burning house? It's so hot. &nbsp;M: Yes. A little girl is still inside, and no one else is going. &nbsp;W: Please be careful. &nbsp;Q: What kind of person is the man?",szh:"女：你真的要進那間著火的房子嗎？好熱。　男：要。有個小女孩還在裡面，沒有別人要去。　女：請小心。　問：男士是什麼樣的人？",en:"A brave hero.",zh:"他願意冒險進火場救人，是勇敢的英雄(hero)，選 B。女士要他小心，但他本身不是 careful driver。"},
{n:24,p:2,o:["A brave hero, full of courage.","A kind teacher, full of love.","A quiet man, afraid of fire."],a:0,sen:"M: What was the firefighter like? &nbsp;W: A brave hero, full of courage. &nbsp;M: We should thank him. &nbsp;Q: What was the firefighter like?",szh:"男：那位消防員怎麼樣？　女：一位勇敢的英雄(hero)，充滿勇氣(courage)。　男：我們該謝謝他。　問：那位消防員怎麼樣？",en:"A brave hero, full of courage.",zh:"是充滿勇氣(courage)的英雄(hero)，選 A。其他選項與對話不符。"},
{n:25,p:2,o:["Call the boy's father.","Clean the playground.","Give the boy first aid."],a:2,sen:"W: Why did the school nurse run out so fast? &nbsp;M: A boy fell off the swing, and his arm hurts a lot. &nbsp;W: I hope he is OK. &nbsp;Q: What will the nurse probably do?",szh:"女：學校護士為什麼這麼快跑出去？　男：有個男孩從鞦韆上摔下來，手臂很痛。　女：希望他沒事。　問：護士可能會做什麼？",en:"Give the boy first aid.",zh:"男孩受傷，護士跑去，是要幫他急救(aid)，選 C。打電話給爸爸可能之後才做，但不是她跑出去的目的。"},

{n:26,p:3,pic:true,o:[BARS("Safety Calls",["Fire","Police","Aid"],[20,50,80]),BARS("Safety Calls",["Fire","Police","Aid"],[50,80,20]),BARS("Safety Calls",["Fire","Police","Aid"],[80,50,20])],a:2,sen:"Our town counted the safety calls this month. Fire calls were the most common, because of the dry season. Police calls were in the middle, and calls for medical aid were the fewest. So the fire bar should be the tallest. &nbsp;Q: Which chart shows the safety calls?",szh:"我們鎮統計本月的安全(safety)求救電話。火災最多，因為乾季；警察(police)電話中等；求援(aid)最少。所以火災長條最高。　問：哪張圖顯示安全求救？",en:"Fire most, aid least.",zh:"火災最多、求援最少，符合『Fire 最高』，選 C。"},
{n:27,p:3,pic:true,o:[BARS("Accidents",["2021","2022","2023"],[30,55,80]),BARS("Accidents",["2021","2022","2023"],[80,55,30]),BARS("Accidents",["2021","2022","2023"],[55,80,30])],a:1,sen:"The police studied road accidents over three years. In 2021 there were the most accidents, so new safety signs were put up to help drivers avoid trouble. In 2022 the number was in the middle, and by 2023 the fewest. So the accidents went down each year. &nbsp;Q: Which chart shows the accidents?",szh:"警察(police)研究三年的道路事故(accident)。2021 年最多，於是設了新的安全(safety)標誌，幫助駕駛避免(avoid)麻煩；2022 年中等；到 2023 年最少。所以事故逐年下降。　問：哪張圖顯示事故？",en:"2021 most, 2023 least.",zh:"2021 最多、逐年下降，符合『2021 最高、2023 最低』，選 B。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('bread'),IMG('rice')],a:1,sen:"After a dangerous rescue on the snowy mountain, the tired team came down at last. The snow was so deep that the road almost disappeared. There was no way to cook noodles or steam rice in the cold jeep. So the leader handed everyone warm bread, and they ate it with relief, glad that no one was hurt. &nbsp;Q: What did the rescue team eat?",szh:"在雪(snowy)山(mountain)上一次危險(dangerous)的救援後，疲累的隊伍終於下山。雪深到路幾乎消失(disappear)。在寒冷的吉普車(jeep)裡沒法煮麵或蒸飯。所以隊長發給大家溫熱的麵包(bread)，他們鬆一口氣地吃，慶幸沒人受傷。　問：救援隊吃什麼？",en:"Warm bread.",zh:"救援隊吃麵包(bread)，選 B。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('noodles'),IMG('bread'),IMG('rice')],a:0,

 szh:"勇敢的英雄(hero)從事故(accident)中救出孩子後，全鎮都想謝謝他。他受夠了值勤時吃的乾麵包和冷飯。所以一位好心的廚子為他做了一大碗熱麵(noodle)，大家都為他的勇氣(courage)歡呼。　問：廚子為英雄做了什麼？",
 en:"A bowl of noodles.",zh:"廚子做了熱麵(noodle)，選 A。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('park'),IMG('beach')],a:2,sen:"After a stressful week of safety drills, the team wanted a calm day off. It was necessary to rest. Some liked the mountain but it felt dangerous after the storm, and others liked the park. So they chose the beach, because it was the safest place, and everyone could relax by the gentle sea. &nbsp;Q: Where did the team go to relax?",szh:"經過一週緊張的安全(safety)演習後，隊伍想要平靜的休假。他們必須(necessary)休息。有些人喜歡山，但暴風後覺得危險(dangerous)，有些人喜歡公園。所以他們選了海邊(beach)，因為那是最安全的地方(place)，大家能在平靜的海邊放鬆。　問：隊伍去哪裡放鬆？",en:"The beach.",zh:"隊伍去海邊(beach)放鬆，選 C。山、公園為干擾。"}

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 38 回　安全與危險　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}

<script>

(function(){
  const css=`

    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}

  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}

      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');

    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}

    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}

    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};

    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);

  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}

  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';

  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';

    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});

  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;

  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
