<script>
/* 圖形素材（第38回 安全與危險） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/38/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/38/p3_${n}.jpg?v=r38hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const POLICE=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q1.jpg" alt="question 1 picture">`;
const WARNING=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q2.jpg" alt="question 2 picture">`;
const PRISON=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q3.jpg" alt="question 3 picture">`;
const JEEP=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q4.jpg" alt="question 4 picture">`;
const HORSE=`<img class="pic-img p0img" src="gept-listening-img/38/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:POLICE,o:["He is helping an old woman cross the street.","He is helping an old woman get into a police car.","He is carrying the old woman's bag."],a:0,sen:"For question one, look at the picture. What is the policeman doing?",szh:"第一題，請看圖片。這位警察在做什麼？",en:"He is helping an old woman cross the street.",zh:"警察(policeman)讓老太太挽著手臂，陪她走斑馬線過馬路，正確。包包背在老太太自己肩上，不是警察拿著；圖中沒有警車，他們是在過馬路。選 A"},
{n:2,p:0,fig:WARNING,o:["A yellow danger sign stands on a hill by the sea.","A red danger sign stands on a hill by the sea.","A yellow danger sign stands on a beach, and people are swimming."],a:0,sen:"For question two, look at the picture. Which is true about the picture?",szh:"第二題，請看圖片。關於這張圖，何者正確？",en:"A yellow danger sign stands on a hill by the sea.",zh:"黃色的三角形危險(danger)警告牌立在海邊高高的山坡上，正確。牌子是黃色，不是紅色；圖中沒有沙灘，也沒有人在游泳。選 A"},
{n:3,p:0,fig:PRISON,o:["There are people walking behind the fence.","There is a tall tower behind the fence.","There are two tall towers behind the fence."],a:1,sen:"For question three, look at the picture. Which is true about this prison?",szh:"第三題，請看圖片。關於這座監獄，何者正確？",en:"There is a tall tower behind the fence.",zh:"監獄(prison)的圍籬後面有高牆和一座高塔，正確。圖中只有一座塔，不是兩座；圍籬後面空無一人，沒有人在走路。選 B"},
{n:4,p:0,fig:JEEP,o:["A jeep is driving on a mountain road with no snow.","A jeep is driving on a snowy mountain road.","Two jeeps are driving on a snowy mountain road."],a:1,sen:"For question four, look at the picture. What can you see in the picture?",szh:"第四題，請看圖片。你在圖中看到什麼？",en:"A jeep is driving on a snowy mountain road.",zh:"一輛吉普車(jeep)開在積雪(snowy)的山(mountain)路上，正確。圖中只有一輛車，不是兩輛；路上和山上都是雪，不是沒有雪。選 B"},
{n:5,p:0,fig:HORSE,o:["A man is riding a white horse in front of a big old building.","A brown horse is standing in front of a big old building.","A white horse is standing in front of a big old building."],a:2,sen:"For question five, look at the picture. Which is true about this royal horse?",szh:"第五題，請看圖片。關於這匹皇家的馬，何者正確？",en:"A white horse is standing in front of a big old building.",zh:"一匹披著金紅色馬鞍的白色皇家(royal)馬(horse)站在一棟古老的大建築前，正確。馬是白色的，不是棕色；馬背上只有馬鞍，沒有人騎。選 C"},
{n:6,p:1,o:["Put some ice on it. It'll feel better.","Then you should read the safety rules.","My thumb is longer than yours."],a:0,sen:"A mosquito bit my thumb last night.",szh:"昨晚蚊子叮了我的大拇指。",en:"Put some ice on it. It'll feel better.",zh:"對方說被蚊子(mosquito)叮(bite)了大拇指(thumb)，建議「冰敷一下就會好一點」最自然。「我的拇指比你的長」只是重複 thumb；「那你應該讀安全規則」與被蚊子叮無關。選 A"},
{n:7,p:1,o:["It's very heavy, isn't it?","It came yesterday afternoon.","On the table by the door, please."],a:2,sen:"Where shall I put this package?",szh:"這個包裹我要放在哪裡？",en:"On the table by the door, please.",zh:"問包裹(package)要放「哪裡」，答「請放門邊的桌上」才是地點。「它昨天(yesterday)下午到的」答的是時間；「它很(very)重，對吧？」沒有回答放哪裡。選 C"},
{n:8,p:1,o:["Only when big waves hit the rocks.","Swimming is good for your health.","The pool opens at nine."],a:0,sen:"Is it dangerous to swim here?",szh:"在這裡游泳危險嗎？",en:"Only when big waves hit the rocks.",zh:"問在這裡游泳危不危險(dangerous)，答「只有大浪打(hit)上岩石的時候才危險」是間接的回答。「游泳對健康好」沒回答危不危險；「游泳池九點開」答的是時間，而且這裡說的是海邊不是泳池。選 A"},
{n:9,p:1,o:["Yes, it's very busy today.","Sit down here. I'll get you some water.","Me, too. I feel great today."],a:1,sen:"I feel a little dizzy.",szh:"我覺得有點頭暈。",en:"Sit down here. I'll get you some water.",zh:"對方說頭暈(dizzy)，回「在這裡坐下，我去幫你拿水」最自然。「我也是，我今天感覺很好」前後矛盾；「是的，今天很忙」是把 dizzy 聽成發音相近的 busy。選 B"},
{n:10,p:1,o:["Go straight and turn left at the bank.","It's open all day and all night.","The police help everyone in town."],a:0,sen:"Which direction is the police station?",szh:"警察局在哪個方向？",en:"Go straight and turn left at the bank.",zh:"問警察局在哪個方向(direction)，答「直走，在銀行左轉」才是方向。「它整天整夜都開著」答的是開放時間；「警察(police)幫助鎮上每個人(everyone)」只是重複 police。選 A"},
{n:11,p:1,o:["The pumpkins are from my uncle's farm.","No, thanks. I've had enough.","Yes, I made it myself."],a:1,sen:"Would you like some more pumpkin pie?",szh:"你要不要再來點南瓜派？",en:"No, thanks. I've had enough.",zh:"對方問要不要(would)再吃南瓜(pumpkin)派，答「不用了，謝謝，我吃夠(enough)了」最自然。「是的，是我自己做的」好像自己才是請客的人，人物顛倒；「南瓜是我叔叔農場的」只是重複 pumpkin。選 B"},
{n:12,p:1,o:["The speaker at the meeting was great.","Yes, it's very loud.","Did you ask your brother? He used it yesterday."],a:2,sen:"My new speaker disappeared from my desk.",szh:"我的新喇叭從我桌上不見了。",en:"Did you ask your brother? He used it yesterday.",zh:"對方說新喇叭(speaker)不見了(disappear)，回「你問過你弟弟了嗎？他昨天用過」是幫忙找的自然回應。「會議上的講者很棒」把 speaker 當成「演講者」，是同字陷阱；「是的，它很大聲」沒回應東西不見的事。選 C"},
{n:13,p:1,o:["I read them yesterday.","So we can avoid accidents.","There are ten rules on the wall."],a:1,sen:"Why do we have to read the safety rules?",szh:"我們為什麼要讀安全規則？",en:"So we can avoid accidents.",zh:"問「為什麼」要讀(read)安全(safety)規則，答「這樣我們才能避免(avoid)意外(accident)」是理由。「我昨天讀過了(them)」答的是自己做了什麼；「牆上有十條規則」答的是數量和位置。選 B"},
{n:14,p:1,o:["In early April, I think.","It was on a Sunday last year.","We paint eggs for it."],a:0,sen:"When is Easter this year?",szh:"今年復活節是什麼時候？",en:"In early April, I think.",zh:"問今年復活節(Easter)「什麼時候」，答「我想是四月初」最直接。「我們會為它彩繪蛋」答的是做什麼；「去年是在星期天」時態不對，問的是今年。選 A"},
{n:15,p:1,o:["I wrote it on the board.","Just on the first one.","Yes, my name is Tina."],a:1,sen:"Is it necessary to write my name on every page?",szh:"每一頁都必須寫上我的名字嗎？",en:"Just on the first one.",zh:"問是否每頁都必須(necessary)寫(write)名字，答「只要第一頁就好」是間接的「不用」。「是的，我叫 Tina」用 Yes 開頭卻在自我介紹；「我把它寫在黑板上」說的是自己做了什麼。選 B"},
{n:16,p:2,o:["Her TV.","Her computer.","Her camera."],a:2,sen:"W: Someone broke my window yesterday evening while I was out. &nbsp;M: Oh no! Did they take much? &nbsp;W: Not much. My TV and computer are still here, but my old camera disappeared. &nbsp;M: You should call the police. &nbsp;Q: What did the robber take?",szh:"女：昨天傍晚(evening)我出門時，有人打破了我的窗戶。　男：糟糕！東西被拿走很多(much)嗎？　女：不多。電視和電腦都還在，可是我的舊相機不見了(disappear)。　男：你應該報警(police)。　問：小偷(robber)拿走了什麼？",en:"Her camera.",zh:"女士說電視和電腦都還在，只有舊相機不見了(disappear)，所以小偷(rob)拿走的是相機。電視、電腦是「還在」的東西，是用來混淆的。選 C"},
{n:17,p:2,o:["By swimming to him.","With a long stick.","By calling the police."],a:1,sen:"W: Ken saved a little boy at the river yesterday. &nbsp;M: Wow, he's a hero! Did he jump in and swim to him? &nbsp;W: No, Ken can't swim. He held out a long stick, and the boy took it. The police came later. &nbsp;Q: How did Ken save the boy?",szh:"女：Ken 昨天在河邊救了一個小男孩。　男：哇，他是英雄(hero)！他是跳下去游過去救的嗎？　女：不是，Ken 不會游泳。他伸出一根長棍子，男孩抓住了。警察(police)是後來才到的。　問：Ken 怎麼救男孩？",en:"With a long stick.",zh:"Ken 不會游泳，他是伸出長棍子讓男孩抓住。游過去是男士的猜測，被女士否定；警察(police)是後來才到，不是 Ken 救人的方法。選 B"},
{n:18,p:2,o:["The man.","She chose the place herself.","The horse's master."],a:2,sen:"M: What happened to your leg? &nbsp;W: A horse kicked me at the farm. &nbsp;M: Ouch! Did you stand behind it? &nbsp;W: Yes, but its master told me to stand there. He said it was a safe place. &nbsp;Q: Who told the woman where to stand?",szh:"男：你的腿怎麼了？　女：在農場被一匹馬(horse)踢(kick)了。　男：好痛！你是站在牠後面嗎？　女：對，可是是牠的主人(master)叫我站那裡的，他說那是安全的地方(place)。　問：誰叫女士站在那裡？",en:"The horse's master.",zh:"女士說是馬的主人(master)叫她站在馬後面，還說那個地方(place)安全。男士只是問她是不是站在後面，不是他叫的；她也不是自己選的位置。選 C"},
{n:19,p:2,o:["Yesterday.","This evening.","Tomorrow."],a:1,sen:"W: Is your cold any better? &nbsp;M: No, it's worse than yesterday. I'm dizzy, and my eyes hurt. &nbsp;W: You should see a doctor today, not tomorrow. &nbsp;M: OK. I'll go this evening after work. &nbsp;Q: When will the man see a doctor?",szh:"女：你的感冒有好一點嗎？　男：沒有，比昨天(yesterday)更糟(worse)。我頭暈(dizzy)，眼睛(eye)也痛。　女：你應該今天就去看醫生，不要等明天。　男：好，我今天傍晚(evening)下班後去。　問：男士什麼時候去看醫生？",en:"This evening.",zh:"女士要他今天就去，不要等明天，男士說今天傍晚(evening)下班後去。昨天(yesterday)是拿來比較病情的；明天是女士叫他「不要」等的時間。選 B"},
{n:20,p:2,o:["On Saturday.","On Friday.","Early on Sunday morning."],a:2,sen:"W: Let's visit the royal garden on Saturday. &nbsp;M: Everyone goes there on weekends. Let's avoid the crowd and go on Friday. &nbsp;W: I have to work on Friday. How about early Sunday morning? &nbsp;M: Fine. Not many people get up that early. &nbsp;Q: When will they visit the royal garden?",szh:"女：我們星期六去皇家(royal)花園吧。　男：週末大家(everyone)都去那裡。我們避開(avoid)人潮，星期五去吧。　女：我星期五要上班。星期天一大早呢？　男：好，沒什麼人會那麼早起。　問：他們什麼時候去皇家花園？",en:"Early on Sunday morning.",zh:"星期六人太多，男士想避開(avoid)；星期五女士要上班；最後兩人同意星期天一大早去。星期六和星期五都是被否定的時間。選 C"},
{n:21,p:2,o:["She gave the boy first aid.","She fixed his bicycle.","She took the boy home."],a:0,sen:"W: A boy fell off his bicycle in front of our school. &nbsp;M: Is he OK? &nbsp;W: He hurt his knee. I gave him first aid, and his mom is coming to take him home. &nbsp;Q: What did the woman do?",szh:"女：有個男孩在我們學校前面從腳踏車上摔下來。　男：他還好嗎？　女：他膝蓋受傷了。我幫他做了急救(aid)，他媽媽會來帶他回家。　問：女士做了什麼？",en:"She gave the boy first aid.",zh:"女士說她幫男孩做了急救(first aid)。帶他回家的是要來的媽媽，不是女士；對話沒有提到修腳踏車。選 A"},
{n:22,p:2,o:["Her team won four to one.","The Tigers won.","Amy didn't play."],a:1,sen:"M: Did your team beat the Tigers? &nbsp;W: No, we lost, three to two. But Amy showed real courage. She played with a hurt foot. &nbsp;M: Last year you beat them four to one, right? &nbsp;W: Yes, but this year they're much stronger. &nbsp;Q: What happened in the game this year?",szh:"男：你們隊打敗(beat)老虎隊了嗎？　女：沒有，我們以二比三輸了。不過 Amy 表現得很有勇氣(courage)，她腳受傷還上場。　男：去年你們四比一贏他們，對吧？　女：對，但今年他們強多了。　問：今年的比賽結果如何？",en:"The Tigers won.",zh:"女士說「我們輸了」，換句話說就是老虎隊贏了。四比一是去年的比分；Amy 腳受傷還是有上場，不是沒打。選 B"},
{n:23,p:2,o:["This morning.","On Monday.","On Wednesday."],a:2,sen:"M: When will my package come? &nbsp;W: The shop said Monday. But the storm stopped all the trucks, so it'll be two days late. &nbsp;M: Are you certain? &nbsp;W: Yes. I called the shop this morning. &nbsp;Q: When will the package come?",szh:"男：我的包裹(package)什麼時候會到？　女：店家說星期一。但暴風雨讓所有卡車都停了，所以會晚兩天。　男：你確定(certain)嗎？　女：確定，我今天早上打電話問過店家。　問：包裹什麼時候會到？",en:"On Wednesday.",zh:"原本星期一到，晚兩天就是星期三。星期一是原本的日期；今天早上是女士打電話問店家的時間。選 C"},
{n:24,p:2,o:["It is easy to use.","Everyone should get it.","It is hard to use."],a:2,sen:"W: This new phone game is easy to use. Everyone in my class has it. &nbsp;M: Not for me. I'm a new user, and I can't find anything on it. &nbsp;W: Don't worry. I'll show you after class. &nbsp;Q: What does the man think of the game?",szh:"女：這個新的手機遊戲很容易上手，我們班每個人(everyone)都有。　男：對我來說不是。我是新使用者(user)，在上面什麼(anything)都找不到。　女：別擔心，下課我教你。　問：男士覺得這個遊戲怎麼樣？",en:"It is hard to use.",zh:"男士說「對我來說不是」，又說什麼都找不到，表示他覺得很難用。「很好用」是女士的看法；「每個人都該用」對話中沒人這樣說。選 C"},
{n:25,p:2,o:["He ran away last night.","He is in prison now.","The police never arrested him."],a:0,sen:"W: Did you hear? The man who robbed the bank is in prison now. &nbsp;M: Not now. The police arrested him last week, but he ran away from prison last night. &nbsp;W: Oh no! I hope they find him soon. &nbsp;Q: What is true about the man?",szh:"女：你聽說了嗎？搶(rob)銀行的那個人現在在監獄(prison)裡。　男：現在不在了。警察(police)上週逮捕(arrest)了他，但他昨晚逃出監獄(away)了。　女：糟糕！希望他們快點找到他。　問：關於那個人，何者正確？",en:"He ran away last night.",zh:"男士更正女士：那人上週被逮捕(arrest)，但昨晚逃(away)出監獄了。「現在在監獄裡」是女士過時的消息；警察上週確實逮捕過他，所以「從沒被逮捕」也不對。選 A"},
{n:26,p:3,pic:true,o:[BARS("School Accidents",["Stairs","Gym","Yard"],[80,20,50]),BARS("School Accidents",["Stairs","Gym","Yard"],[20,80,50]),BARS("School Accidents",["Stairs","Gym","Yard"],[50,20,80])],a:2,sen:"Our school counted student accidents last term. Many people think the gym is the most dangerous place, but it had the fewest accidents. Most accidents happened in the yard, because students run there at lunch. So now it's necessary to walk, not run, in the yard and on the stairs. &nbsp;Q: Which chart shows the accidents last term?",szh:"我們學校統計了上學期學生的意外(accident)。很多人以為體育館是最危險(dangerous)的地方(place)，但那裡的意外最少。最多意外發生在操場，因為學生午餐時間在那裡跑。所以現在在操場和樓梯上都必須(necessary)用走的，不能跑。　問：哪張圖是上學期的意外次數？",en:"Yard most, stairs second, gym fewest.",zh:"體育館意外最少，操場最多，剩下的樓梯就是第二，所以操場最高、樓梯第二、體育館最低。體育館最高的那張是「很多人以為」的想法，與事實相反；樓梯最高的那張把操場和樓梯弄反了。選 C"},
{n:27,p:3,pic:true,o:[BARS("Police Calls",["Accident","Pet","Noise"],[85,45,25]),BARS("Police Calls",["Accident","Pet","Noise"],[45,20,75]),BARS("Police Calls",["Accident","Pet","Noise"],[20,50,80])],a:2,sen:"Last month, a policeman visited our class and told us about his work. Most people think car accidents are the biggest part of his job, but they're not. His station got more calls about lost pets than about car accidents. And there were even more calls about loud noise in the evening than about pets. &nbsp;Q: Which chart shows the calls to the police station?",szh:"上個月有一位警察(policeman)來我們班，跟我們聊他的工作。大部分人以為車禍(accident)是他工作中最大的部分，但其實不是。他們警察局接到關於走失寵物的電話比車禍還多。而晚上(evening)關於吵鬧聲的電話又比寵物的更多。　問：哪張圖是打到警察(police)局的電話？",en:"Noise most, pets second, accidents fewest.",zh:"寵物的電話比車禍(accident)多，晚上(evening)吵鬧聲的又比寵物更多，所以吵鬧聲最高、寵物第二、車禍最低。車禍最高的那張是「大部分人以為」的想法，被否定了；吵鬧聲最高但車禍第二的那張，和「寵物比車禍多」相反。選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28a'),PH('q28c')],a:1,sen:"At the horse farm, the master gave us three safety rules. First, never stand behind a horse, because it may kick. Second, give it an apple on a flat hand, so it won't bite your fingers. Third, don't ride a horse without him. Everyone listened, but my brother forgot the first rule. &nbsp;Q: What did the speaker's brother do?",szh:"在馬(horse)場，主人(master)給了我們三條安全(safety)規則。第一，絕對不要站在馬後面，因為牠可能會踢(kick)人。第二，把蘋果放在攤平的手掌上餵牠，這樣牠才不會咬(bite)到手指。第三，他不在時不要騎馬。大家(everyone)都有聽，但我弟弟忘了第一條。　問：說話者的弟弟做了什麼？",en:"He stood behind a horse.",zh:"弟弟忘了第一條規則，也就是「不要站在馬後面」，所以他站到馬後面去了。用攤平的手餵蘋果、有主人陪著騎馬都是照規則做的事，不是弟弟忘記的那一條。選 B"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29a'),PH('q29b')],a:0,sen:"Last Halloween, my sister cut a face into a pumpkin and hurt her thumb. So this year, Mom said cutting pumpkins was too dangerous. My little brother wanted to just put them by the door with no faces. But in the end, we painted happy faces on them with black paint. &nbsp;Q: What did the family's pumpkins look like this year?",szh:"去年萬聖節，我姊姊在南瓜(pumpkin)上刻臉，割傷了大拇指(thumb)。所以今年媽媽說刻南瓜太危險(dangerous)了。我弟弟想直接把南瓜(them)放在門邊，不畫臉。但最後我們用黑色顏料在南瓜上畫了笑臉。　問：這一家今年的南瓜是什麼樣子？",en:"Pumpkins with painted happy faces.",zh:"刻臉的南瓜是去年的做法，今年媽媽說太危險(dangerous)；沒有臉的南瓜是弟弟的想法，沒有採用；最後是用黑色顏料畫上笑臉。選 A"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:0,sen:"Last winter, my uncle's jeep got stuck on a snowy mountain road at night. He wanted to walk to the next town, but it was ten miles away, and walking in deep snow is very dangerous. So he stayed in his jeep, put on all his extra clothes, and waited. He even fell asleep for a while. The next morning, a policeman found him. &nbsp;Q: What did the uncle do that night?",szh:"去年冬天，我叔叔的吉普車(jeep)晚上卡在積雪(snowy)的山(mountain)路上。他想走去下一個鎮，但那裡有十英里遠，在深雪中走路非常(very)危險(dangerous)。所以他留在車上，穿上所有多帶的(extra)衣服等待，甚至還睡著(asleep)了一會兒。隔天早上，一位警察(policeman)找到了他。　問：叔叔那天晚上做了什麼？",en:"He stayed in his jeep and waited.",zh:"走到下一個鎮是他想做但因為太危險而沒做的事；警察(policeman)找到他是隔天早上的事；那天晚上他穿上多帶的(extra)衣服待在車裡等。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 38 回　安全與危險　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
