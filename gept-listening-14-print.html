{n:6,p:1,o:["The kangaroo jams the gun.","Perhaps; the tool is important, so be easy with it.","She plays the trumpet upon the stove."],a:1,

{n:7,p:1,o:["Usually on the soft sofa, right in the middle.","The pink kite is real.","We admire the tank."],a:0,

{n:8,p:1,o:["The needle expresses a purpose.","The pot is on the table.","Yes, for real; I hardly ever knock the gate when I drive."],a:2,

{n:9,p:1,o:["The soap is pink.","The guitar and the trumpet, and I love to play in public.","The tank is easy."],a:1,

{n:10,p:1,o:["I can reach it as I grow; pay attention, please.","The kite is pink.","The kangaroo drives."],a:0,

{n:11,p:1,o:["The towel is in the pocket.","The pan is public.","I use the needle to express my purpose, and I apply it with care."],a:2,

{n:12,p:1,o:["The knife is easy.","Near the public water tank; a great prize is inside.","We usually drive a wok."],a:1,

{n:14,p:1,o:["The trumpet is real.","The kite flies upon the hill.","A sheet of paper, a tangerine, and a toothbrush."],a:2,

 en:"A sheet, a tangerine, and a toothbrush.",zh:"問口袋(pocket)裡放什麼，答『一張(sheet)紙、一顆橘子(tangerine)和一支牙刷(toothbrush)』，選 C。trumpet/real、kite/upon 為干擾。"},
{n:15,p:1,o:["The soap is important.","The kangaroo I admire sits upon the green hill.","The gun is public."],a:1,

{n:16,p:2,o:["A knife and a plate.","A guitar.","A kite."],a:0,

{n:17,p:2,o:["In a pocket.","On the sofa.","In the refrigerator, next to the pot."],a:2,

 en:"In the refrigerator.",zh:"牛奶放冰箱(refrigerator)裡，選 C。"},
{n:18,p:2,o:["A knife.","A sofa and a small table.","A kite."],a:1,

{n:19,p:2,o:["A towel and some soap.","A pot.","A guitar."],a:0,

{n:20,p:2,o:["On New Year.","On Teacher's Day.","On Valentine's Day, with a rose."],a:2,

{n:26,p:3,pic:true,o:[BARS("Items Sold",["Pot","Towel","Kite"],[20,50,80]),BARS("Items Sold",["Pot","Towel","Kite"],[50,80,20]),BARS("Items Sold",["Pot","Towel","Kite"],[80,50,20])],a:2,

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 14 回　日常用品　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
