<div class="bar">
 <b>🖨 第 14 回　日常用品　聽力測驗　列印版</b>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第14回 日常用品） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/14/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/14/p3_${n}.jpg?v=r14std2-20261030" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const KNIFEPLATE=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q1.jpg" alt="question 1 picture">`;
const POT=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q2.jpg" alt="question 2 picture">`;
const FRIDGE=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q3.jpg" alt="question 3 picture">`;
const TOWEL=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q4.jpg" alt="question 4 picture">`;
const KITE=`<img class="pic-img p0img" src="gept-listening-img/14/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:KNIFEPLATE,o:["A knife is on the plate, and a glass is next to the plate.","A knife and a glass are next to an empty plate.","A knife and two glasses are next to an empty plate."],a:1,sen:"For question one, look at the picture. What is on the table?",szh:"第一題，請看圖片。桌上有什麼？",en:"A knife and a glass are next to an empty plate.",zh:"桌上(table)有一個空盤子(plate)，旁邊放著一把刀(knife)和一個玻璃杯(glass)，正確。刀子是放在盤子旁邊，不是盤子上；杯子只有一個，不是兩個。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">KITCHEN SALE</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Pot</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Pan</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Wok</td><td style="text-align:right;font-weight:700">$400</td></tr><tr><td style="padding:4px 30px 4px 0">Knife</td><td style="text-align:right;font-weight:700">$100</td></tr></table></div>`,o:["She will have one hundred dollars left.","She will have four hundred dollars left.","She will have five hundred dollars left."],a:0,sen:"For question two, look at the picture. Mom has eight hundred dollars. She buys a pot and a wok. How much will she have left?",szh:"第二題，請看圖片。媽媽有八百元。她買了一個湯鍋和一個炒鍋。她還剩多少錢？",en:"She will have one hundred dollars left.",zh:"價目表上湯鍋(pot)300元、炒鍋(wok)400元，一共700元，800減700剩100元。剩四百元是只買了炒鍋、忘記湯鍋的算法；剩五百元是只買了湯鍋、忘記炒鍋。選 A"},
{n:3,p:0,fig:FRIDGE,o:["Two watermelons are in the middle of the refrigerator.","A watermelon is on the top shelf of the refrigerator.","A watermelon is in the middle of the refrigerator."],a:2,sen:"For question three, look at the picture. What is in the refrigerator?",szh:"第三題，請看圖片。冰箱裡有什麼？",en:"A watermelon is in the middle of the refrigerator.",zh:"一顆西瓜(watermelon)放在冰箱(refrigerator)中間(middle)那一層，正確。最上層放的是裝蔬果的盒子，不是西瓜；西瓜只有一顆，不是兩顆。選 C"},
{n:4,p:0,fig:TOWEL,o:["The soap is on the towel, and the toothbrush is in a cup.","The towel is on the soap, and the toothbrush is in a cup.","The soap is on the towel, and there are two toothbrushes in a cup."],a:0,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"The soap is on the towel, and the toothbrush is in a cup.",zh:"一塊肥皂(soap)放在摺好的毛巾(towel)上，一支牙刷(toothbrush)插在杯子裡，正確。把毛巾和肥皂的上下位置說反是陷阱；杯子裡只有一支牙刷，不是兩支。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Kites Sold</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="96" y="90" width="44" height="60" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="85" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="70" width="44" height="80" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="65" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="228" y="110" width="44" height="40" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="105" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Pink</text><text x="118" y="167" text-anchor="middle">Blue</text><text x="184" y="167" text-anchor="middle">Green</text><text x="250" y="167" text-anchor="middle">Red</text></g></svg>`,o:["They sold fifty kites.","They sold ninety kites.","They sold eighty kites."],a:2,sen:"For question five, look at the picture. The shop sold pink kites and blue kites last week. How many kites did it sell in all?",szh:"第五題，請看圖片。這家店上週賣了粉紅色風箏和藍色風箏。一共賣了多少只風箏？",en:"They sold eighty kites.",zh:"圖中粉紅色(pink)風箏50只、藍色風箏30只，加起來80只風箏(kite)。50只是只算了粉紅色的；90是把粉紅色和綠色的40只加在一起，看錯了顏色。選 C"},
{n:6,p:1,o:["Sorry, my brother has them. Perhaps on Friday?","Sure, I'll borrow yours, too.","I usually use them in the yard."],a:0,sen:"Can I borrow your tools this afternoon?",szh:"今天下午可以借你的工具嗎？",en:"Sorry, my brother has them. Perhaps on Friday?",zh:"對方想借(borrow)工具(tool)，答「抱歉，在我哥哥那裡，也許(perhaps)週五可以？」是委婉說明現在不行。「好，我也會借你的」人物顛倒；「我通常(usually)在院子裡用」沒有回答能不能借。選 A"},
{n:7,p:1,o:["I usually go to bed at ten.","Yes, I bought a new bed.","Sure. Once upon a time, there was a kangaroo with no pocket."],a:2,sen:"Grandpa, can you tell me a story before bed?",szh:"爺爺，睡前可以講個故事給我聽嗎？",en:"Sure. Once upon a time, there was a kangaroo with no pocket.",zh:"孫子請爺爺講睡前故事，答「好啊，從前從前(upon)有一隻沒有口袋(pocket)的袋鼠(kangaroo)」直接開始講故事。「我通常十點睡」只重複 bed；「對，我買了一張新床」也只是重複 bed。選 C"},
{n:8,p:1,o:["They're in the middle of the table.","Here, stand on this chair.","I'll wash the plates later."],a:1,sen:"I can't reach the plates on the top shelf.",szh:"我拿不到最上層架子的盤子。",en:"Here, stand on this chair.",zh:"對方說搆(reach)不到最上層的盤子(plate)，回「來，站到這張椅子上」是幫忙想辦法。「它們在桌子中間(middle)」和對方說的位置矛盾；「我待會洗盤子」只重複 plates。選 B"},
{n:9,p:1,o:["My shirt buttons often come off.","Yes, I bought a needle.","In my left pocket, I think."],a:0,sen:"Why do you keep a needle in your pocket?",szh:"你為什麼在口袋裡放一根針？",en:"My shirt buttons often come off.",zh:"問為什麼(why)在口袋(pocket)放針(needle)，答「我的襯衫釦子常常掉」間接說明需要隨時縫。「在我左邊口袋吧」答的是地點；「是的，我買了一根針」用 Yes 回答 why 問句。選 A"},
{n:10,p:1,o:["It takes about twenty minutes.","Not anymore. I take the public bus now.","Yes, I drove your car."],a:1,sen:"Do you usually drive to work?",szh:"你通常開車上班嗎？",en:"Not anymore. I take the public bus now.",zh:"問平常(usually)是不是開車(drive)上班，答「現在不開了，我搭公車(public bus)」說明了改變。「大約二十分鐘」答的是多久；「對，我開了你的車」時態和內容都不對。選 B"},
{n:11,p:1,o:["When did you get the prize?","Good luck! You love books.","Yes, I'll borrow your book."],a:1,sen:"I'm going to apply for a job at the bookstore.",szh:"我要去應徵書店的工作。",en:"Good luck! You love books.",zh:"對方說要去書店(bookstore)應徵(apply)工作，回「祝你好運！你那麼愛書」最自然。「你什麼時候得到那個獎(prize)的？」沒人提到得獎；「對，我會借你的書」只是重複 book。選 B"},
{n:12,p:1,o:["He bought it himself with his own money.","Yes, it's a water gun.","He plays with it every day."],a:0,sen:"Who gave your son that water gun?",szh:"是誰給你兒子那把水槍的？",en:"He bought it himself with his own money.",zh:"問是誰(who)給兒子水槍(gun)，答「他用自己的錢自己(himself)買的」，說明沒有人給他。「他每天都在玩」答的是頻率；「是的，那是水槍」用 Yes 回答 who 問句。選 A"},
{n:13,p:1,o:["I'll knock louder next time.","I heard a loud noise from your room.","At about eleven, I think."],a:1,sen:"Why did you knock on my door so late last night?",szh:"你昨晚為什麼那麼晚來敲我的門？",en:"I heard a loud noise from your room.",zh:"問為什麼那麼晚來敲(knock)門，答「我聽到你房間傳來很大的聲音」才是原因。「下次我會敲大聲一點」只重複 knock；「大概十一點吧」答的是時間。選 B"},
{n:14,p:1,o:["It's in the refrigerator.","I can hardly hear you.","Then use the small one. It's easier."],a:2,sen:"This pot is too heavy. I can hardly lift it.",szh:"這個鍋子太重了，我幾乎拿不起來。",en:"Then use the small one. It's easier.",zh:"對方說鍋子(pot)太重幾乎(hardly)拿不動，建議「那就用小的，比較輕鬆(easy)」最合理。「我幾乎聽不到你說話」只重複 hardly；「在冰箱(refrigerator)裡」答的是位置，對方手上已經拿著鍋子。選 C"},
{n:15,p:1,o:["It's about ten meters long.","I bought it at the public market.","We use it to dry clothes in the yard."],a:2,sen:"What's the purpose of this long rope?",szh:"這條長繩子是做什麼用的？",en:"We use it to dry clothes in the yard.",zh:"問長繩子(rope)的用途(purpose)，答「我們用它在院子晾衣服」才是用途。「大約十公尺長」答的是長度，只重複 long；「在公有(public)市場買的」答的是在哪裡買。選 C"},
{n:16,p:2,o:["Write a song for her.","Give her a guitar.","Buy her flowers."],a:0,sen:"M: What should I get Lisa for Valentine's Day? Flowers? &nbsp;W: Everyone gives flowers. Why don't you express your love yourself? &nbsp;M: What do you mean? &nbsp;W: You play the guitar. Write her a song. &nbsp;Q: What does the woman suggest?",szh:"男：情人節(Valentine's Day)我該送 Lisa 什麼？花嗎？　女：大家都送花。你為什麼(why)不自己(yourself)表達(express)你的愛呢？　男：什麼意思？　女：你會彈吉他(guitar)，寫首歌給她。　問：女士建議什麼？",en:"Write a song for her.",zh:"女士說大家都送花，建議男士自己(yourself)表達(express)心意：他會彈吉他(guitar)，就寫一首歌給她。送花是女士覺得太普通的做法；吉他是男士自己會彈的樂器，不是要送的禮物。選 A"},
{n:17,p:2,o:["Five days.","Three days.","Eight days."],a:2,sen:"M: How long are you staying in Singapore? &nbsp;W: Five days. Then I'll visit my aunt in Japan for three more days. &nbsp;M: And then you'll come home? &nbsp;W: Yes, right after that. &nbsp;Q: How long will the woman be away?",szh:"男：你要在新加坡(Singapore)待多久？　女：五天。然後我會去日本找阿姨，再待三天。　男：然後就回家了？　女：對，接著就回來。　問：女士總共會離開多久？",en:"Eight days.",zh:"新加坡(Singapore)五天加日本三天，總共八天。五天只是新加坡的天數；三天只是日本的天數。選 C"},
{n:18,p:2,o:["Putting away their kitchen things.","Cooking dinner on the stove.","Shopping for new pans and plates."],a:0,sen:"W: Where should I put this wok? &nbsp;M: Under the stove, with the pots. &nbsp;W: And the pan? &nbsp;M: Hang it on the wall. It's too big for the cabinet. &nbsp;W: OK. Where are the plates? &nbsp;M: Still in the boxes. Let me open them. &nbsp;Q: What are the speakers doing?",szh:"女：這個炒鍋(wok)我該放哪裡？　男：爐子(stove)下面，和湯鍋(pot)放一起。　女：那平底鍋(pan)呢？　男：掛(hang)在牆上，櫃子放不下。　女：好。盤子在哪裡？　男：還在箱子裡，我來打開。　問：說話的人在做什麼？",en:"Putting away their kitchen things.",zh:"兩人在問每樣廚具放哪裡：炒鍋(wok)和湯鍋(pot)放爐子(stove)下面，平底鍋(pan)掛(hang)在牆上，盤子還在箱子裡，所以是在整理廚房的東西。他們沒有在煮飯，爐子只是放鍋子的位置；也沒有去買新的鍋子和盤子，東西都已經在家了。選 A"},
{n:19,p:2,o:["In a bathroom.","At a hotel.","At a restaurant."],a:1,sen:"M: Excuse me, my bathroom has no towels. &nbsp;W: I'm sorry, sir. Which room are you in? &nbsp;M: Room 305, on the third floor. &nbsp;W: I'll bring some now. Do you need soap, too? &nbsp;M: Yes, please. And can I have breakfast in my room tomorrow? &nbsp;W: Of course. Just tell me the time. &nbsp;Q: Where are the speakers?",szh:"男：不好意思，我的浴室沒有毛巾(towel)。　女：很抱歉，先生。您住哪一間房？　男：305號房，在三樓。　女：我現在就拿過去。您也需要肥皂(soap)嗎？　男：要，麻煩你。還有，我明天可以在房間吃早餐嗎？　女：當然可以。請告訴我時間。　問：說話的人在哪裡？",en:"At a hotel.",zh:"男士說房間號碼和樓層、浴室沒有毛巾(towel)，還要肥皂(soap)和房間用餐，女士是來服務的人，所以兩人在旅館。浴室只是他要毛巾的地方，兩人不是站在浴室裡；早餐是在房間吃，不是在餐廳。選 B"},
{n:20,p:2,o:["The woman.","The man's dad.","The man."],a:1,sen:"W: Did you clean the fish tank this morning? &nbsp;M: No. Dad did it himself. &nbsp;W: Really? He usually asks you to do it. &nbsp;M: I had to finish my homework. &nbsp;Q: Who cleaned the fish tank?",szh:"女：你今天早上清魚缸(tank)了嗎？　男：沒有，是爸爸自己(himself)清的。　女：真的嗎(really)？他通常(usually)都叫你清。　男：我得把功課寫完。　問：誰清了魚缸？",en:"The man's dad.",zh:"男士說爸爸自己(himself)清了魚缸(tank)。爸爸通常(usually)會叫男士清，但這次男士要寫功課所以沒清；女士只是問問題的人。選 B"},
{n:21,p:2,o:["Ten dollars.","One hundred dollars.","Twenty dollars."],a:2,sen:"M: How much are the tangerines? &nbsp;W: Ten dollars each, or a bag of twelve for one hundred dollars. &nbsp;M: I need twelve, so I'll take the bag. &nbsp;Q: How much money does the man save?",szh:"男：橘子(tangerine)怎麼賣？　女：一顆十元，或一袋十二顆一百元。　男：我要十二顆，那我買一袋。　問：男士省了多少錢？",en:"Twenty dollars.",zh:"十二顆單買是一百二十元，買一袋只要一百元，所以省了二十元。一百元是一袋的價錢；十元是一顆的價錢。選 C"},
{n:22,p:2,o:["Give it to his sister.","Get the toy kangaroo.","Keep it for himself."],a:0,sen:"W: What did you win at the school fair? &nbsp;M: I wanted the big toy kangaroo, but I only got second prize. &nbsp;W: What was second prize? &nbsp;M: A pink pencil box. It's not really for me, so my sister can have it. &nbsp;Q: What will the man do with his prize?",szh:"女：你在學校園遊會贏了什麼？　男：我想要那隻大袋鼠(kangaroo)玩偶，可是我只拿到二獎(prize)。　女：二獎是什麼？　男：一個粉紅色(pink)鉛筆盒，不太(really)適合我，就給我妹妹吧。　問：男士會怎麼處理他的獎品？",en:"Give it to his sister.",zh:"男士拿到的二獎(prize)是粉紅色(pink)鉛筆盒，他覺得不適合自己，要給妹妹。他沒有要自己留著；袋鼠(kangaroo)玩偶是他想要但沒拿到的。選 A"},
{n:23,p:2,o:["This Friday.","This weekend.","Next Monday."],a:2,sen:"M: Please pay attention, everyone. This is important. The test is moved from this Friday to next Monday. &nbsp;W: Next Monday? So we have the whole weekend to study? &nbsp;M: That's right. &nbsp;Q: When is the test now?",szh:"男：大家請注意(attention)，這很重要(important)。考試從這週五改到下週一。　女：下週一？所以我們整個週末都可以讀書？　男：沒錯。　問：考試現在是什麼時候？",en:"Next Monday.",zh:"考試從這週五改到下週一，女士確認後老師說沒錯。這週五是原本的日期；週末是用來讀書的時間，不是考試的時間。選 C"},
{n:24,p:2,o:["His brother went to the store.","His brother finished the jam and bread.","The woman ate it for breakfast."],a:1,sen:"W: Is there any jam for breakfast? &nbsp;M: Look in the refrigerator door. &nbsp;W: The jam bottle is empty. And there's no bread, either. &nbsp;M: My brother was hungry late last night. &nbsp;W: Then I need to go to the store before breakfast. &nbsp;Q: What does the man think happened?",szh:"女：早餐還有果醬(jam)嗎？　男：看看冰箱(refrigerator)門上。　女：果醬瓶是空的，而且也沒有麵包(bread)了。　男：我哥昨晚很晚的時候肚子餓。　女：那我得在早餐前去一趟店裡。　問：男士認為發生了什麼事？",en:"His brother finished the jam and bread.",zh:"女士發現果醬(jam)瓶是空的、麵包(bread)也沒了，男士說哥哥昨晚很晚肚子餓，意思是哥哥把它們吃完了。要去店裡的是女士，不是哥哥；女士還沒吃到早餐，所以也不是她吃掉的。選 B"},
{n:25,p:2,o:["Three months.","Six months.","One day."],a:1,sen:"W: Your toothbrush looks very old. &nbsp;M: I know. I've used it for six months. &nbsp;W: Six months? You should get a new one every three months. &nbsp;M: OK, I'll buy one today. &nbsp;Q: How long has the man used his toothbrush?",szh:"女：你的牙刷(toothbrush)看起來很舊了。　男：我知道，我已經用六個月了。　女：六個月？你應該每三個月換一支新的。　男：好，我今天就去買。　問：男士的牙刷用了多久？",en:"Six months.",zh:"男士說牙刷(toothbrush)已經用了六個月。三個月是女士說應該換新的時間；「今天」是他要去買新牙刷的時間。選 B"},
{n:26,p:3,pic:true,o:[BARS("Lost Things",["Bottle","Umbrella","Towel"],[50,80,20]),BARS("Lost Things",["Bottle","Umbrella","Towel"],[80,20,50]),BARS("Lost Things",["Bottle","Umbrella","Towel"],[50,20,80])],a:2,sen:"Every month, our school counts the things in the lost-and-found box. In rainy months, umbrellas are always on top. But this month was dry, so we hardly found any umbrellas. Because of the swimming classes, towels were the biggest group. There were fewer water bottles than towels, but many more bottles than umbrellas. &nbsp;Q: Which chart shows this month?",szh:"我們學校每個月都會清點失物招領箱裡的東西。下雨的月份，雨傘總是最多。但這個月很乾燥，所以幾乎(hardly)沒找到雨傘。因為有游泳課，毛巾(towel)是最多的一類。水壺比毛巾少，但比雨傘多很多。　問：哪張圖是這個月的情形？",en:"Towels most, bottles second, umbrellas fewest.",zh:"這個月毛巾(towel)最多，水壺比毛巾少、比雨傘多，雨傘幾乎(hardly)沒有，所以毛巾最高、水壺第二、雨傘最低。雨傘最高的那張是下雨月份的情形；水壺最高的那張與「水壺比毛巾少」不符。選 C"},
{n:27,p:3,pic:true,o:[PH('q27c'),PH('q27a'),PH('q27b')],a:0,sen:"Leo works in a home store. This morning, he put new bed sheets on the shelf. Then a customer dropped some juice, so he cleaned the table. Now a woman wants to buy the big sofa by the window. It is too heavy to carry, but Leo has an easy solution. He moves it across the floor to the door by himself. &nbsp;Q: What is Leo doing now?",szh:"李奧在一家家居店工作。今天早上他把新的床單(sheet)放到架子上。接著一位客人把果汁掉在桌上，所以他清理了桌子(table)。現在一位女士想買窗邊那張大沙發(sofa)。它太重了抬不動，但李奧有個簡單的辦法(solution)：他自己把它沿著地板移到門口。　問：李奧現在在做什麼？",en:"He is pushing a sofa.",zh:"放床單(sheet)是今天早上的事、擦桌子(table)是客人打翻果汁之後的事，這兩個都已經做完；現在有人要買沙發(sofa)，他正把沙發推到門口，所以現在是推沙發。 選 A"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:0,sen:"My sister loves to grow things on our small balcony. Last spring, she wanted to grow watermelons, but they need too much space. So she grew tomatoes in pots. This spring, she wants to try strawberries, because they're small and sweet. &nbsp;Q: What did the sister grow last spring?",szh:"我姊姊很喜歡在我們的小陽台上種(grow)東西。去年春天她想種西瓜(watermelon)，但西瓜需要太多空間，所以她在花盆(pot)裡種了番茄。今年春天她想試試草莓，因為草莓小又甜。　問：姊姊去年春天種了什麼？",en:"Tomatoes in pots.",zh:"西瓜(watermelon)是她想種但空間不夠沒種成的；草莓是她「今年」才要試的；去年春天她在花盆(pot)裡種(grow)的是番茄。選 A"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29c'),PH('q29a')],a:1,sen:"Every Sunday, an old man plays the trumpet in the public park near my home. Many people stop to listen. My brother admires him so much that he started to learn the trumpet himself. But it was too hard for him. So now he's learning the guitar from our uncle. &nbsp;Q: What is the brother learning now?",szh:"每個星期天，有位老先生在我家附近的公園(public park)吹小喇叭(trumpet)，很多人停下來聽。我弟弟非常欣賞(admire)他，所以自己(himself)也開始學小喇叭。但對他來說太難了，所以現在他跟叔叔學吉他(guitar)。　問：弟弟現在在學什麼？",en:"The guitar.",zh:"在公園吹小喇叭(trumpet)的是老先生；弟弟學過小喇叭，但太難已經放棄；現在他跟叔叔學的是吉他(guitar)。選 B"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30c'),PH('q30b')],a:2,sen:"My brother is learning to drive. At first, Dad taught him in our family car, but Dad got angry too easily. So now my brother takes lessons from a real driving teacher. He takes the public bus to the driving school every Saturday. &nbsp;Q: Who teaches the brother to drive now?",szh:"我哥哥正在學開車(drive)。一開始是爸爸用家裡的車教他，但爸爸太容易(easy)生氣了。所以現在哥哥向真正(real)的駕訓教練上課。他每週六搭公車(public bus)去駕訓班。　問：現在誰在教哥哥開車？",en:"A real driving teacher.",zh:"爸爸是「一開始」教他的人，但太容易生氣所以換掉了；搭公車(public bus)是他去駕訓班的方式，不是教他的人；現在教他開車(drive)的是真正(real)的駕訓教練。選 C"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 14 回　日常用品　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
