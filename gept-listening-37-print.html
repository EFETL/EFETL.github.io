<script>
/* 圖形素材（第37回 故事與傳說） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/37/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/37/p3_${n}.jpg?v=r37hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CASTLE=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q1.jpg" alt="question 1 picture">`;
const CROWN=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q2.jpg" alt="question 2 picture">`;
const SWORD=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q3.jpg" alt="question 3 picture">`;
const MUSEUM=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q4.jpg" alt="question 4 picture">`;
const GLOVE=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CASTLE,o:["It stands on a green hill, but it has only one tower.","It stands on a small island in the sea.","It stands on a green hill, and it has several towers."],a:2,sen:"For question one, look at the picture. Which is true about this ancient castle?",szh:"第一題，請看圖片。關於這座古老的城堡，何者正確？",en:"It stands on a green hill, and it has several towers.",zh:"古老(ancient)的城堡(castle)蓋在綠色山丘上，看得到好幾座尖頂的塔，所以「在綠色山丘上、有好幾座塔」正確。說「只有一座塔」數量不對；說「在海中的小(small)島上」地點不對，圖中沒有海。選 C"},
{n:2,p:0,fig:CROWN,o:["It is on a red pillow.","It is on a blue pillow.","It is on the king's head."],a:0,sen:"For question two, look at the picture. A king wears this beautiful thing. Where is it now?",szh:"第二題，請看圖片。國王會戴這個美麗的東西。它現在在哪裡？",en:"It is on a red pillow.",zh:"圖中美麗(beautiful)的金色王冠放在一個紅色的枕墊上，正確。圖中沒有國王(king)，王冠不在國王頭上；王冠上鑲的是藍色寶石，但枕墊是紅色的，不是藍色。選 A"},
{n:3,p:0,fig:SWORD,o:["Two weapons are hanging on the wall, but there is no shield.","A weapon is hanging on the wall next to a shield.","A weapon is lying on the floor next to a shield."],a:1,sen:"For question three, look at the picture. What can you see in the picture?",szh:"第三題，請看圖片。你在圖中看到什麼？",en:"A weapon is hanging on the wall next to a shield.",zh:"牆上掛著一件武器(weapon)（一把劍），旁邊是一面盾牌，正確。圖中只有一件武器，而且有盾牌，不是「兩件武器、沒有盾牌」；武器是掛在牆上，不是放在地上。選 B"},
{n:4,p:0,fig:MUSEUM,o:["They are touching the old military clothes.","They are taking pictures of the old weapons.","They are looking at old military things behind glass."],a:2,sen:"For question four, look at the picture. What are the man and the woman doing?",szh:"第四題，請看圖片。這位男士和女士在做什麼？",en:"They are looking at old military things behind glass.",zh:"兩人站在博物館裡，看著玻璃櫃中的古代軍事(military)盔甲和武器(weapon)，正確。東西都在玻璃後面，他們沒有用手碰；兩人手上都沒有拿相機或手機，沒在拍照。選 C"},
{n:5,p:0,fig:GLOVE,o:["She is pointing with a finger in a pink glove.","She is taking off a pink glove.","She is pointing with a finger in a blue glove."],a:0,sen:"For question five, look at the picture. What is the girl doing?",szh:"第五題，請看圖片。這個女孩在做什麼？",en:"She is pointing with a finger in a pink glove.",zh:"女孩戴著粉紅色手套(glove)，伸出一根手指(finger)指向前方，正確。藍色的是她的外套，不是手套；她的手套還戴在手上，沒有在脫手套。選 A"},
{n:6,p:1,o:["Don't worry. I'll help you find your missing bag.","Have a nice flight!","Is there another one available tonight?"],a:2,sen:"I just missed my flight to Japan.",szh:"我剛剛錯過飛往日本的班機。",en:"Is there another one available tonight?",zh:"對方說錯過了班機(flight)，關心地問「今晚還有別班可以搭(available)嗎？」最自然。「祝你旅途愉快」是對要出發的人說的，對方根本沒搭上；「我幫你找(find)不見的(missing)包包」是用 missed / missing 的相似音做陷阱，對方沒有掉東西。選 C"},
{n:7,p:1,o:["The principal will, I heard.","She was absent last Monday, too.","In the room in front of the library."],a:0,sen:"Who will teach Miss Chen's class while she's absent?",szh:"陳老師請假的時候，誰會來教她的班？",en:"The principal will, I heard.",zh:"問「誰」來代陳老師(Miss)的課，答「聽說是校長(principal)」才是人物。「她上週一也請假(absent)」只是重複 absent，沒回答是誰；「在圖書館前面(front)的教室」答的是地點。選 A"},
{n:8,p:1,o:["The mechanic can fix it by Friday.","Why? You said it was too slow.","Yes, I sold it last week."],a:1,sen:"I regret selling my old scooter.",szh:"我後悔把舊機車賣掉了。",en:"Why? You said it was too slow.",zh:"對方說後悔(regret)賣掉機車(scooter)，回「為什麼？你之前說它太慢了」是自然的追問。機車已經賣掉了，技師(mechanic)不可能幫他修；「是的，我上週賣掉了」把賣車的人換成自己，人物不對。選 B"},
{n:9,p:1,o:["It's more than five centuries old.","About two miles. We can walk there.","An ancient king built it."],a:1,sen:"How far is the castle from here?",szh:"城堡離這裡多遠？",en:"About two miles. We can walk there.",zh:"問城堡(castle)有「多遠」，答「大約兩英里(mile)，可以走過去」才是距離。「有五個多世紀(century)那麼老」答的是多久以前；「一位古代(ancient)國王(king)蓋的」答的是誰蓋的。選 B"},
{n:10,p:1,o:["Yes, I chose one.","The pie shop is full today.","Neither. I got the chocolate cake."],a:2,sen:"Did you choose the apple pie or the lemon pie?",szh:"你選了蘋果派還是檸檬派？",en:"Neither. I got the chocolate cake.",zh:"這是「A 還是(or) B」的選擇問句，答「都沒有，我點了巧克力蛋糕」是合理的間接回答。選擇問句不能用 Yes 回答，「是的，我選(choose)了一個」答非所問；「派(pie)店今天客滿(full)」沒有回答他選了什麼。選 C"},
{n:11,p:1,o:["Sorry, my phone was out of power.","I'll reply to him after lunch.","It was a short message."],a:0,sen:"Why didn't you reply to my message last night?",szh:"你昨晚為什麼沒回我訊息？",en:"Sorry, my phone was out of power.",zh:"問為什麼沒回(reply)訊息，答「抱歉，我的手機沒電了」說明了原因。「我午餐後回他」人物變成「他」、時間也不對；「那是一則很短的訊息」只是描述訊息，沒說原因。選 A"},
{n:12,p:1,o:["I'm confident about it, too.","Don't worry. You've studied hard. You'll succeed.","The history museum opens at nine."],a:1,sen:"I'm not very confident about tomorrow's history test.",szh:"我對明天的歷史考試不太有信心。",en:"Don't worry. You've studied hard. You'll succeed.",zh:"對方說沒信心(confident)，安慰他「別擔心，你很用功，會成功(succeed)的」最自然。對方說的是「沒信心」，回「我也很有信心」前後矛盾；「歷史(history)博物館(museum)九點開」只是重複 history。選 B"},
{n:13,p:1,o:["I learned them at the beginning of the year.","About twenty new words.","Use them when you talk every day."],a:2,sen:"What's the best method to learn new words?",szh:"學新單字最好的方法是什麼？",en:"Use them when you talk every day.",zh:"問學單字的方法(method)，答「每天說話時就用它們」才是方法。「大約二十個新單字」答的是數量；「我在年初(beginning)學的」答的是時間，而且時態不對。選 C"},
{n:14,p:1,o:["Things change fast these days.","Yes, it costs a hundred dollars.","Sorry, I only have a few coins."],a:2,sen:"Excuse me, do you have change for a hundred-dollar bill?",szh:"不好意思，你有零錢可以換一百元鈔票嗎？",en:"Sorry, I only have a few coins.",zh:"對方想換零錢(change)，答「抱歉，我只有幾個銅板」是委婉表示沒辦法換。「現在事情變化(change)很快」是把 change 當成「改變」的同字陷阱；「是的，它要一百元」把鈔票面額當成價錢。選 C"},
{n:15,p:1,o:["It's on the left-hand shelf, next to the door.","Yes, something about Taiwanese history.","I returned it last Friday."],a:1,sen:"Are you looking for any particular book?",szh:"你在找某本特定的書嗎？",en:"Yes, something about Taiwanese history.",zh:"圖書館員問是否在找特定(particular)的書，答「是的，想找台灣(Taiwanese)歷史的書」最自然。「在左手邊(left-hand)靠門的書架上」是告訴別人書在哪，像是館員的話，不是找書的人的回答；「我上週五還(return)了」沒有回答在找什麼。選 B"},
{n:16,p:2,o:["Five.","Two.","Eight."],a:1,sen:"W: Did Miss Wang mark our English tests? &nbsp;M: Yes. I got eight correct out of ten. &nbsp;W: That's much better than last time! You only got five. &nbsp;M: I studied every night this week. &nbsp;Q: How many questions did the man get wrong this time?",szh:"女：王老師(Miss)改(mark)好我們的英文考卷了嗎？　男：改好了。十題我答對(correct)八題。　女：比上次好多了！你上次只對五題。　男：我這週每天晚上都在讀書。　問：男士這次錯了幾題？",en:"Two.",zh:"十題對(correct)八題，所以錯兩題。八是答對的題數，題目問的是答錯；五是上次答對的題數。選 B"},
{n:17,p:2,o:["At ten-thirty.","At ten.","At nine."],a:0,sen:"W: The history museum opens at nine. Let's meet there then. &nbsp;M: I have to return some books to the library first, and it doesn't open until ten. &nbsp;W: OK. Then let's meet at the museum at ten-thirty. &nbsp;M: Fine. See you there. &nbsp;Q: When will they meet?",szh:"女：歷史(history)博物館(museum)九點開，我們那時在那裡碰面吧。　男：我得先去圖書館還(return)書，可是圖書館十點才開。　女：好(OK)。那我們十點半在博物館碰面。　男：好，到時見。　問：他們什麼時候碰面？",en:"At ten-thirty.",zh:"女士本來約九點，但男士要先等圖書館十點開門去還(return)書，所以改約十點半。九點是博物館開門、也是原本的計畫；十點是圖書館開門的時間。選 A"},
{n:18,p:2,o:["The king wins the war.","The king's son gets the castle back.","The enemy army keeps the castle."],a:1,sen:"W: Does the king win the war at the end of the story? &nbsp;M: No. The enemy army takes his castle, and he has to run away. &nbsp;W: Oh, that's so sad. &nbsp;M: But wait. Ten years later, his son returns and takes it back. &nbsp;Q: What happens at the end of the story?",szh:"女：故事最後國王(king)有打贏戰爭(war)嗎？　男：沒有。敵(enemy)軍(army)占領了他的城堡(castle)，他只好逃走。　女：喔，好悲傷。　男：等一下，還沒完。十年後他的兒子回來(return)把城堡奪回來了。　問：故事最後發生什麼事？",en:"The king's son gets the castle back.",zh:"敵軍(enemy army)先占領城堡，但十年後國王的兒子回來奪回城堡，這才是結局。國王本人輸了戰爭(war)；敵軍占著城堡只是中間的情節，最後被奪回了。選 B"},
{n:19,p:2,o:["A ghost.","A soldier.","A king."],a:0,sen:"W: What are you going to be for Halloween? &nbsp;M: I wanted to be a king, but my sister chose that first. &nbsp;W: How about a soldier? &nbsp;M: Those clothes cost too much. I'll be a ghost. I only need an old white sheet. &nbsp;Q: What will the man be for Halloween?",szh:"女：萬聖節(Halloween)你要扮成什麼？　男：我本來想扮國王，可是我妹妹先選(choose)了。　女：那扮士兵呢？　男：那種衣服太貴了。我要扮鬼，只需要(need)一條舊白床單。　問：男士萬聖節要扮成什麼？",en:"A ghost.",zh:"國王被妹妹先選走了，士兵的衣服太貴，最後決定只需要(need)一條白床單就能扮的鬼。國王是妹妹要扮的；士兵是女士的建議，被男士否定了。選 A"},
{n:20,p:2,o:["Two hundred dollars.","Six hundred dollars.","Four hundred dollars."],a:2,sen:"W: Two adults and one child, please. My son is five. &nbsp;M: Children under six are free. And today is Saturday, so the price is double: two hundred dollars each. &nbsp;W: OK, here you are. &nbsp;Q: How much does the woman pay?",szh:"女：兩位大人、一位小孩。我兒子五歲。　男：六歲以下兒童免費。還有今天是星期六，所以票價是兩倍(double)：每人兩百元。　女：好(OK)，給你。　問：女士付多少錢？",en:"Four hundred dollars.",zh:"週末票價兩倍(double)，每人兩百元；兒子五歲免費，所以只要付兩位大人：兩百乘二是四百元。兩百元是一張票的價錢；六百元是把小孩也算進去了。選 C"},
{n:21,p:2,o:["Someone stole it.","His brother is using it.","He lent it to the woman."],a:1,sen:"M: My bicycle is missing! Somebody must have taken it. &nbsp;W: Don't assume that. Did you lend it to anyone? &nbsp;M: Oh, right! My brother borrowed it this morning. &nbsp;Q: What happened to the man's bicycle?",szh:"男：我的腳踏車不見了(missing)！一定是有人拿走了。　女：別這樣假設(assume)。你有借給誰嗎？　男：喔，對！我弟弟今天早上借走了。　問：男士的腳踏車怎麼了？",en:"His brother is using it.",zh:"男士一開始以為被偷，但經女士提醒，想起是弟弟早上借走了，所以是弟弟在用。「被偷了」是男士一開始錯誤的假設(assume)；女士只是問他有沒有借人，車不是借給她。選 B"},
{n:22,p:2,o:["Next to the window.","Between the bed and the door.","In front of the door."],a:0,sen:"W: Will this bookcase fit between the bed and the door? &nbsp;M: The width there is eighty centimeters, but the bookcase is ninety. &nbsp;W: Hmm. What about next to the window? &nbsp;M: That space is one meter wide. It's fine there. &nbsp;Q: Where will they put the bookcase?",szh:"女：這個書櫃放得進床和門中間嗎？　男：那裡寬度(width)八十公分，可是書櫃有九十公分。　女：嗯，那放窗戶旁邊呢？　男：那裡有一公尺寬，可以。　問：他們會把書櫃放在哪裡？",en:"Next to the window.",zh:"床和門中間寬度(width)只有八十公分，九十公分的書櫃放不進去；窗戶旁邊有一公尺，放得下。床和門中間是被否定的位置；對話沒說要放在門前面。選 A"},
{n:23,p:2,o:["Ben.","The coach.","Amy."],a:2,sen:"W: Who will be the new captain of our team? &nbsp;M: The coach wanted Ben, but Ben's family is moving to another country. &nbsp;W: So who's going to do it? &nbsp;M: Amy. She showed great leadership last season. &nbsp;Q: Who will be the new captain?",szh:"女：誰會當我們隊上的新隊長？　男：教練本來想找 Ben，可是 Ben 一家要搬到別的國家(country)。　女：那誰來當？　男：Amy。她上一季展現了很棒的領導力(leadership)。　問：誰會當新隊長？",en:"Amy.",zh:"教練原本屬意 Ben，但 Ben 要搬到國外(country)，所以改由有領導力(leadership)的 Amy 當隊長。Ben 是原本的人選；教練是挑人的人，不是隊長。選 C"},
{n:24,p:2,o:["At home.","At a Taiwanese restaurant.","At a Japanese restaurant."],a:1,sen:"W: I don't want to cook tonight. Let's get Japanese food. &nbsp;M: That place is always full on Fridays. &nbsp;W: Then how about the Taiwanese place near the park? &nbsp;M: OK. It's only a short walk. &nbsp;Q: Where will they eat tonight?",szh:"女：我今晚不想煮飯，我們去吃日本料理吧。　男：那家每到星期五都客滿(full)。　女：那公園旁邊那家台灣(Taiwanese)餐廳呢？　男：好(OK)，走路一下就到了。　問：他們今晚會在哪裡吃飯？",en:"At a Taiwanese restaurant.",zh:"日本料理星期五總是客滿(full)，所以改去公園旁的台灣(Taiwanese)餐廳，男士也同意了。日本餐廳是被否定的選擇；女士一開始就說不想煮飯，所以不會在家吃。選 B"},
{n:25,p:2,o:["Stay home all day.","Go on a hike.","Visit the museum."],a:2,sen:"W: The sun is out. Let's start our hike now. &nbsp;M: The news says it will rain hard at noon. &nbsp;W: Then let's go to the museum today and hike tomorrow. &nbsp;M: Good idea. &nbsp;Q: What will they do today?",szh:"女：出太陽(sun)了，我們現在開始(start)去健行吧。　男：新聞說中午會下大雨。　女：那今天去博物館(museum)，明天再去健行。　男：好主意。　問：他們今天會做什麼？",en:"Visit the museum.",zh:"因為中午會下大雨，計畫改成今天去博物館(museum)、明天再健行。健行是明天的事；他們今天要出門去博物館，不是整天待在家。選 C"},
{n:26,p:3,pic:true,o:[BARS("Play Votes",["Dragon","King","Ghost"],[50,80,20]),BARS("Play Votes",["Dragon","King","Ghost"],[50,20,80]),BARS("Play Votes",["Dragon","King","Ghost"],[80,50,20])],a:0,sen:"Every year, our class chooses an old story for the school play. Our method is simple: the teacher asks which story we like, and each student writes a reply on a small card. Last year, the ghost story won. This year, more students chose the king story than the dragon story, and the ghost story got the fewest votes. &nbsp;Q: Which chart shows this year's votes?",szh:"我們班每年都會選一個古老故事來演學校話劇。我們的方法(method)很簡單：老師問我們喜歡哪個故事，每位學生在小(small)卡片上寫下回覆(reply)。去年鬼故事贏了。今年選國王(king)故事的學生比選龍的多，而鬼故事得票最少。　問：哪張圖是今年的票數？",en:"King most, dragon second, ghost fewest.",zh:"今年國王(king)故事比龍的故事票多，鬼故事最少，所以國王最高、龍第二、鬼最低。鬼故事最高的那張是去年的情形；龍最高的那張把國王和龍的順序弄反了。選 A"},
{n:27,p:3,pic:true,o:[BARS("Castle Visitors",["Sep","Oct","Nov"],[80,55,30]),BARS("Castle Visitors",["Sep","Oct","Nov"],[55,80,20]),BARS("Castle Visitors",["Sep","Oct","Nov"],[25,80,50])],a:2,sen:"The old castle on the hill is a popular place to visit in the fall. Visitors love to pause at its beautiful front gate and take pictures. Usually, September is its busiest month. But this year, the castle was closed for two weeks in September, because workers had to fix that gate. So fewer people visited in September than in November. October was the busiest month of all, because of the castle's Halloween night. &nbsp;Q: Which chart shows the castle's visitors this year?",szh:"山丘上的古老城堡(castle)是秋天很受歡迎的景點。遊客很喜歡在它美麗(beautiful)的前(front)門停下來(pause)拍照。通常九月是它最忙的月份。但今年九月城堡關了兩個星期，因為工人要修理那道門。所以九月的遊客比十一月少。十月是最忙的月份，因為城堡有萬聖節(Halloween)之夜。　問：哪張圖是城堡今年的遊客？",en:"October most, November second, September fewest.",zh:"九月因為修理前(front)門關了兩週，遊客比十一月少；十月因為萬聖節(Halloween)之夜最多。所以十月最高、十一月第二、九月最低。九月最高的那張是「通常」的情形，不是今年；十月最高但九月第二的那張，和「九月比十一月少」相反。選 C"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:0,sen:"My grandpa was in the army for two years. He never fought in a war. He didn't cook for the other soldiers, either. His friend Lee did that. Grandpa was a mechanic, and he fixed big army trucks every day. Now he is old, but he still fixes scooters in his small shop. &nbsp;Q: What was Grandpa's job in the army?",szh:"我爺爺當過兩年兵(army)。他從沒上過戰場(war)，也沒有幫其他士兵煮飯，那是他朋友 Lee 做的。爺爺是技師(mechanic)，每天修理軍中的大卡車。他現在老了，但還在自己的小(small)店裡修機車(scooter)。　問：爺爺在軍中的工作是什麼？",en:"He fixed army trucks.",zh:"爺爺在軍中(army)是技師(mechanic)，每天修大卡車。煮飯是朋友 Lee 的工作，爺爺沒做；修機車(scooter)是他現在老了在小店做的事，不是當兵時的工作。選 A"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29a'),PH('q29c')],a:0,sen:"Our class play is about an ancient king. Tom wanted to be the king, but he was absent on the day we chose parts, so Ben got it. Our teacher asked Tom to help paint the castle for the stage. But Tom really wanted to act. In the end, he plays a farmer who finds the king's missing gold ring. &nbsp;Q: What does Tom do in the play?",szh:"我們班的話劇在講一位古代(ancient)國王(king)。Tom 想演國王，但選(choose)角那天他請假(absent)，所以國王給 Ben 演。老師請 Tom 幫忙畫舞台上的城堡(castle)，可是 Tom 很想上台演戲。最後他演一個找到(find)國王遺失(missing)金戒指的農夫。　問：Tom 在話劇中做什麼？",en:"He plays a farmer.",zh:"國王的角色因為 Tom 請假(absent)給了 Ben；畫城堡布景是老師的提議，但 Tom 想演戲；最後他演農夫。選 A"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:1,sen:"My uncle teaches ancient history. Last month, he went to another country to seek an old ship at the bottom of the sea. He wanted to swim down and investigate it, but the waves were too big every day. So he spent most days in a library, reading old maps. On the last day, a fisherman gave him an old blue bowl from the sea. &nbsp;Q: What did the uncle do on most days of his trip?",szh:"我叔叔教古代(ancient)歷史(history)。上個月他到另一個國家(country)去尋找(seek)一艘沉在海底的古船。他想潛下去調查(investigate)，但每天浪都太大，所以大部分的日子他都在圖書館看古地圖。最後一天，一位漁夫送他一個從海裡撈起來的舊藍碗。　問：叔叔這趟旅行大部分的日子在做什麼？",en:"He read old maps in a library.",zh:"叔叔想潛水調查(investigate)古船，但浪太大沒辦法下水；拿到漁夫送的藍碗只是最後一天的事；大部分的日子都在圖書館看古地圖。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 37 回　故事與傳說　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
