<style>

<script>
/* 圖形素材（第37回 故事與傳說） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/37/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CASTLE=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q1.jpg" alt="question 1 picture">`;
const CROWN=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q2.jpg" alt="question 2 picture">`;
const SWORD=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q3.jpg" alt="question 3 picture">`;
const MUSEUM=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q4.jpg" alt="question 4 picture">`;
const GLOVE=`<img class="pic-img p0img" src="gept-listening-img/37/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CASTLE,o:["A modern glass tower in the city.","An ancient castle from many centuries ago.","An old wooden temple by the river."],a:1,sen:"For question one, look at the picture. What building is this?",szh:"第一題，請看圖片。這是什麼建築？",en:"An ancient castle from many centuries ago.",zh:"這是一座古老(ancient)的城堡(castle)，建於好幾個世紀(century)前，選 B。玻璃大樓與木造寺廟都不是圖中的建築。"},
{n:2,p:0,fig:CROWN,o:["The king of an old country.","A soldier in the king's army.","The principal of a small school."],a:0,sen:"For question two, look at the picture. Who wears this?",szh:"第二題，請看圖片。誰戴這個？",en:"The king of an old country.",zh:"戴王冠的是歷史悠久、充滿(full)歷史的國家(country)的國王(king)，選 A。士兵(army)與校長不會戴王冠。"},
{n:3,p:0,fig:SWORD,o:["A toy used by little children.","A weapon used by an army.","A glove used by a farmer."],a:1,sen:"For question three, look at the picture. What is this?",szh:"第三題，請看圖片。這是什麼？",en:"A weapon used by an army.",zh:"圖中是軍隊(army)在戰爭(war)中使用的武器(weapon)，選 B。玩具與手套(glove)的用途不符。"},
{n:4,p:0,fig:MUSEUM,o:["In an attic under the roof.","In a library on the corner.","In a museum of military history."],a:2,sen:"For question four, look at the picture. Where are old things kept?",szh:"第四題，請看圖片。老東西保存在哪？",en:"In a museum of military history.",zh:"把老東西保存起來展示的地方是博物館(museum)，這裡展出軍事(military)歷史，選 C。閣樓與圖書館也可能放舊東西，但不是圖中的地方。"},
{n:5,p:0,fig:GLOVE,o:["A ring with a small stone.","A watch with a brown band.","A glove with five fingers."],a:2,sen:"For question five, look at the picture. What is on the hand?",szh:"第五題，請看圖片。手上是什麼？",en:"A glove with five fingers.",zh:"手上戴的是一隻有五根手指(finger)的手套(glove)，選 C。戒指與手錶也戴在手上，但不是圖中的東西。"},

{n:6,p:1,o:["It's beautiful, but a little small.","I need to choose a gift.","Fifty dollars, or maybe less."],a:0,sen:"How is the ring you want to buy?",szh:"你想買的戒指怎麼樣？",en:"It's beautiful, but a little small.",zh:"問戒指怎麼樣，答『很美(beautiful)，但有點小(small)』，選 A。B 說需要(need)選(choose)禮物，C 回答價錢(or)，都沒描述戒指。"},
{n:7,p:1,o:["The waiter gave me some change.","We can sit in the sun.","Sure, let's start with the pie."],a:2,sen:"Shall we order dessert first?",szh:"我們要先點甜點嗎？",en:"Sure, let's start with the pie.",zh:"問要不要先點甜點，答『好，我們先從派(pie)開始(start)』，選 C。A 講零錢(change)，B 講坐在陽光(sun)下，都沒回答。"},
{n:8,p:1,o:["Yes, I checked this particular flight.","I can't find my boarding pass.","I was absent from class today."],a:0,sen:"Are you sure the plane leaves on time?",szh:"你確定飛機準時起飛嗎？",en:"Yes, I checked this particular flight.",zh:"問班機是否準時，答『是的，我確認過這個特定(particular)班次(flight)』，選 A。B 找(find)不到登機證，C 缺席(absent)，都沒回答。"},
{n:9,p:1,o:["I'll return to school tomorrow.","It started last Monday morning.","We'll seek help from the principal."],a:2,sen:"How will you solve the school problem?",szh:"你要怎麼解決學校的問題？",en:"We'll seek help from the principal.",zh:"問怎麼解決學校的問題，答『我們會向校長(principal)尋求(seek)協助』，選 C。A 的 return 是回學校，B 講何時開始，都不是解決方法。"},
{n:10,p:1,o:["They won by double the points.","They need strong leadership.","It's a mile from the school."],a:1,sen:"What does the young team need to win?",szh:"這支年輕隊伍要贏需要什麼？",en:"They need strong leadership.",zh:"問隊伍需要什麼才能贏，答『需要強大的領導力(leadership)』，選 B。A 提到加倍(double)的分數，但是過去的事；C 講距離(mile)，都沒回答。"},
{n:11,p:1,o:["Through the front door, I think.","Nothing is missing from the store.","They should investigate; don't assume anything."],a:2,sen:"How should the police handle this case?",szh:"警方該怎麼處理這個案子？",en:"They should investigate; don't assume anything.",zh:"問警方怎麼處理，答『他們應該調查(investigate)，不要妄下假設(assume)』，選 C。A 講從哪進去，B 說沒有東西不見(missing)，都沒回答方法。"},
{n:12,p:1,o:["The mechanic needed a new part.","I regret buying this scooter.","It's about two hundred dollars."],a:0,sen:"Why did the repair take so long?",szh:"為什麼修理花這麼久？",en:"The mechanic needed a new part.",zh:"問修理為何花這麼久，答『技師(mechanic)需要一個新零件』，選 A。B 後悔(regret)買機車(scooter)，C 回答價錢，都沒說明原因。"},
{n:13,p:1,o:["On the left-hand page, OK?","It's a famous Taiwanese story.","Grandma told it last night."],a:0,sen:"Where should I note the folk story?",szh:"這則民間故事我該記在哪？",en:"On the left-hand page, OK?",zh:"問該記在哪，答『記在左手邊(left-hand)那一頁，好嗎(OK)？』，選 A。B 說這是台灣(Taiwanese)故事，C 說誰講的，都沒回答位置。"},
{n:14,p:1,o:["In front of the city museum.","We sell Halloween costumes here.","At the beginning of October."],a:2,sen:"When does the fun autumn festival start?",szh:"有趣的秋季節慶什麼時候開始？",en:"At the beginning of October.",zh:"問節慶何時開始，答『十月初(beginning)』，選 C。A 回答地點(front)，B 提到萬聖節(Halloween)服裝，但沒說時間。"},
{n:15,p:1,o:["The one about the ancient king.","A long time ago, I think.","It's full of beautiful pictures."],a:0,sen:"Which legend do you love the most?",szh:"你最愛哪個傳說？",en:"The one about the ancient king.",zh:"問最愛哪個傳說，答『關於古代(ancient)國王(king)的那個』，選 A。B 回答時間，C 描述圖片(beautiful)，都沒回答是哪一個。"},

{n:16,p:2,o:["He got a perfect score.","He was absent from the test.","He has to take it again."],a:0,sen:"W: Did Miss Wang give back our tests? &nbsp;M: Yes. She marked mine, and every answer was correct. &nbsp;W: Wow, you must have studied hard. &nbsp;M: I did. I studied every night for a week. &nbsp;Q: How did the man do on the test?",szh:"女：王老師(Miss)把我們的考卷發回來了嗎？　男：發了。她批改(mark)了我的，每題答案都是正確(correct)的。　女：哇，你一定很用功。　男：是啊，我一個星期每晚都在讀書。　問：男士考得如何？",en:"He got a perfect score.",zh:"男士說每題都正確(correct)，表示他拿了滿分，選 A。他沒缺考，也不需要重考，B、C 不對。"},
{n:17,p:2,o:["A holiday parade in the city.","A birthday party for a king.","A great war between two armies."],a:2,sen:"M: What is this history lesson about? &nbsp;W: A great war between two large armies. &nbsp;M: So sad. &nbsp;Q: What is the lesson about?",szh:"男：這堂歷史課在講什麼？　女：兩支大軍(army)之間的大戰(war)。　男：真悲傷。　問：這堂課在講什麼？",en:"A great war between two armies.",zh:"是兩軍(army)間的大戰(war)，選 C。國王生日派對只是裝飾性的干擾。"},
{n:18,p:2,o:["In a small store.","In a museum.","In a school library."],a:1,sen:"W: Please don't touch the glass. Some of these things are many centuries old. &nbsp;M: Sorry. They look so special. Can I take a picture? &nbsp;W: Yes, but no flash, please. &nbsp;Q: Where are they probably?",szh:"女：請不要碰玻璃。這些東西有些已經好幾個世紀(century)了。　男：抱歉。它們看起來好特別。我可以拍照嗎？　女：可以，但請不要用閃光燈。　問：他們可能在哪裡？",en:"In a museum.",zh:"玻璃櫃中展示好幾個世紀的老東西，並要求不要碰、不要閃光燈，這是博物館(museum)的場景，選 B。學校圖書館與商店不會這樣展示古物。"},
{n:19,p:2,o:["A sharp weapon against the enemy.","A heavy book about the king.","A strong horse for the trip."],a:0,sen:"M: What did the knight carry into battle? &nbsp;W: A sharp weapon to fight the enemy. &nbsp;M: Brave man. &nbsp;Q: What did the knight carry?",szh:"男：騎士帶什麼上戰場？　女：一件對付敵人(enemy)的鋒利武器(weapon)。　男：勇敢的人。　問：騎士帶了什麼？",en:"A sharp weapon against the enemy.",zh:"騎士帶對付敵人(enemy)的武器(weapon)，選 A。書與馬都不是對話中提到的。"},
{n:20,p:2,o:["Thanksgiving Day.","Halloween night.","New Year's Day."],a:1,sen:"W: Why are the kids wearing masks tonight? &nbsp;M: They go from door to door for candy, and I made a pumpkin pie for them. &nbsp;W: How fun! I will take some pictures. &nbsp;Q: What day is it today?",szh:"女：孩子們今晚為什麼戴面具？　男：他們挨家挨戶要糖果，我還為他們做了南瓜派(pie)。　女：好好玩！我來拍些照片。　問：今天是什麼節日？",en:"Halloween night.",zh:"孩子戴面具、挨家挨戶要糖果，這是萬聖節(Halloween)的活動，選 B。南瓜派讓人聯想到感恩節，但挨家要糖是萬聖節。"},
{n:21,p:2,o:["The sofa is too heavy.","The door is too narrow.","The window is too small."],a:1,sen:"W: Will the sofa go through the door? &nbsp;M: The door's width is only eighty centimeters, and the sofa is one meter long. &nbsp;W: Then let's try the window. &nbsp;Q: What is the problem?",szh:"女：沙發過得了門嗎？　男：門的寬度(width)只有八十公分，而沙發有一公尺長。　女：那我們試試窗戶。　問：問題是什麼？",en:"The door is too narrow.",zh:"門寬(width)只有八十公分、沙發一公尺，所以門太窄，選 B。對話沒提沙發重，窗戶是解決方法，不是問題。"},
{n:22,p:2,o:["Take the room.","Come back on Saturday.","Look somewhere else."],a:2,sen:"M: Excuse me, I need a room for two people on Friday. &nbsp;W: Sorry, only one room is available, and it has just one bed. &nbsp;M: OK. We'll try another place. &nbsp;Q: What will the man do?",szh:"男：不好意思，我星期五需要一間兩人房。　女：抱歉，只剩一間房可用(available)，而且只有一張床。　男：好吧(OK)。我們去別的地方試試。　問：男士會做什麼？",en:"Look somewhere else.",zh:"房間只有一張床不夠兩人睡，他說去別的地方試，也就是找別處，選 C。他不會住這間，也沒說星期六再來。"},
{n:23,p:2,o:["She missed the bus.","Her scooter broke down.","She forgot the time."],a:1,sen:"M: Why are you late? The meeting started twenty minutes ago. &nbsp;W: My scooter wouldn't start. I had to push it to a shop, and the mechanic fixed it. &nbsp;M: I see. Come in and sit down. &nbsp;Q: Why was the woman late?",szh:"男：你為什麼遲到？會議二十分鐘前就開始了。　女：我的機車(scooter)發不動。我得把它推到店裡，技師(mechanic)才修好。　男：了解。進來坐吧。　問：女士為什麼遲到？",en:"Her scooter broke down.",zh:"機車發不動、得推去修，表示車子壞了，選 B。她沒提公車或忘記時間。"},
{n:24,p:2,o:["A famous Taiwanese folk story.","A famous French fairy tale.","A famous American cartoon."],a:0,sen:"W: What story did grandma tell you? &nbsp;M: A famous Taiwanese folk story of our own country. &nbsp;W: I love those. &nbsp;Q: What story did grandma tell?",szh:"女：奶奶跟你講什麼故事？　男：一則我們國家(country)有名的台灣(Taiwanese)民間故事。　女：我愛那些。　問：奶奶講了什麼故事？",en:"A famous Taiwanese folk story.",zh:"是我們國家(country)的台灣(Taiwanese)民間故事，選 A。法國童話與美國卡通都不是。"},
{n:25,p:2,o:["A warm hat and scarf.","A thick winter coat.","A glove for each finger."],a:2,sen:"M: What should I wear on the cold hike? &nbsp;W: A warm glove to cover each finger. &nbsp;M: Good idea. &nbsp;Q: What should the man wear?",szh:"男：寒冷的健行我該戴什麼？　女：一副暖手套(glove)，蓋住每根手指(finger)。　男：好主意。　問：男士該戴什麼？",en:"A glove for each finger.",zh:"女士建議戴蓋住每根手指(finger)的手套(glove)，選 C。帽子、外套雖也保暖，但她沒這樣說。"},

{n:26,p:3,pic:true,o:[BARS("Legends",["King","War","Castle"],[20,50,80]),BARS("Legends",["King","War","Castle"],[80,50,20]),BARS("Legends",["King","War","Castle"],[50,80,20])],a:1,sen:"Our class voted for our favorite kind of legend. Our method was simple: each student wrote one choice and gave a reply to the teacher. Stories about a great king were the most popular. War stories were in the middle, and castle mysteries got the fewest votes. So the king bar should be the tallest. &nbsp;Q: Which chart shows the votes?",szh:"我們班票選最愛的傳說類型。我們的方法(method)很簡單：每位學生寫下一個選擇並回覆(reply)老師。關於偉大國王(king)的故事最受歡迎；戰爭(war)故事中等；城堡(castle)謎團最少票。所以國王長條最高。　問：哪張圖顯示票數？",en:"King most, castle least.",zh:"國王最多、城堡最少，符合『King 最高』，選 B。"},
{n:27,p:3,pic:true,o:[BARS("Museum Visits",["Jul","Aug","Sep"],[30,55,80]),BARS("Museum Visits",["Jul","Aug","Sep"],[55,80,30]),BARS("Museum Visits",["Jul","Aug","Sep"],[80,55,30])],a:2,sen:"The history museum counted its visitors over three months. In July the most people came, during the summer holiday. In August it was in the middle, and by September the fewest, as school started. So the visits went down each month. &nbsp;Q: Which chart shows the museum visits?",szh:"歷史(history)博物館(museum)統計三個月的參觀人數。七月最多，暑假期間；八月中等；到九月最少，因為開學了。所以參觀數逐月下降。　問：哪張圖顯示參觀數？",en:"Jul most, Sep fewest.",zh:"七月最多、逐月下降，符合『Jul 最高、Sep 最低』，選 C。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('bread'),IMG('rice')],a:1,sen:"During the long history trip to the ancient castle, we could not cook. There was no kitchen there to make noodles or steam rice for the whole class. So the guide brought fresh bread and a warm pie, and we paused to eat in front of the old stone walls. &nbsp;Q: What did the class eat at the castle?",szh:"在前往古老(ancient)城堡(castle)的長途歷史(history)之旅中，我們無法煮飯。那裡沒廚房為全班煮麵或蒸飯。所以嚮導帶了新鮮麵包(bread)和溫熱的派(pie)，我們在古老石牆前(front)停下(pause)來吃。　問：全班在城堡吃什麼？",en:"Fresh bread.",zh:"全班吃麵包(bread)，選 B。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('noodles'),IMG('bread'),IMG('rice')],a:0,sen:"After a whole day acting out an ancient war story on stage, the young actors were tired but confident that their play would succeed. They did not want dry bread or cold rice after such hard work. So the principal treated the whole team to a big bowl of hot noodles, and it became a beautiful memory of the day. &nbsp;Q: What did the principal treat the team to?",szh:"在舞台上演了一整天古代(ancient)戰爭(war)故事後，年輕演員們很累，但有信心(confident)演出會成功(succeed)。這麼辛苦後他們不想吃乾麵包或冷飯。所以校長(principal)請全隊吃一大碗熱麵(noodle)，成了那天美(beautiful)好的回憶。　問：校長請團隊吃什麼？",en:"A bowl of noodles.",zh:"校長請吃熱麵(noodle)，選 A。麵包、飯為干擾。"},

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 37 回　故事與傳說　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
