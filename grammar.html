<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>初級文法 Grammar · 英檢初級</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    color:#22303f;line-height:1.6;background:linear-gradient(180deg,#eef6ff,#fff4f7 70%);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px;}
  .home{display:inline-block;margin-bottom:14px;color:#ff7aa8;font-weight:800;text-decoration:none;
    background:#fff;padding:7px 16px;border-radius:20px;box-shadow:0 3px 10px rgba(255,122,168,.18);font-size:.9rem;}
  header.hero{background:linear-gradient(135deg,#ff9a9e,#fbc2eb 55%,#ffb6e6);color:#5a2540;
    border-radius:22px;padding:30px 26px;margin-bottom:28px;box-shadow:0 10px 26px rgba(255,154,158,.32);}
  header.hero h1{margin:0 0 8px;font-size:1.8rem;text-shadow:0 1px 2px rgba(255,255,255,.35);}
  header.hero p{margin:0;opacity:.95;font-size:.98rem;}
  header.hero .badge{display:inline-block;margin-top:14px;background:rgba(255,255,255,.35);
    padding:8px 14px;border-radius:12px;font-size:.85rem;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}
  .card{background:#fff;border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;
    box-shadow:0 5px 16px rgba(43,140,255,.12);transition:transform .15s,box-shadow .15s;border:1px solid #eaf1fb;display:block;}
  .card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(43,140,255,.2);}
  .thumb{line-height:0;}
  .thumb svg{width:100%;height:auto;display:block;}
  .cap{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:8px;}
  .cap-zh{font-weight:800;font-size:1.05rem;}
  .cap-en{font-size:.82rem;color:#7a8694;}
  .go{color:#ff7aa8;font-weight:800;font-size:.9rem;white-space:nowrap;}
  footer{text-align:center;color:#7a8694;font-size:.82rem;margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
    <a class="home" style="margin-bottom:0" href="gept-hub.html">← 回英檢初級</a>
    <a class="home" style="margin-bottom:0;color:#7d8bff" href="grammar-relative.html">🔗 形容詞子句練習 ›</a>
  </div>

  <header class="hero">
    <h1>🧩 初級文法　Grammar</h1>
    <p>一個單元一個重點：先看「示範說明」按 1／2／3 看句子怎麼變，再做「填空練習」即時批改。</p>
    <span class="badge">目前開放：假設語氣 · 否定敘述的附和</span>
  </header>

  <div class="grid">

    <!-- ── 假設語氣 ── -->
    <a class="card" href="grammar-subjunctive.html">
      <div class="thumb">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="假設語氣">
          <defs>
            <linearGradient id="gIf" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9a9e"/><stop offset="0.55" stop-color="#fbc2eb"/><stop offset="1" stop-color="#ffb6e6"/>
            </linearGradient>
            <filter id="sIf" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/>
            </filter>
          </defs>
          <rect width="400" height="260" rx="24" fill="url(#gIf)"/>
          <circle cx="340" cy="46" r="80" fill="#fff" opacity="0.14"/>
          <circle cx="58" cy="224" r="54" fill="#fff" opacity="0.12"/>
          <g transform="translate(150,44)" filter="url(#sIf)">
            <rect x="0" y="0" width="100" height="86" rx="10" fill="#fff" opacity="0.97"/>
            <line x1="14" y1="22" x2="60" y2="22" stroke="#ff8fb3" stroke-width="5" stroke-linecap="round"/>
            <rect x="64" y="17" width="24" height="10" rx="3" fill="#7d8bff" opacity="0.85"/>
            <line x1="14" y1="43" x2="86" y2="43" stroke="#ffc3da" stroke-width="5" stroke-linecap="round"/>
            <line x1="14" y1="64" x2="52" y2="64" stroke="#ffc3da" stroke-width="5" stroke-linecap="round"/>
            <rect x="56" y="59" width="30" height="10" rx="3" fill="#b06bff" opacity="0.8"/>
          </g>
          <text x="34" y="92" font-family="Georgia,'Times New Roman',serif"
            font-size="34" font-style="italic" font-weight="700" fill="#fff" opacity="0.92" filter="url(#sIf)">If…</text>
          <text x="30" y="200" font-family="Helvetica,Arial,'PingFang TC',sans-serif"
            font-size="26" font-weight="800" fill="#fff" opacity="0.95">4 類 · 80 題</text>
          <text x="30" y="244" font-family="Helvetica,Arial,'PingFang TC',sans-serif"
            font-size="32" font-weight="900" fill="#fff" filter="url(#sIf)">假設語氣</text>
          <text x="268" y="244" font-family="Helvetica,Arial,sans-serif"
            font-size="17" font-weight="700" fill="#fff" opacity="0.9">Subjunctive</text>
        </svg>
      </div>
      <div class="cap">
        <div><div class="cap-zh">假設語氣</div><div class="cap-en">現在／過去／未來／混合 · 80 題</div></div>
        <span class="go">開始練習 ›</span>
      </div>
    </a>

    <!-- ── 否定敘述 ── -->
    <a class="card" href="grammar-negative.html">
      <div class="thumb">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="否定敘述的附和">
          <defs>
            <linearGradient id="gNe" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#84fab0"/><stop offset="0.55" stop-color="#8fd3f4"/><stop offset="1" stop-color="#a6c1ff"/>
            </linearGradient>
            <filter id="sNe" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.18"/>
            </filter>
          </defs>
          <rect width="400" height="260" rx="24" fill="url(#gNe)"/>
          <circle cx="344" cy="44" r="78" fill="#fff" opacity="0.14"/>
          <circle cx="56" cy="226" r="52" fill="#fff" opacity="0.12"/>
          <!-- 對話泡泡 1 -->
          <g filter="url(#sNe)">
            <rect x="42" y="34" width="150" height="60" rx="16" fill="#fff" opacity="0.96"/>
            <polygon points="66,94 90,94 70,114" fill="#fff" opacity="0.96"/>
          </g>
          <text x="60" y="72" font-family="Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e05a7a">hasn't</text>
          <!-- 對話泡泡 2 -->
          <g filter="url(#sNe)">
            <rect x="208" y="96" width="156" height="60" rx="16" fill="#fff" opacity="0.96"/>
            <polygon points="330,156 354,156 340,176" fill="#fff" opacity="0.96"/>
          </g>
          <text x="222" y="134" font-family="Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#1f8fa3">neither</text>
          <text x="30" y="204" font-family="Helvetica,Arial,sans-serif"
            font-size="24" font-weight="800" fill="#fff" opacity="0.95">Neither have I.</text>
          <text x="30" y="244" font-family="Helvetica,Arial,'PingFang TC',sans-serif"
            font-size="32" font-weight="900" fill="#fff" filter="url(#sNe)">否定敘述</text>
          <text x="268" y="244" font-family="Helvetica,Arial,sans-serif"
            font-size="17" font-weight="700" fill="#fff" opacity="0.9">Neither / Nor</text>
        </svg>
      </div>
      <div class="cap">
        <div><div class="cap-zh">否定敘述的附和</div><div class="cap-en">neither／nor／either · 10 講解＋10 練習</div></div>
        <span class="go">開始練習 ›</span>
      </div>
    </a>

  </div><!-- /grid -->
