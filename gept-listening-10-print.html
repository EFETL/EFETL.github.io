<script>
/* 圖形素材（第10回 身體與健康） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/10/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const SOCCER=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q1.jpg" alt="question 1 picture">`;
const TENNIS=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q2.jpg" alt="question 2 picture">`;
const SNEAKER=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q3.jpg" alt="question 3 picture">`;
const DUMBBELL=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q4.jpg" alt="question 4 picture">`;
const SCORE=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:SOCCER,o:["The boy is playing soccer.","The boy is playing table tennis.","The boy is playing golf."],a:0,sen:"For question one, look at the picture. What sport is the boy playing?",szh:"第一題，請看圖片。男孩在玩什麼運動？",en:"He plays soccer.",zh:"男孩在踢足球(soccer)，選 A。B 桌球(table tennis)、C 高爾夫(golf)是別的運動。"},
{n:2,p:0,fig:TENNIS,o:["She is holding a tennis racket.","She is holding a flute.","She is holding a duck."],a:0,sen:"For question two, look at the picture. What is the woman holding?",szh:"第二題，請看圖片。女士拿著什麼？",en:"A tennis racket.",zh:"女士拿著網球拍，選 A。B 長笛(flute)、C 鴨子(duck)和圖片不符。"},
{n:3,p:0,fig:SNEAKER,o:["A pair of underwear is on the floor.","A pair of socks is on the floor.","A pair of sneakers is on the floor."],a:2,sen:"For question three, look at the picture. What is on the floor?",szh:"第三題，請看圖片。地板上是什麼？",en:"A pair of sneakers.",zh:"地上是一雙(pair)運動鞋(sneaker)，選 C。三個選項都是 a pair of，只差物品，要聽清楚 sneakers。"},
{n:4,p:0,fig:DUMBBELL,o:["He is dancing with a friend.","He is training for his health.","He is eating steak for lunch."],a:1,sen:"For question four, look at the picture. What does the man do at the gym?",szh:"第四題，請看圖片。男士在健身房做什麼？",en:"He is training for his health.",zh:"男士在健身房鍛鍊(train)，為了健康(health)，選 B。A 跳舞(dance)、C 吃牛排(steak)都和圖片不符。"},
{n:5,p:0,fig:SCORE,o:["The board shows the volleyball score.","The board shows the tennis score.","The board shows the soccer score."],a:0,sen:"For question five, look at the picture. What does the board show?",szh:"第五題，請看圖片。計分板顯示什麼？",en:"The volleyball score.",zh:"計分板顯示的是排球(volleyball)比分(score)，選 A。B 網球、C 足球是別的球類。"},

{n:6,p:1,o:["It's about thirty dollars a month.","I go for a swim every morning.","My health card is in my wallet."],a:1,sen:"How do you keep yourself healthy?",szh:"你怎麼保持健康？",en:"I go for a swim every morning.",zh:"問怎麼保持健康(healthy)，答『我每天早上去(go)游泳』，選 B。A 答價錢，C 重複 health 卻講健保卡。"},
{n:7,p:1,o:["Usually on Saturday afternoons, after lunch.","Yes, I enjoy it very much.","Table tennis. I play against my brother."],a:2,sen:"What sport do you enjoy the most?",szh:"你最喜歡什麼運動？",en:"Table tennis; I play against my brother.",zh:"問最喜歡的運動(sport)，答『桌球(table tennis)，我和弟弟對打(against)』，選 C。A 答時間，B 用 Yes 回答 what 的問題。"},
{n:8,p:1,o:["Because the next match starts at three.","I was lucky! I won a hundred dollars.","Yes, I always look happy on Fridays."],a:1,sen:"Why do you look so happy today?",szh:"你今天怎麼看起來這麼開心？",en:"I was lucky; I won a hundred dollars.",zh:"問為什麼開心，答『我很幸運(lucky)，贏了一百(hundred)元(dollar)』，選 B。A 說比賽時間，C 用 Yes 回答 why 的問題。"},
{n:9,p:1,o:["It starts at three tomorrow afternoon.","Our team won the last match.","Your sneakers, and some popcorn, please."],a:2,sen:"What should I bring to the sports match?",szh:"運動比賽我該帶什麼？",en:"Your sneakers and some popcorn.",zh:"問比賽該帶什麼，答『你的運動鞋(sneaker)和一些爆米花(popcorn)』，選 C。A 答開始時間，B 重複 match 卻講上次比賽。"},
{n:10,p:1,o:["Inside the new studio near my house.","Great! We repeated each step twice.","My class starts at four o'clock."],a:1,sen:"How was your dance class today?",szh:"你今天的舞蹈課如何？",en:"Great; we repeated each step.",zh:"問舞蹈(dance)課如何，答『很棒，每個動作我們都重複(repeat)練習』，選 B。A 答地點(inside)，C 答上課時間。"},
{n:11,p:1,o:["Let's go there by taxi.","They will widen the road next month.","The stadium opens at noon."],a:0,sen:"How should we get to the stadium?",szh:"我們該怎麼去體育場？",en:"Let's go by taxi.",zh:"問怎麼去體育場，答『我們搭(go)計程車(taxi)去』，選 A。B 談道路要拓寬(widen)，C 答開放時間，都沒回答怎麼去。"},
{n:12,p:1,o:["A big steak and some soup.","About three kilometers, I think.","The long race starts at nine."],a:0,sen:"What did you eat after the long race?",szh:"長跑後你吃了什麼？",en:"A big steak and some soup.",zh:"問賽跑後吃了什麼，答『一大塊牛排(steak)和一些湯』，選 A。B 答距離，C 重複 race 卻講開始時間。"},
{n:13,p:1,o:["He was waiting here for an hour.","It's not my fault; I just got here.","Because he's shy with new people."],a:2,sen:"Why won't the boy look at us?",szh:"男孩為什麼不看我們？",en:"He's shy with new people.",zh:"問男孩為何不看我們，答『他對新朋友很害羞(shy)』，選 C。A 答等多久，B(fault)是推卸責任，沒回答原因。"},
{n:14,p:1,o:["I think the source is the river.","It started about three days ago.","That smell is really strange, isn't it?"],a:0,sen:"Where does the strange smell come from?",szh:"這奇怪的味道從哪來？",en:"The source is the river.",zh:"問味道從哪來，答『我想來源(source)是那條河』，選 A。B 答時間，C 重複 smell 卻沒回答。"},
{n:15,p:1,o:["The meeting room is on the third floor.","The meeting starts at exactly nine.","Sure. I'll tidy it and arrange the chairs."],a:2,sen:"Can you prepare the meeting room?",szh:"你能整理好會議室嗎？",en:"I'll tidy it and arrange the chairs.",zh:"問能否準備會議室，答『好，我會整理(tidy)並排好(arrange)椅子』，選 C。A 答位置，B 答開會時間(exactly)。"},

{n:16,p:2,o:["Tennis.","Volleyball.","Soccer."],a:2,sen:"W: What sport does your brother play? &nbsp;M: He plays soccer; he is the best player on the team. &nbsp;W: Impressive. &nbsp;Q: What sport does the brother play?",szh:"女：你弟弟玩什麼運動？　男：他踢足球(soccer)，是隊上最好的球員(player)。　女：厲害。　問：弟弟玩什麼運動？",en:"Soccer.",zh:"弟弟踢足球(soccer)，是隊上最好的球員(player)，選 C。網球、排球不符。"},
{n:17,p:2,o:["He likes to swim and fish.","He likes to surf and swim.","He likes to sail and dive."],a:1,sen:"W: What does your uncle do for fun? &nbsp;M: He likes to surf and swim in the sea every summer. &nbsp;W: How cool. &nbsp;Q: What does the uncle like to do?",szh:"女：你叔叔喜歡做什麼消遣？　男：他每年夏天愛衝浪(surf)和在海裡游泳(swim)。　女：好酷。　問：叔叔喜歡做什麼？",en:"He likes to surf and swim.",zh:"叔叔愛衝浪(surf)和游泳(swim)，選 B。A 把衝浪換成釣魚，C 是帆船和潛水，都不對。"},
{n:18,p:2,o:["She practices a lot.","She has a good coach.","She is very tall."],a:0,sen:"M: Why is Amy so good at tennis? &nbsp;W: She plays for two hours every day, even on Sundays. &nbsp;M: Wow, that is a lot of time! &nbsp;W: That is why she wins so many matches. &nbsp;Q: Why is Amy so good?",szh:"男：艾咪為什麼網球(tennis)打得這麼好？　女：她每天打兩個小時，連星期天也一樣。　男：哇，好多時間！　女：所以她贏了很多比賽。　問：艾咪為什麼這麼厲害？",en:"She practices a lot.",zh:"艾咪每天打兩小時、連星期天也不休息，表示她練習(practice)很多，選 A。B 教練、C 身高，對話都沒提。"},
{n:19,p:2,o:["We lost the match.","We won by a high score.","We watched the match on TV."],a:1,sen:"W: How was the big game last night? &nbsp;M: Our team won by a high score in the final match. &nbsp;W: Congratulations! &nbsp;Q: How was the game?",szh:"女：昨晚的大賽如何？　男：在決賽(match)裡我們隊以高比分(score)獲勝。　女：恭喜！　問：比賽結果如何？",en:"We won by a high score.",zh:"決賽(match)中我們以高比分(score)獲勝，選 B。A 剛好相反，C 對話沒提。"},
{n:20,p:2,o:["She plays the flute and dances.","She dances and then plays the flute.","She sings and plays the flute."],a:0,sen:"M: What does your sister do in the show? &nbsp;W: She plays the flute first, and then she dances. &nbsp;M: Talented. &nbsp;Q: What does the sister do in the show?",szh:"男：你姊姊在表演中做什麼？　女：她先吹長笛(flute)，然後跳舞(dance)。　男：真有才。　問：姊姊在表演中做什麼？",en:"She plays the flute and dances.",zh:"姊姊先吹長笛(flute)，再跳舞(dance)，選 A。B 順序顛倒，C 把跳舞換成唱歌。"},
{n:21,p:2,o:["A new pair of sneakers.","A pair of socks.","A new bag."],a:0,sen:"M: My shoes are too old. My feet hurt when I run. &nbsp;W: Your race is tomorrow. Get some new ones now. &nbsp;M: Good idea. I'll go to the shop after work. &nbsp;Q: What will the man buy?",szh:"男：我的鞋子太舊了，跑步時腳會痛。　女：你明天就要比賽(race)了，現在去買新的吧。　男：好主意，我下班後去店裡。　問：男士會買什麼？",en:"A new pair of sneakers.",zh:"男士的舊鞋讓腳痛，比賽明天就要開始，他同意買新的，也就是一雙(pair)運動鞋(sneaker)，選 A。B 襪子、C 袋子無法解決腳痛。"},
{n:22,p:2,o:["Eat more steak.","Exercise more often.","Take a long rest."],a:1,sen:"M: I want to be stronger, but I always quit after a week. &nbsp;W: Go to the gym three times a week, and add some swimming. &nbsp;M: Okay, I'll try. &nbsp;Q: What does the woman suggest?",szh:"男：我想變強壯，但我總是一週後就放棄。　女：每週去健身房(gym)三次，再加(add)一些游泳。　男：好，我會試試。　問：女士建議什麼？",en:"Exercise more often.",zh:"女士建議每週去健身房(gym)三次、再加(add)游泳，也就是多運動，選 B。A 吃牛排(steak)、C 休息，與增加運動相反。"},
{n:23,p:2,o:["At eight.","At seven.","At six."],a:2,sen:"W: The race starts at nine tomorrow. &nbsp;M: And it takes two hours to drive there. &nbsp;W: Let's leave one more hour for breakfast. What time should we wake up? &nbsp;Q: What time will they wake up?",szh:"女：賽跑(race)明天九點開始。　男：而且開車過去要兩小時。　女：再留一小時吃早餐，我們該幾點起床(wake)？　問：他們幾點起床？",en:"At six.",zh:"九點比賽，車程兩小時，再留一小時吃早餐，9 - 2 - 1 = 6，所以六點起床(wake)，選 C。A、B 沒有算進車程與早餐。"},
{n:24,p:2,o:["Almost empty and quiet.","Very crowded and loud.","Warm, with thick fog."],a:1,sen:"W: How was the stadium during the final? &nbsp;M: So crowded that many Asian fans were in tears of joy. &nbsp;W: What an event! &nbsp;Q: How was the stadium?",szh:"女：決賽時體育場如何？　男：非常擁擠(crowded)，許多亞洲(Asian)球迷都激動落淚(tear)。　女：真是盛事！　問：體育場的情況如何？",en:"Very crowded and loud.",zh:"體育場擠滿人，許多亞洲(Asian)球迷激動落淚(tear)，所以非常擁擠(crowded)，選 B。A 空蕩，C 天氣，都不符。"},
{n:25,p:2,o:["The students.","The players.","The chairperson."],a:2,sen:"M: Who will plan the sports day at our primary school? &nbsp;W: The person who leads our school meetings. He will arrange everything. &nbsp;M: Good, he is very careful. &nbsp;Q: Who will plan the sports day?",szh:"男：誰來規劃我們小學(primary)的運動會？　女：主持我們學校會議的那個人，他會安排(arrange)一切。　男：很好，他很仔細。　問：誰來規劃運動會？",en:"The chairperson.",zh:"主持學校會議、負責安排一切的人就是主席(chairperson)，選 C。A 學生、B 球員(player)是要參加的人，不是規劃的人。"},

{n:26,p:3,pic:true,o:[BARS("Favorite Sport",["Soccer","Tennis","Golf"],[50,80,20]),BARS("Favorite Sport",["Soccer","Tennis","Golf"],[80,50,20]),BARS("Favorite Sport",["Soccer","Tennis","Golf"],[20,50,80])],a:1,sen:"Our school did a survey about the favorite sport of each player. Soccer got the most votes, because it is easy to play with friends. Tennis was in the middle, and golf got the fewest votes. So the soccer bar should be the tallest. &nbsp;Q: Which chart shows the favorite sport?",szh:"我們學校調查每位球員(player)最愛的運動(sport)。足球(soccer)最多票，因為容易和朋友一起玩(play)；網球(tennis)中等；高爾夫(golf)最少。所以足球長條最高。　問：哪張圖顯示最愛運動？",en:"Soccer most, golf least.",zh:"足球(soccer)最多票、高爾夫(golf)最少，所以足球長條最高，選 B。網球在中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Match Scores",["Game1","Game2","Game3"],[80,55,30]),BARS("Match Scores",["Game1","Game2","Game3"],[55,80,30]),BARS("Match Scores",["Game1","Game2","Game3"],[30,55,80])],a:0,sen:"Our volleyball team kept the score of three matches. In game one we scored the most, because we practiced well. In game two we were in the middle, and in game three we scored the least, since the players were tired. So the scores went down each game. &nbsp;Q: Which chart shows our match scores?",szh:"我們排球(volleyball)隊記錄了三(three)場比賽(match)的比分(score)。第一場最高，因為我們練(practice)得好(well)；第二場中等；第三場最低，因為球員(player)累了。所以比分逐場下降。　問：哪張圖顯示我們的比分？",en:"Game 1 most, game 3 least.",zh:"第一場最高、逐場下降，圖表是 Game1 最高、Game3 最低，選 A。要注意比分是下降，不是上升。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('rice'),IMG('bread')],a:2,sen:"Before every big race, our coach tells us to eat healthy food and stick to a simple plan. He says we should not eat oily noodles or heavy rice, because they make us slow. Instead, he brings simple brown bread for the whole team, so we feel light and strong. &nbsp;Q: What food does the coach bring before the race?",szh:"每次大賽跑(race)前，教練都叫我們吃健康(healthy)食物，並堅持(stick)簡單的計畫。他說不要吃油麵或吃太多飯，因為會讓我們變慢，於是他帶(bring)簡單的全麥麵包給全隊，讓我們感覺輕盈又有力。　問：教練賽前帶什麼食物？",en:"Brown bread.",zh:"教練帶麵包(bread)，選 C。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:1,sen:"After a hard game at the gym, our team is always hungry. Some of us rest in a hot tub first, but we all want food. We do not want dry bread or plain rice, which are boring after training. Instead, the chairperson orders a big bowl of hot noodles for every player, and we eat until we feel well again. &nbsp;Q: What does the team eat after training?",szh:"在健身房(gym)激烈比賽後，我們隊總是很餓。有些人先泡熱水浴缸(tub)休息，但大家都想吃東西。訓練(train)後我們不想吃乾麵包或白飯，太無聊，於是主席(chairperson)為每位球員(player)點一大碗熱麵，我們吃到重新感覺很好(well)。　問：球隊訓練後吃什麼？",en:"Hot noodles.",zh:"球隊吃熱麵(noodles)，選 B。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('park'),IMG('mountain'),IMG('beach')],a:2,sen:"Our sports club planned a training trip. The coach liked the mountain for climbing, and one player liked the park for running. But we chose the beach, because we could swim, surf, and play volleyball on the sand all day. There was some fog in the morning, but it soon went away. &nbsp;Q: Where did the sports club go?",szh:"我們運動社團計畫了訓練(train)之旅。教練喜歡山可以爬，一位球員(player)喜歡公園可以跑步，但我們選了海邊(beach)，因為可以整天游泳(swim)、衝浪(surf)、在沙灘打排球(volleyball)。早上有些霧(fog)，但很快就散了。　問：運動社團去了哪裡？",en:"The beach.",zh:"社團去海邊(beach)，選 C。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 10 回　身體與健康　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}

  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;

  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
