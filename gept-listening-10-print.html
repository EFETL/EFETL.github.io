<script>
/* 圖形素材（第10回 身體與健康） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/10/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/10/p3_${n}.jpg?v=r10qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const SOCCER=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q1.jpg" alt="question 1 picture">`;
const TENNIS=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q2.jpg" alt="question 2 picture">`;
const SNEAKER=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q3.jpg" alt="question 3 picture">`;
const DUMBBELL=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q4.jpg" alt="question 4 picture">`;
const SCORE=`<img class="pic-img p0img" src="gept-listening-img/10/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:SOCCER,o:["A boy in a blue shirt is holding a soccer ball.","A boy in a blue shirt is kicking a soccer ball.","A boy in a white shirt is kicking a soccer ball."],a:1,sen:"For question one, look at the picture. Which is true about the picture?",szh:"第一題，請看圖片。關於這張圖，何者正確？",en:"A boy in a blue shirt is kicking a soccer ball.",zh:"圖中男孩穿藍色上衣，正在草地上踢足球(soccer)，正確。白色的是球，不是他的上衣，顏色不對；他是用腳踢球，手上沒有拿著球，動作不對。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">SPORTS SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Sneakers</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Shorts</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Ball</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Bag</td><td style="text-align:right;font-weight:700">$400</td></tr></table></div>`,o:["Tom will have three hundred dollars left.","Tom will have one hundred dollars left.","Tom will have four hundred dollars left."],a:1,sen:"For question two, look at the picture. Tom has six hundred dollars. He buys a pair of sneakers and a pair of shorts. How much will he have left?",szh:"第二題，請看圖片。湯姆有六百元。他買了一雙運動鞋和一件短褲。他還剩多少錢？",en:"Tom will have one hundred dollars left.",zh:"價目表上運動鞋(sneaker)300元、短褲200元，一共500元，600減500剩100元。剩三百元是只買了運動鞋、忘了短褲；剩四百元是只買了短褲、忘了運動鞋。選 B"},
{n:3,p:0,fig:SNEAKER,o:["There is one white sneaker on the floor.","There is a pair of white sneakers in a box.","There is a pair of white sneakers on the floor."],a:2,sen:"For question three, look at the picture. What is on the floor?",szh:"第三題，請看圖片。地板上有什麼？",en:"There is a pair of white sneakers on the floor.",zh:"木頭地板上放著一雙(pair)白色運動鞋(sneaker)，正確。圖中是兩隻鞋，不是一隻；鞋子直接放在地板上，旁邊沒有盒子。選 C"},
{n:4,p:0,fig:DUMBBELL,o:["He is training with weights next to a swimming pool.","He is training with weights at the gym.","He is putting weights back on the shelf at the gym."],a:1,sen:"For question four, look at the picture. What is the man doing?",szh:"第四題，請看圖片。這位男士在做什麼？",en:"He is training with weights at the gym.",zh:"男士在健身房(gym)手拿啞鈴做重量訓練(train)，正確。他是舉著啞鈴，不是把啞鈴放回架子上；背景是窗戶和啞鈴架，沒有游泳池。選 B"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Sports Club</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">80</text><rect x="96" y="75" width="44" height="75" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="70" font-size="14" font-weight="700" text-anchor="middle">60</text><rect x="162" y="112" width="44" height="38" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="107" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="228" y="125" width="44" height="25" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="120" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Soccer</text><text x="118" y="167" text-anchor="middle">Swim</text><text x="184" y="167" text-anchor="middle">Tennis</text><text x="250" y="167" text-anchor="middle">Golf</text></g></svg>`,o:["Fifty students joined them.","Thirty students joined them.","Eighty students joined them."],a:0,sen:"For question five, look at the picture. The chart shows how many students joined each sports club. How many students joined golf and tennis in all?",szh:"第五題，請看圖片。圖表顯示各個運動社團有多少學生參加。參加高爾夫和網球的學生一共有多少人？",en:"Fifty students joined them.",zh:"圖中高爾夫(golf)20人、網球(tennis)30人，加起來50人。三十人只算了網球一項；八十人是足球(soccer)社的人數，看錯了項目。選 A"},
{n:6,p:1,o:["I'll play in the next match, too.","Yes, soccer is my favorite sport.","Oh no! Can you still walk on it?"],a:2,sen:"I hurt my foot in the soccer match yesterday.",szh:"我昨天足球比賽時傷到腳了。",en:"Oh no! Can you still walk on it?",zh:"對方說昨天足球(soccer)比賽(match)傷到腳，關心「還能走路嗎？」最自然。「我下一場也會上場(play)」只是重複 match，沒有回應受傷；「是的，足球是我最愛的運動(sport)」用 Yes 回應壞消息，答非所問。選 C"},
{n:7,p:1,o:["That's Lisa. She's our new player.","She practices every day after school.","Inside, because it's raining."],a:0,sen:"Who is the tall girl practicing volleyball inside the gym?",szh:"在體育館裡練排球的那個高個子女生是誰？",en:"That's Lisa. She's our new player.",zh:"問「誰」在體育館(gym)裡(inside)練(practice)排球(volleyball)，答「那是 Lisa，我們的新球員(player)」才是人物。「她每天放學後練習」答的是時間；「在室內，因為下雨」只重複 inside，答的是地點和原因。選 A"},
{n:8,p:1,o:["Only a hundred dollars. I was lucky.","I'll buy a pair next week.","At the sports shop near the gym."],a:0,sen:"How much did you pay for those sneakers?",szh:"你那雙運動鞋花了多少錢？",en:"Only a hundred dollars. I was lucky.",zh:"問運動鞋(sneaker)花多少錢，答「才一百(hundred)元(dollar)，我很幸運(lucky)」才是價錢。「在體育館附近的運動用品店」答的是地點；「我下週要買一雙(pair)」時態不對，對方問的是已經買的鞋。選 A"},
{n:9,p:1,o:["It's next to the ticket office.","I'll bring you some, too.","No, thanks. I just had a big steak."],a:2,sen:"I'm going to get some popcorn. Do you want some?",szh:"我要去買爆米花，你要一些嗎？",en:"No, thanks. I just had a big steak.",zh:"對方要去買爆米花(popcorn)並問你要不要，「不用了，謝謝，我剛吃了一大塊牛排(steak)」是委婉拒絕。「我也會帶(bring)一些給你」人物顛倒，要去買的是對方；「在售票處旁邊」答的是地點，沒人問在哪裡。選 C"},
{n:10,p:1,o:["I like to go swimming before work.","Because I went to bed too late.","At five thirty, usually."],a:0,sen:"Why do you wake up so early every day?",szh:"你為什麼每天都這麼早起床？",en:"I like to go swimming before work.",zh:"問為什麼每天這麼早起床(wake)，答「我喜歡上班前去(go)游泳(swim)」說明了理由。「通常五點半」答的是時間；「因為我太晚睡」是晚起的原因，和早起剛好矛盾。選 A"},
{n:11,p:1,o:["They will widen that road next year.","I can see you very well, too.","Then drive slowly, or let's take a taxi."],a:2,sen:"There's so much fog this morning. I can't see the road well.",szh:"今天早上霧好大，我看不清楚路。",en:"Then drive slowly, or let's take a taxi.",zh:"對方說霧(fog)很大看不清楚路，回「那就開慢一點，或我們搭計程車(taxi)」最合理。「明年要拓寬(widen)那條路」與看不清楚無關；「我也看你看得很清楚(well)」只是重複 see 和 well。選 C"},
{n:12,p:1,o:["At the primary school gym.","They moved it to next Saturday.","We lost against them last year."],a:1,sen:"When is our tennis match against Green High School?",szh:"我們和綠園高中的網球比賽是什麼時候？",en:"They moved it to next Saturday.",zh:"問和綠園高中的網球(tennis)比賽(match)「什麼時候」，答「改到下週六了」是時間。「在小學(primary)體育館」答的是地點；「我們去年輸給(against)他們」講的是過去的比賽。選 B"},
{n:13,p:1,o:["The race was three kilometers long.","Sorry, I can't run in the race.","Don't worry. We all ran slowly today."],a:2,sen:"I'm sorry. It was my fault that we lost the race.",szh:"對不起，我們輸了賽跑都是我的錯。",en:"Don't worry. We all ran slowly today.",zh:"對方因為輸了賽跑(race)道歉，說是自己的錯(fault)，回「別擔心，我們今天大家都跑得很慢」是安慰。「賽跑全長三(three)公里」只是重複 race；「抱歉，我不能參加比賽」時態不對，比賽已經結束了。選 C"},
{n:14,p:1,o:["Walk to work, and add fruit to every meal.","The health center is closed on Mondays.","I'm very busy this week, too."],a:0,sen:"How can I stay healthy when I'm so busy?",szh:"我這麼忙，要怎麼保持健康？",en:"Walk to work, and add fruit to every meal.",zh:"問很忙時要怎麼保持健康(healthy)，建議「走路上班，每餐加(add)點水果」才是方法。「我這週也很忙」只重複 busy；「健康(health)中心週一休息」是音近的同字陷阱。選 A"},
{n:15,p:1,o:["Yes, I took a dance class last year.","Sure. Just give me five minutes.","The room is on the second floor."],a:1,sen:"Could you help me tidy up the room after the dance class?",szh:"舞蹈課後你可以幫我整理教室嗎？",en:"Sure. Just give me five minutes.",zh:"對方請你在舞蹈(dance)課後幫忙整理(tidy)教室，回「當然，給我五分鐘」是答應。「是的，我去年上過舞蹈課」只重複 dance class；「教室在二樓」答的是地點。選 B"},
{n:16,p:2,o:["At four-thirty.","At five.","At five-thirty."],a:2,sen:"W: Let's play table tennis at four today. &nbsp;M: Sorry, I have golf practice until four-thirty. &nbsp;W: Then how about five? &nbsp;M: I need a shower after practice. Can we start thirty minutes after five? &nbsp;W: No problem. &nbsp;Q: When will they play table tennis?",szh:"女：我們今天四點去打(play)桌球(table tennis)吧。　男：抱歉，我高爾夫(golf)練習(practice)到四點半。　女：那五點呢？　男：練習完我要洗個澡，可以在五點之後再晚三十分鐘開始嗎？　女：沒問題。　問：他們幾點打桌球？",en:"At five-thirty.",zh:"女士先約四點，男士高爾夫(golf)練習(practice)到四點半，女士改約五點，男士又要求再晚三十分鐘，所以是五點半打桌球(table tennis)。四點半是男士練習結束的時間；五點是被改掉的時間。選 C"},
{n:17,p:2,o:["The woman's team won the match.","The woman's team lost three games.","The woman's team lost the match."],a:0,sen:"M: How did your volleyball team do last night? &nbsp;W: We lost the first game. &nbsp;M: Oh, that's too bad. &nbsp;W: But then we won the next three. Amy played really well. &nbsp;Q: What happened in the match?",szh:"男：你們排球(volleyball)隊昨晚打得怎樣？　女：我們第一局輸了。　男：喔，真可惜。　女：但接下來三(three)局都贏了，Amy 打得很好(well)。　問：這場比賽(match)結果如何？",en:"The woman's team won the match.",zh:"女士的排球(volleyball)隊第一局輸了，但接下來三(three)局都贏，所以整場比賽(match)是贏的。「輸了比賽」只聽到第一局；「輸了三局」把贏的三局聽成輸的。選 A"},
{n:18,p:2,o:["Getting ready for a sports event.","Running a race in the room.","Waiting for the chairperson."],a:0,sen:"W: The chairperson wants this room ready by three o'clock. &nbsp;M: OK. Let's arrange the chairs in two rows first. &nbsp;W: I'll bring the water for the players. &nbsp;M: Where should we put the score board? &nbsp;W: Next to the door, so everyone can see it. &nbsp;M: Good. The race starts soon. &nbsp;Q: What are the speakers doing?",szh:"女：主席(chairperson)希望這個房間三點(three)以前準備好。　男：好。我們先把椅子排(arrange)成兩排。　女：我來帶(bring)給球員(player)喝的水。　男：計分板(score)要放在哪裡？　女：放在門旁邊，這樣大家都看得到。　男：好。比賽(race)快開始了。　問：說話的人在做什麼？",en:"Getting ready for a sports event.",zh:"兩人在排椅子、準備水、決定計分板(score)放哪裡，因為比賽快開始，所以是在為運動賽事做準備。他們沒有在跑步，比賽(race)還沒開始；主席(chairperson)只是交代工作的人，他們不是在等他。選 A"},
{n:19,p:2,o:["She doesn't like their class.","She would like to join them.","She wants to eat lunch alone."],a:1,sen:"M: Kim hasn't said a word to us all week. I think she doesn't like our class. &nbsp;W: She's just shy. &nbsp;M: But she eats lunch alone every day. &nbsp;W: She always sits near our table, though. &nbsp;M: So? &nbsp;W: And she looks up every time we laugh. &nbsp;Q: What does the woman think about Kim?",szh:"男：Kim 整個星期一句話都沒跟我們說。我覺得她不喜歡我們班。　女：她只是害羞(shy)。　男：可是她每天都一個人吃午餐。　女：不過她總是坐在我們桌子附近。　男：所以呢？　女：而且每次我們笑，她都會抬頭看。　問：女士覺得 Kim 怎麼樣？",en:"She would like to join them.",zh:"女士說 Kim 只是害羞(shy)，又說她總坐在他們桌子旁、每次他們笑就抬頭看，言下之意是她其實想加入他們。「不喜歡這個班」是男士的猜測，女士不同意；她雖然一個人吃午餐，但坐在旁邊又一直看，不是想獨自吃。選 B"},
{n:20,p:2,o:["One hundred dollars.","Eight hundred dollars.","One thousand dollars."],a:1,sen:"M: How much does it cost to swim here? &nbsp;W: A hundred dollars each time. Or you can buy a card for ten times. It's eight hundred dollars. &nbsp;M: I come every week, so I'll get the card. &nbsp;Q: How much will the man pay?",szh:"男：在這裡游泳(swim)要多少錢？　女：每次一百(hundred)元(dollar)。或者你可以買十次卡，八百元。　男：我每週都來，那我買卡。　問：男士要付多少錢？",en:"Eight hundred dollars.",zh:"單次游泳(swim)一百(hundred)元(dollar)，十次卡八百元；男士每週都來，決定買卡，所以付八百元。一百元是單次的價錢；一千元是單次買十次的價錢，他沒有這樣買。選 B"},
{n:21,p:2,o:["Inside the sports center.","Next to the soccer field.","Behind the tennis courts."],a:2,sen:"W: Is the new swimming pool inside the sports center? &nbsp;M: No, it's outside, behind the tennis courts. &nbsp;W: Not next to the soccer field? &nbsp;M: That's the old pool. It's closed now. &nbsp;Q: Where is the new swimming pool?",szh:"女：新的游泳池在運動中心裡面(inside)嗎？　男：不是，在戶外，網球(tennis)場後面。　女：不是在足球(soccer)場旁邊？　男：那是舊泳池，現在關了。　問：新的游泳池在哪裡？",en:"Behind the tennis courts.",zh:"女士以為新泳池在運動中心裡面(inside)，男士更正說在戶外的網球(tennis)場後面；足球(soccer)場旁邊的是已經關閉的舊泳池。在運動中心裡是女士猜錯的；足球場旁邊是舊泳池的位置。選 C"},
{n:22,p:2,o:["She wants to hear the weather report.","They should not go surfing on Saturday.","Saturday will be a great day to surf."],a:1,sen:"M: Let's go surfing this Saturday. &nbsp;W: Have you heard the weather report for Saturday? &nbsp;M: No. Is it going to be sunny? &nbsp;W: Strong wind and heavy rain all day. &nbsp;Q: What does the woman mean?",szh:"男：我們這週六去衝浪(surf)吧。　女：你聽過週六的氣象報告了嗎？　男：沒有，會是晴天嗎？　女：整天強風大雨。　問：女士的意思是什麼？",en:"They should not go surfing on Saturday.",zh:"男士約週六去(go)衝浪(surf)，女士說週六整天強風大雨，言下之意是週六不適合去。「週六很適合衝浪」與天氣相反；氣象報告她已經聽過了，不是想去聽。選 B"},
{n:23,p:2,o:["At seven-thirty.","At seven.","At six-thirty."],a:2,sen:"W: Our golf game starts at eight tomorrow morning. &nbsp;M: It takes an hour to get there by taxi. &nbsp;W: And I want thirty minutes to practice before the game. &nbsp;Q: What time should they leave?",szh:"女：我們的高爾夫(golf)球賽明天早上八點開始。　男：搭計程車(taxi)過去要一小時。　女：而且開打前我想練習(practice)三十分鐘。　問：他們應該幾點出發？",en:"At six-thirty.",zh:"八點開打，往前留三十分鐘練習(practice)，再留一小時計程車(taxi)車程，八點減半小時再減一小時是六點半。七點只算了車程；七點半只算了練習時間。選 C"},
{n:24,p:2,o:["At the game, with many fans.","At a crowded restaurant.","At home on TV."],a:0,sen:"M: Did you watch the Asian Games final on TV last night? &nbsp;W: No, I was there with my brother. It was so crowded that we couldn't find a seat. &nbsp;M: Wow. Did we win? &nbsp;W: Yes! Many fans had tears in their eyes. &nbsp;Q: Where did the woman watch the final?",szh:"男：你昨晚有看電視轉播的亞洲(Asian)運動會決賽嗎？　女：沒有，我和哥哥在現場。人擠(crowded)到我們找不到座位。　男：哇，我們贏了嗎？　女：贏了！很多球迷都流下眼淚(tear)。　問：女士在哪裡看決賽？",en:"At the game, with many fans.",zh:"男士問有沒有看電視轉播的亞洲(Asian)運動會決賽，女士說沒有，她人在現場，擠(crowded)到找不到座位，球迷激動落淚(tear)。「在家看電視」被她否定；擁擠的是比賽現場，對話沒有提到餐廳。選 A"},
{n:25,p:2,o:["A new flute for the man.","An event the man is preparing for.","A song his teacher likes."],a:1,sen:"W: Your flute sounds great! Do you practice every day? &nbsp;M: Yes. My teacher makes me repeat each song until every note is exact. &nbsp;W: That sounds hard. &nbsp;M: It is, but the show is on Friday. I don't want to make any mistakes. &nbsp;W: Don't worry. You'll be fine. &nbsp;Q: What are the speakers talking about?",szh:"女：你的長笛(flute)吹得真好！你每天都練習嗎？　男：對。我的老師要我把每首歌重複(repeat)練到每個音都準確(exact)。　女：聽起來很辛苦。　男：是啊，但表演星期五就要到了。我不想出任何錯。　女：別擔心，你會沒問題的。　問：說話的人在談什麼？",en:"An event the man is preparing for.",zh:"男士每天練長笛(flute)、重複(repeat)練到準確(exact)，因為星期五有表演，所以兩人在談他正在準備的演出。長笛是他現有的，不是要買新的；老師只是要求他反覆練習，沒有說她喜歡哪一首歌。選 B"},
{n:26,p:3,pic:true,o:[BARS("Health Club Classes",["Swim","Dance","Weights"],[80,50,20]),BARS("Health Club Classes",["Swim","Dance","Weights"],[50,20,80]),BARS("Health Club Classes",["Swim","Dance","Weights"],[50,80,20])],a:2,sen:"Our health club has three classes: swimming, dance, and weight training. Last month, swimming was the most popular. This month, a new dance teacher came, and more members went to dance than to swim. Weight training is still the least popular, but the chairperson hopes more people will try it. &nbsp;Q: Which chart shows the classes this month?",szh:"我們的健康(health)俱樂部有三(three)種課：游泳、舞蹈(dance)和重量訓練(train)。上個月游泳最受歡迎。這個月來了一位新的舞蹈老師，去跳舞的會員比去游泳(swim)的多。重量訓練仍然最不受歡迎，但主席(chairperson)希望有更多人來試試。　問：哪張圖是這個月的情形？",en:"Dance most, swimming second, weights fewest.",zh:"這個月去跳舞(dance)的人比游泳(swim)多，重量訓練(train)仍然最少，所以舞蹈最高、游泳第二、重量最低。游泳最高的那張是上個月的情形；重量最高的那張與「最不受歡迎」相反。選 C"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:2,sen:"Tomorrow our team goes to a three-day training camp in the mountains. I packed two shirts, my sneakers, and some underwear. Mom asked about my swimsuit, but I don't need it. There's no pool at the camp. I almost forgot my water bottle, but Dad put it in my bag at the last minute. &nbsp;Q: What will the speaker leave at home?",szh:"明天我們隊要去山上參加三(three)天的訓練(train)營。我打包了兩件上衣、運動鞋(sneaker)和一些內衣褲(underwear)。媽媽問到泳衣，但我用不到，營地沒有游泳池。我差點忘了水壺，不過爸爸在最後一刻幫我放進包包了。　問：說話者會把什麼留在家裡？",en:"The swimsuit.",zh:"運動鞋(sneaker)是說話者自己打包的；水壺是爸爸最後放進包包的，也會帶去；泳衣媽媽有問，但營地沒有游泳池、用不到，所以留在家裡。選 C"},
{n:28,p:3,pic:true,o:[PH('q28c'),PH('q28b'),PH('q28a')],a:0,sen:"Every morning, Grandpa walks around the lake and feeds the ducks. This morning, however, there was thick fog, so Grandma asked him to stay inside. He didn't want to sit and watch TV all morning. So he did some exercises on the living room floor. &nbsp;Q: What did Grandpa do this morning?",szh:"爺爺每天早上都會繞著湖散步、餵鴨子(duck)。不過今天早上霧(fog)很濃，奶奶要他待在室內(inside)。他不想整個早上坐著看電視，所以在客廳地板上做了一些運動。　問：爺爺今天早上做了什麼？",en:"He did exercises on the living room floor.",zh:"爺爺平常會繞湖散步、餵鴨子(duck)，但今天早上霧(fog)很濃，奶奶要他待在室內(inside)；他不想整個早上看電視，所以在客廳地板上做運動。餵鴨子是平常的習慣；看電視是他不想做的事。選 A"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:0,sen:"Ken is the best player on our soccer team. But he hurt his leg in a match last week, and the doctor told him not to run for a month. So he can't play in the big game on Saturday. He won't stay at home, though. He'll sit next to the coach and help him watch the other team. &nbsp;Q: What will Ken do on Saturday?",szh:"Ken 是我們足球(soccer)隊最好的球員(player)，但上週比賽(match)時傷了腿，醫生說一個月不能跑步，所以週六的大賽他不能上場(play)。不過他不會待在家，他會坐在教練旁邊，幫忙觀察對手。　問：Ken 週六會做什麼？",en:"He will sit with the coach and watch.",zh:"Ken 腿受傷，週六不能上場(play)踢球；他也不會待在家，而是坐在教練旁邊幫忙看對手。踢球是他受傷前的事；待在家是說話者特別否定的。選 A"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:1,sen:"My sister is training for a big swim race. After training, she used to sit in a hot tub for an hour. But her coach says that's not good for her. Now she sticks to a new plan. She drinks a glass of milk, a good source of energy, and goes to bed early. &nbsp;Q: What does the sister do after training now?",szh:"我姊姊正在為一場大型游泳(swim)比賽(race)訓練(train)。以前訓練完，她會泡在熱水浴缸(tub)裡一個小時。但教練說那樣對她不好。現在她堅持(stick)新的計畫：喝一杯牛奶——很好的能量來源(source)——然後早點睡。　問：姊姊現在訓練完會做什麼？",en:"She drinks a glass of milk.",zh:"泡熱水浴缸(tub)是她「以前」的習慣，教練說不好，已經不做了；游泳是她在訓練的項目，不是訓練完做的事；現在她照新計畫喝一杯牛奶，是很好的能量來源(source)。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 10 回　身體與健康　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
