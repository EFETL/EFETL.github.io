<script>
/* 圖形素材（第36回 電腦與手機） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/36/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const COMPUTER=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q1.jpg" alt="question 1 picture">`;
const CELLPHONE=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q2.jpg" alt="question 2 picture">`;
const ALARM=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q3.jpg" alt="question 3 picture">`;
const SNAKE=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q4.jpg" alt="question 4 picture">`;
const ELEPHANT=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:COMPUTER,o:["A computer with a bright screen.","A cellphone with a bright screen.","A television with a bright screen."],a:0,sen:"For question one, look at the picture. What machine is this?",szh:"第一題，請看圖片。這是什麼機器？",en:"A computer with a bright screen.",zh:"一台電腦(computer)，螢幕(screen)很亮，選 A。B 是手機(cellphone)、C 是電視，都不是圖中的機器。"},
{n:2,p:0,fig:CELLPHONE,o:["A cheap camera; I take photos with it.","A remote; I change channels with it.","A cellphone; I download apps on it."],a:2,sen:"For question two, look at the picture. What do you hold?",szh:"第二題，請看圖片。你手上拿什麼？",en:"A cellphone; I download apps on it.",zh:"手上拿的是一支手機(cellphone)，用來下載(download)程式，選 C。相機和遙控器的用途不符合圖片。"},
{n:3,p:0,fig:ALARM,o:["The morning sun through the window.","My dad calling from downstairs.","An alarm clock by my bed."],a:2,sen:"For question three, look at the picture. What wakes you up?",szh:"第三題，請看圖片。什麼把你叫醒？",en:"An alarm clock by my bed.",zh:"把你叫醒的是床邊(by)的鬧鐘(alarm)，選 C。陽光、爸爸(dad)在樓下(downstairs)叫人都可能叫醒人，但不是圖中的東西。"},
{n:4,p:0,fig:SNAKE,o:["A green snake by the hill.","A green frog by the hill.","A green turtle by the hill."],a:0,sen:"For question four, look at the picture. What animal is this?",szh:"第四題，請看圖片。這是什麼動物？",en:"A green snake by the hill.",zh:"山(hill)邊(by)有一條綠蛇(snake)，選 A。青蛙和烏龜地點相同、顏色相同，但動物不對。"},
{n:5,p:0,fig:ELEPHANT,o:["A sweet elephant that looks wise.","A sweet giraffe that looks wise.","A sweet hippo that looks wise."],a:0,sen:"For question five, look at the picture. What huge animal is this?",szh:"第五題，請看圖片。這是什麼大型動物？",en:"A sweet elephant that looks wise.",zh:"這隻大型動物是大象(elephant)，看起來可愛(sweet)又聰明(wise)，選 A。長頸鹿與河馬不是圖中的動物。"},

{n:6,p:1,o:["Let's meet at the school gym.","I enter it once every year.","No, I won by one point."],a:2,sen:"Did you lose the big competition?",szh:"你在大賽中輸了嗎？",en:"No, I won by one point.",zh:"問是否輸了比賽，答『沒有，我以(by)一分獲勝』，選 C。A 邀約碰面(meet)，B 回答參加(enter)的次數(once)，都沒回答問題。"},
{n:7,p:1,o:["Probably not. It's still too much.","It belongs to my dad.","It's made of gold and silver."],a:0,sen:"Is this expensive watch a real bargain?",szh:"這支貴手錶真的划算嗎？",en:"Probably not. It's still too much.",zh:"問這支貴手錶是否划算，答『大概(probably)不，還是(still)太貴了』，選 A。B 講誰的(belong)，C 講材質(gold)，都沒回答是否划算。"},
{n:8,p:1,o:["I bought it at the southern bakery.","It's my dad's, I think.","It's soft and still warm."],a:1,sen:"Whose lovely warm bread is this?",szh:"這條溫暖好吃的麵包是誰的？",en:"It's my dad's, I think.",zh:"問麵包是誰的，答『我想是我爸爸(dad)的』，選 B。A 回答在哪買(bakery)，C 描述麵包(soft)的狀態，都沒說是誰的。"},
{n:9,p:1,o:["The fence is painted white.","The guard will fix it quickly.","A dog dug a hole there."],a:1,sen:"What happens if the fence breaks?",szh:"如果圍牆破了會怎樣？",en:"The guard will fix it quickly.",zh:"問圍牆破了會怎樣，答『警衛(guard)會很快修好』，選 B。A 講顏色，C 講洞(hole)是怎麼來的（原因，不是後果）。"},
{n:10,p:1,o:["Yes. I'm independent and can handle it.","At the new office downtown, next week.","Our project is due next Friday morning."],a:0,sen:"Can you manage this big project alone?",szh:"這個大專案你能自己搞定嗎？",en:"Yes. I'm independent and can handle it.",zh:"問能否獨力完成專案，答『可以，我很獨立(independent)，能處理(handle)』，選 A。B 回答時間地點，C 只講期限，都沒回答能不能。"},
{n:11,p:1,o:["On Saturday, with my cousin.","The new lock is upstairs.","Because it's too noisy downstairs."],a:2,sen:"Why did you move your things up a floor?",szh:"你為什麼把東西搬到樓上？",en:"Because it's too noisy downstairs.",zh:"問為什麼搬到樓上，答『因為樓下(downstairs)太吵』，選 C。A 回答時間和同伴，B 提到鎖(lock)和樓上(upstairs)但沒有說明原因。"},
{n:12,p:1,o:["About ten o'clock at night.","People cheered for our victory.","Outside the stationery store."],a:1,sen:"What was all the noise about outside?",szh:"外面的騷動是怎麼回事？",en:"People cheered for our victory.",zh:"問外面吵什麼，答『大家在為我們的勝利(victory)歡呼』，選 B。A 回答時間，C 回答地點(stationery 文具店)，都沒說明吵鬧的原因。"},
{n:13,p:1,o:["When my dad gets home.","I'd like a hot dog, please.","Yes, I'm very hungry."],a:1,sen:"What would you like to eat today?",szh:"你今天想吃什麼？",en:"I'd like a hot dog, please.",zh:"問想吃什麼，答『我想要一個熱狗(hot dog)』，選 B。A 回答何時(when)，C 回答 Yes，都沒說出食物。"},
{n:14,p:1,o:["It cost about five hundred dollars.","It has a very fast system.","It's upstairs, on my desk."],a:2,sen:"Where is your new laptop kept?",szh:"你的新筆電放哪？",en:"It's upstairs, on my desk.",zh:"問筆電放在哪，答『在樓上(upstairs)，我的書桌上』，選 C。A 講價錢，B 講系統(system)很快，都沒回答位置。"},
{n:15,p:1,o:["I downloaded it from the Internet.","By bus, about an hour ago.","The report has twenty pages."],a:0,sen:"How did you get the report so cheaply?",szh:"你怎麼這麼便宜就拿到報告的？",en:"I downloaded it from the Internet.",zh:"問怎麼便宜拿到報告，答『我從網路(Internet)下載(download)的』，選 A。B 把 How 當成交通方式(by bus)，C 只講頁數，都不對。"},

{n:16,p:2,o:["Happy about the snacks.","Sad about his test.","Angry at his friend."],a:1,sen:"W: How was your math test today? &nbsp;M: Don't ask. I failed it again, and the questions were horrible. &nbsp;W: Cheer up. Let's study together after school, and I'll bring snacks. &nbsp;Q: How does the man feel?",szh:"女：你今天數學考試考得如何？　男：別問了。我又考砸了(fail)，題目很糟(horrible)。　女：打起精神。放學後(let's)一起讀書，我會帶點心。　問：男士感覺如何？",en:"He is sad about his test.",zh:"男士說『又考砸了(failed)』、『題目很糟(horrible)』，語氣沮喪，所以他對考試感到難過，選 B。女士帶點心是要安慰他，不是他開心的原因，所以 A 不對。"},
{n:17,p:2,o:["He lost his bag.","He missed the bus.","He can't call his father."],a:2,sen:"W: Why are you still at school? It's almost dark. &nbsp;M: My cell phone is dead, so I can't call my dad to pick me up. &nbsp;W: Use my phone. I'll wait with you. &nbsp;Q: What is the man's problem?",szh:"女：你怎麼還在學校？天快黑了。　男：我的手機(cell phone)沒電了，所以不能打給爸爸(dad)來接我。　女：用我的手機吧。我陪你等。　問：男士的問題是什麼？",en:"He can't call his father.",zh:"手機(cell phone)沒電，所以他沒辦法打電話給爸爸(dad)，也就是 father，選 C。他沒有掉包包或錯過公車，A、B 對話裡都沒提。"},
{n:18,p:2,o:["From the Internet.","From a friend.","From a library book."],a:0,sen:"W: Where did you get all this information? &nbsp;M: From the Internet; I saved all the data. &nbsp;W: Handy. &nbsp;Q: Where did the man get the information?",szh:"女：這些資訊你從哪拿的？　男：從網路(Internet)，我存了所有資料(data)。　女：真方便。　問：男士從哪拿到資訊？",en:"From the Internet.",zh:"從網路(Internet)取得資料(data)，選 A。"},
{n:19,p:2,o:["Go to bed earlier.","Use her phone to wake up.","Ask her mom for help."],a:1,sen:"W: I always get up late for school. &nbsp;M: Try your phone. Choose a time, and it will ring every morning. &nbsp;W: Good idea. I'll do it tonight. &nbsp;Q: What does the man suggest?",szh:"女：我上學總是起得很晚。　男：試試你的手機。選一個時間，它每天早上會響。　女：好主意。我今晚就設。　問：男士建議什麼？",en:"Use her phone to wake up.",zh:"男士說手機選個時間每天早上會響，就是用手機的鬧鐘(alarm)叫醒自己，選 B。早點睡雖然合理，但他沒這樣說，所以 A 不對。"},
{n:20,p:2,o:["At a small zoo.","At a swimming pool.","At a playground."],a:2,sen:"M: Where are the kids? I can hear them laughing. &nbsp;W: They are climbing up the steps and sliding down. Their naughty puppy is chasing them. &nbsp;M: Sounds fun. I'll bring some water. &nbsp;Q: Where are the kids?",szh:"男：孩子們在哪？我聽到他們的笑聲。　女：他們爬上階梯又滑(slide)下來，他們頑皮(naughty)的小狗在追他們。　男：聽起來很好玩。我帶些水過去。　問：孩子們在哪裡？",en:"At a playground.",zh:"爬階梯又往下滑(sliding)是遊樂場的活動，所以他們在遊樂場，選 C。小狗(puppy)容易讓人想到動物園(zoo)，但那是干擾。"},
{n:21,p:2,o:["A huge lion in the valley.","A tiny mouse in the valley.","A huge elephant in the valley."],a:2,sen:"W: What big animal did you see at the zoo? &nbsp;M: A huge elephant in the green valley area. &nbsp;W: Amazing. &nbsp;Q: What animal did the man see?",szh:"女：動物園你看到什麼大動物？　男：綠色山谷(valley)區裡一隻巨大的大象(elephant)。　女：真驚人。　問：男士看到什麼動物？",en:"A huge elephant in the valley.",zh:"看到山谷(valley)裡的大象(elephant)，選 C。獅子同樣巨大且在山谷，但對話說的是大象。"},
{n:22,p:2,o:["Soft bread from the bakery.","Fresh fruit from the market.","Hot soup from the kitchen."],a:0,sen:"M: What smells so good in here? &nbsp;W: Soft, warm bread fresh from the bakery. &nbsp;M: I'm hungry now. &nbsp;Q: What smells good?",szh:"男：這裡什麼這麼香？　女：麵包店(bakery)剛出爐的軟(soft)麵包。　男：我餓了。　問：什麼這麼香？",en:"Soft bread from the bakery.",zh:"是麵包店(bakery)的軟(soft)麵包，選 A。水果與湯在對話中都沒提到。"},
{n:23,p:2,o:["It was too long.","It was too noisy.","It was too funny."],a:1,sen:"M: I watched an action movie last night. &nbsp;W: Was it good? &nbsp;M: Too loud for me. A bomb went off every five minutes, and I couldn't sleep afterward. &nbsp;Q: What did the man think of the movie?",szh:"男：我昨晚看了一部動作片。　女：好看嗎？　男：對我來說太大聲了。每五分鐘就有炸彈(bomb)爆炸，我之後都睡不著。　問：男士覺得電影如何？",en:"It was too noisy.",zh:"男士說『太大聲』且炸彈不斷爆炸，表示電影太吵，選 B。他沒說太長或太好笑。"},
{n:24,p:2,o:["A friend of my mom.","A friend of my dad.","A friend from school."],a:1,sen:"M: Who is visiting your family this week? &nbsp;W: A European friend of my dad, from France. &nbsp;M: Welcome him warmly. &nbsp;Q: Who is visiting?",szh:"男：這週誰來你家？　女：我爸爸(dad)一位來自法國的歐洲(European)朋友。　男：熱情歡迎他。　問：誰要來訪？",en:"A friend of my dad.",zh:"來訪的是爸爸(dad)來自法國的歐洲(European)朋友，選 B。媽媽的朋友、同學都是干擾。"},
{n:25,p:2,o:["A hot dog with sauce.","Some soup and bread.","A salad with sauce."],a:0,sen:"W: What snack would you like at the game? &nbsp;M: A hot dog, please, with lots of sauce. &nbsp;W: Coming up. &nbsp;Q: What snack does the man want?",szh:"女：看比賽你想吃什麼點心？　男：一個熱狗(hot dog)，多加點醬。　女：馬上來。　問：男士想吃什麼點心？",en:"A hot dog with sauce.",zh:"男士要熱狗(hot dog)並多加醬，選 A。沙拉也提到醬，但不是他點的。"},

{n:26,p:3,pic:true,o:[BARS("Devices",["Phone","Computer","Tablet"],[20,50,80]),BARS("Devices",["Phone","Computer","Tablet"],[50,80,20]),BARS("Devices",["Phone","Computer","Tablet"],[80,50,20])],a:2,sen:"Our class asked which device students use most. We counted the answers. The cellphone was used the most, because it is small and always with us. The computer was in the middle, and the tablet was used the least. Thus the phone bar should be the tallest. &nbsp;Q: Which chart shows the devices used?",szh:"我們班問學生最常用哪種裝置。我們數了(count)答案。手機(cellphone)用最多，因為小又隨身；電腦(computer)中等；平板最少。因此(thus)手機長條最高。　問：哪張圖顯示裝置使用？",en:"Phone most, tablet least.",zh:"手機(cellphone)最多、平板最少，符合『Phone 最高』，選 C。"},
{n:27,p:3,pic:true,o:[BARS("Downloads",["Mon","Tue","Wed"],[80,55,30]),BARS("Downloads",["Mon","Tue","Wed"],[55,80,30]),BARS("Downloads",["Mon","Tue","Wed"],[30,55,80])],a:0,sen:"Our website counted its downloads over three days. We told fans about a new game in advance, so on Monday there were the most downloads. On Tuesday it was in the middle, and by Wednesday the fewest. So the downloads went down each day. &nbsp;Q: Which chart shows the downloads?",szh:"我們網站統計三天的下載數。我們事先(in advance)告訴粉絲有新遊戲，所以星期一下載(download)最多；星期二中等；到星期三最少。所以下載數逐日下降。　問：哪張圖顯示下載數？",en:"Mon most, Wed fewest.",zh:"週一最多、逐日下降，符合『Mon 最高、Wed 最低』，選 A。"},
{n:28,p:3,pic:true,o:[IMG('noodles'),IMG('rice'),IMG('bread')],a:2,sen:"While we worked late fixing a bug on the computer, we got hungry. There was no time to cook noodles or wait for rice from a shop. So my dad went to the bakery downstairs and brought back soft, warm bread. We cut it into separate pieces for the whole team to share. &nbsp;Q: What did they eat while fixing the computer?",szh:"我們熬夜修電腦(computer)上的程式錯誤(bug)時餓了。沒時間煮麵或等店裡的飯。所以我爸爸(dad)去樓下(downstairs)的麵包店(bakery)，帶回軟(soft)麵包。我們把它切成一片片分開(separate)的，給全隊分享。　問：修電腦時他們吃什麼？",en:"Soft bread.",zh:"修電腦時吃麵包(bread)，選 C。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:1,sen:"After my brother won the computer game contest, our family celebrated his victory. He was tired of the cold bread and dry rice he ate during the long practice. So mom cooked a big bowl of hot noodles. He said it was the best meal of his life, and we all cheered his wise, hard work. &nbsp;Q: What did mom cook to celebrate?",szh:"我弟弟贏了電腦(computer)遊戲比賽後，全家慶祝他的勝利(victory)。他練習期間受夠了冷麵包和乾飯。所以媽媽煮了一大碗熱麵(noodle)。他說這是他一生(life)中最棒的一餐，我們都為他聰明(wise)的努力歡呼。　問：媽媽煮什麼慶祝？",en:"A bowl of noodles.",zh:"媽媽煮熱麵(noodle)慶祝，選 B。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('park'),IMG('beach'),IMG('mountain')],a:1,sen:"To take a break from our screens and cellphones, our family planned a trip. My dad liked the mountain and my sister liked the park. But we chose the beach, because there was less signal there, and we could finally put down our phones and enjoy the sea. My dad made a joke that our phones would miss us. &nbsp;Q: Where did the family go to relax?",szh:"為了離開螢幕(screen)和手機(cellphone)休息一下，我們家計畫旅行。爸爸(dad)喜歡山，姊姊喜歡公園，但我們選了海邊(beach)，因為那裡訊號較少(less)，我們終於能放下手機、享受大海。爸爸開玩笑(joke)說我們的手機會想念我們。　問：一家人去哪裡放鬆？",en:"The beach.",zh:"一家人去海邊(beach)放鬆，選 B。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 36 回　電腦與手機　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
