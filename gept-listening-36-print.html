<div id="root"></div>
<script>
/* 圖形素材（第36回 電腦與手機） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/36/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/36/p3_${n}.jpg?v=r36hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const COMPUTER=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q1.jpg" alt="question 1 picture">`;
const CELLPHONE=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q2.jpg" alt="question 2 picture">`;
const ALARM=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q3.jpg" alt="question 3 picture">`;
const SNAKE=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q4.jpg" alt="question 4 picture">`;
const ELEPHANT=`<img class="pic-img p0img" src="gept-listening-img/36/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:COMPUTER,o:["The computer screen is off, and the mouse is on the right.","The computer screen shows data in charts, and the mouse is on the left.","The computer screen shows data in charts, and the mouse is on the right."],a:2,sen:"For question one, look at the picture. Which is true about the picture?",szh:"第一題，請看圖片。關於這張圖，何者正確？",en:"The computer screen shows data in charts, and the mouse is on the right.",zh:"電腦(computer)螢幕(screen)上是各種圖表的資料(data)，滑鼠放在鍵盤右邊，正確。滑鼠在右邊不在左邊；螢幕是亮著的，有圖表，不是關著的。選 C"},
{n:2,p:0,fig:CELLPHONE,o:["A cellphone in one hand, with its screen on.","A cellphone in both hands, with its screen on.","A cellphone in one hand, with its screen off."],a:0,sen:"For question two, look at the picture. What is the person holding?",szh:"第二題，請看圖片。這個人拿著什麼？",en:"A cellphone in one hand, with its screen on.",zh:"一隻手拿著手機(cellphone)，螢幕(screen)亮著，上面有很多小圖示，正確。只有一隻手，不是兩隻手；螢幕是開著的，不是關著的。選 A"},
{n:3,p:0,fig:ALARM,o:["She is sleeping, and the alarm clock is on her bed.","She is getting out of bed to turn off the alarm.","She is reaching for the alarm clock from her bed."],a:2,sen:"For question three, look at the picture. What is the woman doing?",szh:"第三題，請看圖片。這位女士在做什麼？",en:"She is reaching for the alarm clock from her bed.",zh:"女士還躺在床上，伸手去按床邊桌上響著的鬧鐘(alarm)，正確。她還躺著，沒有起床；鬧鐘放在床邊的桌子上，不在床上，而且她已經醒了在伸手。選 C"},
{n:4,p:0,fig:SNAKE,o:["A green snake is lying on a hill above a valley.","Two green snakes are lying on a hill above a valley.","A green snake is climbing a tree above a valley."],a:0,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"A green snake is lying on a hill above a valley.",zh:"一條綠色的蛇(snake)捲成一圈趴在山丘(hill)上，後面是山谷(valley)，正確。牠是在長滿青苔的地上，不是在爬樹；圖中只有一條蛇，不是兩條。選 A"},
{n:5,p:0,fig:ELEPHANT,o:["It is standing on dry grass and throwing water up into the sky.","It is standing in the water and throwing water up into the sky.","It is lying in the water and throwing water up into the sky."],a:1,sen:"For question five, look at the picture. What is the elephant doing?",szh:"第五題，請看圖片。這頭大象在做什麼？",en:"It is standing in the water and throwing water up into the sky.",zh:"大象(elephant)站在水裡，用長鼻子把水往天空噴，正確。牠是站著，不是躺在水裡；牠的腳在水中，不是站在乾草地上。選 B"},
{n:6,p:1,o:["Not this time. I'll try again next month.","Let's meet by the school gate.","Yes, I failed it once."],a:0,sen:"Did you pass the computer test?",szh:"你電腦(computer)考試通過了嗎？",en:"Not this time. I'll try again next month.",zh:"問有沒有通過，答「這次沒有，下個月再考一次」是間接的「沒過」。「我們在(by)校門口見面(meet)」答非所問；「是的，我曾經(once)沒通過(fail)」先說 Yes 又說沒過，前後矛盾。選 A"},
{n:7,p:1,o:["Yes, I called you on it.","It belongs to my dad.","Probably because it's last year's model."],a:2,sen:"This cellphone is so cheap!",szh:"這支手機(cellphone)好便宜(cheap)！",en:"Probably because it's last year's model.",zh:"對方驚訝手機(cellphone)這麼便宜(cheap)，回「大概(probably)是因為它是去年的款式」解釋原因，最自然。「它是我爸爸(dad)的」回答的是屬於(belong)誰；「對，我用它打給你」與便宜無關。選 C"},
{n:8,p:1,o:["Early. I got some bread there at six-thirty.","Their sweet bread is really soft.","It's downstairs, next to the bank."],a:0,sen:"When does the bakery downstairs open?",szh:"樓下(downstairs)的麵包店(bakery)什麼時候(when)開門？",en:"Early. I got some bread there at six-thirty.",zh:"問「什麼時候」開門，答「很早，我六點半就在那裡買到麵包了」間接說出時間。「在樓下(downstairs)銀行旁邊」答的是地點；「他們的甜(sweet)麵包很軟(soft)」說的是麵包好不好吃。選 A"},
{n:9,p:1,o:["My naughty little brother kicked a ball at it.","Since last Sunday.","It's by the door, near the light."],a:0,sen:"How did that hole get in the wall?",szh:"牆上那個洞(hole)是怎麼來的？",en:"My naughty little brother kicked a ball at it.",zh:"問洞(hole)「怎麼」來的，答「我那頑皮(naughty)的弟弟把球踢到牆上」說明了原因。「在(by)門邊、燈旁邊」答的是位置；「從上週日開始」答的是時間。選 A"},
{n:10,p:1,o:["Lock the door when you leave.","Again? Let's ask the guard for help.","The car belongs to my uncle."],a:1,sen:"I locked my keys in the car again.",szh:"我又把鑰匙鎖(lock)在車裡了。",en:"Again? Let's ask the guard for help.",zh:"對方說又把鑰匙鎖(lock)在車裡，回「又來了？我們去找警衛(guard)幫忙」最自然。「離開時要鎖門」只是重複 lock；「車子屬於(belong)我叔叔」和怎麼解決無關。選 B"},
{n:11,p:1,o:["We have to hand it in next Friday.","Sure, let's work on it together.","I think so. I'm pretty independent."],a:2,sen:"Can you handle this project alone?",szh:"你可以一個人處理(handle)這個專題嗎？",en:"I think so. I'm pretty independent.",zh:"問能不能一個人處理(handle)，答「我想可以，我蠻獨立(independent)的」最自然。「好啊，我們一起做」和「一個人」矛盾；「下週五要交」答的是期限。選 C"},
{n:12,p:1,o:["It's upstairs, near the bookstore.","I'll go there after school.","Just some pens and a notebook."],a:2,sen:"What did you buy at the stationery store?",szh:"你在文具(stationery)店買了什麼？",en:"Just some pens and a notebook.",zh:"問在文具(stationery)店買了「什麼」，答「只買了幾支筆和一本筆記本」才是東西。「在樓上(upstairs)書店旁邊」答的是地點；「我放學後去」時態不對，問的是已經買了什麼。選 C"},
{n:13,p:1,o:["I'm not hungry, either.","Then let's get you a hot dog right now.","Elephants are very big animals."],a:1,sen:"I'm so hungry I could eat an elephant.",szh:"我餓到可以吞下一頭大象(elephant)。",en:"Then let's get you a hot dog right now.",zh:"對方誇張地說自己很餓，回「那我們現在就去幫你買熱狗(hot dog)」最自然。「大象是很大的動物」把誇飾當真，只是重複 elephant；「我也不餓」和對方說的相反，either 也用錯了。選 B"},
{n:14,p:1,o:["I think there's a bug in the system.","I use it every day after school.","Yes, it's slower than mine."],a:0,sen:"Why is your computer so slow?",szh:"你的電腦(computer)為什麼這麼慢？",en:"I think there's a bug in the system.",zh:"問電腦「為什麼」慢，答「我想是系統(system)裡有程式錯誤(bug)」是原因。「我每天放學後都用」答的是多常用；用 Yes 回答 why 問句不對。選 A"},
{n:15,p:1,o:["I'll sing one for you.","I downloaded them from the Internet.","I got them last night."],a:1,sen:"How did you get all these songs?",szh:"你怎麼弄到這些歌的？",en:"I downloaded them from the Internet.",zh:"問「怎麼」弄到歌，答「我從網路(Internet)下載(download)的」是方法。「昨晚拿到的」答的是時間；「我唱一首給你聽」只是借用 songs 的相關字。選 B"},
{n:16,p:2,o:["She did better than she thought.","She didn't take it.","She failed it."],a:0,sen:"M: How was the science test? &nbsp;W: Horrible. I was sure I failed. &nbsp;M: So what did you get? &nbsp;W: Eighty! I couldn't believe it. &nbsp;Q: What do we know about the woman?",szh:"男：自然考試考得怎樣？　女：糟透了(horrible)，我確定我考不及格(fail)。　男：那你考幾分？　女：八十分！我都不敢相信。　問：關於女士我們知道什麼？",en:"She did better than she thought.",zh:"她以為自己不及格(fail)，結果考八十分，所以比她想的好。不及格是她考完的猜測，不是結果；她有考試，才會有分數。選 A"},
{n:17,p:2,o:["Wait for his dad.","Walk home.","Use the woman's phone."],a:1,sen:"W: Why are you still at school? &nbsp;M: My cell phone is dead, and I need my dad to pick me up. &nbsp;W: Here, use mine. &nbsp;M: Thanks, but I just remembered he's at work until six. I'll walk home. &nbsp;Q: What will the man do?",szh:"女：你怎麼還(still)在學校？　男：我的手機(cell phone)沒電了，我需要爸爸(dad)來接我。　女：拿去，用我的。　男：謝謝，不過我剛想起來他上班到六點，我走路回家好了。　問：男士會怎麼做？",en:"Walk home.",zh:"男士本來想打給爸爸(dad)來接，但想起爸爸上班到六點，決定走路回家。用女士的手機是女士的提議，他婉拒了；等爸爸要等到六點以後，他沒有要等。選 B"},
{n:18,p:2,o:["The game costs too much.","There isn't enough time.","The Internet is not working."],a:1,sen:"M: Let's download the new game now. &nbsp;W: The screen says it takes forty minutes. &nbsp;M: Hmm. We have to leave at three, and it's already two-thirty. &nbsp;W: Then let's do it tonight. &nbsp;Q: Why won't they download the game now?",szh:"男：我們現在來下載(download)新遊戲吧。　女：螢幕(screen)上說要四十分鐘。　男：嗯，我們三點要出門，現在已經兩點半了。　女：那就(let)晚上再下載吧。　問：他們為什麼現在不下載遊戲？",en:"There isn't enough time.",zh:"下載要四十分鐘，但離三點出門只剩三十分鐘，時間不夠。網路(Internet)沒有壞，對話沒提到；遊戲的價錢也沒有被提到。選 B"},
{n:19,p:2,o:["At six-thirty.","At six.","At seven-thirty."],a:2,sen:"W: My alarm went off at six this morning, but I turned it off and went back to sleep. &nbsp;M: So you got up at six-thirty? &nbsp;W: I wish! An hour after that. &nbsp;Q: When did the woman get up?",szh:"女：我的鬧鐘(alarm)今天早上六點響了，但我把它關掉又回去睡了。　男：所以你六點半起床？　女：我也希望！是那之後再一個小時。　問：女士幾點起床？",en:"At seven-thirty.",zh:"男士猜六點半，女士說「我也希望」表示不是，是六點半再過一小時，也就是七點半。六點是鬧鐘(alarm)響的時間；六點半是男士猜錯的時間。選 C"},
{n:20,p:2,o:["At home.","In the park.","On the slide."],a:0,sen:"W: Where are the kids? &nbsp;M: In the park. They're playing on the slide. &nbsp;W: Did they take the dog with them? &nbsp;M: No, he's too naughty. He always runs away. So I let him stay home. &nbsp;Q: Where is the dog?",szh:"女：孩子們在哪裡？　男：在公園，他們在玩溜滑梯(slide)。　女：他們有帶狗去嗎？　男：沒有，牠太頑皮(naughty)了，總是亂跑，所以我讓(let)牠待在家。　問：狗在哪裡？",en:"At home.",zh:"問的是狗不是孩子。孩子在公園玩溜滑梯(slide)，狗因為太頑皮(naughty)被留在家。溜滑梯和公園都是孩子的位置。選 A"},
{n:21,p:2,o:["A small town in France.","America.","A big city in France."],a:0,sen:"M: Is your new classmate from America? &nbsp;W: No, she's European. She grew up in a small town in southern France. &nbsp;M: Does she speak English? &nbsp;W: Yes, very well. Her mom is from New York. &nbsp;Q: Where did the new classmate grow up?",szh:"男：你的新同學是從美國來的嗎？　女：不是，她是歐洲人(European)。她在法國南部(southern)的一個小鎮長大。　男：她會說英文嗎？　女：會，說得很好。她媽媽是紐約人。　問：新同學在哪裡長大？",en:"A small town in France.",zh:"她是歐洲人(European)，在法國南部(southern)小鎮長大。美國是男士猜錯的，紐約只是她媽媽的家鄉；她是在小鎮長大，不是大城市。選 A"},
{n:22,p:2,o:["The gold.","Nothing.","Second place."],a:2,sen:"M: Did your team win the gold again this year? &nbsp;W: Not this time. We came in second. &nbsp;M: That's still great! &nbsp;W: Thanks. But we all still remember last year's victory. &nbsp;Q: What did the team win this year?",szh:"男：你們隊今年又拿到金牌(gold)了嗎？　女：這次沒有，我們拿第二名。　男：那還是(still)很棒！　女：謝謝，不過我們都還記得去年的勝利(victory)。　問：這支隊伍今年得到什麼？",en:"Second place.",zh:"金牌(gold)和勝利(victory)都是去年的事，今年是第二名。說「什麼都沒得到」也不對，第二名也是得獎。選 C"},
{n:23,p:2,o:["He thought the jokes were very funny.","He doesn't want to see it again.","He wants to see it again."],a:1,sen:"W: Did you like the new action movie? &nbsp;M: The bomb parts were exciting, but the jokes weren't funny at all. &nbsp;W: So would you see it again? &nbsp;M: Well, once was enough. &nbsp;Q: What does the man mean?",szh:"女：你喜歡那部新的動作片嗎？　男：炸彈(bomb)的部分很刺激，但笑話(joke)一點都不好笑。　女：那你會再看一次嗎？　男：嗯，看一次(once)就夠了。　問：男士的意思是什麼？",en:"He doesn't want to see it again.",zh:"「看一次(once)就夠了」意思是不想再看。他雖然說炸彈(bomb)場面刺激，但沒有要再看；他明說笑話(joke)一點都不好笑。選 B"},
{n:24,p:2,o:["Eight hundred dollars.","Two hundred dollars.","Six hundred dollars."],a:2,sen:"W: Should we buy the show tickets in advance? &nbsp;M: Yes. They're two hundred dollars less if you buy them a week before. &nbsp;W: How much are they at the door? &nbsp;M: Eight hundred. &nbsp;Q: How much is one ticket if they buy it in advance?",szh:"女：表演的票我們要提前(in advance)買嗎？　男：要，提前一週買可以少(less)兩百元。　女：現場買多少錢？　男：八百元。　問：如果提前買，一張票多少錢？",en:"Six hundred dollars.",zh:"現場八百元，提前(in advance)買少(less)兩百，所以是六百元。兩百是便宜的差價；八百是現場價。選 C"},
{n:25,p:2,o:["Sit at separate tables.","Wait for a table upstairs.","Go to another restaurant."],a:1,sen:"W: Can the five of us sit together? &nbsp;M: Sorry, there's no table for five downstairs. You can sit at separate tables, or wait for one upstairs. &nbsp;W: How long would we wait? &nbsp;M: About ten minutes. &nbsp;W: That's fine. We don't mind. &nbsp;Q: What will the woman's group do?",szh:"女：我們五個人可以坐在一起嗎？　男：抱歉，樓下(downstairs)沒有五人桌。你們可以分開(separate)坐，或等樓上(upstairs)的位子。　女：要等多久？　男：大約十分鐘。　女：沒關係，我們不介意。　問：女士這群人會怎麼做？",en:"Wait for a table upstairs.",zh:"女士問要等多久，聽到十分鐘說沒關係、不介意，表示願意等樓上(upstairs)的位子。分開(separate)坐是另一個選擇，她想要大家坐一起；換餐廳對話沒有提到。選 B"},
{n:26,p:3,pic:true,o:[BARS("Screen Time",["Games","Videos","Chat"],[20,80,50]),BARS("Screen Time",["Games","Videos","Chat"],[80,50,20]),BARS("Screen Time",["Games","Videos","Chat"],[50,80,20])],a:2,sen:"Last week, our class counted how many hours we spend on our phones. Most of us thought games would come first. But we spend less time on games than on videos. And chatting with friends takes even less time than games. Thus, our teacher asked us to watch fewer videos at home. &nbsp;Q: Which chart shows the class's screen time?",szh:"上週我們班計算(count)大家花多少小時在手機上。大部分人以為遊戲會排第一，但我們花在遊戲上的時間比(less)影片少。和朋友聊天花的時間又比遊戲更少。因此(thus)，老師要我們在家少看一點影片。　問：哪張圖是全班使用螢幕(screen)的時間？",en:"Videos most, games second, chat least.",zh:"遊戲比影片少，聊天又比遊戲少，所以影片最高、遊戲第二、聊天最低。遊戲最高的那張是大家原本的猜想；聊天比遊戲多的那張和「聊天比遊戲更少」相反。選 C"},
{n:27,p:3,pic:true,o:[BARS("Computer Hours",["Dad","Sister","Grandpa"],[30,80,55]),BARS("Computer Hours",["Dad","Sister","Grandpa"],[25,50,80]),BARS("Computer Hours",["Dad","Sister","Grandpa"],[50,20,80])],a:1,sen:"Our family has only one computer, so we all share it. My dad was sure my sister used it the most, because she plays games on it every night. So last week, I counted everyone's hours. My sister really used it more than Dad. But my wise grandfather used it even more than my sister. He's writing a book about his life! &nbsp;Q: Which chart shows the computer hours last week?",szh:"我們家只有一台電腦(computer)，所以大家一起用。我爸爸(dad)確定姊姊用得最多，因為她每天晚上都在上面玩遊戲。所以上週我計算(count)了每個人的時數。姊姊用得確實比爸爸多，但我那聰明(wise)的爺爺用得比姊姊還多。他正在寫一本關於自己一生(life)的書！　問：哪張圖是上週使用電腦的時數？",en:"Grandpa most, sister second, dad least.",zh:"姊姊比爸爸(dad)多，聰明(wise)的爺爺又比姊姊更多，所以爺爺最高、姊姊第二、爸爸最低。姊姊最高的那張是爸爸原本的想法；爺爺最高但爸爸第二的那張，和「姊姊比爸爸多」相反。選 B"},
{n:28,p:3,pic:true,o:[PH('q28c'),PH('q28b'),PH('q28a')],a:2,sen:"My office building has a new system. Before, we had to show our cards to the guard at the door. Now we enter by putting a finger on a small screen. It's fast, and I love it. But this morning the screen didn't work, so everyone had to go in the old way again. &nbsp;Q: How did the speaker enter the building this morning?",szh:"我的辦公大樓有新的系統(system)。以前我們要在門口給警衛(guard)看卡片；現在只要把手指放在小螢幕(screen)上就能進入(enter)。又快又方便，我很喜歡。但今天早上螢幕壞了，所以大家又得用舊的方法進去。　問：說話者今天早上怎麼進入大樓？",en:"By showing a card to the guard.",zh:"新系統(system)是手指按螢幕，但今天早上螢幕壞了，所以用「舊方法」——給門口的警衛(guard)看卡片。按手指是平常的新方法，今天不能用；用鑰匙開門是兩種方法都沒提到的。選 C"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:1,sen:"Last Sunday, my family walked up a hill near our home. At the top, I took out my cellphone to take a picture of the valley, but the sky was gray, and I couldn't see anything. Then my brother saw a snake by the path. He wanted a photo of it, but Dad told us to stay away. In the end, I took a picture of all four of us together. &nbsp;Q: What picture did the speaker take?",szh:"上週日我們家走上家附近的一座山丘(hill)。到了山頂，我拿出手機(cellphone)想拍山谷(valley)，但天空灰灰的什麼都看不到。接著弟弟在小路旁(by)看到一條蛇(snake)，他想拍，但爸爸(dad)叫我們離遠一點。最後我拍了一張我們四個人的合照。　問：說話者拍了什麼照片？",en:"A picture of the whole family.",zh:"山谷(valley)因為天空灰灰的看不到而沒拍；蛇(snake)因為爸爸叫大家離遠一點也沒拍；最後拍的是全家四人合照。選 B"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30a'),PH('q30b')],a:0,sen:"I used to use the alarm on my cellphone. But I always played with my phone in bed, so I went to sleep late. Now I leave my phone downstairs at night. I tried my dad's old alarm clock, but it was so loud that it woke up the whole family. Now I just leave my window open, and the morning sun wakes me up. &nbsp;Q: What wakes the speaker up now?",szh:"我以前用手機(cellphone)的鬧鐘(alarm)，但我總是在床上玩手機，所以很晚才睡。現在晚上我把手機放在樓下(downstairs)。我試過爸爸(dad)的舊鬧鐘，但它太大聲，把全家都吵醒了。現在我只是把窗戶打開，讓早上的陽光叫醒我。　問：現在是什麼叫醒說話者？",en:"The morning sun.",zh:"手機鬧鐘(alarm)是以前的方法，現在手機放在樓下(downstairs)；爸爸的舊鬧鐘試過但太吵沒再用；現在是靠早晨的陽光叫醒。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 36 回　電腦與手機　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
