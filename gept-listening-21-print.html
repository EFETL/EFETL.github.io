<div class="bar">
 <b>🖨 第 21 回　衣服與外表　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第21回 衣服與外表） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/21/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/21/p3_${n}.jpg?v=r21q27ph-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const SHIRT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q1.jpg" alt="question 1 picture">`;
const COAT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q2.jpg" alt="question 2 picture">`;
const HAT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q3.jpg?v=2" alt="question 3 picture">`;
const SKIRT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q4.jpg?v=2" alt="question 4 picture">`;
const PANTS=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/21/p0_q1.jpg" alt="question 1 picture">`,o:["A white shirt with blue buttons.","A blue coat with white buttons.","A blue shirt with white buttons."],a:2,sen:"For question one, look at the picture. What is on the table?",szh:"第一題，請看圖片。桌上有什麼？",en:"A blue shirt with white buttons.",zh:"木桌上放著一件摺好的淺藍色襯衫(shirt)，鈕扣(button)是白色的，正確。顏色說反了，襯衫是藍色、鈕扣是白色；它是有領子的薄襯衫，不是外套(coat)。選 C"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">CLOTHES SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Hat</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Shirt</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Pants</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Coat</td><td style="text-align:right;font-weight:700">$500</td></tr></table></div>`,o:["He will have three hundred dollars left.","He will have two hundred dollars left.","He will have one hundred dollars left."],a:1,sen:"For question two, look at the picture. Ben has six hundred dollars. He buys the pants and the hat. How much will he have left?",szh:"第二題，請看圖片。班有六百元。他買了褲子和帽子。他還剩多少錢？",en:"He will have two hundred dollars left.",zh:"價目表上褲子(pants)300元、帽子(hat)100元，一共400元，600減400剩200元。剩三百元是只買了褲子、忘記帽子；剩一百元是把帽子看成襯衫(shirt)200元，算成買了300加200共500元。選 B"},
{n:3,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/21/p0_q3.jpg?v=2" alt="question 3 picture">`,o:["A man is sitting in a chair, and he is wearing a hat.","A man is sitting in a chair, and he is holding a hat.","A man is giving another man a haircut."],a:0,sen:"For question three, look at the picture. Which is true about the picture?",szh:"第三題，請看圖片。關於這張圖，何者正確？",en:"A man is sitting in a chair, and he is wearing a hat.",zh:"一位男士圍著黑色圍布坐在理髮椅上，頭上戴著綠色帽子(hat)，正確。圖中沒有人在幫他理髮(haircut)；帽子是戴在頭上，不是拿在手裡。選 A"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/21/p0_q4.jpg?v=2" alt="question 4 picture">`,o:["At this fashion show, the woman is wearing a white top and a purple skirt.","At this fashion show, the woman is sitting and taking pictures of other people.","At this fashion show, the woman is wearing a purple top and a white skirt."],a:0,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"The woman is wearing a white top and a purple skirt.",zh:"服裝(fashion)秀上，女士穿白色上衣和紫色裙子(skirt)走台步，正確。顏色說反了，上衣是白色、裙子是紫色；拍照的是兩旁坐著的其他(other)人，她自己在走路。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Clothes Sold</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="96" y="75" width="44" height="75" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="70" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="228" y="125" width="44" height="25" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="120" font-size="14" font-weight="700" text-anchor="middle">10</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Shirts</text><text x="118" y="167" text-anchor="middle">Pants</text><text x="184" y="167" text-anchor="middle">Skirts</text><text x="250" y="167" text-anchor="middle">Hats</text></g></svg>`,o:["It sold seventy in all.","It sold forty in all.","It sold sixty in all."],a:2,sen:"For question five, look at the picture. The shop sold some shirts and some skirts today. How many did it sell in all?",szh:"第五題，請看圖片。這家店今天賣了一些襯衫和一些裙子。它一共賣了多少件？",en:"It sold sixty in all.",zh:"圖中襯衫(shirt)40件、裙子(skirt)20件，加起來60件。70是襯衫加褲子(pants)，看錯了項目；40只算了襯衫，漏掉裙子。選 C"},
{n:6,p:1,o:["I'll bring some ham sandwiches.","We enjoyed it, but the wind was a little strong.","It's at the beach this Monday."],a:1,sen:"How was the picnic on Monday?",szh:"星期一(Monday)的野餐(picnic)怎麼樣？",en:"We enjoyed it, but the wind was a little strong.",zh:"問已經辦過的野餐(picnic)「怎麼樣」，答「我們玩得很開心(enjoy)，只是風(wind)有點大」正確。「我會帶火腿(ham)三明治」時態不對，野餐已經結束；「這個星期一在海邊」答的是時間地點，而且說成還沒辦。選 B"},
{n:7,p:1,o:["Class is more fun than I thought.","Great! I feel much better than yesterday, too.","Oh no. Stay in bed and drink lots of water."],a:2,sen:"I have the flu, so I can't come to class today.",szh:"我得了流感(flu)，所以今天不能來上課。",en:"Oh no. Stay in bed and drink lots of water.",zh:"對方說得了流感(flu)不能上課，回「糟了，好好躺著、多喝水」最自然。「太好了！我也比(than)昨天好(better)多了」對生病的人說「太好了」很奇怪，也是在講自己；「上課比我想的有趣(fun)」只是重複 class。選 C"},
{n:8,p:1,o:["It's a letter from the priest.","Mr. Wang, the chief of our office, will.","Please read it more slowly."],a:1,sen:"Who will read the letter aloud at the meeting?",szh:"誰會在會議上把信大聲(aloud)唸出來？",en:"Our team chief will do it.",zh:"問「誰」來唸，答「我們辦公室的主管(chief)王先生會唸」正確。「是牧師(priest)寫來的信」答的是信是誰寄的，不是誰唸；「請唸慢一點」是在要求別人，沒回答是誰。選 B"},
{n:9,p:1,o:["Yes, he cut my hair last week.","Your new hat is on the table.","Really? I think it looks nice on you."],a:2,sen:"I don't like my new haircut.",szh:"我不喜歡我新剪的頭髮(haircut)。",en:"Really? I think it looks nice on you.",zh:"對方說不喜歡新髮型(haircut)，回「真的嗎？我覺得你很好看(nice)」是在安慰，最自然。「是的，他(he)上週幫我剪頭髮(hair)」人物不對，講的是自己；「你的新帽子(hat)在桌上」只是重複 new。選 C"},
{n:10,p:1,o:["Much better. Sales increased by half.","It had a big loss two years ago.","I bought a few clothes there recently."],a:0,sen:"How's your clothes shop doing these days?",szh:"你的服飾(clothes)店最近生意如何？",en:"Much better. Sales increased by half.",zh:"問服飾店「最近」如何，答「好(better)多了，業績增加(increase)了一半(half)」正確。「兩年前虧損(loss)很大」時間不對，問的是最近；「我最近(recent)在那裡買了幾件(few)衣服」把自己當成客人，答非所問。選 A"},
{n:11,p:1,o:["Yes, I'll go there next Monday.","Not yet, but I'm curious about the view.","It opens at nine every day."],a:1,sen:"Have you ever been to the top of the old tower?",szh:"你去過那座老塔(tower)的頂端嗎？",en:"Not yet, but I'm curious about the view.",zh:"問「有沒有去過」，答「還沒，不過我對那裡的景色很好奇(curious)」正確。「有，我下星期一要去」Yes 和未來式自相矛盾；「每天九點開(open)」答的是時間。選 B"},
{n:12,p:1,o:["I washed it. It's drying outside in the wind.","He uses a handkerchief, too.","It's white, with a few blue flowers."],a:0,sen:"What did you do with my handkerchief?",szh:"你把我的手帕(handkerchief)怎麼了？",en:"I washed it. It's drying outside in the wind.",zh:"問你對手帕(handkerchief)「做了什麼」，答「我洗了，正在外面風(wind)裡晾乾」正確。「白色、有幾朵(few)藍花」描述的是手帕的樣子；「他也用手帕」答非所問。選 A"},
{n:13,p:1,o:["My hair is red, too.","Then wear a hat when you go out.","Yes, the sun is very red tonight."],a:1,sen:"My skin gets red very easily in the sun.",szh:"我的皮膚(skin)在太陽下很容易曬紅。",en:"Then wear a hat when you go out.",zh:"對方說皮膚(skin)容易曬紅，建議「那出門就戴頂帽子(hat)吧」最自然。「是的，今晚太陽很紅」重複 sun、red，而且晚上沒有太陽；「我的頭髮(hair)也是紅的」只是重複 red。選 B"},
{n:14,p:1,o:["We put it up near the shore.","Four, but three is more comfortable.","It's a big green tent."],a:1,sen:"What's the maximum number of people for this tent?",szh:"這頂帳篷(tent)最多(maximum)可以睡幾個人？",en:"Four, but three is more comfortable.",zh:"問帳篷(tent)最多(maximum)幾個人，答「四個，不過三個比較舒服」正確。「是一頂大的綠色帳篷」描述的是樣子；「我們把它搭在海岸(shore)邊」答的是地點。選 B"},
{n:15,p:1,o:["It's on a Monday, so we get a long weekend.","In front of the tall tower downtown.","We watched it on TV last year."],a:0,sen:"When is Double Tenth Day this year?",szh:"今年的國慶日(Double Tenth Day)是哪一天？",en:"It's on a Monday, so we get a long weekend.",zh:"問國慶日(Double Tenth Day)「什麼時候」，答「在星期一(Monday)，所以有連假」正確。「我們去年在電視上看」時態和內容都不對；「在市中心的高塔(tower)前面」答的是地點。選 A"},
{n:16,p:2,o:["He has short hair.","He is wearing a hat.","He has long hair."],a:0,sen:"W: Is that your brother in the photo, the one with long hair? &nbsp;M: No, that's my cousin. My brother is standing next to him. &nbsp;W: The one in the hat? &nbsp;M: No, the other one, with short hair. &nbsp;Q: What does the man's brother look like?",szh:"女：照片裡那個長頭髮(hair)的是你哥哥嗎？　男：不是，那是我表哥。我哥哥站在他(him)旁邊。　女：戴帽子(hat)那個？　男：不是，另一個(other)，短頭髮的。　問：男士的哥哥長什麼樣子？",en:"He has short hair.",zh:"女士猜了兩次都錯：長頭髮(hair)的是表哥，戴帽子(hat)的也不是，男士說是另一個(other)短頭髮的。長頭髮、戴帽子都是被男士否定的人。選 A"},
{n:17,p:2,o:["Give her the medium pair again.","Find her a smaller size.","Make the large pair shorter."],a:2,sen:"W: These trousers are too small. Do you have a bigger size? &nbsp;M: Those are a medium. Here's a large. &nbsp;W: Hmm, these fit, but now they're two inches too long. &nbsp;M: No problem. We can make them shorter for free. &nbsp;Q: What will the man do?",szh:"女：這件長褲(trousers)太小了。有大一點的尺寸(size)嗎？　男：那是中號，這件是大號。　女：嗯，這件合身，但現在長了兩吋(inch)。　男：沒問題，我們可以免費改短。　問：男士會做什麼？",en:"Make the large pair shorter.",zh:"中號太小，大號合身但長了兩吋(inch)，男士說可以免費改短，所以他會把大號褲子改短。中號已經試過太小；她要的是大一點的尺寸(size)，不是更小的。選 C"},
{n:18,p:2,o:["Four thousand five hundred dollars.","Two thousand five hundred dollars.","Two thousand dollars."],a:1,sen:"M: How much is this coat? &nbsp;W: It was four thousand dollars, but today all coats are half price. &nbsp;M: And this hat? &nbsp;W: Five hundred. Hats are not on sale. &nbsp;M: I'll take both. &nbsp;Q: How much will the man pay?",szh:"男：這件外套(coat)多少錢？　女：原價四千元，但今天所有外套都半(half)價。　男：那這頂帽子(hat)呢？　女：五百元，帽子沒有打折。　男：兩件我都要。　問：男士要付多少錢？",en:"Two thousand five hundred dollars.",zh:"外套(coat)四千元打半(half)價是兩千元，帽子(hat)五百元不打折，合計兩千五百元。兩千元只算了外套；四千五百元是忘了外套半價。選 B"},
{n:19,p:2,o:["He still has the flu.","He will come to the picnic.","He is back at work."],a:2,sen:"W: Is Tom still in bed with the flu? &nbsp;M: No, he's much better. He went back to work on Monday. &nbsp;W: Great. Is he coming to the picnic? &nbsp;M: He wants to, but he still feels a little weak. &nbsp;Q: What do we know about Tom?",szh:"女：Tom 還因為流感(flu)躺在床上嗎？　男：沒有，他好多了，星期一(Monday)回去上班了。　女：太好了。他會來野餐(picnic)嗎？　男：他想來，但他還覺得有點虛弱(weak)。　問：關於 Tom 我們知道什麼？",en:"He is back at work.",zh:"「He went back to work on Monday」換句話說就是「他已經回去上班了」。他好多了，不是還有流感(flu)；他想來野餐(picnic)，但還覺得虛弱(weak)，並沒有說會來。選 C"},
{n:20,p:2,o:["Planning a day outside.","Buying a very big tent.","Making ham sandwiches."],a:0,sen:"W: I'll make the ham sandwiches for Saturday. What else do we need? &nbsp;M: Besides the food, we need ice and drinks. I'll bring those. &nbsp;W: Good. Jack and Lily have a big tent, but it's very heavy. &nbsp;M: Then they can put it up themselves. We'll just sit and eat. &nbsp;W: And I'll bring a blanket. I can carry it on my shoulder. &nbsp;M: Perfect. The weather will be nice on Saturday. &nbsp;Q: What are the speakers doing?",szh:"女：星期六我來做火腿(ham)三明治。我們還需要什麼？　男：除了(besides)食物，我們還需要冰塊(ice)和飲料。那些我來帶。　女：好。Jack 和 Lily 有一頂大帳篷(tent)，但是很重(heavy)。　男：那他們可以自己(themselves)搭起來。我們只要坐著吃就好。　女：我還會帶一條毯子。我可以把它背在肩膀(shoulder)上。　男：太好了。星期六天氣會很好。　問：說話的人在做什麼？",en:"Planning a day outside.",zh:"兩人在分配星期六的工作：誰做三明治、誰帶冰塊和飲料、誰帶帳篷和毯子，還說天氣會很好，所以是在規劃一天的戶外野餐。帳篷是別人帶的，他們並沒有要買；三明治只是女士要準備的其中一項，現在是在討論，不是在做。選 A"},
{n:21,p:2,o:["The man should go shopping on Monday.","The man has only one shirt.","The man does not wear most of his shirts."],a:2,sen:"W: What's the point of buying more clothes? You never wear them. &nbsp;M: That's not true. I wear this shirt every Monday. &nbsp;W: One shirt out of twenty! &nbsp;Q: What does the woman mean?",szh:"女：再買衣服(clothes)有什麼意義(point)？你又從來不穿。　男：才不是，我每個星期一(Monday)都穿這件襯衫(shirt)。　女：二十件裡面才穿一件！　問：女士的意思是什麼？",en:"The man does not wear most of his shirts.",zh:"女士說「二十件裡才穿一件」，意思是他大部分的襯衫(shirt)都沒穿。他有二十件，不是只有一件；星期一(Monday)是他穿那件襯衫的日子，不是去買衣服的日子。選 C"},
{n:22,p:2,o:["Forty.","Fifty.","Ten."],a:0,sen:"M: Did you upload the photos from the fashion show? &nbsp;W: Most of them. I took fifty. &nbsp;M: All fifty? &nbsp;W: No. Ten of them weren't clear, so I didn't put those up. &nbsp;Q: How many photos did the woman upload?",szh:"男：你把服裝(fashion)秀的照片上傳(upload)了嗎？　女：大部分。我拍了五十張。　男：五十張全部？　女：不是，其中十張不清楚，那些我沒放上去。　問：女士上傳了幾張照片？",en:"Forty.",zh:"拍了五十張，扣掉十張不清楚沒上傳(upload)的，上傳了四十張。五十是拍的總數；十是沒上傳的張數。選 A"},
{n:23,p:2,o:["A loud music show.","A cold fish dinner.","A family party."],a:2,sen:"W: How was your cousin's wedding? &nbsp;M: The music was too loud, and the fish was cold. &nbsp;W: Oh no! That sounds terrible. &nbsp;M: Well, the priest had a great sense of humor. Everyone laughed a lot. &nbsp;W: So it was a good day after all? &nbsp;M: Yes. I'm happy I went. &nbsp;Q: What are the speakers talking about?",szh:"女：你表哥（姊）的婚禮怎麼樣？　男：音樂太吵，魚也是冷的。　女：糟了！聽起來很糟。　男：不過牧師(priest)很有幽默感(humor)。大家笑個不停。　女：所以整體來說還是美好的一天？　男：對，我很高興我去了。　問：說話的人在談什麼？",en:"A family party.",zh:"女士問表哥的婚禮，男士說了音樂、魚和牧師(priest)的幽默(humor)，全都是在聊他參加的那場家族喜事，也就是一場家人的聚會。音樂太吵、魚太冷只是婚禮上的小細節，不是兩人談話的主題。選 C"},
{n:24,p:2,o:["It looks great on him.","It needs more cutting.","It was cut too much."],a:2,sen:"W: Is that a new haircut? &nbsp;M: Yes! I got it yesterday. What do you think? &nbsp;W: Hmm. It's very short. &nbsp;M: Is that bad? &nbsp;W: It's fine. Hair grows fast, you know. Next time, tell him to cut less. &nbsp;Q: What does the woman think about the man's haircut?",szh:"女：那是新髮型(haircut)嗎？　男：對！我昨天剪的。妳覺得怎麼樣？　女：嗯。很短。　男：這樣不好嗎？　女：還可以。頭髮(hair)長得很快，你知道的。下次叫他少剪一點。　問：女子覺得男士的髮型怎麼樣？",en:"It was cut too much.",zh:"女士說「很短」，又說頭髮長得快、下次叫他少剪一點，言下之意是這次剪太多了。她沒有稱讚他好看；如果覺得剪得不夠，就不會叫他少剪。選 C"},
{n:25,p:2,o:["At six-thirty.","At six-fifteen.","At six forty-five."],a:1,sen:"W: The fashion show starts at seven. &nbsp;M: It takes half an hour to get there. &nbsp;W: And let's get there fifteen minutes early for good seats. &nbsp;Q: When should they leave?",szh:"女：服裝(fashion)秀七點開始。　男：到那裡要半(half)小時。　女：而且我們早十五分鐘到，才有好位子。　問：他們應該幾點出發？",en:"At six-fifteen.",zh:"要在六點四十五分到，再往前推半(half)小時路程，就是六點十五分出發。六點半是忘了提早十五分鐘；六點四十五分是應該「到達」的時間，不是出發時間。選 B"},
{n:26,p:3,pic:true,o:[BARS("Lost and Found",["Coats","Hats","Umbrella"],[50,80,20]),BARS("Lost and Found",["Coats","Hats","Umbrella"],[50,20,80]),BARS("Lost and Found",["Coats","Hats","Umbrella"],[80,20,50])],a:1,sen:"Our school's lost and found box is very full this winter. Most students guess that hats are lost the most. But there are more coats than hats in the box. And, believe it or not, there are even more umbrellas than coats. &nbsp;Q: Which chart shows the lost and found box?",szh:"我們學校的失物招領箱這個冬天很滿。大部分學生猜帽子(hat)最常被弄丟。但箱子裡的外套(coat)比帽子多。而且信不信由你，雨傘比(than)外套還要多。　問：哪張圖是失物招領箱的情形？",en:"Umbrellas most, coats second, hats fewest.",zh:"外套(coat)比帽子(hat)多，雨傘又比外套多，所以雨傘最多、外套第二、帽子最少。帽子最多的那張是學生們猜的；外套最多的那張漏聽了「雨傘比外套還多」。選 B"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27b'),PH('q27c')],a:2,sen:"My aunt has a small clothes shop. Last month was warm and sunny, so skirts sold the best. Then the wind got cold, and many people bought warm trousers. This week, it is very cold, and everyone wants a thick coat. So now coats are selling better than anything else in the shop. &nbsp;Q: What is selling the best this week?",szh:"我阿姨開了一家小服飾(clothes)店。上個月天氣溫暖晴朗，裙子(skirt)賣得最好。後來風(wind)變冷了，很多人買保暖的長褲(trousers)。這星期非常冷，大家都想要一件厚外套(coat)。所以現在外套比(than)店裡其他東西都賣得好。　問：這星期什麼賣得最好？",en:"Coats.",zh:"裙子(skirt)是上個月天氣溫暖時賣得最好的，長褲(trousers)是風(wind)剛變冷時大家買的，這兩個都是「以前」；這星期非常冷，大家都要厚外套(coat)，所以現在賣最好的是外套。 選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:1,sen:"Last Monday, our class had a picnic at the shore. We planned to eat inside a big tent, but the wind was too strong to put it up. Our teacher said we could eat on the bus, but that was no fun. In the end, we sat behind some big rocks on the beach and enjoyed our sandwiches there. &nbsp;Q: Where did the class eat?",szh:"上星期一(Monday)，我們班在海岸(shore)邊野餐(picnic)。我們原本打算在大帳篷(tent)裡吃，但風(wind)太大搭不起來。老師說可以在遊覽車上吃，但那樣一點也不好玩(fun)。最後我們坐在海灘上幾塊大石頭後面，享受(enjoy)我們的三明治。　問：全班在哪裡吃東西？",en:"Behind some big rocks on the beach.",zh:"帳篷(tent)因為風(wind)太大搭不起來；在車上吃太無趣(fun)，也沒採用；最後是坐在海灘大石頭後面吃。選 B"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29c'),PH('q29a')],a:0,sen:"Our town's first fashion show was a big affair, and it happened recently. The chief of the town office wanted to have it inside the town hall, but there wasn't enough room. Some people asked for the beach, but it was too windy. So the show was held in front of the old stone tower. People said many positive things about it. &nbsp;Q: Where was the fashion show?",szh:"我們鎮上第一場服裝(fashion)秀是一件大事(affair)，最近(recent)才辦。鎮公所的主管(chief)想在鎮公所裡面辦，但空間不夠。有些人想在海邊辦，但風太大。所以服裝秀在老石塔(tower)前舉行。大家給了很多正面的(positive)評價。　問：服裝秀在哪裡舉行？",en:"In front of the old stone tower.",zh:"鎮公所主管(chief)想辦在鎮公所裡，但空間不夠；海邊風太大也不行；最後在老石塔(tower)前舉行。選 A"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30b'),PH('q30c')],a:0,sen:"My grandpa cares a lot about his appearance. For my cousin's wedding, he wanted to wear his old blue suit, but it was too small. Grandma bought him a gray one, but he said the color made him look old. In the end, he wore my dad's black suit with a red tie. He looked excellent, just perfect. &nbsp;Q: What did Grandpa wear to the wedding?",szh:"我爺爺很在意自己的外表(appearance)。表哥的婚禮，他想穿他那套舊的藍色西裝，但太小了。奶奶幫他(him)買了一套灰色的，但他說這顏色讓他看起來很老。最後他穿了我爸爸的黑色西裝，打紅色領帶。他看起來好極了(excellent)，非常完美(perfect)。　問：爺爺穿什麼去參加婚禮？",en:"A black suit with a red tie.",zh:"藍色舊西裝太小；奶奶買的灰色西裝他嫌顯老；最後穿的是爸爸的黑色西裝配紅領帶。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 21 回　衣服與外表　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
