<style>

<script>
/* 圖形素材（第21回 衣服與外表） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/21/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const SHIRT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q1.jpg" alt="question 1 picture">`;
const COAT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q2.jpg" alt="question 2 picture">`;
const HAT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q3.jpg" alt="question 3 picture">`;
const SKIRT=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q4.jpg" alt="question 4 picture">`;
const PANTS=`<img class="pic-img p0img" src="gept-listening-img/21/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:SHIRT,o:["A blue coat with a hood.","A blue shirt with buttons.","A white skirt with pockets."],a:1,sen:"For question one, look at the picture. What clothes is this?",szh:"第一題，請看圖片。這是什麼衣服？",en:"A blue shirt with buttons.",zh:"圖中是有鈕扣(button)的藍襯衫(shirt)，選 B。coat 和 skirt 是別種衣服(clothes)，與圖不符。"},
{n:2,p:0,fig:COAT,o:["A hot cup of tea.","A thick blanket over his legs.","A heavy coat for the cold wind."],a:2,sen:"For question two, look at the picture. What keeps him warm?",szh:"第二題，請看圖片。什麼讓他保暖？",en:"A heavy coat for the cold wind.",zh:"一件厚重(heavy)的外套(coat)擋住冷風(wind)，選 C。熱茶和毯子雖然也保暖，但圖中他穿的是外套。"},
{n:3,p:0,fig:HAT,o:["A hat covers his hair after a haircut.","A towel covers his hair after swimming.","A scarf covers his hair in the wind."],a:0,sen:"For question three, look at the picture. What is on his head?",szh:"第三題，請看圖片。他頭上是什麼？",en:"A hat covers his hair after a haircut.",zh:"一頂帽子(hat)蓋住他剛剪髮(haircut)後的頭髮(hair)，選 A。毛巾和圍巾都不是他頭上的東西。"},
{n:4,p:0,fig:SKIRT,o:["A purple dress with long sleeves.","A purple skirt in the latest fashion.","A green skirt with a white belt."],a:1,sen:"For question four, look at the picture. What is she wearing?",szh:"第四題，請看圖片。她穿著什麼？",en:"A purple skirt in the latest fashion.",zh:"她穿的是一件紫色裙子(skirt)，是最新流行(fashion)，選 B。洋裝的顏色也是紫色，但不是裙子；綠色裙子顏色不對。"},
{n:5,p:0,fig:PANTS,o:["Blue pants, or trousers, in medium size.","Blue pants in a small size.","Blue pants in a large size."],a:0,sen:"For question five, look at the picture. What size are these?",szh:"第五題，請看圖片。這是什麼尺寸？",en:"Blue pants (trousers) in medium size.",zh:"藍色長褲(pants，也叫 trousers)是中等尺寸(size)，選 A。small 和 large 尺寸不對。"},

{n:6,p:1,o:["We took the bus to the park.","No, it's on Friday afternoon.","Yes, it was more fun than I thought."],a:2,sen:"Did you enjoy the outing yesterday?",szh:"你喜歡昨天的郊遊嗎？",en:"Yes, it was more fun than I thought.",zh:"問昨天的郊遊是否喜歡(enjoy)，答『比(than)我想的更有趣(fun)』，選 C。搭公車去公園沒回答喜不喜歡。"},
{n:7,p:1,o:["At the station near the bank.","Yes, one other point: wear warm shoes.","Because I was late again."],a:1,sen:"Is there anything else I should know?",szh:"還有什麼我該知道的嗎？",en:"Yes, one other point: wear warm shoes.",zh:"問還有什麼要知道，答『還有一(other)點(point)：穿保暖的鞋』，選 B。At the station 是回答 Where，Because 是回答 Why。"},
{n:8,p:1,o:["For about three or four days.","I caught the flu and feel weak.","Because the weather is so nice."],a:1,sen:"Why do you look so unwell today?",szh:"你今天怎麼看起來這麼不舒服？",en:"I caught the flu and feel weak.",zh:"問為何不舒服，答『我得了流感(flu)，覺得虛弱(weak)』，選 B。For about three days 回答的是 How long，不是原因。"},
{n:9,p:1,o:["Our priest wrote that poem.","No, the poem is on page six.","Yes, please read it aloud to everyone."],a:2,sen:"Should I say the poem out loud?",szh:"我該把這首詩大聲念出來嗎？",en:"Yes, please read it aloud to everyone.",zh:"問是否該大聲念，答『對，請大聲(aloud)念給大家聽』，選 C。priest 寫詩、第六頁都沒回答問題。"},
{n:10,p:1,o:["Yes, the loss increased by half.","The company has about fifty workers.","I read it in the newspaper."],a:0,sen:"Has the company's problem grown worse?",szh:"公司的問題有變嚴重嗎？",en:"Yes, the loss increased by half.",zh:"問公司問題是否變嚴重，答『是的，損失(loss)增加(increase)了一半(half)』，選 A。員工人數和看報紙都沒回答問題。"},
{n:11,p:1,o:["It took us about three weeks.","The design class is on Thursday.","Yes, it's better. Please upload it now."],a:2,sen:"Is the new design finished and good?",szh:"新設計完成得好嗎？",en:"Yes, it's better. Please upload it now.",zh:"問設計是否完成得好，答『是，更好(better)了，請現在上傳(upload)』，選 C。三週和設計課都沒回答。"},
{n:12,p:1,o:["I think it's on his shoulder.","The shop opens at nine.","It's a white one with flowers."],a:0,sen:"Where did you leave the handkerchief?",szh:"你把手帕放哪了？",en:"I think it's on his shoulder.",zh:"問手帕(handkerchief)放哪，答『我想在他的肩膀(shoulder)上』，選 A。White one 是描述外觀，不是地點；shop opens 是營業時間(open)。"},
{n:13,p:1,o:["The chief of police is on TV.","Because everyone likes the news.","It's a recent affair at the tower."],a:2,sen:"What is that news everyone is talking about?",szh:"大家在談的那則新聞是什麼？",en:"It's a recent affair at the tower.",zh:"問大家在談什麼新聞，答『是塔(tower)那邊最近(recent)發生的事(affair)』，選 C。chief of police 只是呼應 news 的聯想，沒回答內容。"},
{n:14,p:1,o:["The shop closes at nine tonight.","Because it's so cold outside.","He set the heater to the maximum."],a:2,sen:"Why is it so warm inside here?",szh:"這裡面為什麼這麼暖？",en:"He set the heater to the maximum.",zh:"問裡面為何暖，答『他(he)把暖氣調到最高(maximum)』，選 C。外面很冷無法解釋為什麼裡面暖。"},
{n:15,p:1,o:["It's on a Monday this year.","At the city hall downtown.","Almost a hundred people went."],a:0,sen:"When is Double Tenth Day this year?",szh:"今年的雙十節是什麼時候？",en:"It's on a Monday this year.",zh:"問雙十節(Double Tenth Day)是何時，答『今年是星期一(Monday)』，選 A。城市大廳是地點、一百人是人數，都不是時間。"},

{n:16,p:2,o:["A white shirt.","A heavy coat.","A funny hat."],a:0,sen:"W: I have a job interview today. I have black pants and a tie. &nbsp;M: Good appearance matters. You need something with buttons and a collar. &nbsp;W: Right, I'll find it. &nbsp;Q: What will she wear with the tie?",szh:"女：我今天有工作面試。我有黑色長褲和領帶。　男：外表(appearance)很重要。你需要有鈕扣和領子的衣服。　女：對，我去找找。　問：她會搭配領帶穿什麼？",en:"A white shirt.",zh:"女士有黑長褲(pants)和領帶，男士說需要有鈕扣(button)和領子的衣服，所以是襯衫(shirt)，選 A。外套和帽子不符合。"},
{n:17,p:2,o:["A light shirt.","A heavy coat.","Short pants."],a:1,sen:"M: We're going up the mountain this weekend. &nbsp;W: It will snow there, and the wind is cold. &nbsp;M: Okay, I'll take something thick. &nbsp;Q: What will the man take?",szh:"男：這個週末我們要上山。　女：那裡會下雪，而且風(wind)很冷。　男：好，我會帶厚一點的東西。　問：男士會帶什麼？",en:"A heavy coat.",zh:"山上會下雪又有冷風(wind)，所以他要帶厚的東西，也就是厚外套(coat)，選 B。薄襯衫(shirt)太單薄。"},
{n:18,p:2,o:["A new skirt.","A new raincoat.","Some old jeans."],a:0,sen:"W: What did your sister buy at the mall? &nbsp;M: A new skirt in the latest fashion. &nbsp;W: Stylish! &nbsp;Q: What did the sister buy?",szh:"女：你姊姊在商場買了什麼？　男：一件最新流行(fashion)的裙子(skirt)。　女：真時尚！　問：姊姊買了什麼？",en:"A new skirt.",zh:"姊姊買了最新流行(fashion)的新裙子(skirt)，選 A。雨衣和舊牛仔褲都不對。"},
{n:19,p:2,o:["He bought a new hat.","He changed his glasses.","He cut his hair short."],a:2,sen:"M: Your brother looks so different today. &nbsp;W: He went to the barber yesterday. Now his hair is only an inch long. &nbsp;M: Wow, it's really short! &nbsp;Q: Why does the brother look different?",szh:"男：你弟弟今天看起來好不一樣。　女：他昨天去理髮師那裡。現在他的頭髮(hair)只有一吋(inch)長。　男：哇，真的好短！　問：弟弟為什麼看起來不同？",en:"He cut his hair short.",zh:"弟弟昨天去理髮，頭髮(hair)只剩一吋(inch)長，所以是剪短了頭髮(haircut)，選 C。帽子與眼鏡都沒提到。"},
{n:20,p:2,o:["A different color.","A smaller size.","A lower price."],a:1,sen:"W: This shirt feels loose, and my shoulders look small in it. &nbsp;M: I think so too. It doesn't fit you well. &nbsp;W: Okay, I'll go ask the clerk. &nbsp;Q: What will she ask for?",szh:"女：這件襯衫(shirt)穿起來很鬆，我的肩膀(shoulder)在裡面看起來很小。　男：我也這麼覺得。它不太合你。　女：好，我去問店員。　問：她會要求什麼？",en:"A smaller size.",zh:"襯衫(shirt)太鬆、肩膀(shoulder)顯得小，所以她要請店員換小一點的尺寸(size)，選 B。顏色和價格都沒被提到。"},
{n:21,p:2,o:["A small tent.","Ham sandwiches.","A story book."],a:1,sen:"M: What should we pack for the trip? &nbsp;W: Ham sandwiches for the picnic by the lake. &nbsp;M: Yummy. &nbsp;Q: What should they pack?",szh:"男：這趟旅行我們該打包什麼？　女：野餐(picnic)用的火腿(ham)三明治。　男：好吃。　問：他們該打包什麼？",en:"Ham sandwiches.",zh:"要為湖邊野餐(picnic)帶火腿(ham)三明治，選 B。帳篷(tent)和書沒被提到。"},
{n:22,p:2,o:["He has the flu.","He hurt his leg.","He has a toothache."],a:0,sen:"W: Why isn't your father at the picnic with us? &nbsp;M: He has a high fever and a bad cough. He can hardly stand up. &nbsp;W: Oh, poor man. &nbsp;Q: What is wrong with the father?",szh:"女：你爸爸為什麼沒跟我們一起來野餐(picnic)？　男：他發高燒又咳嗽得很厲害，幾乎站不起來。　女：噢，可憐的人。　問：爸爸怎麼了？",en:"He has the flu.",zh:"爸爸發高燒、咳嗽、幾乎站不起來，這是流感(flu)的症狀，選 A。腿受傷和牙痛都沒有線索。"},
{n:23,p:2,o:["Too old.","Very nice.","A little boring."],a:1,sen:"M: How does my new outfit look? &nbsp;W: Very nice and in good fashion, really. &nbsp;M: Thank you! &nbsp;Q: How does the outfit look?",szh:"男：我的新裝扮如何？　女：真的很好看(nice)，很時尚(fashion)。　男：謝謝！　問：這身裝扮如何？",en:"Very nice.",zh:"女士說裝扮很好看(nice)又時尚(fashion)，選 B。老氣和無聊與讚美相反。"},
{n:24,p:2,o:["He washed them.","He sewed on a button.","He made them shorter."],a:2,sen:"W: You went to the tailor this morning. What did he do? &nbsp;M: My trousers were too long. He took off two inches. &nbsp;W: Now they fit. &nbsp;Q: What did the tailor do to the pants?",szh:"女：你今天早上去找裁縫。他做了什麼？　男：我的長褲(trousers)太長了。他剪掉了兩吋(inches)。　女：現在合身了。　問：裁縫對長褲(pants)做了什麼？",en:"He made them shorter.",zh:"褲子(trousers)太長，裁縫剪掉兩吋(inch)，也就是把長褲(pants)改短，選 C。縫鈕扣(button)沒有被提到。"},
{n:25,p:2,o:["She is upset.","She loves it.","She wants a change."],a:1,sen:"M: You were unhappy with your last haircut. &nbsp;W: Yes, but this barber is excellent. I keep looking in the mirror! &nbsp;M: I can see why. &nbsp;Q: How does the woman feel about her haircut?",szh:"男：你上次的髮型(haircut)你不滿意。　女：對，不過這位理髮師很棒(excellent)。我一直照鏡子！　男：我懂為什麼。　問：女士對她的髮型感覺如何？",en:"She loves it.",zh:"女士說新理髮師很棒(excellent)，一直照鏡子，可知她很喜歡新髮型(haircut)，選 B。upset 和想再改變都與語氣不符。"},

{n:26,p:3,pic:true,o:[BARS("Clothes Sold",["Shirt","Coat","Hat"],[80,50,20]),BARS("Clothes Sold",["Shirt","Coat","Hat"],[20,50,80]),BARS("Clothes Sold",["Shirt","Coat","Hat"],[50,80,20])],a:0,sen:"Our clothes shop counted its sales this winter. Shirts sold the most, because everyone needs them all year. Coats were in the middle, and hats sold the fewest. So the shirt bar should be the tallest. &nbsp;Q: Which chart shows the clothes sold?",szh:"我們服飾店統計今冬銷量。襯衫(shirt)賣最多，因為一年到頭都需要；外套(coat)中等；帽子(hat)最少。所以襯衫長條最高。　問：哪張圖顯示衣服(clothes)銷量？",en:"Shirts most, hats least.",zh:"襯衫(shirt)賣最多、帽子(hat)最少，符合『襯衫長條最高』的圖，選 A。外套(coat)排中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Shop Loss",["Jan","Feb","Mar"],[55,80,30]),BARS("Shop Loss",["Jan","Feb","Mar"],[30,55,80]),BARS("Shop Loss",["Jan","Feb","Mar"],[80,55,30])],a:2,sen:"The fashion shop looked at its loss over three months. In January the loss was the biggest, because few people came. Besides, it was a cold month. In February it was in the middle, and by March it had dropped to the smallest, a positive sign. So the loss went down each month. &nbsp;Q: Which chart shows the shop's loss?",szh:"這家流行(fashion)服飾店檢視三個月的損失(loss)。一月損失最大，因為客人少，而且(besides)天氣又冷；二月中等；到三月降到最小，是正面(positive)的訊號。所以損失逐月下降。　問：哪張圖顯示店的損失？",en:"Jan biggest, Mar smallest.",zh:"一月損失最大、逐月下降，符合『一月最高、三月最低』的圖，選 C。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:2,sen:"For our class picnic on a windy Monday, we put up a tent on the shore. It was too cold to cook noodles or steam rice, and nobody even wanted ice cream. So each student brought a simple ham and bread sandwich, and we ate together, enjoying the fresh sea air. &nbsp;Q: What did the students eat at the picnic?",szh:"在有風(wind)的星期一(Monday)班級野餐(picnic)，我們在岸邊(shore)搭了帳篷(tent)。天氣太冷不能煮麵或蒸飯，大家連冰淇淋(ice cream)都不想吃。所以每位學生帶了簡單的火腿(ham)麵包三明治，一起享受(enjoy)新鮮海風。　問：學生野餐吃什麼？",en:"Ham and bread sandwich.",zh:"學生吃麵包(bread)火腿三明治，選 C。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('noodles'),IMG('rice'),IMG('bread')],a:0,sen:"On Double Tenth Day, my grandmother invited the whole family to celebrate. She has a great sense of humor, and she said the special day deserved more than plain bread or dry rice. Instead, she cooked a huge bowl of hot noodles, and we all enjoyed it, dressed in our nicest clothes. The kids even served themselves twice. &nbsp;Q: What did grandmother cook for the celebration?",szh:"雙十節(Double Tenth Day)時，奶奶邀全家慶祝。她很有幽默感(humor)，說這特別的日子值得比普通麵包或白飯更好的，於是煮了一大碗熱麵(noodles)，我們穿著最好看的衣服(clothes)一起享用。孩子們甚至自己(themselves)添了兩次。　問：奶奶為慶祝煮了什麼？",en:"A bowl of noodles.",zh:"奶奶煮了熱麵(noodles)，選 A。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('park'),IMG('beach'),IMG('mountain')],a:1,sen:"Our fashion club planned a photo trip to show off our new clothes. One member liked the mountain and another was curious about the park. But we chose the beach, because the bright sun and the shore made a perfect background for photos of our summer outfits. We also put cream on our skin. &nbsp;Q: Where did the club go for the photo trip?",szh:"我們的流行(fashion)社計畫一趟拍照之旅來展示新衣服(clothes)。一位成員喜歡山，另一位對公園很好奇(curious)，但我們選了海邊(beach)，因為明亮的陽光和岸邊(shore)是拍夏季裝扮最完美(perfect)的背景。我們也在皮膚(skin)上擦了乳液。　問：社團去哪裡拍照？",en:"The beach.",zh:"社團去海邊(beach)拍照，選 B。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 21 回　衣服與外表　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
