    letter-spacing:.02em;
  }

  .round-tabs{
    display:grid;
    grid-template-columns:repeat(20, 1fr);
    gap:4px;
  }
  .round-tab{
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    font-family:"IBM Plex Mono",monospace;
    font-weight:500;

    cursor:pointer;

  .round-tab.active{

  .controls{

    font-size:14px;
    width:100%;

  .search input::placeholder{ color:var(--ink-faint); }
  .search svg{ flex:none; opacity:.6; }

    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);

    align-items:center;

  .hide-toggle.active{

    height:6px;

    background:var(--gold);

    font-size:11.5px;
    color:var(--ink-faint);

    flex-direction:column;
    gap:6px;
  }
  .word-row{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
    box-shadow:var(--shadow);

    border:none;
    background:transparent;
    font-size:17px;
    line-height:1;
    cursor:pointer;
    flex:none;
    width:24px;
    color:var(--ink-faint);

    background:transparent;
    font-size:14px;
    line-height:1;
    cursor:pointer;

    justify-content:center;

    display:flex;
    align-items:baseline;
    gap:8px;
    min-width:0;
    flex:1 1 160px;
  }

    font-family:"Manrope",sans-serif;

    font-size:15.5px;

    background:var(--surface-soft);

    border-radius:5px;

    flex:1 1 120px;
    min-width:0;
    text-align:right;
  }
  .meaning{
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    display:inline-block;
  }
  .meaning.hidden-mode{

    background:var(--surface-soft);
    border-radius:5px;
    padding:1px 8px;
  }
  .meaning.hidden-mode.revealed{
    color:var(--ink-soft);
    background:transparent;
    padding:0;
  }

    color:var(--ink-faint);
    font-size:13.5px;

  const STORAGE_KEY = "clozeVocabKnown";
  let known = {};
  try{ known = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){ known = {}; }
  function saveKnown(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(known)); }catch(e){}
  }

  function speechText(en){
    return en
      .replace(/sb\.?/g, "somebody")
      .replace(/sth\.?/g, "something")
      .replace(/\+\s*V-ing/gi, "doing something")
      .replace(/\+\s*比較級/g, "")
      .replace(/…/g, "")
      .trim();
  }
  function fallbackSpeak(en, btn){
    try{
      if(!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(speechText(en));
      u.lang = "en-US";
      u.rate = 0.95;
      if(btn){
        u.onend = () => btn.classList.remove("playing");
        u.onerror = () => btn.classList.remove("playing");
      }
      window.speechSynthesis.speak(u);
    }catch(e){ if(btn) btn.classList.remove("playing"); }
  }
  let currentAudio = null;
  function speak(en, btn){
    if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; }
    if(btn) btn.classList.add("playing");
    const id = AUDIO_MAP[en];
    if(!id){ fallbackSpeak(en, btn); return; }
    const audio = new Audio(`tongce-cloze-vocab-audio/${id}.mp3`);
    currentAudio = audio;
    audio.addEventListener("ended", () => { if(btn) btn.classList.remove("playing"); });
    audio.addEventListener("error", () => { if(btn) btn.classList.remove("playing"); fallbackSpeak(en, btn); });
    audio.play().catch(() => { if(btn) btn.classList.remove("playing"); fallbackSpeak(en, btn); });
  }

  let currentRound = "1";
  let hideMode = false;
  let query = "";

  const roundTabsEl = document.getElementById("roundTabs");
  const roundLabelEl = document.getElementById("roundLabel");
  const contentEl = document.getElementById("content");
  const statText = document.getElementById("statText");
  const knownText = document.getElementById("knownText");
  const barFill = document.getElementById("barFill");
  const hideToggle = document.getElementById("hideToggle");
  const searchInput = document.getElementById("searchInput");

  Object.keys(DATA).forEach(rk => {
    const btn = document.createElement("button");
    btn.className = "round-tab" + (rk === currentRound ? " active" : "");
    btn.textContent = rk;
    btn.setAttribute("aria-label", DATA[rk].label);
    btn.dataset.round = rk;
    btn.addEventListener("click", () => {
      currentRound = rk;
      [...roundTabsEl.children].forEach(c => c.classList.toggle("active", c.dataset.round === rk));
      roundLabelEl.textContent = DATA[rk].label;
      render();
    });
    roundTabsEl.appendChild(btn);
  });

  hideToggle.addEventListener("click", () => {
    hideMode = !hideMode;
    hideToggle.classList.toggle("active", hideMode);
    hideToggle.innerHTML = hideMode ? "🙈 顯示中文" : "👁️ 隱藏中文";
    render();
  });

  searchInput.addEventListener("input", (e) => {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  function matches(word){
    if(!query) return true;
    const [en, pos, zh] = word;
    return en.toLowerCase().includes(query) || zh.includes(query);
  }

  function render(){
    const roundData = DATA[currentRound];
    contentEl.innerHTML = "";

    let totalWords = 0, totalKnown = 0, shown = 0;

    roundData.passages.forEach((passage, pIdx) => {
      const filtered = passage.words.filter(matches);
      totalWords += passage.words.length;
      passage.words.forEach(w => {
        const key = `r${currentRound}-${w[0]}`;
        if(known[key]) totalKnown++;
      });
      if(filtered.length === 0) return;
      shown += filtered.length;

      const section = document.createElement("div");
      section.className = "passage";
      section.innerHTML = `
        <div class="passage-head">
          <span class="passage-title">${passage.title}</span>
          <span class="passage-count">${filtered.length} / ${passage.words.length} 字</span>
        </div>
        <div class="word-list"></div>
      `;
      const list = section.querySelector(".word-list");

      filtered.forEach(w => {
        const [en, pos, zh] = w;
        const key = `r${currentRound}-${en}`;
        const isKnown = !!known[key];

        const row = document.createElement("div");
        row.className = "word-row" + (isKnown ? " known" : "");
        row.innerHTML = `
          <button class="star-btn" type="button" aria-label="標記已熟悉">${isKnown ? "⭐" : "☆"}</button>
          <div class="word-main">
            <span class="word-en">${en}</span>
            <span class="pos">${pos}</span>
            <button class="speak-btn" type="button" aria-label="播放發音">🔊</button>
          </div>
          <div class="meaning-wrap">
            <span class="meaning${hideMode ? " hidden-mode" : ""}">${zh}</span>
          </div>
        `;

        row.querySelector(".star-btn").addEventListener("click", () => {
          known[key] = !known[key];
          saveKnown();
          render();
        });

        const speakBtn = row.querySelector(".speak-btn");
        speakBtn.addEventListener("click", () => speak(en, speakBtn));

        if(hideMode){
          const meaningEl = row.querySelector(".meaning");
          meaningEl.addEventListener("click", () => {
            meaningEl.classList.toggle("revealed");
          });
        }

        list.appendChild(row);
      });

      contentEl.appendChild(section);
    });

    if(shown === 0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "找不到符合的單字";
      contentEl.appendChild(empty);
    }

    statText.textContent = `${shown} / ${totalWords} 字`;
    knownText.textContent = `已熟悉 ${totalKnown}`;
    barFill.style.width = totalWords ? `${Math.round(totalKnown / totalWords * 100)}%` : "0%";
  }

  render();
</script>
