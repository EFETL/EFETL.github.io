<script>
/* 圖形素材（第27回 金錢與付款） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/27/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const BANK=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q1.jpg?v=2" alt="question 1 picture">`;
const COINS=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q2.jpg" alt="question 2 picture">`;
const BILL=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q3.jpg" alt="question 3 picture">`;
const TSHIRT=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q4.jpg" alt="question 4 picture">`;
const PINEAPPLE=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q1.jpg?v=2" alt="question 1 picture">`,o:["A farm where cows eat fresh grass.","A bank where people keep money safe.","A hospital where doctors help sick people."],a:1,sen:"For question one, look at the picture. What building is this?",szh:"第一題，請看圖片。這是什麼建築？",en:"It is a bank where people keep money safe.",zh:"選 B。這是一棟有石柱的莊嚴建築，像銀行（bank），人們在這裡把錢（money）存放安全；它不是農場（farm）或醫院（hospital）。"},
{n:2,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q2.jpg" alt="question 2 picture">`,o:["Coins and cash, ready to pay the bill.","Plates full of food, ready for dinner.","Keys and a phone, ready to go out."],a:0,sen:"For question two, look at the picture. What is on the table?",szh:"第二題，請看圖片。桌上是什麼？",en:"Coins and cash are on the table, ready to pay the bill.",zh:"選 A。桌上有硬幣（coins）和鈔票（cash），準備好要付帳單（bill）；盤子（plates）是空的，沒有食物，也沒有鑰匙（keys）和手機（phone）。"},
{n:3,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q3.jpg" alt="question 3 picture">`,o:["A ticket shows the seat and the time.","A map shows the street and the park.","A bill shows the cost and the fee."],a:2,sen:"For question three, look at the picture. What shows the cost?",szh:"第三題，請看圖片。什麼顯示花費？",en:"A bill shows the cost and the fee.",zh:"帳單(bill)顯示花費(cost)和費用(fee)，選 C。車票顯示座位和時間，地圖顯示街道，都不是花費。"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q4.jpg" alt="question 4 picture">`,o:["A green T-shirt and a short skirt.","A green T-shirt and blue jeans.","A red T-shirt and blue jeans."],a:1,sen:"For question four, look at the picture. What clothes are these?",szh:"第四題，請看圖片。這是什麼衣服？",en:"A green T-shirt and blue jeans.",zh:"穿的是綠色(green)T恤(T-shirt)和藍色牛仔褲(jeans)，選 B。A 的下半身不對，C 的上衣顏色不對。"},
{n:5,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q5.jpg" alt="question 5 picture">`,o:["A mango, a common fruit at the market.","A pineapple, a common fruit at the market.","A banana, a common fruit at the market."],a:1,sen:"For question five, look at the picture. What fruit is this?",szh:"第五題，請看圖片。這是什麼水果？",en:"A pineapple, a common fruit at the market.",zh:"這是鳳梨(pineapple)，市場上常見(common)的水果，選 B。芒果和香蕉也是水果，但不是圖中的這種。"},

{n:6,p:1,o:["It starts at eight every morning.","My old job was at a restaurant.","Yes, this job's income is good."],a:2,sen:"Does your new job pay well?",szh:"你的新工作薪水好嗎？",en:"Yes, this job's income is good.",zh:"問新工作薪水好不好，答『好，這份工作(job)的收入(income)不錯』，選 C。A 說的是上班時間，B 說的是舊工作。"},
{n:7,p:1,o:["It's sore after the fight.","I'll give you a piece of cake.","At the end of the street."],a:0,sen:"Why are you holding your hand?",szh:"你為什麼扶著手？",en:"It's sore after the fight.",zh:"問為什麼扶著手，答『打架(fight)後它很痠痛(sore)』，選 A。B 是在給蛋糕(cake)，C 回答地點，都沒有回答原因。"},
{n:8,p:1,o:["They arrive by bus at noon.","Wear the uniform and follow orders.","The camp is in the western hills."],a:1,sen:"What must new soldiers do at the camp?",szh:"新兵到營地必須做什麼？",en:"Wear the uniform and follow orders.",zh:"問新兵要做什麼，答『穿制服(uniform)並服從(follow)命令』，選 B。A 回答抵達方式(arrive)，C 只描述營地大門。"},
{n:9,p:1,o:["Every day until nine o'clock.","Because knowledge is my goal.","My teacher says never to cheat."],a:1,sen:"Why do you work so hard at school?",szh:"你為什麼在學校這麼用功？",en:"Because knowledge is my goal.",zh:"問為什麼這麼用功，答『因為知識(knowledge)是我的目標(goal)』，選 B。A 回答的是時間，C 用 Yes 回答 Why 問句。"},
{n:10,p:1,o:["It's right next to the bank.","I work from Monday to Friday.","My duty is to bring the ketchup."],a:2,sen:"What is your job at the restaurant?",szh:"你在餐廳的工作是什麼？",en:"My duty is to bring the ketchup.",zh:"問餐廳的工作內容，答『我的職責(duty)是把番茄醬(ketchup)送上桌』，選 C。A 說地點、B 說上班日，都沒有說明工作內容。"},
{n:11,p:1,o:["I bought it for fifty dollars.","Only half a liter is left.","The empty bottle is in the bag."],a:1,sen:"How much water is left in the bottle?",szh:"瓶子裡還剩多少水？",en:"Only half a liter is left.",zh:"問瓶中還剩多少水，答『只剩半公升(liter)』，選 B。A 回答價錢(fifty)，C 只說空(empty)瓶在哪裡。"},
{n:12,p:1,o:["Try the bank in the central district.","It's about fifteen thousand dollars.","I like the style of that house."],a:0,sen:"Where can I borrow money for a house?",szh:"我要去哪借買房子的錢？",en:"Try the bank in the central district.",zh:"問去哪借錢買房，答『試試市中心(central)的銀行』，選 A。B 回答金額(fifteen)，C 重複 house 但離題。"},
{n:13,p:1,o:["The map is in the green folder.","I'll answer you at eleven.","Solve it with your geography textbook."],a:2,sen:"How can I understand this map problem?",szh:"我要怎麼看懂這個地圖問題？",en:"Solve it with your geography textbook.",zh:"問怎麼看懂地圖問題，答『用你的地理(geography)課本(textbook)來解決(solve)』，選 C。A 說地圖在哪，B 約時間(eleven)，都沒有給方法。"},
{n:14,p:1,o:["Because he got a big bone.","We always run in the park.","He is a very gentle dog."],a:0,sen:"Why is the dog so excited today?",szh:"這隻狗今天為什麼這麼興奮？",en:"Because he got a big bone.",zh:"問狗為什麼興奮，答『因為他得到一根大骨頭(bone)』，選 A。B 回答地點，C 形容狗溫和(gentle)，都不是原因。"},
{n:15,p:1,o:["The winner scored fifty points.","Eleven students joined, including me.","It starts at nine tomorrow."],a:0,sen:"What were the top scores in the contest?",szh:"比賽的最高分是多少？",en:"The winner scored fifty points.",zh:"問比賽最高分，答『優勝者(winner)得了五十(fifty)分』，選 A。B 說參加人數(包括(including)我)，C 說開始時間。"},

{n:16,p:2,o:["To a car shop.","To the market.","To the bank."],a:2,sen:"W: Where is Dad going with that big bag? &nbsp;M: He has too much cash at home. He wants a safe place for it. &nbsp;W: Does he want to buy a car? &nbsp;M: No. He just wants to open an account. &nbsp;Q: Where is Dad going?",szh:"女：爸爸拿著那個大袋子要去哪？　男：他家裡現金(cash)太多，想找個安全(safe)的地方放。　女：他想買車嗎？　男：不是。他只是想開個帳戶。　問：爸爸要去哪裡？",en:"To the bank.",zh:"現金太多、要找安全的地方放、開帳戶，是去銀行(bank)，選 C。女士問買車，但男士說不是，所以 A 不對。"},
{n:17,p:2,o:["By card.","By phone.","With cash."],a:2,sen:"M: The dinner was forty dollars. Will you pay by card? &nbsp;W: I left it at home. But I have some paper money in my wallet. &nbsp;M: Okay. I'll wait. &nbsp;Q: How will the woman pay?",szh:"男：晚餐四十元。你要刷卡嗎？　女：我把卡忘在家了，但我皮夾裡有一些紙鈔。　男：好，我等你。　問：女士要怎麼付錢？",en:"With cash.",zh:"她沒帶卡、皮夾裡有紙鈔，所以用現金(cash)付(pay)，選 C。男士問的是刷卡，但她把卡忘在家。"},
{n:18,p:2,o:["A small charge.","It is free.","It is very expensive."],a:0,sen:"W: How much does the parking cost? &nbsp;M: There is a small charge, just a few coins. &nbsp;W: That's cheap. &nbsp;Q: How much does the parking cost?",szh:"女：停車費多少？　男：只收一點費用(charge)，幾個硬幣(coin)而已。　女：真便宜。　問：停車要多少錢？",en:"A small charge, a few coins.",zh:"只收一點費用(charge)，幾個硬幣(coin)而已，選 A。男士沒有說免費，也沒有說很貴。"},
{n:19,p:2,o:["A T-shirt and jeans.","A skirt and boots.","A suit and tie."],a:0,sen:"M: What will you wear to the picnic? &nbsp;W: A comfortable green T-shirt and my old jeans. &nbsp;M: Sounds relaxed. &nbsp;Q: What will the woman wear?",szh:"男：野餐你要穿什麼？　女：舒服的綠色(green)T恤(T-shirt)和舊牛仔褲(jeans)。　男：聽起來很輕鬆。　問：女士要穿什麼？",en:"A green T-shirt and jeans.",zh:"女士要穿綠色(green)T恤(T-shirt)和舊牛仔褲(jeans)，選 A。去野餐不會穿西裝。"},
{n:20,p:2,o:["Water and bread.","A cola and pineapple.","Tea and a cake."],a:1,sen:"W: What did you order at the snack bar? &nbsp;M: A cold cola and a fresh slice of pineapple. &nbsp;W: Refreshing. &nbsp;Q: What did the man order?",szh:"女：你在小吃攤點了什麼？　男：一杯冰可樂(cola)和一片新鮮鳳梨(pineapple)。　女：真消暑。　問：男士點了什麼？",en:"A cola and a slice of pineapple.",zh:"男士點了可樂(cola)和一片鳳梨(pineapple)，選 B。其他飲料和點心對話中都沒提到。"},
{n:21,p:2,o:["A teacher.","A banker.","A farmer."],a:1,sen:"M: What does your aunt do? &nbsp;W: She sits at a desk all day and helps people with their accounts and loans. &nbsp;M: Does she like it? &nbsp;W: Yes, and her income is good. &nbsp;Q: What is the aunt's job?",szh:"男：你阿姨做什麼工作？　女：她整天坐在桌前，幫人處理帳戶和貸款。　男：她喜歡嗎？　女：喜歡，而且她的收入(income)很好。　問：阿姨的工作是什麼？",en:"A banker.",zh:"整天幫人處理帳戶和貸款，是銀行員(banker)，選 B。對話裡的 desk 容易讓人想到老師，但工作內容是帳戶與貸款。"},
{n:22,p:2,o:["Her jeans.","Her party dress.","A uniform."],a:2,sen:"W: What should I wear to school tomorrow? &nbsp;M: Everyone wears the same clothes, so you will look like all the others. &nbsp;W: Even the shoes? &nbsp;M: Yes. It is a school rule. &nbsp;Q: What will the girl wear?",szh:"女：我明天上學要穿什麼？　男：大家都穿一樣的衣服，所以你會和所有人看起來一樣。　女：連鞋子也是嗎？　男：是的，這是學校的規定。　問：女孩明天要穿什麼？",en:"A uniform.",zh:"大家穿一樣的衣服、是學校規定，就是制服(uniform)，選 C。她問要穿什麼，但不是自己選牛仔褲或洋裝。"},
{n:23,p:2,o:["A history book.","A math book.","A geography book."],a:2,sen:"M: Which book do you need for tomorrow? &nbsp;W: The one with maps of Asia and Europe. We have a test on rivers and mountains. &nbsp;M: I will bring mine too. &nbsp;Q: Which book does the woman need?",szh:"男：你明天需要哪本書？　女：有亞洲和歐洲地圖的那本。我們要考河流和山脈。　男：我也會帶我的。　問：女士需要哪本書？",en:"A geography book.",zh:"有地圖、考河流和山脈，是地理(geography)課本，選 C。history 也會用到地圖，但考試內容是河流與山，屬於地理。"},
{n:24,p:2,o:["It is lost.","It is safe.","It is free."],a:1,sen:"W: I am afraid someone will take my money. &nbsp;M: Do not worry. We provide guards, cameras, and strong doors. &nbsp;W: So nobody can take it? &nbsp;M: Right. &nbsp;Q: What does the man say about the money?",szh:"女：我擔心有人會拿走我的錢。　男：別擔心。我們提供(provide)警衛、攝影機和堅固的門。　女：所以沒有人拿得走？　男：沒錯。　問：男士怎麼說這筆錢？",en:"It is safe.",zh:"有警衛、攝影機、堅固的門，沒有人拿得走，代表錢很安全(safe)，選 B。女士擔心的是被拿走，但男士說不會。"},
{n:25,p:2,o:["Her coach.","The winner.","The captain."],a:1,sen:"M: Who got the gold medal? &nbsp;W: The winner, who finally reached her goal. &nbsp;M: She worked hard. &nbsp;Q: Who got the gold medal?",szh:"男：誰拿到金牌？　女：優勝者(winner)，她終於達成目標(goal)。　男：她很努力。　問：誰拿到金牌？",en:"The winner who reached her goal.",zh:"拿到金牌的是達成目標(goal)的優勝者(winner)，選 B。教練和隊長只是旁邊的人。"},

{n:26,p:3,pic:true,o:[BARS("Ways to Pay",["Cash","Card","Coin"],[80,50,20]),BARS("Ways to Pay",["Cash","Card","Coin"],[20,50,80]),BARS("Ways to Pay",["Cash","Card","Coin"],[50,80,20])],a:0,sen:"Our shop counted how customers pay. Most people pay in cash, because it feels simple and safe. Paying by card was in the middle, and paying with coins was the least common. So the cash bar should be the tallest. &nbsp;Q: Which chart shows how customers pay?",szh:"我們店統計顧客怎麼付款。多數人付(pay)現金(cash)，因為簡單又安全；刷卡中等；用硬幣(coin)最少見。所以現金長條最高。　問：哪張圖顯示付款方式？",en:"Cash most, coin least.",zh:"現金最多、硬幣最少，所以最高的長條是 Cash，選 A。"},
{n:27,p:3,pic:true,o:[BARS("Monthly Income",["Jan","Feb","Mar"],[30,55,80]),BARS("Monthly Income",["Jan","Feb","Mar"],[55,80,30]),BARS("Monthly Income",["Jan","Feb","Mar"],[80,55,30])],a:2,sen:"A small shop wrote down its income over three months. In January the income was the highest, thanks to the New Year sale. In February it was in the middle, and by March the lowest, because fewer people came. So the income went down each month. &nbsp;Q: Which chart shows the shop's income?",szh:"一家小店記下三個月的收入(income)。一月最高，因為新年特賣；二月中等；到三月最低，因為客人變少。所以收入逐月下降。　問：哪張圖顯示店的收入？",en:"Jan highest, Mar lowest.",zh:"一月最高、逐月下降，符合『Jan 最高、Mar 最低』，選 C。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('noodles'),IMG('bread')],a:2,
 sen:"After a busy day counting money at the bank, the workers had little cash and less time. They could not pay for a big meal of noodles or rice at a restaurant. So each of them simply bought a cheap loaf of bread and shared it in the office. &nbsp;Q: What did the bank workers eat?",

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 27 回　金錢與付款　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
