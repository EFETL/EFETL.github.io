<div class="bar">
 <b>🖨 第 27 回　金錢與付款　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>
 <button class="t tonly" onclick="show('t')">只印教師卷</button>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第27回 金錢與付款） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/27/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/27/p3_${n}.jpg?v=r27qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const BANK=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q1.jpg?v=2" alt="question 1 picture">`;
const COINS=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q2.jpg" alt="question 2 picture">`;
const BILL=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q3.jpg" alt="question 3 picture">`;
const TSHIRT=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q4.jpg" alt="question 4 picture">`;
const PINEAPPLE=`<img class="pic-img p0img" src="gept-listening-img/27/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q1.jpg?v=2" alt="question 1 picture">`,o:["A man is getting cash from the machine on the wall.","Three people are walking into the bank.","Three people are walking out of the bank."],a:1,sen:"For question one, look at the picture. What are the people doing?",szh:"第一題，請看圖片。這些人在做什麼？",en:"Three people are walking into the bank.",zh:"三個人背對我們、走上台階朝銀行(bank)大門走去，所以是「走進銀行」。「走出銀行」方向相反；牆上的提款機前面沒有人，沒有人在領現金(cash)。選 B"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">SNACK BAR</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Cake</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Pineapple</td><td style="text-align:right;font-weight:700">$100</td></tr><tr><td style="padding:4px 30px 4px 0">Cola</td><td style="text-align:right;font-weight:700">$40</td></tr><tr><td style="padding:4px 30px 4px 0">Tea</td><td style="text-align:right;font-weight:700">$30</td></tr></table></div>`,o:["He will have two hundred fifty dollars left.","He will have three hundred dollars left.","He will have one hundred fifty dollars left."],a:2,sen:"For question two, look at the picture. Tom has four hundred dollars in coins. He buys a cake and a pineapple. How much will he have left?",szh:"第二題，請看圖片。湯姆有四百元的硬幣。他買了一個蛋糕和一顆鳳梨。他還剩多少錢？",en:"He will have one hundred fifty dollars left.",zh:"價目表上蛋糕(cake)150元、鳳梨(pineapple)100元，合計250元，400減250剩150元。剩兩百五十元是只買了蛋糕的算法；剩三百元是只買了鳳梨的算法。他的錢是硬幣(coin)，不影響算法。選 C"},
{n:3,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q3.jpg" alt="question 3 picture">`,o:["There is a bill with a blue pen on it.","There is a bill with a green pen on it.","There is a bill with some coins on it."],a:0,sen:"For question three, look at the picture. What is on the table?",szh:"第三題，請看圖片。桌上有什麼？",en:"There is a bill with a blue pen on it.",zh:"黑色夾盤裡有一張帳單(bill)，上面放著一支藍色的筆，正確。帳單上沒有硬幣(coin)；筆是藍色，不是綠色(green)。選 A"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/27/p0_q4.jpg" alt="question 4 picture">`,o:["He is wearing a green T-shirt and running on the road.","He is wearing a white T-shirt and green jeans.","He is wearing a green T-shirt and jeans, with his hands in his pockets."],a:2,sen:"For question four, look at the picture. What is true about the man?",szh:"第四題，請看圖片。關於這位男士，何者正確？",en:"He is wearing a green T-shirt and jeans, with his hands in his pockets.",zh:"男士穿綠色(green)T恤(T-shirt)和藍色牛仔褲(jeans)，雙手插在口袋裡站著，正確。顏色顛倒的說法不對，T恤才是綠色、褲子是藍色；他是站著不動，不是在路上跑步(run)。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Shop Sales</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="88" width="44" height="62" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="83" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="96" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="45" font-size="14" font-weight="700" text-anchor="middle">80</text><rect x="162" y="125" width="44" height="25" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="120" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Cake</text><text x="118" y="167" text-anchor="middle">Cola</text><text x="184" y="167" text-anchor="middle">Tea</text></g></svg>`,o:["It sold one hundred thirty more.","It sold sixty more.","It sold thirty more."],a:2,sen:"For question five, look at the picture. The snack shop had an empty shelf at the end of the day. How many more colas than cakes did it sell?",szh:"第五題，請看圖片。小吃店一天結束時架子是空的(empty)。賣出的可樂比蛋糕多多少？",en:"It sold thirty more.",zh:"圖中可樂80份、蛋糕50份，80減50多30份。一百三十是把兩個數字加起來；六十是看成可樂和茶(20)的差。選 C"},
{n:6,p:1,o:["No, I don't want to go to other countries.","Only a small one. The bank charges two dollars each time.","You can pay by card or in cash."],a:1,sen:"Is there a fee to use this card in other countries?",szh:"這張卡在國外使用要手續費嗎？",en:"Only a small one. The bank charges two dollars each time.",zh:"問有沒有手續費(fee)，答「只有一點，銀行(bank)每次收(charge)兩元」，間接表示有。「不想出國」答非所問，只是重複 other countries；「可以刷卡或付(pay)現金(cash)」說的是付款方式，不是有沒有手續費。選 B"},
{n:7,p:1,o:["Don't worry. I'll pay for lunch today.","Yes, I keep my coins in a box.","Good. Then you can pay for both of us."],a:0,sen:"Oh no, I left my wallet at home, and I only have a few coins.",szh:"糟了，我把皮夾忘在家裡，身上只有幾枚硬幣。",en:"Don't worry. I'll pay for lunch today.",zh:"對方說沒帶皮夾、只剩幾枚硬幣(coin)，回「別擔心，今天午餐我請」最自然。「那你可以請我們兩個」和對方沒錢的情況矛盾；「是的，我把硬幣放在盒子裡」只是重複 coins，沒有回應對方的困難。選 A"},
{n:8,p:1,o:["At the bank on Western Road.","You sent fifty dollars.","In two or three days, I think."],a:2,sen:"When will the money I sent arrive?",szh:"我寄的錢什麼時候會到？",en:"In two or three days, I think.",zh:"問錢(money)「什麼時候」會到(arrive)，答「大概兩三天後」才是時間。「西部路(Western Road)上的銀行」答的是地點；「你寄了五十(fifty)元」重複 sent，說的是金額。選 C"},
{n:9,p:1,o:["Yes, they fought for a long time.","Tom said Ben cheated in the game.","Right after the geography class."],a:1,sen:"Why did Tom and Ben fight after school?",szh:"Tom 和 Ben 放學後為什麼打架？",en:"Tom said Ben cheated in the game.",zh:"問「為什麼」打架(fight)，答「Tom 說(say) Ben 玩遊戲作弊(cheat)」才是原因。「地理(geography)課一下課」答的是時間；用 Yes 回答 why 問句不對，而且說的是打了多久。選 B"},
{n:10,p:1,o:["Then you should rest today.","The store opens at eleven.","My sister runs a cake shop."],a:0,sen:"My legs are still sore from yesterday's long run.",szh:"我的腿因為昨天跑了很久還在痠痛。",en:"Then you should rest today.",zh:"對方說腿還很痠痛(sore)，建議「那你今天應該休息」最自然。「商店十一(eleven)點開」是用 store 和 sore 音近設陷阱；「我姊姊經營(run)蛋糕(cake)店」把 run 換成「經營」的意思，和跑步無關。選 A"},
{n:11,p:1,o:["Sorry, it's all gone. The can is empty.","Sure, you can share my umbrella.","I like cola more than water."],a:0,sen:"Can I share your cola? I'm really thirsty.",szh:"我可以喝一點你的可樂嗎？我好渴。",en:"Sorry, it's all gone. The can is empty.",zh:"對方想分(share)喝可樂(cola)，答「抱歉，全(all)喝完了，罐子是空的(empty)」是委婉拒絕。「我喜歡可樂勝過水」沒有回答能不能分；「你可以跟我共用腳踏車」重複 share，但分享的東西變成雨傘，不對。選 A"},
{n:12,p:1,o:["He wants to go for a run.","He is, but don't touch his bone.","Yes, I gave him a bone."],a:1,sen:"Your dog looks really gentle.",szh:"你的狗看起來好溫和。",en:"He is, but don't touch his bone.",zh:"對方說狗看起來很溫和(gentle)，回「是啊，不過別碰他的骨頭(bone)」是接著對方的話補充提醒。「他想去跑步」和對方的話不相干；「是的，我給(give)了他一根骨頭」用 Yes 附和，內容卻和溫不溫和無關。選 B"},
{n:13,p:1,o:["Yes, I have eleven of them.","I'll give your book back tomorrow.","No. I couldn't solve that one, either."],a:2,sen:"Do you know the answer to number eleven?",szh:"你知道第十一題的答案嗎？",en:"No. I couldn't solve that one, either.",zh:"問知不知道第十一(eleven)題的答案(answer)，答「不知道，那題我也解(solve)不出來」最自然。「是的，我有十一個」只是重複 eleven；「明天把書還(give back)你」對方沒有借書給你。選 C"},
{n:14,p:1,o:["No, I don't want any cake.","Yes, I'd like another piece, please.","My mom did. I just bought the pineapples."],a:2,sen:"Did you make this pineapple cake yourself?",szh:"這個鳳梨蛋糕是你自己做的嗎？",en:"My mom did. I just bought the pineapples.",zh:"問蛋糕(cake)是不是自己做的，答「是我媽媽做的，我只買了鳳梨(pineapple)」間接表示不是自己做的。「好，我想再來一塊」是回應別人請吃東西；「不，我不想要(want)蛋糕」也是回應邀請，都沒回答是誰做的。選 C"},
{n:15,p:1,o:["I paid for them in cash.","Less than you think. They were on sale for fifteen dollars.","They're my favorite style."],a:1,sen:"How much did you pay for those jeans?",szh:"那條牛仔褲你花多少錢買的？",en:"Less than you think. They were on sale for fifteen dollars.",zh:"問牛仔褲(jeans)付(pay)了多少錢，答「比你想的少，特價十五(fifteen)元」是金額。「用現金(cash)付的」答的是怎麼付，不是多少；「是我最喜歡的款式(style)」沒有回答價錢。選 B"},
{n:16,p:2,o:["Fifteen dollars.","Two dollars.","Seventeen dollars."],a:0,sen:"M: How much is a ticket to the museum? &nbsp;W: Fifteen dollars. But if you pay by card, there's a two-dollar fee. &nbsp;M: Hmm. I have enough cash, so I'll use that. &nbsp;Q: How much will the man pay?",szh:"男：博物館門票多少錢？　女：十五(fifteen)元。但如果刷卡付(pay)，要加兩元手續費(fee)。　男：嗯，我現金(cash)夠，就用現金。　問：男士要付多少錢？",en:"Fifteen dollars.",zh:"刷卡才要多付兩元手續費(fee)，男士用現金(cash)付，所以只要十五元。十七元是刷卡的價錢；兩元只是手續費。選 A"},
{n:17,p:2,o:["Twenty dollars.","Thirty dollars.","Twenty-five dollars."],a:0,sen:"W: Dinner was fifty dollars. Let's share the bill. &nbsp;M: So we each pay twenty-five? But you only had a salad. &nbsp;W: That's true. Your steak cost thirty dollars. &nbsp;M: OK. I'll pay thirty, and you pay the rest. &nbsp;Q: How much will the woman pay?",szh:"女：晚餐五十(fifty)元，我們分攤(share)帳單(bill)吧。　男：所以一人付二十五？可是你只吃了沙拉。　女：也對，你的牛排就要(cost)三十元。　男：好，我付三十，剩下的你付。　問：女士要付多少？",en:"Twenty dollars.",zh:"總共五十元，男士付三十，剩下的五十減三十是二十元。二十五元是一開始平分的想法，後來改了；三十元是男士要付的。選 A"},
{n:18,p:2,o:["Her sister should make more money.","Her sister should find another job.","Her sister should work longer hours."],a:1,sen:"M: Your sister is a banker now, right? &nbsp;W: Yes. Her income is much better than when she was a teacher. &nbsp;M: So she must be happy. &nbsp;W: Not really. She works until nine every night, and she has no time to spend her money. &nbsp;M: That's too bad. Will she change jobs again? &nbsp;W: I hope so. She works too much, and she is never happy. &nbsp;Q: What does the woman think her sister should do?",szh:"男：你姊姊現在是銀行員(banker)對吧？　女：對。她的收入(income)比當老師時好很多。　男：那她一定很開心。　女：不太算。她每天晚上工作到九點，沒時間花她的錢(money)。　男：那真可惜。她會再換工作(job)嗎？　女：我希望會。她工作太多，一點也不快樂。　問：女士認為她姊姊應該怎麼做？",en:"Her sister should find another job.",zh:"女士說姊姊收入(income)雖然好，卻每晚忙到九點、一點也不快樂，還說「我希望她再換工作(job)」，所以她認為姊姊該換個工作。收入已經很好，不需要再賺更多錢(money)；姊姊已經太忙，更不該再加長工時。選 B"},
{n:19,p:2,o:["Keeping their cash safe.","Going to the bank today.","Paying for the hotel room."],a:0,sen:"W: Did you bring all that cash on our trip? &nbsp;M: Yes. I wanted to put it in the bank, but it's closed today. &nbsp;W: Don't carry it around. The hotel provides a safe at the front desk. &nbsp;M: Oh, that's good. Is it free? &nbsp;W: Yes. They don't charge guests anything. &nbsp;M: Great. I'll leave the cash there before we go out. &nbsp;Q: What are the speakers talking about?",szh:"女：你旅行帶了這麼多(all)現金(cash)嗎？　男：對。我本來想存進銀行(bank)，但今天沒開。　女：別帶著到處走。飯店在櫃台提供(provide)保險箱(safe)。　男：喔，太好了。要錢嗎？　女：不用。他們不跟(charge)客人收任何費用。　男：太好了。出門前我會把現金放在那裡。　問：說話的兩個人在談什麼？",en:"Keeping their cash safe.",zh:"兩人從頭到尾在談怎麼把現金(cash)放在安全的地方：銀行(bank)沒開，所以改用飯店櫃台提供(provide)的保險箱(safe)，而且不收費(charge)。去銀行是男士原本的想法，今天已經不行；他們沒有要付房錢，保險箱是免費的。選 A"},
{n:20,p:2,o:["Twelfth.","First.","Eleventh."],a:0,sen:"W: How was the fun run on Sunday? &nbsp;M: Great! Fifty people ran in it. &nbsp;W: Were you the winner? &nbsp;M: No. Ben won, and ten other people finished before me, too. &nbsp;Q: What place did the man finish in?",szh:"女：星期天的路跑(run)好玩嗎？　男：很棒！有五十(fifty)人參加。　女：你是冠軍(winner)嗎？　男：不是。Ben 贏了，另外還有十個人也比我先到。　問：男士得到第幾名？",en:"Twelfth.",zh:"比男士先到的有 Ben 加上另外十個人，共十一人，所以他是第十二名。第十一名是只算了十一個人卻忘了再加上自己；第一名是 Ben，不是男士。選 A"},
{n:21,p:2,o:["Choosing jeans for school.","Getting a new worker ready.","Buying a T-shirt at the shop."],a:1,sen:"W: Welcome to the team, Ben. Here is your uniform. &nbsp;M: This is just a green T-shirt? &nbsp;W: Yes. The shop gives one to every worker, and you wear your own jeans. &nbsp;M: Easy. I want to do well at my first job. &nbsp;W: You will. Don't worry, I'll help you all day. &nbsp;M: OK. Where do I start? &nbsp;W: Come with me. I'll show you where everything is. &nbsp;Q: What are the speakers doing?",szh:"女：歡迎加入團隊，Ben。這是你的制服(uniform)。　男：只是一件綠色(green)T恤(T-shirt)嗎？　女：對。店裡給(give)每位員工一件，褲子你穿自己的牛仔褲(jeans)。　男：好簡單。我想(want)在我的第一份工作(job)好好表現。　女：你會的。別擔心，我整天(all)都會幫你。　男：好。我要從哪裡開始？　女：跟我來。我帶你看每樣東西在哪。　問：說話的兩個人在做什麼？",en:"Getting a new worker ready.",zh:"女士歡迎新員工、發制服(uniform)、說會整天幫忙並帶他認識環境，所以是在讓新員工做好準備。牛仔褲(jeans)是他自己穿的，不是在挑選，也和學校無關；T恤是店裡發的，不是去買。選 B"},
{n:22,p:2,o:["The man's textbook.","Her own textbook.","The man's notes."],a:2,sen:"W: Can I borrow your geography textbook? I left mine at school. &nbsp;M: Sorry, I gave it to my brother this morning. But you can use my notes. All the maps are in them. &nbsp;W: Great, thanks. &nbsp;Q: What will the woman use?",szh:"女：可以借我你的地理(geography)課本(textbook)嗎？我的放在學校。　男：抱歉，我早上給(give)我弟弟了。不過你可以用我的筆記，所有(all)地圖都在裡面。　女：太好了，謝謝。　問：女士會用什麼？",en:"The man's notes.",zh:"男士的課本(textbook)已經給弟弟了，他改借她筆記，她說好，所以她會用男士的筆記。她自己的課本放在學校；男士的課本不在他手上。選 C"},
{n:23,p:2,o:["Three.","Five.","Fifteen."],a:1,sen:"M: How much cola should we get for the party? &nbsp;W: Fifteen people are coming. One liter is enough for three people. &nbsp;M: OK. I'll go to the store now. &nbsp;Q: How many liters of cola will the man buy?",szh:"男：派對要買多少可樂(cola)？　女：有十五(fifteen)個人要來，一公升(liter)夠三個人喝。　男：好，我現在去店裡。　問：男士要買幾公升可樂？",en:"Five.",zh:"十五人、每三人一公升(liter)，十五除以三是五公升。十五是人數；三是一公升可以喝的人數。選 B"},
{n:24,p:2,o:["Ben cheated on the test.","Ben should study for two more weeks.","Ben worked hard for his score."],a:2,sen:"W: Ben got a hundred on the math test. &nbsp;M: Really? Some people say he cheated. &nbsp;W: I don't believe that. He studied every night for two weeks. His knowledge of math is much better now. &nbsp;Q: What does the woman think?",szh:"女：Ben 數學考一百分。　男：真的？有人說(say)他作弊(cheat)。　女：我不相信。他連續兩週每晚都在讀書，他的數學知識(knowledge)進步很多。　問：女士怎麼想？",en:"Ben worked hard for his score.",zh:"女士不相信作弊，還說他每晚讀書兩週，也就是「他是靠努力拿到分數的」。作弊是別人說的，女士不同意；「再讀兩週」是把對話中的 two weeks 拿來湊，女士沒有這樣說。選 C"},
{n:25,p:2,o:["At two-thirty.","At three.","At two."],a:1,sen:"W: Let's meet in front of the Central Bank at two. &nbsp;M: My train doesn't arrive until two-thirty. &nbsp;W: Then I'll do some shopping first. How about three? &nbsp;M: Perfect. &nbsp;Q: When will they meet?",szh:"女：我們兩點在中央(Central)銀行(Bank)前面見吧。　男：我的火車兩點半才到(arrive)。　女：那我先去逛街，三點如何？　男：太好了。　問：他們幾點見面？",en:"At three.",zh:"原本約兩點，但男士火車兩點半才到，女士改約三點，男士同意。兩點是原本的時間；兩點半是火車到站的時間，不是見面時間。選 B"},
{n:26,p:3,pic:true,o:[BARS("Our Pocket Money",["Snacks","Books","Games"],[50,20,80]),BARS("Our Pocket Money",["Snacks","Books","Games"],[80,20,50]),BARS("Our Pocket Money",["Snacks","Books","Games"],[20,80,50])],a:0,sen:"Our class asked every student how they use their pocket money. Many of us guessed that snacks would come first, but they came second. More money went to games than to snacks. Books, including textbooks, got the least. Our teacher says this is common, but her goal is to change it. &nbsp;Q: Which chart shows how the students use their pocket money?",szh:"我們班問了每位學生怎麼使用零用錢(money)。很多人猜零食會是第一，結果是第二。花在遊戲上的錢比零食多。書，包括(including)課本，花最少。老師說這(this)很常見(common)，但她的目標(goal)是改變這個情形。　問：哪張圖顯示學生怎麼使用零用錢？",en:"Games most, snacks second, books least.",zh:"零食是第二，遊戲比零食多，書最少，所以遊戲最高、零食第二、書最低。零食最高的那張是大家原本猜的結果；書最高的那張和「書最少」相反。選 A"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"At the night market, Mom wanted to buy two pineapples. She tried to pay with her phone, but the man said he only takes cash. Then she gave him a big bill, but he didn't have enough change. So in the end, she paid with all the coins in her purse. &nbsp;Q: How did Mom pay for the pineapples?",szh:"在夜市，媽媽想買兩顆鳳梨(pineapple)。她想用手機付(pay)錢，但老闆說只收現金(cash)。接著她給(give)他一張大鈔(bill)，但他零錢不夠找。所以最後她用錢包裡所有(all)的硬幣(coin)付了錢。　問：媽媽怎麼付鳳梨的錢？",en:"With all the coins in her purse.",zh:"用手機付不行，老闆只收現金；給大鈔(bill)也不行，因為找不開；最後是用硬幣(coin)付的。拿手機和遞大鈔的照片都是被否定的方法。選 B"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:2,sen:"My grandpa never liked banks. For years, he kept his cash in a box under his bed. My dad said that was not safe, so Grandpa bought a small safe. But he forgot the numbers to open it twice! Now he keeps his money at the bank, like everyone else. &nbsp;Q: Where does Grandpa keep his money now?",szh:"我爺爺一直不喜歡銀行(bank)。好幾年來，他把現金(cash)放在床底下的盒子裡。我爸爸說那樣不安全(safe)，所以爺爺買了一個小保險箱(safe)。可是他兩次忘了開箱的密碼！現在他和大家一樣，把錢(money)存在銀行。　問：爺爺現在把錢放在哪裡？",en:"At the bank.",zh:"床底下的盒子是以前的做法，爸爸說不安全；保險箱(safe)因為爺爺忘了密碼也不用了；現在錢存在銀行(bank)。放盒子和放保險箱的照片都是過去的做法。選 C"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29a'),PH('q29b')],a:2,sen:"Tim got a weekend job at a hamburger shop. He put on his uniform and hoped to cook on his first day. But the boss said new workers must follow the rules and learn slowly. Taking money at the counter is only for older workers, too. So Tim's only duty that day was filling ketchup bottles. &nbsp;Q: What did Tim do on his first day?",szh:"Tim 在漢堡店找到一份週末工作(job)。他穿上制服(uniform)，希望第一天就能煎漢堡。但老闆說新人必須遵守(follow)規定、慢慢學。在櫃台收錢(money)也只有資深員工能做。所以 Tim 那天唯一的職責(duty)是裝番茄醬(ketchup)瓶。　問：Tim 第一天做了什麼？",en:"He filled ketchup bottles.",zh:"Tim 想煎漢堡，但老闆說新人要慢慢學；櫃台收錢也只給資深員工；他那天的職責(duty)只有裝番茄醬(ketchup)。煎漢堡和收銀的照片都是他沒做到的事。選 C"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30b'),PH('q30c')],a:0,sen:"Lisa gave the best English speech at school, and as the winner, she got fifty dollars. Her first desire was a new pair of jeans, but the ones she wanted cost seventy dollars. Her mom said books are always a good idea, but Lisa already has too many. In the end, she bought a big cake and shared it with all her classmates. &nbsp;Q: What did Lisa do with her money?",szh:"Lisa 在學校的英文演講表現最好，身為優勝者(winner)拿到五十(fifty)元。她最想要(desire)的是一條新牛仔褲(jeans)，但她想要的那條要(cost)七十元。媽媽說買書總是好主意，但 Lisa 的書已經太多了。最後她買了一個大蛋糕(cake)和全班同學分享(share)。　問：Lisa 用她的錢做了什麼？",en:"She bought a big cake and shared it with her classmates.",zh:"牛仔褲(jeans)要七十元，五十元不夠；買書是媽媽的建議，但她書已經太多；最後她買大蛋糕(cake)和同學分享(share)。試穿牛仔褲和買書的照片都是沒有實現的選擇。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 27 回　金錢與付款　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);

<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
