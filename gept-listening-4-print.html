<script>
/* 圖形素材（第4回 心情與感受） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/4/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/4/p3_${n}.jpg?v=r4hard-20261009" alt="picture ${n}">`;
const FACE=(mood)=>`<img class="pic-img" src="gept-listening-img/4/face_${mood}.jpg" alt="${mood}">`;
const FACES=(mood)=>`<div style="text-align:center">${FACE(mood)}</div>`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q1.jpg" alt="question 1 picture">`,o:["She has a bright smile, and she is wearing white.","She looks sad, and she is wearing white.","She has a bright smile, and she is wearing blue."],a:0,sen:"For question one, look at the picture. How does the girl look?",szh:"第一題，請看圖片。這個女孩看起來怎麼樣？",en:"She has a bright smile, and she is wearing white.",zh:"女孩露出燦爛(bright)的笑容，穿著白色無袖上衣，正確。她穿的是白色，不是藍色(blue)；她在笑，不是難過(sad)。選 A"},
{n:2,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q2.jpg" alt="question 2 picture">`,o:["He looks angry, and he is wearing glasses.","He looks angry, and he is wearing a dark blue shirt.","He looks pleased, and he is wearing a dark blue shirt."],a:1,sen:"For question two, look at the picture. How does the man look?",szh:"第二題，請看圖片。這位男士看起來怎麼樣？",en:"He looks angry, and he is wearing a dark blue shirt.",zh:"男士皺著眉、瞪著眼，看起來很生氣(angry)，穿深藍色上衣，正確。他沒有一點高興(pleased)的樣子；他沒有戴眼鏡。選 B"},
{n:3,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q3.jpg" alt="question 3 picture">`,o:["He is holding a pillow, and he looks sleepy.","He is holding a toy, and he looks full of fear.","He is holding a pillow, and he looks full of fear."],a:2,sen:"For question three, look at the picture. What is true about the boy?",szh:"第三題，請看圖片。關於這個男孩，何者正確？",en:"He is holding a pillow, and he looks full of fear.",zh:"男孩晚上坐在沙發上緊抱著抱枕，眼睛睜得很大，一臉害怕(fear)，像被嚇到(frighten)，正確。他眼睛睜得大大的，不是想睡(sleepy)；他抱的是枕頭，不是玩具(toy)。選 C"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q4.jpg" alt="question 4 picture">`,o:["She looks shocked, with her eyes wide open.","She looks sleepy, with her eyes half closed.","She looks shocked, with both hands over her mouth."],a:0,sen:"For question four, look at the picture. How does the woman look?",szh:"第四題，請看圖片。這位女士看起來怎麼樣？",en:"She looks shocked, with her eyes wide open.",zh:"女士眼睛睜得很大、嘴巴張開，一臉震驚(shock)，正確。她只舉起一隻手在胸前，沒有用雙手摀住嘴；她眼睛張得很大，不是半閉著想睡。選 A"},
{n:5,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q5.jpg" alt="question 5 picture">`,o:["She looks excited, and she is sitting next to a window.","She looks blue, and she is wearing a red sweater.","She looks blue, and she is sitting next to a window."],a:2,sen:"For question five, look at the picture. Which is true about the woman?",szh:"第五題，請看圖片。關於這位女士，何者正確？",en:"She looks blue, and she is sitting next to a window.",zh:"女士抱著手臂、低頭坐在窗邊，看起來很憂鬱(blue)，正確。她穿的是灰色毛衣，不是紅色；她低著頭，一點也不興奮(excite)。選 C"},
{n:6,p:1,o:["Don't be so nervous. You'll do fine.","At twelve o'clock, I think.","I have to give a speech in front of the whole school."],a:2,sen:"Why do you look so nervous today?",szh:"你今天怎麼看起來這麼緊張？",en:"I have to give a speech in front of the whole school.",zh:"問為什麼緊張(nervous)，答「我要在全校面前演講」說出原因。「別緊張，你會沒事的」是安慰別人的話，人物顛倒；「大概十二(twelve)點」答的是時間。選 C"},
{n:7,p:1,o:["Yes, the test was very long.","That's marvelous! Let's celebrate.","Don't worry. You can try again next week."],a:1,sen:"I passed my driving test!",szh:"我駕照考試通過了！",en:"That's marvelous! Let's celebrate.",zh:"對方說考試通過，回「太棒了(marvelous)！我們來慶祝」最自然。「別擔心，下週(week)可以再考」是對沒考過的人說的；「對，考試很長(long)」用 Yes 接，答非所問。選 B"},
{n:8,p:1,o:["Cooking. My dumplings are really yummy.","My little brother likes to copy me.","I have a long list of things to do."],a:0,sen:"What's your favorite hobby?",szh:"你最喜歡的嗜好是什麼？",en:"Cooking. My dumplings are really yummy.",zh:"問最喜歡的嗜好(hobby)，答「做菜，我包的水餃(dumpling)很好吃(yummy)」直接說出嗜好。「我有一長串(list)要做的事」答非所問；「我弟弟喜歡模仿(copy)我」說的是別人。選 A"},
{n:9,p:1,o:["It's a phone from Asia.","Not really. It's slower than my old one.","I'll buy a new phone next week."],a:1,sen:"Are you satisfied with your new phone?",szh:"你對新手機滿意嗎？",en:"Not really. It's slower than my old one.",zh:"問對新手機滿不滿意(satisfy)，答「不太滿意，它比舊的還慢」是間接的回答。「我下週要買新手機」時態不對，對方已經有新手機了；「是亞洲(Asia)的手機」答的是產地。選 B"},
{n:10,p:1,o:["I stayed up past midnight to finish my report.","No, I'm not hungry.","I'll go to bed at midnight."],a:0,sen:"You look so sleepy this morning.",szh:"你今天早上看起來好睏。",en:"I stayed up past midnight to finish my report.",zh:"對方說你看起來很睏(sleepy)，回「我熬夜過了午夜(midnight)才寫完報告」說明原因，最自然。「不，我不餓」答非所問；「我會在午夜睡覺」是未來的事，解釋不了今天早上為什麼睏。選 A"},
{n:11,p:1,o:["Some egg sandwiches and fruit in a basket.","I prepared for the test last week.","In the park near my home."],a:0,sen:"What did you prepare for the picnic?",szh:"你為野餐準備了什麼？",en:"Some egg sandwiches and fruit in a basket.",zh:"問野餐準備(prepare)了什麼，答「一籃(basket)蛋(egg)三明治和水果」是具體的東西。「上週準備考試」只是重複 prepare；「在我家(home)附近的公園」答的是地點。選 A"},
{n:12,p:1,o:["I don't have any tickets left.","It was humorous. We couldn't stop laughing.","It starts at seven o'clock."],a:1,sen:"How was the talk show last night?",szh:"昨晚的脫口秀怎麼樣？",en:"It was humorous. We couldn't stop laughing.",zh:"問昨晚的節目怎麼樣，答「很幽默(humorous)，我們笑個不停」是感想。「我沒有任何(any)票了」答非所問；「它七點開始」時態不對，節目昨晚已經演完了。選 B"},
{n:13,p:1,o:["No, I can't smell anything.","Since last week, I think.","Yes, I have a strange feeling. She's been so quiet."],a:2,sen:"Do you sense that something is wrong with Amy?",szh:"你有沒有感覺到 Amy 怪怪的？",en:"Yes, I have a strange feeling. She's been so quiet.",zh:"問有沒有感覺(sense)到 Amy 不對勁，答「有，我有種奇怪的感覺(feeling)，她一直很安靜」最自然。「從上週開始」答的是時間；「我聞不到任何東西」把 sense 誤會成嗅覺。選 C"},
{n:14,p:1,o:["Tom broke the window with his ball.","Dad will come home at twelve.","Tom is my cousin from Asia."],a:0,sen:"Why is Dad so mad at Tom?",szh:"爸爸為什麼這麼氣 Tom？",en:"Tom broke the window with his ball.",zh:"問爸爸為什麼氣(mad)Tom，答「Tom 用球打破了窗戶」說出原因。「爸爸十二點會回家(come home)」答的是時間；「Tom 是我亞洲(Asia)來的表哥」答的是身分。選 A"},
{n:15,p:1,o:["Yes, the kitchen is very clean.","Let's cook some eggs in the kitchen.","Don't worry. I'll take care of it."],a:2,sen:"There's a big cockroach in the kitchen!",szh:"廚房裡有一隻大蟑螂！",en:"Don't worry. I'll take care of it.",zh:"對方發現廚房有蟑螂(cockroach)，回「別擔心，我來處理」最自然。「我們去廚房煮蛋」只是重複 kitchen；「對，廚房很乾淨(clean)」和有蟑螂的情況接不上。選 C"},
{n:16,p:2,o:["He was sure he would win.","He was surprised.","He was sad because Ben won."],a:1,sen:"W: How did you feel when you won the race? &nbsp;M: Surprised, really. I was sure Ben would win. &nbsp;W: Weren't you happy? &nbsp;M: Of course, but at first, I just couldn't believe it. &nbsp;Q: How did the man feel at first?",szh:"女：你贏得賽跑時覺得(feel)怎麼樣？　男：其實很驚訝(surprise)，我原本確定 Ben 會贏。　女：你不開心(happy)嗎？　男：當然開心，但一開始我就是不敢相信。　問：男士一開始覺得怎樣？",en:"He was surprised.",zh:"男士說一開始不敢相信，也就是很驚訝(surprise)。他原本確定會贏的是 Ben，不是自己；贏的人是男士，Ben 並沒有贏。選 B"},
{n:17,p:2,o:["A cockroach.","A mouse.","A big brown dog."],a:0,sen:"M: Why did your sister shout just now? &nbsp;W: She saw something run across the kitchen floor. &nbsp;M: A mouse? &nbsp;W: No, a big brown bug. She's afraid of cockroaches. &nbsp;Q: What frightened the sister?",szh:"男：你妹妹剛剛為什麼大叫？　女：她看到有東西跑過廚房地板。　男：老鼠嗎？　女：不是，是一隻棕色大蟲。她很怕(afraid)蟑螂(cockroach)。　問：什麼嚇到(frighten)了妹妹？",en:"A cockroach.",zh:"女士說是一隻棕色大蟲，而妹妹怕蟑螂(cockroach)，所以嚇到她的是蟑螂。老鼠是男士猜錯、被否定的；「棕色大狗」只是借用 big brown 的陷阱。選 A"},
{n:18,p:2,o:["Because he lost his phone.","Because he missed the bus.","Because of the exam."],a:0,sen:"W: You look down. Is it the exam? &nbsp;M: No, I don't feel any stress about the exam. It was easy. &nbsp;W: Then what's wrong? &nbsp;M: I left my phone on the bus this morning. &nbsp;Q: Why does the man feel down?",szh:"女：你看起來很沮喪(down)，是因為考試嗎？　男：不是，考試我一點壓力(stress)都沒有，很簡單。　女：那怎麼了？　男：我今天早上把手機忘在公車上了。　問：男士為什麼沮喪？",en:"Because he lost his phone.",zh:"男士把手機忘在公車上，換句話說就是手機丟了，所以心情不好(down)。考試是女士猜的，他說一點壓力(stress)都沒有；他是把手機留在公車上，不是沒趕上公車。選 A"},
{n:19,p:2,o:["New Year.","The Lantern Festival.","A birthday."],a:1,sen:"M: Why are there so many people in the street tonight? &nbsp;W: It's the Lantern Festival. People all over Asia celebrate it. &nbsp;M: Oh, I thought it was New Year. &nbsp;W: No, that was two weeks ago. &nbsp;Q: What are the people celebrating tonight?",szh:"男：今晚街上怎麼這麼多人(people)？　女：今天是元宵節(Lantern Festival)，全亞洲(Asia)的人都會慶祝。　男：喔，我以為是新年。　女：不是，新年是兩週(week)前。　問：大家今晚在慶祝什麼？",en:"The Lantern Festival.",zh:"女士說今天是元宵節(Lantern Festival)。新年是男士猜錯的，女士說那是兩週前的事；對話沒有提到生日。選 B"},
{n:20,p:2,o:["The hamburgers.","The noodles.","The dumplings."],a:2,sen:"W: How was the international food fair? &nbsp;M: Marvelous. I tried food from twelve countries. &nbsp;W: What did you like best? &nbsp;M: The dumplings. They were really yummy, even better than the hamburgers. &nbsp;Q: What did the man like best?",szh:"女：國際(international)美食展怎麼樣？　男：太棒了(marvelous)，我吃了十二(twelve)個國家的食物。　女：你最喜歡什麼？　男：水餃(dumpling)，超好吃(yummy)，比漢堡(hamburger)還好吃。　問：男士最喜歡什麼？",en:"The dumplings.",zh:"男士最喜歡水餃(dumpling)，還說比漢堡(hamburger)好吃。漢堡是拿來比較、排在後面的；麵在對話中沒有出現。選 C"},
{n:21,p:2,o:["It was just ordinary.","It was very exciting.","She had fun at the beach."],a:0,sen:"M: Did you do anything special this weekend? &nbsp;W: I wanted to go to the beach, but it rained all weekend. &nbsp;M: So what did you do? &nbsp;W: I just cleaned my room and watched TV, as usual. &nbsp;Q: How was the woman's weekend?",szh:"男：你這個週末有做什麼特別的事嗎？　女：我本來想去海邊，但整個週末都在下雨。　男：那你做了什麼？　女：就打掃(clean)房間、看電視，跟平常(usual)一樣。　問：女士的週末過得怎樣？",en:"It was just ordinary.",zh:"她想去海邊但下雨沒去，只打掃房間、看電視，跟平常(usual)一樣，也就是很普通(ordinary)。去海邊是沒實現的計畫；做的都是平常的事，談不上刺激(excite)。選 A"},
{n:22,p:2,o:["Play some music.","Turn off her phone.","Study at the library."],a:2,sen:"W: I have a big test tomorrow, but I can't focus. &nbsp;M: Turn off your phone. That will help. &nbsp;W: I did. It's my brother. He's playing loud music. &nbsp;M: Then go and study at the library. &nbsp;Q: What does the man suggest in the end?",szh:"女：我明天有大考，但我沒辦法專心(focus)。　男：把手機關掉，會有幫助的(will)。　女：關了。是我弟弟，他在放很大聲的音樂。　男：那就去圖書館讀書吧。　問：男士最後建議什麼？",en:"Study at the library.",zh:"男士先建議關手機，但女士說已經關了，問題是弟弟放音樂，所以男士最後建議去圖書館讀書。關手機是第一個、已經做過的建議；放音樂的是弟弟，不是男士的建議。選 C"},
{n:23,p:2,o:["Turn around.","Touch his arm.","Call him in a louder voice."],a:1,sen:"W: Your uncle didn't turn around when I called him. &nbsp;M: He didn't hear you. He's been deaf since he was young. &nbsp;W: Oh, I'm sorry. I didn't know. &nbsp;M: It's OK. Just touch his arm next time. &nbsp;Q: What should the woman do next time?",szh:"女：我叫你叔叔，他都沒有轉頭。　男：他沒聽到。他從小就聽不見(deaf)。　女：喔，抱歉，我不知道。　男：沒關係，下次輕拍他的手臂就好。　問：女士下次應該怎麼做？",en:"Touch his arm.",zh:"叔叔聽不見(deaf)，所以大聲叫也沒用，男士說下次輕拍他手臂。大聲叫和叔叔聽不見的情況不合；轉頭(turn around)是叔叔沒做的動作，不是女士該做的事。選 B"},
{n:24,p:2,o:["He wanted to play with the dog.","The dog was angry.","He was afraid of the dog."],a:2,sen:"W: Why did that boy walk backward so fast? &nbsp;M: A big dog came running toward him. &nbsp;W: Was the dog angry? &nbsp;M: No, it wasn't anger. It just wanted to play, but the boy didn't know that. &nbsp;Q: Why did the boy walk backward?",szh:"女：那個男孩為什麼那麼快往後退(backward)？　男：一隻大狗朝他跑過來。　女：那隻狗在生氣(angry)嗎？　男：不是生氣(anger)，牠只是想玩，但男孩不知道。　問：男孩為什麼往後退？",en:"He was afraid of the dog.",zh:"大狗衝過來，男孩不知道狗只是想玩，所以是害怕(afraid)才往後退。男士說狗不是在生氣；想玩的是狗，不是男孩。選 C"},
{n:25,p:2,o:["It is new.","It is big.","It is convenient."],a:2,sen:"M: How do you like your new home? &nbsp;W: It's small and old. But the MRT station is two minutes away, and there's a supermarket next door. &nbsp;M: Sounds nice. &nbsp;Q: What does the woman like about her new home?",szh:"男：你喜歡你的新家(home)嗎？　女：它又小又舊，但捷運站走兩分鐘就到，隔壁還有超市。　男：聽起來不錯。　問：女士喜歡新家的哪一點？",en:"It is convenient.",zh:"捷運站很近、隔壁就有超市，換句話說就是很方便(convenient)。她說房子很小，不是很大；她說房子很舊，不是新的。選 C"},
{n:26,p:3,pic:true,o:[BARS("Trip Feelings",["Excited","Nervous","Sleepy"],[30,20,80]),BARS("Trip Feelings",["Excited","Nervous","Sleepy"],[50,70,20]),BARS("Trip Feelings",["Excited","Nervous","Sleepy"],[70,50,20])],a:1,sen:"Our class is going on an international trip to Japan next week. Our teacher asked how we feel about it. I thought most students would feel excited. Many of them do, but even more feel nervous, because it's their first time on a plane. Only a few feel sleepy, even though the plane leaves at midnight. &nbsp;Q: Which chart shows how the class feels?",szh:"我們班下週(week)要出國(international)去日本。老師問我們有什麼感覺(feel)。我以為大部分同學會很興奮(excite)，很多人的確是，但覺得緊張(nervous)的人更多，因為是第一次搭飛機。只有少數人覺得想睡(sleepy)，雖然飛機半夜(midnight)才起飛。　問：哪張圖是全班的感受？",en:"Nervous most, excited second, sleepy fewest.",zh:"興奮的人很多，但緊張的人更多，想睡的人最少，所以緊張最高、興奮第二、想睡最低。興奮最高的那張是說話者原本「以為」的；想睡最高的那張與「只有少數人想睡」相反。選 B"},
{n:27,p:3,pic:true,o:[BARS("Stress Helpers",["Music","Sports","Cooking"],[50,80,20]),BARS("Stress Helpers",["Music","Sports","Cooking"],[80,50,20]),BARS("Stress Helpers",["Music","Sports","Cooking"],[80,20,50])],a:1,sen:"Every week, our teacher asks us how we deal with stress. Last term, sports was at the top of the list. But this term, it has rained almost every day, so more students now choose music than sports. Cooking is still the least popular hobby, even though a few students say making dumplings makes them happy. &nbsp;Q: Which chart shows the class this term?",szh:"每週(week)老師都會問我們怎麼面對壓力(stress)。上學期運動在清單(list)上排第一。但這學期幾乎天天下雨，所以現在選音樂的同學比選運動的多。做菜還是最不受歡迎的嗜好(hobby)，雖然有幾個同學說包水餃(dumpling)讓他們很開心(happy)。　問：哪張圖是這學期全班的情形？",en:"Music most, sports second, cooking least.",zh:"這學期選音樂的比運動多，做菜仍然最少，所以音樂最高、運動第二、做菜最低。運動最高的那張是「上學期」的情形；做菜排第二的那張和「做菜還是最不受歡迎的嗜好(hobby)」相反。有人喜歡包水餃(dumpling)只是少數。選 B"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:2,sen:"Last Saturday was my sister's birthday, and we planned a surprise party for her. We hid behind the sofa with all the lights off. When she came home and turned on the lights, we all jumped out. We wondered if she would laugh or cry. She did neither. She just stood at the door with her mouth and eyes wide open. &nbsp;Q: How did the sister look when the lights came on?",szh:"上週六是我姊姊的生日，我們為她計畫了一場驚喜(surprise)派對。我們關掉所有燈躲在沙發後面。她回家(home)一開燈，我們全都跳出來。我們好奇(wonder)她會笑還是會哭。結果她兩個都沒有，只是站在門口，嘴巴和眼睛都張得大大的。　問：燈亮的時候姊姊是什麼表情？",en:"Shocked, with her mouth and eyes wide open.",zh:"大家好奇(wonder)她會笑還是哭，但她兩個都沒有，只是張大嘴巴和眼睛，一臉震驚(shock)。大笑和哭都是大家猜測、但沒發生的反應。選 C"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29c'),PH('q29b')],a:0,sen:"Last Sunday was Mother's Day, and we all wanted to make Mom happy. My brother cleaned the whole house. I got up early and prepared breakfast, eggs and toast. Mom thanked us both. But what made her happiest was the card from my little sister. Mom said it almost made her cry. &nbsp;Q: What made Mom the happiest?",szh:"上週日是母親節，我們都想讓媽媽開心(happy)。哥哥把整個家打掃(clean)乾淨，我早起準備(prepare)了早餐：蛋(egg)和吐司。媽媽謝謝我們兩個。但最讓她開心的是妹妹做的卡片，媽媽說她差點哭了。　問：什麼讓媽媽最開心？",en:"The card from the little sister.",zh:"打掃(clean)和準備(prepare)早餐都讓媽媽道謝，但「最」開心的是妹妹的卡片。打掃是哥哥做的；做早餐是說話者做的，都不是最讓媽媽開心的。選 A"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30c'),PH('q30b')],a:1,sen:"Before my English speech, I was full of emotion. Mostly, I felt nervous. My teacher told me to close my eyes and count to ten, but that didn't help much. My friend told me a humorous story, and I laughed a little. What really helped was my mom. She sat in the first row and gave me a big, warm smile. &nbsp;Q: What helped the speaker the most?",szh:"英文演講前，我的情緒(emotion)很多，大部分是緊張(nervous)。老師叫我閉上眼睛數到十，但沒什麼幫助。朋友講了一個好笑的(humorous)故事，我笑了一下。真正有幫助的是媽媽，她坐在第一排，給我一個大大的溫暖笑容。　問：什麼對說話者幫助最大？",en:"Mom's big, warm smile from the first row.",zh:"閉眼數到十「沒什麼幫助」；朋友的好笑故事(humorous)只讓她笑了一下；「真正」有幫助的是坐在第一排的媽媽的笑容。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 4 回　心情與感受　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
