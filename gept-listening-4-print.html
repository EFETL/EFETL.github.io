 <b>🖨 第 4 回　心情與感受　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">只印學生卷</button>

<div id="root"></div>
<script>
/* 圖形素材（第4回 心情與感受） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/4/${n}.jpg" alt="${n}">`;
const FACE=(mood)=>`<img class="pic-img" src="gept-listening-img/4/face_${mood}.jpg" alt="${mood}">`;
const FACES=(mood)=>`<div style="text-align:center">${FACE(mood)}</div>`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q1.jpg" alt="question 1 picture">`,o:["She feels nervous, with a worried face.","She feels sad, with tears in her eyes.","She feels happy, with a bright and pleased smile."],a:2,sen:"For question one, look at the picture. How does the girl feel?",szh:"第一題，請看圖片。女孩感覺如何？",en:"She feels happy and pleased.",zh:"她開心(happy)，帶著明亮(bright)、滿意(pleased)的笑容，選 C。A 緊張(nervous)、B 難過(sad)的表情都和圖不同。"},
{n:2,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q2.jpg" alt="question 2 picture">`,o:["He looks excited; his joy is easy to see.","He looks afraid; his fear is easy to see.","He looks angry; his anger is easy to see."],a:2,sen:"For question two, look at the picture. How does the man look?",szh:"第二題，請看圖片。男士看起來如何？",en:"He looks angry; his anger is easy to see.",zh:"他看起來生氣(angry)，怒氣(anger)很明顯，選 C。A 興奮(excited)、B 害怕(afraid)的情緒都不是圖中男士的表情。"},
{n:3,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q3.jpg" alt="question 3 picture">`,o:["He is afraid; fear and shock show on his face.","He is happy; joy and pleasure show on his face.","He is mad; anger shows on his face."],a:0,sen:"For question three, look at the picture. How does the boy feel?",szh:"第三題，請看圖片。男孩感覺如何？",en:"He is afraid; fear shows on his face.",zh:"他害怕(afraid)，臉上滿是恐懼(fear)與驚嚇(shock)，選 A。B 開心、C 生氣(mad)的表情都不符。"},
{n:4,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q4.jpg" alt="question 4 picture">`,o:["She is surprised, and she jumps up.","She is satisfied, and she smiles.","She is sleepy, and she yawns."],a:0,sen:"For question four, look at the picture. What is her reaction?",szh:"第四題，請看圖片。她的反應是什麼？",en:"She is surprised and jumps up.",zh:"她很驚訝(surprise)，跳了起來，選 A。B 滿意(satisfy)地微笑、C 想睡(sleepy)打哈欠，反應都不同。"},
{n:5,p:0,fig:`<img class="pic-img p0img" src="gept-listening-img/4/p0_q5.jpg" alt="question 5 picture">`,o:["She feels happy, excited, and proud.","She feels down, blue, and sad.","She feels nervous, afraid, and alone."],a:1,sen:"For question five, look at the picture. How does she feel today?",szh:"第五題，請看圖片。她今天心情如何？",en:"She feels down, blue and sad.",zh:"她情緒低落(down)、憂鬱(blue)、有點難過(sad)，選 B。A 是開心興奮、C 是緊張害怕，心情都不同。"},

{n:6,p:1,o:["I have a big exam this week.","At twelve o'clock, I think.","Don't be so nervous. It's easy."],a:0,sen:"Why do you look so nervous today?",szh:"你今天怎麼看起來這麼緊張？",en:"I have a big exam this week.",zh:"問為何緊張(nervous)，答『這週有大考』，選 A。A 回答時間、C 重複 nervous 但是在安慰人，都沒回答原因。"},
{n:7,p:1,o:["I'm so excited. It's marvelous!","I read the news every morning.","It will come by mail soon."],a:0,sen:"How do you feel about the good news?",szh:"你對這個好消息有什麼感覺？",en:"I'm so excited. It's marvelous!",zh:"問對好消息的感覺，答『我好興奮(excite)，太棒了(marvelous)』，選 A。B 重複 news 但講習慣、C 講消息會寄來(come)，都沒說感覺。"},
{n:8,p:1,o:["I have a long list of them.","My brother likes to copy me.","Cooking. I make yummy dumplings."],a:2,sen:"What is your favorite hobby?",szh:"你最喜歡的嗜好是什麼？",en:"Cooking; I make yummy dumplings.",zh:"問最喜歡的嗜好(hobby)，答『煮菜，我做好吃的(yummy)水餃(dumpling)』，選 C。A 說有一長串(list)清單、B 說弟弟愛模仿(copy)，都沒說出嗜好。"},
{n:9,p:1,o:["It was in the school gym.","Yes, I'm very satisfied with it.","We'll get it back next week."],a:1,sen:"Are you happy with your test result?",szh:"你對考試結果滿意嗎？",en:"Yes, I'm very satisfied with it.",zh:"問對成績是否滿意，答『是，我很滿意(satisfy)』，選 B。A 回答地點、C 說何時發回，都沒回答是否滿意。"},
{n:10,p:1,o:["He looks just like his father.","He turns twelve next month.","He went to bed after midnight."],a:2,sen:"Why does the boy look so sleepy?",szh:"男孩為什麼看起來這麼想睡？",en:"He went to bed after midnight.",zh:"問男孩為何想睡，答『他過了午夜(midnight)才睡』，選 C。A 講長相、B 講十二(twelve)歲生日，都不是原因。"},
{n:11,p:1,o:["I prepared for the test last week.","In the park near my home.","A basket of eggs and hamburgers."],a:2,sen:"What did you prepare for the picnic?",szh:"你為野餐準備了什麼？",en:"A basket of eggs and hamburgers.",zh:"問野餐準備(prepare)了什麼，答『一籃(basket)蛋(egg)和漢堡(hamburger)』，選 C。A 重複 prepare 但講考試、B 回答地點，都沒回答準備了什麼。"},
{n:12,p:1,o:["I don't have any tickets left.","It was humorous. We laughed a lot.","The show starts at seven o'clock."],a:1,sen:"How was the comedy show last night?",szh:"昨晚的喜劇表演如何？",en:"It was humorous; we laughed a lot.",zh:"問喜劇表演如何，答『很幽默(humorous)，我們笑很多』，選 B。A 講票的事、C 講開演時間，都沒評論表演。"},
{n:13,p:1,o:["Since last week, I think.","Something smells good in the kitchen.","Yes, I have a strange feeling."],a:2,sen:"Do you sense that something is wrong?",szh:"你有感覺到不對勁嗎？",en:"Yes, I have a strange feeling.",zh:"問是否感覺(sense)到不對勁，答『是，我有種奇怪的感覺(feeling)』，選 C。A 的 since 聽起來像 sense 但在說時間、B 重複 something 卻是在講味道。"},
{n:14,p:1,o:["He broke my toy on purpose.","I'll see him around twelve.","He is my cousin from Asia."],a:0,sen:"Why are you so angry at him?",szh:"你為什麼這麼生他的氣？",en:"He broke my toy on purpose.",zh:"問為何生他的氣(angry)，答『他故意弄壞我的玩具(toy)』，選 A。B 說何時見他、C 介紹他是誰，都不是原因。"},
{n:15,p:1,o:["I walked backward to the door.","It lasted until midnight.","The loud sound shocked me."],a:2,sen:"What surprised you at the party?",szh:"派對上什麼事讓你驚訝？",en:"The loud sound shocked me.",zh:"問什麼讓你驚訝(surprise)，答『巨大的聲音嚇到(shock)我』，選 C。A 說自己往後(backward)走、B 說持續到何時，都沒說驚訝的事。"},

{n:16,p:2,o:["Angry and mad.","Happy and pleased.","Afraid and blue."],a:1,
 sen:"W: How did you feel when you won? &nbsp;M: I was so happy and pleased, it was a bright day. &nbsp;W: Wonderful. &nbsp;Q: How did the man feel?",
 szh:"女：你贏的時候感覺如何？　男：我又開心(happy)又滿意(pleased)，真是明亮(bright)的一天。　女：太好了。　問：男士感覺如何？",
 en:"Happy and pleased.",zh:"男士又開心(happy)又滿意(pleased)，選 B。"},
{n:17,p:2,o:["A cockroach.","A butterfly.","A mouse."],a:0,sen:"M: Why did your sister scream just now? &nbsp;W: She saw a big brown bug fly across the kitchen. &nbsp;M: Oh no! Is she okay? &nbsp;W: Yes, but she hates them. &nbsp;Q: What frightened the sister?",szh:"男：你妹妹剛剛為什麼尖叫？　女：她看到一隻大大的棕色蟲子飛過廚房。　男：天啊！她還好嗎？　女：還好，但她很討厭牠們。　問：什麼嚇到妹妹？",en:"A big brown bug flew across the kitchen — a cockroach.",zh:"飛過廚房的大棕色蟲子是蟑螂(cockroach)，選 A。蝴蝶(butterfly)也會飛，但不會讓人尖叫、討厭；老鼠不會飛。"},
{n:18,p:2,o:["Because he lost his wallet.","Because of exam stress.","Because he missed the bus."],a:1,sen:"W: You look down. What's wrong? &nbsp;M: I feel a lot of stress before the exam, and I'm nervous. &nbsp;W: Relax. &nbsp;Q: Why does the man feel down?",szh:"女：你看起來很低落(down)，怎麼了？　男：考試前我壓力(stress)很大，很緊張(nervous)。　女：放輕鬆。　問：男士為何心情低落？",en:"Exam stress makes him nervous.",zh:"考試壓力(stress)讓他緊張(nervous)、低落(down)，選 B。弄丟錢包、錯過公車都沒提到。"},
{n:19,p:2,o:["The Lantern Festival.","A school sports day.","A family birthday."],a:0,sen:"M: Why are so many people excited tonight? &nbsp;W: It's the Lantern Festival; people all over Asia celebrate it. &nbsp;M: How lively! &nbsp;Q: What are the people celebrating?",szh:"男：今晚為什麼這麼多人興奮(excite)？　女：是元宵節(Lantern Festival)，全亞洲(Asia)的人(people)都在慶祝。　男：好熱鬧！　問：人們在慶祝什麼？",en:"The Lantern Festival.",zh:"人們在慶祝元宵節(Lantern Festival)，選 A。運動會和生日都沒有提到。"},
{n:20,p:2,o:["A school play.","An international show.","A cooking class."],a:1,sen:"W: How was the concert? &nbsp;M: It was an international show, truly marvelous and yummy snacks too. &nbsp;W: Sounds great. &nbsp;Q: What kind of show was it?",szh:"女：演唱會如何？　男：那是國際(international)級的演出，真是太棒了(marvelous)，點心也很好吃(yummy)。　女：聽起來很讚。　問：那是什麼樣的演出？",en:"An international, marvelous show.",zh:"那是國際(international)級、很棒(marvelous)的演出，選 B。提到點心(yummy)只是附帶，不是演出種類。"},
{n:21,p:2,o:["Very exciting.","A little scary.","Just an ordinary one."],a:2,sen:"M: Did you do anything special this weekend? &nbsp;W: Not really. I cleaned my room, watched TV, and went to bed early, like I usually do. &nbsp;Q: How was the woman's weekend?",szh:"男：你這個週末有做什麼特別的事嗎？　女：沒有，我打掃(clean)房間、看電視、早睡，跟平常(usual)一樣。　問：女士的週末如何？",en:"She did what she usually does — an ordinary weekend.",zh:"她做的都是平常(usual)會做的事，所以是平凡的(ordinary)一個週末，選 C。她說沒有特別的事，所以不會是很刺激或可怕。"},
{n:22,p:2,o:["Take a long rest.","Ask the teacher for help.","Focus on studying."],a:2,sen:"W: I have a big test tomorrow, and I feel so nervous. &nbsp;M: Turn off your phone and read your notes again. You will be fine. &nbsp;W: Okay, I will try. &nbsp;Q: What does the man suggest?",szh:"女：我明天有一場大考，我好緊張。　男：把手機關掉，再讀一次筆記，你會沒事的。　女：好，我試試看。　問：男士建議什麼？",en:"Turn off the phone and read notes — focus on studying.",zh:"男士要她關手機、再讀筆記，就是專心(focus)讀書，選 C。休息(A)和問老師(B)都不是他說的。"},
{n:23,p:2,o:["He is angry with her.","He is deaf.","He is very sleepy."],a:1,sen:"W: Your uncle did not turn around when I called him. &nbsp;M: He did not hear you. He cannot hear at all. &nbsp;W: Oh, I did not know that. &nbsp;Q: What is the matter with the uncle?",szh:"女：我叫你叔叔，他都沒有回頭。　男：他沒聽到你，他完全聽不到。　女：喔，我不知道。　問：叔叔怎麼了？",en:"He cannot hear at all — he is deaf.",zh:"叔叔完全聽不到，就是聾人(deaf)，選 B。他沒回頭不是生氣(A)或想睡(C)，而是聽不到。"},
{n:24,p:2,o:["A big dog scared him.","He heard a funny joke.","He wanted to go home."],a:0,sen:"W: Why did the boy step back so quickly? &nbsp;M: A big dog ran toward him. &nbsp;W: No wonder! I am afraid of big dogs, too. &nbsp;Q: Why did the boy step back?",szh:"女：男孩為什麼那麼快往後退？　男：一隻大狗朝他跑過去。　女：難怪(wonder)！我也怕大狗。　問：男孩為何後退？",en:"A big dog ran toward him and scared him.",zh:"大狗跑向他，嚇到他才往後退，選 A。笑話和回家都沒提到。"},
{n:25,p:2,o:["It has a big garden.","It is convenient to live in.","It looks very new."],a:1,sen:"M: How do you like your new home? &nbsp;W: It is two minutes from the MRT station, and the supermarket is next door. &nbsp;M: Nice! &nbsp;W: It is also small, so it is easy to clean. &nbsp;Q: What does the woman like about her new home?",szh:"男：你喜歡你的新家嗎？　女：離捷運站兩分鐘，隔壁就是超市。　男：真不錯！　女：它也很小，所以很好打掃(clean)。　問：女士喜歡新家的什麼？",en:"It is near the station and the supermarket — convenient.",zh:"離捷運站和超市都很近，代表生活方便(convenient)，選 B。她說房子小，所以沒有大花園。"},

{n:26,p:3,pic:true,o:[FACE('happy'),FACE('sad'),FACE('angry')],a:0,
 sen:"Today was a marvelous day for me. In the morning I was a little nervous about my speech, but it went well. My friends came to cheer for me, and I felt so happy and pleased. All my stress was gone by the afternoon. &nbsp;Q: How does the speaker feel at the end?",
 szh:"今天對我來說是很棒(marvelous)的一天。早上我對演講有點緊張(nervous)，但很順利。朋友們來(come)為我加油，我覺得(feel)好開心(happy)、好滿意(pleased)。到下午我所有壓力(stress)都消失了。　問：說話者最後的心情如何？",
 en:"Happy and pleased.",zh:"說話者最後開心(happy)，選 A(笑臉)。"},
{n:27,p:3,pic:true,o:[BARS("Stress Level",["Mon","Wed","Fri"],[55,85,30]),BARS("Stress Level",["Mon","Wed","Fri"],[85,55,30]),BARS("Stress Level",["Mon","Wed","Fri"],[30,55,85])],a:1,sen:"I kept a feelings diary for one long week. On Monday my stress was the highest because of many tests. By Wednesday it dropped to the middle, and by Friday I felt the most relaxed, with the least stress. &nbsp;Q: Which chart shows my stress level?",szh:"我記錄了漫長(long)一週(week)的心情。星期一因為很多考試，壓力(stress)最高；到星期三降到中間；星期五最放鬆，壓力最低。　問：哪張圖符合我的壓力狀況？",en:"Highest Mon, lowest Fri (going down).",zh:"週一壓力最高、逐日下降，符合『Mon 最高、Fri 最低』的圖，選 B。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:0,
 sen:"When I feel sad or blue, cooking makes me happy. My favorite thing to prepare is fresh bread, which smells wonderful in the oven. I do not make noodles or rice when I am down, because bread is my real comfort food. &nbsp;Q: What does the speaker prepare when feeling down?",
 szh:"當我難過(sad)或憂鬱(blue)時，煮飯讓我開心(happy)。我最愛準備(prepare)的是新鮮麵包(bread)，在烤箱裡香噴噴。我心情低落(down)時不做麵或飯，因為麵包才是我真正的療癒食物。　問：說話者心情低落時會準備什麼？",
 en:"Fresh bread.",zh:"說話者做的是麵包(bread)，選 A。麵、飯為干擾。"},

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 4 回　心情與感受　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
