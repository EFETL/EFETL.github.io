<script>
/* 圖形素材（第4回 心情與感受） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/4/${n}.jpg" alt="${n}">`;
const FACE=(mood)=>`<img class="pic-img" src="gept-listening-img/4/face_${mood}.jpg" alt="${mood}">`;
const FACES=(mood)=>`<div style="text-align:center">${FACE(mood)}</div>`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:FACE('happy'),o:["She feels happy, with a bright and pleased smile.","He is afraid of the cockroach on the wall.","They prepare eggs and dumplings for the party."],a:0,
 sen:"For question one, look at the picture. How does the girl feel?",szh:"第一題，請看圖片。女孩感覺如何？",

{n:2,p:0,fig:FACE('angry'),o:["The sleepy boy came home at midnight.","She copies a long list of names.","He looks angry; his anger is easy to sense."],a:2,
 sen:"For question two, look at the picture. How does the man look?",szh:"第二題，請看圖片。男士看起來如何？",
 en:"He looks angry; full of anger.",zh:"他看起來生氣(angry)，怒氣(anger)明顯可感(sense)，選 C。sleepy/come/home/midnight、copy/long/list 為干擾。"},
{n:3,p:0,fig:FACE('afraid'),o:["The people enjoy a marvelous, yummy meal.","He is afraid; fear and shock show on his face.","It is an ordinary, usual weekday at home."],a:1,
 sen:"For question three, look at the picture. How does the boy feel?",szh:"第三題，請看圖片。男孩感覺如何？",
 en:"He is afraid; fear shows on his face.",zh:"他害怕(afraid)，臉上滿是恐懼(fear)與驚嚇(shock)，選 B。people/marvelous/yummy、ordinary/usual 為干擾。"},
{n:4,p:0,fig:FACE('surprised'),o:["She is surprised; the shock made her jump.","He will focus on cleaning the basket.","The deaf man cannot hear the toy."],a:0,
 sen:"For question four, look at the picture. What is her reaction?",szh:"第四題，請看圖片。她的反應是什麼？",
 en:"She is surprised; the shock made her jump.",zh:"她很驚訝(surprise)，被嚇(shock)得跳起來，選 A。will/focus/clean/basket、deaf/toy 為干擾。"},
{n:5,p:0,fig:FACE('sad'),o:["The humorous show made everyone excited.","People come to Asia for the Lantern Festival.","She feels down and blue, a little sad today."],a:2,
 sen:"For question five, look at the picture. How does she feel today?",szh:"第五題，請看圖片。她今天心情如何？",
 en:"She feels down, blue and sad.",zh:"她情緒低落(down)、憂鬱(blue)、有點難過(sad)，選 C。humorous/excite、Asia/Lantern Festival 為干擾。"},

{n:6,p:1,o:["I made a copy of the toy list.","After a long week, the stress makes me nervous.","People in Asia love dumplings."],a:1,
 sen:"Why do you look so nervous today?",szh:"你今天怎麼看起來這麼緊張？",
 en:"Stress makes me nervous.",zh:"問為何緊張(nervous)，答『漫長(long)一週(week)後，壓力(stress)讓我緊張』，選 B。copy/toy/list、people/Asia/dumpling 為干擾。"},
{n:7,p:1,o:["I feel excited; the news is marvelous when it comes!","He is afraid of the dark at midnight.","It is an ordinary egg basket."],a:0,
 sen:"How do you feel about the good news?",szh:"你對這個好消息有什麼感覺？",
 en:"I feel excited; it is marvelous.",zh:"問感覺，答『我很興奮(excite)，消息傳來(come)時真是太棒了(marvelous)』，選 A。afraid/midnight、ordinary/egg/basket 為干擾。"},
{n:8,p:1,o:["The deaf man senses the bright light.","I feel blue and down these days.","Cooking; I make yummy dumplings and hamburgers at home."],a:2,
 sen:"What is your favorite hobby?",szh:"你最喜歡的嗜好是什麼？",
 en:"Cooking yummy food at home.",zh:"問嗜好(hobby)，答『煮飯，我在家(home)做好吃的(yummy)水餃(dumpling)和漢堡(hamburger)』，選 C。deaf/sense/bright、blue/down 為干擾。"},
{n:9,p:1,o:["The cockroach frightened the people.","Yes, I am satisfied and very pleased with it.","I will focus on my hobby this week."],a:1,
 sen:"Are you happy with your test result?",szh:"你對考試結果滿意嗎？",
 en:"Yes, satisfied and pleased.",zh:"問是否滿意，答『是，我很滿意(satisfy)也很高興(pleased)』，選 B。cockroach/frighten/people、will/focus/hobby/week 為干擾。"},
{n:10,p:1,o:["He stayed up until twelve o'clock, past midnight.","She feels afraid of the loud sound.","They prepare a marvelous meal in Asia."],a:0,
 sen:"Why does the boy look so sleepy?",szh:"男孩為什麼看起來這麼想睡？",
 en:"He stayed up past midnight.",zh:"問為何想睡(sleepy)，答『他熬到十二點(twelve)、過了午夜(midnight)』，選 A。afraid、prepare/marvelous/Asia 為干擾。"},
{n:11,p:1,o:["It is a convenient and clean place.","The humorous man made us happy.","A basket of eggs, some toys, and hamburgers."],a:2,
 sen:"What did you prepare for the picnic?",szh:"你為野餐準備了什麼？",
 en:"A basket of eggs, toys and hamburgers.",zh:"問準備(prepare)了什麼，答『一籃(basket)蛋(egg)、一些玩具(toy)和漢堡(hamburger)』，選 C。convenient/clean、humorous/happy 為干擾。"},
{n:12,p:1,o:["I copied any book on the shelf.","It was humorous; the whole audience felt happy.","The deaf child cannot come home."],a:1,
 sen:"How was the comedy show last night?",szh:"昨晚的喜劇表演如何？",
 en:"Humorous; everyone felt happy.",zh:"問表演如何，答『很幽默(humorous)，全場都覺得(feel)開心(happy)』，選 B。copy/any、deaf/come/home 為干擾。"},
{n:13,p:1,o:["Yes, I have a strange feeling of fear.","No toy is left in the clean basket.","People in Asia eat yummy food."],a:0,
 sen:"Do you sense that something is wrong?",szh:"你有感覺到不對勁嗎？",
 en:"A strange feeling of fear.",zh:"問是否感覺(sense)到不對，答『是，我有種奇怪的恐懼(fear)感覺(feeling)』，選 A。toy/clean/basket、people/Asia/yummy 為干擾。"},
{n:14,p:1,o:["The list is on the convenient shelf.","She will prepare eggs for twelve people.","His rude words made me mad, full of anger."],a:2,
 sen:"Why are you so angry at him?",szh:"你為什麼這麼生他的氣？",
 en:"His words made me mad and angry.",zh:"問為何生氣(angry)，答『他無禮的話讓我抓狂(mad)、滿是怒氣(anger)』，選 C。list/convenient、prepare/egg/twelve/people 為干擾。"},
{n:15,p:1,o:["It is my usual, ordinary hobby.","A sudden sound shocked me; what a surprise!","The backward step made him blue."],a:1,
 sen:"What surprised you at the party?",szh:"派對上什麼事讓你驚訝？",
 en:"A sound shocked me; a surprise.",zh:"問什麼讓你驚訝(surprise)，答『突然的聲音嚇(shock)到我，真是意外』，選 B。usual/ordinary/hobby、backward/blue 為干擾。"},

{n:16,p:2,o:["Happy and pleased.","Afraid and blue.","Angry and mad."],a:0,
 sen:"W: How did you feel when you won? &nbsp;M: I was so happy and pleased, it was a bright day. &nbsp;W: Wonderful. &nbsp;Q: How did the man feel?",
 szh:"女：你贏的時候感覺如何？　男：我又開心(happy)又滿意(pleased)，真是明亮(bright)的一天。　女：太好了。　問：男士感覺如何？",
 en:"Happy and pleased.",zh:"男士又開心(happy)又滿意(pleased)，選 A。"},
{n:17,p:2,o:["The bright light.","The clean toy.","The cockroach frightened her."],a:2,
 sen:"M: Why did your sister scream? &nbsp;W: A cockroach frightened her; she is really afraid of them. &nbsp;M: Poor her. &nbsp;Q: What frightened the sister?",
 szh:"男：你妹妹為什麼尖叫？　女：一隻蟑螂(cockroach)嚇(frighten)到她，她很怕(afraid)蟑螂。　男：真可憐。　問：什麼嚇到妹妹？",
 en:"A cockroach frightened her.",zh:"蟑螂(cockroach)嚇(frighten)到妹妹，選 C。"},
{n:18,p:2,o:["Because of a yummy egg.","Because of exam stress and nerves.","Because of a long list."],a:1,
 sen:"W: You look down. What's wrong? &nbsp;M: I feel a lot of stress before the exam, and I'm nervous. &nbsp;W: Relax. &nbsp;Q: Why does the man feel down?",
 szh:"女：你看起來很低落(down)，怎麼了？　男：考試前我壓力(stress)很大，很緊張(nervous)。　女：放輕鬆。　問：男士為何心情低落？",
 en:"Exam stress makes him nervous.",zh:"考試壓力(stress)讓他緊張(nervous)、低落，選 B。"},
{n:19,p:2,o:["The Lantern Festival.","An ordinary weekday.","A backward step."],a:0,
 sen:"M: Why are so many people excited tonight? &nbsp;W: It's the Lantern Festival; people all over Asia celebrate it. &nbsp;M: How lively! &nbsp;Q: What are the people celebrating?",
 szh:"男：今晚為什麼這麼多人興奮(excite)？　女：是元宵節(Lantern Festival)，全亞洲(Asia)的人(people)都在慶祝。　男：好熱鬧！　問：人們在慶祝什麼？",
 en:"The Lantern Festival.",zh:"人們在慶祝元宵節(Lantern Festival)，選 A。"},
{n:20,p:2,o:["A local egg.","A home toy.","An international, marvelous show."],a:2,
 sen:"W: How was the concert? &nbsp;M: It was an international show, truly marvelous and yummy snacks too. &nbsp;W: Sounds great. &nbsp;Q: What kind of show was it?",
 szh:"女：演唱會如何？　男：那是國際(international)級的演出，真是太棒了(marvelous)，點心也很好吃(yummy)。　女：聽起來很讚。　問：那是什麼樣的演出？",
 en:"An international, marvelous show.",zh:"那是國際(international)、超棒(marvelous)的演出，選 C。"},
{n:21,p:2,o:["A shocking one.","Just an ordinary, usual day.","A frightening night."],a:1,
 sen:"M: How was your weekend? &nbsp;W: Nothing special, just an ordinary and usual day at home. &nbsp;M: I see. &nbsp;Q: How was the woman's weekend?",
 szh:"男：你週末如何？　女：沒什麼特別，就是平常(ordinary)、如常(usual)在家的一天。　男：了解。　問：女士的週末如何？",
 en:"An ordinary, usual day.",zh:"就是平常(ordinary)、如常(usual)的一天，選 B。"},
{n:22,p:2,o:["Focus and prepare well.","Feel blue and down.","Copy any answer."],a:0,
 sen:"W: How can I do better on the test? &nbsp;M: Just focus and prepare well; you will feel less stress. &nbsp;W: Thanks. &nbsp;Q: What does the man suggest?",
 szh:"女：我要怎麼考得更好？　男：專心(focus)、好好準備(prepare)，你就會(will)比較沒壓力(stress)。　女：謝謝。　問：男士建議什麼？",
 en:"Focus and prepare well.",zh:"專心(focus)並準備(prepare)好，選 A。"},
{n:23,p:2,o:["He feels excited.","He is very happy.","The deaf man cannot sense the sound."],a:2,
 sen:"W: Can your uncle hear the music? &nbsp;M: No, he is deaf, so he cannot sense the sound. &nbsp;W: I understand. &nbsp;Q: Why can't the uncle hear the music?",
 szh:"女：你叔叔聽得到音樂嗎？　男：不行，他是聾(deaf)的，無法感知(sense)聲音。　女：我懂了。　問：叔叔為何聽不到音樂？",
 en:"He is deaf; cannot sense sound.",zh:"叔叔是聾人(deaf)，無法感知(sense)聲音，選 C。"},
{n:24,p:2,o:["He walked home.","No wonder he took a backward step in fear.","He felt pleased."],a:1,
 sen:"W: Why did the boy step back suddenly? &nbsp;M: No wonder—he took a backward step, full of fear. &nbsp;W: Poor boy. &nbsp;Q: Why did the boy step back?",
 szh:"男：男孩為什麼突然後退？　男：難怪(wonder)——他往後(backward)退了一步，滿是恐懼(fear)。　女：可憐的孩子。　問：男孩為何後退？",
 en:"He stepped backward in fear.",zh:"他因恐懼(fear)往後(backward)退，難怪(wonder)，選 B。"},
{n:25,p:2,o:["It is convenient and very clean.","It is far and dirty.","It is dark and blue."],a:0,
 sen:"M: How do you like the new home? &nbsp;W: I love it; it is convenient and very clean. &nbsp;M: Great. &nbsp;Q: What does the woman say about the new home?",
 szh:"男：你喜歡新家嗎？　女：我很喜歡，交通方便(convenient)又很乾淨(clean)。　男：太好了。　問：女士覺得新家如何？",
 en:"Convenient and clean.",zh:"新家(home)方便(convenient)又乾淨(clean)，選 A。"},

{n:26,p:3,pic:true,o:[FACE('sad'),FACE('angry'),FACE('happy')],a:2,
 sen:"Today was a marvelous day for me. In the morning I was a little nervous about my speech, but it went well. My friends came to cheer for me, and I felt so happy and pleased. All my stress was gone by the afternoon. &nbsp;Q: How does the speaker feel at the end?",
 szh:"今天對我來說是很棒(marvelous)的一天。早上我對演講有點緊張(nervous)，但很順利。朋友們來(come)為我加油，我覺得(feel)好開心(happy)、好滿意(pleased)。到下午我所有壓力(stress)都消失了。　問：說話者最後的心情如何？",
 en:"Happy and pleased.",zh:"說話者最後開心(happy)，選 C(笑臉)。"},
{n:27,p:3,pic:true,o:[BARS("Stress Level",["Mon","Wed","Fri"],[30,55,85]),BARS("Stress Level",["Mon","Wed","Fri"],[85,55,30]),BARS("Stress Level",["Mon","Wed","Fri"],[55,85,30])],a:1,
 sen:"I kept a feelings diary for one long week. On Monday my stress was the highest because of many tests. By Wednesday it dropped to the middle, and by Friday I felt the most relaxed, with the least stress. &nbsp;Q: Which chart shows my stress level?",
 szh:"我記錄了漫長(long)一週(week)的心情。星期一因為很多考試，壓力(stress)最高；到星期三降到中間；星期五最放鬆，壓力最低。　問：哪張圖符合我的壓力狀況？",
 en:"Highest Mon, lowest Fri (going down).",zh:"週一最高、逐日下降，符合『Mon 最高、Fri 最低』的 B。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('noodles'),IMG('rice')],a:0,
 sen:"When I feel sad or blue, cooking makes me happy. My favorite thing to prepare is fresh bread, which smells wonderful in the oven. I do not make noodles or rice when I am down, because bread is my real comfort food. &nbsp;Q: What does the speaker prepare when feeling down?",
 szh:"當我難過(sad)或憂鬱(blue)時，煮飯讓我開心(happy)。我最愛準備(prepare)的是新鮮麵包(bread)，在烤箱裡香噴噴。我心情低落(down)時不做麵或飯，因為麵包才是我真正的療癒食物。　問：說話者心情低落時會準備什麼？",
 en:"Fresh bread.",zh:"說話者做的是麵包(bread)，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[FACE('happy'),FACE('afraid'),FACE('surprised')],a:2,
 sen:"At the surprise party, we hid in the dark and waited. When my sister opened the door and turned on the light, we all shouted. Her eyes went wide and her mouth opened round—she was completely surprised and shocked, but not afraid. &nbsp;Q: How did the sister look?",
 szh:"在驚喜(surprise)派對上，我們躲在暗處等待。當姊姊開門、打開燈時，我們一起大喊。她瞪大眼睛、嘴巴張成圓形——她完全嚇(shock)到、非常驚訝(surprise)，但並不害怕(afraid)。　問：姊姊看起來如何？",
 en:"Surprised (wide eyes, round mouth).",zh:"姊姊很驚訝(surprise)，選 C(驚訝臉)。害怕臉為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('beach'),IMG('park')],a:1,
 sen:"Whenever I feel stress, I go somewhere to relax. I do not climb the mountain, and I do not sit in the park. Instead, I go to the beach, where the sound of the waves calms my emotion and washes my worries away. &nbsp;Q: Where does the speaker go to relax?",
 szh:"每當我覺得有壓力(stress)，我會去某個地方放鬆。我不爬山，也不坐公園，而是去海邊(beach)，海浪的聲音能安撫我的情緒(emotion)、洗去煩惱。　問：說話者去哪裡放鬆？",
 en:"The beach.",zh:"說話者去海邊(beach)放鬆，選 B。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 4 回　心情與感受　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
