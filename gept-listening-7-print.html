<div class="bar">
 <b>🖨 第 7 回　音樂與美術　聽力測驗　列印版</b>

<div id="root"></div>
<script>
/* 圖形素材（第7回 音樂與美術） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/7/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/7/p3_${n}.jpg?v=r7hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const GUITAR=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q1.jpg" alt="question 1 picture">`;
const PALETTE=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q2.jpg" alt="question 2 picture">`;
const MIC=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q3.jpg" alt="question 3 picture">`;
const NOTE=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q4.jpg" alt="question 4 picture">`;
const COMIC=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:GUITAR,o:["He is sitting and playing an instrument.","He is sitting and painting a picture.","He is standing and playing an instrument."],a:0,sen:"For question one, look at the picture. What is the boy doing?",szh:"第一題，請看圖片。男孩在做什麼？",en:"He is sitting and playing an instrument.",zh:"男孩坐在木椅上，面帶笑容彈吉他這種樂器(instrument)，正確。他是坐著的，不是站著；牆上雖然掛著一幅畫，但他手上拿的是吉他，不是在畫畫。選 A"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">ART SHOP</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Brush</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Album</td><td style="text-align:right;font-weight:700">$350</td></tr><tr><td style="padding:4px 30px 4px 0">Comic</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Frame</td><td style="text-align:right;font-weight:700">$250</td></tr></table></div>`,o:["She will have three hundred fifty dollars left.","She will have one hundred fifty dollars left.","She will have two hundred dollars left."],a:2,sen:"For question two, look at the picture. Mia has seven hundred dollars. She buys a brush and an album. How much will she have left?",szh:"第二題，請看圖片。米雅有七百元。她買了一支畫筆和一張專輯。她還剩多少錢？",en:"She will have two hundred dollars left.",zh:"價目表上畫筆(brush)150元、專輯(album)350元，一共500元，700減500剩200元。剩三百五十元是只買了專輯、忘記畫筆；剩一百五十元是把專輯和漫畫(comic)200元一起算，看錯了項目。選 C"},
{n:3,p:0,fig:MIC,o:["A woman is singing, and a man behind her is playing the guitar.","A man is singing, and a woman behind him is playing the guitar.","A woman is singing, and the people in front of her are standing."],a:0,sen:"For question three, look at the picture. Which is true about the picture?",szh:"第三題，請看圖片。關於這張圖，何者正確？",en:"A woman is singing, and a man behind her is playing the guitar.",zh:"台上的女歌手拿著麥克風唱歌(sing)，後面有一位男士在彈吉他，正確。唱歌的是女士、彈吉他的是男士，人物顛倒了；台下的觀眾是坐在椅子上拍手，不是站著。選 A"},
{n:4,p:0,fig:NOTE,o:["A program for drawing pictures is open on the computer.","A program for recording music is open on the computer.","The computer is closed, and it is next to the desk."],a:1,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"A program for recording music is open on the computer.",zh:"打開的電腦螢幕上是錄音(record)軟體(program)的聲波畫面，旁邊還有麥克風和耳機，正確。螢幕上是聲音的波形，不是畫畫(draw)的軟體；電腦是打開的放在桌上，不是闔上放在桌子旁邊。選 B"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Music Club</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="75" width="44" height="75" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="70" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="96" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="45" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Guitar</text><text x="118" y="167" text-anchor="middle">Piano</text><text x="184" y="167" text-anchor="middle">Drums</text></g></svg>`,o:["There are fifty students.","There are sixty students.","There are seventy students."],a:1,sen:"For question five, look at the picture. The music club has some students who play the piano and some who play the drums. How many students is that in all?",szh:"第五題，請看圖片。音樂社有一些學生彈鋼琴、一些學生打鼓。他們一共有多少學生？",en:"There are sixty students.",zh:"圖中彈鋼琴40人、打鼓20人，加起來60人。五十是吉他30加鼓20，看錯了項目；七十是吉他30加鋼琴40，也是看錯項目。選 B"},
{n:6,p:1,o:["I showed two paintings there last year.","It starts at two on Friday.","I haven't decided yet. Maybe a painting of my dog."],a:2,sen:"What's your plan for the school art show?",szh:"你對學校美展有什麼計畫？",en:"I haven't decided yet. Maybe a painting of my dog.",zh:"問你美展(art show)的計畫(plan)，答「還沒決定，也許畫一幅我的狗」是在說打算。「週五兩點開始」答的是時間；「我去年展出(show)了兩幅畫(painting)」時態不對，說的是過去，不是計畫。選 C"},
{n:7,p:1,o:["I like to sing in the rain.","No, I don't sing very well.","Yeah, it's great. Who's the singer?"],a:2,sen:"That new song is all I listen to these days.",szh:"這陣子我只聽那首新歌。",en:"Yeah, it's great. Who's the singer?",zh:"對方說最近都在聽那首新歌(song)，回「對啊，很好聽，是誰唱的(singer)？」是自然的接話。「不，我唱得不好」像在回答「請你唱歌」，沒人邀他唱；「我喜歡在雨(rain)中唱歌」只是抓了 sing 相關的字。選 C"},
{n:8,p:1,o:["He fell off the stage and hurt his knee.","He plays the piano very well.","It ended at nine last night."],a:0,sen:"Why did the young musician stop in the middle of the show?",szh:"那位年輕音樂家為什麼在表演中途停下來？",en:"He fell off the stage and hurt his knee.",zh:"問音樂家(musician)為什麼中途停下，答「他從台上摔下來傷了膝蓋(knee)」是原因。「昨晚九點結束」答的是時間，而且是結束不是中途停；「他鋼琴彈得很好」沒有回答為什麼。選 A"},
{n:9,p:1,o:["She sent it to me last night.","A link to her new painting.","Please send it to my office."],a:1,sen:"What did the artist send you?",szh:"那位藝術家寄了什麼給你？",en:"A link to her new painting.",zh:"問藝術家(artist)寄(send)了「什麼」，答「她新畫作的連結(link)」是東西。「她昨晚寄給我的」答的是時間；「請寄到我辦公室」人物和時態都不對，對方問的是已經寄來的東西。選 B"},
{n:10,p:1,o:["I'll bring some more snacks to the party.","Yeah. Let's get some noodles after the party.","The party starts at six."],a:1,sen:"The buffet at the party has too many snacks and not enough real food.",szh:"派對的自助餐點心太多，正餐不夠。",en:"Yeah. Let's get some noodles after the party.",zh:"對方抱怨自助餐(buffet)都是點心(snack)、吃不飽，回「對啊，派對後我們去吃麵吧」最自然。「我會再帶些點心來」和對方的抱怨相反；「派對六點開始」只是重複 party，答的是時間。選 B"},
{n:11,p:1,o:["The fox. My teacher says I'm sneaky enough.","At the school hall on Friday.","I play basketball after school."],a:0,sen:"What role will you play in the school show?",szh:"你在學校表演中要演什麼角色？",en:"The fox. My teacher says I'm sneaky enough.",zh:"問你要演什麼角色(role)，答「狐狸(fox)，老師說我夠狡猾(sneaky)」是角色加理由。「週五在學校禮堂」答的是時間地點；「我放學後打籃球」把 play 當成「打球」，是同字陷阱。選 A"},
{n:12,p:1,o:["It opens at nine tomorrow morning.","Cross the street and push that big door.","Yes, there's an art show in the hall."],a:1,sen:"Excuse me, where is the entrance to the art hall?",szh:"不好意思，美術館的入口在哪裡？",en:"Cross the street and push that big door.",zh:"問美術館入口(entrance)在哪，答「過(cross)馬路，推(push)那(that)扇大門」是位置。「明天早上九點開」答的是時間；用 Yes 回答 where 問句，還只是重複 art 和 hall。選 B"},
{n:13,p:1,o:["No, the little kids are at home.","Then let's play it a bit slower.","I bought it for forty dollars."],a:1,sen:"I'm a little concerned. The beat of this song is too rapid for the little kids.",szh:"我有點擔心(concern)。這首歌的節奏對小朋友來說太快(rapid)了。",en:"Then let's play it a bit slower.",zh:"對方擔心(concern)音樂(music)太快(rapid)，小朋友跟不上，回「那我們彈慢一點」是解決辦法。「我花四十(forty)元買的」和擔心無關；「不，小朋友在家」只是重複 little kids，答非所問。選 B"},
{n:14,p:1,o:["Just some powder and my keys.","I bought it at the night market.","Its value is about ninety dollars."],a:0,sen:"What's in that purse?",szh:"那個皮包裡面有什麼？",en:"Just some powder and my keys.",zh:"問那個皮包(purse)「裡面有什麼」，答「只有一些粉餅(powder)和我的鑰匙」是內容物。「它價值(value)大約九十(ninety)元」答的是價錢；「在夜市買的」答的是地點。選 A"},
{n:15,p:1,o:["Because learning is fun.","In the school library.","Confucius did, a long time ago."],a:2,sen:"Who said we should never stop learning?",szh:"是誰說我們永遠不要停止學習？",en:"Confucius did, a long time ago.",zh:"問「誰」說過要不停學習，答「孔子(Confucius)很久以前說的」是人物。「因為學習很有趣」答的是原因；「在學校圖書館」答的是地點。選 C"},
{n:16,p:2,o:["A song they will sing.","An event at their school.","A painting for the hall."],a:1,sen:"W: Look at this sign, Ben. Students can sing a song or show a painting. &nbsp;M: Do I have to sing? &nbsp;W: No. You can also bring a drawing. &nbsp;M: Good. I can't sing, but I like to draw. &nbsp;W: Then you should join. It's in the hall next Friday. &nbsp;M: OK. I'll bring my best picture. &nbsp;Q: What are the speakers talking about?",szh:"女：Ben，看這個告示。學生可以唱一首歌(song)或展出一幅畫(painting)。　男：我一定要唱歌(sing)嗎？　女：不用，你也可以帶一張素描。　男：太好了。我不會唱，但我喜歡畫(draw)畫。　女：那你應該參加。下週五在禮堂。　男：好，我會帶我最好的一張畫。　問：說話的兩個人在談什麼？",en:"An event at their school.",zh:"告示上說學生可以唱歌或展出畫，下週五在禮堂，男孩決定帶畫去，所以兩人談的是學校的活動。男孩說他不會唱歌(sing)，所以不是要唱一首歌(song)；他要帶的是自己的畫，不是為禮堂畫一幅新的畫(painting)。選 B"},
{n:17,p:2,o:["Pop music.","Old songs.","Her sister's new songs."],a:1,sen:"M: Pop music is still your favorite, right? &nbsp;W: Not anymore. My sister plays old songs at home all the time, and now I love them, too. &nbsp;M: Old songs? From when? &nbsp;W: From the nineties, mostly. &nbsp;Q: What music does the woman like now?",szh:"男：你最喜歡的還是流行音樂(pop music)，對吧？　女：現在不是了。我姐姐在家一直放老歌(song)，現在我也愛上了。　男：老歌？哪個年代的？　女：大多是九〇(ninety)年代的。　問：女士現在喜歡什麼音樂？",en:"Old songs.",zh:"女士說流行音樂(pop music)已經不是她的最愛，現在愛上的是姐姐放的九〇年代老歌(song)。流行音樂是以前的喜好；姐姐放的是老歌，不是新歌。選 B"},
{n:18,p:2,o:["Blow into it softly.","Hit it hard.","Blow into it as hard as she can."],a:0,sen:"W: How do I play this? Do I hit it? &nbsp;M: No, it's not a drum. Put your lips here and blow. &nbsp;W: Like this? &nbsp;M: Yes, but not so hard. Softly. &nbsp;Q: How should the woman play the instrument?",szh:"女：這個怎麼玩？用打的嗎？　男：不，它不是鼓。把嘴唇放這裡吹(blow)。　女：像這樣嗎？　男：對，但別那麼用力，輕輕的。　問：女士應該怎麼演奏這個樂器(instrument)？",en:"Blow into it softly.",zh:"男士說不是用打的，要把嘴唇放上去吹(blow)，而且要輕輕吹。用打的是女士猜錯的；男士說「別那麼用力」，所以不是用力吹。選 A"},
{n:19,p:2,o:["Ten.","Eight.","Two."],a:2,sen:"M: Why are the musicians still here so late? &nbsp;W: They're recording their new album. &nbsp;M: All ten songs tonight? &nbsp;W: No, just the final two. They did the others last week. &nbsp;Q: How many songs are they recording tonight?",szh:"男：音樂家們(musician)為什麼這麼晚還在這裡？　女：他們在錄(record)新專輯(album)。　男：十首歌(song)今晚全錄？　女：不，只錄最後(final)兩首。其他的上週錄好了。　問：他們今晚錄幾首歌？",en:"Two.",zh:"專輯(album)共十首歌，其他八首上週就錄(record)好了，今晚只錄最後(final)兩首。十首是整張專輯；八首是上週錄的。選 C"},
{n:20,p:2,o:["The lamp.","His knee.","His tooth."],a:1,sen:"M: Why is Tom crying? &nbsp;W: He climbed up on a chair to fix the lamp, and he fell. &nbsp;M: Oh no! Did he hurt his tooth? &nbsp;W: No, his teeth are fine. It's his knee. &nbsp;Q: What did Tom hurt?",szh:"男：Tom 為什麼在哭？　女：他爬(climb)上椅子要修檯燈(lamp)，結果摔下來了。　男：糟糕！他傷到牙齒(tooth)了嗎？　女：沒有，牙齒沒事，是膝蓋(knee)。　問：Tom 傷到哪裡？",en:"His knee.",zh:"男士猜是牙齒(tooth)，女士否定，說受傷的是膝蓋(knee)。牙齒是被否定的；檯燈(lamp)是他要修的東西，不是他受傷的地方。選 B"},
{n:21,p:2,o:["Planning a show.","Playing on the stage.","Dancing to a slow song."],a:0,sen:"W: We have only ten minutes on the stage. &nbsp;M: Then we can't play all five songs. &nbsp;W: Which one should we cut? &nbsp;M: The slow one. Nobody can dance to it. &nbsp;W: Good idea. I'll tell the others. &nbsp;M: And let's move the fast one to the end. &nbsp;Q: What are the speakers doing?",szh:"女：我們在台上只有十分鐘。　男：那我們沒辦法演奏全部五首歌。　女：要刪掉哪一首？　男：慢的那首。沒有人能跟著它跳舞。　女：好主意。我去告訴其他人。　男：還有，把快的那首移到最後。　問：說話的兩個人在做什麼？",en:"Planning a show.",zh:"兩人在決定表演(show)的時間夠不夠、要刪哪一首歌、快歌放哪裡，是在安排表演的內容。他們是在談要上台的事，現在並沒有在台上演奏；慢歌是因為沒人能跟著跳舞才被刪掉，他們沒有要跳舞。選 A"},
{n:22,p:2,o:["Cross out the words she knows.","Underline all the new words.","Circle the hardest words."],a:2,sen:"W: I always forget these new words. &nbsp;M: Underline them with a red pen. &nbsp;W: I tried that, but now there are lines all over the page. &nbsp;M: Then just circle the hardest ones. &nbsp;Q: What will the woman probably do?",szh:"女：我老是忘記這些新(new)單字。　男：用紅筆在下面畫線(underline)。　女：試過了，可是現在整頁都是線。　男：那就只圈(circle)最難的幾個。　問：女士可能會怎麼做？",en:"Circle the hardest words.",zh:"畫底線(underline)她已經試過，整頁都是線不好用，男士改建議只圈(circle)最難的字。全部畫底線是已經失敗的方法；對話沒有提到把會的字劃掉(cross)。選 C"},
{n:23,p:2,o:["Fifty.","Ninety.","Forty."],a:2,sen:"W: How many songs are on your new album? &nbsp;M: Forty. &nbsp;W: Only forty? I heard ninety. &nbsp;M: We recorded ninety, but we picked the best forty. &nbsp;Q: How many songs are on the album?",szh:"女：你們新專輯(album)有幾首歌？　男：四十(forty)首。　女：才四十首？我聽說是九十(ninety)首。　男：我們錄(record)了九十首，但挑(pick)出最好的四十首。　問：專輯裡有幾首歌？",en:"Forty.",zh:"他們錄(record)了九十(ninety)首，但只挑(pick)最好的四十(forty)首放進專輯(album)。九十首是錄音的數量；五十是九十減四十，是沒放進專輯的歌。選 C"},
{n:24,p:2,o:["At the top of a mountain.","In the middle of the city.","At the bottom of a mountain."],a:0,sen:"W: What a view! We can see the whole city from up here. &nbsp;M: It was a long climb, though. &nbsp;W: But it was worth it. &nbsp;M: Let's take a picture before it starts to rain. &nbsp;Q: Where are the speakers?",szh:"女：好棒的景色(view)！從這上面可以看到整座城市。　男：不過(though)爬(climb)得好久。　女：可是很值得。　男：趁還沒下雨(rain)，我們拍張照吧。　問：說話者在哪裡？",en:"At the top of a mountain.",zh:"他們爬(climb)了很久，從上面能看到整座城市的景色(view)，所以是在山頂。城市是他們往下看到的地方，不是他們所在之處；爬了很久才到上面，不是在山腳。選 A"},
{n:25,p:2,o:["He thinks he could do better.","He is happy because everyone clapped.","He thinks nobody heard his song."],a:0,sen:"W: Everyone clapped for you, Paul. &nbsp;M: Yeah, but my guitar sounded wrong. &nbsp;W: I didn't hear anything wrong. &nbsp;M: I forgot the second line, too. &nbsp;W: Nobody noticed. The song sounded lovely. &nbsp;M: I noticed. Next time, I'll practice every day. &nbsp;Q: How does the man feel about his show?",szh:"女：Paul，大家都為你鼓掌。　男：對(yeah)，可是我的吉他聽起來不對勁。　女：我沒聽到任何不對的地方。　男：我也忘了第二句歌詞。　女：沒有人注意到。那首歌聽起來很棒。　男：我注意到了。下次我會每天練習。　問：男士覺得他的表演怎麼樣？",en:"He thinks he could do better.",zh:"雖然大家都鼓掌，但男士說吉他聽起來不對勁、忘了歌詞，還說下次要每天練習，表示他覺得自己可以做得更好。大家鼓掌的是別人的反應，他自己並不開心；沒人注意到的是他的錯誤，不是他的歌沒人聽到。選 A"},
{n:26,p:3,pic:true,o:[BARS("Music Students",["Guitar","Piano","Drums"],[50,80,20]),BARS("Music Students",["Guitar","Piano","Drums"],[80,50,20]),BARS("Music Students",["Guitar","Piano","Drums"],[80,20,50])],a:1,sen:"Our town has a private music school with three programs: guitar, piano, and drums. Last year, the piano program had the most students. This year, a famous singer visited and played the guitar, so more kids now want to learn the guitar than the piano. In addition, the drums are still the least popular, because they are too loud for most homes. &nbsp;Q: Which chart shows the students this year?",szh:"我們鎮上有一間私立(private)音樂(music)學校，有三種課程(program)：吉他、鋼琴和鼓。去年鋼琴班學生最多。今年有位知名歌手(singer)來訪並彈了吉他，所以現在想學吉他的孩子比鋼琴多。此外(in addition)，鼓還是最不受歡迎，因為對大多數家庭來說太吵了。　問：哪張圖是今年的學生人數？",en:"Guitar most, piano second, drums least.",zh:"今年學吉他的比鋼琴多，鼓仍然最少，所以吉他最高、鋼琴第二、鼓最低。鋼琴最高的那張是去年的情形；鼓排第二的那張和「鼓還是最不受歡迎」相反。選 B"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27b'),PH('q27c')],a:2,sen:"Ben loves art, and he wants to be an artist one day. For the town show, he planned to play the guitar, but he can't sing, so he gave up that plan. His mother has an old piano, but Ben thinks it is an instrument for a real musician. So now he will draw a comic about a girl and her doll for the art show. &nbsp;Q: What will Ben do for the show?",szh:"班熱愛美術(art)，有一天想當藝術家(artist)。為了鎮上的表演(show)，他本來打算(plan)彈吉他，但他不會唱歌(sing)，所以放棄了這個計畫。他媽媽有一台舊鋼琴，但班覺得那是真正的音樂家(musician)才用的樂器(instrument)。所以現在他要為美術展畫一本關於女孩和她的玩偶(doll)的漫畫(comic)。　問：班要為這場表演做什麼？",en:"He will draw a comic.",zh:"班放棄了彈吉他的計畫(plan)，也覺得鋼琴是給真正音樂家(musician)用的樂器(instrument)，所以現在他要為美術展畫(draw)漫畫(comic)。選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28a'),PH('q28c')],a:2,sen:"Yesterday my brother wanted to record a video of himself singing a new song. First, he tried the bathroom, but the sound came out all wrong. Then he went out to the yard, but it started to rain. In the end, he sat in Dad's car and sang there, and the sound was perfect. &nbsp;Q: Where did the brother record the song in the end?",szh:"昨天我哥哥想錄(record)一段自己唱(sing)新歌(song)的影片。他先在浴室試，但聲音聽起來全不對(wrong)。然後他到院子去，可是開始下雨(rain)了。最後他坐在爸爸的車裡唱，聲音完美。　問：哥哥最後在哪裡錄歌？",en:"In his dad's car.",zh:"浴室因為聲音不對(wrong)放棄；院子因為下雨(rain)放棄；最後坐在爸爸車裡錄(record)，聲音很完美。要聽 In the end 之後的地點。選 C"},
{n:29,p:3,pic:true,o:[PH('q29b'),PH('q29c'),PH('q29a')],a:0,sen:"Mr. Wu is a painter. He usually paints in a private room at home, but this summer it's too hot in there. He tried painting in the park, but too many people stopped to watch him. So now he gets up early and paints by the lake, before the sun gets hot. &nbsp;Q: Where does Mr. Wu paint now?",szh:"吳先生是一位畫家(painter)。他平常在家裡的私人(private)房間畫畫，但今年夏天那裡太熱(hot)了。他試過在公園畫，可是太多人停下來看他。所以現在他早起，趁太陽還不熱時到湖邊畫畫。　問：吳先生現在在哪裡畫畫？",en:"By the lake.",zh:"家裡的私人(private)房間因為太熱(hot)不用了；公園因為圍觀的人太多也放棄；現在是早起到湖邊畫。家裡是「平常」的地方，公園是「試過」的地方，都不是現在。選 A"},
{n:30,p:3,pic:true,o:[PH('q30c'),PH('q30b'),PH('q30a')],a:2,sen:"At our school art show, everyone thought Amy's painting of the sea would win first prize. In the end, it came second. Ben's painting of a fox in the snow got a lot of looks, but it didn't win anything. The winner was a painting of a little girl holding a lamp in the rain. &nbsp;Q: Which painting won first prize?",szh:"在我們學校的美展(art show)上，大家都以為 Amy 那幅大海的畫(painting)會得第一名，結果它得了第二名。Ben 那幅雪中狐狸(fox)的畫很多人看，但沒有得獎。冠軍是一幅小女孩在雨(rain)中提著燈(lamp)的畫。　問：哪一幅畫得到第一名？",en:"The little girl holding a lamp in the rain.",zh:"大家原本以為大海那幅會得第一，結果它是第二名；雪中狐狸(fox)那幅沒有得獎；第一名是小女孩在雨(rain)中提燈(lamp)的畫(painting)。選 C"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 7 回　音樂與美術　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
