<script>
/* 圖形素材（第7回 音樂與美術） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/7/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const GUITAR=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q1.jpg" alt="question 1 picture">`;
const PALETTE=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q2.jpg" alt="question 2 picture">`;
const MIC=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q3.jpg" alt="question 3 picture">`;
const NOTE=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q4.jpg" alt="question 4 picture">`;
const COMIC=`<img class="pic-img p0img" src="gept-listening-img/7/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:GUITAR,o:["The boy plays a computer game.","The boy plays a musical instrument.","The boy plays a card game."],a:1,sen:"For question one, look at the picture. What is the boy playing?",szh:"第一題，請看圖片。男孩在彈什麼？",en:"He plays a musical instrument.",zh:"男孩演奏的是樂器(instrument)，選 B。A、C 都是 plays a ... game，只有 B 是樂器。"},
{n:2,p:0,fig:PALETTE,o:["The painter is painting a wall.","The painter is making a painting.","The painter is taking a photo."],a:1,sen:"For question two, look at the picture. What is the painter doing?",szh:"第二題，請看圖片。畫家在做什麼？",en:"The painter is making a painting.",zh:"畫家(painter)正在畫一幅畫(painting)，選 B。A 是粉刷牆壁，雖然也有 painting 的動作，但不是畫作。"},
{n:3,p:0,fig:MIC,o:["She plays the guitar on stage.","She tells a joke on stage.","She sings a song on stage."],a:2,sen:"For question three, look at the picture. What is the woman doing?",szh:"第三題，請看圖片。女士在做什麼？",en:"She sings a song on stage.",zh:"女士在台上唱(sing)歌(song)，選 C。A 彈吉他也是音樂活動，但不是圖中的動作。"},
{n:4,p:0,fig:NOTE,o:["A program for drawing pictures.","A program for learning English.","A program for recording songs."],a:2,sen:"For question four, look at the picture. What kind of program is this?",szh:"第四題，請看圖片。這是什麼樣的節目？",en:"A program for recording songs.",zh:"這是用來錄(record)歌的程式(program)，選 C。A 是畫圖、B 是學英文，程式種類不同。"},
{n:5,p:0,fig:COMIC,o:["The child is reading a comic book.","The child is reading a newspaper.","The child is reading a cookbook."],a:0,sen:"For question five, look at the picture. What is the child reading?",szh:"第五題，請看圖片。孩子在讀什麼？",en:"The child is reading a comic book.",zh:"孩子讀的是漫畫書(comic)，選 A。B 報紙、C 食譜都是閱讀物，但不是圖中的書。"},

{n:6,p:1,o:["It starts at two o'clock on Friday.","The art room is on the second floor.","I'll paint a picture with a big brush."],a:2,sen:"What is your plan for the school art show?",szh:"你對學校美術展有什麼計畫？",en:"I'll paint a picture with a big brush.",zh:"問美術展(art show)的計畫(plan)，答『我會用大畫筆(brush)畫一幅畫』，選 C。A 回答時間，B 回答地點。"},
{n:7,p:1,o:["Yeah, but I forgot the words.","Because I like the music.","The song is on that new album."],a:0,sen:"Can you sing this new song for us?",szh:"你能為我們唱這首新歌嗎？",en:"Yeah, but I forgot the words.",zh:"問能不能唱(sing)這首歌，答『好啊(yeah)，但我忘了歌詞』，選 A。B 答的是原因，C 重複 song 卻沒回答能不能唱。"},
{n:8,p:1,o:["It ended at nine o'clock last night.","I think you have the wrong room.","He fell and hurt his knee."],a:2,sen:"Why did the young musician stop the concert?",szh:"年輕音樂家為什麼中斷演奏會？",en:"He fell and hurt his knee.",zh:"問音樂家(musician)為何停止演奏，答『他跌倒傷了膝蓋(knee)』，選 C。A 答時間，B(wrong)是完全無關的話。"},
{n:9,p:1,o:["She sent it to me yesterday.","A funny comic and a short note.","Please send me the link soon."],a:1,sen:"What did the artist send you?",szh:"那位藝術家寄了什麼給你？",en:"A funny comic and a short note.",zh:"問藝術家(artist)寄(send)來什麼，答『一本好笑的漫畫(comic)和一張短信』，選 B。A 回答時間，C 重複 send 卻是在要連結(link)。"},
{n:10,p:1,o:["Yeah, the snacks are really good.","It starts at six this evening.","I'll bring a gift to the party."],a:0,sen:"How do you like the buffet at the party?",szh:"你覺得派對的自助餐如何？",en:"Yeah, the snacks are really good.",zh:"問自助餐(buffet)如何，答『好啊(yeah)，點心(snack)真的很好吃』，選 A。B 答時間，C 重複 party 卻沒回答。"},
{n:11,p:1,o:["I'll be a sneaky fox.","At the school hall on Friday.","I play basketball after school."],a:0,sen:"What role will you play in the drama?",szh:"你在戲劇裡演什麼角色？",en:"I'll be a sneaky fox.",zh:"問在戲劇中演什麼角色(role)，答『我演一隻狡猾(sneaky)的狐狸(fox)』，選 A。B 答地點時間，C 重複 play 卻講運動。"},
{n:12,p:1,o:["It opens at nine tomorrow morning.","Cross the circle and push that door.","The art hall is very old and big."],a:1,sen:"Excuse me, where is the entrance to the art hall?",szh:"請問美術館入口在哪？",en:"Cross the circle and push that door.",zh:"問入口(entrance)在哪，答『穿過(cross)圓環(circle)，推(push)那(that)扇門』，選 B。A 答開放時間，C 只形容大廳。"},
{n:13,p:1,o:["It's about forty dollars, I think.","It's too rapid. That's my concern.","I like the new plan a lot."],a:1,sen:"What worries you about the new plan?",szh:"新計畫有什麼讓你擔心的？",en:"It's too rapid; that's my concern.",zh:"問對新計畫擔心什麼，答『進行太快(rapid)，這是我擔心(concern)的』，選 B。A 答價錢(forty)，C 說喜歡，沒回答擔心。"},
{n:14,p:1,o:["It was a birthday present.","The lady bought it last year.","A mirror and some powder."],a:2,sen:"What is inside the lady's purse?",szh:"這位小姐的皮包裡有什麼？",en:"A mirror and some powder.",zh:"問皮包(purse)裡有什麼，答『一面鏡子和一些粉(powder)』，選 C。A 說這是生日禮物，B 說何時買的，都沒回答裡面有什麼。"},
{n:15,p:1,o:["Because it makes life better.","In my school library, I think.","Confucius did, long ago."],a:2,sen:"Who said we should love learning?",szh:"是誰說我們應該熱愛學習？",en:"Confucius did, long ago.",zh:"問是誰說的，答『很久以前的孔子(Confucius)』，選 C。A 回答原因，B 回答地點。"},

{n:16,p:2,o:["A singer.","A painter.","A musician."],a:1,sen:"W: What does your aunt do? &nbsp;M: She is a painter; her paintings are full of art. &nbsp;W: Talented! &nbsp;Q: What is the aunt's job?",szh:"女：你阿姨做什麼工作？　男：她是畫家(painter)，她的畫作(painting)充滿藝術(art)。　女：真有才華！　問：阿姨的工作是什麼？",en:"A painter.",zh:"阿姨是畫家(painter)，畫作(painting)充滿藝術(art)，選 B。歌手和音樂家不符。"},
{n:17,p:2,o:["Pop music by young singers.","Slow music for sleeping.","Loud music for dancing."],a:0,sen:"M: What kind of music do you like? &nbsp;W: I love pop music, especially songs sung by that young singer. &nbsp;M: Me too. &nbsp;Q: What music does the woman like?",szh:"男：你喜歡什麼音樂？　女：我愛流行音樂(pop music)，特別是那位年輕歌手(singer)唱(sing)的歌(song)。　男：我也是。　問：女士喜歡什麼音樂？",en:"Pop music by young singers.",zh:"女士愛流行音樂(pop music)，特別是年輕歌手(singer)的歌，選 A。B、C 是別種音樂。"},
{n:18,p:2,o:["Blow into it.","Pull the strings.","Hit it with sticks."],a:0,sen:"W: How do I play this instrument? &nbsp;M: Put your lips here, and send air through it. &nbsp;W: Like this? &nbsp;M: Yes, but not too hard. &nbsp;Q: How do you play this instrument?",szh:"女：這個樂器(instrument)要怎麼演奏？　男：把嘴唇放在這裡，把氣送進去。　女：像這樣嗎？　男：對，但不要太用力。　問：這個樂器要怎麼演奏？",en:"Blow into it.",zh:"嘴唇靠上去、送氣進去，是用吹(blow)的方式演奏這個樂器(instrument)，選 A。拉弦和敲棒是別種樂器的演奏法。"},
{n:19,p:2,o:["A comic book.","A painting.","An album."],a:2,sen:"M: Why are the musicians still in the studio so late? &nbsp;W: They are making a CD with ten new songs. &nbsp;M: Wow, they must be tired. &nbsp;Q: What are the musicians making?",szh:"男：音樂家(musician)們為什麼這麼晚還在錄音室？　女：他們在做一張有十首新(new)歌(song)的 CD。　男：哇，他們一定很累。　問：音樂家在做什麼？",en:"An album.",zh:"音樂家(musician)們在錄音室，要做一張收錄十首新歌的 CD，就是專輯(album)，選 C。漫畫和畫作與音樂無關。"},
{n:20,p:2,o:["His tooth.","His knee.","His hand."],a:1,sen:"M: Why is Tom crying? &nbsp;W: He tried to climb up to the lamp, and he fell. &nbsp;M: Oh no. Did he hurt his tooth? &nbsp;W: No, just his knee. &nbsp;Q: What part of his body hurts?",szh:"男：湯姆為什麼在哭？　女：他想爬(climb)上去拿燈(lamp)，結果跌下來。　男：糟了，他的牙齒(tooth)受傷了嗎？　女：沒有，只有膝蓋(knee)。　問：他身體哪個部位痛？",en:"His knee.",zh:"湯姆爬(climb)去拿燈(lamp)跌下來，牙齒(tooth)沒事，只有膝蓋(knee)痛，選 B。A 是對話裡問過的陷阱。"},
{n:21,p:2,o:["The first show.","The final show.","A private show."],a:1,sen:"W: Are you going to the show again tomorrow? &nbsp;M: No. There won't be another one. Tonight is the end of the tour. &nbsp;W: Then let's enjoy it. &nbsp;Q: What kind of show is tonight's show?",szh:"女：你明天還要去看表演(show)嗎？　男：不去，不會有下一場了，今晚是巡演的最後一晚。　女：那我們好好享受吧。　問：今晚是什麼樣的表演？",en:"The final show.",zh:"沒有下一場了，今晚是巡演的結束，所以是最後(final)一場表演(show)，選 B。A 剛好相反，C 對話沒提。"},
{n:22,p:2,o:["Cross it out.","Write it twice.","Underline it."],a:2,sen:"W: I always forget this important word. &nbsp;M: Draw a line below it with a red pen. &nbsp;W: Good idea. Then I will see it easily. &nbsp;Q: What will the woman do to the word?",szh:"女：我老是忘記這個重要的字。　男：用紅筆在它下面畫一條線。　女：好主意，這樣我就容易看到了。　問：女士會對這個字做什麼？",en:"Underline it.",zh:"在字的下面畫一條線，就是畫底線(underline)，選 C。A 是劃掉，會看不見字；B 是寫兩次，不是畫線。"},
{n:23,p:2,o:["130 songs.","90 songs.","50 songs."],a:0,sen:"W: How many songs are on this album? &nbsp;M: Ninety old songs. In addition, there are forty new ones. &nbsp;W: Wow, that is a lot! &nbsp;Q: How many songs are on the album in all?",szh:"女：這張專輯(album)有幾首歌？　男：九十(ninety)首舊歌，另外(in addition)還有四十(forty)首新歌。　女：哇，好多！　問：專輯裡總共有幾首歌？",en:"130 songs in all.",zh:"舊歌九十(ninety)首，外加(addition)四十(forty)首新歌，90 + 40 = 130，選 A。B 只算舊歌，C 是 90 - 40 的錯誤算法。"},
{n:24,p:2,o:["At the beach.","On a tall building.","In a train station."],a:1,sen:"W: What a view! I can see the whole city from here. &nbsp;M: Yes, and it took only one minute to come up. &nbsp;W: That elevator is fast. Let's take some photos. &nbsp;Q: Where are the two people?",szh:"女：好美的景色(view)！從這裡能看到整座城市。　男：對，而且上來只花一分鐘。　女：那部電梯好快，我們拍些照片吧。　問：兩人在哪裡？",en:"On a tall building.",zh:"從這裡可以看到整座城市的景色(view)，電梯一分鐘就上來，所以在高樓上，選 B。海邊和車站看不到整座城市。"},
{n:25,p:2,o:["An artist who draws comics.","A painter who makes dolls.","A singer who writes songs."],a:0,sen:"W: Who is your role model? &nbsp;M: An artist who draws wonderful comics. &nbsp;W: Cool. &nbsp;Q: Who is the man's role model?",szh:"女：你的偶像是誰？　男：一位畫(draw)出很棒漫畫(comic)的藝術家(artist)。　女：真酷。　問：男士的偶像是誰？",en:"An artist who draws comics.",zh:"男士的偶像是畫漫畫(comic)的藝術家(artist)，選 A。B 的畫家做娃娃(doll)、C 的歌手寫歌，對話沒提。"},

{n:26,p:3,pic:true,o:[BARS("Album Sales",["Rock","Jazz","Pop"],[80,50,20]),BARS("Album Sales",["Rock","Jazz","Pop"],[50,80,20]),BARS("Album Sales",["Rock","Jazz","Pop"],[20,50,80])],a:0,sen:"Our music shop kept a record of album sales this month. Rock albums sold the most, because a new band became famous. Jazz was in the middle, and pop music sold the least this time, though some people still love it. So the rock bar should be the tallest. &nbsp;Q: Which chart shows the album sales?",szh:"我們音樂(music)行記錄(record)了本月專輯(album)銷量。搖滾最多，因為有新(new)樂團爆紅；爵士中等；流行音樂(pop music)這次最少，雖然(though)還是有些人喜歡。所以搖滾長條最高。　問：哪張圖顯示專輯銷量？",en:"Rock most, pop least.",zh:"搖滾最多、流行音樂(pop music)最少，所以搖滾的長條最高，選 A。爵士在中間，不是最高。"},
{n:27,p:3,pic:true,o:[BARS("Art Class",["Draw","Paint","Sing"],[30,55,80]),BARS("Art Class",["Draw","Paint","Sing"],[55,80,30]),BARS("Art Class",["Draw","Paint","Sing"],[80,55,30])],a:2,sen:"In our art program we voted for our favorite activity. Drawing got the most votes, painting was in the middle, and singing got the fewest, because this is an art class, not a music class. So the drawing bar is the highest and singing the lowest. &nbsp;Q: Which chart shows the votes?",szh:"在我們的美術課程(program)投票選最愛的活動：畫圖(draw)最多票，畫畫(paint)中等，唱歌(sing)最少，因為這是美術(art)課不是音樂課。所以畫圖最高、唱歌最低。　問：哪張圖顯示票數？",en:"Draw most, sing least.",zh:"畫圖(draw)最多票、唱歌(sing)最少，圖表是畫圖最高、唱歌最低，選 C。畫畫(painting)在中間。"},
{n:28,p:3,pic:true,o:[IMG('rice'),IMG('bread'),IMG('noodles')],a:1,sen:"After the long concert, the tired musicians wanted a snack. There was a buffet with rice and noodles, but the singer was too hungry to wait for a hot meal. So she just picked up some fresh bread, which was quick and full of value. &nbsp;Q: What did the singer eat?",szh:"漫長的演唱會後，疲累的音樂家(musician)們想吃點心(snack)。自助餐(buffet)有飯和麵，但歌手(singer)太餓，等不及熱食，於是拿起(pick up)新鮮麵包(bread)，又快又划算(value)。　問：歌手吃了什麼？",en:"Fresh bread.",zh:"歌手吃了麵包(bread)，選 B。飯、麵為干擾。"},
{n:29,p:3,pic:true,o:[IMG('noodles'),IMG('rice'),IMG('bread')],a:0,sen:"The famous artist finished his new painting and felt hungry. He did not want rice or bread that night. Instead, he took a big bowl of hot noodles from the buffet to his private studio, and he ate it while looking at his art. &nbsp;Q: What did the artist eat?",szh:"這位有名的藝術家(artist)畫完新畫作(painting)後覺得餓。那晚他不想吃飯或麵包，而是從自助餐(buffet)端了一大碗熱(hot)麵(noodles)回他私人(private)的工作室，一邊看著自己的藝術(art)一邊吃。　問：藝術家吃了什麼？",en:"A bowl of hot noodles.",zh:"藝術家吃了熱麵(noodles)，選 A。飯、麵包為干擾。"},
{n:30,p:3,pic:true,o:[IMG('mountain'),IMG('park'),IMG('beach')],a:2,sen:"The band planned a music video for their new song. The painter suggested the mountain, and a fan suggested the park. But in the end the singer chose the beach, because the sound of the waves matched the mood of the song perfectly. Luckily, it did not rain that day. &nbsp;Q: Where did the band film the music video?",szh:"樂團為新歌(song)計畫(plan)拍音樂錄影帶。畫家(painter)建議去山上，粉絲建議公園，但最後歌手(singer)選了海邊(beach)，因為海浪聲與歌曲(song)的氣氛完美契合。幸運的是那天沒下雨(rain)。　問：樂團在哪裡拍音樂錄影帶？",en:"The beach.",zh:"樂團在海邊(beach)拍攝，選 C。山、公園為干擾。"}

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 7 回　音樂與美術　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
