喪失主張限定繼承的權利。這意味著在某些情況下，即使有故意不報的行為，仍可主張限制在遺產範圍內的責任。　- 分析其他選項：　- (A) 繼承人隱匿遺產情節重大，這會影響其主張的權利。　- (B) 如果繼承人故意詐害債權人，則不被允許主張限定繼承。　- (C) 虛偽記載情節重大，亦會影響到繼承人的權利。　透過上述分析，能清楚理解何種情形下繼承人仍可主張限定繼承，以及相關的法律規定與義務。　:"],"sel":1,"yr":114},{"s":"22 有關民法監護之相關規定，下列敘述何者正確？","o":{"A":"監護人代理受監護人處分動產，非經法院許可，不生效力","B":"意定監護契約約定報酬者，不生效力","C":"監護人有正當理由，即得辭任其職務","D":"法院選定或改定監護人時，得選定法人為監護人"},"a":"D","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["民法§1101：監護人對受監護人財產之權義3~限制　1.監護人對於受監護人之財產，非為受監護人之利益，不得使用、代為或同意處分。　2.監護人為下列行為，非經法院許可，不生效力：　一、代理受監護人購置或處分不動產。　二、代理受監護人，就供其居住之建築物或其基地出租、供他人使用或終止租賃。　3.監護人不得以受監護人之財產為投資。但購買公債、國庫券、中央銀行儲蓄券、金融債券、可轉讓定期存單、金融機構承兌匯票或保證商業本票，不在此限。　A：僅不動產處分需法院許可。　民法§1113-7：意定監護人之報酬　意定監護契約已約定報酬或約定不給付報酬者，從其約定；未約定者，監護人得請求法院按其勞力及受監護人之資力酌定之。　B：意定監護可約定報酬。　民法§1095：監護人辭職　監護人有正當理由，經法院許可者，得辭任其職務。　C：尚需經法院許可方能辭職。　民法§1094-1：法院選定或改定監護人應注意事項　法院選定或改定監護人時，應依受監護人之最佳利益，審酌一切情狀，尤應注意下列事項：　一、受監護人之年齡、性別、意願、健康情形及人格發展需要。　二、監護人之年齡、職業、品行、意願、態度、健康情形、經濟能力、生活狀況及有無犯罪前科紀錄。　三、監護人與受監護人間或受監護人與其他共同生活之人間之情感及利害關係。　四、法人為監護人時，其事業之種類與內容，法人及其代表人與受監護人之利害關係。　D：正確　:","1. 正確選項解析：(D) 法人可擔任監護人　法律依據： 根據來源中 《民法》第 1094-1 條第 4 款 及 第 1111-1 條第 4 款 均明文提到：「法人為監護人時，其事業之種類與內容，法人及其代表人與受監護人之利害關係。」。　詳細解析： 法律明確承認「法人」（例如社會福利機構或機關）具備擔任監護人的資格。當法院在選定或改定監護人時，若認為選定法人最符合受監護人之最佳利益，依法得選定法人為監護人。　2. 其他錯誤選項解析：　(A) 處分「動產」原則上不需法院許可 —— 錯誤　法律依據： 根據 《民法》第 1101 條第 2 項 規定，監護人代理受監護人處分財產時，僅在「處分不動產」或「就供居住之建築物出租、供他人使用或終止租賃」等特定行為時，才需要經過法院許可。　解析： 對於一般的「動產」（如販售二手物或小額存款運用），法律並未強制要求必須經法院許可才生效。選項 (A) 稱處分動產亦須法院許可，是不正確的。　(B) 意定監護契約得約定報酬 —— 錯誤　法律依據： 根據 《民法》第 1113-7 條 規定：「意定監護契約已約定報酬或約定不給付報酬者，從其約定；未約定者，監護人得請求法院按其勞力及受監護人之資力酌定之。」。　解析： 意定監護充分尊重當事人的契約自由，因此約定報酬是合法的行為，並非不生效力。　(C) 辭任職務須「經法院許可」 —— 錯誤　法律依據： 根據 《民法》第 1095 條 規定：「監護人有正當理由，經法院許可者，得辭任其職務。」。　解析： 監護人不能僅因自己有正當理由就「自動」離職，必須向法院提出聲請並獲得「法院許可」後才能卸任。選項 (C) 漏掉了「經法院許可」這一關鍵法律要件。　總結　本題考點在於監護制度的執行細節。最主要的關鍵在於 《民法》明文承認法人可以擔任監護人 (D)；而 (A) 處分許可限於不動產、(B) 意定監護可約定報酬 以及 (C) 辭任必須經過法院點頭。　:"],"sel":1,"yr":114},{"s":"21 依民法規定，下列收養行為何者無效？","o":{"A":"收養人未與配偶共同收養","B":"除夫妻共同收養外，養子女同為二人之養子女","C":"有配偶之被收養人，被收養時未得其配偶之同意","D":"滿 7 歲之未成年人被收養，未得法定代理人同意"},"a":"B","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["民法§1074：夫妻應為共同收養　1.夫妻收養子女時，應共同為之。但有下列各款情形之一者，得單獨收養：　一、夫妻之一方收養他方之子女。　二、夫妻之一方不能為意思表示或生死不明已逾三年。　A：視情況夫妻一方可單獨收養。　ㅤㅤ　民法§1075：同時為二人養子女之禁止　除夫妻共同收養外，一人不得同時為二人之養子女。　B：養父母二人必須為夫妻。　ㅤㅤ　民法§1076：被收養者配偶之同意　夫妻之一方被收養時，應得他方之同意。但他方不能為意思表示或生死不明已逾三年者，不在此限。　C： 符合但書則收養仍有效。　ㅤㅤ　民法§1076-2：未滿七歲及滿七歲之被收養者應得其法定代理人之同意　1.被收養者未滿七歲時，應由其法定代理人代為並代受意思表示。　2.滿七歲以上之未成年人被收養時，應得其法定代理人之同意。　3.被收養者之父母已依前二項規定以法定代理人之身分代為並代受意思表示或為同意時，得免依前條規定為同意。　D：得生父母同意亦可。　:","1. 題目解析　題目詢問依據《民法》規定，哪一項收養行為是無效的。收養是一種法律行為，涉及到多方的權利與義務，必須遵循法律的規定。選項中提到了收養的各種情況，包括收養人、被收養人及其配偶的同意等問題。選項 B 明確指出「除了夫妻共同收養以外，養子女同為二人之養子女」，這意味著同一個孩子不能同時被兩對夫婦收養，因此這一行為被認為是無效的。　2. 解題步驟　1. 逐一分析每個選項：　- (A) 收養人未與配偶共同收養：根據《民法》規定，配偶可以共同收養，但未必必須共同收養，因此該行為是有效的。　- (B) 除夫妻共同收養外，養子女同為二人之養子女：該行為無法成立，因為法律不允許同一個孩子同時被兩個不同的家庭收養，故此選項是無效的。　- (C) 有配偶之被收養人，被收養時未得其配偶之同意：根據法律，被收養人需獲得配偶的同意，否則該收養行為會受到限制，但不等於無效。　- (D) 滿 7 歲之未成年人被收養，未得法定代理人同意：未成年人收養必須得到法定代理人的同意，否則收養行為無效，但在此情況下是未成年人，且需考量具體情況。　2. 選擇正確答案：　- 經過以上分析，選項 B 是唯一一個明顯無效的收養行為，因為法律禁止同時存在的雙重收養。　3. 相關概念說明　- 收養的法律規範：根據《民法》中的相關規定，收養行為必須遵循法定程序，並且在特定情況下需要獲得配偶或法定代理人的同意。收養的目的在於建立法律上的親子關係，這不僅涉及權利的轉移，也關乎家庭的法律結構。　- 共同收養：在法律上，夫妻一般應該共同收養一名孩子，這是出於家庭穩定性和對小孩的保障。　- 收養的同意要求：被收養人及其配偶在收養過程中必須提供同意，以確保該行為的合法性及有效性。　4. 注意事項　- 在進行收養時，必須詳細了解相關法律條款，尤其是對於收養的雙方資格、同意及程序要求。　- 任何違反法律規定的收養行為可能會被認定為無效，並可能導致法律糾紛。　- 收養是一個慎重的法律行為，涉及到人生的重大轉變，建議在有需要時諮詢專業的法律意見。　:"],"sel":1,"yr":114},{"s":"19 甲今年 70 歲，其妻已去世，只剩甲一人。又甲之子女平日對甲刻薄，令甲心寒，因此想將遺產贈與其知心好友乙。甲詢問過律師後，得知欲完成遺囑，需有見證人。請問下列何者得為甲之遺囑見證人？","o":{"A":"今年已 16 歲但已在社會上歷練之路人丙","B":"平時跟甲並無交集，彼此並不相識之乙之配偶丁","C":"平常都會到甲家中探望甲，跟甲關係良好之社工戊","D":"每年過年都會回甲家中拜年，有血緣關係之已成年長孫辛"},"a":"C","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["民法　第 1198 條　下列之人，不得為遺囑見證人：　一、未成年人。A　二、受監護或輔助宣告之人。　三、繼承人及其配偶或其直系血親。BD　四、受遺贈人及其配偶或其直系血親。　五、為公證人或代行公證職務人之同居人助理人或受僱人。　:","這題是考 民法有關「遺囑見證人資格限制」（民法第1183條、第1184條），　屬於「繼承篇」的經典題。以下用白話+條文逐步解釋 ?　? 一、題目重點　甲想立遺囑（遺產要給好友乙），需要有「見證人」。　問：以下誰可以當見證人？　? 二、法條重點（民法第1183、1184）　? 《民法第1183條》：不得為遺囑見證人者：　1️⃣ 未滿二十歲者　2️⃣ 受監護或輔助宣告之人　3️⃣ 利害關係人（包含受遺贈人、其配偶、直系血親及家屬）　? 《民法第1184條》：　遺囑見證人必須明瞭立遺囑之意思，且能確實證明其事實。　➡️ 意思是：　見證人要有「完全行為能力」＋「沒有利害關係」。　? 三、逐項分析　(A) 今年16歲、已在社會上歷練的路人丙　❌ 不行　未滿20歲 → 依法屬限制行為能力人，不能當遺囑見證人（§1183Ⅰ①）。　即使成熟、有社會經驗，也不符法律年齡。　(B) 平時不認識甲，但為乙（受遺贈人）的配偶丁　❌ 不行　乙是受遺贈人 → 丁是乙的配偶，屬「受遺贈人之配偶」，　? 依 §1183Ⅰ③ → 有利害關係，不得為見證人。　(C) 平常探望甲、與甲關係良好的社工戊　✅ 可以　戊既非受遺贈人、也無親屬關係，且有行為能力、理解力充足，　完全符合「可當見證人」條件。　(D) 有血緣關係的成年長孫辛　❌ 不行　雖然成年（有行為能力），　但辛是甲的直系血親（孫為直系血親卑親屬），　? 依 §1183Ⅰ③ → 「受遺贈人之直系血親」及「立遺囑人之直系血親」皆不得為見證人。　✅ 四、正確答案：(C) 社工戊　? 五、考試重點整理表　類別　可否為見證人　理由　未滿20歲者　❌　無行為能力（§1183Ⅰ①）　利害關係人（受遺贈人、其配偶、直系血親、家屬）　❌　利益衝突（§1183Ⅰ③）　受監護／輔助宣告者　❌　理解能力不足（§1183Ⅰ②）　無關社工、朋友、鄰居　✅　無利害關係、具行為能力　✅ 結論：　本題答案為 (C)。　社工戊沒有利害關係、具完全行為能力，　可合法擔任甲之遺囑見證人。　:"],"sel":1,"yr":114},{"s":"18 依民法規定，下列所敘述之債權債務法律關係，何者錯誤？","o":{"A":"甲至乙開設之模型店選購商品，翻閱型錄相中某絕版模型，乙表示願意免費贈送，然甲、乙二 人均不知該模型早在數月前因失火而燒毀，雙方仍就該模型成立贈與契約，該贈與契約為無效","B":"丙為古董商，某日在朋友丁家中發現某幅名畫真跡，未經丁之同意，丙和戊訂定該名畫之買賣 契約，該買賣契約為效力未定","C":"甲在庚所有之精品店看中水晶吊飾一組，欲作為送給友人的結婚禮物，甲當場付清價金，並約定下週將水晶吊飾送至婚宴會場，豈料當晚隨即發生大地震，水晶吊飾全毀，甲可向庚請求返 還已交付之價金","D":"辛為飲料店店員，某日顧客壬點餐並完成付款，辛將飲料製作完畢並放置取餐櫃檯，壬拿取飲料後，不慎將該飲料摔破，辛無須另給付一杯飲料給壬，且壬不得要求退款"},"a":"B","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["這題考的是 「民法債之關係的效力—契約的成立與效力（標的存在、權利能力、標的物滅失等）」。　我們用白話方式把每個選項講清楚?　?(A)　甲至乙店選某模型，乙願免費贈送，但雙方都不知道模型早已燒毀。仍成立贈與契約。　? 依民法第246條第1項：　因標的物滅失或法律上不能給付者，契約為無效。　➡️ 模型早已燒毀 → 給付不可能（客觀不能），　即使雙方都不知道 → 贈與契約無效。　✅ 本選項正確。　?(B)　丙（古董商）在丁家發現名畫，未經丁同意，就與戊訂買賣契約。　? 依民法：　出賣他人之物之買賣（即無權處分），為「效力未定」契約。　但必須是「出賣人自以為自己有權出賣」或「第三人同意後生效」。　⚠️ 本題中：　丙 明知該畫屬丁所有（不是自己的）；　並「未經丁同意」就與戊簽約。　這樣的契約 並非效力未定，而是無效（因丙根本無權且故意違法）。　? 實務見解：　若明知為他人之物仍擅自出賣 → 為無效契約，　若誤認為為己有之物 → 才是「效力未定」。　❌ 所以 (B) 錯誤。　?(C)　甲買水晶吊飾，付款完畢但尚未交付，當晚地震毀損，甲可否要回錢？　? 原則：　給付標的物滅失前，尚未移轉所有權與風險，風險由出賣人負擔。　➡️ 因地震屬不可歸責事由，　但標的毀損時尚未交付 → 風險仍在賣方庚。　故甲可請求返還價金。　✅ (C) 正確。　?(D)　顧客壬拿飲料後摔破，是否還可要求重做？　? 原則：　交付完成 → 風險移轉至買受人。　飲料放櫃檯 → 顧客取走時即「交付完成」。　➡️ 拿到後摔破 → 壬自己負責。　賣方辛無須再給新飲料。　✅ (D) 正確。　✅ 最終結論：　選項　判斷　理由　(A)　✅ 正確　標的物滅失 → 契約無效 (§246Ⅰ)　(B)　❌ 錯誤　明知他人之物仍出賣 → 無效，不是效力未定　(C)　✅ 正確　地震滅失但未交付 → 風險在賣方，可退錢　(D)　✅ 正確　顧客取走後摔壞 → 風險歸買方，不得重給　✅ 正確答案：B　? 重點記法：　「出賣他人之物」若不知情 → 效力未定；　「明知他人之物」仍賣 → 無效！　:","民法§246：契約標的給付不能之效力　1.以不能之給付為契約標的者，其契約為無效。但其不能情形可以除去，而當事人訂約時並預期於不能之情形除去後為給付者，其契約仍為有效。　2.附停止條件或始期之契約，於條件成就或期限屆至前，不能之情形已除去者，其契約為有效。　A：絕版模型已在契約成立前滅失，屬於自始給付不能之物。以該模型為標的物之買賣契約無效。　ㅤㅤ　民法§348：出賣人之移轉財產權及交付標的物之義務　1.物之出賣人，負交付其物於買受人，並使其取得該物所有權之義務。　2.權利之出賣人，負使買受人取得其權利之義務，如因其權利而得占有一定之物者，並負交付其物之義務。　B：買賣契約的成立不以對物有無處分權為要件。故丙戊間以丁之名畫為標的之買賣契約仍有效。雙方都有給付與賠償的法律義務。　ㅤㅤ　民法§225：給付不能之效力1~免給付義務與代償請求權之發生　1.因不可歸責於債務人之事由，致給付不能者，債務人免給付義務。　2.債務人因前項給付不能之事由，對第三人有損害賠償請求權者，債權人得向債務人請求讓與其損害賠償請求權，或交付其所受領之賠償物。　民法§266：危險負擔~債務人負擔主義　1.因不可歸責於雙方當事人之事由，致一方之給付全部不能者，他方免為對待給付之義務；如僅一部不能者，應按其比例減少對待給付。　2.前項情形，已為全部或一部之對待給付者，得依關於不當得利之規定，請求返還。　C：正確。水晶吊飾因不可歸責於當事人之事由滅失，雙方依法皆無給付義務。　ㅤㅤ　民法§373：標的物利益與危險之承受負擔　買賣標的物之利益及危險，自交付時起，均由買受人承受負擔，但契約另有訂定者，不在此限。　D：辛已將飲料交與壬，完成給付義務。飲料的所有風險由壬自行承擔。　:"],"sel":1,"yr":114},{"s":"15 下列有關法律行為效力之敘述，何者錯誤？","o":{"A":"拍賣，因拍賣人拍板或依其他慣用之方法為賣定之表示而成立","B":"配偶於其子女出生登記前，以口頭約定子女應從母姓，該法律行為有效","C":"子女被收養時，應得其父母之同意，倘該同意未作成書面並經公證，不生法律上效力","D":"不動產物權，依法律行為而取得、設定、喪失及變更者，如未經登記，不生法律上效力"},"a":"B","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["第 1059 條　父母於子女出生登記前，應以書面約定子女從父姓或母姓。未約定或約定不成者，於戶政事務所抽籤決定之。　子女經出生登記後，於未成年前，得由父母以書面約定變更為父姓或母姓。　:","民法§391：拍賣之成立　拍賣，因拍賣人拍板或依其他慣用之方法為賣定之表示而成立。　A：正確。　民法§1059：子女之姓　1.父母於子女出生登記前，應以書面約定子女從父姓或母姓。未約定或約定不成者，於戶政事務所抽籤決定之。　2.子女經出生登記後，於未成年前，得由父母以書面約定變更為父姓或母姓。　3.子女已成年者，得變更為父姓或母姓。　4.前二項之變更，各以一次為限。　5.有下列各款情形之一，法院得依父母之一方或子女之請求，為子女之利益，宣告變更子女之姓氏為父姓或母姓：　一、父母離婚者。　二、父母之一方或雙方死亡者。　三、父母之一方或雙方生死不明滿三年者。　四、父母之一方顯有未盡保護或教養義務之情事者。　B：必須以書面約定。　民法§1076-1：子女被收養應徵得父母同意　1.子女被收養時，應得其父母之同意。但有下列各款情形之一者，不在此限：　一、父母之一方或雙方對子女未盡保護教養義務或有其他顯然不利子女之情事而拒絕同意。　二、父母之一方或雙方事實上不能為意思表示。　2.前項同意應作成書面並經公證。但已向法院聲請收養認可者，得以言詞向法院表示並記明筆錄代之。　3.第一項之同意，不得附條件或期限。　C：除非收養已被法院認可才得以言詞向法院表示。　民法§758：設權登記~登記生效要件主義　1.不動產物權，依法律行為而取得、設定、喪失及變更者，非經登記，不生效力。　2.前項行為，應以書面為之。　D：正確。　:"],"sel":1,"yr":114},{"s":"14 下列原由甲所有之盜贓、遺失物中，何者之情形甲不得向現占有人請求回復？","o":{"A":"因遭乙盜竊而喪失占有 1 年，今 820 條　共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。　依前項規定之管理顯失公平者，不同意之共有人得聲請法院以裁定變更之。　前二項所定之管理，因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之。　共有人依第一項規定為管理之決定，有故意或重大過失，致共有人受損害者，對不同意之共有人連帶負賠償責任。　共有物之簡易修繕及其他保存行為，得由各共有人單獨為之。　:"],"sel":1,"yr":114},{"s":"11 甲有 A 地之所有權，甲因急需一筆資金，遂將 A 地設定地上權予乙。後乙因亦需要錢周轉，復將 A 地之地上權先設定權利抵押權予丙，後設定權利抵押權予丁。下列敘述何者正確？","o":{"A":"若甲將 A 地之所有權讓與乙，乙之地上權不因混同而消滅","B":"若乙將 A 地之地上權讓與丙，丙之權利抵押權因混同而消滅","C":"若乙將 A 地之地上權讓與丁，丁之權利抵押權因混同而消滅","D":"若甲與丁改為設定 A 地之抵押權，則丁之抵押權，於丁受讓乙之地上權時因混同而消滅"},"a":"C","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["這題考 地上權、抵押權及混同（權利消滅） 的概念，我們用 白話＋步驟分析：　1️⃣ 事實整理　甲是 A 地的所有權人　甲設定 地上權 給乙（乙取得地上權）　乙再將 地上權設定權利抵押權 給丙 → 後再設定給丁　2️⃣ 民法概念整理　(1) 地上權與混同　混同（民法第248條）指：權利人與義務人成為同一人時，權利消滅　地上權是 物權，若土地所有權人取得地上權 → 地上權消滅　(2) 抵押權與混同　抵押權是 從屬物權，從屬於主債權或主權利　若 抵押權人同時成為主權利人，因混同抵押權消滅　(3) 權利抵押權　乙將地上權設定給丙、丁 → 權利抵押權是 從屬於地上權　地上權消滅 → 權利抵押權消滅　3️⃣ 選項分析　(A) 若甲將 A 地之所有權讓與乙，乙之地上權不因混同而消滅　錯誤　理由：甲（原土地所有權人）把土地賣給乙 → 土地所有權與地上權 合於同一人 → 地上權消滅（混同）。　(B) 若乙將 A 地之地上權讓與丙，丙之權利抵押權因混同而消滅　錯誤　理由：乙將地上權讓給丙 → 丙的權利抵押權並沒有混同消滅（因抵押權是從屬於地上權的新權利）。　只有 地上權與抵押權主體合一時 才消滅　(C) 若乙將 A 地之地上權讓與丁，丁之權利抵押權因混同而消滅　正確　理由：　丁是 權利抵押權設定人（乙）之受讓人　丁若取得 地上權，就同時成為自己設定的抵押權權利人 → 因混同消滅　(D) 若甲與丁改為設定 A 地之抵押權，則丁之抵押權，於丁受讓乙之地上權時因混同而消滅　錯誤　理由：抵押權是 從屬於主債權，若甲自己設定土地抵押給丁 → 抵押權並非因乙地上權而混同消滅　只有 權利抵押權受讓者與主權利合一 才會消滅　✅ 結論：答案 C　:","第 762 條　同一物之所有權及其他物權，歸屬於一人者，其他物權因混同而消滅。但其他物權之存續，於所有人或第三人有法律上之利益者，不在此限。　如果丙的抵押權消滅，丁的順位就會遞補上來變成第一名。這會導致丙原本優先受償的權利縮水（損害所有人丙的利益）。"],"sel":1,"yr":114},{"s":"9 下列關於承攬契約、委任契約及僱傭契約之敘述，何者正確？","o":{"A":"承攬契約或委任契約中之當事人任一方均得隨時終止契約","B":"僱傭契約或承攬契約，均不以完成一定之工作為必要，即可得報酬","C":"僱傭契約或委任契約，若未經僱用人或委任人之同意，均不得將工作交由第三人完成","D":"實務上於混合契約之情形，均適用關於承攬之規定處理"},"a":"C","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["民法§511：定作人之終止契約　工作未完成前，定作人得隨時終止契約。但應賠償承攬人因契約終止而生之損害。　民法§549：委任契約之終止~任意終止　1.當事人之任何一方，得隨時終止委任契約。　2.當事人之一方，於不利於他方之時期終止契約者，應負損害賠償責任。但因非可歸責於該當事人之事由，致不得不終止契約者，不在此限。　A：承攬契約中只有定作人可隨時終止契約。　民法§482：僱傭之定義　稱僱傭者，謂當事人約定，一方於一定或不定之期限內為他方服勞務，他方給付報酬之契約。　民法§490：承攬之定義　1.稱承攬者，謂當事人約定，一方為他方完成一定之工作，他方俟工作完成，給付報酬之契約。　2.約定由承攬人供給材料者，其材料之價額，推定為報酬之一部。　B：雇傭契約不以完成特定工作為給付報酬的要件。　民法§484：勞務之專屬性　1.僱用人非經受僱人同意，不得將其勞務請求權讓與第三人，受僱人非經僱用人同意，不得使第三人代服勞務。　2.當事人之一方違反前項規定時，他方得終止契約。　民法§537：處理事務之專屬性與複委任　受任人應自己處理委任事務。但經委任人之同意或另有習慣或有不得已之事由者，得使第三人代為處理。　C：正確。原則上契約應由當事人履行，除非僱用人或委任人同意。　混合契約：　不屬於民法所規定的典型契約（如買賣、承攬、保證等民法有明確定義與法律效果的契約）。它的內容是由不同典型契約的要素混合，所組成的一個債權契約。　（來源：法律百科）　D：不一定，要看契約的具體成分。　:","這題在考 承攬契約、委任契約與僱傭契約的特性，我們可以逐一分析各選項：　(A) 承攬契約或委任契約中之當事人任一方均得隨時終止契約　錯誤。　理由：　委任契約可以隨時終止（民法第525條），但承攬契約則不可以任意終止；承攬契約通常以完成工作為給付目的（民法第484條），除非雙方約定或有法定事由，一般不能單方面隨意終止。　(B) 僱傭契約或承攬契約，均不以完成一定之工作為必要，即可得報酬　錯誤。　理由：　承攬契約：報酬通常以完成工作為條件（民法第486條）。　僱傭契約：報酬以工作時間或工作成果為依據，但並非一定要「完成某特定工作」才給付，兩者不完全相同，因此此說法不正確。　(C) 僱傭契約或委任契約，若未經僱用人或委任人之同意，均不得將工作交由第三人完成　正確。　理由：　僱傭契約與委任契約都是基於 信任與個人技能 的契約，工作通常要求由特定當事人完成。　若未經同意將工作交給第三人，屬於違反契約義務（民法第487條、529條）。　(D) 實務上於混合契約之情形，均適用關於承攬之規定處理　錯誤。　理由：　混合契約需依其主要性質判斷適用規定，不是「均一適用承攬規定」。　✅ 結論：答案為 C　:"],"sel":1,"yr":114},{"s":"8 民法有關拾得遺失物之相關規定，下列敘述何者錯誤？","o":{"A":"在公眾得出入之場所或供公眾往來之交通設備內，由其管理人或受僱人拾得遺失物者，不得請求報酬","B":"有受領權之人為特殊境遇家庭、低收入戶、中低收入戶、依法接受急難救助、災害救助，或有其他急迫情事者，拾得人得請求報酬，但不得超過其物財產上價值十分之一","C":"遺失物自通知或最後招領之日起逾 6 個月，未經有受領權之人認領者，由拾得人取得其所有權","D":"遺失物自通知或最後招領之日起 6 個月內，有受領權之人認領時，拾得人、招領人、警察或自治機關，於通知、招領及保管之費用受償後，應將其物返還之"},"a":"B","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["這題考的是 民法關於拾得遺失物的規定（民法第766條～第777條），我們逐一分析，並指出哪個選項錯誤。　題目分析　(A) 在公眾得出入之場所或供公眾往來之交通設備內，由其管理人或受僱人拾得遺失物者，不得請求報酬　✅ 正確　民法第767條第2項規定：管理人或受僱人因職務拾得物，不得請求報酬　白話：比如捷運站員工撿到手機，不能要求「撿到獎金」　(B) 有受領權之人為特殊境遇家庭、低收入戶、中低收入戶、依法接受急難救助、災害救助，或有其他急迫情事者，拾得人得請求報酬，但不得超過其物財產上價值十分之一　❌ 錯誤　民法第770條規定：拾得人 不得任意請求報酬　只有非義務管理人拾得物，得請求「合理報酬」　題目所述的「特殊家庭或急難情況」與民法規定無關，是錯誤添加　白話：報酬上限與身份無關，法律只說「合理報酬」　(C) 遺失物自通知或最後招領之日起逾6個月，未經有受領權之人認領者，由拾得人取得其所有權　✅ 正確　民法第774條第1項規定　白話：6個月後沒人來認領，拾得人可合法取得物品所有權　(D) 遺失物自通知或最後招領之日起6個月內，有受領權之人認領時，拾得人、招領人、警察或自治機關，於通知、招領及保管之費用受償後，應將其物返還之　✅ 正確　民法第774條第2項規定　白話：認領後要先付費用，才能取回物品　結論　錯誤選項：B　原因：法律並未因「特殊境遇家庭或低收入戶」而設定拾得報酬的上限；報酬概念僅限「非義務管理人合理報酬」　好記憶方法　條文　內容　白話解釋　民767　管理人或受僱人拾得物不得 條規定，生父認領非婚生子女後，不得撤銷。即使是被脅迫或詐欺而認領，為保護子女地位之安定，法律規定認領後不得撤銷。　(C) 錯誤： 根據民法第 1069 條規定，非婚生子女經認領者，其效力溯及與出生時，而非自認領時起算。但第三人已取得之權利不因此受影響。　(D) 正確： 根據民法第 1067 條第 2 項規定，認領之訴於生父死亡後，得向生父之繼承人提起；若生父無繼承人，則向社會福利主管機關提起。　:","民法§1065：認領之效力及認領之擬制及非婚生子女與生母之關係　1.非婚生子女經生父認領者，視為婚生子女。其經生父撫育者，視為認領。　2.非婚生子女與其生母之關係視為婚生子女，無須認領。　A：正確。　民法§1070：認領之效力~絕對效力　生父認領非婚生子女後，不得撤銷其認領。但有事實足認其非生父者，不在此限。　B：生父只能在可證明子女非親生才能撤銷認領。　民法§1069：認領之效力~溯及效力　非婚生子女認領之效力，溯及於出生時。但第三人已得之權利，不因此而受影響。　C：認領之效力溯及出生時，而非認領時才起算。　民法§1067：認領之請求　1.有事實足認其為非婚生子女之生父者，非婚生子女或其生母或其他法定代理人，得向生父提起認領之訴。　2.前項認領之訴，於生父死亡後，得向生父之繼承人為之。生父無繼承人者，得向社會福利主管機關為之。　D：正確。　:"],"sel":0,"yr":114},{"s":"3 甲之夢想是考上郵政人員，甲之父親乙為了使甲有認真讀書的動力，向甲表示願意先贈與甲新臺幣 100 萬元，作為甲考上國考的獎金，但若未能考上則須全部返還給乙。下列敘述何者正確？","o":{"A":"此為附停止條件之法律行為，於條件成就時，發生效力","B":"此為附停止條件之法律行為，於條件成就時，失其效力","C":"此為附解除條件之法律行為，於條件成就時，發生效力","D":"此為附解除條件之法律行為，於條件成就時，失其效力"},"a":"D","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["甲之夢想是考上郵政人員，甲之父親乙為了使甲有認真讀書的動力，向甲表示願意先贈與甲新臺幣 100 萬元，作為甲考上國考的獎金，但若未能考上則須全部返還給乙。下列敘述何者正確？　(A) 此為附停止條件之法律行為，於條件成就時，發生效力❌　(B) 此為附停止條件之法律行為，於條件成就時，失其效力❌　(C) 此為附解除條件之法律行為，於條件成就時，發生效力❌　(D) 此為附解除條件之法律行為，於條件成就時，失其效力✔️　關於附條件的法律行為，民法第99條明確區分了停止條件與解除條件：　附停止條件之法律行為，於條件成就時發生效力(效力開始)。　例如，父親承諾考上郵政人員後贈與100萬元，考上時贈與才生效。　附解除條件之法律行為，於條件成就時失其效力(效力結束)。　例如，贈與已生效，但如果某條件成就，贈與即被解除。　在本題中，乙父親表示「若甲未考上則須返還100萬元」，即條件是未考上時返還金錢，是一種條件成就時使贈與失效，屬於解除條件。　因此該行為為附解除條件之法律行為。條件為「未考上」，在條件成就時（未考上），法律行為失其效力（須返還款項）。若考上則無條件返還義務，贈與生效。　綜合以上，選項正確為 (D) 此為附解除條件之法律行為，於條件成就時，失其效力　:","好的，我們來詳細分析這題，並整理成表格，白話文解釋並提供好記憶方法。　題目情境：　甲想考上郵政人員　父親乙說：考上就給100萬；沒考上就要返還　問題：這屬於什麼條件的法律行為？條件成就時效力如何？　法律概念　條件法律行為：法律效力依附於某個「未來不確定事件」是否發生。　解除條件（附解除條件）：法律行為已發生效力，但如果條件成就，效力 消滅。　停止條件（附停止條件）：法律行為尚未發生效力，條件成就時 才生效。　本題分析：　乙先給錢，條件是「未考上需返還」　也就是說：先給錢 → 先生效 → 若條件成就（考試失敗）→ 效力消滅（錢要回來）　這就是 附解除條件。 ✅　選項分析　選項　法律名詞　條件成就時效力　正確與否　白話文解釋　A　附停止條件　條件成就 → 發生效力　❌　停止條件是「還沒生效，條件成就才生效」，本題已先生效，所以不對　B　附停止條件　條件成就 → 失效　❌　停止條件不會「先生效再失效」，所以錯　C　附解除條件　條件成就 → 發生效力　❌　附解除條件，條件成就時效力應消滅，不是發生效力　D　附解除條件　條件成就 → 失效　✅　本題情境正符合：先生效 → 條件成就（沒考上）→ 法律效果消滅（要返還）　四個好記憶例子　法律名詞　簡單例子　記憶方法　附停止條件　「考上大學就給你手機」→ 考上才拿到　「停止→先停→條件成就才生效」　附解除條件　「借錢給你，若違約要還」→ 先生效，違約就失效　「解除→先生效→條件成就就解除」　停止條件違例　「答應給禮物，但只有明年才發生效力」　「停止=等條件發生才開始」　解除條件違例　「租屋契約：房子如賣出則契約失效」　「解除=條件一旦成就→契約消滅」　好記憶口訣　「停＝等到才生效，解＝先生效，成就就消滅」　停：停止 → 還沒發生 → 等條件　解：解除 → 先生效 → 遇條件消失　結論：　正確答案：D（附解除條件，條件成就時失效） ✅　:"],"sel":0,"yr":114},{"s":"1 下列關於時效之敘述，何者正確？","o":{"A":"時效完成後，債權人即不得請求給付","B":"請求權已經時效消滅，債務人仍為履行之給付者，得以不知時效為由，請求返還","C":"時效期間，不得以法律行為加長或減短之，但得預先拋棄時效之利益","D":"消滅時效，因請求、承認、起訴而中斷"},"a":"D","acc":0,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["針對你提供的題目，我來逐一分析各選項，並說明為什麼 答案是 D。　題目核心在於 「消滅時效」（民法上規定債權請求權的有效期間限制）。　選項分析：　(A) 時效完成後，債權人即不得請求給付　❌ 錯誤。　時效完成後，債權人仍然可以請求給付，但債務人可以 以時效抗辯（第125條）。　換句話說，債權人的請求權並非自動消滅，只是債務人有權拒絕履行。　(B) 請求權已經時效消滅，債務人仍為履行之給付者，得以不知時效為由，請求返還　❌ 錯誤。　時效消滅後，如果債務人仍然自願給付（沒有受到欺詐或脅迫），通常 不能因不知時效而要求返還。　民法第125條、第227條相關規定是針對債務人主動履行的保護。　(C) 時效期間，不得以法律行為加長或減短之，但得預先拋棄時效之利益　❌ 錯誤。　民法第126條規定：時效期間可 約定延長或縮短（但有一定上限），所以說“不得加長或減短”不正確。　「得預先拋棄時效利益」是正確的，但整句話包含錯誤，因此不選。　(D) 消滅時效，因請求、承認、起訴而中斷　✅ 正確。　根據民法第130條、第131條，消滅時效會因下列情形中斷：　向債務人請求權利　債務人承認債務　提起訴訟　這正是題目所描述的情況，因此 D 為正確答案。　✅ 小結　正確答案：D　考點：消滅時效中斷規定（民法第130條、第131條）　記憶技巧：　「請承訴」三招中斷法 → 請求、承認、訴訟　:","民法§144：時效完成之效力~發生抗辯權　1.時效完成後，債務人得拒絕給付。　2.請求權已經時效消滅，債務人仍為履行之給付者，不得以不知時效為理由，請求返還；其以契約承認該債務或提出擔保者亦同。　A：債務人可拒絕給付，非債權人喪失請求權。　B：還了就是還了。　民法§147：伸縮時效期間及拋棄時效利益之禁止　時效期間，不得以法律行為加長或減短之，並不得預先拋棄時效之利益。　C：不得變更時長，也不得拋棄利益。　民法§129：消滅時效中斷之事由　1.消滅時效，因左列事由而中斷：　一、請求。　二、承認。　三、起訴。　2.左列事項，與起訴有同一效力：　一、依督促程序，聲請發支付命令。　二、聲請調解或提付仲裁。　三、申報和解債權或破產債權。　四、告知訴訟。　五、開始執行行為或聲請強制執行。　D：正確。　:"],"sel":0,"yr":114},{"s":"49 關於遺囑見證人之資格，下列何者得為遺囑見證人？","o":{"A":"未成年人","B":"遺囑執行人","C":"受遺贈人之配偶","D":"遺囑人之醫師"},"a":"B","acc":0,"law":"民法","topic":"民法","freq":0,"src":"113年 - 113-2 國營臺灣鐵路股份有限公司_從業人員甄試試題_第9階-事務員-地政管理：民法概要(總則、物權、親權與繼承)#137191","det":["有點不解醫生為何不行，醫生不在1198條不得為見證人的範圍內阿...　第 1198 條　下列之人，不得為遺囑見證人：　一、未成年人。　二、受監護或輔助宣告之人。　三、繼承人及其配偶或其直系血親。　四、受遺贈人及其配偶或其直系血親。　五、為公證人或代行公證職務人之同居人助理人或受僱人。　https://www.vac.gov.tw/cp-2195-4524-1.html"],"sel":0,"yr":113},{"s":"48 繼承開始時的效力，下列何者正確？","o":{"A":"繼承人立 寄託契約）。　抵押權「不要物」：　設定抵押權時，債務人或第三人不需要把房子或土地「移轉占有（交出來）」給債權人，抵押人依然可以繼續住、繼續使用該不動產。因此抵押權是非要物性（不要物性）。　By Gemini"],"sel":0,"yr":112},{"s":"下列何者不屬於不動產所有權移轉之要件？","o":{"A":"登記","B":"書面","C":"讓與合意","D":"交付"},"a":"D","acc":50,"law":"民法","topic":"民法","freq":0,"src":"112年 - 112 中華郵政股份有限公司_職階人員職階晉升甄試_專業職（二）晉升專業職（一）：民法概要#116847","det":["民法第758條　不動產物權，依法律行為而取得、設定、喪失及變更者，非經登記，不生效力。　前項行為，應以書面為之。"],"sel":0,"yr":112},{"s":"下列何者不屬於用益物權？","o":{"A":"典權","B":"不動產役權","C":"留置權","D":"農育權"},"a":"C","acc":50,"law":"民法","topic":"民法","freq":0,"src":"112年 - 112 中華郵政股份有限公司_職階人員職階晉升甄試_專業職（二）晉升專業職（一）：民法概要#116847","det":["四大用益物權種類　1. 地上權：　o 定義：指為了在他人土地上有建築物、其他工作物或竹木為目的，而使用他人土地的權利。　2. 農育權：　o 定義：指在他人土地上從事農、林、漁、牧業，並收取農作物或其他產物的權利。　o　3. 不動產役權：　o 定義：為了讓自己的土地（需役地）發揮更大的效益，而使用他人土地（供役地）的權利。　o　4. 典權：　o 定義：支付典價，在一定期限內占有他人的不動產，並進行使用收益的權利。期滿若原所有權人（出典人）還錢，就可以把房子贖回；若沒還錢，典權人就直接取得該不動產所有權。"],"sel":0,"yr":112},{"s":"就數人負同一債務，而對於債權人各負全部給付責任之所謂的「連帶債務」，下列敘述何者正確？","o":{"A":"連帶債務得基於當事人之默示或法律規定而成立","B":"連帶債務之債權人應同時對其債務人全體，請求全部之給付","C":"連帶債務人中之一人與債權人所為之和解契約，對他債務人不生效力","D":"連帶債務人中之一人清償其應分擔部分後，即不再負連帶責任"},"a":"C","acc":50,"law":"民法","topic":"民法","freq":0,"src":"112年 - 112 中華郵政股份有限公司_職階人員職階晉升甄試_專業職（二）晉升專業職（一）：民法概要#116847","det":["這題主要考的是 連帶債務的「絕對效力」與「相對效力」（民法第 274 條～第 279 條）：　1. 和解原則上僅具「相對效力」（選 C）：　民法第 279 條（相對效力之原則）：「就連帶債務人中之一人所生之事項，除前五條（清償、抵銷、免除、混同、消滅時效等特定事項）有規定者外，不為他債務人之利益或不利益。」　債權人與其中一名連帶債務人成立的和解契約，原則上只在他們兩人之間生效（相對效力），對其他連帶債務人不生效力。　選項（A）錯在哪裡？（經典陷阱）　民法第 272 條第 1 項：「數人負同一債務，明示對於債權人各負全部給付之責任者，為連帶債務。」　陷阱點： 契約成立的連帶債務，法律明定要 「明示」！不能僅憑「默示」推論。如果沒有明示，就必須要有 「法律明文規定」（例如第 185 條共同侵權行為）才能成立連帶債務。因此（A）選項寫「得基於默示」是錯誤的。　一句話秒記：連帶債務三要訣　1. 成立：約定要明示，不然要法定（A錯）。　2. 請求：債權人想告誰、要多少，隨便他選（B錯）。　3. 和解：原則各管各的（相對效力），不影響其他人（C對）。　4. 責任：只要外債沒清完，就算付清內部分擔額，對外依然要扛到底（D錯）。　Source by Gemini"],"sel":0,"yr":112},{"s":"甲向乙借用新臺幣 30 萬元，雙方約定週年利率為 10%，借用期限為五年。事經一年餘後，就該筆借 款之清償，下列敘述何者正確？","o":{"A":"乙無反對之意思表示時，甲始得於期前為清償","B":"即使乙為反對之意思表示，甲仍得隨時為清償","C":"甲於一個月前預告乙，即得隨時清償","D":"甲於二個月前預告乙，即得隨時清償"},"a":"A","acc":50,"law":"民法","topic":"民法","freq":0,"src":"112年 - 112 中華郵政股份有限公司_職階人員職階晉升甄試_專業職（二）晉升專業職（一）：民法概要#116847","det":["✔(A) 乙無反對之意思表示時，甲始得於期前為清償　民法 316 條　「定有清償期者，債權人不得於期前請求清償，如無反對之意思表示時，債務人 得於期前為清償。」　ㅤㅤ　×(B) 即使乙為反對之意思表示，甲仍得隨時為清償 ➜ 不得　民法 316 條　「定有清償期者，債權人不得於期前請求清償，如無反對之意思表示時，債務人 得於期前為清償。」　ㅤㅤ　×(C) 甲於一個月前預告乙，即得隨時清償 ➜ 毋庸預告　民法 204 條　「 約定利率逾週年百分之十二者，經一年後，債務人得隨時清償原本。但須於一個月前預告債權人。」　本題約定利率為10% 故無需依本條規定提前預告　ㅤㅤ　×(D) 甲於二個月前預告乙，即得隨時清償 ➜ 毋庸預告　同上開答案(C) 無須提前預告　ㅤㅤ　另補充 : 清償期，除法律另有規定或契約另有訂定，或得依債之性質或其他情形決定者外，債權人得隨時請求清償，債務人亦得隨時為清償。 (民法§315)　ㅤㅤ　ㅤㅤ"],"sel":0,"yr":112},{"s":"下列何者為「要物契約」？","o":{"A":"租賃契約","B":"使用借貸契約","C":"贈與契約","D":"承攬契約"},"a":"B","acc":50,"law":"民法","topic":"民法","freq":0,"src":"112年 - 112 中華郵政股份有限公司_職階人員職階晉升甄試_專業職（二）晉升專業職（一）：民法概要#116847","det":["下列何者為「要物契約」？　(A) 租賃契約❌　(B) 使用借貸契約✔️使用借貸，必須無償交付借用物，使用契約才能成立(民法第464條)。　(C) 贈與契約❌　(D) 承攬契約❌　民法第 464 條 (使用借貸之意義)　稱使用借貸者，謂當事人一方以物交付他方，而約定他方於無償使用後返還其物之契約。　●使用借貸之性質：　要物契約、單務契約、無償契約、不要式契約。"],"sel":0,"yr":112},{"s":"20 甲與乙結婚 2 年，兩人育有 2 名子女 A、B。某日乙離家出走並留下信箋一封，內文坦承 A、B 兩個孩子其實都不是甲受胎所生，實際親生父親為丙、丁，下列敘述何者正確？","o":{"A":"A 知悉此事時為 15 歲，但不知該如何是好，經過數年思考後，在 19 歲時決定尋找身分認同， 雖已超過自知悉其非為婚生子女之時起 2 年期間，仍可提起婚生否認之訴","B":"丁自知悉子女 B 非為甲婚生子女起 2 年內，得提起婚生否認之訴","C":"丙知悉此事，隨即向 A 表示願意養育，因丙撫育 A，A 則視為丙之婚生子女","D":"甲得提起婚生否認之訴，但須於 A、B 成年後 2 年內為之"},"a":"A","acc":50,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["?題目重點　涉及 民法第1063條（婚生否認之訴）及 第1064條（提起期間）規定。　民法第1063條第1項：　夫得於知悉其子非婚生子女之日起二年內，提起婚生否認之訴。　第1063條第3項：　子女得於成年後二年內，提起婚生否認之訴。　實務見解：　若子女於未成年時即知悉自己非婚生子女，期間並自成年時起算二年，非自知悉時起算。　✅ 正確選項解析　(A)　A知悉時為15歲，但未成年。雖自知悉起經過多年至19歲才起訴，仍在「成年後2年內」，故可提起婚生否認之訴。　? 依第1063條第3項及最高法院見解，子女未成年時知悉不影響其成年後起訴期間。　因此 A 正確。　❌ 錯誤選項解析　(B)　丁是生父，但丁不是「法律上的夫」，僅有配偶（甲）與子女有否認權。　? 丙、丁（生父）無權提起婚生否認之訴。　(C)　丙撫育A，A視丙為婚生子女。　? 撫育關係或親情不影響法律上的「婚生子女推定」，也不當然使A成為丙之婚生子女。　若要改變親子關係，需經婚生否認訴訟確定或認領程序。　(D)　甲提婚生否認訴訟，應自「知悉」起2年內，而非「A、B成年後2年內」。　? 此處時點錯誤，應為「自知悉起2年內」，故錯。　✅ 最終答案：A　? 法條依據：民法第1063條第1項、第3項；最高法院93年度台上字第317號判決。　:","民法§1063：婚生子女之推定及否認　1.妻之受胎，係在婚姻關係存續中者，推定其所生子女為婚生子女。　2.前項推定，夫妻之一方或子女能證明子女非為婚生子女者，得提起否認之訴。　3.前項否認之訴，夫妻之一方自知悉該子女非為婚生子女，或子女自知悉其非為婚生子女之時起二年內為之。但子女於未成年時知悉者，仍得於成年後二年內為之。　A：正確，A最遲在20歲（18+2）可提起否認之訴。　B：僅限夫甲、妻乙或子女A、B始得提起。　D：甲已成年，應在知悉情事後兩年內為之。　民法§1064：準正　非婚生子女，其生父與生母結婚者，視為婚生子女。　C：丙需和乙結婚，才可將A視為婚生子女。生父撫育僅有認領之效力。　甲根本綠光戰警，幫QQ...　:"],"sel":0,"yr":114},{"s":"10 10 歲之甲某日於野外拾得一塊 A 石頭，後遭乙盜取並雕刻為 A 公仔，乙另盜丙之 B 顏料塗於 A 石頭上後參展得到冠軍，由丁出新臺幣 50 萬元買下，雙方依讓與合意交付完成。下列敘述何者正確？","o":{"A":"甲為限制行為能力人，其雖拾得 A 石頭但並不會取得 A 石頭之所有權","B":"甲因事實行為原始取得 A 之所有權及占有","C":"乙將 A 石頭雕刻成 A 公仔，乙不會因加工而原始取得 A 公仔之所有權","D":"乙因附合而繼受取得 AB 合成物之所有權"},"a":"B","acc":50,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["這題考 物權取得與加工、附合的區別，我們可以用白話文一步步拆解：　情境整理：　甲：10 歲（限制行為能力人），在野外撿到 A 石頭。　乙：偷走 A 石頭，加工成 A 公仔，又偷 丙的 B 顏料，塗在 A 公仔上參展。　丁：出 50 萬買下，完成讓與交付。　我們要判斷誰的 所有權如何取得。　選項分析：　(A) 甲為限制行為能力人，其雖拾得 A 石頭但並不會取得 A 石頭之所有權　錯誤。　理由：　限制行為能力人拾得動產，只要法律上不排除拾得行為（如民法第108條、第993條）就可以取得所有權。　只要符合原始取得條件（無主物），甲就取得 A 石頭所有權。　(B) 甲因事實行為原始取得 A 之所有權及占有　正確。　理由：　拾得無主物，屬於原始取得（民法第767條）。　甲因此取得 A 石頭的所有權及占有。　(C) 乙將 A 石頭雕刻成 A 公仔，乙不會因加工而原始取得 A 公仔之所有權　部分正確，但整體不符答案。　理由：　乙偷了 A 石頭 → 偷竊物，不合法取得原始所有權。　雖然加工了 A 公仔，但因原材料不是乙的，故加工後的物所有權仍不屬於乙（民法第784條、787條）。　此選項說乙「不會因加工而取得所有權」是正確的，但核心在於「原始取得」這個說法與事實不符。　(D) 乙因附合而繼受取得 AB 合成物之所有權　錯誤。　理由：　附合或混合取得所有權必須 原材料合法 或依法計算（民法第783條、784條）。　因為乙偷了 A 石頭和 B 顏料，所以無法合法繼受 AB 合成物的所有權。　✅ 結論：正確答案 B　白話重點：　拾得無主物 → 可以取得原始所有權　偷來的東西 → 無法因加工或附合取得所有權　限制行為能力人 → 不影響拾得合法取得所有權　:","民法§802：無主物之先占　以所有之意思，占有無主之動產者，除法令另有規定外，取得其所有權。　A：無主物先占對行為人的行為能力並無特別要求，因此10歲之甲已合法取得A石頭之所有權。　B：正確。　民法§814：加工　加工於他人之動產者，其加工物之所有權，屬於材料所有人。但因加工所增之價值顯逾材料之價值者，其加工物之所有權屬於加工人。　C：加工物A公仔的價值已遠超原料A石頭，故乙原始取得A公仔之所有權。　民法§812：動產之附合　1.動產與他人之動產附合，非毀損不能分離，或分離需費過鉅者，各動產所有人，按其動產附合時之價值，共有合成物。　2.前項附合之動產，有可視為主物者，該主物所有人，取得合成物之所有權。　D：A石頭與B塗料附合而成之A公仔（AB附合物），其價值已遠超原料，故乙原始取得其附合物之所有權。　（來源：法律百科）　:"],"sel":0,"yr":114},{"s":"2 某日甲外出買菜，在步行通過斑馬線時，不幸被公車駕駛乙違規左轉且未禮讓行人之行為撞上，雖經過緊急送醫搶救仍宣告不治。甲的家中仍有 80 歲之母親丙、從小感情非常好的姊姊丁，以及甲所親生、20 歲但和甲感情不太好的兒子戊，下列敘述何者正確？","o":{"A":"丙、丁、戊，三人得向乙請求非財產上之損害賠償","B":"戊雖然與甲的感情不好，但其仍為甲所留遺產之繼承人","C":"若甲有一位與甲感情十分要好的女性朋友辛，辛也可以請求非財產上的損害賠償","D":"乙毋須負擔甲之喪葬費用"},"a":"B","acc":50,"law":"民法","topic":"民法","freq":0,"src":"114年 - 114 交通事業郵政升資考試_佐級晉員級_業務類—郵政：民法概要#133206","det":["這題考的是 民法上親屬與非財產上損害賠償（精神慰撫金）以及繼承人概念。我們逐一分析各選項：　題目情境：　甲遭乙（公車駕駛）撞死，家中有母親丙（80歲）、姊姊丁（感情好）、兒子戊（20歲，但感情不佳），另外假設甲有好朋友辛。問題是誰可以請求非財產上損害賠償，誰是繼承人，喪葬費用誰負擔等。　(A) 丙、丁、戊，三人得向乙請求非財產上之損害賠償　❌ 錯誤。　民法第195條、194條第2項規定，非財產上損害賠償（慰撫金）僅限「直系血親尊親屬或配偶」。　丙（母親） ✅　戊（兒子） ✅　丁（姊姊） ❌ → 兄弟姊妹一般不在法定可請求範圍內，即便感情好也不算法定請求人。　(B) 戊雖然與甲的感情不好，但其仍為甲所留遺產之繼承人　✅ 正確。　根據民法第1138條規定，繼承人的地位由血親和法律規定決定，與感情好壞無關。　戊是甲的直系血親子女，因此 必然為法定繼承人，可繼承甲的遺產。　(C) 若甲有一位與甲感情十分要好的女性朋友辛，辛也可以請求非財產上的損害賠償　❌ 錯誤。　非財產上損害賠償 限於法定親屬或特別認定的情況（如民法第195條特別規定），一般朋友不在可請求範圍內。　(D) 乙毋須負擔甲之喪葬費用　❌ 錯誤。　民法第197條規定，造成死亡的加害人須負擔被害人的喪葬費。　因此乙必須負擔甲的喪葬費。　✅ 結論　正確答案：B　小技巧記憶：　非財產上損害賠償（慰撫金） → 尊親屬、配偶，不包括兄弟姊妹與朋友　繼承人 → 法定血親，不論感情好壞　喪葬費 → 加害人必須負擔　:","(A) 錯誤：依民法第 194 條，不法侵害他人致死者，被害人之父、母、子、女及配偶，得請求賠償相當之金額（慰撫金）。姊姊丁非此條規定之範圍，無權請求非財產上損害賠償。　(B) 正確：戊為甲之親生兒子，感情好壞不影響其合法繼承人（第一順位）身分。　(C) 錯誤：辛為朋友，不屬於民法第 194 條規定之親屬範圍，無法請求非財產上損害賠償（但若證明有實際喪葬費用支出，可依第 192 條請求損害賠償，這不屬於慰撫金）。　(D) 錯誤：乙違規左轉肇事，屬於不法侵權行為，應負擔民事賠償責任，包括民法第 192 條規定的喪葬費用。　:"],"sel":0,"yr":114},{"s":"43 關於扶養程度與方法的規定，下列敘述何者錯誤？","o":{"A":"扶養之程度應按受扶養權利者之需要而定","B":"扶養費用之給付不能協議時由法院定之","C":"扶養之方法由當事人協議定之","D":"扶養之程度與方法一經確定即不得變更"},"a":"D","acc":50,"law":"民法","topic":"民法","freq":0,"src":"113年 - 113-2 國營臺灣鐵路股份有限公司_從業人員甄試試題_第9階-事務員-地政管理：民法概要(總則、物權、親權與繼承)#137191","det":[],"sel":0,"yr":113},{"s":"39 下列何者非屬法定離婚事由？","o":{"A":"重婚","B":"與配偶以外之人合意性交","C":"對他方為不堪同居之虐待","D":"婚後未能生育子女"},"a":"D","acc":50,"law":"民法","topic":"民法","freq":0,"src":"113年 - 113-2 國營臺灣鐵路股份有限公司_從業人員甄試試題_第9階-事務員-地政管理：民法概要(總則、物權、親權與繼承)#137191","det":[],"sel":0,"yr":113},{"s":"38 有關配偶之住所，下列敘述何者正確？","o":{"A":"由夫決定之","B":"由妻決定之","C":"由雙方共同協議之","D":"由法院依職權決定之"},"a":"C","acc":50,"law":"民法","topic":"民法","freq":0,"src":"113年 - 113-2 國營臺灣鐵路股份有限公司_從業人員甄試試題_第9階-事務員-地政管理：民法概要(總則、物權、親權與繼承)#137191","det":[],"sel":0,"yr":113},{"s":"34 關於擔保物權的敘述,下列何者正確?","o":{"A":"是為確保債權清償而設定的物權","B":"種類僅有抵押權與質權二種","C":"不須經由當事人約定即可成立","D":"僅限於不動產物權的擔保"},"a":"A","acc":50,"law":"民法","topic":"民法","freq":0,"src":"113年 - 113-2 國營臺灣鐵路股份有限公司_從業人員甄試試題_第9階-事務員-地政管理：民法概要(總則、物權、親權與繼承)#137191","det":[],"sel":0 function render(qs){cur=qs;done=0;ok=0;

 if(!qs.length){document.getElementById('list').innerHTML='<div class="empty">沒有符合條件的題目</div>';return}
 document.getElementById('list').innerHTML=qs.map((d,i)=>{
  const b=d.acc===0?'<span class="badge b-zero">從沒答對</span>':`<span class="badge b-half">答對率 ${d.acc}%</span>`;

  const det=d.det.map(x=>`<div style="margin-top:8px"><b>阿摩最佳解：</b>${x}</div>`).join('');
  return `<div class="q" id="q${i}"><div class="stem"><span class="no">${i+1}</span>
   <span class="badge b-law">${d.law}</span>${b}${s}${d.s}
   <span class="meta2">考點：${d.topic}${d.freq?'（近 6 年出現 '+d.freq+' 年）':''}　${d.src}</span></div>
   ${opts}<div class="exp" id="e${i}"><b>正解：(${d.a})</b> ${d.o[d.a]||''}${det}</div></div>`}).join('');
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>ans(b));bar()}
function ans(b){const i=+b.dataset.i,box=document.getElementById('q'+i);if(box.dataset.done)return;
 box.dataset.done=1;done++;const a=cur[i].a;
 box.querySelectorAll('.opt').forEach(o=>{o.classList.add('lock');if(o.dataset.o===a)o.classList.add('correct')});
 if(b.dataset.o===a)ok++;else b.classList.add('wrong');
 document.getElementById('e'+i).classList.add('show');bar()}
