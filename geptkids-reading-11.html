<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小學英檢 閱讀測驗　第11回</title>
<style>
  :root{
    --blue:#2ba6ff; --blue-dark:#1b7fd0;
    --coral:#ff8a5b; --amber:#ffb02e; --pink:#ff5d8f;
    --grape:#8b6bff; --mint:#22c9a0;
    --bg:#f3fbff; --card:#ffffff; --line:#e2effa;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#eafaff,#fff6ef 70%);color:#22303f;line-height:1.65;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:780px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5fd6f5,#5b9bff 50%,#a97bff);color:#fff;
    border-radius:20px;padding:26px 22px;margin-bottom:16px;box-shadow:0 10px 24px rgba(91,155,255,.32);}
  header.top h1{margin:0 0 6px;font-size:1.55rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:.94rem;opacity:.96;}
  .meta{margin-top:14px;font-size:.86rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#eafaff 70%,rgba(234,250,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.9rem;
    box-shadow:0 4px 12px rgba(43,166,255,.12);}
  .bar .track{flex:1;height:10px;background:#e7f4fd;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2ba6ff,#a97bff);transition:width .35s;}
  .bar #count{font-weight:800;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:14px;
    padding:11px 16px;margin:26px 0 6px;font-size:1.05rem;
    box-shadow:0 5px 14px rgba(0,0,0,.09);}
  .section-title.s0{background:linear-gradient(135deg,#ffb36b,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2ba6ff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#c46bff);}
  .section-desc{font-size:.86rem;color:var(--gray);margin:0 4px 10px;}

  /* ── 圖片場景卡（第一部分） ── */
  .scene{background:linear-gradient(160deg,#ffffff,#f2fbff);border:2px solid #cfeafd;
    border-radius:18px;padding:14px 16px 16px;margin:18px 0 10px;
    box-shadow:0 6px 18px rgba(43,166,255,.13);}
  .scene h3{margin:0 0 4px;color:#1b7fd0;font-size:1rem;display:flex;align-items:center;gap:8px;}
  .scene h3 .pic{background:var(--blue);color:#fff;border-radius:9px;padding:2px 10px;font-size:.82rem;}
  .scene .sub{margin:0 0 10px;font-size:.83rem;color:var(--gray);}
  .zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .zone{background:#fff;border:1.5px dashed #b9e2fb;border-radius:14px;padding:10px 10px 12px;text-align:center;}
  .zone .zt{font-size:.78rem;color:#1b7fd0;font-weight:800;margin-bottom:6px;line-height:1.35;}
  .zone .items{font-size:2.05rem;line-height:1.25;letter-spacing:2px;word-break:break-word;}
  .zone .cap{font-size:.75rem;color:var(--gray);margin-top:4px;}

  /* ── 短文卡（第二、三部分） ── */
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:6px solid var(--amber);
    border-radius:14px;padding:15px 17px;margin:14px 0;font-size:.97rem;
    box-shadow:0 4px 12px rgba(255,176,46,.1);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage p{margin:8px 0;}
  .passage table{border-collapse:collapse;width:100%;margin:9px 0;font-size:.9rem;}
  .passage th,.passage td{border:1px solid #ffe0b0;padding:6px 9px;text-align:left;}
  .passage th{background:#fff2dc;}
  .passage .note-h{font-size:.85rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .passage .big{font-size:1.15rem;font-weight:800;color:#d2691e;}
  .blank{display:inline-block;min-width:62px;border-bottom:2.5px solid var(--blue);
    text-align:center;color:var(--blue-dark);font-weight:800;}

  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin:11px 0;box-shadow:0 3px 10px rgba(43,166,255,.08);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:800;
    border-radius:9px;padding:1px 10px;margin-right:8px;font-size:.92rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:12px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:.97rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eaf7ff;}
  .opt input{margin-top:4px;accent-color:var(--blue);}
  .opt .lab{font-weight:900;color:var(--blue);min-width:20px;}
  .opt.sel{border-color:var(--blue);background:#e2f3ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  /* Y/N 兩顆並排 */
  .yn{display:flex;gap:10px;}
  .yn .opt{flex:1;justify-content:center;align-items:center;font-weight:800;padding:12px 8px;}
  .yn .opt .lab{min-width:0;font-size:1.15rem;}

  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.9rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:8px;padding:2px 11px;font-size:.8rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .en{color:#1c4f7a;background:#eef7ff;border-radius:9px;padding:6px 11px;margin:5px 0;}
  .exp .zh{color:#7a4a12;background:#fff7ea;border-radius:9px;padding:6px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff6ef 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:15px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ffa15b,#ff5d8f);
    box-shadow:0 7px 18px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:15px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:18px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2ba6ff,#c46bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,166,255,.16);}
  .result.show{display:block;}
  .result .suns{font-size:2rem;letter-spacing:4px;margin-bottom:4px;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2ba6ff,#c46bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:.95rem;}
  .result .lvl{margin-top:8px;font-weight:800;color:#1b7fd0;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:.95rem;}
  .result .bd span{font-weight:800;}
  .result .part{margin-top:12px;font-size:.88rem;color:var(--gray);}
  .hint{text-align:center;font-size:.85rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:.8rem;margin:24px 0;}
  @media(max-width:420px){ .zone .items{font-size:1.8rem;} }
</style>

<body>
<a href="geptkids-hub.html" style="position:fixed;top:12px;left:12px;background:rgba(255,255,255,.94);color:#2ba6ff;padding:7px 15px;border-radius:20px;text-decoration:none;font-size:.85rem;font-weight:800;z-index:999;box-shadow:0 3px 10px rgba(0,0,0,.15);">&#8592; 回題庫</a>
<div class="wrap">
  <header class="top">
    <h1>小學英檢　閱讀測驗　<span style="opacity:.9">第11回</span></h1>
    <p>GEPT Kids Reading　&middot;　第11回　節慶・月份・季節・數字</p>
    <div class="meta">共 3 部分、30 題　|　建議作答時間 25 分鐘　|　送出後顯示中英文解析、分數與太陽數</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="count">0 / 30</span>

  <form id="quiz"></form>

  <div class="result" id="result">

    <div class="sub" id="scoreTxt">分</div>

      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>

    <div class="part" id="rPart"></div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">送出並查看解析</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <footer>小學英檢 GEPT Kids　閱讀仿真練習　&middot;　全民補習班</footer>
</div>

<script>
/* ====== 題庫資料 ====== */
const PARTS = [{"title": "第一部分　看圖是非題（20 題）", "desc": "請看圖片，再讀句子。句子和圖片相同選 Y（Yes），不同選 N（No）。"}, {"title": "第二部分　短文填空（5 題）", "desc": "請閱讀短文，從三個選項中選出最適合填入空格的答案。"}, {"title": "第三部分　閱讀理解（5 題）", "desc": "請閱讀廣告、便條、訊息等短文，選出最適合的答案。"}];

const SCENES = {"1": {"p": "圖片 1", "t": "The Four Seasons　一年四季", "z": [{"l": "spring　春天", "e": ["🌸"], "cap": "March, April, May"}, {"l": "summer　夏天", "e": ["☀️"], "cap": "June, July, August"}, {"l": "fall　秋天", "e": ["🍂"], "cap": "September, October, November"}, {"l": "winter　冬天", "e": ["❄️"], "cap": "December, January, February"}]}, "5": {"p": "圖片 2", "t": "My Family　我家的人", "z": [{"l": "my parents　我的爸媽", "e": ["👨", "👩"], "cap": "daddy and mommy"}, {"l": "their daughter　他們的女兒", "e": ["👧"], "cap": "me"}, {"l": "their son　他們的兒子", "e": ["👦"], "cap": "my brother"}, {"l": "my cousin　我的表哥", "e": ["🧒"], "cap": "twelve years old"}]}, "9": {"p": "圖片 3", "t": "Christmas　聖誕節", "z": [{"l": "the tree　聖誕樹", "e": ["🎄"]}, {"l": "under the tree　樹下", "e": ["🎁", "🎁", "🎁"]}, {"l": "the date　日期", "e": ["📅"], "cap": "December 25"}, {"l": "in the mail　信箱裡", "e": ["💌", "💌"], "cap": "two cards"}]}, "13": {"p": "圖片 4", "t": "Sports Day Numbers　運動會號碼", "z": [{"l": "Amy's number　艾美的號碼", "e": ["🔢"], "cap": "17"}, {"l": "Ben's number　班的號碼", "e": ["🔢"], "cap": "70"}, {"l": "Nina's number　妮娜的號碼", "e": ["🔢"], "cap": "0"}, {"l": "Leo's place　里歐的名次", "e": ["🥉"], "cap": "third"}]}, "17": {"p": "圖片 5", "t": "Halloween　萬聖節", "z": [{"l": "the date　日期", "e": ["📅"], "cap": "October 31"}, {"l": "the children　小朋友", "e": ["🧛", "🧟"], "cap": "in fun clothes"}]}, "19": {"p": "圖片 6", "t": "Easter　復活節", "z": [{"l": "the Easter eggs　復活節彩蛋", "e": ["🥚", "🥚", "🥚", "🥚"]}, {"l": "Grandma　奶奶", "e": ["👵", "👓"], "cap": "wearing glasses"}]}};

const PASSAGES = {"21": "<div class=\"passage\"><h3>My Favorite Time of the Year　我最喜歡的時候</h3><p>January is the first month of the year, and December is the <span class=\"blank\">(21)</span> one. My favorite month is February, because Chinese New Year is usually in January or February. All my family comes to my grandmother's house: my parents, my uncle and his daughter, and my cousin.</p><p>Last year my grandmother gave me some money. I was so happy that I could not sleep, and at night I had a wonderful <span class=\"blank\">(22)</span> about it!</p><p>In spring I like to fly kites — tomorrow is the first day of spring. In summer I swim. In <span class=\"blank\">(23)</span> the weather is cool, and in winter it is very cold. My birthday is in March. Last year I was eleven, so this year I will be <span class=\"blank\">(24)</span> years old. My mother will make a big cake, and my father will help me write cards to all my friends. I will put them in the <span class=\"blank\">(25)</span> on Monday.</p></div>", "26": "<div class=\"passage\"><h3>🎉 SCHOOL FESTIVAL DAYS　學校活動日</h3><table><tr><th>Day 日期</th><th>What 活動</th></tr><tr><td>February 14</td><td>Card Day 卡片日</td></tr><tr><td>April 4</td><td>Children's Day 兒童節</td></tr><tr><td>June 18</td><td>Sports Day 運動會</td></tr><tr><td>November 30</td><td>Winter Party 冬季派對</td></tr></table><p class=\"big\">No school from August 1 to August 31. Enjoy your vacation! 🏖️</p><p>Come to the office if you have questions.</p></div>", "29": "<div class=\"passage\"><h3>🎂 Come to My Party!　來我的生日派對</h3><div class=\"note-h\">From: Nina</div><p>Hi! I am Nina. My birthday is on March 21.</p><p><b>When 時間:</b> Saturday, March 22　3:00 p.m. – 6:00 p.m.<br><b>Where 地點:</b> my house — No. 17, Green Street</p><p>There will be cake, games and music. Please do not take gifts — you only need your smile!</p><p>Please tell me before March 18. Thank you!</p></div>"};

"No　不同"], "a": 1, "en": "There are two cards in the mail.", "zh": "信箱 (mail) 裡有兩張卡片，不是三張，選 N。"}, {"n": 12, "p": 0, "stem": "It is spring.", "o": ["Yes　相同", "No　不同"], "a": 1, "en": "December is winter, not spring.", "zh": "十二月是冬天 (winter)，不是春天 (spring)，選 N。"}, {"n": 13, "p": 0, "stem": "Amy's number is seventeen.", "o": ["Yes　相同", "No　不同"], "a": 0, "en": "Amy's number is 17 — seventeen.", "zh": "艾美的號碼是 17，就是 seventeen，選 Y。"}, {"n": 14, "p": 0, "stem": "Ben's number is seventeen, too.", "o": ["Yes　相同", "No　不同"], "a": 1, "en": "Ben's number is 70 — seventy, not seventeen.", "zh": "班的號碼是 70（seventy 七十），不是 17（seventeen 十七）。同樣容易搞混的還有 eighteen(18)／eighty(80)、nineteen(19)／ninety(90)，選 N。"}, {"n": 15, "p": 0, "stem": "Nina's number is zero.", "o": ["Yes　相同", "No　不同"], "a": 0, "en": "Nina's number is 0 — zero.", "zh": "妮娜的號碼是 0，就是 zero，選 Y。"}, {"n": 16, "p": 0, "stem": "Leo is second.", "o": ["Yes　相同", "No　不同"], "a": 1, "en": "Leo is third — he has the third place.", "zh": "里歐是第三名 (third)，不是第二名 (second)，選 N。"}, {"n": 17, "p": 0, "stem": "Halloween is in October.", "o": ["Yes　相同", "No　不同"], "a": 0, "en": "The date is October 31.", "zh": "日期是十月三十一日，萬聖節 (Halloween) 在十月，選 Y。"}, {"n": 18, "p": 0, "stem": "There are three kids in fun clothes.", "o": ["Yes　相同", "No　不同"], "a": 1, "en": "There are only two children.", "zh": "穿著搞怪衣服的小朋友只有兩個，不是三個，選 N。"}, {"n": 19, "p": 0, "stem": "There are four Easter eggs.", "o": ["Yes　相同", "No　不同"], "a": 0, "en": "Count: four eggs.", "zh": "復活節 (Easter) 彩蛋有四顆，選 Y。"}, {"n": 20, "p": 0, "stem": "Grandma is not wearing glasses.", "o": ["Yes　相同", "No　不同"], "a": 1, "en": "Grandma IS wearing glasses.", "zh": "奶奶「有」戴眼鏡 (glasses)，句子說她沒戴，和圖片不同，選 N。"}, {"n": 21, "p": 1, "stem": "第 21 格", "o": ["late", "last", "later"], "a": 1, "en": "January is the first month and December is the last one.", "zh": "一月是第一個月，十二月就是「最後一個」the last one；late 是遲的，later 是後來。"}, {"n": 22, "p": 1, "stem": "第 22 格", "o": ["dream", "test", "word"], "a": 0, "en": "You have a dream at night /* ====== 產生畫面 ====== */
const form = document.getElementById('quiz');
const TOTAL = Q.length;
let lastPart = -1;

function sceneHtml(s){
  const zones = s.z.map(z=>{
    const cap = z.cap ? `<div class="cap">${z.cap}</div>` : '';
    return `<div class="zone"><div class="zt">${z.l}</div><div class="items">${z.e.join('')}</div>${cap}</div>`;
  }).join('');
  const sub = s.sub ? `<p class="sub">${s.sub}</p>` : '';
  return `<div class="scene"><h3><span class="pic">${s.p||'圖片'}</span>${s.t}</h3>${sub}<div class="zones">${zones}</div></div>`;
}

Q.forEach(q=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd); lastPart=q.p;
  }
  if(SCENES[q.n]){ const d=document.createElement('div'); d.innerHTML=sceneHtml(SCENES[q.n]); form.appendChild(d.firstChild); }
  if(PASSAGES[q.n]){ const d=document.createElement('div'); d.innerHTML=PASSAGES[q.n]; form.appendChild(d.firstChild); }
  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${q.stem}</div>`;
  const isYN = q.p===0;
  const box=document.createElement('div'); if(isYN) box.className='yn';
  q.o.forEach((opt,i)=>{
    const lab=document.createElement('label'); lab.className='opt'; lab.dataset.i=i;
    const letter = isYN ? 'YN'[i] : 'ABC'[i];
    lab.innerHTML=`<input type="radio" name="q${q.n}" value="${i}"><span class="lab">${letter}</span><span>${opt}</span>`;
    lab.querySelector('input').addEventListener('change',()=>{
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
      lab.classList.add('sel'); updateProgress();
    });
    box.appendChild(lab);
  });
  card.appendChild(box);
  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint');

function answeredCount(){ let c=0; Q.forEach(q=>{ if(form.querySelector(`input[name="q${q.n}"]:checked`)) c++; }); return c; }
function updateProgress(){
  const c=answeredCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  hint.textContent = c===TOTAL ? `已完成全部 ${TOTAL} 題` : (c===0 ? '尚未作答任何題目（仍可送出查看解析）' : `已作答 ${c} 題，未作答 ${TOTAL-c} 題（仍可送出）`);
}

/* 官方太陽數對照（依答對百分比） */
function suns(pct){
  if(pct>=95) return 5.0; if(pct>=90) return 4.5; if(pct>=80) return 4.0;
  if(pct>=70) return 3.5; if(pct>=60) return 3.0; if(pct>=50) return 2.5;
  if(pct>=40) return 2.0; if(pct>=30) return 1.5; return 1.0;
}
function sunStr(n){
  return '☀️'.repeat(Math.floor(n)) + (n%1 ? '🌤️' : '');
}
function levelTxt(n){
  if(n>=4) return '表現優異　Excellent!';
  if(n>=3) return '表現良好　Good job!';
  return '加油，下次表現會更好！　Keep going!';
}

submitBtn.addEventListener('click',()=>{
  let ok=0, blank=0;
  const byPart={0:[0,0],1:[0,0],2:[0,0]};
  Q.forEach(q=>{
    const sel=form.querySelector(`input[name="q${q.n}"]:checked`);
    const pick = sel ? parseInt(sel.value) : null;
    if(pick===null) blank++;
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.add('lock');
      o.querySelector('input').disabled=true;
      const i=parseInt(o.dataset.i);
      if(i===q.a) o.classList.add('correct');
      if(pick!==null && i===pick && pick!==q.a) o.classList.add('wrong');
    });
    const correct = pick===q.a; if(correct) ok++;
    byPart[q.p][1]++; if(correct) byPart[q.p][0]++;
    const exp=document.getElementById('exp'+q.n);
    const letters = q.p===0 ? 'YN' : 'ABC';
    const tag = correct ? '答對' : (pick===null ? '未作答' : '答錯');
    exp.innerHTML=`<span class="tag ${correct?'':'miss'}">${tag}　正解：${letters[q.a]}</span>
      <div class="en"><b>EN</b>&nbsp;${q.en}</div><div class="zh"><b>中</b>&nbsp;${q.zh}</div>`;
    exp.classList.add('show');
  });
  const pct=Math.round(ok/TOTAL*100);
  const s=suns(pct);
  document.getElementById('rSuns').textContent=sunStr(s);
  document.getElementById('scoreNum').textContent=pct;
  document.getElementById('scoreTxt').textContent=`分（答對 ${ok} / ${TOTAL} 題）`;
  document.getElementById('rLvl').textContent=`${s} 個太陽　${levelTxt(s)}`;
  document.getElementById('rOk').textContent=ok;
  document.getElementById('rNo').textContent=TOTAL-ok-blank;
  document.getElementById('rBlank').textContent=blank;
  document.getElementById('rPart').textContent=
    `第一部分 是非題 ${byPart[0][0]}/${byPart[0][1]}　·　第二部分 短文填空 ${byPart[1][0]}/${byPart[1][1]}　·　第三部分 閱讀理解 ${byPart[2][0]}/${byPart[2][1]}`;
  document.getElementById('result').classList.add('show');
  submitBtn.style.display='none'; hint.style.display='none'; resetBtn.style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
});

resetBtn.addEventListener('click',()=>{
  form.reset();
  Q.forEach(q=>{
    const card=document.getElementById('q'+q.n);
    card.querySelectorAll('.opt').forEach(o=>{o.classList.remove('sel','correct','wrong','lock');o.querySelector('input').disabled=false;});
    document.getElementById('exp'+q.n).classList.remove('show');
  });
  document.getElementById('result').classList.remove('show');
  submitBtn.style.display='block'; hint.style.display='block'; resetBtn.style.display='none';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
});

updateProgress();
</script>
