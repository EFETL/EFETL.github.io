<div class="bar">
 <b>🖨 第 39 回　社區與人們　聽力測驗　列印版</b>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第39回 社區與人們） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/39/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/39/p3_${n}.jpg?v=r39qnum-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const CITY=`<img class="pic-img p0img" src="gept-listening-img/39/p0_q1.jpg" alt="question 1 picture">`;
const GROUP=`<img class="pic-img p0img" src="gept-listening-img/39/p0_q2.jpg" alt="question 2 picture">`;
const JACKET=`<img class="pic-img p0img" src="gept-listening-img/39/p0_q3.jpg" alt="question 3 picture">`;
const HELICOPTER=`<img class="pic-img p0img" src="gept-listening-img/39/p0_q4.jpg" alt="question 4 picture">`;
const MASK=`<img class="pic-img p0img" src="gept-listening-img/39/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:CITY,o:["There is a colorful screen on a building, but the street is empty.","Many cars are waiting at the light between tall buildings.","There is a colorful screen on a building, and many people are crossing the street."],a:2,sen:"For question one, look at the picture. Which is true about this city?",szh:"第一題，請看圖片。關於這座城市，何者正確？",en:"There is a colorful screen on a building, and many people are crossing the street.",zh:"城市(city)高樓上有一面彩色(colorful)的大螢幕，路口有很多人正在過馬路，正確。街上滿滿都是人，不是空的；圖中看不到車子在等紅綠燈，路口都是行人。選 C"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">WINTER SALE</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Jacket</td><td style="text-align:right;font-weight:700">$400</td></tr><tr><td style="padding:4px 30px 4px 0">Scarf</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Gloves</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Mask</td><td style="text-align:right;font-weight:700">$100</td></tr></table></div>`,o:["She will have three hundred dollars left.","She will have one hundred dollars left.","She will have two hundred dollars left."],a:2,sen:"For question two, look at the picture. Amy has seven hundred dollars. She buys a jacket and a mask. How much will she have left?",szh:"第二題，請看圖片。艾咪有七百元。她買了一件外套和一個口罩。她還剩多少錢？",en:"She will have two hundred dollars left.",zh:"價目表上外套(jacket)400元、口罩(mask)100元，一共500元，700減500剩200元。剩三百元是只買外套、忘了口罩的算法；剩一百元是把口罩看成圍巾(200元)，算成花了600元。選 C"},
{n:3,p:0,fig:JACKET,o:["A man is trying on a brown winter jacket.","A brown winter jacket is hanging with a white card on it.","A brown winter jacket is lying on a table."],a:1,sen:"For question three, look at the picture. What is in the store?",szh:"第三題，請看圖片。店裡有什麼？",en:"A brown winter jacket is hanging with a white card on it.",zh:"一件棕色的冬季(winter)厚外套(jacket)掛在衣架上，前面吊著一張白色的卡片，正確。圖中沒有人在試穿；外套是掛著的，不是放在桌上。選 B"},
{n:4,p:0,fig:HELICOPTER,o:["A white helicopter is flying over the city.","A black helicopter is flying over a city by the water.","A black helicopter is flying over the city on a rainy day."],a:1,sen:"For question four, look at the picture. Which is true about the picture?",szh:"第四題，請看圖片。關於這張圖，何者正確？",en:"A black helicopter is flying over a city by the water.",zh:"一架黑色直升機(helicopter)飛在靠水邊的城市(city)上空，正確。直升機是黑色，不是白色；天空是藍天白雲，不是下雨天。選 B"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Weather Days</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="96" y="83" width="44" height="67" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="78" font-size="14" font-weight="700" text-anchor="middle">20</text><rect x="162" y="117" width="44" height="33" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="112" font-size="14" font-weight="700" text-anchor="middle">10</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Sunny</text><text x="118" y="167" text-anchor="middle">Cloudy</text><text x="184" y="167" text-anchor="middle">Rainy</text></g></svg>`,o:["There were thirty days.","There were twenty days.","There were fifty days."],a:0,sen:"For question five, look at the picture. Our group counted the weather in our city for two months. How many days were cloudy or rainy?",szh:"第五題，請看圖片。我們的團體(group)統計了城市(city)兩個月的天氣。有多少天是陰天或下雨？",en:"There were thirty days.",zh:"圖中陰天(cloudy)20天、下雨10天，加起來30天。二十天只算了陰天、漏掉下雨；五十天是把晴天30天和陰天20天加在一起，看錯項目。選 A"},
{n:6,p:1,o:["Thanks. I bought it last winter.","Sorry, I'm late again.","Why don't we go to the local library?"],a:2,sen:"I'm so bored. There's nothing to do.",szh:"我好無聊，都沒事做。",en:"Why don't we go to the local library?",zh:"對方說很無聊(bored)，建議「我們去附近(local)的圖書館好嗎？」最自然。「抱歉，我又遲到了」和無聊無關；「謝謝，我去年冬天買的」像是在回應別人稱讚東西。選 C"},
{n:7,p:1,o:["Yes, I want one.","Neither. They're both too expensive.","I bought a red one last year."],a:1,sen:"Which do you want, the red one or the blue one?",szh:"你想要哪一個，紅的還是藍的？",en:"Neither. They're both too expensive.",zh:"對方問紅的還是藍的，答「都不要(neither)，兩個(both)都太貴(expensive)了」是合理的間接回答。選擇問句不能用 Yes 回答；「我去年買過紅的」時態不對，也沒說現在要哪個。選 B"},
{n:8,p:1,o:["That's OK, but please don't make it a habit.","The late bus is always full.","Yes, I'll apologize to her."],a:0,sen:"I'm sorry I'm late again.",szh:"抱歉，我又遲到了。",en:"That's OK, but please don't make it a habit.",zh:"對方為又遲到(late)道歉，回「沒關係，但別讓它變成習慣(habit)」最自然。「好，我會向她道歉(apologize)」人物不對，道歉的是對方；「晚班公車總是(always)很擠」只是重複 late。選 A"},
{n:9,p:1,o:["I'll go to college in Taichung.","I work as an assistant in a bookstore.","It costs a lot of money."],a:1,sen:"How do you earn money for college?",szh:"你怎麼賺大學的學費？",en:"I work as an assistant in a bookstore.",zh:"問怎麼賺(earn)錢，答「我在(as)書店當助理(assistant)」才是方法。「我會去台中(Taichung)念大學」答的是地點；「它要花很多錢」說的是花費，不是怎麼賺。選 B"},
{n:10,p:1,o:["It's spelled with six letters.","Sorry, I don't know. Let's look it up.","It means a lot to me."],a:1,sen:"What's the meaning of this word?",szh:"這個字的意思是什麼？",en:"Sorry, I don't know. Let's look it up.",zh:"問單字的意思(meaning)，答「抱歉我不知道，我們查一下吧」是自然的回應。「它對我意義重大(means)」是用 mean 的另一個意思做陷阱；「它有六(six)個字母(letter)」答的是拼法，不是意思。選 B"},
{n:11,p:1,o:["Don't worry. My team lost, too.","You can take the bus at six.","Did you call the bus company?"],a:2,sen:"I lost my phone on the bus.",szh:"我把手機掉在公車上了。",en:"Did you call the bus company?",zh:"對方說手機掉(lose)在公車上，建議「你打給公車公司了嗎？」最自然。「你可以搭六點的公車」只是重複 bus；「別擔心，我們隊也輸了」是把 lost 當成「輸」的同字陷阱。選 C"},
{n:12,p:1,o:["It's about five kilograms.","Sure. Give me the heavy one.","I carried them yesterday."],a:1,sen:"Could you help me carry these boxes?",szh:"你可以幫我搬這些箱子嗎？",en:"Sure. Give me the heavy one.",zh:"對方請你幫忙(could)搬(carry)箱子，答「好啊，重的給我」最自然。「大約五公斤(kilogram)」答的是重量，沒有回應請求；「我昨天搬過了」時態不對，答非所問。選 B"},
{n:13,p:1,o:["Social studies. I want to be a teacher.","I'm in my second year.","It's a major city in the south."],a:0,sen:"What's your major at college?",szh:"你大學主修什麼？",en:"Social studies. I want to be a teacher.",zh:"問主修(major)什麼，答「社會(social)科，我想當老師」才是科目。「它是南部的主要(major)城市」是把 major 當成「主要的」，同字陷阱；「我大二」答的是年級。選 A"},
{n:14,p:1,o:["It closes at six.","At the end of this hall, on your left.","Yes, it's the nearest one."],a:1,sen:"Excuse me, where is the nearest exit?",szh:"不好意思，最近的出口在哪裡？",en:"At the end of this hall, on your left.",zh:"問最近的出口(exit)在「哪裡」，答「走廊盡頭左手邊」才是位置。「六點關門」答的是時間；用 Yes 回答 where 問句不對。選 B"},
{n:15,p:1,o:["The ticket costs ten dollars.","Yes, I printed six letters.","No, you can just show it on your phone."],a:2,sen:"Do I need to print my ticket?",szh:"我需要把票印出來嗎？",en:"No, you can just show it on your phone.",zh:"問需不需要把票印(print)出來，答「不用，在手機上出示就好」最自然。「票十元」答的是價錢；「是的，我印了六封信」只是重複 print，內容無關。選 C"},
{n:16,p:2,o:["It's too sour.","It's just right.","It's too sweet."],a:0,sen:"W: How's the lemon cake? I put in less sugar this time. &nbsp;M: Well... can I have some water? It's a bit sour. &nbsp;W: Last time you said it was too sweet! &nbsp;Q: What does the man think of the cake this time?",szh:"女：檸檬蛋糕怎麼樣？這次我少放了糖。　男：嗯……可以給我一點水嗎？有一點(bit)酸(sour)。　女：上次你說太甜了！　問：男士覺得這次的蛋糕怎麼樣？",en:"It's too sour.",zh:"男士說有點酸(sour)，還要喝水，表示他覺得太酸。「太甜」是他上次的評語；他要喝水又說酸，所以不是剛剛好。選 A"},
{n:17,p:2,o:["Twenty-five.","Six.","Twenty-six."],a:2,sen:"M: Who organized the park clean-up on Saturday? &nbsp;W: A local organization. They asked six schools to help, but only our class came. &nbsp;M: Really? How many of you went? &nbsp;W: Twenty-five students, and our teacher, of course. &nbsp;Q: Counting the teacher, how many people from the woman's class helped?",szh:"男：星期六的公園清掃是誰辦(organize)的？　女：一個當地(local)的組織(organization)。他們邀了六(six)所學校，可是只有我們班(class)去。　男：真的？你們去了幾個人？　女：二十五個學生，當然還有我們老師。　問：含老師在內，女士的班上有多少人去幫忙？",en:"Twenty-six.",zh:"二十五個學生再加上老師一人，共二十六人。六是受邀的學校數；二十五只算了學生，漏了老師。選 C"},
{n:18,p:2,o:["About three thousand.","About six thousand.","About twelve thousand."],a:0,sen:"W: How big is your hometown? &nbsp;M: It used to have about six thousand people. Now the population is only half that. &nbsp;W: Why? &nbsp;M: Most young people moved to the city for work. &nbsp;Q: How many people live in the man's hometown now?",szh:"女：你的家鄉有多大？　男：以前大約有六(six)千人，現在人口(population)只剩一半。　女：為什麼？　男：大部分(most)年輕人都搬到城市(city)工作了。　問：男士的家鄉現在住了多少人？",en:"About three thousand.",zh:"以前六千人，現在只剩一半，所以大約三千人。六千是以前的人口；一萬二千是把「一半」聽成「兩倍」。選 A"},
{n:19,p:2,o:["Choosing a gift for Dad.","Buying a jacket on sale.","Looking for a winter coat."],a:0,sen:"W: Look at this jacket. It's so fashionable! &nbsp;M: It is, but it's too expensive. And Dad has two winter coats. &nbsp;W: True. His birthday is next week. What about a hat? &nbsp;M: Good idea. He always loses his hats. &nbsp;W: The hats are on sale in the next store. &nbsp;M: Let's go and look before it gets late. &nbsp;Q: What are the speakers doing?",szh:"女：你看這件外套(jacket)，好時髦(fashionable)！　男：是啊，可是太貴(expensive)了。而且爸爸已經有兩件冬季(winter)外套。　女：也對。他下週生日。買頂帽子怎麼樣？　男：好主意。他老是弄丟帽子。　女：帽子在隔壁那家店特價。　男：我們趁還沒太晚去看看吧。　問：說話的兩個人在做什麼？",en:"Choosing a gift for Dad.",zh:"兩人嫌外套太貴(expensive)，又想到爸爸下週生日，決定改買帽子，所以是在幫爸爸挑禮物。他們沒有要買外套，外套太貴而且已經放棄；爸爸已經有兩件冬季(winter)外套，所以也不是在找外套，特價的是帽子不是夾克。選 A"},
{n:20,p:2,o:["They lost zero to six.","They lost five to six.","They won six to five."],a:1,sen:"W: Did our national team win last night? &nbsp;M: No, they lost, but only by one point. &nbsp;W: Wasn't it zero to six at the start? &nbsp;M: Yes, but they came back. They scored five in a row. &nbsp;Q: What was the final score?",szh:"女：我們國家(national)隊(team)昨晚贏了嗎？　男：沒有，輸(lose)了，但只差一分。　女：一開始不是零比六(six)嗎？　男：對，但他們追回來了，連得五分。　問：最後比數是多少？",en:"They lost five to six.",zh:"一開始零比六，後來連得五分，所以是五比六，輸一分。零比六是比賽一開始的比數；他們是輸了，不是六比五贏。選 B"},
{n:21,p:2,o:["She hurt her arm.","She has to go to work.","She is playing tennis."],a:0,sen:"M: Can you help me pull this big box to my car? &nbsp;W: Sorry, I hurt my arm playing tennis yesterday. Ask Tom. &nbsp;M: Tom is at work. I'll ask Amy, then. &nbsp;Q: Why can't the woman help the man?",szh:"男：你可以幫我把這個大箱子拉(pull)到我車上嗎？　女：抱歉，我昨天打網球傷到手臂(arm)了。你去問 Tom。　男：Tom 在上班。那我去問 Amy。　問：女士為什麼不能幫男士？",en:"She hurt her arm.",zh:"女士說昨天打網球傷了手臂(arm)，所以不能幫忙拉箱子。在上班的是 Tom，不是她；打網球是昨天的事，她現在沒有在打。選 A"},
{n:22,p:2,o:["Her grandmother.","Her grandfather.","Her father."],a:1,sen:"W: Look! My grandmother kept a box of old letters. &nbsp;M: Who are they from? &nbsp;W: My grandfather wrote them before they got married. He's been dead for ten years, but she still reads them. &nbsp;M: That's so sweet. &nbsp;Q: Who wrote the letters?",szh:"女：你看！奶奶留著一盒舊信(letter)。　男：是誰寄的？　女：是爺爺在他們結婚前寫的。他已經過世(dead)十年了，可是奶奶還會讀那些信。　男：好甜蜜喔。　問：信是誰寫的？",en:"Her grandfather.",zh:"信是爺爺在婚前寫的。奶奶是保存、閱讀這些信的人，不是寫信的人；對話沒有提到爸爸。選 B"},
{n:23,p:2,o:["Sixty dollars.","Two hundred dollars.","Nothing."],a:2,sen:"W: The town center has a new class on basic computer skills. &nbsp;M: How much is it? &nbsp;W: It's free for people over sixty. Others pay two hundred dollars. &nbsp;M: My dad is sixty-five. I'll tell him about it. &nbsp;Q: How much will the man's dad pay for the class?",szh:"女：鎮民中心開了一門基礎(basic)電腦技能課(class)。　男：多少錢？　女：六十歲以上免費，其他人付兩百元。　男：我爸六十五歲，我會告訴他。　問：男士的爸爸上這門課要付多少錢？",en:"Nothing.",zh:"六十歲以上免費，男士的爸爸六十五歲，所以不用付錢。兩百元是六十歲以下的人付的；六十是年齡門檻，不是價錢。選 C"},
{n:24,p:2,o:["A news report about helicopters.","A cloudy day at the office.","A trip that depends on the weather."],a:2,sen:"W: I called the helicopter office. They said the trip is still on. &nbsp;M: But it's so cloudy. Is it safe? &nbsp;W: Clouds are fine. Only rain or strong wind would stop it. &nbsp;M: The news says strong wind is coming after three. &nbsp;W: Then let's take the one at one o'clock. &nbsp;M: Good. I'll call and order the tickets. &nbsp;Q: What are the speakers talking about?",szh:"女：我打給直升機(helicopter)公司了，他們說遊覽還是會飛。　男：可是天氣好陰(cloudy)，安全嗎？　女：陰天沒關係，只有下雨或強風才會停飛。　男：新聞說三點以後有強風。　女：那我們搭一點那班吧。　男：好，我來打電話訂票。　問：說話的兩個人在談什麼？",en:"A trip that depends on the weather.",zh:"兩人一直在看陰天、下雨、強風會不會讓直升機(helicopter)遊覽停飛，最後依風勢改搭一點的班次，所以談的是要看天氣的旅程。新聞只是他們查風勢的來源，不是主題；辦公室只是女士打電話的對象；陰天(cloudy)不影響飛行，也不是在談陰天本身。選 C"},
{n:25,p:2,o:["It does not bother him.","He will buy a bag at every shop.","It costs him five dollars."],a:0,sen:"W: The city now requires shops to charge five dollars for a bag. &nbsp;M: Five dollars? Some people will be angry. &nbsp;W: Are you angry too? &nbsp;M: Not me. I keep a bag in my car, so I pay nothing. &nbsp;W: But you always forget it at home. &nbsp;M: That was before. Now I check it every time I go out. &nbsp;Q: What does the man think about the new rule?",szh:"女：市政府現在要求(require)商店買一個袋子要收五元。　男：五元？有些人會很生氣。　女：你也生氣嗎？　男：我不會。我車上放了一個袋子，所以不用付錢。　女：可是你老是忘記帶。　男：那是以前。現在我每次出門都會檢查。　問：男士覺得這個新規定怎麼樣？",en:"It does not bother him.",zh:"男士說他不生氣，車上有袋子所以不用付錢，現在出門還會檢查，表示這個規定對他沒有影響。他是自備袋子，不會每家店都買一個新袋子；他也沒有付五元。他只是說有些人會生氣，那不是他自己的感覺。規定(require)是市政府訂的，他並沒有覺得困擾。選 A"},
{n:26,p:3,pic:true,o:[BARS("Helper Hours",["Park","Library","Hospital"],[80,20,50]),BARS("Helper Hours",["Park","Library","Hospital"],[20,80,50]),BARS("Helper Hours",["Park","Library","Hospital"],[50,20,80])],a:2,sen:"Every month, our local group helps in three places. Most people think we spend the most time at the park, but that's not true this month. We spent more hours at the hospital than at the park. The library got the fewest hours, because it was closed for a week. &nbsp;Q: Which chart shows this month's hours?",szh:"我們當地(local)的團體(group)每個月在三個地方幫忙。大部分(most)人以為我們在公園花最多時間，但這個月不是。我們在醫院的時數比公園多；圖書館的時數最少，因為它關了一個星期。　問：哪張圖是這個月的服務時數？",en:"Hospital most, park second, library fewest.",zh:"醫院比公園多，圖書館最少，所以醫院最高、公園第二、圖書館最低。公園最高的那張是「大部分人以為」的情形；圖書館最高的那張和「圖書館最少」相反。選 C"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"This winter, our class collected gifts for poor families in our city. Because it was so cold, we thought we would get the most jackets. But we got more books than jackets. And people gave us even more bags of rice than books. We carried all the gifts to the town center on Friday. &nbsp;Q: What did the class get the most of?",szh:"今年冬天，我們班為市內的貧困(poor)家庭募集禮物。因為天氣很冷，我們以為大家最常捐的是外套。但我們收到的書比外套多。而大家捐的米又比書更多。星期五我們把所有禮物搬到鎮中心。　問：全班收到最多的是什麼？",en:"Rice.",zh:"外套是我們「以為」會最多的，其實比書少；書比外套多；但米又比書更多，所以收到最多的是米。 選 B"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:0,sen:"Our town has a movie night in the park every month. Last month, they showed a classic black-and-white movie, and many kids were bored. This month, people could choose: a cartoon, a soccer movie, or another classic. Most people chose the cartoon, so the kids were happy. &nbsp;Q: What did people watch this month?",szh:"我們鎮上每個月在公園有電影之夜。上個月放了一部經典(classic)黑白電影，很多小孩覺得無聊(bored)。這個月大家可以(could)選：卡通、足球電影，或另一部經典片。大部分(most)人選了卡通，所以小孩們很開心。　問：這個月大家看了什麼？",en:"A cartoon.",zh:"黑白經典(classic)片是上個月放的；足球電影和另一部經典片是這個月的選項之一，但大部分(most)人選了卡通。選 A"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:2,sen:"My aunt has a small shop that sells local products. Last year, she sold mostly fashionable bags, but they didn't sell well. Her assistant wanted to sell cakes, but the shop is too small for a kitchen. So this year, she sells tea from local farms, and people love it. &nbsp;Q: What does the aunt's shop sell this year?",szh:"我阿姨開了一家賣當地(local)產品(product)的小店。去年她大多賣時髦(fashionable)的包包，但賣得不好。她的助理(assistant)想賣蛋糕，可是店太小，放不下廚房。所以今年她賣當地農場的茶，大家都很喜歡。　問：阿姨的店今年賣什麼？",en:"Tea from local farms.",zh:"時髦(fashionable)包包是去年賣的，賣得不好；蛋糕是助理(assistant)的想法，因為店太小沒做成；今年賣的是當地農場的茶。選 C"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30a'),PH('q30c')],a:0,sen:"Last week, the worst storm in years hit our town. Many old people had no power for two days. A rich man in our town drove a truck of water and food to them himself. He says helping others is part of living in a society. The children of the town wanted to thank him with flowers or pictures, but he asked for no gifts. So they sang a song for him in front of the town hall. &nbsp;Q: How did the children thank the man?",szh:"上週，多年來最嚴重(worst)的暴風雨襲擊我們鎮。很多老人家停電兩天。鎮上一位有錢(rich)人親自開卡車把水和食物送去給他們。他說幫助別人是生活在社會(society)中的一部分(part)。鎮上的孩子們想送花或畫來謝謝(thank)他，但他說：「請不要送禮物。」所以他們在鎮公所前為他唱了一首歌。　問：孩子們怎麼謝謝這位男士？",en:"They sang a song for him.",zh:"孩子們本來想送花或畫，但男士說不要禮物，最後改成在鎮公所前唱歌給他聽。送花、送畫都是被拒絕的想法。選 A"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 39 回　社區與人們　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
