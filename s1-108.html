  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      padding: 24px 16px 60px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #4338ca;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 32px;
    }

    .progress-bar-wrap {
      max-width: 720px;
      margin: 0 auto 8px;
      background: #cbd5e0;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #4338ca);
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .progress-text {
      text-align: center;
      font-size: 0.82rem;
      color: #718096;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 720px;
      margin: 0 auto 28px;
      padding: 28px 28px 24px;
      border-left: 5px solid #6366f1;
      transition: border-color 0.3s;
    }

    .card.correct { border-left-color: #22c55e; }
    .card.wrong   { border-left-color: #ef4444; }

    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .q-num {
      background: #6366f1;
      color: #fff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      min-width: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .q-text {
      font-size: 1rem;
      line-height: 1.75;
      color: #2d3748;
    }

    .q-text em {
      font-style: normal;
      color: #718096;
      font-size: 0.9rem;
    }

    .options {
      list-style: none;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      background: #f7fafc;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #2d3748;
      transition: background 0.18s, border-color 0.18s;
      width: 100%;
    }

    .option-btn:hover:not(:disabled) {
      background: #eef2ff;
      border-color: #a5b4fc;
    }

    .option-btn:disabled { cursor: default; }

    .option-btn.selected-correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
      font-weight: 600;
    }

    .option-btn.selected-wrong {
      background: #fee2e2;
      border-color: #ef4444;
      color: #991b1b;
    }

    .option-btn.reveal-correct {
      background: #dcfce7;
      border-color: #22c55e;
      color: #166534;
    }

    .option-tag { font-weight: 700; min-width: 22px; }
    .result-icon { display: inline-block; margin-left: 8px; font-size: 1.1rem; }

    .analysis-box {
      margin-top: 18px;
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 16px 18px;
      display: none;
    }

    .analysis-box.visible { display: block; }

    .analysis-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #4338ca;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .analysis-text {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #312e81;
    }

    .more-btn {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: #e0e7ff;
      color: #4338ca;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s;
    }

    .more-btn:hover { background: #c7d2fe; }

    .supplement-box {
      margin-top: 12px;
      background: #faf5ff;
      border: 1px solid #ddd6fe;
      border-radius: 10px;
      padding: 16px 18px;
      display: none;
    }

    .supplement-box.visible { display: block; }

    .supplement-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #7c3aed;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }

    .vocab-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .vocab-list li {
      font-size: 0.88rem;
      line-height: 1.7;
      color: #3b2f6e;
      padding-left: 16px;
      position: relative;
    }

    .vocab-list li::before {
      content: "●";
      position: absolute;
      left: 0;
      color: #7c3aed;
      font-size: 0.65rem;
      top: 5px;
    }

    #summary {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      text-align: center;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
      padding: 40px 32px;
    }

    #summary h2 { font-size: 1.6rem; color: #4338ca; margin-bottom: 12px; }
    #summary .score-big { font-size: 3rem; font-weight: 800; color: #6366f1; margin-bottom: 8px; }
    #summary p { color: #4a5568; font-size: 1rem; margin-bottom: 24px; }

    .reset-btn {
      padding: 12px 32px;
      background: linear-gradient(135deg, #6366f1, #4338ca);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .reset-btn:hover { opacity: 0.88; }

    @media (max-width: 600px) {
      .card { padding: 20px 16px 18px; }
    }
  </style>

<script>
const questions = [
  {
    id: 1,
    stem: `Bobby cared a lot about his _____ at home and asked his parents not to go through his things without his permission.`,
    stem_zh: `巴比非常重視他在家的_____，要求父母未經他許可不得翻動他的東西。`,
    options: [
      { label: "A", text: "discipline", hint: "（紀律；管教）" },
      { label: "B", text: "facility", hint: "（設施；才能）" },
      { label: "C", text: "privacy", hint: "（隱私；私密）✓" },
      { label: "D", text: "representation", hint: "（代表；描述）" }
    ],
    answer: "C",
    analysis: `【句型結構】主詞（Bobby）+ 動詞（cared a lot about）+ 受詞（his _____ at home）。後接 asked his parents not to go through his things without permission 作進一步說明。\n\n【關鍵線索】not to go through his things without his permission（未經許可不得翻動他的東西）→ 強調個人「隱私」不受侵犯，選 privacy（C）。`,
    vocab: [
      "privacy (n.) 隱私、私密性；in private 私下地；private (adj.)",
      "【近義詞】confidentiality（機密性）、seclusion（隔絕、隱居）",
      "【延伸搭配】right to privacy（隱私權）、invasion of privacy（侵犯隱私）、privacy policy（隱私政策）"
    ]
  },
  {
    id: 2,
    stem: `The new manager is a real gentleman. He is kind and humble, totally different from the former manager, who was _____ and bossy.`,
    stem_zh: `新經理是個真正的紳士。他親切謙遜，與前任經理完全不同，前任經理_____且專橫。`,
    options: [
      { label: "A", text: "eager", hint: "（渴望的；熱切的）" },
      { label: "B", text: "liberal", hint: "（自由的；慷慨的）" },
      { label: "C", text: "mean", hint: "（刻薄的；吝嗇的）✓" },
      { label: "D", text: "inferior", hint: "（較差的；下等的）" }
    ],
    answer: "C",
    analysis: `【句型結構】關係子句（who was _____ and bossy）修飾前任經理（the former manager）。空格與 bossy（專橫的）形成對等連接，且與前句的 kind and humble 形成對比。\n\n【關鍵線索】totally different from（截然不同）+ kind（親切）and humble（謙遜）→ 前任經理應是反義詞，bossy（專橫）配對 mean（刻薄），選 mean（C）。`,
    vocab: [
      "mean (adj.) 刻薄的、卑鄙的、吝嗇的；mean (n./v.) 平均/意思/意味",
      "【近義詞】unkind（不親切的）、cruel（殘忍的）、nasty（討厭的）",
      "【延伸搭配】mean-spirited（小氣的）、a mean trick（惡意的把戲）"
    ]
  },
  {
    id: 3,
    stem: `The weather bureau _____ that the typhoon would bring strong winds and heavy rains, and warned everyone of the possible danger.`,
    stem_zh: `氣象局_____颱風將帶來強風和豪雨，並警告所有人注意可能的危險。`,
    options: [
      { label: "A", text: "conveyed", hint: "（傳達；傳遞）" },
      { label: "B", text: "associated", hint: "（聯繫；關聯）" },
      { label: "C", text: "interpreted", hint: "（詮釋；解釋）" },
      { label: "D", text: "predicted", hint: "（預測；預報）✓" }
    ],
    answer: "D",
    analysis: `【句型結構】主詞（The weather bureau）+ 動詞過去式（填空）+ that 名詞子句。後接 warned everyone of the possible danger（警告眾人）與空格動作並列。\n\n【關鍵線索】weather bureau（氣象局）+ typhoon would bring...（颱風將帶來...）→ 氣象局的功能是「預測」天氣，選 predicted（D）。`,
    vocab: [
      "predict (v.) 預測；prediction (n.)；predictable (adj.)",
      "【近義詞】forecast（預報）、anticipate（預期）、foresee（預見）",
      "【延伸搭配】predict the weather（預測天氣）、weather prediction（天氣預報）、accurately predicted（準確預測）"
    ]
  },
  {
    id: 4,
    stem: `Different airlines have different _____ for carry-on luggage, but many international airlines limit a carry-on piece to 7 kilograms.`,
    stem_zh: `不同航空公司對手提行李有不同的_____，但許多國際航空公司將手提行李限制在 7 公斤。`,
    options: [
      { label: "A", text: "landmarks", hint: "（地標；里程碑）" },
      { label: "B", text: "restrictions", hint: "（限制；規定）✓" },
      { label: "C", text: "percentages", hint: "（百分比）" },
      { label: "D", text: "circumstances", hint: "（情況；環境）" }
    ],
    answer: "B",
    analysis: `【句型結構】主句（Different airlines have different _____ for carry-on luggage）。空格為名詞，被 different 修飾，且後句說明 limit a carry-on piece to 7 kilograms（限重 7 公斤）。\n\n【關鍵線索】limit...to 7 kilograms（限制為 7 公斤）→ 暗示空格為表示「限制/規定」的名詞，選 restrictions（B）。`,
    vocab: [
      "restriction (n.) 限制、規定；restrict (v.)；restrictive (adj.)",
      "【近義詞】limitation（限制）、regulation（規定）、constraint（約束）",
      "【延伸搭配】baggage restrictions（行李規定）、impose restrictions（施加限制）、lift restrictions（解除限制）"
    ]
  },
  {
    id: 5,
    stem: `Many people were happy that the government had finally _____ Children's Day as a national holiday.`,
    stem_zh: `許多人很高興政府終於_____兒童節為國定假日。`,
    options: [
      { label: "A", text: "appointed", hint: "（任命；指定）" },
      { label: "B", text: "declared", hint: "（宣布；聲明）✓" },
      { label: "C", text: "performed", hint: "（表演；執行）" },
      { label: "D", text: "involved", hint: "（牽涉；包含）" }
    ],
    answer: "B",
    analysis: `【句型結構】過去完成式（had finally _____）表示在過去某個時間點完成的動作。受詞為 Children's Day as a national holiday，空格動詞需接 NP + as + NP 結構。\n\n【關鍵線索】Children's Day as a national holiday（兒童節為國定假日）→ 政府「宣布」某日為假日，選 declared（B）。declare...as 是固定搭配。`,
    vocab: [
      "declare (v.) 宣布、申報；declare war 宣戰；declaration (n.)",
      "【近義詞】announce（宣布）、proclaim（宣告）",
      "【延伸搭配】declare a holiday（宣布假期）、declare independence（宣布獨立）、Customs declaration（海關申報）"
    ]
  },
  {
    id: 6,
    stem: `To reach the goal of making her company a market leader, Michelle _____ a plan to open ten new stores around the country this year.`,
    stem_zh: `為了達成讓公司成為市場領導者的目標，米歇爾_____了一個今年在全國開設十家新店的計畫。`,
    options: [
      { label: "A", text: "advised", hint: "（建議；忠告）" },
      { label: "B", text: "occupied", hint: "（佔領；使忙碌）" },
      { label: "C", text: "proposed", hint: "（提出；提議）✓" },
      { label: "D", text: "recognized", hint: "（認可；認識）" }
    ],
    answer: "C",
    analysis: `【句型結構】目的副詞（To reach the goal...）+ 主句（Michelle _____ a plan to open ten new stores...）。空格為動詞過去式，受詞為 a plan。\n\n【關鍵線索】a plan（一個計畫）→ 需要與 plan 搭配的動詞，propose a plan（提出計畫，C）是自然搭配。`,
    vocab: [
      "propose (v.) 提議、求婚；proposal (n.) 提案、求婚",
      "【近義詞】suggest（建議）、put forward（提出）、present（呈現）",
      "【延伸搭配】propose a plan（提出計畫）、marriage proposal（求婚）、propose a toast（提議乾杯）"
    ]
  },
  {
    id: 7,
    stem: `Silence in some way is as _____ as speech. It can be used to show, for example, disagreement or lack of interest.`,
    stem_zh: `沉默在某種程度上與語言一樣_____。它可以用來表達，例如，不同意或缺乏興趣。`,
    options: [
      { label: "A", text: "sociable", hint: "（善交際的；友好的）" },
      { label: "B", text: "expressive", hint: "（富有表現力的）✓" },
      { label: "C", text: "reasonable", hint: "（合理的；理性的）" },
      { label: "D", text: "objective", hint: "（客觀的；目標）" }
    ],
    answer: "B",
    analysis: `【句型結構】等比較結構（as _____ as speech）。空格為形容詞，與 silence 的性質相關，且後句說明沉默能「表達」不同意或興趣缺缺。\n\n【關鍵線索】It can be used to show...disagreement or lack of interest（用來表達不同意或興趣缺缺）→ 沉默和語言一樣富有「表現力」，選 expressive（B）。`,
    vocab: [
      "expressive (adj.) 富表現力的；express (v.) 表達；expression (n.)",
      "【近義詞】communicative（善於溝通的）、meaningful（富含意義的）、articulate（表達清晰的）",
      "【延伸搭配】expressive eyes（有神的眼睛）、facial expression（表情）、freely expressive（自由表達的）"
    ]
  },
  {
    id: 8,
    stem: `This TV program is designed for children, _____ for those under five. It contains no violence or strong language.`,
    stem_zh: `這個電視節目是為兒童設計的，_____是五歲以下的兒童。節目中不含任何暴力或粗俗語言。`,
    options: [
      { label: "A", text: "particularly", hint: "（尤其；特別）✓" },
      { label: "B", text: "sensibly", hint: "（明智地；合理地）" },
      { label: "C", text: "moderately", hint: "（適度地；溫和地）" },
      { label: "D", text: "considerably", hint: "（相當地；大量地）" }

    answer: "A",
    analysis: `【句型結構】主句（This TV program is designed for children）+ 逗點後的副詞修飾語（_____ for those under five）。空格為副詞，強調「更特別」的目標受眾。\n\n【關鍵線索】designed for children...for those under five（為兒童設計，尤其是五歲以下）→ 選表示「特別/尤其」的 particularly（A）。`,
    vocab: [
      "particularly (adv.) 尤其、特別；particular (adj.) 特別的；in particular 尤其是",
      "【近義詞】especially（尤其）、specifically（特別地）、notably（值得注意地）",
      "【延伸搭配】particularly important（尤其重要）、not particularly（並不特別）"
    ]
  },
  {
    id: 9,
    stem: `Tommy, please put away the toys in the box, or you might _____ on them and hurt yourself.`,
    stem_zh: `湯米，請把玩具收進箱子裡，否則你可能會_____在上面而傷到自己。`,
    options: [
      { label: "A", text: "stumble", hint: "（絆倒；失足）✓" },
      { label: "B", text: "graze", hint: "（放牧；擦傷）" },
      { label: "C", text: "navigate", hint: "（導航；駕駛）" },
      { label: "D", text: "dwell", hint: "（居住；深思）" }
    ],
    answer: "A",
    analysis: `【句型結構】or 連接條件後果（or you might _____ on them and hurt yourself）。空格為動詞原形（接在 might 後），與介詞 on（在...上絆倒）搭配。\n\n【關鍵線索】toys（玩具）+ hurt yourself（傷到自己）→ 玩具散落地上，人可能「絆倒」在上面，選 stumble（A）。stumble on/over 是固定搭配。`,
    vocab: [
      "stumble (v.) 絆倒、失足；stumble on/upon 偶然發現；stumble across 碰巧遇見",
      "【近義詞】trip（絆倒）、fall（跌倒）、stumble over（絆過）",
      "【延伸搭配】stumble over one's words（說話結巴）、stumble upon a discovery（偶然發現）"
    ]
  },
 #{
    id: 10,
    stem: `The _____ costume party, held every September, is one of the biggest events of the school year.`,
    stem_zh: `每年九月舉辦的_____服裝派對，是學年中最盛大的活動之一。`,
    options: [
      { label: "A", text: "initial", hint: "（最初的；首字母）" },
      { label: "B", text: "annual", hint: "（一年一度的；年度的）✓" },
      { label: "C", text: "evident", hint: "（明顯的；顯而易見的）" },
      { label: "D", text: "occasional", hint: "（偶爾的；特殊場合的）" }

let answered = 0;
let score = 0;
const total = questions.length;

function selectAnswer(idx, chosen) {
  const q = questions[idx];
  const card = document.getElementById(`card-${idx}`);
  const btns = card.querySelectorAll('.option-btn');
  const analysisBox = document.getElementById(`analysis-${idx}`);
  const moreBtn = document.getElementById(`more-btn-${idx}`);

  btns.forEach(btn => { btn.disabled = true; });

  const isCorrect = chosen === q.answer;
  if (isCorrect) {
    score++;
    card.classList.add('correct');
  } else {
    card.classList.add('wrong');
  }

  btns.forEach(btn => {
    const label = btn.getAttribute('data-label');
    if (label === chosen) {
      btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
      const icon = btn.querySelector('.result-icon');
      if (icon) icon.textContent = isCorrect ? ' ✓' : ' ✗';
    }
    if (!isCorrect && label === q.answer) {
      btn.classList.add('reveal-correct');
    }
  });

  analysisBox.classList.add('visible');
  if (moreBtn) moreBtn.style.display = 'inline-flex';

  answered++;
  const pct = Math.round((answered / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `已作答 ${answered} / ${total} 題`;

  if (answered === total) {
    setTimeout(showSummary, 600);
  }
}

function toggleSupp(idx) {
  const box = document.getElementById(`supp-${idx}`);
  const btn = document.getElementById(`more-btn-${idx}`);
  const visible = box.classList.toggle('visible');
  btn.textContent = visible ? '▲ 收起補充' : '▼ 查看更多補充';
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${idx}`;

    const analysisLines = q.analysis.split('\n\n').map(s => `<p style="margin-bottom:8px">${s.replace(/\n/g,'<br>')}</p>`).join('');
    const vocabItems = q.vocab.map(v => `<li>${v}</li>`).join('');
    const optionsHTML = q.options.map(opt => `
      <button class="option-btn" data-label="${opt.label}" onclick="selectAnswer(${idx},'${opt.label}')">
        <span class="option-tag">${opt.label}</span>
        <span>${opt.text} <em>${opt.hint}</em></span>
        <span class="result-icon"></span>
      </button>`).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num">${q.id}</div>
        <div class="q-text">
          ${q.stem}<br>
          <em>${q.stem_zh}</em>
        </div>
      </div>
      <ul class="options">${optionsHTML}</ul>
      <div class="analysis-box" id="analysis-${idx}">
        <div class="analysis-label">📖 解析</div>
        <div class="analysis-text">${analysisLines}</div>
        <button class="more-btn" id="more-btn-${idx}" style="display:none" onclick="toggleSupp(${idx})">▼ 查看更多補充</button>
        <div class="supplement-box" id="supp-${idx}">
          <div class="supplement-label">📚 補充說明</div>
          <ul class="vocab-list">${vocabItems}</ul>
        </div>
      </div>`;
    container.appendChild(card);
  });
}

function showSummary() {
  document.getElementById('quiz-container').style.display = 'none';
  document.getElementById('progressBar').parentElement.style.display = 'none';
  document.getElementById('progressText').style.display = 'none';
  const summary = document.getElementById('summary');
  summary.style.display = 'block';
  document.getElementById('scoreDisplay').textContent = `${score} / ${total}`;
  const pct = Math.round((score / total) * 100);
  let msg = '';
  if (pct === 100) msg = '完美！全部答對，實力超強！🏆';
  else if (pct >= 80) msg = '表現優異！再努力一點就完美了！💪';
  else if (pct >= 60) msg = '還不錯！繼續加油，多複習幾次！📖';
  else msg = '別灰心，再練習一次，你一定能進步！🌟';
  document.getElementById('scoreMsg').textContent = msg;
}

function resetQuiz() {
  answered = 0; score = 0;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('progressText').textContent = `已作答 0 / ${total} 題`;
  document.getElementById('progressBar').parentElement.style.display = '';
  document.getElementById('progressText').style.display = '';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('quiz-container').style.display = '';
  buildQuiz();
}

buildQuiz();

<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。

   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));

  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');

  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}

    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});

  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});

  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};

    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;

    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>
