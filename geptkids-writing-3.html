<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小學英檢 寫作測驗　第3回</title>
<style>
  :root{
    --blue:#2ba6ff; --blue-dark:#1b7fd0;
    --coral:#ff8a5b; --amber:#ffb02e; --pink:#ff5d8f;
    --grape:#8b6bff; --mint:#22c9a0;
    --bg:#f3fbff; --card:#ffffff; --line:#e2effa;
    --green:#22b573; --green-bg:#e4f8ef;
    --red:#ff5a5a; --red-bg:#ffecec;
    --gray:#6b7785;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Helvetica Neue","PingFang TC","Microsoft JhengHei",sans-serif;
    background:linear-gradient(180deg,#eafaff,#fff6ef 70%);color:#22303f;line-height:1.65;
    -webkit-text-size-adjust:100%;}
  .wrap{max-width:780px;margin:0 auto;padding:16px;}
  header.top{background:linear-gradient(135deg,#5fd6f5,#5b9bff 50%,#a97bff);color:#fff;
    border-radius:20px;padding:26px 22px;margin-bottom:16px;box-shadow:0 10px 24px rgba(91,155,255,.32);}
  header.top h1{margin:0 0 6px;font-size:1.55rem;text-shadow:0 1px 2px rgba(0,0,0,.12);}
  header.top p{margin:0;font-size:.94rem;opacity:.96;}
  .meta{margin-top:14px;font-size:.86rem;background:rgba(255,255,255,.22);
    padding:9px 13px;border-radius:10px;}
  .sticky{position:sticky;top:0;z-index:20;padding:10px 0;
    background:linear-gradient(180deg,#eafaff 70%,rgba(234,250,255,0));}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.9rem;
    box-shadow:0 4px 12px rgba(43,166,255,.12);}
  .bar .track{flex:1;height:10px;background:#e7f4fd;border-radius:6px;overflow:hidden;}
  .bar .fill{height:100%;width:0;border-radius:6px;
    background:linear-gradient(90deg,#3ad1c6,#2ba6ff,#a97bff);transition:width .35s;}
  .bar #count{font-weight:800;color:var(--blue-dark);}
  .section-title{color:#fff;font-weight:800;border-radius:14px;
    padding:11px 16px;margin:26px 0 6px;font-size:1.05rem;
    box-shadow:0 5px 14px rgba(0,0,0,.09);}
  .section-title.s0{background:linear-gradient(135deg,#ffb36b,#ff6f91);}
  .section-title.s1{background:linear-gradient(135deg,#4dd0e1,#2ba6ff);}
  .section-title.s2{background:linear-gradient(135deg,#9b8bff,#c46bff);}
  .section-desc{font-size:.86rem;color:var(--gray);margin:0 4px 10px;}

  /* ── 圖片場景卡（第一部分） ── */
  .scene{background:linear-gradient(160deg,#ffffff,#f2fbff);border:2px solid #cfeafd;
    border-radius:18px;padding:14px 16px 16px;margin:18px 0 10px;
    box-shadow:0 6px 18px rgba(43,166,255,.13);}
  .scene h3{margin:0 0 4px;color:#1b7fd0;font-size:1rem;display:flex;align-items:center;gap:8px;}
  .scene h3 .pic{background:var(--blue);color:#fff;border-radius:9px;padding:2px 10px;font-size:.82rem;}
  .scene .sub{margin:0 0 10px;font-size:.83rem;color:var(--gray);}
  .zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .zone{background:#fff;border:1.5px dashed #b9e2fb;border-radius:14px;padding:10px 10px 12px;text-align:center;}
  .zone .zt{font-size:.78rem;color:#1b7fd0;font-weight:800;margin-bottom:6px;line-height:1.35;}
  .zone .items{font-size:2.05rem;line-height:1.25;letter-spacing:2px;word-break:break-word;}
  .zone .cap{font-size:.75rem;color:var(--gray);margin-top:4px;}

  /* ── 短文卡（第二、三部分） ── */
  .passage{background:#fffdf4;border:1px solid #ffe9c9;border-left:6px solid var(--amber);
    border-radius:14px;padding:15px 17px;margin:14px 0;font-size:.97rem;
    box-shadow:0 4px 12px rgba(255,176,46,.1);}
  .passage h3{margin:0 0 8px;color:#e0820a;font-size:1rem;}
  .passage p{margin:8px 0;}
  .passage table{border-collapse:collapse;width:100%;margin:9px 0;font-size:.9rem;}
  .passage th,.passage td{border:1px solid #ffe0b0;padding:6px 9px;text-align:left;}
  .passage th{background:#fff2dc;}
  .passage .note-h{font-size:.85rem;color:var(--gray);border-bottom:1px dashed #ffd9a8;
    padding-bottom:6px;margin-bottom:8px;}
  .passage .big{font-size:1.15rem;font-weight:800;color:#d2691e;}
  .blank{display:inline-block;min-width:62px;border-bottom:2.5px solid var(--blue);
    text-align:center;color:var(--blue-dark);font-weight:800;}

  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;margin:11px 0;box-shadow:0 3px 10px rgba(43,166,255,.08);}
  .q .stem{font-weight:600;margin-bottom:10px;}
  .q .stem .num{display:inline-block;color:#fff;background:var(--blue);font-weight:800;
    border-radius:9px;padding:1px 10px;margin-right:8px;font-size:.92rem;}
  .opt{display:flex;align-items:flex-start;gap:10px;border:2px solid var(--line);
    border-radius:12px;padding:10px 13px;margin:8px 0;cursor:pointer;transition:.15s;
    font-size:.97rem;background:#fbfdff;}
  .opt:hover{border-color:var(--blue);background:#eaf7ff;}
  .opt input{margin-top:4px;accent-color:var(--blue);}
  .opt .lab{font-weight:900;color:var(--blue);min-width:20px;}
  .opt.sel{border-color:var(--blue);background:#e2f3ff;}
  .opt.correct{border-color:var(--green);background:var(--green-bg);}
  .opt.wrong{border-color:var(--red);background:var(--red-bg);}
  .opt.lock{cursor:default;}
  /* Y/N 兩顆並排 */
  .yn{display:flex;gap:10px;}
  .yn .opt{flex:1;justify-content:center;align-items:center;font-weight:800;padding:12px 8px;}
  .yn .opt .lab{min-width:0;font-size:1.15rem;}

  .exp{display:none;margin-top:11px;border-top:2px dashed #ffe1c2;padding-top:11px;font-size:.9rem;}
  .exp.show{display:block;}
  .exp .tag{display:inline-block;font-weight:800;color:#fff;background:var(--green);
    border-radius:8px;padding:2px 11px;font-size:.8rem;margin-bottom:7px;}
  .exp .tag.miss{background:var(--red);}
  .exp .en{color:#1c4f7a;background:#eef7ff;border-radius:9px;padding:6px 11px;margin:5px 0;}
  .exp .zh{color:#7a4a12;background:#fff7ea;border-radius:9px;padding:6px 11px;margin:5px 0;}
  .actions{position:sticky;bottom:0;padding:14px 0 6px;margin-top:18px;
    background:linear-gradient(transparent,#fff6ef 35%);}
  button.submit{width:100%;color:#fff;border:0;border-radius:15px;padding:16px;
    font-size:1.08rem;font-weight:800;cursor:pointer;
    background:linear-gradient(135deg,#ffa15b,#ff5d8f);
    box-shadow:0 7px 18px rgba(255,93,143,.35);}
  button.submit:active{transform:translateY(1px);}
  button.reset{width:100%;background:#fff;color:var(--blue);border:2px solid var(--blue);
    border-radius:15px;padding:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:10px;display:none;}
  .result{display:none;background:var(--card);border:3px solid transparent;border-radius:18px;
    padding:22px;margin:16px 0;text-align:center;
    background-image:linear-gradient(#fff,#fff),linear-gradient(135deg,#3ad1c6,#2ba6ff,#c46bff);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 8px 22px rgba(43,166,255,.16);}
  .result.show{display:block;}
  .result .suns{font-size:2rem;letter-spacing:4px;margin-bottom:4px;}
  .result .score{font-size:2.8rem;font-weight:900;
    background:linear-gradient(135deg,#2ba6ff,#c46bff);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent;}
  .result .sub{color:var(--gray);font-size:.95rem;}
  .result .lvl{margin-top:8px;font-weight:800;color:#1b7fd0;}
  .result .bd{display:flex;justify-content:center;gap:18px;margin-top:12px;flex-wrap:wrap;font-size:.95rem;}
  .result .bd span{font-weight:800;}
  .result .part{margin-top:12px;font-size:.88rem;color:var(--gray);}
  .hint{text-align:center;font-size:.85rem;color:var(--gray);margin-top:9px;min-height:1.2em;}
  footer{text-align:center;color:var(--gray);font-size:.8rem;margin:24px 0;}

  /* ── 寫作：短文與空格 ── */
  .diary{background:#fffdf4;border:1px solid #ffe9c9;border-left:6px solid var(--amber);
    border-radius:14px;padding:16px 18px;margin:14px 0;font-size:1.02rem;line-height:2.4;
    box-shadow:0 4px 12px rgba(255,176,46,.1);}
  .diary h3{margin:0 0 4px;color:#e0820a;font-size:1rem;}
  .diary .sub{margin:0 0 10px;font-size:.83rem;color:var(--gray);line-height:1.6;}
  .diary p{margin:10px 0;}
  input.gap{width:8.5em;border:0;border-bottom:2.5px solid var(--blue);background:#f3faff;
    border-radius:6px 6px 0 0;padding:3px 8px;font-size:1rem;font-family:inherit;
    text-align:center;color:#1b7fd0;font-weight:800;}
  input.gap:focus{outline:none;background:#e2f3ff;}
  input.gap.ok{border-color:var(--green);background:var(--green-bg);color:#12876a;}
  input.gap.half{border-color:var(--amber);background:#fff7ea;color:#a06000;}
  input.gap.bad{border-color:var(--red);background:var(--red-bg);color:#c0392b;}
  .gapnum{display:inline-block;color:#fff;background:var(--blue);font-weight:800;
    border-radius:7px;padding:0 7px;margin-right:4px;font-size:.78rem;vertical-align:2px;}

  /* 圖示提示 */
  .hints{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:12px 0 4px;}
  .hint-card{background:#fff;border:1.5px dashed #b9e2fb;border-radius:14px;padding:10px 6px;text-align:center;}
  .hint-card .n{display:inline-block;color:#fff;background:var(--blue);font-weight:800;
    border-radius:7px;padding:0 8px;font-size:.75rem;}
  .hint-card .e{font-size:2rem;line-height:1.3;}
  .hint-card .zh{font-size:.76rem;color:var(--gray);}

  /* 短句問答 */
  textarea.ans{width:100%;min-height:64px;border:2px solid var(--line);border-radius:12px;
    padding:11px 13px;font-size:1rem;font-family:inherit;line-height:1.7;background:#fbfdff;resize:vertical;}
  textarea.ans:focus{outline:none;border-color:var(--blue);background:#f3faff;}

  /* 重組句子：字卡 */
  .build-area{border:2px dashed #cfe3f7;border-radius:12px;min-height:52px;padding:9px;
    margin:8px 0;display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:#fbfdff;}
  .build-area .ph{color:#a9bccd;font-size:.9rem;}
  .pool{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;}
  .chip{font-size:1rem;border-radius:10px;padding:8px 14px;cursor:pointer;user-select:none;
    border:1.5px solid transparent;transition:.12s;font-weight:700;}
  .pool .chip{background:#e7f2ff;color:#1b7fd0;border-color:#cfe3f7;}
  .pool .chip:hover{background:#d6e9fb;}
  .pool .chip.used{opacity:.28;pointer-events:none;}
  .build-area .chip{background:var(--blue);color:#fff;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  button.mini{border:1.5px solid var(--blue);background:#fff;color:var(--blue);
    border-radius:10px;padding:7px 14px;font-size:.85rem;font-weight:800;cursor:pointer;}
  button.mini.solid{background:var(--blue);color:#fff;}
  button.mini.ai{background:linear-gradient(135deg,#8b6bff,#2ba6ff);color:#fff;border:0;}

  /* 自評 2/1/0 */
  .selfscore{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:.88rem;}
  .selfscore b{color:var(--gray);}
  .sbtn{border:2px solid var(--line);background:#fbfdff;border-radius:10px;padding:6px 16px;
    font-weight:900;cursor:pointer;font-size:.95rem;color:#2b3a4a;}
  .sbtn.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .score-tag{display:inline-block;font-weight:800;color:#fff;border-radius:7px;
    padding:2px 10px;font-size:.8rem;background:var(--green);}
  .score-tag.half{background:var(--amber);}
  .score-tag.zero{background:var(--red);}
  .ref{color:#14532d;background:#eafaf1;border-radius:9px;padding:7px 12px;margin:6px 0;font-size:.93rem;}
  .rubric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 16px;
    margin:14px 0;font-size:.87rem;color:var(--gray);}
  .rubric b{color:#2b3a4a;}
  .aipanel{margin-top:10px;}
  .aipanel .inner{background:#f3f0ff;border:1.5px solid #d9cfff;border-radius:12px;padding:12px 14px;font-size:.88rem;}
  .aipanel a.linkbtn{display:inline-block;background:linear-gradient(135deg,#8b6bff,#2ba6ff);color:#fff;
    text-decoration:none;border-radius:10px;padding:8px 16px;font-weight:800;font-size:.88rem;}
  @media(max-width:420px){ .zone .items{font-size:1.8rem;} input.gap{width:7em;} }

  /* ─────────── 列印：題目與選項不可以被切到兩頁 ─────────── */
  @media print {
    @page { margin: 14mm 12mm; }
    html, body { background:#fff !important; }
    .wrap { max-width:none; padding:0; }

    /* 螢幕互動用的東西不印出來 */
    .sticky, .actions, .hint, .result, .aipanel,
    button.play, button.rec, button.mini, button.submit, button.reset,
    .audio, .plays, body > a[href="geptkids-hub.html"] { display:none !important; }

    header.top { box-shadow:none; border:1px solid #ccd; }
    header.top, .section-title { -webkit-print-color-adjust:exact; print-color-adjust:exact; }

    /* ★ 核心：一題（題幹＋所有選項＋作答區）永遠留在同一頁 */
    .q, .opt, .yn, .letters,
    .scene, .zone, .passage, .diary, .bank, .hint-card,
    .panels, .panel, .say, .build-area, .pool, .selfscore, .rubric,
    textarea.ans, textarea.said, .exp {
      break-inside: avoid !important;
      page-break-inside: avoid !important;
    }
    /* 圖片／短文／大題標題不要單獨留在頁尾，要和後面的題目黏在一起 */
    .scene, .passage, .diary, .bank, .section-title, .section-desc {
      break-after: avoid !important;
      page-break-after: avoid !important;
    }
    .section-title { break-before: auto; margin-top:14px; }

    /* 紙本上把作答區留白，方便手寫 */
    input.gap { border-bottom:1.5px solid #333; background:#fff !important; }
    textarea.ans, textarea.said { display:block; min-height:52px; background:#fff !important; }
  }
</style>

</head>
<body>
<a href="geptkids-hub.html" style="position:fixed;top:12px;left:12px;background:rgba(255,255,255,.94);color:#2ba6ff;padding:7px 15px;border-radius:20px;text-decoration:none;font-size:.85rem;font-weight:800;z-index:999;box-shadow:0 3px 10px rgba(0,0,0,.15);">&#8592; 回題庫</a>
<div class="wrap">
  <header class="top">
    <h1>小學英檢　寫作測驗　<span style="opacity:.9">第3回</span></h1>
    <p>GEPT Kids Writing　&middot;　第3回　午餐與點心</p>
    <div class="meta">共 2 部分、10 題、滿分 20 分　|　每題 2／1／0 分（同官方標準）　|　拼字與重組自動批改，短句問答可請 AI 老師改</div>
  </header>

  <div class="sticky">
    <div class="bar">
      <span>作答進度</span>
      <div class="track"><div class="fill" id="fill"></div></div>
      <span id="count">0 / 10</span>
    </div>
  </div>

  <div class="rubric"><b>官方給分標準（每題 2 分，共 20 分）</b><br><b>2 分</b>　測驗重點正確。　<b>1 分</b>　測驗重點正確，但有其他錯誤（例如大小寫、標點）。　<b>0 分</b>　測驗重點錯誤或沒有作答。</div>
  <form id="quiz"></form>

  <div class="result" id="result">
    <div class="suns" id="rSuns">☀️</div>
    <div class="score" id="scoreNum">0</div>
    <div class="sub" id="scoreTxt">分</div>
    <div class="lvl" id="rLvl"></div>
    <div class="bd">
      <span style="color:var(--green)">答對 <b id="rOk">0</b></span>
      <span style="color:var(--red)">答錯 <b id="rNo">0</b></span>
      <span style="color:var(--gray)">未作答 <b id="rBlank">0</b></span>
    </div>
    <div class="part" id="rPart"></div>
  </div>

  <div class="actions">
    <button type="button" class="submit" id="submitBtn">送出並查看解析</button>
    <div class="hint" id="hint">尚未作答任何題目</div>
    <button type="button" class="reset" id="resetBtn">重新作答</button>
  </div>

  <footer>小學英檢 GEPT Kids　寫作仿真練習　&middot;　全民補習班</footer>
</div>

<script>
/* ====== 題庫資料 ====== */
const PARTS = [{"title": "第四部分　填填看與短句問答（6 題）", "desc": "請依照圖片和短文的內容，把空格的單字拼出來，再用完整的句子回答問題。注意大小寫、標點和字與字之間的空格。"}, {"title": "第五部分　重組句子（4 題）", "desc": "點下面的字卡，把它們排成一個正確的英文句子。注意句首要大寫、句尾要有標點。"}];

const PASSAGE = {"t": "📔 Lunch at School", "sub": "請依照圖片和文章的內容，把空格裡的單字拼出來。", "plain": "At twelve o'clock Nina eats lunch in the classroom. Today there is rice, chicken and soup. She eats with chopsticks and drinks milk. After lunch she has an apple. Her friend Leo eats a sandwich and drinks juice.", "hints": [{"n": 1, "e": "🍚", "zh": ""}, {"n": 2, "e": "🥢", "zh": ""}, {"n": 3, "e": "🍎", "zh": ""}, {"n": 4, "e": "🥪", "zh": ""}], "html": "<p>At twelve o'clock we eat lunch in the classroom. Today there is {{1}}, chicken and hot soup. It smells so good!</p><p>I eat with {{2}}, but some of my friends use a fork and a spoon. I drink a glass of milk, because I do not like coffee or tea.</p><p>After lunch I eat an {{3}}. It is very sweet. My friend Leo does not like fruit, so he eats a {{4}} and drinks juice. Then we are both full and happy.</p>"};

const Q = [{"n": 1, "p": 0, "type": "spell", "stem": "第 1 格（圖：🍚）", "a": "rice", "zh": "圖是白飯；和 chicken、soup 一起是午餐的主食 rice。"}, {"n": 2, "p": 0, "type": "spell", "stem": "第 2 格（圖：🥢）", "a": "chopsticks", "zh": "圖是筷子；筷子一定是兩支，用複數 chopsticks。"}, {"n": 3, "p": 0, "type": "spell", "stem": "第 3 格（圖：🍎）", "a": "apple", "zh": "圖是蘋果；前面有 an，所以要用母音開頭的 apple。"}, {"n": 4, "p": 0, "type": "spell", "stem": "第 4 格（圖：🥪）", "a": "sandwich", "zh": "圖是三明治；前面有 a，用單數 sandwich。"}, {"n": 5, "p": 0, "type": "answer", "stem": "What does Nina drink at lunch?", "a": "She drinks a glass of milk.", "zh": "重點是 milk。牛奶要用 drink 不是 eat；主詞 She 動詞加 s。"}, {"n": 6, "p": 0, "type": "answer", "stem": "Why does Leo eat a sandwich?", "a": "Because he does not like fruit.", "zh": "問 why 用 Because 開頭；重點是「不喜歡水果」。"}, {"n": 7, "p": 1, "type": "reorder", "stem": "Put the words in the right order.", "chips": ["I", "eat", "lunch", "at", "twelve", "o'clock", "."], "a": "I eat lunch at twelve o'clock.", "zh": "時刻前面用 at；eat lunch 中間不加 the。"}, {"n": 8, "p": 1, "type": "reorder", "stem": "Put the words in the right order.", "chips": ["The", "soup", "is", "very", "hot", "."], "a": "The soup is very hot.", "zh": "be 動詞＋very＋形容詞。"}, {"n": 9, "p": 1, "type": "reorder", "stem": "Put the words in the right order.", "chips": ["What", "do", "you", "want", "to", "eat", "?"], "a": "What do you want to eat?", "zh": "want to＋原形動詞；主詞 you 用助動詞 do。"}, {"n": 10, "p": 1, "type": "reorder", "stem": "Put the words in the right order.", "chips": ["There", "are", "five", "cookies", "on", "the", "dish", "."], "a": "There are five cookies on the dish.", "zh": "複數用 There are；地點片語放句尾。"}];
/* ====== 產生畫面 ====== */
const form = document.getElementById('quiz');
const TOTAL = Q.length;                 // 10 題
const FULL  = TOTAL * 2;                // 滿分 20 分
let submitted = false;
const state = {};                       // n -> {score:0/1/2}
const build = {};                       // 重組題：已排好的字卡

function norm(s){ return (s||'').trim().replace(/\s+/g,' '); }
function loose(s){ return norm(s).toLowerCase().replace(/[.!?,]/g,''); }

/* ---------- 第四部分：短文 ＋ 圖示提示 ---------- */
function renderPassage(){
  const p = PASSAGE;
  const wrap = document.createElement('div'); wrap.className = 'diary';
  const hints = p.hints && p.hints.length
    ? `<div class="hints">${p.hints.map(h=>`<div class="hint-card"><span class="n">${h.n}</span>
        <div class="e">${h.e}</div><div class="zh">${h.zh}</div></div>`).join('')}</div>` : '';
  let body = p.html.replace(/\{\{(\d+)\}\}/g, (m,n)=>
    `<span class="gapnum">${n}</span><input class="gap" id="gap${n}" autocomplete="off" spellcheck="false">`);
  wrap.innerHTML = `<h3>${p.t}</h3><p class="sub">${p.sub||''}</p>${hints}${body}`;
  form.appendChild(wrap);
}

let lastPart = -1;
Q.forEach((q,idx)=>{
  if(q.p!==lastPart){
    const st=document.createElement('div'); st.className='section-title s'+q.p; st.textContent=PARTS[q.p].title;
    const sd=document.createElement('div'); sd.className='section-desc'; sd.textContent=PARTS[q.p].desc;
    form.appendChild(st); form.appendChild(sd);
    if(q.p===0) renderPassage();
    lastPart=q.p;
  }
  if(q.type==='spell') return;          // 拼字題就是短文裡的空格，不另外做卡片

  const card=document.createElement('div'); card.className='q'; card.id='q'+q.n;
  card.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${q.stem}</div>`;

  if(q.type==='answer'){
    const ta=document.createElement('textarea');
    ta.className='ans'; ta.id='ta'+q.n; ta.placeholder='用一個完整的英文句子回答…';
    ta.addEventListener('input',updateProgress);
    card.appendChild(ta);
    const row=document.createElement('div'); row.className='btn-row';
    const ai=document.createElement('button');
    ai.type='button'; ai.className='mini ai'; ai.textContent='🤖 請 AI 老師批改';
    ai.addEventListener('click',()=>askAI(q));
    row.appendChild(ai); card.appendChild(row);
    const ap=document.createElement('div'); ap.className='aipanel'; ap.id='ai'+q.n; card.appendChild(ap);
  }

  if(q.type==='reorder'){
    build[q.n]=[];
    const area=document.createElement('div'); area.className='build-area'; area.id='ba'+q.n;
    const pool=document.createElement('div'); pool.className='pool'; pool.id='pool'+q.n;
    q.chips.forEach((c,i)=>{
      const chip=document.createElement('span'); chip.className='chip'; chip.textContent=c; chip.dataset.i=i;
      chip.addEventListener('click',()=>{
        if(submitted) return;
        chip.classList.add('used'); build[q.n].push({t:c,i:i}); drawBuild(q.n); updateProgress();
      });
      pool.appendChild(chip);
    });
    card.appendChild(area); card.appendChild(pool);
    const row=document.createElement('div'); row.className='btn-row';
    const rs=document.createElement('button'); rs.type='button'; rs.className='mini'; rs.textContent='↺ 重排';
    rs.addEventListener('click',()=>{ if(submitted) return; build[q.n]=[];
      pool.querySelectorAll('.chip').forEach(c=>c.classList.remove('used')); drawBuild(q.n); updateProgress(); });
    row.appendChild(rs); card.appendChild(row);
    drawBuild(q.n, area);   // 傳 element，因為 card 還沒進 DOM
  }

  const exp=document.createElement('div'); exp.className='exp'; exp.id='exp'+q.n;
  card.appendChild(exp);
  form.appendChild(card);
});

function drawBuild(n, el){
  const area = el || document.getElementById('ba'+n);
  if(!build[n].length){ area.innerHTML='<span class="ph">點下面的字卡，把句子排出來（點已排好的字卡可以拿掉）</span>'; return; }
  area.innerHTML='';
  build[n].forEach((o,k)=>{
    const c=document.createElement('span'); c.className='chip'; c.textContent=o.t;
    c.addEventListener('click',()=>{ if(submitted) return;
      build[n].splice(k,1);
      document.querySelector(`#pool${n} .chip[data-i="${o.i}"]`).classList.remove('used');
      drawBuild(n); updateProgress(); });
    area.appendChild(c);
  });
}
function builtSentence(n){ return build[n].map(o=>o.t).join(' ').replace(/\s+([.?!,])/g,'$1'); }

/* ---------- 進度 ---------- */
function doneCount(){
  let c=0;
  Q.forEach(q=>{
    if(q.type==='spell'){ if(norm(document.getElementById('gap'+q.n).value)) c++; }
    else if(q.type==='answer'){ if(norm(document.getElementById('ta'+q.n).value)) c++; }
    else if(q.type==='reorder'){ if(build[q.n].length) c++; }
  });
  return c;
}
function updateProgress(){
  const c=doneCount();
  document.getElementById('count').textContent=`${c} / ${TOTAL}`;
  document.getElementById('fill').style.width=(c/TOTAL*100)+'%';
  document.getElementById('hint').textContent =
    c===TOTAL ? `已完成全部 ${TOTAL} 題` : (c===0 ? '尚未作答（仍可送出看參考答案）' : `已作答 ${c} 題，還有 ${TOTAL-c} 題（仍可送出）`);
}

/* ---------- AI 老師批改（沿用零成本做法：複製指令 → 開 ChatGPT 貼上） ---------- */
function askAI(q){
  const ta=document.getElementById('ta'+q.n);
  const panel=document.getElementById('ai'+q.n);
  const ans=norm(ta.value);
  if(!ans){ panel.innerHTML='<div class="inner">✏️ 先寫下你的英文句子，再請 AI 老師批改唷。</div>'; return; }
  const prompt =
`你是一位親切的「小學英檢（GEPT Kids，CEFR A1）」英文寫作老師，正在批改台灣小學高年級學生的短句問答。請全程用繁體中文批改，語氣鼓勵、具體、小學生看得懂。

【短文情境】
${PASSAGE.plain}

【題目】
${q.stem}

【參考答案】
${q.a}

【學生寫的句子】
${ans}

【請依下面 5 點批改】
1. ✅ 有沒有答到題目問的重點？（這是官方給分的關鍵）
2. 🔴 文法錯誤：原句 → 建議改法，附一句中文說明。沒有就寫「無」。
3. 🔵 書寫格式：句首大寫、句尾標點、字與字之間的空格有沒有錯？沒有就寫「無」。
4. 📊 依小學英檢官方標準給分（2 分＝測驗重點正確；1 分＝重點正確但有其他錯誤；0 分＝重點錯誤或沒作答），並說明為什麼。
5. 💬 給一句鼓勵，並指出下次最該注意的一件事。`;
  if(navigator.clipboard) navigator.clipboard.writeText(prompt).catch(()=>{});
  panel.innerHTML=`<div class="inner">
    <b>🤖 批改指令已複製好了！</b>
    <ol style="margin:8px 0 10px;padding-left:20px;line-height:1.9">
      <li>點下面按鈕開 ChatGPT（免登入也能用）</li>
      <li>在對話框「貼上」（電腦 Ctrl+V／Mac ⌘+V；手機長按選貼上）</li>
      <li>送出，就會看到批改和 2／1／0 的分數</li>
    </ol>
    <a class="linkbtn" target="_blank" rel="noopener" href="https://chatgpt.com/?q=${encodeURIComponent(prompt)}">開 ChatGPT ↗</a>
  </div>`;
}

/* ---------- 送出批改 ---------- */
const submitBtn=document.getElementById('submitBtn');
const resetBtn=document.getElementById('resetBtn');

submitBtn.addEventListener('click',()=>{
  submitted=true;
  let total=0, auto=0, selfN=0;
  Q.forEach(q=>{
    let sc=0, mine='';
    if(q.type==='spell'){
      const el=document.getElementById('gap'+q.n); mine=norm(el.value);
      el.readOnly=true;
      if(mine===q.a) sc=2;
      else if(loose(mine)===loose(q.a) && mine) sc=1;      // 拼對但大小寫不同
      else sc=0;
      el.classList.add(sc===2?'ok':sc===1?'half':'bad');
      auto+=sc;
    } else if(q.type==='reorder'){
      mine=builtSentence(q.n);
      if(mine===q.a) sc=2;
      else if(loose(mine)===loose(q.a) && mine) sc=1;      // 詞序對但大小寫或標點錯
      else sc=0;
      auto+=sc;
    } else {                                              // 短句問答：學生／老師自評
      mine=norm(document.getElementById('ta'+q.n).value);
      document.getElementById('ta'+q.n).readOnly=true;
      sc=null; selfN++;
    }
    state[q.n]={score:sc};
    if(sc!==null) total+=sc;
    showExp(q, mine, sc);
  });
  renderScore();
  submitBtn.style.display='none';
  document.getElementById('hint').style.display='none';
  resetBtn.style.display='block';
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
});

function showExp(q, mine, sc){
  const exp=document.getElementById('exp'+q.n) ||
    (function(){ // 拼字題沒有卡片，把解析掛在短文下面
      const d=document.createElement('div'); d.className='q'; d.id='q'+q.n;
      d.innerHTML=`<div class="stem"><span class="num">${q.n}</span>${q.stem}</div>`;
      const e=document.createElement('div'); e.className='exp'; e.id='exp'+q.n; d.appendChild(e);
      document.querySelector('.diary').after(d); return e;
    })();
  const tag = sc===null ? '<span class="score-tag half">請自評或請 AI 批改</span>'
    : `<span class="score-tag ${sc===2?'':sc===1?'half':'zero'}">${sc} 分 / 2 分</span>`;
  let self='';
  if(sc===null){
    self=`<div class="selfscore"><b>對照參考答案，給自己打分：</b>
      ${[2,1,0].map(v=>`<button type="button" class="sbtn" data-n="${q.n}" data-v="${v}">${v} 分</button>`).join('')}</div>`;
  }
  exp.innerHTML=`${tag}
    <div class="ref"><b>參考答案</b>　${q.a}</div>
    ${mine?`<div class="en"><b>你寫的</b>&nbsp;${mine.replace(/</g,'&lt;')}</div>`:''}
    <div class="zh"><b>中</b>&nbsp;${q.zh}</div>${self}`;
  exp.classList.add('show');
  exp.querySelectorAll('.sbtn').forEach(b=>b.addEventListener('click',()=>{
    exp.querySelectorAll('.sbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    state[q.n].score=parseInt(b.dataset.v);
    renderScore();
  }));
}

function renderScore(){
  let got=0, graded=0;
  Q.forEach(q=>{ const s=state[q.n]?.score; if(s!==null && s!==undefined){ got+=s; graded++; } });
  const max=graded*2;
  const pct = max ? Math.round(got/max*100) : 0;
  document.getElementById('rSuns').textContent = '✍️';
  document.getElementById('scoreNum').textContent = got;
  document.getElementById('scoreTxt').textContent = `分 / ${FULL} 分（已評 ${graded} / ${TOTAL} 題）`;
  document.getElementById('rLvl').textContent =
    graded<TOTAL ? '短句問答請自評或用 AI 批改，分數才會完整' :
    (pct>=90?'表現優異　Excellent!':pct>=70?'表現良好　Good job!':'加油，下次會更好！');
  document.getElementById('rOk').textContent   = Q.filter(q=>state[q.n]?.score===2).length;
  document.getElementById('rNo').textContent   = Q.filter(q=>state[q.n]?.score===0).length;
  document.getElementById('rBlank').textContent= Q.filter(q=>state[q.n]?.score===1).length;
  document.getElementById('rPart').textContent =
    `寫作佔「閱讀與寫作」成績的 40%（閱讀佔 60%）　·　滿分 20 分`;
  document.getElementById('result').classList.add('show');
}

resetBtn.addEventListener('click',()=>{ location.reload(); });

/* 成績卡標籤改成寫作用語 */
document.querySelector('.result .bd').innerHTML =
  '<span style="color:var(--green)">2 分 <b id="rOk">0</b></span>' +
  '<span style="color:var(--amber)">1 分 <b id="rBlank">0</b></span>' +
  '<span style="color:var(--red)">0 分 <b id="rNo">0</b></span>';

updateProgress();
</script>
</body>
</html>
