<div class="bar">
 <b>🖨 第 33 回　地形與地方　聽力測驗　列印版</b>
 <button class="s" onclick="show('s')">🖨 列印學生卷</button>

</div>
<div id="root"></div>
<script>
/* 圖形素材（第33回 地形與地方） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/33/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/33/p3_${n}.jpg?v=r33q27ph-20261031" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const ISLAND=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q1.jpg" alt="question 1 picture">`;
const FOREST=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q2.jpg" alt="question 2 picture">`;
const WATERFALL=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q3.jpg" alt="question 3 picture">`;
const RANGE=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q4.jpg" alt="question 4 picture">`;
const RAINBOW=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:ISLAND,o:["A green island covered with trees.","A small island with no trees on it.","A green island with a big city on it."],a:0,sen:"For question one, look at the picture. What is in the ocean?",szh:"第一題，請看圖片。海洋(ocean)中有什麼？",en:"A green island covered with trees.",zh:"深藍的海洋(ocean)中有一座長滿樹林的綠色島嶼(island)，正確。島上滿滿都是樹，不是沒有樹；島上看不到任何城市或大樓。選 A"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">TRIP PRICES</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Boat</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Forest walk</td><td style="text-align:right;font-weight:700">$200</td></tr><tr><td style="padding:4px 30px 4px 0">Bus</td><td style="text-align:right;font-weight:700">$150</td></tr><tr><td style="padding:4px 30px 4px 0">Desert jeep</td><td style="text-align:right;font-weight:700">$400</td></tr></table></div>`,o:["He will have four hundred dollars left.","He will have six hundred dollars left.","He will have seven hundred dollars left."],a:0,sen:"For question two, look at the picture. Ben has nine hundred dollars. He takes the boat and goes on the forest walk. How much will he have left?",szh:"第二題，請看圖片。班有九百元。他搭船，還參加森林(forest)健行。他還剩多少錢？",en:"He will have four hundred dollars left.",zh:"價目表上船300元、森林(forest)健行200元，一共500元，900減500剩400元。剩六百元是只算了船的300元；剩七百元是只算了森林健行的200元，都漏掉一項。選 A"},
{n:3,p:0,fig:WATERFALL,o:["Snow is coming down a tall rock.","A waterfall is coming down into the sea.","A waterfall is coming down a tall rock."],a:2,sen:"For question three, look at the picture. What can you see on the right side of the picture?",szh:"第三題，請看圖片。你可以在圖片右邊看到什麼？",en:"A waterfall is coming down a tall rock.",zh:"右邊有一道瀑布(waterfall)從高高的岩壁(rock)上流下來，正確。下方是石頭和小河，不是大海(sea)；從岩壁上落下的是水，不是雪，雪只在遠方山上一點點。選 C"},
{n:4,p:0,fig:RANGE,o:["He is standing and looking at the mountain range.","He is sitting on a rock and looking at the mountain range.","He is standing and looking at a waterfall."],a:0,sen:"For question four, look at the picture. What is the person in the red coat doing?",szh:"第四題，請看圖片。穿紅色外套的人在做什麼？",en:"He is standing and looking at the mountain range.",zh:"穿紅外套的人站在山頂上，望著金黃(golden)陽光下的一整片山脈(range)，正確。他是站著，不是坐在石頭(rock)上；圖中沒有瀑布(waterfall)，他看的是山脈和雲海。選 A"},
{n:5,p:0,fig:`<svg class="chart" width="302" height="200" viewBox="0 0 302 200"><rect x="1" y="1" width="300" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="151" y="26" text-anchor="middle" font-size="16" font-weight="700">Visitors</text><line x1="22" y1="150" x2="284" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="45" font-size="14" font-weight="700" text-anchor="middle">70</text><rect x="96" y="79" width="44" height="71" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="74" font-size="14" font-weight="700" text-anchor="middle">50</text><rect x="162" y="93" width="44" height="57" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="88" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="228" y="107" width="44" height="43" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="102" font-size="14" font-weight="700" text-anchor="middle">30</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Coast</text><text x="118" y="167" text-anchor="middle">Desert</text><text x="184" y="167" text-anchor="middle">Forest</text><text x="250" y="167" text-anchor="middle">Island</text></g></svg>`,o:["Seventy more people went.","Twenty more people went.","Forty more people went."],a:2,sen:"For question five, look at the picture. How many more people went to the coast than to the island?",szh:"第五題，請看圖片。去海岸(coast)的人比去島(island)的多多少人？",en:"Forty more people went.",zh:"圖中海岸(coast)70人、島(island)30人，70減30，多了40人。七十是海岸本身的人數，沒有減掉島的；二十是拿海岸跟沙漠(desert)的50人比，看錯了項目。選 C"},
{n:6,p:1,o:["Yes, I'll go to sleep early tonight.","Never. But I'd like to try it this summer.","I sleep eight hours every night."],a:1,sen:"Have you ever slept in a tent?",szh:"你曾經(ever)睡過帳篷嗎？",en:"Never. But I'd like to try it this summer.",zh:"問有沒有曾經(ever)睡過帳篷，答「從來沒有(never)，不過我今年夏天想試試」最自然。「是的，我今晚會早點睡(sleep)」只是重複 sleep，沒談帳篷；「我每晚睡八小時」答的是睡多久。選 B"},
{n:7,p:1,o:["Just up to that level. Don't waste any.","The pot has a wide mouth.","Put it on the stove, please."],a:0,sen:"How much water should I put in the pot?",szh:"我應該在鍋子裡放多少水？",en:"Just up to that level. Don't waste any.",zh:"問要放「多少」水，答「到那個高度(level)就好，別浪費(waste)」回答了份量。「鍋子的口(mouth)很寬」描述的是鍋子；「請放到爐子上」答的是放哪裡。選 A"},
{n:8,p:1,o:["Because I studied very hard.","On Friday morning.","Sorry, there's an error. You really got eighty."],a:2,sen:"Why is my test score so low?",szh:"我的考試分數為什麼這麼低？",en:"Sorry, there's an error. You really got eighty.",zh:"問分數為什麼這麼低，老師回「抱歉，有個錯誤(error)，你其實考八十分」說明原因。「因為(because)我很用功」人物不對，而且用功不會造成低分；「星期五(Friday)早上(morning)」答的是時間。選 C"},
{n:9,p:1,o:["It's about five hundred grams.","Several glass cups, so be careful.","It should come very soon."],a:1,sen:"What does this big box contain?",szh:"這個大箱子裝(contain)了什麼？",en:"Several glass cups, so be careful.",zh:"問箱子裡裝(contain)了什麼，答「好幾個(several)玻璃杯，所以要小心」回答了內容。「應該很快(soon)就會到」答的是時間；「大約五百公克(gram)」答的是重量。選 B"},
{n:10,p:1,o:["He's wearing a gray tie.","He'll leave very soon.","He's a town official. He's here to give a talk."],a:2,sen:"Who is that man in the formal suit?",szh:"那位穿正式(formal)西裝的男士是誰？",en:"He's a town official. He's here to give a talk.",zh:"問那位男士「是誰」，答「他是鎮上的官員(official)，來演講的」說出身分。「他打著灰色(gray)領帶」只描述穿著；「他很快(soon)就要走了」答的是時間。選 C"},
{n:11,p:1,o:["I gave my speech yesterday.","Don't worry. It ended at ten.","You'll be fine. You practiced all week."],a:2,sen:"I'm so worried about my speech tomorrow.",szh:"我好擔心(worry)明天的演講。",en:"You'll be fine. You practiced all week.",zh:"對方擔心(worry)明天的演講，回「你會沒問題的，你練習了一整週」是安慰。「別擔心，十點就結束了」用過去式，但演講在明天；「我昨天演講過了」說的是自己，沒有回應對方。選 C"},
{n:12,p:1,o:["We discussed it for an hour.","How about Friday, after class?","Let's go to an island."],a:1,sen:"When can we discuss the class trip?",szh:"我們什麼時候可以討論(discuss)班遊？",en:"How about Friday, after class?",zh:"問「什麼時候」討論(discuss)，答「星期五(Friday)下課後如何？」才是時間。「我們去島(island)上吧」答的是去哪裡；「我們討論了一小時」時態不對。選 B"},
{n:13,p:1,o:["It chased a cat through the wet garden.","Mud is good for flowers.","It's sleeping in its bed now."],a:0,sen:"Why is the puppy covered in mud?",szh:"小狗為什麼全身都是泥巴(mud)？",en:"It chased a cat through the wet garden.",zh:"問小狗為什麼滿身泥巴(mud)，答「牠追(chase)一隻貓穿過(through)濕濕的花園」說出原因。「泥巴對花有好處」只是重複 mud；「牠現在在床上睡覺(sleep)」答非所問。選 A"},
{n:14,p:1,o:["The kitchen is on the first floor.","Let me call someone to fix it.","Then let's go running in the park."],a:1,sen:"The kitchen faucet won't stop running.",szh:"廚房的水龍頭(faucet)一直流個不停。",en:"Let me call someone to fix it.",zh:"對方說水龍頭(faucet)關不起來，回「我找人來修」最自然。「那我們去公園跑步吧」是把 running（流水）聽成跑步的同字陷阱；「廚房在一樓」只是重複 kitchen。選 B"},
{n:15,p:1,o:["They'll go to sleep at nine.","Our new babysitter, Amy.","Yes, they're very active."],a:1,sen:"Who is taking care of the kids on Friday night?",szh:"星期五(Friday)晚上誰照顧孩子？",en:"Our new babysitter, Amy.",zh:"問「誰」照顧孩子，答「我們的新保母(babysitter) Amy」說出人物。「他們九點睡覺(sleep)」答的是時間；用 Yes 回答 Who 問句，「他們很活潑(active)」也沒說是誰。選 B"},
{n:16,p:2,o:["On a boat to the island.","On the island, by the sea.","In a tea shop by the sea."],a:2,sen:"M: Two hot teas, please. Can we sit by the window? &nbsp;W: Of course. Dad, look at the sea. The waves are so big today. &nbsp;M: Yes. I hope the boat to the island still leaves at three. &nbsp;W: The sign by the door says it will wait until the wind stops. &nbsp;M: Then we have time. Let's drink our tea here first. &nbsp;Q: Where are the speakers?",szh:"男：請給我們兩杯熱茶。我們可以坐窗邊嗎？　女：當然可以。爸，你看海。今天浪好大。　男：對啊。我希望去島(island)上的船三點還會開。　女：門邊的告示說，要等風停了才開。　男：那我們有時間。先在這裡把茶喝完吧。　問：說話的人在哪裡？",en:"In a tea shop by the sea.",zh:"兩人點了熱茶、坐在窗邊，還說要先在「這裡」喝茶，等船開，所以是在海(sea)邊的茶店。船還沒開，他們不在船上；他們還在等船去島(island)，所以也不在島上。選 C"},
{n:17,p:2,o:["The nights were very cold.","She slept well in her tent.","It was hot all day and all night."],a:0,sen:"M: How was your trip to the desert? &nbsp;W: It's my best memory this year. In the day, it was so hot that my tongue was always dry. &nbsp;M: Did you sleep in a tent? &nbsp;W: Yes, but at night it was so cold that I couldn't sleep. We spread a blanket on the sand and watched the stars. &nbsp;Q: What does the woman say about the desert?",szh:"男：你的沙漠(desert)之旅怎麼樣？　女：是我今年最棒的回憶(memory)。白天熱到我的舌頭(tongue)一直都很乾。　男：你睡(sleep)帳篷嗎？　女：對，但晚上冷到睡不著。我們在沙上鋪開(spread)毯子看星星。　問：女士怎麼說沙漠？",en:"The nights were very cold.",zh:"女士說白天很熱，但晚上冷到睡不著，所以「晚上很冷」正確。「日夜都很熱」忽略了晚上很冷；她說冷到睡不著(sleep)，所以不是睡得很好。選 A"},
{n:18,p:2,o:["Buying a tent for the car.","Looking for a hotel at the coast.","Getting ready for a trip."],a:2,sen:"W: Do we have the tent, Dad? &nbsp;M: Yes, it's in the car. I also put in two sleeping bags and the flashlight. &nbsp;W: What about food? We'll be at the coast for three days. &nbsp;M: Mom is making sandwiches. And the news says it will be sunny all week. &nbsp;W: Great! I can't wait to sleep under the stars. &nbsp;Q: What are the speakers doing?",szh:"女：爸，我們有帳篷嗎？　男：有，在車上。我還放了兩個睡袋和手電筒。　女：食物呢？我們要在海岸(coast)待三天。　男：媽媽在做三明治。而且新聞說整個星期都是晴天。　女：太好了！我等不及要睡在星空下了。　問：說話的人在做什麼？",en:"Getting ready for a trip.",zh:"兩人在確認帳篷、睡袋、手電筒和食物都準備好了，要去海岸(coast)待三天，所以是在準備旅行。帳篷已經在車上，不是要買；對話沒有提到旅館，他們要睡的是帳篷。選 C"},
{n:19,p:2,o:["In a forest near the sea.","Up in the mountains.","By the coast."],a:1,sen:"M: Is the waterfall near the coast? &nbsp;W: No, it's up in the mountains. You walk through a forest to get there. &nbsp;M: How will I know where to turn? &nbsp;W: Look for a big rock with the shape of a triangle. &nbsp;Q: Where is the waterfall?",szh:"男：瀑布(waterfall)在海岸(coast)附近嗎？　女：不是，在山上。要穿過(through)一片森林(forest)才到得了。　男：我怎麼知道在哪裡轉彎？　女：找一塊三角形(triangle)的大石頭(rock)。　問：瀑布在哪裡？",en:"Up in the mountains.",zh:"男士以為在海岸(coast)附近，女士更正：在山上，要穿過森林(forest)才到。海岸是男士猜錯的；森林只是路上會經過的地方，而且不在海(sea)邊。選 B"},
{n:20,p:2,o:["She thinks he was wrong about the weather last time.","She thinks Saturday will be good for swimming.","She thinks a rainbow will come out soon."],a:0,sen:"M: Let's go to the coast on Saturday. We can swim in the sea. &nbsp;W: The news says it will rain all day. &nbsp;M: It may stop soon, and we might even see a rainbow. &nbsp;W: Last time you said the same thing, and we got wet for five hours. &nbsp;M: OK, OK. Let's check the news again on Friday night. &nbsp;Q: What does the woman think about the man's idea?",szh:"男：我們星期六去海岸(coast)吧。可以在海(sea)裡游泳。　女：新聞說會下一整天的雨。　男：可能很快(soon)就停了，說不定(even)還能看到彩虹(rainbow)。　女：上次你也這樣說，結果我們濕了五個小時。　男：好啦好啦。星期五晚上再看一次新聞。　問：女士覺得男士的想法怎麼樣？",en:"She thinks he was wrong about the weather last time.",zh:"女士說上次男士也這樣說，結果大家濕了五個小時，表示她認為男士上次對天氣的判斷是錯的，所以這次也不太相信他。她提到新聞說會下一整天的雨，所以不覺得星期六適合游泳；彩虹(rainbow)只是男士的期待，女士並不相信。選 A"},
{n:21,p:2,o:["A long mountain range.","A wide plain.","The ocean."],a:1,sen:"M: What did you see on the train ride to Taitung? &nbsp;W: A long mountain range on one side, and the ocean on the other. &nbsp;M: Wow. And at the start? &nbsp;W: At the start, just a wide plain with rice fields. &nbsp;Q: What did the woman see first?",szh:"男：你搭火車去台東的路上看到什麼？　女：一邊是長長的山脈(range)，另一邊是海洋(ocean)。　男：哇。那一開始呢？　女：一開始只有一片種稻的寬廣平原(plain)。　問：女士最先看到什麼？",en:"A wide plain.",zh:"女士先說山脈(range)和海洋(ocean)，但那是後段的景色；男士問一開始，她說是平原(plain)，所以最先看到的是平原。山脈和海洋是之後才看到的。選 B"},
{n:22,p:2,o:["A flashlight.","His phone.","A candle."],a:0,sen:"W: The lights just went out! &nbsp;M: Don't worry. I'll use the light on my phone. &nbsp;W: Your phone is nearly dead. Use the flashlight in my bag. &nbsp;M: OK. Got it. &nbsp;Q: What will the man use to see?",szh:"女：燈突然熄了！　男：別擔心(worry)，我用手機的燈。　女：你的手機快沒電了，用我包包裡的手電筒(flashlight)。　男：好，拿到了。　問：男士會用什麼來照明？",en:"A flashlight.",zh:"男士本來想用手機，但女士說手機快沒電，叫他用包包裡的手電筒(flashlight)，他說拿到了。手機是被否定的；蠟燭對話中沒有提到。選 A"},
{n:23,p:2,o:["Cut the onions.","Sort the carrots.","Set the table."],a:2,sen:"W: Dad, why are you crying? &nbsp;M: I'm not sad. I'm cutting onions for the soup. &nbsp;W: Can I help? Do you mind if I sort the carrots? &nbsp;M: No need. They're already in the pot. Could you set the table, please? &nbsp;Q: What will the girl do?",szh:"女：爸，你為什麼在哭？　男：我不是難過，我在切洋蔥(onion)煮湯。　女：我可以幫忙嗎？你介意(mind)我來整理(sort)紅蘿蔔嗎？　男：不用了，已經下鍋了。你可以擺(set)餐桌嗎？　問：女孩會做什麼？",en:"Set the table.",zh:"切洋蔥(onion)是爸爸在做的事；女孩想整理(sort)紅蘿蔔，但爸爸說已經下鍋了；最後爸爸請她擺(set)餐桌。選 C"},
{n:24,p:2,o:["An American student.","A teacher from Canada.","An American teacher."],a:1,sen:"M: Hi, I'm Jim. I teach English in the classroom next to yours. &nbsp;W: Nice to meet you. Are you American? &nbsp;M: Lots of people think so, but I'm from Canada. &nbsp;Q: Who is Jim?",szh:"男：嗨，我是 Jim，在你隔壁教室(classroom)教英文。　女：很高興認識你。你是美國人(American)嗎？　男：很多人都這麼以為，不過我是加拿大人。　問：Jim 是誰？",en:"A teacher from Canada.",zh:"Jim 在隔壁教室教英文，是老師；他說很多人以為他是美國人(American)，但他其實來自加拿大。美國老師是別人的誤會；他是教書的，不是學生。選 B"},
{n:25,p:2,o:["Two hundred grams.","Three hundred grams.","Five hundred grams."],a:0,sen:"W: This cake needs five hundred grams of flour. &nbsp;M: We only have three hundred in the kitchen. &nbsp;W: So how much more do we need? &nbsp;M: Let me figure it out first. Then I'll go buy the rest. &nbsp;Q: How much more flour do they need?",szh:"女：這個蛋糕需要五百公克(gram)麵粉。　男：我們廚房只有三百公克。　女：那還需要多少？　男：我先算算(figure)看，再去把不夠的買回來。　問：他們還需要多少麵粉？",en:"Two hundred grams.",zh:"需要五百公克(gram)，已經有三百，所以還差兩百公克。五百是全部需要的量；三百是家裡已經有的量。選 A"},
{n:26,p:3,pic:true,o:[BARS("Camping Spots",["Coast","Forest","Island"],[50,80,20]),BARS("Camping Spots",["Coast","Forest","Island"],[50,20,80]),BARS("Camping Spots",["Coast","Forest","Island"],[80,50,20])],a:0,sen:"Every year, our club votes on where to camp. Last year, the coast was the top choice. This year, more members wanted the forest than the coast, because it's cooler there, especially in July. The island got the fewest votes, because the boat ride is too long. &nbsp;Q: Which chart shows this year's votes?",szh:"我們社團每年投票決定去哪裡露營。去年海岸(coast)是第一名。今年想去森林(forest)的社員比海岸多，因為那裡比較涼，尤其(especially)是七月。島(island)的票最少，因為坐船太久。　問：哪張圖是今年的投票結果？",en:"Forest most, coast second, island fewest.",zh:"今年森林比海岸多，島最少，所以森林最高、海岸第二、島最低。海岸最高的那張是去年(last year)的結果；島最高的那張與「島的票最少」相反。選 A"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"Last Friday, our class took a boat to a small island. We thought the sea would be the best thing to take pictures of, but it rained all morning and the sea looked gray. We took more pictures of the big rocks on the coast than of the sea. Then, after the rain, we walked into the forest and found a waterfall. Everyone took even more pictures of the waterfall than of the rocks. &nbsp;Q: What did the class take the most pictures of?",szh:"上星期五，我們班搭船去一座小島。我們以為海會是最值得拍的，但整個早上都在下雨，海看起來灰灰的。我們拍海岸(coast)大石頭的照片比拍海還多。後來雨停了，我們走進森林發現一座瀑布(waterfall)。大家拍瀑布的照片又比拍石頭更多。　問：全班拍最多照片的是什麼？",en:"The waterfall.",zh:"海整個早上都是灰色，拍得最少；海岸(coast)的大石頭比海多；但瀑布(waterfall)又比石頭更多，所以拍最多的是瀑布。 選 B"},
{n:28,p:3,pic:true,o:[PH('q28c'),PH('q28b'),PH('q28a')],a:2,sen:"My grandpa lives by the sea, and he gets up early every morning. He used to swim in the ocean, but his doctor said the water was too cold for him. Then he tried fishing from the rocks, but he never caught anything. Now he just walks his dog along the golden sand. &nbsp;Q: What does Grandpa do every morning now?",szh:"我爺爺住在海(sea)邊，每天早上(morning)都很早起。他以前在海洋(ocean)裡游泳，但醫生說水對他來說太冷了。後來他試著在岩石(rock)上釣魚，但從來沒(never)釣到過。現在他只是帶狗沿著金黃色(golden)的沙灘散步。　問：爺爺現在每天早上做什麼？",en:"He walks his dog on the beach.",zh:"游泳是「以前」的事，醫生說水太冷；在岩石(rock)上釣魚因為從來沒釣到而放棄；「現在」是帶狗在金色(golden)沙灘散步。選 C"},
{n:29,p:3,pic:true,o:[PH('q29c'),PH('q29b'),PH('q29a')],a:1,sen:"On Sunday, I took my little sister to the park near our home. She ran to the swing first, but it was broken. Then she wanted to ride her bicycle, but one wheel had no air, and we left the pump at home. So she chased the pigeons around the park and laughed the whole time. &nbsp;Q: What did the little sister do in the park?",szh:"週日我帶妹妹去家附近的公園。她先跑去盪鞦韆(swing)，但鞦韆壞了。後來她想騎腳踏車，但有一個輪子沒氣，我們又把打氣筒(pump)留在家。所以她在公園裡追(chase)鴿子，一直笑(laugh)個不停。　問：妹妹在公園做了什麼？",en:"She chased the pigeons.",zh:"盪鞦韆(swing)因為壞了沒玩到；騎腳踏車因為輪子沒氣、沒帶打氣筒(pump)也沒騎成；最後她在公園追(chase)鴿子，一直笑(laugh)。選 B"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30a'),PH('q30c')],a:2,sen:"Last week, I received a box from my aunt in America. I thought it contained a dress, because she sent me one last year. My brother guessed it was chocolate. But the box was very light, only a few hundred grams. When I opened it, I found a small golden rock from the desert. &nbsp;Q: What was in the box?",szh:"上週我收到(receive)美國阿姨寄來的一個箱子。我以為裡面裝(contain)的是洋裝(dress)，因為她去年寄過一件給我。我哥哥猜是巧克力。但箱子很輕，只有幾百公克(gram)。我打開後，發現一塊來自沙漠(desert)的金色(golden)小石頭(rock)。　問：箱子裡裝了什麼？",en:"A small golden rock.",zh:"洋裝(dress)是說話者自己猜的，因為去年收過；巧克力是哥哥猜的；打開後其實是一塊金色(golden)的沙漠小石頭(rock)。選 C"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 33 回　地形與地方　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
