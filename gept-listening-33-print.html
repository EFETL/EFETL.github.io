<script>
/* 圖形素材（第33回 地形與地方） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/33/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const ISLAND=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q1.jpg" alt="question 1 picture">`;
const FOREST=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q2.jpg" alt="question 2 picture">`;
const WATERFALL=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q3.jpg" alt="question 3 picture">`;
const RANGE=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q4.jpg" alt="question 4 picture">`;
const RAINBOW=`<img class="pic-img p0img" src="gept-listening-img/33/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:ISLAND,o:["A big whale in the ocean.","A small boat in the ocean.","A small island in the ocean."],a:2,sen:"For question one, look at the picture. What is in the water?",szh:"第一題，請看圖片。水中是什麼？",en:"A small island in the ocean.",zh:"水中是海洋(ocean)裡的小島(island)，選 C。鯨魚和小船都不在圖中。"},
{n:2,p:0,fig:FOREST,o:["A dry desert with many rocks.","A green forest with many rocks.","A snowy hill with many rocks."],a:1,sen:"For question two, look at the picture. What kind of place is this?",szh:"第二題，請看圖片。這是什麼地方？",en:"A green forest with many rocks.",zh:"圖中是有許多岩石(rock)的綠色森林(forest)，選 B。沙漠和雪山的景色都不同。"},
{n:3,p:0,fig:WATERFALL,o:["Heavy snow falls down the mountain.","Big rocks fall down the mountain.","A waterfall falls down the mountain."],a:2,sen:"For question three, look at the picture. What falls down the cliff?",szh:"第三題，請看圖片。什麼從崖上流下？",en:"A waterfall falls down the mountain.",zh:"從山上流下的是瀑布(waterfall)，選 C。雪和石頭都不是圖中的東西。"},
{n:4,p:0,fig:RANGE,o:["I saw a long mountain range.","I saw a long yellow train.","I saw a long stone bridge."],a:0,sen:"For question four, look at the picture. What did you see this morning?",szh:"第四題，請看圖片。你今早看到什麼？",en:"I saw a long mountain range.",zh:"今早(morning)看到的是一長列山脈(range)，選 A。火車和石橋都不在圖中。"},
{n:5,p:0,fig:RAINBOW,o:["A full moon appears in the sky.","A colorful rainbow appears in the sky.","A flock of birds appears in the sky."],a:1,sen:"For question five, look at the picture. What appears after the rain?",szh:"第五題，請看圖片。雨後出現什麼？",en:"A colorful rainbow appears in the sky.",zh:"雨後天空出現彩虹(rainbow)，選 B。月亮和鳥群都不是雨後的主角。"},

{n:6,p:1,o:["Last weekend with my cousins.","My tent is gray and small.","We sleep in a small tent."],a:2,sen:"How do you enjoy camping in nature?",szh:"你怎麼享受野外露營？",en:"We sleep in a small tent.",zh:"問怎麼享受露營，答『我們睡(sleep)在小帳篷裡』，選 C。A 回答時間，B 只重複露營的東西(tent)。"},
{n:7,p:1,o:["Don't fill it above that level.","This bottle has a wide mouth.","It's a set of three bottles."],a:0,sen:"How should I fill the bottle correctly?",szh:"瓶子我該怎麼正確裝滿？",en:"Don't fill it above that level.",zh:"問怎麼裝水，答『別裝超過那條水位(level)』，選 A。B 說瓶口(mouth)很寬，C 說一組(set)三個瓶子，都沒回答方法。"},
{n:8,p:1,o:["It's due on Friday morning.","I wrote it by myself.","There's an error in the table."],a:2,sen:"Why does the report look wrong here?",szh:"這份報告這裡為什麼看起來不對？",en:"There's an error in the table.",zh:"問報告哪裡不對，答『表格裡有個錯誤(error)』，選 C。A 回答時間(Friday, morning)，B 說誰寫的。"},
{n:9,p:1,o:["It contains several glass cups.","It should arrive very soon.","It weighs five hundred grams."],a:1,sen:"When will my package arrive?",szh:"我的包裹什麼時候到？",en:"It should arrive very soon.",zh:"問包裹何時到，答『應該很快(soon)就到』，選 B。A 說裡面裝(contain)什麼，C 說重量(gram)。"},
{n:10,p:1,o:["The office opens at nine.","The office is on Main Street.","That new official, Mr. Lin."],a:2,sen:"Who works hardest in the town office?",szh:"鎮公所誰工作最努力？",en:"That new official, Mr. Lin.",zh:"問誰最努力，答『那位新來的官員(official)林先生』，選 C。A 回答時間，B 回答地點。"},
{n:11,p:1,o:["Don't worry. It'll be fine.","It starts at ten o'clock.","Is it a formal event?"],a:0,sen:"I am nervous about the big announcement.",szh:"我對這則重大公告很緊張。",en:"Don't worry. It'll be fine.",zh:"對方緊張，回『別擔心(worry)，會沒事的』，選 A。B 說開始時間，C 反問是否正式(formal)，都沒有安慰。"},
{n:12,p:1,o:["It's about two hours away.","Let's discuss it after class.","We went there last year."],a:1,sen:"How should we plan the class trip?",szh:"班遊我們該怎麼計畫？",en:"Let's discuss it after class.",zh:"問怎麼計畫班遊，答『下課後我們討論(discuss)』，選 B。A 回答距離，C 說去年的事。"},
{n:13,p:1,o:["At the dog park near here.","It chased a ball all morning.","It's three years old."],a:1,sen:"Why is the puppy so tired now?",szh:"小狗現在為什麼這麼累？",en:"It chased a ball all morning.",zh:"問小狗為何累，答『牠整個早上都在追(chase)球』，選 B。A 回答地點，C 回答年齡。"},
{n:14,p:1,o:["The faucet won't stop leaking.","It's on the second floor.","The kitchen is very old."],a:0,sen:"What is wrong in the old kitchen?",szh:"舊廚房出了什麼問題？",en:"The faucet won't stop leaking.",zh:"問廚房哪裡有問題，答『水龍頭(faucet)一直漏水』，選 A。B 回答位置，C 只重複 kitchen 和 old。"},
{n:15,p:1,o:["At seven o'clock tonight.","Our babysitter, Miss Chen.","The children are in bed."],a:1,sen:"Who is looking after the children tonight?",szh:"今晚誰照顧孩子？",en:"Our babysitter, Miss Chen.",zh:"問誰照顧孩子，答『我們的保母(babysitter)陳小姐』，選 B。A 回答時間，C 只說孩子在睡覺。"},

{n:16,p:2,o:["A small island.","A mountain village.","A big city."],a:0,sen:"W: Have you ever been to a place without cars? &nbsp;M: Yes! I went to a small place where you can only go by boat. &nbsp;W: Was it quiet? &nbsp;M: Very. We received a warm welcome from everyone there. &nbsp;Q: Where did the man go?",szh:"女：你去過沒有車子的地方嗎(ever)？　男：有！我去過一個只能搭船去的小地方。　女：安靜嗎？　男：很安靜。那裡的人都熱情歡迎(receive)我們。　問：男士去了哪裡？",en:"A small island.",zh:"只能搭船到達的安靜小地方，推斷是小島(island)，選 A。山村和大城市都不需要搭船。"},
{n:17,p:2,o:["A forest.","A desert.","A beach."],a:1,sen:"W: How was your trip, Ben? &nbsp;M: I'll never forget it. I saw only sand and sun, and I needed so much water. &nbsp;W: That sounds hot! &nbsp;Q: Where did Ben go?",szh:"女：班，你的旅行如何？　男：我永遠(never)忘不了。我只看到沙和太陽，而且需要好多水。　女：聽起來好熱！　問：班去了哪裡？",en:"A desert.",zh:"只有沙、太陽、需要很多水，推斷是沙漠(desert)，選 B。海灘(beach)也有沙，但不會缺水，森林也沒有沙。"},
{n:18,p:2,o:["Paint.","Sand.","Mud."],a:2,sen:"M: Anna, why is your new dress so brown? &nbsp;W: It rained all morning, and we played soccer on the field. &nbsp;M: I see. Please change and wash it. &nbsp;Q: What is on Anna's dress?",szh:"男：安娜，你的新洋裝(dress)怎麼變得這麼棕？　女：整個早上都在下雨，我們在球場踢足球。　男：我知道了。請去換掉再洗乾淨。　問：安娜的洋裝上有什麼？",en:"Mud.",zh:"下雨又在球場踢球，裙子變棕色，是泥巴(mud)，選 C。沙子和油漆都不是下雨天球場上會有的。"},
{n:19,p:2,o:["A tall waterfall by the coast.","A busy city street at night.","A quiet beach at sunrise."],a:0,sen:"M: What was the best view on your trip? &nbsp;W: A tall waterfall near the rocky coast. &nbsp;M: Beautiful. &nbsp;Q: What was the best view?",szh:"男：你旅途上最棒的景色是什麼？　女：靠近岩岸(coast)的一道高瀑布(waterfall)。　男：真美。　問：最棒的景色是什麼？",en:"A tall waterfall by the coast.",zh:"是海岸(coast)邊的高瀑布(waterfall)，選 A。"},
{n:20,p:2,o:["A bright sunset.","A full moon.","A rainbow."],a:2,sen:"W: Look, Dad! The sun is shining through the rain. &nbsp;M: And I can see seven colors in the sky. &nbsp;W: It's so beautiful! &nbsp;Q: What do they see?",szh:"女：爸，看！太陽穿過(through)雨在發光。　男：我還看到天上有七種顏色。　女：好美！　問：他們看到什麼？",en:"A rainbow.",zh:"太陽穿過雨、天上有七種顏色，就是彩虹(rainbow)，選 C。日落和月亮都不會有七種顏色。"},
{n:21,p:2,o:["A single hill.","A long mountain range.","A flat plain."],a:1,
 sen:"M: What did you cross on the way north? &nbsp;W: A long mountain range, peak after peak. &nbsp;M: A hard journey. &nbsp;Q: What did the woman cross?",
 szh:"男：往北的路上你翻過什麼？　女：一列長長的山脈(range)，一峰接一峰。　男：辛苦的旅程。　問：女士翻過了什麼？",
 en:"A long mountain range.",zh:"女士翻過長長的山脈(range)，選 B。"},
{n:22,p:2,o:["A flashlight.","A camera.","A map."],a:0,sen:"W: It's too dark in this cave. I can't see my feet. &nbsp;M: Wait. Let me look in my bag. &nbsp;W: Hurry up! I heard a strange sound. &nbsp;M: Here. Now we can see. &nbsp;Q: What did the man take out?",szh:"女：這個洞穴太暗了，我看不到自己的腳。　男：等一下，我翻翻包包。　女：快點！我聽到奇怪的聲音。　男：拿到了。現在看得見了。　問：男士拿出了什麼？",en:"A flashlight.",zh:"洞裡太暗、拿出東西後就看得見，所以是手電筒(flashlight)，選 A。相機和地圖不能照亮。"},
{n:23,p:2,o:["An onion.","A potato.","A carrot."],a:0,sen:"W: Dad, why are you crying? &nbsp;M: I'm cutting something for the soup. It makes my eyes hurt. &nbsp;W: Let me help. Do you mind if I sort the carrots? &nbsp;M: Not at all. Thank you. &nbsp;Q: What is the man cutting?",szh:"女：爸，你為什麼在哭？　男：我在切湯要用的東西，它讓我眼睛痛。　女：我來幫忙。你介意(mind)我整理(sort)胡蘿蔔嗎？　男：一點也不。謝謝你。　問：男士在切什麼？",en:"An onion.",zh:"切東西會讓人流淚，是洋蔥(onion)，選 A。胡蘿蔔(carrot)是女兒要整理的，不是爸爸在切的。"},
{n:24,p:2,o:["A Japanese student.","An English doctor.","An American teacher."],a:2,sen:"M: Hi, I'm Jim. I was born in Texas, but I teach English here. &nbsp;W: Nice to meet you! Is your classroom upstairs? &nbsp;M: Yes. Room 205, next to the library. &nbsp;Q: Who is Jim?",szh:"男：嗨，我是吉姆。我在德州出生，但我在這裡教英文。　女：很高興認識你！你的教室(classroom)在樓上嗎？　男：對。205 室，在圖書館旁邊。　問：吉姆是誰？",en:"An American teacher.",zh:"出生在德州又在這裡教英文，是美國(American)老師，選 C。學生和醫生都不符。"},
{n:25,p:2,o:["A hill near the town.","A wide plain by the sea.","A busy street in town."],a:1,sen:"W: What kind of land is your farm on? &nbsp;M: A wide, flat plain right by the sea. &nbsp;W: Lots of space. &nbsp;Q: What kind of land is the farm on?",szh:"女：你家農場在什麼樣的地上？　男：靠海(sea)的一片寬廣平坦的平原(plain)。　男：空間很大。　問：農場在什麼樣的地上？",en:"A wide plain by the sea.",zh:"農場在靠海(sea)的寬廣平原(plain)，選 B。小山丘和街道都不是對話中的地點。"},

{n:26,p:3,pic:true,o:[BARS("Trip Places",["Island","Forest","Desert"],[50,80,20]),BARS("Trip Places",["Island","Forest","Desert"],[80,50,20]),BARS("Trip Places",["Island","Forest","Desert"],[20,50,80])],a:1,sen:"Our class voted for the best place for a trip. The island was the favorite, because of the ocean and the beach, where kids can stay active. The forest was in the middle, and the desert got the fewest votes, as it is too hot. Our classroom was noisy, and we all laughed. So the island bar should be the tallest. &nbsp;Q: Which chart shows the votes?",szh:"我們班票選最棒的旅遊地點。島嶼(island)最受歡迎，因為有海洋(ocean)和海灘，孩子們可以保持活躍(active)；森林(forest)中等；沙漠(desert)最少票，因為太熱。教室(classroom)裡很吵，大家都笑(laugh)了。所以島嶼長條最高。　問：哪張圖顯示票數？",en:"Island most, desert least.",zh:"島嶼票數最多、沙漠最少，島嶼長條最高，選 B。"},
{n:27,p:3,pic:true,o:[BARS("Rain by Month",["Apr","May","Jun"],[30,55,80]),BARS("Rain by Month",["Apr","May","Jun"],[55,80,30]),BARS("Rain by Month",["Apr","May","Jun"],[80,55,30])],a:2,sen:"Near the coast, we measured the rain over three months. In April the most rain fell, filling the waterfall. In May it was in the middle, and by June the least, when the sky turned gray but stayed dry. So the rain went down each month. Our teacher asked us to figure out why. &nbsp;Q: Which chart shows the rainfall?",szh:"在海岸(coast)附近，我們量了三個月的雨量。四月最多雨，讓瀑布(waterfall)滿溢；五月中等；到六月最少，天空轉灰(gray)卻沒下。所以雨量逐月下降。老師要我們想出(figure)原因。　問：哪張圖顯示雨量？",en:"Apr most, Jun least.",zh:"四月最多、六月最少、逐月下降，選 C。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:0,sen:"On our long hike across the plain, we could not cook. There was no way to boil noodles or steam rice among the rocks. So we cut some simple bread into triangles and ate it by a small waterfall. We used a pump to fill our bottles, so we did not waste water. Our tongues were dry, but the fresh air felt great. &nbsp;Q: What did they eat on the hike?",szh:"在橫越平原(plain)的長途健行中，我們沒辦法煮東西。在岩石(rock)間沒辦法煮麵或蒸飯。所以我們把簡單的麵包切成三角形(triangle)，在一道小瀑布(waterfall)旁吃。我們用幫浦(pump)裝水，沒有浪費(waste)水。舌頭(tongue)很乾，但新鮮空氣讓人舒暢。　問：他們健行時吃什麼？",en:"Simple bread.",zh:"他們吃麵包(bread)，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('rice'),IMG('bread'),IMG('noodles')],a:2,sen:"After a cold day exploring the forest, our group was tired and hungry. We did not want dry bread or cold rice on such a chilly night. So the guide cooked a big pot of hot noodles over the fire. The firelight made every face look golden, and the soup tasted especially good. It became a happy memory for everyone. &nbsp;Q: What did the guide cook in the forest?",szh:"在森林(forest)探險一整個寒冷的白天後，我們又累又餓。這麼冷的夜晚不想吃乾麵包或冷飯。所以嚮導在火上煮了一大鍋熱麵(noodle)。火光把每張臉照得金黃(golden)，湯特別(especially)好喝，成了大家開心的回憶(memory)。　問：嚮導在森林裡煮了什麼？",en:"A pot of noodles.",zh:"嚮導煮了熱麵(noodle)，選 C。麵包、飯為干擾。"},
{n:30,p:3,pic:true,o:[IMG('beach'),IMG('park'),IMG('mountain')],a:0,sen:"For our geography trip, we could pick one kind of land to study. Some liked the mountain range and others liked the park. But we chose the beach by the coast, because we could see the ocean, the sand, and even a rainbow over the sea. Some kids played on the swing, and others spread towels on the sand. &nbsp;Q: Where did the class go for their geography trip?",szh:"地理旅行時，我們可以選一種地形來研究。有些人喜歡山脈(range)，有些人喜歡公園，但我們選了海岸(coast)邊的海灘，因為可以看到海洋(ocean)、沙灘，甚至海上的彩虹(rainbow)。有些孩子玩鞦韆(swing)，有些人把毛巾鋪(spread)在沙灘上。　問：全班地理旅行去了哪裡？",en:"The beach.",zh:"全班去海邊(beach)，選 A。山、公園為干擾。"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 33 回　地形與地方　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}

  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。

  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));

  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */

  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;

    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
