 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}

const Q=[
{n:1,p:0,fig:ISLAND,o:["An island in the ocean, just off the coast.","We sleep several hours.","The official is active."],a:0,

{n:2,p:0,fig:FOREST,o:["The faucet drips.","The rainbow is golden.","A green forest on the plain, full of rock."],a:2,

{n:3,p:0,fig:WATERFALL,o:["The babysitter has a flashlight.","A waterfall runs down through the range of mountains.","We discuss the memory."],a:1,

{n:4,p:0,fig:RANGE,o:["A mountain range; I never ever saw such a view before this morning.","The onion is a triangle.","The dress is gray."],a:0,

{n:5,p:0,fig:RAINBOW,o:["The pump is broken.","We chase the swing.","A golden rainbow appears; the sky was gray, then bright."],a:2,

{n:6,p:1,o:["The official is active.","In the wild I sleep several hours, then I laugh and play in the mud.","The set contains a gram."],a:1,

{n:7,p:1,o:["Keep the water level even, keep it in mind, and open your mouth to drink.","The rainbow is golden.","The faucet drips."],a:0,

 en:"Keep the level even; keep it in mind, open your mouth.",zh:"問怎麼正確裝水，答『把水位(level)保持平(even)，記在心裡(mind)，張開嘴(mouth)喝』，選 A。rainbow/golden、faucet 為干擾。"},
{n:8,p:1,o:["We spread the news.","The pump works.","It is an error, because your dress got torn on the rock."],a:2,
 sen:"Why does the report look wrong here?",szh:"這份報告這裡為什麼看起來不對？",

{n:9,p:1,o:["The forest is green.","It will come soon; the gift set will contain several grams of gold.","The onion is small."],a:1,

 en:"Soon; the set will contain several grams.",zh:"問包裹何時到，答『很快(soon)就到；那組(set)禮盒會裝著(contain)好幾公克(gram)黃金』，選 B。forest、onion 為干擾。"},
{n:10,p:1,o:["Especially the head official is very active; he wears a golden badge with pride.","The waterfall falls.","The dress is gray."],a:0,

{n:11,p:1,o:["The island is far.","The range is high.","Do not worry; we will spread the formal news and sort out the problem."],a:2,

 en:"Do not worry; spread the formal news, sort it.",zh:"問公告的擔憂，答『別擔心(worry)；我們會發布(spread)正式(formal)消息，把問題整理(sort)好』，選 C。island、range 為干擾。"},
{n:12,p:1,o:["The mud is deep.","Figure it out together; we will discuss it and receive a happy memory.","The onion is a triangle."],a:1,
 sen:"How should we plan the class trip?",szh:"班遊我們該怎麼計畫？",
 en:"Figure it out; discuss it and receive a memory.",zh:"問怎麼計畫，答『一起想清楚(figure)；我們會討論(discuss)，並得到(receive)美好回憶(memory)』，選 B。mud、onion/triangle 為干擾。"},
{n:13,p:1,o:["The dog chased the swing in the park; do not waste your tongue shouting at it.","The pump is broken.","The rainbow is golden."],a:0,

 en:"It chased the swing; do not waste your tongue.",zh:"問小狗為何累，答『牠在公園追(chase)鞦韆(swing)；別浪費(waste)口舌(tongue)對牠大叫』，選 A。pump、rainbow/golden 為干擾。"},
{n:14,p:1,o:["The forest is deep.","The island is small.","The faucet drips onto a triangle plate; the onion needs a water pump."],a:2,

{n:15,p:1,o:["The official is active.","The babysitter has the flashlight; on Friday she will visit the American classroom.","The range is high."],a:1,
 sen:"Who is looking after the children tonight?",szh:"今晚誰照顧孩子？",
 en:"The babysitter has the flashlight; Friday, the American classroom.",zh:"問今晚誰顧小孩，答『保母(babysitter)拿著手電筒(flashlight)；星期五(Friday)她會去參觀美式(American)教室(classroom)』，選 B。official/active、range 為干擾。"},

{n:16,p:2,o:["A small island in the ocean.","A city.","A desert."],a:0,

 en:"A small island in the ocean.",zh:"男士去大洋(ocean)中的小島(island)，選 A。"},
{n:17,p:2,o:["A green forest.","A cool lake.","A hot, dry desert with lots of sand."],a:2,
 sen:"M: What was the strangest place you visited? &nbsp;W: A hot, dry desert with endless sand. &nbsp;M: So different. &nbsp;Q: What place did the woman visit?",
 szh:"男：你去過最奇特的地方是哪？　女：一片炎熱乾燥、沙子無盡的沙漠(desert)。　男：真不一樣。　問：女士去了什麼地方？",

{n:18,p:2,o:["On the beach.","In the forest, among the rocks and trees.","In a city."],a:1,

 szh:"女：這些蘑菇你在哪找到的？　男：在森林(forest)裡，岩石(rock)和老樹之間。　女：小心。　問：男士在哪找到蘑菇？",
 en:"In the forest among the rocks.",zh:"在森林(forest)的岩石(rock)間，選 B。"},
{n:19,p:2,o:["A tall waterfall by the coast.","A city street.","A desert."],a:0,

 en:"A tall waterfall by the coast.",zh:"是海岸(coast)邊的高瀑布(waterfall)，選 A。"},
{n:20,p:2,o:["A gray sky.","A dark night.","A bright rainbow after the gray clouds cleared."],a:2,
 sen:"W: What did you see after the storm? &nbsp;M: A bright rainbow after the gray clouds cleared. &nbsp;W: How lovely. &nbsp;Q: What did the man see?",

 en:"A bright rainbow after the gray clouds.",zh:"灰(gray)雲後的彩虹(rainbow)，選 C。"},
{n:21,p:2,o:["A single hill.","A long mountain range.","A flat plain."],a:1,

 szh:"男：往北的路上你翻過什麼？　女：一列長長的山脈(range)，一峰接一峰。　男：辛苦的旅程。　問：女士翻過了什麼？",
 en:"A long mountain range.",zh:"女士翻過長長的山脈(range)，選 B。"},
{n:22,p:2,o:["Use a flashlight in the dark cave.","Turn on the sun.","Close your eyes."],a:0,

{n:23,p:2,o:["A cake.","A soup.","An onion, and please fix the dripping faucet."],a:2,

{n:26,p:3,pic:true,o:[BARS("Trip Places",["Island","Forest","Desert"],[20,50,80]),BARS("Trip Places",["Island","Forest","Desert"],[50,80,20]),BARS("Trip Places",["Island","Forest","Desert"],[80,50,20])],a:2,

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 33 回　地形與地方　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
