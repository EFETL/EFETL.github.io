<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>龍騰第五冊 L1–L3 單字 · 記憶闖關 | Longteng B5 Word Quest</title>
<style>
:root{
  --bg:#f6f4ef; --ink:#2b2b33; --muted:#7a7a86; --line:#e7e3da;
  --primary:#2f6f6b; --primary-d:#265a57; --primary-l:#e3efee;
  --accent:#e0803a; --accent-l:#fbeede; --gold:#e6b422;
  --green:#3f9d5a; --green-l:#e6f4ea; --red:#d1544a; --red-l:#fbe7e5;
  --card:#ffffff; --shadow:0 2px 10px rgba(40,40,50,.06),0 6px 24px rgba(40,40,50,.05);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 90px}
a{color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none!important}

/* header */
header.top{display:flex;align-items:center;gap:12px;padding:8px 2px 16px}
.brand{display:flex;flex-direction:column}
.brand .en{font-weight:800;font-size:1.28rem;letter-spacing:-.02em;color:var(--primary-d)}
.brand .zh{font-size:.82rem;color:var(--muted);margin-top:-2px}
.spacer{flex:1}
.pill{font-size:.72rem;background:var(--primary-l);color:var(--primary-d);padding:5px 11px;border-radius:999px;font-weight:700}

/* hero intro */
.hero{background:linear-gradient(135deg,#2f6f6b,#3f8f7c);color:#fff;border-radius:var(--radius);padding:22px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.hero h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:-.01em}
.hero p{margin:0;opacity:.92;font-size:.9rem}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.method{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 8px;text-align:center;font-size:.72rem}
.method b{display:block;font-size:1.25rem;margin-bottom:3px}
@media(max-width:560px){.methods{grid-template-columns:repeat(2,1fr)}}

/* round grid */
.section-title{display:flex;align-items:baseline;gap:8px;margin:6px 2px 12px}
.section-title h2{font-size:1.05rem;margin:0}
.section-title span{font-size:.78rem;color:var(--muted)}
.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:640px){.rounds{grid-template-columns:repeat(2,1fr)}}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 13px;box-shadow:var(--shadow);text-align:left;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.rc:active{transform:scale(.97)}
.rc .no{font-size:.72rem;color:var(--accent);font-weight:800;letter-spacing:.04em}
.rc .rng{font-size:18px;font-weight:700;margin:3px 0 2px;color:var(--primary-d);word-break:break-all}
.rc .cnt{font-size:.72rem;color:var(--muted)}
.bar{height:6px;background:#eee7db;border-radius:6px;margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#5fbf7d);width:0;transition:width .4s}
.rc .pct{position:absolute;top:11px;right:12px;font-size:.68rem;font-weight:800;color:var(--green)}
.star-badge{position:absolute;bottom:12px;right:12px;font-size:.72rem;color:var(--gold)}

/* round view */
.subhead{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
.back{font-size:.9rem;font-weight:700;color:var(--primary-d);display:flex;align-items:center;gap:5px;padding:6px 4px}
.subhead h2{font-size:1.1rem;margin:0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
@media(max-width:560px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;text-align:center;box-shadow:var(--shadow);transition:transform .12s}
.mode:active{transform:scale(.96)}
.mode .ic{font-size:1.7rem}
.mode .t{font-weight:800;font-size:.92rem;margin-top:5px;color:var(--primary-d)}
.mode .d{font-size:.7rem;color:var(--muted);margin-top:2px}
.mode .tag{display:inline-block;margin-top:7px;font-size:.63rem;background:var(--accent-l);color:var(--accent);padding:2px 8px;border-radius:999px;font-weight:700}

/* generic panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.rowbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{background:var(--primary);color:#fff;font-weight:700;padding:11px 20px;border-radius:12px;font-size:.92rem;box-shadow:var(--shadow)}
.btn.ghost{background:#fff;color:var(--primary-d);border:1.5px solid var(--primary)}
.btn.sm{padding:8px 14px;font-size:.82rem}
.btn:active{transform:translateY(1px)}

/* flashcard */
.progress-line{text-align:center;font-size:.78rem;color:var(--muted);margin-bottom:8px}
.flash{perspective:1200px;margin:6px auto 16px;max-width:460px}
.flash-inner{position:relative;width:100%;min-height:240px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border:1px solid var(--line)}
.face.front{background:linear-gradient(160deg,#ffffff,#f3f7f6)}
.face.back{background:linear-gradient(160deg,#fff8ef,#fdeede);transform:rotateY(180deg)}
.word-en{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;color:var(--primary-d);word-break:break-word}
.pos{font-size:.85rem;color:var(--accent);font-weight:700;margin-top:4px;font-style:italic}
.word-zh{font-size:1.9rem;font-weight:800;color:var(--accent)}
.hintflip{font-size:.72rem;color:var(--muted);margin-top:14px}
.speak{margin-top:12px;background:var(--primary-l);color:var(--primary-d);border-radius:999px;width:52px;height:52px;font-size:1.4rem;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.speak:active{transform:scale(.9)}
.fc-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:460px;margin:0 auto}
.nav-btn{background:#fff;border:1.5px solid var(--line);border-radius:12px;width:48px;height:48px;font-size:1.3rem;color:var(--primary-d);box-shadow:var(--shadow)}
.mark-row{display:flex;gap:10px;justify-content:center;margin-top:14px}
.mark{border-radius:12px;padding:9px 16px;font-weight:700;font-size:.85rem;border:1.5px solid var(--line);background:#fff}
.mark.know.on{background:var(--green-l);border-color:var(--green);color:var(--green)}
.mark.star.on{background:#fdf6df;border-color:var(--gold);color:#b8860b}

/* quiz */
.q-word{text-align:center;font-size:2rem;font-weight:800;color:var(--primary-d);margin:6px 0 2px;word-break:break-word}
.q-sub{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:16px}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;font-size:18px;text-align:left;font-weight:600;transition:.12s}
.opt:active{transform:scale(.99)}
.opt.correct{background:var(--green-l);border-color:var(--green);color:#1f7a3d}
.opt.wrong{background:var(--red-l);border-color:var(--red);color:#b23b32}
.opt.dim{opacity:.5}
.scoreline{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:6px}

/* spell */
.spell-audio{text-align:center;margin:10px 0 18px}
.big-speak{background:var(--primary);color:#fff;border-radius:999px;width:76px;height:76px;font-size:2rem;box-shadow:var(--shadow)}
.big-speak:active{transform:scale(.92)}
.play-btn{display:inline-flex;align-items:center;gap:8px;background:var(--primary);color:#fff;font-weight:800;font-size:1.05rem;padding:13px 26px;border-radius:999px;box-shadow:var(--shadow);letter-spacing:.02em}
.play-btn:active{transform:scale(.95)}
.play-btn .ic{font-size:1.35rem}
.spell-input{width:100%;max-width:360px;display:block;margin:0 auto;font-size:1.3rem;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;letter-spacing:.05em;font-weight:700;color:var(--primary-d)}
.spell-input:focus{outline:none;border-color:var(--primary)}
.spell-hint{text-align:center;font-size:1.1rem;letter-spacing:.35em;color:var(--muted);margin:12px 0;font-family:ui-monospace,monospace;min-height:1.4em}
.feedback{text-align:center;font-weight:700;min-height:1.6em;margin-top:10px}
.feedback.ok{color:var(--green)}
.feedback.no{color:var(--red)}

/* match */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcell{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;font-weight:700;font-size:18px;min-height:54px;display:flex;align-items:center;justify-content:center;transition:.12s;word-break:break-word}
.mcell.sel{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}
.mcell.done{background:var(--green-l);border-color:var(--green);color:var(--green);opacity:.65}
.mcell.err{background:var(--red-l);border-color:var(--red)}
.mcell .en{font-weight:800}

/* result */
.result{text-align:center;padding:20px}
.result .big{font-size:3rem;font-weight:900;color:var(--primary-d)}
.result .emoji{font-size:3.2rem}
.result p{color:var(--muted)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b33;color:#fff;padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:.95}

footer{text-align:center;color:var(--muted);font-size:.72rem;padding:26px 0 10px}
.count-chip{font-size:.7rem;color:var(--muted);text-align:center;margin-top:4px}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="en">Longteng B5 Word Quest</span>

    </div>
    <div class="panel" style="text-align:center">
      <div style="font-size:.85rem;color:var(--muted)">本回學習進度</div>
      <div class="bar" style="max-width:320px;margin:10px auto"><i id="roundBarFill"></i></div>
      <div id="roundStat" style="font-size:.82rem;color:var(--primary-d);font-weight:700"></div>

  <!-- GAME AREA -->
  <div id="gameView" class="hidden">
    <div class="subhead">

      <h2 id="gameTitle"></h2>
    </div>
    <div id="gameBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const WORDS = [{"w":"contemporary","pos":"n","zh":"同時代的人；當代的"},{"w":"complicated","pos":"adj","zh":"複雜的"},{"w":"plain","pos":"adj","zh":"樸素的；清楚的"},{"w":"penetrating","pos":"adj","zh":"深刻的；穿透的"},{"w":"renowned","pos":"adj","zh":"著名的"},{"w":"outstanding","pos":"adj","zh":"傑出的；未解決的"},{"w":"compose","pos":"v","zh":"創作；組成"},{"w":"comment","pos":"n","zh":"評論"},{"w":"indecision","pos":"n","zh":"猶豫不決"},{"w":"depict","pos":"v","zh":"描繪"},{"w":"solitary","pos":"adj","zh":"孤獨的；單獨的"},{"w":"compelling","pos":"adj","zh":"引人入勝的；有說服力的"},{"w":"prediction","pos":"n","zh":"預測"},{"w":"justify","pos":"v","zh":"為…辯解；證明…正當"},{"w":"essence","pos":"n","zh":"本質；精華"},{"w":"publication","pos":"n","zh":"出版；出版品"},{"w":"acceptance","pos":"n","zh":"接受；認可"},{"w":"declaration","pos":"n","zh":"宣告；聲明"},{"w":"conventional","pos":"adj","zh":"傳統的；因循守舊的"},{"w":"encounter","pos":"v","zh":"遭遇；邂逅"},{"w":"exemplify","pos":"v","zh":"是…的典型；例證"},{"w":"profound","pos":"adj","zh":"深刻的；深遠的"},{"w":"reflection","pos":"n","zh":"省思；反射；倒影"},{"w":"hostile","pos":"adj","zh":"有敵意的；懷有敵意的"},{"w":"faith","pos":"n","zh":"信心；信念"},{"w":"truthful","pos":"adj","zh":"誠實的；真實的"},{"w":"hatred","pos":"n","zh":"仇恨；憎惡"},{"w":"dishonesty","pos":"n","zh":"不誠實"},{"w":"modest","pos":"adj","zh":"謙虛的；適度的"},{"w":"translate","pos":"v","zh":"轉化；翻譯"},{"w":"rational","pos":"adj","zh":"理性的"},{"w":"persevere","pos":"v","zh":"堅持不懈"},{"w":"distort","pos":"v","zh":"扭曲；曲解"},{"w":"possess","pos":"v","zh":"擁有；具備"},{"w":"overtake","pos":"v","zh":"壓倒、襲來；超越"},{"w":"retain","pos":"v","zh":"保留；保持"},{"w":"integrity","pos":"n","zh":"正直；完整"},{"w":"virtue","pos":"n","zh":"美德；優點"},{"w":"composure","pos":"n","zh":"沉著；鎮定"},{"w":"humility","pos":"n","zh":"謙遜；謙卑"},{"w":"moderation","pos":"n","zh":"節制；適度"},{"w":"righteous","pos":"adj","zh":"正直的；正義的"},{"w":"receptive","pos":"adj","zh":"樂於接受的"},{"w":"mislead","pos":"v","zh":"誤導"},{"w":"deceive","pos":"v","zh":"欺騙"},{"w":"journalism","pos":"n","zh":"新聞業；新聞工作"},{"w":"attempt","pos":"n","zh":"企圖；嘗試"},{"w":"candidate","pos":"n","zh":"候選人；應徵者"},{"w":"illustrate","pos":"v","zh":"說明；圖解"},{"w":"extensive","pos":"adj","zh":"廣泛的；大量的"},{"w":"flawed","pos":"adj","zh":"有瑕疵的；有缺陷的"},{"w":"shatter","pos":"v","zh":"粉碎；使破滅"},{"w":"subsequent","pos":"adj","zh":"隨後的；接下來的"},{"w":"mainstream","pos":"n","zh":"主流（的）"},{"w":"panic","pos":"n","zh":"恐慌"},{"w":"evaluate","pos":"v","zh":"評估"},{"w":"validity","pos":"n","zh":"有效性；可信度"},{"w":"verify","pos":"v","zh":"查證；證實"},{"w":"define","pos":"v","zh":"定義"},{"w":"credibility","pos":"n","zh":"可信度"},{"w":"cite","pos":"v","zh":"引用；引述"},{"w":"objective","pos":"adj","zh":"客觀的；目標"},{"w":"notable","pos":"adj","zh":"顯著的；值得注意的"},{"w":"necessity","pos":"n","zh":"必需品；必要"},{"w":"biography","pos":"n","zh":"傳記"},{"w":"truthful","pos":"adj","zh":"真實的；誠實的"},{"w":"differ","pos":"v","zh":"不同；相異"},{"w":"differentiate","pos":"v","zh":"區別；區分"},{"w":"crew","pos":"n","zh":"全體船員（機組員）"},{"w":"sailor","pos":"n","zh":"水手；船員"},{"w":"settle","pos":"v","zh":"定居；解決"},{"w":"possess","pos":"v","zh":"擁有；持有"},{"w":"exceptional","pos":"adj","zh":"絕佳的；異常的"},{"w":"strategic","pos":"adj","zh":"戰略的；策略性的"},{"w":"opposite","pos":"adj","zh":"相對的；對面（的）"},{"w":"core","pos":"n","zh":"核心；地心；核心的"},{"w":"considerably","pos":"adv","zh":"相當地；大幅地"},{"w":"densely","pos":"adv","zh":"密集地；濃密地"},{"w":"majestic","pos":"adj","zh":"雄偉的；壯麗的"},{"w":"soar","pos":"v","zh":"高聳；翱翔；飆升"},{"w":"exceed","pos":"v","zh":"超過；超越"},{"w":"namesake","pos":"n","zh":"同名之人／物"},{"w":"unintentionally","pos":"adv","zh":"無意間地；非故意地"},{"w":"equator","pos":"n","zh":"赤道"},{"w":"penetrate","pos":"v","zh":"穿過；貫穿；滲透"},{"w":"remarkable","pos":"adj","zh":"非凡的；值得注意的"},{"w":"landscape","pos":"n","zh":"景觀；地景"},{"w":"advanced","pos":"adj","zh":"先進的；高階的"},{"w":"agricultural","pos":"adj","zh":"農業的"}];

/* ---------- speech ---------- */
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  VOICE = vs.find(v=>/en-US/i.test(v.lang)&&/female|Samantha|Google US/i.test(v.name))
       || vs.find(v=>/en-US/i.test(v.lang))
       || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
/* iOS/Safari 需要在使用者手勢中先「解鎖」語音，之後 setTimeout 內的朗讀才會有聲音 */
let __voiceUnlocked=false;
function unlockVoice(){
  if(__voiceUnlocked || !('speechSynthesis' in window)) return;
  __voiceUnlocked=true;
  try{ if(!VOICE)pickVoice(); const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}
document.addEventListener('pointerdown', unlockVoice, true);
document.addEventListener('touchstart', unlockVoice, {capture:true, passive:true});
document.addEventListener('click', unlockVoice, true);

/* ---------- 微軟 Neural 語音（Edge TTS · en-US-AriaNeural 預錄 mp3），失敗才退回瀏覽器語音 ---------- */
const MS_AUDIO_DIR='audio/longteng-b5/';
const __au=new Audio();__au.preload='auto';let __auUnlocked=false;
function __slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}
function __unlockAudio(){if(__auUnlocked)return;__auUnlocked=true;try{__au.muted=true;__au.src=MS_AUDIO_DIR+'plain.mp3';const p=__au.play();if(p)p.then(()=>{__au.pause();__au.muted=false;}).catch(()=>{__au.muted=false;});}catch(e){__au.muted=false;}}
document.addEventListener('pointerdown',__unlockAudio,true);
document.addEventListener('touchstart',__unlockAudio,{capture:true,passive:true});
function __ttsFallback(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;if(typeof VOICE!=='undefined'&&VOICE)u.voice=VOICE;speechSynthesis.speak(u);}catch(e){}}
function msPlay(file,text){try{if('speechSynthesis' in window)speechSynthesis.cancel();__au.pause();__au.muted=false;__au.src=MS_AUDIO_DIR+file;__au.currentTime=0;
  __au.onerror=()=>__ttsFallback(text);const p=__au.play();if(p)p.catch(()=>__ttsFallback(text));}catch(e){__ttsFallback(text);}}
function speak(text){ msPlay(__slug(text)+'.mp3',text); }

/* ---------- helpers ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1400);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function roundWords(ri){const r=ROUNDS[ri];const out=[];for(let i=r.s;i<r.e;i++)out.push(i);return out;}
function knowCount(ri){return roundWords(ri).filter(i=>LS.know[i]).length;}
function starCount(ri){return roundWords(ri).filter(i=>LS.star[i]).length;}
const POSZH={n:'名詞',v:'動詞',adj:'形容詞',adv:'副詞',prep:'介系詞',conj:'連接詞',pron:'代名詞',aux:'助動詞',int:'感嘆詞',art:'冠詞'};

/* ---------- navigation ---------- */
let curRound=0;
const $home=document.getElementById('home'),$round=document.getElementById('roundView'),$game=document.getElementById('gameView');
function show(el){[$home,$round,$game].forEach(e=>e.classList.add('hidden'));el.classList.remove('hidden');window.scrollTo(0,0);}
function goHome(){renderHome();show($home);}
function backToRound(){try{speechSynthesis.cancel();__au.pause();}catch(e){}openRound(curRound);}

function renderHome(){
  const g=document.getElementById('roundGrid');g.innerHTML='';
  ROUNDS.forEach((r,ri)=>{
    const total=r.e-r.s, kn=knowCount(ri), pct=Math.round(kn/total*100), st=starCount(ri);
    const first=WORDS[r.s].w, last=WORDS[r.e-1].w;
    const el=document.createElement('button');el.className='rc';
    el.onclick=()=>openRound(ri);
    el.innerHTML=`<div class="no">${LESSONS[ri][0]} · LESSON</div><div class="rng">${LESSONS[ri][1]}</div>
      <div class="cnt">${total} 字</div>
      ${pct>0?`<div class="pct">${pct}%</div>`:''}
      ${st>0?`<div class="star-badge">⭐${st}</div>`:''}
      <div class="bar"><i style="width:${pct}%"></i></div>`;
    g.appendChild(el);
  });
}

function openRound(ri){
  curRound=ri;const r=ROUNDS[ri];
  document.getElementById('roundTitle').textContent=`${LESSONS[ri][0]}　${LESSONS[ri][1]}`;
  document.getElementById('roundRange').textContent=`${WORDS[r.s].w} … ${WORDS[r.e-1].w}　共 ${r.e-r.s} 字`;
  const total=r.e-r.s,kn=knowCount(ri),pct=Math.round(kn/total*100);
  document.getElementById('roundBarFill').style.width=pct+'%';
  document.getElementById('roundStat').textContent=`已學會 ${kn} / ${total} 字（${pct}%）　⭐複習清單 ${starCount(ri)} 字`;
  show($round);
}

/* ================= FLASHCARDS ================= */
let fcList=[],fcPos=0,fcReviewMode=false;
function startFlash(){fcReviewMode=false;fcList=roundWords(curRound);launchFlash('📖 單字卡 Flashcards');}
function startReview(){
  const list=roundWords(curRound).filter(i=>LS.star[i]||!LS.know[i]);
  if(list.length===0){toast('太棒了！本回沒有待複習的字 🎉');return;}
  fcReviewMode=true;fcList=shuffle(list);launchFlash('⭐ 重點複習 Review');
}
function launchFlash(title){
  fcPos=0;document.getElementById('gameTitle').textContent=title;show($game);renderFlash();
}
function renderFlash(){
  const wi=fcList[fcPos],w=WORDS[wi];
  const body=document.getElementById('gameBody');
  body.innerHTML=`
    <div class="progress-line">${fcPos+1} / ${fcList.length}　${fcReviewMode?'複習模式':''}</div>
    <div class="flash" id="flash">
      <div class="flash-inner" onclick="flipCard(event)">
        <div class="face front">
          <div class="word-en">${w.w}</div>
          <div class="pos">${w.pos}. ${POSZH[w.pos]||''}</div>
          <button class="speak" onclick="event.stopPropagation();speak('${w.w.replace(/'/g,"\\'")}')">🔊</button>
          <div class="hintflip">點卡片看中文 · Tap to flip</div>
        </div>
        <div class="face back">
          <div class="word-zh">${w.zh}</div>
          <div class="pos">${w.w}　(${w.pos}.)</div>
          <div class="hintflip">點卡片翻回英文</div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="nav-btn" onclick="fcPrev()">‹</button>
      <div class="mark-row">
        <button class="mark know ${LS.know[wi]?'on':''}" id="mkKnow" onclick="toggleKnow(${wi})">✓ 學會了</button>
        <button class="mark star ${LS.star[wi]?'on':''}" id="mkStar" onclick="toggleStar(${wi})">⭐ 要複習</button>
      </div>
      <button class="nav-btn" onclick="fcNext()">›</button>
    </div>`;
  setTimeout(()=>speak(w.w),180);
}
function flipCard(e){document.getElementById('flash').classList.toggle('flipped');}
function fcNext(){if(fcPos<fcList.length-1){fcPos++;renderFlash();}else{flashDone();}}
function fcPrev(){if(fcPos>0){fcPos--;renderFlash();}}
function toggleKnow(wi){LS.know[wi]=!LS.know[wi];if(LS.know[wi]){LS.star[wi]=false;}save();document.getElementById('mkKnow').classList.toggle('on',!!LS.know[wi]);document.getElementById('mkStar').classList.toggle('on',!!LS.star[wi]);toast(LS.know[wi]?'已標記學會 ✓':'取消標記');}
function toggleStar(wi){LS.star[wi]=!LS.star[wi];save();document.getElementById('mkStar').classList.toggle('on',!!LS.star[wi]);toast(LS.star[wi]?'加入複習清單 ⭐':'移出複習清單');}
function flashDone(){
  document.getElementById('gameBody').innerHTML=`<div class="panel result">
    <div class="emoji">🎉</div><h3>這一輪看完了！</h3>
    <p>複習是記憶的關鍵，多看幾次會更熟。</p>
    <div class="rowbtns"><button class="btn" onclick="renderFlashRestart()">再看一次</button>
    <button class="btn ghost" onclick="backToRound()">返回本回</button></div></div>`;
}
function renderFlashRestart(){fcPos=0;renderFlash();}

/* ================= QUIZ ================= */
let qList=[],qPos=0,qScore=0,qDir=0;
function startQuiz(){
  qList=shuffle(roundWords(curRound));qPos=0;qScore=0;
  document.getElementById('gameTitle').textContent='🎯 選擇題 Quiz';show($game);renderQuiz();
}
function renderQuiz(){
  if(qPos>=qList.length){return quizDone();}
  const wi=qList[qPos],w=WORDS[wi];
  qDir=Math.random()<0.5?0:1; // 0: EN->ZH, 1: ZH->EN
  const poolIdx=shuffle(WORDS.map((_,i)=>i).filter(i=>i!==wi)).slice(0,3);
  const options=shuffle([wi,...poolIdx]);
  const body=document.getElementById('gameBody');
  const promptTxt=qDir===0?w.w:w.zh;
  const sub=qDir===0?`(${w.pos}.) 這個字是什麼意思？`:'下列哪個英文字是這個意思？';
  body.innerHTML=`
    <div class="panel">
      <div class="scoreline"><span>第 ${qPos+1} / ${qList.length} 題</span><span>得分 ${qScore}</span></div>
      <div class="q-word">${promptTxt} ${qDir===0?`<button class="speak" style="width:38px;height:38px;font-size:1rem;display:inline-flex;vertical-align:middle" onclick="speak('${w.w.replace(/'/g,"\\'")}')">🔊</button>`:''}</div>
      <div class="q-sub">${sub}</div>
      <div class="opts" id="opts"></div>
    </div>`;
  const opts=document.getElementById('opts');
  options.forEach(oi=>{
    const b=document.createElement('button');b.className='opt';
    b.textContent=qDir===0?WORDS[oi].zh:WORDS[oi].w;
    b.onclick=()=>answerQuiz(b,oi,wi,w);
    opts.appendChild(b);
  });
  if(qDir===0)setTimeout(()=>speak(w.w),150);
}
function answerQuiz(btn,chosen,correct,w){
  const all=[...document.querySelectorAll('.opt')];all.forEach(o=>o.onclick=null);
  if(chosen===correct){btn.classList.add('correct');qScore++;LS.know[correct]=true;save();speak(w.w);}
  else{
    btn.classList.add('wrong');LS.star[correct]=true;save();
    all.forEach(o=>{if((qDir===0?o.textContent===WORDS[correct].zh:o.textContent===WORDS[correct].w))o.classList.add('correct');});
    all.forEach(o=>{if(!o.classList.contains('correct')&&o!==btn)o.classList.add('dim');});
  }
  setTimeout(()=>{qPos++;renderQuiz();},chosen===correct?750:1500);
}
function quizDone(){
  const pct=Math.round(qScore/qList.length*100);
  const emo=pct>=90?'🏆':pct>=70?'😃':pct>=50?'💪':'📚';
  document.getElementById('gameBody').innerHTML=`<div class="panel result">
    <div class="emoji">${emo}</div>
    <div class="big">${qScore}<span style="font-size:1.2rem;color:var(--muted)"> / ${qList.length}</span></div>
    <p>答對率 ${pct}%${pct>=90?'，超強！':pct>=50?'，繼續加油！':'，多練幾次一定進步！'}</p>
    <div class="rowbtns"><button class="btn" onclick="startQuiz()">再測一次</button>
    <button class="btn ghost" onclick="backToRound()">返回本回</button></div></div>`;
}

/* ================= SPELLING ================= */
let spList=[],spPos=0,spScore=0,spReveal=0;
function startSpell(){
  spList=shuffle(roundWords(curRound));spPos=0;spScore=0;
  document.getElementById('gameTitle').textContent='✍️ 聽寫拼字 Spelling';show($game);renderSpell();
}
function renderSpell(){
  if(spPos>=spList.length)return spellDone();
  const wi=spList[spPos],w=WORDS[wi];spReveal=0;
  document.getElementById('gameBody').innerHTML=`
   <div class="panel">
    <div class="scoreline"><span>第 ${spPos+1} / ${spList.length} 題</span><span>得分 ${spScore}</span></div>
    <div class="q-sub">聽發音，拼出這個英文單字（提示：${w.zh}）</div>
    <div class="spell-audio"><button class="play-btn" onclick="speak('${w.w.replace(/'/g,"\\'")}')"><span class="ic">🔊</span>播放發音 Play</button>
    <div style="font-size:.72rem;color:var(--muted);margin-top:8px">點按鈕即可聽發音，可重複點</div></div>
    <input class="spell-input" id="spIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type here…">
    <div class="spell-hint" id="spHint"></div>
    <div class="feedback" id="spFb"></div>
    <div class="rowbtns">
      <button class="btn ghost sm" onclick="spellHint()">💡 提示（頭尾）</button>
      <button class="btn sm" onclick="checkSpell()">確認 Check</button>
      <button class="btn ghost sm" onclick="skipSpell()">跳過 ▸</button>
    </div>
   </div>`;
  const inp=document.getElementById('spIn');
  const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
  if(!isTouch)inp.focus(); // 手機不自動搶 focus，避免鍵盤彈出干擾播放
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')checkSpell();});
  speak(w.w);                       // 同步在手勢內朗讀（iOS 解鎖後每題都能自動出聲）
}
function spellHint(){
  const w=WORDS[spList[spPos]].w;spReveal=1; // 只給頭尾，中間留空；再按也一樣，拿不到完整答案
  let s='';for(let i=0;i<w.length;i++)s+=(i===0||i===w.length-1)?w[i]:'_';
  document.getElementById('spHint').textContent=s.split('').join(' ');
}
function checkSpell(){
  const wi=spList[spPos],w=WORDS[wi];
  const val=(document.getElementById('spIn').value||'').trim().toLowerCase();
  const fb=document.getElementById('spFb');
  if(val===w.w.toLowerCase()){
    fb.textContent='✓ 正確！ '+w.w;fb.className='feedback ok';
    if(spReveal===0)spScore++;LS.know[wi]=true;save();speak(w.w);
    setTimeout(()=>{spPos++;renderSpell();},900);
  }else{
    fb.textContent='✗ 正確答案：'+w.w;fb.className='feedback no';
    LS.star[wi]=true;save();speak(w.w);
    setTimeout(()=>{spPos++;renderSpell();},1600);
  }
}
function skipSpell(){const wi=spList[spPos];LS.star[wi]=true;save();spPos++;renderSpell();}
function spellDone(){
  document.getElementById('gameBody').innerHTML=`<div class="panel result">
    <div class="emoji">✍️🎉</div>
    <div class="big">${spScore}<span style="font-size:1.2rem;color:var(--muted)"> / ${spList.length}</span></div>
    <p>一次就拼對 ${spScore} 個！拼字是最扎實的記憶。</p>
    <div class="rowbtns"><button class="btn" onclick="startSpell()">再練一次</button>
    <button class="btn ghost" onclick="backToRound()">返回本回</button></div></div>`;
}

/* ================= MATCHING ================= */
let mPairs=[],mSel=null,mDone=0,mStart=0,mTimer=null,mQueue=[],mRound=0;
function startMatch(){
  mQueue=shuffle(roundWords(curRound));mRound=0;mStart=Date.now();
  document.getElementById('gameTitle').textContent='🔗 配對遊戲 Matching';show($game);
  clearInterval(mTimer);mTimer=setInterval(updateMTimer,500);
  renderMatch();
}
function renderMatch(){
  const batch=mQueue.slice(mRound*6,mRound*6+6);
  if(batch.length===0)return matchDone();
  const leftEmpty=false;
  const lefts=batch.map(i=>({i,txt:WORDS[i].w,type:'en'}));
  const rights=shuffle(batch.map(i=>({i,txt:WORDS[i].zh,type:'zh'})));
  mSel=null;mDone=0;
  const body=document.getElementById('gameBody');
  body.innerHTML=`<div class="panel">
    <div class="scoreline"><span>第 ${mRound+1} 組 / ${Math.ceil(mQueue.length/6)}　配對英文↔中文</span><span id="mTime">0s</span></div>
    <div class="match-grid" id="mgrid"></div>
   </div>`;
  const grid=document.getElementById('mgrid');
  // interleave columns: build combined rows
  const rows=Math.max(lefts.length,rights.length);
  for(let r=0;r<rows;r++){
    if(lefts[r]){grid.appendChild(mkCell(lefts[r]));}else{const e=document.createElement('div');grid.appendChild(e);}
    if(rights[r]){grid.appendChild(mkCell(rights[r]));}else{const e=document.createElement('div');grid.appendChild(e);}
  }
}
function mkCell(item){
  const c=document.createElement('button');c.className='mcell';
  c.innerHTML=item.type==='en'?`<span class="en">${item.txt}</span>`:item.txt;
  c.dataset.i=item.i;c.dataset.type=item.type;
  c.onclick=()=>clickCell(c);
  return c;
}
function clickCell(c){
  if(c.classList.contains('done'))return;
  if(c.dataset.type==='en')speak(WORDS[+c.dataset.i].w);
  if(!mSel){mSel=c;c.classList.add('sel');return;}
  if(mSel===c){c.classList.remove('sel');mSel=null;return;}
  if(mSel.dataset.type===c.dataset.type){mSel.classList.remove('sel');mSel=c;c.classList.add('sel');return;}
  // check match
  if(mSel.dataset.i===c.dataset.i){
    mSel.classList.remove('sel');mSel.classList.add('done');c.classList.add('done');
    LS.know[+c.dataset.i]=true;save();mSel=null;mDone++;
    if(mDone*2>=document.querySelectorAll('#mgrid .mcell').length){
      setTimeout(()=>{mRound++;renderMatch();},500);
    }
  }else{
    const a=mSel,b=c;a.classList.add('err');b.classList.add('err');a.classList.remove('sel');
    LS.star[+a.dataset.i]=true;LS.star[+b.dataset.i]=true;save();
    setTimeout(()=>{a.classList.remove('err');b.classList.remove('err');},500);
    mSel=null;
  }
}
function updateMTimer(){const el=document.getElementById('mTime');if(el)el.textContent=Math.floor((Date.now()-mStart)/1000)+'s';}
function matchDone(){
  clearInterval(mTimer);const secs=Math.floor((Date.now()-mStart)/1000);
  document.getElementById('gameBody').innerHTML=`<div class="panel result">
    <div class="emoji">🔗🏁</div><h3>全部配對完成！</h3>
    <p>總共花了 <b>${secs}</b> 秒，挑戰更快一次吧！</p>
    <div class="rowbtns"><button class="btn" onclick="startMatch()">再玩一次</button>
    <button class="btn ghost" onclick="backToRound()">返回本回</button></div></div>`;
}

/* ---------- reset ---------- */
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('確定要清除所有學習進度嗎？此動作無法復原。')){
    LS.know={};LS.star={};save();renderHome();toast('已清除所有進度');
  }
};

/* init */
renderHome();

  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body>
</html>
