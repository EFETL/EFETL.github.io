<script>
/* 圖形素材（第13回 家具與電器） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/13/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/13/p3_${n}.jpg?v=r13std3-20261030" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const COUCH=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q1.jpg" alt="question 1 picture">`;
const BED=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q2.jpg" alt="question 2 picture">`;
const BOOKCASE=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q3.jpg" alt="question 3 picture">`;
const DESK=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q4.jpg" alt="question 4 picture">`;
const FREEZER=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:COUCH,o:["There is a couch, and two armchairs are next to the window.","There is a couch, and a man is sitting in the armchair.","There is a couch, and an armchair is next to the window."],a:2,sen:"For question one, look at the picture. Which is true about the living room?",szh:"第一題，請看圖片。關於這間客廳，何者正確？",en:"There is a couch, and an armchair is next to the window.",zh:"客廳裡有一張長沙發(couch)，窗邊有一張單人扶手椅(armchair)，正確。窗邊只有一張扶手椅，不是兩張；扶手椅上沒有人坐著。選 C"},
{n:2,p:0,fig:`<div style="display:inline-block;border:2px solid #1a1a1a;border-radius:10px;padding:10px 22px 12px;background:#fff;color:#1a1a1a"><div style="text-align:center;font-weight:700;font-size:18px;letter-spacing:1px;margin-bottom:6px">PRICE LIST</div><table style="border-collapse:collapse;font-size:18px"><tr><td style="padding:4px 30px 4px 0">Armchair</td><td style="text-align:right;font-weight:700">$500</td></tr><tr><td style="padding:4px 30px 4px 0">Carpet</td><td style="text-align:right;font-weight:700">$300</td></tr><tr><td style="padding:4px 30px 4px 0">Dresser</td><td style="text-align:right;font-weight:700">$400</td></tr><tr><td style="padding:4px 30px 4px 0">Bookcase</td><td style="text-align:right;font-weight:700">$200</td></tr></table></div>`,o:["He will have six hundred dollars left.","He will have two hundred dollars left.","He will have five hundred dollars left."],a:1,sen:"For question two, look at the picture. Tom has nine hundred dollars. He buys a carpet and a dresser. How much will he have left?",szh:"第二題，請看圖片。湯姆有九百元。他買了一張地毯和一個五斗櫃。他還剩多少錢？",en:"He will have two hundred dollars left.",zh:"價目表上地毯(carpet)300元、五斗櫃(dresser)400元，一共700元，900減700剩200元。剩六百元是只買了地毯、忘記五斗櫃的算法；剩五百元是只買了五斗櫃、忘記地毯的算法。選 B"},
{n:3,p:0,fig:BOOKCASE,o:["The books are in the cabinet, and a lamp is on the bookcase.","The books are in the bookcase, and a lamp is on the cabinet.","The books are in the bookcase, and a TV is on the cabinet."],a:1,sen:"For question three, look at the picture. Which is true about the picture?",szh:"第三題，請看圖片。關於這張圖，何者正確？",en:"The books are in the bookcase, and a lamp is on the cabinet.",zh:"書都放在左邊的書櫃(bookcase)裡，右邊矮櫃(cabinet)上放著一盞檯燈，正確。把書櫃和櫃子的位置說反了是陷阱；櫃子上有相框、花瓶和檯燈，沒有電視。選 B"},
{n:4,p:0,fig:DESK,o:["She is sitting on her bed and writing.","She is sitting at her desk and drinking from a cup.","She is sitting on a wooden chair and writing at her desk."],a:2,sen:"For question four, look at the picture. What is the woman doing?",szh:"第四題，請看圖片。這位女士在做什麼？",en:"She is sitting on a wooden chair and writing at her desk.",zh:"女士坐在木頭椅子(chair)上，在書桌(desk)前寫字，正確。床(bed)在她身後，她不是坐在床上；杯子(cup)放在桌上窗邊，她手上拿的是筆，沒有在喝東西。選 C"},
{n:5,p:0,fig:`<svg class="chart" width="236" height="200" viewBox="0 0 236 200"><rect x="1" y="1" width="234" height="198" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="26" text-anchor="middle" font-size="16" font-weight="700">Shop Sales</text><line x1="22" y1="150" x2="218" y2="150" stroke="#1a1a1a" stroke-width="1.5"/><rect x="30" y="75" width="44" height="75" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="52" y="70" font-size="14" font-weight="700" text-anchor="middle">30</text><rect x="96" y="50" width="44" height="100" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="118" y="45" font-size="14" font-weight="700" text-anchor="middle">40</text><rect x="162" y="100" width="44" height="50" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/><text x="184" y="95" font-size="14" font-weight="700" text-anchor="middle">20</text><g font-size="13"><text x="52" y="167" text-anchor="middle">Beds</text><text x="118" y="167" text-anchor="middle">Desks</text><text x="184" y="167" text-anchor="middle">Couches</text></g></svg>`,o:["They sold seventy.","They sold sixty.","They sold fifty."],a:2,sen:"For question five, look at the picture. A shop sold some furniture this week. How many beds and couches did it sell in all?",szh:"第五題，請看圖片。一家店這週賣了一些家具。床和沙發一共賣了多少？",en:"They sold fifty.",zh:"圖中床(bed)賣30張、沙發(couch)賣20張，加起來50張。七十是床加書桌(desk)的算法，看錯成書桌；六十是書桌加沙發的算法，看錯成書桌。選 C"},
{n:6,p:1,o:["It's a brown one with a dog on it.","I didn't touch it. Try the bench by the door.","I'll put it in my bag."],a:1,sen:"Where did you put my wallet?",szh:"你把我的錢包放哪裡了？",en:"I didn't touch it. Try the bench by the door.",zh:"問錢包(wallet)放在哪裡，答「我沒碰，去門邊的長椅(bench)找找」，間接給了地點。「是一個有狗圖案的咖啡色錢包」在描述外觀；「我會把它放進我的包包(bag)」時態不對，問的是已經放在哪裡。選 B"},
{n:7,p:1,o:["Some old videos of us as kids.","Next to the bookcase, I think.","I'll dial the number on the box."],a:0,sen:"What's in that big box?",szh:"那個大箱子裡裝什麼？",en:"Some old videos of us as kids.",zh:"問大箱子(box)裡有什麼，答「一些我們小時候的舊影片(video)」才是內容物。「在書櫃(bookcase)旁邊吧」答的是地點；「我會撥(dial)箱子上的號碼」只是重複 box。選 A"},
{n:8,p:1,o:["Don't worry. Those cups are cheap.","Thank you. I like it very much.","Then don't blame me for it."],a:0,sen:"I'm afraid I broke your favorite cup.",szh:"我恐怕把你最喜歡的杯子打破了。",en:"Don't worry. Those cups are cheap.",zh:"對方說打破了你最愛的杯子(cup)，回「別擔心，那些(those)杯子很便宜」是安慰。「謝謝，我很喜歡」把壞消息當成送禮；「那就別怪(blame)我」人物顛倒，打破杯子的是對方。選 A"},
{n:9,p:1,o:["My parents were born in Canada.","In a small town near Hualian.","In nineteen ninety-eight."],a:1,sen:"Where were you born?",szh:"你在哪裡出生的？",en:"In a small town near Hualian.",zh:"問在「哪裡」出生(born)，答「花蓮(Hualian)附近的小鎮」才是地點。「一九九八年」答的是時間；「我父母在加拿大(Canada)出生」人物不對，問的是你自己。選 B"},
{n:10,p:1,o:["It's soft, but it's too big for this room.","We bought it at the shop last week.","I think it's in the living room."],a:0,sen:"What do you think about our new couch?",szh:"你覺得我們的新沙發怎麼樣？",en:"It's soft, but it's too big for this room.",zh:"問對新沙發(couch)的看法(about)，答「很軟，但對這個房間來說太大」是在給意見。「我想它在客廳」只重複 think，答的是位置；「我們上週在店裡買的」答的是時間地點，而且買的人是問話者自己。選 A"},
{n:11,p:1,o:["It's upstairs, next to my room.","It's Tom's turn. I did it last week.","Every Saturday morning."],a:1,sen:"Who will clean the toilet this week?",szh:"這週誰要洗廁所？",en:"It's Tom's turn. I did it last week.",zh:"問「誰」要洗廁所(toilet)，答「輪到 Tom 了，我上週洗過」才是人物。「在樓上我房間旁邊」答的是地點；「每週六早上」答的是時間。選 B"},
{n:12,p:1,o:["Yes, the couch is very new.","You'd better sleep in your bed tonight.","Your nose looks red to me."],a:1,sen:"My neck and back hurt after sleeping on the couch.",szh:"我睡沙發睡到脖子和背都在痛。",en:"You'd better sleep in your bed tonight.",zh:"對方說睡沙發(couch)後脖子(neck)和背(back)痛，建議「今晚最好睡床(bed)」最自然。「對，沙發很新」用 Yes 附和，沒有回應疼痛；「你的鼻子(nose)看起來紅紅的」講錯了身體部位。選 B"},
{n:13,p:1,o:["Strawberry sandwiches and some melon.","I made it myself.","At noon, in the park."],a:0,sen:"What did you make for the picnic?",szh:"你野餐做了什麼？",en:"Strawberry sandwiches and some melon.",zh:"問野餐做了「什麼」，答「草莓(strawberry)三明治(sandwich)和一些哈密瓜(melon)」才是食物。「中午，在公園」答的是時間地點；「我自己做的」答的是誰做的。選 A"},
{n:14,p:1,o:["Only Amy is. Ben is from Canada.","No, they're my aunt's children.","Yes, they're going to Canada next year."],a:0,sen:"Your cousins are from Australia, right?",szh:"你的表兄弟姊妹是從澳洲來的，對吧？",en:"Only Amy is. Ben is from Canada.",zh:"對方以為表親都來自澳洲(Australia)，答「只有 Amy 是，Ben 是從加拿大(Canada)來的」是更正。「對，他們明年要去加拿大」答的是要去哪裡；「不，他們是我阿姨的小孩」表親本來就是阿姨的小孩，沒有回答從哪裡來。選 A"},
{n:15,p:1,o:["It's next to your bed.","Wait. I'll help you carry it.","Yes, I bought a new dress."],a:1,sen:"This dresser is too heavy for me to move.",szh:"這個衣櫃太重了，我搬不動。",en:"Wait. I'll help you carry it.",zh:"對方說衣櫃(dresser)太重搬不動，回「等(wait)一下，我幫你抬」最自然。「在你床邊」答的是位置；「對，我買了一件新洋裝」用 dresser 和 dress 的音近陷阱。選 B"},
{n:16,p:2,o:["A machine with a problem.","Fish they put away this morning.","Ice cream from an online store."],a:0,sen:"M: The ice cream is soft again. &nbsp;W: I know. I put the fish in the freezer this morning, and it's not cold at all. &nbsp;M: Is the door open? &nbsp;W: No, I checked. I think we need a new one. &nbsp;M: Then let's look at the store online tonight. &nbsp;Q: What are the speakers talking about?",szh:"男：冰淇淋又變軟了。　女：我知道。我今天早上把魚放進冷凍櫃(freezer)，但它一點都不冷。　男：門是開著的嗎？　女：沒有，我檢查過了。我想我們需要一台新的。　男：那我們今晚上網看看商店。　問：說話的兩個人在談什麼？",en:"A machine with a problem.",zh:"冰淇淋變軟、冷凍櫃(freezer)一點都不冷、門也沒開，所以兩人在談一台有問題的機器，還打算買新的。魚只是早上放進去的東西，不是談話重點；冰淇淋只是冷凍櫃不冷的證據，他們要上網看的是新冷凍櫃，不是買冰淇淋。選 A"},
{n:17,p:2,o:["Eleven thousand dollars.","Eight thousand dollars.","Ten thousand dollars."],a:2,sen:"W: How much is this armchair? &nbsp;M: Three thousand dollars. And the couch next to it is eight thousand. &nbsp;W: What if I buy both? &nbsp;M: Then I'll take one thousand off. &nbsp;Q: How much will the woman pay for both?",szh:"女：這張扶手椅(armchair)多少錢？　男：三千元。旁邊那張長沙發(couch)是八千元。　女：如果兩張都買呢？　男：那我算你便宜一千元。　問：女士兩張都買要付多少錢？",en:"Ten thousand dollars.",zh:"扶手椅(armchair)三千加長沙發(couch)八千是一萬一千，兩張一起買再減一千，所以付一萬元。一萬一千是還沒打折的價錢；八千只是沙發的價錢。選 C"},
{n:18,p:2,o:["Pack the dishes and cups.","Carry the bed and the desk.","Put the books into boxes."],a:0,sen:"M: Let's give out the tasks for moving day. I'll carry the bed and the desk. &nbsp;W: And I'll put the books into boxes. &nbsp;M: What about Jenny? &nbsp;W: She's careful with small things. She can pack the dishes and cups. &nbsp;Q: What will Jenny do?",szh:"男：我們來分配搬家那天的工作(task)。我搬床(bed)和書桌(desk)。　女：那我把書裝進箱子(box)。　男：那 Jenny 呢？　女：她對小東西很小心(careful)，可以讓她打包盤子(dish)和杯子(cup)。　問：Jenny 要做什麼？",en:"Pack the dishes and cups.",zh:"分工是：男士搬床(bed)和書桌(desk)，女士把書裝箱(box)，Jenny 細心(careful)，負責打包盤子(dish)和杯子(cup)。搬床和書桌是男士的工作(task)；裝書是女士的工作。選 A"},
{n:19,p:2,o:["She visited an old temple today.","She won a prize at the school show.","Her teacher said good things about her painting."],a:2,sen:"W: Why is Amy smiling so much today? &nbsp;M: Her art teacher praised her painting in front of the whole class. &nbsp;W: The one of the old temple? &nbsp;M: Yes. It's going to be in the school show next month. &nbsp;Q: Why is Amy happy?",szh:"女：Amy 今天為什麼一直笑？　男：她的美術老師在全班面前稱讚(praise)她的畫。　女：畫老廟(temple)的那幅嗎？　男：對，下個月會在學校展覽展出。　問：Amy 為什麼很開心？",en:"Her teacher said good things about her painting.",zh:"老師在全班面前稱讚(praise)她的畫，換句話說就是「老師說她的畫很好」。廟(temple)是她畫的內容，不是她今天去了廟；展覽是下個月才辦，對話也沒說她得獎。選 C"},
{n:20,p:2,o:["Putting books in a bookcase.","Fixing a door in their room.","Choosing furniture for a room."],a:2,sen:"W: Look at this bookcase. I like the color, and it looks strong. &nbsp;M: It's nice, but our room is small. We still need a desk, too. &nbsp;W: What's the best position for it? Next to the door? &nbsp;M: Then the door can't open all the way. &nbsp;W: You're right. Let's look for a smaller one. &nbsp;Q: What are the speakers doing?",szh:"女：看看這個書櫃(bookcase)，我喜歡它的顏色，而且看起來很堅固。　男：很漂亮，可是我們的房間很小，而且還要買一張書桌。　女：放哪裡最好(position)？門旁邊嗎？　男：那門就沒辦法全開了。　女：你說得對。我們找小一點的吧。　問：說話的兩個人在做什麼？",en:"Choosing furniture for a room.",zh:"兩人看著一個書櫃(bookcase)，討論房間小、放哪個位置(position)好，最後決定找小一點的，換句話說就是在為房間挑家具。家裡沒有書要放進去；門只是書櫃擋住的東西，沒有人要修門。選 C"},
{n:21,p:2,o:["Forks.","Spoons.","Nothing."],a:1,sen:"M: I'm going to the store. Do you need something? &nbsp;W: Yes, we need spoons. &nbsp;M: Didn't you buy some last week? &nbsp;W: Those were forks. &nbsp;Q: What does the woman want the man to buy?",szh:"男：我要去商店，你需要什麼(something)嗎？　女：要，我們需要湯匙(spoon)。　男：你上週不是買了嗎？　女：那些(those)是叉子。　問：女士要男士買什麼？",en:"Spoons.",zh:"女士說需要湯匙(spoon)；男士以為上週買過了，女士更正說那些(those)是叉子，所以還是要買湯匙。叉子是上週買的東西；她說了需要東西，不是什麼都不要。選 B"},
{n:22,p:2,o:["Buy a pink couch somewhere else.","Buy the couch this week.","Wait until next month."],a:2,sen:"M: This couch is half price this week. Should we buy it now? &nbsp;W: Let's wait. The shop has a big sale next month, so we can save even more. &nbsp;M: But it might be gone by then. &nbsp;W: I doubt it. Nobody buys pink couches. &nbsp;Q: What does the woman want to do?",szh:"男：這張沙發(couch)這週半價，我們現在買嗎？　女：等(wait)一下吧。店裡下個月有大拍賣，可以省(save)更多。　男：可是到時候可能就被買走了。　女：我懷疑(doubt)，沒人會買粉紅色沙發。　問：女士想怎麼做？",en:"Wait until next month.",zh:"女士要等(wait)下個月大拍賣再買，可以省(save)更多錢；她懷疑(doubt)粉紅色沙發會被買走。這週買是男士的想法；她沒有說要去別的地方買。選 C"},
{n:23,p:2,o:["Across from the bedroom.","Downstairs, by the door.","Next to the bedroom."],a:0,sen:"W: Excuse me, where's the toilet? &nbsp;M: Walk up the stairs. It's the second door. &nbsp;W: The one next to the bedroom? &nbsp;M: No, that's my study. The toilet is across from the bedroom. &nbsp;Q: Where is the toilet?",szh:"女：不好意思，廁所(toilet)在哪裡？　男：走(walk)上(up)樓梯，第二扇門。　女：臥室旁邊那間嗎？　男：不是，那是我的書房。廁所在臥室對面。　問：廁所在哪裡？",en:"Across from the bedroom.",zh:"男士說要走(walk)上(up)樓，女士猜臥室旁邊，男士更正說旁邊那間是書房，廁所(toilet)在臥室對面。臥室旁邊是書房；廁所在樓上，不在樓下。選 A"},
{n:24,p:2,o:["Tom.","The cat.","Tom's sister."],a:2,sen:"W: Why is Tom angry with his sister? &nbsp;M: She broke his video game and blamed the cat. &nbsp;W: That's not nice. &nbsp;M: But she said sorry later, and she was sincere. Now they're fine. &nbsp;Q: Who really broke the video game?",szh:"女：Tom 為什麼在生他妹妹的氣？　男：她弄壞了他的電玩(video game)，還怪(blame)到貓身上。　女：那樣不好。　男：不過她後來道歉了，而且很真誠(sincere)。現在他們和好了。　問：電玩其實是誰弄壞的？",en:"Tom's sister.",zh:"妹妹弄壞了 Tom 的電玩(video game)，卻怪(blame)是貓弄的，所以真正弄壞的是妹妹。貓是被冤枉的；Tom 是東西被弄壞的人。選 C"},
{n:25,p:2,o:["It is too hard to use.","It does not cook well.","It is easier than his old one."],a:0,sen:"M: Do you like your new rice cooker? &nbsp;W: It cooks well, but it has ten buttons. &nbsp;M: Ten? My old one has only two. &nbsp;W: I wish mine did, too. I only use one button. &nbsp;M: Did you read the book that came with it? &nbsp;W: Yes, but it didn't help. You need a special ability to understand it! &nbsp;Q: What does the woman think about the rice cooker?",szh:"男：你喜歡你的新電鍋嗎？　女：煮得很好，但它有十個按鈕。　男：十個？我的舊電鍋只有兩個。　女：我希望我的也一樣。我只用一個按鈕。　男：你有讀它附的說明書嗎？　女：有，但沒幫助。你得有特殊的能力(ability)才看得懂！　問：女士覺得這個電鍋怎麼樣？",en:"It is too hard to use.",zh:"女士說按鈕有十個，希望像男士的舊電鍋只有兩個，自己只敢用一個按鈕，連說明書也要有特殊能力(ability)才看得懂，所以她覺得電鍋很難用。她明說電鍋煮得很好，不是煮不好；她希望自己的也像男士的舊電鍋一樣簡單，所以並不覺得比他的舊電鍋容易。選 A"},
{n:26,p:3,pic:true,o:[BARS("Freezers Sold",["White","Silver","Black"],[50,80,20]),BARS("Freezers Sold",["White","Silver","Black"],[20,80,50]),BARS("Freezers Sold",["White","Silver","Black"],[80,50,20])],a:0,sen:"Our shop sells freezers in three colors: white, silver, and black. For many years, white was our top item. This year, however, we sold more silver units than white ones. Black freezers sold the fewest, as always, and I doubt that will ever change. &nbsp;Q: Which chart shows this year's sales?",szh:"我們店賣三種顏色的冷凍櫃(freezer)：白色、銀色和黑色。很多年來白色都是賣最好的商品(item)。不過今年銀色賣出的台數(unit)比白色多。黑色冷凍櫃一如往常賣得最少，而且我很懷疑(doubt)這種情形會有改變的一天。　問：哪張圖是今年的銷售情形？",en:"Silver most, white second, black fewest.",zh:"今年銀色比白色多，黑色最少，所以銀色最高、白色第二、黑色最低。白色最高的那張是「過去很多年」的情形；銀色最高但黑色第二的那張，與「黑色最少」不符。選 A"},
{n:27,p:3,pic:true,o:[PH('q27a'),PH('q27c'),PH('q27b')],a:1,sen:"Jack likes to watch videos at home. He used to sit on the couch, but his brother watches TV there now. Last month, he lay on his bed with a computer, but the doctor said that was bad for his eyes. So now he sits in the armchair next to the carpet and watches a small screen in both hands. &nbsp;Q: Where does Jack watch videos now?",szh:"傑克喜歡在家看影片。他以前坐在沙發(couch)上，但現在他哥哥在那裡看電視。上個月他躺在床(bed)上用電腦看，但醫生說這對眼睛不好。所以現在他坐在地毯(carpet)旁的扶手椅(armchair)上，雙手拿著一個小螢幕看。　問：傑克現在在哪裡看影片？",en:"In the armchair.",zh:"沙發(couch)被哥哥佔了、躺在床(bed)上用電腦被醫生制止，這兩個都是「以前」的地方；現在他坐在地毯(carpet)旁的扶手椅(armchair)上拿小螢幕看，所以現在是坐扶手椅。 選 B"},
{n:28,p:3,pic:true,o:[PH('q28a'),PH('q28b'),PH('q28c')],a:2,sen:"This morning, I couldn't find my wallet. I looked in my bag and under my bed. Mom told me to be more careful with my things. Then I saw a brown wallet on the cabinet by the door, but it was my brother's. Our wallets look alike. In the end, I found mine under the couch. &nbsp;Q: Where did the speaker find his wallet?",szh:"今天早上我找不到錢包(wallet)。我找了包包(bag)和床(bed)底下。媽媽叫我對自己的東西要更小心(careful)。後來我看到門邊的櫃子(cabinet)上有一個咖啡色錢包，但那是我哥哥的，我們的錢包長得很像(alike)。最後我在沙發(couch)底下找到我的。　問：說話者在哪裡找到他的錢包？",en:"Under the couch.",zh:"包包(bag)和床底下都找過但沒找到；櫃子(cabinet)上的錢包是哥哥的，只是長得很像(alike)；他自己的錢包最後在沙發(couch)底下找到。選 C"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29c'),PH('q29b')],a:2,sen:"My aunt lives in Australia. For my birthday, she sent me a big box. I hoped for a toy koala, but there wasn't one. There was a pink pencil case and a picture book about kangaroos. The book is nice, but the pencil case is my favorite item. I take it to school every day. &nbsp;Q: What is the speaker's favorite item from the box?",szh:"我阿姨住在澳洲(Australia)。我生日時她寄給我一個大箱子(box)。我希望有無尾熊玩偶，但沒有。裡面有一個粉紅色鉛筆盒(case)和一本袋鼠圖畫書。書很好看，但鉛筆盒是我最喜歡的東西(item)，我每天都帶去學校。　問：說話者最喜歡箱子裡的哪樣東西？",en:"The pink pencil case.",zh:"無尾熊玩偶是說話者希望有、但箱子(box)裡沒有的東西；袋鼠圖畫書「很好看」但不是最愛；最喜歡的東西(item)是粉紅色鉛筆盒(case)。選 C"},
{n:30,p:3,pic:true,o:[PH('q30a'),PH('q30b'),PH('q30c')],a:1,sen:"Last Sunday, we had a picnic in the park. My brother wanted to play frisbee right away, but it was noon, and the sun was really hot. \"This heat is cruel,\" Dad said. \"Wait until it's cooler.\" So first we sat on our mat under a big tree and ate sandwiches. Later, Dad and my brother played frisbee, and Mom and I flew a kite. &nbsp;Q: What did the family do first?",szh:"上週日我們在公園野餐。我弟弟想馬上玩飛盤(frisbee)，但那時是中午，太陽很大。爸爸說：「這種熱真是殘酷(cruel)。」又說：「等(wait)涼一點再玩。」所以我們先坐在大樹下的墊子(mat)上吃三明治(sandwich)。後來爸爸和弟弟玩飛盤，媽媽和我放風箏。　問：這家人最先做了什麼？",en:"They ate sandwiches on a mat under a tree.",zh:"弟弟想先玩飛盤(frisbee)，但中午太陽太毒辣(cruel)，爸爸要大家等(wait)，所以先在樹下墊子(mat)上吃三明治(sandwich)。玩飛盤和放風箏都是後來才做的事。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 13 回　家具與電器　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
