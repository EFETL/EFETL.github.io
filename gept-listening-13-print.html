<script>
/* 圖形素材（第13回 家具與電器） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/13/${n}.jpg" alt="${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const COUCH=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q1.jpg" alt="question 1 picture">`;
const BED=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q2.jpg" alt="question 2 picture">`;
const BOOKCASE=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q3.jpg" alt="question 3 picture">`;
const DESK=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q4.jpg" alt="question 4 picture">`;
const FREEZER=`<img class="pic-img p0img" src="gept-listening-img/13/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:COUCH,o:["There is a bed and a dresser.","There is a desk and a chair.","There is a couch and an armchair."],a:2,sen:"For question one, look at the picture. What furniture is this?",szh:"第一題，請看圖片。這是什麼家具？",en:"A couch and an armchair.",zh:"客廳裡有沙發(couch)和扶手椅(armchair)，選 C。床與梳妝台、書桌與椅子都是家具，但不是圖中的。"},
{n:2,p:0,fig:BED,o:["There is a wooden bed on a soft carpet.","There is a big bed on a soft carpet.","There is a big couch on a soft carpet."],a:1,sen:"For question two, look at the picture. What is in the bedroom?",szh:"第二題，請看圖片。臥室裡有什麼？",en:"There is a big bed on a soft carpet.",zh:"選 B。照片中是臥室，有一張大床放在柔軟的地毯（soft carpet）上。A 的木製（wooden）床不對，床是軟墊的；C 的沙發（couch）不在照片中。"},
{n:3,p:0,fig:BOOKCASE,o:["A bookcase and a cabinet hold the books.","A bag and a box hold the books.","A desk and a bench hold the books."],a:0,sen:"For question three, look at the picture. What holds the books?",szh:"第三題，請看圖片。什麼在放書？",en:"A bookcase and a cabinet.",zh:"書放在書架(bookcase)和櫃子(cabinet)裡，選 A。袋子、箱子(box)、書桌與長椅(bench)都不是圖中放書的地方。"},
{n:4,p:0,fig:DESK,o:["She is using a spoon and a dish.","She is using a desk and a chair.","She is using a wallet and a bag."],a:1,sen:"For question four, look at the picture. What is she using?",szh:"第四題，請看圖片。她在用什麼？",en:"A desk and a chair.",zh:"她在用書桌(desk)和椅子(chair)，選 B。湯匙(spoon)與盤子(dish)、皮夾(wallet)與袋子(bag)都不是她正在用的。"},
{n:5,p:0,fig:FREEZER,o:["The melon is in the freezer.","The melon is in the cabinet.","The melon is in the bag."],a:0,sen:"For question five, look at the picture. What keeps the food cold?",szh:"第五題，請看圖片。什麼讓食物保冷？",en:"The melon is in the freezer.",zh:"瓜(melon)放在冷凍庫(freezer)裡保冷，選 A。櫃子與袋子都不能讓食物保冷。"},

{n:6,p:1,o:["It cost about twenty dollars.","In my bag, on the bench.","Your wallet is very nice."],a:1,sen:"Where did you put my wallet?",szh:"你把我的皮夾放哪了？",en:"In my bag, on the bench.",zh:"問皮夾(wallet)放哪，答『在我的包包(bag)裡，在長椅(bench)上』，選 B。A 回答價錢；C 重複 wallet 卻沒回答位置。"},
{n:7,p:1,o:["Dial the number on the box.","A video and a cup.","Next to the bookcase, I think."],a:1,sen:"What is inside that big box?",szh:"那個大箱子裡是什麼？",en:"A video and a cup.",zh:"問箱子(box)裡是什麼，答『一片影片(video)和一個杯子(cup)』，選 B。A 重複 box 但是叫人撥(dial)電話；C 回答位置。"},
{n:8,p:1,o:["I was born at home.","My home is up the road.","Sure, I can do many tasks."],a:2,sen:"Do you have the ability to help at home?",szh:"你有能力在家幫忙嗎？",en:"Sure, I can do many tasks.",zh:"問是否有能力(ability)幫忙，答『當然，我能做很多工作(task)』，選 C。A、B 重複 home 卻答非所問。"},
{n:9,p:1,o:["At six in the morning.","In Hualian, near the sea.","My cousin lives in Canada."],a:1,sen:"Where were you born?",szh:"你在哪裡出生？",en:"In Hualian, near the sea.",zh:"問在哪裡出生(born)，答『在花蓮(Hualian)，靠海』，選 B。A 回答時間；C 提到別人住加拿大(Canada)。"},
{n:10,p:1,o:["You're welcome, any time.","At the party tomorrow.","Those who helped us most."],a:2,sen:"Who should we thank the most?",szh:"我們最該感謝誰？",en:"Those who helped us most.",zh:"問最該感謝誰，答『幫我們最多的那些(those)人』，選 C。A 是回應別人道謝的客套話，B 回答地點與時間。"},
{n:11,p:1,o:["My brother is twelve years old.","Two brothers and one sister.","Because he broke my favorite cup."],a:2,sen:"Why do you keep blaming your brother?",szh:"你為什麼一直責怪你弟弟？",en:"Because he broke my favorite cup.",zh:"問為什麼責怪(blame)弟弟，答『因為他打破我最愛的杯子(cup)』，選 C。A 回答年齡，B 回答人數。"},
{n:12,p:1,o:["The kitchen is very clean.","A spoon and some dishes.","Each unit costs ten dollars."],a:1,sen:"What items do you need for the kitchen?",szh:"廚房你需要哪些用品？",en:"A spoon and some dishes.",zh:"問需要哪些物品(item)，答『一支湯匙(spoon)和一些盤子(dish)』，選 B。A 評論廚房；C 提到單位(unit)價格，答非所問。"},
{n:13,p:1,o:["At noon, with my friends.","I forgot my lunch box.","Just a strawberry sandwich."],a:2,sen:"What did you have for lunch today?",szh:"你今天午餐吃了什麼？",en:"Just a strawberry sandwich.",zh:"問午餐吃什麼，答『只有一個草莓(strawberry)三明治(sandwich)』，選 C。A 回答時間和同伴，B 重複 lunch 但沒回答吃什麼。"},
{n:14,p:1,o:["One from Australia, one from Canada.","They are twelve and fourteen.","They came here by plane."],a:0,sen:"Where are your cousins from?",szh:"你的表親來自哪裡？",en:"One from Australia, one from Canada.",zh:"問表親來自哪裡，答『一個來自澳洲(Australia)，一個來自加拿大(Canada)』，選 A。B 回答年齡，C 回答交通方式。"},
{n:15,p:1,o:["I washed my face this morning.","Something bit my nose and neck.","It's near the market."],a:1,sen:"What is that mark on your face?",szh:"你臉上那個印子是什麼？",en:"Something bit my nose and neck.",zh:"問臉上的印子，答『有東西咬了我的鼻子(nose)和脖子(neck)』，選 B。A 重複 face 卻不是原因；C 的 market 發音像 mark 但答非所問。"},

{n:16,p:2,o:["A couch and an armchair.","A bookcase and a desk.","A bed and a dresser."],a:0,sen:"W: What new furniture did you buy? &nbsp;M: A soft couch and a comfortable armchair. &nbsp;W: Cozy! &nbsp;Q: What did the man buy?",szh:"女：你買了什麼新家具？　男：一張軟沙發(couch)和一張舒服的扶手椅(armchair)。　女：真舒適！　問：男士買了什麼？",en:"A couch and an armchair.",zh:"男士買了沙發(couch)和扶手椅(armchair)，選 A。"},
{n:17,p:2,o:["In the cabinet.","In the box.","In the freezer."],a:2,sen:"M: I bought a lot of fish. Where should I put it? &nbsp;W: It will go bad in two days. Use the coldest place in the kitchen. &nbsp;M: Good idea. &nbsp;Q: Where should the man put the fish?",szh:"男：我買了很多魚，該放哪裡？　女：它兩天就會壞掉，用廚房裡最冷的地方。　男：好主意。　問：男士應該把魚放哪裡？",en:"In the freezer.",zh:"廚房裡最冷的地方是冷凍庫(freezer)，選 C。櫃子(cabinet)和箱子(box)都不會冷。"},
{n:18,p:2,o:["A bookcase and a case.","A cabinet and a bench.","A carpet and a cup."],a:0,sen:"W: What did you order for the study? &nbsp;M: A tall bookcase and a small case for pens. &nbsp;W: Useful. &nbsp;Q: What did the man order?",szh:"女：書房你訂了什麼？　男：一個高書櫃(bookcase)和一個放筆的小盒(case)。　女：實用。　問：男士訂了什麼？",en:"A bookcase and a case.",zh:"男士訂了書櫃(bookcase)和小盒(case)，選 A。"},
{n:19,p:2,o:["A bed and a carpet.","A desk and a chair.","A bookcase and a cabinet."],a:1,sen:"M: Tom always does his homework on the floor. &nbsp;W: That's why his back hurts. &nbsp;M: Let's get something better for him. &nbsp;Q: What should they buy for Tom?",szh:"男：Tom 總是坐在地板上寫功課。　女：難怪他的背(back)會痛。　男：我們幫他買些更好的東西吧。　問：他們該為 Tom 買什麼？",en:"A desk and a chair.",zh:"Tom 在地上寫功課、背痛，需要書桌(desk)和椅子(chair)，選 B。床、地毯與書櫃都與寫功課的姿勢無關。"},
{n:20,p:2,o:["She won a prize.","She has a new bag.","Her teacher said she did well."],a:2,sen:"W: Why is Amy so happy today? &nbsp;M: Her teacher praised her in front of the class. &nbsp;W: She worked very hard. &nbsp;Q: Why is Amy happy?",szh:"女：Amy 今天為什麼這麼開心？　男：老師在全班面前稱讚(praise)了她。　女：她很努力。　問：Amy 為什麼開心？",en:"Her teacher said she did well.",zh:"老師當著全班稱讚(praise)她，表示老師說她做得好，選 C。對話沒有提到得獎，所以 A 錯。"},
{n:21,p:2,o:["In the closet.","In the dresser.","In the bookcase."],a:1,sen:"M: Where are my clean shirts? &nbsp;W: Look in the drawers next to your bed. &nbsp;M: These tall ones? &nbsp;W: Yes. &nbsp;Q: Where are the shirts?",szh:"男：我乾淨的襯衫在哪？　女：看看你床邊的抽屜。　男：這些高高的嗎？　女：對。　問：襯衫在哪裡？",en:"In the dresser.",zh:"床邊有抽屜的家具是梳妝櫃(dresser)，選 B。衣櫥(closet)和書櫃(bookcase)都不是床邊的抽屜櫃。"},
{n:22,p:2,o:["Close the door.","Wash her hands.","Walk carefully there."],a:2,sen:"W: What should I know about the bathroom? &nbsp;M: Be careful; the toilet floor is very wet. &nbsp;W: I'll watch my step. &nbsp;Q: What should the woman know?",szh:"女：浴室有什麼要注意的？　男：小心(careful)，馬桶(toilet)旁地板很濕。　女：我會小心走。　問：女士該注意什麼？",en:"Be careful; the toilet floor is wet.",zh:"小心(careful)馬桶(toilet)旁地板濕滑，選 C。"},
{n:23,p:2,o:["They are very old.","They look alike.","They are too big."],a:1,sen:"M: How are the twin chairs? &nbsp;W: They look exactly alike, placed in the same position. &nbsp;M: I can't tell them apart. &nbsp;Q: How are the two chairs?",szh:"男：那對雙胞胎椅子如何？　女：它們看起來一模一樣(alike)，擺在相同的位置(position)。　男：我分不出來。　問：兩張椅子如何？",en:"They look alike.",zh:"兩張椅子看起來一樣(alike)、位置(position)相同，選 B。"},
{n:24,p:2,o:["Wait until tomorrow.","Buy two sofas.","Go home now."],a:0,sen:"M: Should we buy the sofa today? &nbsp;W: The shop is having a big sale tomorrow. &nbsp;M: Oh, really? &nbsp;W: Yes, and the sofa will be cheaper. &nbsp;Q: What does the woman suggest?",szh:"男：我們今天要買沙發嗎？　女：店裡明天有大特賣。　男：哦，真的嗎？　女：對，而且沙發會更便宜。　問：女士建議什麼？",en:"Wait until tomorrow.",zh:"明天特賣更便宜，所以她建議等(wait)到明天，選 A。買兩張沙發與對話無關。"},
{n:25,p:2,o:["Save some money.","Spend it quickly.","Lend it to friends."],a:0,sen:"M: What did your father say about money? &nbsp;W: He told me to put some in the bank every month. &nbsp;M: Sensible! &nbsp;Q: What is the father's advice?",szh:"男：你爸爸對錢說了什麼？　女：他叫我每個月存一些在銀行。　男：很明智！　問：爸爸的建議是什麼？",en:"Save some money.",zh:"每月存錢進銀行就是存(save)錢，選 A。花光與借朋友都與建議相反或無關。"},

{n:26,p:3,pic:true,o:[BARS("Furniture Sold",["Bed","Couch","Desk"],[20,50,80]),BARS("Furniture Sold",["Bed","Couch","Desk"],[50,80,20]),BARS("Furniture Sold",["Bed","Couch","Desk"],[80,50,20])],a:2,sen:"Our furniture shop counted its sales this month. Beds sold the most, no doubt, because many families moved house. Couches were in the middle, and desks sold the fewest. So the bed bar should be the tallest. &nbsp;Q: Which chart shows the furniture sold?",szh:"我們家具店統計本月銷量。毫無疑問(doubt)床(bed)賣最多，因為很多家庭搬家；沙發(couch)中等；書桌(desk)最少。所以床的長條最高。　問：哪張圖顯示家具銷量？",en:"Beds most, desks least.",zh:"床最多、書桌最少，符合『Bed 最高』的圖，選 C。沙發在中間，容易誤選。"},
{n:27,p:3,pic:true,o:[BARS("Room Items",["Chair","Case","Lamp"],[80,55,30]),BARS("Room Items",["Chair","Case","Lamp"],[55,80,30]),BARS("Room Items",["Chair","Case","Lamp"],[30,55,80])],a:0,sen:"For the new office, we counted which item we needed most. Chairs were needed the most, one for every worker. Cases were in the middle, and lamps were needed the least. So the chair bar is the highest and the lamp the lowest. &nbsp;Q: Which chart shows the items needed?",szh:"新辦公室我們統計最需要的物品(item)。椅子(chair)最需要，每位員工一張；盒子(case)中等；檯燈最少。所以椅子最高、檯燈最低。　問：哪張圖顯示所需物品？",en:"Chairs most, lamps least.",zh:"椅子(chair)最多、檯燈最少，符合『Chair 最高、Lamp 最低』的圖，選 A。盒子(case)在中間，容易誤選。"},
{n:28,p:3,pic:true,o:[IMG('bread'),IMG('rice'),IMG('noodles')],a:0,
 sen:"When we moved into our new house, the kitchen was still empty. We had no freezer to save cold dishes, and no stove for noodles or rice. So on the first night we simply made a strawberry sandwich with bread, and ate it happily on the floor. &nbsp;Q: What did the family eat on the first night?",
 szh:"我們搬進新家時，廚房還空空的。沒有冷凍庫(freezer)保存(save)冷菜(dish)，也沒爐子煮麵或飯。所以第一晚我們只用麵包(bread)做了草莓(strawberry)三明治(sandwich)，開心地坐在地上吃。　問：一家人第一晚吃什麼？",
 en:"A sandwich with bread.",zh:"一家人吃麵包(bread)三明治，選 A。麵、飯為干擾。"},
{n:29,p:3,pic:true,o:[IMG('rice'),IMG('bread'),IMG('noodles')],a:2,sen:"My grandmother from Hualian visited our new home. She sat in the soft armchair and looked at our bookcase. She gave us a sincere smile. For dinner, she did not want a bread sandwich or plain rice. Instead, she cooked us a warm bowl of noodles, just like the ones near the temple back home. &nbsp;Q: What did grandmother cook for dinner?",szh:"我從花蓮(Hualian)來的奶奶造訪新家。她坐在軟扶手椅(armchair)上，看著我們的書櫃(bookcase)。她給了我們一個真誠(sincere)的微笑。晚餐她不想吃麵包三明治或白飯，而是煮了一碗熱麵(noodles)，就像家鄉廟(temple)旁的那種。　問：奶奶晚餐煮了什麼？",en:"A bowl of noodles.",zh:"奶奶煮了熱麵(noodles)，選 C。麵包、飯為干擾。"},

const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 13 回　家具與電器　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach(q=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+optHTML(q);
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function show(m){
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s'));
  setTimeout(()=>window.print(),60);
}
</script></body></html>
