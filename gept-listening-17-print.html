<div class="bar">
 <b>🖨 第 17 回　交通工具　聽力測驗　列印版</b>

<div id="root"></div>
<script>
/* 圖形素材（第17回 交通工具） ====== */
const IMG = n => `<img class="pic-img" src="gept-listening-img/17/${n}.jpg" alt="${n}">`;
const PH = n => `<img class="pic-img p3img" src="gept-listening-img/17/p3_${n}.jpg?v=r17hard-20261009" alt="picture ${n}">`;
const BARS=(title,labs,vals)=>{const max=Math.max(...vals),bw=28,gap=18,x0=20;let b='',l='';
 labs.forEach((L,i)=>{const h=Math.round(vals[i]/max*70),x=x0+i*(bw+gap);
  b+=`<rect x="${x}" y="${100-h}" width="${bw}" height="${h}" fill="#e9e9e9" stroke="#1a1a1a" stroke-width="1.5"/>`;
  l+=`<text x="${x+bw/2}" y="116">${L}</text>`;});
 return `<svg class="chart" width="176" height="132" viewBox="0 0 176 132"><text x="88" y="15" text-anchor="middle" font-size="14" font-weight="700">${title}</text><line x1="16" y1="22" x2="16" y2="100" stroke="#1a1a1a" stroke-width="1.5"/><line x1="16" y1="100" x2="170" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>${b}<g font-size="11" text-anchor="middle">${l}</g></svg>`;};
const BICYCLE=`<img class="pic-img p0img" src="gept-listening-img/17/p0_q1.jpg" alt="question 1 picture">`;
const BUS=`<img class="pic-img p0img" src="gept-listening-img/17/p0_q2.jpg" alt="question 2 picture">`;
const CAR=`<img class="pic-img p0img" src="gept-listening-img/17/p0_q3.jpg" alt="question 3 picture">`;
const BRIDGE=`<img class="pic-img p0img" src="gept-listening-img/17/p0_q4.jpg" alt="question 4 picture">`;
const TRAFFICLIGHT=`<img class="pic-img p0img" src="gept-listening-img/17/p0_q5.jpg" alt="question 5 picture">`;

const PARTS=[
 {t:"第一大題　看圖辨義",d:"共 5 題（1–5）。看圖並聆聽問題，從 A、B、C 三個選項中選出最適合的答案。"},
 {t:"第二大題　問答",d:"共 10 題（6–15）。聆聽一個問句或直述句，選出最適合的回答。"},
 {t:"第三大題　簡短對話",d:"共 10 題（16–25）。聆聽一段對話與問題，選出最適合的答案。"},
 {t:"第四大題　短文聽解",d:"共 5 題（26–30）。聆聽一段短文與問題，從三張圖片中選出最適合的一張。"}
];
const Q=[
{n:1,p:0,fig:BICYCLE,o:["He is riding a red bicycle across a bridge.","He is pushing a red bicycle along the road.","He is riding a red bicycle on the road."],a:2,sen:"For question one, look at the picture. What is the boy doing?",szh:"第一題，請看圖片。這個男孩在做什麼？",en:"He is riding a red bicycle on the road.",zh:"男孩騎著一輛紅色腳踏車(bicycle)在林間的路(road)上，正確。他是坐在車上騎，不是用手推著走；他騎的是一般道路，旁邊是樹和草，不是橋(bridge)。選 C"},
{n:2,p:0,fig:BUS,o:["Passengers are getting off the bus.","Passengers are waiting in line to get on a train.","Passengers are waiting in line to get on the bus."],a:2,sen:"For question two, look at the picture. Which is true about the picture?",szh:"第二題，請看圖片。關於這張圖，何者正確？",en:"Passengers are waiting in line to get on the bus.",zh:"乘客(passenger)在站牌邊排隊，最前面的人正踏上公車(bus)，正確。大家是在上車，不是下車；他們上的是公車，不是火車。選 C"},
{n:3,p:0,fig:CAR,o:["He is fixing the flat tire on his car.","He is standing next to his car, and one tire is flat.","He is sitting in his car, and one tire is flat."],a:1,sen:"For question three, look at the picture. What is the driver doing?",szh:"第三題，請看圖片。這位駕駛(driver)在做什麼？",en:"He is standing next to his car, and one tire is flat.",zh:"車子後輪爆胎(flat tire)了，駕駛(driver)雙手交叉站在車(car)旁的路邊，正確。他只是站著看路，沒有在修輪胎；他人在車外，不是坐在車裡。選 B"},
{n:4,p:0,fig:BRIDGE,o:["A train is going across a long railroad bridge.","Cars are driving through a tunnel under the river.","Cars are driving across a long bridge over the river."],a:2,sen:"For question four, look at the picture. What can you see in the picture?",szh:"第四題，請看圖片。你在圖中看到什麼？",en:"Cars are driving across a long bridge over the river.",zh:"幾輛汽車(car)正開過一座橫跨河面的長橋(bridge)，正確。橋上只有汽車，沒有火車，也不是鐵路(railroad)橋；車子是在河的上方，不是在河底的隧道(tunnel)裡。選 C"},
{n:5,p:0,fig:TRAFFICLIGHT,o:["The traffic light is red, and the road is full of cars.","The traffic light is red, and there are only a few cars on the road.","The traffic light is green, and the cars are moving fast."],a:0,sen:"For question five, look at the picture. Which is true about the picture?",szh:"第五題，請看圖片。關於這張圖，何者正確？",en:"The traffic light is red, and the road is full of cars.",zh:"紅綠燈(traffic light)亮紅燈，整條路(road)塞滿了車，正確。燈是紅的不是綠的，車子也在塞車，沒有開很快；路上車子一直排到遠方，不是只有(only)幾輛。選 A"},
{n:6,p:1,o:["The highway. It's faster at night.","I'll take a big bag with me.","Around seven, after dinner."],a:0,sen:"Which way will you take to the airport tonight?",szh:"你今晚要走哪條路去機場？",en:"The highway. It's faster at night.",zh:"問今晚(tonight)走哪條路(way)去機場，答「走高速公路(highway)，晚上比較快」才是路線。「大概七點，晚餐後(after)」答的是時間；「我會帶一個大包包」只是重複 take（帶），答非所問。選 A"},
{n:7,p:1,o:["Yes, I can hear you very well.","Please shake hands with the driver.","Let's take the train next time, then."],a:2,sen:"This old bus is so noisy, and it shakes a lot.",szh:"這台老公車好吵，又晃得好厲害。",en:"Let's take the train next time, then.",zh:"對方抱怨公車很吵(noisy)、晃(shake)得厲害，建議「那下次我們搭(take)火車吧」最自然。都說很吵了，回「我聽(hear)得很清楚」不合理；「請(please)和司機握手」只是重複 shake，意思完全不同。選 C"},
{n:8,p:1,o:["The road is very wide.","He crossed it after noon.","Let him hold your arm and walk slowly."],a:2,sen:"How can I help the blind man cross the road?",szh:"我要怎麼幫那位盲人過馬路？",en:"Let him hold your arm and walk slowly.",zh:"問「怎麼」幫盲人(blind)過馬路(road)，答「讓他扶著你的手臂，慢慢走」才是方法。「他中午(noon)過後過了馬路」答的是時間，而且是過去式；「這條路很寬」只是描述馬路，沒說怎麼幫。選 C"},
{n:9,p:1,o:["It takes about twenty minutes.","At eleven, but only on weekdays.","From the stop across the street."],a:1,sen:"When does the last bus leave?",szh:"最後一班公車什麼時候開？",en:"At eleven, but only on weekdays.",zh:"問「什麼時候」末班公車(bus)開，答「十一點，但只有(only)平日」才是時間。「從對街的站牌(stop)」答的是地點；「大約二十分鐘」答的是車程多久。選 B"},
{n:10,p:1,o:["Yes, the north is very cold.","Let's stop and ask someone.","The restroom is on the left."],a:1,sen:"I think we're lost. This isn't the way to the northern part of town.",szh:"我想我們迷路了，這不是去北區的路。",en:"Let's stop and ask someone.",zh:"對方說迷路了，這不是去北(northern)區的路(way)，建議「我們停(stop)下來問人吧」最自然。「是啊，北方很冷」只抓到 north 這個字；「洗手間(restroom)在左邊」與迷路無關。選 B"},
{n:11,p:1,o:["They drew dots with crayons.","After lunch, I think.","It's next to the kitchen."],a:0,sen:"What did the children do in the living room?",szh:"孩子們在客廳做了什麼？",en:"They drew dots with crayons.",zh:"問孩子們在客廳(living room)做了什麼，答「他們用蠟筆(crayon)畫圓點(dot)」才是活動。「在廚房旁邊」答的是客廳的位置；「午餐後吧」答的是時間。選 A"},
{n:12,p:1,o:["At the hospital near the overpass.","Because I've had a fever for a week.","He took some of my blood last Tuesday."],a:1,sen:"Why did the doctor examine you so carefully?",szh:"醫生為什麼這麼仔細地幫你檢查(examine)？",en:"Because I've had a fever for a week.",zh:"問醫生為什麼這麼仔細地檢查(examine)你，答「因為我發燒(fever)一個星期了」才是原因。「他上星期二抽了我的血(blood)」答的是做了什麼、什麼時候；「在天橋(overpass)附近的醫院」答的是地點。選 B"},
{n:13,p:1,o:["I ate too much, too.","You should see a dentist.","Let's eat at that new restaurant."],a:1,sen:"I can't eat anything. I have a terrible toothache.",szh:"我什麼都不能吃，牙痛得要命。",en:"You should see a dentist.",zh:"對方牙痛(toothache)到吃不下，建議「你應該去看牙醫」最自然。對方說不能吃，還約他去新餐廳吃飯不合理；「我也吃太多了」只是重複 eat，和牙痛無關。選 B"},
{n:14,p:1,o:["No, that's false. The trains are running.","Yes, the store closed at noon.","To tell the truth, I like bridges."],a:0,sen:"Is it true that the railroad bridge is closed?",szh:"鐵路橋關閉了是真的嗎？",en:"No, that's false. The trains are running.",zh:"問鐵路(railroad)橋關閉是不是真的，答「不，那是假的(false)，火車都有在開」最自然。「是的，店中午關了」只重複 closed，講的是商店；「說實話(truth)，我喜歡橋」答非所問。選 A"},
{n:15,p:1,o:["To catch the seven o'clock train.","About ten minutes by car.","My mom. She'll take us herself."],a:2,sen:"Who's driving us to the train station?",szh:"誰要開車載我們去火車站？",en:"My mom. She'll take us herself.",zh:"問「誰」開車載我們，答「我媽，她會親自(herself)載我們去」才是人物。「開車大約十分鐘」答的是多久；「為了趕七點的火車」答的是目的。選 C"},
{n:16,p:2,o:["In the parking lot.","At the railroad station.","At the bus stop."],a:1,sen:"M: Let's meet at the bus stop at nine and take the bus downtown. &nbsp;W: The buses are always late in the morning. Let's meet at the railroad station and take the train. &nbsp;M: OK. But the station has no parking lot, so my dad will drop me off. &nbsp;Q: Where will they meet?",szh:"男：我們九點在公車站(bus stop)見面，搭公車去市中心吧。　女：早上公車總是誤點，我們約在火車站(railroad station)搭火車吧。　男：好。不過車站沒有停車場(parking lot)，所以我爸會載我過去放我下車。　問：他們會在哪裡碰面？",en:"At the railroad station.",zh:"男士原本提議在公車站碰面，但女士說公車常誤點，改約在火車站(railroad station)，男士同意。公車站是被否定的地點；停車場(parking lot)是車站沒有的東西，不是碰面地點。選 B"},
{n:17,p:2,o:["Thirty minutes.","An hour and a half.","One hour."],a:1,sen:"W: How long does it take to drive to the beach? &nbsp;M: Usually one hour. But they're working on the tunnel this month. &nbsp;W: So which way can we go? &nbsp;M: We have to use the old mountain road. It takes thirty minutes more. &nbsp;Q: How long will the drive take this month?",szh:"女：開車到海邊要多久？　男：通常一小時，但這個月隧道(tunnel)在施工(work)。　女：那我們能走哪條路(way)？　男：只能走(use)舊的山路(road)，要多花三十分鐘。　問：這個月開車要多久？",en:"An hour and a half.",zh:"平常一小時，但隧道(tunnel)施工要改走山路，多三十分鐘，所以要一個半小時。一小時是平常走隧道的時間；三十分鐘只是多出來的時間。選 B"},
{n:18,p:2,o:["See a doctor.","Take a taxi to work.","Drive to work."],a:0,sen:"W: You look pale, Tom. Are you OK? &nbsp;M: I've had a fever since last night, and I didn't sleep well. &nbsp;W: Then don't drive to work today. Take a taxi to the doctor. &nbsp;Q: What does the woman tell Tom to do?",szh:"女：Tom，你臉色好蒼白(pale)，還好嗎？　男：我昨晚開始發燒(fever)，沒睡好。　女：那今天別開車去上班(work)了，搭計程車去看醫生。　問：女士要 Tom 做什麼？",en:"See a doctor.",zh:"女士叫 Tom 不要開車上班(work)，搭計程車去看醫生，重點是「去看醫生」。開車上班是她叫他不要做的事；搭計程車是要去看醫生，不是去上班。選 A"},
{n:19,p:2,o:["The bicycle shop.","Her brother.","The woman fixed it herself."],a:2,sen:"M: Did you take your bicycle to the shop? It had a flat tire. &nbsp;W: No. My brother said he would fix it, but he was too busy. &nbsp;M: So it's still flat? &nbsp;W: No. I watched a video and did it myself. &nbsp;Q: Who fixed the flat tire?",szh:"男：你把腳踏車(bicycle)送去店裡了嗎？它爆胎(flat tire)了。　女：沒有。我哥說他要修，但他太忙了。　男：所以還是爆胎？　女：沒有，我看了影片自己修好了。　問：誰修好了爆胎？",en:"The woman fixed it herself.",zh:"女士說沒送去店裡，哥哥太忙也沒修，是她看影片自己(herself)修好的。腳踏車店是男士以為的；哥哥只是說要修，最後沒修。選 C"},
{n:20,p:2,o:["With his friends in Russia.","In Russia.","In Canada."],a:2,sen:"W: Is your uncle still working in Russia? &nbsp;M: Not anymore. He moved to Canada last year. &nbsp;W: Does he miss Russia? &nbsp;M: Yes, so he still goes back there every winter to visit friends. &nbsp;Q: Where does the uncle live now?",szh:"女：你叔叔還在俄羅斯(Russia)工作嗎？　男：不了，他去年搬到加拿大。　女：他會想念俄羅斯嗎？　男：會啊，所以他每年冬天還是會回去看朋友。　問：叔叔現在住在哪裡？",en:"In Canada.",zh:"叔叔去年從俄羅斯(Russia)搬到加拿大，所以現在住加拿大。俄羅斯是以前工作的地方，他只是冬天回去拜訪朋友，不是住在那裡。選 C"},
{n:21,p:2,o:["Join the activity.","Stay away because it's childish.","Take his grandmother to the library."],a:0,sen:"W: Do you want to join the crayon drawing activity at the library? &nbsp;M: Isn't that a little childish? I'm fifteen. &nbsp;W: It's for all ages. Even my grandmother is going. &nbsp;M: Really? Well, OK. I'll try it. &nbsp;Q: What will the man do?",szh:"女：你要參加圖書館的蠟筆(crayon)畫畫活動(activity)嗎？　男：那不會有點幼稚(childish)嗎？我十五歲了。　女：那是給各年齡的，連我奶奶都要去。　男：真的？嗯，好吧，我試試看。　問：男士會做什麼？",en:"Join the activity.",zh:"男士一開始覺得活動很幼稚(childish)，但聽說各年齡都能參加後，最後說「好，我試試看」，也就是會參加活動(activity)。覺得幼稚而不去是他一開始的想法，後來改變了；要去的是女士的奶奶，男士沒說要帶她去。選 A"},
{n:22,p:2,o:["Walk across at the traffic light.","Go through the underpass.","Use the overpass."],a:1,sen:"M: Excuse me, how do I get to the post office? &nbsp;W: It's across this road. Go through the underpass, and it's on your right. &nbsp;M: Can I use the overpass? &nbsp;W: Not today. It's closed. &nbsp;Q: How should the man cross the road?",szh:"男：不好意思，郵局怎麼走？　女：在馬路對面。走地下道(underpass)過去，就在你右手邊。　男：我可以走天橋(overpass)嗎？　女：今天不行，天橋封了。　問：男士應該怎麼過馬路？",en:"Go through the underpass.",zh:"女士指示走地下道(underpass)，並說天橋(overpass)今天封閉，所以要走地下道。天橋是男士問的，但被否定；對話沒提到紅綠燈。選 B"},
{n:23,p:2,o:["It is fun to read.","It is all true.","It is about intelligent animals on Earth."],a:0,sen:"W: What's that book you're reading on the bus? &nbsp;M: It's about life on other planets. The writer thinks there may be intelligent animals out there. &nbsp;W: Do you believe that? &nbsp;M: Not really. But it's a fun story. &nbsp;Q: What does the man think about the book?",szh:"女：你在公車上看的是什麼書？　男：講其他星球(planet)上的生命。作者認為外面可能有聰明(intelligent)的動物。　女：你相信嗎？　男：不太相信，但故事很有趣。　問：男士覺得這本書怎樣？",en:"It is fun to read.",zh:"男士說不太相信，但故事很有趣，也就是「讀起來很有趣」。他不相信書的內容，所以不是「全部都是真的」；書講的是其他星球(planet)，不是地球上的動物。選 A"},
{n:24,p:2,o:["Only cars can use the roads downtown.","A new bicycle road will open.","Cars can't go downtown for a day."],a:2,sen:"M: Did the city accept your plan for a new bicycle road? &nbsp;W: No, they rejected it. But next month they'll have a car-free day as a trial. &nbsp;M: What happens on that day? &nbsp;W: No cars downtown. Only buses and bicycles. &nbsp;Q: What will happen next month?",szh:"男：市政府接受你建新自行車道(road)的計畫了嗎？　女：沒有，他們拒絕(reject)了。不過下個月會試辦(trial)一個無車日(day)。　男：那天會怎樣？　女：市中心不能開車，只有(only)公車和腳踏車。　問：下個月會發生什麼事？",en:"Cars can't go downtown for a day.",zh:"新自行車道的計畫被拒絕(reject)了；下個月試辦(trial)無車日，那天市中心不能開車，換句話說就是「汽車有一天不能進市中心」。只有(only)公車和腳踏車能走，不是只有汽車能走。選 C"},
{n:25,p:2,o:["It is cheap to drive.","It is cheap to buy.","It is very noisy."],a:0,sen:"W: Why is this electric car so popular? &nbsp;M: It uses power, not gas, so it's cheap to drive. And it's very quiet. &nbsp;W: But it costs a lot to buy, right? &nbsp;M: Yes, that's true. &nbsp;Q: Why do people like the car?",szh:"女：這款電動車為什麼這麼受歡迎(popular)？　男：它用(use)電(power)不用汽油，所以開起來很便宜，而且很安靜。　女：可是買起來很貴，對吧？　男：對，沒錯。　問：大家為什麼喜歡這輛車？",en:"It is cheap to drive.",zh:"男士說它用電(power)、不用油，所以「開起來便宜」，又很安靜。買起來很貴，所以不是「便宜買」；它很安靜，不是很吵(noisy)。選 A"},
{n:26,p:3,pic:true,o:[BARS("Tunnel Traffic",["Cars","Trucks","Buses"],[80,20,50]),BARS("Tunnel Traffic",["Cars","Trucks","Buses"],[80,50,20]),BARS("Tunnel Traffic",["Cars","Trucks","Buses"],[50,20,80])],a:0,sen:"The new tunnel under the mountain opened last month, and the city counted what went through it. Cars were the most popular, of course. Many people thought trucks would come second. But big trucks can only use the tunnel at night, so there were fewer trucks than buses. &nbsp;Q: Which chart shows what used the tunnel?",szh:"山下的新隧道(tunnel)上個月通車，市政府統計了通過的車輛。汽車(car)當然最多(popular)。很多人以為卡車會是第二多，但大卡車只有(only)晚上能走(use)隧道，所以卡車比公車少。　問：哪張圖是使用隧道的車輛？",en:"Cars most, buses second, trucks fewest.",zh:"汽車最多，卡車比公車少，所以汽車最高、公車第二、卡車最低。卡車第二高的那張是「很多人以為」的情形；公車最高的那張與「汽車最多」相反。選 A"},
{n:27,p:3,pic:true,o:[BARS("Ways to Work",["Drive","Bicycle","Train"],[80,20,50]),BARS("Ways to Work",["Drive","Bicycle","Train"],[50,20,80]),BARS("Ways to Work",["Drive","Bicycle","Train"],[20,50,80])],a:2,sen:"My Aunt Mary is a book lover, and she works in a big office. Last week, she asked the people there how they get to work. She thought most of them would drive. But the parking lot is very small, so only a few people drive. More people ride a bicycle than drive. The train was the most popular way, since people can read or rest on it. &nbsp;Q: Which chart shows how the people get to work?",szh:"我的 Mary 阿姨是個愛書人(lover)，在一間大辦公室上班(work)。上星期她問同事們怎麼去上班。她以為大部分人會開車。但停車場(parking lot)很小，所以只有(only)少數人開車。騎腳踏車(bicycle)的人比開車的多。搭火車是最受歡迎(popular)的方式(way)，因為在車上可以看書或休息。　問：哪張圖是大家上班的方式？",en:"Train most, bicycle second, driving fewest.",zh:"火車最受歡迎(popular)，騎腳踏車(bicycle)比開車多，開車的只有(only)少數，所以火車最高、腳踏車第二、開車最低。開車最高的那張是阿姨原本以為的結果；開車第二的那張與「騎腳踏車的人比開車的多」矛盾。選 C"},
{n:28,p:3,pic:true,o:[PH('q28b'),PH('q28c'),PH('q28a')],a:1,sen:"Our city has a new bus for visitors. It has two floors, and its top floor has no roof, so passengers can enjoy the sun and see the whole city. Many people thought it would be red, like the buses in London. But it's blue, the color of the sea. &nbsp;Q: Which is the city's new bus?",szh:"我們城市有一台給遊客的新公車(bus)。它有兩層，它的(its)上層沒有車頂，讓乘客(passenger)可以曬太陽、看整座城市。很多人以為它會是紅色的，像倫敦的公車一樣，但它是藍色的，海的顏色。　問：哪一台是城市的新公車？",en:"A blue two-floor bus with no roof on top.",zh:"新公車是藍色、兩層、上層沒有車頂。紅色雙層無頂公車是「很多人以為」的顏色；藍色雙層但有車頂的不對，因為說了上層沒有車頂。選 B"},
{n:29,p:3,pic:true,o:[PH('q29a'),PH('q29c'),PH('q29b')],a:0,sen:"My mom drives across the river to work every day. Usually she takes the bridge. But this week, the bridge is closed for repairs, so she drives through the tunnel under the river. The traffic in the tunnel is terrible. Her friend told her to take the boat, but Mom doesn't like boats. &nbsp;Q: How does Mom cross the river this week?",szh:"我媽每天開車過河去上班(work)。她通常走橋(bridge)。但這週橋在維修封閉，所以她開車走河底的隧道(tunnel)。隧道裡的交通(traffic)糟透了。她朋友叫她搭船，但我媽不喜歡搭船。　問：媽媽這週怎麼過河？",en:"She drives through the tunnel.",zh:"走橋(bridge)是「平常」的路線，但這週橋封閉；搭船是朋友的建議，但媽媽不喜歡船；這週她是開車走隧道(tunnel)。選 A"},
{n:30,p:3,pic:true,o:[PH('q30b'),PH('q30c'),PH('q30a')],a:1,sen:"Long ago, only hunters walked on this mountain road. Today, it's a popular road with flowers on both sides. On weekdays, cars and bicycles share the road. But since last year, cars can't use it on Saturdays and Sundays. On those days, it's only for bicycles. &nbsp;Q: Which picture shows the road on a Sunday?",szh:"很久以前，只有(only)獵人(hunter)走這條山路(road)。現在它是一條兩旁都是花(flower)的熱門(popular)道路。平日汽車和腳踏車(bicycle)一起用這條路。但從去年起，星期六、日汽車不能使用(use)，那兩天(day)只給腳踏車騎。　問：哪張圖是星期天的這條路？",en:"Only bicycles on the road.",zh:"週末汽車不能使用(use)這條路，只有腳踏車(bicycle)，所以星期天只會看到腳踏車。汽車和腳踏車一起走是平日的情形；只有汽車的那張也不對，星期天汽車不能上路。選 B"}
];
const AB=["A","B","C"];
function optHTML(q){
  if(q.pic){ // 三圖選項
    return '<div class="pics">'+q.o.map((s,i)=>`<div class="pico"><div class="lb">(${AB[i]})</div>${s}</div>`).join('')+'</div>';
  }
  return '<ol class="opts">'+q.o.map((s,i)=>`<li>(${AB[i]}) ${s}</li>`).join('')+'</ol>';
}
function figHTML(q){ return q.fig?`<div class="fig">${q.fig}</div>`:''; }
function partOf(n){return n<=5?0:n<=15?1:n<=25?2:3;}
function sheet(kind){ // 's' student | 't' teacher
  let h=`<div class="page ${kind==='s'?'sheet-s':'sheet-t'}">`;
  h+=`<div class="phead"><h1>全民英檢 初級　聽力測驗</h1><div class="sub">第 17 回　交通工具　${kind==='s'?'學生作答卷':'教師卷（答案・聽力原文・解析）'}</div></div>`;
  if(kind==='s') h+=`<div class="pmeta"><span>姓名：____________</span><span>班級：__________</span><span>座號：______</span><span>分數：________</span></div>`;
  h+=`<div class="pnote">說明：本測驗共 4 大題 30 題，每題聆聽音檔作答，從 (A) (B) (C) 中選出最適合的答案，填入題號前括號內。</div>`;
  PARTS.forEach((pt,pi)=>{
    h+=`<div class="ptkeep"><h2 class="pt">${pt.t}</h2><p class="pd">${pt.d}</p>`;
    Q.filter(q=>partOf(q.n)===pi).forEach((q,qi)=>{
      h+=`<div class="q"><div class="qn">（${kind==='t'?'<span class="ans">'+AB[q.a]+'</span>':'　'}）${q.n}.</div><div class="qbody">`;
      h+=figHTML(q)+((kind==='s'&&q.p===0)?'<div class="lsn">(A)　(B)　(C)　<span>（選項只用聽，不印在題本上）</span></div>':optHTML(q));
      if(kind==='t'){
        h+=`<div class="tr"><b>原文：</b>${(q.sen||'').replace(/&nbsp;/g,' ')}</div>`;
        if(q.zh) h+=`<div class="ex"><b>解析：</b>${q.zh}</div>`;
      }
      h+=`</div></div>`;
      if(qi===0) h+=`</div>`;
    });
  });
  h+=`</div>`;
  return h;
}
function render(){document.getElementById('root').innerHTML=sheet('s')+sheet('t');}
render();
function mode(m){ m=(m==='t'||m==='a')?m:'s'; document.body.dataset.mode=m;
  document.querySelectorAll('.sheet-s').forEach(e=>e.classList.toggle('hidep',m==='t'));
  document.querySelectorAll('.sheet-t').forEach(e=>e.classList.toggle('hidep',m==='s')); }
function show(m){ mode(m); setTimeout(()=>window.print(),60); }
const fromHash=()=>mode(({teacher:'t',all:'a'})[location.hash.slice(1)]||'s');
fromHash(); window.addEventListener('hashchange',fromHash);
</script><style>@media print{#penBtn,#penBar,#penCv,#penHit,#penBoard{display:none!important}}</style>
<script>
/* ================= ✏️ 老師手寫 =================
   畫在網頁上的筆跡記在「整頁座標」，會跟著畫面捲動；白板的筆跡另外存、不捲動。
   書寫時：一指／觸控筆寫字、兩指捲動＋縮放（不鎖畫面）。✋ 捲動模式：筆跡照樣顯示，可以點題目。
   縮放：把頁面內容包進 #penZoom 再用 transform:scale；筆跡存「內容座標」，縮放後仍黏在原來的字上。
   用固定大小的畫布＋捲動時重畫（平板瀏覽器對超大畫布有尺寸限制）。 */
(function(){
  const css=`
  #penBtn{position:fixed;left:14px;bottom:14px;z-index:60;border:none;background:#fff;color:#2b4c7e;border-radius:99px;padding:8px 16px;box-shadow:0 4px 18px rgba(30,45,70,.18);font-weight:700;font-size:1rem;font-family:inherit;cursor:pointer}
  #penCv{position:fixed;inset:0;width:100vw;height:100vh;z-index:57;pointer-events:none;display:none}
  #penHit{position:fixed;inset:0;z-index:58;display:none;touch-action:none;cursor:crosshair}
  #penBoard{position:fixed;inset:0;z-index:56;background:#fff;display:none}
  body.pen-on #penCv{display:block}
  body.pen-on.pen-draw #penHit{display:block}
  body.pen-board #penBoard{display:block}
  #penBar{position:fixed;left:0;right:0;margin:0 auto;width:fit-content;bottom:12px;z-index:61;display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:rgba(255,255,255,.97);border-radius:16px;padding:8px 10px;box-shadow:0 6px 24px rgba(30,45,70,.22);max-width:calc(100vw - 24px)}
  body.pen-top #penBar{bottom:auto;top:12px}
  body.pen-on #penBar{display:flex}
  #penBar button{border:2px solid #e3e0d8;background:#fff;border-radius:10px;min-width:44px;height:44px;font-size:1rem;font-family:inherit;font-weight:700;cursor:pointer;color:#23303f;padding:0 10px}
  #penBar button.on{border-color:#2b4c7e;background:#e8effa}
  #penBar button.mode{background:#2b4c7e;color:#fff;border-color:#2b4c7e}
  #penBar .dot{width:44px;padding:0}
  #penBar .dot i{display:block;width:22px;height:22px;border-radius:50%;margin:auto}
  #penBar .sep{width:1px;height:30px;background:#e3e0d8;margin:0 2px}
  body.pen-on #penBtn{display:none}
  #penZoom{transform-origin:0 0}
  #penBar.nozoom [data-a=zout],#penBar.nozoom [data-a=zoom],#penBar.nozoom [data-a=zin]{display:none}
  html.pen-lock,html.pen-lock body{touch-action:manipulation;touch-action:pan-x pan-y}
  #penBar,#penBar *,#penBtn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  @media(max-width:640px){#penBar .t,#penBar .sep{display:none}#penBar{gap:4px;padding:6px}#penBar button{min-width:40px;height:40px;padding:0 6px}#penBar .dot{width:40px}}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
  const COLORS=['#d9342b','#1f5fbf','#1d1d1d','#1f9a55'];
  const SIZES=[[3,'細'],[6,'中'],[12,'粗']];
  let color=COLORS[0],size=6,erase=false,page=[],board=[],cur=null,boardOn=false;
  document.body.insertAdjacentHTML('beforeend',`<button id="penBtn" title="老師手寫">✏️ 手寫</button>
    <div id="penBoard"></div><canvas id="penCv"></canvas><div id="penHit"></div>
    <div id="penBar">
      <button class="mode" data-a="mode">✋<span class="t"> 捲動</span></button>
      <span class="sep"></span>
      ${COLORS.map((c,i)=>`<button class="dot${i?'':' on'}" data-c="${c}" title="顏色"><i style="background:${c}"></i></button>`).join('')}
      <span class="sep"></span>
      ${SIZES.map(([s,n])=>`<button data-s="${s}" class="${s===6?'on':''}">${n}</button>`).join('')}
      <span class="sep"></span>
      <button data-a="erase" title="橡皮擦">🧽<span class="t"> 橡皮擦</span></button><button data-a="undo" title="復原">↩️<span class="t"> 復原</span></button><button data-a="clear" title="清除">🗑️<span class="t"> 清除</span></button>
      <button data-a="zout" title="縮小">－</button><button data-a="zoom" title="回到 1 倍">🔍<span class="z">1.0×</span></button><button data-a="zin" title="放大">＋</button><button data-a="board" title="白板">⬜<span class="t"> 白板</span></button><button data-a="move" title="移位">⇅<span class="t"> 移位</span></button><button data-a="close" title="關閉">✖<span class="t"> 關閉</span></button>
    </div>`);
  const Z=document.createElement('div');Z.id='penZoom';
  /* 第一次打開手寫才把頁面內容包進 #penZoom（只有 header/nav/main/footer 就包這些，否則包所有一般排版的子元素）。
     body 是 flex/grid 或 CSS 有「body>」選擇器時不包：不能縮放，但筆跡照樣跟著捲動。 */
  const PEN_IDS=['penBtn','penBoard','penCv','penHit','penBar'];
  const NOFLOW=/^(SCRIPT|STYLE|LINK|META|TEMPLATE|NOSCRIPT)$/;
  function bodyChildCss(){const hit=rs=>[...rs].some(r=>(r.selectorText&&/(^|[\s,(])body\s*>/.test(r.selectorText))||(r.cssRules&&hit(r.cssRules)));
    for(const ss of document.styleSheets){let rs;try{rs=ss.cssRules}catch(_){continue}if(rs&&hit(rs))return true}return false}
  function wrap(){
    if(Z.isConnected)return;
    const kids=[...document.body.children].filter(e=>!PEN_IDS.includes(e.id)&&!NOFLOW.test(e.tagName)&&getComputedStyle(e).position!=='fixed');
    let flow=kids.filter(e=>/^(HEADER|NAV|MAIN|FOOTER)$/.test(e.tagName));
    if(flow.length<kids.length){if(/flex|grid/.test(getComputedStyle(document.body).display)||bodyChildCss())flow=[];else flow=kids}
    if(flow.length){flow[0].before(Z);flow.forEach(e=>Z.appendChild(e))}
    else bar.classList.add('nozoom');
  }
  let zoom=1;
  const B=document.body,cv=document.getElementById('penCv'),hit=document.getElementById('penHit'),bar=document.getElementById('penBar'),ctx=cv.getContext('2d');
  const list=()=>boardOn?board:page;
  /* 螢幕座標＝內容座標×z＋(x,y)。白板不捲動不縮放；網頁筆跡跟著捲動與縮放 */
  const off=()=>{if(boardOn)return{z:1,x:0,y:0};if(!Z.isConnected)return{z:1,x:-scrollX,y:-scrollY};const r=Z.getBoundingClientRect();return{z:zoom,x:r.left,y:r.top}};
  function fit(){const r=devicePixelRatio||1;cv.width=innerWidth*r;cv.height=innerHeight*r;ctx.setTransform(r,0,0,r,0,0);redraw()}
  function seg(s,a,b,o){
    ctx.globalCompositeOperation=s.erase?'destination-out':'source-over';
    ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';
    ctx.lineWidth=(s.erase?s.size*4:s.size*(0.55+(b.p||0.5)*0.9))*o.z;
    ctx.beginPath();ctx.moveTo(a.x*o.z+o.x,a.y*o.z+o.y);ctx.lineTo(b.x*o.z+o.x,b.y*o.z+o.y);ctx.stroke();
  }
  function draw(s,o){const P=s.pts;if(P.length===1)seg(s,P[0],{...P[0],x:P[0].x+.01},o);for(let i=1;i<P.length;i++)seg(s,P[i-1],P[i],o)}
  function redraw(){ctx.clearRect(0,0,innerWidth,innerHeight);const o=off();
    list().forEach(s=>{const ys=s.pts.map(p=>p.y*o.z+o.y);if(Math.max(...ys)<-50||Math.min(...ys)>innerHeight+50)return;draw(s,o)});
    ctx.globalCompositeOperation='source-over'}
  let raf=0;addEventListener('scroll',()=>{if(!B.classList.contains('pen-on')||boardOn||raf)return;raf=requestAnimationFrame(()=>{raf=0;redraw()})},{passive:true});
  addEventListener('resize',()=>{if(B.classList.contains('pen-on')){fit();pad()}});
  const pt=e=>{const o=off();return{x:(e.clientX-o.x)/o.z,y:(e.clientY-o.y)/o.z,p:e.pressure&&e.pointerType==='pen'?e.pressure:0.5}};
  /* 以螢幕上的 at 點為中心縮放，讓內容點 c 落在 at（c 省略＝at 底下的內容點） */
  const zBtn=()=>bar.querySelector('[data-a="zoom"] .z');
  function setZoom(nz,at,c){
    if(!Z.isConnected)return;nz=Math.min(3,Math.max(1,nz));const o=off();c=c||{x:(at.x-o.x)/o.z,y:(at.y-o.y)/o.z};
    zoom=nz;Z.style.transform=nz===1?'':`scale(${nz})`;
    const r=Z.getBoundingClientRect(),ox=r.left+scrollX,oy=r.top+scrollY;
    window.scrollTo(ox+c.x*nz-at.x,oy+c.y*nz-at.y);
    zBtn().textContent=nz.toFixed(1)+'×';bar.querySelector('[data-a="zoom"]').classList.toggle('on',nz>1.01);redraw();
  }
  /* 一指／觸控筆＝寫字；兩指＝捲動＋縮放（書寫中不鎖畫面） */
  const ptrs=new Map();let pan=null,hold=false;
  const mid=()=>{const v=[...ptrs.values()];return{x:(v[0].x+v[1].x)/2,y:(v[0].y+v[1].y)/2}};
  const dist=()=>{const v=[...ptrs.values()];return Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)||1};
  function startPan(){const m=mid(),o=off();pan={d0:dist(),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z},m}}
  hit.addEventListener('pointerdown',e=>{e.preventDefault();hit.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size>=2){if(cur){const L=list(),i=L.indexOf(cur);if(i>=0)L.splice(i,1);cur=null;redraw()}startPan();hold=true;return}
    if(hold)return;
    cur={color,size,erase,pts:[pt(e)]};list().push(cur);draw(cur,off());ctx.globalCompositeOperation='source-over'});
  hit.addEventListener('pointermove',e=>{
    if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pan&&ptrs.size>=2){e.preventDefault();const m=mid();
      if(boardOn)return;
      setZoom(pan.z0*dist()/pan.d0,m,pan.c);return}
    if(!cur)return;e.preventDefault();const o=off();
    (e.getCoalescedEvents?e.getCoalescedEvents():[e]).forEach(ev=>{const p=pt(ev),q=cur.pts[cur.pts.length-1];cur.pts.push(p);seg(cur,q,p,o)});ctx.globalCompositeOperation='source-over'});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pan=null;else startPan();if(ptrs.size===0)hold=false;cur=null};
  hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);
  /* 滑鼠滾輪／觸控板在書寫層上也能捲動 */
  /* 觸控板捏合／Ctrl＋滾輪＝縮放 */
  hit.addEventListener('wheel',e=>{e.preventDefault();
    if(e.ctrlKey&&!boardOn)setZoom(zoom*Math.exp(-e.deltaY*0.01),{x:e.clientX,y:e.clientY});else window.scrollBy(e.deltaX,e.deltaY)},{passive:false});
  const modeBtn=bar.querySelector('[data-a="mode"]');
  function setDraw(on){B.classList.toggle('pen-draw',on);modeBtn.innerHTML=on?'✋<span class="t"> 捲動</span>':'✏️<span class="t"> 書寫</span>';modeBtn.title=on?'切換成捲動畫面（筆跡保留）':'切換回寫字'}
  /* 依工具列實際高度在頁面上／下留白，最後一題不會被擋住 */
  function pad(){const on=B.classList.contains('pen-on'),top=B.classList.contains('pen-top'),h=on?bar.offsetHeight+24+'px':'';
    B.style.paddingBottom=on&&!top?h:'';B.style.paddingTop=on&&top?h:''}
  const VP=document.querySelector('meta[name=viewport]'),VP0=VP?VP.content:'';
  function lockVP(on){if(VP)VP.content=on?'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no':VP0}
  function resetNative(){if(!VP||!window.visualViewport||visualViewport.scale<=1.01)return;lockVP(true);setTimeout(()=>{VP.content='width=device-width, initial-scale=1, maximum-scale=1';setTimeout(()=>lockVP(B.classList.contains('pen-on')),300)},50)}
  let kb=0;
  function open(){wrap();lockVP(true);clearInterval(kb);kb=setInterval(keepBar,250);document.documentElement.classList.add('pen-lock');B.classList.add('pen-on');setDraw(true);fit();pad()}
  function close(){clearInterval(kb);lockVP(false);if(zoom!==1)setZoom(1,{x:innerWidth/2,y:innerHeight/2});document.documentElement.classList.remove('pen-lock');bar.style.transform='';B.classList.remove('pen-on','pen-draw','pen-board');B.style.paddingBottom=B.style.paddingTop='';boardOn=false;bar.querySelector('[data-a="board"]').classList.remove('on')}
  document.getElementById('penBtn').onclick=open;
  modeBtn.onclick=()=>setDraw(!B.classList.contains('pen-draw'));
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;setDraw(true);
    bar.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));bar.querySelector('[data-a="erase"]').classList.remove('on')});
  bar.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{size=+b.dataset.s;setDraw(true);bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b))});
  bar.querySelector('[data-a="erase"]').onclick=function(){erase=!erase;setDraw(true);this.classList.toggle('on',erase)};
  bar.querySelector('[data-a="undo"]').onclick=()=>{list().pop();redraw()};
  bar.querySelector('[data-a="clear"]').onclick=()=>{list().length=0;redraw()};
  bar.querySelector('[data-a="board"]').onclick=function(){boardOn=!boardOn;B.classList.toggle('pen-board',boardOn);this.classList.toggle('on',boardOn);if(boardOn)setDraw(true);redraw()};
  /* ✋ 捲動模式：兩指捏合一樣交給自己的縮放（瀏覽器原生縮放已關閉，工具列不會被推出畫面） */
  let tp=null;
  const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const tMid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  document.addEventListener('touchstart',e=>{if(!B.classList.contains('pen-on')||B.classList.contains('pen-draw')||boardOn||e.touches.length!==2)return;
    const m=tMid(e.touches),o=off();tp={d0:tDist(e.touches),z0:zoom,c:{x:(m.x-o.x)/o.z,y:(m.y-o.y)/o.z}}},{passive:true});
  document.addEventListener('touchmove',e=>{if(!tp||e.touches.length!==2)return;e.preventDefault();setZoom(tp.z0*tDist(e.touches)/tp.d0,tMid(e.touches),tp.c)},{passive:false});
  document.addEventListener('touchend',e=>{if(e.touches.length<2)tp=null},{passive:true});
  /* 保險：萬一瀏覽器還是放大了整頁，把工具列擺回看得到的地方並維持原本大小 */
  function keepBar(){const v=window.visualViewport;if(!v)return;
    if(v.scale<=1.01||!B.classList.contains('pen-on')){bar.style.transform='';bar.style.transformOrigin='';return}
    const top=B.classList.contains('pen-top');
    bar.style.transformOrigin=top?'center top':'center bottom';
    const dx=v.offsetLeft+v.width/2-innerWidth/2,dy=top?v.offsetTop:v.offsetTop+v.height-innerHeight;
    bar.style.transform=`translate(${dx}px,${dy}px) scale(${1/v.scale})`}
  if(window.visualViewport){visualViewport.addEventListener('resize',keepBar);visualViewport.addEventListener('scroll',keepBar)}
  const ctr=()=>({x:innerWidth/2,y:innerHeight/2});
  bar.querySelector('[data-a="zoom"]').onclick=()=>{setZoom(1,ctr());resetNative();keepBar()};
  bar.querySelector('[data-a="zin"]').onclick=()=>{if(!boardOn)setZoom(zoom*1.25,ctr())};
  bar.querySelector('[data-a="zout"]').onclick=()=>{if(!boardOn)setZoom(zoom/1.25,ctr())};
  bar.querySelector('[data-a="move"]').onclick=()=>{B.classList.toggle('pen-top');pad()};
  bar.querySelector('[data-a="close"]').onclick=close;
})();

</script>
</body></html>
